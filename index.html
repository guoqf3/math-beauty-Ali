<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学之美 · 交互动画画廊</title>
<meta name="description" content="一座暗夜美术馆：用可交互的动画展示数学之美——吸引子、曲线、极光与混沌。">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23d4a843' stroke-width='1.4'/%3E%3Cpath d='M3 12h18M12 3c-3 4-3 14 0 18' fill='none' stroke='%2346d4e0' stroke-width='1.2'/%3E%3C/svg%3E">
</head>
<body data-page="index">

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="glyph" id="brandGlyph"></span>
      <span>数学之美<small>Beauty of Mathematics</small></span>
    </a>
    <nav class="navlinks" id="nav"></nav>
  </div>
</header>

<main>
  <section class="hero">
    <canvas id="harmonic"></canvas>
    <div class="hero-inner">
      <span class="eyebrow">Parametric · Chaos · Curve</span>
      <h1>看见<span class="em">方程</span>的<br>形状</h1>
      <p class="lede">每一个页面都是一段会动的数学。吸引子在混沌里织出秩序，曲线在球面绽放成玫瑰——点开它们，亲手拨动方程。</p>
      <div class="meta" id="heroMeta"></div>
    </div>
    <div class="scroll-cue"><span>SCROLL</span><i></i></div>
  </section>

  <section class="modules wrap" id="modules"></section>
</main>

<footer class="site">
  <div class="wrap" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;width:100%">
    <span class="fbrand">数学之美</span>
    <span>本地生成 · 静态站点 · 可离线分享</span>
    <span class="eq" id="eq">e<sup>iπ</sup> + 1 = 0</span>
  </div>
</footer>

<script src="assets/app.js"></script>
<script>
/* —— 一级页：每个模块一个轮播，展示最近 3 个页面 —— */
const PER = 3;
document.getElementById('brandGlyph').innerHTML = ICON.brand;

const link = (m,it)=>`view.html?p=${encodeURIComponent(it.src)}&n=${encodeURIComponent(it.name)}&f=${encodeURIComponent(m.name)}`;
function slideHTML(m,it){
  return `<div class="slide"><a href="${link(m,it)}">
    ${thumbHTML(it)}
    <div class="cap"><span class="nm">${esc(it.name)}</span><span class="tick">VIEW</span></div>
  </a></div>`;
}
function moduleHTML(m,i){
  const items = m.items.slice(0, PER);              // 最近三个
  const slides = items.map(it=>slideHTML(m,it)).join('');
  const dots   = items.map((_,k)=>`<button class="dot${k?'':' on'}" data-i="${k}" aria-label="第${k+1}张"></button>`).join('');
  const arrows = items.length>1
    ? `<button class="carrow prev" aria-label="上一个">${ICON.left}</button>
       <button class="carrow next" aria-label="下一个">${ICON.right}</button>` : '';
  const chips  = items.map(it=>`<a href="${link(m,it)}"><span>${esc(it.name)}</span></a>`).join('');
  return `<section class="module reveal" id="mod-${m.id}">
    <div class="mod" data-side="${i%2===1?'right':'left'}">
      <div class="mod-media" data-n="${items.length}">
        <div class="frame">
          <div class="rail"><div class="track">${slides}</div></div>
          ${arrows}
        </div>
        ${items.length>1?`<div class="dots">${dots}</div>`:''}
      </div>
      <div class="mod-text">
        <div class="idx">MODULE ${String(m.id+1).padStart(2,'0')}</div>
        <h2>${esc(m.display||m.name)}</h2>
        <p class="desc">${esc(m.desc||'')}</p>
        <div class="chips">${chips}</div>
        <div class="mod-foot">
          <span class="cnt">${m.count} 件作品</span>
          <a class="all" href="list.html?m=${m.id}">查看全部 ${ICON.arrow}</a>
        </div>
      </div>
    </div>
  </section>`;
}
function mountCarousel(el){
  const n = +el.dataset.n||0; if(n<=1) return;
  const track = el.querySelector('.track');
  const dots = [...el.querySelectorAll('.dot')];
  let i=0, timer;
  const go = k=>{ i=(k+n)%n; track.style.transform=`translateX(-${i*100}%)`;
    dots.forEach((d,j)=>d.classList.toggle('on',j===i)); };
  const prev=el.querySelector('.prev'), next=el.querySelector('.next');
  if(prev) prev.onclick=()=>{go(i-1);rest();};
  if(next) next.onclick=()=>{go(i+1);rest();};
  dots.forEach(d=>d.onclick=()=>{go(+d.dataset.i);rest();});
  let sx=0; el.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
  el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>44){go(i+(dx<0?1:-1));rest();}},{passive:true});
  function play(){ if(!RM) timer=setInterval(()=>go(i+1),5200); }
  function rest(){ clearInterval(timer); play(); }
  el.addEventListener('mouseenter',()=>clearInterval(timer));
  el.addEventListener('mouseleave',play);
  play();
}
(async function(){
  let mf;
  try{ mf = await manifest(); }
  catch(err){ document.getElementById('modules').innerHTML =
    `<div class="empty">${ICON.empty}<p>${esc(err.message)}</p></div>`; return; }

  if(mf.title) document.title = mf.title + ' · 交互动画画廊';
  const mods = mf.modules;
  document.getElementById('nav').innerHTML = mods.map(m=>
    `<a href="#mod-${m.id}">${esc(m.display||m.name)}</a>`).join('');
  const total = mods.reduce((s,m)=>s+m.count,0);
  document.getElementById('heroMeta').innerHTML =
    `<span><b>${mods.length}</b>个主题</span><span><b>${total}</b>件动画</span><span><b>∞</b>可交互</span>`;

  document.getElementById('modules').innerHTML = mods.length
    ? mods.map((m,i)=>moduleHTML(m,i)).join('')
    : `<div class="empty">${ICON.empty}<p>暂无内容，请把 HTML 放进各子文件夹后重新运行 build_site.py</p></div>`;

  document.querySelectorAll('.mod-media').forEach(mountCarousel);
  mountReveal(); observeimgs(); mountToTop();
  initHarmonic(document.getElementById('harmonic'));
})();
</script>
</body>
</html>
