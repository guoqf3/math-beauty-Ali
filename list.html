<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品列表 · 数学之美</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23d4a843' stroke-width='1.4'/%3E%3Cpath d='M3 12h18M12 3c-3 4-3 14 0 18' fill='none' stroke='%2346d4e0' stroke-width='1.2'/%3E%3C/svg%3E">
</head>
<body data-page="list">

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="glyph" id="brandGlyph"></span>
      <span>数学之美<small>Beauty of Mathematics</small></span>
    </a>
    <nav class="navlinks" id="nav"></nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <div class="crumb"><a href="index.html">数学之美</a> <span>/</span> <span id="crumbName">—</span></div>
    <h1 id="title">加载中…</h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="toolbar">
    <label class="search">
      <span id="searchIcon"></span>
      <input id="q" type="search" placeholder="搜索作品名…" autocomplete="off">
    </label>
    <div class="seg" id="sort">
      <button data-s="new" class="on">最新</button>
      <button data-s="name">名称</button>
    </div>
    <span class="count-pill" id="pill"></span>
  </div>

  <div class="waterfall" id="grid"></div>
  <nav class="pager" id="pager"></nav>
</main>

<footer class="site">
  <div class="wrap" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;width:100%">
    <span class="fbrand">数学之美</span><span class="eq">e<sup>iπ</sup> + 1 = 0</span>
  </div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* —— 二级页：三列瀑布流 + 分页 + 懒加载 + 回顶 —— */
const PAGE_SIZE = 24;
let MOD=null, PAGE=1, VIEW=[], SORT='new', KW='';
document.getElementById('brandGlyph').innerHTML = ICON.brand;
document.getElementById('searchIcon').innerHTML = ICON.search;
const fmt = ts => ts ? new Date(ts*1000).toLocaleDateString('zh-CN') : '';

function applyFilter(){
  let a = MOD.items.slice();
  if(KW){ const k=KW.toLowerCase(); a=a.filter(it=>it.name.toLowerCase().includes(k)); }
  if(SORT==='name') a.sort((x,y)=>x.name.localeCompare(y.name,'zh'));
  else a.sort((x,y)=>y.mtime-x.mtime);
  VIEW=a; PAGE=1; render();
}
function render(){
  const grid=document.getElementById('grid'), pager=document.getElementById('pager');
  document.getElementById('pill').textContent = `共 ${VIEW.length} 件`;
  if(!VIEW.length){ grid.innerHTML=`<div class="empty" style="column-span:all">${ICON.empty}<p>没有匹配的作品</p></div>`;
    pager.innerHTML=''; return; }
  const pages=Math.ceil(VIEW.length/PAGE_SIZE);
  if(PAGE>pages) PAGE=pages;
  const slice=VIEW.slice((PAGE-1)*PAGE_SIZE, PAGE*PAGE_SIZE);
  grid.innerHTML=slice.map(it=>{
    const link=`view.html?p=${encodeURIComponent(it.src)}&n=${encodeURIComponent(it.name)}&f=${encodeURIComponent(MOD.name)}`;
    return `<a class="card" href="${link}">
      <span class="thumb">${thumbHTML(it)}</span>
      <span class="body">
        <span class="nm">${esc(it.name)}</span>
        <span class="ft">${it.hasThumb?'':'<span class="badge">未截图</span>'}<time>${fmt(it.mtime)}</time>
          <span class="open">打开 ${ICON.arrow}</span></span>
      </span></a>`;
  }).join('');
  observeimgs(grid); observeReveal(grid);
  renderPager(pages);
}
function renderPager(pages){
  const pager=document.getElementById('pager');
  if(pages<=1){ pager.innerHTML=''; return; }
  const b=(label,p,dis,on)=>`<button ${dis?'disabled':''} class="${on?'on':''}" data-p="${p}">${label}</button>`;
  let nums=[],i;
  const add=k=>nums.push(k);
  add(1);
  for(i=Math.max(2,PAGE-1);i<=Math.min(pages-1,PAGE+1);i++) add(i);
  if(pages>1) add(pages);
  nums=[...new Set(nums)].sort((a,b)=>a-b);
  let out=b(ICON.left+'',PAGE-1,PAGE===1,false), prev=0;
  nums.forEach(n=>{ if(n-prev>1) out+='<span class="gap">…</span>';
    out+=b(n,n,false,n===PAGE); prev=n; });
  out+=b(ICON.right+'',PAGE+1,PAGE===pages,false);
  pager.innerHTML=out;
  pager.querySelectorAll('button[data-p]').forEach(btn=>btn.onclick=()=>{
    const p=+btn.dataset.p; if(p<1||p>pages||p===PAGE)return;
    PAGE=p; render(); scrollTo({top:0,behavior:RM?'auto':'smooth'});
  });
}
(async function(){
  let mf; try{ mf=await manifest(); }catch(e){ document.getElementById('title').textContent='加载失败'; return; }
  const mid=q('m');
  MOD = mf.modules.find(m=>String(m.id)===String(mid)) || mf.modules[0];
  if(!MOD){ document.getElementById('title').textContent='未找到该模块'; return; }
  document.title=`${MOD.name} · 数学之美`;
  document.getElementById('title').textContent=MOD.name;
  document.getElementById('crumbName').textContent=MOD.name;
  document.getElementById('sub').textContent=`${MOD.count} 件可交互动画 · 点击任意作品进入完整展示`;
  document.getElementById('nav').innerHTML=
    `<a href="index.html">首页</a>`+mf.modules.map(m=>
      `<a href="list.html?m=${m.id}" class="${m.id===MOD.id?'active':''}">${esc(m.name)}</a>`).join('');
  let dt; const qi=document.getElementById('q');
  qi.addEventListener('input',()=>{clearTimeout(dt);dt=setTimeout(()=>{KW=qi.value.trim();applyFilter();},220);});
  document.getElementById('sort').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#sort button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); SORT=b.dataset.s; applyFilter();
  });
  applyFilter(); mountToTop();
})();
</script>
</body>
</html>
