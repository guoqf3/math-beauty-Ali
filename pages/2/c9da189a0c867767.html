<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>神经网络 · AI 学习过程</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#04060d;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:32px 40px;opacity:0;
    animation:fade 1.6s 0.2s ease forwards;
  }
  #title .en{
    font-size:9.5px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,230,.34);font-weight:300;margin-bottom:12px;
  }
  #title h1{
    font-size:clamp(20px,3vw,38px);
    font-weight:200;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(96deg,#5ee0c0 0%,#6ab8ff 40%,#b090e0 72%,#ffd08a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:12px;
    filter:drop-shadow(0 0 30px rgba(90,200,220,.42));
  }
  #title .sub{
    font-size:10.5px;letter-spacing:.22em;line-height:2.0;
    color:rgba(150,200,235,.30);font-weight:300;
  }

  #stats{
    position:absolute;top:0;right:0;
    padding:32px 40px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.13em;line-height:2.05;
    color:rgba(140,185,225,.30);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .k{color:rgba(180,195,255,.50);}
  #stats .v{color:rgba(255,215,150,.78);}
  #stats .lab{
    display:block;font-size:8px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(120,165,215,.24);margin-bottom:7px;
  }
  #audioDot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:rgba(200,180,255,.22);
    margin-left:6px;vertical-align:middle;
    transition:background .4s;
  }
  #audioDot.on{
    background:rgba(150,240,180,.9);
    box-shadow:0 0 8px rgba(150,240,180,.8);
  }

  #btns{
    position:absolute;bottom:0;right:0;
    padding:0 40px 28px;
    display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
    max-width:520px;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
    pointer-events:auto;
  }
  .btn{
    font-family:inherit;
    font-size:10px;letter-spacing:.22em;text-indent:.22em;
    color:rgba(220,230,255,.82);
    background:rgba(20,30,55,.48);
    border:1px solid rgba(120,155,230,.28);
    border-radius:999px;
    padding:8px 16px;cursor:pointer;
    transition:.3s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .btn:hover{
    border-color:rgba(180,220,255,.85);
    box-shadow:0 0 20px rgba(120,180,255,.36);
    background:rgba(60,95,165,.22);
  }
  .btn.active{
    border-color:rgba(120,240,210,.85);
    background:rgba(50,150,140,.22);
    color:rgba(180,255,235,.95);
    box-shadow:0 0 22px rgba(90,220,190,.42);
  }

  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:16px;white-space:nowrap;
    font-size:9px;letter-spacing:.26em;
    color:rgba(150,195,230,.28);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:16px 16px;}
    #stats{padding:16px 16px;font-size:8.5px;}
    #btns{padding:0 16px 16px;gap:5px;}
    .btn{padding:6px 11px;font-size:8.5px;letter-spacing:.14em;}
    #hint{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">NEURAL NETWORK · LEARNING</div>
    <h1>AI 学习过程</h1>
    <div class="sub">
      反向传播 · 权重实时可视化<br>
      切换数据集 · 观察学习路径差异
    </div>
  </div>

  <div id="stats">
    <span class="lab">TRAINING METRICS</span>
    <div><span class="k">Epoch </span><span class="v" id="epochVal">0</span></div>
    <div><span class="k">Loss </span><span class="v" id="lossVal">0.693</span></div>
    <div><span class="k">Acc </span><span class="v" id="accVal">50.0%</span></div>
    <div><span class="k">LR </span><span class="v" id="lrVal">0.30</span></div>
    <div><span class="k">数据集 </span><span class="v" id="dsVal">XOR</span></div>
    <div style="margin-top:4px;"><span class="k">音频 </span><span class="v">脉冲 + 数据流</span><span id="audioDot"></span></div>
  </div>

  <div id="btns">
    <button class="btn active" data-ds="xor">XOR</button>
    <button class="btn" data-ds="circle">圆形</button>
    <button class="btn" data-ds="spiral">螺旋</button>
    <button class="btn" data-ds="linear">线性</button>
    <button class="btn" id="resetBtn">重 训</button>
    <button class="btn" id="lrBtn">学习率 0.30</button>
  </div>

  <div id="hint">左侧 · 决策边界　｜　右侧 · 网络权重与脉冲传播</div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   画布与布局
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let dbX = 0, dbY = 0, dbS = 0;       // 决策边界面板
let netX = 0, netY = 0, netW = 0, netH = 0; // 网络区域

function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const margin = W < 900 ? 16 : 40;
  const panelSize = Math.min(H * 0.60, W * 0.40) - margin;
  dbS = Math.max(180, panelSize);
  dbX = margin;
  dbY = (H - dbS) * 0.5 + 10;

  netX = dbX + dbS + margin * 1.4;
  netY = 70;
  netW = W - netX - margin;
  netH = H - netY - 90;
}
window.addEventListener('resize', layout);

/* =========================================================
   神经网络
   ========================================================= */
const LAYER_SIZES = [2, 8, 8, 1];

class NeuralNet {
  constructor(sizes){
    this.sizes = sizes;
    this.W = [];      // W[l][j][i]：从第 l 层节点 i 到第 l+1 层节点 j
    this.b = [];

    for (let l = 0; l < sizes.length - 1; l++){
      const wl = [];
      const bl = new Float32Array(sizes[l + 1]);
      const scale = Math.sqrt(1.0 / sizes[l]);
      for (let j = 0; j < sizes[l + 1]; j++){
        const row = new Float32Array(sizes[l]);
        for (let i = 0; i < sizes[l]; i++){
          row[i] = (Math.random() * 2 - 1) * scale * 2.2;
        }
        wl.push(row);
      }
      this.W.push(wl);
      this.b.push(bl);
    }

    // 每个权重上一次的更新量（用于显示“学习活跃度”）
    this.lastDelta = this.W.map(function(wl){
      return wl.map(function(row){ return new Float32Array(row.length); });
    });
  }

  sigmoid(x){
    if (x < -30) return 0;
    if (x >  30) return 1;
    return 1 / (1 + Math.exp(-x));
  }

  forward(x){
    const acts = [x];
    let a = x;
    for (let l = 0; l < this.W.length; l++){
      const next = new Float32Array(this.sizes[l + 1]);
      for (let j = 0; j < this.sizes[l + 1]; j++){
        let sum = this.b[l][j];
        const row = this.W[l][j];
        for (let i = 0; i < this.sizes[l]; i++){
          sum += row[i] * a[i];
        }
        next[j] = this.sigmoid(sum);
      }
      acts.push(next);
      a = next;
    }
    return acts;
  }

  train(x, y, lr){
    const acts = this.forward(x);
    const L = this.W.length;
    const deltas = [];
    for (let l = 0; l < L; l++) deltas.push(new Float32Array(this.sizes[l + 1]));

    // 输出层：二元交叉熵 + sigmoid 的误差项就是 (out - y)
    const out = acts[L][0];
    deltas[L - 1][0] = out - y;

    // 反向传播
    for (let l = L - 1; l > 0; l--){
      for (let j = 0; j < this.sizes[l]; j++){
        let sum = 0;
        for (let k = 0; k < this.sizes[l + 1]; k++){
          sum += this.W[l][k][j] * deltas[l][k];
        }
        const a = acts[l][j];
        deltas[l - 1][j] = sum * a * (1 - a);
      }
    }

    // 更新权重
    for (let l = 0; l < L; l++){
      const cur = this.W[l];
      const ld  = this.lastDelta[l];
      const dl  = deltas[l];
      const al  = acts[l];
      for (let j = 0; j < this.sizes[l + 1]; j++){
        const d = dl[j];
        const row = cur[j];
        const lrow = ld[j];
        for (let i = 0; i < this.sizes[l]; i++){
          const dw = lr * d * al[i];
          row[i] -= dw;
          lrow[i] = dw;
        }
        this.b[l][j] -= lr * d;
      }
    }

    return out;
  }
}

let nn = new NeuralNet(LAYER_SIZES);

/* =========================================================
   数据集
   ========================================================= */
let dataset = [];
let currentDS = 'xor';
let dsName = 'XOR';

function genDataset(type, n){
  const pts = [];
  for (let i = 0; i < n; i++){
    let x, y, label;

    if (type === 'xor'){
      const cx = (Math.random() < 0.5 ? -1 : 1) * 0.58;
      const cy = (Math.random() < 0.5 ? -1 : 1) * 0.58;
      x = cx + (Math.random() - 0.5) * 0.42;
      y = cy + (Math.random() - 0.5) * 0.42;
      label = (cx * cy > 0) ? 0 : 1;

    } else if (type === 'circle'){
      const a = Math.random() * TAU;
      const inner = Math.random() < 0.5;
      const r = inner ? Math.random() * 0.34 : 0.58 + Math.random() * 0.36;
      x = r * Math.cos(a);
      y = r * Math.sin(a);
      label = inner ? 0 : 1;

    } else if (type === 'spiral'){
      const t = Math.random() * 2.6 * Math.PI;
      const r = 0.08 + (t / (2.6 * Math.PI)) * 0.82;
      const noise = (Math.random() - 0.5) * 0.13;
      if (Math.random() < 0.5){
        x =  r * Math.cos(t) + noise;
        y =  r * Math.sin(t) + noise;
        label = 0;
      } else {
        x = -r * Math.cos(t) + noise;
        y = -r * Math.sin(t) + noise;
        label = 1;
      }

    } else { // linear
      x = Math.random() * 2 - 1;
      y = Math.random() * 2 - 1;
      label = (y > x * 0.6 + 0.08) ? 1 : 0;
    }

    // 裁剪到 [-1, 1]
    if (x < -1) x = -1; if (x > 1) x = 1;
    if (y < -1) y = -1; if (y > 1) y = 1;

    pts.push({ x: x, y: y, label: label });
  }
  return pts;
}

function switchDataset(type){
  currentDS = type;
  const names = { xor: 'XOR', circle: '圆形', spiral: '螺旋', linear: '线性' };
  dsName = names[type] || type;

  dataset = genDataset(type, 420);
  nn = new NeuralNet(LAYER_SIZES);

  epoch = 0;
  lossEMA = 0.693;
  accEMA = 0.5;
  sampleCursor = 0;
  pulses.length = 0;
  lastPulseTime = 0;

  document.getElementById('dsVal').textContent = dsName;

  document.querySelectorAll('[data-ds]').forEach(function(b){
    b.classList.toggle('active', b.dataset.ds === type);
  });
}

/* =========================================================
   训练状态
   ========================================================= */
let epoch = 0;
let lossEMA = 0.693;
let accEMA = 0.5;
let sampleCursor = 0;
let running = true;
let lr = 0.30;

const LR_STEPS = [0.03, 0.08, 0.15, 0.30, 0.60, 1.20];
let lrIdx = 3;

/* =========================================================
   脉冲动画
   ========================================================= */
const pulses = [];
let lastPulseTime = 0;

function spawnPulse(){
  const path = [];
  for (let l = 0; l < LAYER_SIZES.length; l++){
    path.push((Math.random() * LAYER_SIZES[l]) | 0);
  }
  pulses.push({
    path: path,
    seg: 0,
    t: 0,
    speed: 2.6,
    done: false
  });
}

/* =========================================================
   音频 —— 电子脉冲 + 数据流动
   ========================================================= */
let ac = null, master = null, flowGain = null, flowFilter = null;
let audioReady = false;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.58, ac.currentTime, 2.0);

  const kick = function(){
    setAudioDot(true);
    startFlow();
  };

  if (ac.state === 'suspended'){
    ac.resume().then(kick).catch(function(){ audioReady = false; });
  } else {
    kick();
  }
}

/* ---- 数据流动：带通噪声，缓慢起伏 ---- */
function startFlow(){
  const now = ac.currentTime;
  const len = ac.sampleRate * 3;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  flowFilter = ac.createBiquadFilter();
  flowFilter.type = 'bandpass';
  flowFilter.frequency.value = 1400;
  flowFilter.Q.value = 2.2;

  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 400;

  flowGain = ac.createGain();
  flowGain.gain.value = 0;

  src.connect(flowFilter);
  flowFilter.connect(hp);
  hp.connect(flowGain);
  flowGain.connect(master);
  src.start(now);

  flowGain.gain.setTargetAtTime(0.014, now, 2.6);

  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.16;
  const lg = ac.createGain();
  lg.gain.value = 0.008;
  lfo.connect(lg);
  lg.connect(flowGain.gain);
  lfo.start(now);

  const lfo2 = ac.createOscillator();
  lfo2.frequency.value = 0.09;
  const lg2 = ac.createGain();
  lg2.gain.value = 520;
  lfo2.connect(lg2);
  lg2.connect(flowFilter.frequency);
  lfo2.start(now);
}

/* ---- 电子脉冲：短促正弦波，音高随层数变化 ---- */
function playPulse(layer){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const freqs = [1250, 1680, 2240, 2950];
  const f = freqs[Math.min(layer, freqs.length - 1)];

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 1.35, now + 0.035);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.020, now + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0003, now + 0.09);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.10);
}

/* =========================================================
   网络布局 —— 节点位置
   ========================================================= */
let nodePositions = [];

function computeNodePositions(){
  nodePositions = [];

  const layers = LAYER_SIZES;
  const numLayers = layers.length;
  const maxCount = 8;

  /* 水平位置：从 netX + 8% 到 netX + 92% */
  const xStart = netX + netW * 0.06;
  const xEnd   = netX + netW * 0.94;

  /* 垂直中心 */
  const cy = netY + netH * 0.5;

  /* 垂直间距 */
  const vSpacing = Math.min(48, (netH * 0.82) / Math.max(1, maxCount - 1));

  for (let l = 0; l < numLayers; l++){
    const cnt = layers[l];
    const x = numLayers === 1
      ? xStart
      : xStart + (xEnd - xStart) * (l / (numLayers - 1));

    const layerNodes = [];
    const totalH = (cnt - 1) * vSpacing;
    const y0 = cy - totalH * 0.5;

    for (let i = 0; i < cnt; i++){
      layerNodes.push({
        x: x,
        y: y0 + i * vSpacing,
        r: l === 0 ? 13 : (l === numLayers - 1 ? 15 : 11)
      });
    }
    nodePositions.push(layerNodes);
  }
}

/* =========================================================
   绘制 —— 决策边界 + 数据点
   ========================================================= */
const GRID_N = 38;

function drawDecisionBoundary(){
  /* 面板边框 */
  ctx.fillStyle = 'rgba(6, 12, 24, 0.86)';
  ctx.fillRect(dbX - 1, dbY - 1, dbS + 2, dbS + 2);

  const cellSize = dbS / GRID_N;

  /* 网格采样：分类概率 → 颜色 */
  for (let gy = 0; gy < GRID_N; gy++){
    for (let gx = 0; gx < GRID_N; gx++){
      const nx = (gx + 0.5) / GRID_N * 2 - 1;
      const ny = (gy + 0.5) / GRID_N * 2 - 1;

      const acts = nn.forward([nx, ny]);
      const p = acts[acts.length - 1][0];

      /* p=0 → 深青蓝；p=1 → 深橙红；p=0.5 → 深紫 */
      let r, g, b;
      if (p < 0.5){
        const t = p * 2; // 0→1
        r = 10 + t * 22;
        g = 28 + t * 42;
        b = 68 + t * 30;
      } else {
        const t = (p - 0.5) * 2;
        r = 32 + t * 88;
        g = 70 - t * 34;
        b = 98 - t * 62;
      }

      ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
      ctx.fillRect(
        dbX + gx * cellSize,
        dbY + gy * cellSize,
        cellSize + 0.6,
        cellSize + 0.6
      );
    }
  }

  /* 数据点 */
  for (let i = 0; i < dataset.length; i++){
    const pt = dataset[i];
    const px = dbX + (pt.x * 0.5 + 0.5) * dbS;
    const py = dbY + (pt.y * 0.5 + 0.5) * dbS;

    if (pt.label === 1){
      ctx.fillStyle = 'rgba(255, 190, 160, 0.85)';
    } else {
      ctx.fillStyle = 'rgba(180, 235, 255, 0.85)';
    }

    ctx.beginPath();
    ctx.arc(px, py, 2.6, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }

  /* 面板边框 */
  ctx.strokeStyle = 'rgba(90, 140, 210, 0.28)';
  ctx.lineWidth = 1;
  ctx.strokeRect(dbX - 1, dbY - 1, dbS + 2, dbS + 2);

  /* 标签 */
  ctx.font = '9px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(150, 190, 230, 0.42)';
  ctx.textAlign = 'left';
  ctx.fillText('决策边界 · DECISION BOUNDARY', dbX, dbY - 10);
  ctx.textAlign = 'right';
  ctx.fillText(dsName + ' · 420 样本', dbX + dbS, dbY - 10);
  ctx.textAlign = 'left';
}

/* =========================================================
   绘制 —— 神经网络
   ========================================================= */
function drawNetwork(t){
  if (nodePositions.length === 0) return;

  /* 当前样本用于节点激活可视化 */
  const sample = dataset[sampleCursor % dataset.length];
  const acts = nn.forward([sample.x, sample.y]);

  /* --- 连线 --- */
  for (let l = 0; l < nn.W.length; l++){
    const fromLayer = nodePositions[l];
    const toLayer   = nodePositions[l + 1];

    for (let j = 0; j < nn.W[l].length; j++){
      const row = nn.W[l][j];
      const deltaRow = nn.lastDelta[l][j];

      const to = toLayer[j];
      if (!to) continue;

      for (let i = 0; i < row.length; i++){
        const from = fromLayer[i];
        if (!from) continue;

        const w = row[i];
        const absW = Math.abs(w);
        const a = Math.min(1, absW * 0.95);

        /* 学习活跃度：最近更新量大 → 更亮 */
        const learn = Math.min(1, Math.abs(deltaRow[i]) * 22);

        let lineColor;
        if (w > 0){
          const r = 70 + learn * 60;
          const g = 130 + learn * 100;
          const b = 220;
          lineColor = 'rgba(' + (r | 0) + ',' + (g | 0) + ',' + b + ',' + (a * 0.55) + ')';
        } else {
          const r = 245;
          const g = 110 + learn * 60;
          const b = 80 + learn * 40;
          lineColor = 'rgba(' + r + ',' + (g | 0) + ',' + (b | 0) + ',' + (a * 0.55) + ')';
        }

        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 0.4 + Math.min(2.6, absW * 1.9);
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
      }
    }
  }

  /* --- 脉冲 --- */
  for (let p = 0; p < pulses.length; p++){
    const pulse = pulses[p];
    const l = pulse.seg;

    const fromLayer = nodePositions[l];
    const toLayer   = nodePositions[l + 1];
    if (!fromLayer || !toLayer) { pulse.done = true; continue; }

    const from = fromLayer[pulse.path[l]];
    const to   = toLayer[pulse.path[l + 1]];
    if (!from || !to) { pulse.done = true; continue; }

    const x = from.x + (to.x - from.x) * pulse.t;
    const y = from.y + (to.y - from.y) * pulse.t;

    /* 光晕 */
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y, 0, x, y, 14);
    g.addColorStop(0.00, 'rgba(190, 255, 240, 0.85)');
    g.addColorStop(0.32, 'rgba(110, 220, 255, 0.42)');
    g.addColorStop(1.00, 'rgba(60, 180, 255, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, TAU);
    ctx.fill();

    /* 核心 */
    ctx.fillStyle = 'rgba(230, 255, 250, 0.95)';
    ctx.beginPath();
    ctx.arc(x, y, 2.3, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* --- 节点 --- */
  for (let l = 0; l < nodePositions.length; l++){
    const layer = nodePositions[l];
    const actLayer = acts[l];

    for (let i = 0; i < layer.length; i++){
      const n = layer[i];
      const a = actLayer ? actLayer[i] : 0;

      /* 输入层：激活值映射颜色 */
      if (l === 0){
        const t2 = (a + 1) * 0.5;  // [-1,1] → [0,1]
        const r = 40 + t2 * 100;
        const g = 100 + t2 * 60;
        const b = 220 - t2 * 40;
        ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = 'rgba(160, 220, 255, 0.55)';
        ctx.lineWidth = 1.3;
        ctx.stroke();

        /* 数值 */
        ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.font = '8.5px ui-monospace, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(a.toFixed(2), n.x, n.y);
        continue;
      }

      /* 输出层：概率值决定颜色 */
      if (l === nodePositions.length - 1){
        const pv = a;

        /* 光晕 */
        ctx.globalCompositeOperation = 'lighter';
        const hg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 3.4);
        hg.addColorStop(0.00, pv > 0.5
          ? 'rgba(255, 170, 120, ' + (pv * 0.55) + ')'
          : 'rgba(120, 220, 255, ' + ((1 - pv) * 0.55) + ')');
        hg.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r * 3.4, 0, TAU);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';

        const r = 30 + pv * 225;
        const g = 90 + (1 - Math.abs(pv - 0.5) * 2) * 120 + pv * 40;
        const b = 200 - pv * 150;

        ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 230, 200, 0.75)';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
        ctx.font = 'bold 9px ui-monospace, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pv.toFixed(2), n.x, n.y);
        continue;
      }

      /* 隐藏层 */
      const r0 = 30 + a * 90;
      const g0 = 80 + a * 130;
      const b0 = 160 + a * 70;

      ctx.fillStyle = 'rgb(' + (r0 | 0) + ',' + (g0 | 0) + ',' + (b0 | 0) + ')';
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, TAU);
      ctx.fill();

      ctx.strokeStyle = 'rgba(140, 200, 255, ' + (0.30 + a * 0.50) + ')';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      /* 激活值弧 */
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 2.6, -Math.PI / 2, -Math.PI / 2 + a * TAU);
      ctx.strokeStyle = 'rgba(120, 250, 220, ' + (0.32 + a * 0.45) + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
  }

  /* 层标签 */
  ctx.font = '8.5px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(140, 185, 230, 0.42)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const labels = ['输入', '隐藏 1', '隐藏 2', '输出'];
  for (let l = 0; l < nodePositions.length; l++){
    const layer = nodePositions[l];
    const x = layer[0].x;
    const bottomY = netY + netH + 10;
    ctx.fillText(labels[l], x, bottomY);
  }

  /* 顶部说明 */
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(150, 190, 230, 0.42)';
  ctx.fillText('网络结构 · 2 → 8 → 8 → 1　·　线条粗细 ∝ |权重|　·　蓝正 / 橙负', netX, netY - 44);
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;
let trainAccum = 0;
let metricsTick = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.10) dt = 0.10;
  const t = now * 0.001;

  /* ---- 训练 ---- */
  if (running){
    /* 每秒约 260 个样本 */
    trainAccum += dt * 260;
    let steps = Math.floor(trainAccum);
    if (steps > 30) steps = 30;
    trainAccum -= steps;

    for (let i = 0; i < steps; i++){
      const pt = dataset[sampleCursor % dataset.length];
      sampleCursor++;

      const pred = nn.train([pt.x, pt.y], pt.label, lr);

      /* 平滑指标 */
      const pClamped = Math.max(1e-7, Math.min(1 - 1e-7, pred));
      const l = -(pt.label * Math.log(pClamped) + (1 - pt.label) * Math.log(1 - pClamped));
      lossEMA += (l - lossEMA) * 0.02;

      const correct = ((pred > 0.5) ? 1 : 0) === pt.label ? 1 : 0;
      accEMA += (correct - accEMA) * 0.02;

      if (sampleCursor % dataset.length === 0) epoch++;
    }
  }

  /* ---- 脉冲 ---- */
  if (running){
    if (t - lastPulseTime > 0.36){
      lastPulseTime = t;
      spawnPulse();
      /* 偶尔再补一个，让脉冲更密集 */
      if (Math.random() < 0.35) setTimeout(spawnPulse, 120);
    }
  }

  for (let i = pulses.length - 1; i >= 0; i--){
    const pulse = pulses[i];
    if (pulse.done){ pulses.splice(i, 1); continue; }

    pulse.t += dt * pulse.speed;
    if (pulse.t >= 1){
      pulse.seg++;
      pulse.t -= 1;

      /* 到达新节点：播放脉冲音 */
      playPulse(pulse.seg);

      if (pulse.seg >= pulse.path.length - 1){
        pulse.done = true;
      }
    }
  }

  /* ---- 绘制 ---- */
  /* 背景 */
  ctx.fillStyle = '#04060d';
  ctx.fillRect(0, 0, W, H);

  const bgG = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.82
  );
  bgG.addColorStop(0.00, 'rgba(16, 28, 56, 0.32)');
  bgG.addColorStop(0.50, 'rgba(8, 14, 32, 0.13)');
  bgG.addColorStop(1.00, 'rgba(2, 4, 10, 0)');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  computeNodePositions();
  drawDecisionBoundary();
  drawNetwork(t);

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.32,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.74
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.26)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.80)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* ---- HUD ---- */
  metricsTick++;
  if (metricsTick % 6 === 0){
    const ev = document.getElementById('epochVal');
    const lv = document.getElementById('lossVal');
    const av = document.getElementById('accVal');
    const lrv = document.getElementById('lrVal');
    if (ev) ev.textContent = epoch;
    if (lv) lv.textContent = lossEMA.toFixed(4);
    if (av) av.textContent = (accEMA * 100).toFixed(1) + '%';
    if (lrv) lrv.textContent = lr.toFixed(2);
  }
}

/* =========================================================
   交互
   ========================================================= */
document.querySelectorAll('[data-ds]').forEach(function(btn){
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    initAudio();
    switchDataset(btn.dataset.ds);
  });
});

document.getElementById('resetBtn').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  nn = new NeuralNet(LAYER_SIZES);
  epoch = 0;
  lossEMA = 0.693;
  accEMA = 0.5;
  sampleCursor = 0;
  pulses.length = 0;
});

document.getElementById('lrBtn').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  lrIdx = (lrIdx + 1) % LR_STEPS.length;
  lr = LR_STEPS[lrIdx];
  this.textContent = '学习率 ' + lr.toFixed(2);
});

/* 首次点击启动音频 */
window.addEventListener('pointerdown', initAudio);
window.addEventListener('keydown', function(e){
  if (e.key === ' '){
    e.preventDefault();
    initAudio();
    running = !running;
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    nn = new NeuralNet(LAYER_SIZES);
    epoch = 0;
    lossEMA = 0.693;
    accEMA = 0.5;
  }
});

/* =========================================================
   启动
   ========================================================= */
layout();
switchDataset('xor');
requestAnimationFrame(loop);

})();
</script>
