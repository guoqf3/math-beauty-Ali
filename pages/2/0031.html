<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>光之辐射体</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #hint {
            position: fixed;
            bottom: 20px;
            left: 24px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease;
            font-weight: 300;
        }
        #fps-badge {
            position: fixed;
            top: 16px;
            right: 18px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="fps-badge"></div>
    <div id="hint">移动旋转 · 点击换色</div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─── 性能与安全检查 ───
            if (!window.PIXI) {
                console.warn('PixiJS 加载失败');
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">需要WebGL支持</div>';
                return;
            }

            // ─── 常量定义 ───
            const FOCAL_LENGTH = 2800;
            const PARTICLE_COUNT = 2000;
            const BASE_RADIUS = 220;
            const BASE_SCALE = 0.09;
            const AUTO_ROTATE_SPEED = 0.32;
            const VIEW_SENSITIVITY_X = 0.7;
            const VIEW_SENSITIVITY_Y = 0.5;
            const SHOCK_SPEED = 3.2; // 冲击波衰减速度
            const SHOCK_AMPLITUDE = 380; // 冲击波最大额外半径

            // ─── 颜色主题 ───
            const COLOR_THEMES = [
                // 暖阳日冕
                [0xFFD447, 0xFF9D4D, 0xFF6B4D, 0xFFB85C, 0xFFE0A0],
                // 冷冽星云
                [0x4D9FFF, 0xB06BFF, 0x4DFFD9, 0x6B6BFF, 0x7CD4FF],
                // 极光翡翠
                [0x6BFF6B, 0x4DFFD9, 0xB0FF6B, 0x4DFFFF, 0x8DFF4D],
                // 蔷薇幻彩
                [0xFF6B9D, 0xFF4D6B, 0xFFB0C8, 0xFF9D4D, 0xD46BFF],
                // 全息光谱
                [0x4DFFD9, 0x4D9FFF, 0x6B6BFF, 0xB06BFF, 0xFFD447],
            ];
            let currentThemeIndex = 0;

            // ─── DOM 元素 ───
            const fpsBadge = document.getElementById('fps-badge');
            const hintEl = document.getElementById('hint');

            // ─── PixiJS 应用初始化 ───
            let app;
            try {
                app = new PIXI.Application({
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0x050510,
                    antialias: false,
                    autoDensity: true,
                    resolution: Math.min(window.devicePixelRatio || 1, 2),
                    powerPreference: 'high-performance',
                    forceCanvas: !isWebGLAvailable(),
                });
            } catch (err) {
                console.error('PixiJS 初始化失败:', err);
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">初始化失败</div>';
                return;
            }

            function isWebGLAvailable() {
                try {
                    const canvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext &&
                        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
                } catch (e) { return false; }
            }

            document.body.appendChild(app.view);

            // ─── 创建发光纹理 ───
            function createGlowTexture(size) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const half = size / 2;
                const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
                gradient.addColorStop(0.0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.1, 'rgba(255,255,255,0.95)');
                gradient.addColorStop(0.35, 'rgba(255,255,255,0.6)');
                gradient.addColorStop(0.65, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                const tex = PIXI.Texture.from(c);
                tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
                return tex;
            }

            const glowTex64 = createGlowTexture(64);
            const glowTex128 = createGlowTexture(128);

            // ─── 粒子容器 ───
            const particleContainer = new PIXI.ParticleContainer(PARTICLE_COUNT, {
                position: true,
                scale: true,
                tint: true,
                alpha: true,
            }, PARTICLE_COUNT, true);
            particleContainer.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(particleContainer);

            // ─── 中心光晕 ───
            const centerGlow = new PIXI.Sprite(glowTex128);
            centerGlow.anchor.set(0.5);
            centerGlow.tint = 0xFFFFFF;
            centerGlow.alpha = 0.3;
            centerGlow.scale.set(1.8);
            centerGlow.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerGlow);

            const centerCore = new PIXI.Sprite(glowTex64);
            centerCore.anchor.set(0.5);
            centerCore.tint = 0xFFFFFF;
            centerCore.alpha = 0.7;
            centerCore.scale.set(0.35);
            centerCore.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerCore);

            // ─── 数据结构 ───
            const sprites = [];
            const particles = [];

            let mouseX = 0;
            let mouseY = 0;
            let smoothMouseX = 0;
            let smoothMouseY = 0;
            let autoRotateY = 0;
            let shockWave = 0; // 冲击波强度（0-1）
            let time = 0;
            let frameCount = 0;
            let fpsLastTime = 0;

            // ─── 斐波那契球体均匀分布 ───
            function generateFibonacciSphere(count) {
                const points = [];
                const phi = Math.PI * (3 - Math.sqrt(5)); // 黄金角
                for (let i = 0; i < count; i++) {
                    const y = 1 - (i / (count - 1)) * 2; // y 从 1 到 -1
                    const radius = Math.sqrt(1 - y * y);
                    const theta = phi * i;
                    const x = Math.cos(theta) * radius;
                    const z = Math.sin(theta) * radius;
                    points.push({ x, y, z });
                }
                return points;
            }

            // ─── 初始化粒子 ───
            function initParticles() {
                const directions = generateFibonacciSphere(PARTICLE_COUNT);
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const dir = directions[i];
                    const sprite = new PIXI.Sprite(glowTex64);
                    sprite.anchor.set(0.5);

                    // 分配颜色索引：基于y坐标和随机混合
                    const colorIdx = Math.floor((dir.y * 0.5 + 0.5) * COLOR_THEMES[0].length * 0.6 + Math.random() * 1.5);
                    const safeColorIdx = Math.min(Math.max(Math.floor(colorIdx), 0), COLOR_THEMES[0].length - 1);
                    sprite.tint = COLOR_THEMES[0][safeColorIdx];
                    sprite.alpha = 0.75 + Math.random() * 0.2;
                    sprite.scale.set(BASE_SCALE * (0.85 + Math.random() * 0.3));

                    // 粒子数据
                    const baseR = BASE_RADIUS * (0.7 + Math.random() * 0.6);
                    const amplitude = 20 + Math.random() * 45;
                    const frequency = 0.4 + Math.random() * 1.2;
                    const phase = Math.random() * Math.PI * 2;
                    const speedFactor = 0.7 + Math.random() * 0.6;
                    const colorIdxStored = safeColorIdx;
                    const data = {
                        dir: { x: dir.x, y: dir.y, z: dir.z },
                        baseR: baseR,
                        amplitude: amplitude,
                        frequency: frequency,
                        phase: phase,
                        speedFactor: speedFactor,
                        colorIdx: colorIdxStored,
                        baseAlpha: 0.7 + Math.random() * 0.25,
                    };

                    particles.push(data);
                    sprites.push(sprite);
                    particleContainer.addChild(sprite);
                }
                console.log('粒子初始化完成，数量:', sprites.length);
            }

            // ─── 3D 旋转与投影 ───
            function rotatePoint(x, y, z, viewX, viewY) {
                // 绕 Y 轴
                let cosY = Math.cos(viewY);
                let sinY = Math.sin(viewY);
                let x1 = x * cosY + z * sinY;
                let z1 = -x * sinY + z * cosY;
                let y1 = y;
                // 绕 X 轴
                let cosX = Math.cos(viewX);
                let sinX = Math.sin(viewX);
                let y2 = y1 * cosX - z1 * sinX;
                let z2 = y1 * sinX + z1 * cosX;
                let x2 = x1;
                return { x: x2, y: y2, z: z2 };
            }

            function projectPoint(p, centerX, centerY) {
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + p.z);
                return {
                    sx: p.x * scale + centerX,
                    sy: p.y * scale + centerY,
                    scale: scale
                };
            }

            // ─── 更新粒子 ───
            function updateParticles(delta, viewX, viewY, centerX, centerY) {
                // 冲击波衰减
                if (shockWave > 0) {
                    shockWave = Math.max(0, shockWave - delta * SHOCK_SPEED);
                }

                for (let i = 0; i < sprites.length; i++) {
                    const data = particles[i];
                    const sprite = sprites[i];

                    // 计算当前半径：基础 + 振荡 + 冲击波
                    const oscillation = data.amplitude * Math.sin(time * data.frequency * data.speedFactor + data.phase);
                    const shockOffset = shockWave > 0 ? shockWave * SHOCK_AMPLITUDE * Math.exp(-shockWave * 2.5) : 0;
                    const currentR = data.baseR + oscillation + shockOffset;

                    // 计算世界坐标
                    const worldX = data.dir.x * currentR;
                    const worldY = data.dir.y * currentR;
                    const worldZ = data.dir.z * currentR;

                    // 旋转
                    const rp = rotatePoint(worldX, worldY, worldZ, viewX, viewY);
                    const proj = projectPoint(rp, centerX, centerY);

                    // 更新精灵属性
                    const depthFactor = proj.scale;
                    const pulseGlow = 1 + 0.08 * Math.sin(time * 2.2 + i * 0.1);
                    const alphaMod = 0.85 + 0.15 * Math.sin(time * 1.6 + i * 0.12);

                    sprite.position.set(proj.sx, proj.sy);
                    sprite.scale.set(BASE_SCALE * depthFactor * pulseGlow);
                    sprite.alpha = Math.max(0.05, Math.min(1, data.baseAlpha * depthFactor * alphaMod));
                }
            }

            // ─── 更新中心光晕 ───
            function updateCenterGlow(centerX, centerY) {
                const pulse = 0.25 + 0.1 * Math.sin(time * 1.8) + 0.05 * Math.sin(time * 3.7);
                const shockPulse = shockWave > 0 ? shockWave * 0.4 : 0;
                centerGlow.position.set(centerX, centerY);
                centerGlow.alpha = Math.max(0.15, Math.min(0.55, pulse + shockPulse));
                centerGlow.scale.set(1.7 + 0.3 * Math.sin(time * 1.2) + shockWave * 0.8);
                centerCore.position.set(centerX, centerY);
                centerCore.scale.set(0.33 + 0.06 * Math.sin(time * 2.5) + shockWave * 0.25);
                centerCore.alpha = 0.6 + 0.2 * Math.sin(time * 1.4) + shockWave * 0.3;
            }

            // ─── 切换颜色主题 ───
            function switchTheme() {
                currentThemeIndex = (currentThemeIndex + 1) % COLOR_THEMES.length;
                const theme = COLOR_THEMES[currentThemeIndex];
                for (let i = 0; i < sprites.length; i++) {
                    const data = particles[i];
                    const color = theme[data.colorIdx % theme.length];
                    sprites[i].tint = color;
                }
                // 中心颜色同步
                centerCore.tint = theme[0];
                centerGlow.tint = theme[1] || theme[0];
            }

            // ─── 触发冲击波 ───
            function triggerShockWave() {
                shockWave = 1.0;
            }

            // ─── 主循环 ───
            app.ticker.add((delta) => {
                const dt = Math.min(delta / 60, 0.05);
                time += dt;
                frameCount++;

                const w = window.innerWidth;
                const h = window.innerHeight;
                const cx = w / 2;
                const cy = h / 2;

                // 平滑鼠标追踪
                smoothMouseX += (mouseX - smoothMouseX) * 0.065;
                smoothMouseY += (mouseY - smoothMouseY) * 0.065;

                // 自动旋转
                autoRotateY += AUTO_ROTATE_SPEED * dt;

                // 视角计算
                const normX = (smoothMouseX / w) * 2 - 1;
                const normY = (smoothMouseY / h) * 2 - 1;
                const viewY = autoRotateY + normX * VIEW_SENSITIVITY_X;
                const viewX = normY * VIEW_SENSITIVITY_Y;

                // 更新
                updateParticles(dt, viewX, viewY, cx, cy);
                updateCenterGlow(cx, cy);

                // FPS 显示
                if (time - fpsLastTime > 0.5) {
                    const fps = Math.round(frameCount / (time - fpsLastTime));
                    fpsBadge.textContent = fps + ' fps';
                    frameCount = 0;
                    fpsLastTime = time;
                }
            });

            // ─── 交互事件 ───
            function getCanvasCoords(e) {
                const rect = app.view.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function onPointerMove(e) {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
            }

            function onPointerDown(e) {
                e.preventDefault();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
                switchTheme();
                triggerShockWave();
                // 视觉反馈：中心闪光
                centerCore.alpha = 1.0;
                centerGlow.alpha = 0.7;
                setTimeout(() => {
                    centerCore.alpha = 0.7;
                    centerGlow.alpha = 0.3;
                }, 200);
            }

            function onPointerLeave() {
                mouseX = window.innerWidth / 2;
                mouseY = window.innerHeight / 2;
            }

            app.view.addEventListener('mousemove', onPointerMove);
            app.view.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mouseleave', onPointerLeave);

            app.view.addEventListener('touchmove', onPointerMove, { passive: true });
            app.view.addEventListener('touchstart', onPointerDown, { passive: false });
            app.view.addEventListener('touchend', () => {});

            // ─── 窗口大小调整 ───
            function handleResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                app.renderer.resize(w, h);
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(handleResize, 300);
            });

            // ─── 键盘交互 ───
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    switchTheme();
                    triggerShockWave();
                }
            });

            // ─── 启动 ───
            initParticles();

            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
            smoothMouseX = mouseX;
            smoothMouseY = mouseY;

            // 隐藏提示文字
            setTimeout(() => {
                if (hintEl) {
                    hintEl.style.opacity = '0';
                    setTimeout(() => {
                        if (hintEl) hintEl.style.display = 'none';
                    }, 1600);
                }
            }, 3200);

            handleResize();
            console.log('✨ 光之辐射体已启动 — 粒子数:', sprites.length);
        })();
    </script>
</body>
</html>
