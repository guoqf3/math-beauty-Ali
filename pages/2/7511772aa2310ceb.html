<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>10 滚动摆线</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #01030a;
    color: #e9f4ff;
    font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }

  /* ---------- 背景 ---------- */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 50% 68%, rgba(20,80,160,0.28) 0%, rgba(2,6,16,0) 60%),
      radial-gradient(ellipse at 50% 18%, rgba(140,90,20,0.10) 0%, rgba(2,6,16,0) 55%),
      linear-gradient(180deg, #040a18 0%, #020610 45%, #000000 100%);
  }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.85) 100%);
  }
  #scene { position: fixed; inset: 0; z-index: 1; }
  canvas { display: block; }

  /* ---------- UI ---------- */
  .ui { position: fixed; z-index: 4; pointer-events: none; }

  header.ui { top: 34px; left: 42px; }
  .tag {
    font-size: 11px; letter-spacing: .38em; color: #4fa6d8;
    margin-bottom: 12px; text-transform: uppercase;
  }
  h1 {
    margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .14em;
    background: linear-gradient(92deg, #5ce1ff 0%, #7fd8ff 26%, #ffd166 60%, #ffb03a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(90,190,255,.45));
  }
  .sub {
    margin-top: 10px; font-size: 11px; letter-spacing: .26em; color: #4a6f8f;
  }

  .panel {
    left: 42px; bottom: 44px;
    padding: 18px 24px 16px; border-radius: 14px;
    background: linear-gradient(160deg, rgba(16,48,86,.42), rgba(6,12,24,.32));
    border: 1px solid rgba(90,190,255,.22);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    box-shadow:
      0 0 40px rgba(40,120,220,.12) inset,
      0 10px 44px rgba(0,0,0,.55);
  }
  .eq {
    font-family: "Cambria Math", Georgia, "Times New Roman", serif;
    font-size: 20px; line-height: 1.6; color: #d3eaff;
    text-shadow: 0 0 16px rgba(90,190,255,.40);
    margin: 3px 0; letter-spacing: .02em;
  }
  .eq.small { font-size: 13.5px; color: #8fb6d8; text-shadow: 0 0 12px rgba(60,150,220,.35); }
  .eq .hl  { color: #5ce1ff; }
  .eq .hl2 { color: #ffd166; }
  .eq .hl3 { color: #a8e6ff; }

  .hint {
    right: 42px; bottom: 46px; font-size: 11px;
    letter-spacing: .22em; color: #43607e; text-align: right; line-height: 1.9;
  }

  /* ---------- 启动层 ---------- */
  #startScreen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px;
    background: radial-gradient(circle at 50% 50%, rgba(8,26,48,.80), rgba(0,1,4,.96));
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: opacity 1s ease, visibility 1s ease;
  }
  #startScreen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  #startScreen .st {
    font-size: 12px; letter-spacing: .5em; color: #4f9fd0; text-indent: .5em;
  }
  #startBtn {
    pointer-events: auto; cursor: pointer;
    padding: 16px 52px; font-size: 15px; letter-spacing: .42em; text-indent: .42em;
    color: #eaf8ff; background: rgba(20,80,150,.20);
    border: 1px solid rgba(110,210,255,.52); border-radius: 40px;
    font-family: inherit;
    box-shadow: 0 0 32px rgba(70,180,255,.35), 0 0 70px rgba(255,190,60,.12) inset;
    transition: all .35s ease;
    animation: pulseBtn 2.6s ease-in-out infinite;
  }
  #startBtn:hover {
    background: rgba(40,130,220,.32);
    box-shadow: 0 0 56px rgba(110,210,255,.65), 0 0 90px rgba(255,190,60,.22) inset;
    transform: translateY(-2px);
  }
  @keyframes pulseBtn {
    0%, 100% { box-shadow: 0 0 26px rgba(70,180,255,.28), 0 0 60px rgba(255,190,60,.10) inset; }
    50%      { box-shadow: 0 0 52px rgba(110,210,255,.60), 0 0 90px rgba(255,190,60,.22) inset; }
  }

  @media (max-width: 720px) {
    header.ui { top: 22px; left: 20px; }
    h1 { font-size: 19px; }
    .sub { font-size: 9px; }
    .panel { left: 20px; bottom: 24px; padding: 13px 16px; }
    .eq { font-size: 15px; }
    .eq.small { font-size: 11px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="scene"></div>
<div id="vignette"></div>

<header class="ui">
  <div class="tag">Kinematics · 10</div>
  <h1>滚动摆线</h1>
  <div class="sub">CYCLOID · ROULETTE CURVE</div>
</header>

<div class="panel ui">
  <div class="eq">x(t) = R(t − sin t)</div>
  <div class="eq">y(t) = R(1 − cos t)</div>
  <div class="eq small">弧长 &nbsp;s = <span class="hl2">8R</span>&nbsp; · &nbsp;面积 = 3πR²</div>
  <div class="eq small">轮缘固定点轨迹 · <span class="hl">旋轮线</span></div>
</div>

<div class="hint ui">
  拖动鼠标 · 视差移动<br>
  滚轮 · 缩放
</div>

<div id="startScreen">
  <div class="st">ROULETTE CURVE FIELD</div>
  <button id="startBtn">启 动</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   0. 常量与状态
   ============================================================ */
const R          = 2.0;              // 轮半径
const TWO_PI     = Math.PI * 2;
const TRAIL_STEP = 0.0065;           // 轨迹采样角步长
const MAX_TRAIL  = 1600;             // 轨迹最大点数
const SCROLL_SPD = 1.05;             // 滚动角速度 (rad/s)

let scene, camera, renderer, clock;
let wheelGroup, wheelMirror, marker, markerGlow, pointLight, contactGlow;
let trailGeo, trailMat, trailPos, trailCol, trailFade, trailLine;
let ambientDust;

let theta     = 0;      // 当前滚动角
let lastTheta = 0;      // 上次采样角
let trailCount = 0;

let phase = 'roll';     // roll → hold → fadeout → fadein
let phaseT = 0;
let globalAlpha = 1;

const matList = [];     // 统一管理透明度 { m, base }

/* 相机控制 */
let camMouseX = 0, camMouseY = 0;
let zoom = 1;
const CAM_BASE = new THREE.Vector3(R * Math.PI, 3.6, 15.5);
const CAM_LOOK = new THREE.Vector3(R * Math.PI, 1.9, 0);

/* ============================================================
   1. 贴图工具
   ============================================================ */
function makeGlowTexture(inner, mid, outer) {
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  g.addColorStop(0.00, inner);
  g.addColorStop(0.16, mid);
  g.addColorStop(0.45, outer);
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

function makeGroundTexture() {
  const S = 1024;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');

  // 基底渐变
  const g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S * 0.68);
  g.addColorStop(0.00, '#0b1c34');
  g.addColorStop(0.42, '#061020');
  g.addColorStop(1.00, '#01030a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);

  // 网格线
  const step = S / 44;
  ctx.lineWidth = 1;
  for (let i = 0; i <= 44; i++) {
    const a = 0.10 + 0.06 * Math.sin(i * 0.7);
    ctx.strokeStyle = `rgba(70,160,240,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * step); ctx.lineTo(S, i * step); ctx.stroke();
  }

  // 金色细网格
  ctx.lineWidth = 1;
  for (let i = 0; i <= 88; i++) {
    ctx.strokeStyle = 'rgba(255,190,80,0.045)';
    ctx.beginPath(); ctx.moveTo(i * S / 88, 0); ctx.lineTo(i * S / 88, S); ctx.stroke();
  }

  // 暗角
  const v = ctx.createRadialGradient(S/2, S/2, S * 0.18, S/2, S/2, S * 0.80);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.90)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, S, S);

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  return tex;
}

/* ============================================================
   2. 轮子构建
   ============================================================ */
function buildWheel(isMirror) {
  const group = new THREE.Group();
  const op = isMirror ? 0.16 : 1.0;

  /* --- 外圈 --- */
  const ringMat = new THREE.MeshStandardMaterial({
    color:     isMirror ? 0x14405f : 0x35b8ff,
    emissive:  isMirror ? 0x061828 : 0x0f66aa,
    emissiveIntensity: 1.1,
    metalness: 0.35,
    roughness: 0.32,
    transparent: true,
    opacity: op,
    side: THREE.DoubleSide
  });
  matList.push({ m: ringMat, base: op });

  const ring = new THREE.Mesh(new THREE.TorusGeometry(R, 0.062, 12, 110), ringMat);
  group.add(ring);

  /* --- 内圈 --- */
  const innerMat = new THREE.MeshStandardMaterial({
    color:     isMirror ? 0x0e2c44 : 0x1e78b0,
    emissive:  isMirror ? 0x040e1a : 0x0a3a60,
    emissiveIntensity: 0.85,
    metalness: 0.4,
    roughness: 0.40,
    transparent: true,
    opacity: op * 0.82,
    side: THREE.DoubleSide
  });
  matList.push({ m: innerMat, base: op * 0.82 });

  const inner = new THREE.Mesh(new THREE.TorusGeometry(R * 0.70, 0.026, 10, 80), innerMat);
  group.add(inner);

  /* --- 辐条 --- */
  const spokeMat = new THREE.MeshStandardMaterial({
    color:     isMirror ? 0x1a3a55 : 0x5ad0ff,
    emissive:  isMirror ? 0x061422 : 0x1f88cc,
    emissiveIntensity: 1.35,
    metalness: 0.45,
    roughness: 0.30,
    transparent: true,
    opacity: op * 0.92
  });
  matList.push({ m: spokeMat, base: op * 0.92 });

  const spokeGeo = new THREE.CylinderGeometry(0.020, 0.020, R * 0.70, 6);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TWO_PI;
    const spoke = new THREE.Mesh(spokeGeo, spokeMat);
    spoke.position.set(Math.cos(a) * R * 0.35, Math.sin(a) * R * 0.35, 0);
    spoke.rotation.z = a - Math.PI / 2;
    group.add(spoke);
  }

  /* --- 轮毂 --- */
  const hubMat = new THREE.MeshStandardMaterial({
    color:     isMirror ? 0x1c3a58 : 0x9ae8ff,
    emissive:  isMirror ? 0x061220 : 0x35b0ee,
    emissiveIntensity: 1.8,
    metalness: 0.5,
    roughness: 0.22,
    transparent: true,
    opacity: op
  });
  matList.push({ m: hubMat, base: op });

  const hub = new THREE.Mesh(new THREE.SphereGeometry(R * 0.135, 22, 16), hubMat);
  group.add(hub);

  return group;
}

/* ============================================================
   3. 标记点（轮缘发光小球）
   ============================================================ */
let MARKER_GLOW_TEX;
function buildMarker(isMirror) {
  const group = new THREE.Group();
  const op = isMirror ? 0.30 : 1.0;

  const coreMat = new THREE.MeshStandardMaterial({
    color:     isMirror ? 0xffbb55 : 0xfff2b8,
    emissive:  isMirror ? 0xff7700 : 0xffcc33,
    emissiveIntensity: 3.2,
    metalness: 0.30,
    roughness: 0.18,
    transparent: true,
    opacity: op
  });
  matList.push({ m: coreMat, base: op });

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.155, 22, 16), coreMat);
  group.add(core);

  // 外层柔和光晕
  const glowMat = new THREE.SpriteMaterial({
    map: MARKER_GLOW_TEX,
    color: 0xffd966,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: isMirror ? 0.10 : 0.88
  });
  matList.push({ m: glowMat, base: isMirror ? 0.10 : 0.88 });

  const glow = new THREE.Sprite(glowMat);
  glow.scale.set(1.65, 1.65, 1);
  group.add(glow);

  // 内层强光
  const coreGlowMat = new THREE.SpriteMaterial({
    map: MARKER_GLOW_TEX,
    color: 0xffffff,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: isMirror ? 0.06 : 0.75
  });
  matList.push({ m: coreGlowMat, base: isMirror ? 0.06 : 0.75 });

  const coreGlow = new THREE.Sprite(coreGlowMat);
  coreGlow.scale.set(0.72, 0.72, 1);
  group.add(coreGlow);

  group.userData.glow = glow;
  group.userData.coreGlow = coreGlow;

  return group;
}

/* ============================================================
   4. 轨迹（青金交替渐隐曲线）
   ============================================================ */
function buildTrail() {
  trailPos  = new Float32Array(MAX_TRAIL * 3);
  trailCol  = new Float32Array(MAX_TRAIL * 3);
  trailFade = new Float32Array(MAX_TRAIL);

  trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  trailGeo.setAttribute('aColor',   new THREE.BufferAttribute(trailCol, 3));
  trailGeo.setAttribute('aFade',    new THREE.BufferAttribute(trailFade, 1));
  trailGeo.setDrawRange(0, 0);

  trailMat = new THREE.ShaderMaterial({
    uniforms: {
      uAlpha: { value: 1.0 }
    },
    vertexShader: `
      attribute vec3  aColor;
      attribute float aFade;
      varying vec3  vColor;
      varying float vFade;
      void main() {
        vColor = aColor;
        vFade  = aFade;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uAlpha;
      varying vec3  vColor;
      varying float vFade;
      void main() {
        gl_FragColor = vec4(vColor, vFade * uAlpha);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false
  });

  trailLine = new THREE.Line(trailGeo, trailMat);
  trailLine.frustumCulled = false;
  scene.add(trailLine);
}

function addTrailPoint(th) {
  if (trailCount >= MAX_TRAIL) return;
  const i3 = trailCount * 3;
  trailPos[i3]     = R * (th - Math.sin(th));
  trailPos[i3 + 1] = R * (1 - Math.cos(th)) + 0.012;
  trailPos[i3 + 2] = 0;
  trailCount++;
}

function updateTrailAttrs() {
  const n = trailCount;
  if (n === 0) { trailGeo.setDrawRange(0, 0); return; }

  const denom = Math.max(n - 1, 1);

  for (let i = 0; i < n; i++) {
    const i3 = i * 3;

    /* ---- 青金交替条纹 ---- */
    const ph = i * 0.042;
    const k = 0.5 + 0.5 * Math.sin(ph);          // 0 → 青, 1 → 金
    trailCol[i3]     = 0.22 + 0.78 * k;
    trailCol[i3 + 1] = 0.96 - 0.18 * k;
    trailCol[i3 + 2] = 1.00 - 0.80 * k;

    /* ---- 渐隐：尾部暗，头部亮 ---- */
    const u = i / denom;
    let f = 0.30 + 0.70 * Math.pow(u, 1.7);

    /* ---- 头部增强 ---- */
    if (i > n - 26) {
      const hb = (i - (n - 26)) / 26;
      f = Math.min(1.0, f + hb * 0.55);
    }
    trailFade[i] = f;
  }

  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.aColor.needsUpdate   = true;
  trailGeo.attributes.aFade.needsUpdate    = true;
  trailGeo.setDrawRange(0, n);
}

/* ============================================================
   5. 环境尘埃
   ============================================================ */
function buildDust() {
  const N = 420;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);

  for (let i = 0; i < N; i++) {
    pos[i * 3]     = (Math.random() - 0.5) * 34 + R * Math.PI;
    pos[i * 3 + 1] = Math.random() * 12 - 1.5;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 22;

    // 冷色尘埃 + 少量金色
    if (Math.random() < 0.20) {
      col[i * 3] = 1.0; col[i * 3 + 1] = 0.82; col[i * 3 + 2] = 0.36;
    } else {
      col[i * 3] = 0.42; col[i * 3 + 1] = 0.78; col[i * 3 + 2] = 1.0;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.075,
    vertexColors: true,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });

  ambientDust = new THREE.Points(geo, mat);
  scene.add(ambientDust);
}

/* ============================================================
   6. 初始化
   ============================================================ */
function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
  camera.position.copy(CAM_BASE);
  camera.lookAt(CAM_LOOK);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.getElementById('scene').appendChild(renderer.domElement);

  /* ---------- 贴图 ---------- */
  MARKER_GLOW_TEX = makeGlowTexture(
    'rgba(255,255,255,1)',
    'rgba(255,240,190,0.92)',
    'rgba(255,170,50,0.32)'
  );

  const blueGlowTex = makeGlowTexture(
    'rgba(255,255,255,1)',
    'rgba(190,240,255,0.90)',
    'rgba(50,160,255,0.30)'
  );

  /* ---------- 光照 ---------- */
  scene.add(new THREE.AmbientLight(0x557799, 1.05));

  const keyLight = new THREE.DirectionalLight(0x8fd4ff, 1.05);
  keyLight.position.set(6, 14, 9);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xffc078, 0.62);
  fillLight.position.set(-8, 7, -9);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0x5ce1ff, 0.48);
  rimLight.position.set(-4, 3, 12);
  scene.add(rimLight);

  /* ---------- 地面 ---------- */
  const groundTex = makeGroundTexture();
  const groundMat = new THREE.MeshStandardMaterial({
    map: groundTex,
    color: 0xffffff,
    metalness: 0.25,
    roughness: 0.55,
    emissive: 0x081626,
    emissiveIntensity: 0.6
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(R * Math.PI, 0, 0);
  scene.add(ground);

  /* 地面镜像高光条（伪造反射光带） */
  const stripGeo = new THREE.PlaneGeometry(30, 3.2);
  const stripMat = new THREE.MeshBasicMaterial({
    map: blueGlowTex,
    color: 0x3aa0ff,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 0.14
  });
  const strip = new THREE.Mesh(stripGeo, stripMat);
  strip.rotation.x = -Math.PI / 2;
  strip.position.set(R * Math.PI, 0.012, 0);
  scene.add(strip);
  matList.push({ m: stripMat, base: 0.14 });

  /* ---------- 主轮 ---------- */
  wheelGroup = buildWheel(false);
  scene.add(wheelGroup);

  /* ---------- 镜像轮（反射） ---------- */
  wheelMirror = buildWheel(true);
  scene.add(wheelMirror);

  /* ---------- 标记点 ---------- */
  marker = buildMarker(false);
  marker.position.set(0, -R, 0);
  wheelGroup.add(marker);

  const markerMirror = buildMarker(true);
  markerMirror.position.set(0, -R, 0);
  wheelMirror.add(markerMirror);

  /* ---------- 标记点光源 ---------- */
  pointLight = new THREE.PointLight(0xffcc55, 2.2, 14, 2);
  pointLight.position.set(0, -R, 0);
  wheelGroup.add(pointLight);

  /* ---------- 接触点地面辉光 ---------- */
  const contactTex = makeGlowTexture(
    'rgba(255,255,255,1)',
    'rgba(200,235,255,0.85)',
    'rgba(40,140,255,0.24)'
  );
  const contactMat = new THREE.MeshBasicMaterial({
    map: contactTex,
    color: 0x3aa8ff,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 0.38
  });
  contactGlow = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 4.6), contactMat);
  contactGlow.rotation.x = -Math.PI / 2;
  contactGlow.position.y = 0.022;
  scene.add(contactGlow);
  matList.push({ m: contactMat, base: 0.38 });

  /* ---------- 轨迹 & 尘埃 ---------- */
  buildTrail();
  buildDust();

  clock = new THREE.Clock();

  addEventListener('resize', onResize);
  addEventListener('pointermove', onPointerMove);
  addEventListener('wheel', onWheel, { passive: true });

  animate();
}

/* ============================================================
   7. 事件
   ============================================================ */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function onPointerMove(e) {
  camMouseX = (e.clientX / innerWidth) * 2 - 1;
  camMouseY = (e.clientY / innerHeight) * 2 - 1;
}

function onWheel(e) {
  zoom += e.deltaY * 0.0009;
  zoom = Math.max(0.55, Math.min(1.9, zoom));
}

/* ============================================================
   8. 主循环
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.045);
  const t  = clock.getElapsedTime();

  /* ---------------- 阶段状态机 ---------------- */
  if (phase === 'roll') {
    theta += SCROLL_SPD * dt;
    if (theta >= TWO_PI) {
      theta = TWO_PI;
      phase = 'hold';
      phaseT = 0;
    }
    /* 按固定角步长补点，保证曲线平滑 */
    while (lastTheta < theta - 1e-6) {
      lastTheta = Math.min(lastTheta + TRAIL_STEP, theta);
      addTrailPoint(lastTheta);
    }
  } else if (phase === 'hold') {
    phaseT += dt;
    if (phaseT > 1.15) { phase = 'fadeout'; phaseT = 0; }
  } else if (phase === 'fadeout') {
    phaseT += dt;
    globalAlpha = Math.max(0, 1 - phaseT / 0.75);
    if (globalAlpha <= 0.001) {
      theta = 0; lastTheta = 0; trailCount = 0;
      phase = 'fadein'; phaseT = 0;
    }
  } else if (phase === 'fadein') {
    phaseT += dt;
    globalAlpha = Math.min(1, phaseT / 0.75);
    if (globalAlpha >= 0.999) { phase = 'roll'; }
  }

  /* ---------------- 轮子位置与旋转 ---------------- */
  const cx = R * theta;
  const cy = R;

  wheelGroup.position.set(cx, cy, 0);
  wheelGroup.rotation.z = -theta;

  /* 镜像轮：关于 y=0 平面反射 → 位置 y 取反，旋转 = π + θ */
  wheelMirror.position.set(cx, -cy, 0);
  wheelMirror.rotation.z = Math.PI + theta;

  /* ---------------- 标记点世界坐标 ---------------- */
  const mx = R * (theta - Math.sin(theta));
  const my = R * (1 - Math.cos(theta));

  /* ---------------- 标记点光晕脉动 ---------------- */
  const pulse = 1 + 0.16 * Math.sin(t * 6.2);
  const g1 = marker.userData.glow;
  const g2 = marker.userData.coreGlow;
  if (g1) g1.scale.set(1.65 * pulse, 1.65 * pulse, 1);
  if (g2) g2.scale.set(0.72 * (1 + 0.25 * Math.sin(t * 8.4)), 0.72 * (1 + 0.25 * Math.sin(t * 8.4)), 1);

  /* ---------------- 点光源颜色随角度青金交替 ---------------- */
  const hueK = 0.5 + 0.5 * Math.sin(theta * 3.0);
  pointLight.color.setRGB(
    0.35 + 0.65 * hueK,
    0.80 - 0.10 * hueK,
    1.00 - 0.72 * hueK
  );
  pointLight.intensity = 1.9 + 0.7 * Math.sin(t * 5.0);

  /* ---------------- 地面接触辉光跟随 ---------------- */
  contactGlow.position.set(cx, 0.022, 0);
  const cgPulse = 0.34 + 0.10 * Math.sin(t * 4.4);
  contactGlow.material.opacity = cgPulse * globalAlpha;

  /* ---------------- 轨迹更新 ---------------- */
  updateTrailAttrs();
  trailMat.uniforms.uAlpha.value = globalAlpha;

  /* ---------------- 统一透明度 ---------------- */
  for (let i = 0; i < matList.length; i++) {
    const o = matList[i];
    o.m.opacity = o.base * globalAlpha;
  }

  /* ---------------- 环境尘埃缓慢漂移 ---------------- */
  if (ambientDust) {
    const p = ambientDust.geometry.attributes.position;
    const arr = p.array;
    for (let i = 0; i < arr.length; i += 3) {
      arr[i + 1] += 0.006 * Math.sin(t * 0.5 + i);
      arr[i]     += 0.004 * Math.cos(t * 0.35 + i * 0.3);
    }
    p.needsUpdate = true;
    ambientDust.rotation.y = t * 0.012;
  }

  /* ---------------- 相机（视差 + 缩放） ---------------- */
  const targetX = CAM_BASE.x + camMouseX * 1.8;
  const targetY = CAM_BASE.y - camMouseY * 1.1;
  const targetZ = CAM_BASE.z * zoom;

  camera.position.x += (targetX - camera.position.x) * 0.045;
  camera.position.y += (targetY - camera.position.y) * 0.045;
  camera.position.z += (targetZ - camera.position.z) * 0.055;

  camera.lookAt(CAM_LOOK);

  renderer.render(scene, camera);
}

/* ============================================================
   9. 科技感背景音效
   ============================================================ */
let audioStarted = false;

function startAudio() {
  if (audioStarted) return;
  audioStarted = true;

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();

    /* ---------- 总输出 ---------- */
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.48, ctx.currentTime + 5.5);
    master.connect(ctx.destination);

    /* ---------- 低频 drone ---------- */
    const droneGain = ctx.createGain();
    droneGain.gain.value = 0.14;

    const droneFilter = ctx.createBiquadFilter();
    droneFilter.type = 'lowpass';
    droneFilter.frequency.value = 480;
    droneFilter.Q.value = 0.8;

    droneGain.connect(droneFilter);
    droneFilter.connect(master);

    // 缓慢的呼吸调制
    const breathLfo = ctx.createOscillator();
    breathLfo.frequency.value = 0.11;
    const breathDepth = ctx.createGain();
    breathDepth.gain.value = 0.055;
    breathLfo.connect(breathDepth);
    breathDepth.connect(droneGain.gain);
    breathLfo.start();

    // 和声堆叠
    [55, 82.41, 110, 164.81, 220, 329.63].forEach((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = i % 2 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (Math.random() - 0.5) * 14;

      const g = ctx.createGain();
      g.gain.value = 0.50 / (i + 1.2);

      osc.connect(g);
      g.connect(droneGain);

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.035 + 0.05 * i;
      const lg = ctx.createGain();
      lg.gain.value = 0.28 * g.gain.value;
      lfo.connect(lg);
      lg.connect(g.gain);
      lfo.start();

      osc.start();
    });

    /* ---------- 噪声层（模拟滚动摩擦 / 气流） ---------- */
    const len = Math.floor(ctx.sampleRate * 4);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const nFilter = ctx.createBiquadFilter();
    nFilter.type = 'bandpass';
    nFilter.frequency.value = 1200;
    nFilter.Q.value = 1.3;

    const nGain = ctx.createGain();
    nGain.gain.value = 0.045;

    noise.connect(nFilter);
    nFilter.connect(nGain);
    nGain.connect(master);
    noise.start();

    const sweep1 = ctx.createOscillator();
    sweep1.frequency.value = 0.035;
    const sd1 = ctx.createGain();
    sd1.gain.value = 900;
    sweep1.connect(sd1);
    sd1.connect(nFilter.frequency);
    sweep1.start();

    const sweep2 = ctx.createOscillator();
    sweep2.frequency.value = 0.014;
    const sd2 = ctx.createGain();
    sd2.gain.value = 320;
    sweep2.connect(sd2);
    sd2.connect(nFilter.frequency);
    sweep2.start();

    /* ---------- 周期性清脆音（模拟轮子经过标记点） ---------- */
    const freqs = [880, 1046.5, 1174.7, 1318.5, 1568, 1760, 2093, 2637];

    function blip() {
      if (!audioStarted) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();

        osc.type = Math.random() < 0.55 ? 'sine' : 'triangle';
        osc.frequency.value = freqs[Math.floor(Math.random() * freqs.length)];
        osc.detune.value = (Math.random() - 0.5) * 35;

        const peak = 0.009 + Math.random() * 0.022;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(peak, now + 0.007);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.32 + Math.random() * 0.35);

        osc.connect(g);
        g.connect(master);

        osc.start(now);
        osc.stop(now + 0.85);
      } catch (e) { /* 忽略 */ }

      setTimeout(blip, 240 + Math.random() * 900);
    }
    setTimeout(blip, 1400);

    /* ---------- 高频泛音（晶体质感） ---------- */
    const shimmer = ctx.createOscillator();
    shimmer.type = 'sine';
    shimmer.frequency.value = 1760;
    const shGain = ctx.createGain();
    shGain.gain.value = 0.005;

    const shLfo = ctx.createOscillator();
    shLfo.frequency.value = 0.065;
    const shDepth = ctx.createGain();
    shDepth.gain.value = 0.004;
    shLfo.connect(shDepth);
    shDepth.connect(shGain.gain);
    shLfo.start();

    shimmer.connect(shGain);
    shGain.connect(master);
    shimmer.start();

  } catch (err) {
    console.warn('音频初始化失败：', err);
  }
}

/* ============================================================
   10. 启动
   ============================================================ */
init();

const startScreen = document.getElementById('startScreen');
const startBtn    = document.getElementById('startBtn');

startBtn.addEventListener('click', () => {
  startScreen.classList.add('hide');
  startAudio();
});
</script>
