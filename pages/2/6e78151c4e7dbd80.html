  #hud {
    position:fixed; top:22px; left:26px; z-index:5;

  }
  #hud .sub {

  }

  @media (max-width:720px) {

</style>

<body>

<div id="hud">
  <div class="title">围棋气数博弈</div>

  <div class="row"><span class="k">白棋气</span><span class="v w" id="v-wht">0</span></div>

<button class="btn on" id="btn-spin">自动旋转</button>

<div id="hint">点击交叉点落子 · 点击棋子显示气数与连接<br>拖动进度条回放棋局 · 拖拽旋转视角</div>

<div id="progress-wrap">
  <div id="progress-label">局面演进 <b id="progress-val">0 / 0</b></div>
  <input type="range" id="progress-slider" min="0" max="0" value="0" step="1">
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//  常量
// ============================================================
const N = 13;
const CELL = 0.72;
const PIECE_R = 0.30;
const EMPTY = 0, BLACK = 1, WHITE = -1;

// ── 关键修复：几何内边距与纹理内边距精确对齐 ──
const GRID_W = (N - 1) * CELL;         // 网格世界宽度 = 8.64
const BOARD_PAD = 0.525;                // 每边内边距（世界单位）
const BOARD_TOTAL = GRID_W + BOARD_PAD * 2;  // 棋盘总宽 = 9.69
const BOARD_W = GRID_W;

const STARS = [
  [3,3],[9,3],[3,9],[9,9],[6,6],
  [3,6],[6,3],[6,9],[9,6]
];

function g2w(col, row) {
  return {
    x: (col - (N - 1) / 2) * CELL,
    z: (row - (N - 1) / 2) * CELL,
  };
}

// ============================================================
//  场景
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090d);
scene.fog = new THREE.Fog(0x08090d, 16, 38);

const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth / window.innerHeight, 0.1, 200
);
camera.position.set(0, 10, 9.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x3a4a62, 1.5));

const keyLight = new THREE.DirectionalLight(0xfff0d8, 2.3);
keyLight.position.set(5, 14, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 40;
keyLight.shadow.camera.left = -9;
keyLight.shadow.camera.right = 9;
keyLight.shadow.camera.top = 9;
keyLight.shadow.camera.bottom = -9;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x5a82c0, 1.0);
rimLight.position.set(-7, 5, -9);
scene.add(rimLight);

const glow = new THREE.PointLight(0x80d0ff, 0.7, 25);
glow.position.set(0, 5, 4);
scene.add(glow);

// ============================================================
//  棋盘纹理 —— 内边距精确匹配几何
// ============================================================
function makeBoardTexture() {
  const cw = 1024;
  const ch = 1024;
  const cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');

  // 深色木质底
  const grd = g.createLinearGradient(0, 0, cw, ch);
  grd.addColorStop(0,   '#3a2c1c');
  grd.addColorStop(0.4, '#4a3824');
  grd.addColorStop(0.7, '#3e2e1e');
  grd.addColorStop(1,   '#2e2214');
  g.fillStyle = grd;
  g.fillRect(0, 0, cw, ch);

  // 木纹
  for (let i = 0; i < 4200; i++) {
    const x = Math.random() * cw;
    const y = Math.random() * ch;
    const w = 3 + Math.random() * 70;
    const h = 0.5 + Math.random() * 1.2;
    g.fillStyle = `rgba(${20 + Math.random()*40}, ${10 + Math.random()*25}, 5, ${Math.random()*0.06})`;
    g.fillRect(x, y, w, h);
  }

  // ⚠ 核心修复：内边距比例 = BOARD_PAD / BOARD_TOTAL
  // 这样可见网格的 12 个格距恰好等于几何中的 GRID_W
  const padFrac = BOARD_PAD / BOARD_TOTAL;   // = 0.525 / 9.69 ≈ 0.05418
  const pad = cw * padFrac;
  const gw = cw - pad * 2;
  const gcw = gw / (N - 1);

  g.lineCap = 'round';
  g.lineJoin = 'round';

  // 网格线
  g.strokeStyle = 'rgba(180, 155, 110, 0.55)';
  g.lineWidth = 2.2;

  for (let i = 0; i < N; i++) {
    const p = pad + i * gcw;
    g.beginPath();
    g.moveTo(p, pad);
    g.lineTo(p, ch - pad);
    g.stroke();

    g.beginPath();
    g.moveTo(pad, p);
    g.lineTo(cw - pad, p);
    g.stroke();
  }

  // 外框加粗
  g.strokeStyle = 'rgba(200, 175, 130, 0.75)';
  g.lineWidth = 5;
  g.strokeRect(pad, pad, gw, gw);

  // 星位
  g.fillStyle = 'rgba(200, 175, 130, 0.85)';
  for (const [c, r] of STARS) {
    const x = pad + c * gcw;
    const y = pad + r * gcw;
    g.beginPath();
    g.arc(x, y, 5.5, 0, Math.PI * 2);
    g.fill();
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// ============================================================
//  棋盘
// ============================================================
const boardMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(BOARD_TOTAL, BOARD_TOTAL),
  new THREE.MeshStandardMaterial({
    map: makeBoardTexture(),
    roughness: 0.76,
    metalness: 0.08,
  })
);
boardMesh.rotation.x = -Math.PI / 2;
boardMesh.position.y = 0.004;
boardMesh.receiveShadow = true;
scene.add(boardMesh);

const BOARD_BASE_H = 0.32;
const boardBase = new THREE.Mesh(
  new THREE.BoxGeometry(BOARD_TOTAL, BOARD_BASE_H, BOARD_TOTAL),
  new THREE.MeshStandardMaterial({
    color: 0x241a10,
    roughness: 0.9,
    metalness: 0.04,
  })
);
boardBase.position.y = -BOARD_BASE_H / 2 - 0.004;
boardBase.receiveShadow = true;
boardBase.castShadow = true;
scene.add(boardBase);

// 地台
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 64),
  new THREE.MeshStandardMaterial({
    color: 0x0c0e14,
    roughness: 1,
    metalness: 0,
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.38;
ground.receiveShadow = true;
scene.add(ground);

// 圆环装饰
const ringDeco = new THREE.Mesh(
  new THREE.RingGeometry(BOARD_TOTAL * 0.72, BOARD_TOTAL * 0.74, 96),
  new THREE.MeshBasicMaterial({
    color: 0x2a4a68,
    transparent: true,
    opacity: 0.42,
    side: THREE.DoubleSide,
  })
);
ringDeco.rotation.x = -Math.PI / 2;
ringDeco.position.y = -0.36;
scene.add(ringDeco);

// ============================================================
//  棋子几何
// ============================================================
const stoneGeo = new THREE.CylinderGeometry(
  PIECE_R, PIECE_R * 1.04, 0.11, 32
);
const stoneBlackMat = new THREE.MeshStandardMaterial({
  color: 0x1a1c22,
  roughness: 0.32,
  metalness: 0.28,
  emissive: 0x0a0c14,
});
const stoneWhiteMat = new THREE.MeshStandardMaterial({
  color: 0xeef2f7,
  roughness: 0.36,
  metalness: 0.14,
  emissive: 0x1a1c22,
});

// ============================================================
//  棋盘逻辑
// ============================================================
const board = new Int8Array(N * N);
const stoneMeshes = new Map();
const moveHistory = [];
let currentMove = 0;

const anims = [];

function idxOf(col, row) { return row * N + col; }
function colOf(idx) { return idx % N; }
function rowOf(idx) { return Math.floor(idx / N); }

// ============================================================
//  气 / 连通块
// ============================================================
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

function findGroup(startIdx) {
  const color = board[startIdx];
  if (color === EMPTY) return null;

  const visited = new Set();
  const stack = [startIdx];
  const stones = [];
  const liberties = new Set();

  visited.add(startIdx);

  while (stack.length) {
    const idx = stack.pop();
    stones.push(idx);

    const c = colOf(idx);
    const r = rowOf(idx);

    for (const [dc, dr] of DIRS) {
      const nc = c + dc;
      const nr = r + dr;
      if (nc < 0 || nc >= N || nr < 0 || nr >= N) continue;

      const ni = idxOf(nc, nr);
      const v = board[ni];

      if (v === EMPTY) {
        liberties.add(ni);
      } else if (v === color && !visited.has(ni)) {
        visited.add(ni);
        stack.push(ni);
      }
    }
  }

  return {
    color,
    stones,
    liberties: Array.from(liberties),
    libertyCount: liberties.size,
  };
}

function findAllGroups() {
  const seen = new Set();
  const groups = [];

  for (let i = 0; i < N * N; i++) {
    if (board[i] === EMPTY || seen.has(i)) continue;
    const g = findGroup(i);
    if (g) {
      groups.push(g);
      for (const s of g.stones) seen.add(s);
    }
  }
  return groups;
}

function groupInfluence(g) {
  const color = g.color;
  let tension = 0;

  for (const lib of g.liberties) {
    const lc = colOf(lib), lr = rowOf(lib);
    let opp = 0;
    for (const [dc, dr] of DIRS) {
      const nc = lc + dc, nr = lr + dr;
      if (nc < 0 || nc >= N || nr < 0 || nr >= N) continue;
      const v = board[idxOf(nc, nr)];
      if (v === -color) opp++;
    }
    tension += opp;
  }

  return {
    stoneCount: g.stones.length,
    libertyCount: g.libertyCount,
    tension,
  };
}

function computeEntropy() {
  const groups = findAllGroups();
  if (groups.length === 0) return { H: 0, groups: [] };

  const weights = groups.map(g => {
    const inf = groupInfluence(g);
    return Math.max(0.001,
      inf.stoneCount * 1.0 +
      inf.libertyCount * 0.7 +
      inf.tension * 0.4
    );
  });

  const total = weights.reduce((s, w) => s + w, 0);
  if (total <= 0) return { H: 0, groups };

  let H = 0;
  for (const w of weights) {
    const p = w / total;
    H -= p * Math.log2(p);
  }

  return { H, groups };
}

function computeLiberties() {
  const groups = findAllGroups();
  let blackLib = 0, whiteLib = 0;
  for (const g of groups) {
    if (g.color === BLACK) blackLib += g.libertyCount;
    else whiteLib += g.libertyCount;
  }
  return { blackLib, whiteLib, groups };
}

// ============================================================
//  落子 / 提子
// ============================================================
function createStoneMesh(color, idx) {
  const w = g2w(colOf(idx), rowOf(idx));
  const mesh = new THREE.Mesh(stoneGeo, color === BLACK ? stoneBlackMat : stoneWhiteMat);
  mesh.position.set(w.x, 0.075, w.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  const highlightGeo = new THREE.CircleGeometry(PIECE_R * 0.36, 20);
  const highlightMat = new THREE.MeshBasicMaterial({
    color: color === BLACK ? 0x4a5a72 : 0xffffff,
    transparent: true,
    opacity: color === BLACK ? 0.32 : 0.65,
    depthWrite: false,
  });
  const hl = new THREE.Mesh(highlightGeo, highlightMat);
  hl.rotation.x = -Math.PI / 2;
  hl.position.set(-PIECE_R * 0.32, 0.132, -PIECE_R * 0.32);
  mesh.add(hl);

  mesh.scale.set(0.1, 0.1, 0.1);
  anims.push({ kind: 'spawn', mesh, t: 0, duration: 0.32 });

  return mesh;
}

function tryPlace(idx, color) {
  if (board[idx] !== EMPTY) return null;

  board[idx] = color;
  const captured = [];

  const c = colOf(idx), r = rowOf(idx);
  const checked = new Set();

  for (const [dc, dr] of DIRS) {
    const nc = c + dc, nr = r + dr;
    if (nc < 0 || nc >= N || nr < 0 || nr >= N) continue;
    const ni = idxOf(nc, nr);
    if (board[ni] !== -color || checked.has(ni)) continue;

    const g = findGroup(ni);
    if (g && g.libertyCount === 0) {
      for (const s of g.stones) {
        if (!checked.has(s)) {
          checked.add(s);
          captured.push(s);
        }
      }
    }
  }

  if (captured.length === 0) {
    const selfG = findGroup(idx);
    if (selfG && selfG.libertyCount === 0) {
      board[idx] = EMPTY;
      return null;
    }
  }

  return { captured };
}

function placeStone(idx, color, recordHistory) {
  const result = tryPlace(idx, color);
  if (!result) return false;

  const mesh = createStoneMesh(color, idx);
  scene.add(mesh);
  stoneMeshes.set(idx, mesh);

  for (const capIdx of result.captured) {
    const capMesh = stoneMeshes.get(capIdx);
    if (capMesh) {
      anims.push({
        kind: 'capture',
        mesh: capMesh,
        t: 0,
        duration: 0.4,
        fromScale: capMesh.scale.x,
      });
      stoneMeshes.delete(capIdx);
    }
    board[capIdx] = EMPTY;
  }

  if (recordHistory !== false) {
    moveHistory.push({
      board: board.slice(),
      placed: idx,
      captured: result.captured.slice(),
      color,
    });
    currentMove = moveHistory.length;
  }

  if (result.captured.length > 0) {
    playCapture();
  } else {
    playDrop();
  }

  return true;
}

// ============================================================
//  高亮
// ============================================================
const highlightGroup = new THREE.Group();
scene.add(highlightGroup);

const highlightState = {
  group: null,
  libertyRings: [],
  stoneGlows: [],
};

function clearHighlights() {
  while (highlightGroup.children.length > 0) {
    const c = highlightGroup.children[0];
    highlightGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
  }
  highlightState.group = null;
  highlightState.libertyRings = [];
  highlightState.stoneGlows = [];
}

function highlightGroupOf(startIdx) {
  clearHighlights();

  const g = findGroup(startIdx);
  if (!g) return;

  highlightState.group = g;

  for (const s of g.stones) {
    const w = g2w(colOf(s), rowOf(s));
    const color = g.color === BLACK ? 0x7ab8ff : 0xffd080;

    const ringGeo = new THREE.RingGeometry(PIECE_R * 1.05, PIECE_R * 1.32, 32);
    const ringMat = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.72,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(w.x, 0.19, w.z);
    ring.renderOrder = 5;
    highlightGroup.add(ring);
    highlightState.stoneGlows.push(ring);
  }

  for (const lib of g.liberties) {
    const w = g2w(colOf(lib), rowOf(lib));

    const lc = colOf(lib), lr = rowOf(lib);
    let opp = 0;
    for (const [dc, dr] of DIRS) {
      const nc = lc + dc, nr = lr + dr;
      if (nc < 0 || nc >= N || nr < 0 || nr >= N) continue;
      if (board[idxOf(nc, nr)] === -g.color) opp++;
    }

    const isTense = opp >= 2;
    const color = isTense ? 0xff7050 : 0x5ad0e8;

    const rGeo = new THREE.RingGeometry(CELL * 0.30, CELL * 0.42, 32);
    const rMat = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(rGeo, rMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(w.x, 0.22, w.z);
    ring.renderOrder = 6;
    highlightGroup.add(ring);

    const dGeo = new THREE.CircleGeometry(CELL * 0.10, 20);
    const dMat = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.9,
      depthWrite: false,
    });
    const dot = new THREE.Mesh(dGeo, dMat);
    dot.rotation.x = -Math.PI / 2;
    dot.position.set(w.x, 0.225, w.z);
    dot.renderOrder = 6;
    highlightGroup.add(dot);

    highlightState.libertyRings.push({ ring, dot, isTense, phase: Math.random() * Math.PI * 2 });
  }

  if (g.stones.length > 1) {
    const pathSet = new Set();
    for (const s of g.stones) {
      const c = colOf(s), r = rowOf(s);
      for (const [dc, dr] of DIRS) {
        const nc = c + dc, nr = r + dr;
        if (nc < 0 || nc >= N || nr < 0 || nr >= N) continue;
        const ni = idxOf(nc, nr);
        if (board[ni] !== g.color) continue;

        const key = s < ni ? `${s}-${ni}` : `${ni}-${s}`;
        if (pathSet.has(key)) continue;
        pathSet.add(key);

        const a = g2w(c, r);
        const b = g2w(nc, nr);

        const pts = [
          new THREE.Vector3(a.x, 0.18, a.z),
          new THREE.Vector3(b.x, 0.18, b.z),
        ];
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.LineBasicMaterial({
          color: g.color === BLACK ? 0x8ac8ff : 0xffe0a0,
          transparent: true,
          opacity: 0.72,
        });
        const line = new THREE.Line(geo, mat);
        line.renderOrder = 4;
        highlightGroup.add(line);
      }
    }
  }
}

// ============================================================
//  音频
// ============================================================
const audio = { ctx: null, master: null, reverb: null, ready: false };

function makeIR(actx, dur, decay) {
  const rate = actx.sampleRate;
  const len = Math.floor(rate * dur);
  const buf = actx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      d[i] = (Math.random()*2 - 1) * Math.pow(1 - t, decay);
    }
  }
  return buf;
}

function ensureAudio() {
  if (audio.ctx) {
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  audio.ctx = ctx;

  const master = ctx.createGain();
  master.gain.value = 0.52;
  master.connect(ctx.destination);
  audio.master = master;

  const conv = ctx.createConvolver();
  conv.buffer = makeIR(ctx, 3.4, 2.5);
  const wet = ctx.createGain();
  wet.gain.value = 0.42;
  conv.connect(wet);
  wet.connect(master);
  audio.reverb = conv;

  audio.ready = true;
}

function playDrop() {
  ensureAudio();
  if (!audio.ready) return;
  hoofHit(0.000, 1.00);
  hoofHit(0.072, 0.68);
}

function hoofHit(delay, gain) {
  const ctx = audio.ctx;
  const t0 = ctx.currentTime + delay;

  const out = ctx.createGain();
  out.gain.value = gain;
  out.connect(audio.master);
  out.connect(audio.reverb);

  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, t0);
  osc.frequency.exponentialRampToValueAtTime(62, t0 + 0.075);

  const og = ctx.createGain();
  og.gain.setValueAtTime(0.85, t0);
  og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.11);

  osc.connect(og);
  og.connect(out);
  osc.start(t0);
  osc.stop(t0 + 0.13);

  const nlen = Math.floor(ctx.sampleRate * 0.026);
  const nbuf = ctx.createBuffer(1, nlen, ctx.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nlen, 3.6);
  }
  const ns = ctx.createBufferSource();
  ns.buffer = nbuf;

  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2200;
  bp.Q.value = 1.5;

  const ng = ctx.createGain();
  ng.gain.value = 0.24;

  ns.connect(bp);
  bp.connect(ng);
  ng.connect(out);
  ns.start(t0);
}

function playCapture() {
  ensureAudio();
  if (!audio.ready) return;

  const ctx = audio.ctx;
  const t0 = ctx.currentTime;

  const out = ctx.createGain();
  out.gain.value = 0.9;
  out.connect(audio.master);
  out.connect(audio.reverb);

  const notes = [
    { f: 1240, d: 0.00, g: 1.00 },
    { f: 1860, d: 0.05, g: 0.72 },
    { f: 2480, d: 0.10, g: 0.48 },
  ];

  for (const n of notes) {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = n.f;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0 + n.d);
    g.gain.linearRampToValueAtTime(0.14 * n.g, t0 + n.d + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + n.d + 0.42);

    o.connect(g);
    g.connect(out);
    o.start(t0 + n.d);
    o.stop(t0 + n.d + 0.45);
  }

  const nlen = Math.floor(ctx.sampleRate * 0.045);
  const nbuf = ctx.createBuffer(1, nlen, ctx.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nlen, 4.2);
  }
  const ns = ctx.createBufferSource();
  ns.buffer = nbuf;

  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 3200;
  bp.Q.value = 1.8;

  const ng = ctx.createGain();
  ng.gain.value = 0.22;

  ns.connect(bp);
  bp.connect(ng);
  ng.connect(out);
  ns.start(t0);

  const res = ctx.createOscillator();
  res.type = 'triangle';
  res.frequency.setValueAtTime(560, t0);
  res.frequency.exponentialRampToValueAtTime(320, t0 + 0.12);

  const rg = ctx.createGain();
  rg.gain.setValueAtTime(0.12, t0);
  rg.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);

  res.connect(rg);
  rg.connect(out);
  res.start(t0);
  res.stop(t0 + 0.18);
}

// ============================================================
//  初始局面
// ============================================================
function setupInitialPosition() {
  board.fill(EMPTY);
  for (const mesh of stoneMeshes.values()) scene.remove(mesh);
  stoneMeshes.clear();
  moveHistory.length = 0;
  currentMove = 0;
  clearHighlights();
  anims.length = 0;

  const sequence = [
    [6, 6, BLACK],
    [6, 7, WHITE],
    [5, 6, BLACK],
    [7, 7, WHITE],
    [6, 5, BLACK],
    [5, 7, WHITE],
    [7, 6, BLACK],
    [5, 5, WHITE],
    [7, 5, BLACK],
    [4, 6, WHITE],
    [8, 6, BLACK],
    [6, 4, WHITE],
    [6, 8, BLACK],
  ];

  for (const [c, r, color] of sequence) {
    placeStone(idxOf(c, r), color, true);
  }

  syncHistory();
}

function syncHistory() {
  moveHistory.push({
    board: board.slice(),
    placed: -1,
    captured: [],
    color: 0,
  });
  currentMove = moveHistory.length;
}

// ============================================================
//  HUD
// ============================================================
const elBlk     = document.getElementById('v-blk');
const elWht     = document.getElementById('v-wht');
const elGroups  = document.getElementById('v-groups');
const elMove    = document.getElementById('v-move');
const elEntropy = document.getElementById('v-entropy');
const elFill    = document.getElementById('v-fill');
const elEntLbl  = document.getElementById('v-ent-lbl');
const elProgVal = document.getElementById('progress-val');
const elSlider  = document.getElementById('progress-slider');

let hudT = 0;

function updateHUD(dt) {
  hudT += dt;
  if (hudT < 0.09) return;
  hudT = 0;

  const { blackLib, whiteLib, groups } = computeLiberties();
  elBlk.textContent = blackLib;
  elWht.textContent = whiteLib;
  elGroups.textContent = groups.length;
  elMove.textContent = currentMove;

  const { H } = computeEntropy();
  elEntropy.textContent = H.toFixed(4);
  const maxH = Math.log2(Math.max(groups.length, 2));
  const pct = maxH > 0 ? Math.min(100, (H / maxH) * 100) : 0;
  elFill.style.width = pct.toFixed(1) + '%';

  let lbl = '低复杂度';
  if (H > 0.6) lbl = '中等';
  if (H > 1.4) lbl = '高复杂度';
  if (H > 2.2) lbl = '极复杂';
  elEntLbl.textContent = lbl + ' · 峰值 ' + maxH.toFixed(2);

  elProgVal.textContent = currentMove + ' / ' + moveHistory.length;
  elSlider.max = Math.max(0, moveHistory.length - 1);
}

function refreshFromHistory(targetMove) {
  if (targetMove < 0 || targetMove >= moveHistory.length) return;

  const snap = moveHistory[targetMove];
  board.set(snap.board);

  for (const mesh of stoneMeshes.values()) scene.remove(mesh);
  stoneMeshes.clear();

  for (let i = 0; i < N * N; i++) {
    if (board[i] !== EMPTY) {
      const w = g2w(colOf(i), rowOf(i));
      const mesh = new THREE.Mesh(
        stoneGeo,
        board[i] === BLACK ? stoneBlackMat : stoneWhiteMat
      );
      mesh.position.set(w.x, 0.075, w.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      stoneMeshes.set(i, mesh);
    }
  }

  currentMove = targetMove + 1;
  clearHighlights();
}

// ============================================================
//  交互
// ============================================================
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

/**
 * 从屏幕坐标取最近交叉点
 * 由于纹理内边距与几何内边距已精确对齐，
 * 射线命中的世界坐标可以直接四舍五入到最近的交叉点。
 */
function pickColRow(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(boardMesh);
  if (!hits.length) return null;

  const p = hits[0].point;
  const col = Math.round(p.x / CELL + (N - 1) / 2);
  const row = Math.round(p.z / CELL + (N - 1) / 2);

  if (col < 0 || col >= N || row < 0 || row >= N) return null;

  // 距离校验：超过 0.62 格距则视为点击无效
  const w = g2w(col, row);
  const d = Math.hypot(p.x - w.x, p.z - w.z);
  if (d > CELL * 0.62) return null;

  return { col, row, idx: idxOf(col, row), dist: d };
}

function pickStone(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointerNDC, camera);

  const stoneList = [];
  for (const [idx, mesh] of stoneMeshes.entries()) {
    mesh.userData.idx = idx;
    stoneList.push(mesh);
  }

  const hits = raycaster.intersectObjects(stoneList);
  if (hits.length) {
    return { idx: hits[0].object.userData.idx };
  }
  return null;
}

let nextColor = BLACK;
let ptr = { down: false, moved: false, startX: 0, startY: 0 };

const dom = renderer.domElement;

dom.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();

  ptr.down = true;
  ptr.moved = false;
  ptr.startX = e.clientX;
  ptr.startY = e.clientY;

  const hint = document.getElementById('hint');
  if (hint) hint.classList.add('hide');
}, { passive: false });

dom.addEventListener('pointermove', e => {
  if (ptr.down) {
    const dx = e.clientX - ptr.startX;
    const dy = e.clientY - ptr.startY;
    if (Math.hypot(dx, dy) > 6) {
      ptr.moved = true;
      document.documentElement.classList.add('dragging');
    }
  }
}, { passive: true });

dom.addEventListener('pointerup', e => {
  if (!ptr.down) return;
  ptr.down = false;
  document.documentElement.classList.remove('dragging');
  if (ptr.moved) return;

  // ① 先看是否点到了棋子
  const stoneHit = pickStone(e.clientX, e.clientY);
  if (stoneHit) {
    highlightGroupOf(stoneHit.idx);
    return;
  }

  // ② 尝试在最近交叉点落子
  const cell = pickColRow(e.clientX, e.clientY);
  if (!cell) {
    clearHighlights();
    return;
  }

  if (board[cell.idx] === EMPTY) {
    if (placeStone(cell.idx, nextColor, true)) {
      syncHistory();
      nextColor = -nextColor;
      clearHighlights();
      updateHUD(0.2);
    }
  } else {
    highlightGroupOf(cell.idx);
  }
}, { passive: false });

dom.addEventListener('pointercancel', () => {
  ptr.down = false;
  ptr.moved = false;
  document.documentElement.classList.remove('dragging');
});

elSlider.addEventListener('input', () => {
  ensureAudio();
  const target = parseInt(elSlider.value, 10);
  refreshFromHistory(target);
  updateHUD(0.2);
});

// ============================================================
//  OrbitControls
// ============================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.minDistance = 6;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.46;
controls.minPolarAngle = 0.16;
controls.enablePan = false;
controls.target.set(0, 0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

// ============================================================
//  按钮
// ============================================================
const btnSpin = document.getElementById('btn-spin');

btnSpin.addEventListener('click', e => {
  e.stopPropagation();
  controls.autoRotate = !controls.autoRotate;
  btnSpin.classList.toggle('on', controls.autoRotate);
  btnSpin.textContent = controls.autoRotate ? '自动旋转' : '停止旋转';
});

document.getElementById('btn-clear').addEventListener('click', e => {
  e.stopPropagation();
  ensureAudio();

  board.fill(EMPTY);
  for (const mesh of stoneMeshes.values()) scene.remove(mesh);
  stoneMeshes.clear();
  moveHistory.length = 0;
  currentMove = 0;
  clearHighlights();
  anims.length = 0;
  nextColor = BLACK;
  updateHUD(0.2);
});

window.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); btnSpin.click(); }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
//  主循环
// ============================================================
let lastT = performance.now() / 1000;

function animate(nowMs) {
  requestAnimationFrame(animate);

  try {
    const t = nowMs / 1000;
    let dt = t - lastT;
    if (!isFinite(dt) || dt < 0) dt = 0.016;
    if (dt > 0.06) dt = 0.06;
    lastT = t;

    for (let i = anims.length - 1; i >= 0; i--) {
      const a = anims[i];
      a.t += dt / a.duration;
      if (a.t >= 1) a.t = 1;

      if (a.kind === 'spawn') {
        const k = a.t;
        const s = 1 + 1.6 * Math.pow(k - 1, 3) + 0.6 * Math.pow(k - 1, 2);
        const sc = Math.max(0.01, s);
        a.mesh.scale.set(sc, sc, sc);
        if (k >= 1) {
          a.mesh.scale.set(1, 1, 1);
          anims.splice(i, 1);
        }
      } else if (a.kind === 'capture') {
        const k = a.t;
        const sc = a.fromScale * (1 - k);
        a.mesh.scale.set(sc, sc, sc);
        a.mesh.rotation.y = k * Math.PI * 1.5;
        a.mesh.position.y = 0.075 + k * 0.85;
        if (k >= 1) {
          scene.remove(a.mesh);
          anims.splice(i, 1);
        }
      }
    }

    const pulse = 0.7 + 0.3 * Math.sin(t * 3.8);
    for (const gl of highlightState.stoneGlows) {
      if (gl.material) gl.material.opacity = 0.5 * pulse + 0.25;
    }
    for (const lr of highlightState.libertyRings) {
      if (lr.ring && lr.ring.material) {
        lr.ring.material.opacity = 0.6 + 0.35 * Math.sin(t * 4.2 + lr.phase);
      }
      if (lr.dot && lr.dot.material) {
        lr.dot.material.opacity = 0.7 + 0.28 * Math.sin(t * 4.2 + lr.phase);
      }
    }

    controls.update();
    renderer.render(scene, camera);

    updateHUD(dt);

  } catch (err) {
    console.warn('frame error', err);
  }
}

// ============================================================
//  启动
// ============================================================
setupInitialPosition();
requestAnimationFrame(animate);

window.addEventListener('pointerdown', function once() {
  ensureAudio();
  window.removeEventListener('pointerdown', once);
}, { once: true });

</script>
