<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schwarz P-曲面 · 三重周期极小曲面</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold {
            color: #d4a843;
            font-style: normal;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-style: normal;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-style: normal;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Schwarz P-曲面 · 三重周期极小曲面</h2>
        <div class="sub">Triply periodic minimal surface · Cos x + Cos y + Cos z = 0</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">z‑切片: cos x + cos y = −cos z₀</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">x‑切片: cos y + cos z = −cos x₀</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">对角切片: x+y = const</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 25);
        camera.position.set(4.5, 3.2, 8.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        let elapsed = 0;
        function tick() {
            elapsed = (performance.now() - startTime) * 0.001;
            return elapsed;
        }

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        const SCALE = 0.58;
        const RANGE = 2.4 * Math.PI;
        const STEP = 0.05;
        const NEWTON_ITERS = 2;

        // ---- 在2D隐式曲线上追踪：F(x,y)=cos x+cos y+C=0 ----
        function traceImplicit2D(x0, y0, C, maxSteps, range) {
            const pts = [];
            let x = x0,
                y = y0;
            const visited = new Set();

            for (let s = 0; s < maxSteps; s++) {
                if (Math.abs(x) > range || Math.abs(y) > range) break;
                const key = Math.round(x * 40) + ',' + Math.round(y * 40);
                if (visited.has(key) && s > 20) break;
                if (s > 20) visited.add(key);

                pts.push([x, y]);

                // 牛顿校正到曲线上
                for (let iter = 0; iter < NEWTON_ITERS; iter++) {
                    const F = Math.cos(x) + Math.cos(y) + C;
                    const gx = -Math.sin(x);
                    const gy = -Math.sin(y);
                    const gnorm2 = gx * gx + gy * gy;
                    if (gnorm2 < 1e-10) break;
                    const delta = F / gnorm2;
                    x -= delta * gx;
                    y -= delta * gy;
                }

                // 切线方向
                const tx = -Math.sin(y);
                const ty = Math.sin(x);
                const tnorm = Math.sqrt(tx * tx + ty * ty);
                if (tnorm < 1e-8) break;
                x += STEP * tx / tnorm;
                y += STEP * ty / tnorm;
            }
            return pts;
        }

        // 找到隐式曲线上的种子点（在y=某值的水平线上扫描）
        function findSeeds(C, range, numScans) {
            const seeds = [];
            const dy = 2 * range / numScans;
            for (let i = 0; i <= numScans; i++) {
                const y = -range + i * dy;
                // 扫描x，找到F(x,y)变号的位置
                const dx = 0.08;
                for (let x = -range; x <= range; x += dx) {
                    const F1 = Math.cos(x) + Math.cos(y) + C;
                    const F2 = Math.cos(x + dx) + Math.cos(y) + C;
                    if (F1 * F2 < 0) {
                        // 用二分法精确定位
                        let xa = x,
                            xb = x + dx;
                        for (let b = 0; b < 6; b++) {
                            const xm = (xa + xb) / 2;
                            const Fm = Math.cos(xm) + Math.cos(y) + C;
                            if (F1 * Fm < 0) { xb = xm; } else { xa = xm; }
                        }
                        const sx = (xa + xb) / 2;
                        // 检查是否远离已有种子
                        let tooClose = false;
                        for (const [sx2, sy2] of seeds) {
                            if (Math.abs(sx - sx2) < 0.25 && Math.abs(y - sy2) < 0.25) {
                                tooClose = true;
                                break;
                            }
                        }
                        if (!tooClose && Math.abs(sx) < range) {
                            seeds.push([sx, y]);
                        }
                    }
                }
            }
            return seeds;
        }

        // ---- 生成z=const切片曲线（金色）----
        function createZSliceCurves(zValues, color, range, numPoints) {
            const group = new THREE.Group();
            for (const z0 of zValues) {
                const C = Math.cos(z0);
                if (Math.abs(C) > 2) continue;
                const seeds = findSeeds(C, range, 40);
                const usedSeeds = new Set();
                for (const [sx, sy] of seeds) {
                    const key = Math.round(sx * 20) + ',' + Math.round(sy * 20);
                    if (usedSeeds.has(key)) continue;
                    usedSeeds.add(key);

                    const raw = traceImplicit2D(sx, sy, C, numPoints, range);
                    if (raw.length < 2) continue;
                    const pts3D = raw.map(([x, y]) => new THREE.Vector3(x, y, z0).multiplyScalar(SCALE));
                    const geom = new THREE.BufferGeometry().setFromPoints(pts3D);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.78, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // ---- 生成x=const切片曲线（青色）----
        function createXSliceCurves(xValues, color, range, numPoints) {
            const group = new THREE.Group();
            for (const x0 of xValues) {
                const C = Math.cos(x0);
                if (Math.abs(C) > 2) continue;
                // 在yz平面上追踪：cos y + cos z = -cos x0
                const seeds = findSeeds(C, range, 40);
                const usedSeeds = new Set();
                for (const [sy, sz] of seeds) {
                    const key = Math.round(sy * 20) + ',' + Math.round(sz * 20);
                    if (usedSeeds.has(key)) continue;
                    usedSeeds.add(key);
                    const raw = traceImplicit2D(sy, sz, C, numPoints, range);
                    if (raw.length < 2) continue;
                    const pts3D = raw.map(([y, z]) => new THREE.Vector3(x0, y, z).multiplyScalar(SCALE));
                    const geom = new THREE.BufferGeometry().setFromPoints(pts3D);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.78, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // ---- 生成对角切片曲线（品红）：x+y=const与曲面的交线 ----
        function createDiagonalCurves(constValues, color, range, numPoints) {
            const group = new THREE.Group();
            for (const c of constValues) {
                // 曲线在参数t下：x=t, y=c-t, z满足cos t+cos(c-t)+cos z=0
                const dt = 2 * range / numPoints;
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const t = -range + i * dt;
                    const x = t;
                    const y = c - t;
                    if (Math.abs(x) > range || Math.abs(y) > range) continue;
                    const cosZ = -(Math.cos(x) + Math.cos(y));
                    if (cosZ < -1 || cosZ > 1) continue;
                    const z = Math.acos(cosZ);
                    // z符号取正（上半部分），取负（下半部分）
                    pts.push(new THREE.Vector3(x, y, z).multiplyScalar(SCALE));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.7, depthWrite: true, depthTest: true
                    })));
                }
                // 负z分支
                const pts2 = [];
                for (let i = 0; i <= numPoints; i++) {
                    const t = -range + i * dt;
                    const x = t;
                    const y = c - t;
                    if (Math.abs(x) > range || Math.abs(y) > range) continue;
                    const cosZ = -(Math.cos(x) + Math.cos(y));
                    if (cosZ < -1 || cosZ > 1) continue;
                    const z = -Math.acos(cosZ);
                    pts2.push(new THREE.Vector3(x, y, z).multiplyScalar(SCALE));
                }
                if (pts2.length >= 2) {
                    const geom2 = new THREE.BufferGeometry().setFromPoints(pts2);
                    group.add(new THREE.Line(geom2, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.7, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // ---- 额外：x-y=const对角切片（另一方向）----
        function createDiagonalCurves2(constValues, color, range, numPoints) {
            const group = new THREE.Group();
            for (const c of constValues) {
                const dt = 2 * range / numPoints;
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const t = -range + i * dt;
                    const x = t;
                    const y = t - c;
                    if (Math.abs(x) > range || Math.abs(y) > range) continue;
                    const cosZ = -(Math.cos(x) + Math.cos(y));
                    if (cosZ < -1 || cosZ > 1) continue;
                    const z = Math.acos(cosZ);
                    pts.push(new THREE.Vector3(x, y, z).multiplyScalar(SCALE));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.6, depthWrite: true, depthTest: true
                    })));
                }
                const pts2 = [];
                for (let i = 0; i <= numPoints; i++) {
                    const t = -range + i * dt;
                    const x = t;
                    const y = t - c;
                    if (Math.abs(x) > range || Math.abs(y) > range) continue;
                    const cosZ = -(Math.cos(x) + Math.cos(y));
                    if (cosZ < -1 || cosZ > 1) continue;
                    const z = -Math.acos(cosZ);
                    pts2.push(new THREE.Vector3(x, y, z).multiplyScalar(SCALE));
                }
                if (pts2.length >= 2) {
                    const geom2 = new THREE.BufferGeometry().setFromPoints(pts2);
                    group.add(new THREE.Line(geom2, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.6, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'schwarz-P';
        scene.add(rootGroup);

        const traceRange = RANGE;
        const tracePoints = 380;

        // 金色：z切片
        const zCount = 30;
        const zValues = [];
        for (let i = 0; i < zCount; i++) {
            zValues.push(-traceRange + i * 2 * traceRange / (zCount - 1));
        }
        rootGroup.add(createZSliceCurves(zValues, COLOR_GOLD, traceRange, tracePoints));

        // 青色：x切片
        const xCount = 30;
        const xValues = [];
        for (let i = 0; i < xCount; i++) {
            xValues.push(-traceRange + i * 2 * traceRange / (xCount - 1));
        }
        rootGroup.add(createXSliceCurves(xValues, COLOR_CYAN, traceRange, tracePoints));

        // 品红：对角切片 x+y=const
        const diagCount = 32;
        const diagValues = [];
        for (let i = 0; i < diagCount; i++) {
            diagValues.push(-2.8 * Math.PI + i * 5.6 * Math.PI / (diagCount - 1));
        }
        rootGroup.add(createDiagonalCurves(diagValues, COLOR_MAGENTA, traceRange, 340));
        rootGroup.add(createDiagonalCurves2(diagValues, COLOR_MAGENTA, traceRange, 320));

        console.log('Schwarz P-曲面线条总数:', rootGroup.children.length);

        // ---- 背景星点 ----
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 600;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 12;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            tick();
            const t = elapsed;

            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.11;

            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 8.4;
            const camAngle = t * 0.08;
            const camHeight = 3.0 + Math.sin(t * 0.15) * 0.8;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Schwarz P-曲面三重周期极小曲面动画已稳定运行');
    </script>
</body>
</html>
