<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E8根系编织 · 例外李代数投影 · 三维对称网</title>
    <style>
        :root {
            --bg: #04040e;
            --gold: #d6a745;
            --cyan: #3dbca5;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.62rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 14, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.85rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.54rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3dbca5;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <h1>E8根系编织 · 例外李代数投影 · 三维对称网</h1>
        <div class="subtitle">240个E8根向量 &nbsp;·&nbsp; 8维旋转变换 &nbsp;·&nbsp; 投影至ℝ³</div>
    </div>
    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">⟨v,w⟩=1/2 边</span>
            ⊗ <span class="accent-cyan">⟨v,w⟩=−1/2 边</span>
            ⊗ <span class="accent-rose">⟨v,w⟩=0 边</span>
        </div>
        <div class="formula-detail">
            E₈根系 · 内积分类连接 · 动态8维正交变换 · 三维投影编织
        </div>
    </div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.3, 1.4, 7.8);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3dbca5');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // 背景星点
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 130;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.4 + Math.random() * 8.4;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSizes[i] = Math.random() * 1.5 + 0.2;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.018,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 48, 32);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.06, depthWrite: false })
        );
        scene.add(refSphereWire);
        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 26);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.05, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- E8根系生成 ----------
        function generateE8Roots() {
            const roots = [];
            // 类型1: (±1, ±1, 0,0,0,0,0,0) 所有排列，共112个
            for (let i = 0; i < 8; i++) {
                for (let j = i + 1; j < 8; j++) {
                    for (let si = -1; si <= 1; si += 2) {
                        for (let sj = -1; sj <= 1; sj += 2) {
                            const r = [0, 0, 0, 0, 0, 0, 0, 0];
                            r[i] = si;
                            r[j] = sj;
                            roots.push(r);
                        }
                    }
                }
            }
            // 类型2: (±1/2, ±1/2, ..., ±1/2) 偶数个负号
            for (let bits = 0; bits < 128; bits++) {
                const r = new Array(8);
                let negCount = 0;
                for (let k = 0; k < 8; k++) {
                    const sign = (bits >> k) & 1 ? -1 : 1;
                    r[k] = sign * 0.5;
                    if (sign === -1) negCount++;
                }
                if (negCount % 2 === 0) roots.push(r);
            }
            // 确保长度sqrt(2)
            return roots;
        }

        const roots = generateE8Roots();
        console.log('E8根数量:', roots.length);

        // 计算内积并分类边
        const edgesGold = [];
        const edgesCyan = [];
        const edgesRose = [];
        const THRESHOLD = 1e-9;

        for (let i = 0; i < roots.length; i++) {
            for (let j = i + 1; j < roots.length; j++) {
                const a = roots[i];
                const b = roots[j];
                let dot = 0;
                for (let k = 0; k < 8; k++) dot += a[k] * b[k];
                if (Math.abs(dot - 0.5) < THRESHOLD) edgesGold.push([i, j]);
                else if (Math.abs(dot + 0.5) < THRESHOLD) edgesCyan.push([i, j]);
                else if (Math.abs(dot) < THRESHOLD && Math.random() < 0.25) edgesRose.push([i, j]); // 只采样部分0内积边，避免过密
            }
        }
        console.log(`边分类: 金${edgesGold.length}, 青${edgesCyan.length}, 玫红${edgesRose.length}`);

        // ---------- 创建线条图层 ----------
        const VERTEX_COUNT = roots.length;
        const MAX_EDGES = edgesGold.length + edgesCyan.length + edgesRose.length;

        function createEdgeLayer(edgeArr, color) {
            if (edgeArr.length === 0) return null;
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(edgeArr.length * 6);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.82,
                depthTest: true,
                depthWrite: true,
            });
            const mesh = new THREE.LineSegments(geom, mat);
            scene.add(mesh);
            return { mesh, geom, positions, edges: edgeArr };
        }

        const goldLayer = createEdgeLayer(edgesGold, colorGold);
        const cyanLayer = createEdgeLayer(edgesCyan, colorCyan);
        const roseLayer = createEdgeLayer(edgesRose, colorRose);
        const layers = [goldLayer, cyanLayer, roseLayer].filter(Boolean);

        // 当前投影后的3D顶点坐标
        const projectedVerts = new Array(VERTEX_COUNT);
        for (let i = 0; i < VERTEX_COUNT; i++) projectedVerts[i] = [0, 0, 0];

        // 8维正交变换：同时在四个平面旋转
        function apply8DRotation(vec, angles) {
            let [x0, x1, x2, x3, x4, x5, x6, x7] = vec;
            // 平面 (0,1)
            const c0 = Math.cos(angles[0]),
                s0 = Math.sin(angles[0]);
            const nx0 = c0 * x0 - s0 * x1;
            const nx1 = s0 * x0 + c0 * x1;
            x0 = nx0;
            x1 = nx1;
            // 平面 (2,3)
            const c1 = Math.cos(angles[1]),
                s1 = Math.sin(angles[1]);
            const nx2 = c1 * x2 - s1 * x3;
            const nx3 = s1 * x2 + c1 * x3;
            x2 = nx2;
            x3 = nx3;
            // 平面 (4,5)
            const c2 = Math.cos(angles[2]),
                s2 = Math.sin(angles[2]);
            const nx4 = c2 * x4 - s2 * x5;
            const nx5 = s2 * x4 + c2 * x5;
            x4 = nx4;
            x5 = nx5;
            // 平面 (6,7)
            const c3 = Math.cos(angles[3]),
                s3 = Math.sin(angles[3]);
            const nx6 = c3 * x6 - s3 * x7;
            const nx7 = s3 * x6 + c3 * x7;
            return [nx0, nx1, nx2, nx3, nx4, nx5, nx6, nx7];
        }

        function clampPt(p) {
            let [x, y, z] = p;
            if (!Number.isFinite(x)) x = 0;
            if (!Number.isFinite(y)) y = 0;
            if (!Number.isFinite(z)) z = 0;
            const r = Math.sqrt(x * x + y * y + z * z);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const s = CLAMP_RADIUS / r;
                return [x * s, y * s, z * s];
            }
            return [x, y, z];
        }

        function updateAll(elapsed) {
            // 随时间变化的旋转角度
            const angles = [
                elapsed * 0.25,
                elapsed * 0.38,
                elapsed * 0.53,
                elapsed * 0.44,
            ];
            // 更新所有投影顶点
            for (let i = 0; i < VERTEX_COUNT; i++) {
                const r = roots[i];
                const rotated = apply8DRotation(r, angles);
                let p = [rotated[0], rotated[1], rotated[2]];
                const len = Math.sqrt(p[0] * p[0] + p[1] * p[1] + p[2] * p[2]);
                // 缩放以适应钳制球
                const sc = 1.8;
                p = [p[0] * sc, p[1] * sc, p[2] * sc];
                p = clampPt(p);
                projectedVerts[i] = p;
            }
            // 更新所有线段层
            for (const layer of layers) {
                const positions = layer.positions;
                const edges = layer.edges;
                for (let e = 0; e < edges.length; e++) {
                    const [i, j] = edges[e];
                    const p1 = projectedVerts[i];
                    const p2 = projectedVerts[j];
                    const base = e * 6;
                    positions[base] = p1[0];
                    positions[base + 1] = p1[1];
                    positions[base + 2] = p1[2];
                    positions[base + 3] = p2[0];
                    positions[base + 4] = p2[1];
                    positions[base + 5] = p2[2];
                }
                layer.geom.attributes.position.needsUpdate = true;
            }
        }

        // ---------- 粒子 ----------
        const particleCount = 24;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        // 取一些边用于粒子
        const sampleEdges = [...edgesGold, ...edgesCyan, ...edgesRose];
        for (let i = 0; i < particleCount; i++) {
            const edgeIdx = i % sampleEdges.length;
            particleData.push({
                edge: sampleEdges[edgeIdx],
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0022,
            });
            const col = i < 8 ? colorGold : i < 16 ? colorCyan : colorRose;
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.045,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const [i, j] = pd.edge;
                const p1 = projectedVerts[i] || [0, 0, 0];
                const p2 = projectedVerts[j] || [0, 0, 0];
                const t = pd.progress;
                particlePosArr[p * 3] = p1[0] + (p2[0] - p1[0]) * t;
                particlePosArr[p * 3 + 1] = p1[1] + (p2[1] - p1[1]) * t;
                particlePosArr[p * 3 + 2] = p1[2] + (p2[2] - p1[2]) * t;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // ---------- 动画循环（绝对时间） ----------
        const startTime = performance.now();
        let frameCount = 0,
            lastLogTime = startTime;

        function animate(nowTS) {
            requestAnimationFrame(animate);
            try {
                const now = nowTS || performance.now();
                const elapsed = (now - startTime) / 1000;
                frameCount++;
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${elapsed.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }
                updateAll(elapsed);
                updateParticles();

                const breathe = 1 + 0.04 * Math.sin(elapsed * 0.4);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += 0.0008;
                refSphereWire.rotation.y += 0.0007;
                refTorusWire.rotation.z += 0.0008;
                refTorusWire.scale.setScalar(1 + 0.05 * Math.sin(elapsed * 0.44));

                const camH = elapsed * 0.09;
                const camV = 0.32 + 0.18 * Math.sin(elapsed * 0.15);
                const camD = 7.5 + 0.6 * Math.sin(elapsed * 0.19);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0, 0, 0);
                stars.rotation.y += 0.0002;
                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环错误', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });

        // 启动
        console.log('🚀 E8根系动画初始化...');
        updateAll(0);
        updateParticles();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动（240个根，三族内积边，绝对时间驱动）');
    </script>
</body>
</html>
