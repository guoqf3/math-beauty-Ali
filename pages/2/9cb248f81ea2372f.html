<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极光流星 · 高速粒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .container {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.04);
            background: #0a0c14;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 600px;
            cursor: grab;
            background: radial-gradient(ellipse at 50% 50%, #11141f, #050609);
        }
        canvas:active {
            cursor: grabbing;
        }
        .fallback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.25);
            font-size: 18px;
            letter-spacing: 4px;
            pointer-events: none;
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 40px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
        }
        .credit {
            position: absolute;
            bottom: 20px;
            right: 28px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
            pointer-events: none;
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .hint {
            position: absolute;
            top: 20px;
            left: 28px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.5px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        @media (max-width: 1024px) {
            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1000 / 600;
            }
            .credit,
            .hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas" width="1000" height="600"></canvas>
        <div class="fallback" id="fallback">✦ 极光流星 · 请刷新页面 ✦</div>
        <div class="hint"><i>✦ 拖拽 · 粒子极速飞驰</i></div>
        <div class="credit">vibe <span>·</span> code</div>
    </div>

    <script>
        // ============================================================
        //  极光流星 · 高速粒子 (快速响应版)
        //  物理：高初始速度 + 低阻尼 + 强鼠标引力
        // ============================================================

        console.log('✅ 极光流星 加载开始');

        // 全局错误捕获：如果出错，显示备用文字
        window.addEventListener('error', function(e) {
            const fallback = document.getElementById('fallback');
            if (fallback) fallback.style.display = 'block';
            console.error('全局错误:', e.message);
        });

        // ---------- 获取元素 ----------
        const canvas = document.getElementById('canvas');
        const fallback = document.getElementById('fallback');

        if (!canvas) {
            console.error('❌ Canvas 元素未找到');
            if (fallback) fallback.style.display = 'block';
            throw new Error('Canvas 元素不存在');
        }

        let ctx = null;
        try {
            ctx = canvas.getContext('2d');
            if (!ctx) throw new Error('无法获取 2D 上下文');
        } catch (err) {
            console.error('❌ 上下文获取失败:', err.message);
            if (fallback) fallback.style.display = 'block';
            throw err;
        }

        console.log('✅ Canvas 就绪');

        const W = 1000,
            H = 600;

        // ---------- 状态 ----------
        let mouse = { x: -9999, y: -9999, active: false };
        let time = 0;

        // ---------- 高速粒子参数 ----------
        const NUM_PARTICLES = 220;        // 数量适中，保证高帧率
        const MOUSE_ATTRACT = 0.8;        // 鼠标引力增强 (原0.45)
        const DAMPING = 0.99;             // 阻尼降低 (原0.98) 让惯性更大
        const MAX_SPEED = 14;             // 速度上限提高 (原5)
        const INITIAL_SPEED_RANGE = 8;    // 初始速度幅度提高

        // ---------- 初始化粒子 ----------
        let particles = [];
        try {
            for (let i = 0; i < NUM_PARTICLES; i++) {
                particles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    // 初始速度：随机方向，速度范围 3~8
                    vx: (Math.random() - 0.5) * 2 * INITIAL_SPEED_RANGE,
                    vy: (Math.random() - 0.5) * 2 * INITIAL_SPEED_RANGE,
                    hue: 200 + Math.random() * 80, // 蓝紫-粉紫
                    size: 1.5 + Math.random() * 2.0,
                    phase: Math.random() * Math.PI * 2
                });
            }
            console.log('✅ 粒子初始化成功，数量:', NUM_PARTICLES);
        } catch (err) {
            console.error('❌ 粒子初始化失败:', err.message);
            if (fallback) fallback.style.display = 'block';
            throw err;
        }

        // ---------- 背景繁星 ----------
        let stars = [];
        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: 0.3 + Math.random() * 0.8,
                phase: Math.random() * Math.PI * 2
            });
        }

        // ---------- 物理更新 ----------
        function updatePhysics() {
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const p = particles[i];

                // 1. 鼠标强力吸引 (响应更快)
                if (mouse.active) {
                    const dx = mouse.x - p.x;
                    const dy = mouse.y - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 280 && dist > 0.5) { // 影响半径扩大
                        const force = (1 - dist / 280) * MOUSE_ATTRACT;
                        p.vx += (dx / dist) * force;
                        p.vy += (dy / dist) * force;
                    }
                    // 鼠标中心轻微排斥，避免粒子完全卡住
                    if (dist < 20 && dist > 0.5) {
                        const repel = (1 - dist / 20) * 0.3;
                        p.vx -= (dx / dist) * repel;
                        p.vy -= (dy / dist) * repel;
                    }
                }

                // 2. 阻尼 (低阻尼让速度保持)
                p.vx *= DAMPING;
                p.vy *= DAMPING;

                // 3. 速度限制 (允许更快)
                const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (sp > MAX_SPEED) {
                    p.vx = (p.vx / sp) * MAX_SPEED;
                    p.vy = (p.vy / sp) * MAX_SPEED;
                }

                // 4. 位置更新
                p.x += p.vx;
                p.y += p.vy;

                // 5. 环绕边界 (无缝衔接)
                if (p.x < 0) p.x += W;
                if (p.x > W) p.x -= W;
                if (p.y < 0) p.y += H;
                if (p.y > H) p.y -= H;
            }
        }

        // ---------- 渲染 ----------
        function draw() {
            // 透明背景：拖尾长度 (数值越大，拖尾越长)
            ctx.fillStyle = 'rgba(10, 12, 20, 0.10)';
            ctx.fillRect(0, 0, W, H);

            // ---- 1. 绘制粒子拖尾轨迹 (快速运动时的核心视觉) ----
            for (const p of particles) {
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (speed < 0.5) continue; // 静止粒子不画拖尾

                const hue = p.hue + Math.sin(time * 0.008 + p.phase) * 10;
                const alpha = 0.5 + speed * 0.03;
                const lineWidth = 1.0 + speed * 0.3;

                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, ${alpha * 0.15})`;
                ctx.strokeStyle = `hsla(${hue}, 90%, 65%, ${alpha})`;
                ctx.lineWidth = lineWidth;
                // 绘制短轨迹 (从前一帧位置到当前位置)
                // 因为半透明背景，我们直接用当前速度方向画一段线
                const trailLen = Math.min(speed * 0.8, 12);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - (p.vx / speed) * trailLen, p.y - (p.vy / speed) * trailLen);
                ctx.stroke();
            }

            ctx.shadowBlur = 0;

            // ---- 2. 绘制粒子主体 (发光光晕) ----
            for (const p of particles) {
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                const hue = p.hue + Math.sin(time * 0.008 + p.phase) * 10;
                const lightness = 55 + Math.min(speed * 4, 30);
                const size = p.size * (1 + speed * 0.05);

                const grad = ctx.createRadialGradient(
                    p.x - 1, p.y - 1, 0.5,
                    p.x, p.y, size * 2.5
                );
                grad.addColorStop(0, `hsla(${hue}, 100%, 85%, 0.95)`);
                grad.addColorStop(0.4, `hsla(${hue + 10}, 80%, 60%, 0.5)`);
                grad.addColorStop(1, `hsla(${hue + 20}, 70%, 40%, 0)`);

                ctx.shadowBlur = 25;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${0.2 + speed * 0.02})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size * 1.4, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // 核心高光
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x - 0.5, p.y - 0.5, size * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(0, 0%, 100%, ${0.3 + speed * 0.03})`;
                ctx.fill();
            }

            // ---- 3. 背景繁星 ----
            for (const star of stars) {
                const flicker = 0.5 + 0.5 * Math.sin(time * 0.02 + star.phase);
                const alpha = 0.1 + flicker * 0.25;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            }

            // ---- 4. 鼠标光晕 ----
            if (mouse.active) {
                const grad = ctx.createRadialGradient(
                    mouse.x, mouse.y, 0,
                    mouse.x, mouse.y, 220
                );
                grad.addColorStop(0, 'rgba(180, 200, 255, 0.06)');
                grad.addColorStop(0.5, 'rgba(100, 130, 255, 0.02)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 220, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ---------- 动画循环 ----------
        let animFrameId = null;

        function animate(timestamp) {
            try {
                time = timestamp || 0;
                updatePhysics();
                draw();
                animFrameId = requestAnimationFrame(animate);
            } catch (err) {
                console.error('❌ 动画循环出错:', err.message);
                if (fallback) fallback.style.display = 'block';
                if (animFrameId) cancelAnimationFrame(animFrameId);
            }
        }

        // ---------- 鼠标事件 ----------
        function handleMouseMove(e) {
            try {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                mouse.x = (e.clientX - rect.left) * scaleX;
                mouse.y = (e.clientY - rect.top) * scaleY;
                mouse.active = true;
            } catch (err) {}
        }

        function handleMouseLeave() {
            mouse.active = false;
        }

        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseleave', handleMouseLeave);

        // 触摸支持
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            try {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                mouse.x = (touch.clientX - rect.left) * scaleX;
                mouse.y = (touch.clientY - rect.top) * scaleY;
                mouse.active = true;
            } catch (err) {}
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            mouse.active = false;
        });

        // ---------- 窗口自适应 ----------
        function resizeCanvas() {
            try {
                const container = canvas.parentElement;
                const maxW = window.innerWidth - 40;
                const maxH = window.innerHeight - 40;
                const ratio = canvas.width / canvas.height;
                let w = Math.min(1000, maxW);
                let h = w / ratio;
                if (h > maxH) {
                    h = maxH;
                    w = h * ratio;
                }
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            } catch (err) {}
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ---------- 启动动画 ----------
        console.log('🚀 启动高速粒子动画');
        try {
            animate(0);
        } catch (err) {
            console.error('❌ 启动失败:', err.message);
            if (fallback) fallback.style.display = 'block';
        }

        // 兜底检测
        setTimeout(() => {
            if (fallback && !fallback.style.display) {
                const imageData = ctx.getImageData(0, 0, W, H).data;
                let isBlank = true;
                for (let i = 0; i < 1000; i++) {
                    if (imageData[i * 4 + 3] > 0) { isBlank = false; break; }
                }
                if (isBlank) {
                    console.warn('⚠️ 检测到空白帧，显示备用文字');
                    fallback.style.display = 'block';
                }
            }
        }, 3000);

        console.log('✅ 极光流星已就绪，快速移动鼠标感受速度！');
    </script>
</body>
</html>
