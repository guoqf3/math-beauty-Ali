<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竹影微风</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* 防黑屏兜底：与原图一致的淡黄宣纸底色 */
            background-color: #e9d9b8; 
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <!-- 引入 PixiJS 7 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>

    <script>
        // 1. 初始化 PixiJS 应用（匹配原图背景色）
        const app = new PIXI.Application({
            resizeTo: window,
            backgroundColor: 0xe9d9b8,
            antialias: true,
            autoDensity: true,
            resolution: window.devicePixelRatio || 1
        });
        document.getElementById('container').appendChild(app.view);

        // 2. 极简的宣纸纹理生成 (性能优化：一次生成，无限平铺)
        function createPaperTexture() {
            const g = new PIXI.Graphics();
            g.beginFill(0xe9d9b8);
            g.drawRect(0, 0, 256, 256);
            g.endFill();
            // 生成细微的颗粒噪点，还原宣纸质感
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const c = Math.random() > 0.5 ? 0xd1c0a3 : 0xf5ecd8;
                g.beginFill(c, 0.1);
                g.drawCircle(x, y, Math.random() * 1.5);
                g.endFill();
            }
            const tex = app.renderer.generateTexture(g);
            g.destroy();
            return tex;
        }

        const paperTex = createPaperTexture();
        const bg = new PIXI.TilingSprite(paperTex, app.screen.width, app.screen.height);
        app.stage.addChild(bg);

        // 3. 预生成竹叶纹理（模拟清晰与模糊层次）
        function createLeafTexture(color, alpha, isBlurred) {
            const g = new PIXI.Graphics();
            g.lineStyle(isBlurred ? 6 : 2, color, alpha);
            g.beginFill(color, alpha * 0.5);
            
            // 绘制经典的细长竹叶形状
            g.moveTo(0, 0);
            g.bezierCurveTo(10, -5, 30, -5, 50, 0);
            g.bezierCurveTo(30, 5, 10, 5, 0, 0);
            g.endFill();
            
            // 叶脉
            g.moveTo(0, 0);
            g.lineTo(50, 0);
            
            const tex = app.renderer.generateTexture(g);
            g.destroy();
            return tex;
        }

        const clearLeafTex = createLeafTexture(0x4b5f4b, 1.0, false);   // 近处清晰深绿
        const midLeafTex = createLeafTexture(0x6e7b6e, 0.6, true);      // 中景浅绿  
        const blurLeafTex = createLeafTexture(0x9a9c93, 0.3, true);     // 远景模糊灰绿

        // 4. 生成右侧的主竹竿
        const stalkG = new PIXI.Graphics();
        stalkG.beginFill(0x899b7e, 0.8);
        stalkG.drawRect(0, 0, 25, app.screen.height);
        stalkG.endFill();
        // 竹节
        stalkG.lineStyle(2, 0x5b6e54, 1);
        for(let i = 0; i < app.screen.height; i += 80) {
            stalkG.moveTo(0, i);
            stalkG.lineTo(25, i);
        }
        const stalkTex = app.renderer.generateTexture(stalkG);
        const stalk = new PIXI.Sprite(stalkTex);
        stalk.x = app.screen.width - 30;
        stalk.y = 0;
        app.stage.addChild(stalk);

        // 5. 核心对象池（大量使用 Sprite，完美突破性能瓶颈）
        const leaves = [];
        const totalCount = 180; // 丰富的数量

        for (let i = 0; i < totalCount; i++) {
            // 随机分配三种层次的叶子
            let tex;
            let baseAlpha;
            let rand = Math.random();
            if (rand > 0.85) { tex = clearLeafTex; baseAlpha = 1.0; }
            else if (rand > 0.4) { tex = midLeafTex; baseAlpha = 0.6; }
            else { tex = blurLeafTex; baseAlpha = 0.3; }

            const leaf = new PIXI.Sprite(tex);
            leaf.anchor.set(0, 0.5); // 左端作为支点，方便摇摆
            
            // 随机初始位置（重点分布在中下方，还原原图）
            leaf.x = Math.random() * app.screen.width * 1.2;
            leaf.y = app.screen.height * 0.3 + Math.random() * app.screen.height * 0.7;
            
            // 随机大小和旋转
            const scale = 0.5 + Math.random() * 1.5;
            leaf.scale.set(scale * (Math.random() > 0.5 ? 1 : -1), scale);
            leaf.rotation = (Math.random() - 0.5) * Math.PI * 0.8;
            
            // 随机抖动参数（模拟微风）
            leaf.phase = Math.random() * Math.PI * 2;
            leaf.swaySpeed = 0.5 + Math.random() * 1.5; // 速度较快
            leaf.baseAlpha = baseAlpha;
            leaf.alpha = baseAlpha;

            app.stage.addChild(leaf);
            leaves.push(leaf);
        }

        // 6. 鼠标交互变量
        const mouse = { x: -9999, y: -9999 }; // 初始放屏幕外防误判
        let shakeForce = 0; // 点击时的冲击力

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', () => {
            shakeForce = 1.0; // 点击引发大范围抖动
        });

        // 7. 动画主循环
        app.ticker.add((delta) => {
            const dt = delta / 60;

            // 鼠标冲击衰减
            shakeForce *= 0.92;
            if (shakeForce < 0.01) shakeForce = 0;

            leaves.forEach(leaf => {
                // 基础微风摇曳动画（速度明快）
                leaf.rotation += Math.sin(app.ticker.lastTime / 1000 * leaf.swaySpeed + leaf.phase) * 0.002 * dt;

                // 鼠标交互：靠近的叶子摇摆加剧，且产生微弱的排斥
                const dx = leaf.x - mouse.x;
                const dy = leaf.y - mouse.y;
                // 防除零报错保护
                const dist = Math.sqrt(dx * dx + dy * dy) + 0.001; 

                if (dist < 200) {
                    const force = (200 - dist) / 200;
                    // 增强摇摆效果
                    leaf.rotation += Math.sin(app.ticker.lastTime / 100) * force * 0.02;
                    // 微小位移排斥
                    leaf.x += (dx / dist) * force * 2 * dt;
                    leaf.y += (dy / dist) * force * 2 * dt;
                }

                // 点击带来的大幅震动
                if (shakeForce > 0) {
                    leaf.rotation += (Math.random() - 0.5) * shakeForce * 0.2;
                }

                // 限制叶子不飞出屏外
                if (leaf.x < -100) leaf.x = app.screen.width + 100;
                if (leaf.x > app.screen.width + 100) leaf.x = -100;
                if (leaf.y < -100) leaf.y = app.screen.height + 100;
                if (leaf.y > app.screen.height + 100) leaf.y = -100;
            });
        });

        // 窗口大小调整适配
        window.addEventListener('resize', () => {
            app.renderer.resize(window.innerWidth, window.innerHeight);
            bg.width = app.screen.width;
            bg.height = app.screen.height;
            stalk.width = 25;
            stalk.height = app.screen.height;
            stalk.x = app.screen.width - 30;
        });
    </script>
</body>
</html>
