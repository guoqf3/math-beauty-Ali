<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素星云 · 数字漩涡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a16;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0f0f24 0%, #06060e 100%);
            cursor: none;
        }

        /* 极简水印 */
        .credit {
            position: fixed;
            bottom: 22px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(140, 180, 255, 0.12);
            font-size: 13px;
            letter-spacing: 4px;
            font-weight: 300;
            pointer-events: none;
            user-select: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-shadow: 0 0 20px rgba(100, 150, 255, 0.05);
        }
        .credit span {
            display: inline-block;
            animation: softPulse 5s ease-in-out infinite;
        }
        @keyframes softPulse {
            0%,
            100% {
                opacity: 0.12;
            }
            50% {
                opacity: 0.35;
            }
        }

        /* 入场渐入 */
        body {
            opacity: 0;
            animation: fadeIn 0.9s ease forwards;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="credit"><span>✦ 像 素 星 云 · 数 字 漩 涡 ✦</span></div>

    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // ---------- 尺寸自适应 ----------
            let W, H, centerX, centerY;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                centerX = W / 2;
                centerY = H / 2;
            }
            window.addEventListener('resize', resize);
            resize();

            // ---------- 配置 ----------
            const CONFIG = {
                particleCount: 580,
                minRadius: 30,
                maxRadius: 340,
                minSize: 3,
                maxSize: 18,
                rotationSpeed: 0.0006,
                radialPulse: 0.003,
                mouseInfluence: 40,
                mouseRadius: 200,
                hueOffsetSpeed: 0.08,
            };

            // ---------- 粒子系统 ----------
            let particles = [];

            function createParticle() {
                // 分布：偏向外部多一些，形成星云感
                const r = CONFIG.minRadius + Math.pow(Math.random(), 0.7) * (CONFIG.maxRadius - CONFIG.minRadius);
                const angle = Math.random() * Math.PI * 2;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);

                // 颜色：基于角度和半径
                const hue = (angle / (Math.PI * 2) * 360 + r * 0.12) % 360;
                const sat = 70 + Math.random() * 25;
                const lig = 55 + Math.random() * 30;

                // 大小：随半径变化，外部稍大
                const sizeFactor = 0.6 + (r - CONFIG.minRadius) / (CONFIG.maxRadius - CONFIG.minRadius) * 0.6;
                const size = CONFIG.minSize + Math.random() * (CONFIG.maxSize - CONFIG.minSize) * sizeFactor;

                return {
                    // 极坐标
                    angle: angle,
                    radius: r,
                    // 速度扰动
                    angleSpeed: (0.6 + Math.random() * 0.8) * CONFIG.rotationSpeed * (1 - r / CONFIG.maxRadius * 0.3),
                    radialSpeed: (Math.random() - 0.5) * CONFIG.radialPulse * 2,
                    // 颜色
                    hue: hue,
                    sat: sat,
                    lig: lig,
                    // 大小
                    size: size,
                    // 闪烁
                    flicker: Math.random() * Math.PI * 2,
                    flickerSpeed: 0.01 + Math.random() * 0.03,
                    // 透明度基准
                    baseAlpha: 0.7 + Math.random() * 0.3,
                    // 鼠标影响偏移
                    offsetX: 0,
                    offsetY: 0,
                };
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    particles.push(createParticle());
                }
            }
            initParticles();

            // 窗口大小变化时重新分布粒子（保持比例）
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    resize();
                    // 调整粒子位置到新中心
                    for (const p of particles) {
                        const x = centerX + p.radius * Math.cos(p.angle);
                        const y = centerY + p.radius * Math.sin(p.angle);
                        // 不做剧烈重置，只是让中心对齐
                    }
                }, 200);
            });

            // ---------- 鼠标 ----------
            let mouse = { x: centerX, y: centerY, active: false };

            canvas.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            });
            canvas.addEventListener('mouseleave', () => {
                mouse.active = false;
            });

            canvas.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                mouse.x = t.clientX;
                mouse.y = t.clientY;
                mouse.active = true;
            }, { passive: true });
            canvas.addEventListener('touchend', () => {
                mouse.active = false;
            });

            // ---------- 更新粒子 ----------
            function updateParticles(time) {
                const timeFactor = time * 0.001;

                for (const p of particles) {
                    // 角度旋转（差速）
                    p.angle += p.angleSpeed;

                    // 径向微振动
                    p.radius += p.radialSpeed;
                    // 限制半径范围
                    if (p.radius < CONFIG.minRadius) p.radius = CONFIG.minRadius;
                    if (p.radius > CONFIG.maxRadius) p.radius = CONFIG.maxRadius;

                    // 闪烁
                    p.flicker += p.flickerSpeed;
                    const flickerAlpha = 0.7 + 0.3 * Math.sin(p.flicker);

                    // 颜色流动（色相缓慢变化）
                    p.hue = (p.hue + CONFIG.hueOffsetSpeed * 0.01) % 360;

                    // 鼠标影响
                    let offsetX = 0,
                        offsetY = 0;
                    if (mouse.active) {
                        const baseX = centerX + p.radius * Math.cos(p.angle);
                        const baseY = centerY + p.radius * Math.sin(p.angle);
                        const dx = mouse.x - baseX;
                        const dy = mouse.y - baseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.mouseRadius && dist > 1) {
                            const strength = 1 - dist / CONFIG.mouseRadius;
                            const angleToMouse = Math.atan2(dy, dx);
                            const push = strength * CONFIG.mouseInfluence;
                            offsetX = Math.cos(angleToMouse) * push;
                            offsetY = Math.sin(angleToMouse) * push;
                            // 鼠标附近加速旋转
                            p.angleSpeed += (0.001 - p.angleSpeed * 0.02) * strength * 0.5;
                            p.angleSpeed = Math.min(Math.max(p.angleSpeed, 0.0001), 0.003);
                        }
                    }
                    p.offsetX = offsetX;
                    p.offsetY = offsetY;

                    // 存储当前透明度供绘制使用
                    p.currentAlpha = p.baseAlpha * flickerAlpha;
                }
            }

            // ---------- 绘制粒子 ----------
            function drawParticles() {
                // 先绘制一层光晕背景（极淡）
                const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CONFIG.maxRadius * 1.2);
                grad.addColorStop(0, 'rgba(40, 60, 120, 0.04)');
                grad.addColorStop(0.5, 'rgba(80, 40, 160, 0.04)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // 绘制粒子
                for (const p of particles) {
                    const baseX = centerX + p.radius * Math.cos(p.angle);
                    const baseY = centerY + p.radius * Math.sin(p.angle);
                    const x = baseX + p.offsetX;
                    const y = baseY + p.offsetY;

                    // 裁剪：只绘制可视区域内的粒子
                    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;

                    const size = p.size;
                    const alpha = p.currentAlpha;

                    // 发光效果
                    const glowSize = size * 0.9;
                    ctx.shadowColor = `hsl(${p.hue}, ${p.sat}%, ${p.lig}%)`;
                    ctx.shadowBlur = glowSize;

                    // 主方块
                    ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.lig}%, ${alpha * 0.92})`;
                    ctx.fillRect(x - size / 2, y - size / 2, size, size);

                    // 高光核心（小亮点）
                    if (size > 6) {
                        ctx.shadowBlur = glowSize * 0.5;
                        ctx.fillStyle = `hsla(${p.hue}, 100%, 85%, ${alpha * 0.25})`;
                        const innerSize = size * 0.35;
                        ctx.fillRect(x - innerSize / 2, y - innerSize / 2, innerSize, innerSize);
                    }

                    // 重置阴影
                    ctx.shadowBlur = 0;
                }
            }

            // ---------- 绘制背景星点 ----------
            let stars = [];

            function initStars() {
                stars = [];
                for (let i = 0; i < 140; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: 0.3 + Math.random() * 1.2,
                        alpha: 0.1 + Math.random() * 0.5,
                        speed: 0.002 + Math.random() * 0.01,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }
            initStars();

            function drawStars(time) {
                for (const s of stars) {
                    const a = s.alpha * (0.5 + 0.5 * Math.sin(time * s.speed + s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(180, 200, 255, ${a * 0.4})`;
                    ctx.fill();
                }
            }

            // ---------- 绘制边缘淡出 ----------
            function drawVignette() {
                const grad = ctx.createRadialGradient(centerX, centerY, CONFIG.maxRadius * 0.4, centerX, centerY, CONFIG
                    .maxRadius * 1.6);
                grad.addColorStop(0, 'rgba(10, 10, 22, 0)');
                grad.addColorStop(0.6, 'rgba(10, 10, 22, 0)');
                grad.addColorStop(1, 'rgba(10, 10, 22, 0.6)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }

            // ---------- 鼠标光晕 ----------
            function drawMouseGlow() {
                if (!mouse.active) return;
                const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 120);
                grad.addColorStop(0, 'rgba(120, 180, 255, 0.05)');
                grad.addColorStop(0.5, 'rgba(80, 120, 255, 0.025)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(mouse.x - 120, mouse.y - 120, 240, 240);
            }

            // ---------- 主循环 ----------
            let frameId = null;
            let startTime = performance.now();

            function render(timestamp) {
                const time = timestamp - startTime;

                // 清空画布（背景由CSS处理）
                ctx.clearRect(0, 0, W, H);

                // 1. 绘制星点
                drawStars(time);

                // 2. 更新粒子
                updateParticles(time);

                // 3. 绘制粒子
                drawParticles();

                // 4. 边缘淡出
                drawVignette();

                // 5. 鼠标光晕
                drawMouseGlow();

                frameId = requestAnimationFrame(render);
            }

            // ---------- 启动 ----------
            // 先绘制一帧，确保不白屏
            function initialDraw() {
                ctx.clearRect(0, 0, W, H);
                drawStars(0);
                // 预置粒子初始位置
                for (const p of particles) {
                    p.angle = Math.random() * Math.PI * 2;
                    p.radius = CONFIG.minRadius + Math.random() * (CONFIG.maxRadius - CONFIG.minRadius);
                }
                drawParticles();
                drawVignette();
            }

            initialDraw();

            // 启动动画
            if (frameId) cancelAnimationFrame(frameId);
            frameId = requestAnimationFrame(render);

            // ---------- 可见性优化 ----------
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (frameId) {
                        cancelAnimationFrame(frameId);
                        frameId = null;
                    }
                } else {
                    if (!frameId) {
                        startTime = performance.now() - (performance.now() - startTime);
                        frameId = requestAnimationFrame(render);
                    }
                }
            });

            // ---------- 控制台 ----------
            console.log('%c✦ 像素星云 · 数字漩涡 ✦', 'font-size:18px; color:#a855f7;');
            console.log('%c移动鼠标 / 触摸 扰动星云', 'font-size:13px; color:#60a5fa;');

            // 窗口变化时重新生成星星
            window.addEventListener('resize', () => {
                setTimeout(() => {
                    for (const s of stars) {
                        s.x = Math.random() * W;
                        s.y = Math.random() * H;
                    }
                }, 300);
            });

        })();
    </script>

</body>
</html>
