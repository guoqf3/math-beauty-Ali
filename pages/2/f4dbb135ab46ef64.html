<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>布朗运动 · 随机游走 · Brownian Motion</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060e;}
  canvas{display:block;position:fixed;inset:0;touch-action:none;}

  .hud{
    position:fixed;pointer-events:none;z-index:5;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
  }

  /* ---------- 左上：标题 + 公式 ---------- */
  .hud-tl{
    top:clamp(16px,3vh,40px);
    left:clamp(16px,3vw,50px);
  }
  .hud-tl h1{
    font-size:clamp(15px,2.0vw,27px);
    font-weight:500;
    letter-spacing:.2em;
    color:#e9fbff;
    white-space:nowrap;
    text-shadow:0 0 10px #3ad2ff,0 0 34px #1a6aff,0 0 72px #8a2cff;
  }
  .hud-tl .en{
    margin-top:.6em;
    font-size:clamp(8px,.82vw,11px);
    letter-spacing:.4em;
    color:#5aa8cc;
    text-shadow:0 0 8px rgba(58,210,255,.55);
    white-space:nowrap;
  }
  .rule{
    margin:1.1em 0 1em;
    width:clamp(130px,17vw,250px);
    height:1px;
    background:linear-gradient(90deg,#3ad2ff,rgba(58,210,255,0));
    box-shadow:0 0 10px #3ad2ff;
  }
  .eq{
    font-size:clamp(10px,1.05vw,14px);
    letter-spacing:.07em;
    line-height:2.0;
    color:#a9e6ff;
    white-space:nowrap;
    text-shadow:0 0 10px rgba(58,210,255,.8);
  }
  .eq .hl{color:#ff9df0;text-shadow:0 0 12px #ff4de0,0 0 30px #a416ff;}
  .eq2{
    margin-top:.35em;
    color:#ffd8fb;
    text-shadow:0 0 12px rgba(255,90,230,.9),0 0 32px rgba(160,40,255,.6);
  }

  /* ---------- 右下：实时读数 ---------- */
  .hud-br{
    right:clamp(16px,3vw,50px);
    bottom:clamp(92px,15vh,132px);
    text-align:right;
    font-size:clamp(9px,.9vw,12px);
    letter-spacing:.18em;
    line-height:2.05;
    color:#6ec4e6;
    text-shadow:0 0 9px rgba(58,210,255,.65);
  }
  .hud-br b{color:#ffb3f4;font-weight:400;text-shadow:0 0 12px #ff4de0;}
  .hud-br .dim{color:#3f7a99;}

  /* ---------- 左侧竖条装饰 ---------- */
  .hud-line{
    position:fixed;left:clamp(7px,1.3vw,21px);top:50%;
    transform:translateY(-50%);
    width:1px;height:32vh;z-index:5;pointer-events:none;
    background:linear-gradient(180deg,transparent,#3ad2ff,transparent);
    opacity:.45;box-shadow:0 0 12px #3ad2ff;
  }

  /* ---------- 控制面板 ---------- */
  .panel{
    position:fixed;left:50%;bottom:clamp(16px,3.6vh,42px);
    transform:translateX(-50%);
    z-index:10;
    display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);
    padding:clamp(9px,1.2vh,15px) clamp(16px,2.2vw,30px);
    border:1px solid rgba(90,215,255,.28);
    border-radius:44px;
    background:rgba(7,20,42,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(9px,.95vw,12px);
    letter-spacing:.18em;
    color:#8fd8f5;
    box-shadow:0 0 30px rgba(30,120,255,.18),inset 0 0 22px rgba(58,210,255,.06);
    white-space:nowrap;
  }
  .panel .lab{color:#5fa6c8;}
  .panel .val{
    min-width:7.2em;color:#ffb3f4;
    text-shadow:0 0 12px #ff4de0;
    font-variant-numeric:tabular-nums;
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:clamp(110px,17vw,240px);height:2px;
    border-radius:2px;outline:none;
    background:linear-gradient(90deg,#3ad2ff,#9b6bff,#ff4de0);
    box-shadow:0 0 10px rgba(58,210,255,.6);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:#fff;cursor:pointer;
    box-shadow:0 0 12px #3ad2ff,0 0 26px #ff4de0;
    transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22);}
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:#fff;cursor:pointer;
    box-shadow:0 0 12px #3ad2ff,0 0 26px #ff4de0;
  }

  /* ---------- 启动提示 ---------- */
  #start{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    z-index:30;cursor:pointer;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(10px,1vw,13px);
    letter-spacing:.32em;
    color:#b0ecff;
    padding:13px 30px;
    border:1px solid rgba(90,220,255,.45);
    border-radius:44px;
    background:rgba(8,26,54,.5);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    text-shadow:0 0 10px #3ad2ff;
    animation:breathe 2.6s ease-in-out infinite;
    transition:opacity .8s ease,transform .8s ease;
    white-space:nowrap;
  }
  #start.hide{
    opacity:0;pointer-events:none;
    transform:translate(-50%,-50%) scale(.94);
  }
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 rgba(58,210,255,0);border-color:rgba(90,220,255,.3);}
    50%{box-shadow:0 0 30px rgba(58,210,255,.55),inset 0 0 20px rgba(58,210,255,.12);border-color:rgba(150,240,255,.85);}
  }

  /* ---------- 扫描线 & 暗角 ---------- */
  .scan{
    position:fixed;inset:0;z-index:6;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.5;
  }
  .vig{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 50% 52%,transparent 32%,rgba(0,0,0,.7) 100%);
  }

  @media (max-width:560px){
    .hud-br{display:none;}
    .hud-tl .en{letter-spacing:.26em;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vig"></div>
<div class="scan"></div>
<div class="hud-line"></div>

<div class="hud hud-tl">
  <h1>布朗运动 · 随机游走</h1>
  <div class="en">BROWNIAN MOTION · RANDOM WALK · 3D</div>
  <div class="rule"></div>
  <div class="eq">⟨r²⟩ = 2dDt &nbsp;(d = 3) &nbsp;·&nbsp; 高斯分布</div>
  <div class="eq eq2">D = k<sub>B</sub>T / (6πηr)</div>
</div>

<div class="hud hud-br">
  <div class="dim">—— 实时测量 ——</div>
  <div>温度 T <b id="r-T">1.00</b> a.u.</div>
  <div>扩散系数 D <b id="r-D">0.82</b> a.u.</div>
  <div>⟨r²⟩ <b id="r-R2">0.000</b></div>
  <div>粒子数 N <b>240</b> · 维数 d <b>3</b></div>
</div>

<div class="panel">
  <span class="lab">温度 T</span>
  <input type="range" id="temp" min="0.15" max="3.0" step="0.01" value="1.00">
  <span class="val" id="tempval">1.00 a.u.</span>
</div>

<div id="start">点击任意处 · 启动音效</div>

<script>
(function () {
'use strict';

/* ======================================================================
   0 · 画布 & 尺寸
   ====================================================================== */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const TAU    = Math.PI * 2;

let W = 0, H = 0, DPR = 1, S = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);
  pScale = S * 0.42;
}
window.addEventListener('resize', resize, { passive: true });

/* ======================================================================
   1 · 三维投影
   ====================================================================== */
const YAW   = 0.52;
const PITCH = 0.36;
const CAMD  = 3.4;

const cY = Math.cos(YAW),  sY = Math.sin(YAW);
const cP = Math.cos(PITCH), sP = Math.sin(PITCH);

let pScale = 340;

function project(x, y, z) {
  const X1 =  x * cY + z * sY;
  const Z1 = -x * sY + z * cY;
  const Y2 =  y * cP - Z1 * sP;
  const Z2 =  y * sP + Z1 * cP;
  const d  = CAMD + Z2;
  const f  = pScale * 2.6 / (d > 0.55 ? d : 0.55);
  return {
    x: W * 0.5 + X1 * f,
    y: H * 0.52 - Y2 * f,
    z: Z2,
    f: f
  };
}

/* ======================================================================
   2 · 光点精灵（按色相预渲染，避免每帧创建渐变）
   ====================================================================== */
const HUE_STEPS = 36;
const sprites = [];

(function buildSprites() {
  const SZ = 64;
  for (let i = 0; i < HUE_STEPS; i++) {
    const hue = i * 360 / HUE_STEPS;
    const cv = document.createElement('canvas');
    cv.width = cv.height = SZ;
    const g2 = cv.getContext('2d');

    const g = g2.createRadialGradient(SZ / 2, SZ / 2, 0, SZ / 2, SZ / 2, SZ / 2);
    g.addColorStop(0.00, 'hsla(' + hue + ',100%,96%,1)');
    g.addColorStop(0.14, 'hsla(' + hue + ',100%,80%,0.85)');
    g.addColorStop(0.34, 'hsla(' + hue + ',100%,64%,0.34)');
    g.addColorStop(0.62, 'hsla(' + hue + ',100%,58%,0.10)');
    g.addColorStop(1.00, 'hsla(' + hue + ',100%,55%,0)');

    g2.fillStyle = g;
    g2.fillRect(0, 0, SZ, SZ);
    sprites.push(cv);
  }
})();

/* ======================================================================
   3 · 背景
   ====================================================================== */
const stars = [];
(function seed() {
  let s = 13572468;
  const rnd = function () {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  };
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: rnd(), y: rnd(),
      r: rnd() * 1.4 + 0.3,
      p: rnd() * TAU,
      sp: 0.4 + rnd() * 1.6
    });
  }
})();

const BLOBS = [
  { h: 198, x: 0.25, y: 0.32, r: 0.56, sp:  0.10 },
  { h: 292, x: 0.76, y: 0.44, r: 0.50, sp: -0.085 },
  { h: 336, x: 0.50, y: 0.76, r: 0.46, sp:  0.12 },
  { h: 170, x: 0.11, y: 0.68, r: 0.40, sp: -0.07 }
];

let time = 0;

function drawBackground() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#04060e';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  const md = Math.min(W, H);

  for (let i = 0; i < BLOBS.length; i++) {
    const b  = BLOBS[i];
    const px = W * (b.x + 0.06 * Math.sin(time * b.sp * 2.1 + i * 1.7));
    const py = H * (b.y + 0.05 * Math.cos(time * b.sp * 1.7 + i * 2.3));
    const r  = md * b.r * (1 + 0.14 * Math.sin(time * 0.6 + i));
    const hue = b.h + 22 * Math.sin(time * 0.27 + i);

    const g = ctx.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0.00, 'hsla(' + hue + ',95%,58%,0.24)');
    g.addColorStop(0.45, 'hsla(' + (hue + 25) + ',95%,50%,0.08)');
    g.addColorStop(1.00, 'hsla(' + (hue + 50) + ',95%,50%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(px - r, py - r, r * 2, r * 2);
  }

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const a = 0.06 + 0.30 * Math.abs(Math.sin(time * s.sp + s.p));
    ctx.fillStyle = 'rgba(170,228,255,' + a.toFixed(3) + ')';
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
}

/* ======================================================================
   4 · 约束球（容器）线框
   ====================================================================== */
const R_BOUND = 1.0;

function drawContainer() {
  const R = R_BOUND;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 0.7;

  /* 纬线 */
  ctx.strokeStyle = 'rgba(70,140,220,0.055)';
  const LAT = 5, LON = 26;
  for (let i = 1; i < LAT; i++) {
    const th = i / LAT * Math.PI;
    const y  = R * Math.cos(th);
    const rr = R * Math.sin(th);
    ctx.beginPath();
    for (let k = 0; k <= LON; k++) {
      const a = k / LON * TAU;
      const p = project(rr * Math.cos(a), y, rr * Math.sin(a));
      if (k === 0) ctx.moveTo(p.x, p.y);
      else         ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  /* 经线 */
  ctx.strokeStyle = 'rgba(70,140,220,0.045)';
  for (let j = 0; j < 8; j++) {
    const a = j / 8 * Math.PI;
    ctx.beginPath();
    for (let k = 0; k <= LON; k++) {
      const t = k / LON * TAU;
      const p = project(
        R * Math.sin(t) * Math.cos(a),
        R * Math.cos(t),
        R * Math.sin(t) * Math.sin(a)
      );
      if (k === 0) ctx.moveTo(p.x, p.y);
      else         ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  /* 赤道强光 */
  ctx.strokeStyle = 'rgba(90,190,255,0.075)';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  for (let k = 0; k <= 64; k++) {
    const a = k / 64 * TAU;
    const p = project(R * Math.cos(a), 0, R * Math.sin(a));
    if (k === 0) ctx.moveTo(p.x, p.y);
    else         ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
}

/* ======================================================================
   5 · 粒子系统（布朗运动）
   ====================================================================== */
const NP       = 240;   // 粒子数
const TRAIL    = 26;    // 轨迹采样点数
const COLL_R   = 0.055; // 碰撞半径
const DAMP     = 1.7;   // 速度阻尼（摩擦）
const V_RMS0   = 0.70;  // 基准均方根速率

let temp = 1.0;

const parts = [];

function makeParticle(i) {
  /* 初始位置：中心附近的小球内均匀分布 */
  let x, y, z, d2;
  do {
    x = Math.random() * 2 - 1;
    y = Math.random() * 2 - 1;
    z = Math.random() * 2 - 1;
    d2 = x * x + y * y + z * z;
  } while (d2 > 1);

  const s = 0.30 * Math.cbrt(Math.random()) / Math.sqrt(d2 || 1);
  const px = x * s, py = y * s, pz = z * s;

  const tx = new Float32Array(TRAIL);
  const ty = new Float32Array(TRAIL);
  const tz = new Float32Array(TRAIL);
  for (let k = 0; k < TRAIL; k++) {
    tx[k] = px; ty[k] = py; tz[k] = pz;
  }

  return {
    x: px, y: py, z: pz,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    vz: (Math.random() - 0.5) * 0.4,
    hue: (i / NP) * 360 + Math.random() * 24,
    tx: tx, ty: ty, tz: tz
  };
}

for (let i = 0; i < NP; i++) parts.push(makeParticle(i));

/* --- 高斯随机数（Box–Muller，带缓存） --- */
let gaussCache = null;
function gauss() {
  if (gaussCache !== null) {
    const v = gaussCache;
    gaussCache = null;
    return v;
  }
  let u = 0, v = 0, s = 0;
  do {
    u = Math.random() * 2 - 1;
    v = Math.random() * 2 - 1;
    s = u * u + v * v;
  } while (s >= 1 || s === 0);
  const m = Math.sqrt(-2 * Math.log(s) / s);
  gaussCache = v * m;
  return u * m;
}

/* --- 物理步进 --- */
function stepPhysics(dt) {
  const decay = Math.exp(-DAMP * dt);
  const sigma = V_RMS0 * Math.sqrt(temp) * Math.sqrt(2 * DAMP);
  const kick  = sigma * Math.sqrt(dt);

  const R  = R_BOUND;
  const R2 = R * R;

  /* 1) 随机游走（Ornstein–Uhlenbeck） */
  for (let i = 0; i < NP; i++) {
    const p = parts[i];

    p.vx = p.vx * decay + gauss() * kick;
    p.vy = p.vy * decay + gauss() * kick;
    p.vz = p.vz * decay + gauss() * kick;

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;

    /* 球壁反射 */
    const r2 = p.x * p.x + p.y * p.y + p.z * p.z;
    if (r2 > R2) {
      const r  = Math.sqrt(r2);
      const nx = p.x / r, ny = p.y / r, nz = p.z / r;

      p.x = nx * R; p.y = ny * R; p.z = nz * R;

      const vn = p.vx * nx + p.vy * ny + p.vz * nz;
      if (vn > 0) {
        p.vx -= 2 * vn * nx;
        p.vy -= 2 * vn * ny;
        p.vz -= 2 * vn * nz;
      }
    }
  }

  /* 2) 粒子间碰撞（等质量弹性碰撞） */
  const minD  = 2 * COLL_R;
  const minD2 = minD * minD;
  let hit = false;
  let hitSpeed = 0;

  for (let i = 0; i < NP; i++) {
    const a = parts[i];
    for (let j = i + 1; j < NP; j++) {
      const b = parts[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dz = b.z - a.z;
      const d2 = dx * dx + dy * dy + dz * dz;

      if (d2 < minD2 && d2 > 1e-10) {
        const d  = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d, nz = dz / d;

        /* 位置分离 */
        const over = (minD - d) * 0.5;
        a.x -= nx * over; a.y -= ny * over; a.z -= nz * over;
        b.x += nx * over; b.y += ny * over; b.z += nz * over;

        /* 法向速度交换 */
        const va = a.vx * nx + a.vy * ny + a.vz * nz;
        const vb = b.vx * nx + b.vy * ny + b.vz * nz;
        const rel = va - vb;

        if (rel > 0) {
          a.vx -= rel * nx; a.vy -= rel * ny; a.vz -= rel * nz;
          b.vx += rel * nx; b.vy += rel * ny; b.vz += rel * nz;

          if (!hit || rel > hitSpeed) {
            hit = true;
            hitSpeed = rel;
          }
        }
      }
    }
  }

  /* 3) 轨迹采样 */
  for (let i = 0; i < NP; i++) {
    const p = parts[i];
    p.tx.copyWithin(1, 0, TRAIL - 1);
    p.ty.copyWithin(1, 0, TRAIL - 1);
    p.tz.copyWithin(1, 0, TRAIL - 1);
    p.tx[0] = p.x;
    p.ty[0] = p.y;
    p.tz[0] = p.z;

    /* 色相缓慢漂移 */
    const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy + p.vz * p.vz);
    p.hue += dt * (10 + sp * 34);
    if (p.hue >= 360) p.hue -= 360;
  }

  return { hit: hit, speed: hitSpeed };
}

/* ======================================================================
   6 · 渲染粒子与轨迹
   ====================================================================== */
const projX = new Float32Array(TRAIL);
const projY = new Float32Array(TRAIL);

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  for (let i = 0; i < NP; i++) {
    const p = parts[i];
    const hue = ((p.hue % 360) + 360) % 360;

    /* ---- 轨迹投影缓存 ---- */
    let minX = Infinity, maxX = -Infinity;
    for (let k = 0; k < TRAIL; k++) {
      const q = project(p.tx[k], p.ty[k], p.tz[k]);
      projX[k] = q.x;
      projY[k] = q.y;
      if (q.x < minX) minX = q.x;
      if (q.x > maxX) maxX = q.x;
    }

    /* 屏幕外整体裁剪 */
    if (maxX < -60 || minX > W + 60) continue;

    /* ---- 轨迹：旧半段（暗） ---- */
    const half = TRAIL >> 1;
    ctx.beginPath();
    ctx.moveTo(projX[TRAIL - 1], projY[TRAIL - 1]);
    for (let k = TRAIL - 2; k >= half; k--) {
      ctx.lineTo(projX[k], projY[k]);
    }
    ctx.strokeStyle = 'hsla(' + hue + ',100%,62%,0.055)';
    ctx.lineWidth = 0.85;
    ctx.stroke();

    /* ---- 轨迹：新半段（亮） ---- */
    ctx.beginPath();
    ctx.moveTo(projX[half], projY[half]);
    for (let k = half - 1; k >= 0; k--) {
      ctx.lineTo(projX[k], projY[k]);
    }
    ctx.strokeStyle = 'hsla(' + hue + ',100%,72%,0.17)';
    ctx.lineWidth = 1.05;
    ctx.stroke();
  }

  /* ---- 粒子光点（后绘制，保证在最上层） ---- */
  for (let i = 0; i < NP; i++) {
    const p = parts[i];
    const q = project(p.x, p.y, p.z);

    const hue = ((p.hue % 360) + 360) % 360;
    const idx = Math.floor(hue / (360 / HUE_STEPS)) % HUE_STEPS;

    /* 透视 + 深度调制 */
    const depth = (q.z + 0.9) / 1.8;
    const dmod  = 0.45 + 0.55 * Math.max(0, Math.min(1, depth));

    let sz = q.f * 0.105 * dmod;
    if (sz < 7)   sz = 7;
    if (sz > 46)  sz = 46;

    ctx.globalAlpha = 0.55 + 0.45 * dmod;
    ctx.drawImage(sprites[idx], q.x - sz * 0.5, q.y - sz * 0.5, sz, sz);
  }

  ctx.globalAlpha = 1;
}

/* ======================================================================
   7 · 主循环
   ====================================================================== */
let last = 0;
let msd  = 0;
let frameCount = 0;

const elT  = document.getElementById('r-T');
const elD  = document.getElementById('r-D');
const elR2 = document.getElementById('r-R2');

function loop(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.045) dt = 0.045;
  if (dt < 0)     dt = 0;

  time += dt;
  frameCount++;

  /* ---- 物理 ---- */
  const res = stepPhysics(dt);

  /* ---- 均方位移测量 ---- */
  let sumR2 = 0;
  for (let i = 0; i < NP; i++) {
    const p = parts[i];
    sumR2 += p.x * p.x + p.y * p.y + p.z * p.z;
  }
  msd = sumR2 / NP;

  /* ---- 绘制 ---- */
  drawBackground();
  drawContainer();
  drawParticles();

  /* ---- HUD ---- */
  if (frameCount % 5 === 0) {
    elT.textContent  = temp.toFixed(2);
    elD.textContent  = (0.82 * temp).toFixed(3);
    elR2.textContent = msd.toFixed(3);
  }

  /* ---- 碰撞音效 ---- */
  if (res.hit) playCollision(res.speed);

  requestAnimationFrame(loop);
}

/* ======================================================================
   8 · UI 交互
   ====================================================================== */
const slider  = document.getElementById('temp');
const tLabel  = document.getElementById('tempval');

slider.addEventListener('input', function () {
  temp = parseFloat(slider.value);
  tLabel.textContent = temp.toFixed(2) + ' a.u.';
  updateNoiseLayer();
  playWhoosh();
});

/* ======================================================================
   9 · 科技感音效（Web Audio）
   ====================================================================== */
let actx = null;
let masterGain = null;
let echoDelay = null;
let noiseFilter = null;
let noiseGain = null;
let padFilter = null;

let lastColl = 0;
let lastWhoosh = 0;

function initAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  actx = new AC();

  /* ---- 主输出 ---- */
  masterGain = actx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(actx.destination);
  masterGain.gain.exponentialRampToValueAtTime(0.34, actx.currentTime + 3.5);

  /* ---- 太空回声 ---- */
  echoDelay = actx.createDelay(1.0);
  echoDelay.delayTime.value = 0.36;
  const fb   = actx.createGain(); fb.gain.value = 0.42;
  const dOut = actx.createGain(); dOut.gain.value = 0.30;
  echoDelay.connect(fb); fb.connect(echoDelay);
  echoDelay.connect(dOut); dOut.connect(masterGain);

  /* ---- 低频氛围 Pad ---- */
  padFilter = actx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 520;
  padFilter.Q.value = 5.0;

  const padGain = actx.createGain();
  padGain.gain.value = 0.15;
  padFilter.connect(padGain);
  padGain.connect(masterGain);

  const freqs = [55, 82.41, 110, 164.81, 220];
  for (let i = 0; i < freqs.length; i++) {
    const o = actx.createOscillator();
    o.type = (i % 2) ? 'sawtooth' : 'sine';
    o.frequency.value = freqs[i] * (1 + (i % 2 ? 0.0035 : -0.0025));
    const g = actx.createGain();
    g.gain.value = 0.30 / (i + 1);
    o.connect(g); g.connect(padFilter);
    o.start();
  }

  /* 慢速滤波器扫描 */
  const lfo = actx.createOscillator();
  lfo.frequency.value = 0.055;
  const lfoG = actx.createGain();
  lfoG.gain.value = 300;
  lfo.connect(lfoG); lfoG.connect(padFilter.frequency);
  lfo.start();

  /* ---- 热噪声层（随温度变化） ---- */
  const bufLen = Math.floor(actx.sampleRate * 2);
  const nbuf   = actx.createBuffer(1, bufLen, actx.sampleRate);
  const nd     = nbuf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;

  const noise = actx.createBufferSource();
  noise.buffer = nbuf;
  noise.loop = true;

  noiseFilter = actx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 900;
  noiseFilter.Q.value = 0.9;

  noiseGain = actx.createGain();
  noiseGain.gain.value = 0.014;

  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(masterGain);
  noise.start();

  const nLfo = actx.createOscillator();
  nLfo.frequency.value = 0.068;
  const nLfoG = actx.createGain();
  nLfoG.gain.value = 480;
  nLfo.connect(nLfoG); nLfoG.connect(noiseFilter.frequency);
  nLfo.start();

  updateNoiseLayer();

  /* ---- 随机高频闪烁音（模拟粒子碰撞的“噼啪”声） ---- */
  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    if (Math.random() > 0.55) return;

    const t = actx.currentTime;
    const f = 900 + Math.random() * 2600 * (0.5 + temp * 0.5);

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.022 * Math.min(1.6, temp), t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 0.1);
  }, 120);

  /* ---- 深空脉冲 ---- */
  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    const t = actx.currentTime;

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(118, t);
    o.frequency.exponentialRampToValueAtTime(36, t + 2.2);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.24);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 2.5);
  }, 7400);
}

/* 温度 → 噪声层参数 */
function updateNoiseLayer() {
  if (!actx || !noiseFilter || !noiseGain) return;
  const t = actx.currentTime;
  const k = Math.min(2.2, temp);
  noiseFilter.frequency.setTargetAtTime(700 + k * 700, t, 0.35);
  noiseGain.gain.setTargetAtTime(0.008 + k * 0.014, t, 0.35);
}

/* 粒子碰撞：高频短促“滴”声 */
function playCollision(speed) {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  if (t - lastColl < 0.07) return;
  lastColl = t;

  const s = Math.min(1, speed * 1.1);
  const f = 700 + s * 1900 + Math.random() * 260;

  const o = actx.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.1);

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.026 * (0.4 + s * 0.6), t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);

  o.connect(g);
  g.connect(masterGain);
  g.connect(echoDelay);

  o.start(t);
  o.stop(t + 0.15);
}

/* 拖动温度滑块：扫掠音 */
function playWhoosh() {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  if (t - lastWhoosh < 0.1) return;
  lastWhoosh = t;

  const o = actx.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(340, t);
  o.frequency.exponentialRampToValueAtTime(115, t + 0.24);

  const f = actx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 1250;
  f.Q.value = 6;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.042, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

  o.connect(f); f.connect(g);
  g.connect(masterGain);
  g.connect(echoDelay);

  o.start(t);
  o.stop(t + 0.32);
}

/* ======================================================================
   10 · 启动
   ====================================================================== */
const startEl = document.getElementById('start');
let started = false;

function startAll() {
  if (started) return;
  started = true;
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  startEl.classList.add('hide');
}

window.addEventListener('pointerdown', startAll, { passive: true });
window.addEventListener('keydown', startAll);
window.addEventListener('touchstart', startAll, { passive: true });

/* ======================================================================
   11 · 启动主循环
   ====================================================================== */
resize();
requestAnimationFrame(loop);

})();
</script>
