<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流体灵感交互</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2a1a0f; /* 匹配原图背景的深褐/暗红色 */
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            user-select: none;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="hint">移动鼠标改变流向 · 点击产生波浪</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
    
    <script>
        // 初始化 PixiJS 应用
        const app = new PIXI.Application({
            resizeTo: window,
            backgroundColor: 0x2a1a0f, // 原图背景色
            antialias: true,
            autoDensity: true,
            resolution: window.devicePixelRatio || 1
        });
        document.getElementById('container').appendChild(app.view);

        // 创建全屏 Sprite 以承载 Shader
        const geometry = new PIXI.Graphics();
        geometry.beginFill(0xffffff);
        geometry.drawRect(0, 0, 1, 1);
        geometry.endFill();
        
        const texture = app.renderer.generateTexture(geometry);
        const sprite = new PIXI.Sprite(texture);
        sprite.width = window.innerWidth;
        sprite.height = window.innerHeight;
        app.stage.addChild(sprite);

        // 着色器 Uniform 变量
        let mouse = { x: 0.5, y: 0.5 };
        let clickForce = 0;

        // 自定义着色器
        const filter = new PIXI.Filter(
            // 顶点着色器
            `
            attribute vec2 aVertexPosition;
            attribute vec2 aTextureCoord;
            uniform mat3 projectionMatrix;
            varying vec2 vTextureCoord;
            void main(void) {
                gl_Position = vec4((projectionMatrix * vec3(aVertexPosition, 1.0)).xy, 0.0, 1.0);
                vTextureCoord = aTextureCoord;
            }
            `,
            // 片元着色器 (核心视觉逻辑)
            `
            precision highp float;
            varying vec2 vTextureCoord;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uClickForce;
            uniform vec2 uResolution;

            // 随机数生成
            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            // 噪声函数
            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                           mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
            }

            // 分形布朗运动 (FBM)
            float fbm(vec2 p) {
                float value = 0.0;
                float amplitude = 0.5;
                float frequency = 1.0;
                for (int i = 0; i < 5; i++) {
                    value += amplitude * noise(p * frequency);
                    amplitude *= 0.5;
                    frequency *= 2.0;
                }
                return value;
            }

            // 颜色映射 (模拟原图色彩：深红->橙->黄->绿->蓝->紫)
            vec3 getColor(float t) {
                vec3 c1 = vec3(0.8, 0.1, 0.1); // 红色
                vec3 c2 = vec3(1.0, 0.6, 0.1); // 橙色
                vec3 c3 = vec3(0.9, 0.9, 0.2); // 黄色
                vec3 c4 = vec3(0.2, 0.8, 0.3); // 绿色
                vec3 c5 = vec3(0.2, 0.5, 1.0); // 蓝色
                vec3 c6 = vec3(0.7, 0.3, 1.0); // 紫色

                // 利用平滑曲线进行多段颜色过渡
                if (t < 0.2) return mix(c1, c2, smoothstep(0.0, 0.2, t));
                if (t < 0.4) return mix(c2, c3, smoothstep(0.2, 0.4, t));
                if (t < 0.6) return mix(c3, c4, smoothstep(0.4, 0.6, t));
                if (t < 0.8) return mix(c4, c5, smoothstep(0.6, 0.8, t));
                return mix(c5, c6, smoothstep(0.8, 1.0, t));
            }

            void main(void) {
                // 坐标归一化到 0~1 且解决非方形窗口拉伸问题
                vec2 uv = vTextureCoord;
                vec2 aspectRatio = vec2(uResolution.x / uResolution.y, 1.0);
                vec2 uvRes = uv * aspectRatio;
                
                // 鼠标坐标适配
                vec2 mRes = uMouse * aspectRatio;

                // 流动的时间参数（速度适中）
                float t = uTime * 0.15;
                
                // 鼠标扰动 (主交互)
                float mouseDist = length(uvRes - mRes);
                float mouseInfluence = exp(-mouseDist * 2.0) * 1.5;

                // 点击冲击波
                float clickWave = sin(mouseDist * 50.0 - uTime * 10.0) * exp(-mouseDist * 15.0) * uClickForce;

                // 复杂的FBM偏移模拟流体旋涡
                vec2 q = vec2(fbm(uvRes + t), fbm(uvRes + vec2(5.2, 1.3) - t));
                vec2 r = vec2(fbm(uvRes + q + vec2(1.7, 9.2) + mouseInfluence * 0.15 * (uMouse - uv)), 
                              fbm(uvRes + q + vec2(8.3, 2.8) + 0.126 * t - mouseInfluence * 0.15 * (uMouse - uv)));
                
                // 最终流体值计算
                float f = fbm(uvRes + r + clickWave * 0.2);

                // 色彩渐变映射
                vec3 color = getColor(f);

                // 增加边缘的流动感
                float vignette = smoothstep(0.0, 0.3, length(uv - 0.5));
                color += vignette * 0.1;

                // 过滤掉过深的背景黑 (保持原图的深邃感)
                color = clamp(color, 0.0, 1.0);
                
                gl_FragColor = vec4(color, 1.0);
            }
            `
        );

        // 应用滤镜到整个 Sprite
        sprite.filters = [filter];

        // 鼠标和点击事件监听
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX / window.innerWidth;
            mouse.y = 1.0 - (e.clientY / window.innerHeight); // 翻转Y轴以适应纹理坐标
        });

        window.addEventListener('click', () => {
            clickForce = 1.0; // 点击瞬间触发最大的冲击波力
        });

        // 调整窗口大小事件
        window.addEventListener('resize', () => {
            sprite.width = window.innerWidth;
            sprite.height = window.innerHeight;
            filter.uniforms.uResolution = [window.innerWidth, window.innerHeight];
        });

        // 初始化分辨率
        filter.uniforms.uResolution = [window.innerWidth, window.innerHeight];

        // 动画循环
        app.ticker.add(() => {
            // 衰减点击力，使其平滑退出
            clickForce *= 0.96; 
            if (clickForce < 0.001) clickForce = 0;

            // 更新着色器 Uniform 变量
            filter.uniforms.uTime = app.ticker.lastTime / 1000;
            filter.uniforms.uMouse = [mouse.x, mouse.y];
            filter.uniforms.uClickForce = clickForce;
        });

    </script>
</body>
</html>
