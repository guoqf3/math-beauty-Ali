<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>动态晶格 · 弹性光波</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #hint {
            position: fixed;
            bottom: 22px;
            right: 26px;
            color: rgba(255, 255, 255, 0.28);
            font-size: 12px;
            letter-spacing: 0.8px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.8s ease;
            font-weight: 300;
        }
        #fps-badge {
            position: fixed;
            top: 16px;
            left: 18px;
            color: rgba(255, 255, 255, 0.22);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 0.5px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div id="fps-badge"></div>
    <div id="hint">移动 · 波浪  点击 · 脉冲</div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
    <script>
        (function() {
            'use strict';

            // ─── 安全检测 ───
            if (!window.PIXI) {
                console.warn('PixiJS 加载失败');
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">需要WebGL支持</div>';
                return;
            }

            // ─── 配置参数 ───
            const GRID_COLS = 42;             // 列数
            const GRID_ROWS = 28;             // 行数（约1176个粒子）
            const WAVE_AMPLITUDE = 42;        // 基础波浪幅度（像素）
            const WAVE_FREQ = 0.012;          // 空间频率
            const WAVE_SPEED = 2.8;           // 波浪速度
            const PULSE_AMPLITUDE = 55;       // 脉冲额外幅度
            const PULSE_DURATION = 1.2;       // 脉冲持续时间（秒）
            const MOUSE_INFLUENCE_RADIUS = 240; // 鼠标影响半径
            const AUTO_WAVE_TIME = 0.8;       // 自动微动周期

            // ─── DOM 元素 ───
            const fpsBadge = document.getElementById('fps-badge');
            const hintEl = document.getElementById('hint');

            // ─── PixiJS 应用初始化 ───
            let app;
            try {
                app = new PIXI.Application({
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0x050510,
                    antialias: false,
                    autoDensity: true,
                    resolution: Math.min(window.devicePixelRatio || 1, 2),
                    powerPreference: 'high-performance',
                    forceCanvas: !isWebGLAvailable(),
                });
            } catch (err) {
                console.error('PixiJS 初始化失败:', err);
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">初始化失败</div>';
                return;
            }

            function isWebGLAvailable() {
                try {
                    const canvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext &&
                        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
                } catch (e) { return false; }
            }

            document.body.appendChild(app.view);
            app.view.style.position = 'fixed';
            app.view.style.top = '0';
            app.view.style.left = '0';
            app.view.style.width = '100%';
            app.view.style.height = '100%';
            app.view.style.display = 'block';

            // ─── 发光纹理创建 ───
            function createGlowTexture(size) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const half = size / 2;
                const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
                gradient.addColorStop(0.0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.15, 'rgba(255,255,255,0.9)');
                gradient.addColorStop(0.35, 'rgba(255,255,255,0.5)');
                gradient.addColorStop(0.6, 'rgba(255,255,255,0.18)');
                gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                const tex = PIXI.Texture.from(c);
                tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
                return tex;
            }

            const glowTex64 = createGlowTexture(64);
            const glowTex128 = createGlowTexture(128);

            // ─── 粒子容器（使用 ParticleContainer 提升性能） ───
            const totalParticles = GRID_COLS * GRID_ROWS;
            const particleContainer = new PIXI.ParticleContainer(totalParticles, {
                position: true,
                scale: true,
                tint: true,
                alpha: true,
            }, totalParticles, true);
            particleContainer.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(particleContainer);

            // ─── 粒子数据 ───
            const particles = [];
            const basePositions = [];

            // ─── 初始化粒子网格 ───
            function initGrid() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const marginX = w * 0.08;
                const marginY = h * 0.08;
                const usableW = w - marginX * 2;
                const usableH = h - marginY * 2;
                const stepX = usableW / (GRID_COLS - 1);
                const stepY = usableH / (GRID_ROWS - 1);

                for (let row = 0; row < GRID_ROWS; row++) {
                    for (let col = 0; col < GRID_COLS; col++) {
                        const x = marginX + col * stepX;
                        const y = marginY + row * stepY;
                        const sprite = new PIXI.Sprite(glowTex64);
                        sprite.anchor.set(0.5);
                        sprite.position.set(x, y);
                        sprite.scale.set(0.06 + Math.random() * 0.04);
                        sprite.alpha = 0.55 + Math.random() * 0.3;

                        // 随机初始色调（围绕蓝紫色系）
                        const baseHue = 200 + Math.random() * 80; // 200-280 蓝紫
                        sprite.tint = hslToHex(baseHue, 70, 60);

                        particleContainer.addChild(sprite);
                        particles.push(sprite);
                        basePositions.push({
                            x: x,
                            y: y,
                            hue: baseHue,
                            scale: 0.06 + Math.random() * 0.04,
                            alpha: 0.55 + Math.random() * 0.3,
                            phase: Math.random() * Math.PI * 2,
                        });
                    }
                }
            }

            // ─── HSL 转十六进制 ───
            function hslToHex(h, s, l) {
                h = ((h % 360) + 360) % 360;
                s = Math.max(0, Math.min(100, s)) / 100;
                l = Math.max(0, Math.min(100, l)) / 100;
                const c = (1 - Math.abs(2 * l - 1)) * s;
                const x = c * (1 - Math.abs((h / 60) % 2 - 1));
                const m = l - c / 2;
                let r = 0,
                    g = 0,
                    b = 0;
                if (h < 60) { r = c;
                    g = x;
                    b = 0; } else if (h < 120) { r = x;
                    g = c;
                    b = 0; } else if (h < 180) { r = 0;
                    g = c;
                    b = x; } else if (h < 240) { r = 0;
                    g = x;
                    b = c; } else if (h < 300) { r = x;
                    g = 0;
                    b = c; } else { r = c;
                    g = 0;
                    b = x; }
                const ri = Math.round((r + m) * 255);
                const gi = Math.round((g + m) * 255);
                const bi = Math.round((b + m) * 255);
                return (ri << 16) | (gi << 8) | bi;
            }

            // ─── 交互状态 ───
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let smoothMouseX = mouseX;
            let smoothMouseY = mouseY;
            let pulseStrength = 0;       // 当前脉冲强度（0-1）
            let pulseActive = false;
            let pulseTimer = 0;

            // ─── 更新粒子（核心波浪计算） ───
            function updateParticles(time, dt) {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const cx = smoothMouseX;
                const cy = smoothMouseY;
                const pulseFactor = Math.max(0, pulseStrength); // 0-1
                const autoAmplitude = 5 * Math.sin(time * 0.6); // 自动微动

                for (let i = 0; i < particles.length; i++) {
                    const base = basePositions[i];
                    const sprite = particles[i];

                    // 计算到鼠标的距离
                    const dx = base.x - cx;
                    const dy = base.y - cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // 基础波浪（持续微动，随空间变化）
                    const wave1 = Math.sin(base.x * WAVE_FREQ * 2.2 + base.y * WAVE_FREQ * 1.6 + time * WAVE_SPEED * 1.2) * (WAVE_AMPLITUDE * 0.45);
                    const wave2 = Math.cos(base.y * WAVE_FREQ * 1.8 - base.x * WAVE_FREQ * 1.3 + time * WAVE_SPEED * 0.9) * (WAVE_AMPLITUDE * 0.3);

                    // 鼠标影响（径向衰减的正弦波）
                    let mouseWave = 0;
                    if (dist < MOUSE_INFLUENCE_RADIUS) {
                        const falloff = 1 - (dist / MOUSE_INFLUENCE_RADIUS);
                        const falloffSmooth = falloff * falloff * (3 - 2 * falloff); // smoothstep
                        mouseWave = Math.sin(dist * WAVE_FREQ * 6.0 - time * WAVE_SPEED * 2.5) * WAVE_AMPLITUDE * 1.2 * falloffSmooth;
                    }

                    // 脉冲波（从点击位置扩散）
                    let pulseWave = 0;
                    if (pulseActive && pulseFactor > 0) {
                        const pulseDist = dist; // 简化：使用与鼠标距离（实际应以点击点为中心，但鼠标位置在点击时更新，因此近似）
                        const pulseRadius = pulseFactor * 350; // 扩散半径
                        const wavePhase = pulseDist - time * 520;
                        const envelope = Math.exp(-Math.pow((pulseDist - pulseRadius) / 80, 2));
                        pulseWave = Math.sin(wavePhase * 0.08) * PULSE_AMPLITUDE * pulseFactor * envelope;
                    }

                    // 总偏移量
                    const offsetY = wave1 + wave2 + mouseWave + pulseWave + autoAmplitude;

                    // 更新位置
                    const newY = base.y + offsetY;
                    sprite.position.y = newY;

                    // 动态缩放（随偏移量变化）
                    const normOffset = Math.max(-1, Math.min(1, offsetY / (WAVE_AMPLITUDE * 1.5)));
                    const scaleFactor = 1 + normOffset * 0.6;
                    sprite.scale.set(base.scale * scaleFactor);

                    // 动态颜色：根据偏移量和基础色相调整
                    const hueShift = normOffset * 45; // 偏移越高越暖
                    const currentHue = (base.hue + hueShift + 360) % 360;
                    const lightness = 55 + normOffset * 25;
                    sprite.tint = hslToHex(currentHue, 75, lightness);

                    // 透明度微调
                    sprite.alpha = Math.max(0.25, Math.min(1, base.alpha + normOffset * 0.2));
                }
            }

            // ─── 更新脉冲状态 ───
            function updatePulse(dt) {
                if (pulseActive) {
                    pulseTimer += dt;
                    const t = pulseTimer / PULSE_DURATION;
                    if (t >= 1.0) {
                        pulseActive = false;
                        pulseStrength = 0;
                        pulseTimer = 0;
                    } else {
                        // 脉冲强度：快速上升然后衰减
                        pulseStrength = Math.sin(t * Math.PI); // 0→1→0
                    }
                }
            }

            // ─── 主循环 ───
            let time = 0;
            let frameCount = 0;
            let fpsLastTime = 0;

            app.ticker.add((delta) => {
                const dt = Math.min(delta / 60, 0.05);
                time += dt;

                // 平滑鼠标追踪
                smoothMouseX += (mouseX - smoothMouseX) * 0.08;
                smoothMouseY += (mouseY - smoothMouseY) * 0.08;

                // 更新脉冲状态
                updatePulse(dt);

                // 更新所有粒子
                updateParticles(time, dt);

                // FPS 显示（每0.5秒更新）
                frameCount++;
                if (time - fpsLastTime > 0.5) {
                    const fps = Math.round(frameCount / (time - fpsLastTime));
                    if (fpsBadge) fpsBadge.textContent = fps + ' fps';
                    frameCount = 0;
                    fpsLastTime = time;
                }
            });

            // ─── 鼠标与触摸交互 ───
            function getCanvasCoords(e) {
                const rect = app.view.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top,
                };
            }

            function onPointerMove(e) {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
                // 移动时轻微增加脉冲，但只作为涟漪效果（可选）
                if (!pulseActive) {
                    // 保持无脉冲，仅依赖移动波浪
                }
            }

            function onPointerDown(e) {
                e.preventDefault();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
                // 触发脉冲
                pulseActive = true;
                pulseTimer = 0;
                pulseStrength = 1.0;
            }

            function onPointerLeave() {
                mouseX = window.innerWidth / 2;
                mouseY = window.innerHeight / 2;
            }

            // 鼠标事件
            app.view.addEventListener('mousemove', onPointerMove);
            app.view.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mouseleave', onPointerLeave);

            // 触摸事件
            app.view.addEventListener('touchmove', onPointerMove, { passive: true });
            app.view.addEventListener('touchstart', onPointerDown, { passive: false });

            // 键盘空格触发脉冲
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    pulseActive = true;
                    pulseTimer = 0;
                    pulseStrength = 1.0;
                }
            });

            // ─── 窗口大小调整 ───
            function handleResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                app.renderer.resize(w, h);
                // 重新计算网格基础位置
                const marginX = w * 0.08;
                const marginY = h * 0.08;
                const usableW = w - marginX * 2;
                const usableH = h - marginY * 2;
                const stepX = usableW / (GRID_COLS - 1);
                const stepY = usableH / (GRID_ROWS - 1);

                let idx = 0;
                for (let row = 0; row < GRID_ROWS; row++) {
                    for (let col = 0; col < GRID_COLS; col++) {
                        const x = marginX + col * stepX;
                        const y = marginY + row * stepY;
                        if (idx < basePositions.length) {
                            basePositions[idx].x = x;
                            basePositions[idx].y = y;
                            particles[idx].position.set(x, y);
                        }
                        idx++;
                    }
                }
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(handleResize, 300);
            });

            // ─── 启动 ───
            initGrid();
            handleResize();

            // 初始鼠标位置在中心
            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
            smoothMouseX = mouseX;
            smoothMouseY = mouseY;

            // 隐藏提示文字（4秒后淡出）
            setTimeout(() => {
                if (hintEl) {
                    hintEl.style.opacity = '0';
                    setTimeout(() => {
                        if (hintEl) hintEl.style.display = 'none';
                    }, 1600);
                }
            }, 4000);

            console.log('✨ 动态晶格 · 弹性光波已启动 — 粒子数量:', totalParticles);
        })();
    </script>
</body>
</html>
