<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>毛细现象 · Capillary Action</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #041612 0%, #010a08 50%, #000201 100%);
    font-family: "SF Mono", "JetBrains Mono", Consolas, Menlo, monospace;
    color: #a8f0d8;
    user-select: none;
  }
  canvas { display: block; }
  #scene { position: fixed; inset: 0; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 45%, transparent 28%, rgba(0,0,0,.4) 68%, rgba(0,0,0,.85) 100%);
  }

  .hud-title {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 10;

  .hud-title h1 {

  #readout { bottom: 28px; right: 28px; min-width: 258px; max-width: 46vw; }

  #readout .divider {

  }

  #soundBtn {
    position: fixed; top: 26px; right: 28px; z-index: 20;

  #soundBtn:hover {

  #hint {

  @media (max-width: 860px) {

    #readout .tube-val { width: 40px; }

</style>

<script type="importmap">

<body>

<div id="scene"></div>
<div id="vignette"></div>

<div class="hud-title">
  <h1>毛 细 现 象</h1>
  <p>CAPILLARY ACTION &amp; SURFACE TENSION</p>
</div>

<button id="soundBtn">🔈 开启音效</button>

<div id="hint">
  移动鼠标 · 环绕观察<br>
  液柱动态上升 · 细管升得更高
</div>

<div id="formulas" class="panel">
  <div class="cap">SURFACE TENSION PHYSICS</div>
  <div class="eq">拉普拉斯压力 <em>Δp = 2γ / r</em></div>
  <div class="eq">毛细上升高度 <span class="hl">h = 2γ·cosθ / (ρgr)</span></div>
  <div class="eq">杨氏方程 <em>γ<sub>sg</sub> = γ<sub>sl</sub> + γ<sub>lg</sub>·cosθ</em></div>
  <div class="eq">Jurin 定律 <span class="hl">h·r = const</span></div>
  <div class="eq"><span class="dim">孔径越小 · 上升越高 · 弯月面越弯</span></div>
</div>

<div id="readout" class="panel">
  <div class="cap">CAPILLARY RISE · 实时液柱高度</div>
  <div id="tubeRows"></div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   物理常量
   ============================================================ */
const GAMMA     = 0.072;   // N/m
const RHO       = 1000;    // kg/m³
const G_ACC     = 9.81;
const THETA_DEG = 25;
const THETA     = THETA_DEG * Math.PI / 180;

// 物理半径(mm) → 视觉高度：1 cm 对应 0.72 视觉单位
const CM_TO_UNIT = 0.72;

function calcHeight(rMm) {
  const rM = rMm * 1e-3;
  const hM = 2 * GAMMA * Math.cos(THETA) / (RHO * G_ACC * rM);
  return hM * 100 * CM_TO_UNIT; // 视觉单位
}

/* ============================================================
   管子配置：x 位置 / 物理半径(mm) / 视觉半径 / 色相
   ============================================================ */
const TUBES = [
  { x: -3.25, rMm: 0.55, rVis: 0.495, hue: 0.42 },
  { x: -1.95, rMm: 0.42, rVis: 0.378, hue: 0.43 },
  { x: -0.65, rMm: 0.32, rVis: 0.288, hue: 0.445 },
  { x:  0.65, rMm: 0.24, rVis: 0.216, hue: 0.455 },
  { x:  1.95, rMm: 0.17, rVis: 0.153, hue: 0.465 },
  { x:  3.25, rMm: 0.12, rVis: 0.108, hue: 0.478 }
];

// 目标高度
TUBES.forEach(t => { t.hTarget = calcHeight(t.rMm); });

const H_MAX = Math.max(...TUBES.map(t => t.hTarget));

const TUBE_HEIGHT = 11.0;
const TUBE_BASE   = -1.4;    // 管底
const SLOT_SURF   = 0.0;     // 槽液面

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const container = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearAlpha(0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020a0a, 0.014);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(6.0, 7.5, 19.5);
camera.lookAt(0, 4.0, 0);

/* ============================================================
   光照
   ============================================================ */
scene.add(new THREE.AmbientLight(0x1a3a38, 2.4));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
keyLight.position.set(8, 16, 10);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x22ffcc, 70, 48);
fillLight.position.set(-11, 7, 9);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0x8844ff, 38, 48);
rimLight.position.set(12, 9, -10);
scene.add(rimLight);

const topLight = new THREE.PointLight(0x66ffdd, 42, 40);
topLight.position.set(0, 20, 2);
scene.add(topLight);

// 游走闪跃光（玻璃闪耀）
const sparkLight = new THREE.PointLight(0xffffff, 24, 28);
scene.add(sparkLight);

/* ============================================================
   背景微尘
   ============================================================ */
{
  const N = 2400;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  const tmp = new THREE.Color();

  for (let i = 0; i < N; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = 40 + Math.random() * 70;

    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi) * 0.65 + 5;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const t = Math.random();
    if (t < 0.62)      tmp.setHSL(0.45 + Math.random() * 0.06, 0.5, 0.82);
    else if (t < 0.88) tmp.setHSL(0.38 + Math.random() * 0.05, 0.46, 0.86);
    else               tmp.setHSL(0.55 + Math.random() * 0.06, 0.52, 0.78);

    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
    siz[i] = 0.7 + Math.random() * 2.0;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));

  const m = new THREE.ShaderMaterial({
    uniforms: {
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
      uTime: { value: 0 }
    },
    vertexShader: `
      attribute float aSize;
      attribute vec3 aColor;
      uniform float uPixelRatio;
      uniform float uTime;
      varying vec3 vColor;
      varying float vTw;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        float tw = 0.72 + 0.28 * sin(uTime * 1.2 + position.x * 0.2 + position.y * 0.13);
        vTw = tw;
        gl_PointSize = clamp(aSize * uPixelRatio * (300.0 / max(0.001, -mv.z)), 0.7, 5.0);
        vColor = aColor;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vTw;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d2 = dot(c, c);
        if (d2 > 0.25) discard;
        float a = smoothstep(0.25, 0.0, d2);
        gl_FragColor = vec4(vColor * vTw, a * 0.88);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const dust = new THREE.Points(g, m);
  dust.frustumCulled = false;
  scene.add(dust);
  window.__dust = dust;
}

/* ============================================================
   液槽（玻璃盘 + 液体）
   ============================================================ */
const SLOT_R = 3.95;

// 槽玻璃壁
const slotGlassMat = new THREE.MeshPhysicalMaterial({
  color: 0xbbf5ff,
  emissive: 0x0a3d40,
  emissiveIntensity: 0.24,
  transparent: true,
  opacity: 0.16,
  roughness: 0.05,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.03,
  side: THREE.DoubleSide,
  depthWrite: false
});

const slotWall = new THREE.Mesh(
  new THREE.CylinderGeometry(SLOT_R, SLOT_R, 1.7, 72, 1, true),
  slotGlassMat
);
slotWall.position.y = -0.85;
scene.add(slotWall);

// 槽底
const slotBottom = new THREE.Mesh(
  new THREE.CylinderGeometry(SLOT_R + 0.04, SLOT_R + 0.04, 0.07, 72),
  slotGlassMat
);
slotBottom.position.y = -1.72;
scene.add(slotBottom);

// 槽内液体
const slotLiquidMat = new THREE.MeshPhysicalMaterial({
  color: 0x2ee8c0,
  emissive: 0x0d6e58,
  emissiveIntensity: 0.6,
  transparent: true,
  opacity: 0.72,
  roughness: 0.1,
  metalness: 0.0,
  clearcoat: 0.95,
  clearcoatRoughness: 0.06,
  side: THREE.DoubleSide
});

const slotLiquid = new THREE.Mesh(
  new THREE.CylinderGeometry(SLOT_R - 0.02, SLOT_R - 0.02, 1.6, 72),
  slotLiquidMat
);
slotLiquid.position.y = -0.8;
scene.add(slotLiquid);

// 液面高光环
const surfRing = new THREE.Mesh(
  new THREE.TorusGeometry(SLOT_R - 0.02, 0.012, 8, 72),
  new THREE.MeshBasicMaterial({
    color: 0x88ffdd,
    transparent: true,
    opacity: 0.45,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
surfRing.rotation.x = Math.PI / 2;
surfRing.position.y = 0.0;
scene.add(surfRing);

/* ============================================================
   弯月面几何体
   ============================================================ */
function createMeniscus(R, theta, seg = 40, rings = 12) {
  const cosA = Math.cos(theta);
  const sinA = Math.sin(theta);
  const Rm = R / cosA;
  const hRise = Rm * (1 - sinA);

  const positions = [], normals = [], uvs = [], indices = [];

  for (let i = 0; i <= rings; i++) {
    const t = i / rings;
    const r = t * R;
    const root = Math.sqrt(Math.max(0, Rm * Rm - r * r));
    const y = Rm - root;
    const ny = root / Rm;
    const nr = -(r / Rm);

    for (let j = 0; j <= seg; j++) {
      const a = (j / seg) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      positions.push(r * ca, y, r * sa);
      normals.push(nr * ca, ny, nr * sa);
      uvs.push(j / seg, t);
    }
  }

  for (let i = 0; i < rings; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * (seg + 1) + j;
      const b = a + 1;
      const c = a + seg + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);

  return { geo, hRise };
}

/* ============================================================
   玻璃管 + 液柱 构建
   ============================================================ */
const tubeObjs = [];

// 共享的弯月面几何体缓存
const menCache = {};

for (let ti = 0; ti < TUBES.length; ti++) {
  const cfg = TUBES[ti];
  const R = cfg.rVis;
  const hT = cfg.hTarget;

  /* ---- 玻璃管 ---- */
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xccf6ff,
    emissive: 0x0d4a50,
    emissiveIntensity: 0.22,
    transparent: true,
    opacity: 0.15,
    roughness: 0.04,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.03,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  const glassTube = new THREE.Mesh(
    new THREE.CylinderGeometry(R, R, TUBE_HEIGHT, 36, 1, true),
    glassMat
  );
  glassTube.position.set(cfg.x, TUBE_BASE + TUBE_HEIGHT / 2, 0);
  glassTube.renderOrder = 3;
  scene.add(glassTube);

  // 管口高光环
  const rimRing = new THREE.Mesh(
    new THREE.TorusGeometry(R, 0.011, 8, 40),
    new THREE.MeshBasicMaterial({
      color: 0x99ffee, transparent: true, opacity: 0.42,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  rimRing.rotation.x = Math.PI / 2;
  rimRing.position.set(cfg.x, TUBE_BASE + TUBE_HEIGHT, 0);
  scene.add(rimRing);

  /* ---- 弯月面 ---- */
  let men = menCache[ti];
  if (!men) {
    men = createMeniscus(R, THETA, 40, 12);
    menCache[ti] = men;
  }
  const { geo: menGeo, hRise } = men;

  /* ---- 液体材质 ---- */
  const hue = cfg.hue;
  const liqColor = new THREE.Color().setHSL(hue, 0.72, 0.52);
  const liqEmissive = new THREE.Color().setHSL(hue, 0.85, 0.16);

  const liquidMat = new THREE.MeshPhysicalMaterial({
    color: liqColor,
    emissive: liqEmissive,
    emissiveIntensity: 0.9,
    transparent: true,
    opacity: 0.85,
    roughness: 0.1,
    metalness: 0.05,
    clearcoat: 0.95,
    clearcoatRoughness: 0.06,
    side: THREE.DoubleSide,
    depthWrite: true
  });

  // 液柱主体（动态高度）
  const liquidBody = new THREE.Mesh(
    new THREE.CylinderGeometry(R * 0.985, R * 0.985, 1, 32, 1, false),
    liquidMat
  );
  liquidBody.position.set(cfg.x, 0, 0);
  scene.add(liquidBody);

  // 内部亮芯（晶莹质感）
  const coreMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(hue, 0.9, 0.78),
    transparent: true,
    opacity: 0.3,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const liquidCore = new THREE.Mesh(
    new THREE.CylinderGeometry(R * 0.5, R * 0.5, 1, 20, 1, false),
    coreMat
  );
  liquidCore.position.set(cfg.x, 0, 0);
  scene.add(liquidCore);

  /* ---- 弯月面网格 ---- */
  const menMat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color().setHSL(hue, 0.85, 0.6),
    emissive: new THREE.Color().setHSL(hue, 0.9, 0.3),
    emissiveIntensity: 1.1,
    transparent: true,
    opacity: 0.92,
    roughness: 0.05,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.04,
    side: THREE.DoubleSide,
    depthWrite: true
  });

  const meniscus = new THREE.Mesh(menGeo, menMat);
  meniscus.position.set(cfg.x, 0, 0);
  scene.add(meniscus);

  /* ---- 弯月面与管壁接触高亮环 ---- */
  const edgeGlow = new THREE.Mesh(
    new THREE.TorusGeometry(R * 1.002, 0.007, 8, 40),
    new THREE.MeshBasicMaterial({
      color: 0xaaffee, transparent: true, opacity: 0.7,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  edgeGlow.rotation.x = Math.PI / 2;
  edgeGlow.position.set(cfg.x, 0, 0);
  scene.add(edgeGlow);

  /* ---- 液面辉光 Sprite ---- */
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 128;
  const ctx2 = cvs.getContext('2d');
  const grd = ctx2.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0.0, 'rgba(255,255,255,0.9)');
  grd.addColorStop(0.22, 'rgba(120,255,220,0.55)');
  grd.addColorStop(0.55, 'rgba(60,200,180,0.14)');
  grd.addColorStop(1.0, 'rgba(40,150,140,0)');
  ctx2.fillStyle = grd;
  ctx2.fillRect(0, 0, 128, 128);
  const glowTex = new THREE.CanvasTexture(cvs);
  glowTex.colorSpace = THREE.SRGBColorSpace;

  const surfaceGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex,
    color: new THREE.Color().setHSL(hue, 0.9, 0.72),
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  surfaceGlow.scale.set(R * 6 + 0.28, R * 6 + 0.28, 1);
  surfaceGlow.position.set(cfg.x, 0, 0);
  scene.add(surfaceGlow);

  /* ---- 上升过程中的粒子流 ---- */
  const P_N = 20;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(P_N * 3);
  for (let k = 0; k < P_N; k++) {
    pPos[k * 3]     = cfg.x + (Math.random() - 0.5) * R * 0.9;
    pPos[k * 3 + 1] = Math.random() * 1; // 会在动画中更新
    pPos[k * 3 + 2] = (Math.random() - 0.5) * R * 0.9;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

  const pMat = new THREE.PointsMaterial({
    color: new THREE.Color().setHSL(hue, 0.9, 0.8),
    size: R * 0.22 + 0.02,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const particles = new THREE.Points(pGeo, pMat);
  particles.frustumCulled = false;
  scene.add(particles);

  tubeObjs.push({
    cfg, R, hTarget: hT, hRise,
    // 视觉元素
    liquidBody, liquidCore, meniscus, edgeGlow, surfaceGlow,
    liquidMat, coreMat, menMat,
    particles,
    pPos, P_N,
    // 动画状态
    riseDur: 4.2 + (hT / H_MAX) * 2.6,
    particleSeeds: Array.from({length: P_N}, () => Math.random())
  });
}

/* ============================================================
   读数面板
   ============================================================ */
const tubeRowsEl = document.getElementById('tubeRows');
const tubeRowRefs = [];

// 按半径从细到粗显示
const sortedTubes = [...tubeObjs].sort((a, b) => a.cfg.rMm - b.cfg.rMm);

sortedTubes.forEach((t, i) => {
  const row = document.createElement('div');
  row.className = 'tube-row';

  const label = document.createElement('span');
  label.className = 'tube-label';
  label.textContent = 'r=' + t.cfg.rMm.toFixed(2) + 'mm';

  const barWrap = document.createElement('div');
  barWrap.className = 'bar-wrap';
  const barFill = document.createElement('div');
  barFill.className = 'bar-fill';
  barWrap.appendChild(barFill);

  const val = document.createElement('span');
  val.className = 'tube-val';
  val.textContent = '—';

  row.appendChild(label);
  row.appendChild(barWrap);
  row.appendChild(val);
  tubeRowsEl.appendChild(row);

  tubeRowRefs.push({ tube: t, barFill, val });
});

const hMaxCm = (H_MAX / CM_TO_UNIT);

/* ============================================================
   音频
   ============================================================ */
let audioCtx = null, masterGain = null, audioOn = false;
let droneGain = null, dropTimer = null;

const soundBtn = document.getElementById('soundBtn');

function makeImpulse(ctx, dur, decay) {
  const rate = ctx.sampleRate;
  const len = Math.floor(rate * dur);
  const buf = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);

  const conv = audioCtx.createConvolver();
  conv.buffer = makeImpulse(audioCtx, 4.5, 2.5);
  const wet = audioCtx.createGain();
  wet.gain.value = 0.52;
  conv.connect(wet); wet.connect(masterGain);

  const bus = audioCtx.createGain();
  bus.gain.value = 1.0;
  bus.connect(masterGain); bus.connect(conv);

  droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.18;
  droneGain.connect(bus);

  [48.5, 72.8, 97.0, 145.6].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = i < 2 ? 'sine' : 'triangle';
    o.frequency.value = f;
    o.detune.value = (Math.random() - 0.5) * 8;
    const g = audioCtx.createGain();
    g.gain.value = [0.22, 0.14, 0.065, 0.028][i];
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 0.6;
    o.connect(lp); lp.connect(g); g.connect(droneGain);
    o.start();
  });

  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine'; lfo.frequency.value = 0.07;
  const lfoAmt = audioCtx.createGain();
  lfoAmt.gain.value = 0.07;
  lfo.connect(lfoAmt); lfoAmt.connect(droneGain.gain);
  lfo.start();

  const padFilter = audioCtx.createBiquadFilter();
  padFilter.type = 'lowpass'; padFilter.frequency.value = 660; padFilter.Q.value = 2.6;
  padFilter.connect(bus);

  [146.83, 185.00, 220.00, 293.66].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = 'triangle'; o.frequency.value = f;
    o.detune.value = (i - 1.5) * 8;
    const g = audioCtx.createGain();
    g.gain.value = 0.032;
    o.connect(g); g.connect(padFilter);
    o.start();
  });

  const padLFO = audioCtx.createOscillator();
  padLFO.type = 'sine'; padLFO.frequency.value = 0.052;
  const padAmt = audioCtx.createGain();
  padAmt.gain.value = 300;
  padLFO.connect(padAmt); padAmt.connect(padFilter.frequency);
  padLFO.start();

  const nLen = audioCtx.sampleRate * 3;
  const nBuf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const nd = nBuf.getChannelData(0);
  for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;
  const nSrc = audioCtx.createBufferSource();
  nSrc.buffer = nBuf; nSrc.loop = true;
  const nFilter = audioCtx.createBiquadFilter();
  nFilter.type = 'bandpass'; nFilter.frequency.value = 2800; nFilter.Q.value = 0.6;
  const nGain = audioCtx.createGain();
  nGain.gain.value = 0.012;
  nSrc.connect(nFilter); nFilter.connect(nGain); nGain.connect(bus);
  nSrc.start();

  scheduleDrop();
}

function playDrop() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime + Math.random() * 0.05;
  const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
  const f = scale[Math.floor(Math.random() * scale.length)];
  const o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(f * 1.8, now);
  o.frequency.exponentialRampToValueAtTime(f * 0.85, now + 0.14);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.035, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.1 + Math.random() * 0.9);
  o.connect(g); g.connect(masterGain);
  const conv = audioCtx.createConvolver();
  conv.buffer = makeImpulse(audioCtx, 3.2, 2.3);
  const cg = audioCtx.createGain();
  cg.gain.value = 0.5;
  g.connect(conv); conv.connect(cg); cg.connect(masterGain);
  o.start(now); o.stop(now + 2.5);
}

function scheduleDrop() {
  if (!audioCtx) return;
  const delay = 1200 + Math.random() * 3200;
  dropTimer = setTimeout(() => {
    if (audioOn) playDrop();
    scheduleDrop();
  }, delay);
}

soundBtn.addEventListener('click', () => {
  if (!audioCtx) {
    initAudio();
    audioOn = true;
    masterGain.gain.setTargetAtTime(0.34, audioCtx.currentTime, 0.9);
    soundBtn.textContent = '🔊 关闭音效';
  } else {
    audioOn = !audioOn;
    masterGain.gain.setTargetAtTime(audioOn ? 0.34 : 0.0, audioCtx.currentTime, 0.4);
    soundBtn.textContent = audioOn ? '🔊 关闭音效' : '🔈 开启音效';
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
});

/* ============================================================
   鼠标视差
   ============================================================ */
let mouseX = 0, mouseY = 0, targetMX = 0, targetMY = 0;

window.addEventListener('pointermove', (e) => {
  targetMX = (e.clientX / window.innerWidth - 0.5) * 2.0;
  targetMY = (e.clientY / window.innerHeight - 0.5) * 2.0;
});

/* ============================================================
   动画循环
   ============================================================ */
const clock = new THREE.Clock();
let simTime = 0;

// 动画周期
const RISE_DUR = 6.5;
const HOLD_DUR = 3.2;
const RESET_DUR = 1.6;
const CYCLE = RISE_DUR + HOLD_DUR + RESET_DUR;
let cycleT = 0;

// 缓动函数
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeInOutQuad(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;
  cycleT += dt;
  if (cycleT > CYCLE) cycleT -= CYCLE;

  /* ---- 相机环绕 ---- */
  mouseX += (targetMX - mouseX) * 0.05;
  mouseY += (targetMY - mouseY) * 0.05;

  const az = -0.16 + mouseX * 0.36 + Math.sin(simTime * 0.04) * 0.05;
  const el = 0.30 + mouseY * 0.22 + Math.sin(simTime * 0.055) * 0.03;
  const dist = 20.5;

  camera.position.set(
    Math.sin(az) * Math.cos(el) * dist,
    Math.sin(el) * dist + 4.5,
    Math.cos(az) * Math.cos(el) * dist
  );
  camera.lookAt(0, 4.5, 0);

  /* ---- 更新各管 ---- */
  for (let i = 0; i < tubeObjs.length; i++) {
    const t = tubeObjs[i];

    // 计算当前上升进度
    let progress;
    let isResetting = false;

    if (cycleT < RISE_DUR) {
      // 上升阶段
      const localT = Math.max(0, cycleT - i * 0.1);
      progress = Math.min(1, localT / t.riseDur);
      progress = easeOutCubic(progress);
    } else if (cycleT < RISE_DUR + HOLD_DUR) {
      // 保持阶段
      progress = 1;
    } else {
      // 重置阶段
      const rt = (cycleT - RISE_DUR - HOLD_DUR) / RESET_DUR;
      progress = Math.max(0, 1 - easeInOutQuad(Math.min(1, rt * 1.4)));
      isResetting = true;
    }

    const hCur = t.hTarget * progress;
    const hBody = Math.max(0.001, hCur - t.hRise);

    // 液柱主体
    t.liquidBody.scale.y = hBody;
    t.liquidBody.position.y = SLOT_SURF + hBody / 2;

    // 内部亮芯
    t.liquidCore.scale.y = hBody * 0.96;
    t.liquidCore.position.y = SLOT_SURF + hBody * 0.48;

    // 弯月面位置
    t.meniscus.position.y = SLOT_SURF + hCur - t.hRise;
    t.meniscus.visible = hBody > 0.005;

    // 边缘高亮环
    t.edgeGlow.position.y = SLOT_SURF + hCur;
    t.edgeGlow.visible = hCur > 0.02;

    // 液面辉光
    t.surfaceGlow.position.y = SLOT_SURF + hCur + 0.04;
    t.surfaceGlow.visible = hCur > 0.02;

    // 液柱内粒子上升
    const pPos = t.pPos;
    for (let k = 0; k < t.P_N; k++) {
      const seed = t.particleSeeds[k];
      const py = ((simTime * (0.28 + seed * 0.35) + seed * 2.5) % 1.0);
      pPos[k * 3 + 1] = SLOT_SURF + py * hBody;
    }
    t.particles.geometry.attributes.position.needsUpdate = true;
    t.particles.visible = hBody > 0.05;

    // 液面波动
    const wob = Math.sin(simTime * 1.5 + i * 1.3) * 0.008;
    if (!isResetting) {
      t.meniscus.position.y += wob;
      t.edgeGlow.position.y += wob;
      t.surfaceGlow.position.y += wob * 1.2;
    }

    // 亮度脉动
    const brightPulse = 0.85 + 0.15 * Math.sin(simTime * 2.0 + i * 0.8);
    t.liquidMat.emissiveIntensity = 0.9 * brightPulse;
    t.menMat.emissiveIntensity = 1.1 * brightPulse;
    t.surfaceGlow.material.opacity = (0.5 + 0.2 * brightPulse) * Math.min(1, hCur * 3);
    t.edgeGlow.material.opacity = 0.5 + 0.25 * brightPulse;
  }

  /* ---- 液面轻微起伏 ---- */
  slotLiquid.position.y = -0.8 + Math.sin(simTime * 0.9) * 0.012;
  surfRing.material.opacity = 0.38 + 0.12 * Math.sin(simTime * 1.6);

  /* ---- 玻璃折射闪跃 ---- */
  sparkLight.position.set(
    Math.sin(simTime * 0.42) * 9.0,
    6.5 + Math.sin(simTime * 0.31 + 1.4) * 5.0,
    Math.cos(simTime * 0.37) * 9.0
  );
  sparkLight.intensity = 18 + Math.sin(simTime * 3.1) * 10;

  topLight.intensity = 38 + Math.sin(simTime * 0.85) * 8;

  /* ---- 微尘 ---- */
  if (window.__dust) window.__dust.material.uniforms.uTime.value = simTime;

  /* ---- UI 更新 ---- */
  for (let i = 0; i < tubeRowRefs.length; i++) {
    const { tube, barFill, val } = tubeRowRefs[i];

    // 计算当前进度对应的实际高度
    let prog;
    if (cycleT < RISE_DUR) {
      const idx = tubeObjs.indexOf(tube);
      const localT = Math.max(0, cycleT - idx * 0.1);
      prog = Math.min(1, localT / tube.riseDur);
      prog = easeOutCubic(prog);
    } else if (cycleT < RISE_DUR + HOLD_DUR) {
      prog = 1;
    } else {
      const rt = (cycleT - RISE_DUR - HOLD_DUR) / RESET_DUR;
      prog = Math.max(0, 1 - easeInOutQuad(Math.min(1, rt * 1.4)));
    }

    const hCur = tube.hTarget * prog;
    const hCm = hCur / CM_TO_UNIT;
    const pct = Math.min(100, (hCur / H_MAX) * 100);

    barFill.style.width = pct + '%';
    val.textContent = hCm.toFixed(2) + ' cm';
  }

  renderer.render(scene, camera);
}

/* ============================================================
   自适应
   ============================================================ */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const dpr = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);

  if (window.__dust) window.__dust.material.uniforms.uPixelRatio.value = dpr;
}

window.addEventListener('resize', onResize);

/* ============================================================
   启动
   ============================================================ */
animate();
</script>
