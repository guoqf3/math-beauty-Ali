<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维驻波编织 · 波动干涉网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>三维驻波编织 · 波动干涉网</h2>
        <div class="sub">Standing wave interference · Wave equation · Time‑evolving nodal lines</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">u₁=sin(√2·t)·sin(1.5x)·sin(2y)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">u₂=cos(√3·t)·sin(1.8y)·sin(2.2z)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">u₃=sin(π·t)·cos(2.5z)·sin(1.3x)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.6, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.58;
        const RANGE = 4.0;
        const GRID_RES = 72;
        const STEP = 2 * RANGE / GRID_RES;
        const SECTION_COUNT = 16;

        // 波动函数：三组驻波叠加
        function waveField(x, y, z, t) {
            const u1 = Math.sin(Math.sqrt(2) * t) * Math.sin(1.5 * x) * Math.sin(2.0 * y);
            const u2 = Math.cos(Math.sqrt(3) * t) * Math.sin(1.8 * y) * Math.sin(2.2 * z);
            const u3 = Math.sin(Math.PI * t) * Math.cos(2.5 * z) * Math.sin(1.3 * x);
            return u1 + u2 + u3;
        }

        // 在2D网格上追踪零等值线，返回线段数组
        function traceZeroCurves2D(coordType, slicePos, t, gridN) {
            const segments = [];
            const h = STEP;
            for (let i = 0; i < gridN; i++) {
                const u1 = -RANGE + i * h;
                const u2 = u1 + h;
                for (let j = 0; j < gridN; j++) {
                    const v1 = -RANGE + j * h;
                    const v2 = v1 + h;
                    let f11, f12, f21, f22;
                    if (coordType === 'z') {
                        f11 = waveField(u1, v1, slicePos, t);
                        f12 = waveField(u1, v2, slicePos, t);
                        f21 = waveField(u2, v1, slicePos, t);
                        f22 = waveField(u2, v2, slicePos, t);
                    } else if (coordType === 'x') {
                        f11 = waveField(slicePos, v1, u1, t);
                        f12 = waveField(slicePos, v2, u1, t);
                        f21 = waveField(slicePos, v1, u2, t);
                        f22 = waveField(slicePos, v2, u2, t);
                    } else {
                        f11 = waveField(v1, slicePos, u1, t);
                        f12 = waveField(v2, slicePos, u1, t);
                        f21 = waveField(v1, slicePos, u2, t);
                        f22 = waveField(v2, slicePos, u2, t);
                    }
                    const hasPos = f11 > 0 || f12 > 0 || f21 > 0 || f22 > 0;
                    const hasNeg = f11 < 0 || f12 < 0 || f21 < 0 || f22 < 0;
                    if (!hasPos || !hasNeg) continue;

                    const pts = [];
                    if (f11 * f21 < 0) {
                        const rt = Math.abs(f11) / (Math.abs(f11) + Math.abs(f21));
                        pts.push([u1 + rt * h, v1]);
                    }
                    if (f11 * f12 < 0) {
                        const rt = Math.abs(f11) / (Math.abs(f11) + Math.abs(f12));
                        pts.push([u1, v1 + rt * h]);
                    }
                    if (f21 * f22 < 0) {
                        const rt = Math.abs(f21) / (Math.abs(f21) + Math.abs(f22));
                        pts.push([u2, v1 + rt * h]);
                    }
                    if (f12 * f22 < 0) {
                        const rt = Math.abs(f12) / (Math.abs(f12) + Math.abs(f22));
                        pts.push([u1 + rt * h, v2]);
                    }
                    if (pts.length >= 2) {
                        for (let k = 0; k < pts.length - 1; k++) {
                            const [ax, ay] = pts[k];
                            const [bx, by] = pts[k + 1];
                            let p1, p2;
                            if (coordType === 'z') {
                                p1 = new THREE.Vector3(ax, ay, slicePos).multiplyScalar(SCALE);
                                p2 = new THREE.Vector3(bx, by, slicePos).multiplyScalar(SCALE);
                            } else if (coordType === 'x') {
                                p1 = new THREE.Vector3(slicePos, ax, ay).multiplyScalar(SCALE);
                                p2 = new THREE.Vector3(slicePos, bx, by).multiplyScalar(SCALE);
                            } else {
                                p1 = new THREE.Vector3(ax, slicePos, ay).multiplyScalar(SCALE);
                                p2 = new THREE.Vector3(bx, slicePos, by).multiplyScalar(SCALE);
                            }
                            if (p1.length() < 6 && p2.length() < 6) {
                                segments.push([p1, p2]);
                            }
                        }
                    }
                }
            }
            return segments;
        }

        // 创建三族截面的LineSegments
        function createSectionSegments(color, opacity, totalSegs) {
            const posArray = new Float32Array(totalSegs * 2 * 3);
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            return new THREE.LineSegments(geom, mat);
        }

        // 预分配大缓冲区
        const MAX_SEGS = 18000;
        const goldSegments = createSectionSegments(COLOR_GOLD, 0.50, MAX_SEGS);
        const cyanSegments = createSectionSegments(COLOR_CYAN, 0.50, MAX_SEGS);
        const magentaSegments = createSectionSegments(COLOR_MAGENTA, 0.50, MAX_SEGS);

        const rootGroup = new THREE.Group();
        rootGroup.name = 'wave-weave';
        rootGroup.add(goldSegments);
        rootGroup.add(cyanSegments);
        rootGroup.add(magentaSegments);
        scene.add(rootGroup);

        // 更新函数
        function updateAllSections(t) {
            const gridN = GRID_RES;
            let goldIdx = 0,
                cyanIdx = 0,
                magentaIdx = 0;
            const goldArr = goldSegments.geometry.attributes.position.array;
            const cyanArr = cyanSegments.geometry.attributes.position.array;
            const magentaArr = magentaSegments.geometry.attributes.position.array;

            const writeSegments = (segments, arr, idxObj) => {
                for (const [a, b] of segments) {
                    if (idxObj.val + 6 > arr.length) break;
                    arr[idxObj.val++] = a.x;
                    arr[idxObj.val++] = a.y;
                    arr[idxObj.val++] = a.z;
                    arr[idxObj.val++] = b.x;
                    arr[idxObj.val++] = b.y;
                    arr[idxObj.val++] = b.z;
                }
                return idxObj.val;
            };

            const goldIdxObj = { val: 0 };
            const cyanIdxObj = { val: 0 };
            const magentaIdxObj = { val: 0 };

            // z截面（金色）
            for (let s = 0; s < SECTION_COUNT; s++) {
                const slicePos = -RANGE + (s + 0.5) * 2 * RANGE / SECTION_COUNT;
                const segs = traceZeroCurves2D('z', slicePos, t, gridN);
                goldIdxObj.val = writeSegments(segs, goldArr, goldIdxObj);
            }
            // x截面（青色）
            for (let s = 0; s < SECTION_COUNT; s++) {
                const slicePos = -RANGE + (s + 0.5) * 2 * RANGE / SECTION_COUNT;
                const segs = traceZeroCurves2D('x', slicePos, t, gridN);
                cyanIdxObj.val = writeSegments(segs, cyanArr, cyanIdxObj);
            }
            // y截面（品红）
            for (let s = 0; s < SECTION_COUNT; s++) {
                const slicePos = -RANGE + (s + 0.5) * 2 * RANGE / SECTION_COUNT;
                const segs = traceZeroCurves2D('y', slicePos, t, gridN);
                magentaIdxObj.val = writeSegments(segs, magentaArr, magentaIdxObj);
            }

            goldSegments.geometry.setDrawRange(0, goldIdxObj.val / 3);
            goldSegments.geometry.attributes.position.needsUpdate = true;
            cyanSegments.geometry.setDrawRange(0, cyanIdxObj.val / 3);
            cyanSegments.geometry.attributes.position.needsUpdate = true;
            magentaSegments.geometry.setDrawRange(0, magentaIdxObj.val / 3);
            magentaSegments.geometry.attributes.position.needsUpdate = true;
        }

        // 辅助立方体参考框架
        const boxSize = RANGE * SCALE;
        const boxGeom = new THREE.BoxGeometry(boxSize * 2, boxSize * 2, boxSize * 2);
        const boxEdges = new THREE.EdgesGeometry(boxGeom);
        rootGroup.add(new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.14, depthWrite: true, depthTest: true
        })));

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        let animFrameId;
        let lastUpdateT = -10;
        const updateInterval = 0.15; // 每0.15秒更新一次截面

        function mainLoop() {
            const t = getElapsed();

            if (t - lastUpdateT > updateInterval) {
                try {
                    updateAllSections(t);
                    lastUpdateT = t;
                } catch (e) {
                    console.warn('更新截面错误:', e);
                }
            }

            rootGroup.rotation.x = t * 0.12;
            rootGroup.rotation.y = t * 0.19;
            rootGroup.rotation.z = t * 0.07;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.7 + Math.sin(t * 0.15) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 预渲染首帧
        updateAllSections(0);
        renderer.render(scene, camera);
        scheduleFrame();

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 三维驻波干涉编织动画已稳定运行');
    </script>
</body>
</html>
