<style>

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #010104;
    font-family: "Consolas", "SF Mono", "Menlo", "Microsoft YaHei", monospace;
    color: #d6e8ff;

  body {

      radial-gradient(ellipse 45% 55% at 76% 70%, rgba(130, 40, 170, 0.16) 0%, transparent 60%),

  /* ===== 面板 ===== */

    position: fixed; z-index: 20;

  /* ===== 控制 ===== */

    bottom: 26px; left: 50%; transform: translateX(-50%);

    transition: all 0.32s cubic-bezier(.2,.8,.3,1);
    box-shadow: 0 0 18px rgba(80, 140, 255, 0.15), inset 0 0 18px rgba(80, 110, 255, 0.08);
  }
  .btn:hover {
    color: #fff; border-color: rgba(150, 220, 255, 0.9);
    box-shadow: 0 0 40px rgba(90, 180, 255, 0.5), inset 0 0 28px rgba(90, 140, 255, 0.22);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn.on {
    color: #0a1220;
    background: linear-gradient(145deg, #7ce7ff, #4a9bff);

  /* ===== 启动遮罩 ===== */
  #overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    background: radial-gradient(circle at 50% 50%, rgba(5, 10, 28, 0.65), rgba(0, 0, 2, 0.96));
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    transition: opacity 0.9s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  .boot-title {
    font-size: 12px; letter-spacing: 0.6em; text-indent: 0.6em;

  }
  .boot-sub {

  #startBtn {
    padding: 19px 54px; font-family: inherit; font-size: 15px;

    border-radius: 7px; cursor: pointer;
    transition: all 0.4s cubic-bezier(.2,.8,.3,1);

  #startBtn:hover {
    color: #fff; letter-spacing: 0.46em; text-indent: 0.46em;
    border-color: rgba(150, 230, 255, 0.9);
    box-shadow: 0 0 60px rgba(100, 190, 255, 0.55),

  #startBtn:active { transform: translateY(0) scale(0.99); }

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    .panel.info { top: 12px; left: 12px; padding: 11px 13px; max-width: 250px; }

    .hud .row { font-size: 8.5px; padding: 3px 0; }
    .panel.controls { bottom: 16px; padding: 8px 12px; gap: 8px; }
    .btn { font-size: 9px; padding: 7px 14px; letter-spacing: 0.12em; }
  }

<canvas id="scene"></canvas>

    <div class="eq"><span class="var">r</span><sub>s</sub> <span class="op">=</span> 2<span class="var">GM</span>/<span class="var">c</span><sup>2</sup> &nbsp;&nbsp;<span class="note">史瓦西半径</span></div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. 渲染基础
   ============================================================ */
const canvas   = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, 3000);
camera.position.set(0, 58, 106);
camera.lookAt(0, -6, 0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   2. 贴图
   ============================================================ */
function makeGlowTexture(power) {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  const stops = power === 'sharp'
    ? [[0,'rgba(255,255,255,1)'],[0.10,'rgba(255,255,255,0.9)'],[0.26,'rgba(210,235,255,0.34)'],[0.55,'rgba(140,180,255,0.07)'],[1,'rgba(0,0,0,0)']]
    : [[0,'rgba(255,255,255,1)'],[0.18,'rgba(255,255,255,0.7)'],[0.42,'rgba(190,225,255,0.22)'],[0.74,'rgba(130,170,255,0.05)'],[1,'rgba(0,0,0,0)']];
  for (const [p, col] of stops) g.addColorStop(p, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glowTex  = makeGlowTexture('soft');
const sharpTex = makeGlowTexture('sharp');

/* ============================================================
   3. 时空曲面（引力势阱）
   ============================================================ */
const R0     = 58;      // 平面半径
const COEF   = 88;      // 势阱强度系数
const SOFT   = 4.2;     // 软化尺度
const MAXDEPTH = COEF / SOFT - COEF / Math.sqrt(R0*R0 + SOFT*SOFT);   // 中心深度

function surfaceY(x, z) {
  const r = Math.hypot(x, z);
  return -COEF / Math.sqrt(r*r + SOFT*SOFT)
       + COEF / Math.sqrt(R0*R0 + SOFT*SOFT);
}

/* ---- 构建网格线 ---- */
function buildGrid() {
  const positions = [];
  const colors = [];
  const cA = new THREE.Color();
  const cB = new THREE.Color();

  const LINES   = 56;
  const SAMPLES = 112;
  const EXP     = 1.32;

  const warp = (u) => Math.sign(u) * Math.pow(Math.abs(u), EXP);
  const colAt = (y, c) => {
    const t = Math.min(1, Math.max(0, -y / 20));
    c.setHSL(0.545 + 0.34 * t, 0.95, 0.44 + 0.24 * t);
  };

  // 沿 Z 方向的线（x 固定）
  for (let i = 0; i < LINES; i++) {
    const u = (i / (LINES - 1)) * 2 - 1;
    const x = R0 * warp(u);
    for (let j = 0; j < SAMPLES - 1; j++) {
      const v0 = (j / (SAMPLES - 1)) * 2 - 1;
      const v1 = ((j + 1) / (SAMPLES - 1)) * 2 - 1;
      const z0 = R0 * warp(v0);
      const z1 = R0 * warp(v1);
      const y0 = surfaceY(x, z0);
      const y1 = surfaceY(x, z1);
      positions.push(x, y0, z0, x, y1, z1);
      colAt(y0, cA); colAt(y1, cB);
      colors.push(cA.r, cA.g, cA.b, cB.r, cB.g, cB.b);
    }
  }

  // 沿 X 方向的线（z 固定）
  for (let i = 0; i < LINES; i++) {
    const u = (i / (LINES - 1)) * 2 - 1;
    const z = R0 * warp(u);
    for (let j = 0; j < SAMPLES - 1; j++) {
      const v0 = (j / (SAMPLES - 1)) * 2 - 1;
      const v1 = ((j + 1) / (SAMPLES - 1)) * 2 - 1;
      const x0 = R0 * warp(v0);
      const x1 = R0 * warp(v1);
      const y0 = surfaceY(x0, z);
      const y1 = surfaceY(x1, z);
      positions.push(x0, y0, z, x1, y1, z);
      colAt(y0, cA); colAt(y1, cB);
      colors.push(cA.r, cA.g, cA.b, cB.r, cB.g, cB.b);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(colors, 3));

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.42,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  return new THREE.LineSegments(geo, mat);
}
const grid = buildGrid();
scene.add(grid);

/* ---- 势阱内部的柔光体（显现凹陷） ---- */
(function buildWellGlow() {
  const seg = 64;
  const rings = 30;
  const pos = [];
  const col = [];
  const c = new THREE.Color();

  for (let i = 0; i < rings; i++) {
    const t0 = i / rings;
    const t1 = (i + 1) / rings;
    const r0 = 0.8 + t0 * 34;
    const r1 = 0.8 + t1 * 34;
    for (let j = 0; j < seg; j++) {
      const a0 = (j / seg) * Math.PI * 2;
      const a1 = ((j + 1) / seg) * Math.PI * 2;

      const x0 = Math.cos(a0) * r0, z0 = Math.sin(a0) * r0;
      const x1 = Math.cos(a0) * r1, z1 = Math.sin(a0) * r1;
      const x2 = Math.cos(a1) * r1, z2 = Math.sin(a1) * r1;

      const y0 = surfaceY(x0, z0) + 0.12;
      const y1 = surfaceY(x1, z1) + 0.12;
      const y2 = surfaceY(x2, z2) + 0.12;

      pos.push(x0, y0, z0, x1, y1, z1, x2, y2, z2);

      const tt = 1 - t0;
      c.setHSL(0.62 + 0.22 * tt, 0.9, 0.16 + 0.12 * tt);
      col.push(c.r, c.g, c.b, c.r, c.g, c.b, c.r, c.g, c.b);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));

  const mat = new THREE.MeshBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.16,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  scene.add(new THREE.Mesh(geo, mat));
})();

/* ---- 外围天际光环（平面边界） ---- */
(function buildRim() {
  const seg = 180;
  const pos = [];
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    pos.push(Math.cos(a) * R0, 0, Math.sin(a) * R0);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  scene.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0x4aa8ff, transparent: true, opacity: 0.28,
    blending: THREE.AdditiveBlending, depthWrite: false
  })));
})();

/* ============================================================
   4. 中心质量天体（奇点 / 黑洞）
   ============================================================ */
const CORE_Y = surfaceY(0, 0);

const coreMesh = new THREE.Mesh(
  new THREE.SphereGeometry(2.4, 40, 28),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
coreMesh.position.set(0, CORE_Y + 1.4, 0);
scene.add(coreMesh);

/* 核心外层光晕 */
const coreGlow1 = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xa8d8ff, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
coreGlow1.scale.set(26, 26, 1);
coreGlow1.position.copy(coreMesh.position);
scene.add(coreGlow1);

const coreGlow2 = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0x8f6dff, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
coreGlow2.scale.set(64, 64, 1);
coreGlow2.position.copy(coreMesh.position);
scene.add(coreGlow2);

/* 引力透镜光晕环 */
const lensRings = new THREE.Group();
for (let i = 0; i < 3; i++) {
  const rr = 7 + i * 4.5;
  const ringGeo = new THREE.RingGeometry(rr, rr + 0.22, 128);
  const ringMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(0.56 + i * 0.09, 0.9, 0.6),
    transparent: true,
    opacity: 0.22 - i * 0.05,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = CORE_Y + 1.0;
  lensRings.add(ring);
}
scene.add(lensRings);

/* ============================================================
   5. 背景星空
   ============================================================ */
(function buildStars() {
  const N = 2200;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();

  for (let i = 0; i < N; i++) {
    const r     = 260 + Math.random() * 620;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(Math.random() * 2 - 1);

    pos[i*3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3 + 1] = r * Math.cos(phi);
    pos[i*3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const hue = Math.random() < 0.24 ? 0.08 + Math.random() * 0.08
              : Math.random() < 0.5  ? 0.55 + Math.random() * 0.12
              : 0.62 + Math.random() * 0.1;
    c.setHSL(hue, 0.55 + Math.random() * 0.4, 0.55 + Math.random() * 0.4);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size: 2.4, map: sharpTex, vertexColors: true,
    transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  })));
})();

/* ============================================================
   6. 五彩极光波段
   ============================================================ */
const auroraGroup = new THREE.Group();
scene.add(auroraGroup);

function makeAuroraBand(radius, tilt, hue0, hue1, count) {
  const pos = [];
  const col = [];
  const c = new THREE.Color();

  for (let i = 0; i <= count; i++) {
    const t = i / count;
    const a = t * Math.PI * 2;
    const r = radius + Math.sin(a * 3.0) * 8;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    const y = Math.sin(a * 2.0) * 12;

    pos.push(x, y, z);
    c.setHSL(hue0 + (hue1 - hue0) * t, 0.85, 0.6);
    col.push(c.r, c.g, c.b);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));

  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.32,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  line.rotation.x = tilt;
  return line;
}

auroraGroup.add(makeAuroraBand(155, 0.32,  0.52, 0.78, 300));
auroraGroup.add(makeAuroraBand(185, -0.45, 0.78, 0.06, 300));
auroraGroup.add(makeAuroraBand(215, 0.62,  0.06, 0.55, 300));
auroraGroup.add(makeAuroraBand(245, -0.22, 0.62, 0.92, 320));

/* ============================================================
   7. 轨道天体（测地线运动）
   ============================================================ */
const GM      = 820;
const G_SOFT  = 2.4;
const MAXTRAIL = 78;

const bodies = [];
const bodyGeo = new THREE.SphereGeometry(0.62, 16, 12);

function spawnBody(radiusMin, radiusMax, captureMode) {
  const r = radiusMin + Math.random() * (radiusMax - radiusMin);
  const a = Math.random() * Math.PI * 2;

  const x = Math.cos(a) * r;
  const z = Math.sin(a) * r;

  const r2 = r * r;
  const vCirc = Math.sqrt(GM * r2 / Math.pow(r2 + G_SOFT*G_SOFT, 1.5));

  // 捕获模式：速度不足，会向内螺旋；正常模式：接近圆轨道
  const speedFactor = captureMode
    ? 0.45 + Math.random() * 0.35
    : 0.86 + Math.random() * 0.24;

  const v = vCirc * speedFactor;

  const vx = -Math.sin(a) * v;
  const vz =  Math.cos(a) * v;

  const hue = Math.random();

  /* ---- 天体网格 ---- */
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(hue, 0.85, 0.68)
  });
  const mesh = new THREE.Mesh(bodyGeo, mat);
  scene.add(mesh);

  /* ---- 天体光晕 ---- */
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex,
    color: new THREE.Color().setHSL(hue, 0.9, 0.62),
    transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  halo.scale.set(5.4, 5.4, 1);
  scene.add(halo);

  /* ---- 拖尾 ---- */
  const trailArr = new Float32Array(MAXTRAIL * 3);
  const trailCol = new Float32Array(MAXTRAIL * 3);
  const tc = new THREE.Color();

  for (let i = 0; i < MAXTRAIL; i++) {
    trailArr[i*3]     = x;
    trailArr[i*3 + 1] = surfaceY(x, z) + 0.7;
    trailArr[i*3 + 2] = z;

    const fade = Math.pow(1 - i / MAXTRAIL, 1.9);
    tc.setHSL(hue, 0.9, 0.62 * fade + 0.08);
    trailCol[i*3]     = tc.r * fade;
    trailCol[i*3 + 1] = tc.g * fade;
    trailCol[i*3 + 2] = tc.b * fade;
  }

  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailArr, 3).setUsage(THREE.DynamicDrawUsage));
  trailGeo.setAttribute('color',    new THREE.BufferAttribute(trailCol, 3));

  const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(trailLine);

  bodies.push({
    x, z, vx, vz,
    mesh, halo, trailLine, trailArr, trailGeo,
    hue,
    capture: captureMode,
    age: 0
  });
}

function initBodies() {
  for (const b of bodies) {
    scene.remove(b.mesh);
    scene.remove(b.halo);
    scene.remove(b.trailLine);
    b.mesh.material.dispose();
    b.halo.material.dispose();
    b.trailLine.material.dispose();
    b.trailGeo.dispose();
  }
  bodies.length = 0;

  // 8 个稳定轨道 + 4 个捕获螺旋
  for (let i = 0; i < 8; i++) spawnBody(14, 46, false);
  for (let i = 0; i < 4; i++) spawnBody(30, 52, true);
}
initBodies();

/* ============================================================
   8. 浮游粒子（月华流光）
   ============================================================ */
const FLOAT_N = 600;
const floatPos = new Float32Array(FLOAT_N * 3);
const floatVel = [];
const floatCol = new Float32Array(FLOAT_N * 3);

(function initFloat() {
  const c = new THREE.Color();
  for (let i = 0; i < FLOAT_N; i++) {
    const r = 5 + Math.random() * 55;
    const a = Math.random() * Math.PI * 2;
    floatPos[i*3]     = Math.cos(a) * r;
    floatPos[i*3 + 1] = Math.random() * 40 - 10;
    floatPos[i*3 + 2] = Math.sin(a) * r;

    floatVel.push({
      x: (Math.random() - 0.5) * 0.9,
      y: 0.15 + Math.random() * 0.6,
      z: (Math.random() - 0.5) * 0.9,
      phase: Math.random() * Math.PI * 2
    });

    c.setHSL(0.55 + Math.random() * 0.35, 0.85, 0.65);
    floatCol[i*3] = c.r; floatCol[i*3+1] = c.g; floatCol[i*3+2] = c.b;
  }
})();

const floatGeo = new THREE.BufferGeometry();
floatGeo.setAttribute('position', new THREE.BufferAttribute(floatPos, 3).setUsage(THREE.DynamicDrawUsage));
floatGeo.setAttribute('color',    new THREE.BufferAttribute(floatCol, 3));

scene.add(new THREE.Points(floatGeo, new THREE.PointsMaterial({
  size: 0.85, map: glowTex, vertexColors: true,
  transparent: true, opacity: 0.62,
  blending: THREE.AdditiveBlending, depthWrite: false,
  sizeAttenuation: true
})));

/* ============================================================
   9. 音频系统
   ============================================================ */
let actx = null;
let masterGain = null;
let audioNodes = null;
let pulseTimer = null;
let lastChime = 0;

const SCALE = [0, 3, 5, 7, 10, 12, 15];

function makeBrownBuffer(seconds) {
  const len = Math.floor(actx.sampleRate * seconds);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;
    d[i] = last * 3.4;
  }
  return buf;
}

function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();

  masterGain = actx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(actx.destination);
  masterGain.gain.exponentialRampToValueAtTime(0.8, actx.currentTime + 3.2);

  /* ---- 深空低音 drone ---- */
  const o1 = actx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 48;
  const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 48.6;
  const o3 = actx.createOscillator(); o3.type = 'triangle'; o3.frequency.value = 72;

  const droneLP = actx.createBiquadFilter();
  droneLP.type = 'lowpass'; droneLP.frequency.value = 200;

  const droneG = actx.createGain(); droneG.gain.value = 0.10;

  o1.connect(droneLP); o2.connect(droneLP); o3.connect(droneLP);
  droneLP.connect(droneG); droneG.connect(masterGain);
  o1.start(); o2.start(); o3.start();

  /* ---- 星际噪声层 ---- */
  const nSrc = actx.createBufferSource();
  nSrc.buffer = makeBrownBuffer(5);
  nSrc.loop = true;

  const nBP = actx.createBiquadFilter();
  nBP.type = 'bandpass'; nBP.frequency.value = 340; nBP.Q.value = 0.7;

  const nG = actx.createGain(); nG.gain.value = 0.016;

  nSrc.connect(nBP); nBP.connect(nG); nG.connect(masterGain);
  nSrc.start();

  /* ---- 缓慢 LFO ---- */
  const lfo = actx.createOscillator();
  lfo.frequency.value = 0.06;
  const lfoG = actx.createGain(); lfoG.gain.value = 180;
  lfo.connect(lfoG); lfoG.connect(nBP.frequency);
  lfo.start();

  /* ---- 高频空间哨声 ---- */
  const w1 = actx.createOscillator();
  w1.type = 'sine'; w1.frequency.value = 1860;
  const wG = actx.createGain(); wG.gain.value = 0.0001;
  w1.connect(wG); wG.connect(masterGain);
  w1.start();
  wG.gain.exponentialRampToValueAtTime(0.008, actx.currentTime + 6);

  const wLfo = actx.createOscillator();
  wLfo.frequency.value = 0.11;
  const wLfoG = actx.createGain(); wLfoG.gain.value = 340;
  wLfo.connect(wLfoG); wLfoG.connect(w1.frequency);
  wLfo.start();

  audioNodes = { droneLP, droneG, nBP, nG, wG };

  /* ---- 启动和弦 ---- */
  [0, 7, 12, 19].forEach((semi, idx) => {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.value = 110 * Math.pow(2, semi / 12);

    const g = actx.createGain();
    const st = actx.currentTime + idx * 0.18;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.09, st + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 3.8);

    o.connect(g); g.connect(masterGain);
    o.start(st); o.stop(st + 4.0);
  });

  scheduleChime();
}

function playChime() {
  if (!actx || !masterGain) return;
  const now = actx.currentTime;
  if (now - lastChime < 0.9) return;
  lastChime = now;

  const deg = SCALE[Math.floor(Math.random() * SCALE.length)];
  const oct = Math.random() < 0.55 ? 1 : 2;
  const freq = 220 * Math.pow(2, (deg + 12 * oct) / 12);

  const o1 = actx.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
  const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.01;

  const g1 = actx.createGain(); g1.gain.value = 0.5;
  const g2 = actx.createGain(); g2.gain.value = 0.22;

  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(3600, now);
  filt.frequency.exponentialRampToValueAtTime(420, now + 2.6);

  const env = actx.createGain();
  env.gain.setValueAtTime(0.0001, now);
  env.gain.exponentialRampToValueAtTime(0.05, now + 0.03);
  env.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

  o1.connect(g1); g1.connect(filt);
  o2.connect(g2); g2.connect(filt);
  filt.connect(env); env.connect(masterGain);

  o1.start(now); o1.stop(now + 3.0);
  o2.start(now); o2.stop(now + 3.0);
}

function scheduleChime() {
  if (pulseTimer) clearTimeout(pulseTimer);
  pulseTimer = setTimeout(() => {
    playChime();
    scheduleChime();
  }, 1800 + Math.random() * 4200);
}

/* ============================================================
   10. 物理更新
   ============================================================ */
function integrate(h) {
  for (const b of bodies) {
    const r2 = b.x * b.x + b.z * b.z;
    const d  = Math.pow(r2 + G_SOFT * G_SOFT, 1.5);
    const a  = -GM / d;

    b.vx += a * b.x * h;
    b.vz += a * b.z * h;
    b.x  += b.vx * h;
    b.z  += b.vz * h;
    b.age += h;

    const r = Math.hypot(b.x, b.z);

    // 逃逸或坠入 → 重新生成
    if (r > R0 * 1.25 || r < 2.4 || b.age > 60 + Math.random() * 40) {
      respawn(b);
    }
  }
}

function respawn(b) {
  const capture = Math.random() < 0.3;
  const r = capture ? 34 + Math.random() * 18 : 16 + Math.random() * 32;
  const a = Math.random() * Math.PI * 2;

  b.x = Math.cos(a) * r;
  b.z = Math.sin(a) * r;

  const r2 = r * r;
  const vCirc = Math.sqrt(GM * r2 / Math.pow(r2 + G_SOFT*G_SOFT, 1.5));
  const sf = capture ? 0.45 + Math.random() * 0.3 : 0.86 + Math.random() * 0.24;
  const v = vCirc * sf;

  b.vx = -Math.sin(a) * v;
  b.vz =  Math.cos(a) * v;
  b.capture = capture;
  b.age = 0;

  const hue = Math.random();
  b.hue = hue;
  b.mesh.material.color.setHSL(hue, 0.85, 0.68);
  b.halo.material.color.setHSL(hue, 0.9, 0.62);

  // 重置拖尾
  const tc = new THREE.Color();
  for (let i = 0; i < MAXTRAIL; i++) {
    b.trailArr[i*3]     = b.x;
    b.trailArr[i*3 + 1] = surfaceY(b.x, b.z) + 0.7;
    b.trailArr[i*3 + 2] = b.z;

    const fade = Math.pow(1 - i / MAXTRAIL, 1.9);
    tc.setHSL(hue, 0.9, 0.62 * fade + 0.08);
    const ca = b.trailGeo.attributes.color.array;
    ca[i*3]     = tc.r * fade;
    ca[i*3 + 1] = tc.g * fade;
    ca[i*3 + 2] = tc.b * fade;
  }
  b.trailGeo.attributes.color.needsUpdate = true;
}

/* ---- 更新天体视觉 ---- */
function updateBodies(dt) {
  for (const b of bodies) {
    const y = surfaceY(b.x, b.z) + 0.7;

    b.mesh.position.set(b.x, y, b.z);
    b.halo.position.set(b.x, y, b.z);

    const r = Math.hypot(b.x, b.z);
    const depth = Math.min(1, -surfaceY(b.x, b.z) / MAXDEPTH);
    b.mesh.material.color.setHSL(b.hue, 0.85, 0.5 + 0.28 * depth);
    b.halo.material.opacity = 0.5 + 0.45 * depth;

    /* 拖尾前移 */
    b.trailArr.copyWithin(3, 0, (MAXTRAIL - 1) * 3);
    b.trailArr[0] = b.x;
    b.trailArr[1] = y;
    b.trailArr[2] = b.z;
    b.trailGeo.attributes.position.needsUpdate = true;
  }
}

/* ---- 浮游粒子 ---- */
function updateFloat(dt, time) {
  const arr = floatGeo.attributes.position.array;
  for (let i = 0; i < FLOAT_N; i++) {
    const v = floatVel[i];
    const i3 = i * 3;

    arr[i3]     += v.x * dt;
    arr[i3 + 1] += v.y * dt;
    arr[i3 + 2] += v.z * dt;

    // 向中心轻微吸引
    const r = Math.hypot(arr[i3], arr[i3 + 2]);
    if (r > 1) {
      arr[i3]     -= arr[i3] / r * dt * 0.35;
      arr[i3 + 2] -= arr[i3 + 2] / r * dt * 0.35;
    }

    if (arr[i3 + 1] > 34) arr[i3 + 1] = -10;

    // 超出半径则回拉
    if (r > 62) {
      arr[i3]     *= 0.94;
      arr[i3 + 2] *= 0.94;
    }
  }
  floatGeo.attributes.position.needsUpdate = true;
}

/* ============================================================
   11. 视角模式
   ============================================================ */
const VIEW_MODES = [
  { name: '环绕', r: 106, h: 58,  look: -6 },
  { name: '俯视', r: 72,  h: 108, look: -12 },
  { name: '掠视', r: 96,  h: 16,  look: -14 }
];
let viewIdx = 0;

/* ============================================================
   12. 主循环
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
let paused  = false;
let hudAcc  = 0;

function animate() {
  requestAnimationFrame(animate);

  let dt = Math.min(clock.getDelta(), 0.05);
  if (paused) dt = 0;
  elapsed += dt;

  /* ---- 物理子步积分 ---- */
  if (dt > 0) {
    const sub = Math.min(8, Math.max(1, Math.ceil(dt / 0.009)));
    const h = dt / sub;
    for (let s = 0; s < sub; s++) integrate(h);
  }

  /* ---- 视觉更新 ---- */
  updateBodies(dt);
  updateFloat(dt, elapsed);

  /* ---- 网格脉动 ---- */
  grid.material.opacity = 0.36 + 0.09 * Math.sin(elapsed * 0.9);

  /* ---- 核心脉动 ---- */
  const pulse = 1 + 0.10 * Math.sin(elapsed * 2.1);
  coreGlow1.scale.set(26 * pulse, 26 * pulse, 1);
  coreGlow2.scale.set(64 * (1 + 0.06 * Math.sin(elapsed * 1.3)), 64 * (1 + 0.06 * Math.sin(elapsed * 1.3)), 1);
  coreGlow1.material.opacity = 0.75 + 0.2 * Math.sin(elapsed * 2.6);

  lensRings.rotation.y = elapsed * 0.28;
  lensRings.children.forEach((rg, i) => {
    rg.material.opacity = (0.18 - i * 0.04) * (1 + 0.5 * Math.sin(elapsed * 1.5 + i));
  });

  /* ---- 极光带旋转 ---- */
  auroraGroup.rotation.y = elapsed * 0.016;
  auroraGroup.children.forEach((band, i) => {
    band.material.opacity = 0.22 + 0.14 * Math.sin(elapsed * 0.5 + i * 1.6);
  });

  /* ---- 相机 ---- */
  const vm = VIEW_MODES[viewIdx];
  const ang = elapsed * 0.045;
  const targetX = Math.cos(ang) * vm.r;
  const targetZ = Math.sin(ang) * vm.r;
  const targetY = vm.h + Math.sin(elapsed * 0.22) * 4;

  camera.position.x += (targetX - camera.position.x) * Math.min(1, dt * 1.6);
  camera.position.y += (targetY - camera.position.y) * Math.min(1, dt * 1.6);
  camera.position.z += (targetZ - camera.position.z) * Math.min(1, dt * 1.6);
  camera.lookAt(0, vm.look, 0);

  /* ---- HUD ---- */
  hudAcc += dt;
  if (hudAcc > 0.18) {
    hudAcc = 0;
    const el = (id) => document.getElementById(id);

    let sumR = 0, n = 0;
    for (const b of bodies) {
      const r = Math.hypot(b.x, b.z);
      if (r < R0) { sumR += r; n++; }
    }
    const avgR = n ? sumR / n : 0;

    if (el('hud-depth')) el('hud-depth').textContent = MAXDEPTH.toFixed(1);
    if (el('hud-n'))     el('hud-n').textContent = n;
    if (el('hud-r'))     el('hud-r').textContent = avgR.toFixed(1) + ' u';

    const rs = 2.4;
    const dil = avgR > rs ? Math.sqrt(1 - rs / avgR) : 0;
    if (el('hud-dil'))   el('hud-dil').textContent = dil.toFixed(4);

    const alpha = avgR > 0 ? (4 * rs / avgR * 57.2958).toFixed(3) : '—';
    if (el('hud-alpha')) el('hud-alpha').textContent = alpha + '°';
  }

  /* ---- 音频动态 ---- */
  if (actx && audioNodes) {
    const t = actx.currentTime;
    let sumR = 0, n = 0;
    for (const b of bodies) {
      const r = Math.hypot(b.x, b.z);
      if (r < R0) { sumR += r; n++; }
    }
    const avgR = n ? sumR / n : 30;
    const near = Math.max(0, 1 - avgR / 55);

    audioNodes.nBP.frequency.setTargetAtTime(260 + 900 * near, t, 0.5);
    audioNodes.nG.gain.setTargetAtTime(0.012 + 0.028 * near, t, 0.5);
    audioNodes.droneLP.frequency.setTargetAtTime(180 + 260 * near, t, 0.5);
  }

  renderer.render(scene, camera);
}
animate();

/* ============================================================
   13. 交互
   ============================================================ */
const overlay  = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const pauseBtn = document.getElementById('pauseBtn');
const viewBtn  = document.getElementById('viewBtn');

function startExperience() {
  overlay.classList.add('hidden');
  try {
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {
    console.warn('音频初始化失败：', e);
  }
}

startBtn.addEventListener('click', startExperience);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) startExperience();
});
document.addEventListener('pointerdown', () => {
  if (actx && actx.state === 'suspended') actx.resume();
});

/* ---- 重置 ---- */
resetBtn.addEventListener('click', () => {
  initBodies();
  elapsed = 0;
  paused = false;
  pauseBtn.textContent = '暂 停 / 继 续';
  pauseBtn.classList.remove('on');
});

/* ---- 暂停 ---- */
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '继 续 演 化' : '暂 停 / 继 续';
  pauseBtn.classList.toggle('on', paused);
});

/* ---- 视角切换 ---- */
viewBtn.addEventListener('click', () => {
  viewIdx = (viewIdx + 1) % VIEW_MODES.length;
  viewBtn.textContent = '视 角：' + VIEW_MODES[viewIdx].name;
});

/* ---- 空格键暂停 ---- */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    pauseBtn.click();
  }
});
