<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>霓虹网格扭曲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a1a;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="gridCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('gridCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // 配置参数
            const CONFIG = {
                cols: 38,                  // 列数
                rows: 24,                  // 行数
                lineWidth: 1.2,            // 线条宽度
                baseHue: 220,              // 基础色相
                hueRange: 80,              // 色相变化范围
                saturation: 90,
                lightness: 65,
                mouseAttractRadius: 220,   // 鼠标吸引半径
                mouseAttractStrength: 55,  // 吸引强度（位移像素）
                clickRippleRadius: 280,    // 波纹最大半径
                clickRippleDuration: 1100, // 波纹持续时间(ms)
                clickRippleStrength: 70,   // 波纹位移强度
                maxRipples: 8,
                damping: 0.92,             // 顶点回弹阻尼
                returnSpeed: 0.08,         // 回弹速度系数
                animationSpeed: 0.0006,    // 全局动画速度
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let vertices = [];          // 二维数组存储顶点对象 {x, y, originX, originY, vx, vy}
            let ripples = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // 波纹类
            class Ripple {
                constructor(x, y, startTime) {
                    this.x = x;
                    this.y = y;
                    this.startTime = startTime;
                    this.duration = CONFIG.clickRippleDuration;
                    this.maxRadius = CONFIG.clickRippleRadius;
                    this.strength = CONFIG.clickRippleStrength;
                }

                getProgress(now) {
                    return Math.min(1, (now - this.startTime) / this.duration);
                }

                // 获取波纹对某点的影响位移（径向向外）
                getDisplacement(px, py, now) {
                    const progress = this.getProgress(now);
                    if (progress >= 1) return { dx: 0, dy: 0 };
                    const dx = px - this.x;
                    const dy = py - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const radius = this.maxRadius * (0.2 + 0.8 * progress);
                    if (dist > radius || dist < 0.01) return { dx: 0, dy: 0 };
                    const envelope = Math.max(0, 1 - progress) * (1 - dist / radius);
                    const waveFactor = Math.sin((dist / radius) * Math.PI * 3 - progress * 8);
                    const magnitude = this.strength * envelope * waveFactor;
                    return {
                        dx: (dx / dist) * magnitude,
                        dy: (dy / dist) * magnitude
                    };
                }
            }

            // 初始化顶点网格
            function initVertices() {
                vertices = [];
                const cols = CONFIG.cols;
                const rows = CONFIG.rows;
                const cellWidth = width / (cols - 1);
                const cellHeight = height / (rows - 1);
                for (let r = 0; r < rows; r++) {
                    const row = [];
                    for (let c = 0; c < cols; c++) {
                        const x = c * cellWidth;
                        const y = r * cellHeight;
                        row.push({
                            x: x,
                            y: y,
                            originX: x,
                            originY: y,
                            vx: 0,
                            vy: 0
                        });
                    }
                    vertices.push(row);
                }
            }

            // 调整画布尺寸
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, width, height);
                initVertices();
                // 初始绘制一次避免白屏
                drawGrid(performance.now());
            }

            // 更新顶点位置
            function updateVertices(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * CONFIG.animationSpeed;

                // 平滑鼠标
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.15;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.15;
                }

                const cols = CONFIG.cols;
                const rows = CONFIG.rows;
                const attractRadius = CONFIG.mouseAttractRadius;
                const attractStrength = CONFIG.mouseAttractStrength;
                const mouseInfluence = mouseActive && smoothMouseX > -1000;
                const mx = smoothMouseX;
                const my = smoothMouseY;

                // 遍历所有顶点
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const v = vertices[r][c];
                        // 计算目标偏移
                        let targetOffX = 0;
                        let targetOffY = 0;

                        // 鼠标吸引：顶点向鼠标位置弯曲
                        if (mouseInfluence) {
                            const dx = mx - v.originX;
                            const dy = my - v.originY;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < attractRadius && dist > 0.1) {
                                const influence = (1 - dist / attractRadius);
                                // 非线性增强
                                const force = influence * influence * attractStrength;
                                targetOffX += (dx / dist) * force;
                                targetOffY += (dy / dist) * force;
                            }
                        }

                        // 波纹影响
                        for (const ripple of ripples) {
                            const disp = ripple.getDisplacement(v.originX, v.originY, now);
                            targetOffX += disp.dx;
                            targetOffY += disp.dy;
                        }

                        // 简单弹性：向原点回弹，加上外力
                        const returnForceX = (v.originX - v.x) * CONFIG.returnSpeed;
                        const returnForceY = (v.originY - v.y) * CONFIG.returnSpeed;

                        v.vx += (returnForceX + targetOffX * 0.12) * dt;
                        v.vy += (returnForceY + targetOffY * 0.12) * dt;
                        v.vx *= CONFIG.damping;
                        v.vy *= CONFIG.damping;

                        v.x += v.vx * dt;
                        v.y += v.vy * dt;

                        // 防止偏移过大
                        const maxOffsetX = 80;
                        const maxOffsetY = 80;
                        if (v.x < v.originX - maxOffsetX) v.x = v.originX - maxOffsetX;
                        if (v.x > v.originX + maxOffsetX) v.x = v.originX + maxOffsetX;
                        if (v.y < v.originY - maxOffsetY) v.y = v.originY - maxOffsetY;
                        if (v.y > v.originY + maxOffsetY) v.y = v.originY + maxOffsetY;
                    }
                }
            }

            // 绘制网格
            function drawGrid(now) {
                // 清除画布
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, width, height);

                const cols = CONFIG.cols;
                const rows = CONFIG.rows;
                const hueBase = CONFIG.baseHue + Math.sin(time * 0.5) * CONFIG.hueRange * 0.3;

                // 绘制水平线（沿行）
                for (let r = 0; r < rows; r++) {
                    ctx.beginPath();
                    for (let c = 0; c < cols; c++) {
                        const v = vertices[r][c];
                        if (c === 0) ctx.moveTo(v.x, v.y);
                        else ctx.lineTo(v.x, v.y);
                    }
                    // 根据行位置设置颜色
                    const hue = (hueBase + r * 3) % 360;
                    const lightness = CONFIG.lightness + Math.sin(time * 2 + r * 0.5) * 10;
                    ctx.strokeStyle = `hsla(${hue}, ${CONFIG.saturation}%, ${lightness}%, 0.7)`;
                    ctx.lineWidth = CONFIG.lineWidth;
                    ctx.stroke();
                }

                // 绘制垂直线（沿列）
                for (let c = 0; c < cols; c++) {
                    ctx.beginPath();
                    for (let r = 0; r < rows; r++) {
                        const v = vertices[r][c];
                        if (r === 0) ctx.moveTo(v.x, v.y);
                        else ctx.lineTo(v.x, v.y);
                    }
                    const hue = (hueBase + c * 4) % 360;
                    const lightness = CONFIG.lightness + Math.cos(time * 1.8 + c * 0.4) * 10;
                    ctx.strokeStyle = `hsla(${hue}, ${CONFIG.saturation}%, ${lightness}%, 0.7)`;
                    ctx.lineWidth = CONFIG.lineWidth;
                    ctx.stroke();
                }

                // 可选：绘制顶点微光点（增加效果）
                ctx.fillStyle = `hsla(${hueBase}, 100%, 85%, 0.3)`;
                for (let r = 0; r < rows; r += 2) {
                    for (let c = 0; c < cols; c += 2) {
                        const v = vertices[r][c];
                        ctx.beginPath();
                        ctx.arc(v.x, v.y, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 移除过期波纹
                ripples = ripples.filter(r => r.getProgress(now) < 1);
                if (ripples.length > CONFIG.maxRipples) {
                    ripples = ripples.slice(-CONFIG.maxRipples);
                }
            }

            // 动画循环
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    // 长时间后台后重置，避免跳跃
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updateVertices(now);
                drawGrid(now);

                animationId = requestAnimationFrame(animate);
            }

            // 交互事件
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function handleClick(clientX, clientY) {
                const now = performance.now();
                ripples.push(new Ripple(clientX, clientY, now));
                if (ripples.length > CONFIG.maxRipples) {
                    ripples = ripples.slice(-CONFIG.maxRipples);
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                // 触摸事件
                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // 启动
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 暴露调试接口
            window.__gridWarp = {
                config: CONFIG,
                vertices: vertices,
                ripples: ripples,
            };
        })();
    </script>
</body>
</html>
