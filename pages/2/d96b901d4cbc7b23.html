<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clifford环面 · 平坦测地网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Clifford环面 · 平坦测地网</h2>
        <div class="sub">Flat torus in S³ · Stereographic projection · Geodesic foliations</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">θ = t, φ = p/q · t + φ₀</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">θ = t, φ = √2·t + φ₀</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">θ = t, φ = φ·t + φ₀</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.5, 2.4, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const PROJECTION_W = 2.5;
        const SCALE = 2.6;

        // Clifford环面 S³中点 (1/√2 e^{iθ}, 1/√2 e^{iφ}) → 四元数 (x₁,x₂,x₃,x₄)
        function cliffordPoint(theta, phi) {
            const r = 1 / Math.sqrt(2);
            return {
                x1: r * Math.cos(theta),
                x2: r * Math.sin(theta),
                x3: r * Math.cos(phi),
                x4: r * Math.sin(phi)
            };
        }

        // 球极投影 (选投影点 (0,0,0,1)，即从x₄=-1方向投影)
        function stereographicProj(q) {
            const denom = PROJECTION_W - q.x4;
            if (Math.abs(denom) < 0.04) return null;
            const f = SCALE / denom;
            return new THREE.Vector3(q.x1 * f, q.x2 * f, q.x3 * f);
        }

        // 生成Clifford环面上的测地线：θ = ω₁·t，φ = ω₂·t + φ₀
        function generateGeodesic(omegaTheta, omegaPhi, phi0, tRange, steps) {
            const pts = [];
            const dt = tRange / steps;
            for (let i = 0; i <= steps; i++) {
                const t = i * dt;
                const theta = omegaTheta * t;
                const phi = omegaPhi * t + phi0;
                const q = cliffordPoint(theta, phi);
                const proj = stereographicProj(q);
                if (proj) pts.push(proj);
            }
            return pts;
        }

        // 生成一族测地线（相同斜率比，不同初相）
        function createGeodesicFamily(omegaRatio, phiOffsets, color, opacity, tRange, steps) {
            const group = new THREE.Group();
            // omegaTheta = 1, omegaPhi = omegaRatio（绕θ方向驱动）
            for (const phi0 of phiOffsets) {
                const pts = generateGeodesic(1.0, omegaRatio, phi0, tRange, steps);
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    depthWrite: true,
                    depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'clifford-torus';
        scene.add(rootGroup);

        const tRange = 28 * Math.PI;
        const steps = 560;
        const phiCount = 14;

        // 金色族：有理斜率（闭合测地线）
        const rationalSlopes = [1 / 2, 2 / 3, 3 / 4, 5 / 3, 1, 4 / 3, 5 / 2, 7 / 3, 8 / 5];
        rationalSlopes.forEach(slope => {
            const offsetList = Array.from({ length: phiCount }, (_, k) => k * 2 * Math.PI / phiCount);
            rootGroup.add(createGeodesicFamily(slope, offsetList, COLOR_GOLD, 0.65, tRange, steps));
        });

        // 青色族：√2无理斜率
        const sqrt2Slopes = [Math.sqrt(2), Math.sqrt(2) * 0.7, Math.sqrt(2) * 1.3, Math.sqrt(2) * 0.5, Math.sqrt(2) * 1.6];
        sqrt2Slopes.forEach(slope => {
            const offsetList = Array.from({ length: phiCount }, (_, k) => k * 2 * Math.PI / phiCount + 0.3);
            rootGroup.add(createGeodesicFamily(slope, offsetList, COLOR_CYAN, 0.62, tRange, steps));
        });

        // 品红族：黄金比例φ斜率
        const phi_golden = (1 + Math.sqrt(5)) / 2;
        const goldenSlopes = [phi_golden, phi_golden * 0.6, phi_golden * 1.5, 1 / phi_golden, phi_golden * 0.8];
        goldenSlopes.forEach(slope => {
            const offsetList = Array.from({ length: phiCount }, (_, k) => k * 2 * Math.PI / phiCount + 0.7);
            rootGroup.add(createGeodesicFamily(slope, offsetList, COLOR_MAGENTA, 0.62, tRange, steps));
        });

        // 辅助纬线（固定θ，变化φ）
        const thetaValues = Array.from({ length: 16 }, (_, i) => i * 2 * Math.PI / 16);
        thetaValues.forEach(theta => {
            const pts = [];
            const dphi = 2 * Math.PI / 300;
            for (let i = 0; i <= 300; i++) {
                const phi = i * dphi;
                const q = cliffordPoint(theta, phi);
                const proj = stereographicProj(q);
                if (proj) pts.push(proj);
            }
            if (pts.length >= 2) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color: COLOR_GOLD, transparent: true, opacity: 0.25, depthWrite: true, depthTest: true
                })));
            }
        });

        // 辅助经线（固定φ，变化θ）
        const phiValues = Array.from({ length: 16 }, (_, i) => i * 2 * Math.PI / 16);
        phiValues.forEach(phi => {
            const pts = [];
            const dtheta = 2 * Math.PI / 300;
            for (let i = 0; i <= 300; i++) {
                const theta = i * dtheta;
                const q = cliffordPoint(theta, phi);
                const proj = stereographicProj(q);
                if (proj) pts.push(proj);
            }
            if (pts.length >= 2) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color: COLOR_CYAN, transparent: true, opacity: 0.22, depthWrite: true, depthTest: true
                })));
            }
        });

        console.log('Clifford环面线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.5,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 动画循环
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.26;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.6;
            const camAngle = t * 0.09;
            const camHeight = 2.5 + Math.sin(t * 0.17) * 0.8;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Clifford环面平坦测地网动画已稳定运行');
    </script>
</body>
</html>
