<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>静电场 · 电场线 | Electric Field Lines</title>
<style>
  :root{
    --cyan:#5fe6ff;
    --blue:#4a9eff;
    --red:#ff5a8a;
    --gold:#ffd166;
    --violet:#b06bff;
    --line:rgba(95,230,255,.20);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#02040c;
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#bfe6ff;-webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;}
  #app canvas{display:block;}

  .panel{
    position:fixed;
    padding:14px 18px;
    border-radius:14px;
    background:linear-gradient(160deg, rgba(9,26,48,.66), rgba(4,12,24,.44));
    border:1px solid var(--line);
    box-shadow:0 0 34px rgba(0,140,255,.12), inset 0 0 22px rgba(0,120,200,.06);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    pointer-events:none;
    user-select:none;
    z-index:10;
  }

  /* ---------- 左上：标题 + 公式 ---------- */
  #hud-left{top:22px;left:22px;max-width:368px;}
  #hud-left h1{
    font-size:16px;font-weight:600;letter-spacing:.14em;
    color:#e8faff;margin-bottom:2px;
    text-shadow:0 0 16px rgba(95,230,255,.7);
  }
  #hud-left h1 span{
    display:block;font-size:9.5px;letter-spacing:.32em;
    color:rgba(95,230,255,.55);font-weight:400;margin-top:3px;
  }
  .divider{
    height:1px;margin:11px 0 10px;
    background:linear-gradient(90deg, rgba(95,230,255,.55), rgba(95,230,255,0) 90%);
  }
  .formula{
    font-family:Georgia,"Times New Roman","Songti SC",serif;
    font-size:13.5px;line-height:1.9;color:#a8d8f0;
    display:flex;align-items:baseline;gap:8px;white-space:nowrap;
  }
  .formula .lbl{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:10px;letter-spacing:.1em;color:rgba(95,230,255,.5);
    min-width:56px;flex:0 0 auto;
  }
  .formula i{font-style:italic;color:#dff6ff;}
  .formula.hl{color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.45);}
  .formula.hl i{color:#ffe9b0;}
  .formula.vio{color:#cf9bff;text-shadow:0 0 14px rgba(176,107,255,.42);}
  .formula.vio i{color:#e6ccff;}
  .formula.red{color:#ff9ab5;text-shadow:0 0 14px rgba(255,90,138,.42);}
  .formula.red i{color:#ffc9d8;}

  /* ---------- 右上：参数 ---------- */
  #hud-right{top:22px;right:22px;width:238px;}
  .stat{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;line-height:2.05;
    border-bottom:1px dashed rgba(95,230,255,.10);
    padding-bottom:1px;
  }
  .stat:last-child{border-bottom:none;}
  .stat span{color:rgba(150,200,230,.66);letter-spacing:.04em;}
  .stat b{
    font-weight:600;color:#7ef0ff;font-variant-numeric:tabular-nums;
    text-shadow:0 0 12px rgba(95,230,255,.5);
  }
  .stat b.gold{color:var(--gold);text-shadow:0 0 12px rgba(255,209,102,.5);}
  .stat b.vio{color:#c78bff;text-shadow:0 0 12px rgba(176,107,255,.5);}
  .stat b.red{color:#ff8aab;text-shadow:0 0 12px rgba(255,90,138,.5);}

  /* ---------- 底部图例 ---------- */
  #legend{
    left:50%;bottom:22px;transform:translateX(-50%);
    display:flex;gap:24px;align-items:center;
    padding:10px 24px;border-radius:100px;font-size:11.5px;
    letter-spacing:.06em;color:rgba(160,210,240,.78);
    white-space:nowrap;
  }
  #legend .dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:7px;vertical-align:middle;
  }
  .d1{background:#ff5a5a;box-shadow:0 0 12px #ff5a5a;}
  .d2{background:#4a9eff;box-shadow:0 0 12px #4a9eff;}
  .d3{background:#b06bff;box-shadow:0 0 12px #b06bff;}

  /* ---------- 启动遮罩 ---------- */
  #start-overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;
    background:radial-gradient(ellipse at 50% 45%, rgba(6,20,40,.72), rgba(2,5,12,.96) 72%);
    transition:opacity .9s ease, visibility .9s;
  }
  #start-overlay.hidden{opacity:0;visibility:hidden;}
  #start-overlay .tag{
    font-size:11px;letter-spacing:.55em;color:rgba(95,230,255,.55);
    text-transform:uppercase;
  }
  #start-overlay .big{
    font-size:clamp(22px,4vw,40px);font-weight:600;letter-spacing:.22em;
    color:#eafcff;text-shadow:0 0 40px rgba(95,230,255,.75), 0 0 90px rgba(80,160,255,.35);
  }
  #startBtn{
    pointer-events:auto;cursor:pointer;
    padding:14px 46px;border-radius:100px;
    font-size:14px;letter-spacing:.22em;font-weight:500;
    color:#eafcff;background:rgba(95,230,255,.08);
    border:1px solid rgba(95,230,255,.55);
    box-shadow:0 0 26px rgba(95,230,255,.28), inset 0 0 24px rgba(95,230,255,.10);
    transition:all .32s cubic-bezier(.2,.8,.3,1);
    font-family:inherit;
  }
  #startBtn:hover{
    background:rgba(95,230,255,.20);
    box-shadow:0 0 46px rgba(95,230,255,.6), inset 0 0 30px rgba(95,230,255,.22);
    transform:translateY(-2px) scale(1.03);
  }
  #startBtn:active{transform:translateY(0) scale(.99);}

  /* 角落装饰 */
  .corner{
    position:fixed;width:52px;height:52px;pointer-events:none;z-index:9;
    border-color:rgba(95,230,255,.30);border-style:solid;border-width:0;
  }
  .c-tl{top:14px;left:14px;border-top-width:1px;border-left-width:1px;}
  .c-tr{top:14px;right:14px;border-top-width:1px;border-right-width:1px;}
  .c-bl{bottom:14px;left:14px;border-bottom-width:1px;border-left-width:1px;}
  .c-br{bottom:14px;right:14px;border-bottom-width:1px;border-right-width:1px;}

  @media (max-width:760px){
    #hud-left{max-width:248px;padding:11px 13px;top:12px;left:12px;}
    #hud-left h1{font-size:13px;}
    .formula{font-size:11px;line-height:1.7;}
    .formula .lbl{min-width:42px;font-size:9px;}
    #hud-right{width:164px;padding:11px 12px;top:12px;right:12px;}
    .stat{font-size:10px;}
    #legend{gap:13px;font-size:9.5px;padding:8px 15px;bottom:12px;}
    .corner{display:none;}
  }
</style>

<body>

<div id="app"></div>

<!-- 左上角：公式面板 -->
<div id="hud-left" class="panel">
  <h1>静电场 · 电场线<span>ELECTRIC FIELD LINES · COULOMB FIELD</span></h1>
  <div class="divider"></div>
  <div class="formula hl"><span class="lbl">库仑定律</span><span><i>F</i> = <i>k q</i>₁<i>q</i>₂ / <i>r</i>²</span></div>
  <div class="formula"><span class="lbl">场强</span><span><i>E</i> = <i>k q</i> / <i>r</i>² &nbsp;∝&nbsp; 1/<i>r</i>²</span></div>
  <div class="formula vio"><span class="lbl">叠加原理</span><span><b>E</b> = Σ <i>k q</i><sub>i</sub> <b>r̂</b><sub>i</sub> / <i>r</i><sub>i</sub>²</span></div>
  <div class="formula"><span class="lbl">电场线</span><span>d<b>r</b>/d<i>s</i> ∥ <b>E</b></span></div>
  <div class="formula red"><span class="lbl">高斯定理</span><span>∮ <b>E</b>·d<b>A</b> = <i>Q</i><sub>内</sub>/<i>ε</i>₀</span></div>
</div>

<!-- 右上角：参数面板 -->
<div id="hud-right" class="panel">
  <div class="stat"><span>正电荷 q₁</span><b class="red">+1.00 e</b></div>
  <div class="stat"><span>负电荷 q₂</span><b class="gold">−1.00 e</b></div>
  <div class="stat"><span>电荷间距 d</span><b>10.00</b></div>
  <div class="stat"><span>电场线条数</span><b class="vio">80</b></div>
  <div class="stat"><span>流线粒子</span><b>240</b></div>

</div>

<!-- 底部图例 -->
<div id="legend" class="panel">
  <span><i class="dot d1"></i>正电荷（发出场线）</span>
  <span><i class="dot d2"></i>负电荷（汇入场线）</span>

</div>

<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>
<div class="corner c-br"></div>

<!-- 启动遮罩 -->
<div id="start-overlay">
  <div class="tag">Coulomb · Field Lines · Electrostatics</div>
  <div class="big">静 电 场</div>
  <button id="startBtn">▶ 启动模拟 · 开启音效</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   0. 常量
   ========================================================= */
const PR        = Math.min(window.devicePixelRatio || 1, 2);
const D         = 5.0;              // 半间距 → 电荷在 x = ±5
const K_E       = 1.0;              // 库仑常数（归一化）
const QP        =  1.0;
const QN        = -1.0;
const CHARGE_R  = 0.55;             // 电荷球半径
const N_BASE    = 10;               // 基础场线条数（平面内）
const N_AZ      = 8;                // 绕轴旋转份数
const PPL       = 3;                // 每条线粒子数

const POS_CHARGE = new THREE.Vector3( D, 0, 0);
const NEG_CHARGE = new THREE.Vector3(-D, 0, 0);

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* 背景渐变 */
(function makeBackground() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 512;
  const ctx = c.getContext('2d');
  const grd = ctx.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0.00, '#061428');
  grd.addColorStop(0.32, '#050b1a');
  grd.addColorStop(0.62, '#08081a');
  grd.addColorStop(0.86, '#04050e');
  grd.addColorStop(1.00, '#010206');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, 4, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 2000);

let camAngle = Math.PI / 2;
function updateCamera(dt) {
  camAngle += dt * 0.085;
  const R = 40;
  const h = 14 + 6.5 * Math.sin(camAngle * 0.42);
  camera.position.set(Math.cos(camAngle) * R, h, Math.sin(camAngle) * R);
  camera.lookAt(0, 0, 0);
}
updateCamera(0);

/* =========================================================
   2. 背景漂浮粒子
   ========================================================= */
let bgMatRef = null;
(function buildBackgroundParticles() {
  const COUNT = 1500;
  const pos  = new Float32Array(COUNT * 3);
  const seed = new Float32Array(COUNT);

  for (let i = 0; i < COUNT; i++) {
    const r = 30 + Math.random() * 80;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi) * 0.8;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    seed[i] = Math.random() * Math.PI * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPR:   { value: PR }
    },
    vertexShader: /* glsl */`
      attribute float aSeed;
      uniform float uTime;
      uniform float uPR;
      varying float vAlpha;
      void main(){
        vec3 p = position;
        p.x += sin(uTime * 0.20 + aSeed) * 1.1;
        p.y += cos(uTime * 0.17 + aSeed * 1.6) * 1.1;
        p.z += sin(uTime * 0.23 + aSeed * 2.4) * 1.1;

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float dist = max(-mv.z, 0.001);
        float size = 1.1 + 1.7 * (0.5 + 0.5 * sin(aSeed * 3.3 + uTime * 1.3));
        gl_PointSize = size * uPR * (240.0 / dist);
        gl_Position = projectionMatrix * mv;

        vAlpha = 0.16 + 0.50 * (0.5 + 0.5 * sin(aSeed * 2.9 + uTime * 1.1));
      }
    `,
    fragmentShader: /* glsl */`
      varying float vAlpha;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d);
        a = pow(a, 1.7);
        vec3 col = mix(vec3(0.35, 0.60, 1.0), vec3(0.80, 0.50, 1.0),
                       0.5 + 0.5 * sin(vAlpha * 9.0));
        gl_FragColor = vec4(col, a * vAlpha * 0.75);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  bgMatRef = mat;
})();

/* =========================================================
   3. 径向光晕贴图
   ========================================================= */
function makeGlowTexture() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.16, 'rgba(255,255,255,0.72)');
  g.addColorStop(0.42, 'rgba(255,255,255,0.18)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const GLOW_TEX = makeGlowTexture();

/* =========================================================
   4. 电场计算 + 场线追踪
   ========================================================= */
const _fTmp = new THREE.Vector3();

function fieldAt(p, out) {
  out.set(0, 0, 0);

  let dx = p.x - POS_CHARGE.x;
  let dy = p.y - POS_CHARGE.y;
  let dz = p.z - POS_CHARGE.z;
  let r2 = dx*dx + dy*dy + dz*dz;
  let r  = Math.sqrt(r2) || 1e-6;
  let f  = K_E * QP / (r2 * r);
  out.x += dx * f; out.y += dy * f; out.z += dz * f;

  dx = p.x - NEG_CHARGE.x;
  dy = p.y - NEG_CHARGE.y;
  dz = p.z - NEG_CHARGE.z;
  r2 = dx*dx + dy*dy + dz*dz;
  r  = Math.sqrt(r2) || 1e-6;
  f  = K_E * QN / (r2 * r);
  out.x += dx * f; out.y += dy * f; out.z += dz * f;

  return out;
}

/* 在 xy 平面内追踪一条场线（θ 为出发方向角） */
function traceFieldLine(theta) {
  const pts = [];
  const dir = new THREE.Vector3(-Math.cos(theta), Math.sin(theta), 0).normalize();
  const p = new THREE.Vector3().copy(POS_CHARGE).addScaledVector(dir, CHARGE_R + 0.02);
  const E = new THREE.Vector3();
  const ds = 0.20;

  pts.push(p.clone());

  for (let i = 0; i < 700; i++) {
    fieldAt(p, E);
    const len = E.length();
    if (len < 1e-9) break;
    E.multiplyScalar(1 / len);
    p.addScaledVector(E, ds);

    pts.push(p.clone());

    if (p.distanceTo(NEG_CHARGE) < CHARGE_R + 0.05) {
      pts.push(NEG_CHARGE.clone());
      break;
    }
    if (p.lengthSq() > 55 * 55) break;
    if (i > 12 && p.distanceTo(POS_CHARGE) < CHARGE_R * 0.8) break;
  }

  return pts;
}

/* 场线颜色渐变：橙红 → 品红 → 青蓝 */
const _colTmp = new THREE.Color();
function lineColorAt(u, out) {
  out = out || _colTmp;
  let r, g, b;
  if (u < 0.5) {
    const t = u / 0.5;
    r = 1.00 + (0.82 - 1.00) * t;
    g = 0.42 + (0.30 - 0.42) * t;
    b = 0.16 + (1.00 - 0.16) * t;
  } else {
    const t = (u - 0.5) / 0.5;
    r = 0.82 + (0.22 - 0.82) * t;
    g = 0.30 + (0.84 - 0.30) * t;
    b = 1.00 + (1.00 - 1.00) * t;
  }
  return out.setRGB(r, g, b);
}

/* 抽稀点列 */
function subsample(arr, maxN) {
  if (arr.length <= maxN) return arr;
  const out = [];
  for (let i = 0; i < maxN; i++) {
    out.push(arr[Math.round((i * (arr.length - 1)) / (maxN - 1))]);
  }
  return out;
}

/* 给 TubeGeometry 写入顶点颜色（按管向参数渐变） */
function applyTubeColors(geo, radialSegments) {
  const count = geo.attributes.position.count;
  const vpr   = radialSegments + 1;
  const tub   = Math.round(count / vpr) - 1;

  const colArr = new Float32Array(count * 3);
  const c = new THREE.Color();

  for (let i = 0; i <= tub; i++) {
    const u = tub > 0 ? i / tub : 0;
    lineColorAt(u, c);
    for (let j = 0; j < vpr; j++) {
      const idx = i * vpr + j;
      if (idx >= count) break;
      colArr[idx*3]     = c.r;
      colArr[idx*3 + 1] = c.g;
      colArr[idx*3 + 2] = c.b;
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
}

/* =========================================================
   5. 构建电场线
   ========================================================= */
const fieldGroup = new THREE.Group();
scene.add(fieldGroup);

/* 基础场线（xy 平面内） */
const baseLines = [];
for (let b = 0; b < N_BASE; b++) {
  const t = N_BASE > 1 ? b / (N_BASE - 1) : 0.5;
  const theta = 0.16 + t * (Math.PI - 0.32);
  baseLines.push(traceFieldLine(theta));
}

/* 存储每条场线用于粒子采样：{ pts, cosA, sinA } */
const samplingLines = [];

/* 管状场线 */
const RADIAL_SEG = 4;
const TUBE_R     = 0.032;

for (let b = 0; b < N_BASE; b++) {
  const raw = baseLines[b];
  if (raw.length < 3) continue;

  const pts = subsample(raw, 140);

  for (let a = 0; a < N_AZ; a++) {
    const phi = (a / N_AZ) * Math.PI * 2;
    const ca  = Math.cos(phi);
    const sa  = Math.sin(phi);

    const rotPts = pts.map(p => new THREE.Vector3(p.x, p.y * ca, p.y * sa));

    const curve = new THREE.CatmullRomCurve3(rotPts);
    const TUB = Math.min(140, Math.max(24, rotPts.length));

    let geo;
    try {
      geo = new THREE.TubeGeometry(curve, TUB, TUBE_R, RADIAL_SEG, false);
    } catch (e) {
      continue;
    }

    applyTubeColors(geo, RADIAL_SEG);

    const mat = new THREE.MeshBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.80,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    fieldGroup.add(mesh);

    // 保存给粒子系统用（原始高密度点 + 旋转参数）
    samplingLines.push({ pts: raw, cosA: ca, sinA: sa });
  }
}

/* =========================================================
   6. 场线流动粒子
   ========================================================= */
const PARTICLE_TOTAL = samplingLines.length * PPL;
const partPos   = new Float32Array(PARTICLE_TOTAL * 3);
const partCol   = new Float32Array(PARTICLE_TOTAL * 3);
const partMeta  = [];

{
  let idx = 0;
  for (let li = 0; li < samplingLines.length; li++) {
    const line = samplingLines[li];
    for (let k = 0; k < PPL; k++) {
      partMeta.push({
        line,
        phase: k / PPL + Math.random() * 0.18
      });
      idx++;
    }
  }
}

const partGeo = new THREE.BufferGeometry();
partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
partGeo.setAttribute('color',    new THREE.BufferAttribute(partCol, 3));

const partMat = new THREE.PointsMaterial({
  map: GLOW_TEX,
  size: 0.62,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.95,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particleSystem = new THREE.Points(partGeo, partMat);
particleSystem.frustumCulled = false;
scene.add(particleSystem);

/* 颜色缓存（每条线采样 64 段） */
const COLOR_LUT = [];
for (let i = 0; i <= 64; i++) {
  COLOR_LUT.push(lineColorAt(i / 64).clone());
}

function updateParticles(time) {
  const posArr = partGeo.attributes.position.array;
  const colArr = partGeo.attributes.color.array;

  for (let i = 0; i < partMeta.length; i++) {
    const m = partMeta[i];
    const pts = m.line.pts;
    const n = pts.length;

    let t = (m.phase + time * 0.115) % 1;
    if (t < 0) t += 1;

    const fidx = t * (n - 1);
    const i0 = Math.min(Math.floor(fidx), n - 2);
    const fr = fidx - i0;

    const p0 = pts[i0];
    const p1 = pts[i0 + 1];

    const x  = p0.x + (p1.x - p0.x) * fr;
    const yB = p0.y + (p1.y - p0.y) * fr;

    const y = yB * m.line.cosA;
    const z = yB * m.line.sinA;

    posArr[i*3]     = x;
    posArr[i*3 + 1] = y;
    posArr[i*3 + 2] = z;

    // 颜色：与场线一致，端点略亮
    const ci = Math.min(64, Math.max(0, Math.round(t * 64)));
    const c = COLOR_LUT[ci];
    const boost = 0.55 + 0.65 * Math.sin(t * Math.PI);
    colArr[i*3]     = Math.min(1, c.r * boost + 0.25);
    colArr[i*3 + 1] = Math.min(1, c.g * boost + 0.25);
    colArr[i*3 + 2] = Math.min(1, c.b * boost + 0.25);
  }

  partGeo.attributes.position.needsUpdate = true;
  partGeo.attributes.color.needsUpdate = true;
}

/* =========================================================
   7. 电荷球体
   ========================================================= */
function makeCharge(center, color, sign) {
  const group = new THREE.Group();
  group.position.copy(center);

  // 内核
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(CHARGE_R, 32, 24),
    new THREE.MeshBasicMaterial({ color: color })
  );
  group.add(core);

  // 内发光壳
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(CHARGE_R * 1.45, 28, 20),
    new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.16,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  group.add(shell);

  // 光晕精灵
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW_TEX,
    color: color,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  halo.scale.set(5.2, 5.2, 1);
  group.add(halo);

  // 双层光环
  const ringMat = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: 0.35,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const ring1 = new THREE.Mesh(
    new THREE.TorusGeometry(CHARGE_R * 2.0, 0.020, 6, 80),
    ringMat
  );
  ring1.rotation.x = Math.PI / 2.4;
  group.add(ring1);

  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(CHARGE_R * 2.45, 0.014, 6, 80),
    ringMat.clone()
  );
  ring2.rotation.x = -Math.PI / 3.2;
  ring2.rotation.z = 0.7;
  group.add(ring2);

  scene.add(group);

  return { group, core, shell, halo, ring1, ring2, baseColor: color, sign };
}

const chargePos = makeCharge(POS_CHARGE, new THREE.Color(0xff4d6d), +1);
const chargeNeg = makeCharge(NEG_CHARGE, new THREE.Color(0x4a9eff), -1);

/* 电荷符号纹理（画在精灵上，悬浮于球心前方） */
function makeSignTexture(sign) {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = 'bold 104px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(sign, S / 2, S / 2 + 8);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

[chargePos, chargeNeg].forEach((ch, i) => {
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeSignTexture(i === 0 ? '+' : '−'),
    color: 0xffffff,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    depthTest: false
  }));
  spr.scale.set(0.95, 0.95, 1);
  spr.position.set(0, 0, CHARGE_R + 0.02);
  ch.group.add(spr);
  ch.signSprite = spr;
});

/* =========================================================
   8. 后期处理（辉光）
   ========================================================= */
let composer = null;
try {
  composer = new EffectComposer(renderer);
  composer.setSize(window.innerWidth, window.innerHeight);
  composer.addPass(new RenderPass(scene, camera));

  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.15,   // strength
    0.60,   // radius
    0.22    // threshold
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
} catch (err) {
  console.warn('后期处理初始化失败，回退到直接渲染：', err);
  composer = null;
}

/* =========================================================
   9. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let simTime = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  /* ---------- 粒子流动 ---------- */
  updateParticles(simTime);

  /* ---------- 电荷脉动 ---------- */
  const pulse = 0.62 + 0.38 * Math.sin(simTime * 2.4);

  [chargePos, chargeNeg].forEach((ch, i) => {
    const dir = i === 0 ? 1 : -1;
    const s = 1 + 0.14 * pulse;
    ch.core.scale.setScalar(s);
    ch.shell.scale.setScalar(1 + 0.24 * pulse);

    const hs = 5.2 * (0.86 + 0.32 * pulse);
    ch.halo.scale.set(hs, hs, 1);

    ch.ring1.rotation.z += dt * 0.32 * dir;
    ch.ring2.rotation.y += dt * 0.28 * dir;

    // 符号始终朝向相机
    if (ch.signSprite) {
      ch.signSprite.position.set(0, 0, CHARGE_R * s + 0.02);
    }
  });

  /* ---------- 场线整体呼吸 ---------- */
  fieldGroup.children.forEach((mesh, i) => {
    if (mesh.material) {
      mesh.material.opacity = 0.66 + 0.22 * Math.sin(simTime * 1.6 + i * 0.13);
    }
  });

  /* ---------- 背景粒子时间 ---------- */
  if (bgMatRef) bgMatRef.uniforms.uTime.value = simTime;

  /* ---------- 相机 ---------- */
  updateCamera(dt);

  if (composer) composer.render();
  else renderer.render(scene, camera);
}
animate();

/* =========================================================
   10. 窗口自适应
   ========================================================= */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  }, 80);
});

/* =========================================================
   11. 科技感背景音效（Web Audio · 洁净版）
   ========================================================= */
let audioCtx   = null;
let blipTimer  = null;
let masterGain = null;
let delayNode  = null;

function startAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  audioCtx = new AC();
  const ctx = audioCtx;

  /* ---------- 主输出链 ---------- */
  const compressor = ctx.createDynamicsCompressor();
  compressor.threshold.value = -22;
  compressor.knee.value      = 24;
  compressor.ratio.value     = 5;
  compressor.attack.value    = 0.015;
  compressor.release.value   = 0.40;

  const masterLP = ctx.createBiquadFilter();
  masterLP.type = 'lowpass';
  masterLP.frequency.value = 3000;
  masterLP.Q.value = 0.5;

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.0001;

  masterGain.connect(masterLP);
  masterLP.connect(compressor);
  compressor.connect(ctx.destination);

  /* ---------- 低频氛围铺底 ---------- */
  const padFilter = ctx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 210;
  padFilter.Q.value = 1.1;

  const padGain = ctx.createGain();
  padGain.gain.value = 0.22;
  padFilter.connect(padGain);
  padGain.connect(masterGain);

  [55, 82.5, 110, 165].forEach((f, i) => {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    o.detune.value = (i - 1.5) * 2.4;

    const g = ctx.createGain();
    g.gain.value = i === 0 ? 0.50 : 0.24 / (1 + i * 0.55);

    o.connect(g);
    g.connect(padFilter);
    o.start();
  });

  /* ---------- 缓慢呼吸 LFO ---------- */
  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.030;

  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 62;
  lfo.connect(lfoGain);
  lfoGain.connect(padFilter.frequency);
  lfo.start();

  /* ---------- 延迟回声 ---------- */
  delayNode = ctx.createDelay(2.0);
  delayNode.delayTime.value = 0.56;

  const dLP = ctx.createBiquadFilter();
  dLP.type = 'lowpass';
  dLP.frequency.value = 1700;

  const fb = ctx.createGain();
  fb.gain.value = 0.20;

  delayNode.connect(dLP);
  dLP.connect(fb);
  fb.connect(delayNode);

  const delayWet = ctx.createGain();
  delayWet.gain.value = 0.28;
  delayNode.connect(delayWet);
  delayWet.connect(masterGain);

  /* ---------- 随机闪烁音符 ---------- */
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
  let nextBlip = ctx.currentTime + 0.7;

  function schedule() {
    if (!audioCtx) return;
    const now = ctx.currentTime;
    while (nextBlip < now + 1.0) {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = SCALE[(Math.random() * SCALE.length) | 0];

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, nextBlip);
      g.gain.exponentialRampToValueAtTime(0.016, nextBlip + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, nextBlip + 1.6);

      o.connect(g);
      g.connect(masterGain);
      g.connect(delayNode);

      o.start(nextBlip);
      o.stop(nextBlip + 1.7);

      nextBlip += 0.85 + Math.random() * 2.1;
    }
    blipTimer = setTimeout(schedule, 500);
  }
  schedule();

  /* ---------- 淡入 ---------- */
  const t0 = ctx.currentTime;
  masterGain.gain.cancelScheduledValues(t0);
  masterGain.gain.setValueAtTime(0.0001, t0);
  masterGain.gain.exponentialRampToValueAtTime(0.40, t0 + 3.0);

  /* ---------- 切后台自动降音 ---------- */
  document.addEventListener('visibilitychange', () => {
    if (!audioCtx || !masterGain) return;
    const t = audioCtx.currentTime;
    const cur = Math.max(masterGain.gain.value, 0.0001);
    masterGain.gain.cancelScheduledValues(t);
    masterGain.gain.setValueAtTime(cur, t);
    masterGain.gain.exponentialRampToValueAtTime(document.hidden ? 0.02 : 0.40, t + 1.0);
  });
}

/* =========================================================
   12. 启动交互
   ========================================================= */
const overlay  = document.getElementById('start-overlay');
const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  try { startAudio(); } catch (e) { console.warn('音频启动失败：', e); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

window.addEventListener('beforeunload', () => {
  if (blipTimer) { clearTimeout(blipTimer); blipTimer = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
});
</script>
</body>
