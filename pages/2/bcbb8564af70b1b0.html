<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>河图洛书 · 音阵</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#04060a;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    color:#c8d8e8; user-select:none; -webkit-tap-highlight-color:transparent;
    cursor:grab;
  }
  html.dragging, html.dragging body { cursor:grabbing; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }

  #hud {
    position:fixed; top:24px; left:28px; z-index:5;
    pointer-events:none; font-size:12px; line-height:1.72;
    letter-spacing:0.03em; text-shadow:0 0 22px rgba(0,0,0,0.95);
  }
  #hud .title {
    font-size:18px; font-weight:300; letter-spacing:0.3em;
    color:#e4eef8; margin-bottom:2px;
  }
  #hud .sub {
    font-size:10px; letter-spacing:0.24em;
    color:rgba(150,190,220,0.45); margin-bottom:16px;
  }
  #hud .row { display:flex; gap:9px; font-variant-numeric:tabular-nums; }
  #hud .k { color:rgba(140,180,210,0.42); width:46px; }
  #hud .v { color:#9fd4ea; }
  #hud .v.hi { color:#ffcf8a; }
  #hud .v.g { color:#7de0c8; }

  #hud .sec {
    margin-top:13px; padding-top:12px;
    border-top:1px solid rgba(120,160,200,0.13);
  }
  #hud .sec-title {
    font-size:9.5px; letter-spacing:0.2em;
    color:rgba(150,190,220,0.42); margin-bottom:8px;
  }
  #hud .digit {
    display:flex; align-items:center; gap:8px;
    font-size:11px; margin-bottom:5px;
    color:rgba(180,210,230,0.6);
  }
  #hud .digit .dot {
    width:7px; height:7px; border-radius:50%;
    flex-shrink:0;
  }
  #hud .digit b {
    color:#e8f0f8; font-weight:500;
    font-variant-numeric:tabular-nums;
  }

  .btn {
    position:fixed; z-index:6;
    padding:10px 19px;
    background:rgba(12,20,32,0.72);
    border:1px solid rgba(100,170,220,0.24);
    border-radius:999px;
    color:#96c8e6; font-size:12px; letter-spacing:0.14em;
    font-family:inherit; cursor:pointer;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  .btn:hover {
    background:rgba(26,54,78,0.8);
    border-color:rgba(140,220,255,0.6);
    color:#d8f4ff;
  }
  .btn.on {
    background:rgba(44,96,132,0.55);
    border-color:rgba(160,236,255,0.75);
    color:#e4f9ff;
    box-shadow:0 0 26px rgba(90,200,255,0.24);
  }
  #btn-auto   { right:24px; bottom:24px; }
  #btn-clear  { right:24px; bottom:76px; }
  #btn-reset  { right:24px; bottom:128px; }

  #hint {
    position:fixed; bottom:30px; left:28px; z-index:5;
    font-size:10.5px; letter-spacing:0.1em;
    color:rgba(150,190,220,0.4);
    pointer-events:none; transition:opacity 0.9s;
  }
  #hint.hide { opacity:0; }

  @media (max-width:640px) {
    #hud { top:14px; left:14px; font-size:10.5px; }
    #hud .title { font-size:14px; letter-spacing:0.22em; }
    #hud .digit { font-size:10px; }
    .btn { padding:8px 13px; font-size:11px; }
    #btn-auto   { right:12px; bottom:14px; }
    #btn-clear  { right:12px; bottom:54px; }
    #btn-reset  { right:12px; bottom:94px; }
    #hint { left:14px; bottom:18px; font-size:9.5px; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="hud">
  <div class="title">河图洛书 · 音阵</div>
  <div class="sub">LUOSHU · 九宫音阶</div>
  <div class="row"><span class="k">触发</span><span class="v hi" id="v-last">—</span></div>
  <div class="row"><span class="k">旋律</span><span class="v g" id="v-melody">0 段</span></div>
  <div class="sec">
    <div class="sec-title">九宫数字 · 音高 · 五行</div>
    <div class="digit"><span class="dot" id="d1"></span>1 宫 <b id="n1">C3</b></div>
    <div class="digit"><span class="dot" id="d2"></span>2 商 <b id="n2">D3</b></div>
    <div class="digit"><span class="dot" id="d3"></span>3 角 <b id="n3">E3</b></div>
    <div class="digit"><span class="dot" id="d4"></span>4 徵 <b id="n4">G3</b></div>
    <div class="digit"><span class="dot" id="d5"></span>5 羽 <b id="n5">A3</b></div>
    <div class="digit"><span class="dot" id="d6"></span>6 宫·高 <b id="n6">C4</b></div>
    <div class="digit"><span class="dot" id="d7"></span>7 商·高 <b id="n7">D4</b></div>
    <div class="digit"><span class="dot" id="d8"></span>8 角·高 <b id="n8">E4</b></div>
    <div class="digit"><span class="dot" id="d9"></span>9 徵·高 <b id="n9">G4</b></div>
  </div>
</div>

<button class="btn" id="btn-auto">自动演奏</button>
<button class="btn" id="btn-clear">清空旋律</button>
<button class="btn" id="btn-reset">重置视角</button>
<div id="hint">点击数字触发音符 · 拖动滑过数字连线成旋律</div>

<script>
(() => {
'use strict';

// ============================================================
//  画布
// ============================================================
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, focal = 0;

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W * 0.5;
  cy = H * 0.5;
  focal = Math.min(W, H) * 1.05;
}

// ============================================================
//  洛书九宫
// ============================================================
const LUOSHU = [
  [4, 9, 2],
  [3, 5, 7],
  [8, 1, 6],
];

// 五行配色与音阶映射
// 1 宫(C) 水青 · 2 商(D) 火红 · 3 角(E) 木绿 · 4 徵(G) 金白 · 5 羽(A) 土黄
function digitStyle(num) {
  const idx = (num - 1) % 5;
  const oct = Math.floor((num - 1) / 5);  // 0 or 1

  const styles = [
    { hue: 195, sat: 88, base: 58 },  // 宫 · 水青
    { hue:  10, sat: 88, base: 58 },  // 商 · 火红
    { hue: 148, sat: 78, base: 56 },  // 角 · 木绿
    { hue: 220, sat: 65, base: 68 },  // 徵 · 金白
    { hue:  40, sat: 92, base: 60 },  // 羽 · 土黄
  ];
  const s = styles[idx];
  return {
    hue: s.hue,
    sat: s.sat,
    lig: clamp(s.base + oct * 8, 0, 92),
  };
}

// ============================================================
//  顶点
// ============================================================
const vertices = [];

function buildVertices() {
  vertices.length = 0;
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 3; col++) {
      const num = LUOSHU[row][col];
      const style = digitStyle(num);

      const bx = (col - 1) * 2.5;
      const by = (1 - row) * 2.5;
      const bz = (num - 5) * 0.62;

      vertices.push({
        num,
        row,
        col,
        bx, by, bz,
        x: bx, y: by, z: bz,
        // 半径与数字成正比
        radius: 0.22 + (num - 1) * 0.042,
        // 音色混合：数字越大磬的比例越高
        qingMix: 0.18 + (num - 1) / 8 * 0.64,
        // 音符时长与数字成正比
        duration: 1.5 + num * 0.34,
        style,
        phase: Math.random() * Math.PI * 2,
        // 动画
        pulse: 0,
        hover: 0,
        // 投影结果
        proj: null,
      });
    }
  }
}

// ============================================================
//  五声音阶 → MIDI
// ============================================================
const PENTA = [0, 2, 4, 7, 9];   // 宫 商 角 徵 羽

function digitToMidi(num) {
  const idx = (num - 1) % 5;
  const oct = Math.floor((num - 1) / 5);
  return 48 + PENTA[idx] + oct * 12;
}

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiName(m) {
  return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);
}

// ============================================================
//  相机
// ============================================================
const cam = {
  theta: 0.42,
  phi: 0.40,
  dist: 9.6,
  target: { x: 0, y: 0, z: 0 },
};
const camTarget = {
  theta: 0.42,
  phi: 0.40,
};

const camState = {
  dragging: false,
  lastX: 0,
  lastY: 0,
};

// ============================================================
//  音频
// ============================================================
const audio = {
  ctx: null,
  master: null,
  reverb: null,
  ready: false,
};

function makeIR(actx, dur, decay) {
  const rate = actx.sampleRate;
  const len = Math.floor(rate * dur);
  const buf = actx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
    }
  }
  return buf;
}

function ensureAudio() {
  if (audio.ctx) {
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const actx = new AC();
  audio.ctx = actx;

  const master = actx.createGain();
  master.gain.value = 0.46;
  master.connect(actx.destination);
  audio.master = master;

  const conv = actx.createConvolver();
  conv.buffer = makeIR(actx, 5.0, 2.6);
  const wet = actx.createGain();
  wet.gain.value = 0.62;
  conv.connect(wet);
  wet.connect(master);
  audio.reverb = conv;

  audio.ready = true;
}

/** 古琴：柔和拨弦，泛音列谐和 */
function playGuqin(freq, vel, dur) {
  const actx = audio.ctx;
  const t0 = actx.currentTime;

  const out = actx.createGain();
  out.gain.value = 0.92;
  out.connect(audio.master);
  out.connect(audio.reverb);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = clamp(freq * 8 + 2000, 1000, 11000);
  lp.Q.value = 0.42;
  lp.connect(out);

  const partials = [
    { m: 1.000, g: 1.00, d: dur },
    { m: 2.004, g: 0.48, d: dur * 0.76 },
    { m: 3.010, g: 0.26, d: dur * 0.56 },
    { m: 4.018, g: 0.14, d: dur * 0.42 },
    { m: 5.028, g: 0.075, d: dur * 0.30 },
    { m: 6.042, g: 0.038, d: dur * 0.22 },
    { m: 7.058, g: 0.018, d: dur * 0.16 },
  ];

  for (const p of partials) {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq * p.m;
    o.detune.value = (Math.random() - 0.5) * 5;

    const g = actx.createGain();
    const peak = 0.13 * vel * p.g;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.00005, t0 + p.d);

    o.connect(g);
    g.connect(lp);
    o.start(t0);
    o.stop(t0 + p.d + 0.1);
  }

  // 拨弦瞬态
  const nlen = Math.floor(actx.sampleRate * 0.045);
  const nbuf = actx.createBuffer(1, nlen, actx.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nlen, 3.4);
  }
  const ns = actx.createBufferSource();
  ns.buffer = nbuf;

  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = clamp(freq * 4.5, 500, 5500);
  nf.Q.value = 1.5;

  const ng = actx.createGain();
  ng.gain.value = 0.06 * vel;

  ns.connect(nf);
  nf.connect(ng);
  ng.connect(out);
  ns.start(t0);
}

/** 磬：金属钟声，非谐分音，衰减极长 */
function playQing(freq, vel, dur) {
  const actx = audio.ctx;
  const t0 = actx.currentTime;

  const out = actx.createGain();
  out.gain.value = 0.85;
  out.connect(audio.master);
  out.connect(audio.reverb);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = clamp(freq * 11 + 3000, 1400, 14000);
  lp.Q.value = 0.32;
  lp.connect(out);

  // 磬（编钟）非谐分音
  const partials = [
    { m: 1.000, g: 1.00, d: dur * 1.55 },
    { m: 2.000, g: 0.55, d: dur * 1.25 },
    { m: 2.760, g: 0.34, d: dur * 1.00 },
    { m: 4.000, g: 0.17, d: dur * 0.72 },
    { m: 5.400, g: 0.090, d: dur * 0.52 },
    { m: 6.800, g: 0.045, d: dur * 0.36 },
    { m: 8.400, g: 0.021, d: dur * 0.24 },
    { m: 10.20, g: 0.010, d: dur * 0.16 },
  ];

  for (const p of partials) {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq * p.m;
    o.detune.value = (Math.random() - 0.5) * 4;

    const g = actx.createGain();
    const peak = 0.10 * vel * p.g;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.00005, t0 + p.d);

    o.connect(g);
    g.connect(lp);
    o.start(t0);
    o.stop(t0 + p.d + 0.12);
  }

  // 击打瞬态
  const nlen = Math.floor(actx.sampleRate * 0.07);
  const nbuf = actx.createBuffer(1, nlen, actx.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nlen, 4);
  }
  const ns = actx.createBufferSource();
  ns.buffer = nbuf;

  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = clamp(freq * 5.5, 800, 7000);
  nf.Q.value = 1.4;

  const ng = actx.createGain();
  ng.gain.value = 0.08 * vel;

  ns.connect(nf);
  nf.connect(ng);
  ng.connect(out);
  ns.start(t0);
}

/** 古琴 + 磬 合奏 */
function playNote(vert, vel) {
  ensureAudio();
  if (!audio.ready) return;

  const midi = digitToMidi(vert.num);
  const freq = midiToFreq(midi);
  const qingMix = vert.qingMix;
  const guqinMix = 1 - qingMix;

  const dur = vert.duration;

  if (guqinMix > 0.05) {
    playGuqin(freq, vel * guqinMix, dur);
  }
  if (qingMix > 0.05) {
    playQing(freq, vel * qingMix, dur);
  }
}

// ============================================================
//  旋律线
// ============================================================
const melodyLines = [];   // { a: idx, b: idx, t0: number }
const MAX_LINES = 60;
const LINE_LIFE = 14;     // 秒

// ============================================================
//  脉冲
// ============================================================
const pulses = [];        // { x, y, t0, hue }

// ============================================================
//  交互状态
// ============================================================
const input = {
  mode: null,           // 'orbit' | 'melody'
  lastVertexIdx: -1,
  hoverIdx: -1,
  startX: 0,
  startY: 0,
  moved: false,
};

const auto = {
  on: false,
  step: 0,
  timer: 0,
  interval: 0.78,
  order: [1, 6, 2, 7, 3, 8, 4, 9, 5],
};

// ============================================================
//  3D 投影
// ============================================================
function project(p) {
  const cp = Math.cos(cam.phi);
  const sp = Math.sin(cam.phi);
  const ct = Math.cos(cam.theta);
  const st = Math.sin(cam.theta);

  const eyeX = cam.target.x + cam.dist * cp * st;
  const eyeY = cam.target.y + cam.dist * sp;
  const eyeZ = cam.target.z + cam.dist * cp * ct;

  let fx = cam.target.x - eyeX;
  let fy = cam.target.y - eyeY;
  let fz = cam.target.z - eyeZ;
  const fl = Math.hypot(fx, fy, fz) || 1;
  fx /= fl; fy /= fl; fz /= fl;

  // 右向量 = 前向 × 世界向上(0,1,0)
  let rx = -fz, ry = 0, rz = fx;
  const rl = Math.hypot(rx, ry, rz) || 1;
  rx /= rl; ry /= rl; rz /= rl;

  // 上向量 = 右 × 前
  const ux = ry * fz - rz * fy;
  const uy = rz * fx - rx * fz;
  const uz = rx * fy - ry * fx;

  const dx = p.x - eyeX;
  const dy = p.y - eyeY;
  const dz = p.z - eyeZ;

  const vx = dx * rx + dy * ry + dz * rz;
  const vy = dx * ux + dy * uy + dz * uz;
  const vz = dx * fx + dy * fy + dz * fz;

  if (vz < 0.6) return null;

  const f = focal / vz;
  return {
    x: cx + vx * f,
    y: cy - vy * f,
    z: vz,
    scale: f,
  };
}

// ============================================================
//  更新
// ============================================================
let nowT = 0;

function updateVertices(t, dt) {
  for (const v of vertices) {
    // 3D 浮动
    v.x = v.bx + Math.sin(t * 0.72 + v.phase) * 0.09;
    v.y = v.by + Math.sin(t * 0.94 + v.phase * 1.31) * 0.09;
    v.z = v.bz + Math.sin(t * 0.55 + v.phase * 0.73) * 0.14;

    // 投影
    v.proj = project(v);

    // 衰减动画
    v.pulse = Math.max(0, v.pulse - dt * 1.65);
    v.hover += ((input.hoverIdx === vertices.indexOf(v) ? 1 : 0) - v.hover) * Math.min(1, dt * 9);
  }
}

function updatePulses(t) {
  for (let i = pulses.length - 1; i >= 0; i--) {
    if (t - pulses[i].t0 > 1.4) pulses.splice(i, 1);
  }
}

function updateMelody(t) {
  for (let i = melodyLines.length - 1; i >= 0; i--) {
    if (t - melodyLines[i].t0 > LINE_LIFE) melodyLines.splice(i, 1);
  }
}

// ============================================================
//  渲染
// ============================================================
let bgGrad = null, bgKey = '';

function drawBackground() {
  const key = W + 'x' + H;
  if (key !== bgKey) {
    bgGrad = ctx.createRadialGradient(
      W * 0.5, H * 0.46, 0,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.78
    );
    bgGrad.addColorStop(0,    '#0b1424');
    bgGrad.addColorStop(0.42, '#070b14');
    bgGrad.addColorStop(1,    '#04060a');
    bgKey = key;
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 极坐标网格
  ctx.save();
  ctx.strokeStyle = 'rgba(110, 160, 210, 0.026)';
  ctx.lineWidth = 1;
  const rStep = Math.min(W, H) * 0.08;
  for (let i = 1; i <= 9; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, i * rStep, 0, Math.PI * 2);
    ctx.stroke();
  }
  for (let i = 0; i < 24; i++) {
    const a = i * Math.PI / 12;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * rStep * 9, cy + Math.sin(a) * rStep * 9);
    ctx.stroke();
  }
  ctx.restore();
}

/** 洛书九宫格底板连接 */
function drawGrid() {
  const grid = [
    [0,1],[1,2],[3,4],[4,5],[6,7],[7,8],
    [0,3],[3,6],[1,4],[4,7],[2,5],[5,8],
  ];

  ctx.save();
  ctx.lineWidth = 1;
  for (const [i, j] of grid) {
    const a = vertices[i], b = vertices[j];
    if (!a.proj || !b.proj) continue;

    const zAvg = (a.proj.z + b.proj.z) * 0.5;
    const alpha = clamp(8 / zAvg, 0.03, 0.14);

    ctx.beginPath();
    ctx.moveTo(a.proj.x, a.proj.y);
    ctx.lineTo(b.proj.x, b.proj.y);
    ctx.strokeStyle = `rgba(120, 170, 220, ${alpha})`;
    ctx.stroke();
  }
  ctx.restore();
}

function drawMelodyLines(t) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (const line of melodyLines) {
    const a = vertices[line.a], b = vertices[line.b];
    if (!a.proj || !b.proj) continue;

    const age = t - line.t0;
    const fade = age < 1 ? 1 : Math.max(0, 1 - (age - 1) / (LINE_LIFE - 1));
    if (fade < 0.02) continue;

    const [ha, sa, la] = [a.style.hue, a.style.sat, a.style.lig];
    const [hb, sb, lb] = [b.style.hue, b.style.sat, b.style.lig];

    // 渐变
    const grd = ctx.createLinearGradient(a.proj.x, a.proj.y, b.proj.x, b.proj.y);
    grd.addColorStop(0, `hsla(${ha}, ${sa}%, ${la}%, ${fade * 0.72})`);
    grd.addColorStop(1, `hsla(${hb}, ${sb}%, ${lb}%, ${fade * 0.72})`);

    // 光晕
    ctx.beginPath();
    ctx.moveTo(a.proj.x, a.proj.y);
    ctx.lineTo(b.proj.x, b.proj.y);
    ctx.strokeStyle = grd;
    ctx.lineWidth = 7 * fade;
    ctx.globalAlpha = 0.12 * fade;
    ctx.shadowColor = `hsla(${ha}, ${sa}%, ${la}%, ${fade * 0.7})`;
    ctx.shadowBlur = 22;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 主线
    ctx.beginPath();
    ctx.moveTo(a.proj.x, a.proj.y);
    ctx.lineTo(b.proj.x, b.proj.y);
    ctx.strokeStyle = grd;
    ctx.lineWidth = 1.9 * fade;
    ctx.shadowBlur = 12;
    ctx.stroke();

    // 高光
    ctx.beginPath();
    ctx.moveTo(a.proj.x, a.proj.y);
    ctx.lineTo(b.proj.x, b.proj.y);
    ctx.strokeStyle = `rgba(255,255,255,${fade * 0.22})`;
    ctx.lineWidth = 0.9 * fade;
    ctx.shadowBlur = 0;
    ctx.stroke();
  }

  ctx.restore();
}

function drawVertex(v, t) {
  if (!v.proj) return;

  const p = v.proj;
  const [h, s, l] = [v.style.hue, v.style.sat, v.style.lig];

  const depth = clamp(12 / p.z, 0.42, 1.5);
  const pulseAmp = v.pulse * 0.6;
  const hoverAmp = v.hover * 0.28;

  const baseR = v.radius * depth * (1 + pulseAmp + hoverAmp) * p.scale * 0.42;

  ctx.save();

  // ── 外光晕（持续呼吸）──
  const breath = 0.5 + 0.5 * Math.sin(t * 1.6 + v.phase);
  const haloR = baseR * (3.6 + breath * 0.5 + v.pulse * 2.4);
  const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, haloR);
  halo.addColorStop(0,    `hsla(${h}, ${s}%, ${l}%, ${0.55 + v.pulse * 0.35})`);
  halo.addColorStop(0.36, `hsla(${h}, ${s}%, ${l}%, ${0.16 + v.pulse * 0.18})`);
  halo.addColorStop(1,    `hsla(${h}, ${s}%, ${l}%, 0)`);
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(p.x, p.y, haloR, 0, Math.PI * 2);
  ctx.fill();

  // ── 球体 ──
  const grd = ctx.createRadialGradient(
    p.x - baseR * 0.34, p.y - baseR * 0.38, baseR * 0.05,
    p.x, p.y, baseR
  );
  const lightL = Math.min(96, l + 30);
  const darkL = Math.max(12, l - 34);
  grd.addColorStop(0,    `hsla(${h}, ${Math.min(100, s + 8)}%, ${lightL}%, 1)`);
  grd.addColorStop(0.42, `hsla(${h}, ${s}%, ${l}%, 0.96)`);
  grd.addColorStop(1,    `hsla(${h}, ${Math.max(30, s - 12)}%, ${darkL}%, 0.92)`);

  ctx.beginPath();
  ctx.arc(p.x, p.y, baseR, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.shadowColor = `hsla(${h}, ${s}%, ${l}%, ${0.85 + v.pulse * 0.15})`;
  ctx.shadowBlur = 22 + v.pulse * 26 + v.hover * 12;
  ctx.fill();
  ctx.shadowBlur = 0;

  // 镜面高光
  ctx.beginPath();
  ctx.arc(p.x - baseR * 0.32, p.y - baseR * 0.36, baseR * 0.28, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255, 255, 255, ${0.72 + v.pulse * 0.2})`;
  ctx.fill();

  // ── 数字标注 ──
  const fontSize = Math.max(12, baseR * 1.10);
  ctx.font = `500 ${fontSize}px "KaiTi", "STKaiti", "Songti SC", "SimSun", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 描边增强可读性
  ctx.lineWidth = 3.4;
  ctx.strokeStyle = `rgba(4, 8, 14, ${0.88})`;
  ctx.strokeText(String(v.num), p.x, p.y + baseR * 0.02);

  ctx.fillStyle = `rgba(255, 255, 255, ${0.94 + v.pulse * 0.06})`;
  ctx.shadowColor = `hsla(${h}, ${s}%, 88%, ${0.55})`;
  ctx.shadowBlur = 8;
  ctx.fillText(String(v.num), p.x, p.y + baseR * 0.02);
  ctx.shadowBlur = 0;

  // ── 脉冲环 ──
  if (v.pulse > 0.02) {
    const ringR = baseR + (1 - v.pulse) * baseR * 3.2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${h}, ${s}%, ${l + 12}%, ${v.pulse * 0.62})`;
    ctx.lineWidth = 2.0 * v.pulse;
    ctx.shadowColor = `hsla(${h}, ${s}%, ${l}%, ${v.pulse * 0.9})`;
    ctx.shadowBlur = 16 * v.pulse;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function drawPulses(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const pu of pulses) {
    const age = t - pu.t0;
    const k = age / 1.4;
    const r = pu.baseR + k * Math.max(W, H) * 0.28;

    ctx.beginPath();
    ctx.arc(pu.x, pu.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${pu.hue}, 88%, 68%, ${(1 - k) * 0.55})`;
    ctx.lineWidth = 2.4 * (1 - k);
    ctx.shadowColor = `hsla(${pu.hue}, 88%, 68%, ${(1 - k) * 0.8})`;
    ctx.shadowBlur = 18 * (1 - k);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(pu.x, pu.y, r * 0.62, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${pu.hue}, 88%, 74%, ${(1 - k) * 0.28})`;
    ctx.lineWidth = 1.3 * (1 - k);
    ctx.shadowBlur = 0;
    ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
//  HUD
// ============================================================
const elLast   = document.getElementById('v-last');
const elMelody = document.getElementById('v-melody');

// 预填数字名称
for (let n = 1; n <= 9; n++) {
  const elN = document.getElementById('n' + n);
  if (elN) elN.textContent = midiName(digitToMidi(n));
  const elD = document.getElementById('d' + n);
  if (elD) {
    const st = digitStyle(n);
    elD.style.background = `hsl(${st.hue}, ${st.sat}%, ${st.lig}%)`;
    elD.style.boxShadow = `0 0 8px hsla(${st.hue}, ${st.sat}%, ${st.lig}%, 0.9)`;
  }
}

let hudT = 0;
function updateHUD(dt) {
  hudT += dt;
  if (hudT < 0.09) return;
  hudT = 0;

  elMelody.textContent = melodyLines.length + ' 段';
}

// ============================================================
//  命中检测
// ============================================================
function findVertexAt(px, py, threshold) {
  let best = -1, bestD = threshold;
  for (let i = 0; i < vertices.length; i++) {
    const p = vertices[i].proj;
    if (!p) continue;
    const d = Math.hypot(px - p.x, py - p.y);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function triggerVertex(idx, vel) {
  if (idx < 0 || idx >= vertices.length) return;
  const v = vertices[idx];

  playNote(v, vel !== undefined ? vel : 0.78);

  v.pulse = 1;

  pulses.push({
    x: v.proj ? v.proj.x : cx,
    y: v.proj ? v.proj.y : cy,
    baseR: v.proj ? v.proj.scale * 0.42 * (v.radius + 0.12) : 22,
    t0: nowT,
    hue: v.style.hue,
  });

  elLast.textContent = `${v.num} · ${midiName(digitToMidi(v.num))}`;
}

// ============================================================
//  指针交互
// ============================================================
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  document.getElementById('hint').classList.add('hide');

  canvas.setPointerCapture(e.pointerId);

  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;

  input.startX = px;
  input.startY = py;
  input.moved = false;

  // 命中检测
  const idx = findVertexAt(px, py, 34);

  if (idx >= 0) {
    input.mode = 'melody';
    input.lastVertexIdx = idx;
    triggerVertex(idx, 0.82);
    document.documentElement.classList.add('dragging');
  } else {
    input.mode = 'orbit';
    camState.dragging = true;
    camState.lastX = px;
    camState.lastY = py;
    document.documentElement.classList.add('dragging');
  }
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;

  if (input.mode === 'melody') {
    e.preventDefault();

    const idx = findVertexAt(px, py, 32);

    if (idx >= 0 && idx !== input.lastVertexIdx) {
      // 连接两个顶点
      melodyLines.push({
        a: input.lastVertexIdx,
        b: idx,
        t0: nowT,
      });
      if (melodyLines.length > MAX_LINES) melodyLines.shift();

      input.lastVertexIdx = idx;
      input.moved = true;
      triggerVertex(idx, 0.7);
    }
    return;
  }

  if (input.mode === 'orbit') {
    e.preventDefault();
    const dx = px - camState.lastX;
    const dy = py - camState.lastY;
    camState.lastX = px;
    camState.lastY = py;

    if (Math.abs(dx) + Math.abs(dy) > 2) input.moved = true;

    camTarget.theta -= dx * 0.0075;
    camTarget.phi = clamp(camTarget.phi + dy * 0.0062, -0.32, 1.22);
    return;
  }

  // 悬停
  const idx = findVertexAt(px, py, 30);
  input.hoverIdx = idx;
  canvas.style.cursor = idx >= 0 ? 'pointer' : 'grab';
}, { passive: false });

function endPointer(e) {
  const wasMelody = input.mode === 'melody';
  const wasMoved = input.moved;

  input.mode = null;
  camState.dragging = false;
  input.lastVertexIdx = -1;
  document.documentElement.classList.remove('dragging');

  // 若在顶点上点击而未移动 → 已触发，无需重复
  if (e && wasMelody && !wasMoved) {
    // 保持
  }
}

canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
window.addEventListener('blur', endPointer);

// 滚轮缩放
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  ensureAudio();
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0011), 4.5, 20);
}, { passive: false });

// 双指缩放
let pinchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinchDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchDist > 0) {
    e.preventDefault();
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    cam.dist = clamp(cam.dist * (pinchDist / (d || 1)), 4.5, 20);
    pinchDist = d;
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { pinchDist = 0; });

// ============================================================
//  按钮
// ============================================================
document.getElementById('btn-auto').addEventListener('click', () => {
  ensureAudio();
  document.getElementById('hint').classList.add('hide');

  auto.on = !auto.on;
  auto.step = 0;
  auto.timer = 0;

  const btn = document.getElementById('btn-auto');
  btn.classList.toggle('on', auto.on);
  btn.textContent = auto.on ? '停止演奏' : '自动演奏';
});

document.getElementById('btn-clear').addEventListener('click', () => {
  melodyLines.length = 0;
});

document.getElementById('btn-reset').addEventListener('click', () => {
  camTarget.theta = 0.42;
  camTarget.phi = 0.40;
  cam.dist = 9.6;
});

window.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-auto').click(); }
  if (e.key === 'c' || e.key === 'C') document.getElementById('btn-clear').click();
  if (e.key === 'r' || e.key === 'R') document.getElementById('btn-reset').click();
});

window.addEventListener('resize', resize);

// ============================================================
//  自动演奏
// ============================================================
function updateAuto(dt) {
  if (!auto.on) return;

  auto.timer += dt;

  if (auto.timer >= auto.interval) {
    auto.timer = 0;

    const num = auto.order[auto.step % auto.order.length];
    const idx = vertices.findIndex(v => v.num === num);
    if (idx < 0) { auto.step++; return; }

    // 与上一个连接
    const prevNum = auto.order[(auto.step - 1 + auto.order.length) % auto.order.length];
    const prevIdx = vertices.findIndex(v => v.num === prevNum);

    if (prevIdx >= 0 && auto.step > 0) {
      melodyLines.push({
        a: prevIdx,
        b: idx,
        t0: nowT,
      });
      if (melodyLines.length > MAX_LINES) melodyLines.shift();
    }

    triggerVertex(idx, 0.72);

    auto.step++;
  }
}

// ============================================================
//  主循环
// ============================================================
let lastT = performance.now() / 1000;

function frame(nowMs) {
  const t = nowMs / 1000;
  const dt = Math.min(t - lastT, 0.05);
  lastT = t;
  nowT = t;

  // 自动演奏
  updateAuto(dt);

  // 相机平滑
  cam.theta += (camTarget.theta - cam.theta) * Math.min(1, dt * 5);
  cam.phi   += (camTarget.phi   - cam.phi)   * Math.min(1, dt * 5);

  // 更新顶点投影
  updateVertices(t, dt);

  // 清理
  updatePulses(t);
  updateMelody(t);

  // ── 绘制 ──
  drawBackground();
  drawGrid();
  drawMelodyLines(t);

  // 按深度排序顶点（先画远的）
  const sorted = vertices.slice().sort((a, b) => {
    const za = a.proj ? a.proj.z : 1e9;
    const zb = b.proj ? b.proj.z : 1e9;
    return zb - za;
  });

  for (const v of sorted) {
    drawVertex(v, t);
  }

  drawPulses(t);

  updateHUD(dt);

  requestAnimationFrame(frame);
}

// ============================================================
//  启动
// ============================================================
resize();
buildVertices();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
