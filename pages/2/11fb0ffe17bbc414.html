<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLTEN · 液态金属</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060608;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            right: 32px;
            z-index: 2;
            text-align: right;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(240, 220, 190, 0.8);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(180, 120, 60, 0.5);
        }

        .hint {
            color: rgba(190, 170, 140, 0.5);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
                right: 20px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.22em;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <div class="title">Molten</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let metalDrops = [];      // 金属液滴
            let mouse = { x: -9999, y: -9999, active: false, vx: 0, vy: 0, px: -9999, py: -9999 };
            let time = 0;
            let colorShift = 0;       // 色调偏移，点击切换
            let ripples = [];         // 点击波纹
            let maxDrops = 120;       // 最大液滴数

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#060608';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 金属液滴类 ─────────────────────────────────────────────
            class MetalDrop {
                constructor(x, y, radius, isBig) {
                    this.x = x || Math.random() * W;
                    this.y = y || Math.random() * H;
                    this.vx = (Math.random() - 0.5) * 0.6;
                    this.vy = (Math.random() - 0.5) * 0.6;
                    this.radius = radius || (isBig ? 15 + Math.random() * 20 : 4 + Math.random() * 10);
                    this.targetRadius = this.radius;
                    this.hue = 35 + Math.random() * 30;  // 金色/铜色范围
                    this.saturation = 70 + Math.random() * 25;
                    this.lightness = 55 + Math.random() * 20;
                    this.glowIntensity = 0.6 + Math.random() * 0.4;
                    this.viscosity = 0.92 + Math.random() * 0.06;
                    this.pulsePhase = Math.random() * Math.PI * 2;
                }

                update(dt, mouse) {
                    // 鼠标吸引力
                    if (mouse.active) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const distSq = dx * dx + dy * dy;
                        const attractRadius = 220;
                        const attractSq = attractRadius * attractRadius;
                        if (distSq < attractSq && distSq > 0.01) {
                            const dist = Math.sqrt(distSq);
                            const force = (1 - dist / attractRadius) * 0.35 * dt;
                            const normX = dx / dist;
                            const normY = dy / dist;
                            this.vx += normX * force;
                            this.vy += normY * force;
                        }
                    }

                    // 其他液滴之间的斥力（防止完全重叠）
                    for (const other of metalDrops) {
                        if (other === this) continue;
                        const dx = this.x - other.x;
                        const dy = this.y - other.y;
                        const distSq = dx * dx + dy * dy;
                        const minDist = (this.radius + other.radius) * 0.6;
                        const minSq = minDist * minDist;
                        if (distSq < minSq && distSq > 0.001) {
                            const dist = Math.sqrt(distSq);
                            const force = (1 - dist / minDist) * 0.2 * dt;
                            const normX = dx / dist;
                            const normY = dy / dist;
                            this.vx += normX * force;
                            this.vy += normY * force;
                        }
                    }

                    // 粘性阻尼
                    this.vx *= this.viscosity;
                    this.vy *= this.viscosity;

                    // 微小随机游走
                    this.vx += (Math.random() - 0.5) * 0.03;
                    this.vy += (Math.random() - 0.5) * 0.03;

                    // 速度限制
                    const maxSpeed = 3.5;
                    const speedSq = this.vx * this.vx + this.vy * this.vy;
                    if (speedSq > maxSpeed * maxSpeed) {
                        const speed = Math.sqrt(speedSq);
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界弹性
                    const margin = 30;
                    if (this.x < margin) { this.x = margin; this.vx = Math.abs(this.vx) * 0.5; }
                    if (this.x > W - margin) { this.x = W - margin; this.vx = -Math.abs(this.vx) * 0.5; }
                    if (this.y < margin) { this.y = margin; this.vy = Math.abs(this.vy) * 0.5; }
                    if (this.y > H - margin) { this.y = H - margin; this.vy = -Math.abs(this.vy) * 0.5; }

                    // 脉冲动画
                    this.pulsePhase += 0.03;
                    const pulseFactor = 1 + Math.sin(this.pulsePhase) * 0.08;
                    this.radius = this.targetRadius * pulseFactor;
                }

                draw(ctx, t) {
                    const r = this.radius;
                    const hue = this.hue + colorShift + Math.sin(t * 0.3 + this.pulsePhase) * 10;
                    const sat = this.saturation;
                    const light = this.lightness + Math.sin(t * 0.5 + this.pulsePhase) * 8;

                    // 使用径向渐变，模拟金属高光
                    const gradient = ctx.createRadialGradient(
                        this.x - r * 0.25, this.y - r * 0.25, r * 0.1,
                        this.x, this.y, r
                    );
                    const alpha = 0.85;
                    gradient.addColorStop(0, `hsla(${hue + 15}, ${sat - 10}%, ${light + 25}%, ${alpha})`);
                    gradient.addColorStop(0.3, `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.8})`);
                    gradient.addColorStop(0.65, `hsla(${hue - 5}, ${sat - 5}%, ${light - 8}%, ${alpha * 0.5})`);
                    gradient.addColorStop(1, `hsla(${hue - 15}, ${sat - 15}%, ${light - 20}%, 0)`);

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                    ctx.fill();

                    // 高光点
                    const specSize = r * 0.3;
                    const specGradient = ctx.createRadialGradient(
                        this.x - r * 0.3, this.y - r * 0.3, 0,
                        this.x - r * 0.3, this.y - r * 0.3, specSize
                    );
                    specGradient.addColorStop(0, `hsla(45, 80%, 92%, 0.7)`);
                    specGradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = specGradient;
                    ctx.beginPath();
                    ctx.arc(this.x - r * 0.3, this.y - r * 0.3, specSize, 0, Math.PI * 2);
                    ctx.fill();

                    // 外发光
                    if (r > 10) {
                        const glowR = r * 1.6;
                        const glowGradient = ctx.createRadialGradient(this.x, this.y, r * 0.5, this.x, this.y, glowR);
                        glowGradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 10}%, ${0.12 * this.glowIntensity})`);
                        glowGradient.addColorStop(1, 'transparent');
                        ctx.fillStyle = glowGradient;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, glowR, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ─── 初始化液滴 ─────────────────────────────────────────────
            function initDrops() {
                metalDrops = [];
                const count = Math.max(50, Math.min(120, Math.floor(W * H / 15000)));
                maxDrops = count + 30;

                // 创建几个大的液态金属团块
                for (let i = 0; i < 5; i++) {
                    const x = W * (0.15 + Math.random() * 0.7);
                    const y = H * (0.15 + Math.random() * 0.7);
                    metalDrops.push(new MetalDrop(x, y, 18 + Math.random() * 18, true));
                }

                // 创建小液滴
                for (let i = 0; i < count - 5; i++) {
                    metalDrops.push(new MetalDrop());
                }
            }

            // ─── 创建新液滴群 ───────────────────────────────────────────
            function createDropCluster(x, y) {
                const clusterSize = 8 + Math.floor(Math.random() * 8);
                for (let i = 0; i < clusterSize; i++) {
                    if (metalDrops.length >= maxDrops) {
                        // 移除最远的液滴
                        let maxDist = -1;
                        let maxIdx = -1;
                        for (let j = 0; j < metalDrops.length; j++) {
                            const d = metalDrops[j];
                            const dx = d.x - x;
                            const dy = d.y - y;
                            const dist = dx * dx + dy * dy;
                            if (dist > maxDist) {
                                maxDist = dist;
                                maxIdx = j;
                            }
                        }
                        if (maxIdx >= 0) metalDrops.splice(maxIdx, 1);
                    }
                    const offsetX = (Math.random() - 0.5) * 80;
                    const offsetY = (Math.random() - 0.5) * 80;
                    const radius = 6 + Math.random() * 16;
                    metalDrops.push(new MetalDrop(x + offsetX, y + offsetY, radius, radius > 12));
                }
            }

            // ─── 点击波纹 ───────────────────────────────────────────────
            function createRipple(x, y) {
                ripples.push({
                    x, y,
                    radius: 5,
                    maxRadius: 120,
                    life: 1.0,
                    decay: 0.02,
                    hue: 35 + colorShift,
                });
                if (ripples.length > 6) ripples.shift();
            }

            function updateRipples(dt) {
                for (let i = ripples.length - 1; i >= 0; i--) {
                    const r = ripples[i];
                    r.radius += 3 * dt;
                    r.life -= r.decay * dt;
                    if (r.life <= 0) ripples.splice(i, 1);
                }
            }

            function drawRipples(ctx) {
                for (const r of ripples) {
                    const alpha = r.life * 0.25;
                    ctx.strokeStyle = `hsla(${r.hue}, 70%, 70%, ${alpha})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 60;
                const hue = 40 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 80%, 80%, 0.06)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    const dtNorm = fixedStep / 1000 * 60;
                    for (const d of metalDrops) {
                        d.update(dtNorm, mouse);
                    }
                    updateRipples(dtNorm);
                }

                // 清除画布（深色背景，保留微弱拖尾）
                ctx.fillStyle = 'rgba(6, 6, 8, 0.25)';
                ctx.fillRect(0, 0, W, H);

                // 绘制液滴
                for (const d of metalDrops) {
                    d.draw(ctx, time);
                }

                // 绘制波纹
                drawRipples(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.px = mouse.x;
                mouse.py = mouse.y;
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                mouse.vx = (mouse.x - mouse.px) * 0.1;
                mouse.vy = (mouse.y - mouse.py) * 0.1;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                // 创建新的金属液滴群
                createDropCluster(mouse.x, mouse.y);
                createRipple(mouse.x, mouse.y);
                // 切换色调偏移
                colorShift += 15 + Math.random() * 15;
                if (colorShift > 50) colorShift = -15;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.px = mouse.x;
                    mouse.py = mouse.y;
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createDropCluster(mouse.x, mouse.y);
                    createRipple(mouse.x, mouse.y);
                    colorShift += 15 + Math.random() * 15;
                    if (colorShift > 50) colorShift = -15;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                setupCanvas();
                initDrops();
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                ripples = [];
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initDrops();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 确保初始背景填充
            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#060608';
                    ctx.fillRect(0, 0, W, H);
                }
            });

        })();
    </script>
</body>
</html>
