<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>黄金线条舞蹈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0a0f;
            font-family: system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #hint {
            position: fixed;
            bottom: 20px;
            left: 24px;
            color: rgba(255, 215, 0, 0.5);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease;
            font-weight: 300;
        }
        #fps-badge {
            position: fixed;
            top: 16px;
            right: 18px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="fps-badge"></div>
    <div id="hint">移动舞动 · 点击呼吸</div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─── 安全检查 ───
            if (!window.PIXI) {
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;">需要WebGL支持</div>';
                return;
            }

            // ─── 常量 ───
            const FOCAL_LENGTH = 1100;
            const BASE_SCALE = 0.1;
            const AUTO_ROTATE_SPEED = 0.2;
            const MOUSE_INFLUENCE = 0.8;
            const SMOOTH_FACTOR = 0.07;
            const BREATH_DECAY = 2.6;
            const LINE_COUNT = 10;
            const PARTICLES_PER_LINE = 60;
            const TOTAL_PARTICLES = LINE_COUNT * PARTICLES_PER_LINE;

            // ─── 黄金对比色主题 ───
            const COLOR_THEMES = [
                // 金×深紫
                { bg: 0x0d0a0f, colors: [0xFFD700, 0xFFC107, 0xFFAB00, 0xE6A800, 0x9C27B0, 0x7B1FA2, 0xFFE082, 0xD4A017, 0x6A1B9A, 0xFFECB3] },
                // 铜金×靛蓝
                { bg: 0x0f0b0a, colors: [0xE8A84D, 0xD4952B, 0xC77826, 0xBF6A1F, 0x3F51B5, 0x283593, 0xF0C87A, 0xA67B3D, 0x1A237E, 0xF5D9A0] },
                // 亮黄×墨黑
                { bg: 0x0a0a08, colors: [0xFFEA00, 0xFFD600, 0xFFC400, 0xFFB300, 0xCCCCCC, 0x999999, 0xFFF176, 0xFFF9C4, 0x666666, 0xFFE57F] },
                // 琥珀×深蓝
                { bg: 0x080a0e, colors: [0xFFBF00, 0xFFA000, 0xFF8F00, 0xFF6F00, 0x0D47A1, 0x1565C0, 0xFFE082, 0xFFD54F, 0x0A3D91, 0xFFF3E0] },
                // 黄金×紫红
                { bg: 0x0f080a, colors: [0xFFD700, 0xE6B800, 0xD4A000, 0xC28F00, 0xAD1457, 0x880E4F, 0xFFE44D, 0xFFF0B3, 0xD81B60, 0xFFECB3] },
            ];
            let themeIndex = 0;

            // ─── DOM ───
            const fpsBadge = document.getElementById('fps-badge');
            const hintEl = document.getElementById('hint');

            // ─── PixiJS 初始化 ───
            let app;
            try {
                app = new PIXI.Application({
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0x0d0a0f,
                    antialias: false,
                    autoDensity: true,
                    resolution: Math.min(window.devicePixelRatio || 1, 2),
                    powerPreference: 'high-performance',
                });
            } catch (err) {
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;">初始化失败</div>';
                return;
            }
            document.body.appendChild(app.view);

            // ─── 发光纹理 ───
            function createGlowTexture(size) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const half = size / 2;
                const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
                grad.addColorStop(0.0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.08, 'rgba(255,255,255,0.95)');
                grad.addColorStop(0.3, 'rgba(255,255,255,0.55)');
                grad.addColorStop(0.6, 'rgba(255,255,255,0.18)');
                grad.addColorStop(1.0, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);
                const tex = PIXI.Texture.from(c);
                tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
                return tex;
            }
            const glowTex64 = createGlowTexture(64);
            const glowTex128 = createGlowTexture(128);

            // ─── 粒子容器 ───
            const particleContainer = new PIXI.ParticleContainer(TOTAL_PARTICLES, {
                position: true,
                scale: true,
                tint: true,
                alpha: true,
            }, TOTAL_PARTICLES, true);
            particleContainer.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(particleContainer);

            // ─── 中心光晕 ───
            const centerGlow = new PIXI.Sprite(glowTex128);
            centerGlow.anchor.set(0.5);
            centerGlow.tint = 0xFFD700;
            centerGlow.alpha = 0.2;
            centerGlow.scale.set(1.4);
            centerGlow.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerGlow);

            const centerCore = new PIXI.Sprite(glowTex64);
            centerCore.anchor.set(0.5);
            centerCore.tint = 0xFFEA00;
            centerCore.alpha = 0.4;
            centerCore.scale.set(0.3);
            centerCore.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerCore);

            // ─── 粒子数据 ───
            const sprites = [];
            const pData = [];
            let mouseX = 0,
                mouseY = 0,
                smoothMX = 0,
                smoothMY = 0;
            let autoRotateY = 0;
            let time = 0;
            let frameCount = 0;
            let fpsLastTime = 0;
            let breathEnergy = 0;

            // ─── 音频 ───
            let audioCtx = null;
            function ensureAudio() {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) audioCtx = new AC();
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playBreathSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const dur = 0.55;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(55, now + dur);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + dur);
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(130, now);
                osc2.frequency.exponentialRampToValueAtTime(40, now + dur * 0.75);
                gain2.gain.setValueAtTime(0.12, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + dur * 0.85);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.03);
                osc2.stop(now + dur);
            }

            // ─── 曲线生成 ───
            // 每条线定义：基频、振幅、Z深度、方向偏移
            const lineDefs = [];
            for (let i = 0; i < LINE_COUNT; i++) {
                const depth = (i - LINE_COUNT / 2) * 60;
                const baseAmpX = 120 + Math.random() * 100;
                const baseAmpY = 80 + Math.random() * 90;
                const freqX = 1.5 + Math.random() * 2.0;
                const freqY = 1.2 + Math.random() * 2.2;
                const phaseX = Math.random() * Math.PI * 2;
                const phaseY = Math.random() * Math.PI * 2;
                const speed = 0.55 + Math.random() * 0.75;
                const colorIdx = i % 10; // 每条线一个颜色索引
                lineDefs.push({
                    depth,
                    baseAmpX,
                    baseAmpY,
                    freqX,
                    freqY,
                    phaseX,
                    phaseY,
                    speed,
                    colorIdx,
                });
            }

            // ─── 初始化粒子 ───
            function initParticles() {
                for (let li = 0; li < LINE_COUNT; li++) {
                    const def = lineDefs[li];
                    for (let pi = 0; pi < PARTICLES_PER_LINE; pi++) {
                        const sprite = new PIXI.Sprite(glowTex64);
                        sprite.anchor.set(0.5);
                        const theme = COLOR_THEMES[0];
                        sprite.tint = theme.colors[def.colorIdx % theme.colors.length];
                        sprite.alpha = 0.75 + Math.random() * 0.25;
                        sprite.scale.set(BASE_SCALE * (0.7 + Math.random() * 0.6));
                        const phase = pi / PARTICLES_PER_LINE;
                        const flowDir = Math.random() > 0.5 ? 1 : -1;
                        const data = {
                            lineIdx: li,
                            phase,
                            speed: def.speed * flowDir * (0.9 + Math.random() * 0.2),
                            colorIdx: def.colorIdx,
                            baseAlpha: 0.7 + Math.random() * 0.3,
                            sizeMod: 0.75 + Math.random() * 0.5,
                        };
                        pData.push(data);
                        sprites.push(sprite);
                        particleContainer.addChild(sprite);
                    }
                }
                console.log('线条粒子初始化:', sprites.length);
            }

            // ─── 获取曲线上的点 ───
            function getCurvePoint(lineIdx, t) {
                const def = lineDefs[lineIdx];
                const mouseInfluenceX = (smoothMX / window.innerWidth - 0.5) * 2 * MOUSE_INFLUENCE;
                const mouseInfluenceY = (smoothMY / window.innerHeight - 0.5) * 2 * MOUSE_INFLUENCE;

                // 鼠标影响幅度和频率
                const ampX = def.baseAmpX * (1 + mouseInfluenceX * 0.7);
                const ampY = def.baseAmpY * (1 + mouseInfluenceY * 0.7);
                const freqModX = 1 + Math.abs(mouseInfluenceX) * 0.5;
                const freqModY = 1 + Math.abs(mouseInfluenceY) * 0.5;

                const angle = t * Math.PI * 2;
                const x = Math.sin(angle * def.freqX * freqModX + def.phaseX + time * 0.8) * ampX +
                    Math.cos(angle * def.freqX * 0.7 + time * 0.5) * ampX * 0.4;
                const y = Math.sin(angle * def.freqY * freqModY + def.phaseY + time * 0.6) * ampY +
                    Math.cos(angle * def.freqY * 1.1 + time * 0.7) * ampY * 0.35;
                const z = def.depth + Math.sin(angle * 2.0 + time * 0.4) * 50 +
                    Math.cos(angle * 1.3 + mouseInfluenceX * 2) * 35;

                return { x, y, z };
            }

            // ─── 3D变换 ───
            function rotatePoint(x, y, z, viewX, viewY) {
                const cosY = Math.cos(viewY);
                const sinY = Math.sin(viewY);
                const x1 = x * cosY + z * sinY;
                const z1 = -x * sinY + z * cosY;
                const y1 = y;
                const cosX = Math.cos(viewX);
                const sinX = Math.sin(viewX);
                const y2 = y1 * cosX - z1 * sinX;
                const z2 = y1 * sinX + z1 * cosX;
                const x2 = x1;
                return { x: x2, y: y2, z: z2 };
            }

            function projectPoint(p, cx, cy) {
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + p.z);
                return { sx: p.x * scale + cx, sy: p.y * scale + cy, scale };
            }

            // ─── 更新粒子 ───
            function updateParticles(delta, viewX, viewY, cx, cy) {
                if (breathEnergy > 0) breathEnergy = Math.max(0, breathEnergy - delta * BREATH_DECAY);
                const theme = COLOR_THEMES[themeIndex];

                for (let i = 0; i < sprites.length; i++) {
                    const d = pData[i];
                    const s = sprites[i];
                    d.phase += d.speed * delta * 0.6;
                    if (d.phase > 1) d.phase -= 1;
                    if (d.phase < 0) d.phase += 1;

                    const pt = getCurvePoint(d.lineIdx, d.phase);
                    // 呼吸偏移
                    let ox = 0,
                        oy = 0,
                        oz = 0;
                    if (breathEnergy > 0) {
                        const dist = Math.sqrt(pt.x * pt.x + pt.y * pt.y + pt.z * pt.z) || 1;
                        const bo = breathEnergy * 20 * Math.sin(d.phase * Math.PI * 2 + time * 3);
                        ox = pt.x / dist * bo;
                        oy = pt.y / dist * bo;
                        oz = pt.z / dist * bo;
                    }
                    const rp = rotatePoint(pt.x + ox, pt.y + oy, pt.z + oz, viewX, viewY);
                    const pr = projectPoint(rp, cx, cy);
                    const depthF = pr.scale;
                    const breathGlow = 1 + breathEnergy * 0.4;
                    const alphaMod = 0.85 + 0.15 * Math.sin(time * 1.7 + i * 0.05);
                    s.position.set(pr.sx, pr.sy);
                    s.scale.set(BASE_SCALE * d.sizeMod * depthF * breathGlow);
                    s.alpha = Math.max(0.08, Math.min(1, d.baseAlpha * depthF * alphaMod + breathEnergy * 0.15));
                    s.tint = theme.colors[d.colorIdx % theme.colors.length];
                }
            }

            // ─── 更新中心 ───
            function updateCenter(cx, cy) {
                const theme = COLOR_THEMES[themeIndex];
                const bp = breathEnergy * 0.5;
                centerGlow.position.set(cx, cy);
                centerGlow.tint = theme.colors[0];
                centerGlow.alpha = 0.18 + 0.06 * Math.sin(time * 1.4) + bp;
                centerGlow.scale.set(1.3 + 0.2 * Math.sin(time * 1.1) + breathEnergy * 0.6);
                centerCore.position.set(cx, cy);
                centerCore.tint = theme.colors[4] || theme.colors[0];
                centerCore.alpha = 0.35 + 0.1 * Math.sin(time * 2.0) + bp;
                centerCore.scale.set(0.28 + 0.04 * Math.sin(time * 2.3) + breathEnergy * 0.2);
            }

            // ─── 主循环 ───
            app.ticker.add((delta) => {
                const dt = Math.min(delta / 60, 0.05);
                time += dt;
                frameCount++;
                const w = window.innerWidth;
                const h = window.innerHeight;
                const cx = w / 2;
                const cy = h / 2;
                smoothMX += (mouseX - smoothMX) * SMOOTH_FACTOR;
                smoothMY += (mouseY - smoothMY) * SMOOTH_FACTOR;
                autoRotateY += AUTO_ROTATE_SPEED * dt;
                const normX = (smoothMX / w) * 2 - 1;
                const normY = (smoothMY / h) * 2 - 1;
                const viewY = autoRotateY + normX * 0.55;
                const viewX = normY * 0.42;
                updateParticles(dt, viewX, viewY, cx, cy);
                updateCenter(cx, cy);
                if (time - fpsLastTime > 0.5) {
                    fpsBadge.textContent = Math.round(frameCount / (time - fpsLastTime)) + ' fps';
                    frameCount = 0;
                    fpsLastTime = time;
                }
            });

            // ─── 交互 ───
            function getCoords(e) {
                const rect = app.view.getBoundingClientRect();
                let cx, cy;
                if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX;
                    cy = e.touches[0].clientY; } else { cx = e.clientX;
                    cy = e.clientY; }
                return { x: cx - rect.left, y: cy - rect.top };
            }

            function onMove(e) { const c = getCoords(e);
                mouseX = c.x;
                mouseY = c.y; }

            function onDown(e) {
                e.preventDefault();
                ensureAudio();
                const c = getCoords(e);
                mouseX = c.x;
                mouseY = c.y;
                themeIndex = (themeIndex + 1) % COLOR_THEMES.length;
                app.renderer.backgroundColor = COLOR_THEMES[themeIndex].bg;
                breathEnergy = 1.0;
                playBreathSound();
            }

            function onLeave() { mouseX = window.innerWidth / 2;
                mouseY = window.innerHeight / 2; }

            app.view.addEventListener('mousemove', onMove);
            app.view.addEventListener('mousedown', onDown);
            document.addEventListener('mouseleave', onLeave);
            app.view.addEventListener('touchmove', onMove, { passive: true });
            app.view.addEventListener('touchstart', onDown, { passive: false });

            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    ensureAudio();
                    themeIndex = (themeIndex + 1) % COLOR_THEMES.length;
                    app.renderer.backgroundColor = COLOR_THEMES[themeIndex].bg;
                    breathEnergy = 1.0;
                    playBreathSound();
                }
            });

            function handleResize() {
                app.renderer.resize(window.innerWidth, window.innerHeight);
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => setTimeout(handleResize, 300));

            // ─── 启动 ───
            initParticles();
            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
            smoothMX = mouseX;
            smoothMY = mouseY;
            setTimeout(() => {
                if (hintEl) {
                    hintEl.style.opacity = '0';
                    setTimeout(() => { if (hintEl) hintEl.style.display = 'none'; }, 1600);
                }
            }, 3200);
            handleResize();
            console.log('✨ 黄金线条舞蹈已启动 — 粒子数:', sprites.length);
        })();
    </script>
</body>
</html>
