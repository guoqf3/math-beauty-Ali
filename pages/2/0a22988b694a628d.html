<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>弹簧谐振子 · 简谐运动 SHM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #06181f 0%, #02070b 60%, #000306 100%);
    font-family: "SF Mono", "JetBrains Mono", Consolas, Menlo, monospace;
    color: #8ffbe0;
    user-select: none;
  }
  canvas { display: block; }

  #scene { position: fixed; inset: 0; }

  /* ---------- 标题 ---------- */
  .hud-title {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 10;
  }
  .hud-title h1 {
    font-size: 15px; letter-spacing: 8px; font-weight: 400;
    color: #8ffbe0; text-shadow: 0 0 20px rgba(0, 255, 200, .85), 0 0 60px rgba(0, 255, 200, .3);
  }
  .hud-title p {
    font-size: 10px; letter-spacing: 4px; margin-top: 8px;
    color: rgba(120, 255, 220, .42);
  }

  /* ---------- 通用面板 ---------- */
  .panel {
    position: fixed; z-index: 10;
    background: linear-gradient(135deg, rgba(0, 45, 56, .55), rgba(0, 18, 26, .35));
    border: 1px solid rgba(0, 255, 200, .18);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 14px 18px;
    box-shadow: 0 0 34px rgba(0, 255, 200, .07), inset 0 0 34px rgba(0, 255, 200, .035);
  }
  .cap {
    font-size: 10px; letter-spacing: 3px; margin-bottom: 10px;
    color: rgba(120, 255, 220, .45);
  }

  /* ---------- 公式 ---------- */
  #formulas { top: 108px; left: 28px; }
  #formulas .eq {
    font-size: 14px; line-height: 2.05; letter-spacing: .5px;
    color: #a7ffe8; text-shadow: 0 0 12px rgba(0, 255, 200, .55);
    white-space: nowrap;
  }
  #formulas .eq em { font-style: normal; color: #00ffcc; }
  #formulas .eq .dim { color: rgba(120, 255, 220, .5); }

  /* ---------- 读数 ---------- */
  #readout { bottom: 28px; left: 28px; min-width: 250px; }
  #readout .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; line-height: 2; color: rgba(140, 255, 225, .7);
  }
  #readout .row b {
    font-weight: 500; color: #00ffcc; text-shadow: 0 0 12px rgba(0, 255, 200, .7);
    font-variant-numeric: tabular-nums;
  }
  .ebar {
    position: relative; height: 5px; border-radius: 3px;
    background: rgba(0, 255, 200, .09); overflow: hidden; margin-top: 6px;
  }
  .ebar i {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    border-radius: 3px; transition: width .05s linear;
  }
  #ekFill { background: linear-gradient(90deg, #00ffcc, #4dfff0); box-shadow: 0 0 12px #00ffcc; }
  #epFill { background: linear-gradient(90deg, #0aa8ff, #7f6bff); box-shadow: 0 0 12px #3aa8ff; }
  .elabel { font-size: 9px; letter-spacing: 2px; color: rgba(120,255,220,.35); margin-top: 5px; }

  /* ---------- 曲线图 ---------- */
  #graphWrap {
    position: fixed; right: 28px; bottom: 28px; z-index: 10;
    width: min(470px, 40vw); height: 252px;
    background: linear-gradient(135deg, rgba(0, 45, 56, .5), rgba(0, 16, 24, .38));
    border: 1px solid rgba(0, 255, 200, .18);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 34px rgba(0, 255, 200, .07), inset 0 0 34px rgba(0, 255, 200, .035);
    overflow: hidden;
  }
  #graphWrap .cap {
    position: absolute; top: 10px; left: 14px; margin: 0; z-index: 2;
  }
  #graph { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- 音频按钮 ---------- */
  #soundBtn {
    position: fixed; top: 26px; right: 28px; z-index: 20;
    padding: 9px 18px; font-size: 11px; letter-spacing: 2px;
    font-family: inherit; color: #00ffcc; cursor: pointer;
    background: linear-gradient(135deg, rgba(0, 60, 70, .6), rgba(0, 25, 35, .5));
    border: 1px solid rgba(0, 255, 200, .3);
    border-radius: 8px;
    backdrop-filter: blur(8px);
    transition: all .25s;
    box-shadow: 0 0 18px rgba(0, 255, 200, .12);
  }
  #soundBtn:hover {
    background: linear-gradient(135deg, rgba(0, 90, 100, .75), rgba(0, 40, 55, .6));
    box-shadow: 0 0 28px rgba(0, 255, 200, .35);
    transform: translateY(-1px);
  }
  #soundBtn:active { transform: translateY(0); }

  @media (max-width: 900px) {
    #graphWrap { width: 60vw; height: 180px; }
    #formulas .eq { font-size: 11px; }
    #readout { min-width: 190px; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="scene"></div>

<div class="hud-title">
  <h1>弹 簧 谐 振 子</h1>
  <p>SIMPLE HARMONIC MOTION</p>
</div>

<button id="soundBtn">🔈 开启音效</button>

<div id="formulas" class="panel">
  <div class="cap">MATHEMATICAL MODEL</div>
  <div class="eq">x(t) = <em>A</em>·cos(ωt + φ)</div>
  <div class="eq">ω = √(k / m)</div>
  <div class="eq">E = ½kA² = ½mv² + ½kx²</div>
  <div class="eq"><span class="dim">F = −kx  （回复力）</span></div>
</div>

<div id="readout" class="panel">
  <div class="cap">REAL-TIME DATA</div>
  <div class="row"><span>位移 x</span><b id="vx">0.00</b></div>
  <div class="row"><span>速度 v</span><b id="vv">0.00</b></div>
  <div class="row"><span>动能 Ek</span><b id="vk">0.00</b></div>
  <div class="row"><span>势能 Ep</span><b id="vp">0.00</b></div>
  <div class="row"><span>总能量 E</span><b id="ve">0.00</b></div>
  <div class="ebar"><i id="ekFill"></i></div>
  <div class="ebar"><i id="epFill"></i></div>
  <div class="elabel">动能 ↑ ／ 势能 ↓</div>
</div>

<div id="graphWrap">
  <div class="cap">x – t 位移时间曲线</div>
  <canvas id="graph"></canvas>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   物理参数
   ============================================================ */
const A       = 3.0;    // 振幅
const OMEGA   = 2.0;    // 角频率 ω = √(k/m)
const MASS    = 1.0;
const K       = MASS * OMEGA * OMEGA;  // k = mω² = 4
const WALL_X  = -6.2;   // 弹簧固定端
const BALL_R  = 0.42;
const PHI     = 0;      // 初相

let simTime = 0;

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const container = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030a0f, 0.014);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(-2.0, 2.6, 21);
camera.lookAt(-2.0, 0, 0);

/* ============================================================
   光照
   ============================================================ */
scene.add(new THREE.AmbientLight(0x0a3040, 2.2));

const keyLight = new THREE.PointLight(0x00ffcc, 220, 60);
keyLight.position.set(4, 8, 10);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x1a66ff, 140, 60);
fillLight.position.set(-12, -6, 8);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0x00ffaa, 90, 60);
rimLight.position.set(-4, 2, -10);
scene.add(rimLight);

/* ============================================================
   背景粒子（青绿色谐振粒子）
   ============================================================ */
const P_COUNT = 1100;
const pPositions = new Float32Array(P_COUNT * 3);
const pVelocity  = new Float32Array(P_COUNT * 3);

const P_BOUND = { x: 30, y: 18, z: 26 };

for (let i = 0; i < P_COUNT; i++) {
  pPositions[i * 3]     = (Math.random() - 0.5) * P_BOUND.x * 2;
  pPositions[i * 3 + 1] = (Math.random() - 0.5) * P_BOUND.y * 2;
  pPositions[i * 3 + 2] = (Math.random() - 0.5) * P_BOUND.z * 2 - 6;
  pVelocity[i * 3]     = (Math.random() - 0.5) * 0.22;
  pVelocity[i * 3 + 1] = (Math.random() - 0.5) * 0.22;
  pVelocity[i * 3 + 2] = (Math.random() - 0.5) * 0.22;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

const particleMat = new THREE.PointsMaterial({
  color: 0x00ffcc,
  size: 0.13,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.62,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

/* ============================================================
   弹簧（可变长度螺旋管）
   ============================================================ */
const COILS     = 13;    // 圈数
const SEGS      = 300;   // 沿弹簧采样段数
const RADIAL    = 7;     // 管截面分段
const TUBE_R    = 0.062; // 管半径
const COIL_R    = 0.52;  // 螺旋半径

const springGeo = new THREE.BufferGeometry();
springGeo.setAttribute(
  'position',
  new THREE.BufferAttribute(new Float32Array(SEGS * RADIAL * 3), 3)
);

// 索引
{
  const idx = [];
  for (let i = 0; i < SEGS - 1; i++) {
    for (let j = 0; j < RADIAL; j++) {
      const jn = (j + 1) % RADIAL;
      const a = i * RADIAL + j;
      const b = i * RADIAL + jn;
      const c = (i + 1) * RADIAL + j;
      const d = (i + 1) * RADIAL + jn;
      idx.push(a, c, b, b, c, d);
    }
  }
  springGeo.setIndex(idx);
}

const springMat = new THREE.MeshStandardMaterial({
  color: 0x0d4f5c,
  emissive: 0x00e6b8,
  emissiveIntensity: 0.42,
  metalness: 0.85,
  roughness: 0.28,
  side: THREE.DoubleSide
});

const springMesh = new THREE.Mesh(springGeo, springMat);
scene.add(springMesh);

/* 弹簧更新函数 —— 弹性伸缩 + 压缩时线圈略微膨胀 */
function updateSpring(ballX) {
  const x0 = WALL_X;
  const L  = Math.max(0.6, ballX - x0);

  const compress = Math.max(0, (6.2 - L) / 6.2);
  const R  = COIL_R * (1 + 0.16 * compress);
  const TR = TUBE_R * (1 + 0.10 * compress);

  const k  = 2 * Math.PI * COILS;
  const TAU = Math.PI * 2;
  const arr = springGeo.attributes.position.array;

  for (let i = 0; i < SEGS; i++) {
    const u  = i / (SEGS - 1);
    const px = x0 + u * L;
    const py = R * Math.sin(k * u);
    const pz = R * Math.cos(k * u);

    // 切向量
    let tx = L;
    let ty = R * k * Math.cos(k * u);
    let tz = -R * k * Math.sin(k * u);
    const tl = Math.hypot(tx, ty, tz) || 1;
    tx /= tl; ty /= tl; tz /= tl;

    // N1 = T × Z
    let n1x =  ty, n1y = -tx, n1z = 0;
    const n1l = Math.hypot(n1x, n1y, n1z) || 1;
    n1x /= n1l; n1y /= n1l; n1z /= n1l;

    // N2 = T × N1
    const n2x = ty * n1z - tz * n1y;
    const n2y = tz * n1x - tx * n1z;
    const n2z = tx * n1y - ty * n1x;

    for (let j = 0; j < RADIAL; j++) {
      const ang = (j / RADIAL) * TAU;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const o = (i * RADIAL + j) * 3;
      arr[o]     = px + TR * (ca * n1x + sa * n2x);
      arr[o + 1] = py + TR * (ca * n1y + sa * n2y);
      arr[o + 2] = pz + TR * (ca * n1z + sa * n2z);
    }
  }

  springGeo.attributes.position.needsUpdate = true;
  springGeo.computeVertexNormals();
  springGeo.computeBoundingSphere();
}

/* ============================================================
   墙面
   ============================================================ */
const wallGeo = new THREE.BoxGeometry(0.45, 4.6, 1.4);
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x08222b,
  emissive: 0x0a5f5a,
  emissiveIntensity: 0.35,
  metalness: 0.9,
  roughness: 0.35
});
const wall = new THREE.Mesh(wallGeo, wallMat);
wall.position.set(WALL_X - 0.22, 0, 0);
scene.add(wall);

// 墙面发光边线
const wallEdgeGeo = new THREE.EdgesGeometry(wallGeo);
const wallEdge = new THREE.LineSegments(
  wallEdgeGeo,
  new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.55 })
);
wallEdge.position.copy(wall.position);
scene.add(wallEdge);

/* ============================================================
   小球 + 光晕
   ============================================================ */
const ballMat = new THREE.MeshStandardMaterial({
  color: 0x00ffcc,
  emissive: 0x00ffcc,
  emissiveIntensity: 1.6,
  metalness: 0.5,
  roughness: 0.2
});
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 40, 40), ballMat);
ball.position.set(A, 0, 0);
scene.add(ball);

// 光晕贴图
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.00, 'rgba(0,255,210,1)');
  g.addColorStop(0.22, 'rgba(0,255,200,0.55)');
  g.addColorStop(0.55, 'rgba(0,220,190,0.14)');
  g.addColorStop(1.00, 'rgba(0,255,200,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glowTex = makeGlowTexture();

const ballGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex,
  color: 0x00ffcc,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
ballGlow.scale.set(3.4, 3.4, 1);
ball.add(ballGlow);

/* ============================================================
   参考圆（相位圆）—— 位于 XY 平面，圆心在平衡位置
   ============================================================ */
const circlePts = [];
for (let i = 0; i <= 160; i++) {
  const a = (i / 160) * Math.PI * 2;
  circlePts.push(new THREE.Vector3(A * Math.cos(a), A * Math.sin(a), 0));
}
const refCircle = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(circlePts),
  new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.34 })
);
scene.add(refCircle);

// 圆内的辅助十字轴
const crossPts = [
  new THREE.Vector3(-A, 0, 0), new THREE.Vector3(A, 0, 0),
  new THREE.Vector3(0, -A, 0), new THREE.Vector3(0, A, 0)
];
const crossGeo = new THREE.BufferGeometry().setFromPoints([
  crossPts[0], crossPts[1], crossPts[2], crossPts[3]
]);
const crossLine = new THREE.LineSegments(
  crossGeo,
  new THREE.LineBasicMaterial({ color: 0x0aa8ff, transparent: true, opacity: 0.22 })
);
scene.add(crossLine);

// 参考圆上的运动点
const refDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.15, 20, 20),
  new THREE.MeshBasicMaterial({ color: 0x7dfcff })
);
scene.add(refDot);

const refDotGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0x7dfcff, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
refDotGlow.scale.set(1.7, 1.7, 1);
refDot.add(refDotGlow);

// 半径线（圆心 → 圆上点）
function makeDynLine(color, opacity) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  return new THREE.Line(g, new THREE.LineBasicMaterial({
    color, transparent: true, opacity
  }));
}
const radiusLine = makeDynLine(0x00ffcc, 0.45);
scene.add(radiusLine);

const projectLine = makeDynLine(0x7dfcff, 0.7);
scene.add(projectLine);

function setLine(line, x1, y1, z1, x2, y2, z2) {
  const a = line.geometry.attributes.position.array;
  a[0] = x1; a[1] = y1; a[2] = z1;
  a[3] = x2; a[4] = y2; a[5] = z2;
  line.geometry.attributes.position.needsUpdate = true;
  line.geometry.computeBoundingSphere();
}

/* ============================================================
   位移-时间曲线（2D Canvas）
   ============================================================ */
const graphCanvas = document.getElementById('graph');
const gctx = graphCanvas.getContext('2d');
let gW = 0, gH = 0;

function resizeGraph() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  const rect = graphCanvas.getBoundingClientRect();
  gW = rect.width;
  gH = rect.height;
  graphCanvas.width  = Math.max(1, Math.floor(gW * dpr));
  graphCanvas.height = Math.max(1, Math.floor(gH * dpr));
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const TIME_WINDOW = 7.0;   // 显示最近 7 秒
const samples = [];

function drawGraph(tNow) {
  if (gW <= 0 || gH <= 0) return;

  gctx.clearRect(0, 0, gW, gH);

  const padL = 40, padR = 16, padT = 34, padB = 24;
  const plotW = gW - padL - padR;
  const plotH = gH - padT - padB;
  if (plotW <= 0 || plotH <= 0) return;

  const tMin = tNow - TIME_WINDOW;
  const tMax = tNow;

  const tToPx = (tt) => padL + ((tt - tMin) / (tMax - tMin)) * plotW;
  const vToPy = (v)  => padT + (1 - (v + A) / (2 * A)) * plotH;

  // 网格
  gctx.lineWidth = 1;
  gctx.strokeStyle = 'rgba(0,255,200,0.075)';
  for (let i = 0; i <= 4; i++) {
    const y = padT + (i * plotH) / 4;
    gctx.beginPath(); gctx.moveTo(padL, y); gctx.lineTo(padL + plotW, y); gctx.stroke();
  }
  for (let i = 0; i <= 6; i++) {
    const x = padL + (i * plotW) / 6;
    gctx.beginPath(); gctx.moveTo(x, padT); gctx.lineTo(x, padT + plotH); gctx.stroke();
  }

  // 坐标轴
  const y0 = vToPy(0);
  gctx.strokeStyle = 'rgba(0,255,200,0.32)';
  gctx.beginPath(); gctx.moveTo(padL, y0); gctx.lineTo(padL + plotW, y0); gctx.stroke();
  gctx.beginPath(); gctx.moveTo(padL, padT); gctx.lineTo(padL, padT + plotH); gctx.stroke();

  // 振幅参考线
  gctx.setLineDash([4, 5]);
  gctx.strokeStyle = 'rgba(0,255,200,0.14)';
  [A, -A].forEach(v => {
    const y = vToPy(v);
    gctx.beginPath(); gctx.moveTo(padL, y); gctx.lineTo(padL + plotW, y); gctx.stroke();
  });
  gctx.setLineDash([]);

  // 曲线
  if (samples.length > 1) {
    // 辉光层
    gctx.beginPath();
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      const px = tToPx(s.t), py = vToPy(s.x);
      if (i === 0) gctx.moveTo(px, py); else gctx.lineTo(px, py);
    }
    gctx.strokeStyle = 'rgba(0,255,200,0.28)';
    gctx.lineWidth = 6;
    gctx.shadowColor = '#00ffcc';
    gctx.shadowBlur = 18;
    gctx.stroke();

    // 主曲线
    gctx.beginPath();
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      const px = tToPx(s.t), py = vToPy(s.x);
      if (i === 0) gctx.moveTo(px, py); else gctx.lineTo(px, py);
    }
    gctx.strokeStyle = '#00ffcc';
    gctx.lineWidth = 2;
    gctx.shadowColor = '#00ffcc';
    gctx.shadowBlur = 10;
    gctx.stroke();
    gctx.shadowBlur = 0;
  }

  // 当前点
  if (samples.length > 0) {
    const last = samples[samples.length - 1];
    const px = tToPx(last.t);
    const py = vToPy(last.x);

    gctx.setLineDash([3, 4]);
    gctx.strokeStyle = 'rgba(125,252,255,0.45)';
    gctx.lineWidth = 1;
    gctx.beginPath(); gctx.moveTo(px, py); gctx.lineTo(px, padT + plotH); gctx.stroke();
    gctx.beginPath(); gctx.moveTo(px, py); gctx.lineTo(padL, py); gctx.stroke();
    gctx.setLineDash([]);

    gctx.beginPath();
    gctx.arc(px, py, 4.5, 0, Math.PI * 2);
    gctx.fillStyle = '#7dfcff';
    gctx.shadowColor = '#7dfcff';
    gctx.shadowBlur = 16;
    gctx.fill();
    gctx.shadowBlur = 0;
  }

  // 轴标签
  gctx.fillStyle = 'rgba(120,255,220,0.45)';
  gctx.font = '10px "SF Mono", Consolas, monospace';
  gctx.fillText('+A', padL - 30, vToPy(A) + 3);
  gctx.fillText(' 0', padL - 30, y0 + 3);
  gctx.fillText('−A', padL - 30, vToPy(-A) + 3);
  gctx.fillText('t', padL + plotW - 8, padT + plotH + 16);
  gctx.fillText('x', padL - 8, padT - 10);
}

/* ============================================================
   UI 更新
   ============================================================ */
const elX = document.getElementById('vx');
const elV = document.getElementById('vv');
const elK = document.getElementById('vk');
const elP = document.getElementById('vp');
const elE = document.getElementById('ve');
const elKFill = document.getElementById('ekFill');
const elPFill = document.getElementById('epFill');

function updateReadout(x, v) {
  const Ek = 0.5 * MASS * v * v;
  const Ep = 0.5 * K * x * x;
  const E  = Ek + Ep;

  elX.textContent = x.toFixed(3);
  elV.textContent = v.toFixed(3);
  elK.textContent = Ek.toFixed(2);
  elP.textContent = Ep.toFixed(2);
  elE.textContent = E.toFixed(2);

  const total = 0.5 * K * A * A;
  elKFill.style.width = Math.min(100, (Ek / total) * 100) + '%';
  elPFill.style.width = Math.min(100, (Ep / total) * 100) + '%';
}

/* ============================================================
   音频（科技感氛围音）
   ============================================================ */
let audioCtx = null;
let masterGain = null;
let shimmerOsc = null;
let shimmerGain = null;
let audioOn = false;

const soundBtn = document.getElementById('soundBtn');

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);

  // 空间回声
  const delay = audioCtx.createDelay(2.0);
  delay.delayTime.value = 0.42;
  const fbGain = audioCtx.createGain();
  fbGain.gain.value = 0.38;
  const wetGain = audioCtx.createGain();
  wetGain.gain.value = 0.22;
  delay.connect(fbGain);
  fbGain.connect(delay);
  delay.connect(wetGain);
  wetGain.connect(masterGain);

  const bus = audioCtx.createGain();
  bus.gain.value = 1.0;
  bus.connect(masterGain);
  bus.connect(delay);

  // 低频 drone（A1 + E2 + A2）
  [55, 82.5, 110].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.value = [0.26, 0.13, 0.07][i];
    o.connect(g);
    g.connect(bus);
    o.start();
  });

  // Pad 和弦（A3 C#4 E4 G4）经低通滤波
  const padFilter = audioCtx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 720;
  padFilter.Q.value = 3.2;
  padFilter.connect(bus);

  [220, 261.63, 329.63, 392.0].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f;
    o.detune.value = (i - 1.5) * 7;
    const g = audioCtx.createGain();
    g.gain.value = 0.038;
    o.connect(g);
    g.connect(padFilter);
    o.start();
  });

  // 滤波器缓慢扫描 LFO
  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.07;
  const lfoAmt = audioCtx.createGain();
  lfoAmt.gain.value = 430;
  lfo.connect(lfoAmt);
  lfoAmt.connect(padFilter.frequency);
  lfo.start();

  // 跟随小球运动的微光振荡器
  shimmerOsc = audioCtx.createOscillator();
  shimmerOsc.type = 'sine';
  shimmerOsc.frequency.value = 880;
  shimmerGain = audioCtx.createGain();
  shimmerGain.gain.value = 0.0;
  shimmerOsc.connect(shimmerGain);
  shimmerGain.connect(bus);
  shimmerOsc.start();
}

soundBtn.addEventListener('click', () => {
  if (!audioCtx) {
    initAudio();
    audioOn = true;
    masterGain.gain.setTargetAtTime(0.34, audioCtx.currentTime, 0.6);
    soundBtn.textContent = '🔊 关闭音效';
  } else {
    audioOn = !audioOn;
    masterGain.gain.setTargetAtTime(audioOn ? 0.34 : 0.0, audioCtx.currentTime, 0.3);
    soundBtn.textContent = audioOn ? '🔊 关闭音效' : '🔈 开启音效';
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
});

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let sampleAccum = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  /* ---- 物理量 ---- */
  const theta = OMEGA * simTime + PHI;
  const ballX = A * Math.cos(theta);
  const ballV = -A * OMEGA * Math.sin(theta);

  /* ---- 小球 & 弹簧 ---- */
  ball.position.x = ballX;
  updateSpring(ballX);

  /* ---- 参考圆相位 ---- */
  const rx = A * Math.cos(theta);
  const ry = A * Math.sin(theta);
  refDot.position.set(rx, ry, 0);

  setLine(radiusLine, 0, 0, 0, rx, ry, 0);
  setLine(projectLine, rx, ry, 0, rx, 0, 0);

  /* ---- 曲线采样 ---- */
  sampleAccum += dt;
  if (sampleAccum >= 1 / 90) {
    sampleAccum = 0;
    samples.push({ t: simTime, x: ballX });
    while (samples.length > 0 && samples[0].t < simTime - TIME_WINDOW - 0.6) {
      samples.shift();
    }
  }
  drawGraph(simTime);

  /* ---- UI ---- */
  updateReadout(ballX, ballV);

  /* ---- 粒子漂移 ---- */
  const parr = particleGeo.attributes.position.array;
  for (let i = 0; i < P_COUNT; i++) {
    const o = i * 3;
    parr[o]     += pVelocity[o]     * dt * 6;
    parr[o + 1] += pVelocity[o + 1] * dt * 6;
    parr[o + 2] += pVelocity[o + 2] * dt * 6;

    if (parr[o] >  P_BOUND.x) parr[o] = -P_BOUND.x;
    if (parr[o] < -P_BOUND.x) parr[o] =  P_BOUND.x;
    if (parr[o + 1] >  P_BOUND.y) parr[o + 1] = -P_BOUND.y;
    if (parr[o + 1] < -P_BOUND.y) parr[o + 1] =  P_BOUND.y;
    if (parr[o + 2] >  P_BOUND.z - 6) parr[o + 2] = -P_BOUND.z - 6;
    if (parr[o + 2] < -P_BOUND.z - 6) parr[o + 2] =  P_BOUND.z - 6;
  }
  particleGeo.attributes.position.needsUpdate = true;

  // 粒子整体缓慢自转
  particles.rotation.y += dt * 0.008;

  /* ---- 灯光跟随小球 ---- */
  keyLight.position.x = ballX + 2;
  keyLight.position.y = 6 + Math.sin(simTime * 0.7) * 2;

  /* ---- 小球脉动发光 ---- */
  const speedNorm = Math.abs(Math.sin(theta));
  ballMat.emissiveIntensity = 1.1 + speedNorm * 1.4;
  ballGlow.scale.setScalar(3.0 + speedNorm * 1.6);

  /* ---- 音频联动 ---- */
  if (audioCtx && audioOn) {
    const now = audioCtx.currentTime;
    const norm = (ballX / A + 1) * 0.5;   // 0..1
    shimmerOsc.frequency.setTargetAtTime(392 + norm * 620, now, 0.06);
    shimmerGain.gain.setTargetAtTime(
      0.004 + speedNorm * 0.022,
      now,
      0.08
    );
  }

  renderer.render(scene, camera);
}

/* ============================================================
   尺寸自适应
   ============================================================ */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);

  resizeGraph();
}

window.addEventListener('resize', onResize);

/* ============================================================
   启动
   ============================================================ */
resizeGraph();
updateSpring(A);
animate();
</script>
