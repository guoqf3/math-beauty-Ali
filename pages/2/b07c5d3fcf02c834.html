<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM · 几何光棱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0812;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 26px;
            left: 32px;
            z-index: 2;
            text-align: left;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.8s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.95;
        }

        .title {
            color: rgba(230, 220, 255, 0.8);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.7em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(170, 140, 240, 0.6);
        }

        .hint {
            color: rgba(190, 180, 220, 0.5);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
                left: 18px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.5em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.3em;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <div class="title">Prism</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            // ─── 画布初始化 ───────────────────────────────────────────────
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let triangles = [];
            let ripples = [];
            let mouse = { x: -9999, y: -9999, px: -9999, py: -9999, active: false };
            let time = 0;
            let colorShift = 0; // 全局色相偏移
            let globalRotation = 0; // 全局旋转影响

            // ─── 性能自适应 ───────────────────────────────────────────────
            const TRIANGLE_COUNT = () => Math.max(35, Math.min(80, Math.floor((W * H) / 18000)));

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                // 填充深色背景，避免白屏
                ctx.fillStyle = '#0b0812';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 几何三角形类 ─────────────────────────────────────────────
            class PrismTriangle {
                constructor() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.size = 8 + Math.random() * 25; // 边长范围
                    this.angle = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.hue = Math.random() * 360;
                    this.saturation = 70 + Math.random() * 25;
                    this.lightness = 55 + Math.random() * 20;
                    this.alpha = 0.25 + Math.random() * 0.35;
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.01 + Math.random() * 0.03;
                }

                update(dt, mouse, time) {
                    // 移动
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 旋转
                    this.angle += this.rotationSpeed * dt;
                    this.rotationSpeed += (Math.random() - 0.5) * 0.0005;
                    if (Math.abs(this.rotationSpeed) > 0.03) {
                        this.rotationSpeed *= 0.98;
                    }

                    // 鼠标吸引力（温和）
                    if (mouse.active) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const radius = 160;
                        if (dist < radius && dist > 0.1) {
                            const force = (1 - dist / radius) * 0.6 * dt;
                            const normX = dx / dist;
                            const normY = dy / dist;
                            this.vx += normX * force;
                            this.vy += normY * force;
                        }
                    }

                    // 波纹冲击
                    for (let i = ripples.length - 1; i >= 0; i--) {
                        const r = ripples[i];
                        const dx = this.x - r.x;
                        const dy = this.y - r.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const bandWidth = 60;
                        if (dist > r.radius - bandWidth && dist < r.radius + bandWidth) {
                            const force = r.strength * (1 - Math.abs(dist - r.radius) / bandWidth) * 1.2 * dt;
                            const normX = dx / (dist || 1);
                            const normY = dy / (dist || 1);
                            this.vx += normX * force;
                            this.vy += normY * force;
                        }
                    }

                    // 阻尼
                    this.vx *= 0.99;
                    this.vy *= 0.99;

                    // 边界环绕
                    if (this.x < -30) this.x = W + 30;
                    if (this.x > W + 30) this.x = -30;
                    if (this.y < -30) this.y = H + 30;
                    if (this.y > H + 30) this.y = -30;

                    // 颜色微调
                    this.hue += dt * 0.05;
                    if (this.hue > 360) this.hue -= 360;

                    // 脉动
                    this.pulsePhase += this.pulseSpeed * dt;
                }

                draw(ctx, time) {
                    const pulse = 1 + Math.sin(this.pulsePhase) * 0.15;
                    const currentSize = this.size * pulse;
                    const half = currentSize / 2;
                    const r = half / Math.sqrt(3); // 外接圆半径

                    const angle = this.angle;
                    // 三角形顶点（等边三角形）
                    const p1x = this.x + Math.cos(angle) * r;
                    const p1y = this.y + Math.sin(angle) * r;
                    const p2x = this.x + Math.cos(angle + 2.094) * r;
                    const p2y = this.y + Math.sin(angle + 2.094) * r;
                    const p3x = this.x + Math.cos(angle + 4.188) * r;
                    const p3y = this.y + Math.sin(angle + 4.188) * r;

                    const hue = (this.hue + colorShift + Math.sin(time * 0.5 + this.x * 0.005) * 15) % 360;
                    const alpha = this.alpha * (0.7 + 0.3 * Math.sin(this.pulsePhase));

                    // 填充三角形
                    ctx.fillStyle = `hsla(${hue}, ${this.saturation}%, ${this.lightness}%, ${alpha})`;
                    ctx.beginPath();
                    ctx.moveTo(p1x, p1y);
                    ctx.lineTo(p2x, p2y);
                    ctx.lineTo(p3x, p3y);
                    ctx.closePath();
                    ctx.fill();

                    // 描边（细微，增加光泽）
                    ctx.strokeStyle = `hsla(${hue}, ${this.saturation}%, ${Math.min(90, this.lightness + 20)}%, ${alpha * 0.5})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }

            // ─── 初始化三角形 ─────────────────────────────────────────────
            function initTriangles() {
                const count = TRIANGLE_COUNT();
                triangles = [];
                for (let i = 0; i < count; i++) {
                    triangles.push(new PrismTriangle());
                }
            }

            // ─── 波纹系统 ───────────────────────────────────────────────
            function createRipple(x, y) {
                ripples.push({
                    x: x,
                    y: y,
                    radius: 5,
                    maxRadius: Math.max(W, H) * 0.35,
                    strength: 2.2,
                    life: 1.0,
                    decay: 0.018 + Math.random() * 0.008,
                    growth: 6 + Math.random() * 3,
                    hue: colorShift + Math.random() * 60,
                });
                if (ripples.length > 6) ripples.shift();
            }

            function updateRipples(dt) {
                for (let i = ripples.length - 1; i >= 0; i--) {
                    const r = ripples[i];
                    r.radius += r.growth * dt;
                    r.life -= r.decay * dt;
                    r.strength *= 0.985;
                    if (r.life <= 0 || r.radius > r.maxRadius || r.strength < 0.01) {
                        ripples.splice(i, 1);
                    }
                }
            }

            function drawRipples(ctx) {
                for (const r of ripples) {
                    const alpha = r.life * 0.2;
                    ctx.strokeStyle = `hsla(${r.hue}, 80%, 75%, ${alpha})`;
                    ctx.lineWidth = 1.2 + r.life * 1.5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 60;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${230 + colorShift}, 70%, 75%, 0.06)`);
                gradient.addColorStop(0.7, `hsla(${230 + colorShift}, 60%, 65%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.01;
                    updateRipples(fixedStep / 1000 * 60);
                    for (const tri of triangles) {
                        tri.update(1, mouse, time);
                    }
                }

                // 使用“lighter”混合模式增强光感
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(11, 8, 18, 0.08)';
                ctx.fillRect(0, 0, W, H);

                // 切换为叠加混合，让三角形重叠时发光
                ctx.globalCompositeOperation = 'lighter';

                // 绘制三角形
                for (const tri of triangles) {
                    tri.draw(ctx, time);
                }

                // 绘制波纹
                drawRipples(ctx);

                // 恢复正常混合模式绘制光晕
                ctx.globalCompositeOperation = 'source-over';
                drawCursorGlow(ctx);

                // 恢复默认（避免影响下一帧清屏）
                ctx.globalCompositeOperation = 'source-over';

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.px = mouse.x;
                mouse.py = mouse.y;
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createRipple(mouse.x, mouse.y);
                // 改变全局色相
                colorShift += 30 + Math.random() * 40;
                if (colorShift > 150) colorShift = -50;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.px = mouse.x;
                    mouse.py = mouse.y;
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createRipple(mouse.x, mouse.y);
                    colorShift += 30 + Math.random() * 40;
                    if (colorShift > 150) colorShift = -50;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                const oldW = W;
                const oldH = H;
                setupCanvas();
                const scaleX = W / oldW;
                const scaleY = H / oldH;
                for (const tri of triangles) {
                    tri.x *= scaleX;
                    tri.y *= scaleY;
                }
                const targetCount = TRIANGLE_COUNT();
                if (targetCount !== triangles.length) {
                    while (triangles.length < targetCount) {
                        triangles.push(new PrismTriangle());
                    }
                    if (triangles.length > targetCount) {
                        triangles.length = targetCount;
                    }
                }
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initTriangles();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0b0812';
                    ctx.fillRect(0, 0, W, H);
                }
            });

        })();
    </script>
</body>
</html>
