<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行波传播 · Traveling Wave</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#02030a;
    font-family:'SF Mono','Consolas','Courier New','PingFang SC','Microsoft YaHei',monospace;
    color:#cfe8ff;-webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1}

  .vignette{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%,transparent 28%,rgba(0,0,0,.5) 70%,rgba(0,0,0,.92) 100%);
  }

  /* ---------- 标题区 ---------- */
  .hud{
    position:fixed;top:36px;left:44px;z-index:10;pointer-events:none;
    text-shadow:0 0 14px rgba(0,170,255,.6);
    animation:fadeIn 1.8s ease both;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

  .tag{
    display:inline-block;font-size:11px;letter-spacing:5px;color:#4ad6ff;
    padding:3px 12px;border:1px solid rgba(60,190,255,.35);border-radius:3px;
    background:linear-gradient(90deg,rgba(0,120,200,.22),rgba(0,120,200,.02));
    box-shadow:0 0 20px rgba(0,140,255,.25) inset;
  }
  .hud h1{
    margin:16px 0 6px;font-size:clamp(24px,3.4vw,40px);font-weight:700;letter-spacing:8px;
    background:linear-gradient(100deg,#3ae9ff 0%,#8b7bff 34%,#ff61d8 66%,#ffd166 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(80,180,255,.55));
  }
  .en{font-size:10.5px;letter-spacing:3.6px;color:#4d7ba3;margin-bottom:22px}

  .formula{
    display:inline-block;font-size:16px;letter-spacing:1.4px;color:#a9eeff;
    padding:11px 20px;border-left:2px solid #1ea7e0;margin-bottom:9px;
    background:linear-gradient(90deg,rgba(20,120,190,.22),rgba(20,120,190,0));
    box-shadow:-6px 0 26px -8px rgba(50,190,255,.8);
  }
  .formula .op{color:#ff79d6}
  .formula .num{color:#ffd166}
  .formula .fn{color:#7ef2ff}
  .formula sup{font-size:.68em}

  .info{
    font-size:12.5px;letter-spacing:1.6px;color:#6fb6e0;margin-top:14px;line-height:2;
  }
  .info b{color:#7ef2ff;font-weight:600}
  .info .dim{color:#4d7ba3;font-size:11px;letter-spacing:1.2px}

  /* ---------- 控制面板 ---------- */
  .panel{
    position:fixed;right:38px;bottom:36px;z-index:12;
    width:310px;padding:20px 22px 18px;
    background:linear-gradient(160deg,rgba(10,26,48,.84),rgba(6,14,28,.74));
    border:1px solid rgba(46,150,210,.35);border-radius:14px;
    backdrop-filter:blur(14px);
    box-shadow:0 0 44px rgba(0,110,200,.22),0 0 0 1px rgba(80,200,255,.06) inset;
    animation:fadeIn 2.2s ease both;
  }
  .panel h2{
    font-size:10.5px;letter-spacing:4px;color:#4d9dc8;font-weight:400;
    margin-bottom:16px;padding-bottom:9px;border-bottom:1px solid rgba(60,150,210,.2);
  }
  .row{margin-bottom:15px}
  .row .lab{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;letter-spacing:1.6px;color:#84b8d8;margin-bottom:7px;
  }
  .row .lab .val{color:#7ef2ff;font-size:12.5px;letter-spacing:.5px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
    background:linear-gradient(90deg,#1e8fd0,#5c3fd0);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#d6faff,#3ac4ff 60%,#1470c8);
    box-shadow:0 0 14px 2px rgba(70,200,255,.85);cursor:pointer;transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#d6faff,#3ac4ff 60%,#1470c8);
    box-shadow:0 0 14px 2px rgba(70,200,255,.85);cursor:pointer;
  }

  .btns{display:flex;gap:10px;margin-top:18px}
  .btn{
    flex:1;padding:9px 0;font-family:inherit;font-size:11.5px;letter-spacing:1.6px;
    color:#7fdcff;background:rgba(8,26,46,.7);border:1px solid rgba(46,150,210,.5);
    border-radius:8px;cursor:pointer;transition:all .25s;
  }
  .btn:hover{color:#eafcff;border-color:#4fd6ff;background:rgba(24,96,148,.5);
    box-shadow:0 0 22px rgba(70,200,255,.45)}
  .btn.on{
    color:#04141f;background:linear-gradient(100deg,#45e6ff,#7fa8ff);
    border-color:transparent;box-shadow:0 0 26px rgba(90,210,255,.7);
  }

  /* ---------- 底部状态 ---------- */
  .status{
    position:fixed;left:44px;bottom:38px;z-index:10;pointer-events:none;
    font-size:11.5px;letter-spacing:1.7px;color:#527d9e;
    text-shadow:0 0 12px rgba(0,150,255,.45);
    animation:fadeIn 2.6s ease both;
  }
  .status .k{color:#35e0ff}
  .status .v{color:#eaf8ff}
  .status div{margin-top:5px}

  @media(max-width:860px){
    .hud{top:20px;left:18px}
    .formula{font-size:12.5px;padding:8px 13px}
    .en{letter-spacing:2.4px;margin-bottom:14px}
    .panel{right:12px;bottom:12px;left:12px;width:auto;padding:16px 16px 14px}
    .status{display:none}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="hud">
  <div class="tag">物 理 现 象</div>
  <h1>行 波 传 播</h1>
  <div class="en">TRAVELING WAVE · ONE-DIMENSIONAL WAVE EQUATION</div>

  <div class="formula">
    ∂<sup>2</sup>u/∂t<sup>2</sup> <span class="op">=</span>
    <span class="num">c</span><sup>2</sup> · ∂<sup>2</sup>u/∂x<sup>2</sup>
  </div><br>

  <div class="formula">
    u(x,t) <span class="op">=</span>
    <span class="fn">f</span>(x <span class="op">−</span> ct)
    <span class="op">+</span>
    <span class="fn">g</span>(x <span class="op">+</span> ct)
  </div>

  <div class="info">
    振幅 A = <b id="aTxt">3.4</b> &nbsp;|&nbsp; 波速 c = <b id="cTxt">7.5</b><br>
    波长 λ = <b id="lTxt">6.98</b> &nbsp;|&nbsp; 频率 f = <b id="fTxt">1.07</b><br>
    <span class="dim">右行波 f(x−ct) 沿 +x 方向匀速传播 · 波形整体平移</span>
  </div>
</div>

<div class="status">
  <div>波数 k = <span class="k" id="kTxt">0.90</span> &nbsp;·&nbsp; 角频率 ω = <span class="v" id="wTxt">6.75</span></div>
  <div>相位速度 v<sub>p</sub> = ω/k = c</div>
  <div>波形不衰减 · 能量随波峰向前输运</div>
</div>

<div class="panel">
  <h2>参 数 控 制</h2>

  <div class="row">
    <div class="lab"><span>振幅 A</span><span class="val" id="aVal">3.4</span></div>
    <input type="range" id="aSlider" min="0.5" max="6.5" step="0.1" value="3.4">
  </div>

  <div class="row">
    <div class="lab"><span>波速 c</span><span class="val" id="cVal">7.5</span></div>
    <input type="range" id="cSlider" min="1" max="18" step="0.1" value="7.5">
  </div>

  <div class="btns">
    <button class="btn on" id="autoBtn">◉ 自动演化</button>
    <button class="btn" id="audioBtn">♪ 音效</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================================
   1. 常量与参数
   ========================================================= */
const X_MAX    = 19;          // 半宽度（波列总长 2*X_MAX）
const WAVE_N   = 1250;        // 主波面粒子数
const GHOST_N  = 5;           // 拖尾重影层数
const GHOST_TAU = [0.045, 0.095, 0.155, 0.230, 0.320];   // 时间滞后（秒）
const GHOST_OPA = [0.30, 0.215, 0.145, 0.095, 0.055];    // 透明度递减

const params = {
  A: 3.4,        // 振幅
  c: 7.5,        // 波速
  k: 0.90,       // 波数
  auto: true
};

/* =========================================================
   2. 渲染器 / 场景 / 相机
   ========================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.10;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x02030a, 0.0072);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 600);

/* =========================================================
   3. 背景辉光 + 星尘
   ========================================================= */
function radialTex(inner, mid, outer) {
  const s = 256, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0,    inner);
  g.addColorStop(0.45, mid);
  g.addColorStop(1,    outer);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
}

const bgGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radialTex('rgba(40,110,230,0.50)', 'rgba(30,70,180,0.10)', 'rgba(0,0,0,0)'),
  blending: THREE.AdditiveBlending,
  depthWrite: false, transparent: true, opacity: 0.52
}));
bgGlow.scale.set(240, 240, 1);
bgGlow.position.z = -100;
scene.add(bgGlow);

(function stars() {
  const COUNT = 1300;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const r  = 95 + Math.random() * 175;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.7;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    size: 0.85, color: 0x6fb4ff, transparent: true, opacity: 0.5,
    sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const p = new THREE.Points(g, m);
  p.name = 'stars';
  scene.add(p);
})();

/* ---- 底部参考网格（增强三维纵深感） ---- */
const grid = new THREE.GridHelper(64, 32, 0x1e5a90, 0x0c2540);
grid.position.y = -9.5;
grid.material.transparent = true;
grid.material.opacity = 0.28;
scene.add(grid);

/* =========================================================
   4. 光点贴图
   ========================================================= */
function dotTex() {
  const s = 64, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0,    'rgba(255,255,255,1)');
  g.addColorStop(0.20, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.50, 'rgba(255,255,255,0.22)');
  g.addColorStop(1,    'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const DOT = dotTex();

/* =========================================================
   5. 预计算粒子基准坐标
   ========================================================= */
const bX  = new Float32Array(WAVE_N);   // 沿传播方向
const bZ  = new Float32Array(WAVE_N);   // 波面厚度方向
const bJY = new Float32Array(WAVE_N);   // 微小竖向抖动

for (let i = 0; i < WAVE_N; i++) {
  bX[i]  = -X_MAX + (i / (WAVE_N - 1)) * 2 * X_MAX;
  bZ[i]  = (Math.random() - 0.5) * 4.4;
  bJY[i] = (Math.random() - 0.5) * 0.42;
}

/* =========================================================
   6. 主波面（彩虹流光粒子）
   ========================================================= */
const waveGeo = new THREE.BufferGeometry();
const wavePos = new Float32Array(WAVE_N * 3);
const waveCol = new Float32Array(WAVE_N * 3);

waveGeo.setAttribute('position', new THREE.BufferAttribute(wavePos, 3).setUsage(THREE.DynamicDrawUsage));
waveGeo.setAttribute('color',    new THREE.BufferAttribute(waveCol, 3).setUsage(THREE.DynamicDrawUsage));

const waveMat = new THREE.PointsMaterial({
  size: 0.58,
  map: DOT,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const wavePoints = new THREE.Points(waveGeo, waveMat);
wavePoints.frustumCulled = false;
scene.add(wavePoints);

/* ---- 主波面的光晕层（共享几何） ---- */
const haloMat = new THREE.PointsMaterial({
  size: 2.6,
  map: DOT,
  vertexColors: true,
  transparent: true,
  opacity: 0.075,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const halo = new THREE.Points(waveGeo, haloMat);
halo.frustumCulled = false;
scene.add(halo);

/* =========================================================
   7. 拖尾重影层（流光尾迹）
   每层用 (t − τ) 时刻的波形，自然落后于主波面 → 形成尾迹
   ========================================================= */
const ghosts = [];

for (let g = 0; g < GHOST_N; g++) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(WAVE_N * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));

  const mat = new THREE.PointsMaterial({
    size: 0.66 + g * 0.13,
    map: DOT,
    color: new THREE.Color().setHSL(0.55 - g * 0.028, 0.88, 0.56),
    transparent: true,
    opacity: GHOST_OPA[g],
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);

  ghosts.push({ geo, pos, mat, tau: GHOST_TAU[g] });
}

/* =========================================================
   8. 后期辉光
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.88,   // 强度
  0.78,   // 半径
  0.18    // 阈值
);
composer.addPass(bloom);

/* =========================================================
   9. 音频引擎
   ========================================================= */
let AC = null, masterGain = null, audioOn = false;

function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { return; }

  masterGain = AC.createGain();
  masterGain.gain.setValueAtTime(0.0001, AC.currentTime);
  masterGain.connect(AC.destination);

  /* --- 低频 drone --- */
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 340;
  lp.Q.value = 4.2;
  lp.connect(masterGain);

  [55, 82.5, 110, 165, 220].forEach((f, i) => {
    const o = AC.createOscillator();
    o.type = (i % 2 === 0) ? 'sine' : 'sawtooth';
    o.frequency.value = f;
    o.detune.value = (i - 2) * 6.5;
    const g = AC.createGain();
    g.gain.value = 0.082 / (i * 0.7 + 1);
    o.connect(g); g.connect(lp);
    o.start();
  });

  const lfo = AC.createOscillator();
  lfo.frequency.value = 0.052;
  const lg = AC.createGain();
  lg.gain.value = 200;
  lfo.connect(lg); lg.connect(lp.frequency);
  lfo.start();

  /* --- 带通噪声（流动感） --- */
  const len = Math.floor(AC.sampleRate * 5);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const dd = buf.getChannelData(0);
  for (let i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;

  const ns = AC.createBufferSource();
  ns.buffer = buf; ns.loop = true;

  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1250; bp.Q.value = 0.85;

  const ng = AC.createGain(); ng.gain.value = 0.030;

  ns.connect(bp); bp.connect(ng); ng.connect(masterGain);
  ns.start();

  const nLfo = AC.createOscillator();
  nLfo.frequency.value = 0.068;
  const nLg = AC.createGain(); nLg.gain.value = 820;
  nLfo.connect(nLg); nLg.connect(bp.frequency);
  nLfo.start();
}

/* --- 清脆脉冲音 --- */
function playBell(freq, vel) {
  if (!AC || !audioOn) return;
  const t0 = AC.currentTime;

  [[1, vel,         2.4],
   [2.006, vel*0.40, 1.8],
   [3.012, vel*0.16, 1.3]].forEach(([mult, amp, dur]) => {
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq * mult;

    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(amp, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.3);
  });
}

/* =========================================================
   10. UI 绑定
   ========================================================= */
const aSlider  = document.getElementById('aSlider');
const cSlider  = document.getElementById('cSlider');
const aVal     = document.getElementById('aVal');
const cVal     = document.getElementById('cVal');
const aTxt     = document.getElementById('aTxt');
const cTxt     = document.getElementById('cTxt');
const lTxt     = document.getElementById('lTxt');
const fTxt     = document.getElementById('fTxt');
const kTxt     = document.getElementById('kTxt');
const wTxt     = document.getElementById('wTxt');
const autoBtn  = document.getElementById('autoBtn');
const audioBtn = document.getElementById('audioBtn');

let uiDirty = true;

function updateReadouts() {
  const lambda = 2 * Math.PI / params.k;
  const omega  = params.c * params.k;
  const freq   = omega / (2 * Math.PI);

  aVal.textContent = params.A.toFixed(1);
  cVal.textContent = params.c.toFixed(1);
  aTxt.textContent = params.A.toFixed(1);
  cTxt.textContent = params.c.toFixed(1);
  lTxt.textContent = lambda.toFixed(2);
  fTxt.textContent = freq.toFixed(2);
  kTxt.textContent = params.k.toFixed(2);
  wTxt.textContent = omega.toFixed(2);
}

aSlider.addEventListener('input', () => {
  params.A = parseFloat(aSlider.value);
  params.auto = false;
  autoBtn.classList.remove('on');
  autoBtn.textContent = '◌ 自动演化';
  updateReadouts();
});

cSlider.addEventListener('input', () => {
  params.c = parseFloat(cSlider.value);
  params.auto = false;
  autoBtn.classList.remove('on');
  autoBtn.textContent = '◌ 自动演化';
  updateReadouts();
});

autoBtn.addEventListener('click', () => {
  params.auto = !params.auto;
  autoBtn.classList.toggle('on', params.auto);
  autoBtn.textContent = params.auto ? '◉ 自动演化' : '◌ 自动演化';
});

audioBtn.addEventListener('click', () => {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  audioOn = !audioOn;
  audioBtn.classList.toggle('on', audioOn);
  audioBtn.textContent = audioOn ? '♪ 音效开' : '♪ 音效';

  if (masterGain && AC) {
    masterGain.gain.cancelScheduledValues(AC.currentTime);
    masterGain.gain.setTargetAtTime(audioOn ? 0.5 : 0.0, AC.currentTime, 0.4);
  }
});

/* =========================================================
   11. 相机自适应取景
   ========================================================= */
function fitCamera() {
  const vFov = camera.fov * Math.PI / 180;
  const needW = X_MAX * 2 + 9;
  const needH = params.A * 2 + 16;

  const dV = (needH / 2) / Math.tan(vFov / 2);
  const dH = (needW / 2) / (Math.tan(vFov / 2) * camera.aspect);
  return Math.max(dV, dH, 24);
}

let camDist = fitCamera();

/* =========================================================
   12. 动画循环
   ========================================================= */
const clock   = new THREE.Clock();
const tmpC    = new THREE.Color();
const stars   = scene.getObjectByName('stars');

let elapsed = 0;
let nextBell = 2.5;

// 鼠标视差
let mx = 0, my = 0;
addEventListener('mousemove', e => {
  mx = (e.clientX / innerWidth)  * 2 - 1;
  my = (e.clientY / innerHeight) * 2 - 1;
});

const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

updateReadouts();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;

  /* ---------- 自动演化 ---------- */
  if (params.auto) {
    const A = 2.2 + 3.0 * (0.5 + 0.5 * Math.sin(t * 0.34));
    const c = 4.0 + 9.0 * (0.5 + 0.5 * Math.sin(t * 0.205 + 1.7));

    params.A = Math.round(A * 10) / 10;
    params.c = Math.round(c * 10) / 10;

    // 节流刷新 UI
    if ((elapsed * 60 | 0) % 10 === 0) {
      aSlider.value = params.A;
      cSlider.value = params.c;
      updateReadouts();
    }
  }

  const omega = params.c * params.k;
  const K     = params.k;

  /* ---------- 主波面：u(x,t) = A·sin(kx − ωt) ---------- */
  for (let i = 0; i < WAVE_N; i++) {
    const x  = bX[i];
    const ph = K * x - omega * t;          // 行波相位
    const y  = params.A * Math.sin(ph);

    const i3 = i * 3;
    wavePos[i3]     = x;
    wavePos[i3 + 1] = y + bJY[i];
    wavePos[i3 + 2] = bZ[i] + 0.12 * Math.sin(t * 0.9 + i * 0.07);

    // —— 相位驱动的彩虹流光 ——
    let hue = ph * 0.085 + 0.52;
    hue = hue - Math.floor(hue);

    const lig = 0.50 + 0.15 * Math.sin(ph * 1.4);
    tmpC.setHSL(hue, 0.96, lig);

    waveCol[i3]     = tmpC.r;
    waveCol[i3 + 1] = tmpC.g;
    waveCol[i3 + 2] = tmpC.b;
  }
  waveGeo.attributes.position.needsUpdate = true;
  waveGeo.attributes.color.needsUpdate    = true;

  /* ---------- 拖尾重影：u(x, t−τ) ---------- */
  for (let g = 0; g < GHOST_N; g++) {
    const G   = ghosts[g];
    const dph = omega * G.tau;             // 时间滞后 → 相位超前 ωτ
    const pos = G.pos;

    for (let i = 0; i < WAVE_N; i++) {
      const x  = bX[i];
      const ph = K * x - omega * t + dph;
      const y  = params.A * Math.sin(ph);

      const i3 = i * 3;
      pos[i3]     = x;
      pos[i3 + 1] = y + bJY[i];
      pos[i3 + 2] = bZ[i];
    }
    G.geo.attributes.position.needsUpdate = true;
  }

  /* ---------- 粒子亮度呼吸 ---------- */
  waveMat.opacity = 0.86 + 0.12 * Math.sin(t * 1.6);
  waveMat.size    = 0.56 + 0.06 * Math.sin(t * 2.2);
  haloMat.opacity = 0.065 + 0.025 * Math.sin(t * 1.3);

  /* ---------- 星尘自转 ---------- */
  if (stars) {
    stars.rotation.y = t * 0.011;
    stars.rotation.x = Math.sin(t * 0.045) * 0.07;
  }

  /* ---------- 相机环绕 + 视差 ---------- */
  const targetDist = fitCamera();
  camDist += (targetDist - camDist) * 0.05;

  const ang = Math.sin(t * 0.115) * 0.34;
  const px  = Math.sin(ang) * camDist + mx * 3.2;
  const pz  = Math.cos(ang) * camDist;
  const py  = 5.2 + Math.sin(t * 0.18) * 1.6 - my * 2.4;

  camera.position.x += (px - camera.position.x) * 0.04;
  camera.position.y += (py - camera.position.y) * 0.04;
  camera.position.z += (pz - camera.position.z) * 0.04;
  camera.lookAt(0, 0, 0);

  /* ---------- 脉冲音效（与波速挂钩） ---------- */
  if (audioOn && t > nextBell) {
    // 波速越快 → 音程越高、节奏越密
    const speedNorm = (params.c - 1) / 17;
    nextBell = t + 3.6 - speedNorm * 2.2;

    const idx = Math.floor(Math.random() * PENTA.length);
    const semi = PENTA[idx] + Math.round(speedNorm * 7);
    const freq = 174 * Math.pow(2, semi / 12);
    playBell(freq, 0.070);
  }

  composer.render();
}

renderer.setAnimationLoop(animate);

/* =========================================================
   13. 自适应
   ========================================================= */
function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  camDist = fitCamera();
}
addEventListener('resize', onResize);

/* 相机初始位置 */
onResize();
camera.position.set(0, 5.2, camDist);
camera.lookAt(0, 0, 0);
</script>
