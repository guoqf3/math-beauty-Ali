<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>玻尔原子轨道模型 · 量子跃迁 · 星河辉光</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#01020a;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;}

  /* ---------- 顶部主标题（中文） ---------- */
  .title{
    position:fixed;
    left:clamp(16px,4.2vw,58px);
    top:clamp(16px,4.2vh,50px);
    z-index:12;
    pointer-events:none;
    user-select:none;
    color:#dceeff;
    font-family:"Songti SC","STSong","SimSun","Times New Roman",serif;
    animation:titleIn 2.1s cubic-bezier(.2,.8,.25,1) both;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateY(-18px);filter:blur(8px);}
    to{opacity:1;transform:none;filter:blur(0);}
  }
  .title h1{
    font-size:clamp(19px,3.05vw,40px);
    font-weight:400;
    letter-spacing:.30em;
    line-height:1.35;
    color:#eaf4ff;
    text-shadow:
      0 0 26px rgba(120,190,255,.85),
      0 0 68px rgba(150,90,255,.55),
      0 2px 10px rgba(0,0,0,.95);
  }
  .title h1 .em{
    color:#c9a4ff;
    text-shadow:0 0 30px rgba(180,120,255,.95),0 0 78px rgba(120,80,255,.5);
  }
  .title .sub{
    margin-top:.62em;
    font-size:clamp(10px,1.42vw,15px);
    letter-spacing:.42em;
    color:#9fd8ff;
    opacity:.86;
    text-shadow:0 0 22px rgba(110,180,255,.75),0 2px 8px rgba(0,0,0,.9);
  }
  .title .line{
    margin-top:.85em;
    width:clamp(70px,11vw,150px);
    height:1px;
    background:linear-gradient(90deg,
      rgba(140,200,255,.85),
      rgba(180,110,255,.55),
      rgba(140,200,255,0));
    box-shadow:0 0 12px rgba(140,200,255,.7);
  }

  /* ---------- 右上角角标（中文 + 公式） ---------- */
  .corner{
    position:fixed;
    right:clamp(16px,4.2vw,58px);
    top:clamp(16px,4.2vh,52px);
    z-index:10;pointer-events:none;user-select:none;
    text-align:right;color:#8fc8ff;
    font-family:"Songti SC","STSong","Times New Roman",serif;
    font-size:clamp(9.5px,1.24vw,13px);
    letter-spacing:.24em;line-height:2.1;opacity:.72;
    text-shadow:0 0 20px rgba(90,170,255,.6),0 2px 7px rgba(0,0,0,.9);
  }
  .corner .cn{
    font-size:clamp(10.5px,1.42vw,15px);
    color:#bfe4ff;letter-spacing:.30em;
    text-shadow:0 0 24px rgba(110,180,255,.8);
  }
  .corner .n{color:#c9a4ff;text-shadow:0 0 20px rgba(170,110,255,.85);}

  /* ---------- 左下数学公式 HUD ---------- */
  .hud{
    position:fixed;
    left:clamp(16px,4.2vw,58px);
    bottom:clamp(16px,4.4vh,56px);
    z-index:10;
    pointer-events:none;user-select:none;
    max-width:min(94vw,980px);
    color:#bfe4ff;
    font-family:"Times New Roman","Songti SC","STSong",Georgia,serif;
    text-shadow:
      0 0 24px rgba(90,170,255,.55),
      0 0 64px rgba(150,80,255,.35),
      0 2px 9px rgba(0,0,0,.9);
    animation:hudIn 1.9s cubic-bezier(.2,.8,.25,1) both .25s;
  }
  @keyframes hudIn{
    from{opacity:0;transform:translateY(22px);filter:blur(8px);}
    to{opacity:1;transform:none;filter:blur(0);}
  }
  .hud .tag{
    font-size:clamp(9.5px,1.32vw,13.5px);
    letter-spacing:.30em;
    opacity:.9;margin-bottom:.9em;
    white-space:nowrap;color:#9fdcff;
    font-family:"Songti SC","STSong",serif;
  }
  .hud .tag .dot{
    display:inline-block;width:.46em;height:.46em;border-radius:50%;
    background:#7ad0ff;
    box-shadow:0 0 16px 5px rgba(90,180,255,.95);
    vertical-align:.02em;margin-right:.7em;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.3;transform:scale(.66);}
    50%    {opacity:1;  transform:scale(1.22);}
  }
  .hud .eq{
    font-size:clamp(12.5px,1.95vw,22px);
    line-height:1.95;font-style:italic;letter-spacing:.012em;
    opacity:.97;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hud .eq .hl{color:#c9a4ff;text-shadow:0 0 26px rgba(170,110,255,.9);font-style:normal;}
  .hud .eq .hl2{color:#8ff5e0;text-shadow:0 0 26px rgba(90,255,220,.9);font-style:normal;}
  .hud .eq.sm{
    font-size:clamp(10px,1.38vw,14.5px);
    opacity:.72;margin-top:.55em;color:#b8a8ff;
    text-shadow:0 0 24px rgba(150,100,255,.6),0 2px 8px rgba(0,0,0,.9);
  }
  .hud .cnline{
    margin-top:.6em;
    font-size:clamp(10px,1.34vw,14px);
    letter-spacing:.28em;
    color:#a8d8ff;
    opacity:.78;
    font-family:"Songti SC","STSong",serif;
    text-shadow:0 0 22px rgba(110,180,255,.7);
  }
  .hud sub{font-size:.62em;font-style:normal;vertical-align:-.22em;letter-spacing:0;}
  .hud sup{font-size:.6em;font-style:normal;vertical-align:.42em;}

  /* ---------- 音频控制条 ---------- */
  .audiobar{
    position:fixed;
    right:clamp(16px,4.2vw,58px);
    bottom:clamp(16px,4.4vh,56px);
    z-index:20;
    display:flex;align-items:center;
    gap:clamp(8px,1.1vw,14px);
    padding:clamp(8px,1.1vw,13px) clamp(12px,1.6vw,19px);
    border-radius:999px;
    background:linear-gradient(150deg,
        rgba(10,26,58,.75) 0%,
        rgba(24,14,58,.68) 55%,
        rgba(46,12,72,.68) 100%);
    border:1px solid rgba(120,170,255,.32);
    box-shadow:
      0 0 26px rgba(80,150,255,.24),
      0 0 66px rgba(150,70,255,.18),
      inset 0 0 26px rgba(90,160,255,.08);
    backdrop-filter:blur(10px) saturate(1.5);
    -webkit-backdrop-filter:blur(10px) saturate(1.5);
    user-select:none;
    animation:barIn 2.1s cubic-bezier(.2,.8,.25,1) both .4s;
  }
  @keyframes barIn{
    from{opacity:0;transform:translateY(16px) scale(.94);filter:blur(6px);}
    to{opacity:1;transform:none;filter:blur(0);}
  }
  .audiobar button{
    appearance:none;border:none;outline:none;cursor:pointer;
    display:grid;place-items:center;
    width:clamp(34px,3.6vw,44px);height:clamp(34px,3.6vw,44px);
    border-radius:50%;color:#d4ecff;
    background:radial-gradient(circle at 34% 28%,
        rgba(120,180,255,.32),
        rgba(40,30,90,.34) 72%);
    border:1px solid rgba(130,180,255,.48);
    box-shadow:
      0 0 18px rgba(90,160,255,.4),
      inset 0 0 14px rgba(120,170,255,.16);
    transition:transform .2s ease, box-shadow .25s ease;
  }
  .audiobar button:hover{
    transform:scale(1.09);
    box-shadow:0 0 32px rgba(120,190,255,.7),inset 0 0 20px rgba(150,190,255,.26);
  }
  .audiobar button:active{transform:scale(.94);}
  .audiobar button svg{width:52%;height:52%;display:block;fill:currentColor;}

  .audiobar .meta{
    display:flex;flex-direction:column;gap:3px;
    font-family:"Songti SC","STSong","Times New Roman",serif;
    line-height:1.35;white-space:nowrap;
  }
  .audiobar .meta .ttl{
    font-size:clamp(9.5px,1.14vw,12.5px);
    letter-spacing:.24em;
    color:#a8d8ff;text-shadow:0 0 16px rgba(110,180,255,.75);
  }
  .audiobar .meta .sub{
    font-size:clamp(8px,.94vw,10.5px);
    letter-spacing:.16em;color:#c1a6ff;opacity:.8;
    text-shadow:0 0 14px rgba(160,100,255,.6);
  }
  .leds{display:flex;align-items:flex-end;gap:3px;height:clamp(16px,2vw,22px);}
  .leds i{
    display:block;width:3px;border-radius:2px;
    background:linear-gradient(180deg,#9fd8ff,#6a7cff);
    box-shadow:0 0 9px rgba(120,170,255,.95);
    transform-origin:bottom;opacity:.3;height:100%;
    transition:opacity .18s linear;
  }
  .audiobar.on .leds i{opacity:.95;animation:eq .8s ease-in-out infinite alternate;}
  .audiobar.on .leds i:nth-child(1){animation-delay:0s;   --h:.42;}
  .audiobar.on .leds i:nth-child(2){animation-delay:.12s; --h:.86;}
  .audiobar.on .leds i:nth-child(3){animation-delay:.24s; --h:.58;}
  .audiobar.on .leds i:nth-child(4){animation-delay:.07s; --h:.96;}
  .audiobar.on .leds i:nth-child(5){animation-delay:.31s; --h:.50;}
  @keyframes eq{
    from{transform:scaleY(.2);}
    to  {transform:scaleY(var(--h,1));}
  }

  /* 加载层 */
  .loader{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:#01020a;color:#9fdcff;
    font:13px/1.7 "Songti SC","STSong",serif;letter-spacing:.34em;
    transition:opacity .9s ease, visibility .9s;
  }
  .loader.gone{opacity:0;pointer-events:none;visibility:hidden;}
  .loader .ring{
    width:56px;height:56px;border-radius:50%;
    border:1px solid rgba(140,190,255,.25);
    border-top-color:#7ad0ff;
    animation:spin 1s linear infinite;margin:0 auto 18px;
    box-shadow:0 0 26px rgba(100,170,255,.5);
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .err{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:60;color:#ff8a8a;font:13px/1.7 monospace;letter-spacing:.08em;
    text-align:center;padding:20px 28px;border-radius:10px;
    background:rgba(20,0,10,.85);border:1px solid rgba(255,120,120,.35);
    display:none;max-width:80vw;
  }

  @media (max-width:760px){
    .title h1{letter-spacing:.18em;}
    .title .sub{letter-spacing:.24em;}
    .corner{display:none;}
  }
  @media (max-width:560px){
    .audiobar .meta .sub{display:none;}
    .leds{display:none;}
    .hud .eq{font-size:clamp(10.5px,3.2vw,15px);}
    .hud .eq.sm{font-size:clamp(8.5px,2.6vw,12px);}
  }
</style>

<script type="module">
/* 全局错误捕获 */

import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   音频引擎（Web Audio 实时合成）
   ============================================================ */
const Audio = (function () {
  let ctx = null, master = null, revIn = null;
  let started = false, timerId = null;
  let nextStepTime = 0, stepIdx = 0;

  const BPM = 84;
  const SPB = 60 / BPM;
  const S16 = SPB / 4;
  const SCALE = [62, 65, 69, 72, 74, 77, 81, 84];

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function buildIR(dur, decay) {
    const rate = ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * dur));
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function bell(freq, t, dur, gain) {
    const car = ctx.createOscillator();
    car.type = 'sine';
    car.frequency.value = freq;

    const mod = ctx.createOscillator();
    mod.type = 'sine';
    mod.frequency.value = freq * 2.98;

    const modG = ctx.createGain();
    modG.gain.setValueAtTime(freq * 2.2, t);
    modG.gain.exponentialRampToValueAtTime(freq * 0.02, t + dur * 0.72);
    mod.connect(modG); modG.connect(car.frequency);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    car.connect(g);
    g.connect(master);
    if (revIn) g.connect(revIn);

    car.start(t); mod.start(t);
    car.stop(t + dur + 0.06); mod.stop(t + dur + 0.06);
  }

  function kick(t, gain) {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.19);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);

    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.42);
  }

  function scheduleStep(step, t) {
    if (step % 4 === 0) kick(t, 0.30);

    if (step % 2 === 0 || Math.random() < 0.22) {
      const n = SCALE[(step * 3 + Math.floor(step / 16) * 2) % SCALE.length];
      bell(mtof(n), t, 0.9 + Math.random() * 0.7, 0.050);
    }
    if (Math.random() < 0.07) {
      const n = SCALE[Math.floor(Math.random() * SCALE.length)] + 12;
      bell(mtof(n), t, 0.6, 0.028);
    }
  }

  function scheduler() {
    if (!started || !ctx) return;
    const now = ctx.currentTime;
    while (nextStepTime < now + 0.16) {
      scheduleStep(stepIdx, nextStepTime);
      nextStepTime += S16;
      stepIdx = (stepIdx + 1) % 64;
    }
  }

  function startDrone() {
    const now = ctx.currentTime;
    const dg = ctx.createGain();
    dg.gain.setValueAtTime(0.0001, now);
    dg.gain.exponentialRampToValueAtTime(0.11, now + 4.5);
    dg.connect(master);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 520;
    lp.Q.value = 3.2;
    lp.connect(dg);

    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.065;
    const lfoG = ctx.createGain();
    lfoG.gain.value = 300;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    lfo.start();

    [55, 82.41, 110, 164.81].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = i % 2 === 0 ? 'sawtooth' : 'triangle';
      o.frequency.value = f;
      o.detune.value = (i - 1.5) * 7;
      const g = ctx.createGain();
      g.gain.value = 0.24;
      o.connect(g); g.connect(lp);
      o.start();
    });
  }

  return {
    get ctx() { return ctx; },
    get started() { return started; },
    _timer: null,

    init() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();

      master = ctx.createGain();
      master.gain.value = 0.85;
      master.connect(ctx.destination);

      const conv = ctx.createConvolver();
      conv.buffer = buildIR(3.4, 2.5);
      revIn = ctx.createGain();
      revIn.gain.value = 0.9;
      revIn.connect(conv);
      const revOut = ctx.createGain();
      revOut.gain.value = 0.34;
      conv.connect(revOut);
      revOut.connect(master);
    },

    start() {
      if (!ctx) this.init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      if (started) return;
      started = true;
      stepIdx = 0;
      nextStepTime = ctx.currentTime + 0.1;
      startDrone();
      this._timer = setInterval(scheduler, 25);
    },

    stop() {
      if (!ctx || !started) return;
      started = false;
      if (this._timer) { clearInterval(this._timer); this._timer = null; }
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(Math.max(master.gain.value, 0.0001), t);
      master.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      const m = master;
      setTimeout(() => {
        try {
          m.gain.cancelScheduledValues(ctx.currentTime);
          m.gain.setValueAtTime(0.85, ctx.currentTime);
        } catch (e) {}
      }, 900);
    },

    blip(levelFrom, levelTo) {
      if (!ctx || !started) return;
      const t = ctx.currentTime;
      const base = 260 + (5 - levelTo) * 95;
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(base * 2.8, t);
      o.frequency.exponentialRampToValueAtTime(base, t + 0.38);

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.085, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);

      o.connect(g); g.connect(master);
      if (revIn) g.connect(revIn);
      o.start(t); o.stop(t + 0.6);
    }
  };
})();

const scene = new THREE.Scene();

camera.position.set(0, 8.4, 18.8);

/* ============================================================
   发光纹理
   ============================================================ */
function makeGlowTexture(stops) {
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  stops.forEach(s => grd.addColorStop(s[0], s[1]));
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);
  return new THREE.CanvasTexture(cv);
}

const MAX_P = 2800;
const pPos   = new Float32Array(MAX_P * 3);

const pAlpha = new Float32Array(MAX_P);
const pVel   = new Float32Array(MAX_P * 3);
const pLife  = new Float32Array(MAX_P);
const pMax   = new Float32Array(MAX_P);
let pCount = 0;

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

const pMat = new THREE.ShaderMaterial({
  uniforms: { uPR: { value: renderer.getPixelRatio() } },

    'attribute float aSize;',
    'attribute vec3 aColor;',
    'attribute float aAlpha;',

    'varying float vAlpha;',
    'void main(){',
    '  vColor = aColor;',
    '  vAlpha = aAlpha;',
    '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
    '  gl_PointSize = aSize * uPR * (460.0 / max(0.001, -mv.z));',
    '  gl_Position = projectionMatrix * mv;',
    '}'
  ].join('\n'),
  fragmentShader: [
    'varying vec3 vColor;',
    'varying float vAlpha;',
    'void main(){',
    '  vec2 d = gl_PointCoord - 0.5;',
    '  float r = length(d);',
    '  if (r > 0.5) discard;',
    '  float a = smoothstep(0.5, 0.0, r);',
    '  a = pow(a, 1.7);',
    '  gl_FragColor = vec4(vColor * a * vAlpha, a * vAlpha);',
    '}'
  ].join('\n'),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

function spawnParticle(x, y, z, vx, vy, vz, r, g, b, size, life) {
  if (pCount >= MAX_P) return;
  const i = pCount++;
  const i3 = i * 3;
  pPos[i3] = x; pPos[i3 + 1] = y; pPos[i3 + 2] = z;
  pVel[i3] = vx; pVel[i3 + 1] = vy; pVel[i3 + 2] = vz;
  pCol[i3] = r; pCol[i3 + 1] = g; pCol[i3 + 2] = b;
  pSize[i] = size;
  pAlpha[i] = 1;
  pLife[i] = life;
  pMax[i] = life;
}

function removeParticle(i) {
  const last = pCount - 1;
  if (i !== last) {
    const i3 = i * 3, l3 = last * 3;
    pPos[i3] = pPos[l3]; pPos[i3 + 1] = pPos[l3 + 1]; pPos[i3 + 2] = pPos[l3 + 2];
    pVel[i3] = pVel[l3]; pVel[i3 + 1] = pVel[l3 + 1]; pVel[i3 + 2] = pVel[l3 + 2];
    pCol[i3] = pCol[l3]; pCol[i3 + 1] = pCol[l3 + 1]; pCol[i3 + 2] = pCol[l3 + 2];
    pSize[i] = pSize[last];
    pAlpha[i] = pAlpha[last];
    pLife[i] = pLife[last];
    pMax[i] = pMax[last];
  }
  pCount--;
}

function updateParticles(dt) {
  const damp = Math.exp(-2.35 * dt);
  for (let i = pCount - 1; i >= 0; i--) {
    pLife[i] -= dt;
    if (pLife[i] <= 0) { removeParticle(i); continue; }
    const i3 = i * 3;
    pPos[i3]     += pVel[i3] * dt;
    pPos[i3 + 1] += pVel[i3 + 1] * dt;
    pPos[i3 + 2] += pVel[i3 + 2] * dt;
    pVel[i3] *= damp; pVel[i3 + 1] *= damp; pVel[i3 + 2] *= damp;
    const k = pLife[i] / pMax[i];
    pAlpha[i] = Math.pow(k, 0.75);
  }
  pGeo.setDrawRange(0, pCount);
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aColor.needsUpdate = true;
  pGeo.attributes.aSize.needsUpdate = true;
  pGeo.attributes.aAlpha.needsUpdate = true;
}

   冲击波环
   ============================================================ */
const shockwaves = [];
const shockGeo = new THREE.RingGeometry(0.93, 1.0, 128);

function spawnShockwave(radius, hue) {
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(hue, 1.0, 0.62),
    transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide
  });
  const m = new THREE.Mesh(shockGeo, mat);
  m.rotation.x = -Math.PI / 2;
  m.scale.setScalar(radius);
  scene.add(m);
  shockwaves.push({ mesh: m, t: 0, dur: 1.25, r0: radius });
}

function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.t += dt / s.dur;
    if (s.t >= 1) {
      scene.remove(s.mesh);
      s.mesh.material.dispose();
      shockwaves.splice(i, 1);
      continue;
    }
    const e = 1 - Math.pow(1 - s.t, 3);
    s.mesh.scale.setScalar(s.r0 * (1 + e * 0.85));
    s.mesh.material.opacity = 0.95 * Math.pow(1 - s.t, 1.6);
  }
}

/* ============================================================
   量子跃迁
   ============================================================ */
function burstAt(pos, fromLevel, toLevel) {
  const cA = new THREE.Color().setHSL(RING_HUES[fromLevel], 1.0, 0.72);
  const cB = new THREE.Color().setHSL(RING_HUES[toLevel], 1.0, 0.78);
  const cC = new THREE.Color(0xffffff);

  const N = 120;
  for (let i = 0; i < N; i++) {
    const u = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const sq = Math.sqrt(Math.max(0, 1 - u * u));
    const dx = sq * Math.cos(th), dy = u, dz = sq * Math.sin(th);
    const spd = 1.4 + Math.random() * 4.6;

    const mix = Math.random();
    const col = mix < 0.45 ? cA.clone() : (mix < 0.85 ? cB.clone() : cC.clone());
    col.lerp(cC, Math.random() * 0.35);

    spawnParticle(
      pos.x + dx * 0.06, pos.y + dy * 0.06, pos.z + dz * 0.06,
      dx * spd, dy * spd * 0.75, dz * spd,
      col.r, col.g, col.b,
      0.045 + Math.random() * 0.11,
      0.7 + Math.random() * 1.5
    );
  }

  const th0 = Math.atan2(pos.z, pos.x);
  const tanX = -Math.sin(th0), tanZ = Math.cos(th0);
  for (let i = 0; i < 50; i++) {
    const col = cB.clone().lerp(cC, Math.random() * 0.5);
    const s = 2.2 + Math.random() * 3.4;
    const jitter = () => (Math.random() - 0.5) * 1.6;
    spawnParticle(
      pos.x, pos.y + jitter() * 0.12, pos.z,
      tanX * s + jitter(), jitter() * 0.6, tanZ * s + jitter(),
      col.r, col.g, col.b,
      0.04 + Math.random() * 0.09,
      0.6 + Math.random() * 1.3
    );
  }

  Audio.blip(fromLevel, toLevel);
}

function startJump(e, targetN) {
  e.jumpFrom = e.curN;
  e.jumpTo = targetN;
  e.jumpFromR = RING_RADII[e.curN];
  e.jumpToR = RING_RADII[targetN];
  e.jumpT = 0;
  e.jumpDur = 0.52 + Math.random() * 0.36;
  e.state = targetN < e.curN ? 'jump-down' : 'jump-up';

  if (targetN < e.curN) {
    const p = e.group.position.clone();
    burstAt(p, e.curN, targetN);
    spawnShockwave(RING_RADII[e.curN], RING_HUES[e.curN]);
  }
}

const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function updateElectrons(dt, time) {
  for (const e of electrons) {
    const jumping = (e.state === 'jump-down' || e.state === 'jump-up');
    e.angle += e.omega * dt * (jumping ? 2.1 : 1.0);

    let r;

    if (jumping) {
      e.jumpT += dt / e.jumpDur;
      if (e.jumpT >= 1) {
        e.jumpT = 1;
        e.curN = e.jumpTo;
        if (e.state === 'jump-down') {
          e.state = 'settle';
          e.timer = 0.7 + Math.random() * 2.4;
        } else {
          e.state = 'stable';
          e.timer = 1.6 + Math.random() * 4.5;
        }
      }
      const t = easeInOutCubic(e.jumpT);
      r = e.jumpFromR + (e.jumpToR - e.jumpFromR) * t;
      e.yOff = Math.sin(e.jumpT * Math.PI) * (e.jumpTo < e.jumpFrom ? -0.45 : 0.45);
    } else {
      r = RING_RADII[e.curN];
      e.yOff *= Math.exp(-6 * dt);
    }

    if (e.state === 'stable') {
      e.timer -= dt;
      if (e.timer <= 0) {
        if (e.curN > 0 && Math.random() < 0.85) {
          startJump(e, Math.floor(Math.random() * e.curN));
        } else {
          e.timer = 1.6 + Math.random() * 4.5;
        }
      }
    } else if (e.state === 'settle') {
      e.timer -= dt;
      if (e.timer <= 0) {
        if (e.curN !== e.homeN) {
          startJump(e, e.homeN);
        } else {
          e.state = 'stable';
          e.timer = 1.6 + Math.random() * 4.5;
        }
      }
    }

    e.group.position.set(Math.cos(e.angle) * r, e.yOff, Math.sin(e.angle) * r);

    const pulse = 0.85 + 0.38 * Math.sin(time * 6.4 + e.phase);
    e.glow.scale.setScalar(pulse);
    e.glowOuter.scale.setScalar(2.4 + pulse * 0.55);
    e.glow.material.opacity = jumping ? 1.0 : 0.9;
  }
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  starMat.uniforms.uPR.value = renderer.getPixelRatio();
  pMat.uniforms.uPR.value = renderer.getPixelRatio();
}
window.addEventListener('resize', onResize, { passive: true });

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let time = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  camera.position.x = Math.sin(time * 0.062) * 2.4;
  camera.position.y = 8.4 + Math.sin(time * 0.113) * 0.7;
  camera.position.z = 18.6 + Math.cos(time * 0.062) * 1.4;
  camera.lookAt(0, 0, 0);

  core.scale.setScalar(1 + 0.10 * Math.sin(time * 2.6));
  coreGlow1.scale.setScalar(3.6 * (1 + 0.16 * Math.sin(time * 1.9)));
  coreGlow2.scale.setScalar(8.4 * (1 + 0.10 * Math.sin(time * 1.3 + 1.0)));
  coreGlow1.material.opacity = 0.85 + 0.15 * Math.sin(time * 2.4);

  haloRing.rotation.z = time * 0.6;
  haloRing.rotation.y = time * 0.35;
  haloRing.material.opacity = 0.4 + 0.3 * Math.sin(time * 1.7);

  for (const rg of ringGroups) {
    rg.group.rotation.y += rg.speed * dt;
    rg.halo.material.opacity = 0.045 + 0.035 * Math.sin(time * 0.9 + rg.level);
  }

  updateElectrons(dt, time);
  updateParticles(dt);
  updateShockwaves(dt);

  stars.rotation.y += dt * 0.008;
  stars.rotation.x += dt * 0.002;
  starMat.uniforms.uTime.value = time;

  for (const n of nebulae) {
    n.sp.material.rotation += n.spd * dt * 0.6;
    n.sp.material.opacity = n.base * (0.78 + 0.22 * Math.sin(time * 0.45 + n.phase));
  }

  if (composer) composer.render();
  else renderer.render(scene, camera);
}

/* ============================================================
   UI 绑定
   ============================================================ */
const playBtn   = document.getElementById('playBtn');
const iconPlay  = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');
const bar       = document.getElementById('audiobar');
const subText   = document.getElementById('subText');

playBtn.addEventListener('click', async () => {
  if (!Audio.ctx) Audio.init();
  if (Audio.ctx && Audio.ctx.state === 'suspended') {
    try { await Audio.ctx.resume(); } catch (e) {}
  }

  if (Audio.started) {
    Audio.stop();
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
    bar.classList.remove('on');
    subText.textContent = '点击播放 · 量子音景';
  } else {
    Audio.start();
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
    bar.classList.add('on');
    subText.textContent = '正在播放 · 点击暂停';
  }
});

window.addEventListener('pointerdown', function once() {
  window.removeEventListener('pointerdown', once);
  if (!Audio.ctx) {
    Audio.init();
    if (Audio.ctx && Audio.ctx.state === 'suspended') {
      Audio.ctx.resume().catch(() => {});
    }
  }
}, { once: true, passive: true });

document.addEventListener('visibilitychange', () => {
  if (!Audio.ctx || !Audio.started) return;
  if (document.hidden) {
    if (Audio._timer) { clearInterval(Audio._timer); Audio._timer = null; }
  } else {
    if (!Audio._timer) Audio._timer = setInterval(() => {}, 25);
  }
});

/* ============================================================
   启动
   ============================================================ */
onResize();
animate();

setTimeout(() => {
  const ld = document.getElementById('loader');
  if (ld) ld.classList.add('gone');
}, 500);
</script>
