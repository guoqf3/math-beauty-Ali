<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>果冻弹球</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d14;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="jellyCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('jellyCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                count: 55,                  // 果冻球数量
                attractRadius: 220,         // 鼠标吸引半径
                attractStrength: 0.06,      // 吸引强度
                returnForce: 0.012,         // 回弹力强度
                damping: 0.92,              // 速度阻尼
                particleRepelRadius: 20,    // 球间排斥半径
                particleRepelForce: 0.5,    // 球间排斥力
                clickRepelRadius: 260,      // 点击排斥半径
                clickRepelStrength: 22,     // 排斥强度
                minR: 8,                    // 最小半径
                maxR: 18,                   // 最大半径
                stretchFactor: 4.5,         // 拉伸因子（速度越快拉伸越大）
                backgroundFade: 0.18,       // 拖尾强度
                colorSaturation: 80,
                colorLightness: 65,
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let balls = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // ---------- 果冻球类 ----------
            class JellyBall {
                constructor(w, h) {
                    this.homeX = Math.random() * w;
                    this.homeY = Math.random() * h;
                    this.x = this.homeX;
                    this.y = this.homeY;
                    this.vx = 0;
                    this.vy = 0;
                    this.radius = Math.random() * (CONFIG.maxR - CONFIG.minR) + CONFIG.minR;
                    this.hue = Math.random() * 360;
                    this.saturation = CONFIG.colorSaturation + Math.random() * 15;
                    this.lightness = CONFIG.colorLightness + Math.random() * 10;
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 1.2 + 0.5;
                }

                update(dt, time, neighbors) {
                    // 鼠标吸引
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = smoothMouseX - this.x;
                        const dy = smoothMouseY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.attractRadius && dist > 0.1) {
                            const force = (CONFIG.attractRadius - dist) / CONFIG.attractRadius * CONFIG.attractStrength;
                            this.vx += (dx / dist) * force * dt;
                            this.vy += (dy / dist) * force * dt;
                        }
                    }

                    // 回弹力（向home）
                    const returnDx = this.homeX - this.x;
                    const returnDy = this.homeY - this.y;
                    this.vx += returnDx * CONFIG.returnForce * dt;
                    this.vy += returnDy * CONFIG.returnForce * dt;

                    // 球间排斥
                    for (const other of neighbors) {
                        if (other === this) continue;
                        const dx = this.x - other.x;
                        const dy = this.y - other.y;
                        const distSq = dx * dx + dy * dy;
                        const minDist = CONFIG.particleRepelRadius + this.radius + other.radius;
                        if (distSq < minDist * minDist && distSq > 0.001) {
                            const dist = Math.sqrt(distSq);
                            const force = CONFIG.particleRepelForce * (1 - dist / minDist);
                            this.vx += (dx / dist) * force * dt * 0.5;
                            this.vy += (dy / dist) * force * dt * 0.5;
                        }
                    }

                    // 阻尼
                    this.vx *= CONFIG.damping;
                    this.vy *= CONFIG.damping;

                    // 速度限制
                    const maxSpeed = 4;
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界软回弹
                    const margin = this.radius * 0.5;
                    if (this.x < margin) { this.x = margin; this.vx = Math.abs(this.vx) * 0.4; }
                    if (this.x > width - margin) { this.x = width - margin; this.vx = -Math.abs(this.vx) * 0.4; }
                    if (this.y < margin) { this.y = margin; this.vy = Math.abs(this.vy) * 0.4; }
                    if (this.y > height - margin) { this.y = height - margin; this.vy = -Math.abs(this.vy) * 0.4; }
                }

                // 获取果冻形变（根据速度方向拉伸）
                getDeformation() {
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    const stretch = Math.min(0.35, speed * CONFIG.stretchFactor * 0.08);
                    const angle = Math.atan2(this.vy, this.vx);
                    return { stretch, angle };
                }

                draw() {
                    const { stretch, angle } = this.getDeformation();
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 0.08;
                    const r = this.radius * (1 + pulse);
                    const rx = r * (1 + stretch);
                    const ry = r * (1 - stretch * 0.6);

                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(angle);
                    ctx.scale(1, 1); // 不整体缩放，用ellipse

                    // 光晕
                    const glowR = r * 2.5;
                    const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
                    glowGrad.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, 0.3)`);
                    glowGrad.addColorStop(1, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, 0)`);
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, glowR, 0, Math.PI * 2);
                    ctx.fill();

                    // 主体（椭圆）
                    const bodyGrad = ctx.createRadialGradient(-rx * 0.2, -ry * 0.2, r * 0.1, 0, 0, Math.max(rx, ry));
                    bodyGrad.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness + 15}%, 0.85)`);
                    bodyGrad.addColorStop(0.7, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, 0.7)`);
                    bodyGrad.addColorStop(1, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness - 10}%, 0.5)`);
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 高光
                    const hlR = r * 0.3;
                    const hlGrad = ctx.createRadialGradient(-rx * 0.3, -ry * 0.35, 0, -rx * 0.3, -ry * 0.35, hlR);
                    hlGrad.addColorStop(0, `hsla(0, 100%, 100%, 0.9)`);
                    hlGrad.addColorStop(1, `hsla(0, 100%, 100%, 0)`);
                    ctx.fillStyle = hlGrad;
                    ctx.beginPath();
                    ctx.arc(-rx * 0.3, -ry * 0.35, hlR, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            // ---------- 空间哈希网格（用于球间排斥） ----------
            let grid = new Map();
            let cellSize = 40;

            function buildGrid() {
                grid.clear();
                cellSize = CONFIG.particleRepelRadius * 2 + CONFIG.maxR * 2;
                for (const b of balls) {
                    const gx = Math.floor(b.x / cellSize);
                    const gy = Math.floor(b.y / cellSize);
                    const key = gx + ',' + gy;
                    if (!grid.has(key)) grid.set(key, []);
                    grid.get(key).push(b);
                }
            }

            function getNeighbors(b) {
                const gx = Math.floor(b.x / cellSize);
                const gy = Math.floor(b.y / cellSize);
                const neighbors = [];
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const key = (gx + dx) + ',' + (gy + dy);
                        if (grid.has(key)) {
                            const cell = grid.get(key);
                            for (const other of cell) neighbors.push(other);
                        }
                    }
                }
                return neighbors;
            }

            // ---------- 初始化 ----------
            function initBalls() {
                balls = [];
                for (let i = 0; i < CONFIG.count; i++) {
                    balls.push(new JellyBall(width, height));
                }
            }

            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#0d0d14';
                ctx.fillRect(0, 0, width, height);
                initBalls();
                drawScene(performance.now());
            }

            // ---------- 绘制场景 ----------
            function drawScene(now) {
                ctx.fillStyle = 'rgba(13, 13, 20, ' + CONFIG.backgroundFade + ')';
                ctx.fillRect(0, 0, width, height);

                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.15;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.15;
                }

                // 绘制鼠标光晕
                if (mouseActive && smoothMouseX > -1000) {
                    const glowR = 140;
                    const grad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY, glowR);
                    grad.addColorStop(0, 'rgba(180, 160, 255, 0.08)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, glowR, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (const b of balls) {
                    b.draw();
                }
            }

            // ---------- 更新 ----------
            function updateScene(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                buildGrid();
                for (const b of balls) {
                    const neighbors = getNeighbors(b);
                    b.update(dt, time, neighbors);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) lastTime = now - 16;
                else lastTime = now;

                updateScene(now);
                drawScene(now);
                animationId = requestAnimationFrame(animate);
            }

            // ---------- 交互 ----------
            function updateMousePosition(cx, cy) {
                targetMouseX = cx;
                targetMouseY = cy;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = cx;
                    smoothMouseY = cy;
                }
            }

            function handleClick(cx, cy) {
                for (const b of balls) {
                    const dx = b.x - cx;
                    const dy = b.y - cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.clickRepelRadius && dist > 0.01) {
                        const force = (1 - dist / CONFIG.clickRepelRadius) * CONFIG.clickRepelStrength;
                        b.vx += (dx / dist) * force;
                        b.vy += (dy / dist) * force;
                    }
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });
                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });
                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });
                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });
                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) updateMousePosition(touch.clientX, touch.clientY);
                }, { passive: false });
                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });
                window.addEventListener('resize', () => resizeCanvas());
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
                        lastTime = 0;
                    } else {
                        if (!animationId) { lastTime = 0; animationId = requestAnimationFrame(animate); }
                    }
                });
            }

            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__jellyBalls = { config: CONFIG, balls };
        })();
    </script>
</body>
</html>
