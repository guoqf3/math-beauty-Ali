<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S³ 等角螺旋 · 球面立体投影</title>
    <style>
        :root { --bg: #060a14; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            width: 100vw; height: 100vh; height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 2.5vh; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.1rem, 2.5vw, 1.8rem); font-weight: 400;
            letter-spacing: 0.07em; color: rgba(215, 225, 245, 0.93);
            text-shadow: 0 0 45px rgba(160, 200, 255, 0.55), 0 0 85px rgba(130, 170, 240, 0.3);
            line-height: 1.3;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.6rem, 1.3vw, 0.85rem); letter-spacing: 0.12em;
            color: rgba(180, 195, 220, 0.72);
            text-shadow: 0 0 20px rgba(140, 180, 220, 0.35); margin-top: 0.3vh; font-style: italic;
        }
        #formula-overlay {
            position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #formula-overlay .formula {
            font-size: clamp(0.6rem, 1.3vw, 0.82rem); letter-spacing: 0.04em;
            color: rgba(190, 200, 225, 0.78); text-shadow: 0 0 30px rgba(150, 180, 220, 0.4);
            font-style: italic; background: rgba(8, 14, 26, 0.55);
            padding: 0.5vh 2vw; border-radius: 2rem;
            border: 1px solid rgba(120, 150, 200, 0.22);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            white-space: nowrap;
        }
        #formula-overlay .formula .highlight {
            color: rgba(255, 175, 95, 0.9); font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">S³ 等角螺旋</div>
        <div class="subtitle">Loxodromic Curves on the 3‑sphere · 立体投影</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="highlight">z₁</span>=e<sup>iω₁t</sup>cos φ 
            <span class="highlight">z₂</span>=e<sup>iω₂t</sup>sin φ | 
            ω₁,ω₂∈{√2,√3,φ}
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.157.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 容器 ---
        const container = document.getElementById('canvas-container');

        // --- 场景 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.1, 18);
        camera.position.set(4.2, 0.8, 4.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x060a14, 1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // --- 星空 ---
        const starCount = 600;
        const starGeom = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        const starSize = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 7.2 + Math.random() * 9;
            starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            starPos[i*3+2] = r * Math.cos(phi);
            starSize[i] = Math.random() * 1.4 + 0.15;
        }
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeom.setAttribute('size', new THREE.BufferAttribute(starSize, 1));
        const stars = new THREE.Points(starGeom, new THREE.PointsMaterial({
            color: 0x7d8eb5, size: 0.009, transparent: true, opacity: 0.55,
            blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
        }));
        scene.add(stars);

        // --- 颜色 ---
        const COLORS = [
            new THREE.Color('#00c8f0'), // 青色
            new THREE.Color('#f0a040'), // 金色
            new THREE.Color('#f05078')  // 品红
        ];

        // --- 常数 ---
        const SQRT2 = Math.SQRT2;
        const SQRT3 = Math.SQRT3;
        const PHI = (1 + Math.sqrt(5)) / 2;

        // --- 参数 ---
        const NUM_LINES = 72;
        const POINTS_PER_LINE = 280;
        const T_SPAN = 8;          // t 时间窗口
        const SCALE = 1.7;
        const MAX_COORD = 4.5;

        // 构建每条线的参数
        const lineParams = [];
        const omegaChoices = [SQRT2, SQRT3, PHI];

        for (let i = 0; i < NUM_LINES; i++) {
            let group;
            let omega1, omega2;
            if (i < 24) {
                group = 0;
                omega1 = SQRT2 * (0.9 + Math.random() * 0.3);
                omega2 = SQRT3 * (0.9 + Math.random() * 0.3);
            } else if (i < 48) {
                group = 1;
                omega1 = SQRT3 * (1.0 + Math.random() * 0.4);
                omega2 = PHI   * (1.0 + Math.random() * 0.3);
            } else {
                group = 2;
                omega1 = PHI   * (1.1 + Math.random() * 0.5);
                omega2 = SQRT2 * (1.1 + Math.random() * 0.4);
            }

            const phi = Math.random() * Math.PI / 2; // 纬度角
            const phaseOffset = Math.random() * Math.PI * 2;
            const speed = 0.5 + Math.random() * 0.6;

            lineParams.push({
                group, omega1, omega2, phi, phaseOffset, speed
            });
        }

        // --- 创建线条 ---
        const lineObjects = [];
        for (let i = 0; i < NUM_LINES; i++) {
            const positions = new Float32Array(POINTS_PER_LINE * 3);
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setDrawRange(0, POINTS_PER_LINE);
            const mat = new THREE.LineBasicMaterial({
                color: COLORS[lineParams[i].group],
                linewidth: 1,
                transparent: true,
                opacity: 0.82,
                depthTest: true,
                depthWrite: true,
                blending: THREE.NormalBlending
            });
            const line = new THREE.Line(geom, mat);
            line.frustumCulled = false;
            scene.add(line);
            lineObjects.push({ geom, positions, param: lineParams[i] });
        }

        // --- 立体投影：S³ (z1, z2) -> R³ ---
        function stereographic(z1_re, z1_im, z2_re, z2_im) {
            const w = z2_im; // 第四坐标
            const denom = 1 - w;
            const inv = 1 / Math.max(0.0001, Math.abs(denom));
            const x = z1_re * inv * SCALE;
            const y = z1_im * inv * SCALE;
            const z = z2_re * inv * SCALE;
            return {
                x: Math.max(-MAX_COORD, Math.min(MAX_COORD, x)),
                y: Math.max(-MAX_COORD, Math.min(MAX_COORD, y)),
                z: Math.max(-MAX_COORD, Math.min(MAX_COORD, z))
            };
        }

        // --- 更新所有线条 ---
        function updateAllLines(globalTime) {
            const dt = T_SPAN / (POINTS_PER_LINE - 1);
            for (let i = 0; i < NUM_LINES; i++) {
                const obj = lineObjects[i];
                const p = obj.param;
                const positions = obj.positions;
                const currentT = globalTime * p.speed + p.phaseOffset;
                const tStart = currentT - T_SPAN / 2;

                for (let j = 0; j < POINTS_PER_LINE; j++) {
                    const t = tStart + j * dt;
                    const cosPhi = Math.cos(p.phi);
                    const sinPhi = Math.sin(p.phi);
                    const z1_re = Math.cos(p.omega1 * t) * cosPhi;
                    const z1_im = Math.sin(p.omega1 * t) * cosPhi;
                    const z2_re = Math.cos(p.omega2 * t) * sinPhi;
                    const z2_im = Math.sin(p.omega2 * t) * sinPhi;
                    const pt = stereographic(z1_re, z1_im, z2_re, z2_im);
                    const idx = j * 3;
                    positions[idx]   = pt.x;
                    positions[idx+1] = pt.y;
                    positions[idx+2] = pt.z;
                }
                obj.geom.attributes.position.needsUpdate = true;
            }
        }

        // --- 动画循环 ---
        let globalTime = 0;
        let animId = null;
        let lastTimestamp = performance.now();
        let frameCount = 0;

        function animate(now) {
            animId = requestAnimationFrame(animate);
            let dt = (now - lastTimestamp) / 1000;
            if (dt <= 0) dt = 0.016;
            if (dt > 0.2) dt = 0.2;
            lastTimestamp = now;
            globalTime += dt;

            try {
                updateAllLines(globalTime);
            } catch (e) { console.error(e); }

            // 相机自动环绕
            const camAngle = globalTime * 0.14 + 0.6;
            const camRadius = 4.8;
            const camY = 0.9 + 0.6 * Math.sin(0.26 * globalTime + 2.1);
            camera.position.set(
                camRadius * Math.sin(camAngle),
                camY,
                camRadius * Math.cos(camAngle)
            );
            camera.lookAt(0, 0, 0);

            stars.rotation.y += dt * 0.025;
            stars.rotation.x += dt * 0.01;
            renderer.render(scene, camera);
            frameCount++;
        }

        // --- 初始帧 ---
        function renderFirstFrame() {
            updateAllLines(0);
            camera.position.set(4.2, 0.8, 4.2);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        // --- 看门狗 ---
        let lastWatchFrame = 0;
        setInterval(() => {
            if (frameCount === lastWatchFrame && frameCount > 5) {
                console.warn('动画停滞，重启循环...');
                if (animId) cancelAnimationFrame(animId);
                lastTimestamp = performance.now();
                animId = requestAnimationFrame(animate);
            }
            lastWatchFrame = frameCount;
        }, 2000);

        // --- 窗口调整 ---
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // --- 启动 ---
        renderFirstFrame();
        setTimeout(() => {
            lastTimestamp = performance.now();
            animId = requestAnimationFrame(animate);
        }, 80);

        console.log('S³ 等角螺旋动画已启动');
    </script>
</body>
</html>
