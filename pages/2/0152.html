<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>磁流体尖刺</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="fluidCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('fluidCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                spikeDensity: 10,        // 每10像素一根尖刺
                maxSpikes: 220,          // 最大尖刺数量
                minHeight: 0.28,         // 尖刺最小高度（占屏幕高度比例）
                maxHeight: 0.72,         // 尖刺最大高度
                mouseAttractRadius: 200, // 鼠标吸引半径
                mouseAttractStrength: 0.15, // 吸引强度
                springConstant: 0.06,    // 弹簧常数
                damping: 0.88,           // 速度阻尼
                clickRepelRadius: 250,   // 点击排斥半径
                clickRepelStrength: 18,  // 点击排斥强度
                maxTipOffset: 130,       // 尖端最大水平偏移（像素）
                baseHue: 210,            // 基础色相（蓝）
                hueVariation: 40,        // 色相变化范围
                saturation: 90,
                lightnessBase: 45,       // 底部亮度
                lightnessTip: 85,        // 尖端亮度
                tipGlowSize: 2.8,        // 尖端光点大小
                lineWidth: 1.3,
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let spikes = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // ---------- 尖刺类 ----------
            class Spike {
                constructor(baseX, baseY, targetTipY, hue) {
                    this.baseX = baseX;
                    this.baseY = baseY; // 屏幕底部
                    this.originTipX = baseX + (Math.random() - 0.5) * 20; // 初始尖端X（微小偏移）
                    this.originTipY = targetTipY;
                    this.tipX = this.originTipX;
                    this.tipY = this.originTipY;
                    this.vx = 0;
                    this.vy = 0;
                    this.hue = hue;
                    this.saturation = CONFIG.saturation;
                    this.lightnessBase = CONFIG.lightnessBase;
                    this.lightnessTip = CONFIG.lightnessTip;
                    this.heightFactor = (targetTipY - baseY) / height; // 用于插值
                }

                // 更新尖端位置
                update(now, dt) {
                    // 目标位置默认为原始位置
                    let targetX = this.originTipX;
                    let targetY = this.originTipY;

                    // 鼠标吸引：尖端向鼠标方向弯曲
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = smoothMouseX - this.baseX;
                        const dy = smoothMouseY - this.baseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const influenceRadius = CONFIG.mouseAttractRadius;
                        if (dist < influenceRadius) {
                            // 吸引强度与距离成反比
                            const influence = (1 - dist / influenceRadius);
                            // 计算目标偏移：向鼠标方向偏移，但保持尖端在合理范围内
                            const maxOffset = CONFIG.maxTipOffset * influence;
                            const angle = Math.atan2(dy, dx);
                            const offX = Math.cos(angle) * maxOffset;
                            const offY = Math.sin(angle) * maxOffset * 0.4; // 垂直偏移少一些
                            targetX = this.baseX + offX;
                            targetY = this.originTipY + offY;
                        }
                    }

                    // 弹簧力向目标位置移动
                    const ax = (targetX - this.tipX) * CONFIG.springConstant;
                    const ay = (targetY - this.tipY) * CONFIG.springConstant;

                    this.vx += ax * dt;
                    this.vy += ay * dt;
                    this.vx *= CONFIG.damping;
                    this.vy *= CONFIG.damping;

                    this.tipX += this.vx * dt;
                    this.tipY += this.vy * dt;

                    // 限制水平偏移，防止过度扭曲
                    const maxOff = CONFIG.maxTipOffset * 1.2;
                    if (this.tipX < this.baseX - maxOff) this.tipX = this.baseX - maxOff;
                    if (this.tipX > this.baseX + maxOff) this.tipX = this.baseX + maxOff;
                    // 限制垂直范围，避免尖端低于底部或过高
                    if (this.tipY > this.baseY - 5) this.tipY = this.baseY - 5;
                    if (this.tipY < height * 0.05) this.tipY = height * 0.05;
                }

                // 绘制单根尖刺
                draw(ctx, time) {
                    const baseX = this.baseX;
                    const baseY = this.baseY;
                    const tipX = this.tipX;
                    const tipY = this.tipY;

                    // 二次贝塞尔控制点：在底部与尖端之间，产生自然弯曲
                    const controlX = (baseX + tipX) * 0.45 + (Math.sin(time * 0.8 + baseX * 0.01) * 5);
                    const controlY = (baseY + tipY) * 0.55;

                    // 创建从底部到尖端的渐变
                    const gradient = ctx.createLinearGradient(baseX, baseY, tipX, tipY);
                    const baseColor = `hsla(${this.hue}, ${this.saturation}%, ${this.lightnessBase}%, 0.4)`;
                    const tipColor = `hsla(${this.hue}, ${this.saturation}%, ${this.lightnessTip}%, 0.9)`;
                    gradient.addColorStop(0, baseColor);
                    gradient.addColorStop(1, tipColor);

                    ctx.beginPath();
                    ctx.moveTo(baseX, baseY);
                    ctx.quadraticCurveTo(controlX, controlY, tipX, tipY);
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = CONFIG.lineWidth + (this.heightFactor * 1.2);
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // 在尖端绘制光点
                    if (this.tipY < baseY - 10) {
                        const glowAlpha = 0.6 + Math.sin(time * 3 + baseX * 0.02) * 0.2;
                        ctx.beginPath();
                        ctx.arc(tipX, tipY, CONFIG.tipGlowSize + this.heightFactor * 1.8, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${this.hue}, 100%, 90%, ${glowAlpha})`;
                        ctx.fill();

                        // 小的高光
                        ctx.beginPath();
                        ctx.arc(tipX, tipY, CONFIG.tipGlowSize * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(0, 0%, 100%, 0.6)`;
                        ctx.fill();
                    }
                }
            }

            // ---------- 初始化尖刺数组 ----------
            function initSpikes() {
                spikes = [];
                const count = Math.min(CONFIG.maxSpikes, Math.floor(width / CONFIG.spikeDensity));
                const baseY = height;
                for (let i = 0; i < count; i++) {
                    // 均匀分布底部X，并加入微小随机偏移
                    const x = (i / (count - 1)) * width + (Math.random() - 0.5) * 8;
                    const clampedX = Math.max(0, Math.min(width, x));
                    const targetTipY = height * (CONFIG.minHeight + Math.random() * (CONFIG.maxHeight - CONFIG
                        .minHeight));
                    const hue = (CONFIG.baseHue + Math.random() * CONFIG.hueVariation) % 360;
                    spikes.push(new Spike(clampedX, baseY, targetTipY, hue));
                }
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                // 立即填充黑色背景，避免白屏
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);
                initSpikes();
                // 初始绘制一次
                drawSpikes(performance.now());
            }

            // ---------- 绘制所有尖刺 ----------
            function drawSpikes(now) {
                // 清屏为黑色
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                // 绘制微弱的背景光晕，增加层次
                if (mouseActive && smoothMouseX > -1000) {
                    const rad = 120;
                    const grad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY, rad);
                    grad.addColorStop(0, 'rgba(40, 60, 120, 0.12)');
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, rad, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制所有尖刺
                for (const spike of spikes) {
                    spike.draw(ctx, time);
                }
            }

            // ---------- 更新所有尖刺 ----------
            function updateSpikes(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                // 平滑鼠标位置
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.14;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.14;
                }

                // 更新每个尖刺
                for (const spike of spikes) {
                    spike.update(now, dt);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updateSpikes(now);
                drawSpikes(now);

                animationId = requestAnimationFrame(animate);
            }

            // ---------- 点击处理：产生排斥脉冲 ----------
            function handleClick(clientX, clientY) {
                // 对每个尖刺应用排斥力
                for (const spike of spikes) {
                    const dx = spike.tipX - clientX;
                    const dy = spike.tipY - clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.clickRepelRadius && dist > 0.01) {
                        const force = (1 - dist / CONFIG.clickRepelRadius) * CONFIG.clickRepelStrength;
                        // 方向为远离点击点
                        const angle = Math.atan2(dy, dx);
                        spike.vx += Math.cos(angle) * force;
                        spike.vy += Math.sin(angle) * force * 0.8;
                    }
                }
                // 同时给一个随机小扰动，增加活性
                for (const spike of spikes) {
                    spike.vx += (Math.random() - 0.5) * 1.5;
                    spike.vy += (Math.random() - 0.5) * 1.0;
                }
            }

            // ---------- 事件监听 ----------
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                // 触摸事件
                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 暴露调试接口
            window.__ferrofluid = {
                config: CONFIG,
                spikes: spikes,
            };
        })();
    </script>
</body>
</html>
