<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIST · 彩色烟雾</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b16;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            right: 32px;
            z-index: 2;
            text-align: right;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(230, 220, 255, 0.8);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 18px rgba(150, 120, 240, 0.5);
        }

        .hint {
            color: rgba(190, 180, 220, 0.5);
            font-size: 8px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
                right: 20px;
            }
            .title {
                font-size: 9px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 7px;
                letter-spacing: 0.25em;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <div class="title">Mist</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            // ─── 画布初始化 ───────────────────────────────────────────────
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let particles = [];
            let mouse = { x: -9999, y: -9999, active: false, vx: 0, vy: 0 };
            let time = 0;
            let colorShift = 0;          // 全局色相偏移
            let burstParticles = [];     // 点击释放的彩色烟团
            let clickHue = 200;          // 当前点击烟团的基础色相

            // ─── 性能参数 ───────────────────────────────────────────────
            const PARTICLE_COUNT = () => Math.max(200, Math.min(380, Math.floor(W * H / 3000)));

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                // 深色背景，避免白屏
                ctx.fillStyle = '#0b0b16';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 烟雾粒子类 ─────────────────────────────────────────────
            class MistParticle {
                constructor() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.size = 12 + Math.random() * 45;    // 直径
                    this.hue = 200 + Math.random() * 90;    // 蓝紫色系
                    this.saturation = 50 + Math.random() * 30;
                    this.lightness = 50 + Math.random() * 25;
                    this.alpha = 0.08 + Math.random() * 0.18; // 基础透明度
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.phase = Math.random() * Math.PI * 2;
                    this.floatSpeed = 0.15 + Math.random() * 0.3;
                    this.baseSize = this.size;
                    this.brightness = 0.5 + Math.random() * 0.4;
                }

                update(dt, mouse) {
                    // 基础漂浮
                    this.x += Math.sin(time * this.floatSpeed + this.phase) * 0.4;
                    this.y += Math.cos(time * this.floatSpeed * 0.8 + this.phase) * 0.3;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 鼠标排斥力
                    if (mouse.active) {
                        const dx = this.x - mouse.x;
                        const dy = this.y - mouse.y;
                        const distSq = dx * dx + dy * dy;
                        const radius = 180;
                        const radiusSq = radius * radius;
                        if (distSq < radiusSq && distSq > 0.01) {
                            const dist = Math.sqrt(distSq);
                            const force = (1 - dist / radius) * 1.8;
                            const normX = dx / dist;
                            const normY = dy / dist;
                            this.x += normX * force;
                            this.y += normY * force;
                            // 靠近鼠标时粒子稍微变小（压缩感）
                            this.size = this.baseSize * (0.75 + 0.25 * (dist / radius));
                        } else {
                            this.size += (this.baseSize - this.size) * 0.02;
                        }
                    } else {
                        this.size += (this.baseSize - this.size) * 0.02;
                    }

                    // 边界环绕
                    if (this.x < -60) this.x = W + 60;
                    if (this.x > W + 60) this.x = -60;
                    if (this.y < -60) this.y = H + 60;
                    if (this.y > H + 60) this.y = -60;
                }

                draw(ctx) {
                    const diameter = this.size * (0.8 + 0.4 * Math.sin(time * 1.5 + this.phase));
                    const radius = diameter / 2;
                    if (radius < 1) return;

                    const hue = this.hue + colorShift + Math.sin(time * 0.3 + this.phase) * 20;
                    const sat = this.saturation + Math.sin(time * 0.5 + this.phase) * 15;
                    const light = this.lightness + this.brightness * 10;

                    // 径向渐变模拟烟雾
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, radius);
                    gradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 15}%, ${this.alpha * 1.4})`);
                    gradient.addColorStop(0.4, `hsla(${hue}, ${sat}%, ${light}%, ${this.alpha})`);
                    gradient.addColorStop(0.8, `hsla(${hue}, ${sat}%, ${light - 10}%, ${this.alpha * 0.5})`);
                    gradient.addColorStop(1, 'transparent');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 初始化烟雾粒子 ─────────────────────────────────────────
            function initParticles() {
                const count = PARTICLE_COUNT();
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push(new MistParticle());
                }
            }

            // ─── 点击爆发彩色烟团 ──────────────────────────────────────
            function createBurst(x, y, hue) {
                const count = 15 + Math.floor(Math.random() * 15);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 0.8 + Math.random() * 2.5;
                    const size = 20 + Math.random() * 40;
                    burstParticles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        maxLife: 1.0,
                        decay: 0.008 + Math.random() * 0.012,
                        size: size,
                        hue: hue + Math.random() * 50 - 25,
                        sat: 60 + Math.random() * 30,
                        light: 55 + Math.random() * 30,
                        alpha: 0.25 + Math.random() * 0.3,
                    });
                }
                if (burstParticles.length > 250) {
                    burstParticles.splice(0, burstParticles.length - 250);
                }
            }

            function updateBurstParticles(dt) {
                for (let i = burstParticles.length - 1; i >= 0; i--) {
                    const p = burstParticles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                    p.life -= p.decay * dt;
                    if (p.life <= 0) {
                        burstParticles.splice(i, 1);
                    }
                }
            }

            function drawBurstParticles(ctx) {
                for (const p of burstParticles) {
                    const alpha = p.alpha * p.life;
                    const radius = p.size * p.life;
                    if (radius < 1) continue;
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
                    gradient.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${p.light + 15}%, ${alpha})`);
                    gradient.addColorStop(0.5, `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha * 0.7})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 100;
                const hue = 220 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 60%, 75%, 0.06)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 50%, 70%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.015;
                    const dtNorm = fixedStep / 1000 * 60;
                    for (const p of particles) {
                        p.update(dtNorm, mouse);
                    }
                    updateBurstParticles(dtNorm);
                }

                // 半透明清除，形成烟雾拖尾
                ctx.fillStyle = 'rgba(11, 11, 22, 0.22)';
                ctx.fillRect(0, 0, W, H);

                // 绘制烟雾粒子
                for (const p of particles) {
                    p.draw(ctx);
                }

                // 绘制爆发烟团
                drawBurstParticles(ctx);

                // 绘制鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                // 生成新烟团
                clickHue = 190 + Math.random() * 90;
                createBurst(mouse.x, mouse.y, clickHue);
                // 切换全局色相偏移
                colorShift += 25 + Math.random() * 35;
                if (colorShift > 120) colorShift = -30;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    clickHue = 190 + Math.random() * 90;
                    createBurst(mouse.x, mouse.y, clickHue);
                    colorShift += 25 + Math.random() * 35;
                    if (colorShift > 120) colorShift = -30;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                setupCanvas();
                // 调整粒子数量
                const targetCount = PARTICLE_COUNT();
                if (targetCount !== particles.length) {
                    while (particles.length < targetCount) {
                        particles.push(new MistParticle());
                    }
                    if (particles.length > targetCount) {
                        particles.length = targetCount;
                    }
                }
                burstParticles = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initParticles();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 确保初始背景填充
            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0b0b16';
                    ctx.fillRect(0, 0, W, H);
                }
            });

        })();
    </script>
</body>
</html>
