<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氢原子电子概率云 · Quantum Probability Cloud</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;}
  body{font-family:"SF Mono","JetBrains Mono",Consolas,Menlo,monospace;color:#9fe8ff;}
  canvas{display:block;position:fixed;inset:0;}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;top:26px;left:30px;z-index:10;pointer-events:none;

  }
  #hud h1{

  }
  #hud .en{
    font-size:10px;letter-spacing:2.6px;color:rgba(130,200,255,.55);
    margin-bottom:16px;text-transform:uppercase;
  }
  .eq{
    font-size:13.5px;letter-spacing:.5px;line-height:1.95;
    color:#a9e6ff;text-shadow:0 0 10px rgba(60,170,255,.55);

  input[type=range]{

          box-shadow:0 0 20px rgba(90,220,255,.55);}

<body>
<canvas id="c"></canvas>

<div id="hud">
  <h1>氢原子电子概率云</h1>
  <div class="en">Hydrogen Atom · Electron Probability Cloud</div>

  <div class="eq">iħ&nbsp;∂ψ/∂t&nbsp;=&nbsp;Ĥψ</div>
  <div class="eq">ψ<sub>nlm</sub>(r,θ,φ)&nbsp;=&nbsp;R<sub>nl</sub>(r)&nbsp;·&nbsp;Y<sub>lm</sub>(θ,φ)</div>
  <div class="eq"><span class="hl">|ψ<sub>nlm</sub>|²</span>&nbsp;=&nbsp;|R<sub>nl</sub>(r)|²&nbsp;·&nbsp;|Y<sub>lm</sub>(θ,φ)|²</div>
  <div class="eq dim" style="margin-top:6px">P(r)&nbsp;=&nbsp;r²|R<sub>nl</sub>(r)|²&nbsp;&nbsp;·&nbsp;&nbsp;dV&nbsp;=&nbsp;r²sinθ&nbsp;dr&nbsp;dθ&nbsp;dφ</div>

  <div id="stateLine">
    n = <span id="vn">3</span>&nbsp;&nbsp;l = <span id="vl">2</span>&nbsp;&nbsp;m = <span id="vm">0</span>

  </div>
</div>

<div id="panel">
  <div class="title">Quantum Numbers</div>

  <div class="row">
    <label>n <i>主量子数</i></label>

  </div>
  <div class="row">
    <label>l <i>角量子数</i></label>
    <input type="range" id="sl" min="0" max="2" step="1" value="2">

  </div>
  <div class="row">
    <label>m <i>磁量子数</i></label>
    <input type="range" id="sm" min="-2" max="2" step="1" value="0">

  <div class="btns">

</div>

<div id="hint">拖拽旋转 · 滚轮缩放 · 调节量子数切换轨道形态</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* =====================================================================
   一、量子力学数学部分
   ===================================================================== */

const FACT = new Float64Array(40);
FACT[0] = 1;
for (let i = 1; i < 40; i++) FACT[i] = FACT[i - 1] * i;
const fact = i => FACT[i] || 1;

/* 广义拉盖尔多项式 L_k^α(x) —— 递推 */
function laguerre(k, alpha, x) {
  if (k < 0) return 0;
  if (k === 0) return 1;
  let l0 = 1;
  let l1 = 1 + alpha - x;
  for (let i = 2; i <= k; i++) {
    const l2 = ((2 * i - 1 + alpha - x) * l1 - (i - 1 + alpha) * l0) / i;
    l0 = l1;
    l1 = l2;
  }
  return l1;
}

/* 氢原子径向波函数 R_nl(r)（原子单位 a₀ = 1） */
function radialR(n, l, r) {
  const rho = 2 * r / n;
  const norm = Math.sqrt(
    Math.pow(2 / n, 3) * fact(n - l - 1) / (2 * n * fact(n + l))
  );
  return norm * Math.exp(-rho / 2) * Math.pow(rho, l) * laguerre(n - l - 1, 2 * l + 1, rho);
}

/* 连带勒让德函数 P_l^m(x) */
function plm(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const s = Math.sqrt(Math.max(0, 1 - x * x));
    let f = 1;
    for (let i = 1; i <= m; i++) { pmm *= -f * s; f += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1;
    pmmp1 = pll;
  }
  return pll;
}

/* 实球谐函数 Y_lm(θ,φ)，传入 ct = cosθ */
function realY(l, m, ct, phi) {
  const am = Math.abs(m);
  const norm = Math.sqrt((2 * l + 1) / (4 * Math.PI) * fact(l - am) / fact(l + am));
  const P = plm(l, am, ct);
  if (m === 0) return norm * P;
  if (m > 0)  return Math.SQRT2 * norm * P * Math.cos(m * phi);
  return Math.SQRT2 * norm * P * Math.sin(am * phi);
}

/* =====================================================================
   二、按 |ψ|² 概率密度采样粒子
   ===================================================================== */
function buildData(n, l, m, count) {

  /* ---- 径向 CDF（用于逆变换采样 r） ---- */
  const rmax = 2.0 * n * n + 22;
  const NR = 2400;
  const dr = rmax / NR;
  const cdf = new Float64Array(NR + 1);
  const Rtab = new Float64Array(NR + 1);

  let acc = 0, prevP = 0;
  for (let i = 0; i <= NR; i++) {
    const r = i * dr;
    const R = radialR(n, l, r);
    Rtab[i] = R;
    const p = R * R * r * r;          // 径向概率密度 P(r) = r²|R|²
    if (i > 0) acc += (p + prevP) * 0.5 * dr;
    prevP = p;
    cdf[i] = acc;
  }
  if (acc <= 0) acc = 1;
  for (let i = 0; i <= NR; i++) cdf[i] /= acc;

  /* ---- 角向 |Y_lm|² 的数值最大值（用于拒绝采样） ---- */
  let maxY2 = 1e-20;
  const NA = 160;
  for (let i = 0; i <= NA; i++) {
    const ct = -1 + 2 * i / NA;
    for (let j = 0; j < NA; j++) {
      const phi = 2 * Math.PI * j / NA;
      const y = realY(l, m, ct, phi);
      const y2 = y * y;
      if (y2 > maxY2) maxY2 = y2;
    }
  }
  maxY2 *= 1.06;

  /* ---- 采样 ---- */
  const pos   = new Float32Array(count * 3);
  const rArr  = new Float32Array(count);
  const dArr  = new Float32Array(count);

  for (let i = 0; i < count; i++) {

    /* 逆 CDF 采样半径 r */
    const u = Math.random();
    let lo = 0, hi = NR;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (cdf[mid] < u) lo = mid + 1; else hi = mid;
    }
    const r = lo * dr;
    const R = Rtab[lo];

    /* 拒绝采样方向 (θ, φ)，使其服从 |Y_lm|² */
    let ct = 1, phi = 0, y2 = 0;
    for (let k = 0; k < 400; k++) {
      ct = 2 * Math.random() - 1;
      phi = 2 * Math.PI * Math.random();
      const yv = realY(l, m, ct, phi);
      y2 = yv * yv;
      if (y2 > Math.random() * maxY2) break;
    }

    const st = Math.sqrt(Math.max(0, 1 - ct * ct));
    pos[i * 3]     = r * st * Math.cos(phi);
    pos[i * 3 + 1] = r * ct;
    pos[i * 3 + 2] = r * st * Math.sin(phi);

    rArr[i] = r;
    dArr[i] = R * R * y2;              // ∝ |ψ|²
  }

  /* ---- 归一化到统一视觉尺度 ---- */
  const sorted = Float32Array.from(rArr).sort();
  const rRef = sorted[Math.floor(count * 0.97)] || 1;
  const scale = 7 / Math.max(rRef, 0.6);

  let maxD = 0;
  for (let i = 0; i < count; i++) if (dArr[i] > maxD) maxD = dArr[i];
  if (maxD <= 0) maxD = 1;

  /* ---- 颜色 / 尺寸 / 相位 ---- */
  const col    = new Float32Array(count * 3);
  const sizes  = new Float32Array(count);
  const phases = new Float32Array(count);
  const bright = new Float32Array(count);
  const c = new THREE.Color();

  const hueBase = (0.555 + 0.055 * l + 0.018 * n) % 1;

  for (let i = 0; i < count; i++) {
    pos[i * 3]     *= scale;
    pos[i * 3 + 1] *= scale;
    pos[i * 3 + 2] *= scale;

    const rn = Math.min(1, rArr[i] / (rRef * 1.15));       // 归一化半径
    const dn = Math.pow(dArr[i] / maxD, 0.28);             // 归一化密度

    const hue = (hueBase + 0.34 * rn + 0.035 * (Math.random() - 0.5) + 1) % 1;
    c.setHSL(hue, 0.94, 0.20 + 0.42 * dn);

    col[i * 3]     = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;

    sizes[i]  = (0.13 + 0.20 * Math.random()) * (0.55 + 0.95 * dn);
    phases[i] = Math.random() * Math.PI * 2;
    bright[i] = 0.32 + 0.80 * dn;
  }

  return { pos, col, sizes, phases, bright };
}

/* =====================================================================
   三、Three.js 场景
   ===================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.autoClear = false;                    // 手动控制清屏 → 形成拖尾

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 3000);

/* ---------- 拖尾渐隐层（每帧把上一帧压暗一点点） ---------- */
const fadeScene = new THREE.Scene();
const fadeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);
const fadeMat = new THREE.MeshBasicMaterial({
  color: 0x000000, transparent: true, opacity: 0.22,
  depthTest: false, depthWrite: false
});
fadeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fadeMat));

/* ---------- 星尘背景 ---------- */
(function stars() {
  const N = 1600;
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(N * 3);
  const c = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 140 + Math.random() * 420;
    const th = Math.acos(2 * Math.random() - 1);
    const ph = Math.random() * Math.PI * 2;
    p[i * 3]     = r * Math.sin(th) * Math.cos(ph);
    p[i * 3 + 1] = r * Math.cos(th);
    p[i * 3 + 2] = r * Math.sin(th) * Math.sin(ph);
    const b = 0.05 + Math.random() * 0.22;
    c[i * 3]     = b * 0.55;
    c[i * 3 + 1] = b * 0.85;
    c[i * 3 + 2] = b * 1.0;
  }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  const m = new THREE.PointsMaterial({
    size: 1.7, vertexColors: true, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: false
  });
  scene.add(new THREE.Points(g, m));
})();

/* =====================================================================
   四、粒子材质（ShaderMaterial）
   ===================================================================== */
const pointMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime:      { value: 0 },
    uSizeScale: { value: 300 * Math.min(window.devicePixelRatio, 2) },
    uOpacity:   { value: 0.45 }
  },
  vertexShader: /* glsl */`
    attribute float aSize;
    attribute vec3  aColor;
    attribute float aPhase;
    attribute float aBright;

    uniform float uTime;
    uniform float uSizeScale;

    varying vec3  vColor;
    varying float vBright;

    void main() {
      /* 呼吸脉冲：整团云雾轻微胀缩 + 每个粒子独立相位 */
      float breath = 1.0 + 0.030 * sin(uTime * 0.80 + aPhase * 0.35);
      vec3 p = position * breath;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);

      float sizePulse = 1.0 + 0.18 * sin(uTime * 0.80 + 0.6);
      gl_PointSize = aSize * uSizeScale * sizePulse / max(0.001, -mv.z);
      gl_PointSize = clamp(gl_PointSize, 0.5, 46.0);

      gl_Position = projectionMatrix * mv;

      vColor  = aColor;
      vBright = aBright;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3  vColor;
    varying float vBright;
    uniform float uOpacity;

    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d2 = dot(uv, uv);
      if (d2 > 0.25) discard;

      float a = 1.0 - d2 * 4.0;          // 柔和圆形衰减
      a = a * a;

      float core = pow(max(0.0, 1.0 - d2 * 15.0), 2.0);   // 亮核

      vec3 col = vColor * (0.55 + 1.5 * core) * vBright;
      gl_FragColor = vec4(col, a * uOpacity);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthTest: false,
  depthWrite: false
});

/* =====================================================================
   五、状态与重建
   ===================================================================== */
const state = { n: 3, l: 2, m: 0 };
let pointsMesh = null;
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);

const PARTICLE_COUNT = 45000;

function rebuild() {
  if (pointsMesh) {
    cloudGroup.remove(pointsMesh);
    pointsMesh.geometry.dispose();
    pointsMesh = null;
  }

  const { pos, col, sizes, phases, bright } = buildData(state.n, state.l, state.m, PARTICLE_COUNT);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor',  new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize',   new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aPhase',  new THREE.BufferAttribute(phases, 1));
  geo.setAttribute('aBright', new THREE.BufferAttribute(bright, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 40);

  pointsMesh = new THREE.Points(geo, pointMaterial);
  pointsMesh.frustumCulled = false;
  cloudGroup.add(pointsMesh);
}

/* =====================================================================
   六、UI
   ===================================================================== */
const sn = document.getElementById('sn');
const sl = document.getElementById('sl');
const sm = document.getElementById('sm');
const vn = document.getElementById('vn');
const vl = document.getElementById('vl');
const vm = document.getElementById('vm');
const orbName = document.getElementById('orbName');

const ORB = ['s', 'p', 'd', 'f', 'g', 'h'];

function clampState() {
  if (state.n < 1) state.n = 1;
  if (state.n > 6) state.n = 6;
  if (state.l > state.n - 1) state.l = state.n - 1;
  if (state.l < 0) state.l = 0;
  if (state.m > state.l) state.m = state.l;
  if (state.m < -state.l) state.m = -state.l;
}

function syncUI() {
  sn.value = state.n;
  sl.max = state.n - 1;
  sl.value = state.l;
  sm.min = -state.l;
  sm.max = state.l;
  sm.value = state.m;

  vn.textContent = state.n;
  vl.textContent = state.l;
  vm.textContent = state.m;

  const pm = state.m === 0 ? '' : (state.m > 0 ? '+' + state.m : state.m);
  orbName.textContent = state.n + ORB[state.l] + (pm ? ' ' + pm : '');
}

function apply() {
  clampState();
  syncUI();
  rebuild();
  tuneAudio();
}

sn.addEventListener('input', () => { state.n = +sn.value; apply(); });
sl.addEventListener('input', () => { state.l = +sl.value; apply(); });
sm.addEventListener('input', () => { state.m = +sm.value; apply(); });

/* 自动旋转按钮 */
let autoRotate = true;
const btnRot = document.getElementById('btnRot');
btnRot.addEventListener('click', () => {
  autoRotate = !autoRotate;
  btnRot.classList.toggle('on', autoRotate);
});

/* =====================================================================
   七、相机控制
   ===================================================================== */
let yaw = 0.65, pitch = 0.32, dist = 20;
let dragging = false, lastX = 0, lastY = 0;

function updateCamera() {
  const cp = Math.cos(pitch);
  camera.position.set(
    dist * cp * Math.sin(yaw),
    dist * Math.sin(pitch),
    dist * cp * Math.cos(yaw)
  );
  camera.lookAt(0, 0, 0);
}

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  yaw -= dx * 0.006;
  pitch += dy * 0.005;
  pitch = Math.max(-1.45, Math.min(1.45, pitch));
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  dist *= (1 + Math.sign(e.deltaY) * 0.08);
  dist = Math.max(7, Math.min(70, dist));
}, { passive: false });

/* =====================================================================
   八、科技感背景音效（Web Audio 合成）
   ===================================================================== */
let audio = null;

function initAudio() {
  if (audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();

  const master = ctx.createGain();
  master.gain.value = 0.0001;
  master.connect(ctx.destination);

  /* 主低通滤波 */
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 620;
  lp.Q.value = 1.6;
  lp.connect(master);

  /* 低频持续和声（微失谐 drone） */
  const base = [55, 82.41, 110, 164.81, 220, 329.63, 440];
  base.forEach((f, i) => {
    const o = ctx.createOscillator();
    o.type = i < 2 ? 'sine' : (i < 5 ? 'triangle' : 'sine');
    o.frequency.value = f * (1 + (Math.random() - 0.5) * 0.004);
    o.detune.value = (Math.random() - 0.5) * 12;

    const g = ctx.createGain();
    g.gain.value = 0.16 / (1 + i * 0.85);

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.028 + i * 0.017;
    const lg = ctx.createGain();
    lg.gain.value = f * 0.0045;
    lfo.connect(lg);
    lg.connect(o.frequency);
    lfo.start();

    o.connect(g);
    g.connect(lp);
    o.start();
  });

  /* 空气感噪底 */
  const nlen = Math.floor(ctx.sampleRate * 3);
  const nbuf = ctx.createBuffer(1, nlen, ctx.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) nd[i] = (Math.random() * 2 - 1) * 0.6;
  const noise = ctx.createBufferSource();
  noise.buffer = nbuf;
  noise.loop = true;

  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 1600;
  bp.Q.value = 1.1;
  const ng = ctx.createGain();
  ng.gain.value = 0.018;
  noise.connect(bp); bp.connect(ng); ng.connect(master);
  noise.start();

  /* 随机闪烁脉冲（科技感"数据流"点缀） */
  const shimmer = ctx.createOscillator();
  shimmer.type = 'sine';
  shimmer.frequency.value = 880;
  const sg = ctx.createGain();
  sg.gain.value = 0;
  shimmer.connect(sg);
  sg.connect(master);
  shimmer.start();

  let alive = true;
  function pulse() {
    if (!alive) return;
    const t = ctx.currentTime;
    const scale = [0, 2, 4, 5, 7, 9, 11, 12];
    const semi = scale[Math.floor(Math.random() * scale.length)];
    const f = 660 * Math.pow(2, semi / 12) / 2;
    shimmer.frequency.setValueAtTime(f, t);
    sg.gain.cancelScheduledValues(t);
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(0.030, t + 0.04);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    setTimeout(pulse, 900 + Math.random() * 2800);
  }
  setTimeout(pulse, 1200);

  master.gain.exponentialRampToValueAtTime(0.55, ctx.currentTime + 4.5);

  audio = { ctx, master, lp, bp, sg, alive: true };
}

function tuneAudio() {
  if (!audio) return;
  const t = audio.ctx.currentTime;
  const cut = 420 + state.n * 190 + state.l * 130;
  audio.lp.frequency.setTargetAtTime(cut, t, 0.5);
  audio.bp.frequency.setTargetAtTime(900 + state.l * 520, t, 0.5);
  /* 磁量子数略微改变脉冲音高 */
  const f = 440 * Math.pow(2, (state.m * 2 + state.n) / 12);
  if (audio.sg) audio.sg.gain.setTargetAtTime(0.0, t, 0.2);
}

const btnAudio = document.getElementById('btnAudio');
let audioOn = false;
btnAudio.addEventListener('click', () => {
  if (!audio) initAudio();
  if (!audio) return;
  if (audio.ctx.state === 'suspended') audio.ctx.resume();

  audioOn = !audioOn;
  const t = audio.ctx.currentTime;
  audio.master.gain.cancelScheduledValues(t);
  audio.master.gain.setTargetAtTime(audioOn ? 0.55 : 0.0001, t, 0.6);
  btnAudio.classList.toggle('on', audioOn);
  btnAudio.textContent = audioOn ? '🔊 音效' : '🔇 静音';
});

/* 首次任意点击自动尝试唤醒音频上下文（保持静音直到用户开启） */
window.addEventListener('pointerdown', () => {
  if (!audio) initAudio();
  if (audio && audio.ctx.state === 'suspended') audio.ctx.resume();
}, { once: true });

/* =====================================================================
   九、主循环
   ===================================================================== */
const clock = new THREE.Clock();
let t = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  if (autoRotate && !dragging) yaw += dt * 0.13;
  updateCamera();

  pointMaterial.uniforms.uTime.value = t;
  pointMaterial.uniforms.uOpacity.value = 0.40 + 0.12 * Math.sin(t * 0.9 + 1.2);

  /* 云雾整体缓慢自转，增强立体感 */
  cloudGroup.rotation.y += dt * 0.035;
  cloudGroup.rotation.x = Math.sin(t * 0.18) * 0.08;

  /* 拖尾：先用半透明黑覆盖上一帧，再叠加新粒子 */
  renderer.render(fadeScene, fadeCam);
  renderer.render(scene, camera);
}

/* 窗口尺寸 */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  pointMaterial.uniforms.uSizeScale.value = 300 * Math.min(window.devicePixelRatio, 2);
});

/* 启动 */
apply();
updateCamera();
animate();
</script>
