<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极光星尘 · 物理粒子</title>
    <style>
        /* 页面极简风格，让 canvas 成为绝对主角 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0b0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .container {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            background: #0a0b0f;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 600px;
            cursor: grab;
            background: radial-gradient(ellipse at 50% 50%, #11131f, #07080c);
        }
        canvas:active {
            cursor: grabbing;
        }
        /* 底部水印 — 保留氛围 */
        .credit {
            position: absolute;
            bottom: 20px;
            right: 28px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
            pointer-events: none;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .credit span {
            color: rgba(180, 220, 255, 0.25);
        }
        /* 左上角小提示 — 交互引导 */
        .hint {
            position: absolute;
            top: 20px;
            left: 28px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.5px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .hint i {
            font-style: normal;
            display: inline-block;
            animation: pulse 2.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }
        @media (max-width: 1024px) {
            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1000 / 600;
            }
            .credit,
            .hint {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="canvas" width="1000" height="600"></canvas>
        <div class="hint"><i>✦ 鼠标拖动 · 粒子随动</i></div>
        <div class="credit">vibe <span>·</span> code</div>
    </div>

    <script>
        // ============================================================
        //  极光星尘 · 物理粒子系统
        //  核心机制： 粒子带有速度、加速度、弹簧惯性，
        //  并受鼠标引力 / 斥力影响，形成流动的「极光」质感。
        // ============================================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const W = 1000,
            H = 600;

        // ---------- 可调参数 ----------
        const PARTICLE_COUNT = 320; // 粒子数量
        const BASE_SPEED = 0.6; // 基础漂移速度
        const SPRING_FORCE = 0.012; // 弹簧回复力 (将粒子拉向路径)
        const MOUSE_RADIUS = 130; // 鼠标影响半径
        const MOUSE_FORCE = 0.8; // 鼠标引力 / 斥力强度
        const TRAIL_LENGTH = 0.12; // 拖尾长度 (0~1)
        const GLOW_SIZE = 5.5; // 发光强度

        // ---------- 状态 ----------
        let mouse = { x: -9999, y: -9999, active: false };
        let time = 0;

        // ---------- 粒子类 ----------
        class Particle {
            constructor(index) {
                this.index = index;

                // 位置 —— 初始分布在画布上
                this.x = Math.random() * W;
                this.y = Math.random() * H;

                // 速度
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;

                // 路径偏移量 —— 每个粒子沿着不同的正弦曲线游走
                this.phase = Math.random() * Math.PI * 2;
                this.freq = 0.4 + Math.random() * 0.6; // 波动频率
                this.amp = 12 + Math.random() * 28; // 波动幅度
                this.baseX = this.x;
                this.baseY = this.y;

                // 颜色 —— HSL 色相在 蓝紫 → 粉 → 青 之间循环
                this.hueBase = 220 + Math.random() * 80; // 220~300 (蓝紫到粉紫)
                this.hueOffset = 0;
                this.size = 2.2 + Math.random() * 3.2;
                this.life = 0.6 + Math.random() * 0.4;

                // 专属拖尾历史
                this.trail = [];
                this.trailMax = 8;
            }

            // 更新物理状态
            update(delta) {
                // 1) 路径目标： 用正弦波产生流动感
                const waveX = Math.sin(time * 0.012 + this.phase) * this.amp * 0.4;
                const waveY = Math.cos(time * 0.009 + this.phase * 1.3) * this.amp * 0.3;

                // 每个粒子有一个「锚点」在画布上缓慢漂移
                const driftX = Math.sin(time * 0.003 + this.index * 0.01) * 60;
                const driftY = Math.cos(time * 0.004 + this.index * 0.008) * 40;

                // 目标位置 = 初始位置 + 波动 + 漂移
                const targetX = this.baseX + waveX + driftX;
                const targetY = this.baseY + waveY + driftY;

                // 2) 弹簧力： 将粒子拉向目标 (模拟弹性)
                const dxTarget = targetX - this.x;
                const dyTarget = targetY - this.y;
                this.vx += dxTarget * SPRING_FORCE;
                this.vy += dyTarget * SPRING_FORCE;

                // 3) 鼠标交互： 引力 / 斥力
                if (mouse.active) {
                    const dxMouse = mouse.x - this.x;
                    const dyMouse = mouse.y - this.y;
                    const dist = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                    if (dist < MOUSE_RADIUS && dist > 0.5) {
                        const force = (1 - dist / MOUSE_RADIUS) * MOUSE_FORCE;
                        // 向左拖动 → 粒子跟随 (引力)
                        this.vx += (dxMouse / dist) * force * 0.18;
                        this.vy += (dyMouse / dist) * force * 0.18;
                        // 靠近鼠标时增加一点排斥，产生环绕感
                        if (dist < 40) {
                            const repel = (1 - dist / 40) * 0.6;
                            this.vx -= (dxMouse / dist) * repel * 0.3;
                            this.vy -= (dyMouse / dist) * repel * 0.3;
                        }
                    }
                }

                // 4) 阻尼 (防止失控)
                this.vx *= 0.97;
                this.vy *= 0.97;

                // 5) 速度限制
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > 6) {
                    this.vx = (this.vx / speed) * 6;
                    this.vy = (this.vy / speed) * 6;
                }

                // 6) 更新位置
                this.x += this.vx;
                this.y += this.vy;

                // 7) 边界回弹 (带能量损失)
                if (this.x < 0) { this.x = 0;
                    this.vx *= -0.5; }
                if (this.x > W) { this.x = W;
                    this.vx *= -0.5; }
                if (this.y < 0) { this.y = 0;
                    this.vy *= -0.5; }
                if (this.y > H) { this.y = H;
                    this.vy *= -0.5; }

                // 8) 颜色微移 —— 色相随时间缓慢变化
                this.hueOffset = Math.sin(time * 0.005 + this.index * 0.02) * 20;

                // 9) 记录拖尾
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailMax) {
                    this.trail.shift();
                }
            }

            // 绘制粒子 (带发光和拖尾)
            draw() {
                const hue = this.hueBase + this.hueOffset;
                const sat = 80 + Math.sin(time * 0.01 + this.index) * 10;
                const lig = 60 + Math.sin(time * 0.008 + this.index * 0.5) * 15;

                // ---- 拖尾 ----
                const trailLen = this.trail.length;
                if (trailLen > 1) {
                    for (let i = 1; i < trailLen; i++) {
                        const t = i / trailLen;
                        const alpha = t * 0.35 * this.life;
                        const radius = this.size * t * 0.7;
                        ctx.beginPath();
                        ctx.arc(this.trail[i].x, this.trail[i].y, radius, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${hue + 10 * t}, ${sat}%, ${lig + 10 * t}%, ${alpha})`;
                        ctx.fill();
                    }
                }

                // ---- 主体 (发光圆点) ----
                const gradient = ctx.createRadialGradient(
                    this.x - this.size * 0.2, this.y - this.size * 0.2, 0.5,
                    this.x, this.y, this.size * 2.6
                );
                gradient.addColorStop(0, `hsla(${hue}, ${sat + 10}%, ${lig + 25}%, 1)`);
                gradient.addColorStop(0.4, `hsla(${hue + 5}, ${sat}%, ${lig}%, 0.9)`);
                gradient.addColorStop(1, `hsla(${hue + 15}, ${sat - 10}%, ${lig - 20}%, 0)`);

                ctx.shadowColor = `hsla(${hue}, 100%, 70%, ${0.3 * this.life})`;
                ctx.shadowBlur = GLOW_SIZE * this.size * 0.9;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 1.2, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // ---- 核心高光 ----
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(this.x - this.size * 0.15, this.y - this.size * 0.15, this.size * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(0, 0%, 100%, ${0.5 * this.life})`;
                ctx.fill();

                // 重置阴影
                ctx.shadowBlur = 0;
            }
        }

        // ---------- 初始化粒子 ----------
        const particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const p = new Particle(i);
            // 让粒子在画布上均匀分布，但带一点随机偏移
            const cols = Math.ceil(Math.sqrt(PARTICLE_COUNT));
            const rows = Math.ceil(PARTICLE_COUNT / cols);
            const cellW = W / cols;
            const cellH = H / rows;
            const col = i % cols;
            const row = Math.floor(i / cols);
            p.baseX = col * cellW + cellW / 2 + (Math.random() - 0.5) * cellW * 0.6;
            p.baseY = row * cellH + cellH / 2 + (Math.random() - 0.5) * cellH * 0.6;
            p.x = p.baseX;
            p.y = p.baseY;
            particles.push(p);
        }

        // ---------- 鼠标事件 ----------
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouse.x = (e.clientX - rect.left) * scaleX;
            mouse.y = (e.clientY - rect.top) * scaleY;
            mouse.active = true;
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        // 触摸支持
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouse.x = (touch.clientX - rect.left) * scaleX;
            mouse.y = (touch.clientY - rect.top) * scaleY;
            mouse.active = true;
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            mouse.active = false;
        });

        // ---------- 动画循环 ----------
        function animate(timestamp) {
            time = timestamp || 0;

            // 半透明覆盖实现拖尾效果 (运动模糊)
            ctx.fillStyle = 'rgba(7, 8, 12, 0.18)';
            ctx.fillRect(0, 0, W, H);

            // 更新 & 绘制所有粒子
            for (const p of particles) {
                p.update(1);
                p.draw();
            }

            // ---- 额外氛围： 微弱星点 (背景闪烁) ----
            if (Math.random() < 0.06) {
                const sx = Math.random() * W;
                const sy = Math.random() * H;
                const sr = 0.6 + Math.random() * 1.2;
                const alpha = 0.15 + Math.random() * 0.25;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            }

            // ---- 鼠标位置光晕 (氛围指示) ----
            if (mouse.active) {
                const grad = ctx.createRadialGradient(
                    mouse.x, mouse.y, 0,
                    mouse.x, mouse.y, MOUSE_RADIUS * 1.2
                );
                grad.addColorStop(0, 'rgba(180, 200, 255, 0.04)');
                grad.addColorStop(0.5, 'rgba(120, 150, 255, 0.02)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.shadowBlur = 0;
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, MOUSE_RADIUS * 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        // 启动动画
        animate(0);

        // ---------- 窗口自适应 ----------
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxW = window.innerWidth - 40;
            const maxH = window.innerHeight - 40;
            const ratio = canvas.width / canvas.height;
            let w = Math.min(1000, maxW);
            let h = w / ratio;
            if (h > maxH) {
                h = maxH;
                w = h * ratio;
            }
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 小提示： 控制台可调整参数
        console.log('✦ 极光星尘 · 物理粒子系统');
        console.log('可调参数: PARTICLE_COUNT, MOUSE_RADIUS, MOUSE_FORCE, SPRING_FORCE');
        console.log('试试修改这些变量 (在控制台) 来改变效果！');
    </script>
</body>
</html>
