<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAM环面 · 准周期编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>KAM环面 · 准周期编织</h2>
        <div class="sub">KAM tori · Quasiperiodic foliations · Irrational frequency ratios</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">T₁: ω=√2</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">T₂: ω=√3</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">T₃: ω=π</span>
            <span class="formula-sep">‖</span>
            <span class="clr-gold">T₄: ω=φ</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.6, 2.8, 8.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        let elapsed = 0;
        function tick() { elapsed = (performance.now() - startTime) * 0.001; return elapsed; }

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // ---- KAM环面族：不同主半径R和小半径r的嵌套环面 ----
        // 定义4个嵌套环面，依次由内到外
        const torusParams = [
            { R: 1.8, r: 0.42, omega: Math.sqrt(2), color: COLOR_GOLD, opacity: 0.65 },
            { R: 2.3, r: 0.50, omega: Math.sqrt(3), color: COLOR_CYAN, opacity: 0.65 },
            { R: 2.8, r: 0.56, omega: Math.PI, color: COLOR_MAGENTA, opacity: 0.65 },
            { R: 3.3, r: 0.48, omega: (1 + Math.sqrt(5)) / 2, color: COLOR_GOLD, opacity: 0.60 }
        ];

        function torusPoint(R, r, u, v) {
            const rho = R + r * Math.cos(v);
            return new THREE.Vector3(
                rho * Math.cos(u),
                rho * Math.sin(u),
                r * Math.sin(v)
            );
        }

        // 生成单个环面上的测地线族
        function createTorusGeodesics(R, r, omega, color, opacity, count, uRange, steps) {
            const group = new THREE.Group();
            for (let i = 0; i < count; i++) {
                const phi0 = i * 2 * Math.PI / count;
                const pts = [];
                const du = uRange / steps;
                for (let j = 0; j <= steps; j++) {
                    const u = j * du;
                    const v = omega * u + phi0;
                    pts.push(torusPoint(R, r, u, v));
                }
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 额外：经线和纬线作为辅助网格
        function createMeridians(R, r, count, color, opacity) {
            const group = new THREE.Group();
            const steps = 200;
            for (let i = 0; i < count; i++) {
                const u0 = i * 2 * Math.PI / count;
                const pts = [];
                const dv = 2 * Math.PI / steps;
                for (let j = 0; j <= steps; j++) {
                    pts.push(torusPoint(R, r, u0, j * dv));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        function createParallels(R, r, count, color, opacity) {
            const group = new THREE.Group();
            const steps = 200;
            for (let i = 0; i < count; i++) {
                const v0 = i * 2 * Math.PI / count;
                const pts = [];
                const du = 2 * Math.PI / steps;
                for (let j = 0; j <= steps; j++) {
                    pts.push(torusPoint(R, r, j * du, v0));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'kam-tori';
        scene.add(rootGroup);

        const uRange = 16 * Math.PI;
        const steps = 520;
        const geodesicCount = 10; // 每个环面上测地线轨道数

        torusParams.forEach(({ R, r, omega, color, opacity }) => {
            // 测地线
            rootGroup.add(createTorusGeodesics(R, r, omega, color, opacity, geodesicCount, uRange, steps));
            // 经线（淡色）
            rootGroup.add(createMeridians(R, r, 16, color, opacity * 0.35));
            // 纬线（淡色）
            rootGroup.add(createParallels(R, r, 16, color, opacity * 0.30));
        });

        // 额外星点环：在环面之间的空隙添加一些稀疏星点
        const extraStarsGroup = new THREE.Group();
        const extraGeom = new THREE.BufferGeometry();
        const extraCount = 300;
        const extraPos = new Float32Array(extraCount * 3);
        for (let i = 0; i < extraCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 1.2 + Math.random() * 4.5;
            extraPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            extraPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            extraPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        extraGeom.setAttribute('position', new THREE.BufferAttribute(extraPos, 3));
        extraStarsGroup.add(new THREE.Points(extraGeom, new THREE.PointsMaterial({
            color: 0x807868, size: 0.012, transparent: true, opacity: 0.45, depthWrite: false
        })));
        scene.add(extraStarsGroup);

        console.log('KAM环面线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 600;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 动画循环
        function animate() {
            tick();
            const t = elapsed;
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.27;
            rootGroup.rotation.z = t * 0.11;
            extraStarsGroup.rotation.x = t * 0.06;
            extraStarsGroup.rotation.y = t * 0.09;
            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 8.0;
            const camAngle = t * 0.09;
            const camHeight = 2.9 + Math.sin(t * 0.16) * 0.8;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保画面立即出现
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ KAM环面准周期编织动画已稳定运行');
    </script>
</body>
</html>
