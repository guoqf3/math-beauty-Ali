<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOIRÉ · 莫列波纹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a14;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(235, 230, 255, 0.8);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(150, 130, 240, 0.5);
        }

        .hint {
            color: rgba(190, 180, 220, 0.5);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.22em;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">Moiré</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let mouse = { x: -9999, y: -9999, active: false };
            let time = 0;
            let patternIndex = 0;
            let patternCanvas1, patternCanvas2;
            let pattern1, pattern2;
            let particles = [];
            let burstParticles = [];

            const patternSize = 256;
            const patternTypes = ['circles', 'grid', 'dots', 'waves'];
            const hueOffsets = [0, 40, 80, 140, 200, 260, 320];

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0a0a14';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 创建图案画布 ───────────────────────────────────────────
            function createPatternCanvas(type, hueOffset, rotation) {
                const c = document.createElement('canvas');
                c.width = patternSize;
                c.height = patternSize;
                const cctx = c.getContext('2d');
                cctx.clearRect(0, 0, patternSize, patternSize);

                if (rotation) {
                    cctx.translate(patternSize / 2, patternSize / 2);
                    cctx.rotate(rotation);
                    cctx.translate(-patternSize / 2, -patternSize / 2);
                }

                const half = patternSize / 2;
                const hueShift = hueOffset;

                switch (type) {
                    case 'circles':
                        const maxR = patternSize * 0.75;
                        const circleStep = 7;
                        for (let r = 0; r < maxR; r += circleStep) {
                            const hue = (hueShift + r * 3) % 360;
                            cctx.strokeStyle = `hsla(${hue}, 65%, 60%, 0.35)`;
                            cctx.lineWidth = 1.8;
                            cctx.beginPath();
                            cctx.arc(half, half, r, 0, Math.PI * 2);
                            cctx.stroke();
                        }
                        break;

                    case 'grid':
                        const gridSpacing = 18;
                        for (let i = 0; i <= patternSize; i += gridSpacing) {
                            const hue = (hueShift + i * 2.5) % 360;
                            cctx.strokeStyle = `hsla(${hue}, 65%, 60%, 0.32)`;
                            cctx.lineWidth = 0.8;
                            cctx.beginPath();
                            cctx.moveTo(i, 0);
                            cctx.lineTo(i, patternSize);
                            cctx.stroke();
                            cctx.beginPath();
                            cctx.moveTo(0, i);
                            cctx.lineTo(patternSize, i);
                            cctx.stroke();
                        }
                        break;

                    case 'dots':
                        const dotSpacing = 14;
                        for (let y = 0; y < patternSize; y += dotSpacing) {
                            for (let x = 0; x < patternSize; x += dotSpacing) {
                                const hue = (hueShift + x * 4 + y * 4) % 360;
                                cctx.fillStyle = `hsla(${hue}, 70%, 62%, 0.4)`;
                                cctx.beginPath();
                                cctx.arc(x, y, 2.8, 0, Math.PI * 2);
                                cctx.fill();
                            }
                        }
                        break;

                    case 'waves':
                        for (let y = 0; y < patternSize; y += 12) {
                            const hue = (hueShift + y * 3) % 360;
                            cctx.strokeStyle = `hsla(${hue}, 65%, 60%, 0.3)`;
                            cctx.lineWidth = 0.9;
                            cctx.beginPath();
                            for (let x = 0; x <= patternSize; x += 4) {
                                const waveY = y + Math.sin(x * 0.04) * 7;
                                if (x === 0) cctx.moveTo(x, waveY);
                                else cctx.lineTo(x, waveY);
                            }
                            cctx.stroke();
                        }
                        break;
                }
                return c;
            }

            // ─── 更新图案 ───────────────────────────────────────────────
            function updatePatterns() {
                const type = patternTypes[patternIndex];
                const hue1 = hueOffsets[patternIndex % hueOffsets.length];
                const hue2 = (hue1 + 25) % 360;

                const rot1 = 0;
                const rot2 = patternIndex === 0 ? 0 : (patternIndex === 1 ? Math.PI / 4 : Math.PI / 6);

                patternCanvas1 = createPatternCanvas(type, hue1, rot1);
                patternCanvas2 = createPatternCanvas(type, hue2, rot2);

                pattern1 = ctx.createPattern(patternCanvas1, 'repeat');
                pattern2 = ctx.createPattern(patternCanvas2, 'repeat');
            }

            // ─── 初始化飘浮粒子 ─────────────────────────────────────────
            function initParticles() {
                const count = Math.floor(W * H / 18000);
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: 0.8 + Math.random() * 1.5,
                        hue: 220 + Math.random() * 80,
                        brightness: 0.3 + Math.random() * 0.5,
                        phase: Math.random() * Math.PI * 2,
                    });
                }
            }

            // ─── 创建爆发粒子 ───────────────────────────────────────────
            function createBurst(x, y) {
                const count = 20 + Math.floor(Math.random() * 20);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 5;
                    burstParticles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 0.6 + Math.random() * 0.5,
                        maxLife: 1.1,
                        size: 1 + Math.random() * 2.5,
                        hue: 200 + Math.random() * 100,
                        alpha: 0.8,
                    });
                }
                if (burstParticles.length > 150) {
                    burstParticles.splice(0, burstParticles.length - 150);
                }
            }

            function updateBurstParticles(dt) {
                for (let i = burstParticles.length - 1; i >= 0; i--) {
                    const p = burstParticles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                    p.life -= 0.022 * dt;
                    if (p.life <= 0) burstParticles.splice(i, 1);
                }
            }

            function drawBurstParticles(ctx) {
                for (const p of burstParticles) {
                    const alpha = p.life * p.alpha;
                    const size = p.size * p.life;
                    ctx.fillStyle = `hsla(${p.hue}, 75%, 70%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 70;
                const hue = 240 + time * 10;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 60%, 75%, 0.06)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.015;
                    const dtNorm = fixedStep / 1000 * 60;
                    // 更新飘浮粒子
                    for (const p of particles) {
                        p.x += p.vx * dtNorm;
                        p.y += p.vy * dtNorm;
                        p.vx += Math.sin(time + p.phase) * 0.01;
                        p.vy += Math.cos(time * 0.8 + p.phase) * 0.01;
                        if (p.x < -10) p.x = W + 10;
                        if (p.x > W + 10) p.x = -10;
                        if (p.y < -10) p.y = H + 10;
                        if (p.y > H + 10) p.y = -10;
                    }
                    updateBurstParticles(dtNorm);
                }

                // 清除画布
                ctx.fillStyle = '#0a0a14';
                ctx.fillRect(0, 0, W, H);

                // 计算图案偏移
                let offsetX = mouse.active ? mouse.x : W / 2;
                let offsetY = mouse.active ? mouse.y : H / 2;
                // 自动缓慢移动
                const autoShiftX = Math.sin(time * 0.3) * 40;
                const autoShiftY = Math.cos(time * 0.25) * 40;
                offsetX += autoShiftX;
                offsetY += autoShiftY;

                // 绘制图案1（固定偏移，带缓慢自动移动）
                ctx.save();
                ctx.globalAlpha = 0.8;
                ctx.fillStyle = pattern1;
                const shift1X = autoShiftX * 0.5;
                const shift1Y = autoShiftY * 0.5;
                ctx.translate(shift1X, shift1Y);
                ctx.fillRect(-shift1X, -shift1Y, W + patternSize, H + patternSize);
                ctx.restore();

                // 绘制图案2（鼠标控制偏移，混合模式）
                ctx.save();
                ctx.globalAlpha = 0.85;
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = pattern2;
                const shift2X = offsetX % patternSize;
                const shift2Y = offsetY % patternSize;
                ctx.translate(shift2X, shift2Y);
                ctx.fillRect(-shift2X, -shift2Y, W + patternSize, H + patternSize);
                ctx.restore();

                // 绘制飘浮粒子
                for (const p of particles) {
                    const alpha = 0.3 + 0.3 * Math.sin(time * 2 + p.phase);
                    ctx.fillStyle = `hsla(${p.hue}, 55%, ${p.brightness * 55 + 20}%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制爆发粒子
                drawBurstParticles(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createBurst(mouse.x, mouse.y);
                // 切换图案类型
                patternIndex = (patternIndex + 1) % patternTypes.length;
                updatePatterns();
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createBurst(mouse.x, mouse.y);
                    patternIndex = (patternIndex + 1) % patternTypes.length;
                    updatePatterns();
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                setupCanvas();
                initParticles();
                burstParticles = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initParticles();
                updatePatterns();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0a0a14';
                    ctx.fillRect(0, 0, W, H);
                }
            });
        })();
    </script>
</body>
</html>
