<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREWORKS · 烟火绽放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050510;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            bottom: 28px;
            right: 32px;
            z-index: 2;
            text-align: right;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }
        .overlay:hover {
            opacity: 0.85;
        }
        .title {
            color: rgba(250, 220, 180, 0.7);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 160, 60, 0.5);
        }
        .hint {
            color: rgba(200, 170, 140, 0.45);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            .overlay { bottom: 18px; right: 20px; }
            .title { font-size: 8px; letter-spacing: 0.45em; }
            .hint { font-size: 6px; letter-spacing: 0.22em; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">Fireworks</div>
        <div class="hint">click · move</div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let rockets = [];
            let sparks = [];
            let sparkTrails = [];
            let mouse = { x: -9999, y: -9999, active: false };
            let time = 0;
            let colorScheme = 0;
            let maxSparks = 700;

            const colorSchemes = [
                { primary: 40, secondary: 20, tertiary: 55 },    // 金黄
                { primary: 320, secondary: 280, tertiary: 0 },   // 粉紫
                { primary: 180, secondary: 210, tertiary: 160 }, // 青蓝
                { primary: 0, secondary: 340, tertiary: 280 },   // 红紫
                { primary: 55, secondary: 25, tertiary: 200 },   // 暖金+青
            ];

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 火箭 ─────────────────────────────────────────────────
            class Rocket {
                constructor(x, y, targetX, targetY) {
                    this.x = x;
                    this.y = y;
                    this.targetX = targetX;
                    this.targetY = targetY;
                    this.vx = (targetX - x) / 60;
                    this.vy = (targetY - y) / 60;
                    this.trail = [];
                    this.maxTrail = 20;
                    this.life = 0;
                    this.exploded = false;
                    this.hue = colorSchemes[colorScheme].primary;
                }

                update(dt) {
                    this.life++;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    // 记录尾迹
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > this.maxTrail) {
                        this.trail.shift();
                    }
                    // 到达目标或超过目标
                    const distToTarget = Math.sqrt((this.x - this.targetX) ** 2 + (this.y - this.targetY) ** 2);
                    if (distToTarget < 20 || this.y < this.targetY || this.life > 80) {
                        this.exploded = true;
                    }
                }

                draw(ctx) {
                    for (let i = 1; i < this.trail.length; i++) {
                        const t = this.trail[i];
                        const alpha = (i / this.trail.length) * 0.8;
                        const size = 2 * (i / this.trail.length);
                        ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${alpha})`;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // 火箭头
                    ctx.fillStyle = `hsla(${this.hue}, 90%, 85%, 0.9)`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 烟花粒子 ────────────────────────────────────────────
            class Spark {
                constructor(x, y, angle, speed, hue, sat, light, size, life) {
                    this.x = x;
                    this.y = y;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.hue = hue;
                    this.sat = sat;
                    this.light = light;
                    this.size = size;
                    this.life = life;
                    this.maxLife = life;
                    this.gravity = 0.05;
                    this.drag = 0.985;
                    this.trail = [];
                    this.maxTrail = 4;
                    this.flicker = Math.random() * Math.PI * 2;
                    this.flickerSpeed = 0.1 + Math.random() * 0.3;
                }

                update(dt) {
                    this.flicker += this.flickerSpeed * dt;
                    // 记录尾迹
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > this.maxTrail) {
                        this.trail.shift();
                    }
                    this.vy += this.gravity * dt;
                    this.vx *= this.drag;
                    this.vy *= this.drag;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.life -= dt * 0.018;
                    this.size *= 0.998;
                }

                draw(ctx) {
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const flickerBoost = 0.6 + 0.4 * Math.sin(this.flicker);
                    const currentAlpha = alpha * flickerBoost;
                    if (currentAlpha <= 0.01) return;
                    const currentSize = this.size * (0.5 + 0.5 * alpha);
                    const hue = this.hue;
                    const sat = this.sat * (0.5 + 0.5 * alpha);
                    const light = this.light * (0.7 + 0.3 * alpha);

                    // 尾迹
                    for (let i = 1; i < this.trail.length; i++) {
                        const tp = this.trail[i];
                        const trailAlpha = currentAlpha * (i / this.trail.length) * 0.3;
                        const trailSize = currentSize * (i / this.trail.length) * 0.6;
                        ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${trailAlpha})`;
                        ctx.beginPath();
                        ctx.arc(tp.x, tp.y, trailSize, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 光点
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, currentSize * 2.5);
                    gradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 20}%, ${currentAlpha})`);
                    gradient.addColorStop(0.5, `hsla(${hue}, ${sat}%, ${light}%, ${currentAlpha * 0.4})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, currentSize * 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light + 30}%, ${currentAlpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, currentSize * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 创建烟花爆炸 ─────────────────────────────────────────
            function createExplosion(x, y) {
                const scheme = colorSchemes[colorScheme];
                const pattern = Math.floor(Math.random() * 4);
                const sparkCount = 60 + Math.floor(Math.random() * 60);
                const maxSpeed = 6 + Math.random() * 5;

                if (sparks.length > maxSparks) {
                    sparks.splice(0, sparks.length - maxSparks);
                }

                for (let i = 0; i < sparkCount; i++) {
                    let angle, speed, hue, sat, light, size, life;

                    switch (pattern) {
                        case 0: // 圆形
                            angle = (Math.PI * 2 * i) / sparkCount + Math.random() * 0.1;
                            speed = maxSpeed * (0.6 + Math.random() * 0.6);
                            hue = scheme.primary + Math.random() * 25 - 12;
                            sat = 75 + Math.random() * 20;
                            light = 55 + Math.random() * 30;
                            size = 1.5 + Math.random() * 2;
                            life = 35 + Math.random() * 25;
                            break;
                        case 1: // 环形
                            angle = (Math.PI * 2 * i) / sparkCount;
                            speed = maxSpeed * (0.85 + Math.random() * 0.3);
                            hue = scheme.secondary + Math.random() * 25 - 12;
                            sat = 70 + Math.random() * 25;
                            light = 50 + Math.random() * 30;
                            size = 1.8 + Math.random() * 2.2;
                            life = 40 + Math.random() * 20;
                            break;
                        case 2: // 双环
                            angle = (Math.PI * 2 * i) / sparkCount;
                            speed = maxSpeed * (i % 2 === 0 ? 0.95 : 0.55);
                            hue = i % 2 === 0 ? scheme.primary : scheme.tertiary;
                            sat = 70 + Math.random() * 25;
                            light = 55 + Math.random() * 30;
                            size = 1.5 + Math.random() * 2.5;
                            life = 30 + Math.random() * 30;
                            break;
                        case 3: // 星形
                            const starPoints = 6;
                            const pointIndex = i % starPoints;
                            angle = (Math.PI * 2 * pointIndex) / starPoints + (Math.PI / starPoints) * Math.floor(i / starPoints) + Math.random() * 0.15;
                            speed = maxSpeed * (0.4 + Math.random() * 0.8);
                            hue = scheme.primary + Math.floor(i / starPoints) * 20;
                            sat = 65 + Math.random() * 30;
                            light = 50 + Math.random() * 35;
                            size = 1.8 + Math.random() * 2.5;
                            life = 45 + Math.random() * 25;
                            break;
                    }

                    sparks.push(new Spark(x, y, angle, speed, hue, sat, light, size, life));
                }

                // 中心闪光
                for (let i = 0; i < 8; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 0.5 + Math.random() * 1.5;
                    const hue = scheme.primary + 20;
                    sparks.push(new Spark(x, y, angle, speed, hue, 50, 80, 3 + Math.random() * 2, 10 + Math.random() * 8));
                }
            }

            // ─── 发射火箭 ─────────────────────────────────────────────
            function launchRocket() {
                const startX = W / 2 + (Math.random() - 0.5) * W * 0.4;
                const startY = H + 20;
                let targetX, targetY;
                if (mouse.active) {
                    targetX = mouse.x + (Math.random() - 0.5) * 100;
                    targetY = Math.max(50, mouse.y + (Math.random() - 0.5) * 80);
                } else {
                    targetX = W * (0.15 + Math.random() * 0.7);
                    targetY = H * (0.15 + Math.random() * 0.4);
                }
                rockets.push(new Rocket(startX, startY, targetX, targetY));
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    const dtNorm = fixedStep / 1000 * 60;
                    
                    // 更新火箭
                    for (let i = rockets.length - 1; i >= 0; i--) {
                        const r = rockets[i];
                        r.update(dtNorm);
                        if (r.exploded) {
                            createExplosion(r.x, r.y);
                            rockets.splice(i, 1);
                        }
                    }

                    // 更新烟花粒子
                    for (let i = sparks.length - 1; i >= 0; i--) {
                        const sp = sparks[i];
                        sp.update(dtNorm);
                        if (sp.life <= 0 || sp.y > H + 50 || sp.x < -50 || sp.x > W + 50) {
                            sparks.splice(i, 1);
                        }
                    }
                }

                // 清除画布
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, 0, W, H);

                // 绘制火箭
                for (const r of rockets) {
                    r.draw(ctx);
                }

                // 绘制烟花粒子
                for (const sp of sparks) {
                    sp.draw(ctx);
                }

                // 绘制鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 鼠标光晕 ─────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 40;
                const hue = colorSchemes[colorScheme].primary;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 70%, 75%, 0.05)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 60%, 70%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 交互事件 ─────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                // 发射一枚火箭
                launchRocket();
                // 同时发射两枚
                setTimeout(() => launchRocket(), 100 + Math.random() * 200);
                // 切换色彩方案
                colorScheme = (colorScheme + 1) % colorSchemes.length;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    launchRocket();
                    setTimeout(() => launchRocket(), 100 + Math.random() * 200);
                    colorScheme = (colorScheme + 1) % colorSchemes.length;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                setupCanvas();
                rockets = [];
                sparks = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                // 初始发射
                setTimeout(() => launchRocket(), 300);
                setTimeout(() => launchRocket(), 800);
                setTimeout(() => launchRocket(), 1300);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#050510';
                    ctx.fillRect(0, 0, W, H);
                }
            });
        })();
    </script>
</body>
</html>
