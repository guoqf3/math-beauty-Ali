<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛顿迭代网 · 复动力学编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>牛顿迭代网 · 复动力学编织</h2>
        <div class="sub">Newton flow for z³−1 · Basins of attraction · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">ζ₁=1</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">ζ₂=e^{2πi/3}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">ζ₃=e^{4πi/3}</span>
            <span class="formula-sep">‖</span>
            z_{n+1}=z_n−(z_n³−1)/(3z_n²)
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.0, 2.0, 6.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.55;
        const PROJ_D = 2.0;
        const PLANE_RANGE = 2.2;
        const MAX_ITERS = 40;
        const TOLERANCE = 1e-8;

        // 三个单位根
        const roots = [
            { re: 1, im: 0 },
            { re: -0.5, im: Math.sqrt(3) / 2 },
            { re: -0.5, im: -Math.sqrt(3) / 2 }
        ];

        // 球极投影
        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // 牛顿迭代 z → z - (z³-1)/(3z²)
        function newtonStep(zRe, zIm) {
            const x2 = zRe * zRe;
            const y2 = zIm * zIm;
            const xy = zRe * zIm;
            // z³ = (x³-3xy²) + i(3x²y-y³)
            const z3Re = zRe * (x2 - 3 * y2);
            const z3Im = zIm * (3 * x2 - y2);
            // 分子 = z³ - 1
            const numRe = z3Re - 1;
            const numIm = z3Im;
            // 分母 = 3z²
            const denRe = 3 * (x2 - y2);
            const denIm = 6 * xy;
            const denom = denRe * denRe + denIm * denIm;
            if (denom < 1e-15) return { re: zRe, re: zIm, diverged: true };
            // 牛顿修正
            const corrRe = (numRe * denRe + numIm * denIm) / denom;
            const corrIm = (numIm * denRe - numRe * denIm) / denom;
            return {
                re: zRe - corrRe,
                im: zIm - corrIm,
                diverged: false
            };
        }

        // 追踪一条轨道，返回平面点数组和收敛到的根索引
        function traceOrbit(startRe, startIm) {
            const pts = [];
            let zRe = startRe;
            let zIm = startIm;
            pts.push({ re: zRe, im: zIm });
            for (let iter = 0; iter < MAX_ITERS; iter++) {
                const step = newtonStep(zRe, zIm);
                if (step.diverged) break;
                zRe = step.re;
                zIm = step.im;
                pts.push({ re: zRe, im: zIm });
                if (Math.abs(zRe) > 10 || Math.abs(zIm) > 10) break;
                // 检查收敛
                for (let r = 0; r < 3; r++) {
                    const dr = Math.hypot(zRe - roots[r].re, zIm - roots[r].im);
                    if (dr < TOLERANCE) {
                        return { pts, rootIndex: r };
                    }
                }
            }
            return { pts, rootIndex: -1 };
        }

        // 生成初始点网格（极坐标 + 笛卡尔混合）
        function generateSeeds() {
            const seeds = [];
            // 极坐标网格
            const nRadial = 38;
            const nAngular = 72;
            for (let i = 1; i <= nRadial; i++) {
                const r = i * PLANE_RANGE / nRadial;
                for (let j = 0; j < nAngular; j++) {
                    const ang = j * 2 * Math.PI / nAngular;
                    seeds.push({ re: r * Math.cos(ang), im: r * Math.sin(ang) });
                }
            }
            // 靠近Julia集边界的额外点（z³-1的Julia集是三个根之间的分界）
            // 在单位圆附近增加密度
            const nExtra = 120;
            for (let i = 0; i < nExtra; i++) {
                const ang = i * 2 * Math.PI / nExtra;
                const r = 0.9 + Math.random() * 0.15;
                seeds.push({ re: r * Math.cos(ang), im: r * Math.sin(ang) });
                const r2 = 1.05 + Math.random() * 0.2;
                seeds.push({ re: r2 * Math.cos(ang), im: r2 * Math.sin(ang) });
            }
            return seeds;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'newton-web';
        scene.add(rootGroup);

        const seeds = generateSeeds();
        const rootColorMap = [COLOR_GOLD, COLOR_CYAN, COLOR_MAGENTA];
        let totalLines = 0;

        seeds.forEach(seed => {
            const { pts, rootIndex } = traceOrbit(seed.re, seed.im);
            if (pts.length < 2) return;
            if (rootIndex < 0) return; // 不收敛的轨道丢弃（或可显示为灰色）

            // 将平面轨道映射到球面
            const spherePts = pts
                .filter(p => Math.abs(p.re) < 4 && Math.abs(p.im) < 4)
                .map(p => stereographic(p.re, p.im));

            if (spherePts.length < 2) return;

            const color = rootColorMap[rootIndex];
            const geom = new THREE.BufferGeometry().setFromPoints(spherePts);
            const mat = new THREE.LineBasicMaterial({
                color,
                transparent: true,
                opacity: 0.48,
                depthWrite: true,
                depthTest: true,
            });
            rootGroup.add(new THREE.Line(geom, mat));
            totalLines++;
        });

        console.log('牛顿轨道线数量:', totalLines);

        // 额外：三个根的位置标记（小圆圈）
        const markGeom = new THREE.SphereGeometry(0.04, 12, 12);
        roots.forEach((root, idx) => {
            const sp = stereographic(root.re, root.im);
            const mark = new THREE.Mesh(markGeom, new THREE.MeshBasicMaterial({ color: rootColorMap[idx] }));
            mark.position.copy(sp);
            rootGroup.add(mark);
        });

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 动画循环
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.0;
            const camAngle = t * 0.09;
            const camHeight = 2.1 + Math.sin(t * 0.17) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 牛顿迭代复动力学编织动画已稳定运行');
    </script>
</body>
</html>
