<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面对称多层网络 · 三程距离交织</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.08em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.46rem, 0.82vw, 0.62rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.18);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.36rem, 0.68vw, 0.54rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">球面对称多层网络 · 三程距离交织</div>
        <div class="subtitle">ICOSAHEDRAL MULTI-DISTANCE NETWORK &nbsp;·&nbsp; 62 SYMMETRY DIRECTIONS</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">短程d&lt;1.08:</span> 近邻方向 &nbsp;
            <span class="c2">中程1.08≤d&lt;1.35:</span> 中间距离 &nbsp;
            <span class="c3">长程d≥1.35:</span> 较远连接
            <br>
            <span style="color:#9aa8b8;">φ=(1+√5)/2 &nbsp;|&nbsp; 12顶点·20面心·30边中点方向 &nbsp;|&nbsp; 球半径R=2.8 &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 22);

        const camera = new THREE.PerspectiveCamera(
            50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 25
        );
        camera.position.set(1.2, 0.6, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_REF = '#3a4a5c', C_GLINT = '#8898aa';
        const SPHERE_R = 2.8;
        const phi = (1 + Math.sqrt(5)) / 2;
        const invPhi = 1 / phi;

        // 生成全部62个对称方向：12顶点 + 20面心 + 30边中点
        function generateAllDirections() {
            const dirs = [];
            const eps = 0.02;
            const addUnique = (v) => {
                const n = new THREE.Vector3(v[0], v[1], v[2]).normalize();
                if (!dirs.some(d => d.distanceTo(n) < eps)) dirs.push(n);
            };

            // 顶点 (0, ±1, ±φ) 循环排列
            const perms = [[0,1,2],[2,0,1],[1,2,0]];
            for (const [i,j,k] of perms) {
                for (let sj=-1; sj<=1; sj+=2) {
                    for (let sk=-1; sk<=1; sk+=2) {
                        const v = [0,0,0];
                        v[i]=0; v[j]=sj; v[k]=sk*phi;
                        addUnique(v);
                    }
                }
            }

            // 面心 (±1,±1,±1) 和 (0, ±1/φ, ±φ) 循环排列
            for (let sx=-1; sx<=1; sx+=2)
                for (let sy=-1; sy<=1; sy+=2)
                    for (let sz=-1; sz<=1; sz+=2)
                        addUnique([sx,sy,sz]);
            for (const [i,j,k] of perms) {
                for (let sj=-1; sj<=1; sj+=2) {
                    for (let sk=-1; sk<=1; sk+=2) {
                        const v = [0,0,0];
                        v[i]=0; v[j]=sj*invPhi; v[k]=sk*phi;
                        addUnique(v);
                    }
                }
            }

            // 边中点：所有相邻顶点方向之和
            const vertDirs = dirs.slice(0, 12);
            for (let i=0; i<vertDirs.length; i++) {
                for (let j=i+1; j<vertDirs.length; j++) {
                    const mid = vertDirs[i].clone().add(vertDirs[j]).normalize();
                    if (!dirs.some(d => d.distanceTo(mid) < eps)) dirs.push(mid);
                }
            }

            return dirs;
        }

        const directions = generateAllDirections();
        const points = directions.map(d => d.clone().multiplyScalar(SPHERE_R));
        console.log('对称方向总数:', points.length);

        // 计算所有点间距离并分层
        const n = points.length;
        const dists = [];
        for (let i=0; i<n; i++) {
            for (let j=i+1; j<n; j++) {
                dists.push(points[i].distanceTo(points[j]));
            }
        }
        dists.sort((a,b)=>a-b);
        const minD = dists[0];
        const th1 = minD * 1.08;
        const th2 = minD * 1.35;

        const edgesShort=[], edgesMid=[], edgesLong=[];
        for (let i=0; i<n; i++) {
            for (let j=i+1; j<n; j++) {
                const d = points[i].distanceTo(points[j]);
                if (d <= th1) edgesShort.push([i,j]);
                else if (d <= th2) edgesMid.push([i,j]);
                else edgesLong.push([i,j]);
            }
        }
        console.log('短程边:', edgesShort.length, '中程边:', edgesMid.length, '长程边:', edgesLong.length);

        function createLineSegments(edges, colorHex, opacity) {
            if (edges.length===0) return new THREE.Group();
            const verts = [];
            for (const [i,j] of edges) {
                const a=points[i], b=points[j];
                verts.push(a.x,a.y,a.z,b.x,b.y,b.z);
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true, opacity: opacity, depthWrite: true
            });
            return new THREE.LineSegments(geom, mat);
        }

        const lines1 = createLineSegments(edgesShort, C1, 0.68);
        const lines2 = createLineSegments(edgesMid, C2, 0.65);
        const lines3 = createLineSegments(edgesLong, C3, 0.66);

        const mainGroup = new THREE.Group();
        mainGroup.add(lines1);
        mainGroup.add(lines2);
        mainGroup.add(lines3);
        scene.add(mainGroup);

        // 参考球面线框
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 180;
            const gen = (f) => {
                const pts = [];
                for (let i=0; i<=segs; i++) pts.push(f((i/segs)*Math.PI*2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(colorHex), transparent:true, opacity:opacity, depthWrite:true });
                group.add(new THREE.Line(geom, mat));
            };
            gen((a)=>new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0));
            gen((a)=>new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
            gen((a)=>new THREE.Vector3(0, Math.cos(a)*radius, Math.sin(a)*radius));
            for (const z of [-radius*0.5, radius*0.5]) {
                const r = Math.sqrt(radius*radius - z*z);
                const pts = [];
                for (let i=0; i<=segs; i++) { const a=(i/segs)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r, z, Math.sin(a)*r)); }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(colorHex), transparent:true, opacity:opacity*0.6, depthWrite:true });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(SPHERE_R, C_REF, 0.22);
        scene.add(sphereRef);

        // 顶点光点
        (() => {
            const sz = 0.055;
            const gGroup = new THREE.Group();
            for (const pt of points) {
                [[-sz,0,0],[sz,0,0],[0,-sz,0],[0,sz,0],[0,0,-sz],[0,0,sz]].forEach(([dx,dy,dz]) => {
                    const g = new THREE.BufferGeometry().setFromPoints([pt.clone().add(new THREE.Vector3(dx,dy,dz)), pt]);
                    const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent:true, opacity:0.55, depthWrite:true });
                    gGroup.add(new THREE.Line(g,m));
                });
            }
            mainGroup.add(gGroup);
        })();

        // 原点光点
        (() => {
            const sz = 0.08;
            const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-sz,0,0),new THREE.Vector3(sz,0,0),new THREE.Vector3(0,-sz,0),new THREE.Vector3(0,sz,0),new THREE.Vector3(0,0,-sz),new THREE.Vector3(0,0,sz)]);
            const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent:true, opacity:0.72, depthWrite:true });
            scene.add(new THREE.LineSegments(g,m));
        })();

        // 动画 (绝对时间)
        let time=0, lastTime=performance.now(), frameCount=0;
        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime)/1000;
            if (delta<=0 || delta>0.5) delta=0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (frameCount%150===0) console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s 边:${edgesShort.length+edgesMid.length+edgesLong.length}`);

            mainGroup.rotation.y = time*0.28;
            mainGroup.rotation.x = time*0.15 + Math.sin(time*0.24)*0.2;
            mainGroup.rotation.z = Math.cos(time*0.19)*0.12;
            sphereRef.rotation.copy(mainGroup.rotation);

            const camX = 1.2 + Math.sin(time*0.14)*0.5;
            const camY = 0.6 + Math.cos(time*0.17)*0.45;
            camera.position.set(camX, camY, 7.2);
            camera.lookAt(0,0,0);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = Math.max(container.clientHeight,1);
            camera.aspect = w/h;
            camera.updateProjectionMatrix();
            renderer.setSize(w,h);
        });

        console.log('=== 球面对称多层网络 · 三程距离交织 ===');
        console.log('短程(暖金):', edgesShort.length, '中程(冰蓝):', edgesMid.length, '长程(玫瑰粉):', edgesLong.length);
        console.log('总边数:', edgesShort.length+edgesMid.length+edgesLong.length);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
