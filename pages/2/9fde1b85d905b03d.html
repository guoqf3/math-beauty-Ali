<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍普夫纤维化 · 四维空间投影</title>
    <style>
        :root {
            --bg: #06080e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay .title {
            font-size: clamp(1.2rem, 2.5vw, 1.7rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 42px rgba(200, 180, 150, 0.5),
                0 0 80px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.6rem, 1.1vw, 0.78rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 18px rgba(155, 145, 125, 0.35);
            margin-top: 2px;
            white-space: nowrap;
        }

        #formula-overlay {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(6, 8, 14, 0.72);
            padding: 13px 26px;
            border-radius: 38px;
            border: 1px solid rgba(175, 155, 135, 0.2);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            max-width: 94vw;
        }

        #formula-overlay .formula {
            font-size: clamp(0.62rem, 1.15vw, 0.82rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 16px rgba(185, 170, 145, 0.32);
            line-height: 1.65;
            white-space: nowrap;
        }

        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }

        @media (max-width: 600px) {
            #title-overlay {
                top: 16px;
            }
            #formula-overlay {
                bottom: 14px;
                padding: 9px 16px;
                border-radius: 28px;
            }
            #formula-overlay .formula {
                font-size: 0.58rem;
                white-space: normal;
                line-height: 1.5;
            }
            #title-overlay .title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="title-overlay">
        <div class="title">霍普夫纤维化 · 四维空间投影</div>
        <div class="subtitle">HOPF FIBRATION &nbsp;·&nbsp; 4D STEREOGRAPHIC PROJECTION</div>
    </div>

    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">S³→S²:</span>&nbsp;
            (x₁,x₂,x₃,x₄)∈S³&nbsp;↦&nbsp;
            <span class="c2">(2(x₁x₃+x₂x₄),&nbsp;2(x₂x₃−x₁x₄),&nbsp;x₁²+x₂²−x₃²−x₄²)</span>
            <br>
            <span class="c3">Π⁻¹:</span>&nbsp;X=x₁/(1−x₄)&nbsp;&nbsp;Y=x₂/(1−x₄)&nbsp;&nbsp;Z=x₃/(1−x₄)&nbsp;&nbsp;
            <span style="color:#9aa8b8;">SO(2)×SO(2)旋转</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#06080e');
        scene.fog = new THREE.Fog('#06080e', 7, 26);

        const camera = new THREE.PerspectiveCamera(
            54,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.4,
            42
        );
        camera.position.set(0.9, 1.5, 8.8);
        camera.lookAt(0, -0.05, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色定义 ====================
        const COLOR_WARM_GOLD = '#d4885c';
        const COLOR_ICE_BLUE = '#5d9ec6';
        const COLOR_ROSE = '#c77d9f';

        // ==================== 数学工具 ====================
        /** 四维旋转：x1-x2平面旋转alpha，x3-x4平面旋转beta */
        function rotate4D(x1, x2, x3, x4, alpha, beta) {
            const cosA = Math.cos(alpha);
            const sinA = Math.sin(alpha);
            const cosB = Math.cos(beta);
            const sinB = Math.sin(beta);
            const x1r = x1 * cosA - x2 * sinA;
            const x2r = x1 * sinA + x2 * cosA;
            const x3r = x3 * cosB - x4 * sinB;
            const x4r = x3 * sinB + x4 * cosB;
            return { x1: x1r, x2: x2r, x3: x3r, x4: x4r };
        }

        /** 立体投影：四维点 -> 三维点，处理奇点 */
        function stereographicProject(x1, x2, x3, x4) {
            const denom = 1 - x4;
            if (Math.abs(denom) < 0.001) {
                const scale = 100;
                const s = denom >= 0 ? 1 : -1;
                return new THREE.Vector3(s * x1 * scale, s * x2 * scale, s * x3 * scale);
            }
            return new THREE.Vector3(x1 / denom, x2 / denom, x3 / denom);
        }

        /** 软钳制：防止点飞出太远 */
        function softClamp(vec, maxDist = 14) {
            const len = vec.length();
            if (len > maxDist) {
                const clamped = maxDist * (1 - Math.exp(-(len - maxDist) / maxDist));
                vec.normalize().multiplyScalar(maxDist + clamped * 0.35);
            }
            return vec;
        }

        // ==================== 霍普夫纤维环数据结构 ====================
        /**
         * 霍普夫环参数化（旋转前）：
         * x1 = cos(xi)*cos(t)
         * x2 = cos(xi)*sin(t)
         * x3 = sin(xi)*cos(t - delta)
         * x4 = sin(xi)*sin(t - delta)
         */
        function hopfFiberSample(xi, delta, t) {
            const cosXi = Math.cos(xi);
            const sinXi = Math.sin(xi);
            const cosT = Math.cos(t);
            const sinT = Math.sin(t);
            const cosTD = Math.cos(t - delta);
            const sinTD = Math.sin(t - delta);
            return {
                x1: cosXi * cosT,
                x2: cosXi * sinT,
                x3: sinXi * cosTD,
                x4: sinXi * sinTD,
            };
        }

        // ==================== 创建可更新的霍普夫环线 ====================
        function createHopfRingLine(xi, delta, numPoints, colorHex) {
            const positions = new Float32Array(numPoints * 3);
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: 0.82,
                depthWrite: true,
            });
            const line = new THREE.Line(geometry, material);
            line.userData = {
                xi,
                delta,
                numPoints,
                positions,
                needsUpdate: true,
            };
            return line;
        }

        function updateHopfRingLine(line, alpha, beta) {
            const { xi, delta, numPoints, positions } = line.userData;
            const dt = (Math.PI * 2) / numPoints;
            for (let i = 0; i < numPoints; i++) {
                const t = i * dt;
                const raw = hopfFiberSample(xi, delta, t);
                const rot = rotate4D(raw.x1, raw.x2, raw.x3, raw.x4, alpha, beta);
                let proj = stereographicProject(rot.x1, rot.x2, rot.x3, rot.x4);
                proj = softClamp(proj, 13);
                const idx = i * 3;
                positions[idx] = proj.x;
                positions[idx + 1] = proj.y;
                positions[idx + 2] = proj.z;
            }
            line.geometry.attributes.position.needsUpdate = true;
        }

        // ==================== 正八胞体（超立方体）边 ====================
        function generateTesseractVertices(scale) {
            const verts = [];
            for (let i0 = 0; i0 < 2; i0++)
                for (let i1 = 0; i1 < 2; i1++)
                    for (let i2 = 0; i2 < 2; i2++)
                        for (let i3 = 0; i3 < 2; i3++) {
                            verts.push({
                                x1: (i0 * 2 - 1) * scale,
                                x2: (i1 * 2 - 1) * scale,
                                x3: (i2 * 2 - 1) * scale,
                                x4: (i3 * 2 - 1) * scale,
                            });
                        }
            return verts;
        }

        function generateTesseractEdges(verts) {
            const edges = [];
            for (let i = 0; i < verts.length; i++) {
                for (let j = i + 1; j < verts.length; j++) {
                    const a = verts[i];
                    const b = verts[j];
                    const diffCount =
                        (a.x1 !== b.x1 ? 1 : 0) +
                        (a.x2 !== b.x2 ? 1 : 0) +
                        (a.x3 !== b.x3 ? 1 : 0) +
                        (a.x4 !== b.x4 ? 1 : 0);
                    if (diffCount === 1) {
                        edges.push([i, j]);
                    }
                }
            }
            return edges;
        }

        function createTesseractEdgeLines(scale, colorHex, samplesPerEdge) {
            const verts = generateTesseractVertices(scale);
            const edges = generateTesseractEdges(verts);
            const group = new THREE.Group();

            for (const [iA, iB] of edges) {
                const vA = verts[iA];
                const vB = verts[iB];
                const numPts = samplesPerEdge;
                const positions = new Float32Array(numPts * 3);
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const material = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: 0.6,
                    depthWrite: true,
                });
                const line = new THREE.Line(geometry, material);
                line.userData = {
                    vA: { x1: vA.x1, x2: vA.x2, x3: vA.x3, x4: vA.x4 },
                    vB: { x1: vB.x1, x2: vB.x2, x3: vB.x3, x4: vB.x4 },
                    numPts,
                    positions,
                };
                group.add(line);
            }
            group.userData = { allLines: group.children.slice() };
            return group;
        }

        function updateTesseractEdgeLines(group, alpha, beta) {
            for (const line of group.userData.allLines) {
                const { vA, vB, numPts, positions } = line.userData;
                for (let i = 0; i < numPts; i++) {
                    const t = i / (numPts - 1);
                    const x1 = vA.x1 + (vB.x1 - vA.x1) * t;
                    const x2 = vA.x2 + (vB.x2 - vA.x2) * t;
                    const x3 = vA.x3 + (vB.x3 - vA.x3) * t;
                    const x4 = vA.x4 + (vB.x4 - vA.x4) * t;
                    const rot = rotate4D(x1, x2, x3, x4, alpha, beta);
                    let proj = stereographicProject(rot.x1, rot.x2, rot.x3, rot.x4);
                    proj = softClamp(proj, 12);
                    const idx = i * 3;
                    positions[idx] = proj.x;
                    positions[idx + 1] = proj.y;
                    positions[idx + 2] = proj.z;
                }
                line.geometry.attributes.position.needsUpdate = true;
            }
        }

        // ==================== 构建场景结构 ====================
        const hopfRingsGroupWarm = new THREE.Group();
        const hopfRingsGroupBlue = new THREE.Group();
        const hopfRingsGroupRose = new THREE.Group();
        const tesseractGroup = new THREE.Group();

        scene.add(hopfRingsGroupWarm);
        scene.add(hopfRingsGroupBlue);
        scene.add(hopfRingsGroupRose);
        scene.add(tesseractGroup);

        // 暖金色霍普夫环：xi在π/7到3π/7，delta均匀分布
        const warmRings = [];
        const numWarmRings = 10;
        for (let i = 0; i < numWarmRings; i++) {
            const xi = Math.PI / 7 + (i / (numWarmRings - 1)) * (3 * Math.PI / 7 - Math.PI / 7);
            const delta = (i / numWarmRings) * Math.PI * 2;
            const ring = createHopfRingLine(xi, delta, 220, COLOR_WARM_GOLD);
            hopfRingsGroupWarm.add(ring);
            warmRings.push(ring);
        }

        // 冰蓝色霍普夫环：xi在中段，delta偏移
        const blueRings = [];
        const numBlueRings = 10;
        for (let i = 0; i < numBlueRings; i++) {
            const xi = Math.PI / 5.5 + (i / (numBlueRings - 1)) * (2.5 * Math.PI / 7 - Math.PI / 5.5);
            const delta = (i / numBlueRings) * Math.PI * 2 + Math.PI / numBlueRings;
            const ring = createHopfRingLine(xi, delta, 220, COLOR_ICE_BLUE);
            hopfRingsGroupBlue.add(ring);
            blueRings.push(ring);
        }

        // 玫瑰粉色霍普夫环：xi在克利福德环面附近
        const roseRings = [];
        const numRoseRings = 8;
        for (let i = 0; i < numRoseRings; i++) {
            const xi = Math.PI / 4 + (i - numRoseRings / 2 + 0.5) * 0.22;
            const delta = (i / numRoseRings) * Math.PI * 2 + Math.PI / 3;
            const ring = createHopfRingLine(xi, delta, 240, COLOR_ROSE);
            hopfRingsGroupRose.add(ring);
            roseRings.push(ring);
        }

        // 正八胞体边（玫瑰粉色）
        const tesseractLines = createTesseractEdgeLines(0.52, COLOR_ROSE, 28);
        tesseractGroup.add(tesseractLines);

        // 额外：正八胞体顶点小光点（十字线段）
        const starGlintsGroup = new THREE.Group();
        tesseractGroup.add(starGlintsGroup);
        const tesseractVerts4D = generateTesseractVertices(0.52);
        const starSize = 0.045;
        // 预创建光点线段（将在每帧更新位置）
        const glintDataArray = [];
        for (const v4 of tesseractVerts4D) {
            const crossGroup = new THREE.Group();
            const sz = starSize;
            const pairs = [
                [new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0)],
                [new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0)],
                [new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)],
            ];
            const segs = [];
            for (const [a, b] of pairs) {
                const geom = new THREE.BufferGeometry().setFromPoints([a, b]);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color('#e8d8c8'),
                    transparent: true,
                    opacity: 0.7,
                    depthWrite: true,
                });
                const seg = new THREE.Line(geom, mat);
                crossGroup.add(seg);
                segs.push(seg);
            }
            starGlintsGroup.add(crossGroup);
            glintDataArray.push({
                group: crossGroup,
                v4,
                segs,
                starSize,
            });
        }

        function updateGlints(alpha, beta) {
            for (const data of glintDataArray) {
                const rot = rotate4D(data.v4.x1, data.v4.x2, data.v4.x3, data.v4.x4, alpha, beta);
                let proj = stereographicProject(rot.x1, rot.x2, rot.x3, rot.x4);
                proj = softClamp(proj, 11);
                data.group.position.copy(proj);
            }
        }

        // 所有需要更新的环的注册表
        const allHopfRings = [...warmRings, ...blueRings, ...roseRings];

        // ==================== 动画状态 ====================
        let alpha = 0;
        let beta = Math.PI / 4;
        const alphaSpeed = 0.26;
        const betaSpeed = 0.34;

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationTime = 0;
        let frameCount = 0;
        let lastLogTime = 0;
        let animationRunning = true;

        function animate(timestamp) {
            if (!animationRunning) return;
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.12);
            animationTime += dt;
            frameCount++;

            if (timestamp - lastLogTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${animationTime.toFixed(2)}s dt:${(dt*1000).toFixed(1)}ms α:${alpha.toFixed(2)} β:${beta.toFixed(2)}`);
                lastLogTime = timestamp;
            }

            // 更新四维旋转角度
            alpha += alphaSpeed * dt;
            beta += betaSpeed * dt;

            // 更新所有霍普夫环
            for (const ring of allHopfRings) {
                updateHopfRingLine(ring, alpha, beta);
            }

            // 更新正八胞体边
            updateTesseractEdgeLines(tesseractLines, alpha, beta);

            // 更新光点
            updateGlints(alpha, beta);

            // 微小的整体旋转（霍普夫环组绕Y轴缓慢旋转作为额外动态）
            const globalYaw = Math.sin(animationTime * 0.13) * 0.015;
            hopfRingsGroupWarm.rotation.y += globalYaw * dt;
            hopfRingsGroupBlue.rotation.y -= globalYaw * 0.7 * dt;
            hopfRingsGroupRose.rotation.y += globalYaw * 0.5 * dt;
            hopfRingsGroupWarm.rotation.x += Math.cos(animationTime * 0.17) * 0.008 * dt;
            hopfRingsGroupBlue.rotation.x -= Math.cos(animationTime * 0.19) * 0.007 * dt;
            hopfRingsGroupRose.rotation.z += Math.sin(animationTime * 0.15) * 0.006 * dt;
            tesseractGroup.rotation.y += globalYaw * 0.6 * dt;
            tesseractGroup.rotation.x += Math.cos(animationTime * 0.21) * 0.01 * dt;

            // 相机微动
            const camX = 0.9 + Math.sin(animationTime * 0.16) * 0.45;
            const camY = 1.5 + Math.cos(animationTime * 0.2) * 0.38;
            const camZ = 8.8 + Math.sin(animationTime * 0.12) * 0.35;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, -0.04, 0);

            // 渲染
            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

        // ==================== 启动 ====================
        console.log('=== 霍普夫纤维化 · 四维空间投影 ===');
        console.log('暖金色霍普夫环:', warmRings.length);
        console.log('冰蓝色霍普夫环:', blueRings.length);
        console.log('玫瑰粉色霍普夫环:', roseRings.length);
        console.log('正八胞体边数:', tesseractLines.userData.allLines.length);
        console.log('顶点光点数:', glintDataArray.length);
        console.log('总霍普夫环采样点:', allHopfRings.reduce((sum, r) => sum + r.userData.numPoints, 0));
        console.log('启动动画循环...');

        // 预热：计算初始状态
        for (const ring of allHopfRings) {
            updateHopfRingLine(ring, alpha, beta);
        }
        updateTesseractEdgeLines(tesseractLines, alpha, beta);
        updateGlints(alpha, beta);
        renderer.render(scene, camera);

        // 启动动画
        requestAnimationFrame(animate);
        console.log('✅ 动画已启动');
    </script>
</body>
</html>
