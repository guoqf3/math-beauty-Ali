<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH PULSE · 故障脉冲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0e;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            bottom: 28px;
            right: 32px;
            z-index: 2;
            text-align: right;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }
        .overlay:hover {
            opacity: 0.85;
        }
        .title {
            color: rgba(220, 240, 245, 0.7);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 210, 220, 0.5);
        }
        .hint {
            color: rgba(160, 190, 200, 0.45);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            .overlay { bottom: 18px; right: 20px; }
            .title { font-size: 8px; letter-spacing: 0.45em; }
            .hint { font-size: 6px; letter-spacing: 0.22em; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">Glitch</div>
        <div class="hint">move · click</div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let glitchBars = [];
            let mouse = { x: -9999, y: -9999, active: false };
            let time = 0;
            let colorShift = 0;
            let flashParticles = [];
            let maxBars = 80;

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                // 立即填充深色背景，避免白屏/黑屏
                ctx.fillStyle = '#0a0a0e';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 故障条类 ─────────────────────────────────────────────
            class GlitchBar {
                constructor() {
                    this.y = Math.random() * H;
                    this.width = 2 + Math.random() * 6;          // 条宽度
                    this.height = 4 + Math.random() * 18;        // 条高度
                    this.x = Math.random() * W;                  // 初始x位置（随机分布）
                    this.speedX = (Math.random() - 0.5) * 2.5;   // 水平移动速度
                    this.flickerSpeed = 1 + Math.random() * 3;   // 闪烁频率
                    this.flickerPhase = Math.random() * Math.PI * 2;
                    this.alpha = 0.3 + Math.random() * 0.6;
                    // 颜色方案：主色青、品红、黄、白
                    const roll = Math.random();
                    if (roll < 0.4) {
                        this.hue = 180 + Math.random() * 30;      // 青色
                    } else if (roll < 0.7) {
                        this.hue = 300 + Math.random() * 30;      // 品红
                    } else if (roll < 0.9) {
                        this.hue = 50 + Math.random() * 20;       // 黄色
                    } else {
                        this.hue = 0;                             // 白色（饱和度低）
                    }
                    this.saturation = (roll < 0.9) ? 80 + Math.random() * 20 : 0;
                    this.lightness = 55 + Math.random() * 30;
                    this.shiftAmplitude = 5 + Math.random() * 25; // 水平位移幅度
                    this.brightness = 0.5 + Math.random() * 0.5;
                }

                update(dt, mouse, t) {
                    // 水平移动
                    this.x += this.speedX * dt * (0.5 + 0.5 * Math.sin(t * 0.5 + this.flickerPhase));

                    // 鼠标扰乱：附近条产生偏移
                    if (mouse.active) {
                        const dx = this.x - mouse.x;
                        const dy = this.y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const influenceRadius = 180;
                        if (dist < influenceRadius) {
                            const falloff = 1 - dist / influenceRadius;
                            // 偏移方向与鼠标移动相关（这里使用随机方向，模拟信号干扰）
                            const offsetAngle = Math.random() * Math.PI * 2;
                            this.x += Math.cos(offsetAngle) * falloff * 12;
                            // 增亮
                            this.brightness = Math.min(1, this.brightness + 0.05);
                        }
                    }

                    // 边界重置
                    if (this.x > W + 50) this.x = -50;
                    if (this.x < -50) this.x = W + 50;
                    if (this.y > H + 50) this.y = -50;
                    if (this.y < -50) this.y = H + 50;
                }

                draw(ctx, t) {
                    const flicker = 0.3 + 0.7 * Math.abs(Math.sin(t * this.flickerSpeed + this.flickerPhase));
                    const alpha = this.alpha * flicker * this.brightness;
                    const hue = this.hue + colorShift;
                    const sat = this.saturation;
                    const light = this.lightness;

                    // 绘制故障条（矩形）
                    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
                    ctx.fillRect(this.x, this.y, this.width, this.height);

                    // 故障条周围光晕
                    if (this.width > 3) {
                        const glowGradient = ctx.createRadialGradient(
                            this.x + this.width / 2, this.y + this.height / 2, 0,
                            this.x + this.width / 2, this.y + this.height / 2, this.width * 2
                        );
                        glowGradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 20}%, ${alpha * 0.4})`);
                        glowGradient.addColorStop(1, 'transparent');
                        ctx.fillStyle = glowGradient;
                        ctx.fillRect(this.x - this.width, this.y - this.height, this.width * 3, this.height * 3);
                    }
                }
            }

            // ─── 初始化故障条 ─────────────────────────────────────────
            function initGlitchBars() {
                glitchBars = [];
                const count = Math.max(50, Math.min(100, Math.floor(W * H / 12000)));
                maxBars = count;
                for (let i = 0; i < count; i++) {
                    glitchBars.push(new GlitchBar());
                }
            }

            // ─── 点击爆发粒子 ─────────────────────────────────────────
            function createFlash(x, y) {
                const count = 25 + Math.floor(Math.random() * 20);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 6;
                    flashParticles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 0.7 + Math.random() * 0.6,
                        maxLife: 1.3,
                        size: 1 + Math.random() * 2.5,
                        hue: 180 + colorShift + Math.random() * 60 - 30,
                        sat: 80 + Math.random() * 20,
                        light: 60 + Math.random() * 25,
                        alpha: 0.85,
                    });
                }
                if (flashParticles.length > 150) {
                    flashParticles.splice(0, flashParticles.length - 150);
                }
            }

            function updateFlashParticles(dt) {
                for (let i = flashParticles.length - 1; i >= 0; i--) {
                    const p = flashParticles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                    p.life -= 0.02 * dt;
                    if (p.life <= 0) flashParticles.splice(i, 1);
                }
            }

            function drawFlashParticles(ctx) {
                for (const p of flashParticles) {
                    const alpha = p.life * p.alpha;
                    const size = p.size * p.life;
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
                    gradient.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 鼠标光晕 ─────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 70;
                const hue = 180 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 80%, 70%, 0.06)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 70%, 65%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    const dtNorm = fixedStep / 1000 * 60;
                    for (const bar of glitchBars) {
                        bar.update(dtNorm, mouse, time);
                    }
                    updateFlashParticles(dtNorm);
                }

                // 半透明清除，形成拖尾
                ctx.fillStyle = 'rgba(10, 10, 14, 0.18)';
                ctx.fillRect(0, 0, W, H);

                // 绘制故障条
                for (const bar of glitchBars) {
                    bar.draw(ctx, time);
                }

                // 绘制爆发粒子
                drawFlashParticles(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ──────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createFlash(mouse.x, mouse.y);
                colorShift += 30 + Math.random() * 30;
                if (colorShift > 160) colorShift = -30;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createFlash(mouse.x, mouse.y);
                    colorShift += 30 + Math.random() * 30;
                    if (colorShift > 160) colorShift = -30;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                setupCanvas();
                initGlitchBars();
                flashParticles = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initGlitchBars();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0a0a0e';
                    ctx.fillRect(0, 0, W, H);
                }
            });
        })();
    </script>
</body>
</html>
