<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INK · 水墨晕染</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1e;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }
        .overlay:hover {
            opacity: 0.9;
        }
        .title {
            color: rgba(240, 240, 245, 0.8);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(200, 200, 210, 0.4);
        }
        .hint {
            color: rgba(180, 180, 190, 0.5);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            .overlay { bottom: 18px; }
            .title { font-size: 8px; letter-spacing: 0.45em; }
            .hint { font-size: 6px; letter-spacing: 0.22em; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">Ink</div>
        <div class="hint">move · click</div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let particles = [];
            let mouse = { x: -9999, y: -9999, active: false, lastX: -9999, lastY: -9999, vx: 0, vy: 0 };
            let time = 0;
            const MAX_PARTICLES = 260;
            const SPAWN_INTERVAL = 2; // 像素移动距离阈值

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                // 深灰黑色背景，模拟宣纸的深色版本
                ctx.fillStyle = '#1a1a1e';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 墨水粒子 ─────────────────────────────────────────────
            class InkParticle {
                constructor(x, y, vx, vy, size, alpha) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx || (Math.random() - 0.5) * 0.5;
                    this.vy = vy || (Math.random() - 0.5) * 0.5;
                    this.size = size || 2 + Math.random() * 6;
                    this.alpha = alpha || 0.4 + Math.random() * 0.5;
                    this.maxAlpha = this.alpha;
                    this.decay = 0.0015 + Math.random() * 0.002;
                    this.wobble = Math.random() * Math.PI * 2;
                    this.wobbleSpeed = 0.2 + Math.random() * 0.4;
                    // 颜色：白色到浅灰
                    const gray = 80 + Math.floor(Math.random() * 30); // 80-110
                    this.color = `rgba(${gray + 40}, ${gray + 40}, ${gray + 45}, `;
                }

                update(dt, mouse) {
                    this.wobble += this.wobbleSpeed * dt;
                    // 随机游走
                    this.vx += Math.sin(this.wobble) * 0.02;
                    this.vy += Math.cos(this.wobble * 0.8) * 0.02;

                    // 鼠标影响：推开粒子（模拟毛笔拨动墨迹）
                    if (mouse.active) {
                        const dx = this.x - mouse.x;
                        const dy = this.y - mouse.y;
                        const distSq = dx * dx + dy * dy;
                        const radius = 120;
                        const radiusSq = radius * radius;
                        if (distSq < radiusSq && distSq > 0.01) {
                            const dist = Math.sqrt(distSq);
                            const falloff = 1 - dist / radius;
                            const force = falloff * 1.5;
                            const normX = dx / dist;
                            const normY = dy / dist;
                            this.vx += normX * force * 0.3;
                            this.vy += normY * force * 0.3;
                            // 被搅动时略微增亮
                            this.alpha = Math.min(this.maxAlpha + 0.15, 0.95);
                        } else {
                            this.alpha = this.maxAlpha;
                        }
                    }

                    // 阻尼
                    this.vx *= 0.96;
                    this.vy *= 0.96;

                    // 速度限制
                    const maxSpeed = 2.5;
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界反弹
                    if (this.x < 5) { this.x = 5; this.vx *= -0.5; }
                    if (this.x > W - 5) { this.x = W - 5; this.vx *= -0.5; }
                    if (this.y < 5) { this.y = 5; this.vy *= -0.5; }
                    if (this.y > H - 5) { this.y = H - 5; this.vy *= -0.5; }

                    // 缓慢衰减
                    this.alpha -= this.decay;
                    if (this.alpha < 0.02) {
                        this.alpha = 0;
                    }
                }

                draw(ctx) {
                    if (this.alpha <= 0) return;
                    const alpha = this.alpha;
                    const size = this.size * (0.8 + 0.4 * Math.sin(this.wobble * 2));

                    // 径向渐变墨迹
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, size * 2.2);
                    gradient.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.95})`);
                    gradient.addColorStop(0.3, `rgba(240, 240, 245, ${alpha * 0.6})`);
                    gradient.addColorStop(0.7, `rgba(220, 220, 230, ${alpha * 0.25})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size * 2.2, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心亮点
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 生成粒子 ─────────────────────────────────────────────
            function spawnParticle(x, y, vx, vy, size, alpha) {
                if (particles.length >= MAX_PARTICLES) {
                    // 移除最早的粒子（队首）
                    particles.shift();
                }
                particles.push(new InkParticle(x, y, vx, vy, size, alpha));
            }

            // ─── 初始化背景墨迹 ───────────────────────────────────────
            function initParticles() {
                const count = 150;
                for (let i = 0; i < count; i++) {
                    const x = Math.random() * W;
                    const y = Math.random() * H;
                    const size = 2 + Math.random() * 7;
                    const alpha = 0.2 + Math.random() * 0.4;
                    spawnParticle(x, y, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, size, alpha);
                }
            }

            // ─── 鼠标笔触 ─────────────────────────────────────────────
            function handleMouseMove(x, y) {
                if (mouse.active) {
                    const dx = x - mouse.lastX;
                    const dy = y - mouse.lastY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > SPAWN_INTERVAL && mouse.lastX > -9000) {
                        // 在移动路径上生成新粒子
                        const steps = Math.floor(dist / 3);
                        for (let i = 0; i <= steps; i++) {
                            const ratio = i / (steps || 1);
                            const px = mouse.lastX + dx * ratio;
                            const py = mouse.lastY + dy * ratio;
                            const vx = dx * 0.05 + (Math.random() - 0.5) * 0.4;
                            const vy = dy * 0.05 + (Math.random() - 0.5) * 0.4;
                            const size = 2 + Math.random() * 5;
                            const alpha = 0.5 + Math.random() * 0.4;
                            spawnParticle(px, py, vx, vy, size, alpha);
                        }
                    }
                }
                mouse.lastX = x;
                mouse.lastY = y;
            }

            // ─── 鼠标光晕 ─────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 50;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.06)');
                gradient.addColorStop(0.7, 'rgba(240, 240, 245, 0.02)');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    const dtNorm = fixedStep / 1000 * 60;
                    // 更新粒子
                    for (let i = particles.length - 1; i >= 0; i--) {
                        particles[i].update(dtNorm, mouse);
                        if (particles[i].alpha <= 0) {
                            particles.splice(i, 1);
                        }
                    }
                }

                // 半透明清除，保留墨迹余韵
                ctx.fillStyle = 'rgba(26, 26, 30, 0.12)';
                ctx.fillRect(0, 0, W, H);

                // 绘制粒子
                for (const p of particles) {
                    p.draw(ctx);
                }

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ─────────────────────────────────────────────
            function onMouseMove(e) {
                const x = e.clientX;
                const y = e.clientY;
                if (!mouse.active) {
                    mouse.active = true;
                    mouse.lastX = x;
                    mouse.lastY = y;
                }
                handleMouseMove(x, y);
                mouse.x = x;
                mouse.y = y;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
            }

            function onMouseDown(e) {
                const x = e.clientX;
                const y = e.clientY;
                mouse.active = true;
                mouse.x = x;
                mouse.y = y;
                mouse.lastX = x;
                mouse.lastY = y;
                // 点击产生浓墨爆发
                const count = 30 + Math.floor(Math.random() * 20);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1 + Math.random() * 5;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    const size = 3 + Math.random() * 6;
                    const alpha = 0.6 + Math.random() * 0.35;
                    spawnParticle(x, y, vx, vy, size, alpha);
                }
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    const x = touch.clientX;
                    const y = touch.clientY;
                    if (!mouse.active) {
                        mouse.active = true;
                        mouse.lastX = x;
                        mouse.lastY = y;
                    }
                    handleMouseMove(x, y);
                    mouse.x = x;
                    mouse.y = y;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    const x = touch.clientX;
                    const y = touch.clientY;
                    mouse.active = true;
                    mouse.x = x;
                    mouse.y = y;
                    mouse.lastX = x;
                    mouse.lastY = y;
                    const count = 20 + Math.floor(Math.random() * 15);
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 1 + Math.random() * 4;
                        spawnParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 3 + Math.random() * 6, 0.6 + Math.random() * 0.3);
                    }
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
            }

            function onResize() {
                setupCanvas();
                // 保留现有粒子，但可能需要调整位置
                for (const p of particles) {
                    p.x = Math.min(p.x, W - 5);
                    p.y = Math.min(p.y, H - 5);
                }
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initParticles();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 确保背景填充，避免白屏
            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#1a1a1e';
                    ctx.fillRect(0, 0, W, H);
                }
            });
        })();
    </script>
</body>
</html>
