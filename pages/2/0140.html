<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>水晶碎片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08081a;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="crystalCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('crystalCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                crystalCount: 32,            // 水晶碎片数量
                minSize: 10,                 // 最小尺寸
                maxSize: 30,                 // 最大尺寸
                attractRadius: 280,          // 鼠标吸引半径
                attractStrength: 0.02,       // 吸引强度
                returnForce: 0.015,          // 回弹力
                damping: 0.92,               // 速度阻尼
                clickRepelRadius: 220,       // 点击排斥半径
                clickRepelStrength: 22,      // 排斥强度
                randomForce: 0.06,           // 随机扰动
                backgroundFade: 0.18,        // 拖尾强度
                rotationSpeed: 0.015,        // 旋转速度
                // 颜色方案（紫水晶、蓝水晶、粉水晶、绿水晶等）
                colorPalette: [
                    { hue: 270, sat: 70, light: 65, glow: 'hsla(270, 80%, 75%, ' },
                    { hue: 210, sat: 75, light: 65, glow: 'hsla(210, 85%, 75%, ' },
                    { hue: 320, sat: 65, light: 70, glow: 'hsla(320, 75%, 80%, ' },
                    { hue: 160, sat: 60, light: 60, glow: 'hsla(160, 70%, 70%, ' },
                    { hue: 190, sat: 70, light: 65, glow: 'hsla(190, 80%, 75%, ' },
                    { hue: 290, sat: 65, light: 70, glow: 'hsla(290, 75%, 80%, ' },
                ]
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let crystals = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // ---------- 水晶类 ----------
            class Crystal {
                constructor(w, h) {
                    // 家的位置（原始位置）
                    this.homeX = Math.random() * w;
                    this.homeY = Math.random() * h;
                    this.x = this.homeX;
                    this.y = this.homeY;
                    this.vx = 0;
                    this.vy = 0;
                    // 尺寸
                    const size = Math.random() * (CONFIG.maxSize - CONFIG.minSize) + CONFIG.minSize;
                    this.size = size;
                    // 颜色
                    const palette = CONFIG.colorPalette[Math.floor(Math.random() * CONFIG.colorPalette.length)];
                    this.hue = palette.hue;
                    this.sat = palette.sat;
                    this.light = palette.light;
                    this.glowPrefix = palette.glow;
                    // 旋转
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * CONFIG.rotationSpeed * 2;
                    // 形状（菱形或六边形）
                    this.shapeType = Math.random() > 0.5 ? 'diamond' : 'hexagon';
                    // 脉冲相位
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 0.8 + 0.4;
                    // 透明度
                    this.alphaBase = 0.6 + Math.random() * 0.3;
                }

                update(dt, now, time) {
                    // 鼠标吸引
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = smoothMouseX - this.x;
                        const dy = smoothMouseY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.attractRadius && dist > 0.1) {
                            const force = (CONFIG.attractRadius - dist) / CONFIG.attractRadius * CONFIG.attractStrength;
                            this.vx += (dx / dist) * force * dt;
                            this.vy += (dy / dist) * force * dt;
                        }
                    }

                    // 回弹力（回home）
                    const returnDx = this.homeX - this.x;
                    const returnDy = this.homeY - this.y;
                    this.vx += returnDx * CONFIG.returnForce * dt;
                    this.vy += returnDy * CONFIG.returnForce * dt;

                    // 随机扰动
                    this.vx += (Math.random() - 0.5) * CONFIG.randomForce * dt;
                    this.vy += (Math.random() - 0.5) * CONFIG.randomForce * dt;

                    // 阻尼
                    this.vx *= CONFIG.damping;
                    this.vy *= CONFIG.damping;

                    // 更新位置
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 旋转
                    this.rotation += this.rotationSpeed * dt;

                    // 边界软限制
                    const margin = 100;
                    if (this.x < -margin) this.x = width + margin;
                    else if (this.x > width + margin) this.x = -margin;
                    if (this.y < -margin) this.y = height + margin;
                    else if (this.y > height + margin) this.y = -margin;
                }

                // 获取当前尺寸（带脉冲）
                getRenderSize() {
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 0.2;
                    return this.size * (1 + pulse);
                }

                // 绘制水晶
                draw() {
                    const renderSize = this.getRenderSize();
                    const alpha = this.alphaBase + Math.sin(time * this.pulseSpeed + this.pulsePhase) * 0.1;

                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);

                    // 绘制光晕（径向渐变）
                    const glowRadius = renderSize * 2.2;
                    const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowRadius);
                    glowGrad.addColorStop(0, `${this.glowPrefix}${alpha * 0.5})`);
                    glowGrad.addColorStop(1, `${this.glowPrefix}0)`);
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 绘制水晶主体
                    ctx.beginPath();
                    if (this.shapeType === 'diamond') {
                        // 菱形
                        const half = renderSize;
                        ctx.moveTo(0, -half);
                        ctx.lineTo(half * 0.7, 0);
                        ctx.lineTo(0, half);
                        ctx.lineTo(-half * 0.7, 0);
                    } else {
                        // 六边形
                        const R = renderSize;
                        for (let i = 0; i < 6; i++) {
                            const angle = Math.PI / 180 * (60 * i - 30);
                            const vx = R * Math.cos(angle);
                            const vy = R * Math.sin(angle);
                            if (i === 0) ctx.moveTo(vx, vy);
                            else ctx.lineTo(vx, vy);
                        }
                    }
                    ctx.closePath();

                    // 填充渐变
                    const fillGrad = ctx.createLinearGradient(-renderSize, -renderSize, renderSize, renderSize);
                    fillGrad.addColorStop(0, `hsla(${this.hue}, ${this.sat}%, ${this.light + 15}%, ${alpha})`);
                    fillGrad.addColorStop(0.5, `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${alpha * 0.9})`);
                    fillGrad.addColorStop(1, `hsla(${this.hue}, ${this.sat}%, ${this.light - 10}%, ${alpha * 0.7})`);
                    ctx.fillStyle = fillGrad;
                    ctx.fill();

                    // 描边高光
                    ctx.strokeStyle = `hsla(${this.hue}, 100%, 90%, ${alpha * 0.8})`;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    // 高光点（模拟棱镜折射）
                    const sparkX = renderSize * 0.3;
                    const sparkY = -renderSize * 0.3;
                    ctx.fillStyle = `hsla(0, 100%, 100%, ${alpha * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(sparkX, sparkY, renderSize * 0.18, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            // ---------- 初始化水晶 ----------
            function initCrystals() {
                crystals = [];
                for (let i = 0; i < CONFIG.crystalCount; i++) {
                    crystals.push(new Crystal(width, height));
                }
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#08081a';
                ctx.fillRect(0, 0, width, height);
                initCrystals();
                drawScene(performance.now());
            }

            // ---------- 绘制场景 ----------
            function drawScene(now) {
                // 半透明背景拖尾
                ctx.fillStyle = 'rgba(8, 8, 26, ' + CONFIG.backgroundFade + ')';
                ctx.fillRect(0, 0, width, height);

                // 平滑鼠标位置
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.2;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.2;
                }

                // 绘制鼠标光晕
                if (mouseActive && smoothMouseX > -1000) {
                    const glowRadius = 130;
                    const grad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY,
                        glowRadius);
                    grad.addColorStop(0, 'rgba(150, 180, 255, 0.08)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制所有水晶
                for (const crystal of crystals) {
                    crystal.draw();
                }
            }

            // ---------- 更新水晶 ----------
            function updateCrystals(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                for (const crystal of crystals) {
                    crystal.update(dt, now, time);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updateCrystals(now);
                drawScene(now);

                animationId = requestAnimationFrame(animate);
            }

            // ---------- 交互事件 ----------
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function handleClick(clientX, clientY) {
                // 对每个水晶施加向外排斥力
                for (const crystal of crystals) {
                    const dx = crystal.x - clientX;
                    const dy = crystal.y - clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.clickRepelRadius && dist > 0.01) {
                        const force = (1 - dist / CONFIG.clickRepelRadius) * CONFIG.clickRepelStrength;
                        crystal.vx += (dx / dist) * force;
                        crystal.vy += (dy / dist) * force;
                    }
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__crystalShards = {
                config: CONFIG,
                crystals: crystals,
            };
        })();
    </script>
</body>
</html>
