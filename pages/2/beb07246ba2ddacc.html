<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆柱面螺旋编织 · 六边形线网</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.85vw, 0.64rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 20px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.16);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.36rem, 0.68vw, 0.54rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">圆柱面螺旋编织 · 六边形线网</div>
        <div class="subtitle">CYLINDRICAL HELICAL WEAVE &nbsp;·&nbsp; 3 FAMILIES OF SPIRALS</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">轴向:</span> x=Rcosθₖ, z=Rsinθₖ, y=t &nbsp;
            <span class="c2">右旋:</span> x=Rcos(θₖ+ωt), z=Rsin(θₖ+ωt), y=t
            <br>
            <span class="c3">左旋:</span> x=Rcos(θₖ−ωt), z=Rsin(θₖ−ωt), y=t &nbsp;|&nbsp; R=2.4, L=7, n=20, ω=4π/L
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 18);

        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            22
        );
        camera.position.set(0.5, 0.2, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_REF = '#3a4a5c', C_GLINT = '#8898aa';

        const R = 2.4;
        const L = 7.0;
        const Y_MIN = -L / 2, Y_MAX = L / 2;
        const OMEGA = 4 * Math.PI / L; // 右旋频率
        const N = 20; // 每族线条数
        const SAMPLES = 300;

        // ==================== 创建螺旋线/直线 ====================
        function createAxialLines() {
            const group = new THREE.Group();
            for (let k = 0; k < N; k++) {
                const theta = (k / N) * Math.PI * 2;
                const x = R * Math.cos(theta);
                const z = R * Math.sin(theta);
                const pts = [
                    new THREE.Vector3(x, Y_MIN, z),
                    new THREE.Vector3(x, Y_MAX, z)
                ];
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C1),
                    transparent: true, opacity: 0.55, depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        function createHelicalLines(sign, colorHex, opacity) {
            const group = new THREE.Group();
            const omega = sign * OMEGA;
            for (let k = 0; k < N; k++) {
                const theta0 = (k / N) * Math.PI * 2;
                const pts = [];
                const dy = (Y_MAX - Y_MIN) / SAMPLES;
                for (let i = 0; i <= SAMPLES; i++) {
                    const y = Y_MIN + i * dy;
                    const angle = theta0 + omega * y;
                    const x = R * Math.cos(angle);
                    const z = R * Math.sin(angle);
                    pts.push(new THREE.Vector3(x, y, z));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const axialGroup = createAxialLines();
        const rightGroup = createHelicalLines(1, C2, 0.5);
        const leftGroup = createHelicalLines(-1, C3, 0.5);

        const mainGroup = new THREE.Group();
        mainGroup.add(axialGroup);
        mainGroup.add(rightGroup);
        mainGroup.add(leftGroup);
        scene.add(mainGroup);

        // 参考圆柱线框
        function createCylinderFrame() {
            const group = new THREE.Group();
            const circleDivs = 6;
            const yVals = [Y_MIN, Y_MIN*0.6, Y_MIN*0.2, Y_MAX*0.2, Y_MAX*0.6, Y_MAX];
            for (const y of yVals) {
                const pts = [];
                for (let i = 0; i <= 120; i++) {
                    const a = (i / 120) * Math.PI * 2;
                    pts.push(new THREE.Vector3(R * Math.cos(a), y, R * Math.sin(a)));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_REF),
                    transparent: true, opacity: 0.35, depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            // 几根纵向线
            for (let k = 0; k < 8; k++) {
                const theta = (k / 8) * Math.PI * 2;
                const x = R * Math.cos(theta), z = R * Math.sin(theta);
                const pts = [new THREE.Vector3(x, Y_MIN, z), new THREE.Vector3(x, Y_MAX, z)];
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_REF),
                    transparent: true, opacity: 0.28, depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const cylinderFrame = createCylinderFrame();
        mainGroup.add(cylinderFrame);

        // 端点圆环光点
        function endpointGlints() {
            const group = new THREE.Group();
            const sz = 0.06;
            for (const y of [Y_MIN, Y_MAX]) {
                for (let k = 0; k < N; k++) {
                    const theta = (k / N) * Math.PI * 2;
                    const pt = new THREE.Vector3(R * Math.cos(theta), y, R * Math.sin(theta));
                    const pairs = [
                        [pt.clone().add(new THREE.Vector3(-sz,0,0)), pt.clone().add(new THREE.Vector3(sz,0,0))],
                        [pt.clone().add(new THREE.Vector3(0,-sz,0)), pt.clone().add(new THREE.Vector3(0,sz,0))],
                        [pt.clone().add(new THREE.Vector3(0,0,-sz)), pt.clone().add(new THREE.Vector3(0,0,sz))],
                    ];
                    for (const [a,b] of pairs) {
                        const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                        const m = new THREE.LineBasicMaterial({
                            color: new THREE.Color(C_GLINT),
                            transparent: true, opacity: 0.55, depthWrite: true,
                        });
                        group.add(new THREE.Line(g, m));
                    }
                }
            }
            return group;
        }
        mainGroup.add(endpointGlints());

        // 原点标记
        function originGlint() {
            const group = new THREE.Group();
            const sz = 0.08;
            const pairs = [
                [new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0)],
                [new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0)],
                [new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)],
            ];
            for (const [a,b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true, opacity: 0.7, depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(originGlint());

        // ==================== 动画循环（绝对时间） ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s 线:${N*3}`);
                logTime = now;
            }

            // 绕Y轴旋转（圆柱轴线）
            mainGroup.rotation.y = time * 0.35;
            // 微小的XZ摇摆
            mainGroup.rotation.x = Math.sin(time * 0.22) * 0.15;
            mainGroup.rotation.z = Math.cos(time * 0.18) * 0.1;

            // 相机轻微游走
            const camX = 0.5 + Math.sin(time * 0.14) * 0.45;
            const camY = 0.2 + Math.cos(time * 0.17) * 0.4;
            camera.position.set(camX, camY, 7.2);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== 圆柱面螺旋编织 · 六边形线网 ===');
        console.log('轴向线(暖金):', N, '右旋(冰蓝):', N, '左旋(玫瑰粉):', N);
        console.log('圆柱半径:', R, '长度:', L);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
