<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲抛物面直母线 · 鞍面几何交响</title>
    <style>
        :root {
            --bg: #020408;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 42px rgba(200, 180, 150, 0.5), 0 0 72px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 0.9vw, 0.66rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }
        #formula-overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(2, 4, 8, 0.7);
            padding: 11px 23px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.42rem, 0.78vw, 0.62rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.27);
            line-height: 1.55;
            white-space: nowrap;
        }
        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }
        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 12px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.36rem;
                white-space: normal;
                line-height: 1.35;
            }
            #title-overlay .title {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">双曲抛物面直母线 · 鞍面几何交响</div>
        <div class="subtitle">HYPERBOLIC PARABOLOID RULINGS &nbsp;·&nbsp; SADDLE GEOMETRY</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">ℓ₁:</span> x=x₀, y=t, z=k·x₀·t &nbsp;
            <span class="c2">ℓ₂:</span> x=t, y=y₀, z=k·t·y₀ &nbsp;
            <span class="c3">□:</span> |x|≤3, |y|≤3, |z|≤2.7
            <br>
            <span style="color:#9aa8b8;">k=0.3 &nbsp;|&nbsp; 直纹曲面 &nbsp;|&nbsp; 双族母线交织</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#020408');
        scene.fog = new THREE.Fog('#020408', 8, 20);

        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            26
        );
        camera.position.set(2.8, 1.8, 8.0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c'; // 暖金 – 族1直线
        const C2 = '#5d9ec6'; // 冰蓝 – 族2直线
        const C3 = '#c77d9f'; // 玫瑰粉 – 立方体边框
        const C_GLINT = '#8898aa'; // 原点光点

        // ==================== 参数 ====================
        const K = 0.3; // z = k * x * y
        const RANGE = 3.0;
        const STEP = 0.18; // 直线密度
        const NUM_LINES = Math.floor(2 * RANGE / STEP) + 1;

        // ==================== 生成直母线顶点 ====================
        function generateRulingFamily(family) {
            const vertices = [];
            // family = 'x' 固定x 变化y；family = 'y' 固定y 变化x
            const values = [];
            for (let i = 0; i < NUM_LINES; i++) {
                values.push(-RANGE + i * STEP);
            }
            if (family === 'x') {
                for (const x0 of values) {
                    const y1 = -RANGE;
                    const y2 = RANGE;
                    const z1 = K * x0 * y1;
                    const z2 = K * x0 * y2;
                    vertices.push(x0, y1, z1, x0, y2, z2);
                }
            } else {
                for (const y0 of values) {
                    const x1 = -RANGE;
                    const x2 = RANGE;
                    const z1 = K * x1 * y0;
                    const z2 = K * x2 * y0;
                    vertices.push(x1, y0, z1, x2, y0, z2);
                }
            }
            return vertices;
        }

        const verticesFamily1 = generateRulingFamily('x');
        const verticesFamily2 = generateRulingFamily('y');

        function createLineSegments(vertices, colorHex, opacity) {
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            return new THREE.LineSegments(geom, mat);
        }

        const lines1 = createLineSegments(verticesFamily1, C1, 0.6);
        const lines2 = createLineSegments(verticesFamily2, C2, 0.58);

        // ==================== 立方体参考线框（玫瑰粉） ====================
        function createBoundingBoxWireframe(xRange, zRange, colorHex, opacity) {
            const hx = xRange;
            const hz = zRange;
            const corners = [
                new THREE.Vector3(-hx, -hx, -hz), new THREE.Vector3(hx, -hx, -hz),
                new THREE.Vector3(hx, hx, -hz), new THREE.Vector3(-hx, hx, -hz),
                new THREE.Vector3(-hx, -hx, hz), new THREE.Vector3(hx, -hx, hz),
                new THREE.Vector3(hx, hx, hz), new THREE.Vector3(-hx, hx, hz)
            ];
            const edges = [
                [0, 1], [1, 2], [2, 3], [3, 0],
                [4, 5], [5, 6], [6, 7], [7, 4],
                [0, 4], [1, 5], [2, 6], [3, 7]
            ];
            const vertices = [];
            for (const [i, j] of edges) {
                vertices.push(corners[i].x, corners[i].y, corners[i].z);
                vertices.push(corners[j].x, corners[j].y, corners[j].z);
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            return new THREE.LineSegments(geom, mat);
        }
        const zMax = K * RANGE * RANGE; // 2.7
        const boxLines = createBoundingBoxWireframe(RANGE, zMax, C3, 0.5);

        // ==================== 顶点光点（立方体角） ====================
        function createCornerGlints(xRange, zRange, colorHex, opacity, dotSize) {
            const hx = xRange;
            const hz = zRange;
            const corners = [
                [-hx, -hx, -hz], [hx, -hx, -hz], [hx, hx, -hz], [-hx, hx, -hz],
                [-hx, -hx, hz], [hx, -hx, hz], [hx, hx, hz], [-hx, hx, hz]
            ];
            const group = new THREE.Group();
            for (const [cx, cy, cz] of corners) {
                const center = new THREE.Vector3(cx, cy, cz);
                const sz = dotSize;
                const pairs = [
                    [center.clone().add(new THREE.Vector3(-sz, 0, 0)), center.clone().add(new THREE.Vector3(sz, 0, 0))],
                    [center.clone().add(new THREE.Vector3(0, -sz, 0)), center.clone().add(new THREE.Vector3(0, sz, 0))],
                    [center.clone().add(new THREE.Vector3(0, 0, -sz)), center.clone().add(new THREE.Vector3(0, 0, sz))],
                ];
                for (const [a, b] of pairs) {
                    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                    const m = new THREE.LineBasicMaterial({
                        color: new THREE.Color(colorHex),
                        transparent: true,
                        opacity: opacity,
                        depthWrite: true,
                    });
                    group.add(new THREE.Line(g, m));
                }
            }
            return group;
        }
        const cornerGlints = createCornerGlints(RANGE, zMax, C3, 0.6, 0.08);

        // ==================== 组装场景 ====================
        const mainGroup = new THREE.Group();
        mainGroup.add(lines1);
        mainGroup.add(lines2);
        mainGroup.add(boxLines);
        mainGroup.add(cornerGlints);
        scene.add(mainGroup);

        // ==================== 原点光点 ====================
        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.1;
            const pairs = [
                [new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0)],
                [new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0)],
                [new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)],
            ];
            for (const [a, b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true,
                    opacity: 0.7,
                    depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(createOriginGlint());

        // ==================== 动画循环（绝对时间） ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s`);
                logTime = now;
            }

            // 主结构绕对角线旋转
            mainGroup.rotation.y = time * 0.28;
            mainGroup.rotation.x = time * 0.16 + Math.sin(time * 0.23) * 0.2;
            mainGroup.rotation.z = Math.cos(time * 0.19) * 0.15;

            // 相机轻柔游走，保持结构在视野内
            const camX = 2.8 + Math.sin(time * 0.14) * 0.5;
            const camY = 1.8 + Math.cos(time * 0.18) * 0.5;
            const camZ = 8.0 + Math.sin(time * 0.11) * 0.55;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        // ==================== 启动 ====================
        console.log('=== 双曲抛物面直母线 · 鞍面几何交响 ===');
        console.log('直母线族1 (暖金):', NUM_LINES, '条');
        console.log('直母线族2 (冰蓝):', NUM_LINES, '条');
        console.log('总直线段数:', NUM_LINES * 2);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
