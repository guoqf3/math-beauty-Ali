<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC流 · 拓扑混沌织锦</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>ABC流 · 拓扑混沌织锦</h2>
        <div class="sub">Arnold–Beltrami–Childress flow · Chaotic streamlines</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">ẋ = A sin z + C cos y</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">ẏ = B sin x + A cos z</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">ż = C sin y + B cos x</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.2, 2.4, 7.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        clock.start();

        // ---------- 颜色 ----------
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // ---------- ABC 流参数 ----------
        const A = Math.sqrt(3);
        const B = Math.sqrt(2);
        const C = 1.0;

        // ---------- 数值积分 ABC 流速度场 ----------
        function abcFlow(p) {
            const x = p.x, y = p.y, z = p.z;
            return new THREE.Vector3(
                A * Math.sin(z) + C * Math.cos(y),
                B * Math.sin(x) + A * Math.cos(z),
                C * Math.sin(y) + B * Math.cos(x)
            );
        }

        // RK4 积分一步
        function rk4Step(p, h) {
            const k1 = abcFlow(p);
            const p2 = p.clone().add(k1.clone().multiplyScalar(h * 0.5));
            const k2 = abcFlow(p2);
            const p3 = p.clone().add(k2.clone().multiplyScalar(h * 0.5));
            const k3 = abcFlow(p3);
            const p4 = p.clone().add(k3.clone().multiplyScalar(h));
            const k4 = abcFlow(p4);
            const increment = k1.clone().add(
                k2.clone().multiplyScalar(2)
            ).add(
                k3.clone().multiplyScalar(2)
            ).add(k4).multiplyScalar(h / 6.0);
            return p.clone().add(increment);
        }

        // 集成一条轨迹，返回点数组，同时监视是否超出边界
        function integrateTrajectory(seed, h, steps, maxRadius = 4.5) {
            const points = [];
            let current = seed.clone();
            points.push(current.clone());
            for (let i = 0; i < steps; i++) {
                current = rk4Step(current, h);
                if (current.length() > maxRadius) break; // 超出球壳则停止
                points.push(current.clone());
            }
            return points;
        }

        // ---------- 全局缩放因子，使轨迹适应视图 ----------
        const SCALE = 0.55;

        // ---------- 创建所有流线 ----------
        const flowGroup = new THREE.Group();
        flowGroup.name = 'abc-streamlines';
        scene.add(flowGroup);

        // 随机种子生成器 (球内均匀分布)
        function randomPointInSphere(radius) {
            while (true) {
                const x = (Math.random() - 0.5) * 2;
                const y = (Math.random() - 0.5) * 2;
                const z = (Math.random() - 0.5) * 2;
                const p = new THREE.Vector3(x, y, z);
                if (p.length() <= 1) {
                    return p.multiplyScalar(radius);
                }
            }
        }

        const h = 0.015;          // 积分步长
        const steps = 1600;       // 每线条点数
        const totalLines = 66;    // 线条总数，3种颜色各22条

        // 生成种子，按象限分配颜色
        const seeds = [];
        for (let i = 0; i < totalLines; i++) {
            seeds.push(randomPointInSphere(0.9));
        }

        // 为每条流线生成几何体并添加到场景
        seeds.forEach((seed, index) => {
            let color;
            const x = seed.x, y = seed.y, z = seed.z;
            // 根据主要方向分配颜色
            const maxCoord = Math.max(Math.abs(x), Math.abs(y), Math.abs(z));
            if (maxCoord === Math.abs(x)) {
                color = (x >= 0) ? COLOR_GOLD : COLOR_CYAN;
            } else if (maxCoord === Math.abs(y)) {
                color = (y >= 0) ? COLOR_CYAN : COLOR_MAGENTA;
            } else {
                color = (z >= 0) ? COLOR_MAGENTA : COLOR_GOLD;
            }

            // 计算轨迹
            const rawPoints = integrateTrajectory(seed, h, steps, 4.2);
            if (rawPoints.length < 2) return; // 丢弃太短的线

            // 缩放点
            const scaledPoints = rawPoints.map(p => p.clone().multiplyScalar(SCALE));
            const geom = new THREE.BufferGeometry().setFromPoints(scaledPoints);
            const mat = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.58,
                depthWrite: true,
                depthTest: true,
            });
            const line = new THREE.Line(geom, mat);
            flowGroup.add(line);
        });

        console.log(`已生成 ${flowGroup.children.length} 条 ABC 流线`);

        // ---------- 背景星点 ----------
        const starsGroup = new THREE.Group();
        starsGroup.name = 'stars';
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 9;
            starsPositions[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPositions[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPositions[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.5,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---------- 动画循环 ----------
        function animate() {
            const elapsed = clock.getElapsedTime();

            // 流线整体旋转
            flowGroup.rotation.x = elapsed * 0.19;
            flowGroup.rotation.y = elapsed * 0.28;
            flowGroup.rotation.z = elapsed * 0.12;

            // 星点旋转
            starsGroup.rotation.y = elapsed * 0.04;
            starsGroup.rotation.x = elapsed * 0.025;

            // 相机环绕
            const camRadius = 7.6;
            const camAngle = elapsed * 0.08;
            const camHeight = 2.5 + Math.sin(elapsed * 0.18) * 0.9;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);

        // ---------- 窗口缩放 ----------
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
        onResize();

        console.log('✨ ABC 流拓扑混沌织锦动画已启动');
    </script>
</body>
</html>
