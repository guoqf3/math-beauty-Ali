<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SO(3)大圆编织 · 旋转群轨道网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>SO(3)大圆编织 · 旋转群轨道网</h2>
        <div class="sub">Great circle orbits under SO(3) · Irrational rotations · Spatial braid</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">Γ₁ = R(ω₁t)·S¹ₓ</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">Γ₂ = R(ω₂t)·S¹_y</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">Γ₃ = R(ω₃t)·S¹_z</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 容器与场景
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.6, 7.4);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟
        const clock = new THREE.Clock();
        function getElapsed() { return clock.getElapsedTime(); }

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const RADIUS = 2.65;
        const CIRCLE_POINTS = 320;

        // ---- 在球面上生成大圆 ----
        function createGreatCircle(normal, radius) {
            const pts = [];
            let u, v;
            if (Math.abs(normal.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(normal).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
            }
            v = normal.clone().cross(u).normalize();
            const dAngle = 2 * Math.PI / CIRCLE_POINTS;
            for (let i = 0; i <= CIRCLE_POINTS; i++) {
                const angle = i * dAngle;
                const pt = u.clone().multiplyScalar(Math.cos(angle) * radius)
                    .add(v.clone().multiplyScalar(Math.sin(angle) * radius));
                pts.push(pt);
            }
            return pts;
        }

        // ---- 生成初始大圆法向量族 ----
        function generateInitialNormals(count) {
            const normals = [];
            // 用Fibonacci球分布生成均匀法向量
            const phi = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < count; i++) {
                const y = 1 - (2 * i + 1) / count;
                const rAtY = Math.sqrt(1 - y * y);
                const theta = phi * i;
                normals.push(new THREE.Vector3(
                    rAtY * Math.cos(theta),
                    y,
                    rAtY * Math.sin(theta)
                ).normalize());
            }
            return normals;
        }

        // ---- 构建三族大圆并应用旋转群轨道 ----
        // 金色族：初始法向量接近x轴，沿y轴方向旋转
        // 青色族：初始法向量接近y轴，沿z轴方向旋转
        // 品红族：初始法向量接近z轴，沿对角线方向旋转
        function createOrbitalCircles(normals, rotAxis, color, opacity, numRotations, angleStep) {
            const group = new THREE.Group();
            for (const n of normals) {
                // 对每个初始法向量，应用一系列旋转生成轨道
                for (let k = 0; k < numRotations; k++) {
                    const angle = k * angleStep;
                    const quat = new THREE.Quaternion().setFromAxisAngle(rotAxis, angle);
                    const rotatedNormal = n.clone().applyQuaternion(quat);
                    const circlePts = createGreatCircle(rotatedNormal, RADIUS);
                    if (circlePts.length >= 2) {
                        const geom = new THREE.BufferGeometry().setFromPoints(circlePts);
                        const mat = new THREE.LineBasicMaterial({
                            color, transparent: true, opacity, depthWrite: true, depthTest: true,
                        });
                        group.add(new THREE.Line(geom, mat));
                    }
                }
            }
            return group;
        }

        // 三族初始法向量
        const numSeeds = 12;
        const allNormals = generateInitialNormals(numSeeds * 3);

        // 金色：初始法向量主要沿x方向，旋转轴为(0,1,0)
        const goldNormals = allNormals.slice(0, numSeeds).map(n => {
            return new THREE.Vector3(Math.abs(n.x), n.y, n.z).normalize();
        });
        const goldAxis = new THREE.Vector3(0, 1, 0).normalize();
        const goldGroup = createOrbitalCircles(goldNormals, goldAxis, COLOR_GOLD, 0.48, 18, 2 * Math.PI / 18);
        goldGroup.name = 'gold-family';

        // 青色：初始法向量主要沿y方向，旋转轴为(0,0,1)
        const cyanNormals = allNormals.slice(numSeeds, numSeeds * 2).map(n => {
            return new THREE.Vector3(n.x, Math.abs(n.y), n.z).normalize();
        });
        const cyanAxis = new THREE.Vector3(0, 0, 1).normalize();
        const cyanGroup = createOrbitalCircles(cyanNormals, cyanAxis, COLOR_CYAN, 0.48, 18, 2 * Math.PI / 18);
        cyanGroup.name = 'cyan-family';

        // 品红：初始法向量主要沿z方向，旋转轴为(1,1,0)/√2
        const magentaNormals = allNormals.slice(numSeeds * 2).map(n => {
            return new THREE.Vector3(n.x, n.y, Math.abs(n.z)).normalize();
        });
        const magentaAxis = new THREE.Vector3(1, 1, 0).normalize();
        const magentaGroup = createOrbitalCircles(magentaNormals, magentaAxis, COLOR_MAGENTA, 0.48, 18, 2 * Math.PI / 18);
        magentaGroup.name = 'magenta-family';

        // 额外增加密度：使用较小的旋转步长
        const goldGroup2 = createOrbitalCircles(goldNormals, goldAxis, COLOR_GOLD, 12, 0.35, 2 * Math.PI / 30);
        const cyanGroup2 = createOrbitalCircles(cyanNormals, cyanAxis, COLOR_CYAN, 12, 0.35, 2 * Math.PI / 30);
        const magentaGroup2 = createOrbitalCircles(magentaNormals, magentaAxis, COLOR_MAGENTA, 12, 0.35, 2 * Math.PI / 30);

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'so3-orbits';
        rootGroup.add(goldGroup);
        rootGroup.add(cyanGroup);
        rootGroup.add(magentaGroup);
        rootGroup.add(goldGroup2);
        rootGroup.add(cyanGroup2);
        rootGroup.add(magentaGroup2);
        scene.add(rootGroup);

        console.log('SO(3)大圆编织线条总数:', rootGroup.children.length);

        // 辅助球面参考线（极淡）
        const refWireGeom = new THREE.SphereGeometry(RADIUS * 0.998, 40, 24);
        const refEdges = new THREE.EdgesGeometry(refWireGeom);
        const refWire = new THREE.LineSegments(refEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.10, depthWrite: true, depthTest: true
        }));
        rootGroup.add(refWire);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 使用 setAnimationLoop 确保稳定 ----
        function animate() {
            const t = getElapsed();

            // 三个子组以无理数频率绕各自轴旋转
            goldGroup.rotation.set(
                Math.sin(t * 0.31) * 0.2,
                t * 0.37,
                Math.cos(t * 0.25) * 0.2
            );
            cyanGroup.rotation.set(
                t * 0.33,
                Math.sin(t * 0.28) * 0.2,
                Math.cos(t * 0.22) * 0.2
            );
            magentaGroup.rotation.set(
                Math.cos(t * 0.24) * 0.2,
                t * 0.35,
                Math.sin(t * 0.29) * 0.2
            );

            // 额外组也独立旋转
            goldGroup2.rotation.copy(goldGroup.rotation);
            cyanGroup2.rotation.copy(cyanGroup.rotation);
            magentaGroup2.rotation.copy(magentaGroup.rotation);

            // 整体绕缓慢变化的轴旋转
            rootGroup.rotation.x = t * 0.11;
            rootGroup.rotation.y = t * 0.15;
            rootGroup.rotation.z = t * 0.06;

            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.5;
            const camAngle = t * 0.08;
            const camHeight = 2.7 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // 预渲染一帧确保立即显示
        renderer.render(scene, camera);

        // 使用 setAnimationLoop 启动循环
        renderer.setAnimationLoop(animate);

        // 响应式调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ SO(3)大圆编织动画已稳定运行');
    </script>
</body>
</html>
