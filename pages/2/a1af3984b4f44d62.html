<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ca 钙 · 20 电子量子力学云</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    overflow:hidden;background:#05070d;color:#e8eefc;
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{display:block}

  #info{
    position:absolute;top:12px;left:12px;z-index:10;
    background:rgba(8,12,22,.78);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(120,170,255,.18);
    padding:14px 16px;border-radius:12px;
    width:min(390px, calc(100vw - 24px));
    font-size:13px;line-height:1.7;user-select:none;
    max-height:calc(100vh - 24px);overflow-y:auto;
  }
  #info h3{margin-bottom:10px;color:#6cf;font-size:15px;letter-spacing:.5px}
  #orbList{
    display:grid;grid-template-columns:1fr 1fr;
    gap:3px 8px;margin-bottom:10px;
  }
  .orb-row{
    display:flex;align-items:center;gap:7px;
    padding:3px 7px;border-radius:5px;
    font-size:12px;opacity:.22;
    transition:opacity .35s, background .35s, color .35s;
    font-variant-numeric:tabular-nums;
  }
  .orb-row.on{opacity:1;background:rgba(100,180,255,.10);color:#fff}
  .orb-row .name{
    font-family:'Menlo','Consolas','Courier New',monospace;
    font-weight:600;min-width:34px;
  }
  .orb-row .bar{
    flex:1;height:4px;border-radius:2px;
    background:rgba(120,170,255,.12);
    overflow:hidden;position:relative;
  }
  .orb-row .fill{
    position:absolute;inset:0 auto 0 0;
    border-radius:2px;
    transition:opacity .35s;
    opacity:.35;
    min-width:4px;
  }
  .orb-row.on .fill{opacity:1}

  .legend{display:flex;gap:14px;margin-top:4px;padding-top:8px;
          border-top:1px solid rgba(120,170,255,.12);font-size:11px;color:#8fa6c5}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  #info p{margin-top:8px;color:#7f92ad;font-size:11px;line-height:1.6}
  #qNote{
    margin-top:8px;padding:8px 11px;border-radius:7px;
    background:rgba(80,180,255,.07);
    border:1px solid rgba(100,180,255,.18);
    font-size:11px;color:#8fb8e0;line-height:1.6;
  }
  #qNote b{color:#7ec8ff}

  #hud{
    position:absolute;right:12px;bottom:12px;z-index:10;
    display:flex;flex-direction:column;align-items:flex-end;gap:8px;
    user-select:none;
  }
  #counter{
    background:rgba(8,12,22,.78);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(120,170,255,.18);
    padding:9px 15px;border-radius:10px;
    font-variant-numeric:tabular-nums;
    font-size:13px;color:#8fa6c5;
  }
  #counter b{color:#6cf;font-size:17px;font-weight:700;padding:0 2px}
  #hint{
    padding:8px 15px;border-radius:10px;font-size:13px;
    background:rgba(80,200,255,.12);
    border:1px solid rgba(100,200,255,.35);
    color:#bfe6ff;
    animation:pulse 2.2s ease-in-out infinite;
    max-width:300px;text-align:right;
  }
  #hint.done{
    animation:none;color:#7ef0b4;
    background:rgba(80,255,170,.10);
    border-color:rgba(100,255,180,.35);
  }
  @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
  .btns{display:flex;gap:8px}
  button{
    font:inherit;font-size:12px;color:#cfe2ff;cursor:pointer;
    background:rgba(20,28,48,.85);
    border:1px solid rgba(120,170,255,.28);
    padding:7px 14px;border-radius:9px;
    transition:background .2s,border-color .2s;
  }
  button:hover{background:rgba(40,60,100,.9);border-color:rgba(140,200,255,.55)}
  button:active{transform:translateY(1px)}
</style>
</head>
<body>

<div id="info">
  <h3>Ca 钙（Z=20）· 量子力学电子云</h3>
  <div id="orbList"></div>
  <div class="legend">
    <span><i style="background:#4da3ff;box-shadow:0 0 6px #4da3ff"></i>s</span>
    <span><i style="background:#3ddbca;box-shadow:0 0 6px #3ddbca"></i>p</span>
  </div>
  <p>点击画面 → 按真实填充顺序添加一个亚层<br>拖拽旋转 · 滚轮缩放 · 双击切换自转</p>
  <div id="qNote">
    <b>Ca 排布：</b>1s² 2s² 2p⁶ 3s² 3p⁶ 4s²<br>
    <b>量子图像：</b>s 亚层球对称、p 亚层哑铃形，<br>
    电子作为 |ψ|² 概率采样点在云中随机游走。
  </div>
</div>

<div id="hud">
  <div id="counter">
    亚层 <b id="curOrb">0</b>/6 &nbsp;·&nbsp; 电子 <b id="curE">0</b>/20
  </div>
  <div id="hint">点击画面，开始填充 1s²</div>
  <div class="btns">
    <button id="btnAuto">自转：开</button>
    <button id="btnAll">全部显示</button>
    <button id="btnReset">重置</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════════
   1. 场景 / 相机 / 渲染器
   ═══════════════════════════════════════════════════════════ */
const scene = new THREE.Scene();

const DEFAULT_CAM = new THREE.Vector3(7, 5.5, 11);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.copy(DEFAULT_CAM);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 2;
controls.maxDistance = 60;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;

/* ═══════════════════════════════════════════════════════════
   2. 光照
   ═══════════════════════════════════════════════════════════ */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const keyLight = new THREE.DirectionalLight(0xbcd8ff, 1.8);
keyLight.position.set(6, 10, 8);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xff88aa, 1.0);
rimLight.position.set(-8, -6, -6);
scene.add(rimLight);

const coreLight = new THREE.PointLight(0xff7744, 16, 24, 2);
scene.add(coreLight);

/* ═══════════════════════════════════════════════════════════
   3. 原子核
   ═══════════════════════════════════════════════════════════ */
const nucleus = new THREE.Mesh(
  new THREE.SphereGeometry(0.42, 32, 32),
  new THREE.MeshStandardMaterial({
    color: 0xff4d4d,
    emissive: 0xff2a00,
    emissiveIntensity: 1.8,
    roughness: 0.35, metalness: 0.1
  })
);
scene.add(nucleus);

/* ═══════════════════════════════════════════════════════════
   4. 实球谐函数 Y_l^m(θ, φ)
   ═══════════════════════════════════════════════════════════ */
const Y_FN = {
  '0,0':  ()       => 0.2820948,
  // p
  '1,0':  (t)      => 0.4886025 * Math.cos(t),
  '1,1':  (t, p)   => 0.4886025 * Math.sin(t) * Math.cos(p),
  '1,-1': (t, p)   => 0.4886025 * Math.sin(t) * Math.sin(p),
  // d（Ca 用不到，保留以备扩展）
  '2,0':  (t)      => 0.3153916 * (3 * Math.cos(t) ** 2 - 1),
  '2,1':  (t, p)   => 1.0925484 * Math.sin(t) * Math.cos(t) * Math.cos(p),
  '2,-1': (t, p)   => 1.0925484 * Math.sin(t) * Math.cos(t) * Math.sin(p),
  '2,2':  (t, p)   => 0.5462742 * Math.sin(t) ** 2 * Math.cos(2 * p),
  '2,-2': (t, p)   => 0.5462742 * Math.sin(t) ** 2 * Math.sin(2 * p),
  // f（同上）
  '3,0':  (t)      => 0.3731763 * (5 * Math.cos(t) ** 3 - 3 * Math.cos(t)),
  '3,1':  (t, p)   => 0.4570458 * Math.sin(t) * (5 * Math.cos(t) ** 2 - 1) * Math.cos(p),
  '3,-1': (t, p)   => 0.4570458 * Math.sin(t) * (5 * Math.cos(t) ** 2 - 1) * Math.sin(p),
  '3,2':  (t, p)   => 1.4453057 * Math.sin(t) ** 2 * Math.cos(t) * Math.cos(2 * p),
  '3,-2': (t, p)   => 1.4453057 * Math.sin(t) ** 2 * Math.cos(t) * Math.sin(2 * p),
  '3,3':  (t, p)   => 0.5900436 * Math.sin(t) ** 3 * Math.cos(3 * p),
  '3,-3': (t, p)   => 0.5900436 * Math.sin(t) ** 3 * Math.sin(3 * p),
};

/* 每个亚层拆成哪些 m 子轨道（决定空间取向数量） */
const SUBORBITALS = {
  s: [{ m: 0 }],
  p: [{ m: 0 }, { m: 1 }, { m: -1 }],
  d: [{ m: 0 }, { m: 1 }, { m: -1 }, { m: 2 }, { m: -2 }],
  f: [{ m: 0 }, { m: 1 }, { m: -1 }, { m: 2 }, { m: -2 },
      { m: 3 }, { m: -3 }],
};

const L_OF = { s: 0, p: 1, d: 2, f: 3 };
const subColor = { s: 0x4da3ff, p: 0x3ddbca, d: 0xb8e05a, f: 0xffa54d };

/* ═══════════════════════════════════════════════════════════
   5. Ca 的真实填充顺序 + Slater Z_eff
   ═══════════════════════════════════════════════════════════
   1s² 2s² 2p⁶ 3s² 3p⁶ 4s²  →  共 20 个电子
   4s 先于 3d 填充（n+l = 4 < 5）
   ─────────────────────────────────────────────────────────── */
const orbitals = [
  { name: '1s', n: 1, type: 's', count: 2, zeff: 19.70 },   // 20 − 0.30
  { name: '2s', n: 2, type: 's', count: 2, zeff: 17.95 },   // 20 − 2.05
  { name: '2p', n: 2, type: 'p', count: 6, zeff: 16.55 },   // 20 − 3.45
  { name: '3s', n: 3, type: 's', count: 2, zeff: 10.85 },   // 20 − 9.15
  { name: '3p', n: 3, type: 'p', count: 6, zeff:  9.45 },   // 20 − 10.55
  { name: '4s', n: 4, type: 's', count: 2, zeff:  2.85 },   // 20 − 17.15
];

/* 能量活跃度因子 ef：0（1s）→ 1（4s） */
const shellEnergy = {};
for (let n = 1; n <= 4; n++) {
  const ef = (n - 1) / 3;
  shellEnergy[n] = {
    ef,
    emissiveBoost: 0.4 + 1.6 * ef,
    cloudOpacity:  0.35 + 0.55 * ef,
    wanderSpeed:   0.45 + 1.4  * ef,
    pulseAmp:      0.02 + 0.18 * ef,
  };
}

/* 主壳层视觉半径（4 层） */
const shellRadius = { 1: 1.30, 2: 2.60, 3: 3.90, 4: 5.20 };

/* ═══════════════════════════════════════════════════════════
   6. 工具
   ═══════════════════════════════════════════════════════════ */
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const toSup = n => String(n).split('').map(c => SUP[c]).join('');

const C1 = 1.70158, C3 = C1 + 1;
const easeOutBack = x => 1 + C3 * Math.pow(x - 1, 3) + C1 * Math.pow(x - 1, 2);

/* 拒绝采样：从 |Y|² 分布取一个方向 */
function sampleDirection(l, m, maxY2) {
  const fn = Y_FN[`${l},${m}`];
  for (let i = 0; i < 200; i++) {
    const t = Math.acos(2 * Math.random() - 1);
    const p = 2 * Math.PI * Math.random();
    if (Math.random() * maxY2 < fn(t, p) ** 2) {
      return { theta: t, phi: p };
    }
  }
  return { theta: Math.PI / 2, phi: 0 };
}

function directionToVec(theta, phi, R) {
  const st = Math.sin(theta);
  return new THREE.Vector3(
    R * st * Math.cos(phi),
    R * Math.cos(theta),
    R * st * Math.sin(phi)
  );
}

const maxY2Cache = {};
function getMaxY2(l, m) {
  const key = `${l},${m}`;
  if (maxY2Cache[key] !== undefined) return maxY2Cache[key];
  const fn = Y_FN[key];
  let mx = 0;
  for (let i = 0; i < 800; i++) {
    const t = Math.acos(2 * Math.random() - 1);
    const p = 2 * Math.PI * Math.random();
    const y2 = fn(t, p) ** 2;
    if (y2 > mx) mx = y2;
  }
  maxY2Cache[key] = mx * 1.01;
  return maxY2Cache[key];
}

/* ═══════════════════════════════════════════════════════════
   7. 构建所有轨道：云 + 电子
   ═══════════════════════════════════════════════════════════ */
const CLOUD_POINTS_PER_ORBITAL = 90;
const orbitalData = [];
const fadeList = [];

for (const orb of orbitals) {
  const l    = L_OF[orb.type];
  const R    = shellRadius[orb.n];
  const col  = subColor[orb.type];
  const en   = shellEnergy[orb.n];
  const subs = SUBORBITALS[orb.type];

  for (const sub of subs) {
    const maxY2 = getMaxY2(l, sub.m);

    /* ── 云点 ── */
    const cloudPts = [];
    const radialJitter = R * 0.10;
    for (let i = 0; i < CLOUD_POINTS_PER_ORBITAL; i++) {
      const { theta, phi } = sampleDirection(l, sub.m, maxY2);
      const rr = R + (Math.random() - 0.5) * radialJitter;
      cloudPts.push(directionToVec(theta, phi, rr));
    }

    const cloudGeo = new THREE.BufferGeometry().setFromPoints(cloudPts);
    const cloudMat = new THREE.PointsMaterial({
      color: col,
      size: 0.10,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });
    const cloudMesh = new THREE.Points(cloudGeo, cloudMat);
    cloudMesh.visible = false;
    scene.add(cloudMesh);

    /* ── 2 个电子 ── */
    const electrons = [];
    for (let i = 0; i < 2; i++) {
      const eGeo = new THREE.SphereGeometry(0.10, 12, 12);
      const eMat = new THREE.MeshStandardMaterial({
        color: col,
        emissive: col,
        emissiveIntensity: en.emissiveBoost,
        roughness: 0.3, metalness: 0,
      });
      const mesh = new THREE.Mesh(eGeo, eMat);
      mesh.visible = false;

      const { theta, phi } = sampleDirection(l, sub.m, maxY2);
      mesh.position.copy(directionToVec(theta, phi, R));

      scene.add(mesh);

      electrons.push({
        mesh,
        l, m: sub.m, R, maxY2, fn: Y_FN[`${l},${sub.m}`],
        target: new THREE.Vector3(),
        hasTarget: false,
        spawnT: 0,
        spawning: false,
      });
    }

    orbitalData.push({
      orbName: orb.name,
      shellN:  orb.n,
      l, m:    sub.m,
      R, col,
      energy:  en,
      cloudMesh, cloudMat,
      electrons,
      revealed: false,
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   8. 面板
   ═══════════════════════════════════════════════════════════ */
const orbListEl = document.getElementById('orbList');

for (const orb of orbitals) {
  const ef = shellEnergy[orb.n].ef;
  const row = document.createElement('div');
  row.className = 'orb-row';
  row.dataset.orb = orb.name;
  const rC = Math.round(80  + 175 * ef);
  const gC = Math.round(160 - 40  * ef);
  const bC = Math.round(255 - 180 * ef);
  row.innerHTML =
    `<span class="name">${orb.name}${toSup(orb.count)}</span>` +
    `<div class="bar"><div class="fill" style="width:${(ef*100).toFixed(0)}%;background:rgb(${rC},${gC},${bC})"></div></div>`;
  orbListEl.appendChild(row);
}

/* ═══════════════════════════════════════════════════════════
   9. HUD / 状态
   ═══════════════════════════════════════════════════════════ */
let cursor = 0;
const elCurOrb = document.getElementById('curOrb');
const elCurE   = document.getElementById('curE');
const elHint   = document.getElementById('hint');

function updateHUD() {
  const eShown = orbitals.slice(0, cursor).reduce((s, o) => s + o.count, 0);
  elCurOrb.textContent = cursor;
  elCurE.textContent   = eShown;

  document.querySelectorAll('.orb-row').forEach(row => {
    const idx = orbitals.findIndex(o => o.name === row.dataset.orb);
    row.classList.toggle('on', idx < cursor);
  });

  if (cursor >= orbitals.length) {
    elHint.textContent = '✔ 20 个电子全部就位（Ca 基态）';
    elHint.classList.add('done');
  } else {
    const next = orbitals[cursor];
    elHint.textContent = `点击 → 添加 ${next.name}${toSup(next.count)}（${next.count}e⁻）`;
    elHint.classList.remove('done');
  }
}

/* ═══════════════════════════════════════════════════════════
   10. 揭示一个亚层
   ═══════════════════════════════════════════════════════════ */
function revealNext(silent) {
  if (cursor >= orbitals.length) return;
  const orb = orbitals[cursor++];

  const matches = orbitalData.filter(d => d.orbName === orb.name);
  for (const d of matches) {
    d.revealed = true;
    d.cloudMesh.visible = true;
    d.cloudMat.opacity = 0;
    fadeList.push({ mat: d.cloudMat, target: d.energy.cloudOpacity });

    for (const e of d.electrons) {
      e.mesh.visible = true;
      e.mesh.scale.setScalar(0.001);
      e.spawning = true;
      e.spawnT = 0;
      e.hasTarget = false;
    }
  }

  if (!silent) updateHUD();
}

/* ═══════════════════════════════════════════════════════════
   11. 事件
   ═══════════════════════════════════════════════════════════ */
const canvasEl = renderer.domElement;
let ptrDown = null;

canvasEl.addEventListener('pointerdown', e => {
  ptrDown = { x: e.clientX, y: e.clientY, id: e.pointerId };
});

canvasEl.addEventListener('pointerup', e => {
  if (!ptrDown || e.pointerId !== ptrDown.id) return;
  const dx = e.clientX - ptrDown.x, dy = e.clientY - ptrDown.y;
  ptrDown = null;
  if (dx * dx + dy * dy > 36) return;
  revealNext();
});

canvasEl.addEventListener('pointercancel', () => { ptrDown = null; });

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    revealNext();
  }
});

canvasEl.addEventListener('dblclick', () => {
  controls.autoRotate = !controls.autoRotate;
  btnAuto.textContent = '自转：' + (controls.autoRotate ? '开' : '关');
});

const btnAuto  = document.getElementById('btnAuto');
const btnAll   = document.getElementById('btnAll');
const btnReset = document.getElementById('btnReset');

btnAuto.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnAuto.textContent = '自转：' + (controls.autoRotate ? '开' : '关');
});

btnAll.addEventListener('click', () => {
  while (cursor < orbitals.length) revealNext(true);
  updateHUD();
});

btnReset.addEventListener('click', () => {
  cursor = 0;

  for (const d of orbitalData) {
    d.revealed = false;
    d.cloudMesh.visible = false;
    d.cloudMat.opacity = 0;
    for (const e of d.electrons) {
      e.mesh.visible = false;
      e.mesh.scale.setScalar(0.001);
      e.spawning = false;
      e.hasTarget = false;
    }
  }
  fadeList.length = 0;

  camera.position.copy(DEFAULT_CAM);
  controls.target.set(0, 0, 0);
  controls.update();

  updateHUD();
});

/* ═══════════════════════════════════════════════════════════
   12. 渲染循环
   ═══════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  /* 电子：弹入 + 量子游走 */
  for (const d of orbitalData) {
    if (!d.revealed) continue;
    const en = d.energy;

    for (const e of d.electrons) {
      if (e.spawning) {
        e.spawnT += dt * 3.0;
        if (e.spawnT >= 1) {
          e.spawnT = 1;
          e.spawning = false;
          e.mesh.scale.setScalar(1);
        } else {
          e.mesh.scale.setScalar(easeOutBack(e.spawnT));
        }
      }

      const pos = e.mesh.position;

      if (!e.hasTarget) {
        const { theta, phi } = sampleDirection(e.l, e.m, e.maxY2);
        e.target.copy(directionToVec(theta, phi, e.R));
        e.hasTarget = true;
      }

      const dx = e.target.x - pos.x;
      const dy = e.target.y - pos.y;
      const dz = e.target.z - pos.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

      if (dist < 0.08) {
        e.hasTarget = false;
      } else {
        const step = Math.min(dist, en.wanderSpeed * 1.8 * dt);
        pos.x += dx / dist * step;
        pos.y += dy / dist * step;
        pos.z += dz / dist * step;
      }
    }

    /* 云脉动（能量活跃度） */
    if (d.cloudMat.opacity > 0.01) {
      const pulse = 1 + en.pulseAmp * Math.sin(time * (1 + en.ef * 2.5) + d.shellN);
      d.cloudMat.opacity = Math.min(1, d.energy.cloudOpacity * pulse);
    }
  }

  /* 云淡入 */
  for (let i = fadeList.length - 1; i >= 0; i--) {
    const f = fadeList[i];
    f.mat.opacity += (f.target - f.mat.opacity) * Math.min(1, dt * 4);
    if (Math.abs(f.target - f.mat.opacity) < 0.003) {
      f.mat.opacity = f.target;
      fadeList.splice(i, 1);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

updateHUD();
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
