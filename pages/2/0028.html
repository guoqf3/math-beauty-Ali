<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>呼吸环面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #hint {
            position: fixed;
            bottom: 20px;
            left: 24px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease;
            font-weight: 300;
        }
        #fps-badge {
            position: fixed;
            top: 16px;
            right: 18px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="fps-badge"></div>
    <div id="hint">移动旋转 · 点击呼吸</div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─── 性能与安全检查 ───
            if (!window.PIXI) {
                console.warn('PixiJS 加载失败');
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">需要WebGL支持</div>';
                return;
            }

            // ─── 常量定义 ───
            const FOCAL_LENGTH = 1100;
            const PARTICLE_COUNT = 900;
            const BASE_TORUS_R = 240; // 大半径
            const BASE_TORUS_r = 75;  // 小半径
            const AUTO_ROTATE_SPEED = 0.28;
            const VIEW_SENSITIVITY_X = 0.7;
            const VIEW_SENSITIVITY_Y = 0.5;
            const BREATH_SPEED = 1.5;  // 基础呼吸速度
            const PULSE_AMPLITUDE = 0.18; // 点击脉冲幅度（相对于大半径）
            const PULSE_DECAY = 2.8;    // 脉冲衰减速度

            // ─── DOM 元素 ───
            const fpsBadge = document.getElementById('fps-badge');
            const hintEl = document.getElementById('hint');

            // ─── PixiJS 应用初始化 ───
            let app;
            try {
                app = new PIXI.Application({
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0x050510,
                    antialias: false,
                    autoDensity: true,
                    resolution: Math.min(window.devicePixelRatio || 1, 2),
                    powerPreference: 'high-performance',
                    forceCanvas: !isWebGLAvailable(),
                });
            } catch (err) {
                console.error('PixiJS 初始化失败:', err);
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">初始化失败</div>';
                return;
            }

            function isWebGLAvailable() {
                try {
                    const canvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext &&
                        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
                } catch (e) { return false; }
            }

            document.body.appendChild(app.view);

            // ─── 创建发光纹理 ───
            function createGlowTexture(size) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const half = size / 2;
                const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
                gradient.addColorStop(0.0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.1, 'rgba(255,255,255,0.95)');
                gradient.addColorStop(0.35, 'rgba(255,255,255,0.6)');
                gradient.addColorStop(0.65, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                const tex = PIXI.Texture.from(c);
                tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
                return tex;
            }

            const glowTex64 = createGlowTexture(64);
            const glowTex128 = createGlowTexture(128);

            // ─── 粒子容器 ───
            const particleContainer = new PIXI.ParticleContainer(PARTICLE_COUNT, {
                position: true,
                scale: true,
                tint: true,
                alpha: true,
            }, PARTICLE_COUNT, true);
            particleContainer.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(particleContainer);

            // ─── 中心光晕 ───
            const centerGlow = new PIXI.Sprite(glowTex128);
            centerGlow.anchor.set(0.5);
            centerGlow.tint = 0xFFF5E0;
            centerGlow.alpha = 0.25;
            centerGlow.scale.set(1.4);
            centerGlow.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerGlow);

            const centerCore = new PIXI.Sprite(glowTex64);
            centerCore.anchor.set(0.5);
            centerCore.tint = 0xFFFFFF;
            centerCore.alpha = 0.5;
            centerCore.scale.set(0.25);
            centerCore.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerCore);

            // ─── 数据结构 ───
            const sprites = [];
            const particleData = [];

            let mouseX = 0;
            let mouseY = 0;
            let smoothMouseX = 0;
            let smoothMouseY = 0;
            let autoRotateY = 0;
            let pulseStrength = 0; // 点击脉冲强度（0-1）
            let time = 0;
            let frameCount = 0;
            let fpsLastTime = 0;

            // ─── 颜色渐变方案（基于v角度映射） ───
            const COLOR_STOPS = [
                { pos: 0.0, color: 0xFFD447 },
                { pos: 0.3, color: 0xFF6B9D },
                { pos: 0.6, color: 0xB06BFF },
                { pos: 0.85, color: 0x4D9FFF },
                { pos: 1.0, color: 0x4DFFD9 },
            ];

            function getColorFromV(v) {
                // v 范围 0~2π，映射到 0~1
                const t = ((v % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI * 2);
                // 简单线性插值颜色
                let start = COLOR_STOPS[0];
                let end = COLOR_STOPS[COLOR_STOPS.length - 1];
                for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
                    if (t >= COLOR_STOPS[i].pos && t <= COLOR_STOPS[i + 1].pos) {
                        start = COLOR_STOPS[i];
                        end = COLOR_STOPS[i + 1];
                        break;
                    }
                }
                const segmentT = (t - start.pos) / (end.pos - start.pos || 0.001);
                const clampedT = Math.max(0, Math.min(1, segmentT));
                // 分解颜色分量
                const c1 = {
                    r: (start.color >> 16) & 0xFF,
                    g: (start.color >> 8) & 0xFF,
                    b: start.color & 0xFF
                };
                const c2 = {
                    r: (end.color >> 16) & 0xFF,
                    g: (end.color >> 8) & 0xFF,
                    b: end.color & 0xFF
                };
                const r = Math.round(c1.r + (c2.r - c1.r) * clampedT);
                const g = Math.round(c1.g + (c2.g - c1.g) * clampedT);
                const b = Math.round(c1.b + (c2.b - c1.b) * clampedT);
                return (r << 16) | (g << 8) | b;
            }

            // ─── 生成环面粒子 ───
            function initTorusParticles() {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    // 随机采样u,v
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI * 2;

                    // 分配流动速度：一部分主要沿u方向，一部分主要沿v方向，另一部分混合
                    const speedType = Math.random();
                    let du, dv;
                    if (speedType < 0.4) {
                        du = 0.6 + Math.random() * 0.8;
                        dv = (Math.random() - 0.5) * 0.3;
                    } else if (speedType < 0.7) {
                        du = (Math.random() - 0.5) * 0.4;
                        dv = 0.5 + Math.random() * 1.0;
                    } else {
                        du = (Math.random() - 0.5) * 0.5;
                        dv = (Math.random() - 0.5) * 0.5;
                    }

                    const data = {
                        u: u,
                        v: v,
                        du: du,
                        dv: dv,
                        color: getColorFromV(v),
                        baseAlpha: 0.65 + Math.random() * 0.3,
                        speedFactor: 0.8 + Math.random() * 0.5,
                    };

                    const sprite = new PIXI.Sprite(glowTex64);
                    sprite.anchor.set(0.5);
                    sprite.tint = data.color;
                    sprite.alpha = data.baseAlpha;
                    sprite.scale.set(0.08 + Math.random() * 0.03);

                    particleData.push(data);
                    sprites.push(sprite);
                    particleContainer.addChild(sprite);
                }
                console.log('环面粒子初始化完成，数量:', sprites.length);
            }

            // ─── 3D 旋转与投影 ───
            function rotatePoint(x, y, z, viewX, viewY) {
                // 绕 Y 轴
                let cosY = Math.cos(viewY);
                let sinY = Math.sin(viewY);
                let x1 = x * cosY + z * sinY;
                let z1 = -x * sinY + z * cosY;
                let y1 = y;
                // 绕 X 轴
                let cosX = Math.cos(viewX);
                let sinX = Math.sin(viewX);
                let y2 = y1 * cosX - z1 * sinX;
                let z2 = y1 * sinX + z1 * cosX;
                let x2 = x1;
                return { x: x2, y: y2, z: z2 };
            }

            function projectPoint(p, centerX, centerY) {
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + p.z);
                return {
                    sx: p.x * scale + centerX,
                    sy: p.y * scale + centerY,
                    scale: scale
                };
            }

            // ─── 更新环面粒子 ───
            function updateTorusParticles(delta, viewX, viewY, centerX, centerY) {
                // 更新脉冲衰减
                if (pulseStrength > 0) {
                    pulseStrength = Math.max(0, pulseStrength - delta * PULSE_DECAY);
                }

                // 呼吸效果：基础大半径和小半径随时间正弦变化
                const baseBreath = 1 + 0.04 * Math.sin(time * BREATH_SPEED) + 0.02 * Math.sin(time * BREATH_SPEED * 2.1);
                const pulseBreath = 1 + pulseStrength * PULSE_AMPLITUDE;
                const R = BASE_TORUS_R * baseBreath * pulseBreath;
                const r = BASE_TORUS_r * baseBreath * (1 + pulseStrength * 0.3);

                for (let i = 0; i < sprites.length; i++) {
                    const data = particleData[i];
                    const sprite = sprites[i];

                    // 更新流动角度
                    data.u += data.du * data.speedFactor * delta * 1.2;
                    data.v += data.dv * data.speedFactor * delta * 1.2;

                    // 角度保持范围
                    if (data.u > Math.PI * 2) data.u -= Math.PI * 2;
                    if (data.u < 0) data.u += Math.PI * 2;
                    if (data.v > Math.PI * 2) data.v -= Math.PI * 2;
                    if (data.v < 0) data.v += Math.PI * 2;

                    // 环面参数方程
                    const cosV = Math.cos(data.v);
                    const sinV = Math.sin(data.v);
                    const cosU = Math.cos(data.u);
                    const sinU = Math.sin(data.u);

                    const x = (R + r * cosV) * cosU;
                    const y = (R + r * cosV) * sinU;
                    const z = r * sinV;

                    // 旋转
                    const rp = rotatePoint(x, y, z, viewX, viewY);
                    const proj = projectPoint(rp, centerX, centerY);

                    // 更新精灵
                    const depthFactor = proj.scale;
                    const glowPulse = 1 + 0.06 * Math.sin(time * 2.0 + i * 0.15);
                    const alphaMod = 0.85 + 0.15 * Math.sin(time * 1.7 + i * 0.1);

                    sprite.position.set(proj.sx, proj.sy);
                    sprite.scale.set((0.08 + 0.03) * depthFactor * glowPulse);
                    sprite.alpha = Math.max(0.05, Math.min(1, data.baseAlpha * depthFactor * alphaMod));
                }
            }

            // ─── 更新中心光晕 ───
            function updateCenterGlow(centerX, centerY) {
                const breathPulse = 0.22 + 0.07 * Math.sin(time * BREATH_SPEED) + 0.04 * Math.sin(time * BREATH_SPEED * 2.3);
                const pulseGlow = pulseStrength * 0.3;
                centerGlow.position.set(centerX, centerY);
                centerGlow.alpha = Math.max(0.12, Math.min(0.5, breathPulse + pulseGlow));
                centerGlow.scale.set(1.3 + 0.2 * Math.sin(time * 1.2) + pulseStrength * 0.6);
                centerCore.position.set(centerX, centerY);
                centerCore.scale.set(0.22 + 0.05 * Math.sin(time * 2.4) + pulseStrength * 0.2);
                centerCore.alpha = 0.45 + 0.15 * Math.sin(time * 1.5) + pulseStrength * 0.4;
            }

            // ─── Web Audio 音效系统 ───
            let audioContext = null;
            let audioInitialized = false;

            function initAudio() {
                if (!audioInitialized) {
                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        audioContext = new AudioContext();
                        audioInitialized = true;
                        console.log('音频上下文已初始化');
                    } catch (e) {
                        console.warn('Web Audio 不可用:', e);
                    }
                }
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume().catch(err => console.warn('音频恢复失败:', err));
                }
            }

            function playBreathSound() {
                if (!audioContext) return;
                const now = audioContext.currentTime;

                // 创建主增益
                const masterGain = audioContext.createGain();
                masterGain.connect(audioContext.destination);
                masterGain.gain.setValueAtTime(0.001, now);
                masterGain.gain.exponentialRampToValueAtTime(0.25, now + 0.05);
                masterGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                // 低频“呼”声：正弦波频率从180Hz滑至60Hz
                const osc1 = audioContext.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(180, now);
                osc1.frequency.exponentialRampToValueAtTime(60, now + 0.35);
                const gain1 = audioContext.createGain();
                gain1.gain.setValueAtTime(0.6, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc1.connect(gain1);
                gain1.connect(masterGain);
                osc1.start(now);
                osc1.stop(now + 0.45);

                // 叠加轻微噪声成分，模拟呼吸气流
                const bufferSize = audioContext.sampleRate * 0.3;
                const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
                }
                const noise = audioContext.createBufferSource();
                noise.buffer = noiseBuffer;
                const noiseGain = audioContext.createGain();
                noiseGain.gain.setValueAtTime(0.15, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                noise.connect(noiseGain);
                noiseGain.connect(masterGain);
                noise.start(now);
                noise.stop(now + 0.35);

                // 轻微高频“吸”声（可选，增加呼吸感）
                const osc2 = audioContext.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1200, now + 0.05);
                osc2.frequency.exponentialRampToValueAtTime(400, now + 0.25);
                const gain2 = audioContext.createGain();
                gain2.gain.setValueAtTime(0.0001, now);
                gain2.gain.exponentialRampToValueAtTime(0.08, now + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc2.connect(gain2);
                gain2.connect(masterGain);
                osc2.start(now + 0.05);
                osc2.stop(now + 0.4);
            }

            function triggerBreath() {
                initAudio();
                playBreathSound();
                pulseStrength = 1.0;
                // 视觉闪光
                centerCore.alpha = 1.0;
                centerGlow.alpha = 0.7;
                setTimeout(() => {
                    centerCore.alpha = 0.5;
                    centerGlow.alpha = 0.25;
                }, 220);
            }

            // ─── 主循环 ───
            app.ticker.add((delta) => {
                const dt = Math.min(delta / 60, 0.05);
                time += dt;
                frameCount++;

                const w = window.innerWidth;
                const h = window.innerHeight;
                const cx = w / 2;
                const cy = h / 2;

                // 平滑鼠标追踪
                smoothMouseX += (mouseX - smoothMouseX) * 0.06;
                smoothMouseY += (mouseY - smoothMouseY) * 0.06;

                // 自动旋转
                autoRotateY += AUTO_ROTATE_SPEED * dt;

                // 视角计算
                const normX = (smoothMouseX / w) * 2 - 1;
                const normY = (smoothMouseY / h) * 2 - 1;
                const viewY = autoRotateY + normX * VIEW_SENSITIVITY_X;
                const viewX = normY * VIEW_SENSITIVITY_Y;

                // 更新
                updateTorusParticles(dt, viewX, viewY, cx, cy);
                updateCenterGlow(cx, cy);

                // FPS 显示
                if (time - fpsLastTime > 0.5) {
                    const fps = Math.round(frameCount / (time - fpsLastTime));
                    fpsBadge.textContent = fps + ' fps';
                    frameCount = 0;
                    fpsLastTime = time;
                }
            });

            // ─── 交互事件 ───
            function getCanvasCoords(e) {
                const rect = app.view.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function onPointerMove(e) {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
            }

            function onPointerDown(e) {
                e.preventDefault();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
                triggerBreath();
            }

            function onPointerLeave() {
                mouseX = window.innerWidth / 2;
                mouseY = window.innerHeight / 2;
            }

            app.view.addEventListener('mousemove', onPointerMove);
            app.view.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mouseleave', onPointerLeave);

            app.view.addEventListener('touchmove', onPointerMove, { passive: true });
            app.view.addEventListener('touchstart', onPointerDown, { passive: false });
            app.view.addEventListener('touchend', () => {});

            // ─── 窗口大小调整 ───
            function handleResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                app.renderer.resize(w, h);
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(handleResize, 300);
            });

            // ─── 键盘交互 ───
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    triggerBreath();
                }
            });

            // ─── 启动 ───
            initTorusParticles();

            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
            smoothMouseX = mouseX;
            smoothMouseY = mouseY;

            // 隐藏提示文字
            setTimeout(() => {
                if (hintEl) {
                    hintEl.style.opacity = '0';
                    setTimeout(() => {
                        if (hintEl) hintEl.style.display = 'none';
                    }, 1600);
                }
            }, 3200);

            handleResize();
            console.log('✨ 呼吸环面已启动 — 粒子数:', sprites.length);
        })();
    </script>
</body>
</html>
