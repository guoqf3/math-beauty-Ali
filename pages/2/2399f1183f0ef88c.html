<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   0. 参数（整体调暗）
   ========================================================= */
const NUM_LINES    = 78;       // 降低数量，减少中心叠加
const PTS_PER_LINE = 52;
const R_MAX        = 11.5;
const P_MAX        = 720;      // 粒子数减半

let gCoupling = 1.00;

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const container = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02020a);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.position.set(0, 7.5, 22.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 70;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.30;

/* =========================================================
   2. 彩虹色 LUT（降低亮度/饱和度）
   ========================================================= */
const LUT_SIZE = 512;
const LUT = new Float32Array(LUT_SIZE * 3);
(function buildLUT() {
  const c = new THREE.Color();
  for (let i = 0; i < LUT_SIZE; i++) {
    c.setHSL(i / LUT_SIZE, 0.82, 0.48);   // 亮度从 0.56 → 0.48
    LUT[i * 3]     = c.r;
    LUT[i * 3 + 1] = c.g;
    LUT[i * 3 + 2] = c.b;
  }
})();

/* =========================================================
   3. 纹理工具
   ========================================================= */
function makeRadialTex(stops, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  stops.forEach(([p, col]) => g.addColorStop(p, col));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* 光晕整体柔化、降低中心白 */
const glowTex = makeRadialTex([
  [0.00, 'rgba(220,240,255,0.55)'],
  [0.18, 'rgba(150,200,255,0.30)'],
  [0.45, 'rgba(90,140,240,0.10)'],
  [0.72, 'rgba(110,80,220,0.03)'],
  [1.00, 'rgba(0,0,0,0)']
]);

const nebulaTex = makeRadialTex([
  [0.00, 'rgba(255,255,255,0.28)'],
  [0.32, 'rgba(255,255,255,0.10)'],
  [0.68, 'rgba(255,255,255,0.025)'],
  [1.00, 'rgba(255,255,255,0)']
]);

/* =========================================================
   4. 星空背景（降低亮度）
   ========================================================= */
const starUniforms = { uTime: { value: 0 }, uPR: { value: Math.min(window.devicePixelRatio, 2) } };

(function buildStarfield() {
  const N = 2600;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  const cA = new THREE.Color('#dfe8ff');
  const cB = new THREE.Color('#5fc8ff');
  const cC = new THREE.Color('#9a7bff');
  const tmp = new THREE.Color();

  for (let i = 0; i < N; i++) {
    const r = 340 + Math.pow(Math.random(), 0.5) * 1400;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.78 + 30;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th);

    const k = Math.random();
    tmp.copy(k < 0.62 ? cA : (k < 0.9 ? cB : cC));
    col[i*3]     = tmp.r;
    col[i*3 + 1] = tmp.g;
    col[i*3 + 2] = tmp.b;

    siz[i] = 0.7 + Math.random() * 2.2;    // 略小
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));

  const m = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: starUniforms,
    vertexShader: /* glsl */`
      attribute float aSize;
      uniform float uPR;
      uniform float uTime;
      varying vec3 vCol;
      varying float vTw;
      void main() {
        vCol = color;
        vec3 p = position;
        p.x += sin(uTime * 0.05 + position.y * 0.004) * 2.5;
        p.y += cos(uTime * 0.04 + position.x * 0.004) * 2.5;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float d = -mv.z;
        gl_PointSize = aSize * uPR * (440.0 / max(d, 1.0));
        gl_Position = projectionMatrix * mv;
        vTw = 0.55 + 0.45 * sin(uTime * 1.1 + position.x * 0.05 + position.y * 0.03);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vCol;
      varying float vTw;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d);
        a = pow(a, 2.2);
        // 整体亮度从 0.9 → 0.45
        gl_FragColor = vec4(vCol * a * (0.5 + vTw * 0.35), a * vTw * 0.45);
      }
    `
  });
  m.vertexColors = true;

  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
})();

/* 星云氛围（极淡） */
(function buildNebula() {
  const cols = [0x1e5fff, 0x5a3fff, 0x00a8e0, 0x8a3fff, 0x0048a0];
  for (let i = 0; i < 9; i++) {
    const mat = new THREE.SpriteMaterial({
      map: nebulaTex,
      color: cols[i % cols.length],
      transparent: true,
      opacity: 0.028 + Math.random() * 0.032,   // 大幅降低
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false
    });
    const sp = new THREE.Sprite(mat);
    sp.position.set(
      (Math.random() - 0.5) * 60,
      (Math.random() - 0.5) * 46,
      -20 - Math.random() * 50
    );
    const s = 26 + Math.random() * 40;
    sp.scale.set(s, s, 1);
    scene.add(sp);
  }
})();

/* =========================================================
   5. 灯光（柔化）
   ========================================================= */
scene.add(new THREE.AmbientLight(0x25304e, 1.0));

const keyLight = new THREE.DirectionalLight(0xc8dcff, 1.0);
keyLight.position.set(9, 14, 11);
scene.add(keyLight);

const rimA = new THREE.PointLight(0x3ee8ff, 40, 42, 2);
rimA.position.set(-8, 4, 7);
scene.add(rimA);

const rimB = new THREE.PointLight(0xa066ff, 40, 42, 2);
rimB.position.set(8, -5, 7);
scene.add(rimB);

const rimC = new THREE.PointLight(0xff5ce0, 26, 36, 2);
rimC.position.set(0, 9, -8);
scene.add(rimC);

/* =========================================================
   6. 规范场线（核心：降低亮度/透明度）
   ========================================================= */
const SEG_PER_LINE = PTS_PER_LINE - 1;
const TOTAL_SEGS   = NUM_LINES * SEG_PER_LINE;
const VERT_COUNT   = TOTAL_SEGS * 2;

const linePositions = new Float32Array(VERT_COUNT * 3);
const lineColors    = new Float32Array(VERT_COUNT * 3);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeo.setAttribute('color',    new THREE.BufferAttribute(lineColors, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.80,                    // 从 1.0 降到 0.80
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
});

const fieldLines = new THREE.LineSegments(lineGeo, lineMat);
fieldLines.frustumCulled = false;

const fieldGroup = new THREE.Group();
fieldGroup.add(fieldLines);
scene.add(fieldGroup);

const cX = new Float32Array(PTS_PER_LINE);
const cY = new Float32Array(PTS_PER_LINE);
const cZ = new Float32Array(PTS_PER_LINE);

const lineParams = [];
(function initLineParams() {
  const GOLDEN = 2.399963229728653;
  for (let k = 0; k < NUM_LINES; k++) {
    lineParams.push({
      th0:    Math.acos(1 - 2 * (k + 0.5) / NUM_LINES),
      ph0:    k * GOLDEN,
      twist:  2.20 + 0.95 * Math.sin(k * 1.13),
      spd:    0.20 + 0.32 * Math.abs(Math.sin(k * 0.37 + 1.1)),
      wobAmp: 0.38 + 0.24 * Math.sin(k * 0.71),
      wobPh:  k * 0.73,
      flick:  k * 0.61
    });
  }
})();

function updateFieldLines(time) {
  const posArr = lineGeo.attributes.position.array;
  const colArr = lineGeo.attributes.color.array;

  let pi = 0;
  let ci = 0;

  const gScale = gCoupling;

  for (let k = 0; k < NUM_LINES; k++) {
    const P = lineParams[k];

    const twist = P.twist * (0.55 + 0.75 * gScale);
    const spd   = P.spd * (0.55 + 0.85 * gScale);
    const ph    = P.ph0 + time * spd;

    /* --- 采样点 --- */
    for (let p = 0; p < PTS_PER_LINE; p++) {
      const u = p / SEG_PER_LINE;

      const r = R_MAX * (0.07 + 0.93 * Math.pow(u, 0.82));

      let th = P.th0 + P.wobAmp * Math.sin(6.1 * u + P.wobPh + time * 0.48);
      if (th < 0.0015) th = 0.0015;
      else if (th > Math.PI - 0.0015) th = Math.PI - 0.0015;

      const phi = ph + twist * u;

      const st = Math.sin(th);
      const ct = Math.cos(th);

      cX[p] = r * st * Math.cos(phi);
      cY[p] = r * ct;
      cZ[p] = r * st * Math.sin(phi);
    }

    /* --- 写入线段端点 --- */
    for (let p = 0; p < SEG_PER_LINE; p++) {
      posArr[pi++] = cX[p];
      posArr[pi++] = cY[p];
      posArr[pi++] = cZ[p];
      posArr[pi++] = cX[p + 1];
      posArr[pi++] = cY[p + 1];
      posArr[pi++] = cZ[p + 1];
    }

    /* --- 颜色：亮度大幅降低 --- */
    const flickBase = 0.80 + 0.20 * Math.sin(time * 2.4 + P.flick);

    for (let p = 0; p < SEG_PER_LINE; p++) {
      for (let e = 0; e < 2; e++) {
        const u = (p + e) / SEG_PER_LINE;

        let h = u * 0.86 + time * 0.055 + k * 0.0163;
        h = h - Math.floor(h);

        let li = (h * LUT_SIZE) | 0;
        if (li >= LUT_SIZE) li = LUT_SIZE - 1;
        if (li < 0) li = 0;

        // ★ 亮度系数从 (0.20 + 0.46) 降到 (0.06 + 0.22)
        const bright = (0.06 + 0.22 * (1 - u)) * flickBase;

        colArr[ci++] = LUT[li * 3]     * bright;
        colArr[ci++] = LUT[li * 3 + 1] * bright;
        colArr[ci++] = LUT[li * 3 + 2] * bright;
      }
    }
  }

  lineGeo.attributes.position.needsUpdate = true;
  lineGeo.attributes.color.needsUpdate = true;
}

/* =========================================================
   7. 中心粒子源（暗化）
   ========================================================= */
/* 核心球：浅蓝、小尺寸 */
const coreMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.22, 28, 18),
  new THREE.MeshBasicMaterial({ color: 0xd8f0ff, toneMapped: false })
);
scene.add(coreMesh);

/* 核心光晕 */
const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex,
  color: 0x9fe0ff,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false,
  opacity: 0.50,
  toneMapped: false
}));
coreGlow.scale.set(3.6, 3.6, 1);
scene.add(coreGlow);

/* 第二层紫光晕：很淡、较大 */
const coreHalo2 = new THREE.Sprite(new THREE.SpriteMaterial({
  map: nebulaTex,
  color: 0x8a6bff,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false,
  opacity: 0.16,
  toneMapped: false
}));
coreHalo2.scale.set(10, 10, 1);
scene.add(coreHalo2);

/* =========================================================
   8. 辐射粒子（暗化）
   ========================================================= */
const pPos   = new Float32Array(P_MAX * 3);
const pCol   = new Float32Array(P_MAX * 3);
const pSize  = new Float32Array(P_MAX);
const pAlpha = new Float32Array(P_MAX);

const pDir   = new Float32Array(P_MAX * 3);
const pRad   = new Float32Array(P_MAX);
const pSpd   = new Float32Array(P_MAX);
const pLife  = new Float32Array(P_MAX);
const pDecay = new Float32Array(P_MAX);
const pHue   = new Float32Array(P_MAX);
const pBase  = new Float32Array(P_MAX);

function respawnParticle(i) {
  const u  = Math.random() * 2 - 1;
  const th = Math.acos(u);
  const ph = Math.random() * Math.PI * 2;
  const st = Math.sin(th);

  pDir[i*3]     = st * Math.cos(ph);
  pDir[i*3 + 1] = Math.cos(th);
  pDir[i*3 + 2] = st * Math.sin(ph);

  pRad[i]   = 0.20 + Math.random() * 0.6;
  pSpd[i]   = 1.4 + Math.random() * 4.6;
  pLife[i]  = 1.0;
  pDecay[i] = 0.115 + Math.random() * 0.235;
  pHue[i]   = Math.random();
  pBase[i]  = 0.45 + Math.random() * 1.25;   // 尺寸从 (0.7+2.1) 降到 (0.45+1.25)
}

for (let i = 0; i < P_MAX; i++) {
  respawnParticle(i);
  pLife[i] = Math.random();
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
pGeo.setAttribute('aSize',    new THREE.BufferAttribute(pSize, 1));
pGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(pAlpha, 1));

const pMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uPR: { value: Math.min(window.devicePixelRatio, 2) }
  },
  vertexShader: /* glsl */`
    attribute float aSize;
    attribute float aAlpha;
    uniform float uPR;
    varying vec3 vCol;
    varying float vA;
    void main() {
      vCol = color;
      vA = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uPR * (280.0 / max(-mv.z, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vCol;
    varying float vA;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d);
      a = pow(a, 2.2);
      // 强度从 1.7 降到 0.85
      gl_FragColor = vec4(vCol * a * 0.85, a * vA);
    }
  `
});
pMat.vertexColors = true;

const particles = new THREE.Points(pGeo, pMat);
particles.frustumCulled = false;
scene.add(particles);

function updateParticles(dt, time) {
  const posArr = pGeo.attributes.position.array;
  const colArr = pGeo.attributes.color.array;
  const sizArr = pGeo.attributes.aSize.array;
  const alpArr = pGeo.attributes.aAlpha.array;

  for (let i = 0; i < P_MAX; i++) {
    pLife[i] -= dt * pDecay[i];
    pRad[i]  += pSpd[i] * dt;

    if (pLife[i] <= 0 || pRad[i] > R_MAX * 1.18) {
      respawnParticle(i);
    }

    const r = pRad[i];
    posArr[i*3]     = pDir[i*3]     * r;
    posArr[i*3 + 1] = pDir[i*3 + 1] * r;
    posArr[i*3 + 2] = pDir[i*3 + 2] * r;

    let h = pHue[i] + time * 0.045;
    h = h - Math.floor(h);
    let li = (h * LUT_SIZE) | 0;
    if (li >= LUT_SIZE) li = LUT_SIZE - 1;
    if (li < 0) li = 0;

    const radFade = 1.0 - Math.min(1, r / (R_MAX * 1.15));
    const env = Math.sin(Math.PI * (1 - pLife[i]));
    // 亮度从 (0.35+0.9) 降到 (0.15+0.50)
    const bright = 0.15 + 0.50 * radFade;

    colArr[i*3]     = LUT[li * 3]     * bright;
    colArr[i*3 + 1] = LUT[li * 3 + 1] * bright;
    colArr[i*3 + 2] = LUT[li * 3 + 2] * bright;

    sizArr[i] = pBase[i] * (0.55 + 0.75 * env) * (0.45 + 0.55 * radFade);
    // alpha 从 (0.30+0.70) 降到 (0.12+0.40)
    alpArr[i] = env * (0.12 + 0.40 * radFade);
  }

  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
  pGeo.attributes.aSize.needsUpdate = true;
  pGeo.attributes.aAlpha.needsUpdate = true;
}

/* =========================================================
   9. 场强环（暗化）
   ========================================================= */
const rings = [];
(function buildRings() {
  const specs = [
    { r: 3.6, t: 0.012, c: 0x5fd8ff, o: 0.10, ax: [1, 0, 0.25], sp: 0.22 },
    { r: 6.4, t: 0.010, c: 0x9a6cff, o: 0.075, ax: [0.3, 1, 0.2], sp: -0.17 },
    { r: 9.2, t: 0.008, c: 0xe04cc8, o: 0.05, ax: [0.2, 0.4, 1], sp: 0.13 }
  ];
  specs.forEach(s => {
    const mesh = new THREE.Mesh(
      new THREE.TorusGeometry(s.r, s.t, 8, 220),
      new THREE.MeshBasicMaterial({
        color: s.c,
        transparent: true,
        opacity: s.o,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      })
    );
    mesh.rotation.set(
      s.ax[0] * Math.PI * 0.5,
      s.ax[1] * Math.PI * 0.5,
      s.ax[2] * Math.PI * 0.5
    );
    mesh.userData.sp = s.sp;
    mesh.userData.axVec = new THREE.Vector3(s.ax[0], s.ax[1], s.ax[2]).normalize();
    mesh.userData.baseO = s.o;
    scene.add(mesh);
    rings.push(mesh);
  });
})();

/* 极淡的时空网格 */
let shellMesh = null;
(function buildSpacetimeShell() {
  const geo = new THREE.SphereGeometry(R_MAX * 1.06, 26, 18);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x3a6aef,
    wireframe: true,
    transparent: true,
    opacity: 0.012,                 // 从 0.022 降到 0.012
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });
  shellMesh = new THREE.Mesh(geo, mat);
  scene.add(shellMesh);
})();

/* =========================================================
   10. 后处理（关键：Bloom 大幅减弱）
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.35,   // strength：1.05 → 0.35
  0.45,   // radius  ：0.78 → 0.45
  0.50    // threshold：0.12 → 0.50（只有高亮像素才泛光）
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =========================================================
   11. 音效引擎
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let audioReady = false;
let padGain = null;

const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1396.91];

function initAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  audioCtx = new AC();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(audioCtx.destination);
  masterGain.gain.exponentialRampToValueAtTime(0.24, audioCtx.currentTime + 4.0);

  const droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.34;
  droneGain.connect(masterGain);

  [55.0, 82.5, 110.0, 146.8, 220.0].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = i % 2 === 0 ? 'sine' : 'triangle';
    o.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.value = 0.28 / (i + 1.35);
    o.connect(g);
    g.connect(droneGain);
    o.start();
  });

  const nLen = audioCtx.sampleRate * 4;
  const buf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < nLen; i++) data[i] = Math.random() * 2 - 1;

  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  noise.loop = true;

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 560;
  bp.Q.value = 0.92;

  const nGain = audioCtx.createGain();
  nGain.gain.value = 0.022;

  noise.connect(bp);
  bp.connect(nGain);
  nGain.connect(masterGain);
  noise.start();

  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.045;
  const lfoAmt = audioCtx.createGain();
  lfoAmt.gain.value = 360;
  lfo.connect(lfoAmt);
  lfoAmt.connect(bp.frequency);
  lfo.start();

  padGain = audioCtx.createGain();
  padGain.gain.value = 0.80;
  padGain.connect(masterGain);

  const delay = audioCtx.createDelay(1.6);
  delay.delayTime.value = 0.33;
  const fb = audioCtx.createGain();
  fb.gain.value = 0.32;
  const wet = audioCtx.createGain();
  wet.gain.value = 0.32;

  padGain.connect(delay);
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(wet);
  wet.connect(masterGain);

  const shim = audioCtx.createOscillator();
  shim.type = 'sine';
  shim.frequency.value = 2900;
  const shimGain = audioCtx.createGain();
  shimGain.gain.value = 0.004;
  const shimLfo = audioCtx.createOscillator();
  shimLfo.frequency.value = 0.17;
  const shimLfoAmt = audioCtx.createGain();
  shimLfoAmt.gain.value = 0.003;
  shimLfo.connect(shimLfoAmt);
  shimLfoAmt.connect(shimGain.gain);
  shim.connect(shimGain);
  shimGain.connect(masterGain);
  shim.start();
  shimLfo.start();

  const sub = audioCtx.createOscillator();
  sub.type = 'sine';
  sub.frequency.value = 36;
  const subGain = audioCtx.createGain();
  subGain.gain.value = 0.0001;
  const subLfo = audioCtx.createOscillator();
  subLfo.frequency.value = 0.083;
  const subLfoAmt = audioCtx.createGain();
  subLfoAmt.gain.value = 0.05;
  subLfo.connect(subLfoAmt);
  subLfoAmt.connect(subGain.gain);
  sub.connect(subGain);
  subGain.connect(masterGain);
  sub.start();
  subLfo.start();

  audioReady = true;
}

function playChime() {
  if (!audioCtx || !audioReady) return;
  const t = audioCtx.currentTime;
  const f0 = SCALE[Math.floor(Math.random() * SCALE.length)];

  [1, 1.5, 2].forEach((mul, idx) => {
    const o = audioCtx.createOscillator();
    o.type = idx === 0 ? 'sine' : (idx === 1 ? 'triangle' : 'sine');
    o.frequency.setValueAtTime(f0 * mul, t);
    o.frequency.exponentialRampToValueAtTime(f0 * mul * 1.28, t + 0.8);

    const g = audioCtx.createGain();
    const peak = idx === 0 ? 0.048 : (idx === 1 ? 0.021 : 0.012);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.035);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);

    o.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 2.1);
  });
}

function playPad() {
  if (!audioCtx || !audioReady || !padGain) return;
  const t = audioCtx.currentTime;
  const root = 130.81 * (Math.random() > 0.5 ? 1 : 1.5);
  const notes = [1, 1.25, 1.5, 2];

  notes.forEach((mul, i) => {
    const o = audioCtx.createOscillator();
    o.type = i % 2 === 0 ? 'sine' : 'triangle';
    o.frequency.setValueAtTime(root * mul, t);
    o.frequency.linearRampToValueAtTime(root * mul * 1.010, t + 3.4);

    const g = audioCtx.createGain();
    const peak = 0.016 / (i * 0.55 + 1);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 1.1);
    g.gain.linearRampToValueAtTime(0.0001, t + 3.9);

    o.connect(g);
    g.connect(padGain);
    o.start(t);
    o.stop(t + 4.1);
  });
}

function onFirstGesture() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  const hint = document.getElementById('soundHint');
  if (hint) { hint.style.opacity = '0'; setTimeout(() => hint.remove(), 700); }
}
window.addEventListener('pointerdown', onFirstGesture, { once: true });
window.addEventListener('touchstart', onFirstGesture, { once: true, passive: true });

/* =========================================================
   12. 交互控件
   ========================================================= */
const sG    = document.getElementById('s-g');
const vSG   = document.getElementById('v-sg');

sG.addEventListener('input', () => {
  gCoupling = parseFloat(sG.value) / 100;
  vSG.textContent = gCoupling.toFixed(2);
});

/* =========================================================
   13. 动画循环
   ========================================================= */
const clock = new THREE.Clock();
let elapsed = 0;
let chimeTimer = 0;
let nextChime = 5.0;
let readoutTimer = 0;

const elN = document.getElementById('v-n');
const elG = document.getElementById('v-g');
const elF = document.getElementById('v-f');
const elV = document.getElementById('v-v');

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updateFieldLines(elapsed);
  updateParticles(dt, elapsed);

  /* 中心呼吸（幅度收窄） */
  const pulse = 1 + 0.12 * Math.sin(elapsed * 2.6);
  coreGlow.scale.set(3.6 * pulse, 3.6 * pulse, 1);
  coreGlow.material.opacity = 0.45 + 0.10 * Math.sin(elapsed * 3.1);

  const pulse2 = 1 + 0.18 * Math.sin(elapsed * 1.4 + 0.8);
  coreHalo2.scale.set(10 * pulse2, 10 * pulse2, 1);
  coreHalo2.material.opacity = 0.13 + 0.06 * Math.sin(elapsed * 1.7);

  coreMesh.scale.setScalar(1 + 0.10 * Math.sin(elapsed * 4.2));

  /* 环缓慢转动（微弱呼吸） */
  rings.forEach((ring, i) => {
    ring.rotateOnAxis(ring.userData.axVec, ring.userData.sp * dt);
    ring.material.opacity = ring.userData.baseO * (0.85 + 0.25 * Math.sin(elapsed * 1.1 + i * 1.3));
  });

  /* 时空壳呼吸 */
  if (shellMesh) {
    const s = 1 + 0.035 * Math.sin(elapsed * 0.6);
    shellMesh.scale.setScalar(s);
    shellMesh.rotation.y = elapsed * 0.02;
    shellMesh.rotation.x = Math.sin(elapsed * 0.11) * 0.12;
  }

  /* 场线整体缓旋 */
  fieldGroup.rotation.y = elapsed * 0.045;
  fieldGroup.rotation.x = Math.sin(elapsed * 0.07) * 0.10;

  /* 灯光游走（幅度收窄） */
  rimA.position.set(
    Math.cos(elapsed * 0.38) * 10,
    4.0 + Math.sin(elapsed * 0.52) * 3.0,
    Math.sin(elapsed * 0.38) * 10
  );
  rimB.position.set(
    Math.cos(elapsed * 0.31 + Math.PI) * 10,
    -4.0 + Math.cos(elapsed * 0.44) * 3.0,
    Math.sin(elapsed * 0.31 + Math.PI) * 10
  );
  rimC.position.set(
    Math.sin(elapsed * 0.24) * 6,
    8.5 + Math.sin(elapsed * 0.35) * 2.0,
    Math.cos(elapsed * 0.24) * 6
  );

  starUniforms.uTime.value = elapsed;

  /* 读数 */
  readoutTimer += dt;
  if (readoutTimer > 0.08) {
    readoutTimer = 0;

    const fMag = (0.68 + 0.42 * Math.sin(elapsed * 1.7) * Math.sin(elapsed * 0.9 + 1.2)) * gCoupling * gCoupling;
    const vEV  = 246.2 + 0.8 * Math.sin(elapsed * 2.3);

    elN.textContent = NUM_LINES + ' 条';
    elG.textContent = gCoupling.toFixed(3);
    elF.textContent = fMag.toFixed(4) + ' TeV⁴';
    elV.textContent = vEV.toFixed(1) + ' GeV';
  }

  chimeTimer += dt;
  if (chimeTimer > nextChime) {
    chimeTimer = 0;
    nextChime = 4.2 + Math.random() * 5.6;
    playChime();
  }

  controls.update();
  composer.render();
}

/* =========================================================
   14. 自适应
   ========================================================= */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  starUniforms.uPR.value = Math.min(window.devicePixelRatio, 2);
  pMat.uniforms.uPR.value = Math.min(window.devicePixelRatio, 2);
});

/* 启动 */
animate();
</script>
