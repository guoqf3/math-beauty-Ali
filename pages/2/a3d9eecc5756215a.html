<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clifford环面 · 平坦环面的立体投影</title>
    <style>
        :root {
            --bg: #060a14;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 2.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.1rem, 2.5vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.07em;
            color: rgba(215, 225, 245, 0.93);
            text-shadow: 0 0 45px rgba(160, 200, 255, 0.55), 0 0 85px rgba(130, 170, 240, 0.3);
            line-height: 1.3;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.6rem, 1.3vw, 0.85rem);
            letter-spacing: 0.12em;
            color: rgba(180, 195, 220, 0.72);
            text-shadow: 0 0 20px rgba(140, 180, 220, 0.35);
            margin-top: 0.3vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #formula-overlay .formula {
            font-size: clamp(0.65rem, 1.4vw, 0.88rem);
            letter-spacing: 0.04em;
            color: rgba(190, 200, 225, 0.78);
            text-shadow: 0 0 30px rgba(150, 180, 220, 0.4);
            font-style: italic;
            background: rgba(8, 14, 26, 0.55);
            padding: 0.5vh 2.2vw;
            border-radius: 2rem;
            border: 1px solid rgba(120, 150, 200, 0.22);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        #formula-overlay .formula .highlight {
            color: rgba(255, 175, 95, 0.9);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">Clifford环面</div>
        <div class="subtitle">平坦环面的双旋转 · 立体投影</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="highlight">z₁</span>=<sup>e<sup>iu</sup></sup>&#x2215;√2,&nbsp;
            <span class="highlight">z₂</span>=<sup>e<sup>iv</sup></sup>&#x2215;√2&emsp;|&emsp;
            <span class="highlight">π</span>(x₀,x₁,x₂,x₃) = (<sup>x₀</sup>&#x2215;<sub>1−x₃</sub>, <sup>x₁</sup>&#x2215;<sub>1−x₃</sub>, <sup>x₂</sup>&#x2215;<sub>1−x₃</sub>)
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== DOM ====================
        const container = document.getElementById('canvas-container');

        // ==================== 场景初始化 ====================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.1, 18);
        camera.position.set(4.2, 1.2, 4.8);
        camera.lookAt(0, 0.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x060a14, 1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 星空背景 ====================
        const starCount = 700;
        const starGeom = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 7.5 + Math.random() * 10;
            starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = r * Math.cos(phi);
            starSizes[i] = Math.random() * 1.5 + 0.1;
        }
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starMat = new THREE.PointsMaterial({
            color: 0x7d8eb5,
            size: 0.009,
            transparent: true,
            opacity: 0.55,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starGeom, starMat);
        scene.add(stars);

        // ==================== 颜色定义 ====================
        const COLOR_CYAN = new THREE.Color('#00c8f0');
        const COLOR_GOLD = new THREE.Color('#f0a040');
        const COLOR_MAGENTA = new THREE.Color('#f05078');

        // ==================== 参数 ====================
        const R_INV = 1.0 / Math.SQRT2; // 1/√2
        const NUM_U_CURVES = 14;  // v-曲线（固定u，变化v）对应金色
        const NUM_V_CURVES = 14;  // u-曲线（固定v，变化u）对应青色
        const NUM_DIAG_CURVES = 14; // 对角线曲线 (u+v=const) 对应品红
        const POINTS_PER_LINE = 220;

        // 生成参数线的基础4D点
        function cliffordPoint(u, v) {
            return [
                R_INV * Math.cos(u),
                R_INV * Math.sin(u),
                R_INV * Math.cos(v),
                R_INV * Math.sin(v)
            ];
        }

        // 预计算线条的4D坐标 (存储为线性点序列)
        const lineData = [];

        // 1. u-曲线 (固定v，变化u) -> 青色曲线，对应v固定
        for (let i = 0; i < NUM_V_CURVES; i++) {
            const vFixed = (Math.PI * 2 * i) / NUM_V_CURVES;
            const points4D = new Float32Array(POINTS_PER_LINE * 4);
            for (let j = 0; j < POINTS_PER_LINE; j++) {
                const u = (Math.PI * 2 * j) / (POINTS_PER_LINE - 1);
                const pt = cliffordPoint(u, vFixed);
                points4D[j * 4] = pt[0];
                points4D[j * 4 + 1] = pt[1];
                points4D[j * 4 + 2] = pt[2];
                points4D[j * 4 + 3] = pt[3];
            }
            lineData.push({ points4D, colorGroup: 0, type: 'u-curve', fixedVal: vFixed });
        }

        // 2. v-曲线 (固定u，变化v) -> 金色曲线，对应u固定
        for (let i = 0; i < NUM_U_CURVES; i++) {
            const uFixed = (Math.PI * 2 * i) / NUM_U_CURVES;
            const points4D = new Float32Array(POINTS_PER_LINE * 4);
            for (let j = 0; j < POINTS_PER_LINE; j++) {
                const v = (Math.PI * 2 * j) / (POINTS_PER_LINE - 1);
                const pt = cliffordPoint(uFixed, v);
                points4D[j * 4] = pt[0];
                points4D[j * 4 + 1] = pt[1];
                points4D[j * 4 + 2] = pt[2];
                points4D[j * 4 + 3] = pt[3];
            }
            lineData.push({ points4D, colorGroup: 1, type: 'v-curve', fixedVal: uFixed });
        }

        // 3. 对角线曲线 (u+v = const) -> 品红
        for (let i = 0; i < NUM_DIAG_CURVES; i++) {
            const constSum = (Math.PI * 2 * i) / NUM_DIAG_CURVES;
            const points4D = new Float32Array(POINTS_PER_LINE * 4);
            for (let j = 0; j < POINTS_PER_LINE; j++) {
                const u = (Math.PI * 2 * j) / (POINTS_PER_LINE - 1);
                const v = constSum - u;
                const pt = cliffordPoint(u, v);
                points4D[j * 4] = pt[0];
                points4D[j * 4 + 1] = pt[1];
                points4D[j * 4 + 2] = pt[2];
                points4D[j * 4 + 3] = pt[3];
            }
            lineData.push({ points4D, colorGroup: 2, type: 'diag', fixedVal: constSum });
        }

        console.log('线条总数:', lineData.length);

        // ==================== 创建 Three.js 线条对象 ====================
        const lineGeometries = [];
        const linePositionArrays = [];
        const lineObjects = [];

        for (let i = 0; i < lineData.length; i++) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_LINE * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setDrawRange(0, POINTS_PER_LINE);
            const data = lineData[i];
            let color;
            if (data.colorGroup === 0) color = COLOR_CYAN;
            else if (data.colorGroup === 1) color = COLOR_GOLD;
            else color = COLOR_MAGENTA;
            const mat = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.78,
                depthTest: true,
                depthWrite: true,
                blending: THREE.NormalBlending,
            });
            const line = new THREE.Line(geom, mat);
            line.frustumCulled = false;
            scene.add(line);
            lineGeometries.push(geom);
            linePositionArrays.push(positions);
            lineObjects.push(line);
        }

        // ==================== 4D旋转与立体投影 ====================
        function project4D(points4D, out3D, count, cosA, sinA, cosB, sinB) {
            const SCALE = 1.8;
            const MAX_COORD = 6.5;
            for (let k = 0; k < count; k++) {
                let x0 = points4D[k * 4];
                let x1 = points4D[k * 4 + 1];
                let x2 = points4D[k * 4 + 2];
                let x3 = points4D[k * 4 + 3];

                // 双旋转
                const x0r = x0 * cosA - x1 * sinA;
                const x1r = x0 * sinA + x1 * cosA;
                const x2r = x2 * cosB - x3 * sinB;
                const x3r = x2 * sinB + x3 * cosB;

                // 立体投影
                const denom = 1 - x3r;
                const safeDenom = Math.abs(denom) < 0.0001 ? (denom >= 0 ? 0.0001 : -0.0001) : denom;
                const invDenom = 1 / safeDenom;
                let X = x0r * invDenom * SCALE;
                let Y = x1r * invDenom * SCALE;
                let Z = x2r * invDenom * SCALE;

                // 软钳制
                X = Math.max(-MAX_COORD, Math.min(MAX_COORD, X));
                Y = Math.max(-MAX_COORD, Math.min(MAX_COORD, Y));
                Z = Math.max(-MAX_COORD, Math.min(MAX_COORD, Z));

                out3D[k * 3] = X;
                out3D[k * 3 + 1] = Y;
                out3D[k * 3 + 2] = Z;
            }
        }

        // ==================== 更新所有线条 ====================
        function updateAllLines(cosA, sinA, cosB, sinB) {
            for (let i = 0; i < lineData.length; i++) {
                const data = lineData[i];
                const positions = linePositionArrays[i];
                project4D(data.points4D, positions, POINTS_PER_LINE, cosA, sinA, cosB, sinB);
                lineGeometries[i].attributes.position.needsUpdate = true;
            }
        }

        // ==================== 动画状态 ====================
        const omega1 = 0.25;
        const omega2 = 0.25 * Math.SQRT2;
        let alpha = 0.4;
        let beta = 0.9;
        let lastTime = performance.now();
        let timeAccum = 0;
        let frameCount = 0;
        let firstFrameDone = false;

        // 相机自动旋转
        let camAngle = 0.5;
        const camRadius = 4.8;
        const camHeightBase = 0.8;
        const camHeightAmp = 0.7;
        const camHeightFreq = 0.27;

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            let dt = (timestamp - lastTime) / 1000;
            if (dt <= 0) dt = 0.016;
            if (dt > 0.2) dt = 0.2;
            lastTime = timestamp;
            timeAccum += dt;

            // 更新旋转角
            alpha += omega1 * dt;
            beta += omega2 * dt;
            if (alpha > 1000) alpha -= 1000;
            if (beta > 1000) beta -= 1000;

            const cosA = Math.cos(alpha);
            const sinA = Math.sin(alpha);
            const cosB = Math.cos(beta);
            const sinB = Math.sin(beta);

            updateAllLines(cosA, sinA, cosB, sinB);

            // 相机旋转
            camAngle += dt * 0.14;
            const camX = camRadius * Math.sin(camAngle);
            const camZ = camRadius * Math.cos(camAngle);
            const camY = camHeightBase + camHeightAmp * Math.sin(camHeightFreq * timeAccum + 2.1);
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0.15, 0);

            // 星空旋转
            stars.rotation.y += dt * 0.03;
            stars.rotation.x += dt * 0.01;

            renderer.render(scene, camera);
            frameCount++;

            if (!firstFrameDone && frameCount >= 3) {
                firstFrameDone = true;
                console.log('动画已稳定运行');
            }
        }

        // ==================== 初始帧强制渲染 ====================
        function renderInitialFrame() {
            const cosA = Math.cos(alpha);
            const sinA = Math.sin(alpha);
            const cosB = Math.cos(beta);
            const sinB = Math.sin(beta);
            updateAllLines(cosA, sinA, cosB, sinB);
            camera.position.set(4.2, 1.2, 4.8);
            camera.lookAt(0, 0.2, 0);
            renderer.render(scene, camera);
            console.log('初始帧已绘制');
        }

        // ==================== 窗口响应 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150));

        // ==================== 看门狗：防画面停滞 ====================
        let watchdogFrameCount = frameCount;
        let watchdogLastCheck = performance.now();
        setInterval(() => {
            const now = performance.now();
            const elapsed = now - watchdogLastCheck;
            if (elapsed > 1800 && watchdogFrameCount === frameCount && frameCount > 8) {
                console.warn('检测到可能停滞，尝试恢复...');
                alpha += 0.03;
                beta += 0.04;
                const cosA = Math.cos(alpha);
                const sinA = Math.sin(alpha);
                const cosB = Math.cos(beta);
                const sinB = Math.sin(beta);
                updateAllLines(cosA, sinA, cosB, sinB);
                camAngle += 0.04;
                const camX = camRadius * Math.sin(camAngle);
                const camZ = camRadius * Math.cos(camAngle);
                const camY = camHeightBase + camHeightAmp * Math.sin(camHeightFreq * timeAccum + 2.1);
                camera.position.set(camX, camY, camZ);
                camera.lookAt(0, 0.15, 0);
                renderer.render(scene, camera);
            }
            watchdogFrameCount = frameCount;
            watchdogLastCheck = now;
        }, 2500);

        // ==================== 启动 ====================
        renderInitialFrame();
        setTimeout(() => {
            lastTime = performance.now();
            requestAnimationFrame(animate);
            console.log('动画循环启动');
        }, 120);

        console.log('Clifford环面动画初始化完成');
        console.log('线条总数:', lineData.length, ' 每条点数:', POINTS_PER_LINE);
    </script>
</body>
</html>
