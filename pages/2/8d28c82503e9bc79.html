<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复正弦保角网 · 球极投影</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>复正弦保角网 · 球极投影</h2>
        <div class="sub">sin(z) level sets · Conformal orthogonal grid</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">Re(sin z) = sin x·cosh y = c₁</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">Im(sin z) = cos x·sinh y = c₂</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">|sin z| = √(sin²x+sinh²y) = c₃</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.0, 2.2, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.6;
        const PROJ_D = 2.0;
        const PLANE_RANGE = 2.6;

        // 球极投影
        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // 复函数 sin(z) 的值
        function sinZ(x, y) {
            const sinX = Math.sin(x);
            const cosX = Math.cos(x);
            const coshY = Math.cosh(y);
            const sinhY = Math.sinh(y);
            return {
                re: sinX * coshY,
                im: cosX * sinhY,
                mod: Math.sqrt(sinX * sinX * coshY * coshY + cosX * cosX * sinhY * sinhY)
            };
        }

        // 梯度
        function gradRe(x, y) {
            return { dx: Math.cos(x) * Math.cosh(y), dy: Math.sin(x) * Math.sinh(y) };
        }
        function gradIm(x, y) {
            return { dx: -Math.sin(x) * Math.sinh(y), dy: Math.cos(x) * Math.cosh(y) };
        }
        function gradMod(x, y) {
            const v = sinZ(x, y);
            const m = v.mod || 1e-8;
            const sinX = Math.sin(x), cosX = Math.cos(x);
            const coshY = Math.cosh(y), sinhY = Math.sinh(y);
            const drdx = (sinX * cosX * coshY * coshY - cosX * sinX * sinhY * sinhY) / m;
            const drdy = (sinX * sinX * coshY * sinhY + cosX * cosX * sinhY * coshY) / m;
            return { dx: drdx, dy: drdy };
        }

        // 隐式曲线追踪
        function traceLevelCurve(startX, startY, evalFn, gradFn, targetVal, maxSteps, stepSize) {
            const pts = [];
            let x = startX,
                y = startY;
            const visited = new Set();
            for (let s = 0; s < maxSteps; s++) {
                if (Math.abs(x) > PLANE_RANGE || Math.abs(y) > PLANE_RANGE) break;
                const key = Math.round(x * 60) + ',' + Math.round(y * 60);
                if (visited.has(key) && s > 25) break;
                if (s > 15) visited.add(key);

                pts.push([x, y]);

                const val = evalFn(x, y);
                const err = targetVal - val;
                const gr = gradFn(x, y);
                const g2 = gr.dx * gr.dx + gr.dy * gr.dy;
                if (g2 < 1e-12) break;

                // 牛顿校正
                x += err * gr.dx / g2;
                y += err * gr.dy / g2;

                // 切线方向推进
                const tx = -gr.dy;
                const ty = gr.dx;
                const tn = Math.sqrt(tx * tx + ty * ty);
                if (tn < 1e-8) break;
                x += stepSize * tx / tn;
                y += stepSize * ty / tn;
            }
            return pts;
        }

        // 找种子点
        function findSeeds(targetVal, evalFn, scanSteps) {
            const seeds = [];
            const d = 2 * PLANE_RANGE / scanSteps;
            for (let i = 0; i <= scanSteps; i++) {
                const x0 = -PLANE_RANGE + i * d;
                for (let j = 0; j <= scanSteps; j++) {
                    const y0 = -PLANE_RANGE + j * d;
                    const val = evalFn(x0, y0);
                    if (Math.abs(val - targetVal) < 0.15 && Math.abs(val) < 50) {
                        let tooClose = false;
                        for (const [sx, sy] of seeds) {
                            if (Math.abs(x0 - sx) < 0.35 && Math.abs(y0 - sy) < 0.35) { tooClose = true; break; }
                        }
                        if (!tooClose) seeds.push([x0, y0]);
                    }
                }
            }
            return seeds;
        }

        // 生成一族等值线
        function createLevelCurves(targetVals, evalFn, gradFn, color, opacity, stepSize, maxSteps) {
            const group = new THREE.Group();
            for (const tv of targetVals) {
                const seeds = findSeeds(tv, evalFn, 35);
                const usedSeeds = new Set();
                for (const [sx, sy] of seeds) {
                    const key = Math.round(sx * 30) + ',' + Math.round(sy * 30);
                    if (usedSeeds.has(key)) continue;
                    usedSeeds.add(key);
                    const raw = traceLevelCurve(sx, sy, evalFn, gradFn, tv, maxSteps, stepSize);
                    if (raw.length < 2) continue;
                    const pts3D = raw.map(([x, y]) => stereographic(x, y));
                    const geom = new THREE.BufferGeometry().setFromPoints(pts3D);
                    const mat = new THREE.LineBasicMaterial({
                        color,
                        transparent: true,
                        opacity,
                        depthWrite: true,
                        depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 采样函数值范围
        function sampleRange(evalFn, count) {
            const samples = [];
            const d = 2 * PLANE_RANGE / count;
            for (let i = 0; i <= count; i++) {
                const x = -PLANE_RANGE + i * d;
                for (let j = 0; j <= count; j++) {
                    const y = -PLANE_RANGE + j * d;
                    const v = evalFn(x, y);
                    if (Math.abs(v) < 30) samples.push(v);
                }
            }
            if (samples.length === 0) return [0, 1];
            samples.sort((a, b) => a - b);
            return [
                samples[Math.floor(samples.length * 0.08)],
                samples[Math.floor(samples.length * 0.92)]
            ];
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'sin-conformal';
        scene.add(rootGroup);

        const stepSize = 0.02;
        const maxSteps = 500;
        const levelCount = 28;

        // 等实部线 (金色)
        const [reMin, reMax] = sampleRange((x, y) => sinZ(x, y).re, 30);
        const reTargets = [];
        for (let i = 0; i < levelCount; i++) reTargets.push(reMin + (i + 0.5) * (reMax - reMin) / levelCount);
        rootGroup.add(createLevelCurves(reTargets,
            (x, y) => sinZ(x, y).re,
            gradRe, COLOR_GOLD, 0.72, stepSize, maxSteps));

        // 等虚部线 (青色)
        const [imMin, imMax] = sampleRange((x, y) => sinZ(x, y).im, 30);
        const imTargets = [];
        for (let i = 0; i < levelCount; i++) imTargets.push(imMin + (i + 0.5) * (imMax - imMin) / levelCount);
        rootGroup.add(createLevelCurves(imTargets,
            (x, y) => sinZ(x, y).im,
            gradIm, COLOR_CYAN, 0.72, stepSize, maxSteps));

        // 等模线 (品红)
        const [modMin, modMax] = sampleRange((x, y) => sinZ(x, y).mod, 30);
        const modTargets = [];
        for (let i = 0; i < 24; i++) modTargets.push(modMin + (i + 0.7) * (modMax - modMin) / 24);
        rootGroup.add(createLevelCurves(modTargets,
            (x, y) => sinZ(x, y).mod,
            gradMod, COLOR_MAGENTA, 0.68, stepSize * 1.1, maxSteps));

        console.log('保角网线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 动画循环
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.26;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 复正弦保角网动画已稳定运行');
    </script>
</body>
</html>
