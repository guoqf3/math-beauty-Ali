<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>萤火虫之舞</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a06;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="fireflyCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('fireflyCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                fireflyCount: 55,           // 萤火虫数量
                maxFireflies: 80,           // 最大数量（点击生成）
                baseSpeed: 0.65,            // 基础移动速度
                turnProbability: 0.03,      // 随机转向概率
                maxTurnAngle: 0.8,          // 最大转向角度（弧度）
                mouseAttractRadius: 180,    // 鼠标吸引半径
                mouseAttractStrength: 0.06, // 吸引强度
                clickRepelRadius: 260,      // 点击光波半径
                clickRepelStrength: 14,     // 光波推动强度
                lightPulseRadius: 220,      // 光波视觉半径
                lightPulseDuration: 700,    // 光波持续时间(ms)
                maxLightPulses: 3,          // 最大光波数量
                glowSizeFactor: 5,          // 光晕半径因子
                coreSizeMin: 0.6,           // 核心最小半径
                coreSizeMax: 2.2,           // 核心最大半径
                hueRange: 30,               // 色相变化范围（黄绿色域）
                saturationMin: 85,
                saturationMax: 100,
                lightnessMin: 55,
                lightnessMax: 75,
                pulseSpeedMin: 0.3,         // 发光闪烁速度范围
                pulseSpeedMax: 1.2,
                backgroundFade: 0.06,       // 拖尾强度（很低，保留淡淡光迹）
                backgroundBase: '#0a0a06',
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let fireflies = [];
            let lightPulses = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // ---------- 萤火虫类 ----------
            class Firefly {
                constructor(x, y, hue, saturation, lightness) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * CONFIG.baseSpeed;
                    this.vy = (Math.random() - 0.5) * CONFIG.baseSpeed;
                    this.hue = hue;
                    this.saturation = saturation;
                    this.lightness = lightness;
                    this.coreSize = Math.random() * (CONFIG.coreSizeMax - CONFIG.coreSizeMin) + CONFIG.coreSizeMin;
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * (CONFIG.pulseSpeedMax - CONFIG.pulseSpeedMin) + CONFIG
                        .pulseSpeedMin;
                    this.turnTimer = Math.random() * 100;
                }

                update(dt, now, time) {
                    // 随机转向（模拟萤火虫的不规则飞行）
                    this.turnTimer -= dt * 0.08;
                    if (this.turnTimer <= 0 || Math.random() < CONFIG.turnProbability * dt) {
                        const turnAngle = (Math.random() - 0.5) * CONFIG.maxTurnAngle;
                        const cos = Math.cos(turnAngle);
                        const sin = Math.sin(turnAngle);
                        const newVx = this.vx * cos - this.vy * sin;
                        const newVy = this.vx * sin + this.vy * cos;
                        this.vx = newVx;
                        this.vy = newVy;
                        this.turnTimer = Math.random() * 80 + 30;
                    }

                    // 鼠标吸引
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = smoothMouseX - this.x;
                        const dy = smoothMouseY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.mouseAttractRadius && dist > 0.01) {
                            const force = (CONFIG.mouseAttractRadius - dist) / CONFIG.mouseAttractRadius * CONFIG
                                .mouseAttractStrength;
                            this.vx += (dx / dist) * force * dt;
                            this.vy += (dy / dist) * force * dt;
                        }
                    }

                    // 光波推动
                    for (const pulse of lightPulses) {
                        const dx = this.x - pulse.x;
                        const dy = this.y - pulse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const pulseRadius = pulse.maxRadius * (0.25 + 0.75 * pulse.progress);
                        if (dist < pulseRadius && dist > 0.01) {
                            const force = (1 - dist / pulseRadius) * pulse.strength * pulse.envelope;
                            this.vx += (dx / dist) * force;
                            this.vy += (dy / dist) * force;
                        }
                    }

                    // 阻尼
                    const damping = 0.97;
                    this.vx *= damping;
                    this.vy *= damping;

                    // 限制速度
                    const maxSpeed = CONFIG.baseSpeed * 2.5;
                    const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (currentSpeed > maxSpeed) {
                        this.vx = (this.vx / currentSpeed) * maxSpeed;
                        this.vy = (this.vy / currentSpeed) * maxSpeed;
                    }

                    // 更新位置
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界处理
                    const margin = 30;
                    if (this.x < -margin) this.x = width + margin;
                    else if (this.x > width + margin) this.x = -margin;
                    if (this.y < -margin) this.y = height + margin;
                    else if (this.y > height + margin) this.y = -margin;

                    this.x = Math.max(-margin, Math.min(width + margin, this.x));
                    this.y = Math.max(-margin, Math.min(height + margin, this.y));
                }

                // 获取当前亮度
                getBrightness() {
                    let brightness = this.lightness;
                    // 靠近鼠标时亮度提升
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = this.x - smoothMouseX;
                        const dy = this.y - smoothMouseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.mouseAttractRadius) {
                            brightness += (1 - dist / CONFIG.mouseAttractRadius) * 30;
                        }
                    }
                    // 脉冲式发光
                    const pulse = Math.sin(time * this.pulseSpeed * 2 + this.pulsePhase);
                    // 使用平滑的非对称脉冲
                    const pulseValue = pulse * 0.6 + Math.sin(time * this.pulseSpeed * 0.7 + this.pulsePhase * 1.3) * 0.4;
                    brightness += pulseValue * 18;
                    return Math.max(35, Math.min(100, brightness));
                }

                // 获取当前核心大小
                getCoreSize() {
                    const pulse = Math.sin(time * this.pulseSpeed * 2 + this.pulsePhase) * 0.5;
                    return Math.max(0.3, this.coreSize + pulse);
                }
            }

            // ---------- 光波类 ----------
            class LightPulse {
                constructor(x, y, startTime) {
                    this.x = x;
                    this.y = y;
                    this.startTime = startTime;
                    this.maxRadius = CONFIG.clickRepelRadius;
                    this.strength = CONFIG.clickRepelStrength;
                    this.duration = CONFIG.lightPulseDuration;
                    this.progress = 0;
                    this.envelope = 1;
                }

                update(now) {
                    this.progress = Math.min(1, (now - this.startTime) / this.duration);
                    this.envelope = Math.max(0, 1 - this.progress);
                }

                isExpired() {
                    return this.progress >= 1;
                }

                // 获取光波视觉半径
                getVisualRadius() {
                    return this.maxRadius * (0.2 + 0.8 * this.progress);
                }
            }

            // ---------- 初始化萤火虫 ----------
            function initFireflies() {
                fireflies = [];
                for (let i = 0; i < CONFIG.fireflyCount; i++) {
                    const x = Math.random() * width;
                    const y = Math.random() * height;
                    const hue = 45 + Math.random() * CONFIG.hueRange - CONFIG.hueRange / 2; // 黄绿色域
                    const sat = Math.random() * (CONFIG.saturationMax - CONFIG.saturationMin) + CONFIG.saturationMin;
                    const light = Math.random() * (CONFIG.lightnessMax - CONFIG.lightnessMin) + CONFIG.lightnessMin;
                    fireflies.push(new Firefly(x, y, hue, sat, light));
                }
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = CONFIG.backgroundBase;
                ctx.fillRect(0, 0, width, height);
                initFireflies();
                drawScene(performance.now());
            }

            // ---------- 绘制场景 ----------
            function drawScene(now) {
                // 背景拖尾（非常低，保留淡淡的光迹）
                ctx.fillStyle = 'rgba(10, 10, 6, ' + CONFIG.backgroundFade + ')';
                ctx.fillRect(0, 0, width, height);

                // 开启混合模式，让光效叠加变亮
                ctx.globalCompositeOperation = 'lighter';

                // 平滑鼠标位置
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.12;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.12;
                }

                // 绘制鼠标周围柔和的暖光
                if (mouseActive && smoothMouseX > -1000) {
                    const glowRadius = 130;
                    const grad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY,
                        glowRadius);
                    grad.addColorStop(0, 'rgba(200, 180, 80, 0.08)');
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制光波视觉效果
                for (const pulse of lightPulses) {
                    const radius = pulse.getVisualRadius();
                    const alpha = 0.25 * pulse.envelope;
                    const grad = ctx.createRadialGradient(pulse.x, pulse.y, 0, pulse.x, pulse.y, radius);
                    grad.addColorStop(0, `rgba(255, 230, 120, ${alpha * 0.5})`);
                    grad.addColorStop(0.5, `rgba(200, 180, 80, ${alpha * 0.3})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(pulse.x, pulse.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制所有萤火虫
                for (const firefly of fireflies) {
                    const brightness = firefly.getBrightness();
                    const coreSize = firefly.getCoreSize();
                    const glowSize = coreSize * CONFIG.glowSizeFactor;

                    // 外光晕
                    const outerGlow = ctx.createRadialGradient(firefly.x, firefly.y, 0, firefly.x, firefly.y, glowSize);
                    outerGlow.addColorStop(0, `hsla(${firefly.hue}, ${firefly.saturation}%, ${brightness}%, 0.5)`);
                    outerGlow.addColorStop(0.4, `hsla(${firefly.hue}, ${firefly.saturation}%, ${brightness}%, 0.25)`);
                    outerGlow.addColorStop(1, `hsla(${firefly.hue}, ${firefly.saturation}%, ${brightness}%, 0)`);
                    ctx.fillStyle = outerGlow;
                    ctx.beginPath();
                    ctx.arc(firefly.x, firefly.y, glowSize, 0, Math.PI * 2);
                    ctx.fill();

                    // 内核心光
                    const coreGlow = ctx.createRadialGradient(firefly.x, firefly.y, 0, firefly.x, firefly.y, coreSize *
                        1.8);
                    coreGlow.addColorStop(0, `hsla(50, 100%, 100%, ${0.6 + brightness * 0.004})`);
                    coreGlow.addColorStop(1, `hsla(${firefly.hue}, 100%, 90%, 0)`);
                    ctx.fillStyle = coreGlow;
                    ctx.beginPath();
                    ctx.arc(firefly.x, firefly.y, coreSize * 1.8, 0, Math.PI * 2);
                    ctx.fill();

                    // 中心点
                    ctx.fillStyle = `hsla(50, 100%, 100%, 0.85)`;
                    ctx.beginPath();
                    ctx.arc(firefly.x, firefly.y, coreSize * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 恢复混合模式
                ctx.globalCompositeOperation = 'source-over';

                // 移除过期光波
                lightPulses = lightPulses.filter(p => !p.isExpired());
                if (lightPulses.length > CONFIG.maxLightPulses) {
                    lightPulses = lightPulses.slice(-CONFIG.maxLightPulses);
                }
            }

            // ---------- 更新萤火虫 ----------
            function updateFireflies(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                // 更新光波
                for (const pulse of lightPulses) {
                    pulse.update(now);
                }

                // 更新萤火虫
                for (const firefly of fireflies) {
                    firefly.update(dt, now, time);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updateFireflies(now);
                drawScene(now);

                animationId = requestAnimationFrame(animate);
            }

            // ---------- 鼠标与触摸事件 ----------
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function handleClick(clientX, clientY) {
                const now = performance.now();
                // 创建光波
                lightPulses.push(new LightPulse(clientX, clientY, now));
                if (lightPulses.length > CONFIG.maxLightPulses) {
                    lightPulses = lightPulses.slice(-CONFIG.maxLightPulses);
                }
                // 在点击位置额外生成1-2只萤火虫
                const extraCount = Math.random() > 0.5 ? 2 : 1;
                for (let i = 0; i < extraCount; i++) {
                    if (fireflies.length >= CONFIG.maxFireflies) break;
                    const hue = 45 + Math.random() * CONFIG.hueRange - CONFIG.hueRange / 2;
                    const sat = Math.random() * (CONFIG.saturationMax - CONFIG.saturationMin) + CONFIG.saturationMin;
                    const light = Math.random() * (CONFIG.lightnessMax - CONFIG.lightnessMin) + CONFIG.lightnessMin;
                    const newFirefly = new Firefly(
                        clientX + (Math.random() - 0.5) * 30,
                        clientY + (Math.random() - 0.5) * 30,
                        hue, sat, light
                    );
                    newFirefly.vx = (Math.random() - 0.5) * CONFIG.baseSpeed * 2;
                    newFirefly.vy = (Math.random() - 0.5) * CONFIG.baseSpeed * 2;
                    fireflies.push(newFirefly);
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__fireflies = {
                config: CONFIG,
                fireflies: fireflies,
                lightPulses: lightPulses,
            };
        })();
    </script>
</body>
</html>
