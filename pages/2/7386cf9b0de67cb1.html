<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>离子晶格振动 · 格波传播 | Lattice Waves</title>
<style>
  :root{
    --cyan:#5fe6ff;
    --gold:#ffd166;
    --violet:#b06bff;
    --line:rgba(95,230,255,.20);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#02040c;
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#bfe6ff;-webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;}
  #app canvas{display:block;}

  .panel{
    position:fixed;
    padding:14px 18px;
    border-radius:14px;
    background:linear-gradient(160deg, rgba(9,26,48,.66), rgba(4,12,24,.44));
    border:1px solid var(--line);
    box-shadow:0 0 34px rgba(0,140,255,.12), inset 0 0 22px rgba(0,120,200,.06);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    pointer-events:none;
    user-select:none;
    z-index:10;
  }

  /* ---------- 左上：标题 + 公式 ---------- */
  #hud-left{top:22px;left:22px;max-width:352px;}
  #hud-left h1{
    font-size:16px;font-weight:600;letter-spacing:.14em;
    color:#e8faff;margin-bottom:2px;
    text-shadow:0 0 16px rgba(95,230,255,.7);
  }
  #hud-left h1 span{
    display:block;font-size:9.5px;letter-spacing:.32em;
    color:rgba(95,230,255,.55);font-weight:400;margin-top:3px;
  }
  .divider{
    height:1px;margin:11px 0 10px;
    background:linear-gradient(90deg, rgba(95,230,255,.55), rgba(95,230,255,0) 90%);
  }
  .formula{
    font-family:Georgia,"Times New Roman","Songti SC",serif;
    font-size:13.5px;line-height:1.85;color:#a8d8f0;
    display:flex;align-items:baseline;gap:8px;white-space:nowrap;
  }
  .formula .lbl{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:10px;letter-spacing:.1em;color:rgba(95,230,255,.5);
    min-width:46px;flex:0 0 auto;
  }
  .formula i{font-style:italic;color:#dff6ff;}
  .formula.hl{color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.45);}
  .formula.hl i{color:#ffe9b0;}
  .formula.vio{color:#cf9bff;text-shadow:0 0 14px rgba(176,107,255,.42);}
  .formula.vio i{color:#e6ccff;}

  /* ---------- 右上：参数 ---------- */
  #hud-right{top:22px;right:22px;width:230px;}
  .stat{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;line-height:2.05;
    border-bottom:1px dashed rgba(95,230,255,.10);
    padding-bottom:1px;
  }
  .stat:last-child{border-bottom:none;}
  .stat span{color:rgba(150,200,230,.66);letter-spacing:.04em;}
  .stat b{
    font-weight:600;color:#7ef0ff;font-variant-numeric:tabular-nums;
    text-shadow:0 0 12px rgba(95,230,255,.5);
  }
  .stat b.gold{color:var(--gold);text-shadow:0 0 12px rgba(255,209,102,.5);}
  .stat b.vio{color:#c78bff;text-shadow:0 0 12px rgba(176,107,255,.5);}

  /* ---------- 底部图例 ---------- */
  #legend{
    left:50%;bottom:22px;transform:translateX(-50%);
    display:flex;gap:24px;align-items:center;
    padding:10px 24px;border-radius:100px;font-size:11.5px;
    letter-spacing:.06em;color:rgba(160,210,240,.78);
    white-space:nowrap;
  }
  #legend .dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:7px;vertical-align:middle;
  }
  .d1{background:#ffd166;box-shadow:0 0 12px #ffd166;}
  .d2{background:#5fe6ff;box-shadow:0 0 12px #5fe6ff;}
  .d3{background:#b06bff;box-shadow:0 0 12px #b06bff;}

  /* ---------- 启动遮罩 ---------- */
  #start-overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;
    background:radial-gradient(ellipse at 50% 45%, rgba(6,20,40,.72), rgba(2,5,12,.96) 72%);
    transition:opacity .9s ease, visibility .9s;
  }
  #start-overlay.hidden{opacity:0;visibility:hidden;}
  #start-overlay .tag{
    font-size:11px;letter-spacing:.55em;color:rgba(95,230,255,.55);
    text-transform:uppercase;
  }
  #start-overlay .big{
    font-size:clamp(22px,4vw,40px);font-weight:600;letter-spacing:.22em;
    color:#eafcff;text-shadow:0 0 40px rgba(95,230,255,.75), 0 0 90px rgba(80,160,255,.35);
  }
  #startBtn{
    pointer-events:auto;cursor:pointer;
    padding:14px 46px;border-radius:100px;
    font-size:14px;letter-spacing:.22em;font-weight:500;
    color:#eafcff;background:rgba(95,230,255,.08);
    border:1px solid rgba(95,230,255,.55);
    box-shadow:0 0 26px rgba(95,230,255,.28), inset 0 0 24px rgba(95,230,255,.10);
    transition:all .32s cubic-bezier(.2,.8,.3,1);
    font-family:inherit;
  }
  #startBtn:hover{
    background:rgba(95,230,255,.20);
    box-shadow:0 0 46px rgba(95,230,255,.6), inset 0 0 30px rgba(95,230,255,.22);
    transform:translateY(-2px) scale(1.03);
  }
  #startBtn:active{transform:translateY(0) scale(.99);}

  /* 角落装饰 */
  .corner{
    position:fixed;width:52px;height:52px;pointer-events:none;z-index:9;
    border-color:rgba(95,230,255,.30);border-style:solid;border-width:0;
  }
  .c-tl{top:14px;left:14px;border-top-width:1px;border-left-width:1px;}
  .c-tr{top:14px;right:14px;border-top-width:1px;border-right-width:1px;}
  .c-bl{bottom:14px;left:14px;border-bottom-width:1px;border-left-width:1px;}
  .c-br{bottom:14px;right:14px;border-bottom-width:1px;border-right-width:1px;}

  @media (max-width:760px){
    #hud-left{max-width:240px;padding:11px 13px;top:12px;left:12px;}
    #hud-left h1{font-size:13px;}
    .formula{font-size:11px;line-height:1.7;}
    .formula .lbl{min-width:36px;font-size:9px;}
    #hud-right{width:158px;padding:11px 12px;top:12px;right:12px;}
    .stat{font-size:10px;}
    #legend{gap:13px;font-size:9.5px;padding:8px 15px;bottom:12px;}
    .corner{display:none;}
  }
</style>
</head>
<body>

<div id="app"></div>

<!-- 左上角：公式面板 -->
<div id="hud-left" class="panel">
  <h1>离子晶格振动<span>LATTICE VIBRATION · NORMAL MODES</span></h1>
  <div class="divider"></div>
  <div class="formula hl"><span class="lbl">色散</span><span><i>ω</i>(<i>k</i>) = <i>ω</i><sub>max</sub> |sin(<i>ka</i>/2)|</span></div>
  <div class="formula"><span class="lbl">格波</span><span><i>u</i><sub>n</sub>(<i>t</i>) = <i>A</i> sin(<i>nka</i> − <i>ωt</i>)</span></div>
  <div class="formula"><span class="lbl">相位差</span><span>Δ<i>φ</i> = <i>ka</i></span></div>
  <div class="formula vio"><span class="lbl">群速度</span><span><i>v</i><sub>g</sub> = d<i>ω</i>/d<i>k</i> = (<i>ω</i><sub>max</sub><i>a</i>/2)cos(<i>ka</i>/2)</span></div>
  <div class="formula"><span class="lbl">布里渊区</span><span><i>k</i> ∈ [−<i>π</i>/<i>a</i>, +<i>π</i>/<i>a</i>]</span></div>
</div>

<!-- 右上角：参数面板 -->
<div id="hud-right" class="panel">
  <div class="stat"><span>晶格常数 a</span><b>1.25</b></div>
  <div class="stat"><span>波矢 k</span><b>0.550</b></div>
  <div class="stat"><span>波长 λ</span><b>11.42</b></div>
  <div class="stat"><span>角频率 ω</span><b class="gold">1.180 rad/s</b></div>
  <div class="stat"><span>振幅 A</span><b>1.60</b></div>
  <div class="stat"><span>原子数</span><b class="vio">26 × 26 = 676</b></div>
</div>

<!-- 底部图例 -->
<div id="legend" class="panel">
  <span><i class="dot d1"></i>波峰（金色）</span>
  <span><i class="dot d2"></i>平衡面（青色）</span>
  <span><i class="dot d3"></i>波谷（紫色）</span>
</div>

<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>
<div class="corner c-br"></div>

<!-- 启动遮罩 -->
<div id="start-overlay">
  <div class="tag">Phonon · Dispersion · Normal Modes</div>
  <div class="big">晶 格 格 波</div>
  <button id="startBtn">▶ 启动模拟 · 开启音效</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   0. 物理 / 晶格常量
   ========================================================= */
const N        = 26;              // 晶格 N × N
const A_LAT    = 1.25;            // 晶格常数 a
const HALF     = ((N - 1) * A_LAT) / 2;
const AMP      = 1.60;            // 振幅 A
const K_WAVE   = 0.550;           // 波矢大小
const OMEGA_MAX= 3.50;
const DIR_TH   = Math.PI / 4;     // 波传播方向（XZ 平面内）

// 色散关系：ω = ω_max·|sin(ka/2)|
const OMEGA    = OMEGA_MAX * Math.abs(Math.sin((K_WAVE * A_LAT) / 2));

// 波矢分量
const KX = K_WAVE * Math.cos(DIR_TH);
const KZ = K_WAVE * Math.sin(DIR_TH);

const COUNT = N * N;
const PR    = Math.min(window.devicePixelRatio || 1, 2);

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* 背景渐变 */
(function makeBackground() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 512;
  const ctx = c.getContext('2d');
  const grd = ctx.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0.00, '#071a33');
  grd.addColorStop(0.30, '#05101f');
  grd.addColorStop(0.58, '#080a1c');
  grd.addColorStop(0.82, '#04050d');
  grd.addColorStop(1.00, '#010206');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, 4, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 2000);

/* 环绕相机 */
let camAngle = 0.6;
const CAM_R = 40;
function updateCamera(dt) {
  camAngle += dt * 0.105;
  const h = 19 + 7.5 * Math.sin(camAngle * 0.63);
  camera.position.set(Math.cos(camAngle) * CAM_R, h, Math.sin(camAngle) * CAM_R);
  camera.lookAt(0, 0, 0);
}
camera.position.set(Math.cos(camAngle) * CAM_R, 22, Math.sin(camAngle) * CAM_R);
camera.lookAt(0, 0, 0);

/* =========================================================
   2. 星空背景
   ========================================================= */
(function addStars() {
  const M = 520;
  const pos = new Float32Array(M * 3);
  for (let i = 0; i < M; i++) {
    const r = 420 + Math.random() * 520;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 0.9);
    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = 20 + r * Math.cos(phi) * 0.85;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x8fd8ff, size: 1.7, sizeAttenuation: true,
    transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* =========================================================
   3. 参考平面（极淡的晶格基准面网格）
   ========================================================= */
(function buildBaseGrid() {
  const g = new THREE.GridHelper(N * A_LAT + 2, N - 1, 0x2b7fb0, 0x123a55);
  g.material.transparent = true;
  g.material.opacity = 0.16;
  g.position.y = -AMP - 0.9;
  scene.add(g);
})();

/* =========================================================
   4. 晶格格点（InstancedMesh）
   ========================================================= */
const sphereGeo = new THREE.SphereGeometry(0.17, 10, 8);
const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const lattice   = new THREE.InstancedMesh(sphereGeo, sphereMat, COUNT);
lattice.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
lattice.frustumCulled = false;
scene.add(lattice);

/* 预计算格点平面坐标 */
const POS_X = new Float32Array(COUNT);
const POS_Z = new Float32Array(COUNT);
{
  let idx = 0;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      POS_X[idx] = -HALF + i * A_LAT;
      POS_Z[idx] = -HALF + j * A_LAT;
      idx++;
    }
  }
}

/* 初始化颜色，确保 instanceColor 被创建 */
{
  const c = new THREE.Color(0x5fe6ff);
  for (let i = 0; i < COUNT; i++) lattice.setColorAt(i, c);
  if (lattice.instanceColor) lattice.instanceColor.needsUpdate = true;
}

/* 颜色映射：紫(波谷) → 青(平衡) → 金(波峰) */
const _col = new THREE.Color();
function waveColor(u, out) {
  // u ∈ [0,1]，0 = 波谷，1 = 波峰
  if (u < 0.5) {
    const t = u / 0.5;
    out.setRGB(
      0.62 + (0.30 - 0.62) * t,
      0.26 + (0.92 - 0.26) * t,
      1.00 + (1.00 - 1.00) * t
    );
  } else {
    const t = (u - 0.5) / 0.5;
    out.setRGB(
      0.30 + (1.00 - 0.30) * t,
      0.92 + (0.82 - 0.92) * t,
      1.00 + (0.35 - 1.00) * t
    );
  }
}

/* =========================================================
   5. 格波更新
   ========================================================= */
const _dummy = new THREE.Object3D();

function updateLattice(t) {
  for (let i = 0; i < COUNT; i++) {
    const x = POS_X[i];
    const z = POS_Z[i];

    // 行波：u = A·sin(k·r − ωt)
    const s = Math.sin(KX * x + KZ * z - OMEGA * t);
    const y = AMP * s;

    _dummy.position.set(x, y, z);
    _dummy.updateMatrix();
    lattice.setMatrixAt(i, _dummy.matrix);

    const u = (s + 1) * 0.5;
    waveColor(u, _col);
    lattice.setColorAt(i, _col);
  }
  lattice.instanceMatrix.needsUpdate = true;
  if (lattice.instanceColor) lattice.instanceColor.needsUpdate = true;
}

/* =========================================================
   6. 后期处理（辉光）
   ========================================================= */
let composer = null;
try {
  composer = new EffectComposer(renderer);
  composer.setSize(window.innerWidth, window.innerHeight);
  composer.addPass(new RenderPass(scene, camera));

  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.88,   // strength
    0.55,   // radius
    0.42    // threshold
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
} catch (err) {
  console.warn('后期处理初始化失败，回退到直接渲染：', err);
  composer = null;
}

/* =========================================================
   7. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let simTime = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  updateLattice(simTime);
  updateCamera(dt);

  if (composer) composer.render();
  else renderer.render(scene, camera);
}
animate();

/* =========================================================
   8. 窗口自适应
   ========================================================= */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  }, 80);
});

/* =========================================================
   9. 科技感背景音效（Web Audio · 洁净版）
   ========================================================= */
let audioCtx = null;
let blipTimer = null;

function startAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  audioCtx = new AC();
  const ctx = audioCtx;

  /* ---------- 主输出链：master → 低通 → 压缩器 → destination ---------- */
  const compressor = ctx.createDynamicsCompressor();
  compressor.threshold.value = -22;
  compressor.knee.value      = 24;
  compressor.ratio.value     = 5;
  compressor.attack.value    = 0.015;
  compressor.release.value   = 0.40;

  const masterLP = ctx.createBiquadFilter();
  masterLP.type = 'lowpass';
  masterLP.frequency.value = 3200;
  masterLP.Q.value = 0.5;

  const master = ctx.createGain();
  master.gain.value = 0.0001;

  master.connect(masterLP);
  masterLP.connect(compressor);
  compressor.connect(ctx.destination);

  /* ---------- 低频氛围铺底：纯正弦，极轻 detune ---------- */
  const padFilter = ctx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 220;
  padFilter.Q.value = 1.2;

  const padGain = ctx.createGain();
  padGain.gain.value = 0.20;
  padFilter.connect(padGain);
  padGain.connect(master);

  [55, 82.5, 110, 165].forEach((f, i) => {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    o.detune.value = (i - 1.5) * 2.5;

    const g = ctx.createGain();
    g.gain.value = i === 0 ? 0.50 : 0.26 / (1 + i * 0.5);

    o.connect(g);
    g.connect(padFilter);
    o.start();
  });

  /* ---------- 缓慢呼吸 LFO ---------- */
  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.035;

  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 70;
  lfo.connect(lfoGain);
  lfoGain.connect(padFilter.frequency);
  lfo.start();

  /* ---------- 延迟回声：低反馈 + 内置低通 ---------- */
  const delay = ctx.createDelay(2.0);
  delay.delayTime.value = 0.55;

  const dLP = ctx.createBiquadFilter();
  dLP.type = 'lowpass';
  dLP.frequency.value = 1800;

  const fb = ctx.createGain();
  fb.gain.value = 0.22;

  delay.connect(dLP);
  dLP.connect(fb);
  fb.connect(delay);

  const delayWet = ctx.createGain();
  delayWet.gain.value = 0.30;
  delay.connect(delayWet);
  delayWet.connect(master);

  /* ---------- 随机闪烁音符：正弦 + 柔和包络 ---------- */
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
  let nextBlip = ctx.currentTime + 0.6;

  function schedule() {
    if (!audioCtx) return;
    const now = ctx.currentTime;
    while (nextBlip < now + 1.0) {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = SCALE[(Math.random() * SCALE.length) | 0];

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, nextBlip);
      g.gain.exponentialRampToValueAtTime(0.018, nextBlip + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, nextBlip + 1.6);

      o.connect(g);
      g.connect(master);
      g.connect(delay);

      o.start(nextBlip);
      o.stop(nextBlip + 1.7);

      nextBlip += 0.80 + Math.random() * 2.0;
    }
    blipTimer = setTimeout(schedule, 500);
  }
  schedule();

  /* ---------- 淡入 ---------- */
  const t0 = ctx.currentTime;
  master.gain.cancelScheduledValues(t0);
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.exponentialRampToValueAtTime(0.40, t0 + 3.0);

  /* ---------- 切后台自动降音 ---------- */
  document.addEventListener('visibilitychange', () => {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const cur = Math.max(master.gain.value, 0.0001);
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(cur, t);
    master.gain.exponentialRampToValueAtTime(document.hidden ? 0.02 : 0.40, t + 1.0);
  });
}

/* =========================================================
   10. 启动交互
   ========================================================= */
const overlay  = document.getElementById('start-overlay');
const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  try { startAudio(); } catch (e) { console.warn('音频启动失败：', e); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

window.addEventListener('beforeunload', () => {
  if (blipTimer) { clearTimeout(blipTimer); blipTimer = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
});
</script>
</body>
</html>
