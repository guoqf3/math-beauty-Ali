<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMBER · 余烬轻扬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0c0a08;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }
        .overlay:hover {
            opacity: 0.85;
        }
        .title {
            color: rgba(245, 215, 170, 0.7);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 150, 60, 0.4);
        }
        .hint {
            color: rgba(200, 160, 110, 0.45);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            .overlay { bottom: 18px; }
            .title { font-size: 8px; letter-spacing: 0.45em; }
            .hint { font-size: 6px; letter-spacing: 0.22em; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">Ember</div>
        <div class="hint">move · click</div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let embers = [];
            let sparks = [];
            let mouse = { x: -9999, y: -9999, active: false, vx: 0, vy: 0, lastX: -9999, lastY: -9999 };
            let time = 0;
            let colorShift = 0;
            let maxEmbers = 220;

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0c0a08';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 余烬粒子 ─────────────────────────────────────────────
            class Ember {
                constructor(spawnFromBottom) {
                    this.reset(spawnFromBottom);
                }

                reset(spawnFromBottom) {
                    this.x = Math.random() * W;
                    this.y = spawnFromBottom ? H + 20 + Math.random() * 40 : Math.random() * H;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = -(0.5 + Math.random() * 2.2);  // 上升速度
                    this.size = 0.6 + Math.random() * 2.2;
                    this.life = 1.0;
                    this.maxLife = 2.0 + Math.random() * 4.0;  // 生命周期
                    this.decayRate = 0.003 + Math.random() * 0.006;
                    this.hue = 15 + Math.random() * 35;  // 橙红-金黄范围
                    if (Math.random() < 0.25) {
                        this.hue = 0 + Math.random() * 10;  // 深红
                    } else if (Math.random() < 0.2) {
                        this.hue = 45 + Math.random() * 15;  // 金黄
                    }
                    this.saturation = 75 + Math.random() * 20;
                    this.lightness = 45 + Math.random() * 30;
                    this.alpha = 0.5 + Math.random() * 0.4;
                    this.wobblePhase = Math.random() * Math.PI * 2;
                    this.wobbleSpeed = 0.5 + Math.random() * 1.5;
                    this.wobbleAmplitude = 0.3 + Math.random() * 1.2;
                    this.flickerSpeed = 1.0 + Math.random() * 3.0;
                    this.flickerPhase = Math.random() * Math.PI * 2;
                    this.turbulence = 0;
                }

                update(dt, mouse, t) {
                    // 上升运动
                    this.y += this.vy * dt;
                    this.x += this.vx * dt;

                    // 摇曳：水平摆动
                    this.x += Math.sin(t * this.wobbleSpeed + this.wobblePhase) * this.wobbleAmplitude * 0.03;

                    // 上升过程中轻微减速
                    this.vy *= 0.9995;

                    // 鼠标气流扰动
                    if (mouse.active) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const distSq = dx * dx + dy * dy;
                        const radius = 220;
                        const radiusSq = radius * radius;
                        if (distSq < radiusSq && distSq > 0.01) {
                            const dist = Math.sqrt(distSq);
                            const falloff = 1 - dist / radius;
                            // 鼠标移动吹动余烬
                            this.vx += mouse.vx * falloff * 0.2;
                            this.vy += mouse.vy * falloff * 0.2;
                            // 轻微径向推离
                            this.vx += dx / dist * falloff * 0.3;
                            this.vy += dy / dist * falloff * 0.3;
                            // 被扰动时增亮
                            this.life = Math.max(0.1, this.life);
                        }
                    }

                    // 速度限制
                    const maxSpeed = 3.0;
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    // 生命周期衰减
                    this.life -= this.decayRate * dt;
                    if (this.life <= 0) {
                        this.alpha *= 0.98;
                    }

                    // 边界检查：顶部消失后从底部重新出现
                    if (this.y < -30 || this.life <= 0) {
                        this.reset(true);
                    }
                    if (this.x < -30) this.x = W + 30;
                    if (this.x > W + 30) this.x = -30;
                }

                draw(ctx, t) {
                    const flicker = 0.6 + 0.4 * Math.sin(t * this.flickerSpeed + this.flickerPhase);
                    const lifeFade = Math.min(1, this.life * 2);
                    const alpha = this.alpha * flicker * lifeFade;
                    if (alpha < 0.02) return;

                    const hue = this.hue + colorShift + Math.sin(t * 0.7 + this.wobblePhase) * 10;
                    const light = this.lightness + flicker * 20;

                    // 余烬光晕
                    const radius = this.size * 3.5 * (0.8 + 0.4 * flicker);
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, radius);
                    gradient.addColorStop(0, `hsla(${hue}, ${this.saturation}%, ${light + 25}%, ${alpha})`);
                    gradient.addColorStop(0.4, `hsla(${hue}, ${this.saturation}%, ${light}%, ${alpha * 0.5})`);
                    gradient.addColorStop(0.8, `hsla(${hue}, ${this.saturation}%, ${light - 15}%, ${alpha * 0.15})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心亮点
                    ctx.fillStyle = `hsla(${hue}, ${this.saturation}%, ${light + 35}%, ${alpha * 0.9})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 初始化余烬 ───────────────────────────────────────────
            function initEmbers() {
                embers = [];
                for (let i = 0; i < maxEmbers; i++) {
                    embers.push(new Ember(Math.random() < 0.7));
                }
            }

            // ─── 火星爆发 ─────────────────────────────────────────────
            function createSparks(x, y) {
                const count = 20 + Math.floor(Math.random() * 15);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 7;
                    sparks.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 0.5,
                        life: 0.6 + Math.random() * 0.8,
                        maxLife: 1.4,
                        size: 0.8 + Math.random() * 2.5,
                        hue: 20 + colorShift + Math.random() * 45 - 10,
                        sat: 80 + Math.random() * 15,
                        light: 50 + Math.random() * 35,
                        alpha: 0.85,
                    });
                }
                if (sparks.length > 180) {
                    sparks.splice(0, sparks.length - 180);
                }
            }

            function updateSparks(dt) {
                for (let i = sparks.length - 1; i >= 0; i--) {
                    const p = sparks[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                    p.vy -= 0.06 * dt;  // 轻微上升
                    p.life -= 0.025 * dt;
                    if (p.life <= 0) {
                        sparks.splice(i, 1);
                    }
                }
            }

            function drawSparks(ctx) {
                for (const p of sparks) {
                    const alpha = p.life * p.alpha;
                    const size = p.size * p.life;
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 3);
                    gradient.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`);
                    gradient.addColorStop(0.5, `hsla(${p.hue}, ${p.sat}%, ${p.light - 10}%, ${alpha * 0.5})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 鼠标光晕 ─────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 65;
                const hue = 25 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 60%, 70%, 0.06)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 50%, 65%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    const dtNorm = fixedStep / 1000 * 60;
                    // 更新鼠标速度
                    if (mouse.active && mouse.lastX > -9000) {
                        mouse.vx = (mouse.x - mouse.lastX) * 0.05;
                        mouse.vy = (mouse.y - mouse.lastY) * 0.05;
                    } else {
                        mouse.vx *= 0.9;
                        mouse.vy *= 0.9;
                    }
                    mouse.lastX = mouse.x;
                    mouse.lastY = mouse.y;

                    for (const e of embers) {
                        e.update(dtNorm, mouse, time);
                    }
                    updateSparks(dtNorm);
                }

                // 半透明覆盖，形成余烬拖尾
                ctx.fillStyle = 'rgba(12, 10, 8, 0.18)';
                ctx.fillRect(0, 0, W, H);

                // 绘制余烬
                for (const e of embers) {
                    e.draw(ctx, time);
                }

                // 绘制火星
                drawSparks(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ─────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
                mouse.vx = 0;
                mouse.vy = 0;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createSparks(mouse.x, mouse.y);
                colorShift += 8 + Math.random() * 12;
                if (colorShift > 40) colorShift = -8;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createSparks(mouse.x, mouse.y);
                    colorShift += 8 + Math.random() * 12;
                    if (colorShift > 40) colorShift = -8;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
                mouse.vx = 0;
                mouse.vy = 0;
            }

            function onResize() {
                setupCanvas();
                const targetCount = Math.max(120, Math.min(260, Math.floor(W * H / 6000)));
                if (targetCount !== embers.length) {
                    while (embers.length < targetCount) {
                        embers.push(new Ember(true));
                    }
                    if (embers.length > targetCount) {
                        embers.length = targetCount;
                    }
                }
                sparks = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                maxEmbers = Math.max(120, Math.min(260, Math.floor(W * H / 6000)));
                initEmbers();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0c0a08';
                    ctx.fillRect(0, 0, W, H);
                }
            });
        })();
    </script>
</body>
</html>
