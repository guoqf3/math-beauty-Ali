<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYSTAL · 晶体生长</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a18;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }
        .overlay:hover {
            opacity: 0.85;
        }
        .title {
            color: rgba(210, 220, 250, 0.7);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(130, 160, 230, 0.4);
        }
        .hint {
            color: rgba(160, 175, 210, 0.45);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            .overlay { bottom: 18px; }
            .title { font-size: 8px; letter-spacing: 0.45em; }
            .hint { font-size: 6px; letter-spacing: 0.22em; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">Crystal</div>
        <div class="hint">move · click</div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let crystals = [];
            let mouse = { x: -9999, y: -9999, active: false };
            let time = 0;
            let colorShift = 0;
            let maxCrystals = 14;
            let sparkles = [];

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0a0a18';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 晶枝类 ─────────────────────────────────────────────────
            class Branch {
                constructor(x, y, angle, depth, maxLength, hue, parentBranch) {
                    this.x = x;
                    this.y = y;
                    this.angle = angle;
                    this.depth = depth;
                    this.maxLength = maxLength;
                    this.currentLength = 0;
                    this.growthRate = 0.8 + Math.random() * 1.5;
                    this.hue = hue;
                    this.parentBranch = parentBranch;
                    this.children = [];
                    this.alpha = 0.5 + Math.random() * 0.4;
                    this.thickness = Math.max(0.5, 2.8 - depth * 0.55);
                    this.hasSplit = false;
                    this.splitThreshold = maxLength * (0.5 + Math.random() * 0.3);
                    this.shimmerPhase = Math.random() * Math.PI * 2;
                    this.shimmerSpeed = 0.8 + Math.random() * 1.5;
                }

                update(dt, mouse, crystalX, crystalY) {
                    if (this.currentLength < this.maxLength) {
                        this.currentLength += this.growthRate * dt;
                        if (this.currentLength > this.maxLength) this.currentLength = this.maxLength;
                    }

                    this.shimmerPhase += this.shimmerSpeed * dt;

                    // 鼠标引导生长方向（仅对未分裂的浅层枝干）
                    if (mouse.active && this.depth < 3 && !this.hasSplit) {
                        const endX = this.x + Math.cos(this.angle) * this.currentLength;
                        const endY = this.y + Math.sin(this.angle) * this.currentLength;
                        const dx = mouse.x - endX;
                        const dy = mouse.y - endY;
                        const distSq = dx * dx + dy * dy;
                        const radius = 200;
                        if (distSq < radius * radius && distSq > 0.01) {
                            const dist = Math.sqrt(distSq);
                            const falloff = 1 - dist / radius;
                            const targetAngle = Math.atan2(dy, dx);
                            let angleDiff = targetAngle - this.angle;
                            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                            this.angle += angleDiff * falloff * 0.04;
                        }
                    }

                    // 分裂检查
                    if (!this.hasSplit && this.currentLength >= this.splitThreshold && this.depth < 4) {
                        this.split();
                    }

                    // 更新子枝
                    const endX = this.x + Math.cos(this.angle) * this.currentLength;
                    const endY = this.y + Math.sin(this.angle) * this.currentLength;
                    for (const child of this.children) {
                        child.x = endX;
                        child.y = endY;
                        child.update(dt, mouse, crystalX, crystalY);
                    }
                }

                split() {
                    this.hasSplit = true;
                    const childCount = 2 + Math.floor(Math.random() * 2);
                    const splitAngle = 0.35 + Math.random() * 0.4;
                    const endX = this.x + Math.cos(this.angle) * this.currentLength;
                    const endY = this.y + Math.sin(this.angle) * this.currentLength;

                    for (let i = 0; i < childCount; i++) {
                        const offsetAngle = (i - (childCount - 1) / 2) * splitAngle;
                        const childAngle = this.angle + offsetAngle;
                        const childMaxLength = this.maxLength * (0.55 + Math.random() * 0.3);
                        const childHue = this.hue + (Math.random() - 0.5) * 25;
                        const child = new Branch(
                            endX,
                            endY,
                            childAngle,
                            this.depth + 1,
                            childMaxLength,
                            childHue,
                            this
                        );
                        this.children.push(child);
                    }
                }

                draw(ctx, t) {
                    const endX = this.x + Math.cos(this.angle) * this.currentLength;
                    const endY = this.y + Math.sin(this.angle) * this.currentLength;

                    if (this.currentLength < 1) return;

                    const shimmer = 0.7 + 0.3 * Math.sin(this.shimmerPhase);
                    const alpha = this.alpha * shimmer;
                    const hue = this.hue + colorShift;
                    const sat = 55 + this.depth * 5;
                    const light = 50 + this.depth * 8;

                    // 晶体线条
                    const gradient = ctx.createLinearGradient(this.x, this.y, endX, endY);
                    gradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 15}%, ${alpha * 0.7})`);
                    gradient.addColorStop(1, `hsla(${hue}, ${sat + 10}%, ${light + 25}%, ${alpha})`);

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = this.thickness;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();

                    // 光晕线条
                    const glowGradient = ctx.createLinearGradient(this.x, this.y, endX, endY);
                    glowGradient.addColorStop(0, 'transparent');
                    glowGradient.addColorStop(1, `hsla(${hue}, ${sat}%, ${light + 35}%, ${alpha * 0.25})`);
                    ctx.strokeStyle = glowGradient;
                    ctx.lineWidth = this.thickness * 3;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();

                    // 分支端点光点
                    if (this.children.length === 0) {
                        const dotSize = this.thickness * 2.5;
                        const dotGradient = ctx.createRadialGradient(endX, endY, 0, endX, endY, dotSize * 2);
                        dotGradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 40}%, ${alpha})`);
                        dotGradient.addColorStop(1, 'transparent');
                        ctx.fillStyle = dotGradient;
                        ctx.beginPath();
                        ctx.arc(endX, endY, dotSize * 2, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light + 45}%, ${alpha * 0.9})`;
                        ctx.beginPath();
                        ctx.arc(endX, endY, dotSize * 0.6, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 绘制子枝
                    for (const child of this.children) {
                        child.draw(ctx, t);
                    }
                }
            }

            // ─── 晶体类 ─────────────────────────────────────────────────
            class Crystal {
                constructor(x, y, hue) {
                    this.x = x;
                    this.y = y;
                    this.hue = hue || 190 + Math.random() * 70;
                    this.branches = [];
                    this.age = 0;
                    this.maxBranches = 40;
                    this.branchCount = 0;

                    // 初始分支（4-7个主枝）
                    const branchCount = 4 + Math.floor(Math.random() * 4);
                    for (let i = 0; i < branchCount; i++) {
                        const angle = (i / branchCount) * Math.PI * 2 + Math.random() * 0.5;
                        const maxLength = 60 + Math.random() * 50;
                        const branch = new Branch(x, y, angle, 0, maxLength, this.hue, null);
                        this.branches.push(branch);
                        this.branchCount++;
                    }
                }

                update(dt, mouse) {
                    this.age += dt;
                    for (const branch of this.branches) {
                        branch.update(dt, mouse, this.x, this.y);
                    }
                }

                draw(ctx, t) {
                    // 晶体中心光点
                    const centerGradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 15);
                    centerGradient.addColorStop(0, `hsla(${this.hue + colorShift}, 70%, 80%, 0.8)`);
                    centerGradient.addColorStop(0.5, `hsla(${this.hue + colorShift}, 60%, 60%, 0.3)`);
                    centerGradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = centerGradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = `hsla(${this.hue + colorShift}, 75%, 85%, 0.9)`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
                    ctx.fill();

                    // 绘制所有枝干
                    for (const branch of this.branches) {
                        branch.draw(ctx, t);
                    }
                }

                // 检查是否应自然凋零
                isDead() {
                    return this.age > 600;
                }
            }

            // ─── 初始化晶体 ─────────────────────────────────────────────
            function initCrystals() {
                crystals = [];
                const count = 3 + Math.floor(Math.random() * 3);
                for (let i = 0; i < count; i++) {
                    const x = W * (0.1 + Math.random() * 0.8);
                    const y = H * (0.1 + Math.random() * 0.8);
                    crystals.push(new Crystal(x, y, 190 + Math.random() * 70));
                }
            }

            // ─── 晶尘闪烁粒子 ─────────────────────────────────────────
            function createSparkles(x, y, hue) {
                const count = 6 + Math.floor(Math.random() * 8);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 0.5 + Math.random() * 2;
                    sparkles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 0.8 + Math.random() * 0.6,
                        maxLife: 1.4,
                        size: 0.8 + Math.random() * 1.8,
                        hue: hue + Math.random() * 30 - 15,
                        sat: 60 + Math.random() * 30,
                        light: 70 + Math.random() * 20,
                        alpha: 0.7,
                    });
                }
                if (sparkles.length > 100) {
                    sparkles.splice(0, sparkles.length - 100);
                }
            }

            function updateSparkles(dt) {
                for (let i = sparkles.length - 1; i >= 0; i--) {
                    const p = sparkles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                    p.life -= 0.018 * dt;
                    if (p.life <= 0) {
                        sparkles.splice(i, 1);
                    }
                }
            }

            function drawSparkles(ctx) {
                for (const p of sparkles) {
                    const alpha = p.life * p.alpha;
                    const size = p.size * p.life;
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
                    gradient.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 55;
                const hue = 210 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 60%, 75%, 0.05)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 50%, 70%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    const dtNorm = fixedStep / 1000 * 60;
                    for (const crystal of crystals) {
                        crystal.update(dtNorm, mouse);
                    }
                    updateSparkles(dtNorm);
                    // 自然凋零清理
                    for (let i = crystals.length - 1; i >= 0; i--) {
                        if (crystals[i].isDead()) {
                            crystals.splice(i, 1);
                        }
                    }
                }

                // 清除画布
                ctx.fillStyle = '#0a0a18';
                ctx.fillRect(0, 0, W, H);

                // 绘制晶体
                for (const crystal of crystals) {
                    crystal.draw(ctx, time);
                }

                // 绘制晶尘
                drawSparkles(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                // 播下新晶种
                if (crystals.length < maxCrystals) {
                    const hue = 190 + colorShift + Math.random() * 60;
                    crystals.push(new Crystal(mouse.x, mouse.y, hue));
                    createSparkles(mouse.x, mouse.y, hue);
                }
                // 色彩偏移
                colorShift += 20 + Math.random() * 25;
                if (colorShift > 100) colorShift = -20;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    if (crystals.length < maxCrystals) {
                        const hue = 190 + colorShift + Math.random() * 60;
                        crystals.push(new Crystal(mouse.x, mouse.y, hue));
                        createSparkles(mouse.x, mouse.y, hue);
                    }
                    colorShift += 20 + Math.random() * 25;
                    if (colorShift > 100) colorShift = -20;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                setupCanvas();
                for (const crystal of crystals) {
                    crystal.x = Math.min(crystal.x, W - 10);
                    crystal.y = Math.min(crystal.y, H - 10);
                }
                sparkles = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initCrystals();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0a0a18';
                    ctx.fillRect(0, 0, W, H);
                }
            });
        })();
    </script>
</body>
</html>
