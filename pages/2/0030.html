<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>磁感光晕 · 呼吸音效</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060812;
            font-family: system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #hint {
            position: fixed;
            bottom: 20px;
            left: 24px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease;
            font-weight: 300;
        }
        #fps-badge {
            position: fixed;
            top: 16px;
            right: 18px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="fps-badge"></div>
    <div id="hint">移动旋转 · 点击换色</div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─── 性能与安全检查 ───
            if (!window.PIXI) {
                console.warn('PixiJS 加载失败');
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">需要WebGL支持</div>';
                return;
            }

            // ─── 常量定义 ───
            const FOCAL_LENGTH = 1200;
            const TOTAL_PARTICLES = 900;
            const BASE_SCALE = 0.08;
            const AUTO_ROTATE_SPEED = 0.3;
            const VIEW_SENSITIVITY_X = 0.7;
            const VIEW_SENSITIVITY_Y = 0.5;
            const FLOW_SPEED = 0.8;
            const NUM_L_SHELLS = 5;
            const PARTICLES_PER_SHELL = Math.floor(TOTAL_PARTICLES / NUM_L_SHELLS);

            // ─── 颜色主题 ───
            const COLOR_THEMES = [
                [0xFFD447, 0xFF9D4D, 0xFF6B4D, 0xFFB85C, 0xFFE0A0],
                [0x4D9FFF, 0xB06BFF, 0x4DFFD9, 0x6B6BFF, 0x7CD4FF],
                [0x6BFF6B, 0x4DFFD9, 0xB0FF6B, 0x4DFFFF, 0x8DFF4D],
                [0xFF6B9D, 0xFF4D6B, 0xFFB0C8, 0xFF9D4D, 0xD46BFF],
                [0x4DFFD9, 0x4D9FFF, 0x6B6BFF, 0xB06BFF, 0xFFD447],
            ];
            let currentThemeIndex = 0;

            // ─── DOM 元素 ───
            const fpsBadge = document.getElementById('fps-badge');
            const hintEl = document.getElementById('hint');

            // ─── PixiJS 应用初始化 ───
            let app;
            try {
                app = new PIXI.Application({
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0x060812,
                    antialias: false,
                    autoDensity: true,
                    resolution: Math.min(window.devicePixelRatio || 1, 2),
                    powerPreference: 'high-performance',
                    forceCanvas: !isWebGLAvailable(),
                });
            } catch (err) {
                console.error('PixiJS 初始化失败:', err);
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">初始化失败</div>';
                return;
            }

            function isWebGLAvailable() {
                try {
                    const canvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext &&
                        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
                } catch (e) { return false; }
            }

            document.body.appendChild(app.view);

            // ─── 创建发光纹理 ───
            function createGlowTexture(size) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const half = size / 2;
                const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
                gradient.addColorStop(0.0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.1, 'rgba(255,255,255,0.95)');
                gradient.addColorStop(0.35, 'rgba(255,255,255,0.6)');
                gradient.addColorStop(0.65, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                const tex = PIXI.Texture.from(c);
                tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
                return tex;
            }

            const glowTex64 = createGlowTexture(64);
            const glowTex128 = createGlowTexture(128);

            // ─── 粒子容器 ───
            const particleContainer = new PIXI.ParticleContainer(TOTAL_PARTICLES, {
                position: true,
                scale: true,
                tint: true,
                alpha: true,
            }, TOTAL_PARTICLES, true);
            particleContainer.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(particleContainer);

            // ─── 中心光晕 ───
            const centerGlow = new PIXI.Sprite(glowTex128);
            centerGlow.anchor.set(0.5);
            centerGlow.tint = 0xFFFFFF;
            centerGlow.alpha = 0.35;
            centerGlow.scale.set(1.6);
            centerGlow.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerGlow);

            const centerCore = new PIXI.Sprite(glowTex64);
            centerCore.anchor.set(0.5);
            centerCore.tint = 0xFFFFFF;
            centerCore.alpha = 0.75;
            centerCore.scale.set(0.3);
            centerCore.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerCore);

            // ─── 数据结构 ───
            const sprites = [];
            const particleData = [];

            let mouseX = 0;
            let mouseY = 0;
            let smoothMouseX = 0;
            let smoothMouseY = 0;
            let autoRotateY = 0;
            let shockWave = 0;
            let time = 0;
            let frameCount = 0;
            let fpsLastTime = 0;

            // ─── 音频系统（呼吸感音效） ───
            let audioCtx = null;
            let noiseBuffer = null;

            function initAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    // 预生成2秒白噪声缓冲区
                    const bufferSize = 2 * audioCtx.sampleRate;
                    noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                } catch (e) {
                    console.warn('Web Audio 初始化失败:', e);
                    audioCtx = null;
                }
            }

            function playBreathSound() {
                if (!audioCtx) {
                    initAudio();
                    if (!audioCtx) return;
                }
                // 确保上下文处于运行状态（处理浏览器自动播放策略）
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                // 创建噪声源
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                noiseSource.loop = true;

                // 带通滤波器，模拟呼吸频率变化
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.Q.value = 1.2;
                filter.frequency.setValueAtTime(400, now);
                filter.frequency.linearRampToValueAtTime(800, now + 0.15); // 吸气：频率上升
                filter.frequency.linearRampToValueAtTime(300, now + 0.6); // 呼气：频率下降

                // 增益包络
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.35, now + 0.15); // 吸气峰值
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.7); // 呼气结束

                // 连接
                noiseSource.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                // 开始并停止（0.7秒后停止）
                noiseSource.start(now);
                noiseSource.stop(now + 0.75);

                // 清理（可选，但自动垃圾回收）
                noiseSource.onended = () => {
                    noiseSource.disconnect();
                    filter.disconnect();
                    gainNode.disconnect();
                };
            }

            // ─── 偶极磁场线坐标计算 ───
            function dipoleFieldPoint(L, theta, phi) {
                const sinTheta = Math.sin(theta);
                const r = L * sinTheta * sinTheta;
                const x = r * sinTheta * Math.cos(phi);
                const y = r * Math.cos(theta);
                const z = r * sinTheta * Math.sin(phi);
                return { x, y, z };
            }

            // ─── 初始化粒子 ───
            function initParticles() {
                const shells = NUM_L_SHELLS;
                const perShell = PARTICLES_PER_SHELL;
                let particleIndex = 0;

                for (let s = 0; s < shells; s++) {
                    const L = 1.2 + (s / (shells - 1)) * 1.8;
                    const baseColorIdx = s % COLOR_THEMES[0].length;

                    for (let i = 0; i < perShell; i++) {
                        const sprite = new PIXI.Sprite(glowTex64);
                        sprite.anchor.set(0.5);

                        const theta = Math.random() * Math.PI;
                        const phi = Math.random() * Math.PI * 2;
                        const flowDir = Math.random() > 0.5 ? 1 : -1;
                        const speedFactor = 0.5 + Math.random() * 0.7;
                        const colorIdx = (baseColorIdx + Math.floor(Math.random() * 2)) % COLOR_THEMES[0].length;
                        sprite.tint = COLOR_THEMES[0][colorIdx];
                        sprite.alpha = 0.7 + Math.random() * 0.25;
                        sprite.scale.set(BASE_SCALE * (0.8 + Math.random() * 0.4));

                        const data = {
                            L: L,
                            theta: theta,
                            phi: phi,
                            flowDir: flowDir,
                            speedFactor: speedFactor,
                            colorIdx: colorIdx,
                            baseAlpha: 0.65 + Math.random() * 0.3,
                            wobbleAmp: 0.02 + Math.random() * 0.06,
                            wobbleFreq: 0.5 + Math.random() * 1.5,
                            wobblePhase: Math.random() * Math.PI * 2,
                        };

                        particleData.push(data);
                        sprites.push(sprite);
                        particleContainer.addChild(sprite);
                        particleIndex++;
                    }
                }

                while (particleIndex < TOTAL_PARTICLES) {
                    const sprite = new PIXI.Sprite(glowTex64);
                    sprite.anchor.set(0.5);
                    const s = Math.floor(Math.random() * shells);
                    const L = 1.2 + (s / (shells - 1)) * 1.8;
                    const baseColorIdx = s % COLOR_THEMES[0].length;
                    const theta = Math.random() * Math.PI;
                    const phi = Math.random() * Math.PI * 2;
                    const flowDir = Math.random() > 0.5 ? 1 : -1;
                    const speedFactor = 0.5 + Math.random() * 0.7;
                    const colorIdx = (baseColorIdx + Math.floor(Math.random() * 2)) % COLOR_THEMES[0].length;
                    sprite.tint = COLOR_THEMES[0][colorIdx];
                    sprite.alpha = 0.7 + Math.random() * 0.25;
                    sprite.scale.set(BASE_SCALE * (0.8 + Math.random() * 0.4));
                    const data = {
                        L,
                        theta,
                        phi,
                        flowDir,
                        speedFactor,
                        colorIdx,
                        baseAlpha: 0.65 + Math.random() * 0.3,
                        wobbleAmp: 0.02 + Math.random() * 0.06,
                        wobbleFreq: 0.5 + Math.random() * 1.5,
                        wobblePhase: Math.random() * Math.PI * 2,
                    };
                    particleData.push(data);
                    sprites.push(sprite);
                    particleContainer.addChild(sprite);
                    particleIndex++;
                }

                console.log('磁感光晕粒子初始化完成，数量:', sprites.length);
            }

            // ─── 3D 旋转与投影 ───
            function rotatePoint(x, y, z, viewX, viewY) {
                let cosY = Math.cos(viewY);
                let sinY = Math.sin(viewY);
                let x1 = x * cosY + z * sinY;
                let z1 = -x * sinY + z * cosY;
                let y1 = y;
                let cosX = Math.cos(viewX);
                let sinX = Math.sin(viewX);
                let y2 = y1 * cosX - z1 * sinX;
                let z2 = y1 * sinX + z1 * cosX;
                let x2 = x1;
                return { x: x2, y: y2, z: z2 };
            }

            function projectPoint(p, centerX, centerY) {
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + p.z);
                return {
                    sx: p.x * scale + centerX,
                    sy: p.y * scale + centerY,
                    scale: scale
                };
            }

            // ─── 更新粒子 ───
            function updateParticles(delta, viewX, viewY, centerX, centerY) {
                if (shockWave > 0) {
                    shockWave = Math.max(0, shockWave - delta * 2.5);
                }

                const timeNow = time;

                for (let i = 0; i < sprites.length; i++) {
                    const data = particleData[i];
                    const sprite = sprites[i];

                    data.theta += data.flowDir * data.speedFactor * FLOW_SPEED * delta * 0.3;
                    if (data.theta <= 0) {
                        data.theta = -data.theta;
                        data.flowDir = Math.abs(data.flowDir);
                    }
                    if (data.theta >= Math.PI) {
                        data.theta = 2 * Math.PI - data.theta;
                        data.flowDir = -Math.abs(data.flowDir);
                    }
                    data.phi += delta * 0.05 * data.speedFactor;

                    const wobble = data.wobbleAmp * Math.sin(timeNow * data.wobbleFreq + data.wobblePhase);
                    const adjustedTheta = data.theta + wobble;

                    const shockOffset = shockWave > 0 ? shockWave * 30 * Math.exp(-shockWave * 3) : 0;
                    const currentL = data.L + shockOffset;

                    const local = dipoleFieldPoint(currentL, adjustedTheta, data.phi);
                    const rp = rotatePoint(local.x, local.y, local.z, viewX, viewY);
                    const proj = projectPoint(rp, centerX, centerY);

                    const depthFactor = proj.scale;
                    const pulseGlow = 1 + 0.06 * Math.sin(timeNow * 2.5 + i * 0.12);
                    const alphaMod = 0.85 + 0.15 * Math.sin(timeNow * 1.8 + i * 0.1);

                    sprite.position.set(proj.sx, proj.sy);
                    sprite.scale.set(BASE_SCALE * depthFactor * pulseGlow);
                    sprite.alpha = Math.max(0.05, Math.min(1, data.baseAlpha * depthFactor * alphaMod));
                }
            }

            // ─── 更新中心光晕 ───
            function updateCenterGlow(centerX, centerY) {
                const pulse = 0.25 + 0.12 * Math.sin(time * 1.6) + 0.04 * Math.sin(time * 3.2);
                const shockPulse = shockWave > 0 ? shockWave * 0.4 : 0;
                centerGlow.position.set(centerX, centerY);
                centerGlow.alpha = Math.max(0.15, Math.min(0.6, pulse + shockPulse));
                centerGlow.scale.set(1.5 + 0.3 * Math.sin(time * 1.1) + shockWave * 0.7);
                centerCore.position.set(centerX, centerY);
                centerCore.scale.set(0.28 + 0.06 * Math.sin(time * 2.3) + shockWave * 0.2);
                centerCore.alpha = 0.65 + 0.2 * Math.sin(time * 1.3) + shockWave * 0.3;
            }

            // ─── 切换颜色主题 ───
            function switchTheme() {
                currentThemeIndex = (currentThemeIndex + 1) % COLOR_THEMES.length;
                const theme = COLOR_THEMES[currentThemeIndex];
                for (let i = 0; i < sprites.length; i++) {
                    const data = particleData[i];
                    const color = theme[data.colorIdx % theme.length];
                    sprites[i].tint = color;
                }
                centerCore.tint = theme[0];
                centerGlow.tint = theme[1] || theme[0];
            }

            // ─── 触发冲击波 ───
            function triggerShockWave() {
                shockWave = 1.0;
            }

            // ─── 主循环 ───
            app.ticker.add((delta) => {
                const dt = Math.min(delta / 60, 0.05);
                time += dt;
                frameCount++;

                const w = window.innerWidth;
                const h = window.innerHeight;
                const cx = w / 2;
                const cy = h / 2;

                smoothMouseX += (mouseX - smoothMouseX) * 0.065;
                smoothMouseY += (mouseY - smoothMouseY) * 0.065;

                autoRotateY += AUTO_ROTATE_SPEED * dt;

                const normX = (smoothMouseX / w) * 2 - 1;
                const normY = (smoothMouseY / h) * 2 - 1;
                const viewY = autoRotateY + normX * VIEW_SENSITIVITY_X;
                const viewX = normY * VIEW_SENSITIVITY_Y;

                updateParticles(dt, viewX, viewY, cx, cy);
                updateCenterGlow(cx, cy);

                if (time - fpsLastTime > 0.5) {
                    const fps = Math.round(frameCount / (time - fpsLastTime));
                    fpsBadge.textContent = fps + ' fps';
                    frameCount = 0;
                    fpsLastTime = time;
                }
            });

            // ─── 交互事件 ───
            function getCanvasCoords(e) {
                const rect = app.view.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function onPointerMove(e) {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
            }

            function onPointerDown(e) {
                e.preventDefault();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
                switchTheme();
                triggerShockWave();
                playBreathSound();  // 添加呼吸音效
                centerCore.alpha = 1.0;
                centerGlow.alpha = 0.8;
                setTimeout(() => {
                    centerCore.alpha = 0.75;
                    centerGlow.alpha = 0.35;
                }, 200);
            }

            function onPointerLeave() {
                mouseX = window.innerWidth / 2;
                mouseY = window.innerHeight / 2;
            }

            app.view.addEventListener('mousemove', onPointerMove);
            app.view.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mouseleave', onPointerLeave);

            app.view.addEventListener('touchmove', onPointerMove, { passive: true });
            app.view.addEventListener('touchstart', onPointerDown, { passive: false });
            app.view.addEventListener('touchend', () => {});

            // ─── 窗口大小调整 ───
            function handleResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                app.renderer.resize(w, h);
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(handleResize, 300);
            });

            // ─── 键盘交互 ───
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    switchTheme();
                    triggerShockWave();
                    playBreathSound();  // 添加呼吸音效
                }
            });

            // ─── 启动 ───
            initParticles();

            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
            smoothMouseX = mouseX;
            smoothMouseY = mouseY;

            setTimeout(() => {
                if (hintEl) {
                    hintEl.style.opacity = '0';
                    setTimeout(() => {
                        if (hintEl) hintEl.style.display = 'none';
                    }, 1600);
                }
            }, 3200);

            handleResize();
            console.log('✨ 磁感光晕已启动 — 粒子数:', sprites.length);
        })();
    </script>
</body>
</html>
