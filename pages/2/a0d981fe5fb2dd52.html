<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>08 薛定谔波函数概率云</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #020106;
    color: #e9e7ff;
    font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }

  /* ---------- 背景（压暗，避免抢戏） ---------- */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(60,26,110,0.14) 0%, rgba(6,3,16,0) 55%),
      radial-gradient(circle at 50% 50%, #06031a 0%, #02010a 55%, #000000 100%);
  }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.80) 100%);
  }
  #scene { position: fixed; inset: 0; z-index: 1; }
  canvas { display: block; }

  /* ---------- UI ---------- */
  .ui { position: fixed; z-index: 4; pointer-events: none; }

  header.ui { top: 34px; left: 42px; }
  .tag {
    font-size: 11px; letter-spacing: .38em; color: #8f7dd6;
    margin-bottom: 12px; text-transform: uppercase;
  }
  h1 {
    margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .14em;
    background: linear-gradient(92deg, #ff6ea8 0%, #c07bff 40%, #4fc8ff 72%, #5cffb0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(160,100,255,.40));
  }
  .sub {
    margin-top: 10px; font-size: 11px; letter-spacing: .26em; color: #6f6a9a;
  }

  .panel {
    left: 42px; bottom: 44px;
    padding: 18px 24px 16px; border-radius: 14px;
    background: linear-gradient(160deg, rgba(40,22,84,.38), rgba(10,6,24,.28));
    border: 1px solid rgba(140,110,255,.20);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    box-shadow:
      0 0 40px rgba(90,60,200,.12) inset,
      0 10px 44px rgba(0,0,0,.55);
  }
  .eq {
    font-family: "Cambria Math", Georgia, "Times New Roman", serif;
    font-size: 21px; line-height: 1.55; color: #d6d0ff;
    text-shadow: 0 0 16px rgba(150,120,255,.45);
    margin: 3px 0; letter-spacing: .02em;
  }
  .eq.small { font-size: 13.5px; color: #a89ee0; text-shadow: 0 0 12px rgba(120,90,220,.35); }
  .eq .hl  { color: #ff8fc0; }
  .eq .hl2 { color: #6fe0ff; }
  .eq .hl3 { color: #7dffb8; }

  .hint {
    right: 42px; bottom: 46px; font-size: 11px;
    letter-spacing: .22em; color: #5d5885; text-align: right; line-height: 1.9;
  }

  /* ---------- 启动层 ---------- */
  #startScreen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px;
    background: radial-gradient(circle at 50% 50%, rgba(22,10,46,.78), rgba(1,0,4,.96));
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: opacity 1s ease, visibility 1s ease;
  }
  #startScreen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  #startScreen .st {
    font-size: 12px; letter-spacing: .5em; color: #7d6cc4; text-indent: .5em;
  }
  #startBtn {
    pointer-events: auto; cursor: pointer;
    padding: 16px 52px; font-size: 15px; letter-spacing: .42em; text-indent: .42em;
    color: #f0e9ff; background: rgba(70,40,140,.16);
    border: 1px solid rgba(170,130,255,.50); border-radius: 40px;
    font-family: inherit;
    box-shadow: 0 0 32px rgba(140,90,255,.35), 0 0 70px rgba(255,90,170,.14) inset;
    transition: all .35s ease;
    animation: pulseBtn 2.6s ease-in-out infinite;
  }
  #startBtn:hover {
    background: rgba(120,70,220,.30);
    box-shadow: 0 0 56px rgba(170,110,255,.60), 0 0 90px rgba(255,90,170,.26) inset;
    transform: translateY(-2px);
  }
  @keyframes pulseBtn {
    0%, 100% { box-shadow: 0 0 26px rgba(140,90,255,.30), 0 0 60px rgba(255,90,170,.10) inset; }
    50%      { box-shadow: 0 0 52px rgba(170,110,255,.60), 0 0 90px rgba(255,90,170,.24) inset; }
  }

  @media (max-width: 720px) {
    header.ui { top: 22px; left: 20px; }
    h1 { font-size: 20px; }
    .sub { font-size: 9px; }
    .panel { left: 20px; bottom: 24px; padding: 13px 16px; }
    .eq { font-size: 16px; }
    .eq.small { font-size: 11px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="scene"></div>
<div id="vignette"></div>

<header class="ui">
  <div class="tag">Quantum Mechanics · 08</div>
  <h1>薛定谔波函数概率云</h1>
  <div class="sub">SCHRÖDINGER WAVE FUNCTION · PROBABILITY CLOUD</div>
</header>

<div class="panel ui">
  <div class="eq">iħ ∂ψ/∂t = Ĥψ</div>
  <div class="eq small">|<span class="hl">ψ(r,t)</span>|² &nbsp;→&nbsp; 概率密度分布</div>
  <div class="eq small">P(r) ∝ r² e<sup>−2r/a₀</sup></div>
  <div class="eq small">Ĥψ = Eψ &nbsp;⇒&nbsp; E<sub>n</sub> = <span class="hl2">−13.6 / n²</span> eV</div>
</div>

<div class="hint ui">
  拖动鼠标 · 旋转视角<br>
  滚轮 · 缩放
</div>

<div id="startScreen">
  <div class="st">QUANTUM PROBABILITY FIELD</div>
  <button id="startBtn">启 动</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   1. 基础场景参数
   ============================================================ */
let scene, camera, renderer, cloudGroup, tiltGroup, nucleus, halo;
let clock, uniforms;
let zoom = 1, targetRotX = 0, targetRotY = 0;

const COUNT        = 42000;   // 粒子数（略降，减少叠加发白）
const WORLD_SCALE  = 1.8;     // 玻尔半径 a0 对应的世界单位
const R_MAX_SAMPLE = 6.0;     // 采样半径上限（单位 a0）

/* ============================================================
   2. 多彩色相工具
   —— 半径映射为彩虹色相：桃红 → 品红 → 紫罗兰 → 蓝 → 青 → 绿 → 黄
   ============================================================ */
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r, g, b;
  if      (h <  60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [r + m, g + m, b + m];
}

/* 半径比例 t∈[0,1] → 色相（中心 336° 桃红 → 边缘 40° 金橙） */
const HUE_START = 336;
const HUE_SPAN  = 300;   // 336 - 300 = 36°

function colorAtRadius(t, jitterDeg) {
  const hue = HUE_START - t * HUE_SPAN + jitterDeg;
  const sat = 0.92;
  const lig = 0.44 + 0.10 * (1 - t);   // 中心略亮
  return hslToRgb(hue, sat, lig);
}

/* ============================================================
   3. 着色器
   ============================================================ */
const vertexShader = `
  attribute vec3  aColor;
  attribute float aSize;
  attribute float aAlpha;
  attribute float aPhase;

  uniform float uTime;
  uniform float uPixelRatio;
  uniform float uSizeScale;

  varying vec3  vColor;
  varying float vAlpha;

  void main() {
    vColor = aColor;

    vec3 p = position;
    float r = max(length(p), 0.0001);
    vec3 dir = p / r;

    // ---- 每个粒子独立的高频随机颤动（雾化但不模糊） ----
    float t  = uTime;
    float w1 = sin(t * 2.30 + aPhase * 62.83);
    float w2 = cos(t * 3.70 + aPhase * 31.42);
    float w3 = sin(t * 5.10 + aPhase * 94.25);

    // 径向伸缩
    p += dir * (w1 * 0.070);

    // 切向抖动
    vec3 tangent   = normalize(cross(dir, vec3(0.0, 1.0, 0.0)) + vec3(0.0001, 0.0, 0.0001));
    vec3 bitangent = normalize(cross(dir, tangent));
    p += tangent   * (w2 * 0.058);
    p += bitangent * (w3 * 0.058);

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;

    // ---- 闪烁 ----
    float twinkle = 0.72 + 0.28 * sin(t * 3.1 + aPhase * 80.0);

    // ---- 尺寸（保持小、锐利） ----
    gl_PointSize = aSize * uSizeScale * uPixelRatio * twinkle
                 * (46.0 / max(-mv.z, 0.001));
    gl_PointSize = clamp(gl_PointSize, 0.6, 14.0);

    vAlpha = aAlpha * twinkle;
  }
`;

const fragmentShader = `
  varying vec3  vColor;
  varying float vAlpha;

  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;

    // 锐利圆盘 + 极短边缘羽化（抗锯齿），避免糊成一片
    float d = sqrt(d2) * 2.0;
    float a = 1.0 - smoothstep(0.62, 1.0, d);
    a *= a;

    gl_FragColor = vec4(vColor, a * vAlpha);
  }
`;

/* ============================================================
   4. 概率云几何体：从 P(r) ∝ r² e^(−2r/a₀) 采样
   ============================================================ */
function buildProbabilityCloud() {
  const positions = new Float32Array(COUNT * 3);
  const colors    = new Float32Array(COUNT * 3);
  const sizes     = new Float32Array(COUNT);
  const alphas    = new Float32Array(COUNT);
  const phases    = new Float32Array(COUNT);

  for (let i = 0; i < COUNT; i++) {
    /* 径向采样：Gamma(3, 1/2) = 两个指数分布之和 —— 精确对应 r²e^(−2r) */
    let r, guard = 0;
    do {
      const u1 = Math.random() + 1e-9;
      const u2 = Math.random() + 1e-9;
      r = -0.5 * (Math.log(u1) + Math.log(u2));
      guard++;
    } while (r > R_MAX_SAMPLE && guard < 40);

    /* 球面均匀方向 */
    const u   = Math.random() * 2 - 1;
    const phi = Math.random() * Math.PI * 2;
    const s   = Math.sqrt(1 - u * u);
    const dx  = s * Math.cos(phi);
    const dy  = u;
    const dz  = s * Math.sin(phi);

    const rr = r * WORLD_SCALE;
    positions[i * 3]     = dx * rr;
    positions[i * 3 + 1] = dy * rr;
    positions[i * 3 + 2] = dz * rr;

    /* 颜色：彩虹色相 + 每粒子随机抖动 → 色彩丰富 */
    const t = 1 - Math.exp(-r / 1.8);
    const jitter = (Math.random() - 0.5) * 26;   // ±13° 色相扰动
    const c = colorAtRadius(t, jitter);
    colors[i * 3]     = c[0];
    colors[i * 3 + 1] = c[1];
    colors[i * 3 + 2] = c[2];

    /* 尺寸：小颗粒，保持锐利 */
    sizes[i]  = 0.34 + Math.random() * 0.62;

    /* 透明度：整体压低亮度，靠颜色而非曝光取胜 */
    const radialFalloff = Math.exp(-r / 2.2);
    alphas[i] = (0.035 + 0.135 * radialFalloff) * (0.55 + 0.45 * Math.random());

    phases[i] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aAlpha',   new THREE.BufferAttribute(alphas, 1));
  geo.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));

  return geo;
}

/* ============================================================
   5. 原子核辉光贴图
   ============================================================ */
function makeGlowTexture() {
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1.00)');
  g.addColorStop(0.12, 'rgba(255,200,235,0.85)');
  g.addColorStop(0.34, 'rgba(255,110,180,0.26)');
  g.addColorStop(0.66, 'rgba(140,90,255,0.07)');
  g.addColorStop(1.00, 'rgba(60,40,200,0.00)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

/* ============================================================
   6. 初始化
   ============================================================ */
function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
  camera.position.set(0, 0, 13);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.getElementById('scene').appendChild(renderer.domElement);

  /* 层级：tiltGroup（鼠标视差） → cloudGroup（自转 + 呼吸） */
  tiltGroup  = new THREE.Group();
  cloudGroup = new THREE.Group();
  scene.add(tiltGroup);
  tiltGroup.add(cloudGroup);

  /* 粒子云 */
  uniforms = {
    uTime:       { value: 0 },
    uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
    uSizeScale:  { value: 1.0 }
  };

  const mat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader,
    fragmentShader,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false
  });

  const points = new THREE.Points(buildProbabilityCloud(), mat);
  cloudGroup.add(points);

  /* 中心原子核辉光（收小、减弱，减少糊感） */
  const glowTex = makeGlowTexture();

  nucleus = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex,
    color: 0xffb3dc,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: 0.55
  }));
  nucleus.scale.set(1.15, 1.15, 1);
  cloudGroup.add(nucleus);

  halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex,
    color: 0x6a5cff,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: 0.08
  }));
  halo.scale.set(4.2, 4.2, 1);
  cloudGroup.add(halo);

  clock = new THREE.Clock();

  addEventListener('resize', onResize);
  addEventListener('pointermove', onPointerMove);
  addEventListener('wheel', onWheel, { passive: true });

  animate();
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixelRatio.value = Math.min(devicePixelRatio, 2);
}

function onPointerMove(e) {
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = (e.clientY / innerHeight) * 2 - 1;
  targetRotY = nx * 0.55;
  targetRotX = ny * 0.38;
}

function onWheel(e) {
  zoom += e.deltaY * 0.0009;
  zoom = Math.max(0.55, Math.min(2.4, zoom));
}

/* ============================================================
   7. 主循环
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  uniforms.uTime.value = t;

  /* —— 呼吸脉动：约 7.4 秒一个周期 —— */
  const breath = 1 + 0.072 * Math.sin(t * 0.85);
  cloudGroup.scale.setScalar(breath);

  /* —— 自转 + 轻微章动 —— */
  cloudGroup.rotation.y += 0.0011;
  cloudGroup.rotation.x  = 0.12 * Math.sin(t * 0.22);

  /* —— 鼠标视差（缓动） —— */
  tiltGroup.rotation.y += (targetRotY - tiltGroup.rotation.y) * 0.045;
  tiltGroup.rotation.x += (targetRotX - tiltGroup.rotation.x) * 0.045;

  /* —— 缩放缓动 —— */
  camera.position.z += (13 * zoom - camera.position.z) * 0.06;

  /* —— 核心呼吸微光 —— */
  const corePulse = 1 + 0.14 * Math.sin(t * 1.7);
  nucleus.scale.set(1.15 * corePulse, 1.15 * corePulse, 1);
  halo.scale.set(4.2 * (1 + 0.06 * Math.sin(t * 0.85)), 4.2 * (1 + 0.06 * Math.sin(t * 0.85)), 1);

  renderer.render(scene, camera);
}

/* ============================================================
   8. 科技感背景音效（Web Audio 实时合成）
   ============================================================ */
let audioStarted = false;

function startAudio() {
  if (audioStarted) return;
  audioStarted = true;

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();

    /* 总输出：淡入 */
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.50, ctx.currentTime + 5);
    master.connect(ctx.destination);

    /* ---------- 低频持续音（Drone） ---------- */
    const droneGain = ctx.createGain();
    droneGain.gain.value = 0.15;

    const droneFilter = ctx.createBiquadFilter();
    droneFilter.type = 'lowpass';
    droneFilter.frequency.value = 600;
    droneFilter.Q.value = 0.7;

    droneGain.connect(droneFilter);
    droneFilter.connect(master);

    // 呼吸式幅度调制（与视觉呼吸同频 ≈ 0.16 Hz）
    const breathLfo = ctx.createOscillator();
    breathLfo.frequency.value = 0.16;
    const breathDepth = ctx.createGain();
    breathDepth.gain.value = 0.070;
    breathLfo.connect(breathDepth);
    breathDepth.connect(droneGain.gain);
    breathLfo.start();

    [55, 82.41, 110, 164.81, 220].forEach((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = i % 2 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (Math.random() - 0.5) * 16;

      const g = ctx.createGain();
      g.gain.value = 0.55 / (i + 1.2);

      osc.connect(g);
      g.connect(droneGain);

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.045 + 0.06 * i;
      const lg = ctx.createGain();
      lg.gain.value = 0.30 * g.gain.value;
      lfo.connect(lg);
      lg.connect(g.gain);
      lfo.start();

      osc.start();
    });

    /* ---------- 白噪声空气层（带通扫频） ---------- */
    const len = Math.floor(ctx.sampleRate * 4);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const nFilter = ctx.createBiquadFilter();
    nFilter.type = 'bandpass';
    nFilter.frequency.value = 900;
    nFilter.Q.value = 1.1;

    const nGain = ctx.createGain();
    nGain.gain.value = 0.048;

    noise.connect(nFilter);
    nFilter.connect(nGain);
    nGain.connect(master);
    noise.start();

    const sweep = ctx.createOscillator();
    sweep.frequency.value = 0.042;
    const sweepDepth = ctx.createGain();
    sweepDepth.gain.value = 700;
    sweep.connect(sweepDepth);
    sweepDepth.connect(nFilter.frequency);
    sweep.start();

    const sweep2 = ctx.createOscillator();
    sweep2.frequency.value = 0.017;
    const sweep2Depth = ctx.createGain();
    sweep2Depth.gain.value = 260;
    sweep2.connect(sweep2Depth);
    sweep2Depth.connect(nFilter.frequency);
    sweep2.start();

    /* ---------- 高频微弱泛音（晶体感） ---------- */
    const shimmer = ctx.createOscillator();
    shimmer.type = 'sine';
    shimmer.frequency.value = 1318.5; // E6
    const shGain = ctx.createGain();
    shGain.gain.value = 0.007;

    const shLfo = ctx.createOscillator();
    shLfo.frequency.value = 0.09;
    const shDepth = ctx.createGain();
    shDepth.gain.value = 0.006;
    shLfo.connect(shDepth);
    shDepth.connect(shGain.gain);
    shLfo.start();

    shimmer.connect(shGain);
    shGain.connect(master);
    shimmer.start();

  } catch (err) {
    console.warn('音频初始化失败：', err);
  }
}

/* ============================================================
   9. 启动
   ============================================================ */
init();

const startScreen = document.getElementById('startScreen');
const startBtn    = document.getElementById('startBtn');

startBtn.addEventListener('click', () => {
  startScreen.classList.add('hide');
  startAudio();
});
</script>
</body>
