<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李萨如曲线动物园 · Lissajous Zoo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #1a1230 0%, #0e0a1c 55%, #060410 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e0dcf5;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding: 22px;
    display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap;
  }
  .stage {
    flex: 1 1 580px; min-width: 300px;
    position: relative;
    aspect-ratio: 760 / 520;
    border-radius: 26px;
    overflow: hidden;
    background: #0a0716;
    box-shadow: 0 24px 54px -24px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(167, 139, 250, .22) inset;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  .sound-toggle {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    background: rgba(30, 22, 60, .82);
    color: #d7c9ff;
    box-shadow: 0 5px 16px -5px rgba(0, 0, 0, .85),
                0 0 0 1px rgba(167, 139, 250, .38) inset;
    transition: transform .12s;
    z-index: 3;
  }
  .sound-toggle:active { transform: scale(.92); }

  .stage-label {
    position: absolute; left: 18px; top: 16px;
    padding: 7px 15px; border-radius: 99px;
    font-size: 14px; font-weight: 700; letter-spacing: .6px;
    background: rgba(30, 22, 60, .7);
    color: #d7c9ff;
    box-shadow: 0 0 0 1px rgba(167, 139, 250, .3) inset;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 2;
    transition: color .3s, box-shadow .3s;
  }

  .panel {
    flex: 0 1 348px; min-width: 292px;
    background: rgba(20, 16, 40, .78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 26px;
    padding: 22px 22px 18px;
    box-shadow: 0 24px 54px -26px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(167, 139, 250, .18) inset;
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 {
    font-size: 20px; margin: 0; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
    color: #ece7ff;
  }
  h1 .emoji { font-size: 23px; }

  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 16px; text-align: center;
    padding: 11px 10px; border-radius: 15px;
    background: linear-gradient(135deg, rgba(58, 40, 100, .9), rgba(34, 24, 66, .9));
    color: #c4b5fd;
    letter-spacing: .5px;
    box-shadow: 0 0 0 1px rgba(167, 139, 250, .25) inset;
    line-height: 1.7;
  }
  .formula b { color: #ffd88a; font-weight: 700; }

  .presets {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .preset {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 2px 8px;
    border: none; border-radius: 14px; cursor: pointer;
    font-family: inherit;
    background: rgba(38, 28, 72, .9);
    color: #a79cc9;
    box-shadow: 0 0 0 1.4px rgba(120, 100, 190, .35) inset;
    transition: all .16s;
  }
  .preset .pe { font-size: 19px; line-height: 1; }
  .preset .pn { font-size: 11px; font-weight: 700; letter-spacing: .3px; }
  .preset:hover { background: rgba(52, 38, 96, .95); }
  .preset.on {
    background: linear-gradient(180deg, #8b6ce8, #6d4fd0);
    color: #fff;
    box-shadow: 0 7px 18px -8px rgba(140, 110, 240, .95),
                0 0 0 1.4px rgba(200, 180, 255, .55) inset;
  }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    color: #a79cc9;
  }
  .field .val {
    color: #c4b5fd; font-variant-numeric: tabular-nums; font-size: 13.5px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #4b3a86, #8b6ce8);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: #17102b; border: 3.5px solid #a78bfa;
    box-shadow: 0 0 12px rgba(167, 139, 250, .7);
    transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #17102b; border: 3.5px solid #a78bfa;
    box-shadow: 0 0 12px rgba(167, 139, 250, .7);
  }
  input[type=range]::-moz-range-track {
    height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #4b3a86, #8b6ce8);
  }

  .btns { display: flex; gap: 10px; }
  button.main {
    flex: 1; padding: 11px 8px; border: none; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: .4px;
    background: linear-gradient(180deg, #8b6ce8, #6d4fd0);
    color: #fff;
    box-shadow: 0 7px 18px -8px rgba(140, 110, 240, .95);
    transition: transform .12s, filter .12s;
  }
  button.main:hover { filter: brightness(1.08); }
  button.main:active { transform: translateY(2px) scale(.98); }
  button.main.ghost {
    background: rgba(38, 28, 72, .95);
    color: #c4b5fd;
    box-shadow: 0 5px 14px -8px rgba(0, 0, 0, .9),
                0 0 0 1.5px rgba(167, 139, 250, .35) inset;
  }
  button.main.active {
    background: linear-gradient(180deg, #46d4b0, #22a888);
    color: #04201b;
    box-shadow: 0 7px 20px -8px rgba(70, 220, 180, .95);
  }

  .hint {
    margin: 0; font-size: 12.5px; line-height: 1.7; color: #7d75a3;
    text-align: center;
  }
  .hint kbd {
    background: rgba(48, 36, 88, .9); border-radius: 5px; padding: 1px 6px;
    font-family: inherit; font-size: 11.5px; color: #c4b5fd;
    box-shadow: 0 0 0 1px rgba(167, 139, 250, .3) inset;
  }
  @media (max-width: 740px) {
    .wrap { padding: 14px; gap: 16px; }
    .panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="stage-label" id="stageLabel">🦋 蝴蝶</div>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
  </div>

  <div class="panel">
    <h1><span class="emoji">🌀</span> 李萨如曲线动物园</h1>

    <div class="formula">
      x = <b>A</b>·sin(<b>a</b>θ)<br>
      y = <b>B</b>·sin(<b>b</b>θ + <b>δ</b>)
    </div>

    <div class="presets" id="presets"></div>

    <div class="field">
      <div class="row"><span>频率 a（横向）</span><span class="val" id="aVal">3</span></div>
      <input type="range" id="aRange" min="1" max="9" step="1" value="3">
    </div>

    <div class="field">
      <div class="row"><span>频率 b（纵向）</span><span class="val" id="bVal">4</span></div>
      <input type="range" id="bRange" min="1" max="9" step="1" value="4">
    </div>

    <div class="field">
      <div class="row"><span>相位 δ</span><span class="val" id="dVal">90°</span></div>
      <input type="range" id="dRange" min="0" max="360" step="1" value="90">
    </div>

    <div class="btns">
      <button class="main" id="btnAuto">自动巡游</button>
      <button class="main ghost" id="btnReset">重置</button>
    </div>

    <p class="hint">
      拖动滑杆创造新动物 · <kbd>点击画面</kbd> 让它叫一声<br>
      试试不同的 <b>a : b</b> 频率比，观察曲线的自交与对称
    </p>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     基础
  ============================================================ */
  const SCENE_W = 760, SCENE_H = 520;
  const cx0 = SCENE_W / 2, cy0 = SCENE_H / 2 - 4;
  const SCX = 228, SCY = 186;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resizeCanvas() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.max(1, Math.round(rect.width  * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
  }
  window.addEventListener('resize', resizeCanvas);

  /* ============================================================
     音频
  ============================================================ */
  let actx = null, muted = false;

  function ensureAudio() {
    if (muted) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, dur, type, vol, delay, freqEnd) {
    const ac = ensureAudio(); if (!ac) return;
    type = type || 'sine'; vol = vol || 0.06; delay = delay || 0;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }

  /** 动物叫声：由 a、b 决定的琶音 */
  function playCall(a, b) {
    const base = 190 * Math.pow(2, (Math.round(a) - 1) / 12);
    const ratios = [1, 1 + Math.round(b) * 0.06, 1.5, 2, 2.5];
    ratios.forEach(function (r, i) {
      tone(base * r, 0.42 - i * 0.05,
           i % 2 ? 'triangle' : 'sine',
           0.055 - i * 0.006, i * 0.065);
    });
  }

  /** 切换动物：清脆上行 */
  function playSwitch(a, b) {
    const base = 320 * Math.pow(2, (Math.round(b) - 1) / 12);
    tone(base, 0.16, 'sine', 0.05, 0);
    tone(base * 1.26, 0.18, 'sine', 0.045, 0.07);
    tone(base * 1.5, 0.22, 'sine', 0.038, 0.14);
  }

  let lastBlip = 0;
  function sndBlip(freq) {
    const now = performance.now();
    if (now - lastBlip < 68) return;
    lastBlip = now;
    tone(freq, 0.055, 'sine', 0.038);
  }

  /* ============================================================
     预设动物
  ============================================================ */
  const PRESETS = [
    { name: '蝴蝶', emoji: '🦋', a: 3, b: 4, delta: 90,  hue: 305 },
    { name: '花朵', emoji: '🌸', a: 5, b: 6, delta: 90,  hue: 335 },
    { name: '星星', emoji: '⭐', a: 5, b: 4, delta: 90,  hue: 48  },
    { name: '小鱼', emoji: '🐟', a: 2, b: 3, delta: 90,  hue: 192 },
    { name: '小鸟', emoji: '🐦', a: 1, b: 3, delta: 0,   hue: 210 },
    { name: '兔子', emoji: '🐰', a: 3, b: 2, delta: 90,  hue: 150 },
    { name: '乌龟', emoji: '🐢', a: 4, b: 5, delta: 45,  hue: 110 },
    { name: '漩涡', emoji: '🌀', a: 7, b: 5, delta: 90,  hue: 268 }
  ];

  /* ============================================================
     状态
  ============================================================ */
  const cur = { a: 3, b: 4, delta: Math.PI / 2, hue: 305 };
  const tgt = { a: 3, b: 4, delta: Math.PI / 2, hue: 305 };

  const state = {
    time: 0,
    pulse: 0,
    auto: false,
    autoTimer: 0,
    autoIndex: 0,
    currentName: '蝴蝶',
    hoverBtn: null
  };

  /* ============================================================
     更新
  ============================================================ */
  function update(dt) {
    state.time += dt;
    state.pulse *= Math.exp(-dt * 3.6);

    const k = 1 - Math.exp(-dt * 7.5);
    cur.a += (tgt.a - cur.a) * k;
    cur.b += (tgt.b - cur.b) * k;

    let dd = tgt.delta - cur.delta;
    while (dd > Math.PI) dd -= Math.PI * 2;
    while (dd < -Math.PI) dd += Math.PI * 2;
    cur.delta += dd * k;

    let dh = tgt.hue - cur.hue;
    if (dh > 180) dh -= 360;
    if (dh < -180) dh += 360;
    cur.hue += dh * k;

    if (state.auto) {
      state.autoTimer += dt;
      if (state.autoTimer > 3.4) {
        state.autoTimer = 0;
        state.autoIndex = (state.autoIndex + 1) % PRESETS.length;
        applyPreset(PRESETS[state.autoIndex], true);
      }
    }
  }

  /* ============================================================
     绘制
  ============================================================ */
  function render() {
    const kx = cv.width / SCENE_W;
    const ky = cv.height / SCENE_H;
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
    ctx.clearRect(0, 0, SCENE_W, SCENE_H);

    drawBackdrop();
    drawCurve();
    drawHud();
  }

  /* ---------- 背景 ---------- */
  function drawBackdrop() {
    const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
    g.addColorStop(0.00, '#140e28');
    g.addColorStop(0.45, '#0d0920');
    g.addColorStop(1.00, '#06040f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SCENE_W, SCENE_H);

    // 中央柔光
    const rg = ctx.createRadialGradient(cx0, cy0, 20, cx0, cy0, 330);
    rg.addColorStop(0, 'hsla(' + cur.hue + ', 70%, 55%, 0.11)');
    rg.addColorStop(0.55, 'hsla(' + ((cur.hue + 40) % 360) + ', 65%, 50%, 0.045)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, SCENE_W, SCENE_H);

    // 极坐标网格
    ctx.save();
    ctx.strokeStyle = 'rgba(140, 120, 220, 0.075)';
    ctx.lineWidth = 1;
    for (let r = 1; r <= 3; r++) {
      ctx.beginPath();
      ctx.arc(cx0, cy0, r * 78, 0, Math.PI * 2);
      ctx.stroke();
    }
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(cx0, cy0);
      ctx.lineTo(cx0 + Math.cos(a) * 238, cy0 + Math.sin(a) * 238);
      ctx.stroke();
    }
    // 十字轴
    ctx.strokeStyle = 'rgba(160, 140, 240, 0.12)';
    ctx.beginPath();
    ctx.moveTo(cx0 - 250, cy0); ctx.lineTo(cx0 + 250, cy0);
    ctx.moveTo(cx0, cy0 - 210); ctx.lineTo(cx0, cy0 + 210);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 李萨如曲线 ---------- */
  function drawCurve() {
    // 吸附到 0.5 的倍数，保证曲线闭合
    const A = Math.round(cur.a * 2) / 2;
    const B = Math.round(cur.b * 2) / 2;

    const intA = Math.abs(A - Math.round(A)) < 1e-6;
    const intB = Math.abs(B - Math.round(B)) < 1e-6;
    const K = (intA && intB) ? 1 : 2;
    const T = 2 * Math.PI * K;

    const N = 1200;
    const delta = cur.delta + Math.sin(state.time * 0.5) * 0.055;
    const hueBase = cur.hue;
    const pulse = state.pulse;

    // 计算屏幕坐标
    const xs = new Float32Array(N + 1);
    const ys = new Float32Array(N + 1);
    for (let i = 0; i <= N; i++) {
      const th = (i / N) * T;
      xs[i] = cx0 + SCX * Math.sin(A * th);
      ys[i] = cy0 - SCY * Math.sin(B * th + delta);
    }

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // 外层辉光
    ctx.beginPath();
    ctx.moveTo(xs[0], ys[0]);
    for (let i = 1; i <= N; i++) ctx.lineTo(xs[i], ys[i]);
    ctx.strokeStyle = 'hsla(' + hueBase + ', 90%, 60%, ' + (0.055 + pulse * 0.07) + ')';
    ctx.lineWidth = 22 + pulse * 16;
    ctx.stroke();

    // 中层辉光
    ctx.beginPath();
    ctx.moveTo(xs[0], ys[0]);
    for (let i = 1; i <= N; i++) ctx.lineTo(xs[i], ys[i]);
    ctx.strokeStyle = 'hsla(' + ((hueBase + 30) % 360) + ', 92%, 66%, ' + (0.10 + pulse * 0.09) + ')';
    ctx.lineWidth = 9 + pulse * 8;
    ctx.stroke();

    // 彩色主线（分块着色）
    const BLOCKS = 56;
    const per = Math.ceil(N / BLOCKS);
    const lw = 2.3 + pulse * 2.2;

    for (let blk = 0; blk < BLOCKS; blk++) {
      const i0 = blk * per;
      const i1 = Math.min(N, (blk + 1) * per);
      if (i0 >= i1) break;

      const t = i0 / N;
      const hue = (hueBase + t * 300) % 360;

      ctx.beginPath();
      ctx.moveTo(xs[i0], ys[i0]);
      for (let i = i0 + 1; i <= i1; i++) ctx.lineTo(xs[i], ys[i]);
      ctx.strokeStyle = 'hsl(' + hue + ', 88%, ' + (60 + Math.sin(t * Math.PI) * 8) + '%)';
      ctx.lineWidth = lw;
      ctx.stroke();
    }

    // 内层高光（细白线）
    ctx.beginPath();
    ctx.moveTo(xs[0], ys[0]);
    for (let i = 1; i <= N; i++) ctx.lineTo(xs[i], ys[i]);
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.10 + pulse * 0.12) + ')';
    ctx.lineWidth = Math.max(0.7, lw * 0.32);
    ctx.stroke();

    ctx.restore();

    /* ---------- 沿线奔跑的光点 ---------- */
    const travel = (state.time * 0.16) % 1;
    for (let d = 0; d < 2; d++) {
      const tt = (travel + d * 0.5) % 1;
      const idx = Math.floor(tt * N);
      const px = xs[idx], py = ys[idx];
      const hue = (hueBase + tt * 300) % 360;

      const gr = ctx.createRadialGradient(px, py, 0, px, py, 15);
      gr.addColorStop(0, 'hsla(' + hue + ', 100%, 82%, 0.95)');
      gr.addColorStop(0.35, 'hsla(' + hue + ', 95%, 68%, 0.45)');
      gr.addColorStop(1, 'hsla(' + hue + ', 90%, 60%, 0)');
      ctx.beginPath();
      ctx.arc(px, py, 15, 0, Math.PI * 2);
      ctx.fillStyle = gr;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(px, py, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    /* ---------- 中心标记 ---------- */
    ctx.beginPath();
    ctx.arc(cx0, cy0, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200, 180, 255, 0.42)';
    ctx.fill();
  }

  /* ---------- HUD ---------- */
  function drawHud() {
    ctx.font = '600 12.5px -apple-system, "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(167, 139, 250, 0.42)';
    const A = Math.round(cur.a);
    const B = Math.round(cur.b);
    const d = Math.round(cur.delta * 180 / Math.PI);
    ctx.fillText('a : b = ' + A + ' : ' + B + '    δ = ' + d + '°', 22, SCENE_H - 20);
  }

  /* ============================================================
     主循环
  ============================================================ */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     UI
  ============================================================ */
  const presetsEl = document.getElementById('presets');
  const aRange = document.getElementById('aRange');
  const bRange = document.getElementById('bRange');
  const dRange = document.getElementById('dRange');
  const aVal = document.getElementById('aVal');
  const bVal = document.getElementById('bVal');
  const dVal = document.getElementById('dVal');
  const stageLabel = document.getElementById('stageLabel');
  const btnAuto = document.getElementById('btnAuto');

  let presetBtns = [];

  PRESETS.forEach(function (p, i) {
    const btn = document.createElement('button');
    btn.className = 'preset';
    btn.innerHTML = '<span class="pe">' + p.emoji + '</span>' +
                    '<span class="pn">' + p.name + '</span>';
    btn.addEventListener('click', function () {
      ensureAudio();
      applyPreset(p, false);
      playSwitch(p.a, p.b);
      state.pulse = 1;
    });
    btn.addEventListener('pointerenter', function () {
      if (!muted) tone(1200, 0.05, 'sine', 0.02);
    });
    presetsEl.appendChild(btn);
    presetBtns.push(btn);
  });

  function markPreset(name) {
    presetBtns.forEach(function (b, i) {
      b.classList.toggle('on', PRESETS[i].name === name);
    });
  }

  function syncSliders() {
    aRange.value = Math.round(cur.a);
    bRange.value = Math.round(cur.b);
    dRange.value = Math.round(((cur.delta % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) * 180 / Math.PI);
    updateLabels();
  }

  function updateLabels() {
    aVal.textContent = Math.round(tgt.a);
    bVal.textContent = Math.round(tgt.b);
    let deg = Math.round(tgt.delta * 180 / Math.PI) % 360;
    if (deg < 0) deg += 360;
    dVal.textContent = deg + '°';
  }

  function applyPreset(p, isAuto) {
    tgt.a = p.a;
    tgt.b = p.b;
    tgt.delta = p.delta * Math.PI / 180;
    tgt.hue = p.hue;

    state.currentName = p.name;
    stageLabel.textContent = p.emoji + ' ' + p.name;
    stageLabel.style.color = 'hsl(' + p.hue + ', 90%, 78%)';
    stageLabel.style.boxShadow =
      '0 0 0 1px hsla(' + p.hue + ', 90%, 70%, .45) inset, 0 0 22px -6px hsla(' + p.hue + ', 90%, 60%, .7)';

    aRange.value = p.a;
    bRange.value = p.b;
    dRange.value = p.delta;
    updateLabels();
    markPreset(p.name);

    if (!isAuto) { /* 手动点击时已经播放过音效 */ }
  }

  aRange.addEventListener('input', function () {
    tgt.a = +this.value;
    updateLabels();
    markPreset(null);
    stageLabel.textContent = '✏️ 自定义';
    stageLabel.style.color = '#c4b5fd';
    stageLabel.style.boxShadow = '0 0 0 1px rgba(167,139,250,.3) inset';
    sndBlip(280 + tgt.a * 42);
  });

  bRange.addEventListener('input', function () {
    tgt.b = +this.value;
    updateLabels();
    markPreset(null);
    stageLabel.textContent = '✏️ 自定义';
    stageLabel.style.color = '#c4b5fd';
    stageLabel.style.boxShadow = '0 0 0 1px rgba(167,139,250,.3) inset';
    sndBlip(320 + tgt.b * 46);
  });

  dRange.addEventListener('input', function () {
    tgt.delta = +this.value * Math.PI / 180;
    updateLabels();
    markPreset(null);
    stageLabel.textContent = '✏️ 自定义';
    stageLabel.style.color = '#c4b5fd';
    stageLabel.style.boxShadow = '0 0 0 1px rgba(167,139,250,.3) inset';
    sndBlip(360 + (+this.value) * 1.4);
  });

  btnAuto.addEventListener('click', function () {
    ensureAudio();
    state.auto = !state.auto;
    state.autoTimer = 0;
    btnAuto.classList.toggle('active', state.auto);
    btnAuto.textContent = state.auto ? '巡游中…' : '自动巡游';
    if (state.auto) {
      tone(523.25, 0.12, 'sine', 0.05);
      tone(659.25, 0.14, 'sine', 0.04, 0.08);
    } else {
      tone(392, 0.14, 'sine', 0.05);
      tone(294, 0.16, 'sine', 0.04, 0.08);
    }
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    ensureAudio();
    state.auto = false;
    btnAuto.classList.remove('active');
    btnAuto.textContent = '自动巡游';

    applyPreset(PRESETS[0], false);
    playSwitch(PRESETS[0].a, PRESETS[0].b);
    state.pulse = 1;
  });

  /* ---------- 点击画布：动物叫一声 ---------- */
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    state.pulse = 1;
    playCall(cur.a, cur.b);
  });

  /* ---------- 音效开关 ---------- */
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function () {
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    if (!muted) { ensureAudio(); tone(660, 0.1, 'sine', 0.05); }
  });

  /* ============================================================
     启动
  ============================================================ */
  resizeCanvas();
  applyPreset(PRESETS[0], false);
  syncSliders();
  requestAnimationFrame(loop);

  window.addEventListener('pointerdown', function once() {
    ensureAudio();
    window.removeEventListener('pointerdown', once);
  });

})();
</script>
</body>
</html>
