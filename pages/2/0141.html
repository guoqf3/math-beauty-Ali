<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>浮游多面体</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a1a;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="polyCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('polyCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                polyCount: 28,              // 多边形数量
                verticesPerPoly: 4,         // 每个多边形的顶点数（四边形）
                minSize: 12,                // 多边形最小外接圆半径
                maxSize: 35,                // 多边形最大外接圆半径
                attractRadius: 260,         // 鼠标吸引半径
                attractStrength: 0.015,     // 吸引强度
                returnForce: 0.012,         // 回弹力量
                damping: 0.92,              // 速度阻尼
                clickRepelRadius: 200,      // 点击排斥半径
                clickRepelStrength: 18,     // 排斥强度
                randomForce: 0.08,          // 随机扰动力
                backgroundFade: 0.16,       // 拖尾强度
                hueBase: 210,               // 基础色相
                hueRange: 140,              // 色相变化范围
                saturation: 80,
                lightness: 65,
                glowAlpha: 0.35,            // 填充透明度
                strokeAlpha: 0.5,           // 描边透明度
                lineWidth: 1.5,             // 描边宽度
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let polys = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // ---------- 多边形类 ----------
            class FloatingPoly {
                constructor(w, h) {
                    // 中心原始位置（家的位置）
                    this.homeX = Math.random() * w;
                    this.homeY = Math.random() * h;
                    // 当前中心位置
                    this.x = this.homeX;
                    this.y = this.homeY;
                    this.vx = 0;
                    this.vy = 0;
                    // 尺寸
                    const size = Math.random() * (CONFIG.maxSize - CONFIG.minSize) + CONFIG.minSize;
                    this.size = size;
                    // 颜色
                    this.hue = (CONFIG.hueBase + Math.random() * CONFIG.hueRange) % 360;
                    this.saturation = CONFIG.saturation + Math.random() * 15;
                    this.lightness = CONFIG.lightness + Math.random() * 10;
                    // 旋转角度和旋转速度
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                    // 顶点偏移（用于形变）
                    this.vertexOffsets = [];
                    for (let i = 0; i < CONFIG.verticesPerPoly; i++) {
                        this.vertexOffsets.push({
                            angleOffset: Math.random() * Math.PI * 2,
                            radialOffset: Math.random() * 0.4, // 相对尺寸的偏移比例
                        });
                    }
                    // 脉冲相位
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 0.8 + 0.4;
                }

                // 更新位置和形变
                update(dt, now, time) {
                    // 鼠标吸引力（向鼠标靠近）
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = smoothMouseX - this.x;
                        const dy = smoothMouseY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.attractRadius && dist > 0.1) {
                            const force = (CONFIG.attractRadius - dist) / CONFIG.attractRadius * CONFIG.attractStrength;
                            this.vx += (dx / dist) * force * dt;
                            this.vy += (dy / dist) * force * dt;
                        }
                    }

                    // 回弹力（向家的位置移动）
                    const returnDx = this.homeX - this.x;
                    const returnDy = this.homeY - this.y;
                    this.vx += returnDx * CONFIG.returnForce * dt;
                    this.vy += returnDy * CONFIG.returnForce * dt;

                    // 随机扰动
                    this.vx += (Math.random() - 0.5) * CONFIG.randomForce * dt;
                    this.vy += (Math.random() - 0.5) * CONFIG.randomForce * dt;

                    // 阻尼
                    this.vx *= CONFIG.damping;
                    this.vy *= CONFIG.damping;

                    // 更新位置
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 旋转
                    this.rotation += this.rotationSpeed * dt;

                    // 边界软限制
                    const margin = 80;
                    if (this.x < -margin) this.x = width + margin;
                    else if (this.x > width + margin) this.x = -margin;
                    if (this.y < -margin) this.y = height + margin;
                    else if (this.y > height + margin) this.y = -margin;
                }

                // 计算顶点位置（考虑旋转和形变）
                getVertices() {
                    const vertices = [];
                    const angleStep = (Math.PI * 2) / CONFIG.verticesPerPoly;
                    for (let i = 0; i < CONFIG.verticesPerPoly; i++) {
                        const offset = this.vertexOffsets[i];
                        // 基础角度
                        const baseAngle = this.rotation + i * angleStep + offset.angleOffset;
                        // 径向距离：基础尺寸 + 形变偏移（使用正弦波让顶点呼吸）
                        const breathing = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 0.25;
                        const radial = this.size * (1 + offset.radialOffset + breathing);
                        const vx = this.x + Math.cos(baseAngle) * radial;
                        const vy = this.y + Math.sin(baseAngle) * radial;
                        vertices.push({ x: vx, y: vy });
                    }
                    return vertices;
                }

                // 绘制多边形
                draw() {
                    const vertices = this.getVertices();
                    if (vertices.length < 3) return;

                    // 创建渐变填充（从中心到边缘）
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 1.5);
                    gradient.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness + 10}%, ${CONFIG.glowAlpha + 0.15})`);
                    gradient.addColorStop(0.6, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${CONFIG.glowAlpha})`);
                    gradient.addColorStop(1, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness - 10}%, ${CONFIG.glowAlpha * 0.6})`);

                    ctx.beginPath();
                    ctx.moveTo(vertices[0].x, vertices[0].y);
                    for (let i = 1; i < vertices.length; i++) {
                        ctx.lineTo(vertices[i].x, vertices[i].y);
                    }
                    ctx.closePath();
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // 描边
                    ctx.strokeStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness + 15}%, ${CONFIG.strokeAlpha})`;
                    ctx.lineWidth = CONFIG.lineWidth;
                    ctx.stroke();

                    // 顶点小光点
                    for (const v of vertices) {
                        ctx.fillStyle = `hsla(${this.hue}, 100%, 90%, 0.8)`;
                        ctx.beginPath();
                        ctx.arc(v.x, v.y, 1.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ---------- 初始化多边形 ----------
            function initPolys() {
                polys = [];
                for (let i = 0; i < CONFIG.polyCount; i++) {
                    polys.push(new FloatingPoly(width, height));
                }
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, width, height);
                initPolys();
                drawScene(performance.now());
            }

            // ---------- 绘制场景 ----------
            function drawScene(now) {
                // 半透明背景拖尾
                ctx.fillStyle = 'rgba(10, 10, 26, ' + CONFIG.backgroundFade + ')';
                ctx.fillRect(0, 0, width, height);

                // 平滑鼠标位置
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.2;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.2;
                }

                // 绘制鼠标光晕
                if (mouseActive && smoothMouseX > -1000) {
                    const glowRadius = 120;
                    const grad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY,
                        glowRadius);
                    grad.addColorStop(0, 'rgba(120, 160, 255, 0.08)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制所有多边形
                for (const poly of polys) {
                    poly.draw();
                }
            }

            // ---------- 更新多边形 ----------
            function updatePolys(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                for (const poly of polys) {
                    poly.update(dt, now, time);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updatePolys(now);
                drawScene(now);

                animationId = requestAnimationFrame(animate);
            }

            // ---------- 交互事件 ----------
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function handleClick(clientX, clientY) {
                // 对每个多边形施加向外排斥力
                for (const poly of polys) {
                    const dx = poly.x - clientX;
                    const dy = poly.y - clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.clickRepelRadius && dist > 0.01) {
                        const force = (1 - dist / CONFIG.clickRepelRadius) * CONFIG.clickRepelStrength;
                        poly.vx += (dx / dist) * force;
                        poly.vy += (dy / dist) * force;
                    }
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__floatingPolys = {
                config: CONFIG,
                polys: polys,
            };
        })();
    </script>
</body>
</html>
