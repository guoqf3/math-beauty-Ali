<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>彩虹光环</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="haloCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('haloCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                ringCount: 5,                // 光环数量
                particlesPerRing: 22,        // 每个环的粒子数
                totalParticles: 110,         // 总粒子数
                minRadius: 30,               // 最小环半径
                maxRadius: 0.48,             // 最大环半径（占屏幕比例）
                orbitSpeed: 0.0008,          // 绕中心旋转速度
                attractRadius: 240,          // 鼠标吸引半径
                attractStrength: 0.025,      // 吸引强度
                returnForce: 0.02,           // 回弹力（向轨道）
                damping: 0.92,               // 速度阻尼
                clickRepelRadius: 280,       // 点击散开半径
                clickRepelStrength: 24,      // 散开强度
                backgroundFade: 0.16,        // 拖尾强度
                particleSize: 2.5,           // 粒子基础大小
                hueRange: 360,               // 全色相
                saturation: 90,
                lightness: 65,
                glowFactor: 4,               // 光晕放大倍数
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let particles = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let centerX = 0;
            let centerY = 0;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // ---------- 粒子类 ----------
            class HaloParticle {
                constructor(ringIndex, particleIndex) {
                    // 环属性
                    this.ringIndex = ringIndex;
                    this.orbitRadius = 0; // 将在初始化时根据屏幕计算
                    this.orbitAngle = (particleIndex / CONFIG.particlesPerRing) * Math.PI * 2;
                    // 轨道角速度（不同环略有差异）
                    this.orbitSpeed = CONFIG.orbitSpeed * (0.8 + ringIndex * 0.2);
                    // 颜色
                    this.hue = (360 / CONFIG.ringCount) * ringIndex;
                    this.saturation = CONFIG.saturation;
                    this.lightness = CONFIG.lightness;
                    // 当前位置
                    this.x = 0;
                    this.y = 0;
                    this.vx = 0;
                    this.vy = 0;
                    // 轨道参考位置（中心）
                    this.centerX = 0;
                    this.centerY = 0;
                    // 脉冲
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 1.2 + 0.4;
                }

                // 更新轨道参考位置
                updateOrbit() {
                    this.centerX = centerX;
                    this.centerY = centerY;
                    this.orbitRadius = CONFIG.minRadius + (this.ringIndex / (CONFIG.ringCount - 1)) * (CONFIG
                        .maxRadius * Math.min(width, height) - CONFIG.minRadius);
                }

                // 更新粒子位置
                update(dt, now, time) {
                    // 更新轨道角度
                    this.orbitAngle += this.orbitSpeed * dt * 4;

                    // 目标位置（轨道上的点）
                    const targetX = this.centerX + Math.cos(this.orbitAngle) * this.orbitRadius;
                    const targetY = this.centerY + Math.sin(this.orbitAngle) * this.orbitRadius;

                    // 鼠标吸引
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = smoothMouseX - this.x;
                        const dy = smoothMouseY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.attractRadius && dist > 0.1) {
                            const force = (CONFIG.attractRadius - dist) / CONFIG.attractRadius * CONFIG
                                .attractStrength;
                            this.vx += (dx / dist) * force * dt;
                            this.vy += (dy / dist) * force * dt;
                        }
                    }

                    // 回弹力（向轨道目标位置）
                    const returnDx = targetX - this.x;
                    const returnDy = targetY - this.y;
                    this.vx += returnDx * CONFIG.returnForce * dt;
                    this.vy += returnDy * CONFIG.returnForce * dt;

                    // 阻尼
                    this.vx *= CONFIG.damping;
                    this.vy *= CONFIG.damping;

                    // 更新位置
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界软限制（防止完全跑飞）
                    const margin = 200;
                    if (this.x < -margin) this.x = width + margin;
                    else if (this.x > width + margin) this.x = -margin;
                    if (this.y < -margin) this.y = height + margin;
                    else if (this.y > height + margin) this.y = -margin;
                }

                // 绘制粒子
                draw() {
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 0.3;
                    const size = CONFIG.particleSize + pulse;
                    const glowRadius = size * CONFIG.glowFactor;
                    const alpha = 0.6 + pulse * 0.2;

                    // 光晕
                    const glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowRadius);
                    glowGrad.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${alpha * 0.5})`);
                    glowGrad.addColorStop(0.5, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${alpha * 0.25})`);
                    glowGrad.addColorStop(1, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, 0)`);
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 90%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---------- 初始化粒子 ----------
            function initParticles() {
                particles = [];
                centerX = width / 2;
                centerY = height / 2;
                let particleIndex = 0;
                for (let ring = 0; ring < CONFIG.ringCount; ring++) {
                    for (let i = 0; i < CONFIG.particlesPerRing; i++) {
                        const p = new HaloParticle(ring, i);
                        p.updateOrbit();
                        // 初始位置放在轨道上
                        p.x = centerX + Math.cos(p.orbitAngle) * p.orbitRadius;
                        p.y = centerY + Math.sin(p.orbitAngle) * p.orbitRadius;
                        particles.push(p);
                        particleIndex++;
                    }
                }
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, 0, width, height);
                initParticles();
                drawScene(performance.now());
            }

            // ---------- 绘制场景 ----------
            function drawScene(now) {
                // 半透明背景拖尾
                ctx.fillStyle = 'rgba(5, 5, 16, ' + CONFIG.backgroundFade + ')';
                ctx.fillRect(0, 0, width, height);

                // 开启混合模式
                ctx.globalCompositeOperation = 'lighter';

                // 平滑鼠标位置
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.18;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.18;
                }

                // 绘制鼠标光晕
                if (mouseActive && smoothMouseX > -1000) {
                    const glowRadius = 120;
                    const grad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY,
                        glowRadius);
                    grad.addColorStop(0, 'rgba(180, 180, 255, 0.1)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制所有粒子
                for (const particle of particles) {
                    particle.draw();
                }

                // 恢复混合模式
                ctx.globalCompositeOperation = 'source-over';
            }

            // ---------- 更新粒子 ----------
            function updateParticles(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                // 更新每个粒子的轨道参考（中心可能改变）
                for (const particle of particles) {
                    particle.updateOrbit();
                    particle.update(dt, now, time);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updateParticles(now);
                drawScene(now);

                animationId = requestAnimationFrame(animate);
            }

            // ---------- 交互事件 ----------
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function handleClick(clientX, clientY) {
                // 对每个粒子施加排斥力
                for (const particle of particles) {
                    const dx = particle.x - clientX;
                    const dy = particle.y - clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.clickRepelRadius && dist > 0.01) {
                        const force = (1 - dist / CONFIG.clickRepelRadius) * CONFIG.clickRepelStrength;
                        particle.vx += (dx / dist) * force;
                        particle.vy += (dy / dist) * force;
                    }
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__rainbowHalo = {
                config: CONFIG,
                particles: particles,
            };
        })();
    </script>
</body>
</html>
