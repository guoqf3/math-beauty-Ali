<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>日冕环 · 呼吸光弧</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a18;
            font-family: system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #hint {
            position: fixed;
            bottom: 20px;
            left: 24px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease;
            font-weight: 300;
        }
        #fps-badge {
            position: fixed;
            top: 16px;
            right: 18px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="fps-badge"></div>
    <div id="hint">移动旋转 · 点击呼吸</div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─── 安全与性能检查 ───
            if (!window.PIXI) {
                console.warn('PixiJS 加载失败');
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">需要WebGL支持</div>';
                return;
            }

            // ─── 常量定义 ───
            const FOCAL_LENGTH = 1300;
            const BASE_PARTICLE_SCALE = 0.09;
            const AUTO_ROTATE_SPEED = 0.25;
            const VIEW_SENSITIVITY_X = 0.6;
            const VIEW_SENSITIVITY_Y = 0.45;
            const BREATHING_RATE = 0.6; // 呼吸频率
            const BREATHING_AMPLITUDE = 0.08; // 呼吸半径变化幅度
            const SHOCK_AMPLITUDE = 60; // 点击冲击波额外半径
            const SHOCK_DECAY = 2.8; // 冲击波衰减速度

            // ─── 光弧配置 ───
            // 每个弧：{ radius, tiltX, tiltY, startAngle, endAngle, speed, color, particles }
            const ARCS_CONFIG = [
                { radius: 280, tiltX: 0.2, tiltY: 0.0, start: 0.3, end: 2.6, speed: 0.9, color: 0xFFD447, particles: 130 },
                { radius: 255, tiltX: -0.45, tiltY: 0.8, start: 1.8, end: 4.6, speed: -0.7, color: 0xFF6B9D, particles: 120 },
                { radius: 240, tiltX: 0.75, tiltY: -0.3, start: 3.4, end: 6.0, speed: 1.1, color: 0xB06BFF, particles: 125 },
                { radius: 220, tiltX: -0.1, tiltY: 1.2, start: 0.9, end: 3.8, speed: -0.85, color: 0x4D9FFF, particles: 115 },
                { radius: 200, tiltX: 1.0, tiltY: 0.6, start: 2.2, end: 5.2, speed: 0.75, color: 0x4DFFD9, particles: 110 },
                { radius: 185, tiltX: -0.8, tiltY: -0.9, start: 4.0, end: 6.4, speed: -1.0, color: 0xFF9D4D, particles: 105 },
                { radius: 170, tiltX: 0.5, tiltY: -1.1, start: 1.2, end: 4.4, speed: 1.2, color: 0x6BFF6B, particles: 100 },
                { radius: 160, tiltX: -0.3, tiltY: 1.5, start: 0.0, end: 3.0, speed: -0.65, color: 0xD46BFF, particles: 95 },
            ];
            const TOTAL_PARTICLES = ARCS_CONFIG.reduce((sum, arc) => sum + arc.particles, 0);

            // ─── 颜色主题切换 ───
            const COLOR_THEMES = [
                [0xFFD447, 0xFF6B9D, 0xB06BFF, 0x4D9FFF, 0x4DFFD9, 0xFF9D4D, 0x6BFF6B, 0xD46BFF],
                [0xFF4D6B, 0xFFB0C8, 0x4DFFFF, 0x6B6BFF, 0x8DFF4D, 0xFFD447, 0xFF9D4D, 0x4D9FFF],
                [0x4DFFD9, 0x4D9FFF, 0xFF6B9D, 0xB06BFF, 0xFFD447, 0x6BFF6B, 0xD46BFF, 0xFF9D4D],
                [0xFFD447, 0x4DFFD9, 0xB06BFF, 0xFF6B9D, 0x4D9FFF, 0x6BFF6B, 0xFF9D4D, 0xD46BFF],
                [0x6BFF6B, 0xFFD447, 0x4DFFD9, 0xFF6B9D, 0xB06BFF, 0x4D9FFF, 0xD46BFF, 0xFF9D4D],
            ];
            let currentThemeIndex = 0;

            // ─── DOM 元素 ───
            const fpsBadge = document.getElementById('fps-badge');
            const hintEl = document.getElementById('hint');

            // ─── PixiJS 初始化 ───
            let app;
            try {
                app = new PIXI.Application({
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0x0a0a18,
                    antialias: false,
                    autoDensity: true,
                    resolution: Math.min(window.devicePixelRatio || 1, 2),
                    powerPreference: 'high-performance',
                    forceCanvas: !isWebGLAvailable(),
                });
            } catch (err) {
                console.error('PixiJS 初始化失败:', err);
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">初始化失败</div>';
                return;
            }

            function isWebGLAvailable() {
                try {
                    const canvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext &&
                        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
                } catch (e) { return false; }
            }

            document.body.appendChild(app.view);

            // ─── 创建发光纹理 ───
            function createGlowTexture(size) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const half = size / 2;
                const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
                gradient.addColorStop(0.0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.1, 'rgba(255,255,255,0.95)');
                gradient.addColorStop(0.35, 'rgba(255,255,255,0.6)');
                gradient.addColorStop(0.65, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                const tex = PIXI.Texture.from(c);
                tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
                return tex;
            }

            const glowTex64 = createGlowTexture(64);
            const glowTex128 = createGlowTexture(128);

            // ─── 粒子容器 ───
            const particleContainer = new PIXI.ParticleContainer(TOTAL_PARTICLES, {
                position: true,
                scale: true,
                tint: true,
                alpha: true,
            }, TOTAL_PARTICLES, true);
            particleContainer.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(particleContainer);

            // ─── 中心发光体 ───
            const centerGlow = new PIXI.Sprite(glowTex128);
            centerGlow.anchor.set(0.5);
            centerGlow.tint = 0xFFFFFF;
            centerGlow.alpha = 0.35;
            centerGlow.scale.set(1.8);
            centerGlow.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerGlow);

            const centerCore = new PIXI.Sprite(glowTex64);
            centerCore.anchor.set(0.5);
            centerCore.tint = 0xFFFFFF;
            centerCore.alpha = 0.7;
            centerCore.scale.set(0.38);
            centerCore.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerCore);

            // ─── 数据结构 ───
            const sprites = [];
            const particlesData = [];

            let mouseX = 0;
            let mouseY = 0;
            let smoothMouseX = 0;
            let smoothMouseY = 0;
            let autoRotateY = 0;
            let shockWave = 0;
            let time = 0;
            let frameCount = 0;
            let fpsLastTime = 0;

            // ─── 音频引擎（Web Audio API）───
            let audioCtx = null;
            let isAudioInitialized = false;

            function initAudio() {
                if (isAudioInitialized) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    isAudioInitialized = true;
                } catch (e) {
                    console.warn('无法初始化音频上下文:', e);
                    isAudioInitialized = false;
                }
            }

            // 播放呼吸感音效：先吸气（音调上升）再呼气（音调下降），模拟呼吸声
            function playBreathSound() {
                if (!isAudioInitialized) {
                    initAudio();
                    if (!isAudioInitialized) return;
                }
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                const duration = 0.7; // 总时长
                const volume = 0.12; // 音量

                // 主振荡器（正弦波，模拟呼吸声的基础音高）
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                // 滤波器：带通，强调中频，让声音更柔和
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(1200, now + duration * 0.4);
                filter.frequency.linearRampToValueAtTime(600, now + duration);
                filter.Q.value = 0.8;

                // 音调变化：从低到高再降低（呼吸感）
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(320, now + duration * 0.35);
                osc.frequency.linearRampToValueAtTime(150, now + duration);

                // 音量包络：快起音，缓慢衰减，类似呼吸
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                // 叠加一个细微的噪声成分，增加呼吸质感
                const noiseBuffer = createNoiseBuffer();
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = 1200;
                noiseFilter.Q.value = 0.5;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.001, now);
                noiseGain.gain.linearRampToValueAtTime(volume * 0.5, now + 0.06);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.8);

                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + duration);
                noiseSource.start(now);
                noiseSource.stop(now + duration);

                // 清理
                osc.onended = () => osc.disconnect();
                noiseSource.onended = () => {
                    noiseSource.disconnect();
                    noiseFilter.disconnect();
                    noiseGain.disconnect();
                };
            }

            function createNoiseBuffer() {
                const length = audioCtx.sampleRate * 1.0;
                const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.2;
                }
                return buffer;
            }

            // ─── 初始化光弧粒子 ───
            function initParticles() {
                for (let a = 0; a < ARCS_CONFIG.length; a++) {
                    const arc = ARCS_CONFIG[a];
                    const themeColors = COLOR_THEMES[currentThemeIndex];
                    const colorIdx = a % themeColors.length;
                    const color = themeColors[colorIdx];
                    // 存储每个弧的颜色索引（用于主题切换）
                    arc.colorIndex = colorIdx;
                    arc.baseColor = arc.color;

                    for (let i = 0; i < arc.particles; i++) {
                        const sprite = new PIXI.Sprite(glowTex64);
                        sprite.anchor.set(0.5);
                        sprite.tint = color;
                        sprite.alpha = 0.75 + Math.random() * 0.2;
                        sprite.scale.set(BASE_PARTICLE_SCALE * (0.8 + Math.random() * 0.4));

                        // 初始相位在弧范围内
                        const phase = (i / arc.particles) * (arc.end - arc.start) + arc.start;
                        const speed = arc.speed * (0.85 + Math.random() * 0.3);
                        const data = {
                            arcIndex: a,
                            phase: phase,
                            speed: speed,
                            baseAlpha: 0.7 + Math.random() * 0.25,
                        };
                        particlesData.push(data);
                        sprites.push(sprite);
                        particleContainer.addChild(sprite);
                    }
                }
                console.log('粒子初始化完成，总数:', sprites.length);
            }

            // ─── 3D旋转与投影 ───
            function rotatePoint(x, y, z, viewX, viewY) {
                // 绕Y轴
                let cosY = Math.cos(viewY);
                let sinY = Math.sin(viewY);
                let x1 = x * cosY + z * sinY;
                let z1 = -x * sinY + z * cosY;
                let y1 = y;
                // 绕X轴
                let cosX = Math.cos(viewX);
                let sinX = Math.sin(viewX);
                let y2 = y1 * cosX - z1 * sinX;
                let z2 = y1 * sinX + z1 * cosX;
                let x2 = x1;
                return { x: x2, y: y2, z: z2 };
            }

            function projectPoint(p, centerX, centerY) {
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + p.z);
                return {
                    sx: p.x * scale + centerX,
                    sy: p.y * scale + centerY,
                    scale: scale
                };
            }

            // ─── 计算弧上粒子在本地3D坐标 ───
            function getArcLocalPoint(arc, angle) {
                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                // 弧在XY平面，然后绕X轴和Y轴倾斜
                const lx = arc.radius * cosA;
                const ly = arc.radius * sinA;
                const lz = 0;

                // 绕X轴倾斜
                const cosTX = Math.cos(arc.tiltX);
                const sinTX = Math.sin(arc.tiltX);
                const y1 = ly * cosTX - lz * sinTX;
                const z1 = ly * sinTX + lz * cosTX;
                const x1 = lx;

                // 绕Y轴倾斜
                const cosTY = Math.cos(arc.tiltY);
                const sinTY = Math.sin(arc.tiltY);
                const x2 = x1 * cosTY + z1 * sinTY;
                const z2 = -x1 * sinTY + z1 * cosTY;
                const y2 = y1;

                return { x: x2, y: y2, z: z2 };
            }

            // ─── 更新粒子 ───
            function updateParticles(delta, viewX, viewY, centerX, centerY) {
                // 冲击波衰减
                if (shockWave > 0) {
                    shockWave = Math.max(0, shockWave - delta * SHOCK_DECAY);
                }

                // 呼吸效果：所有弧的半径按正弦整体变化
                const breathingScale = 1 + BREATHING_AMPLITUDE * Math.sin(time * BREATHING_RATE * Math.PI * 2);

                for (let i = 0; i < sprites.length; i++) {
                    const data = particlesData[i];
                    const sprite = sprites[i];
                    const arc = ARCS_CONFIG[data.arcIndex];

                    // 更新相位（沿弧移动）
                    data.phase += data.speed * delta * 0.6;
                    if (data.phase > arc.end) data.phase = arc.start + (data.phase - arc.end);
                    if (data.phase < arc.start) data.phase = arc.end - (arc.start - data.phase);

                    // 计算当前角度，用于获取本地点
                    const angle = data.phase;
                    let lp = getArcLocalPoint(arc, angle);

                    // 应用呼吸和冲击波的半径变化
                    const radiusModifier = breathingScale + (shockWave > 0 ? shockWave * SHOCK_AMPLITUDE / arc.radius : 0);
                    lp.x *= radiusModifier;
                    lp.y *= radiusModifier;
                    lp.z *= radiusModifier;

                    // 旋转视角
                    const rp = rotatePoint(lp.x, lp.y, lp.z, viewX, viewY);
                    const proj = projectPoint(rp, centerX, centerY);

                    // 更新精灵
                    const depthFactor = proj.scale;
                    const pulseGlow = 1 + 0.06 * Math.sin(time * 2.5 + i * 0.12);
                    const alphaMod = 0.85 + 0.15 * Math.sin(time * 1.7 + i * 0.08);

                    sprite.position.set(proj.sx, proj.sy);
                    sprite.scale.set(BASE_PARTICLE_SCALE * depthFactor * pulseGlow);
                    sprite.alpha = Math.max(0.05, Math.min(1, data.baseAlpha * depthFactor * alphaMod));
                }
            }

            // ─── 更新中心光晕 ───
            function updateCenterGlow(centerX, centerY) {
                const breathing = Math.sin(time * BREATHING_RATE * Math.PI * 2);
                const pulse = 0.3 + 0.1 * breathing + 0.05 * Math.sin(time * 3.5);
                const shockPulse = shockWave > 0 ? shockWave * 0.5 : 0;
                centerGlow.position.set(centerX, centerY);
                centerGlow.alpha = Math.max(0.15, Math.min(0.6, pulse + shockPulse));
                centerGlow.scale.set(1.7 + 0.25 * breathing + shockWave * 1.0);
                centerCore.position.set(centerX, centerY);
                centerCore.scale.set(0.35 + 0.05 * breathing + shockWave * 0.3);
                centerCore.alpha = 0.65 + 0.2 * breathing + shockWave * 0.3;
            }

            // ─── 切换颜色主题 ───
            function switchTheme() {
                currentThemeIndex = (currentThemeIndex + 1) % COLOR_THEMES.length;
                const theme = COLOR_THEMES[currentThemeIndex];
                // 更新弧的颜色索引
                for (let a = 0; a < ARCS_CONFIG.length; a++) {
                    const colorIdx = a % theme.length;
                    ARCS_CONFIG[a].colorIndex = colorIdx;
                }
                // 更新精灵颜色
                for (let i = 0; i < sprites.length; i++) {
                    const arcIndex = particlesData[i].arcIndex;
                    const themeColor = theme[ARCS_CONFIG[arcIndex].colorIndex];
                    sprites[i].tint = themeColor;
                }
                // 中心颜色
                centerCore.tint = theme[0];
                centerGlow.tint = theme[1] || theme[0];
            }

            // ─── 触发冲击波与音效 ───
            function triggerBreathPulse() {
                shockWave = 1.0;
                playBreathSound();
                // 视觉闪光
                centerCore.alpha = 1.0;
                centerGlow.alpha = 0.8;
                setTimeout(() => {
                    centerCore.alpha = 0.7;
                    centerGlow.alpha = 0.35;
                }, 200);
            }

            // ─── 主循环 ───
            app.ticker.add((delta) => {
                const dt = Math.min(delta / 60, 0.05);
                time += dt;
                frameCount++;

                const w = window.innerWidth;
                const h = window.innerHeight;
                const cx = w / 2;
                const cy = h / 2;

                // 平滑鼠标追踪
                smoothMouseX += (mouseX - smoothMouseX) * 0.065;
                smoothMouseY += (mouseY - smoothMouseY) * 0.065;

                // 自动旋转
                autoRotateY += AUTO_ROTATE_SPEED * dt;

                // 视角计算
                const normX = (smoothMouseX / w) * 2 - 1;
                const normY = (smoothMouseY / h) * 2 - 1;
                const viewY = autoRotateY + normX * VIEW_SENSITIVITY_X;
                const viewX = normY * VIEW_SENSITIVITY_Y;

                // 更新
                updateParticles(dt, viewX, viewY, cx, cy);
                updateCenterGlow(cx, cy);

                // FPS 显示
                if (time - fpsLastTime > 0.5) {
                    const fps = Math.round(frameCount / (time - fpsLastTime));
                    fpsBadge.textContent = fps + ' fps';
                    frameCount = 0;
                    fpsLastTime = time;
                }
            });

            // ─── 交互事件 ───
            function getCanvasCoords(e) {
                const rect = app.view.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function onPointerMove(e) {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
            }

            function onPointerDown(e) {
                e.preventDefault();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
                triggerBreathPulse();
                // 点击也切换颜色
                switchTheme();
            }

            function onPointerLeave() {
                mouseX = window.innerWidth / 2;
                mouseY = window.innerHeight / 2;
            }

            app.view.addEventListener('mousemove', onPointerMove);
            app.view.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mouseleave', onPointerLeave);

            app.view.addEventListener('touchmove', onPointerMove, { passive: true });
            app.view.addEventListener('touchstart', onPointerDown, { passive: false });
            app.view.addEventListener('touchend', () => {});

            // ─── 窗口大小调整 ───
            function handleResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                app.renderer.resize(w, h);
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(handleResize, 300);
            });

            // ─── 键盘交互 ───
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    triggerBreathPulse();
                    switchTheme();
                }
            });

            // ─── 启动 ───
            initParticles();

            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
            smoothMouseX = mouseX;
            smoothMouseY = mouseY;

            // 隐藏提示文字
            setTimeout(() => {
                if (hintEl) {
                    hintEl.style.opacity = '0';
                    setTimeout(() => {
                        if (hintEl) hintEl.style.display = 'none';
                    }, 1600);
                }
            }, 3200);

            handleResize();
            console.log('✨ 日冕环 · 呼吸光弧 已启动 — 粒子数:', sprites.length);

            // 首次用户交互时初始化音频（避免自动播放限制）
            const firstInteraction = () => {
                initAudio();
                window.removeEventListener('click', firstInteraction);
                window.removeEventListener('touchstart', firstInteraction);
            };
            window.addEventListener('click', firstInteraction, { once: true });
            window.addEventListener('touchstart', firstInteraction, { once: true });
        })();
    </script>
</body>
</html>
