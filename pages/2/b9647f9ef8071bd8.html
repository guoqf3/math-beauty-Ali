<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>欧拉恒等式 · 粒子爆发</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  /* ---- 左上标题 ---- */
  #title{
    position:absolute;top:0;left:0;
    padding:30px 38px;opacity:0;
    animation:fade 2s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(150,180,255,.34);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(18px,2.6vw,32px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ea8ff 0%,#b090ff 40%,#e090ff 72%,#ffd08a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 30px rgba(130,150,255,.48));
  }
  #title .sub{
    font-size:10px;letter-spacing:.22em;line-height:1.9;
    color:rgba(170,190,250,.30);font-weight:300;
  }

  /* ---- 右上公式 ---- */
  #equation{
    position:absolute;top:0;right:0;
    padding:30px 38px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    opacity:0;animation:fade 2s 1.2s ease forwards;
  }
  #equation .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(150,170,240,.26);margin-bottom:9px;
  }
  #equation .eq{
    font-size:clamp(13px,1.6vw,17px);
    letter-spacing:.06em;
    color:rgba(220,225,255,.62);
  }
  #equation .eq .c1{color:#6ab8ff;}
  #equation .eq .c2{color:#b090ff;}
  #equation .eq .c3{color:#e090d0;}
  #equation .eq .c4{color:#5ee0c0;}
  #equation .eq .c5{color:#ffd080;}

  /* ---- 左下常量说明 ---- */
  #legend{
    position:absolute;bottom:0;left:0;
    padding:0 38px 28px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9px;letter-spacing:.12em;line-height:1.9;
    opacity:0;animation:fade 2s 1.5s ease forwards;
  }
  #legend .item{
    display:flex;align-items:baseline;gap:7px;
    color:rgba(200,210,250,.42);
  }
  #legend .ch{
    font-size:12px;font-weight:600;
    min-width:16px;
    letter-spacing:.02em;
  }
  #legend .nm{
    color:rgba(180,195,245,.36);
    font-size:8.5px;letter-spacing:.08em;
  }
  .c1{color:#6ab8ff;}
  .c2{color:#b090ff;}
  .c3{color:#e090d0;}
  .c4{color:#5ee0c0;}
  .c5{color:#ffd080;}

  /* ---- 右下音频指示 ---- */
  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 38px 28px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.20em;
    color:rgba(160,180,240,.30);
    opacity:0;animation:fade 2s 1.8s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.26);
    transition:background .4s, box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  /* ---- 底部提示 ---- */
  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:14px;white-space:nowrap;
    font-size:9px;letter-spacing:.26em;
    color:rgba(170,190,250,.28);
    opacity:0;animation:fade 2s 2.2s ease forwards;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:680px){
    #title{padding:14px 16px;}
    #title .sub{display:none;}
    #equation{padding:14px 16px;}
    #legend{padding:0 16px 16px;font-size:8px;}
    #legend .nm{display:none;}
    #audioDot{padding:0 16px 16px;font-size:8px;}
    #hint{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">EULER'S IDENTITY · PARTICLE BURST</div>
    <h1>欧拉恒等式</h1>
    <div class="sub">
      五个数学常数 · 从奇点爆发 · 重聚成宇宙至美公式
    </div>
  </div>

  <div id="equation">
    <span class="lab">THE MOST BEAUTIFUL EQUATION</span>
    <div class="eq">
      <span class="c1">e</span><sup><span class="c2">i</span><span class="c3">π</span></sup>
      &nbsp;+&nbsp;
      <span class="c4">1</span>
      &nbsp;=&nbsp;
      <span class="c5">0</span>
    </div>
  </div>

  <div id="legend">
    <div class="item"><span class="ch c1">e</span><span class="nm">自然常数 ≈ 2.71828</span></div>
    <div class="item"><span class="ch c2">i</span><span class="nm">虚数单位 √−1</span></div>
    <div class="item"><span class="ch c3">π</span><span class="nm">圆周率 ≈ 3.14159</span></div>
    <div class="item"><span class="ch c4">1</span><span class="nm">乘法单位元</span></div>
    <div class="item"><span class="ch c5">0</span><span class="nm">加法单位元</span></div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>宇宙爆发音 · 玻璃碰撞音</span>
  </div>

  <div id="hint">点击画面 · 重新爆发</div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, DPR = 1, S = 0;

/* =========================================================
   常量簇定义（归一化坐标 0-1）
   ========================================================= */
const CLUSTERS = [
  { id: 'e',  x: 0.14, y: 0.55, hue: 195, scale: 1.00, count: 52 },
  { id: 'i',  x: 0.23, y: 0.42, hue: 265, scale: 0.62, count: 34 },
  { id: 'π',  x: 0.30, y: 0.42, hue: 320, scale: 0.66, count: 40 },
  { id: '1',  x: 0.50, y: 0.55, hue: 175, scale: 1.00, count: 46 },
  { id: '0',  x: 0.73, y: 0.55, hue: 45,  scale: 1.00, count: 54 }
];

/* 静态运算符位置 */
const OPERATORS = [
  { ch: '+', x: 0.40, y: 0.565 },
  { ch: '=', x: 0.615, y: 0.565 }
];

/* =========================================================
   时间轴（秒）
   ========================================================= */
const T = {
  singularity: 0.0,       // 奇点孕育
  bang:        1.0,       // 爆发开始
  bangEnd:     3.0,       // 爆发结束
  drift:       5.4,       // 漂移结束
  gather:      7.9,       // 聚合结束
  stable:      11.6,      // 稳定显示结束
  fade:        13.2       // 淡出结束
};
const CYCLE = T.fade;

/* =========================================================
   粒子生成
   ========================================================= */
const particles = [];

function buildParticles(){
  particles.length = 0;

  for (let ci = 0; ci < CLUSTERS.length; ci++){
    const c = CLUSTERS[ci];
    const clusterRadius = 0.040 * c.scale;

    for (let k = 0; k < c.count; k++){
      const ang = Math.random() * TAU;
      const rad = Math.sqrt(Math.random()) * clusterRadius;

      const homeX = c.x + Math.cos(ang) * rad;
      const homeY = c.y + Math.sin(ang) * rad;

      /* 中心抖动 */
      const jAng = Math.random() * TAU;
      const jRad = Math.random() * 0.014;
      const jitterX = Math.cos(jAng) * jRad;
      const jitterY = Math.sin(jAng) * jRad;

      /* 爆发方向：从中心指向归宿 + 扰动 */
      const dx = homeX - 0.5;
      const dy = homeY - 0.5;
      const baseAng = Math.atan2(dy, dx);
      const burstAng = baseAng + (Math.random() - 0.5) * 1.5;
      const burstDist = 0.24 + Math.random() * 0.30;

      const burstX = 0.5 + Math.cos(burstAng) * burstDist;
      const burstY = 0.5 + Math.sin(burstAng) * burstDist;

      particles.push({
        cluster: ci,
        hue: c.hue + (Math.random() - 0.5) * 22,
        homeX: homeX,
        homeY: homeY,
        jitterX: jitterX,
        jitterY: jitterY,
        burstX: burstX,
        burstY: burstY,

        /* 大小与亮度 */
        size: (0.55 + Math.random() * 0.85) * (c.scale * 0.7 + 0.6),
        baseAlpha: 0.52 + Math.random() * 0.46,
        phase: Math.random() * TAU,
        freq: 0.6 + Math.random() * 1.6,

        /* 稳定期的轨道浮动 */
        orbitR: 0.0006 + Math.random() * 0.0022,
        orbitS: 0.25 + Math.random() * 0.75,
        orbitP: Math.random() * TAU,

        /* 运行时 */
        x: 0.5, y: 0.5, alpha: 0
      });
    }
  }
}

/* =========================================================
   缓动
   ========================================================= */
function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
function easeOutQuart(x){ return 1 - Math.pow(1 - x, 4); }
function easeInOutCubic(x){
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}
function easeInOutQuart(x){
  return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2;
}

/* =========================================================
   粒子位置计算
   ========================================================= */
function updateParticles(t){
  const cx = 0.5, cy = 0.5;

  let globalAlpha = 1;

  /* 全局淡出 */
  if (t > T.stable){
    globalAlpha = 1 - clamp01((t - T.stable) / (T.fade - T.stable));
  }
  /* 奇点阶段的淡入 */
  if (t < 0.35){
    globalAlpha *= clamp01(t / 0.35);
  }

  for (let i = 0; i < particles.length; i++){
    const p = particles[i];

    let x, y, alpha = globalAlpha;

    if (t < T.bang){
      /* ---- 阶段 1：奇点 ---- */
      const pulse = 1 + 0.28 * Math.sin(t * 12 + p.phase);
      x = cx + p.jitterX * pulse;
      y = cy + p.jitterY * pulse;

    } else if (t < T.bangEnd){
      /* ---- 阶段 2：爆发 ---- */
      const u = clamp01((t - T.bang) / (T.bangEnd - T.bang));
      const e = easeOutQuart(u);

      const sx = cx + p.jitterX;
      const sy = cy + p.jitterY;

      x = sx + (p.burstX - sx) * e;
      y = sy + (p.burstY - sy) * e;

      /* 爆发时更亮 */
      alpha *= 0.55 + 0.65 * Math.sin(u * Math.PI);

    } else if (t < T.drift){
      /* ---- 阶段 3：漂移 ---- */
      const u = clamp01((t - T.bangEnd) / (T.drift - T.bangEnd));

      /* 缓慢旋转与呼吸 */
      const ang = p.phase + u * p.orbitS * 1.6;
      const rad = p.orbitR * 1.8;

      x = p.burstX + Math.cos(ang) * rad;
      y = p.burstY + Math.sin(ang) * rad;

    } else if (t < T.gather){
      /* ---- 阶段 4：聚合 ---- */
      const u = clamp01((t - T.drift) / (T.gather - T.drift));
      const e = easeInOutQuart(u);

      x = p.burstX + (p.homeX - p.burstX) * e;
      y = p.burstY + (p.homeY - p.burstY) * e;

      /* 聚合时闪烁 */
      alpha *= 0.82 + 0.32 * Math.sin(u * Math.PI * 3 + p.phase);

    } else {
      /* ---- 阶段 5：稳定 ---- */
      const u = t - T.gather;

      const ang = p.orbitP + u * p.orbitS * 0.5;
      const rad = p.orbitR * (1 + 0.4 * Math.sin(u * 1.2 + p.phase));

      x = p.homeX + Math.cos(ang) * rad;
      y = p.homeY + Math.sin(ang) * rad;

      /* 呼吸闪烁 */
      alpha *= 0.78 + 0.30 * Math.sin(u * p.freq + p.phase);
    }

    p.x = x;
    p.y = y;
    p.alpha = Math.max(0, Math.min(1, alpha));
  }
}

/* =========================================================
   发光精灵（5 种色相预渲染）
   ========================================================= */
const sprites = {};

function makeSprite(hue){
  const size = 64;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const half = size / 2;

  const rg = g.createRadialGradient(half, half, 0, half, half, half);
  rg.addColorStop(0.00, 'hsla(' + hue + ', 100%, 98%, 1)');
  rg.addColorStop(0.16, 'hsla(' + hue + ', 100%, 88%, 0.94)');
  rg.addColorStop(0.36, 'hsla(' + hue + ', 100%, 72%, 0.52)');
  rg.addColorStop(0.62, 'hsla(' + hue + ', 100%, 62%, 0.16)');
  rg.addColorStop(1.00, 'hsla(' + hue + ', 100%, 55%, 0)');

  g.fillStyle = rg;
  g.fillRect(0, 0, size, size);
  return c;
}

function initSprites(){
  for (let i = 0; i < CLUSTERS.length; i++){
    const c = CLUSTERS[i];
    if (!sprites[c.hue]){
      sprites[c.hue] = makeSprite(c.hue);
    }
  }
  /* 额外的中间色相，让粒子颜色更丰富 */
  const extras = [215, 245, 285, 305, 340, 200, 160, 30, 60, 90];
  for (let i = 0; i < extras.length; i++){
    if (!sprites[extras[i]]) sprites[extras[i]] = makeSprite(extras[i]);
  }
}

function getSprite(hue){
  /* 就近取用 */
  let bestKey = null;
  let bestDist = 1e9;
  for (const k in sprites){
    const d = Math.abs(parseFloat(k) - hue);
    const dd = d > 180 ? 360 - d : d;
    if (dd < bestDist){ bestDist = dd; bestKey = k; }
  }
  return sprites[bestKey] || sprites[195];
}

/* =========================================================
   星空背景
   ========================================================= */
const stars = [];
function buildStars(){
  stars.length = 0;
  const n = Math.min(360, Math.round(S * 0.55));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.15 + 0.16,
      ph: Math.random() * TAU,
      sp: 0.20 + Math.random() * 0.85,
      hue: 200 + Math.random() * 90,
      base: 0.10 + Math.random() * 0.34
    });
  }
}

/* =========================================================
   冲击波
   ========================================================= */
const shockwaves = [];

function spawnShockwave(time){
  shockwaves.push({
    t0: time,
    life: 1,
    maxR: 0.65
  });
}

function updateShockwaves(t){
  for (let i = shockwaves.length - 1; i >= 0; i--){
    const s = shockwaves[i];
    const age = t - s.t0;
    if (age < 0 || age > 2.2){
      shockwaves.splice(i, 1);
      continue;
    }
    s.age = age;
    s.life = 1 - age / 2.2;
  }
}

/* =========================================================
   渲染
   ========================================================= */
function render(t){
  /* ---- 背景 ---- */
  ctx.fillStyle = '#000104';
  ctx.fillRect(0, 0, W, H);

  const cx = W * 0.5;
  const cy = H * 0.5;

  /* 中心深空紫光 */
  const bgG = ctx.createRadialGradient(
    cx, cy, 0,
    cx, cy, Math.max(W, H) * 0.82
  );
  const bgPulse = 0.24 + 0.10 * Math.sin(t * 0.7);
  bgG.addColorStop(0.00, 'rgba(35, 22, 80, ' + bgPulse + ')');
  bgG.addColorStop(0.32, 'rgba(18, 12, 48, ' + (bgPulse * 0.52) + ')');
  bgG.addColorStop(0.68, 'rgba(8, 4, 22, ' + (bgPulse * 0.16) + ')');
  bgG.addColorStop(1.00, 'rgba(0, 0, 2, 0)');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  /* ---- 星空 ---- */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph));
    if (a < 0.02) continue;

    const sx = s.x * W;
    const sy = s.y * H;

    /* 靠近中心的星星被拉伸 */
    const dx = sx - cx;
    const dy = sy - cy;
    const r = Math.sqrt(dx * dx + dy * dy) + 0.001;
    const near = Math.min(1, (S * 0.14) / r);
    const stretch = 1 + near * 2.2;

    ctx.fillStyle = 'hsla(' + s.hue + ', 82%, 86%, ' + a + ')';
    ctx.beginPath();
    ctx.ellipse(sx, sy, s.r * stretch, s.r * 0.85, Math.atan2(dy, dx), 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* ---- 奇点 / 中心辉光 ---- */
  const singularityA = clamp01(1 - (t - T.bang) / 0.9) + clamp01((t - T.stable + 0.3) / 1.5);

  if (t < T.bang + 0.4){
    const u = clamp01(t / T.bang);
    const coreR = S * (0.014 + 0.030 * u) * (1 + 0.16 * Math.sin(t * 15));
    const a = Math.min(1, u * 1.8);

    ctx.globalCompositeOperation = 'lighter';

    const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 6);
    g1.addColorStop(0.00, 'rgba(255, 255, 255, ' + (0.92 * a) + ')');
    g1.addColorStop(0.14, 'rgba(230, 225, 255, ' + (0.52 * a) + ')');
    g1.addColorStop(0.42, 'rgba(170, 150, 255, ' + (0.16 * a) + ')');
    g1.addColorStop(1.00, 'rgba(90, 70, 220, 0)');
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR * 6, 0, TAU);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, ' + a + ')';
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, TAU);
    ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- 冲击波 ---- */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < shockwaves.length; i++){
    const s = shockwaves[i];
    const r = s.maxR * easeOutQuart(clamp01(s.age / 2.2)) * S;
    if (r < 1) continue;

    const a = s.life * s.life * 0.62;

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.strokeStyle = 'rgba(180, 210, 255, ' + a + ')';
    ctx.lineWidth = 2.2 * s.life + 0.6;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.86, 0, TAU);
    ctx.strokeStyle = 'rgba(210, 180, 255, ' + (a * 0.55) + ')';
    ctx.lineWidth = 1.2 * s.life + 0.4;
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* ---- 稳定期的公式基座辉光 ---- */
  const stableU = clamp01((t - T.gather + 0.6) / 1.2);
  if (stableU > 0.01){
    ctx.globalCompositeOperation = 'lighter';

    for (let ci = 0; ci < CLUSTERS.length; ci++){
      const c = CLUSTERS[ci];
      const px = c.x * W;
      const py = c.y * H;
      const rr = S * 0.052 * c.scale * (1 + 0.06 * Math.sin(t * 1.8 + ci));

      const g = ctx.createRadialGradient(px, py, 0, px, py, rr * 2.4);
      const a = stableU * 0.30;
      g.addColorStop(0.00, 'hsla(' + c.hue + ', 100%, 82%, ' + a + ')');
      g.addColorStop(0.42, 'hsla(' + c.hue + ', 100%, 68%, ' + (a * 0.30) + ')');
      g.addColorStop(1.00, 'hsla(' + c.hue + ', 100%, 58%, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, rr * 2.4, 0, TAU);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- 静态运算符 ---- */
  if (stableU > 0.05){
    ctx.globalCompositeOperation = 'lighter';
    ctx.font = '300 ' + Math.round(S * 0.048) + 'px "Helvetica Neue", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < OPERATORS.length; i++){
      const op = OPERATORS[i];
      const a = stableU * 0.34 * (0.86 + 0.14 * Math.sin(t * 1.4 + i));
      ctx.fillStyle = 'rgba(180, 200, 255, ' + a + ')';
      ctx.fillText(op.ch, op.x * W, op.y * H);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- 常量标签（稳定期） ---- */
  if (stableU > 0.20){
    const labelU = clamp01((stableU - 0.20) / 0.55);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let ci = 0; ci < CLUSTERS.length; ci++){
      const c = CLUSTERS[ci];
      const px = c.x * W;
      const py = c.y * H + S * 0.072 * c.scale + 10;

      const size = Math.round(S * 0.020 * c.scale) + 8;
      ctx.font = '600 ' + size + 'px "SF Mono", Consolas, Monaco, monospace';

      const a = labelU * 0.72;

      /* 光晕 */
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'hsla(' + c.hue + ', 100%, 82%, ' + (a * 0.34) + ')';
      ctx.fillText(c.id, px, py);

      /* 主文字 */
      ctx.fillStyle = 'hsla(' + c.hue + ', 90%, 86%, ' + a + ')';
      ctx.fillText(c.id, px, py);

      ctx.globalCompositeOperation = 'source-over';
    }
  }

  /* ---- 粒子（加色混合） ---- */
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    if (p.alpha < 0.015) continue;

    const spr = getSprite(p.hue);
    const scale = p.size * (S * 0.0085 + 2.2);
    const half = scale * 0.5;
    const px = p.x * W;
    const py = p.y * H;

    ctx.globalAlpha = Math.min(1, p.alpha);

    /* 外光晕 */
    const glowScale = scale * 3.2;
    ctx.globalAlpha = Math.min(1, p.alpha * 0.40);
    ctx.drawImage(
      spr,
      px - glowScale * 0.5,
      py - glowScale * 0.5,
      glowScale, glowScale
    );

    /* 核心 */
    ctx.globalAlpha = Math.min(1, p.alpha);
    ctx.drawImage(spr, px - half, py - half, scale, scale);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  /* ---- 结束时的白光爆闪 ---- */
  const finaleU = clamp01((t - T.gather + 0.5) / 0.9);
  if (finaleU > 0 && finaleU < 1){
    const flash = Math.sin(finaleU * Math.PI) * 0.085;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(200, 215, 255, ' + flash + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- 暗角 ---- */
  const vg = ctx.createRadialGradient(
    cx, cy, Math.min(W, H) * 0.32,
    cx, cy, Math.max(W, H) * 0.80
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.60, 'rgba(2, 2, 8, 0.26)');
  vg.addColorStop(1.00, 'rgba(0, 0, 3, 0.88)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   音频系统
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.56, ac.currentTime, 1.8);

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* ---- 宇宙爆发音 ---- */
function playBigBang(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 1) 低频轰鸣 */
  const sub = ac.createOscillator();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(140, now);
  sub.frequency.exponentialRampToValueAtTime(26, now + 2.0);

  const subG = ac.createGain();
  subG.gain.setValueAtTime(0, now);
  subG.gain.linearRampToValueAtTime(0.42, now + 0.05);
  subG.gain.exponentialRampToValueAtTime(0.0008, now + 2.4);

  sub.connect(subG);
  subG.connect(master);
  sub.start(now);
  sub.stop(now + 2.6);

  /* 2) 噪声爆发 */
  const len = Math.ceil(ac.sampleRate * 1.8);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){
    const e = 1 - i / len;
    d[i] = (Math.random() * 2 - 1) * e * e;
  }

  const src = ac.createBufferSource();
  src.buffer = buf;

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(5200, now);
  lp.frequency.exponentialRampToValueAtTime(180, now + 1.7);

  const nG = ac.createGain();
  nG.gain.value = 0.26;

  src.connect(lp);
  lp.connect(nG);
  nG.connect(master);
  src.start(now);

  /* 3) 高频嘶声（宇宙辐射感） */
  const len2 = Math.ceil(ac.sampleRate * 1.4);
  const buf2 = ac.createBuffer(1, len2, ac.sampleRate);
  const d2 = buf2.getChannelData(0);
  for (let i = 0; i < len2; i++){
    const e = 1 - i / len2;
    d2[i] = (Math.random() * 2 - 1) * Math.pow(e, 3);
  }

  const src2 = ac.createBufferSource();
  src2.buffer = buf2;

  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 2400;

  const hG = ac.createGain();
  hG.gain.value = 0.035;

  src2.connect(hp);
  hp.connect(hG);
  hG.connect(master);
  src2.start(now);

  /* 4) 音高下坠的氛围垫 */
  const pad = ac.createOscillator();
  pad.type = 'triangle';
  pad.frequency.setValueAtTime(440, now);
  pad.frequency.exponentialRampToValueAtTime(110, now + 2.2);

  const padG = ac.createGain();
  padG.gain.setValueAtTime(0, now);
  padG.gain.linearRampToValueAtTime(0.045, now + 0.12);
  padG.gain.exponentialRampToValueAtTime(0.0004, now + 2.6);

  pad.connect(padG);
  padG.connect(master);
  pad.start(now);
  pad.stop(now + 2.8);
}

/* ---- 玻璃碰撞音 ---- */
function playGlass(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const freqs = [1840, 2260, 2740, 3320, 3980];

  for (let i = 0; i < freqs.length; i++){
    const f = freqs[i] * (0.96 + Math.random() * 0.08);

    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;

    /* 泛音 */
    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = f * 2.004;

    const g = ac.createGain();
    const t0 = now + i * 0.010 + Math.random() * 0.02;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.042 / (i * 0.35 + 1), t0 + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 0.42);

    const g2 = ac.createGain();
    g2.gain.value = 0.24;

    osc.connect(g);
    osc2.connect(g2);
    g2.connect(g);
    g.connect(master);

    osc.start(t0);
    osc.stop(t0 + 0.48);
    osc2.start(t0);
    osc2.stop(t0 + 0.48);
  }
}

/* ---- 聚合时的和声 ---- */
function playHarmony(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 基于 e, i, π, 1, 0 的色相映射为音高 */
  const notes = [261.63, 329.63, 392.00, 523.25, 659.25];

  for (let i = 0; i < notes.length; i++){
    const f = notes[i];

    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;

    const g = ac.createGain();
    const t0 = now + i * 0.09;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.055, t0 + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0004, t0 + 1.8);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 2.0);
  }
}

/* =========================================================
   音频触发标志
   ========================================================= */
const audioFlags = {
  bang: false,
  glass1: false,
  glass2: false,
  glass3: false,
  harmony: false
};

function resetAudioFlags(){
  audioFlags.bang = false;
  audioFlags.glass1 = false;
  audioFlags.glass2 = false;
  audioFlags.glass3 = false;
  audioFlags.harmony = false;
}

function checkAudioTriggers(t){
  /* 爆发 */
  if (!audioFlags.bang && t >= T.bang){
    audioFlags.bang = true;
    playBigBang();
    spawnShockwave(t);
    if (!running) return;
  }

  /* 漂移中期的玻璃音 */
  if (!audioFlags.glass1 && t >= T.bangEnd + 0.4){
    audioFlags.glass1 = true;
    playGlass();
  }

  /* 聚合时玻璃音 */
  if (!audioFlags.glass2 && t >= T.drift + 0.6){
    audioFlags.glass2 = true;
    playGlass();
  }

  /* 聚合结束 */
  if (!audioFlags.glass3 && t >= T.gather - 0.15){
    audioFlags.glass3 = true;
    playGlass();
  }

  /* 稳定期和声 */
  if (!audioFlags.harmony && t >= T.gather + 0.25){
    audioFlags.harmony = true;
    playHarmony();
  }
}

/* =========================================================
   布局
   ========================================================= */
function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);
  buildStars();
}
window.addEventListener('resize', layout);

/* =========================================================
   主循环
   ========================================================= */
let loopT = 0;
let lastTS = 0;
let running = true;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastTS) lastTS = now;
  let dt = (now - lastTS) / 1000;
  lastTS = now;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;

  if (running){
    loopT += dt;
    if (loopT >= CYCLE){
      loopT -= CYCLE;
      resetAudioFlags();
    }
  }

  const t = loopT;

  updateParticles(t);
  updateShockwaves(t);
  checkAudioTriggers(t);
  render(t);
}

/* =========================================================
   交互：点击重启
   ========================================================= */
function restart(){
  initAudio();
  loopT = 0;
  resetAudioFlags();
  buildParticles();
  shockwaves.length = 0;
}

canvas.addEventListener('pointerdown', function(e){
  initAudio();
  restart();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'r' || e.key === 'R'){
    e.preventDefault();
    restart();
  }
});

/* =========================================================
   启动
   ========================================================= */
layout();
initSprites();
buildParticles();
requestAnimationFrame(loop);

})();
</script>
