<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>鸟群飞行</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="murmurationCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('murmurationCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                birdCount: 140,             // 鸟群数量
                maxSpeed: 2.8,              // 最大速度
                minSpeed: 1.2,              // 最小速度
                separationRadius: 18,       // 分离半径
                separationForce: 0.06,      // 分离力
                alignmentRadius: 45,        // 对齐半径
                alignmentForce: 0.035,      // 对齐力
                cohesionRadius: 55,         // 聚合半径
                cohesionForce: 0.025,       // 聚合强度
                mouseAttractRadius: 200,    // 鼠标吸引半径
                mouseAttractStrength: 0.02, // 吸引强度
                clickRepelRadius: 260,      // 点击惊扰半径
                clickRepelStrength: 28,     // 惊扰强度
                randomForce: 0.04,          // 随机扰动
                damping: 0.96,              // 阻尼
                backgroundFade: 0.1,        // 拖尾强度
                // 鸟群颜色（暖色到冷色渐变）
                hueBase: 30,                // 暖色
                hueVariation: 50,           // 色相变化
                saturation: 80,
                lightness: 65,
                particleSize: 2.0,          // 粒子基础大小
                glowFactor: 3.0,            // 光晕因子
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let birds = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let animationId = null;
            let lastTime = 0;
            let time = 0;
            let grid = new Map();
            let gridCellSize = CONFIG.alignmentRadius;

            // ---------- 鸟类 ----------
            class Bird {
                constructor(w, h) {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * (CONFIG.maxSpeed - CONFIG.minSpeed) + CONFIG.minSpeed;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.hue = CONFIG.hueBase + Math.random() * CONFIG.hueVariation;
                    this.saturation = CONFIG.saturation + Math.random() * 15;
                    this.lightness = CONFIG.lightness + Math.random() * 10;
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 1.5 + 0.5;
                }

                update(dt, now, time, neighbors) {
                    let sepX = 0;
                    let sepY = 0;
                    let aliX = 0;
                    let aliY = 0;
                    let cohX = 0;
                    let cohY = 0;
                    let cohCount = 0;

                    // 遍历邻居计算群体行为
                    for (const other of neighbors) {
                        if (other === this) continue;
                        const dx = this.x - other.x;
                        const dy = this.y - other.y;
                        const distSq = dx * dx + dy * dy;
                        const dist = Math.sqrt(distSq);

                        // 分离（避免重叠）
                        if (dist > 0.01 && dist < CONFIG.separationRadius) {
                            const force = CONFIG.separationForce * (1 - dist / CONFIG.separationRadius);
                            sepX += (dx / dist) * force;
                            sepY += (dy / dist) * force;
                        }

                        // 对齐（匹配速度方向）
                        if (dist < CONFIG.alignmentRadius) {
                            aliX += other.vx;
                            aliY += other.vy;
                        }

                        // 聚合（朝向邻居中心）
                        if (dist < CONFIG.cohesionRadius) {
                            cohX += other.x;
                            cohY += other.y;
                            cohCount++;
                        }
                    }

                    // 归一化对齐
                    let alignCount = 0;
                    for (const other of neighbors) {
                        if (other === this) continue;
                        const dx = this.x - other.x;
                        const dy = this.y - other.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.alignmentRadius) alignCount++;
                    }
                    if (alignCount > 0) {
                        aliX /= alignCount;
                        aliY /= alignCount;
                    }

                    // 聚合中心
                    let cohCenterX = 0;
                    let cohCenterY = 0;
                    if (cohCount > 0) {
                        cohCenterX = cohX / cohCount;
                        cohCenterY = cohY / cohCount;
                    }

                    // 应用群体力
                    this.vx += sepX * dt;
                    this.vy += sepY * dt;
                    if (alignCount > 0) {
                        this.vx += (aliX - this.vx) * CONFIG.alignmentForce * dt;
                        this.vy += (aliY - this.vy) * CONFIG.alignmentForce * dt;
                    }
                    if (cohCount > 0) {
                        const dxCoh = cohCenterX - this.x;
                        const dyCoh = cohCenterY - this.y;
                        const distCoh = Math.sqrt(dxCoh * dxCoh + dyCoh * dyCoh);
                        if (distCoh > 0.1) {
                            this.vx += (dxCoh / distCoh) * CONFIG.cohesionForce * dt;
                            this.vy += (dyCoh / distCoh) * CONFIG.cohesionForce * dt;
                        }
                    }

                    // 鼠标吸引
                    if (mouseActive && smoothMouseX > -1000) {
                        const dxM = smoothMouseX - this.x;
                        const dyM = smoothMouseY - this.y;
                        const distM = Math.sqrt(dxM * dxM + dyM * dyM);
                        if (distM < CONFIG.mouseAttractRadius && distM > 0.1) {
                            const forceM = (CONFIG.mouseAttractRadius - distM) / CONFIG.mouseAttractRadius * CONFIG
                                .mouseAttractStrength;
                            this.vx += (dxM / distM) * forceM * dt;
                            this.vy += (dyM / distM) * forceM * dt;
                        }
                    }

                    // 随机扰动
                    this.vx += (Math.random() - 0.5) * CONFIG.randomForce * dt;
                    this.vy += (Math.random() - 0.5) * CONFIG.randomForce * dt;

                    // 阻尼
                    this.vx *= CONFIG.damping;
                    this.vy *= CONFIG.damping;

                    // 速度限制
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > CONFIG.maxSpeed) {
                        this.vx = (this.vx / speed) * CONFIG.maxSpeed;
                        this.vy = (this.vy / speed) * CONFIG.maxSpeed;
                    }
                    if (speed < CONFIG.minSpeed && speed > 0.01) {
                        this.vx = (this.vx / speed) * CONFIG.minSpeed;
                        this.vy = (this.vy / speed) * CONFIG.minSpeed;
                    }

                    // 更新位置
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界处理（软回弹）
                    const margin = 40;
                    if (this.x < -margin) { this.x = -margin; this.vx = Math.abs(this.vx) * 0.6; }
                    if (this.x > width + margin) { this.x = width + margin; this.vx = -Math.abs(this.vx) * 0.6; }
                    if (this.y < -margin) { this.y = -margin; this.vy = Math.abs(this.vy) * 0.6; }
                    if (this.y > height + margin) { this.y = height + margin; this.vy = -Math.abs(this.vy) * 0.6; }
                }

                // 获取当前亮度
                getLightness() {
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    const speedFactor = Math.min(1, speed / CONFIG.maxSpeed);
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 5;
                    return Math.max(40, Math.min(85, this.lightness + speedFactor * 10 + pulse));
                }

                // 获取当前大小
                getSize() {
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 0.3;
                    return Math.max(1.0, CONFIG.particleSize + pulse);
                }
            }

            // ---------- 空间哈希网格 ----------
            function buildGrid() {
                grid.clear();
                gridCellSize = CONFIG.alignmentRadius;
                for (const b of birds) {
                    const gx = Math.floor(b.x / gridCellSize);
                    const gy = Math.floor(b.y / gridCellSize);
                    const key = gx + ',' + gy;
                    if (!grid.has(key)) grid.set(key, []);
                    grid.get(key).push(b);
                }
            }

            function getNeighbors(b) {
                const gx = Math.floor(b.x / gridCellSize);
                const gy = Math.floor(b.y / gridCellSize);
                const neighbors = [];
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const key = (gx + dx) + ',' + (gy + dy);
                        if (grid.has(key)) {
                            const cell = grid.get(key);
                            for (const other of cell) {
                                neighbors.push(other);
                            }
                        }
                    }
                }
                return neighbors;
            }

            // ---------- 初始化鸟群 ----------
            function initBirds() {
                birds = [];
                for (let i = 0; i < CONFIG.birdCount; i++) {
                    birds.push(new Bird(width, height));
                }
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#0a0a0f';
                ctx.fillRect(0, 0, width, height);
                initBirds();
                drawScene(performance.now());
            }

            // ---------- 绘制场景 ----------
            function drawScene(now) {
                // 半透明背景拖尾
                ctx.fillStyle = 'rgba(10, 10, 15, ' + CONFIG.backgroundFade + ')';
                ctx.fillRect(0, 0, width, height);

                // 开启混合模式
                ctx.globalCompositeOperation = 'lighter';

                // 平滑鼠标位置
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.16;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.16;
                }

                // 绘制鼠标光晕
                if (mouseActive && smoothMouseX > -1000) {
                    const glowRadius = 100;
                    const grad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY,
                        glowRadius);
                    grad.addColorStop(0, 'rgba(180, 160, 100, 0.08)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制所有鸟
                for (const bird of birds) {
                    const lightness = bird.getLightness();
                    const size = bird.getSize();
                    const glowRadius = size * CONFIG.glowFactor;
                    const alpha = 0.65;

                    // 光晕
                    const glowGrad = ctx.createRadialGradient(bird.x, bird.y, 0, bird.x, bird.y, glowRadius);
                    glowGrad.addColorStop(0, `hsla(${bird.hue}, ${bird.saturation}%, ${lightness}%, ${alpha * 0.4})`);
                    glowGrad.addColorStop(0.5, `hsla(${bird.hue}, ${bird.saturation}%, ${lightness}%, ${alpha * 0.2})`);
                    glowGrad.addColorStop(1, `hsla(${bird.hue}, ${bird.saturation}%, ${lightness}%, 0)`);
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(bird.x, bird.y, glowRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心
                    ctx.fillStyle = `hsla(${bird.hue}, ${bird.saturation}%, ${lightness + 10}%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(bird.x, bird.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 恢复混合模式
                ctx.globalCompositeOperation = 'source-over';
            }

            // ---------- 更新鸟群 ----------
            function updateBirds(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                // 构建空间哈希网格
                buildGrid();

                // 更新每只鸟
                for (const bird of birds) {
                    const neighbors = getNeighbors(bird);
                    bird.update(dt, now, time, neighbors);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updateBirds(now);
                drawScene(now);

                animationId = requestAnimationFrame(animate);
            }

            // ---------- 交互事件 ----------
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function handleClick(clientX, clientY) {
                // 惊扰脉冲：让鸟群散开
                for (const bird of birds) {
                    const dx = bird.x - clientX;
                    const dy = bird.y - clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.clickRepelRadius && dist > 0.01) {
                        const force = (1 - dist / CONFIG.clickRepelRadius) * CONFIG.clickRepelStrength;
                        bird.vx += (dx / dist) * force;
                        bird.vy += (dy / dist) * force;
                    }
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__murmuration = {
                config: CONFIG,
                birds: birds,
            };
        })();
    </script>
</body>
</html>
