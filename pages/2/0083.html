<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIDESCENCE · 虹彩泡沫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a12;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(225, 215, 245, 0.75);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(150, 120, 240, 0.5);
        }

        .hint {
            color: rgba(190, 175, 215, 0.45);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.22em;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">Iridescence</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let bubbles = [];
            let mouse = { x: -9999, y: -9999, active: false, vx: 0, vy: 0, px: -9999, py: -9999 };
            let time = 0;
            let colorShift = 0;
            let burstParticles = [];

            const BUBBLE_COUNT = () => Math.max(50, Math.min(120, Math.floor(W * H / 16000)));

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0a0a12';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 虹彩泡沫类 ─────────────────────────────────────────────
            class Bubble {
                constructor(x, y, radius) {
                    this.x = x || Math.random() * W;
                    this.y = y || Math.random() * H;
                    this.radius = radius || 4 + Math.random() * 22;
                    this.baseRadius = this.radius;
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = -0.2 - Math.random() * 0.5;
                    this.hueBase = 180 + Math.random() * 120;
                    this.iridescence = Math.random() * 60 - 30;
                    this.alpha = 0.35 + Math.random() * 0.4;
                    this.wobble = Math.random() * Math.PI * 2;
                    this.wobbleSpeed = 0.5 + Math.random() * 1.0;
                    this.wobbleAmp = 0.15 + Math.random() * 0.25;
                    this.life = 1.0;
                }

                update(dt, mouse) {
                    this.wobble += this.wobbleSpeed * dt * 0.1;
                    this.x += this.vx * dt + Math.sin(this.wobble) * this.wobbleAmp;
                    this.y += this.vy * dt;
                    this.radius = this.baseRadius * (1 + Math.sin(this.wobble * 2.3) * 0.06);

                    // 鼠标扰动
                    if (mouse.active) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const distSq = dx * dx + dy * dy;
                        const infRadius = 170;
                        const infSq = infRadius * infRadius;
                        if (distSq < infSq) {
                            const dist = Math.sqrt(distSq);
                            const force = (1 - dist / infRadius) * 0.8;
                            this.vx += dx / dist * force * 0.15;
                            this.vy += dy / dist * force * 0.12;
                            // 轻微放大
                            this.radius += (this.baseRadius * 0.3 - this.radius) * 0.03;
                        }
                    }

                    // 阻尼
                    this.vx *= 0.99;
                    this.vy *= 0.99;

                    // 边界环绕
                    if (this.x < -this.radius) this.x = W + this.radius;
                    if (this.x > W + this.radius) this.x = -this.radius;
                    if (this.y < -this.radius) { this.y = H + this.radius; this.x = Math.random() * W; }
                    if (this.y > H + this.radius) { this.y = -this.radius; this.x = Math.random() * W; }
                }

                draw(ctx, t) {
                    const radius = this.radius;
                    const hue = this.hueBase + colorShift + Math.sin(t * 0.6 + this.wobble) * this.iridescence;
                    const sat = 55 + Math.sin(t * 0.8 + this.wobble) * 25;
                    const light = 55 + Math.sin(t * 0.4 + this.wobble * 1.5) * 20;
                    const alpha = this.alpha * (0.7 + 0.3 * Math.sin(this.wobble * 2));

                    // 主气泡径向渐变
                    const gradient = ctx.createRadialGradient(this.x, this.y, radius * 0.1, this.x, this.y, radius);
                    gradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 30}%, ${alpha * 0.6})`);
                    gradient.addColorStop(0.25, `hsla(${hue + 30}, ${sat + 10}%, ${light + 15}%, ${alpha * 0.45})`);
                    gradient.addColorStop(0.6, `hsla(${hue - 20}, ${sat + 5}%, ${light}%, ${alpha * 0.3})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                    ctx.fill();

                    // 边缘虹彩环
                    const edgeAlpha = alpha * 0.5;
                    const edgeGradient = ctx.createLinearGradient(this.x - radius, this.y - radius, this.x + radius, this.y + radius);
                    edgeGradient.addColorStop(0, `hsla(${hue + 80}, 80%, 70%, ${edgeAlpha})`);
                    edgeGradient.addColorStop(0.3, `hsla(${hue + 30}, 75%, 60%, ${edgeAlpha})`);
                    edgeGradient.addColorStop(0.6, `hsla(${hue - 40}, 70%, 65%, ${edgeAlpha})`);
                    edgeGradient.addColorStop(1, `hsla(${hue + 60}, 85%, 75%, ${edgeAlpha})`);
                    ctx.strokeStyle = edgeGradient;
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius * 0.88, 0, Math.PI * 2);
                    ctx.stroke();

                    // 高光点
                    const highlightX = this.x - radius * 0.35;
                    const highlightY = this.y - radius * 0.4;
                    const highlightR = radius * 0.18;
                    const highlightGradient = ctx.createRadialGradient(highlightX, highlightY, 0, highlightX, highlightY, highlightR);
                    highlightGradient.addColorStop(0, `hsla(0, 0%, 100%, ${alpha * 0.7})`);
                    highlightGradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = highlightGradient;
                    ctx.beginPath();
                    ctx.arc(highlightX, highlightY, highlightR, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initBubbles() {
                const count = BUBBLE_COUNT();
                bubbles = [];
                for (let i = 0; i < count; i++) {
                    bubbles.push(new Bubble());
                }
            }

            // ─── 点击爆发粒子 ───────────────────────────────────────────
            function createBurst(x, y) {
                const count = 15 + Math.floor(Math.random() * 15);
                for (let i = 0; i < count; i++) {
                    burstParticles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 3,
                        life: 0.6 + Math.random() * 0.7,
                        maxLife: 1.3,
                        size: 2 + Math.random() * 4,
                        hue: 180 + colorShift + Math.random() * 120 - 60,
                        alpha: 0.7,
                    });
                }
                if (burstParticles.length > 120) burstParticles.splice(0, burstParticles.length - 120);
                // 同时创建几个新泡沫
                const newBubbleCount = 5 + Math.floor(Math.random() * 8);
                for (let i = 0; i < newBubbleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 10 + Math.random() * 60;
                    const bx = x + Math.cos(angle) * dist;
                    const by = y + Math.sin(angle) * dist;
                    const br = 3 + Math.random() * 12;
                    bubbles.push(new Bubble(bx, by, br));
                }
                if (bubbles.length > 180) bubbles.splice(0, bubbles.length - 180);
            }

            function updateBurstParticles(dt) {
                for (let i = burstParticles.length - 1; i >= 0; i--) {
                    const p = burstParticles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                    p.life -= 0.025 * dt;
                    if (p.life <= 0) burstParticles.splice(i, 1);
                }
            }

            function drawBurstParticles(ctx) {
                for (const p of burstParticles) {
                    const alpha = p.life * p.alpha;
                    const size = p.size * p.life;
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size);
                    gradient.addColorStop(0, `hsla(${p.hue}, 75%, 75%, ${alpha})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 70;
                const hue = 200 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 70%, 80%, 0.05)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 60%, 70%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ───────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.015;
                    const dtNorm = fixedStep / 1000 * 60;
                    for (const b of bubbles) {
                        b.update(dtNorm, mouse);
                    }
                    updateBurstParticles(dtNorm);
                }

                // 微弱拖尾
                ctx.fillStyle = 'rgba(10, 10, 18, 0.15)';
                ctx.fillRect(0, 0, W, H);

                // 绘制泡沫
                for (const b of bubbles) {
                    b.draw(ctx, time);
                }

                // 绘制爆发粒子
                drawBurstParticles(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.px = mouse.x;
                mouse.py = mouse.y;
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                mouse.vx = (mouse.x - mouse.px) * 0.1;
                mouse.vy = (mouse.y - mouse.py) * 0.1;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.px = -9999;
                mouse.py = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createBurst(mouse.x, mouse.y);
                colorShift += 30 + Math.random() * 40;
                if (colorShift > 160) colorShift = -30;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.px = mouse.x;
                    mouse.py = mouse.y;
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createBurst(mouse.x, mouse.y);
                    colorShift += 30 + Math.random() * 40;
                    if (colorShift > 160) colorShift = -30;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.px = -9999;
                mouse.py = -9999;
            }

            function onResize() {
                setupCanvas();
                const targetCount = BUBBLE_COUNT();
                if (targetCount !== bubbles.length) {
                    while (bubbles.length < targetCount) {
                        bubbles.push(new Bubble());
                    }
                    if (bubbles.length > targetCount) {
                        bubbles.length = targetCount;
                    }
                }
                burstParticles = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function init() {
                setupCanvas();
                initBubbles();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0a0a12';
                    ctx.fillRect(0, 0, W, H);
                }
            });
        })();
    </script>
</body>
</html>
