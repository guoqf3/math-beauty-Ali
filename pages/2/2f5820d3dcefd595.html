<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面反演圆织网 · 空间直线Möbius变换 · 三正交族编织</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d6a745;
            --cyan: #3cbca4;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.6vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.62rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.85rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.54rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3cbca4;
        }
        .accent-rose {
            color: #d94050;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>球面反演圆织网 · 空间直线Möbius变换 · 三正交族编织</h1>
        <div class="subtitle">直线族反演为过原点圆 &nbsp;·&nbsp; 动态反演半径 &nbsp;·&nbsp; 球极逆投影织锦</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">ι_R: x ↦ R²·x/|x|²</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">ℓ: p+t·e₁</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">ℓ₂: q+t·e₂</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">ℓ₃: r+t·e₃</span>
        </div>
        <div class="formula-detail">
            球面反演将空间直线变为过原点的圆 · 三族正交直线交织 · R(t)呼吸式脉动 · 全局SO(3)旋转
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // -------------------------- 场景初始化 --------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.5, 30);
        camera.position.set(2.3, 1.4, 7.7);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3cbca4');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // -------------------------- 背景星点 --------------------------
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 160;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.3 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSizes[i] = Math.random() * 1.6 + 0.22;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.018,
            transparent: true,
            opacity: 0.46,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 50, 34);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.07, depthWrite: false })
        );
        scene.add(refSphereWire);

        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 28);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.06, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // -------------------------- 旋转矩阵 --------------------------
        function so3Matrix(t) {
            const angle = t * 0.22;
            const axisAngle = t * 0.12;
            const ax = Math.cos(axisAngle) * 0.55;
            const ay = Math.sin(axisAngle) * 0.45;
            const az = Math.cos(axisAngle * 1.3) * 0.5;
            const n = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
            const ux = ax / n,
                uy = ay / n,
                uz = az / n;
            const c = Math.cos(angle),
                s = Math.sin(angle),
                t1 = 1 - c;
            return [
                c + ux * ux * t1,
                ux * uy * t1 - uz * s,
                ux * uz * t1 + uy * s,
                uy * ux * t1 + uz * s,
                c + uy * uy * t1,
                uy * uz * t1 - ux * s,
                uz * ux * t1 - uy * s,
                uz * uy * t1 + ux * s,
                c + uz * uz * t1,
            ];
        }

        function applyRot(pt, R) {
            return [
                R[0] * pt[0] + R[1] * pt[1] + R[2] * pt[2],
                R[3] * pt[0] + R[4] * pt[1] + R[5] * pt[2],
                R[6] * pt[0] + R[7] * pt[1] + R[8] * pt[2],
            ];
        }

        // -------------------------- 直线反演采样 --------------------------
        const SAMPLES_PER_LINE = 80;
        const T_RANGE = 4.5; // 参数t范围 [-T_RANGE, T_RANGE]

        function createLineGeom(color) {
            const geom = new THREE.BufferGeometry();
            const pos = new Float32Array(SAMPLES_PER_LINE * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.82,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            return { line, geom, pos };
        }

        // 生成三族直线定义
        const linesGold = [];
        const linesCyan = [];
        const linesRose = [];
        const step = 0.55;
        const range = 2.6;

        // 金族: 方向 (1,0,0), 经过 (0, y, z)
        for (let y = -range; y <= range; y += step) {
            for (let z = -range; z <= range; z += step) {
                if (Math.abs(y) < 1e-3 && Math.abs(z) < 1e-3) continue; // 过原点跳过
                linesGold.push({ dir: [1, 0, 0], point: [0, y, z] });
            }
        }

        // 青族: 方向 (0,1,0), 经过 (x, 0, z)
        for (let x = -range; x <= range; x += step) {
            for (let z = -range; z <= range; z += step) {
                if (Math.abs(x) < 1e-3 && Math.abs(z) < 1e-3) continue;
                linesCyan.push({ dir: [0, 1, 0], point: [x, 0, z] });
            }
        }

        // 玫红族: 方向 (0,0,1), 经过 (x, y, 0)
        for (let x = -range; x <= range; x += step) {
            for (let y = -range; y <= range; y += step) {
                if (Math.abs(x) < 1e-3 && Math.abs(y) < 1e-3) continue;
                linesRose.push({ dir: [0, 0, 1], point: [x, y, 0] });
            }
        }

        // 为每条直线创建Line对象，存储定义和更新函数
        const allCurves = [];

        function addLineGroup(lineDefs, color) {
            for (const def of lineDefs) {
                const geomObj = createLineGeom(color);
                const curveObj = {
                    ...geomObj,
                    lineDef: def,
                    updateFn: (t, R_inv, rotMat) => {
                        const pos = geomObj.pos;
                        const pBase = def.point;
                        const d = def.dir;
                        const R2 = R_inv * R_inv;
                        for (let i = 0; i < SAMPLES_PER_LINE; i++) {
                            const s = -T_RANGE + (i / (SAMPLES_PER_LINE - 1)) * 2 * T_RANGE;
                            const x = pBase[0] + s * d[0];
                            const y = pBase[1] + s * d[1];
                            const z = pBase[2] + s * d[2];
                            const r2 = x * x + y * y + z * z;
                            if (r2 < 1e-9) {
                                pos[i * 3] = 0;
                                pos[i * 3 + 1] = 0;
                                pos[i * 3 + 2] = 0;
                                continue;
                            }
                            const scale = R2 / r2;
                            let qx = x * scale;
                            let qy = y * scale;
                            let qz = z * scale;
                            // 旋转
                            const pt = applyRot([qx, qy, qz], rotMat);
                            // 钳制
                            const r = Math.sqrt(pt[0] ** 2 + pt[1] ** 2 + pt[2] ** 2);
                            if (r > CLAMP_RADIUS && r > 0.001) {
                                const sc = CLAMP_RADIUS / r;
                                pt[0] *= sc;
                                pt[1] *= sc;
                                pt[2] *= sc;
                            }
                            pos[i * 3] = pt[0];
                            pos[i * 3 + 1] = pt[1];
                            pos[i * 3 + 2] = pt[2];
                        }
                        geomObj.geom.attributes.position.needsUpdate = true;
                    }
                };
                allCurves.push(curveObj);
            }
        }

        addLineGroup(linesGold, colorGold);
        addLineGroup(linesCyan, colorCyan);
        addLineGroup(linesRose, colorRose);

        console.log(`直线族: 金${linesGold.length}, 青${linesCyan.length}, 玫红${linesRose.length}, 总计${allCurves.length}条曲线`);

        // -------------------------- 流动粒子 --------------------------
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                curveIndex: i % allCurves.length,
                progress: Math.random(),
                speed: 0.00045 + Math.random() * 0.0022,
            });
            let col;
            if (i < 7) col = colorGold.clone();
            else if (i < 14) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = 0;
            particlePosArr[i * 3 + 1] = 0;
            particlePosArr[i * 3 + 2] = 0;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const curveObj = allCurves[pd.curveIndex];
                if (!curveObj || !curveObj.pos) continue;
                const posArr = curveObj.pos;
                const floatIdx = pd.progress * (SAMPLES_PER_LINE - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, SAMPLES_PER_LINE - 1);
                const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                const i0 = idx0 * 3,
                    i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        function safeUpdateCurves(t) {
            const R_inv = 1.8 + 0.7 * Math.sin(t * 0.32) * Math.cos(t * 0.25);
            const rotMat = so3Matrix(t);
            for (const curve of allCurves) {
                try {
                    curve.updateFn(t, R_inv, rotMat);
                } catch (e) {
                    console.warn('曲线更新异常:', e);
                }
            }
        }

        // -------------------------- 健壮的动画循环 --------------------------
        const clock = new THREE.Clock();
        let animTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animTime += dt;
                frameCount++;

                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${animTime.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }

                safeUpdateCurves(animTime);
                updateParticles();

                const breathe = 1 + 0.04 * Math.sin(animTime * 0.38) * Math.cos(animTime * 0.28);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.055;
                refSphereWire.rotation.y += dt * 0.045;

                refTorusWire.rotation.z += dt * 0.055;
                const torBreathe = 1 + 0.05 * Math.sin(animTime * 0.42) * Math.cos(animTime * 0.31);
                refTorusWire.scale.setScalar(torBreathe);

                const camH = animTime * 0.09;
                const camV = 0.33 + 0.17 * Math.sin(animTime * 0.14);
                const camD = 7.4 + 0.6 * Math.sin(animTime * 0.19) * Math.cos(animTime * 0.25);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.05 * Math.sin(animTime * 0.09), 0.03 * Math.cos(animTime * 0.12), 0);

                stars.rotation.y += dt * 0.013;
                stars.rotation.x += dt * 0.009;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环异常:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') clock.getDelta();
        });

        // 启动
        console.log('🚀 球面反演圆织网动画初始化...');
        safeUpdateCurves(0);
        updateParticles();
        renderer.render(scene, camera);
        clock.start();
        animTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环启动，三族正交直线反演为交织圆网');
    </script>
</body>
</html>
