<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELLPOEM · 细胞诗篇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a18;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(220, 225, 245, 0.75);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(120, 150, 240, 0.4);
        }

        .hint {
            color: rgba(170, 180, 210, 0.45);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.22em;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <div class="title">Cellpoem</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            // ─── 画布初始化 ───────────────────────────────────────────────
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let gridW = 0, gridH = 0;
            let cellSize = 6;             // 每个细胞对应的屏幕像素
            let cells = null;             // Uint8Array 存储细胞年龄（0=死亡，>0=存活，255=最老）
            let nextCells = null;         // 双缓冲
            let offscreenCanvas = null;
            let offscreenCtx = null;
            let imageData = null;
            let colorLUT = null;
            let mouse = { x: -9999, y: -9999, active: false, gridX: -1, gridY: -1 };
            let time = 0;
            let generation = 0;
            let resetTimer = 0;
            let maxGenerations = 180;     // 自动重置，防止图案僵化

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0a0a18';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 初始化网格 ─────────────────────────────────────────────
            function initGrid() {
                // 根据屏幕尺寸计算细胞大小，目标网格约160x100
                const targetCols = 160;
                const targetRows = Math.floor(targetCols * (H / W));
                cellSize = Math.max(4, Math.min(10, W / targetCols));
                gridW = Math.ceil(W / cellSize);
                gridH = Math.ceil(H / cellSize);

                // 限制最大网格尺寸以保证性能
                if (gridW * gridH > 20000) {
                    const scale = Math.sqrt(20000 / (gridW * gridH));
                    cellSize *= (1 / scale);
                    gridW = Math.ceil(W / cellSize);
                    gridH = Math.ceil(H / cellSize);
                }

                cells = new Uint8Array(gridW * gridH);
                nextCells = new Uint8Array(gridW * gridH);

                // 离屏画布
                offscreenCanvas = document.createElement('canvas');
                offscreenCanvas.width = gridW;
                offscreenCanvas.height = gridH;
                offscreenCtx = offscreenCanvas.getContext('2d');
                imageData = offscreenCtx.createImageData(gridW, gridH);

                // 颜色查找表
                buildColorLUT();

                // 初始播种
                seedRandomCells();
            }

            // ─── 颜色查找表 ─────────────────────────────────────────────
            function buildColorLUT() {
                colorLUT = new Uint8Array(256 * 3);
                for (let i = 0; i < 256; i++) {
                    const t = i / 255; // 0=新生细胞，1=衰老细胞
                    let r, g, b;

                    if (t < 0.1) {
                        // 新生细胞——亮青色
                        const f = t / 0.1;
                        r = 30 + f * 40;
                        g = 180 + f * 50;
                        b = 220 + f * 30;
                    } else if (t < 0.3) {
                        // 年轻细胞——蓝色到紫色
                        const f = (t - 0.1) / 0.2;
                        r = 70 + f * 80;
                        g = 230 - f * 100;
                        b = 250 - f * 70;
                    } else if (t < 0.5) {
                        // 中年细胞——紫色到粉色
                        const f = (t - 0.3) / 0.2;
                        r = 150 + f * 60;
                        g = 130 - f * 60;
                        b = 180 - f * 40;
                    } else if (t < 0.7) {
                        // 衰老细胞——粉色到橙色
                        const f = (t - 0.5) / 0.2;
                        r = 210 + f * 30;
                        g = 70 - f * 40;
                        b = 140 - f * 70;
                    } else {
                        // 濒死细胞——暗橙色
                        const f = (t - 0.7) / 0.3;
                        r = 240 - f * 100;
                        g = 30 - f * 20;
                        b = 70 - f * 40;
                    }

                    colorLUT[i * 3] = Math.max(0, Math.min(255, Math.round(r)));
                    colorLUT[i * 3 + 1] = Math.max(0, Math.min(255, Math.round(g)));
                    colorLUT[i * 3 + 2] = Math.max(0, Math.min(255, Math.round(b)));
                }
            }

            // ─── 随机播种 ───────────────────────────────────────────────
            function seedRandomCells() {
                const total = cells.length;
                const seedCount = Math.floor(total * 0.12);
                for (let i = 0; i < seedCount; i++) {
                    const idx = Math.floor(Math.random() * total);
                    cells[idx] = Math.floor(Math.random() * 40) + 10;
                }
            }

            // ─── 在指定位置放置细胞图案 ─────────────────────────────────
            function placePattern(gx, gy) {
                const patternSize = 3 + Math.floor(Math.random() * 3);
                const startX = gx - Math.floor(patternSize / 2);
                const startY = gy - Math.floor(patternSize / 2);
                for (let dy = 0; dy < patternSize; dy++) {
                    for (let dx = 0; dx < patternSize; dx++) {
                        const x = startX + dx;
                        const y = startY + dy;
                        if (x >= 0 && x < gridW && y >= 0 && y < gridH) {
                            const idx = y * gridW + x;
                            if (Math.random() < 0.75) {
                                cells[idx] = Math.floor(Math.random() * 30) + 5;
                            }
                        }
                    }
                }
            }

            // ─── 更新细胞自动机（康威生命游戏变体） ────────────────────
            function updateCells() {
                const w = gridW;
                const h = gridH;
                const len = w * h;

                // 鼠标扰动：在鼠标位置唤醒细胞
                if (mouse.active && mouse.gridX >= 0 && mouse.gridX < w && mouse.gridY >= 0 && mouse.gridY < h) {
                    const radius = 2;
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const gx = mouse.gridX + dx;
                            const gy = mouse.gridY + dy;
                            if (gx >= 0 && gx < w && gy >= 0 && gy < h) {
                                const idx = gy * w + gx;
                                if (Math.random() < 0.6) {
                                    cells[idx] = Math.floor(Math.random() * 15) + 3;
                                }
                            }
                        }
                    }
                }

                // 应用康威生命游戏规则
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = y * w + x;
                        const alive = cells[idx] > 0;
                        const age = cells[idx];

                        // 计算邻居数
                        let neighbors = 0;
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                const nx = (x + dx + w) % w;
                                const ny = (y + dy + h) % h;
                                if (cells[ny * w + nx] > 0) neighbors++;
                            }
                        }

                        if (alive) {
                            if (neighbors === 2 || neighbors === 3) {
                                // 存活：年龄增加，但不超过255
                                nextCells[idx] = Math.min(255, age + 1);
                            } else if (neighbors === 1 && age > 20) {
                                // 少量邻居且足够老：仍存活（变体规则）
                                nextCells[idx] = Math.min(255, age + 1);
                            } else {
                                nextCells[idx] = 0;
                            }
                        } else {
                            if (neighbors === 3) {
                                // 新生
                                nextCells[idx] = 1;
                            } else if (neighbors === 6 && Math.random() < 0.05) {
                                // 罕见的新生（变体规则）
                                nextCells[idx] = 1;
                            } else {
                                nextCells[idx] = 0;
                            }
                        }
                    }
                }

                // 交换缓冲区
                const temp = cells;
                cells = nextCells;
                nextCells = temp;

                generation++;
            }

            // ─── 渲染到离屏画布 ─────────────────────────────────────────
            function renderToOffscreen() {
                const data = imageData.data;
                const len = cells.length;

                for (let i = 0; i < len; i++) {
                    const age = cells[i];
                    const pixelIdx = i * 4;
                    if (age === 0) {
                        data[pixelIdx] = 10;
                        data[pixelIdx + 1] = 10;
                        data[pixelIdx + 2] = 20;
                        data[pixelIdx + 3] = 255;
                    } else {
                        const lutIdx = age;
                        const brightness = 0.85 + 0.15 * Math.sin(time * 3 + i);
                        data[pixelIdx] = Math.min(255, Math.round(colorLUT[lutIdx * 3] * brightness));
                        data[pixelIdx + 1] = Math.min(255, Math.round(colorLUT[lutIdx * 3 + 1] * brightness));
                        data[pixelIdx + 2] = Math.min(255, Math.round(colorLUT[lutIdx * 3 + 2] * brightness));
                        data[pixelIdx + 3] = 255;
                    }
                }

                offscreenCtx.putImageData(imageData, 0, 0);
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 50;
                const hue = 200 + Math.sin(time * 0.8) * 40;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 70%, 80%, 0.08)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    // 每4帧更新一次细胞自动机（约15fps更新，更流畅的渲染）
                    if (Math.floor(time * 60) % 4 === 0) {
                        updateCells();
                    }

                    // 自动重置，防止图案僵化
                    resetTimer++;
                    if (resetTimer > maxGenerations * 4) {
                        resetTimer = 0;
                        const targetCols = gridW;
                        const targetRows = gridH;
                        const newSeedCount = Math.floor(cells.length * 0.08);
                        for (let i = 0; i < newSeedCount; i++) {
                            const idx = Math.floor(Math.random() * cells.length);
                            cells[idx] = Math.floor(Math.random() * 30) + 5;
                        }
                    }
                }

                // 渲染到离屏画布
                renderToOffscreen();

                // 清除主画布
                ctx.fillStyle = '#0a0a18';
                ctx.fillRect(0, 0, W, H);

                // 将离屏画布缩放绘制到主画布
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(offscreenCanvas, 0, 0, gridW, gridH, 0, 0, W, H);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 更新鼠标网格坐标 ───────────────────────────────────────
            function updateMouseGridCoords() {
                if (mouse.active && mouse.x >= 0 && mouse.x <= W && mouse.y >= 0 && mouse.y <= H) {
                    mouse.gridX = Math.floor(mouse.x / cellSize);
                    mouse.gridY = Math.floor(mouse.y / cellSize);
                } else {
                    mouse.gridX = -1;
                    mouse.gridY = -1;
                }
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                updateMouseGridCoords();
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.gridX = -1;
                mouse.gridY = -1;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                updateMouseGridCoords();
                // 点击放置一个图案
                if (mouse.gridX >= 0 && mouse.gridX < gridW && mouse.gridY >= 0 && mouse.gridY < gridH) {
                    placePattern(mouse.gridX, mouse.gridY);
                }
                // 切换颜色查找表的偏移（通过重建LUT）
                buildColorLUT();
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    updateMouseGridCoords();
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    updateMouseGridCoords();
                    if (mouse.gridX >= 0 && mouse.gridX < gridW && mouse.gridY >= 0 && mouse.gridY < gridH) {
                        placePattern(mouse.gridX, mouse.gridY);
                    }
                    buildColorLUT();
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.gridX = -1;
                mouse.gridY = -1;
            }

            function onResize() {
                setupCanvas();
                initGrid();
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.gridX = -1;
                mouse.gridY = -1;
                generation = 0;
                resetTimer = 0;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initGrid();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 确保初始背景填充
            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0a0a18';
                    ctx.fillRect(0, 0, W, H);
                }
            });

        })();
    </script>
</body>
</html>
