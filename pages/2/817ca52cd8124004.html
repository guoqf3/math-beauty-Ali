<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>抛体运动 · 安全抛物线包络 | Projectile Motion</title>
<style>
  :root{
    --cyan:#5fe6ff;
    --pink:#ff6fd8;
    --gold:#ffd166;
    --line:rgba(95,230,255,.20);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#02050c;
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#bfe6ff;-webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;}
  #app canvas{display:block;}

  .panel{
    position:fixed;
    padding:14px 18px;
    border-radius:14px;
    background:linear-gradient(160deg, rgba(9,26,48,.66), rgba(4,12,24,.44));
    border:1px solid var(--line);
    box-shadow:0 0 34px rgba(0,140,255,.12), inset 0 0 22px rgba(0,120,200,.06);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    pointer-events:none;
    user-select:none;
    z-index:10;
  }

  /* ---------- 左上：标题 + 公式 ---------- */
  #hud-left{top:22px;left:22px;max-width:330px;}
  #hud-left h1{
    font-size:16px;font-weight:600;letter-spacing:.14em;
    color:#e8faff;margin-bottom:2px;
    text-shadow:0 0 16px rgba(95,230,255,.7);
  }
  #hud-left h1 span{
    display:block;font-size:9.5px;letter-spacing:.32em;
    color:rgba(95,230,255,.55);font-weight:400;margin-top:3px;
  }
  .divider{
    height:1px;margin:11px 0 10px;
    background:linear-gradient(90deg, rgba(95,230,255,.55), rgba(95,230,255,0) 90%);
  }
  .formula{
    font-family:Georgia,"Times New Roman","Songti SC",serif;
    font-size:13.5px;line-height:1.85;color:#a8d8f0;
    display:flex;align-items:baseline;gap:8px;white-space:nowrap;
  }
  .formula .lbl{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:10px;letter-spacing:.1em;color:rgba(95,230,255,.5);
    min-width:34px;flex:0 0 auto;
  }
  .formula i{font-style:italic;color:#dff6ff;}
  .formula.hl{color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.45);}
  .formula.hl i{color:#ffe9b0;}

  /* ---------- 右上：参数 ---------- */
  #hud-right{top:22px;right:22px;width:216px;}
  .stat{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;line-height:2.05;
    border-bottom:1px dashed rgba(95,230,255,.10);
    padding-bottom:1px;
  }
  .stat:last-child{border-bottom:none;}
  .stat span{color:rgba(150,200,230,.66);letter-spacing:.04em;}
  .stat b{
    font-weight:600;color:#7ef0ff;font-variant-numeric:tabular-nums;
    text-shadow:0 0 12px rgba(95,230,255,.5);
  }
  .stat b.gold{color:var(--gold);text-shadow:0 0 12px rgba(255,209,102,.5);}

  /* ---------- 底部图例 ---------- */
  #legend{
    left:50%;bottom:22px;transform:translateX(-50%);
    display:flex;gap:24px;align-items:center;
    padding:10px 24px;border-radius:100px;font-size:11.5px;
    letter-spacing:.06em;color:rgba(160,210,240,.78);
    white-space:nowrap;
  }
  #legend .dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:7px;vertical-align:middle;
  }
  .d1{background:#5fe6ff;box-shadow:0 0 12px #5fe6ff;}
  .d2{background:#ffd166;box-shadow:0 0 12px #ffd166;}
  .d3{background:#ff6fd8;box-shadow:0 0 12px #ff6fd8;}

  /* ---------- 启动遮罩 ---------- */
  #start-overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;
    background:radial-gradient(ellipse at 50% 45%, rgba(6,20,40,.72), rgba(2,5,12,.96) 72%);
    transition:opacity .9s ease, visibility .9s;
  }
  #start-overlay.hidden{opacity:0;visibility:hidden;}
  #start-overlay .tag{
    font-size:11px;letter-spacing:.55em;color:rgba(95,230,255,.55);
    text-transform:uppercase;
  }
  #start-overlay .big{
    font-size:clamp(22px,4vw,40px);font-weight:600;letter-spacing:.22em;
    color:#eafcff;text-shadow:0 0 40px rgba(95,230,255,.75), 0 0 90px rgba(80,160,255,.35);
  }
  #startBtn{
    pointer-events:auto;cursor:pointer;
    padding:14px 46px;border-radius:100px;
    font-size:14px;letter-spacing:.22em;font-weight:500;
    color:#eafcff;background:rgba(95,230,255,.08);
    border:1px solid rgba(95,230,255,.55);
    box-shadow:0 0 26px rgba(95,230,255,.28), inset 0 0 24px rgba(95,230,255,.10);
    transition:all .32s cubic-bezier(.2,.8,.3,1);
    font-family:inherit;
  }
  #startBtn:hover{
    background:rgba(95,230,255,.20);
    box-shadow:0 0 46px rgba(95,230,255,.6), inset 0 0 30px rgba(95,230,255,.22);
    transform:translateY(-2px) scale(1.03);
  }
  #startBtn:active{transform:translateY(0) scale(.99);}

  /* 角落装饰 */
  .corner{
    position:fixed;width:52px;height:52px;pointer-events:none;z-index:9;
    border-color:rgba(95,230,255,.30);border-style:solid;border-width:0;
  }
  .c-tl{top:14px;left:14px;border-top-width:1px;border-left-width:1px;}
  .c-tr{top:14px;right:14px;border-top-width:1px;border-right-width:1px;}
  .c-bl{bottom:14px;left:14px;border-bottom-width:1px;border-left-width:1px;}
  .c-br{bottom:14px;right:14px;border-bottom-width:1px;border-right-width:1px;}

  @media (max-width:760px){
    #hud-left{max-width:236px;padding:11px 13px;top:12px;left:12px;}
    #hud-left h1{font-size:13px;}
    .formula{font-size:11px;line-height:1.7;}
    .formula .lbl{min-width:26px;font-size:9px;}
    #hud-right{width:150px;padding:11px 12px;top:12px;right:12px;}
    .stat{font-size:10px;}
    #legend{gap:13px;font-size:9.5px;padding:8px 15px;bottom:12px;}
    .corner{display:none;}
  }
</style>
</head>
<body>

<div id="app"></div>

<!-- 左上角：公式面板 -->
<div id="hud-left" class="panel">
  <h1>抛体运动<span>PROJECTILE MOTION</span></h1>
  <div class="divider"></div>
  <div class="formula"><span class="lbl">水平</span><span><i>x</i> = <i>v</i>₀cos<i>θ</i> · <i>t</i></span></div>
  <div class="formula"><span class="lbl">竖直</span><span><i>y</i> = <i>v</i>₀sin<i>θ</i> · <i>t</i> − ½<i>gt</i>²</span></div>
  <div class="formula"><span class="lbl">轨迹</span><span><i>y</i> = <i>x</i>·tan<i>θ</i> − <i>gx</i>²/(2<i>v</i>₀²cos²<i>θ</i>)</span></div>
  <div class="formula"><span class="lbl">射程</span><span><i>R</i> = <i>v</i>₀²sin2<i>θ</i> / <i>g</i></span></div>
  <div class="formula hl"><span class="lbl">包络</span><span><i>y</i> = <i>v</i>₀²/(2<i>g</i>) − <i>gx</i>²/(2<i>v</i>₀²)</span></div>
</div>

<!-- 右上角：参数面板 -->
<div id="hud-right" class="panel">
  <div class="stat"><span>初速度 v₀</span><b>26.00 m/s</b></div>
  <div class="stat"><span>重力加速度 g</span><b>9.80 m/s²</b></div>
  <div class="stat"><span>发射角 θ</span><b>15° ~ 75°</b></div>
  <div class="stat"><span>最大射程 R</span><b class="gold">68.98 m</b></div>
  <div class="stat"><span>包络顶点</span><b class="gold">34.49 m</b></div>
</div>

<!-- 底部图例 -->
<div id="legend" class="panel">
  <span><i class="dot d1"></i>抛体实时轨迹</span>
  <span><i class="dot d2"></i>安全抛物线包络</span>
  <span><i class="dot d3"></i>抛物线顶点连线</span>
</div>

<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>
<div class="corner c-br"></div>

<!-- 启动遮罩 -->
<div id="start-overlay">
  <div class="tag">Ballistics · Envelope · Simulation</div>
  <div class="big">抛 体 运 动</div>
  <button id="startBtn">▶ 启动模拟 · 开启音效</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   0. 物理常量
   ========================================================= */
const G        = 9.8;          // 重力加速度
const V0       = 26;           // 初速度 (m/s)
const RADIUS   = 0.72;         // 小球半径
const ANG_MIN  = 15;
const ANG_MAX  = 75;
const ANG_N    = 13;           // 抛体个数
const MAX_TRAIL= 112;          // 尾迹最大点数
const PR       = Math.min(window.devicePixelRatio || 1, 2);

const SAFE_MAX_X = (V0 * V0) / G;          // 68.98
const APEX_MAX_Y = (V0 * V0) / (2 * G);    // 34.49

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* 背景渐变纹理 */
(function makeBackground() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 512;
  const ctx = c.getContext('2d');
  const grd = ctx.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0.00, '#08203c');
  grd.addColorStop(0.28, '#061529');
  grd.addColorStop(0.58, '#0a0a22');
  grd.addColorStop(0.82, '#05070f');
  grd.addColorStop(1.00, '#010206');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, 4, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.5, 1400);

const CAM_TARGET = new THREE.Vector3(30, 16, 0);
function updateCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.aspect = aspect;
  const fovRad = (camera.fov * Math.PI) / 180;
  const worldH = 58;   // 需要覆盖的竖直世界尺寸
  const worldW = 88;   // 需要覆盖的水平世界尺寸
  const dH = (worldH / 2) / Math.tan(fovRad / 2);
  const dW = (worldW / 2) / (Math.tan(fovRad / 2) * aspect);
  const dist = Math.max(dH, dW);
  camera.position.set(20, 31, dist);
  camera.lookAt(CAM_TARGET);
  camera.updateProjectionMatrix();
}
updateCamera();

/* =========================================================
   2. 地面网格 + 星空
   ========================================================= */
const grid = new THREE.GridHelper(200, 40, 0x2f8fc4, 0x0f3a58);
grid.position.set(35, 0, 0);
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

/* 地面发光横线（起点参考线） */
(function addAxes() {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-10, 0.02, 0),
    new THREE.Vector3(90, 0.02, 0)
  ]);
  const m = new THREE.LineBasicMaterial({ color: 0x5fe6ff, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending });
  scene.add(new THREE.Line(g, m));
})();

/* 星空点缀 */
(function addStars() {
  const N = 420;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 320 + Math.random() * 420;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 0.85);      // 偏上半球
    pos[i * 3]     = 30 + r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = 20 + r * Math.cos(phi) * 0.9;
    pos[i * 3 + 2] = -140 - r * Math.sin(phi) * Math.abs(Math.sin(theta)) * 0.7;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x8fd8ff, size: 1.6, sizeAttenuation: true,
    transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* =========================================================
   3. 安全抛物线（包络线）
   ========================================================= */
(function buildEnvelope() {
  const pts = [];
  const SEG = 240;
  for (let i = 0; i <= SEG; i++) {
    const x = (SAFE_MAX_X * i) / SEG;
    const y = APEX_MAX_Y - (G * x * x) / (2 * V0 * V0);
    pts.push(new THREE.Vector3(x, Math.max(y, 0), 0));
  }
  const curve = new THREE.CatmullRomCurve3(pts);

  // 内核亮线
  const coreGeo = new THREE.TubeGeometry(curve, 300, 0.14, 6, false);
  const coreMat = new THREE.MeshBasicMaterial({
    color: 0xfff2b0, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Mesh(coreGeo, coreMat));

  // 外发光
  const glowGeo = new THREE.TubeGeometry(curve, 300, 0.62, 8, false);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xffc95e, transparent: true, opacity: 0.14,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Mesh(glowGeo, glowMat));
})();

/* =========================================================
   4. 抛物线顶点连线
   ========================================================= */
(function buildApexCurve() {
  const pts = [];
  const SEG = 90;
  for (let i = 0; i <= SEG; i++) {
    const th = (i / SEG) * (Math.PI / 2 - 0.001) + 0.0005;
    const x = (V0 * V0 * Math.sin(th) * Math.cos(th)) / G;
    const y = (V0 * V0 * Math.sin(th) * Math.sin(th)) / (2 * G);
    pts.push(new THREE.Vector3(x, y, 0));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 140, 0.075, 6, false);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xff6fd8, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Mesh(geo, mat));
})();

/* =========================================================
   5. 工具：径向光晕贴图
   ========================================================= */
function makeGlowTexture() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.14)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const GLOW_TEX = makeGlowTexture();

/* =========================================================
   6. 抛体类
   ========================================================= */
const trailVert = /* glsl */`
  attribute float aLife;
  attribute float aSize;
  uniform float uPR;
  varying float vLife;
  void main(){
    vLife = aLife;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    float dist = max(-mv.z, 0.001);
    gl_PointSize = aSize * uPR * (300.0 / dist) * (0.30 + 0.90 * aLife);
    gl_Position = projectionMatrix * mv;
  }
`;

const trailFrag = /* glsl */`
  uniform vec3 uColor;
  varying float vLife;
  void main(){
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if (d > 0.5) discard;
    float a = smoothstep(0.5, 0.02, d);
    a = pow(a, 1.6);
    vec3 col = mix(uColor * 0.55, vec3(1.0), vLife * vLife * 0.65);
    gl_FragColor = vec4(col, a * vLife * 0.9);
  }
`;

class Projectile {
  constructor(angleDeg, color) {
    this.angleDeg = angleDeg;
    this.color = color;
    this.trail = [];
    this.pos = new THREE.Vector3();
    this.vel = new THREE.Vector3();
    this.resting = false;

    // ---- 小球 ----
    const sphereGeo = new THREE.SphereGeometry(RADIUS, 20, 14);
    const sphereMat = new THREE.MeshBasicMaterial({ color: color });
    this.mesh = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(this.mesh);

    // ---- 光晕 ----
    const haloMat = new THREE.SpriteMaterial({
      map: GLOW_TEX, color: color, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9
    });
    this.halo = new THREE.Sprite(haloMat);
    this.halo.scale.set(4.2, 4.2, 1);
    scene.add(this.halo);

    // ---- 尾迹点云 ----
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_TRAIL * 3), 3));
    geo.setAttribute('aLife',   new THREE.BufferAttribute(new Float32Array(MAX_TRAIL), 1));
    geo.setAttribute('aSize',   new THREE.BufferAttribute(new Float32Array(MAX_TRAIL).fill(2.0), 1));
    geo.setDrawRange(0, 0);

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(color) },
        uPR:    { value: PR }
      },
      vertexShader: trailVert,
      fragmentShader: trailFrag,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.trailPoints = new THREE.Points(geo, mat);
    this.trailPoints.frustumCulled = false;
    scene.add(this.trailPoints);

    this.reset();
  }

  reset() {
    const th = (this.angleDeg * Math.PI) / 180;
    this.pos.set(0, RADIUS, 0);
    this.vel.set(V0 * Math.cos(th), V0 * Math.sin(th), 0);
    this.trail.length = 0;
    this.resting = false;
    this.mesh.position.copy(this.pos);
    this.halo.position.copy(this.pos);
    this.trailPoints.geometry.setDrawRange(0, 0);
  }

  step(h) {
    if (this.resting) return;
    this.vel.y -= G * h;
    this.pos.x += this.vel.x * h;
    this.pos.y += this.vel.y * h;

    if (this.pos.y <= RADIUS && this.vel.y < 0) {
      this.pos.y = RADIUS;
      this.vel.y = -this.vel.y * 0.62;
      this.vel.x *= 0.90;
      if (Math.abs(this.vel.y) < 1.25 && Math.abs(this.vel.x) < 1.0) {
        this.vel.set(0, 0, 0);
        this.resting = true;
      }
    }
  }

  pushTrail() {
    this.trail.push(this.pos.clone());
    if (this.trail.length > MAX_TRAIL) this.trail.shift();
  }

  syncVisual(t) {
    this.mesh.position.copy(this.pos);
    this.halo.position.copy(this.pos);

    const pulse = 1 + 0.18 * Math.sin(t * 7 + this.angleDeg);
    this.halo.scale.set(4.2 * pulse, 4.2 * pulse, 1);

    const n = this.trail.length;
    const geo = this.trailPoints.geometry;
    const parr = geo.attributes.position.array;
    const larr = geo.attributes.aLife.array;
    const inv = n > 1 ? 1 / (n - 1) : 1;

    for (let i = 0; i < n; i++) {
      const v = this.trail[i];
      parr[i * 3]     = v.x;
      parr[i * 3 + 1] = v.y;
      parr[i * 3 + 2] = v.z;
      larr[i] = i * inv;
    }
    geo.attributes.position.needsUpdate = true;
    geo.attributes.aLife.needsUpdate = true;
    geo.setDrawRange(0, n);
  }
}

/* ---- 创建 13 个抛体 ---- */
const projectiles = [];
for (let i = 0; i < ANG_N; i++) {
  const deg = ANG_MIN + (i * (ANG_MAX - ANG_MIN)) / (ANG_N - 1);
  const hue = 0.47 + (i / (ANG_N - 1)) * 0.48;   // 青 → 蓝紫 → 品红
  const col = new THREE.Color().setHSL(hue % 1, 0.95, 0.62);
  projectiles.push(new Projectile(deg, col));
}

/* =========================================================
   7. 后期处理（辉光）
   ========================================================= */
let composer = null;
try {
  composer = new EffectComposer(renderer);
  composer.setSize(window.innerWidth, window.innerHeight);
  composer.addPass(new RenderPass(scene, camera));

  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.95,   // strength
    0.62,   // radius
    0.16    // threshold
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
} catch (err) {
  console.warn('后期处理初始化失败，回退到直接渲染：', err);
  composer = null;
}

/* =========================================================
   8. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let simTime = 0;
let restTimer = 0;

function stepPhysics(dt) {
  const SUB = 2;
  const h = dt / SUB;
  for (let s = 0; s < SUB; s++) {
    for (const p of projectiles) p.step(h);
  }
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  stepPhysics(dt);

  for (const p of projectiles) {
    p.pushTrail();
    p.syncVisual(simTime);
  }

  // 全部静止后短暂停留 → 重新抛射
  if (projectiles.every(p => p.resting)) {
    restTimer += dt;
    if (restTimer > 1.8) {
      restTimer = 0;
      for (const p of projectiles) p.reset();
    }
  } else {
    restTimer = 0;
  }

  if (composer) composer.render();
  else renderer.render(scene, camera);
}
animate();

/* =========================================================
   9. 窗口自适应
   ========================================================= */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    updateCamera();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  }, 80);
});

/* =========================================================
   10. 科技感背景音效（Web Audio 程序化合成 · 洁净版）
   ========================================================= */
let audioCtx = null;
let blipTimer = null;
let audioStopped = false;

function startAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  audioCtx = new AC();
  const ctx = audioCtx;
  audioStopped = false;

  /* ---------- 主输出链：master → 低通 → 压缩器 → destination ---------- */
  const compressor = ctx.createDynamicsCompressor();
  compressor.threshold.value = -20;   // 提前压缩，防止叠加削波
  compressor.knee.value      = 26;
  compressor.ratio.value     = 6;
  compressor.attack.value    = 0.012;
  compressor.release.value   = 0.35;

  const masterLP = ctx.createBiquadFilter();   // 总输出低通，消除刺耳高频与混叠
  masterLP.type = 'lowpass';
  masterLP.frequency.value = 3800;
  masterLP.Q.value = 0.6;

  const master = ctx.createGain();
  master.gain.value = 0.0001;

  master.connect(masterLP);
  masterLP.connect(compressor);
  compressor.connect(ctx.destination);

  /* ---------- 低频氛围铺底：纯正弦，极轻 detune ---------- */
  const padFilter = ctx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 170;
  padFilter.Q.value = 1.6;

  const padGain = ctx.createGain();
  padGain.gain.value = 0.16;
  padFilter.connect(padGain);
  padGain.connect(master);

  const baseFreqs = [55, 82.5, 110];
  baseFreqs.forEach((f, i) => {
    const o = ctx.createOscillator();
    o.type = 'sine';                    // 只用正弦，避免谐波与拍频杂音
    o.frequency.value = f;
    o.detune.value = (i - 1) * 3;       // ±3 音分，几乎无拍频

    const og = ctx.createGain();
    og.gain.value = i === 0 ? 0.55 : 0.30;

    o.connect(og);
    og.connect(padFilter);
    o.start();
  });

  /* ---------- 缓慢呼吸 LFO ---------- */
  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.045;

  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 90;              // 减小扫频幅度，避免音色突变
  lfo.connect(lfoGain);
  lfoGain.connect(padFilter.frequency);
  lfo.start();

  /* ---------- 延迟回声：低反馈 + 内置低通 ---------- */
  const delay = ctx.createDelay(1.5);
  delay.delayTime.value = 0.50;

  const dLP = ctx.createBiquadFilter();
  dLP.type = 'lowpass';
  dLP.frequency.value = 1500;           // 反馈路径里滤掉高频，防止"金属嗡"累积

  const fb = ctx.createGain();
  fb.gain.value = 0.20;                 // 避免自激

  delay.connect(dLP);
  dLP.connect(fb);
  fb.connect(delay);

  const delayWet = ctx.createGain();
  delayWet.gain.value = 0.28;
  delay.connect(delayWet);
  delayWet.connect(master);

  /* ---------- 随机闪烁音符：正弦 + 更柔和的包络 ---------- */
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00];
  let nextBlip = ctx.currentTime + 0.8;

  function schedule() {
    if (audioStopped || !audioCtx) return;
    const now = ctx.currentTime;
    while (nextBlip < now + 1.0) {
      const freq = SCALE[(Math.random() * SCALE.length) | 0];

      const o = ctx.createOscillator();
      o.type = 'sine';                  // 去掉三角波的高次谐波
      o.frequency.value = freq;

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, nextBlip);
      g.gain.exponentialRampToValueAtTime(0.022, nextBlip + 0.02);  // 音量减半
      g.gain.exponentialRampToValueAtTime(0.0001, nextBlip + 1.4);  // 拉长衰减更顺滑

      o.connect(g);
      g.connect(master);
      g.connect(delay);

      o.start(nextBlip);
      o.stop(nextBlip + 1.5);

      nextBlip += 0.55 + Math.random() * 1.6;
    }
    blipTimer = setTimeout(schedule, 500);
  }
  schedule();

  /* ---------- 淡入（用 setValueAtTime 保证起始值为正） ---------- */
  const t0 = ctx.currentTime;
  master.gain.cancelScheduledValues(t0);
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.exponentialRampToValueAtTime(0.45, t0 + 3.0);

  /* ---------- 切后台自动降音 ---------- */
  document.addEventListener('visibilitychange', () => {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const cur = Math.max(master.gain.value, 0.0001);
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(cur, t);
    master.gain.exponentialRampToValueAtTime(document.hidden ? 0.02 : 0.45, t + 1.0);
  });
}

/* =========================================================
   11. 启动交互
   ========================================================= */
const overlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  try { startAudio(); } catch (e) { console.warn('音频启动失败：', e); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

/* 页面卸载时彻底停止音频 */
window.addEventListener('beforeunload', () => {
  audioStopped = true;
  if (blipTimer) { clearTimeout(blipTimer); blipTimer = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
});
</script>
