<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>洛伦兹混沌吸引子 · Lorenz Attractor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000206;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #cfefff;
  }
  #scene { position: fixed; inset: 0; z-index: 0; }
  canvas { display: block; }

  .hud { position: fixed; z-index: 10; pointer-events: none; user-select: none; }

  /* ---- 标题 ---- */
  #title-block { top: 42px; left: 46px; }
  #title-block .en {
    font-size: 10px; letter-spacing: 5px; color: #3d7f9a;
    text-transform: uppercase; margin-bottom: 12px;
  }
  #title-block h1 {
    font-size: 26px; font-weight: 300; letter-spacing: 8px;
    color: #d8fbff;
    text-shadow: 0 0 12px rgba(34, 211, 238, .9),
                 0 0 34px rgba(8, 145, 178, .7),
                 0 0 70px rgba(6, 90, 130, .5);
  }
  #title-block .line {
    margin-top: 14px; width: 74px; height: 1px;
    background: linear-gradient(90deg, #22d3ee, rgba(34, 211, 238, 0));
    box-shadow: 0 0 10px #22d3ee;
  }

  /* ---- 方程 ---- */
  #eq-block { bottom: 52px; left: 46px; }
  #eq-block .cap {
    font-size: 10px; letter-spacing: 4px; color: #3d7f9a;
    margin-bottom: 14px; text-transform: uppercase;
  }
  #eq-block .eq {
    font-family: "Cambria Math", "Latin Modern Math", Georgia, serif;
    font-style: italic;
    font-size: 19px; line-height: 1.85; letter-spacing: .5px;
    color: #a8ecff;
    text-shadow: 0 0 10px rgba(34, 211, 238, .55);
  }
  #eq-block .eq .var { color: #ff9fe8; font-style: normal; }
  #eq-block .eq .op  { color: #6fb6d0; }
  #eq-block .params {
    margin-top: 16px; font-size: 11px; letter-spacing: 2.6px;
    color: #4f8ea8; font-family: "Consolas", monospace;
  }

  /* ---- 参数面板 ---- */
  #param-block { bottom: 54px; right: 46px; text-align: right; }
  #param-block .row {
    font-family: "Consolas", monospace;
    font-size: 11px; letter-spacing: 2.2px;
    color: #3f7a92; margin-bottom: 8px;
  }
  #param-block .row b {
    color: #7fe8ff; font-weight: 400;
    text-shadow: 0 0 8px rgba(34, 211, 238, .8);
  }

  /* ---- 提示 ---- */
  #hint {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 3px; color: #2c5a70;
    z-index: 10; pointer-events: none;
  }

  /* ---- 开场遮罩 ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 50%, #041018 0%, #000206 70%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; cursor: pointer;
    transition: opacity 1.2s ease;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay .enter {
    font-size: 14px; letter-spacing: 10px; color: #7fe8ff;
    padding: 20px 46px; border: 1px solid rgba(34, 211, 238, .35);
    border-radius: 2px;
    text-shadow: 0 0 16px rgba(34, 211, 238, .9);
    box-shadow: 0 0 30px rgba(34, 211, 238, .12),
                inset 0 0 30px rgba(34, 211, 238, .06);
    transition: all .45s ease;
    animation: breathe 3s ease-in-out infinite;
  }
  #overlay .enter:hover {
    background: rgba(34, 211, 238, .08);
    border-color: rgba(34, 211, 238, .8);
    box-shadow: 0 0 60px rgba(34, 211, 238, .3),
                inset 0 0 40px rgba(34, 211, 238, .12);
  }
  #overlay .tip {
    margin-top: 26px; font-size: 10px; letter-spacing: 4px; color: #2c5a70;
  }
  @keyframes breathe {
    0%, 100% { opacity: .78; }
    50%      { opacity: 1; }
  }

  @media (max-width: 760px) {
    #title-block { top: 26px; left: 22px; }
    #title-block h1 { font-size: 17px; letter-spacing: 4px; }
    #eq-block { bottom: 30px; left: 22px; }
    #eq-block .eq { font-size: 14px; }
    #param-block { bottom: 30px; right: 22px; }
    #param-block .row { font-size: 9px; letter-spacing: 1.4px; }
  }
</style>
</head>
<body>

<div id="scene"></div>

<div class="hud" id="title-block">
  <div class="en">Deterministic Chaos</div>
  <h1>洛伦兹吸引子</h1>
  <div class="line"></div>
</div>

<div class="hud" id="eq-block">
  <div class="cap">Lorenz Equations</div>
  <div class="eq">
    <div><span class="op">d</span>x<span class="op">/</span><span class="op">d</span>t <span class="op">=</span> σ ( y <span class="op">−</span> x )</div>
    <div><span class="op">d</span>y<span class="op">/</span><span class="op">d</span>t <span class="op">=</span> x ( ρ <span class="op">−</span> z ) <span class="op">−</span> y</div>
    <div><span class="op">d</span>z<span class="op">/</span><span class="op">d</span>t <span class="op">=</span> x y <span class="op">−</span> β z</div>
  </div>
  <div class="params">σ = 10.0 &nbsp;·&nbsp; ρ = 28.0 &nbsp;·&nbsp; β = 8/3</div>
</div>

<div class="hud" id="param-block">
  <div class="row">RK4 积分步长 <b>0.005</b></div>
  <div class="row">轨迹采样点 <b>20000</b></div>
  <div class="row">李雅普诺夫指数 <b>+0.906</b></div>
  <div class="row">分形维数 <b>≈ 2.06</b></div>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放</div>

<div id="overlay">
  <div class="enter">进 入 混 沌</div>
  <div class="tip">CLICK TO START</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================================
   1. 场景 / 相机 / 渲染器
   ========================================================= */
const container = document.getElementById('scene');

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 4000);
camera.position.set(6, 16, 62);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000206, 1);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.055;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.45;
controls.minDistance     = 22;
controls.maxDistance     = 220;
controls.enablePan       = false;
controls.target.set(0, 0, 0);

/* =========================================================
   2. 洛伦兹方程 RK4 数值积分
   ========================================================= */
const SIGMA = 10.0;
const RHO   = 28.0;
const BETA  = 8 / 3;

const DT = 0.005;    // 积分步长
const N  = 20000;    // 采样点数量
const S  = 0.62;     // 世界坐标缩放

function deriv(s, out) {
  out[0] = SIGMA * (s[1] - s[0]);
  out[1] = s[0] * (RHO - s[2]) - s[1];
  out[2] = s[0] * s[1] - BETA * s[2];
  return out;
}

const _k1 = [0, 0, 0], _k2 = [0, 0, 0], _k3 = [0, 0, 0], _k4 = [0, 0, 0];
const _tmp = [0, 0, 0];

function rk4(s, dt) {
  deriv(s, _k1);
  for (let i = 0; i < 3; i++) _tmp[i] = s[i] + dt * 0.5 * _k1[i];
  deriv(_tmp, _k2);
  for (let i = 0; i < 3; i++) _tmp[i] = s[i] + dt * 0.5 * _k2[i];
  deriv(_tmp, _k3);
  for (let i = 0; i < 3; i++) _tmp[i] = s[i] + dt * _k3[i];
  deriv(_tmp, _k4);
  for (let i = 0; i < 3; i++) {
    s[i] += dt / 6 * (_k1[i] + 2 * _k2[i] + 2 * _k3[i] + _k4[i]);
  }
  return s;
}

// ---- 生成轨迹点 & 顶点颜色 ----
const positions = new Float32Array(N * 3);
const colors    = new Float32Array(N * 3);

let state = [0.01, 0.0, 0.0];
// 预热：让初始点落到吸引子上
for (let i = 0; i < 3000; i++) rk4(state, DT);

const _c = new THREE.Color();
for (let i = 0; i < N; i++) {
  rk4(state, DT);

  // 物理坐标 (x, y, z) → 世界坐标 (x, z, y) 使 z 轴朝上
  positions[i * 3]     =  state[0] * S;
  positions[i * 3 + 1] = (state[2] - 25) * S;
  positions[i * 3 + 2] =  state[1] * S;

  // 色相：青 → 蓝 → 紫 → 品红 → 红 → 橙（降低亮度，避免过曝）
  const t = i / (N - 1);
  _c.setHSL((0.50 + 0.52 * t) % 1.0, 0.95, 0.40);
  colors[i * 3]     = _c.r;
  colors[i * 3 + 1] = _c.g;
  colors[i * 3 + 2] = _c.b;
}

/* =========================================================
   3. 主轨迹（渐进显现的发光飘带）
   ========================================================= */
const mainGeo = new THREE.BufferGeometry();
mainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
mainGeo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
mainGeo.setDrawRange(0, 0);

const mainMat = new THREE.LineBasicMaterial({
  vertexColors : true,
  transparent  : true,
  opacity      : 0.55,          // 0.95 → 0.55
  blending     : THREE.AdditiveBlending,
  depthWrite   : false,
});

const mainLine = new THREE.Line(mainGeo, mainMat);
mainLine.frustumCulled = false;
scene.add(mainLine);

// 用点云强化发光感（大幅压暗，避免糊成一团）
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
sparkGeo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
sparkGeo.setDrawRange(0, 0);

const sparkMat = new THREE.PointsMaterial({
  size            : 0.32,       // 0.55 → 0.32
  vertexColors    : true,
  transparent     : true,
  opacity         : 0.32,       // 0.9 → 0.32
  blending        : THREE.AdditiveBlending,
  depthWrite      : false,
  sizeAttenuation : true,
});

const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
sparkPoints.frustumCulled = false;
scene.add(sparkPoints);

/* =========================================================
   4. 沿轨道流动的发光头 + 尾迹
   ========================================================= */
const TAIL = 420;

const tailPos = new Float32Array(TAIL * 3);
const tailCol = new Float32Array(TAIL * 3);

(function buildTailColors() {
  const c = new THREE.Color();
  for (let k = 0; k < TAIL; k++) {
    const f = 1 - k / (TAIL - 1);        // 1 = 头部, 0 = 尾部
    const a = Math.pow(f, 2.4);          // 亮度衰减
    c.setHSL(0.86 - 0.36 * f, 0.95, 0.42);   // 亮度 0.52 → 0.42
    tailCol[k * 3]     = c.r * a;
    tailCol[k * 3 + 1] = c.g * a;
    tailCol[k * 3 + 2] = c.b * a;
  }
})();

const tailGeo = new THREE.BufferGeometry();
tailGeo.setAttribute('position',
  new THREE.BufferAttribute(tailPos, 3).setUsage(THREE.DynamicDrawUsage));
tailGeo.setAttribute('color', new THREE.BufferAttribute(tailCol, 3));
tailGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e5);

const tailMat = new THREE.LineBasicMaterial({
  vertexColors : true,
  transparent  : true,
  blending     : THREE.AdditiveBlending,
  depthWrite   : false,
});

const tailLine = new THREE.Line(tailGeo, tailMat);
tailLine.frustumCulled = false;
scene.add(tailLine);

/* ---- 头部光斑 ---- */
function makeGlowTexture() {
  const size = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(180,255,255,0.9)');
  g.addColorStop(0.45, 'rgba(60,200,255,0.35)');
  g.addColorStop(1.00, 'rgba(0,80,160,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const glowTex = makeGlowTexture();

const headSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map        : glowTex,
  color      : 0xaaf6ff,
  blending   : THREE.AdditiveBlending,
  transparent: true,
  depthWrite : false,
  opacity    : 0.65,            // 0.95 → 0.65
}));
headSprite.scale.set(3.6, 3.6, 1);   // 6.5 → 3.6
headSprite.frustumCulled = false;
scene.add(headSprite);

/* =========================================================
   5. 星空背景
   ========================================================= */
const STAR_COUNT = 7000;
const starPos = new Float32Array(STAR_COUNT * 3);
const starCol = new Float32Array(STAR_COUNT * 3);

(function buildStars() {
  const c = new THREE.Color();
  for (let i = 0; i < STAR_COUNT; i++) {
    const r     = 260 + Math.random() * 1000;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);

    starPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    starPos[i * 3 + 1] = r * Math.cos(phi);
    starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const tint = Math.random();
    if (tint < 0.62)      c.setHSL(0.58, 0.55, 0.82);   // 冷蓝
    else if (tint < 0.86) c.setHSL(0.09, 0.55, 0.80);   // 暖黄
    else                  c.setHSL(0.78, 0.60, 0.85);   // 品红

    const b = 0.25 + Math.random() * 0.75;
    starCol[i * 3]     = c.r * b;
    starCol[i * 3 + 1] = c.g * b;
    starCol[i * 3 + 2] = c.b * b;
  }
})();

const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('color',    new THREE.BufferAttribute(starCol, 3));

const starMat = new THREE.PointsMaterial({
  size            : 1.5,        // 1.7 → 1.5
  sizeAttenuation : false,
  map             : glowTex,
  vertexColors    : true,
  transparent     : true,
  opacity         : 0.6,        // 0.95 → 0.6
  blending        : THREE.AdditiveBlending,
  depthWrite      : false,
});

const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

/* =========================================================
   6. 后期处理：泛光（大幅收窄）
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.setSize(innerWidth, innerHeight);

composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.55,   // strength  1.35 → 0.55
  0.35,   // radius    0.62 → 0.35
  0.42    // threshold 0.12 → 0.42（只让最亮的部分发光）
);
composer.addPass(bloomPass);

/* =========================================================
   7. 动画驱动
   ========================================================= */
const REVEAL_SPEED = 2200;   // 每秒揭示的点数
const COMET_SPEED  = 430;    // 发光头每秒前进的点数

let revealProgress = 0;
let cometProgress  = 0;

const clock = new THREE.Clock();

function updateTail() {
  const base = Math.floor(cometProgress);
  const Nm = N;

  for (let k = 0; k < TAIL; k++) {
    let idx = base - k;
    if (idx < 0) idx = 0;
    idx = idx % Nm;

    const i3 = idx * 3;
    tailPos[k * 3]     = positions[i3];
    tailPos[k * 3 + 1] = positions[i3 + 1];
    tailPos[k * 3 + 2] = positions[i3 + 2];
  }

  tailGeo.attributes.position.needsUpdate = true;

  // 头部光斑位置
  const hi = Math.floor(cometProgress) % Nm;
  headSprite.position.set(
    positions[hi * 3],
    positions[hi * 3 + 1],
    positions[hi * 3 + 2]
  );

  // 轻微脉动（幅度同步缩小）
  const pulse = 3.4 + Math.sin(clock.elapsedTime * 5.0) * 0.5;   // 6.2 → 3.4
  headSprite.scale.set(pulse, pulse, 1);
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  // ---- 轨迹揭示 ----
  revealProgress += REVEAL_SPEED * dt;
  const drawn = Math.min(Math.floor(revealProgress), N);
  mainGeo.setDrawRange(0, drawn);
  sparkGeo.setDrawRange(0, drawn);

  // ---- 流光前进（循环）----
  cometProgress += COMET_SPEED * dt;
  if (cometProgress >= N) cometProgress -= N;

  updateTail();

  // ---- 星空缓慢自转 ----
  stars.rotation.y += dt * 0.006;
  stars.rotation.x += dt * 0.002;

  // ---- 泛光随流光呼吸（幅度同步降低）----
  bloomPass.strength = 0.50 + Math.sin(clock.elapsedTime * 1.6) * 0.08;

  controls.update();
  composer.render();
}

/* =========================================================
   8. 窗口自适应
   ========================================================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});

/* =========================================================
   9. 科技感背景音效（Web Audio 实时合成）
   ========================================================= */
let audioStarted = false;

function startAudio() {
  if (audioStarted) return;
  audioStarted = true;

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();

  // ---- 总输出 ----
  const master = ctx.createGain();
  master.gain.value = 0.0001;
  master.connect(ctx.destination);
  master.gain.exponentialRampToValueAtTime(0.30, ctx.currentTime + 4.0);

  // ---- 简易反馈延迟（空间感）----
  const delay = ctx.createDelay(1.5);
  delay.delayTime.value = 0.42;
  const feedback = ctx.createGain();
  feedback.gain.value = 0.36;
  const wet = ctx.createGain();
  wet.gain.value = 0.30;
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(wet);
  wet.connect(master);

  // ---- 低频 drone ----
  const droneFilter = ctx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = 340;
  droneFilter.Q.value = 7;
  droneFilter.connect(master);

  const droneGain = ctx.createGain();
  droneGain.gain.value = 0.16;
  droneGain.connect(droneFilter);

  const droneFreqs = [55.0, 82.41, 110.0, 138.59, 220.0];
  droneFreqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    osc.type = (i % 2 === 0) ? 'sine' : 'triangle';
    osc.frequency.value = f * (1 + (Math.random() - 0.5) * 0.008);
    const g = ctx.createGain();
    g.gain.value = 0.55 / (i + 1);
    osc.connect(g);
    g.connect(droneGain);
    osc.start();
  });

  // ---- 滤波器缓慢扫频 ----
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.045;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 210;
  lfo.connect(lfoGain);
  lfoGain.connect(droneFilter.frequency);
  lfo.start();

  // ---- 随机高频 ping ----
  const scale = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];

  function ping() {
    const now = ctx.currentTime;
    const semi = scale[Math.floor(Math.random() * scale.length)];
    const oct  = Math.floor(Math.random() * 2);
    const freq = 523.25 * Math.pow(2, (semi + 12 * oct) / 12);

    const osc = ctx.createOscillator();
    osc.type = Math.random() > 0.5 ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(freq, now);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.085, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.3);

    osc.connect(g);
    g.connect(master);
    g.connect(delay);

    osc.start(now);
    osc.stop(now + 2.5);
  }

  setInterval(() => {
    if (Math.random() < 0.78) ping();
  }, 1350);

  // ---- 偶尔的低频扫频冲击 ----
  setInterval(() => {
    if (Math.random() > 0.55) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(42, now + 1.8);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.05, now + 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);

    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 900;

    osc.connect(f);
    f.connect(g);
    g.connect(master);
    g.connect(delay);
    osc.start(now);
    osc.stop(now + 2.1);
  }, 5200);
}

/* =========================================================
   10. 启动
   ========================================================= */
const overlay = document.getElementById('overlay');

function boot() {
  overlay.classList.add('hide');
  startAudio();
}

overlay.addEventListener('click', boot);
overlay.addEventListener('touchstart', boot, { passive: true });

// 立即开始渲染（无需等待音频）
animate();
