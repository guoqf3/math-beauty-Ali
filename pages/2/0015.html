<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>流体星云 · 粒子宇宙</title>
    <style>
        :root {
            --bg-base: #060612;
            --bg-glow-1: rgba(120, 40, 200, 0.12);
            --bg-glow-2: rgba(20, 140, 200, 0.08);
            --bg-glow-3: rgba(220, 80, 140, 0.06);
            --text-color: rgba(220, 220, 240, 0.65);
            --text-glow: rgba(180, 160, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-base);
            font-family: 'Inter', 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            overscroll-behavior: none;
        }

        /* 背景光晕层 —— 防止黑屏的 CSS 兜底 */
        .bg-aurora {
            position: fixed;
            inset: -20%;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 45% 40% at 20% 30%, var(--bg-glow-1), transparent 70%),
                radial-gradient(ellipse 50% 45% at 75% 20%, var(--bg-glow-2), transparent 70%),
                radial-gradient(ellipse 40% 50% at 55% 70%, var(--bg-glow-3), transparent 70%),
                radial-gradient(ellipse 35% 35% at 85% 75%, rgba(150, 60, 220, 0.05), transparent 70%),
                var(--bg-base);
            animation: auroraDrift 24s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes auroraDrift {
            0% {
                transform: translate(0%, 0%) scale(1);
                opacity: 0.85;
            }
            33% {
                transform: translate(-2%, 1.5%) scale(1.06);
                opacity: 1;
            }
            66% {
                transform: translate(1.5%, -1%) scale(1.03);
                opacity: 0.92;
            }
            100% {
                transform: translate(-1%, 2%) scale(1.08);
                opacity: 1;
            }
        }

        /* PixiJS Canvas 容器 */
        #pixi-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: auto;
        }

        #pixi-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 极简文字层 */
        .overlay-text {
            position: fixed;
            z-index: 2;
            pointer-events: none;
            color: var(--text-color);
            letter-spacing: 0.18em;
            font-weight: 300;
            text-shadow: 0 0 24px var(--text-glow);
        }

        .overlay-text.top-left {
            top: 32px;
            left: 40px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.32em;
            opacity: 0.75;
        }

        .overlay-text.bottom-right {
            bottom: 28px;
            right: 40px;
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            opacity: 0.55;
            text-align: right;
        }

        @media (max-width: 600px) {
            .overlay-text.top-left {
                top: 18px;
                left: 20px;
                font-size: 0.58rem;
                letter-spacing: 0.22em;
            }
            .overlay-text.bottom-right {
                bottom: 16px;
                right: 20px;
                font-size: 0.5rem;
                letter-spacing: 0.14em;
            }
        }

        /* 加载指示器（快速消失） */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-base);
            transition: opacity 0.6s ease-out;
            pointer-events: none;
        }
        #loader.hidden {
            opacity: 0;
        }
        .loader-dot {
            width: 6px;
            height: 6px;
            margin: 0 6px;
            border-radius: 50%;
            background: rgba(180, 160, 255, 0.7);
            animation: loaderPulse 1.2s ease-in-out infinite;
        }
        .loader-dot:nth-child(2) {
            animation-delay: 0.15s;
            background: rgba(100, 210, 230, 0.7);
        }
        .loader-dot:nth-child(3) {
            animation-delay: 0.3s;
            background: rgba(230, 120, 170, 0.7);
        }
        @keyframes loaderPulse {
            0%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- CSS 背景兜底 -->
    <div class="bg-aurora"></div>

    <!-- PixiJS 容器 -->
    <div id="pixi-container"></div>

    <!-- 极简文字 -->
    <div class="overlay-text top-left">Fluid Nebula</div>
    <div class="overlay-text bottom-right">move · click · breathe</div>

    <!-- 加载指示器 -->
    <div id="loader">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ──────────────────────────── 配置 ────────────────────────────
            const CONFIG = {
                // 粒子数量（会根据屏幕面积调整）
                baseParticleCount: 2200,
                minParticleCount: 900,
                maxParticleCount: 3200,
                // 粒子纹理大小
                textureSize: 32,
                // 星系数量
                galaxyCount: 4,
                // 鼠标影响半径
                mouseRadius: 140,
                mouseAttractionStrength: 0.045,
                // 波纹参数
                rippleMaxRadius: 260,
                rippleExpansionSpeed: 5.2,
                rippleFadeSpeed: 0.018,
                ripplePushStrength: 3.2,
                // 音效参数
                audioVolume: 0.28,
                audioFreqBase: 310,
                audioFreqHarmonic: 465,
                // 动画速度
                globalSpeed: 1.0,
            };

            // ──────────────────────────── 工具函数 ────────────────────────────
            function lerp(a, b, t) { return a + (b - a) * t; }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            function smoothstep(t) { return t * t * (3 - 2 * t); }

            function randomRange(min, max) { return min + Math.random() * (max - min); }

            // 简化伪随机噪声（多正弦叠加）
            function fluidNoise(x, y, t) {
                return Math.sin(x * 0.012 + t * 0.6) * Math.cos(y * 0.009 - t * 0.45) +
                    Math.sin((x + y) * 0.006 + t * 0.38) * 0.7 +
                    Math.cos(x * 0.018 - y * 0.015 + t * 0.52) * 0.5;
            }

            // ──────────────────────────── 音效系统 ────────────────────────────
            class BreathAudio {
                constructor() {
                    this.ctx = null;
                    this.initialized = false;
                    this.masterGain = null;
                }

                init() {
                    if (this.initialized) return;
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (!AudioCtx) return;
                        this.ctx = new AudioCtx();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.value = CONFIG.audioVolume;
                        this.masterGain.connect(this.ctx.destination);
                        this.initialized = true;
                    } catch (e) {
                        console.warn('AudioContext 初始化失败:', e);
                    }
                }

                /**
                 * 播放呼吸感音效
                 * 柔和的多层音色 + 噪声气流 + 自然衰减
                 */
                playBreath() {
                    if (!this.initialized || !this.ctx) return;
                    const ctx = this.ctx;
                    const now = ctx.currentTime;
                    const duration = 0.85 + Math.random() * 0.3;

                    // ─── 主振荡器 ───
                    const osc1 = ctx.createOscillator();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(CONFIG.audioFreqBase, now);
                    // 轻微频率滑动（模拟呼吸起伏）
                    osc1.frequency.exponentialRampToValueAtTime(
                        CONFIG.audioFreqBase * 0.88,
                        now + duration * 0.7
                    );

                    // ─── 和声振荡器（纯五度，更温暖） ───
                    const osc2 = ctx.createOscillator();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(CONFIG.audioFreqHarmonic, now);
                    osc2.frequency.exponentialRampToValueAtTime(
                        CONFIG.audioFreqHarmonic * 0.85,
                        now + duration * 0.65
                    );
                    const osc2Gain = ctx.createGain();
                    osc2Gain.gain.setValueAtTime(0.38, now);
                    osc2Gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

                    // ─── 噪声成分（气流声） ───
                    const noiseBuffer = this._createNoiseBuffer(ctx);
                    const noiseSrc = ctx.createBufferSource();
                    noiseSrc.buffer = noiseBuffer;
                    noiseSrc.loop = true;
                    const noiseFilter = ctx.createBiquadFilter();
                    noiseFilter.type = 'lowpass';
                    noiseFilter.frequency.setValueAtTime(1800, now);
                    noiseFilter.frequency.exponentialRampToValueAtTime(500, now + duration);
                    noiseFilter.Q.setValueAtTime(0.6, now);
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.06, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.9);

                    noiseSrc.connect(noiseFilter);
                    noiseFilter.connect(noiseGain);
                    noiseGain.connect(this.masterGain);

                    // ─── 主音量包络 ───
                    const envGain = ctx.createGain();
                    envGain.gain.setValueAtTime(0.001, now);
                    envGain.gain.exponentialRampToValueAtTime(1.0, now + 0.035);
                    envGain.gain.exponentialRampToValueAtTime(0.12, now + duration * 0.5);
                    envGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    osc1.connect(envGain);
                    envGain.connect(this.masterGain);
                    osc2.connect(osc2Gain);
                    osc2Gain.connect(this.masterGain);

                    // ─── 启动与停止 ───
                    osc1.start(now);
                    osc1.stop(now + duration + 0.05);
                    osc2.start(now);
                    osc2.stop(now + duration + 0.05);
                    noiseSrc.start(now);
                    noiseSrc.stop(now + duration + 0.05);

                    // 清理
                    osc1.onended = () => { osc1.disconnect();
                        envGain.disconnect(); };
                    osc2.onended = () => { osc2.disconnect();
                        osc2Gain.disconnect(); };
                    noiseSrc.onended = () => { noiseSrc.disconnect();
                        noiseFilter.disconnect();
                        noiseGain.disconnect(); };
                }

                _createNoiseBuffer(ctx) {
                    const length = ctx.sampleRate * 2;
                    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    let lastOut = 0;
                    for (let i = 0; i < length; i++) {
                        // 布朗噪声（更柔和）
                        const white = Math.random() * 2 - 1;
                        lastOut = (lastOut + 0.02 * white) / 1.02;
                        data[i] = lastOut * 3.2;
                    }
                    return buffer;
                }
            }

            const breathAudio = new BreathAudio();

            // ──────────────────────────── 颜色系统 ────────────────────────────
            const GALAXY_COLORS = [
                { r: 170, g: 100, b: 230 }, // 紫罗兰
                { r: 80, g: 200, b: 220 }, // 青色
                { r: 230, g: 150, b: 90 }, // 金色
                { r: 100, g: 120, b: 255 }, // 蓝紫
            ];

            const GALAXY_TINTS = GALAXY_COLORS.map(c => (c.r << 16) | (c.g << 8) | c.b);

            function blendTints(tintA, tintB, t) {
                const ra = (tintA >> 16) & 0xFF,
                    ga = (tintA >> 8) & 0xFF,
                    ba = tintA & 0xFF;
                const rb = (tintB >> 16) & 0xFF,
                    gb = (tintB >> 8) & 0xFF,
                    bb = tintB & 0xFF;
                const r = Math.round(lerp(ra, rb, t));
                const g = Math.round(lerp(ga, gb, t));
                const b = Math.round(lerp(ba, bb, t));
                return (r << 16) | (g << 8) | b;
            }

            // ──────────────────────────── 主应用 ────────────────────────────
            class NebulaApp {
                constructor() {
                    this.app = null;
                    this.particleContainer = null;
                    this.particleTexture = null;
                    this.particles = [];
                    this.galaxies = [];
                    this.ripples = [];
                    this.mouseX = -9999;
                    this.mouseY = -9999;
                    this.mouseVX = 0;
                    this.mouseVY = 0;
                    this.prevMouseX = -9999;
                    this.prevMouseY = -9999;
                    this.width = 0;
                    this.height = 0;
                    this.dpr = 1;
                    this.isMobile = false;
                    this.time = 0;
                    this.rippleGraphics = null;
                    this.starSprites = [];
                    this.bgLightSprites = [];
                    this.disposed = false;
                    this.frameCount = 0;
                }

                async init() {
                    try {
                        // 检测移动端
                        this.isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(
                            navigator.userAgent) ||
                            (navigator.maxTouchPoints > 1 && window.innerWidth < 768);

                        this.width = window.innerWidth;
                        this.height = window.innerHeight;
                        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

                        // 计算粒子数量
                        const area = this.width * this.height;
                        const density = area / (1920 * 1080);
                        let particleCount = Math.round(CONFIG.baseParticleCount * clamp(density, 0.5, 1.4));
                        particleCount = clamp(particleCount, CONFIG.minParticleCount, CONFIG.maxParticleCount);
                        if (this.isMobile) particleCount = Math.round(particleCount * 0.55);

                        // 初始化 PixiJS Application
                        this.app = new PIXI.Application({
                            width: this.width,
                            height: this.height,
                            backgroundColor: 0x060612,
                            antialias: true,
                            resolution: this.dpr,
                            autoDensity: true,
                            powerPreference: 'high-performance',
                            clearBeforeRender: true,
                            sharedTicker: false,
                            autoStart: false,
                        });

                        const container = document.getElementById('pixi-container');
                        if (!container) throw new Error('容器未找到');
                        container.appendChild(this.app.view);

                        // 创建粒子纹理
                        this.particleTexture = this._createParticleTexture(CONFIG.textureSize);

                        // 创建粒子容器
                        this.particleContainer = new PIXI.ParticleContainer(particleCount, {
                            position: true,
                            scale: true,
                            rotation: false,
                            uvs: false,
                            alpha: true,
                            tint: true,
                        });
                        this.particleContainer.blendMode = PIXI.BLEND_MODES.ADD;
                        this.app.stage.addChild(this.particleContainer);

                        // 创建波纹图形层
                        this.rippleGraphics = new PIXI.Graphics();
                        this.rippleGraphics.blendMode = PIXI.BLEND_MODES.ADD;
                        this.app.stage.addChild(this.rippleGraphics);

                        // 创建星系中心
                        this._createGalaxies();

                        // 创建粒子
                        this._createParticles(particleCount);

                        // 创建背景光斑（大而模糊的发光点）
                        this._createBackgroundLights();

                        // 创建闪烁星星
                        this._createStarSprites();

                        // 设置事件监听
                        this._setupEvents();

                        // 启动渲染循环
                        this.app.ticker.maxFPS = 60;
                        this.app.ticker.add((delta) => this._update(delta));
                        this.app.ticker.start();

                        // 隐藏加载指示器
                        const loader = document.getElementById('loader');
                        if (loader) {
                            loader.classList.add('hidden');
                            setTimeout(() => { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 800);
                        }

                        // 初始化音频（在用户首次交互时）
                        this._setupAudioInit();

                        console.log(`[Nebula] 初始化完成 | 粒子: ${particleCount} | 尺寸: ${this.width}×${this.height} | DPR: ${this.dpr}`);
                    } catch (err) {
                        console.error('[Nebula] 初始化失败:', err);
                        // 显示备用提示
                        const loader = document.getElementById('loader');
                        if (loader) {
                            loader.innerHTML = '<span style="color:rgba(200,180,255,0.8);font-size:0.8rem;letter-spacing:0.15em;">✦ 星云加载失败 ✦</span>';
                            loader.style.opacity = '1';
                        }
                        // 确保背景仍然可见
                        document.querySelector('.bg-aurora').style.opacity = '1';
                    }
                }

                _createParticleTexture(size) {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const half = size / 2;
                    const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
                    gradient.addColorStop(0, 'rgba(255,255,255,1)');
                    gradient.addColorStop(0.18, 'rgba(255,255,255,0.9)');
                    gradient.addColorStop(0.42, 'rgba(255,255,255,0.55)');
                    gradient.addColorStop(0.7, 'rgba(255,255,255,0.2)');
                    gradient.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, size, size);
                    return PIXI.Texture.from(canvas);
                }

                _createGalaxies() {
                    const w = this.width;
                    const h = this.height;
                    const positions = [
                        { x: w * 0.26, y: h * 0.30, driftAmpX: w * 0.06, driftAmpY: h * 0.05, driftSpeed: 0.11 },
                        { x: w * 0.72, y: h * 0.22, driftAmpX: w * 0.07, driftAmpY: h * 0.04, driftSpeed: 0.09 },
                        { x: w * 0.20, y: h * 0.72, driftAmpX: w * 0.05, driftAmpY: h * 0.06, driftSpeed: 0.13 },
                        { x: w * 0.75, y: h * 0.68, driftAmpX: w * 0.08, driftAmpY: h * 0.07, driftSpeed: 0.10 },
                    ];
                    for (let i = 0; i < CONFIG.galaxyCount; i++) {
                        this.galaxies.push({
                            baseX: positions[i].x,
                            baseY: positions[i].y,
                            driftAmpX: positions[i].driftAmpX,
                            driftAmpY: positions[i].driftAmpY,
                            driftSpeed: positions[i].driftSpeed,
                            phase: Math.random() * Math.PI * 2,
                            currentX: positions[i].x,
                            currentY: positions[i].y,
                            color: GALAXY_TINTS[i],
                            particleCount: 0,
                        });
                    }
                }

                _createParticles(count) {
                    const w = this.width;
                    const h = this.height;
                    const particlesPerGalaxy = Math.floor(count / CONFIG.galaxyCount);
                    const remainder = count % CONFIG.galaxyCount;
                    const totalGalaxies = CONFIG.galaxyCount;

                    for (let g = 0; g < totalGalaxies; g++) {
                        const galaxy = this.galaxies[g];
                        const extraParticle = g < remainder ? 1 : 0;
                        const numForGalaxy = particlesPerGalaxy + extraParticle;
                        galaxy.particleCount = numForGalaxy;

                        for (let i = 0; i < numForGalaxy; i++) {
                            const sprite = new PIXI.Sprite(this.particleTexture);
                            sprite.anchor.set(0.5, 0.5);

                            // 轨道参数
                            const orbitRadiusX = randomRange(w * 0.04, w * 0.25) * randomRange(0.6, 1.4);
                            const orbitRadiusY = orbitRadiusX * randomRange(0.45, 0.9);
                            const orbitAngle = Math.random() * Math.PI * 2;
                            const orbitSpeed = randomRange(0.06, 0.28) * (Math.random() < 0.5 ? 1 : -1);
                            const orbitEllipticity = randomRange(0.25, 0.85);

                            // 大小
                            const sizeScale = randomRange(0.35, 2.8);
                            sprite.scale.set(sizeScale, sizeScale);

                            // 透明度
                            const alpha = randomRange(0.25, 0.85);
                            sprite.alpha = alpha;

                            // 颜色：基础星系色 + 轻微变化
                            const colorJitter = randomRange(-18, 18);
                            const baseTint = galaxy.color;
                            const r = clamp(((baseTint >> 16) & 0xFF) + colorJitter, 0, 255);
                            const gg = clamp(((baseTint >> 8) & 0xFF) + colorJitter * 0.7, 0, 255);
                            const b = clamp((baseTint & 0xFF) + colorJitter * 0.5, 0, 255);
                            sprite.tint = (r << 16) | (gg << 8) | b;

                            // 随机扰动参数
                            const noisePhaseX = Math.random() * Math.PI * 2;
                            const noisePhaseY = Math.random() * Math.PI * 2;
                            const noiseAmpX = randomRange(6, 30);
                            const noiseAmpY = randomRange(6, 30);
                            const noiseSpeedX = randomRange(0.15, 0.45);
                            const noiseSpeedY = randomRange(0.12, 0.4);

                            // 存储粒子数据
                            const particleData = {
                                sprite,
                                galaxyIndex: g,
                                orbitRadiusX,
                                orbitRadiusY,
                                orbitAngle,
                                orbitSpeed,
                                orbitEllipticity,
                                noisePhaseX,
                                noisePhaseY,
                                noiseAmpX,
                                noiseAmpY,
                                noiseSpeedX,
                                noiseSpeedY,
                                alpha,
                                baseAlpha: alpha,
                                twinkleSpeed: randomRange(0.3, 1.8),
                                twinklePhase: Math.random() * Math.PI * 2,
                                isStar: Math.random() < 0.04, // 4% 粒子作为闪烁星星
                            };

                            this.particles.push(particleData);
                            this.particleContainer.addChild(sprite);
                        }
                    }

                    // 额外添加一些散布在背景中的粒子（填充空间）
                    const extraCount = Math.floor(count * 0.08);
                    for (let i = 0; i < extraCount; i++) {
                        const sprite = new PIXI.Sprite(this.particleTexture);
                        sprite.anchor.set(0.5, 0.5);
                        const sizeScale = randomRange(0.2, 1.2);
                        sprite.scale.set(sizeScale, sizeScale);
                        sprite.alpha = randomRange(0.12, 0.4);
                        const r = Math.round(randomRange(140, 220));
                        const gg = Math.round(randomRange(140, 220));
                        const b = Math.round(randomRange(180, 255));
                        sprite.tint = (r << 16) | (gg << 8) | b;

                        const galaxyIndex = Math.floor(Math.random() * CONFIG.galaxyCount);
                        const particleData = {
                            sprite,
                            galaxyIndex,
                            orbitRadiusX: randomRange(w * 0.3, w * 0.55),
                            orbitRadiusY: randomRange(h * 0.2, h * 0.45),
                            orbitAngle: Math.random() * Math.PI * 2,
                            orbitSpeed: randomRange(0.02, 0.08) * (Math.random() < 0.5 ? 1 : -1),
                            orbitEllipticity: randomRange(0.4, 0.9),
                            noisePhaseX: Math.random() * Math.PI * 2,
                            noisePhaseY: Math.random() * Math.PI * 2,
                            noiseAmpX: randomRange(15, 50),
                            noiseAmpY: randomRange(15, 50),
                            noiseSpeedX: randomRange(0.05, 0.2),
                            noiseSpeedY: randomRange(0.04, 0.18),
                            alpha: randomRange(0.1, 0.35),
                            baseAlpha: 0.25,
                            twinkleSpeed: randomRange(0.2, 1.2),
                            twinklePhase: Math.random() * Math.PI * 2,
                            isStar: false,
                        };
                        this.particles.push(particleData);
                        this.particleContainer.addChild(sprite);
                    }
                }

                _createBackgroundLights() {
                    const lightColors = [0x2a1040, 0x0a2840, 0x301030, 0x101840];
                    for (let i = 0; i < 6; i++) {
                        const gfx = new PIXI.Graphics();
                        const radius = randomRange(this.width * 0.12, this.width * 0.3);
                        const cx = randomRange(this.width * 0.05, this.width * 0.95);
                        const cy = randomRange(this.height * 0.05, this.height * 0.95);
                        const color = lightColors[i % lightColors.length];
                        const alpha = randomRange(0.04, 0.1);
                        gfx.beginFill(color, alpha);
                        gfx.drawCircle(0, 0, radius);
                        gfx.endFill();
                        gfx.position.set(cx, cy);
                        gfx.blendMode = PIXI.BLEND_MODES.ADD;
                        gfx.alpha = randomRange(0.3, 0.7);
                        this.app.stage.addChildAt(gfx, 0);
                        this.bgLightSprites.push({
                            gfx,
                            baseX: cx,
                            baseY: cy,
                            radius,
                            phaseX: Math.random() * Math.PI * 2,
                            phaseY: Math.random() * Math.PI * 2,
                            speedX: randomRange(0.02, 0.08),
                            speedY: randomRange(0.015, 0.07),
                            ampX: randomRange(10, 50),
                            ampY: randomRange(10, 50),
                            baseAlpha: gfx.alpha,
                        });
                    }
                }

                _createStarSprites() {
                    // 少量明亮的大光点
                    const starCount = 30;
                    for (let i = 0; i < starCount; i++) {
                        const sprite = new PIXI.Sprite(this.particleTexture);
                        sprite.anchor.set(0.5, 0.5);
                        const scale = randomRange(3, 7);
                        sprite.scale.set(scale, scale);
                        const x = randomRange(this.width * 0.05, this.width * 0.95);
                        const y = randomRange(this.height * 0.05, this.height * 0.95);
                        sprite.position.set(x, y);
                        sprite.alpha = randomRange(0.3, 0.7);
                        const r = Math.round(randomRange(200, 255));
                        const gg = Math.round(randomRange(200, 255));
                        const b = Math.round(randomRange(220, 255));
                        sprite.tint = (r << 16) | (gg << 8) | b;
                        sprite.blendMode = PIXI.BLEND_MODES.ADD;
                        this.app.stage.addChild(sprite);
                        this.starSprites.push({
                            sprite,
                            baseX: x,
                            baseY: y,
                            baseAlpha: sprite.alpha,
                            twinkleSpeed: randomRange(0.4, 2.0),
                            twinklePhase: Math.random() * Math.PI * 2,
                            driftAmp: randomRange(3, 12),
                            driftSpeed: randomRange(0.03, 0.1),
                            driftPhase: Math.random() * Math.PI * 2,
                        });
                    }
                }

                _setupEvents() {
                    const canvas = this.app.view;

                    canvas.addEventListener('pointermove', (e) => {
                        const rect = canvas.getBoundingClientRect();
                        const newX = e.clientX - rect.left;
                        const newY = e.clientY - rect.top;
                        // 计算鼠标速度
                        this.mouseVX = newX - (this.prevMouseX >= 0 ? this.prevMouseX : newX);
                        this.mouseVY = newY - (this.prevMouseY >= 0 ? this.prevMouseY : newY);
                        this.prevMouseX = this.mouseX;
                        this.prevMouseY = this.mouseY;
                        this.mouseX = newX;
                        this.mouseY = newY;
                    });

                    canvas.addEventListener('pointerdown', (e) => {
                        breathAudio.init();
                        const rect = canvas.getBoundingClientRect();
                        const clickX = e.clientX - rect.left;
                        const clickY = e.clientY - rect.top;
                        this.mouseX = clickX;
                        this.mouseY = clickY;
                        this.prevMouseX = clickX;
                        this.prevMouseY = clickY;
                        this._spawnRipple(clickX, clickY);
                        // 播放呼吸音效
                        breathAudio.playBreath();
                    });

                    canvas.addEventListener('pointerleave', () => {
                        this.mouseX = -9999;
                        this.mouseY = -9999;
                        this.prevMouseX = -9999;
                        this.prevMouseY = -9999;
                        this.mouseVX = 0;
                        this.mouseVY = 0;
                    });

                    // 触摸设备支持
                    canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        breathAudio.init();
                        const touch = e.touches[0];
                        if (touch) {
                            const rect = canvas.getBoundingClientRect();
                            const tx = touch.clientX - rect.left;
                            const ty = touch.clientY - rect.top;
                            this.mouseX = tx;
                            this.mouseY = ty;
                            this.prevMouseX = tx;
                            this.prevMouseY = ty;
                            this._spawnRipple(tx, ty);
                            breathAudio.playBreath();
                        }
                    }, { passive: false });

                    canvas.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        if (touch) {
                            const rect = canvas.getBoundingClientRect();
                            const tx = touch.clientX - rect.left;
                            const ty = touch.clientY - rect.top;
                            this.mouseVX = tx - (this.prevMouseX >= 0 ? this.prevMouseX : tx);
                            this.mouseVY = ty - (this.prevMouseY >= 0 ? this.prevMouseY : ty);
                            this.prevMouseX = this.mouseX;
                            this.prevMouseY = this.mouseY;
                            this.mouseX = tx;
                            this.mouseY = ty;
                        }
                    }, { passive: false });

                    canvas.addEventListener('touchend', () => {
                        this.mouseX = -9999;
                        this.mouseY = -9999;
                        this.prevMouseX = -9999;
                        this.prevMouseY = -9999;
                    });

                    // Resize 处理
                    window.addEventListener('resize', () => this._onResize());
                }

                _setupAudioInit() {
                    const initAudio = () => {
                        breathAudio.init();
                        document.removeEventListener('pointerdown', initAudio);
                        document.removeEventListener('touchstart', initAudio);
                        document.removeEventListener('keydown', initAudio);
                    };
                    document.addEventListener('pointerdown', initAudio);
                    document.addEventListener('touchstart', initAudio);
                    document.addEventListener('keydown', initAudio);
                }

                _spawnRipple(x, y) {
                    this.ripples.push({
                        x,
                        y,
                        radius: 8,
                        maxRadius: CONFIG.rippleMaxRadius,
                        alpha: 0.7,
                        speed: CONFIG.rippleExpansionSpeed + Math.random() * 1.5,
                        fadeSpeed: CONFIG.rippleFadeSpeed,
                    });
                    // 限制同时存在的波纹数量
                    if (this.ripples.length > 5) {
                        this.ripples.shift();
                    }
                }

                _onResize() {
                    const newW = window.innerWidth;
                    const newH = window.innerHeight;
                    if (newW === this.width && newH === this.height) return;

                    const scaleX = newW / this.width;
                    const scaleY = newH / this.height;
                    this.width = newW;
                    this.height = newH;

                    this.app.renderer.resize(newW, newH);

                    // 更新星系中心位置
                    for (const galaxy of this.galaxies) {
                        galaxy.baseX *= scaleX;
                        galaxy.baseY *= scaleY;
                        galaxy.driftAmpX *= scaleX;
                        galaxy.driftAmpY *= scaleY;
                    }

                    // 更新粒子轨道参数
                    for (const p of this.particles) {
                        p.orbitRadiusX *= scaleX;
                        p.orbitRadiusY *= scaleY;
                    }

                    // 更新背景光斑
                    for (const light of this.bgLightSprites) {
                        light.baseX *= scaleX;
                        light.baseY *= scaleY;
                        light.ampX *= scaleX;
                        light.ampY *= scaleY;
                    }

                    // 更新星星位置
                    for (const star of this.starSprites) {
                        star.baseX *= scaleX;
                        star.baseY *= scaleY;
                    }
                }

                _updateGalaxies(time) {
                    for (const galaxy of this.galaxies) {
                        galaxy.currentX = galaxy.baseX +
                            Math.sin(time * galaxy.driftSpeed + galaxy.phase) * galaxy.driftAmpX;
                        galaxy.currentY = galaxy.baseY +
                            Math.cos(time * galaxy.driftSpeed * 0.87 + galaxy.phase * 1.3) * galaxy.driftAmpY;
                    }
                }

                _updateParticles(time) {
                    const particles = this.particles;
                    const galaxies = this.galaxies;
                    const mouseX = this.mouseX;
                    const mouseY = this.mouseY;
                    const mouseRadius = CONFIG.mouseRadius;
                    const mouseStrength = CONFIG.mouseAttractionStrength;
                    const mouseSpeed = Math.sqrt(this.mouseVX * this.mouseVX + this.mouseVY * this.mouseVY);
                    const effectiveStrength = mouseStrength * (1 + clamp(mouseSpeed * 0.02, 0, 0.8));

                    // 波纹对粒子的推力
                    const rippleData = this.ripples;

                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        const galaxy = galaxies[p.galaxyIndex];
                        if (!galaxy) continue;

                        // 轨道角度更新
                        p.orbitAngle += p.orbitSpeed * 0.016 * CONFIG.globalSpeed;

                        // 轨道运动 + 噪声扰动
                        const noiseX = Math.sin(time * p.noiseSpeedX + p.noisePhaseX) * p.noiseAmpX +
                            Math.cos(time * p.noiseSpeedY * 0.7 + p.noisePhaseY) * p.noiseAmpY * 0.5;
                        const noiseY = Math.cos(time * p.noiseSpeedX * 0.8 + p.noisePhaseX) * p.noiseAmpY * 0.7 +
                            Math.sin(time * p.noiseSpeedY + p.noisePhaseY) * p.noiseAmpX * 0.4;

                        const orbitX = Math.cos(p.orbitAngle) * p.orbitRadiusX;
                        const orbitY = Math.sin(p.orbitAngle) * p.orbitRadiusY * p.orbitEllipticity;

                        let px = galaxy.currentX + orbitX + noiseX;
                        let py = galaxy.currentY + orbitY + noiseY;

                        // 鼠标吸引
                        if (mouseX >= 0 && mouseY >= 0) {
                            const dx = mouseX - px;
                            const dy = mouseY - py;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < mouseRadius && dist > 0.1) {
                                const influence = (1 - dist / mouseRadius) * effectiveStrength;
                                px += dx / dist * influence * 12;
                                py += dy / dist * influence * 12;
                            }
                        }

                        // 波纹推力
                        for (let r = 0; r < rippleData.length; r++) {
                            const ripple = rippleData[r];
                            const rdx = px - ripple.x;
                            const rdy = py - ripple.y;
                            const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
                            const bandWidth = ripple.radius * 0.3 + 25;
                            const distFromRing = Math.abs(rdist - ripple.radius);
                            if (distFromRing < bandWidth && rdist > 0.5) {
                                const pushForce = (1 - distFromRing / bandWidth) * ripple.alpha * CONFIG.ripplePushStrength;
                                px += (rdx / rdist) * pushForce * 2.5;
                                py += (rdy / rdist) * pushForce * 2.5;
                            }
                        }

                        // 边界包裹（软边界）
                        if (px < -30) px += this.width + 60;
                        if (px > this.width + 30) px -= this.width + 60;
                        if (py < -30) py += this.height + 60;
                        if (py > this.height + 30) py -= this.height + 60;

                        p.sprite.position.set(px, py);

                        // 闪烁星星的透明度更新
                        if (p.isStar) {
                            const twinkle = 0.55 + 0.45 * Math.sin(time * p.twinkleSpeed + p.twinklePhase);
                            p.sprite.alpha = p.baseAlpha * twinkle;
                        }
                    }
                }

                _updateRipples() {
                    const activeRipples = [];
                    for (let i = 0; i < this.ripples.length; i++) {
                        const ripple = this.ripples[i];
                        ripple.radius += ripple.speed;
                        ripple.alpha -= ripple.fadeSpeed;
                        if (ripple.alpha > 0.02 && ripple.radius < ripple.maxRadius) {
                            activeRipples.push(ripple);
                        }
                    }
                    this.ripples = activeRipples;

                    // 绘制波纹
                    if (this.rippleGraphics) {
                        this.rippleGraphics.clear();
                        for (const ripple of this.ripples) {
                            const alpha = ripple.alpha;
                            const radius = ripple.radius;
                            // 外环
                            this.rippleGraphics.lineStyle(1.5, 0xccccff, alpha * 0.6);
                            this.rippleGraphics.drawCircle(ripple.x, ripple.y, radius);
                            // 内环（更柔和）
                            this.rippleGraphics.lineStyle(0.8, 0xffffff, alpha * 0.3);
                            this.rippleGraphics.drawCircle(ripple.x, ripple.y, radius * 0.65);
                        }
                    }
                }

                _updateBackgroundLights(time) {
                    for (const light of this.bgLightSprites) {
                        const dx = Math.sin(time * light.speedX + light.phaseX) * light.ampX;
                        const dy = Math.cos(time * light.speedY + light.phaseY) * light.ampY;
                        light.gfx.position.set(light.baseX + dx, light.baseY + dy);
                        // 呼吸般的光晕脉动
                        const breath = 0.75 + 0.25 * Math.sin(time * 0.6 + light.phaseX);
                        light.gfx.alpha = light.baseAlpha * breath;
                    }
                }

                _updateStarSprites(time) {
                    for (const star of this.starSprites) {
                        const twinkle = 0.45 + 0.55 * Math.sin(time * star.twinkleSpeed + star.twinklePhase);
                        star.sprite.alpha = star.baseAlpha * twinkle;
                        const dx = Math.sin(time * star.driftSpeed + star.driftPhase) * star.driftAmp;
                        const dy = Math.cos(time * star.driftSpeed * 0.8 + star.driftPhase * 1.4) * star.driftAmp;
                        star.sprite.position.set(star.baseX + dx, star.baseY + dy);
                    }
                }

                _update(delta) {
                    if (this.disposed) return;
                    this.frameCount++;
                    // 使用 delta 累积时间，或使用高精度时间
                    this.time += delta * 0.016 * CONFIG.globalSpeed;

                    // 限制更新频率（性能优化：如果帧率过高，稍微跳过一些更新）
                    const shouldUpdate = this.frameCount % 1 === 0; // 每帧更新

                    if (shouldUpdate) {
                        this._updateGalaxies(this.time);
                        this._updateParticles(this.time);
                        this._updateRipples();
                        this._updateBackgroundLights(this.time);
                        this._updateStarSprites(this.time);
                    }

                    // 渲染
                    this.app.render();
                }

                destroy() {
                    this.disposed = true;
                    try {
                        if (this.app && this.app.ticker) {
                            this.app.ticker.stop();
                            this.app.ticker.destroy();
                        }
                        if (this.app) {
                            this.app.destroy(true, { children: true, texture: true, baseTexture: true });
                        }
                    } catch (e) {
                        console.warn('销毁时出错:', e);
                    }
                    this.app = null;
                    this.particles = [];
                    this.galaxies = [];
                    this.ripples = [];
                }
            }

            // ──────────────────────────── 启动 ────────────────────────────
            let nebulaApp = null;

            function boot() {
                try {
                    nebulaApp = new NebulaApp();
                    nebulaApp.init().catch(err => {
                        console.error('Nebula 启动失败:', err);
                        // 隐藏加载器
                        const loader = document.getElementById('loader');
                        if (loader) loader.classList.add('hidden');
                    });
                } catch (e) {
                    console.error('Nebula 初始化异常:', e);
                    const loader = document.getElementById('loader');
                    if (loader) loader.classList.add('hidden');
                }
            }

            // 页面加载后启动
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot);
            } else {
                boot();
            }

            // 页面离开时清理
            window.addEventListener('beforeunload', () => {
                if (nebulaApp) {
                    nebulaApp.destroy();
                    nebulaApp = null;
                }
            });

            // 页面可见性变化时暂停/恢复（省电）
            document.addEventListener('visibilitychange', () => {
                if (!nebulaApp || !nebulaApp.app) return;
                if (document.hidden) {
                    nebulaApp.app.ticker.stop();
                } else {
                    nebulaApp.app.ticker.start();
                }
            });

        })();
    </script>
</body>
</html>
