<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>数列闯关 · Sequence Quest</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#03040e;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;}

  /* ===== 标题 ===== */
  #title{
    position:absolute;top:0;left:0;
    padding:16px 24px;
    opacity:0;animation:fade 1.2s 0.2s ease forwards;
  }
  #title .en{
    font-size:8px;letter-spacing:.5em;text-indent:.5em;
    color:rgba(140,200,255,.42);font-weight:300;margin-bottom:5px;
  }
  #title h1{
    font-size:clamp(15px,2vw,22px);
    font-weight:300;letter-spacing:.24em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 40%,#e090d0 72%,#ffd080 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 20px rgba(100,180,255,.48));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.14em;
    color:rgba(200,220,255,.52);
    margin-top:5px;
  }

  /* ===== 右上：进度 ===== */
  #progress{
    position:absolute;top:16px;right:24px;
    padding:12px 18px;
    border-radius:12px;
    background:rgba(10,16,36,.72);
    border:1px solid rgba(120,170,255,.26);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;line-height:1.9;
    color:rgba(200,220,255,.62);
    opacity:0;animation:fade 1.2s 0.6s ease forwards;
    min-width:150px;
    text-align:right;
  }
  #progress .h{
    font-size:8px;letter-spacing:.38em;
    color:rgba(140,190,240,.58);
    margin-bottom:6px;
    display:block;
  }
  #progress .lv{
    font-size:clamp(16px,2.2vw,22px);
    font-weight:300;
    color:rgba(220,240,255,.96);
    display:block;
    margin-bottom:4px;
    filter:drop-shadow(0 0 12px rgba(120,200,255,.42));
  }
  #progress .lv b{color:rgba(140,225,255,.98);font-weight:600;}
  #progress .stars{
    font-size:11px;
    letter-spacing:.20em;
    color:rgba(255,215,150,.92);
    text-shadow:0 0 10px rgba(255,190,90,.58);
  }
  #progress .stars .off{
    color:rgba(140,160,200,.22);
    text-shadow:none;
  }

  /* ===== 题目卡片 ===== */
  #questBox{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:min(560px,92vw);
    padding:clamp(20px,3.4vw,34px);
    border-radius:22px;
    background:linear-gradient(160deg,rgba(14,22,50,.94),rgba(6,10,26,.94));
    border:1.5px solid rgba(120,170,255,.32);
    box-shadow:
      0 24px 70px rgba(0,0,0,.65),
      0 0 70px rgba(80,150,255,.20),
      inset 0 1px 0 rgba(180,220,255,.16);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    opacity:0;pointer-events:none;
    transition:opacity .4s ease,transform .4s cubic-bezier(.34,1.4,.64,1);
    z-index:20;
  }
  #questBox.show{
    opacity:1;pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
  }

  .qt-tag{
    display:inline-block;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.44em;text-indent:.44em;
    color:rgba(140,220,255,.82);
    padding:5px 14px;
    border-radius:999px;
    background:rgba(80,180,255,.12);
    border:1px solid rgba(120,200,255,.38);
    margin-bottom:14px;
  }
  .qt-hint{
    font-size:clamp(11px,1.3vw,13px);
    letter-spacing:.08em;
    line-height:1.7;
    color:rgba(190,215,255,.62);
    margin-bottom:18px;
  }
  .qt-hint .hl{
    color:rgba(255,215,140,.96);
    font-weight:500;
  }

  /* 数列展示 */
  .qt-seq{
    display:flex;flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:clamp(8px,1.4vw,14px);
    padding:20px 8px 24px;
    margin-bottom:8px;
  }
  .qt-num{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(17px,2.4vw,26px);
    font-weight:400;
    letter-spacing:.02em;
    color:rgba(220,235,255,.94);
    padding:9px 15px;
    border-radius:11px;
    background:rgba(20,32,64,.62);
    border:1px solid rgba(90,150,230,.24);
    box-shadow:inset 0 1px 0 rgba(180,220,255,.10);
    transition:.4s;
    min-width:clamp(44px,5vw,60px);
    text-align:center;
  }
  .qt-num.known{
    color:rgba(140,225,255,.98);
    text-shadow:0 0 14px rgba(100,200,255,.48);
  }
  .qt-num.unknown{
    color:rgba(255,215,140,.98);
    background:rgba(80,50,20,.62);
    border-color:rgba(255,200,120,.62);
    animation:unknownPulse 1.8s ease-in-out infinite;
  }
  .qt-num.comma{
    background:transparent;
    border:none;
    padding:0;
    min-width:auto;
    font-size:clamp(14px,1.8vw,20px);
    color:rgba(180,200,240,.42);
  }
  @keyframes unknownPulse{
    0%,100%{box-shadow:inset 0 0 0 rgba(255,200,120,0),0 0 0 rgba(255,200,120,0);}
    50%{box-shadow:inset 0 0 12px rgba(255,200,120,.20),0 0 18px rgba(255,200,120,.42);}
  }

  /* 选项 */
  .qt-options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .qt-opt{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(13px,1.7vw,18px);
    font-weight:500;
    letter-spacing:.04em;
    color:rgba(215,235,255,.96);
    background:linear-gradient(145deg,rgba(56,80,140,.72),rgba(30,42,88,.68));
    border:1.5px solid rgba(120,170,255,.34);
    border-radius:12px;
    padding:14px 12px;
    cursor:pointer;
    transition:.24s cubic-bezier(.34,1.4,.64,1);
    text-align:center;
    box-shadow:
      0 5px 14px rgba(0,0,0,.34),
      inset 0 1px 0 rgba(180,215,255,.20);
    position:relative;
    overflow:hidden;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
  }
  .qt-opt::before{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(140deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 42%);
    pointer-events:none;
  }
  .qt-opt:hover{
    transform:translateY(-2px);
    border-color:rgba(180,220,255,.78);
    box-shadow:
      0 10px 22px rgba(0,0,0,.42),
      0 0 22px rgba(100,180,255,.44),
      inset 0 1px 0 rgba(200,230,255,.30);
  }
  .qt-opt:active{transform:translateY(0) scale(.98);}
  .qt-opt.correct{
    border-color:rgba(140,240,190,.94);
    background:linear-gradient(145deg,rgba(36,120,88,.86),rgba(20,72,54,.82));
    box-shadow:
      0 0 32px rgba(120,240,180,.72),
      inset 0 1px 0 rgba(200,255,225,.40);
  }
  .qt-opt.wrong{
    border-color:rgba(255,140,110,.90);
    background:linear-gradient(145deg,rgba(120,40,30,.86),rgba(72,24,18,.82));
    animation:shake 0.45s;
  }
  .qt-opt.disabled{
    opacity:.36;
    pointer-events:none;
    transform:none;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-7px);}
    60%{transform:translateX(7px);}
  }

  /* 结算 */
  .qt-result{
    display:none;
    padding:14px 18px;
    border-radius:12px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:11px;
    letter-spacing:.08em;
    line-height:1.8;
    margin-bottom:14px;
    animation:fade .4s ease;
  }
  .qt-result.show{display:block;}
  .qt-result.good{
    background:rgba(30,80,60,.62);
    border:1px solid rgba(120,240,180,.42);
    color:rgba(180,255,215,.98);
  }
  .qt-result.bad{
    background:rgba(80,30,26,.62);
    border:1px solid rgba(255,140,110,.42);
    color:rgba(255,190,160,.98);
  }
  .qt-result .k{
    color:rgba(255,225,175,.94);
    font-weight:600;
  }

  /* ===== 底部按钮 ===== */
  #bottomBar{
    position:absolute;bottom:0;left:0;right:0;
    padding:0 24px 22px;
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    z-index:15;
    opacity:0;animation:fade 1.2s 1.2s ease forwards;
    pointer-events:none;
  }
  .btn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10.5px;letter-spacing:.16em;
    padding:11px 20px;
    border-radius:10px;
    cursor:pointer;
    transition:.24s cubic-bezier(.34,1.4,.64,1);
    border:1px solid rgba(120,155,230,.30);
    background:rgba(20,30,58,.68);
    color:rgba(200,220,255,.82);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    pointer-events:auto;
    white-space:nowrap;
  }
  .btn:hover{
    border-color:rgba(180,220,255,.82);
    color:rgba(235,245,255,.98);
    background:rgba(50,80,140,.42);
    transform:translateY(-1px);
  }
  .btn:active{transform:translateY(0);}
  .btn.accent{
    border-color:rgba(255,190,120,.48);
    color:rgba(255,215,160,.94);
  }
  .btn.accent:hover{
    border-color:rgba(255,215,150,.92);
    background:rgba(140,90,40,.40);
  }

  /* ===== 音频指示 ===== */
  #audioDot{
    position:absolute;bottom:0;right:24px;
    padding-bottom:22px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.20em;
    color:rgba(160,200,240,.30);
    display:flex;align-items:center;gap:6px;
    opacity:0;animation:fade 1.2s 1.5s ease forwards;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }
  #audioDot.on{color:rgba(160,220,200,.52);}

  /* ===== Toast ===== */
  #toast{
    position:fixed;
    top:26%;left:50%;
    transform:translate(-50%,-50%) scale(.86);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(15px,2vw,22px);
    font-weight:300;letter-spacing:.24em;
    color:rgba(180,255,220,.98);
    text-shadow:0 0 30px rgba(120,240,190,.85);
    opacity:0;pointer-events:none;
    transition:opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
    z-index:100;
    white-space:nowrap;
    text-align:center;
    padding:14px 28px;
    border-radius:14px;
    background:rgba(8,20,16,.76);
    border:1px solid rgba(140,240,190,.42);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #toast.bad{
    color:rgba(255,175,150,.98);
    border-color:rgba(255,140,110,.62);
    background:rgba(40,14,10,.76);
    text-shadow:0 0 30px rgba(255,120,90,.85);
  }
  #toast.gold{
    color:rgba(255,235,160,.98);
    border-color:rgba(255,205,120,.72);
    background:rgba(50,32,12,.76);
    text-shadow:0 0 30px rgba(255,200,100,.95);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:12px 14px;}
    #title .sub{display:none;}
    #progress{top:12px;right:12px;padding:9px 12px;min-width:120px;font-size:8.5px;}
    #progress .lv{font-size:15px;}
    #questBox{padding:18px 16px;border-radius:16px;}
    .qt-num{font-size:16px;padding:7px 11px;}
    .qt-opt{padding:12px 8px;font-size:13px;}
    #bottomBar{padding:0 12px 14px;gap:7px;}
    .btn{font-size:9px;padding:9px 14px;}
    #audioDot{right:12px;padding-bottom:14px;font-size:7.5px;}
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">SEQUENCE QUEST</div>
    <h1>数列闯关</h1>
    <div class="sub">识别规律 · 抵达终点城堡</div>
  </div>

  <div id="progress">
    <span class="h">进度</span>
    <span class="lv">第 <b id="lvVal">1</b> / <b id="totalVal">12</b> 关</span>
    <div class="stars" id="starsVal">★☆☆☆☆</div>
  </div>

  <div id="questBox">
    <div class="qt-tag" id="qtTag">SEQUENCE · 等差数列</div>
    <div class="qt-hint" id="qtHint">观察规律，预测下一个数字</div>

    <div class="qt-seq" id="qtSeq"></div>

    <div class="qt-options" id="qtOptions"></div>

    <div class="qt-result" id="qtResult"></div>

    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn" id="btnHint">提 示</button>
      <button class="btn accent" id="btnNext" style="display:none;">继 续 →</button>
    </div>
  </div>

  <div id="bottomBar">
    <button class="btn" id="btnRestart">重 新 开 始</button>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>氛围音 · 交互音</span>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;

/* =========================================================
   题库
   ========================================================= */
/* 每道题：seq 显示的数列，answer 答案，options 选项，hint 提示 */
const QUESTIONS = [
  /* 1 - 等差数列 */
  {
    type: '等差数列',
    hint: '每一项与前一项的差值相同',
    seq: [2, 5, 8, 11, '?'],
    answer: 14,
    options: [13, 14, 15, 16]
  },
  /* 2 - 等比数列 */
  {
    type: '等比数列',
    hint: '每一项与前一项的比值相同',
    seq: [1, 3, 9, 27, '?'],
    answer: 81,
    options: [36, 54, 72, 81]
  },
  /* 3 - 等差数列（递减） */
  {
    type: '等差数列',
    hint: '数列在递减，注意每次减少多少',
    seq: [20, 17, 14, 11, '?'],
    answer: 8,
    options: [7, 8, 9, 6]
  },
  /* 4 - 平方数列 */
  {
    type: '平方数列',
    hint: '每一项都是自然数的平方',
    seq: [1, 4, 9, 16, '?'],
    answer: 25,
    options: [20, 24, 25, 30]
  },
  /* 5 - 斐波那契 */
  {
    type: '斐波那契型',
    hint: '每一项等于前两项之和',
    seq: [1, 1, 2, 3, 5, '?'],
    answer: 8,
    options: [7, 8, 9, 13]
  },
  /* 6 - 立方数列 */
  {
    type: '立方数列',
    hint: '每一项是自然数的立方',
    seq: [1, 8, 27, 64, '?'],
    answer: 125,
    options: [100, 121, 125, 144]
  },
  /* 7 - 差递增 */
  {
    type: '二阶等差',
    hint: '相邻两项的差本身在递增',
    seq: [1, 2, 4, 7, 11, '?'],
    answer: 16,
    options: [14, 15, 16, 17]
  },
  /* 8 - 等比数列（分数） */
  {
    type: '等比数列',
    hint: '每一项是前一项的一半',
    seq: [8, 4, 2, 1, '?'],
    answer: 0.5,
    options: [0.25, 0.5, 0.75, 0]
  },
  /* 9 - 交替符号 */
  {
    type: '交替数列',
    hint: '符号在正负之间交替',
    seq: [1, -2, 4, -8, '?'],
    answer: 16,
    options: [-16, 16, 32, -32]
  },
  /* 10 - 质数序列 */
  {
    type: '质数序列',
    hint: '每一项都是质数',
    seq: [2, 3, 5, 7, 11, '?'],
    answer: 13,
    options: [12, 13, 14, 15]
  },
  /* 11 - 递推 */
  {
    type: '递推数列',
    hint: '每一项等于前一项 × 2 + 1',
    seq: [1, 3, 7, 15, '?'],
    answer: 31,
    options: [23, 27, 31, 33]
  },
  /* 12 - 复合模式 */
  {
    type: '复合数列',
    hint: '奇数项和偶数项各有规律',
    seq: [1, 10, 3, 20, 5, '?'],
    answer: 30,
    options: [7, 30, 40, 60]
  }
];

/* =========================================================
   游戏状态
   ========================================================= */
const game = {
  level: 0,
  totalLevels: QUESTIONS.length,
  lives: 3,
  answered: false,
  currentAnswer: null,
  hintUsed: 0,
  totalCorrect: 0,
  totalWrong: 0
};

/* =========================================================
   音效系统
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let droneOn = false;
let ambTimer = null;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.46, ac.currentTime, 1.6);

  startDrone();
  scheduleAmbient();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioDot(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioDot(true);
  }
}

/* ---- 氛围和弦铺底 ---- */
function startDrone(){
  if (droneOn) return;
  droneOn = true;
  const now = ac.currentTime;

  /* F 大调的五度叠置：较温暖 */
  const notes = [87.31, 130.81, 174.61, 261.63];
  const gains = [1.00, 0.58, 0.38, 0.18];

  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
    osc.frequency.value = notes[i];

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 520;
    lp.Q.value = 1.2;

    const g = ac.createGain();
    g.gain.value = 0;
    g.gain.setTargetAtTime(0.014 * gains[i], now, 3.0);

    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.030 + i * 0.012;
    const lfoG = ac.createGain();
    lfoG.gain.value = 0.006 * gains[i];
    lfo.connect(lfoG);
    lfoG.connect(g.gain);
    lfo.start();

    osc.connect(lp);
    lp.connect(g);
    g.connect(master);
    osc.start();
  }
}

/* ---- 空灵点缀 ---- */
function playAmbientPing(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [523.25, 587.33, 698.46, 783.99, 1046.50];
  const f = notes[Math.floor(Math.random() * notes.length)];

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = f;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.005, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 2.8);
}

function scheduleAmbient(){
  if (ambTimer) clearTimeout(ambTimer);
  const wait = 2400 + Math.random() * 3800;
  ambTimer = setTimeout(function(){
    if (audioReady && ac && ac.state === 'running'){
      playAmbientPing();
    }
    scheduleAmbient();
  }, wait);
}

/* ---- 点击音 ---- */
function playClick(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(660, now);
  osc.frequency.exponentialRampToValueAtTime(990, now + 0.05);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.018, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.10);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.12);
}

/* =========================================================
   背景 Canvas
   ========================================================= */
const stars = [];
const petals = [];

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
  buildPetals();
}
window.addEventListener('resize', resize);

function buildStars(){
  stars.length = 0;
  const n = Math.min(180, Math.round(W * H / 10000));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.0 + 0.15,
      ph: Math.random() * TAU,
      sp: 0.2 + Math.random() * 0.8,
      hue: 210 + Math.random() * 90,
      base: 0.05 + Math.random() * 0.22
    });
  }
}

function buildPetals(){
  petals.length = 0;
  const n = 26;
  for (let i = 0; i < n; i++){
    petals.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 6 + Math.random() * 12,
      vy: 8 + Math.random() * 16,
      vx: -8 + Math.random() * 16,
      rot: Math.random() * TAU,
      rotSpd: (Math.random() - 0.5) * 0.6,
      hue: 200 + Math.random() * 80,
      alpha: 0.06 + Math.random() * 0.10
    });
  }
}

/* =========================================================
   地图绘制
   ========================================================= */
/* 12 个关卡节点在地图上的分布（由起点到终点城堡） */
let nodePositions = [];
let playerPos = { x: 0, y: 0 };
let playerTargetPos = { x: 0, y: 0 };

function computeMap(){
  nodePositions = [];

  /* 起点在左下，终点城堡在右上，沿 S 形排列 */
  const marginX = W * 0.12;
  const marginY = H * 0.12;
  const availW = W - marginX * 2;
  const availH = H - marginY * 2;

  /* 每 4 关一段，共 3 段，来回折返 */
  const segs = 3;
  const perSeg = Math.ceil(QUESTIONS.length / segs);

  for (let i = 0; i < QUESTIONS.length; i++){
    const seg = Math.floor(i / perSeg);
    const idxInSeg = i % perSeg;

    let px, py;

    /* x 方向：均匀分布 */
    px = marginX + availW * (idxInSeg / Math.max(1, perSeg - 1));

    /* y 方向：随段交替上升 */
    py = H - marginY - availH * (seg / segs) - availH / segs * 0.28;

    /* 反向段：x 反转 */
    if (seg % 2 === 1){
      px = W - px;
    }

    /* 加入轻微曲线偏移 */
    px += Math.sin(i * 1.2) * 8;
    py += Math.cos(i * 0.8) * 6;

    nodePositions.push({ x: px, y: py });
  }

  /* 城堡在最后一个节点上方 */
  const last = nodePositions[nodePositions.length - 1];
  nodePositions.push({
    x: last.x + 10,
    y: last.y - H * 0.055,
    castle: true
  });
}

function updatePlayerPos(dt){
  playerPos.x += (playerTargetPos.x - playerPos.x) * Math.min(1, dt * 3.4);
  playerPos.y += (playerTargetPos.y - playerPos.y) * Math.min(1, dt * 3.4);
}

/* ---- 画地图背景 ---- */
function drawMap(t){
  /* 深空背景 */
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.4, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  bg.addColorStop(0.00, '#0a1024');
  bg.addColorStop(0.42, '#05091a');
  bg.addColorStop(1.00, '#010208');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星点 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.012) continue;
    ctx.fillStyle = 'hsla(' + s.hue + ',85%,86%,' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }

  /* 两团柔光 */
  for (let k = 0; k < 2; k++){
    const px = W * (0.30 + k * 0.42) + Math.sin(t * 0.04 + k * 1.7) * W * 0.06;
    const py = H * (0.42 + k * 0.22) + Math.cos(t * 0.03 + k) * H * 0.06;
    const r = Math.min(W, H) * (0.30 + k * 0.06);
    const hue = k === 0 ? 210 : 280;
    const g = ctx.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0.00, 'hsla(' + hue + ',80%,58%,0.045)');
    g.addColorStop(0.42, 'hsla(' + hue + ',80%,50%,0.015)');
    g.addColorStop(1.00, 'hsla(' + hue + ',80%,48%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* 花瓣式漂浮物 */
  ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < petals.length; i++){
    const p = petals[i];
    p.x += p.vx * 0.016;
    p.y += p.vy * 0.016;
    p.rot += p.rotSpd * 0.016;

    if (p.y > H + 30){ p.y = -30; p.x = Math.random() * W; }
    if (p.x < -30) p.x = W + 30;
    if (p.x > W + 30) p.x = -30;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);

    ctx.beginPath();
    ctx.ellipse(0, 0, p.r, p.r * 0.42, 0, 0, TAU);
    ctx.fillStyle = 'hsla(' + p.hue + ',80%,72%,' + p.alpha + ')';
    ctx.fill();

    ctx.restore();
  }
}

/* ---- 画关卡地图 ---- */
function drawJourney(t){
  if (nodePositions.length < 2) return;

  /* 路径 */
  ctx.beginPath();
  ctx.moveTo(nodePositions[0].x, nodePositions[0].y);
  for (let i = 1; i < nodePositions.length; i++){
    const prev = nodePositions[i - 1];
    const cur = nodePositions[i];
    const mx = (prev.x + cur.x) * 0.5;
    const my = (prev.y + cur.y) * 0.5 - 20;
    ctx.quadraticCurveTo(mx, my, cur.x, cur.y);
  }

  ctx.strokeStyle = 'rgba(90, 140, 220, 0.32)';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.setLineDash([8, 8]);
  ctx.lineDashOffset = -(t * 22) % 16;
  ctx.stroke();
  ctx.setLineDash([]);

  /* 已通过路径高亮 */
  if (game.level > 0){
    ctx.beginPath();
    ctx.moveTo(nodePositions[0].x, nodePositions[0].y);
    const maxIdx = Math.min(game.level, nodePositions.length - 1);

    for (let i = 1; i <= maxIdx; i++){
      const prev = nodePositions[i - 1];
      const cur = nodePositions[i];
      const mx = (prev.x + cur.x) * 0.5;
      const my = (prev.y + cur.y) * 0.5 - 20;
      ctx.quadraticCurveTo(mx, my, cur.x, cur.y);
    }

    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(120, 220, 255, 0.24)';
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';

    ctx.strokeStyle = 'rgba(140, 225, 255, 0.86)';
    ctx.lineWidth = 2.4;
    ctx.stroke();
  }

  /* 节点 */
  for (let i = 0; i < nodePositions.length; i++){
    const n = nodePositions[i];
    const isCastle = n.castle === true;
    const isPassed = i < game.level;
    const isCurrent = i === game.level;

    let r;
    if (isCastle){
      r = Math.min(W, H) * 0.032;
    } else if (isCurrent){
      r = Math.min(W, H) * 0.019;
    } else {
      r = Math.min(W, H) * 0.013;
    }

    r = Math.max(9, r);

    const pulse = 1 + 0.14 * Math.sin(t * 2.6 + i * 0.9);

    if (isCastle){
      /* 城堡 */
      ctx.save();
      ctx.translate(n.x, n.y);

      /* 光晕 */
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 4 * pulse);
      g.addColorStop(0.00, 'rgba(255, 210, 140, 0.62)');
      g.addColorStop(0.42, 'rgba(255, 180, 100, 0.20)');
      g.addColorStop(1.00, 'rgba(255, 150, 80, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r * 4 * pulse, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      /* 城堡主体 */
      ctx.beginPath();
      ctx.moveTo(-r * 0.9, r * 0.6);
      ctx.lineTo(-r * 0.9, -r * 0.2);
      ctx.lineTo(-r * 0.6, -r * 0.2);
      ctx.lineTo(-r * 0.6, -r * 0.6);
      ctx.lineTo(-r * 0.30, -r * 0.6);
      ctx.lineTo(-r * 0.30, -r * 0.2);
      ctx.lineTo(r * 0.30, -r * 0.2);
      ctx.lineTo(r * 0.30, -r * 0.6);
      ctx.lineTo(r * 0.6, -r * 0.6);
      ctx.lineTo(r * 0.6, -r * 0.2);
      ctx.lineTo(r * 0.9, -r * 0.2);
      ctx.lineTo(r * 0.9, r * 0.6);
      ctx.closePath();

      ctx.fillStyle = isPassed
        ? 'rgba(255, 210, 130, 0.98)'
        : 'rgba(120, 130, 170, 0.72)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 235, 180, 0.92)';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      /* 旗子 */
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.6);
      ctx.lineTo(0, -r * 1.4);
      ctx.lineTo(r * 0.6, -r * 1.15);
      ctx.lineTo(0, -r * 0.9);
      ctx.closePath();
      ctx.fillStyle = isPassed
        ? 'rgba(255, 100, 130, 0.98)'
        : 'rgba(140, 100, 130, 0.62)';
      ctx.fill();

      ctx.restore();
    } else {
      /* 普通节点 */
      ctx.globalCompositeOperation = 'lighter';
      if (isCurrent){
        const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 3.6 * pulse);
        g.addColorStop(0.00, 'rgba(140, 220, 255, 0.62)');
        g.addColorStop(0.42, 'rgba(100, 180, 255, 0.22)');
        g.addColorStop(1.00, 'rgba(80, 140, 240, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 3.6 * pulse, 0, TAU);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      /* 节点圆 */
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, TAU);

      if (isPassed){
        ctx.fillStyle = 'rgba(140, 225, 255, 0.98)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(200, 240, 255, 0.92)';
        ctx.lineWidth = 1.6;
        ctx.stroke();
      } else if (isCurrent){
        ctx.fillStyle = 'rgba(50, 110, 200, 0.92)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(160, 220, 255, 0.98)';
        ctx.lineWidth = 2.2;
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(20, 32, 62, 0.72)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(110, 145, 220, 0.42)';
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }

      /* 关卡编号 */
      ctx.font = '500 ' + Math.max(8, r * 0.9).toFixed(0) +
        'px "SF Mono", Consolas, Monaco, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = isPassed || isCurrent
        ? 'rgba(8, 16, 32, 0.92)'
        : 'rgba(180, 200, 240, 0.48)';
      ctx.fillText(String(i + 1), n.x, n.y + 0.5);
    }
  }

  /* 玩家棋子 */
  const pr = Math.min(W, H) * 0.020;
  const playerR = Math.max(11, pr);

  ctx.globalCompositeOperation = 'lighter';
  const pg = ctx.createRadialGradient(
    playerPos.x, playerPos.y, 0,
    playerPos.x, playerPos.y, playerR * 4
  );
  pg.addColorStop(0.00, 'rgba(255, 235, 150, 0.92)');
  pg.addColorStop(0.42, 'rgba(255, 190, 90, 0.32)');
  pg.addColorStop(1.00, 'rgba(255, 160, 70, 0)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.arc(playerPos.x, playerPos.y, playerR * 4, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.beginPath();
  ctx.arc(playerPos.x, playerPos.y, playerR, 0, TAU);

  const ppg = ctx.createRadialGradient(
    playerPos.x - playerR * 0.32, playerPos.y - playerR * 0.32, 0,
    playerPos.x, playerPos.y, playerR
  );
  ppg.addColorStop(0.00, 'rgba(255, 250, 220, 1)');
  ppg.addColorStop(0.55, 'rgba(255, 210, 110, 0.98)');
  ppg.addColorStop(1.00, 'rgba(230, 150, 50, 0.92)');
  ctx.fillStyle = ppg;
  ctx.fill();

  ctx.strokeStyle = 'rgba(255, 245, 200, 0.98)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
}

/* =========================================================
   渲染
   ========================================================= */
function render(t){
  drawMap(t);
  drawJourney(t);

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(1, 2, 6, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 0, 4, 0.90)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   题目渲染
   ========================================================= */
const questBox = document.getElementById('questBox');
const qtTag = document.getElementById('qtTag');
const qtHint = document.getElementById('qtHint');
const qtSeq = document.getElementById('qtSeq');
const qtOptions = document.getElementById('qtOptions');
const qtResult = document.getElementById('qtResult');
const btnNext = document.getElementById('btnNext');
const btnHint = document.getElementById('btnHint');

function renderQuestion(){
  if (game.level >= game.totalLevels){
    showGameComplete();
    return;
  }

  const q = QUESTIONS[game.level];

  game.answered = false;
  game.hintUsed = 0;

  qtTag.textContent = 'SEQUENCE · ' + q.type;
  qtHint.innerHTML = '观察规律，预测下一个数字';

  /* 数列展示 */
  qtSeq.innerHTML = '';
  for (let i = 0; i < q.seq.length; i++){
    const v = q.seq[i];

    if (v === '?'){
      const el = document.createElement('div');
      el.className = 'qt-num unknown';
      el.textContent = '?';
      qtSeq.appendChild(el);
    } else {
      const el = document.createElement('div');
      el.className = 'qt-num known';
      el.textContent = formatNumber(v);
      qtSeq.appendChild(el);
    }

    if (i < q.seq.length - 1){
      const c = document.createElement('div');
      c.className = 'qt-num comma';
      c.textContent = ',';
      qtSeq.appendChild(c);
    }
  }

  /* 选项 */
  qtOptions.innerHTML = '';
  const opts = shuffle(q.options.slice());

  for (let i = 0; i < opts.length; i++){
    const v = opts[i];
    const btn = document.createElement('button');
    btn.className = 'qt-opt';
    btn.textContent = formatNumber(v);
    btn.dataset.value = String(v);

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      onSelectOption(parseFloat(this.dataset.value), this);
    });

    qtOptions.appendChild(btn);
  }

  qtResult.className = 'qt-result';
  qtResult.textContent = '';
  btnNext.style.display = 'none';
  btnHint.style.display = '';

  questBox.classList.add('show');

  /* 更新 HUD */
  updateHUD();
}

function formatNumber(v){
  if (Number.isInteger(v)) return String(v);
  if (v === 0.5) return '1/2';
  return String(v);
}

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* =========================================================
   选项判定
   ========================================================= */
function onSelectOption(value, btn){
  if (game.answered) return;
  initAudio();
  game.answered = true;

  const q = QUESTIONS[game.level];
  const correct = Math.abs(value - q.answer) < 0.0001;

  /* 禁用所有选项 */
  const allOpts = qtOptions.querySelectorAll('.qt-opt');
  for (let i = 0; i < allOpts.length; i++){
    allOpts[i].classList.add('disabled');
  }

  if (correct){
    btn.classList.add('correct');
    playCorrect();

    game.totalCorrect++;

    qtResult.className = 'qt-result show good';
    qtResult.innerHTML = '✓ 正确！<span class="k">' + formatNumber(q.answer) +
      '</span> 是下一个数字。' +
      (q.hint ? '<br>规律：' + q.hint : '');

    btnHint.style.display = 'none';
    btnNext.style.display = '';

    /* 前进一步 */
    setTimeout(function(){
      advancePlayer();
    }, 600);

    showToast('✓ 前进一步', false);

  } else {
    btn.classList.add('wrong');
    playWrong();

    game.totalWrong++;

    qtResult.className = 'qt-result show bad';
    qtResult.innerHTML = '✗ 再想想… 正确答案是 <span class="k">' +
      formatNumber(q.answer) + '</span>。<br>规律：' + q.hint;

    btnHint.style.display = 'none';
    btnNext.style.display = '';

    showToast('✗ 答案错误', true);

    /* 停留在原地 */
    setTimeout(function(){
      showToast('◇ 原地思考', true);
    }, 1400);
  }
}

/* =========================================================
   推进玩家
   ========================================================= */
function advancePlayer(){
  game.level++;

  if (game.level > game.totalLevels){
    game.level = game.totalLevels;
  }

  /* 更新目标位置 */
  const nodeIdx = Math.min(game.level, nodePositions.length - 1);
  const node = nodePositions[nodeIdx];
  playerTargetPos.x = node.x;
  playerTargetPos.y = node.y;

  playAdvance();

  updateHUD();

  /* 检查是否抵达城堡 */
  if (game.level >= game.totalLevels){
    setTimeout(function(){
      showGameComplete();
    }, 900);
  } else {
    setTimeout(function(){
      renderQuestion();
    }, 950);
  }
}

/* =========================================================
   HUD
   ========================================================= */
function updateHUD(){
  const lvVal = document.getElementById('lvVal');
  const totalVal = document.getElementById('totalVal');
  const starsVal = document.getElementById('starsVal');

  if (lvVal) lvVal.textContent = Math.min(game.level + 1, game.totalLevels);
  if (totalVal) totalVal.textContent = game.totalLevels;

  if (starsVal){
    /* 按已通过关卡数点亮星星 */
    const passed = game.level;
    const filled = Math.min(5, Math.round((passed / game.totalLevels) * 5));
    let s = '';
    for (let i = 0; i < 5; i++){
      s += i < filled ? '★' : '<span class="off">★</span>';
    }
    starsVal.innerHTML = s;
  }
}

/* =========================================================
   游戏完成 / 重开
   ========================================================= */
function showGameComplete(){
  questBox.classList.remove('show');

  playVictory();
  showToast('🏰 抵达城堡 · 全部通关！', 'gold');

  setTimeout(function(){
    /* 撒花 */
    for (let i = 0; i < 40; i++){
      petals.push({
        x: Math.random() * W,
        y: -20,
        r: 8 + Math.random() * 16,
        vy: 40 + Math.random() * 60,
        vx: -20 + Math.random() * 40,
        rot: Math.random() * TAU,
        rotSpd: (Math.random() - 0.5) * 2,
        hue: 40 + Math.random() * 60,
        alpha: 0.42 + Math.random() * 0.32
      });
    }
  }, 200);

  setTimeout(function(){
    showToast('答对 ' + game.totalCorrect + ' · 答错 ' + game.totalWrong, 'gold');
  }, 2200);

  setTimeout(function(){
    restartGame();
  }, 4800);
}

function restartGame(){
  game.level = 0;
  game.totalCorrect = 0;
  game.totalWrong = 0;
  game.answered = false;

  /* 重置玩家位置 */
  if (nodePositions.length > 0){
    playerPos.x = nodePositions[0].x;
    playerPos.y = nodePositions[0].y;
    playerTargetPos.x = playerPos.x;
    playerTargetPos.y = playerPos.y;
  }

  playClick();
  updateHUD();

  setTimeout(function(){
    renderQuestion();
  }, 400);
}

/* =========================================================
   Toast
   ========================================================= */
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(text, type){
  toastEl.textContent = text;
  toastEl.classList.remove('bad', 'gold');
  if (type === 'bad') toastEl.classList.add('bad');
  else if (type === 'gold') toastEl.classList.add('gold');

  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toastEl.classList.remove('show');
  }, 1600);
}

/* =========================================================
   按钮
   ========================================================= */
btnHint.addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  if (game.answered) return;

  const q = QUESTIONS[game.level];
  qtHint.innerHTML = '💡 <span class="hl">' + q.hint + '</span>';
  playClick();

  game.hintUsed++;
});

btnNext.addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  playClick();

  if (game.level >= game.totalLevels){
    showGameComplete();
  } else {
    renderQuestion();
  }
});

document.getElementById('btnRestart').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  restartGame();
});

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  updatePlayerPos(dt);
  render(t);
}

/* =========================================================
   启动
   ========================================================= */
resize();
computeMap();

/* 玩家起点 */
if (nodePositions.length > 0){
  playerPos.x = nodePositions[0].x;
  playerPos.y = nodePositions[0].y;
  playerTargetPos.x = playerPos.x;
  playerTargetPos.y = playerPos.y;
}

updateHUD();

setTimeout(function(){
  renderQuestion();
}, 800);

setTimeout(function(){
  showToast('识别规律 · 预测下一项', false);
}, 1400);

window.addEventListener('pointerdown', function(){
  initAudio();
}, { once: false });

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    initAudio();
    if (game.answered) btnNext.click();
  } else if (e.key === 'h' || e.key === 'H'){
    initAudio();
    btnHint.click();
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    restartGame();
  }
});

requestAnimationFrame(loop);

})();
</script>
