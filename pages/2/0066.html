<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNE · 沙丘之风</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0e0c0a;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }
        .overlay:hover {
            opacity: 0.85;
        }
        .title {
            color: rgba(235, 215, 180, 0.7);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(220, 160, 80, 0.4);
        }
        .hint {
            color: rgba(190, 165, 130, 0.45);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            .overlay { bottom: 18px; }
            .title { font-size: 8px; letter-spacing: 0.45em; }
            .hint { font-size: 6px; letter-spacing: 0.22em; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">Dune</div>
        <div class="hint">move · click</div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let grains = [];
            let mouse = { x: -9999, y: -9999, active: false, vx: 0, vy: 0, lastX: -9999, lastY: -9999 };
            let time = 0;
            let colorShift = 0;
            let sandBursts = [];
            let maxGrains = 280;

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0e0c0a';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 沙粒类 ─────────────────────────────────────────────────
            class Grain {
                constructor() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.8;
                    // 沙色：金黄、琥珀、赤陶、浅棕
                    const colorRoll = Math.random();
                    if (colorRoll < 0.4) {
                        this.hue = 35 + Math.random() * 20;      // 金黄
                    } else if (colorRoll < 0.7) {
                        this.hue = 20 + Math.random() * 15;      // 赤陶
                    } else if (colorRoll < 0.9) {
                        this.hue = 45 + Math.random() * 10;      // 琥珀
                    } else {
                        this.hue = 10 + Math.random() * 10;      // 深棕
                    }
                    this.saturation = 45 + Math.random() * 35;
                    this.lightness = 35 + Math.random() * 30;
                    this.alpha = 0.35 + Math.random() * 0.45;
                    this.size = 0.8 + Math.random() * 1.8;
                    this.stretch = 1.0;
                    this.wobblePhase = Math.random() * Math.PI * 2;
                    this.wobbleSpeed = 0.3 + Math.random() * 0.6;
                }

                update(dt, mouse, t) {
                    // 主风流场：多层正弦波叠加，模拟沙丘上的风
                    const windAngle = 
                        Math.sin(this.x * 0.0018 + t * 0.5) * 0.6 +
                        Math.cos(this.y * 0.0022 + t * 0.38) * 0.6 +
                        Math.sin((this.x + this.y) * 0.0013 + t * 0.32) * 0.45 +
                        Math.cos((this.x - this.y) * 0.0017 + t * 0.28) * 0.45 +
                        Math.sin(this.x * 0.003 + this.y * 0.0025 + t * 0.22) * 0.35;

                    const windSpeed = 0.55 + 
                        Math.sin(this.x * 0.002 + t * 0.45) * 0.3 +
                        Math.cos(this.y * 0.0018 + t * 0.35) * 0.3;

                    // 风向向量
                    const flowX = Math.cos(windAngle) * windSpeed;
                    const flowY = Math.sin(windAngle) * windSpeed * 0.7;

                    // 沙粒被风推动
                    this.vx += (flowX - this.vx) * 0.06;
                    this.vy += (flowY - this.vy) * 0.06;

                    // 鼠标风涡
                    if (mouse.active) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const distSq = dx * dx + dy * dy;
                        const radius = 200;
                        const radiusSq = radius * radius;
                        if (distSq < radiusSq && distSq > 0.01) {
                            const dist = Math.sqrt(distSq);
                            const falloff = 1 - dist / radius;
                            // 涡旋：切向力 + 轻微径向推离
                            const tangentX = -dy / dist;
                            const tangentY = dx / dist;
                            const vortexStrength = falloff * 1.5;
                            const radialStrength = falloff * 0.4;
                            this.vx += (tangentX * vortexStrength + dx / dist * radialStrength) * 0.25;
                            this.vy += (tangentY * vortexStrength + dy / dist * radialStrength) * 0.25;
                            // 被搅动时增亮
                            this.alpha = Math.min(0.85, this.alpha + 0.02);
                        }
                    }

                    // 阻尼
                    this.vx *= 0.955;
                    this.vy *= 0.955;

                    // 速度限制
                    const maxSpeed = 3.5;
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    // 拉伸系数（基于速度）
                    this.stretch = 1.0 + Math.min(speed * 0.6, 3.0);

                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界环绕
                    if (this.x < -30) this.x = W + 30;
                    if (this.x > W + 30) this.x = -30;
                    if (this.y < -30) this.y = H + 30;
                    if (this.y > H + 30) this.y = -30;
                }

                draw(ctx, t) {
                    const hue = this.hue + colorShift + Math.sin(t * 0.4 + this.wobblePhase) * 8;
                    const sat = this.saturation;
                    const light = this.lightness + Math.sin(t * 0.6 + this.wobblePhase) * 8;
                    const alpha = this.alpha;

                    // 沿运动方向拉伸沙粒
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    const stretch = 1.0 + Math.min(speed * 0.5, 3.5);
                    const angle = Math.atan2(this.vy, this.vx);
                    const lenX = Math.cos(angle) * this.size * stretch;
                    const lenY = Math.sin(angle) * this.size * stretch;

                    // 绘制拉伸的沙粒（细丝）
                    const gradient = ctx.createLinearGradient(
                        this.x - lenX * 2, this.y - lenY * 2,
                        this.x + lenX * 2, this.y + lenY * 2
                    );
                    gradient.addColorStop(0, 'transparent');
                    gradient.addColorStop(0.5, `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`);
                    gradient.addColorStop(1, `hsla(${hue}, ${sat}%, ${light + 15}%, ${alpha * 0.8})`);

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = this.size * 0.7;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(this.x - lenX * 2, this.y - lenY * 2);
                    ctx.lineTo(this.x + lenX * 2, this.y + lenY * 2);
                    ctx.stroke();

                    // 沙粒头部光点
                    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light + 20}%, ${alpha * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 初始化沙粒 ────────────────────────────────────────────
            function initGrains() {
                grains = [];
                for (let i = 0; i < maxGrains; i++) {
                    grains.push(new Grain());
                }
            }

            // ─── 沙尘暴爆发 ───────────────────────────────────────────
            function createSandBurst(x, y) {
                const count = 30 + Math.floor(Math.random() * 20);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 8;
                    sandBursts.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1,
                        life: 0.7 + Math.random() * 0.8,
                        maxLife: 1.5,
                        size: 1 + Math.random() * 3,
                        hue: 30 + colorShift + Math.random() * 40 - 20,
                        sat: 50 + Math.random() * 30,
                        light: 45 + Math.random() * 30,
                        alpha: 0.75,
                    });
                }
                if (sandBursts.length > 180) {
                    sandBursts.splice(0, sandBursts.length - 180);
                }
            }

            function updateSandBursts(dt) {
                for (let i = sandBursts.length - 1; i >= 0; i--) {
                    const p = sandBursts[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                    p.life -= 0.02 * dt;
                    if (p.life <= 0) {
                        sandBursts.splice(i, 1);
                    }
                }
            }

            function drawSandBursts(ctx) {
                for (const p of sandBursts) {
                    const alpha = p.life * p.alpha;
                    const size = p.size * p.life;
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2.5);
                    gradient.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`);
                    gradient.addColorStop(0.6, `hsla(${p.hue}, ${p.sat}%, ${p.light - 5}%, ${alpha * 0.4})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 鼠标光晕 ──────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 70;
                const hue = 35 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 50%, 65%, 0.05)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 45%, 60%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    const dtNorm = fixedStep / 1000 * 60;
                    // 更新鼠标速度
                    if (mouse.active && mouse.lastX > -9000) {
                        mouse.vx = (mouse.x - mouse.lastX) * 0.04;
                        mouse.vy = (mouse.y - mouse.lastY) * 0.04;
                    } else {
                        mouse.vx *= 0.9;
                        mouse.vy *= 0.9;
                    }
                    mouse.lastX = mouse.x;
                    mouse.lastY = mouse.y;

                    for (const g of grains) {
                        g.update(dtNorm, mouse, time);
                    }
                    updateSandBursts(dtNorm);
                }

                // 半透明覆盖，形成沙纹拖尾
                ctx.fillStyle = 'rgba(14, 12, 10, 0.15)';
                ctx.fillRect(0, 0, W, H);

                // 绘制沙粒
                for (const g of grains) {
                    g.draw(ctx, time);
                }

                // 绘制沙尘暴
                drawSandBursts(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ──────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
                mouse.vx = 0;
                mouse.vy = 0;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createSandBurst(mouse.x, mouse.y);
                colorShift += 10 + Math.random() * 15;
                if (colorShift > 60) colorShift = -10;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createSandBurst(mouse.x, mouse.y);
                    colorShift += 10 + Math.random() * 15;
                    if (colorShift > 60) colorShift = -10;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
                mouse.vx = 0;
                mouse.vy = 0;
            }

            function onResize() {
                setupCanvas();
                // 沙粒数量动态调整
                const targetCount = Math.max(120, Math.min(300, Math.floor(W * H / 6000)));
                if (targetCount !== grains.length) {
                    while (grains.length < targetCount) {
                        grains.push(new Grain());
                    }
                    if (grains.length > targetCount) {
                        grains.length = targetCount;
                    }
                }
                sandBursts = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                maxGrains = Math.max(120, Math.min(300, Math.floor(W * H / 6000)));
                initGrains();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0e0c0a';
                    ctx.fillRect(0, 0, W, H);
                }
            });
        })();
    </script>
</body>
</html>
