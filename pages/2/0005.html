<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水墨竹韵</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* 兜底背景色，完全匹配 Pixi 应用的背景，防黑屏 */
            background-color: #e8e6d9; 
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* 极简提示，几乎不可见 */
        #hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(100, 100, 80, 0.5);
            font-family: sans-serif;
            font-size: 12px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="hint">移动产生微风 · 点击吹散竹叶</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
    
    <script>
        // 1. 初始化 PixiJS 应用
        const app = new PIXI.Application({
            resizeTo: window,
            backgroundColor: 0xe8e6d9, // 图片的米白底色
            antialias: true,
            autoDensity: true,
            resolution: window.devicePixelRatio || 1
        });
        document.getElementById('container').appendChild(app.view);

        // 2. 预烘焙纹理（突破性能瓶颈的关键）
        const textures = {};
        
        function createTextures() {
            const g = new PIXI.Graphics();
            
            // 纹理：竹竿 (包含竹节)
            g.lineStyle(2, 0x1a3b1a, 0.8);
            g.beginFill(0x4a6b4a, 0.8);
            g.drawRect(-8, 0, 16, 120);
            g.endFill();
            // 竹节
            g.lineStyle(3, 0x1a3b1a, 1);
            g.moveTo(-8, 20); g.lineTo(8, 20);
            g.moveTo(-8, 50); g.lineTo(8, 50);
            g.moveTo(-8, 80); g.lineTo(8, 80);
            g.moveTo(-8, 110); g.lineTo(8, 110);
            textures.bamboo = app.renderer.generateTexture(g);
            g.clear();

            // 纹理：竹叶
            g.beginFill(0x6b8e6b, 0.9);
            g.moveTo(0, 0);
            g.bezierCurveTo(10, -5, 20, -2, 30, 0);
            g.bezierCurveTo(20, 5, 10, 5, 0, 0);
            g.endFill();
            textures.leaf = app.renderer.generateTexture(g);
            g.clear();

            // 纹理：远景浅色竹竿（水墨朦胧感）
            g.lineStyle(1, 0x3a5f3a, 0.3);
            g.beginFill(0x4a6b4a, 0.3);
            g.drawRect(-6, 0, 12, 200);
            g.endFill();
            g.lineStyle(2, 0x3a5f3a, 0.4);
            g.moveTo(-6, 40); g.lineTo(6, 40);
            g.moveTo(-6, 100); g.lineTo(6, 100);
            g.moveTo(-6, 160); g.lineTo(6, 160);
            textures.bamboo_far = app.renderer.generateTexture(g);
            g.clear();

            g.destroy(); // 释放临时绘制对象的内存
        }
        createTextures();

        // 3. 创建对象池和竹子实例
        const bamboos = [];
        const totalBamboos = 40; // 合理控制数量保证高性能
        const baseContainer = new PIXI.Container();
        app.stage.addChild(baseContainer);

        const createBamboo = (isFar = false) => {
            const container = new PIXI.Container();
            const texture = isFar ? textures.bamboo_far : textures.bamboo;
            const pole = new PIXI.Sprite(texture);
            pole.anchor.set(0.5, 1); // 底部作为旋转中心
            
            // 添加叶片
            const leavesContainer = new PIXI.Container();
            const leafCount = 3 + Math.floor(Math.random() * 4);
            for (let i = 0; i < leafCount; i++) {
                const leaf = new PIXI.Sprite(textures.leaf);
                leaf.anchor.set(0, 0.5);
                leaf.scale.set(0.8 + Math.random() * 1.2);
                leaf.rotation = Math.random() * Math.PI * 2;
                leaf.x = (Math.random() - 0.5) * 30;
                leaf.y = -Math.random() * 100;
                leavesContainer.addChild(leaf);
            }
            leavesContainer.y = -pole.height;

            container.addChild(pole);
            container.addChild(leavesContainer);
            
            // 初始位置和属性
            container.x = Math.random() * app.screen.width;
            container.y = app.screen.height + 50; // 从底部开始
            container.scale.set(0.8 + Math.random() * 1.5);
            container.alpha = isFar ? 0.5 : 0.9;
            container.phase = Math.random() * Math.PI * 2;
            container.swaySpeed = 0.02 + Math.random() * 0.03;
            
            // 存下基础位置
            container.origX = container.x;
            
            baseContainer.addChild(container);
            bamboos.push(container);
        };

        // 铺满画面
        for (let i = 0; i < totalBamboos; i++) {
            createBamboo(i % 3 === 0); // 1/3 是远景
        }

        // 4. 交互变量
        let mouse = { x: app.screen.width / 2, y: app.screen.height / 2 };
        let windForce = 0; // 点击瞬间激发的风力

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', () => {
            windForce = 3.0; // 给一个初始强风
        });

        // 5. 动画循环
        app.ticker.add((delta) => {
            const dt = delta / 60; // 转换为秒，保证不同帧率下速度一致

            // 减缓风力的衰减
            windForce *= 0.95;
            if (windForce < 0.01) windForce = 0;

            bamboos.forEach(bamboo => {
                // 待机微风动画
                const baseSway = Math.sin(app.ticker.lastTime / 1000 * 2 * Math.PI * bamboo.swaySpeed + bamboo.phase) * 0.05;
                
                // 鼠标引力/斥力交互（拨动竹林）
                let mouseInfluence = 0;
                const dx = bamboo.x - mouse.x;
                const dy = bamboo.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy) + 0.001; // 防除零

                if (dist < 250) {
                    // 距离越近摆动幅度越大，方向相反
                    mouseInfluence = (250 - dist) / 250 * 0.15; 
                    if (mouse.x < bamboo.origX) mouseInfluence *= -1;
                }

                // 点击爆发
                const clickInfluence = windForce * 0.1 * (dy / dist);

                // 组合最终旋转
                bamboo.rotation = baseSway + mouseInfluence + clickInfluence;

                // 加入细微的上下浮动，增强灵动感
                bamboo.y += Math.sin(app.ticker.lastTime / 800 + bamboo.phase) * 0.01 * dt;
            });
        });

        // 窗口缩放处理
        window.addEventListener('resize', () => {
            app.renderer.resize(window.innerWidth, window.innerHeight);
            // 重新分布
            bamboos.forEach(bamboo => {
                if (bamboo.x > window.innerWidth) bamboo.x = bamboo.origX = Math.random() * window.innerWidth;
            });
        });
    </script>
</body>
</html>
