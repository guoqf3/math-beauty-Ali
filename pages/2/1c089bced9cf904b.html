<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元素周期表 · Periodic Table</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  body{
    min-height:100vh;
    background:radial-gradient(ellipse at 50% 0%, #111827 0%, #070b14 55%, #03060c 100%);
    color:#e8eefc;
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
    padding:190px 16px 56px;
    display:flex;flex-direction:column;align-items:center;
    -webkit-tap-highlight-color:transparent;
  }

  header{text-align:center;margin-bottom:18px}
  h1{
    font-size:27px;font-weight:800;letter-spacing:4px;
    background:linear-gradient(90deg,#4dabf7 0%,#9775fa 45%,#f783ac 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;margin-bottom:7px;
  }
  .sub{font-size:12px;color:#61748f;letter-spacing:2px}

  /* ── 固定信息条 ── */
  #infoCard{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:12px 20px;
    border-bottom:1px solid rgba(120,170,255,.14);
    background:rgba(8,13,22,.92);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;
    transition:border-color .3s, background .3s;
  }
  #infoCard.active{border-bottom-color:rgba(120,170,255,.4)}

  .ic-symbol{
    position:relative;width:54px;height:54px;flex:none;
    border-radius:11px;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
    transition:background .3s,border-color .3s;
  }
  .ic-symbol .ic-z{
    position:absolute;top:3px;left:6px;font-size:9.5px;opacity:.6;
    font-variant-numeric:tabular-nums;
  }
  .ic-symbol .ic-sym{font-size:20px;font-weight:800;line-height:1}

  .ic-main{min-width:100px}
  .ic-name{font-size:17px;font-weight:700;margin-bottom:2px}
  .ic-cat{font-size:11px;color:#7c90ad;letter-spacing:.5px}

  .ic-stats{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .ic-stat{display:flex;flex-direction:column;gap:2px}
  .ic-stat label{font-size:9.5px;color:#5f7391;letter-spacing:.5px}
  .ic-stat value{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:#c8d9f2}

  .ic-stat.val value{
    color:#ffd86b;
    text-shadow:0 0 10px rgba(255,200,80,.35);
    font-family:'Menlo','Consolas','Courier New',monospace;
    font-size:12.5px;
    letter-spacing:.5px;
  }

  /* ── 常见化合物（右侧）── */
  .ic-chem{
    margin-left:auto;
    display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;
    padding-left:14px;
    border-left:1px solid rgba(120,170,255,.12);
  }
  .chem-group{display:flex;flex-direction:column;gap:3px;max-width:210px}
  .chem-label{
    display:flex;align-items:center;gap:5px;
    font-size:10px;color:#5f7391;letter-spacing:.5px;
    white-space:nowrap;
  }
  .chem-label::before{
    content:'';width:5px;height:5px;border-radius:50%;flex:none;
  }
  .chem-group.acid .chem-label::before{background:#ff6b6b;box-shadow:0 0 6px #ff6b6b}
  .chem-group.base .chem-label::before{background:#4dabf7;box-shadow:0 0 6px #4dabf7}
  .chem-group.salt .chem-label::before{background:#a9e34b;box-shadow:0 0 6px #a9e34b}
  .chem-group value{
    font-family:'Menlo','Consolas','Courier New',monospace;
    font-size:11.5px;color:#c8d9f2;line-height:1.6;
    word-break:break-word;
  }

  /* 电子排布 + 各层电子数 */
  .ic-config{
    display:flex;gap:24px;flex-wrap:wrap;align-items:center;
    flex-basis:100%;
    padding-top:8px;margin-top:2px;
    border-top:1px solid rgba(120,170,255,.1);
  }
  .cfg-item{display:flex;align-items:baseline;gap:8px;min-width:0}
  .cfg-item label{
    font-size:10px;color:#5f7391;letter-spacing:.5px;
    white-space:nowrap;flex:none;
  }
  .cfg-item value{
    font-family:'Menlo','Consolas','Courier New',monospace;
    font-size:12.5px;color:#c8d9f2;line-height:1.5;
    word-break:break-all;
  }

  /* 物理化学性质 */
  .ic-phys{
    display:flex;gap:26px;flex-wrap:wrap;align-items:center;
    flex-basis:100%;
    padding-top:8px;margin-top:2px;
    border-top:1px solid rgba(120,170,255,.1);
  }
  .phys-item{display:flex;align-items:baseline;gap:8px}
  .phys-item label{
    font-size:10px;color:#5f7391;letter-spacing:.5px;
    white-space:nowrap;flex:none;
  }
  .phys-item value{
    font-family:'Menlo','Consolas','Courier New',monospace;
    font-size:12.5px;color:#a8e6b6;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .ic-placeholder{font-size:13px;color:#5f7391;letter-spacing:.5px}

  @media (max-width:1180px){
    .ic-chem{margin-left:0;border-left:none;padding-left:0}
  }
  @media (max-width:760px){
    .ic-stats{gap:12px}
    .ic-config{gap:14px}
    .ic-phys{gap:14px}
    .ic-chem{gap:14px}
  }

  /* ── 周期表容器 ── */
  #tableWrap{
    width:100%;max-width:1300px;overflow-x:auto;padding-bottom:10px;
  }
  #tableWrap::-webkit-scrollbar{height:8px}
  #tableWrap::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:4px}
  #tableWrap::-webkit-scrollbar-thumb{background:rgba(120,170,255,.22);border-radius:4px}
  #tableWrap::-webkit-scrollbar-thumb:hover{background:rgba(120,170,255,.4)}

  #table{
    display:grid;
    grid-template-columns:repeat(18, minmax(58px, 1fr));
    grid-template-rows:repeat(7, 64px) 22px repeat(2, 64px);
    gap:5px;
    min-width:1120px;
  }

  .cell{
    position:relative;border-radius:8px;cursor:pointer;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:3px 2px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.025);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),
               box-shadow .16s, border-color .16s, opacity .3s;
    user-select:none;overflow:hidden;
  }
  .cell::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 120%, var(--c) 0%, transparent 68%);
    opacity:.13;pointer-events:none;transition:opacity .25s;
  }
  .cell:hover{
    transform:translateY(-3px) scale(1.08);
    z-index:20;border-color:var(--c);
    box-shadow:0 0 0 1px var(--c), 0 0 22px -2px var(--c), 0 8px 24px rgba(0,0,0,.6);
  }
  .cell:hover::after{opacity:.3}

  .cell .z{
    position:absolute;top:3px;left:5px;
    font-size:9px;line-height:1;opacity:.62;
    font-variant-numeric:tabular-nums;
  }
  .cell .sym{
    font-size:19px;font-weight:800;line-height:1;
    color:var(--c);text-shadow:0 0 14px var(--c);
    transition:text-shadow .25s;
  }
  .cell:hover .sym{text-shadow:0 0 20px var(--c),0 0 34px var(--c)}
  .cell .name{
    font-size:9px;line-height:1;margin-top:3px;
    color:#93a6c2;opacity:.85;white-space:nowrap;
  }

  .cell.dim{opacity:.13;filter:grayscale(.85)}
  .cell.lit{
    border-color:var(--c);
    box-shadow:0 0 0 1px var(--c), 0 0 16px -3px var(--c);
  }

  .placeholder{
    border:1px dashed rgba(120,170,255,.22);
    background:rgba(120,170,255,.03);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:9.5px;color:#5f7391;letter-spacing:.5px;
    text-align:center;line-height:1.35;cursor:default;
  }

  #legend{
    width:100%;max-width:1300px;margin-top:20px;
    display:flex;flex-wrap:wrap;gap:9px 20px;justify-content:center;
  }
  .lg{
    display:flex;align-items:center;gap:7px;
    font-size:11.5px;color:#8ea3c2;cursor:pointer;
    padding:4px 9px;border-radius:7px;
    border:1px solid transparent;
    transition:background .2s,border-color .2s,color .2s;
    user-select:none;
  }
  .lg:hover{background:rgba(255,255,255,.05);color:#c8d9f2}
  .lg.on{border-color:rgba(120,170,255,.4);background:rgba(120,170,255,.09);color:#e8eefc}
  .lg i{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 9px -1px currentColor}

  footer{
    margin-top:22px;font-size:11px;color:#465872;letter-spacing:.6px;
    text-align:center;line-height:1.8;
  }
</style>

const toSup = n => String(n).split('').map(c => SUP[c]).join('');

const ORB_ORDER = [
  [1,'s',2],[2,'s',2],[2,'p',6],[3,'s',2],[3,'p',6],[4,'s',2],[3,'d',10],
  [4,'p',6],[5,'s',2],[4,'d',10],[5,'p',6],[6,'s',2],[4,'f',14],[5,'d',10],
  [6,'p',6],[7,'s',2],[5,'f',14],[6,'d',10],[7,'p',6]
];

const DISPLAY_ORDER = [
  [1,'s'],[2,'s'],[2,'p'],[3,'s'],[3,'p'],[3,'d'],
  [4,'s'],[4,'p'],[4,'d'],[4,'f'],
  [5,'s'],[5,'p'],[5,'d'],[5,'f'],
  [6,'s'],[6,'p'],[6,'d'],[6,'f'],
  [7,'s'],[7,'p'],[7,'d'],[7,'f']
];

const EXCEPTIONS = {
  24: '1s²2s²2p⁶3s²3p⁶3d⁵4s¹',
  29: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s¹',
  41: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d⁴5s¹',
  42: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d⁵5s¹',
  44: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d⁷5s¹',
  45: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d⁸5s¹',
  46: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰',
  47: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s¹',
  57: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s²5p⁶5d¹6s²',
  58: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s²5p⁶4f¹5d¹6s²',
  64: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s²5p⁶4f⁷5d¹6s²',
  78: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s²5p⁶4f¹⁴5d⁹6s¹',
  79: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s²5p⁶4f¹⁴5d¹⁰6s¹',
  89: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰4f¹⁴5s²5p⁶5d¹⁰6s²6p⁶6d¹7s²',
  90: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰4f¹⁴5s²5p⁶5d¹⁰6s²6p⁶6d²7s²',
  91: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰4f¹⁴5s²5p⁶5d¹⁰5f²6s²6p⁶6d¹7s²',
  92: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰4f¹⁴5s²5p⁶5d¹⁰5f³6s²6p⁶6d¹7s²',
  93: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰4f¹⁴5s²5p⁶5d¹⁰5f⁴6s²6p⁶6d¹7s²',
  96: '1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰4f¹⁴5s²5p⁶5d¹⁰5f⁷6s²6p⁶6d¹7s²',
  103:'1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰4f¹⁴5s²5p⁶5d¹⁰5f¹⁴6s²6p⁶7s²7p¹'
};

function getConfig(z) {
  if (EXCEPTIONS[z]) return EXCEPTIONS[z];
  const fills = {};
  let rem = z;
  for (const [n, l, cap] of ORB_ORDER) {
    if (rem <= 0) break;
    const e = Math.min(cap, rem);
    rem -= e;
    fills[`${n}${l}`] = e;
  }
  const parts = [];
  for (const [n, l] of DISPLAY_ORDER) {
    const k = `${n}${l}`;
    if (fills[k]) parts.push(`${n}${l}${toSup(fills[k])}`);
  }
  return parts.join('');
}

function parseShells(config) {
  const MAP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const shells = {};
  const re = /(\d)([spdf])([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g;
  let m;
  while ((m = re.exec(config))) {
    const n = +m[1];
    let c = 0;
    for (const ch of m[3]) c = c * 10 + MAP.indexOf(ch);
    shells[n] = (shells[n] || 0) + c;
  }
  const parts = [];
  for (let i = 1; i <= 7; i++) if (shells[i]) parts.push(shells[i]);
  return parts;
}

const MOLECULE = {
  1:'H₂', 7:'N₂', 8:'O₂', 9:'F₂', 15:'P₄', 16:'S₈',
  17:'Cl₂', 35:'Br₂', 53:'I₂'
};
const getMolecule = (z, sym) => MOLECULE[z] || sym;

function fmtT(v) {
  if (v === '—' || v === undefined) return '—';
  return Number.isInteger(v) ? v + ' °C' : v.toFixed(1) + ' °C';
}

/* ═══════════════════════════════════════════════════════════
   7. 生成周期表
   ═══════════════════════════════════════════════════════════ */
const tableEl = document.getElementById('table');

for (const [z, sym, name, mass, cat, col, row] of ELEMENTS) {
  const c = CATS[cat];
  const el = document.createElement('div');
  el.className = 'cell';
  el.style.gridColumn = col;
  el.style.gridRow    = row;
  el.style.setProperty('--c', c.color);
  el.dataset.cat = cat;

  el.innerHTML =
    `<span class="z">${z}</span>` +
    `<span class="sym">${sym}</span>` +
    `<span class="name">${name}</span>`;

  el.addEventListener('mouseenter', () => showInfo(z, sym, name, mass, cat, col, row));
  el.addEventListener('click', e => {
    e.stopPropagation();
    toggleHighlight(cat);
  });

  tableEl.appendChild(el);
}

/* 镧系 / 锕系 占位格 */
const ph1 = document.createElement('div');
ph1.className = 'placeholder';
ph1.style.gridColumn = 3; ph1.style.gridRow = 6;
ph1.innerHTML = '57-71<br>镧系';
tableEl.appendChild(ph1);

const ph2 = document.createElement('div');
ph2.className = 'placeholder';
ph2.style.gridColumn = 3; ph2.style.gridRow = 7;
ph2.innerHTML = '89-103<br>锕系';
tableEl.appendChild(ph2);

/* ═══════════════════════════════════════════════════════════
   8. 信息卡
   ═══════════════════════════════════════════════════════════ */
const periodOf = row => (row >= 1 && row <= 7) ? row : (row === 9 ? 6 : row === 10 ? 7 : '—');
const groupOf  = (col, row) => (row === 9 || row === 10) ? '镧系/锕系' : col;

function showInfo(z, sym, name, mass, cat, col, row) {
  const c        = CATS[cat];
  const config   = getConfig(z);
  const shells   = parseShells(config).join(', ');
  const molecule = getMolecule(z, sym);
  const valence  = VALENCE[z] || '—';
  const p        = PHYS[z] || {};
  const chem     = getChem(z);

  infoCardEl.classList.add('active');
  infoCardEl.innerHTML =
    `<div class="ic-symbol"
          style="--c:${c.color};background:${c.color}18;border-color:${c.color}55">
       <span class="ic-z">${z}</span>
       <span class="ic-sym" style="color:${c.color};text-shadow:0 0 16px ${c.color}">${sym}</span>
     </div>

     <div class="ic-main">
       <div class="ic-name">${name}</div>
       <div class="ic-cat" style="color:${c.color}">${c.label}</div>
     </div>

     <div class="ic-stats">
       <div class="ic-stat"><label>相对原子质量</label><value>${mass}</value></div>
       <div class="ic-stat"><label>原子序数</label><value>${z}</value></div>
       <div class="ic-stat"><label>周期</label><value>${periodOf(row)}</value></div>
       <div class="ic-stat"><label>族</label><value>${groupOf(col, row)}</value></div>
       <div class="ic-stat"><label>单质分子式</label><value>${molecule}</value></div>
       <div class="ic-stat val"><label>常见化合价</label><value>${valence}</value></div>
     </div>

     <!-- 常见化合物（右侧） -->
     <div class="ic-chem">
       <div class="chem-group acid">
         <div class="chem-label">酸</div>
         <value>${chem.acid}</value>
       </div>
       <div class="chem-group base">
         <div class="chem-label">碱</div>
         <value>${chem.base}</value>
       </div>
       <div class="chem-group salt">
         <div class="chem-label">盐</div>
         <value>${chem.salt}</value>
       </div>
     </div>

     <div class="ic-config">
       <div class="cfg-item">
         <label>电子排布式</label>
         <value>${config}</value>
       </div>
       <div class="cfg-item">
         <label>各层电子数 (K~Q)</label>
         <value>${shells}</value>
       </div>
     </div>

     <div class="ic-phys">
       <div class="phys-item"><label>熔点</label><value>${fmtT(p.melt)}</value></div>
       <div class="phys-item"><label>沸点</label><value>${fmtT(p.boil)}</value></div>
       <div class="phys-item"><label>密度</label><value>${p.density || '—'}</value></div>
       <div class="phys-item"><label>电负性</label><value>${p.en !== undefined ? p.en : '—'}</value></div>
     </div>`;

  syncTopPadding();
}

/* ═══════════════════════════════════════════════════════════
   9. 图例
   ═══════════════════════════════════════════════════════════ */
const legendEl = document.getElementById('legend');

for (const key in CATS) {
  const c = CATS[key];
  const item = document.createElement('div');
  item.className = 'lg';
  item.dataset.cat = key;
  item.innerHTML = `<i style="background:${c.color};color:${c.color}"></i>${c.label}`;
  item.addEventListener('click', e => {
    e.stopPropagation();
    toggleHighlight(key);
  });
  legendEl.appendChild(item);
}

/* ═══════════════════════════════════════════════════════════
   10. 高亮
   ═══════════════════════════════════════════════════════════ */
let activeCat = null;

function toggleHighlight(cat) {
  if (activeCat === cat) { clearHighlight(); return; }
  activeCat = cat;
  document.querySelectorAll('.cell').forEach(el => {
    const same = el.dataset.cat === cat;
    el.classList.toggle('lit', same);
    el.classList.toggle('dim', !same);
  });
  document.querySelectorAll('.lg').forEach(el => {
    el.classList.toggle('on', el.dataset.cat === cat);
  });
}
function clearHighlight() {
  activeCat = null;
  document.querySelectorAll('.cell').forEach(el => el.classList.remove('lit', 'dim'));
  document.querySelectorAll('.lg').forEach(el => el.classList.remove('on'));
}

document.body.addEventListener('click', () => clearHighlight());
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearHighlight(); });
</script>
