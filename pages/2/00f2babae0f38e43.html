<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>微分方程相图 · 轨迹与奇点</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:26px 34px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,255,.36);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 40%,#a890ff 72%,#e090d0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;

  #stats{

  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;

  #stats .k{color:rgba(190,205,255,.52);}

  #sysInfo{
    position:absolute;bottom:0;left:0;

  }
  #sysInfo .lab{

  }
  .sg-row{
    display:flex;align-items:center;gap:10px;

  }
  .sg-mark{
    width:14px;height:14px;

    font-size:11px;line-height:1;
  }
  .sg-row .sg-nm{
    color:rgba(200,215,250,.52);
    min-width:70px;
  }
  .sg-row .sg-type{
    color:rgba(255,215,150,.94);

  }
  .sg-row .sg-re{
    font-size:9px;
    color:rgba(160,200,245,.46);
  }

  #sysBtns{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding:0 0 26px;
    display:flex;gap:8px;
    flex-wrap:wrap;justify-content:center;
    max-width:92vw;
    opacity:0;animation:fade 1.6s 1.5s ease forwards;
    pointer-events:auto;
  }
  .sbtn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.14em;
    color:rgba(200,215,250,.62);
    background:rgba(22,30,58,.52);
    border:1px solid rgba(120,155,230,.26);
    border-radius:8px;
    padding:8px 16px;cursor:pointer;
    transition:.28s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    white-space:nowrap;
  }
  .sbtn:hover{
    border-color:rgba(180,220,255,.82);
    color:rgba(230,240,255,.95);
    background:rgba(60,95,165,.26);
  }
  .sbtn.on{
    border-color:rgba(255,210,140,.88);
    color:rgba(255,235,200,.98);
    background:rgba(150,100,60,.30);
    box-shadow:0 0 16px rgba(255,170,110,.34);
  }

  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 34px 28px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:760px){
    #title{padding:14px 16px;}
    #title .formula{font-size:10px;}
    #stats{padding:14px 16px;font-size:8.5px;}
    #sysInfo{padding:0 16px 16px;}
    .sg-row{font-size:9px;}
    .sg-row .sg-nm{min-width:52px;}
    #sysBtns{padding:0 0 14px;gap:5px;}
    .sbtn{font-size:8.5px;padding:6px 10px;border-radius:6px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">PHASE PORTRAIT · SINGULARITIES</div>
    <h1>微分方程相图</h1>
    <div class="formula">
      dx/dt = <span class="hl1">f(x,y)</span> &nbsp;·&nbsp; 
      dy/dt = <span class="hl2">g(x,y)</span>
    </div>
  </div>

  <div id="stats">
    <span class="lab">LIVE STATE</span>
    <div><span class="k">系统 </span><span class="v" id="sysName">稳定结点</span></div>
    <div><span class="k">奇点 </span><span class="v" id="sgCount">1</span></div>
    <div><span class="k">轨迹 </span><span class="v" id="trajCount">8</span></div>
    <div><span class="k">状态 </span><span class="v" id="phaseState">收敛中</span></div>
  </div>

  <div id="sysInfo">
    <span class="lab">SINGULARITIES</span>
    <div id="sgList"></div>
  </div>

  <div id="sysBtns"></div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>流动声 · 稳定音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let plotCX = 0, plotCY = 0, plotScale = 80;

/* =========================================================
   系统定义
   ========================================================= */
const SYSTEMS = [
  {
    id: 'stable-node',
    name: '稳定结点',
    en: 'STABLE NODE',
    hue: 195,
    f: function(x, y){ return -x; },
    g: function(x, y){ return -2 * y; },
    singularities: [
      { x: 0, y: 0, kind: 'stable', label: '稳定结点', note: 'λ₁=−1, λ₂=−2' }
    ],
    seeds: [
      [ 2.4,  2.2], [-2.4,  2.2], [-2.4, -2.2], [ 2.4, -2.2],
      [ 3.2,  0.6], [-0.6,  3.4], [ 0.6, -3.4], [-3.2, -0.6]
    ]
  },
  {
    id: 'saddle',
    name: '鞍点',
    en: 'SADDLE',
    hue: 32,
    f: function(x, y){ return x; },
    g: function(x, y){ return -y; },
    singularities: [
      { x: 0, y: 0, kind: 'saddle', label: '鞍点', note: 'λ₁=+1, λ₂=−1' }
    ],
    seeds: [
      [ 2.6,  0.05], [ 2.4,  0.6], [ 2.8, -0.5],
      [-2.6,  0.05], [-2.4,  0.6], [-2.8, -0.5],
      [ 0.05,  2.6], [ 0.6,  2.4], [-0.5,  2.8],
      [ 0.05, -2.6], [ 0.6, -2.4], [-0.5, -2.8]
    ]
  },
  {
    id: 'center',
    name: '中心',
    en: 'CENTER',
    hue: 155,
    f: function(x, y){ return y; },
    g: function(x, y){ return -x; },
    singularities: [
      { x: 0, y: 0, kind: 'center', label: '中心', note: 'λ = ±i（纯虚数）' }
    ],
    seeds: [
      [ 0.7,  0.15], [ 1.3, -0.25], [ 1.9,  0.30],
      [ 2.5, -0.20], [ 3.1,  0.25], [ 3.6, -0.15]
    ]
  },
  {
    id: 'stable-spiral',
    name: '稳定焦点',
    en: 'STABLE FOCUS',
    hue: 268,
    f: function(x, y){ return -0.4 * x + y; },
    g: function(x, y){ return -x - 0.4 * y; },
    singularities: [
      { x: 0, y: 0, kind: 'stable', label: '稳定焦点', note: 'λ = −0.4 ± i' }
    ],
    seeds: [
      [ 3.0,  0.0], [ 0.0,  3.0], [-3.0,  0.0], [ 0.0, -3.0],
      [ 2.1,  2.1], [-2.1,  2.1], [-2.1, -2.1], [ 2.1, -2.1]
    ]
  },
  {
    id: 'unstable-spiral',
    name: '不稳定焦点',
    en: 'UNSTABLE FOCUS',
    hue: 340,
    f: function(x, y){ return 0.3 * x + y; },
    g: function(x, y){ return -x + 0.3 * y; },
    singularities: [
      { x: 0, y: 0, kind: 'unstable', label: '不稳定焦点', note: 'λ = +0.3 ± i' }
    ],
    seeds: [
      [ 0.35,  0.10], [-0.35,  0.10], [ 0.10,  0.35],
      [-0.10, -0.35], [ 0.45, -0.20], [-0.45, -0.20]
    ]
  },
  {
    id: 'van-der-pol',
    name: '极限环',
    en: 'LIMIT CYCLE',
    hue: 305,
    f: function(x, y){ return y; },
    g: function(x, y){ return -x + 0.8 * (1 - x * x) * y; },
    singularities: [
      { x: 0, y: 0, kind: 'unstable', label: '不稳定焦点', note: '外围存在稳定极限环' }
    ],
    seeds: [
      [ 0.25,  0.0], [ 0.95,  0.0], [ 1.55,  0.15],
      [ 2.60,  0.10], [ 3.30,  0.05], [ 0.0,  3.40]
    ]
  }
];

let currentSysIdx = 0;
let SYS = SYSTEMS[0];

/* =========================================================
   布局
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  plotCX = W * 0.5;
  plotCY = H * 0.5;
  plotScale = Math.min(W * 0.40, H * 0.40) / 4.2;
}
window.addEventListener('resize', function(){
  resize();
  rebuildTrajectories();
});

/* =========================================================
   坐标转换
   ========================================================= */
function worldToScreen(x, y){
  return {
    px: plotCX + x * plotScale,
    py: plotCY - y * plotScale
  };
}
function screenToWorld(px, py){
  return {
    x: (px - plotCX) / plotScale,
    y: (plotCY - py) / plotScale
  };
}

/* =========================================================
   RK4 积分
   ========================================================= */
function rk4(x, y, h, f, g){
  const k1x = f(x, y),                    k1y = g(x, y);
  const k2x = f(x + k1x*h/2, y + k1y*h/2), k2y = g(x + k1x*h/2, y + k1y*h/2);
  const k3x = f(x + k2x*h/2, y + k2y*h/2), k3y = g(x + k2x*h/2, y + k2y*h/2);
  const k4x = f(x + k3x*h, y + k3y*h),     k4y = g(x + k3x*h, y + k3y*h);
  return {
    x: x + (k1x + 2*k2x + 2*k3x + k4x) * h / 6,
    y: y + (k1y + 2*k2y + 2*k3y + k4y) * h / 6
  };
}

/* =========================================================
   轨迹
   ========================================================= */
const MAX_PATH = 320;
const MAX_TRAJ = 18;

const trajectories = [];

function makeTrajectory(seedX, seedY, hue, delay){
  return {
    x: seedX, y: seedY,
    seedX: seedX, seedY: seedY,
    hue: hue,
    path: [{ x: seedX, y: seedY }],
    age: 0,
    delay: delay || 0,
    done: false,
    cool: 0,
    convergedFlag: false
  };
}

function rebuildTrajectories(){
  trajectories.length = 0;
  for (let i = 0; i < SYS.seeds.length; i++){
    const s = SYS.seeds[i];
    trajectories.push(
      makeTrajectory(s[0], s[1], SYS.hue + (i * 4.5) % 40, i * 0.08)
    );
  }
}

function stepTrajectory(t, dt){
  if (t.done){
    t.cool -= dt;
    if (t.cool <= 0){
      /* 重新开始 */
      t.x = t.seedX;
      t.y = t.seedY;
      t.path.length = 0;
      t.path.push({ x: t.seedX, y: t.seedY });
      t.age = 0;
      t.done = false;
      t.cool = 0;
      t.convergedFlag = false;
    }
    return;
  }

  if (t.delay > 0){
    t.delay -= dt;
    return;
  }

  t.age += dt;

  /* 积分三个子步 */
  const h = 0.007;
  for (let i = 0; i < 3; i++){
    const r = rk4(t.x, t.y, h, SYS.f, SYS.g);
    t.x = r.x;
    t.y = r.y;

    if (!isFinite(t.x) || !isFinite(t.y)) break;
  }

  /* 记录路径 */
  const last = t.path[t.path.length - 1];
  const moved = Math.hypot(t.x - last.x, t.y - last.y);

  if (moved > 0.012){
    t.path.push({ x: t.x, y: t.y });
    if (t.path.length > MAX_PATH) t.path.shift();
  }

  /* 检查是否收敛到稳定奇点 */
  for (let s = 0; s < SYS.singularities.length; s++){
    const sg = SYS.singularities[s];
    if (sg.kind !== 'stable') continue;

    const d = Math.hypot(t.x - sg.x, t.y - sg.y);
    if (d < 0.10 && t.age > 1.0){
      t.done = true;
      t.cool = 1.6;
      t.convergedFlag = true;
      return;
    }
  }

  /* 检查是否出界 */
  if (Math.abs(t.x) > 6.5 || Math.abs(t.y) > 6.5){
    t.done = true;
    t.cool = 1.2;
    return;
  }

  /* 老化 */
  if (t.age > 22){
    t.done = true;
    t.cool = 0.8;
  }
}

/* =========================================================
   粒子（用于奇点稳定时的光点）
   ========================================================= */
const sparks = [];

function spawnSpark(x, y, hue, count){
  for (let i = 0; i < count; i++){
    const a = Math.random() * TAU;
    const sp = 40 + Math.random() * 130;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.6 + Math.random() * 1.6,
      size: 0.9 + Math.random() * 2.0,
      hue: hue + (Math.random() - 0.5) * 30
    });
  }
}

function updateSparks(dt){
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= s.decay * dt;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.94;
    s.vy *= 0.94;
  }
}

function drawSparks(){
  if (sparks.length === 0) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < sparks.length; i++){
    const s = sparks[i];
    const a = s.life * s.life * 0.85;
    const r = s.size * s.life;
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4.5);
    g.addColorStop(0.00, 'hsla(' + s.hue + ',100%,92%,' + a + ')');
    g.addColorStop(0.42, 'hsla(' + s.hue + ',100%,74%,' + (a * 0.30) + ')');
    g.addColorStop(1.00, 'hsla(' + s.hue + ',100%,62%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let flowGain = null;
let flowFilter = null;
let audioReady = false;
let lastChimeTime = 0;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.44, ac.currentTime, 1.6);

  /* 流动声：带通噪声 */
  const bufLen = ac.sampleRate * 4;
  const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  flowFilter = ac.createBiquadFilter();
  flowFilter.type = 'bandpass';
  flowFilter.frequency.value = 620;
  flowFilter.Q.value = 1.8;

  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 120;

  flowGain = ac.createGain();
  flowGain.gain.value = 0.018;

  src.connect(flowFilter);
  flowFilter.connect(hp);
  hp.connect(flowGain);
  flowGain.connect(master);
  src.start();

  /* 流动的缓慢起伏 */
  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.14;
  const lfoG = ac.createGain();
  lfoG.gain.value = 0.012;
  lfo.connect(lfoG);
  lfoG.connect(flowGain.gain);
  lfo.start();

  const lfo2 = ac.createOscillator();
  lfo2.frequency.value = 0.08;
  const lfo2G = ac.createGain();
  lfo2G.gain.value = 280;
  lfo2.connect(lfo2G);
  lfo2G.connect(flowFilter.frequency);
  lfo2.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* 稳定提示音 */
function playStableChime(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  if (now - lastChimeTime < 0.6) return;
  lastChimeTime = now;

  const notes = [523.25, 659.25, 783.99];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.05;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.035, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.4);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.5);
  }
}

/* 更新流动声 */
function updateFlowAudio(dt){
  if (!audioReady || !ac || ac.state !== 'running') return;
  if (!flowGain) return;

  let totalSpeed = 0, n = 0;
  for (let i = 0; i < trajectories.length; i++){
    const t = trajectories[i];
    if (t.done) continue;
    const v = Math.hypot(SYS.f(t.x, t.y), SYS.g(t.x, t.y));
    totalSpeed += v;
    n++;
  }
  const avg = n > 0 ? totalSpeed / n : 0;
  const now = ac.currentTime;
  const target = 0.010 + Math.min(0.030, avg * 0.006);
  flowGain.gain.setTargetAtTime(target, now, 0.3);
  flowFilter.frequency.setTargetAtTime(420 + Math.min(1600, avg * 240), now, 0.4);
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(){
  const bg = ctx.createRadialGradient(
    plotCX, plotCY, 0,
    plotCX, plotCY, Math.max(W, H) * 0.82
  );
  bg.addColorStop(0.00, '#0a1224');
  bg.addColorStop(0.42, '#060c1a');
  bg.addColorStop(1.00, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   绘制：坐标网格
   ========================================================= */
function drawGrid(){
  const range = 4.5;
  ctx.strokeStyle = 'rgba(80, 130, 210, 0.070)';
  ctx.lineWidth = 1;

  for (let i = -range; i <= range; i++){
    const p1 = worldToScreen(i, -range);
    const p2 = worldToScreen(i, range);
    ctx.beginPath();
    ctx.moveTo(p1.px, p1.py);
    ctx.lineTo(p2.px, p2.py);
    ctx.stroke();

    const q1 = worldToScreen(-range, i);
    const q2 = worldToScreen(range, i);
    ctx.beginPath();
    ctx.moveTo(q1.px, q1.py);
    ctx.lineTo(q2.px, q2.py);
    ctx.stroke();
  }

  /* 坐标轴 */
  ctx.strokeStyle = 'rgba(100, 160, 240, 0.28)';
  ctx.lineWidth = 1.2;

  const o = worldToScreen(0, 0);
  const xL = worldToScreen(-range, 0);
  const xR = worldToScreen(range, 0);
  const yB = worldToScreen(0, -range);
  const yT = worldToScreen(0, range);

  ctx.beginPath();
  ctx.moveTo(xL.px, o.py);
  ctx.lineTo(xR.px, o.py);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(o.px, yB.py);
  ctx.lineTo(o.px, yT.py);
  ctx.stroke();

  /* 轴标签 */
  ctx.font = '400 10px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(150, 185, 240, 0.44)';
  ctx.fillText('x', xR.px - 16, o.py + 6);
  ctx.fillText('y', o.px + 8, yT.py + 4);

  /* 刻度 */
  ctx.font = '400 9px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(150, 185, 240, 0.30)';
  for (let i = -4; i <= 4; i++){
    if (i === 0) continue;
    const p = worldToScreen(i, 0);
    ctx.fillText(i.toString(), p.px, o.py + 5);
  }
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = -4; i <= 4; i++){
    if (i === 0) continue;
    const p = worldToScreen(0, i);
    ctx.fillText(i.toString(), o.px - 6, p.py);
  }
}

/* =========================================================
   绘制：向量场
   ========================================================= */
function drawVectorField(){
  const step = 0.66;
  const range = 4.4;
  const hue = SYS.hue;

  ctx.save();

  for (let x = -range; x <= range; x += step){
    for (let y = -range; y <= range; y += step){
      const dx = SYS.f(x, y);
      const dy = SYS.g(x, y);
      const mag = Math.hypot(dx, dy);
      if (mag < 1e-4) continue;

      const p = worldToScreen(x, y);
      const ux = dx / mag;
      const uy = -dy / mag;

      const lenW = 0.16 + Math.min(0.30, mag * 0.10);
      const len = lenW * plotScale;

      const ex = p.px + ux * len;
      const ey = p.py + uy * len;

      const alpha = 0.06 + Math.min(0.16, mag * 0.045);

      ctx.strokeStyle = 'hsla(' + hue + ',90%,70%,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      /* 箭头 */
      const ang = Math.atan2(uy, ux);
      const hs = 3.0 + Math.min(2.4, mag * 0.7);
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(
        ex - Math.cos(ang - 0.5) * hs,
        ey - Math.sin(ang - 0.5) * hs
      );
      ctx.lineTo(
        ex - Math.cos(ang + 0.5) * hs,
        ey - Math.sin(ang + 0.5) * hs
      );
      ctx.closePath();
      ctx.fillStyle = 'hsla(' + hue + ',90%,70%,' + (alpha * 1.4).toFixed(3) + ')';
      ctx.fill();
    }
  }

  ctx.restore();
}

/* =========================================================
   绘制：轨迹
   ========================================================= */
function drawTrajectory(t, time){
  const n = t.path.length;
  if (n < 2) return;

  /* 计算路径的屏幕坐标 */
  const pts = new Array(n);
  for (let i = 0; i < n; i++){
    const p = worldToScreen(t.path[i].x, t.path[i].y);
    pts[i] = p;
  }

  const hue = t.hue;

  /* 完整路径（低透明度） */
  ctx.beginPath();
  ctx.moveTo(pts[0].px, pts[0].py);
  for (let i = 1; i < n; i++){
    ctx.lineTo(pts[i].px, pts[i].py);
  }
  ctx.strokeStyle = 'hsla(' + hue + ',88%,66%,0.14)';
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  /* 后 55% 的路径 */
  const i1 = Math.floor(n * 0.45);
  ctx.beginPath();
  ctx.moveTo(pts[i1].px, pts[i1].py);
  for (let i = i1 + 1; i < n; i++){
    ctx.lineTo(pts[i].px, pts[i].py);
  }
  ctx.strokeStyle = 'hsla(' + hue + ',92%,72%,0.42)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 后 25% 的路径 */
  const i2 = Math.floor(n * 0.75);
  ctx.beginPath();
  ctx.moveTo(pts[i2].px, pts[i2].py);
  for (let i = i2 + 1; i < n; i++){
    ctx.lineTo(pts[i].px, pts[i].py);
  }
  ctx.strokeStyle = 'hsla(' + (hue + 8) + ',96%,80%,0.78)';
  ctx.lineWidth = 2.2;
  ctx.stroke();

  /* 头部光晕 */
  const head = pts[n - 1];
  ctx.globalCompositeOperation = 'lighter';

  const hg = ctx.createRadialGradient(head.px, head.py, 0, head.px, head.py, 16);
  hg.addColorStop(0.00, 'hsla(' + hue + ',100%,90%,0.80)');
  hg.addColorStop(0.42, 'hsla(' + hue + ',100%,70%,0.30)');
  hg.addColorStop(1.00, 'hsla(' + hue + ',100%,60%,0)');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(head.px, head.py, 16, 0, TAU);
  ctx.fill();

  /* 头部核心 */
  ctx.fillStyle = 'hsla(' + hue + ',100%,96%,0.94)';
  ctx.beginPath();
  ctx.arc(head.px, head.py, 2.8, 0, TAU);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';

  /* 起点标记 */
  const s0 = pts[0];
  ctx.beginPath();
  ctx.arc(s0.px, s0.py, 3, 0, TAU);
  ctx.fillStyle = 'hsla(' + hue + ',90%,72%,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'hsla(' + hue + ',96%,82%,0.85)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 收敛时的光晕 */
  if (t.done && t.convergedFlag){
    const u = 1 - Math.max(0, Math.min(1, t.cool / 1.6));
    ctx.globalCompositeOperation = 'lighter';
    const r = 20 + u * 40;
    const g = ctx.createRadialGradient(head.px, head.py, 0, head.px, head.py, r);
    g.addColorStop(0.00, 'hsla(' + hue + ',100%,88%,' + (0.5 * (1 - u)) + ')');
    g.addColorStop(1.00, 'hsla(' + hue + ',100%,70%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(head.px, head.py, r, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* =========================================================
   绘制：奇点
   ========================================================= */
function drawSingularity(sg, time){
  const p = worldToScreen(sg.x, sg.y);
  const baseR = Math.max(7, plotScale * 0.14);
  const pulse = 1 + 0.18 * Math.sin(time * 2.6);

  let hue;
  if (sg.kind === 'stable') hue = 165;
  else if (sg.kind === 'unstable') hue = 340;
  else if (sg.kind === 'saddle') hue = 32;
  else hue = 205;

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(
    p.px, p.py, 0,
    p.px, p.py, baseR * 5.5 * pulse
  );
  g.addColorStop(0.00, 'hsla(' + hue + ',100%,82%,0.55)');
  g.addColorStop(0.32, 'hsla(' + hue + ',100%,66%,0.18)');
  g.addColorStop(1.00, 'hsla(' + hue + ',100%,58%,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.px, p.py, baseR * 5.5 * pulse, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.lineCap = 'round';

  if (sg.kind === 'stable'){
    /* 实心圆 + 外环 */
    ctx.beginPath();
    ctx.arc(p.px, p.py, baseR, 0, TAU);
    ctx.fillStyle = 'hsla(' + hue + ',92%,72%,0.94)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.px, p.py, baseR * 1.75, 0, TAU);
    ctx.strokeStyle = 'hsla(' + hue + ',96%,80%,0.72)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
  else if (sg.kind === 'unstable'){
    /* 空心圆 + 十字 */
    ctx.beginPath();
    ctx.arc(p.px, p.py, baseR * 0.95, 0, TAU);
    ctx.fillStyle = 'hsla(' + hue + ',92%,58%,0.30)';
    ctx.fill();
    ctx.strokeStyle = 'hsla(' + hue + ',96%,82%,0.92)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    const s = baseR * 0.62;
    ctx.beginPath();
    ctx.moveTo(p.px - s, p.py);
    ctx.lineTo(p.px + s, p.py);
    ctx.moveTo(p.px, p.py - s);
    ctx.lineTo(p.px, p.py + s);
    ctx.strokeStyle = 'hsla(' + hue + ',96%,86%,0.95)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  else if (sg.kind === 'saddle'){
    /* X 形 */
    const s = baseR * 0.95;
    ctx.strokeStyle = 'hsla(' + hue + ',96%,78%,0.95)';
    ctx.lineWidth = 2.4;

    ctx.beginPath();
    ctx.moveTo(p.px - s, p.py - s);
    ctx.lineTo(p.px + s, p.py + s);
    ctx.moveTo(p.px + s, p.py - s);
    ctx.lineTo(p.px - s, p.py + s);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.px, p.py, baseR * 1.55, 0, TAU);
    ctx.strokeStyle = 'hsla(' + hue + ',96%,74%,0.48)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  else if (sg.kind === 'center'){
    /* 同心圆 + 中心点 */
    ctx.beginPath();
    ctx.arc(p.px, p.py, baseR * 1.55, 0, TAU);
    ctx.strokeStyle = 'hsla(' + hue + ',96%,78%,0.85)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.px, p.py, baseR * 0.72, 0, TAU);
    ctx.strokeStyle = 'hsla(' + hue + ',96%,84%,0.65)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.px, p.py, baseR * 0.22, 0, TAU);
    ctx.fillStyle = 'hsla(' + hue + ',96%,88%,0.95)';
    ctx.fill();
  }

  /* 标签 */
  ctx.font = '500 11px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'hsla(' + hue + ',92%,84%,0.86)';
  ctx.fillText(sg.label, p.px, p.py + baseR * 2.3);

  if (sg.note){
    ctx.font = '400 9px "SF Mono", Consolas, Monaco, monospace';
    ctx.fillStyle = 'hsla(' + hue + ',80%,74%,0.52)';
    ctx.fillText(sg.note, p.px, p.py + baseR * 2.3 + 14);
  }
}

/* =========================================================
   绘制：暗角
   ========================================================= */
function drawVignette(){
  const g = ctx.createRadialGradient(
    plotCX, plotCY, Math.min(W, H) * 0.34,
    plotCX, plotCY, Math.max(W, H) * 0.85
  );
  g.addColorStop(0.00, 'rgba(0,0,0,0)');
  g.addColorStop(0.62, 'rgba(2, 4, 10, 0.26)');
  g.addColorStop(1.00, 'rgba(0, 1, 4, 0.92)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;
let uiTick = 0;
let chimeCooldown = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const time = now * 0.001;

  /* 更新轨迹 */
  let newlyConverged = false;
  for (let i = 0; i < trajectories.length; i++){
    const t = trajectories[i];
    const wasDone = t.done;
    stepTrajectory(t, dt);
    if (!wasDone && t.done && t.convergedFlag) newlyConverged = true;
  }

  /* 若有轨迹收敛，播放提示音 */
  if (newlyConverged){
    playStableChime();
    /* 发光粒子 */
    for (let s = 0; s < SYS.singularities.length; s++){
      const sg = SYS.singularities[s];
      if (sg.kind === 'stable'){
        const p = worldToScreen(sg.x, sg.y);
        spawnSpark(p.px, p.py, 165, 6);
      }
    }
  }

  updateSparks(dt);
  updateFlowAudio(dt);

  /* 绘制 */
  drawBackground();
  drawGrid();
  drawVectorField();

  for (let i = 0; i < trajectories.length; i++){
    drawTrajectory(trajectories[i], time);
  }

  for (let i = 0; i < SYS.singularities.length; i++){
    drawSingularity(SYS.singularities[i], time);
  }

  drawSparks();
  drawVignette();

  /* 更新 HUD */
  uiTick++;
  if (uiTick % 5 === 0) updateHUD();
}

/* =========================================================
   HUD
   ========================================================= */
function updateHUD(){
  const sysNameEl = document.getElementById('sysName');
  const sgCountEl = document.getElementById('sgCount');
  const trajCountEl = document.getElementById('trajCount');
  const stateEl = document.getElementById('phaseState');

  if (sysNameEl) sysNameEl.textContent = SYS.name;
  if (sgCountEl) sgCountEl.textContent = SYS.singularities.length;
  if (trajCountEl) trajCountEl.textContent = trajectories.length;

  if (stateEl){
    /* 计算收敛轨迹数 */
    let done = 0;
    for (let i = 0; i < trajectories.length; i++){
      if (trajectories[i].done) done++;
    }
    const ratio = done / trajectories.length;

    if (ratio > 0.85){
      stateEl.textContent = '已收敛';
    } else if (ratio > 0.35){
      stateEl.textContent = '收敛中';
    } else {
      stateEl.textContent = '流动中';
    }
  }
}

/* =========================================================
   构建系统按钮与信息
   ========================================================= */
function buildSysBtns(){
  const wrap = document.getElementById('sysBtns');
  if (!wrap) return;
  wrap.innerHTML = '';

  for (let i = 0; i < SYSTEMS.length; i++){
    const btn = document.createElement('button');
    btn.className = 'sbtn' + (i === currentSysIdx ? ' on' : '');
    btn.textContent = SYSTEMS[i].name;
    btn.dataset.idx = i;

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      initAudio();
      switchSystem(parseInt(this.dataset.idx, 10));
    });

    wrap.appendChild(btn);
  }
}

function buildSysInfo(){
  const wrap = document.getElementById('sgList');
  if (!wrap) return;
  wrap.innerHTML = '';

  for (let i = 0; i < SYS.singularities.length; i++){
    const sg = SYS.singularities[i];

    const row = document.createElement('div');
    row.className = 'sg-row';

    const mark = document.createElement('span');
    mark.className = 'sg-mark';
    if (sg.kind === 'stable') mark.textContent = '●';
    else if (sg.kind === 'unstable') mark.textContent = '○';
    else if (sg.kind === 'saddle') mark.textContent = '✕';
    else mark.textContent = '◎';

    const color = sg.kind === 'stable' ? '#5ee0c0'
                : sg.kind === 'unstable' ? '#ff7a9a'
                : sg.kind === 'saddle' ? '#ffb060'
                : '#7ab8ff';
    mark.style.color = color;

    const nm = document.createElement('span');
    nm.className = 'sg-nm';
    nm.textContent = '奇点';

    const type = document.createElement('span');
    type.className = 'sg-type';
    type.textContent = sg.label;
    type.style.color = color;

    const re = document.createElement('span');
    re.className = 'sg-re';
    re.textContent = sg.note || '';

    row.appendChild(mark);
    row.appendChild(nm);
    row.appendChild(type);
    row.appendChild(re);
    wrap.appendChild(row);
  }
}

/* =========================================================
   切换系统
   ========================================================= */
function switchSystem(idx){
  if (idx === currentSysIdx) return;

  currentSysIdx = idx;
  SYS = SYSTEMS[idx];

  /* 更新按钮高亮 */
  document.querySelectorAll('.sbtn').forEach(function(b, i){
    b.classList.toggle('on', i === idx);
  });

  rebuildTrajectories();
  buildSysInfo();

  /* 系统切换时的流动声脉冲 */
  if (audioReady && ac && ac.state === 'running' && flowGain){
    const now = ac.currentTime;
    flowGain.gain.cancelScheduledValues(now);
    flowGain.gain.setValueAtTime(flowGain.gain.value, now);
    flowGain.gain.linearRampToValueAtTime(0.055, now + 0.12);
    flowGain.gain.setTargetAtTime(0.018, now + 0.35, 0.4);
  }

  /* 重置冷却 */
  chimeCooldown = 0.6;
}

/* =========================================================
   交互
   ========================================================= */
canvas.addEventListener('pointerdown', function(e){
  initAudio();

  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;

  /* 在点击位置生成一条新轨迹 */
  if (trajectories.length >= MAX_TRAJ){
    trajectories.shift();
  }

  const w = screenToWorld(px, py);
  if (Math.abs(w.x) < 5.5 && Math.abs(w.y) < 5.5){
    trajectories.push(
      makeTrajectory(w.x, w.y, SYS.hue + Math.random() * 40, 0)
    );
  }
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    /* 切换系统 */
    switchSystem((currentSysIdx + 1) % SYSTEMS.length);
  } else if (e.key >= '1' && e.key <= '6'){
    initAudio();
    const idx = parseInt(e.key, 10) - 1;
    if (idx >= 0 && idx < SYSTEMS.length){
      switchSystem(idx);
    }
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    rebuildTrajectories();
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
buildSysBtns();
buildSysInfo();
rebuildTrajectories();
requestAnimationFrame(loop);

})();
</script>
