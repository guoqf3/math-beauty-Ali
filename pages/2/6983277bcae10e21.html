<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERFERE · 干涉波纹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a14;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            right: 32px;
            z-index: 2;
            text-align: right;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(225, 220, 245, 0.8);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(140, 120, 230, 0.4);
        }

        .hint {
            color: rgba(180, 175, 205, 0.5);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
                right: 20px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.22em;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <div class="title">Interfere</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            // ─── 画布初始化 ───────────────────────────────────────────────
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let gridPoints = [];   // 网格点 {x, y}
            let cols = 0, rows = 0;
            let spacing = 6;       // 动态调整，控制点数
            let waves = [];        // 波源数组
            let mouse = { x: -9999, y: -9999, active: false };
            let lastWaveX = -9999, lastWaveY = -9999;
            let time = 0;
            let colorShift = 0;    // 点击切换色相偏移
            let maxWaves = 25;     // 最大波源数量

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0a0a14';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 初始化网格点 ────────────────────────────────────────────
            function initGrid() {
                const targetPoints = 4500;  // 控制总点数，保证性能
                const area = W * H;
                spacing = Math.sqrt(area / targetPoints);
                spacing = Math.max(4, Math.min(10, spacing));

                cols = Math.ceil(W / spacing);
                rows = Math.ceil(H / spacing);

                gridPoints = [];
                for (let j = 0; j < rows; j++) {
                    for (let i = 0; i < cols; i++) {
                        gridPoints.push({
                            x: (i + 0.5) * spacing,
                            y: (j + 0.5) * spacing,
                        });
                    }
                }
            }

            // ─── 创建波源 ───────────────────────────────────────────────
            function createWave(x, y, strength) {
                if (waves.length >= maxWaves) {
                    // 移除最旧的波源
                    waves.shift();
                }
                waves.push({
                    x: x,
                    y: y,
                    amplitude: strength || 0.8 + Math.random() * 0.4,
                    frequency: 0.03 + Math.random() * 0.02,
                    phase: Math.random() * Math.PI * 2,
                    speed: 1.5 + Math.random() * 1.0,
                    radius: 0,           // 当前波前半径
                    decay: 0.008 + Math.random() * 0.004, // 振幅衰减
                    growth: 2.2 + Math.random() * 1.0,    // 半径增长速度
                    life: 1.0,           // 生命周期
                });
            }

            // ─── 更新波源 ───────────────────────────────────────────────
            function updateWaves(dt) {
                for (let i = waves.length - 1; i >= 0; i--) {
                    const w = waves[i];
                    w.radius += w.growth * dt;
                    w.phase += w.speed * dt * 0.1;
                    w.life -= w.decay * dt;
                    w.amplitude *= 0.998;
                    if (w.life <= 0.01 || w.amplitude < 0.02 || w.radius > Math.max(W, H) * 0.7) {
                        waves.splice(i, 1);
                    }
                }
            }

            // ─── 绘制网格波纹（干涉图案） ───────────────────────────────
            function drawInterference(ctx) {
                const timeOffset = time * 2;
                const halfW = W / 2;
                const halfH = H / 2;

                for (let i = 0; i < gridPoints.length; i++) {
                    const p = gridPoints[i];
                    let sum = 0;
                    const waveCount = waves.length;

                    for (let j = 0; j < waveCount; j++) {
                        const w = waves[j];
                        const dx = p.x - w.x;
                        const dy = p.y - w.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        // 波纹值：正弦函数，随距离衰减
                        const val = Math.sin(dist * w.frequency * 2.0 - w.phase * 2) * w.amplitude * Math.exp(-dist * 0.002);
                        sum += val;
                    }

                    // 映射为颜色：使用绝对值产生对称条纹，色相随sum变化
                    const absVal = Math.abs(sum);
                    const normalized = Math.min(1, absVal * 1.8);
                    const hue = (210 + colorShift + sum * 40 + p.x * 0.02 + p.y * 0.02) % 360;
                    const sat = 55 + normalized * 35;
                    const light = 25 + normalized * 55;
                    const alpha = 0.3 + normalized * 0.7;

                    // 绘制小方块
                    const size = spacing * 0.8;
                    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
                    ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
                }
            }

            // ─── 绘制波源圆环（可选装饰） ───────────────────────────────
            function drawWaveCircles(ctx) {
                for (const w of waves) {
                    const alpha = w.life * 0.2;
                    const hue = 210 + colorShift + w.phase * 20;
                    ctx.strokeStyle = `hsla(${hue}, 60%, 75%, ${alpha})`;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 60;
                const hue = 220 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 70%, 80%, 0.08)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    updateWaves(fixedStep / 1000 * 60);
                }

                // 清除画布
                ctx.fillStyle = '#0a0a14';
                ctx.fillRect(0, 0, W, H);

                // 绘制干涉图案
                drawInterference(ctx);

                // 绘制波源圆环（可选）
                drawWaveCircles(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;

                // 如果鼠标移动距离上次波源位置足够远，则添加新的波源
                const dx = mouse.x - lastWaveX;
                const dy = mouse.y - lastWaveY;
                const distSq = dx * dx + dy * dy;
                if (distSq > 400) { // 距离阈值 20px
                    createWave(mouse.x, mouse.y, 0.5 + Math.random() * 0.3);
                    lastWaveX = mouse.x;
                    lastWaveY = mouse.y;
                }
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                lastWaveX = -9999;
                lastWaveY = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                // 点击产生强波源
                createWave(mouse.x, mouse.y, 1.2);
                lastWaveX = mouse.x;
                lastWaveY = mouse.y;
                // 切换色彩偏移
                colorShift += 40 + Math.random() * 30;
                if (colorShift > 160) colorShift = -30;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    const dx = mouse.x - lastWaveX;
                    const dy = mouse.y - lastWaveY;
                    const distSq = dx * dx + dy * dy;
                    if (distSq > 400) {
                        createWave(mouse.x, mouse.y, 0.5 + Math.random() * 0.3);
                        lastWaveX = mouse.x;
                        lastWaveY = mouse.y;
                    }
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createWave(mouse.x, mouse.y, 1.2);
                    lastWaveX = mouse.x;
                    lastWaveY = mouse.y;
                    colorShift += 40 + Math.random() * 30;
                    if (colorShift > 160) colorShift = -30;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                lastWaveX = -9999;
                lastWaveY = -9999;
            }

            function onResize() {
                setupCanvas();
                initGrid();
                waves = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                lastWaveX = -9999;
                lastWaveY = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initGrid();

                // 初始添加几个波源，避免空白
                for (let i = 0; i < 3; i++) {
                    createWave(W * (0.2 + Math.random() * 0.6), H * (0.2 + Math.random() * 0.6), 0.6 + Math.random() * 0.4);
                }

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 确保初始背景填充
            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0a0a14';
                    ctx.fillRect(0, 0, W, H);
                }
            });

        })();
    </script>
</body>
</html>
