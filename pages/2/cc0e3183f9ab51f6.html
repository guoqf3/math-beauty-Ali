<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>数学迷宫逃脱 · Math Maze Escape</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#03040c;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  /* ==================== HUD ==================== */
  #hud{
    position:fixed;top:0;left:0;right:0;
    padding:18px 26px;
    display:flex;justify-content:space-between;align-items:flex-start;
    z-index:20;pointer-events:none;
    opacity:0;animation:fade 1.2s 0.3s ease forwards;
  }
  .hud-block{display:flex;flex-direction:column;gap:5px;}
  .hud-block.right{text-align:right;align-items:flex-end;}

  .hud-en{
    font-size:8px;letter-spacing:.48em;text-indent:.48em;
    color:rgba(120,200,255,.36);
    font-weight:300;
  }
  .hud-main{
    font-size:clamp(15px,1.9vw,20px);
    font-weight:300;letter-spacing:.14em;
    color:rgba(220,235,255,.96);
    transition:color .4s;
  }
  .hud-sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.10em;
    color:rgba(170,200,245,.52);
  }
  .hud-sub b{color:rgba(140,225,255,.94);font-weight:600;}
  .hud-sub .warn{color:rgba(255,160,120,.94);}

  .hud-timer{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(20px,2.7vw,30px);
    font-weight:200;letter-spacing:.04em;
    color:rgba(200,235,255,.96);
    line-height:1;
    filter:drop-shadow(0 0 14px rgba(120,200,255,.45));
    transition:color .3s, transform .3s;
  }
  .hud-timer.danger{
    color:rgba(255,140,110,.98);
    filter:drop-shadow(0 0 18px rgba(255,120,90,.72));
    animation:pulseWarn .8s ease-in-out infinite;
  }
  @keyframes pulseWarn{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  @keyframes fade{to{opacity:1;}}

  /* ==================== 底部操作 ==================== */
  #bottomBar{
    position:fixed;bottom:0;left:0;right:0;
    padding:0 26px 20px;
    display:flex;gap:9px;align-items:center;
    z-index:20;
    opacity:0;animation:fade 1.2s 1.0s ease forwards;
    pointer-events:none;
  }
  .btn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.16em;
    color:rgba(200,220,255,.72);
    background:rgba(22,32,58,.55);
    border:1px solid rgba(120,155,230,.26);
    border-radius:9px;
    padding:9px 15px;
    cursor:pointer;
    transition:.26s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    white-space:nowrap;
    pointer-events:auto;
  }
  .btn:hover{
    border-color:rgba(180,220,255,.82);
    color:rgba(235,245,255,.98);
    background:rgba(56,88,150,.30);
    transform:translateY(-1px);
  }
  .btn:active{transform:translateY(0);}
  .btn.accent{
    border-color:rgba(255,190,120,.42);
    color:rgba(255,215,160,.94);
  }
  .btn.accent:hover{
    border-color:rgba(255,215,150,.90);
    background:rgba(150,90,40,.30);
  }

  #legend{
    margin-left:auto;
    display:flex;gap:16px;align-items:center;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.10em;
    color:rgba(170,200,245,.42);
    pointer-events:none;
  }
  #legend .item{display:flex;align-items:center;gap:6px;}
  #legend .sw{width:14px;height:3px;border-radius:2px;}

  /* ==================== 音频指示 ==================== */
  #audioDot{
    position:fixed;bottom:0;right:26px;
    padding-bottom:20px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    display:flex;align-items:center;gap:7px;
    opacity:0;animation:fade 1.2s 1.4s ease forwards;
    z-index:20;pointer-events:none;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }
  #audioDot.on{color:rgba(160,220,200,.52);}

  /* ==================== 弹窗 ==================== */
  #modal{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .32s ease;
  }
  #modal.show{opacity:1;pointer-events:auto;}

  #modalBg{
    position:absolute;inset:0;
    background:rgba(2,4,12,.82);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }

  #modalBox{
    position:relative;
    width:min(420px,90vw);
    padding:clamp(22px,3.5vw,34px);
    border-radius:20px;
    background:linear-gradient(160deg,rgba(16,26,54,.96),rgba(8,14,32,.96));
    border:1px solid rgba(120,170,255,.28);
    box-shadow:
      0 30px 80px rgba(0,0,0,.7),
      0 0 60px rgba(80,150,255,.20),
      inset 0 1px 0 rgba(180,220,255,.14);
    transform:scale(.90) translateY(10px);
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    text-align:center;
  }
  #modal.show #modalBox{
    transform:scale(1) translateY(0);
  }

  .modal-tag{
    display:inline-block;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.48em;text-indent:.48em;
    color:rgba(255,190,120,.72);
    padding:4px 12px;
    border-radius:999px;
    background:rgba(255,170,90,.10);
    border:1px solid rgba(255,180,100,.28);
    margin-bottom:18px;
  }

  .modal-title{
    font-size:clamp(14px,1.8vw,17px);
    font-weight:300;
    letter-spacing:.18em;
    color:rgba(215,232,255,.86);
    margin-bottom:22px;
  }

  .modal-eq{
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:clamp(19px,2.7vw,28px);
    font-weight:400;
    letter-spacing:.06em;
    line-height:1.7;
    color:rgba(140,225,255,.98);
    text-shadow:0 0 20px rgba(100,200,255,.55);
    margin-bottom:8px;
    padding:16px 12px;
    border-radius:12px;
    background:rgba(20,32,64,.50);
    border:1px solid rgba(90,150,230,.16);
  }
  .modal-eq .var{
    color:rgba(255,215,140,.98);
    text-shadow:0 0 20px rgba(255,190,100,.60);
  }

  .modal-hint{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.10em;
    color:rgba(180,200,245,.46);
    margin-bottom:20px;
    min-height:16px;
  }

  .modal-input-row{
    display:flex;align-items:center;justify-content:center;
    gap:12px;
    margin-bottom:24px;
  }
  .modal-input-label{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(16px,2.2vw,22px);
    color:rgba(255,215,140,.92);
    letter-spacing:.06em;
  }
  #answerInput{
    width:clamp(110px,26vw,150px);
    padding:12px 16px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(16px,2.2vw,22px);
    font-weight:500;
    text-align:center;
    letter-spacing:.08em;
    color:rgba(220,240,255,.98);
    background:rgba(8,14,30,.72);
    border:1.5px solid rgba(120,170,255,.42);
    border-radius:11px;
    outline:none;
    transition:.24s;
  }
  #answerInput:focus{
    border-color:rgba(140,225,255,.92);
    box-shadow:0 0 22px rgba(100,200,255,.42);
    background:rgba(14,24,50,.86);
  }
  #answerInput.error{
    border-color:rgba(255,140,110,.92);
    box-shadow:0 0 22px rgba(255,120,90,.42);
    animation:shakeInput .4s;
  }
  @keyframes shakeInput{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-7px);}
    75%{transform:translateX(7px);}
  }

  .modal-actions{
    display:flex;gap:10px;justify-content:center;
  }
  .modal-actions .btn{
    padding:11px 26px;
    font-size:11px;
    letter-spacing:.20em;
  }
  .btn.confirm{
    border-color:rgba(140,225,255,.62);
    color:rgba(190,235,255,.98);
    background:rgba(40,90,150,.42);
  }
  .btn.confirm:hover{
    border-color:rgba(180,240,255,.96);
    background:rgba(60,130,200,.48);
    box-shadow:0 0 26px rgba(100,200,255,.48);
  }

  /* ==================== Toast ==================== */
  #toast{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.86);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(16px,2.3vw,26px);
    font-weight:300;
    letter-spacing:.28em;
    color:rgba(180,255,220,.98);
    text-shadow:0 0 32px rgba(120,240,190,.85);
    opacity:0;pointer-events:none;
    transition:opacity .38s, transform .38s cubic-bezier(.34,1.56,.64,1);
    z-index:200;
    white-space:nowrap;
    text-align:center;
  }
  #toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #toast.bad{
    color:rgba(255,160,140,.98);
    text-shadow:0 0 32px rgba(255,120,90,.85);
  }

  /* ==================== 触控摇杆 ==================== */
  #joystick{
    position:fixed;
    left:30px;bottom:30px;
    width:120px;height:120px;
    border-radius:50%;
    border:1.5px solid rgba(120,170,255,.20);
    background:rgba(16,26,50,.32);
    z-index:20;
    opacity:0;pointer-events:none;
    transition:opacity .3s;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  #joystick.show{opacity:1;pointer-events:auto;}
  #joyKnob{
    position:absolute;
    left:50%;top:50%;
    width:52px;height:52px;
    margin-left:-26px;margin-top:-26px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%,rgba(140,210,255,.72),rgba(60,120,200,.42));
    border:1.5px solid rgba(160,220,255,.52);
    box-shadow:0 0 22px rgba(100,180,255,.42);
    transition:transform .08s;
  }

  @media (max-width:720px){
    #hud{padding:12px 16px;}
    #hud .hud-en{display:none;}
    #bottomBar{padding:0 16px 14px;gap:6px;}
    .btn{font-size:9px;padding:8px 11px;letter-spacing:.10em;}
    #legend{display:none;}
    #audioDot{right:16px;padding-bottom:14px;font-size:8px;}
    #modalBox{padding:22px 18px;}
    #joystick{display:block;}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-block">
    <div class="hud-en">MATH MAZE ESCAPE</div>
    <div class="hud-main" id="lvName">第 1 关</div>
    <div class="hud-sub">门 <b id="doorProgress">0 / 3</b></div>
  </div>
  <div class="hud-block right">
    <div class="hud-timer" id="timerVal">180</div>
    <div class="hud-sub">剩余时间</div>
  </div>
</div>

<div id="bottomBar">
  <button class="btn accent" id="hintBtn">提 示</button>
  <button class="btn" id="restartBtn">重 开</button>
  <div id="legend">
    <div class="item"><span class="sw" style="background:rgba(140,225,255,.9)"></span>你</div>
    <div class="item"><span class="sw" style="background:rgba(255,190,110,.9)"></span>门（需解方程）</div>
    <div class="item"><span class="sw" style="background:rgba(140,240,180,.9)"></span>出口</div>
  </div>
</div>

<div id="audioDot">
  <span class="dot"></span>
  <span>背景音 · 交互音</span>
</div>

<div id="modal">
  <div id="modalBg"></div>
  <div id="modalBox">
    <div class="modal-tag">LOCKED DOOR</div>
    <div class="modal-title">解出方程 · 开启大门</div>
    <div class="modal-eq" id="modalEq">2x + 3 = 7</div>
    <div class="modal-hint" id="modalHint"></div>
    <div class="modal-input-row">
      <span class="modal-input-label" id="inputLabel">x =</span>
      <input type="text" id="answerInput" inputmode="numeric" autocomplete="off" />
    </div>
    <div class="modal-actions">
      <button class="btn confirm" id="submitBtn">确 认</button>
      <button class="btn" id="cancelBtn">再 想 想</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="joystick">
  <div id="joyKnob"></div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

/* =========================================================
   迷宫配置
   ========================================================= */
const COLS = 6;
const ROWS = 6;
let cellSize = 70;
let mazeX = 0, mazeY = 0;

/* 墙方向索引：0=上 1=右 2=下 3=左 */
const DIRS = [
  { dr: -1, dc: 0, wall: 0, opposite: 2 },
  { dr: 0,  dc: 1, wall: 1, opposite: 3 },
  { dr: 1,  dc: 0, wall: 2, opposite: 0 },
  { dr: 0,  dc: -1, wall: 3, opposite: 1 }
];

let cells = [];
let doors = new Map();
let player = { gx: 0.5, gy: 0.5, vx: 0, vy: 0 };
const PLAYER_R = 0.26;
const PLAYER_SPEED = 3.0;

let exitCell = { r: ROWS - 1, c: COLS - 1 };
let exitReached = false;

/* =========================================================
   游戏状态
   ========================================================= */
let level = 1;
let score = 0;
let timeLeft = 180;
let gameOver = false;
let paused = false;
let doorsOpened = 0;
let doorsTotal = 0;
let hintUsedThisLevel = 0;
let currentDoorKey = null;

/* =========================================================
   音效系统
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let ambientOn = false;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.50, ac.currentTime, 1.6);

  startAmbient();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioDot(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioDot(true);
  }
}

/* ---- 背景：低频紧张氛围 ---- */
function startAmbient(){
  if (ambientOn) return;
  ambientOn = true;

  const now = ac.currentTime;

  /* 低鸣：两个近频正弦 */
  const o1 = ac.createOscillator();
  o1.type = 'sine';
  o1.frequency.value = 46;

  const o2 = ac.createOscillator();
  o2.type = 'sine';
  o2.frequency.value = 46.7;

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 260;
  lp.Q.value = 2.4;

  const droneGain = ac.createGain();
  droneGain.gain.value = 0;
  droneGain.gain.setTargetAtTime(0.030, now, 3.0);

  o1.connect(lp);
  o2.connect(lp);
  lp.connect(droneGain);
  droneGain.connect(master);
  o1.start();
  o2.start();

  /* 缓慢起伏 */
  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.055;
  const lfoGain = ac.createGain();
  lfoGain.gain.value = 0.014;
  lfo.connect(lfoGain);
  lfoGain.connect(droneGain.gain);
  lfo.start();

  /* 空气层：极轻的带通噪声 */
  const bufLen = Math.floor(ac.sampleRate * 4);
  const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < bufLen; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.022 * w) / 1.022;
    d[i] = last * 3.4;
  }

  const noiseSrc = ac.createBufferSource();
  noiseSrc.buffer = buf;
  noiseSrc.loop = true;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 620;
  bp.Q.value = 1.6;

  const noiseGain = ac.createGain();
  noiseGain.gain.value = 0.006;

  noiseSrc.connect(bp);
  bp.connect(noiseGain);
  noiseGain.connect(master);
  noiseSrc.start();

  const nlfo = ac.createOscillator();
  nlfo.frequency.value = 0.085;
  const nlfoGain = ac.createGain();
  nlfoGain.gain.value = 340;
  nlfo.connect(nlfoGain);
  nlfoGain.connect(bp.frequency);
  nlfo.start();

  /* 心跳脉冲：紧张感 */
  scheduleHeartbeat();
}

function scheduleHeartbeat(){
  const wait = 2600 + Math.random() * 2800;
  setTimeout(function(){
    if (audioReady && ac && ac.state === 'running' && !gameOver && !paused){
      playHeartbeat();
    }
    scheduleHeartbeat();
  }, wait);
}

function playHeartbeat(){
  const now = ac.currentTime;

  /* 第一拍 */
  const o1 = ac.createOscillator();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(62, now);
  o1.frequency.exponentialRampToValueAtTime(38, now + 0.22);

  const g1 = ac.createGain();
  g1.gain.setValueAtTime(0, now);
  g1.gain.linearRampToValueAtTime(0.055, now + 0.012);
  g1.gain.exponentialRampToValueAtTime(0.0004, now + 0.32);

  o1.connect(g1);
  g1.connect(master);
  o1.start(now);
  o1.stop(now + 0.34);

  /* 第二拍 */
  const o2 = ac.createOscillator();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(52, now + 0.20);
  o2.frequency.exponentialRampToValueAtTime(32, now + 0.38);

  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0, now + 0.20);
  g2.gain.linearRampToValueAtTime(0.032, now + 0.21);
  g2.gain.exponentialRampToValueAtTime(0.0003, now + 0.50);

  o2.connect(g2);
  g2.connect(master);
  o2.start(now + 0.20);
  o2.stop(now + 0.52);
}

/* ---- 脚步音 ---- */
let lastStepTime = 0;
function playStep(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  if (now - lastStepTime < 0.18) return;
  lastStepTime = now;

  const nl = Math.ceil(ac.sampleRate * 0.035);
  const buf = ac.createBuffer(1, nl, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const t = i / nl;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.4);
  }

  const src = ac.createBufferSource();
  src.buffer = buf;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 900 + Math.random() * 700;
  bp.Q.value = 2.4;

  const g = ac.createGain();
  g.gain.value = 0.008;

  src.connect(bp);
  bp.connect(g);
  g.connect(master);
  src.start(now);
}

/* ---- 碰到门：警告脉冲 ---- */
function playDoorLock(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const o = ac.createOscillator();
  o.type = 'square';
  o.frequency.setValueAtTime(240, now);
  o.frequency.setValueAtTime(200, now + 0.09);
  o.frequency.setValueAtTime(240, now + 0.18);

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 1200;
  lp.Q.value = 2.0;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.026, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.32);

  o.connect(lp);
  lp.connect(g);
  g.connect(master);
  o.start(now);
  o.stop(now + 0.34);
}

/* ---- 门打开：机械滑动 ---- */
function playDoorOpen(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 机械摩擦：噪声 */
  const nl = Math.ceil(ac.sampleRate * 0.42);
  const buf = ac.createBuffer(1, nl, ac.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < nl; i++){
    const t = i / nl;
    const w = Math.random() * 2 - 1;
    last = (last + 0.06 * w) / 1.06;
    d[i] = last * 4.2 * (1 - t * 0.5);
  }

  const src = ac.createBufferSource();
  src.buffer = buf;

  g.gain.exponentialRampToValueAtTime(0.0003, now + 0.46);

  src.connect(bp);
  bp.connect(g);

  const o = ac.createOscillator();
  o.type = 'sine';

/* =========================================================
   迷宫生成
   ========================================================= */
function generateMaze(){
  cells = [];
  doors.clear();

  for (let r = 0; r < ROWS; r++){
    const row = [];
    for (let c = 0; c < COLS; c++){
      row.push({
        walls: [true, true, true, true],
        visited: false
      });
    }
    cells.push(row);
  }

  /* 递归回溯生成 */
  const stack = [{ r: 0, c: 0 }];
  cells[0][0].visited = true;

  while (stack.length > 0){
    const cur = stack[stack.length - 1];
    const neighbors = [];

    for (let i = 0; i < DIRS.length; i++){
      const d = DIRS[i];
      const nr = cur.r + d.dr;
      const nc = cur.c + d.dc;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      if (cells[nr][nc].visited) continue;
      neighbors.push({ r: nr, c: nc, wall: d.wall, opposite: d.opposite });
    }

    if (neighbors.length === 0){
      stack.pop();
      continue;
    }

    const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
    cells[cur.r][cur.c].walls[pick.wall] = false;
    cells[pick.r][pick.c].walls[pick.opposite] = false;
    cells[pick.r][pick.c].visited = true;
    stack.push({ r: pick.r, c: pick.c });
  }

  /* 重置访问标记 */
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      cells[r][c].visited = false;
    }
  }

  /* 在路径上放置门 */
  const path = findPath({ r: 0, c: 0 }, exitCell);
  if (path && path.length > 6){
    placeDoors(path, Math.min(5, 2 + level));
  } else {
    /* 兜底：随机放几扇门 */
    placeRandomDoors(Math.min(5, 2 + level));
  }
}

function findPath(start, end){
  const queue = [start];
  const visited = new Set();
  const parent = new Map();
  visited.add(start.r + ',' + start.c);

  while (queue.length > 0){
    const cur = queue.shift();

    if (cur.r === end.r && cur.c === end.c){
      const path = [cur];
      let key = cur.r + ',' + cur.c;
      while (parent.has(key)){
        const p = parent.get(key);
        path.unshift(p);
        key = p.r + ',' + p.c;
      }
      return path;
    }

    for (let i = 0; i < DIRS.length; i++){
      const d = DIRS[i];
      if (cells[cur.r][cur.c].walls[d.wall]) continue;

      const nr = cur.r + d.dr;
      const nc = cur.c + d.dc;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;

      const k = nr + ',' + nc;
      if (visited.has(k)) continue;

      visited.add(k);
      parent.set(k, cur);
      queue.push({ r: nr, c: nc });
    }
  }
  return null;
}

function placeDoors(path, count){
  const transitions = [];
  for (let i = 0; i < path.length - 1; i++){
    if (i === 0) continue;                            /* 跳过起点 */
    if (i >= path.length - 3) continue;               /* 跳过出口附近 */
    transitions.push({ a: path[i], b: path[i + 1] });
  }

  /* 打乱 */
  for (let i = transitions.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = transitions[i];
    transitions[i] = transitions[j];
    transitions[j] = t;
  }

  const chosen = transitions.slice(0, Math.min(count, transitions.length));

  for (let i = 0; i < chosen.length; i++){
    const t = chosen[i];
    const dr = t.b.r - t.a.r;
    const dc = t.b.c - t.a.c;

    let key;
    if (dc === 1){
      key = 'v,' + t.a.r + ',' + t.a.c;
    } else if (dc === -1){
      key = 'v,' + t.b.r + ',' + t.b.c;
    } else if (dr === 1){
      key = 'h,' + t.a.r + ',' + t.a.c;
    } else {
      key = 'h,' + t.b.r + ',' + t.b.c;
    }

    doors.set(key, { open: false, hue: 36 });
  }

  doorsTotal = doors.size;
}

function placeRandomDoors(count){
  const candidates = [];

  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      if (r === 0 && c === 0) continue;
      if (r === ROWS - 1 && c === COLS - 1) continue;

      /* 右墙 */
      if (c < COLS - 1 && !cells[r][c].walls[1]){
        candidates.push({ key: 'v,' + r + ',' + c });
      }
      /* 下墙 */
      if (r < ROWS - 1 && !cells[r][c].walls[2]){
        candidates.push({ key: 'h,' + r + ',' + c });
      }
    }
  }

  for (let i = candidates.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = candidates[i];
    candidates[i] = candidates[j];
    candidates[j] = t;
  }

  const chosen = candidates.slice(0, Math.min(count, candidates.length));
  for (let i = 0; i < chosen.length; i++){
    doors.set(chosen[i].key, { open: false, hue: 36 });
  }

  doorsTotal = doors.size;
}

/* =========================================================
   门的辅助函数
   ========================================================= */
function doorKeyFor(r, c, wallIdx){
  if (wallIdx === 0){
    if (r === 0) return null;
    return 'h,' + (r - 1) + ',' + c;
  }
  if (wallIdx === 1){
    if (c === COLS - 1) return null;
    return 'v,' + r + ',' + c;
  }
  if (wallIdx === 2){
    if (r === ROWS - 1) return null;
    return 'h,' + r + ',' + c;
  }
  if (wallIdx === 3){
    if (c === 0) return null;
    return 'v,' + r + ',' + (c - 1);
  }
  return null;
}

function isDoor(r, c, wallIdx){
  const k = doorKeyFor(r, c, wallIdx);
  return k !== null && doors.has(k);
}

function isWallBlocking(r, c, wallIdx){
  if (!cells[r] || !cells[r][c]) return true;
  if (!cells[r][c].walls[wallIdx]) return false;

  const k = doorKeyFor(r, c, wallIdx);
  if (k !== null && doors.has(k)){
    return !doors.get(k).open;
  }
  return true;
}

/* =========================================================
   碰撞检测
   ========================================================= */
function segDist(px, py, x1, y1, x2, y2){
  const dx = x2 - x1;
  const dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 < 1e-9) return Math.hypot(px - x1, py - y1);

  let t = ((px - x1) * dx + (py - y1) * dy) / l2;
  if (t < 0) t = 0;
  else if (t > 1) t = 1;

  const cx = x1 + t * dx;
  const cy = y1 + t * dy;
  return Math.hypot(px - cx, py - cy);
}

function collides(gx, gy){
  const r = PLAYER_R;

  const minR = Math.max(0, Math.floor(gy - r - 0.5));
  const maxR = Math.min(ROWS - 1, Math.floor(gy + r + 0.5));
  const minC = Math.max(0, Math.floor(gx - r - 0.5));
  const maxC = Math.min(COLS - 1, Math.floor(gx + r + 0.5));

  for (let rr = minR; rr <= maxR; rr++){
    for (let cc = minC; cc <= maxC; cc++){
      /* 上墙 */
      if (isWallBlocking(rr, cc, 0)){
        if (segDist(gx, gy, cc, rr, cc + 1, rr) < r) return true;
      }
      /* 下墙 */
      if (isWallBlocking(rr, cc, 2)){
        if (segDist(gx, gy, cc, rr + 1, cc + 1, rr + 1) < r) return true;
      }
      /* 左墙 */
      if (isWallBlocking(rr, cc, 3)){
        if (segDist(gx, gy, cc, rr, cc, rr + 1) < r) return true;
      }
      /* 右墙 */
      if (isWallBlocking(rr, cc, 1)){
        if (segDist(gx, gy, cc + 1, rr, cc + 1, rr + 1) < r) return true;
      }
    }
  }
  return false;
}

/* =========================================================
   移动
   ========================================================= */
function tryMove(dx, dy){
  if (collides(player.gx + dx, player.gy)){
    /* 尝试贴墙滑行 */
    if (collides(player.gx + dx * 0.4, player.gy)){
      /* x 方向被挡 */
    } else {
      player.gx += dx;
    }
  } else {
    player.gx += dx;
  }

  if (collides(player.gx, player.gy + dy)){
    if (collides(player.gx, player.gy + dy * 0.4)){
      /* y 方向被挡 */
    } else {
      player.gy += dy;
    }
  } else {
    player.gy += dy;
  }
}

/* ---- 触控摇杆 ---- */
const joystick = document.getElementById('joystick');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false;
let joyId = null;
let joyCenterX = 0, joyCenterY = 0;
let joyDx = 0, joyDy = 0;

if (joystick){
  joystick.style.display = 'none';

  window.addEventListener('pointerdown', function(e){
    if (modalOpen) return;
    if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
    if (joyActive) return;

    joyActive = true;
    joyId = e.pointerId;

    const rect = joystick.getBoundingClientRect();
    joyCenterX = rect.left + rect.width / 2;
    joyCenterY = rect.top + rect.height / 2;

    updateJoy(e.clientX, e.clientY);
  });

  window.addEventListener('pointermove', function(e){
    if (!joyActive || e.pointerId !== joyId) return;
    updateJoy(e.clientX, e.clientY);
  });

  window.addEventListener('pointerup', function(e){
    if (!joyActive || e.pointerId !== joyId) return;
    joyActive = false;
    joyId = null;
    joyDx = 0;
    joyDy = 0;
    joyKnob.style.transform = 'translate(0,0)';
  });

  window.addEventListener('pointercancel', function(e){
    if (!joyActive || e.pointerId !== joyId) return;
    joyActive = false;
    joyId = null;
    joyDx = 0;
    joyDy = 0;
    joyKnob.style.transform = 'translate(0,0)';
  });
}

function updateJoy(x, y){
  const maxDist = 44;
  let dx = x - joyCenterX;
  let dy = y - joyCenterY;

  const dist = Math.hypot(dx, dy);
  if (dist > maxDist){
    dx = dx / dist * maxDist;
    dy = dy / dist * maxDist;
  }

  joyKnob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';

  joyDx = dx / maxDist;
  joyDy = dy / maxDist;
}

/* =========================================================
   布局
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const isNarrow = W < 720;
  const topPad = isNarrow ? 80 : 90;
  const bottomPad = isNarrow ? 100 : 80;
  const sidePad = isNarrow ? 18 : 60;

  const availW = W - sidePad * 2;
  const availH = H - topPad - bottomPad;

  cellSize = Math.floor(Math.min(availW / COLS, availH / ROWS));
  cellSize = Math.max(46, Math.min(cellSize, 96));

  const mazeW = cellSize * COLS;
  const mazeH = cellSize * ROWS;

  mazeX = (W - mazeW) / 2;
  mazeY = topPad + (availH - mazeH) / 2;
}
window.addEventListener('resize', resize);

/* =========================================================
   题目生成
   ========================================================= */
function genProblem(lv){
  /* 关卡 1-2：一元一次方程 */
  if (lv <= 1){
    return genLinear1();
  }
  /* 关卡 2-3：两步方程 */
  if (lv === 2){
    return genLinear2();
  }
  /* 关卡 3-4：带括号 */
  if (lv === 3){
    return genParen();
  }
  /* 关卡 4-5：两边都有未知数 */
  if (lv === 4){
    return genBothSides();
  }
  /* 关卡 5+：二元一次方程组 */
  return genSystem();
}

function fmtTerm(a, b, isFirst){
  /* 生成 ax + b 或 ax - b 这样的字符串 */
  let s = '';

  if (isFirst){
    if (a === 1) s += 'x';
    else if (a === -1) s += '−x';
    else s += a + 'x';
  }

  if (b === 0) return s;

  if (b > 0){
    s += ' + ' + b;
  } else {
    s += ' − ' + Math.abs(b);
  }

  return s;
}

function genLinear1(){
  const a = 2 + Math.floor(Math.random() * 4);
  const x = 1 + Math.floor(Math.random() * 9);
  let b = Math.floor(Math.random() * 13) - 6;
  if (b === 0) b = 3;
  const c = a * x + b;

  let eq = a + 'x';
  if (b > 0) eq += ' + ' + b;
  else eq += ' − ' + Math.abs(b);
  eq += ' = ' + c;

  return {
    eq: eq,
    answer: x,
    hint: '移项：' + a + 'x = ' + c + (b >= 0 ? ' − ' + b : ' + ' + Math.abs(b)) + ' = ' + (c - b)
  };
}

function genLinear2(){
  const a = 2 + Math.floor(Math.random() * 5);
  const x = 1 + Math.floor(Math.random() * 10);
  let b = Math.floor(Math.random() * 21) - 10;
  if (b === 0) b = 5;
  const c = a * x + b;

  let eq = a + 'x';
  if (b > 0) eq += ' + ' + b;
  else eq += ' − ' + Math.abs(b);
  eq += ' = ' + c;

  return {
    eq: eq,
    answer: x,
    hint: '先移项再除以 ' + a
  };
}

function genParen(){
  const a = 2 + Math.floor(Math.random() * 4);
  const b = 1 + Math.floor(Math.random() * 6);
  const x = 1 + Math.floor(Math.random() * 8);
  const c = a * (x + b);

  return {
    eq: a + '(x + ' + b + ') = ' + c,
    answer: x,
    hint: '两边同除以 ' + a + '：x + ' + b + ' = ' + (c / a)
  };
}

function genBothSides(){
  const a = 2 + Math.floor(Math.random() * 4);
  const c = 1 + Math.floor(Math.random() * 3);
  const x = 1 + Math.floor(Math.random() * 8);
  let b = Math.floor(Math.random() * 15) - 7;
  if (b === 0) b = 4;

  /* ax + b = cx + d  →  d = (a-c)x + b */
  const d = (a - c) * x + b;

  if (a === c) return genBothSides();

  let eq = a + 'x';
  if (b > 0) eq += ' + ' + b;
  else eq += ' − ' + Math.abs(b);
  eq += ' = ' + c + 'x';
  if (d > 0) eq += ' + ' + d;
  else if (d < 0) eq += ' − ' + Math.abs(d);

  return {
    eq: eq,
    answer: x,
    hint: '合并同类项：(' + a + ' − ' + c + ')x = ' + (d - b)
  };
}

function genSystem(){
  const x = 1 + Math.floor(Math.random() * 6);
  const y = 1 + Math.floor(Math.random() * 6);

  let a1, b1, a2, b2, guard = 0;
  do {
    a1 = 1 + Math.floor(Math.random() * 4);
    b1 = 1 + Math.floor(Math.random() * 4);
    a2 = 1 + Math.floor(Math.random() * 4);
    b2 = 1 + Math.floor(Math.random() * 4);
    guard++;
  } while ((a1 * b2 - a2 * b1 === 0) && guard < 40);

  if (a1 * b2 - a2 * b1 === 0){
    b1 = b1 + 1;
  }

  const c1 = a1 * x + b1 * y;
  const c2 = a2 * x + b2 * y;

  return {
    eq: a1 + 'x + ' + b1 + 'y = ' + c1 + '\n' + a2 + 'x + ' + b2 + 'y = ' + c2,
    answer: x,
    hint: '消元法：消去 y，先求 x',
    isSystem: true,
    label: 'x ='
  };
}

  }, 260);
}

function closeModal(){
  modalOpen = false;
  currentDoorKey = null;
  currentProblem = null;
  modal.classList.remove('show');
}

function submitAnswer(){
  if (!currentProblem || !currentDoorKey) return;

  const raw = answerInput.value.trim();
  if (!raw) return;

  const num = parseFloat(raw.replace(/[^\d.\-+]/g, ''));

  if (isNaN(num)){
    answerInput.classList.add('error');
    playWrong();
    setTimeout(function(){
      answerInput.classList.remove('error');
    }, 420);
    return;
  }

  if (Math.abs(num - currentProblem.answer) < 0.01){
    /* 正确 */
    const d = doors.get(currentDoorKey);
    if (d){
      d.open = true;
      doorsOpened++;
    }

    playCorrect();
    playDoorOpen();
    updateHUD();

    closeModal();
    showToast('✓ 门已开启', false);

    /* 视觉反馈 */
    burstAtDoor(currentDoorKey);

  } else {
    /* 错误 */
    answerInput.classList.add('error');
    playWrong();

    timeLeft -= 10;
    if (timeLeft < 0) timeLeft = 0;

    setTimeout(function(){
      answerInput.classList.remove('error');
    }, 480);

    showToast('✗ 答案错误 · −10 秒', true);
  }
}

document.getElementById('submitBtn').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  submitAnswer();
});

document.getElementById('cancelBtn').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  closeModal();
});

document.getElementById('modalBg').addEventListener('click', function(e){
  e.stopPropagation();
  closeModal();
});

answerInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){
    e.preventDefault();
    e.stopPropagation();
    submitAnswer();
  }
  if (e.key === 'Escape'){
    e.stopPropagation();
    closeModal();
  }
});

/* =========================================================
   Toast
   ========================================================= */
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(text, isBad){
  toastEl.textContent = text;
  toastEl.classList.toggle('bad', !!isBad);
  toastEl.classList.add('show');

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toastEl.classList.remove('show');
  }, 1500);
}

/* =========================================================
   门检测
   ========================================================= */
let lastDoorCheck = 0;
const DOOR_CHECK_INTERVAL = 1.6;

function checkDoorProximity(now){
  if (modalOpen || gameOver || paused) return;
  if (now - lastDoorCheck < DOOR_CHECK_INTERVAL) return;

  /* 检查玩家附近是否有未打开的门 */
  const pr = player.gy;
  const pc = player.gx;

  const minR = Math.max(0, Math.floor(pr - 1));
  const maxR = Math.min(ROWS - 1, Math.ceil(pr + 1));
  const minC = Math.max(0, Math.floor(pc - 1));
  const maxC = Math.min(COLS - 1, Math.ceil(pc + 1));

  for (let rr = minR; rr <= maxR; rr++){
    for (let cc = minC; cc <= maxC; cc++){
      for (let wi = 0; wi < 4; wi++){
        const k = doorKeyFor(rr, cc, wi);
        if (k === null) continue;
        if (!doors.has(k)) continue;
        if (doors.get(k).open) continue;

        /* 计算门的中点 */
        let dx, dy;
        if (wi === 0) { dx = cc + 0.5; dy = rr; }
        else if (wi === 1) { dx = cc + 1; dy = rr + 0.5; }
        else if (wi === 2) { dx = cc + 0.5; dy = rr + 1; }
        else { dx = cc; dy = rr + 0.5; }

        const dist = Math.hypot(dx - player.gx, dy - player.gy);
        if (dist < 0.70){
          lastDoorCheck = now;
          playDoorLock();
          openModal(k);
          return;
        }
      }
    }
  }
}

/* =========================================================
   粒子爆发
   ========================================================= */
const particles = [];

function burstAtDoor(key){
  if (!key) return;

  /* 解析 key 得到门的屏幕位置 */
  const parts = key.split(',');
  const orient = parts[0];
  const r = parseInt(parts[1], 10);
  const c = parseInt(parts[2], 10);

  let gx, gy;
  if (orient === 'v'){
    gx = c + 1;
    gy = r + 0.5;
  } else {
    gx = c + 0.5;
    gy = r + 1;
  }

  const sx = mazeX + gx * cellSize;
  const sy = mazeY + gy * cellSize;

  for (let i = 0; i < 24; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 180;
    particles.push({
      x: sx, y: sy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.6 + Math.random() * 1.2,
      size: 1.6 + Math.random() * 2.4,
      hue: 40 + Math.random() * 26
    });
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= p.decay * dt;
    if (p.life <= 0){
      particles.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
  }
}

/* =========================================================
   更新
   ========================================================= */
let lastUpdateTime = 0;

function update(dt){
  if (gameOver || paused || modalOpen) return;
  if (dt > 0.05) dt = 0.05;

  /* 计时 */
  timeLeft -= dt;
  if (timeLeft <= 0){
    timeLeft = 0;
    onGameOver();
    return;
  }

  /* 计时告急音效 */
  if (timeLeft < 20 && Math.floor(timeLeft) !== Math.floor(timeLeft + dt)){
    if (Math.floor(timeLeft) % 2 === 0){
      playUrgent();
    }
  }

  /* 输入方向 */
  let ix = 0, iy = 0;

  if (keys['w'] || keys['arrowup']) iy -= 1;
  if (keys['s'] || keys['arrowdown']) iy += 1;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;

  if (joyActive){
    ix += joyDx;
    iy += joyDy;
  }

  const mag = Math.hypot(ix, iy);
  if (mag > 1){
    ix /= mag;
    iy /= mag;
  }

  /* 移动 */
  if (ix !== 0 || iy !== 0){
    const speed = PLAYER_SPEED * dt;
    tryMove(ix * speed, iy * speed);

    /* 脚步音 */
    if (Math.random() < 0.32){
      playStep();
    }
  }

  /* 到达出口检测 */
  const ecx = exitCell.c + 0.5;
  const ecy = exitCell.r + 0.5;
  const distToExit = Math.hypot(player.gx - ecx, player.gy - ecy);

  if (distToExit < 0.35 && !exitReached){
    exitReached = true;
    onExitReached();
  }
}

/* =========================================================
   渲染
   ========================================================= */
function render(now){
  /* 清屏 */
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  bg.addColorStop(0.00, '#080c1c');
  bg.addColorStop(0.42, '#04060f');
  bg.addColorStop(1.00, '#020308');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (cells.length === 0) return;

  const cs = cellSize;
  const ox = mazeX;
  const oy = mazeY;
  const t = now * 0.001;

  /* 迷宫地面网格 */
  ctx.strokeStyle = 'rgba(60, 110, 200, 0.055)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= ROWS; r++){
    ctx.beginPath();
    ctx.moveTo(ox, oy + r * cs);
    ctx.lineTo(ox + COLS * cs, oy + r * cs);
    ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++){
    ctx.beginPath();
    ctx.moveTo(ox + c * cs, oy);
    ctx.lineTo(ox + c * cs, oy + ROWS * cs);
    ctx.stroke();
  }

  /* 出口 */
  const ex = ox + exitCell.c * cs;
  const ey = oy + exitCell.r * cs;
  const exitPulse = 0.72 + 0.28 * Math.sin(t * 2.4);

  ctx.globalCompositeOperation = 'lighter';
  const eg = ctx.createRadialGradient(
    ex + cs * 0.5, ey + cs * 0.5, 0,
    ex + cs * 0.5, ey + cs * 0.5, cs * 0.9
  );
  eg.addColorStop(0.00, 'rgba(140, 250, 190, ' + (0.52 * exitPulse) + ')');
  eg.addColorStop(0.42, 'rgba(90, 220, 160, ' + (0.20 * exitPulse) + ')');
  eg.addColorStop(1.00, 'rgba(60, 180, 130, 0)');
  ctx.fillStyle = eg;
  ctx.fillRect(ex - cs * 0.4, ey - cs * 0.4, cs * 1.8, cs * 1.8);

  ctx.strokeStyle = 'rgba(140, 250, 190, ' + (0.62 * exitPulse) + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.lineDashOffset = -(t * 26) % 10;
  ctx.beginPath();
  ctx.arc(ex + cs * 0.5, ey + cs * 0.5, cs * 0.32, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 出口文字 */
  ctx.font = '600 ' + Math.max(9, cs * 0.17).toFixed(0) + 'px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(160, 255, 200, ' + (0.72 * exitPulse) + ')';
  ctx.fillText('出口', ex + cs * 0.5, ey + cs * 0.5);

  ctx.globalCompositeOperation = 'source-over';

  /* 绘制墙与门 */
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const x = ox + c * cs;
      const y = oy + r * cs;

      for (let wi = 0; wi < 4; wi++){
        const doorKey = doorKeyFor(r, c, wi);
        const isDoorHere = doorKey !== null && doors.has(doorKey);
        const doorOpen = isDoorHere && doors.get(doorKey).open;

        /* 跳过内部共享墙的重复绘制 */
        if (wi === 2 && r < ROWS - 1) continue;
        if (wi === 1 && c < COLS - 1) continue;

        if (!cells[r][c].walls[wi]) continue;

        let x1, y1, x2, y2;
        if (wi === 0){ x1 = x; y1 = y; x2 = x + cs; y2 = y; }
        else if (wi === 1){ x1 = x + cs; y1 = y; x2 = x + cs; y2 = y + cs; }
        else if (wi === 2){ x1 = x; y1 = y + cs; x2 = x + cs; y2 = y + cs; }
        else { x1 = x; y1 = y; x2 = x; y2 = y + cs; }

        if (isDoorHere){
          if (doorOpen){
            /* 已打开：画淡绿虚线痕迹 */
            ctx.strokeStyle = 'rgba(120, 240, 170, 0.16)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.setLineDash([]);
          } else {
            /* 未打开：发光的门 */
            const dp = 0.72 + 0.28 * Math.sin(t * 3.2 + r + c);

            /* 光晕 */
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = 'rgba(255, 180, 90, ' + (0.22 * dp) + ')';
            ctx.lineWidth = 9;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';

            /* 主体 */
            ctx.strokeStyle = 'rgba(255, 200, 120, ' + (0.72 * dp) + ')';
            ctx.lineWidth = 3.6;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }
        } else {
          /* 普通墙 */
          ctx.strokeStyle = 'rgba(110, 155, 240, 0.55)';
          ctx.lineWidth = 3.4;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();

          /* 内侧高光 */
          ctx.strokeStyle = 'rgba(160, 200, 255, 0.18)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }
    }
  }

  /* 粒子 */
  if (particles.length > 0){
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < particles.length; i++){
      const p = particles[i];
      const a = p.life * p.life * 0.90;
      const r = p.size * p.life;

      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4.5);
      g.addColorStop(0.00, 'hsla(' + p.hue + ', 100%, 92%, ' + a + ')');
      g.addColorStop(0.42, 'hsla(' + p.hue + ', 100%, 72%, ' + (a * 0.32) + ')');
      g.addColorStop(1.00, 'hsla(' + p.hue + ', 100%, 62%, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 玩家 */
  const px = ox + player.gx * cs;
  const py = oy + player.gy * cs;
  const pr = PLAYER_R * cs;

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const pg = ctx.createRadialGradient(px, py, 0, px, py, pr * 4.5);
  pg.addColorStop(0.00, 'rgba(180, 240, 255, 0.72)');
  pg.addColorStop(0.32, 'rgba(100, 190, 255, 0.30)');
  pg.addColorStop(1.00, 'rgba(60, 140, 255, 0)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.arc(px, py, pr * 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 玩家本体 */
  const pcore = ctx.createRadialGradient(
    px - pr * 0.32, py - pr * 0.32, 0,
    px, py, pr
  );
  pcore.addColorStop(0.00, 'rgba(240, 252, 255, 1)');
  pcore.addColorStop(0.42, 'rgba(140, 220, 255, 0.96)');
  pcore.addColorStop(1.00, 'rgba(70, 150, 240, 0.88)');
  ctx.fillStyle = pcore;
  ctx.beginPath();
  ctx.arc(px, py, pr, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(200, 240, 255, 0.88)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(px, py, pr, 0, Math.PI * 2);
  ctx.stroke();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.36,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.90)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* 时间告急：边缘红光 */
  if (timeLeft < 20 && !gameOver){
    const intensity = (1 - timeLeft / 20) * 0.42;
    const redVg = ctx.createRadialGradient(
      W * 0.5, H * 0.5, Math.min(W, H) * 0.30,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.75
    );
    redVg.addColorStop(0.00, 'rgba(0,0,0,0)');
    redVg.addColorStop(0.62, 'rgba(0,0,0,0)');
    redVg.addColorStop(1.00, 'rgba(255, 60, 40, ' + intensity + ')');
    ctx.fillStyle = redVg;
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   HUD
   ========================================================= */
function updateHUD(){
  const lvEl = document.getElementById('lvName');
  const dpEl = document.getElementById('doorProgress');
  const tmEl = document.getElementById('timerVal');

  if (lvEl) lvEl.textContent = '第 ' + level + ' 关';
  if (dpEl) dpEl.textContent = doorsOpened + ' / ' + doorsTotal;

  if (tmEl){
    tmEl.textContent = Math.ceil(timeLeft);
    tmEl.classList.toggle('danger', timeLeft < 20);
  }
}

/* =========================================================
   关卡控制
   ========================================================= */
function startLevel(lv){
  level = lv;
  timeLeft = Math.max(100, 200 - lv * 10);
  doorsOpened = 0;
  exitReached = false;
  gameOver = false;
  paused = false;
  hintUsedThisLevel = 0;
  particles.length = 0;
  lastDoorCheck = 0;

  generateMaze();

  player.gx = 0.5;
  player.gy = 0.5;

  updateHUD();
}

function restartLevel(){
  initAudio();
  startLevel(level);
  showToast('重新开始 · 第 ' + level + ' 关', false);
}

function onExitReached(){
  /* 通关！ */
  const bonus = Math.round(timeLeft) * 2 + doorsOpened * 40;
  score += bonus;

  playVictory();
  showToast('✦ 逃脱成功 · +' + bonus, false);

  paused = true;

  setTimeout(function(){
    level++;
    if (level > 8){
      /* 全部通关 */
      showToast('★ 全部逃脱完成 · 总分 ' + score, false);
      setTimeout(function(){
        level = 1;
        score = 0;
        startLevel(1);
      }, 2600);
    } else {
      startLevel(level);
      showToast('进入第 ' + level + ' 关', false);
    }
  }, 2000);
}

function onGameOver(){
  gameOver = true;
  playWrong();
  showToast('⏱ 时间耗尽 · 重新开始', true);

  setTimeout(function(){
    startLevel(level);
    showToast('第 ' + level + ' 关 · 再次挑战', false);
  }, 2200);
}

/* =========================================================
   按钮
   ========================================================= */
document.getElementById('hintBtn').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  if (!currentProblem) {
    showToast('提示将在解题时显示', false);
    return;
  }
});

/* 全局提示：当前是否在弹窗中 */
document.getElementById('hintBtn').onclick = function(e){
  e.stopPropagation();
  initAudio();

  if (modalOpen && currentProblem){
    if (modalHint.textContent){
      modalHint.textContent = '';
    } else {
      modalHint.textContent = '💡 ' + currentProblem.hint;
      timeLeft -= 15;
      if (timeLeft < 0) timeLeft = 0;
    }
  } else {
    /* 找最近的一扇门 */
    let nearest = null;
    let nearestDist = Infinity;

    for (const [key, door] of doors){
      if (door.open) continue;
      const parts = key.split(',');
      const orient = parts[0];
      const r = parseInt(parts[1], 10);
      const c = parseInt(parts[2], 10);

      let gx, gy;
      if (orient === 'v'){ gx = c + 1; gy = r + 0.5; }
      else { gx = c + 0.5; gy = r + 1; }

      const d = Math.hypot(gx - player.gx, gy - player.gy);
      if (d < nearestDist){
        nearestDist = d;
        nearest = key;
      }
    }

    if (nearest){
      openModal(nearest);
      setTimeout(function(){
        if (currentProblem){
          modalHint.textContent = '💡 ' + currentProblem.hint;
          timeLeft -= 15;
          if (timeLeft < 0) timeLeft = 0;
        }
      }, 100);
    }
  }
};

document.getElementById('restartBtn').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  restartLevel();
});

window.addEventListener('pointerdown', function(){
  initAudio();
}, { once: false });

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;

  if (dt > 0.08) dt = 0.08;
  if (dt < 0) dt = 0;

  update(dt);
  checkDoorProximity(now * 0.001);
  updateParticles(dt);
  render(now);

  /* HUD 每 4 帧更新 */
  if ((Math.floor(now) % 4) === 0){
    updateHUD();
  }
}

/* =========================================================
   启动
   ========================================================= */
resize();
startLevel(1);
requestAnimationFrame(loop);

})();
