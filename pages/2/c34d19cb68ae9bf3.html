<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环面结族交织 · 拓扑缠绕空间</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.46rem, 0.82vw, 0.62rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.18);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.36rem, 0.68vw, 0.54rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">环面结族交织 · 拓扑缠绕空间</div>
        <div class="subtitle">TORUS KNOT FAMILIES &nbsp;·&nbsp; 3×10 CURVES IN SPHERICAL DOMAIN</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">(2,3)族：</span> x=(R₁+r₁cos3θ)cos2θ y=(R₁+r₁cos3θ)sin2θ z=r₁sin3θ &nbsp;
            <span class="c2">(3,5)族：</span> R₂,r₂ &nbsp;
            <span class="c3">(5,7)族：</span> R₃,r₃
            <br>
            <span style="color:#9aa8b8;">每族10条，相位偏移 &nbsp;|&nbsp; R=2.5~2.8, r=0.5~0.7 &nbsp;|&nbsp; 球半径2.7 &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 24);

        const camera = new THREE.PerspectiveCamera(
            50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 26
        );
        camera.position.set(1.0, 0.55, 7.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_REF = '#3a4a5c', C_GLINT = '#8898aa';

        const SPHERE_R = 2.7;
        const MAX_DIST = SPHERE_R * 1.15;

        // ==================== 软钳制 ====================
        function softClamp(vec) {
            const len = vec.length();
            if (len > MAX_DIST && len > 0.001) {
                const excess = len - MAX_DIST;
                vec.normalize().multiplyScalar(MAX_DIST + Math.log(1 + excess) * 0.85);
            }
            return vec;
        }

        // ==================== 环面结生成 ====================
        function torusKnotPoint(R, r, p, q, theta, phase) {
            const t = theta + phase;
            const cosQt = Math.cos(q * t);
            const sinQt = Math.sin(q * t);
            const cosPt = Math.cos(p * t);
            const sinPt = Math.sin(p * t);
            const rad = R + r * cosQt;
            return new THREE.Vector3(rad * cosPt, rad * sinPt, r * sinQt);
        }

        function generateKnotCurves(R, r, p, q, numCurves, samples) {
            const curves = [];
            const dt = (Math.PI * 2) / samples;
            for (let i = 0; i < numCurves; i++) {
                const phase = (i / numCurves) * Math.PI * 2;
                const pts = [];
                for (let j = 0; j <= samples; j++) {
                    const theta = j * dt;
                    let pt = torusKnotPoint(R, r, p, q, theta, phase);
                    pt = softClamp(pt);
                    pts.push(pt);
                }
                curves.push(pts);
            }
            return curves;
        }

        // 三族参数
        const family1 = { R: 2.5, r: 0.68, p: 2, q: 3, num: 10, color: C1, opacity: 0.62 };
        const family2 = { R: 2.35, r: 0.58, p: 3, q: 5, num: 10, color: C2, opacity: 0.58 };
        const family3 = { R: 2.2, r: 0.5, p: 5, q: 7, num: 10, color: C3, opacity: 0.6 };
        const samples = 360;

        console.log('生成(2,3)族...');
        const curves1 = generateKnotCurves(family1.R, family1.r, family1.p, family1.q, family1.num, samples);
        console.log('生成(3,5)族...');
        const curves2 = generateKnotCurves(family2.R, family2.r, family2.p, family2.q, family2.num, samples);
        console.log('生成(5,7)族...');
        const curves3 = generateKnotCurves(family3.R, family3.r, family3.p, family3.q, family3.num, samples);

        // ==================== 创建线条组 ====================
        function createGroup(curves, colorHex, opacity) {
            const group = new THREE.Group();
            for (const pts of curves) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const group1 = createGroup(curves1, C1, family1.opacity);
        const group2 = createGroup(curves2, C2, family2.opacity);
        const group3 = createGroup(curves3, C3, family3.opacity);

        const mainGroup = new THREE.Group();
        mainGroup.add(group1);
        mainGroup.add(group2);
        mainGroup.add(group3);
        scene.add(mainGroup);

        // ==================== 参考球面线框 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 180;
            const gen = (f) => {
                const pts = [];
                for (let i = 0; i <= segs; i++) pts.push(f((i / segs) * Math.PI * 2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            };
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
            gen((a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius));
            const addLat = (zVal) => {
                const r = Math.sqrt(Math.max(0.001, radius * radius - zVal * zVal));
                const pts = [];
                for (let i = 0; i <= segs; i++) {
                    const a = (i / segs) * Math.PI * 2;
                    pts.push(new THREE.Vector3(Math.cos(a) * r, zVal, Math.sin(a) * r));
                }
                const g = new THREE.BufferGeometry().setFromPoints(pts);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity * 0.65, depthWrite: true
                });
                group.add(new THREE.Line(g, m));
            };
            addLat(radius * 0.52);
            addLat(-radius * 0.52);
            return group;
        }
        const sphereRef = createSphereWireframe(SPHERE_R, C_REF, 0.22);
        scene.add(sphereRef);

        // ==================== 轴端点光点 ====================
        (() => {
            const sz = 0.06;
            const axes = [[SPHERE_R, 0, 0], [-SPHERE_R, 0, 0], [0, SPHERE_R, 0], [0, -SPHERE_R, 0], [0, 0, SPHERE_R], [0, 0, -SPHERE_R]];
            const gGroup = new THREE.Group();
            axes.forEach(([ax, ay, az]) => {
                const pt = new THREE.Vector3(ax, ay, az);
                [[-sz, 0, 0], [sz, 0, 0], [0, -sz, 0], [0, sz, 0], [0, 0, -sz], [0, 0, sz]].forEach(([dx, dy, dz]) => {
                    const g = new THREE.BufferGeometry().setFromPoints([pt.clone().add(new THREE.Vector3(dx, dy, dz)), pt]);
                    const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent: true, opacity: 0.5, depthWrite: true });
                    gGroup.add(new THREE.Line(g, m));
                });
            });
            mainGroup.add(gGroup);
        })();

        // ==================== 原点光点 ====================
        (() => {
            const sz = 0.08;
            const g = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0),
                new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0),
                new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)
            ]);
            const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent: true, opacity: 0.72, depthWrite: true });
            scene.add(new THREE.LineSegments(g, m));
        })();

        // ==================== 动画循环（绝对时间） ====================
        const startTime = performance.now();
        let frameCount = 0;
        let currentTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            const elapsed = (now - startTime) / 1000;
            if (elapsed <= 0) { renderer.render(scene, camera); return; }
            currentTime = elapsed;
            frameCount++;
            if (frameCount === 1 || frameCount % 180 === 0) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${currentTime.toFixed(2)}s 曲线:${family1.num+family2.num+family3.num}`);
            }

            mainGroup.rotation.y = currentTime * 0.28;
            mainGroup.rotation.x = currentTime * 0.15 + Math.sin(currentTime * 0.24) * 0.2;
            mainGroup.rotation.z = Math.cos(currentTime * 0.18) * 0.12;
            sphereRef.rotation.copy(mainGroup.rotation);

            const camX = 1.0 + Math.sin(currentTime * 0.14) * 0.5;
            const camY = 0.55 + Math.cos(currentTime * 0.17) * 0.45;
            const camZ = 7.5 + Math.sin(currentTime * 0.11) * 0.45;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== 环面结族交织 · 拓扑缠绕空间 ===');
        console.log(`(2,3)族: ${curves1.length}条, (3,5)族: ${curves2.length}条, (5,7)族: ${curves3.length}条`);
        console.log('总曲线数:', curves1.length + curves2.length + curves3.length);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
