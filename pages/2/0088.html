<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIDE · 潮汐粒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050510;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(210, 230, 255, 0.8);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 18px rgba(80, 150, 240, 0.5);
        }

        .hint {
            color: rgba(160, 190, 220, 0.5);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.22em;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <div class="title">Tide</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            // ─── 画布初始化 ───────────────────────────────────────────────
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let particles = [];
            let waves = [];          // 冲击波
            let mouse = { x: -9999, y: -9999, active: false };
            let time = 0;
            let colorShift = 0;      // 色彩偏移
            let baseAmplitude = 18;  // 基础振幅

            // ─── 性能参数 ───────────────────────────────────────────────
            const PARTICLE_COUNT = () => Math.max(400, Math.min(1200, Math.floor(W * H / 1600)));

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 初始化粒子 ─────────────────────────────────────────────
            function initParticles() {
                const count = PARTICLE_COUNT();
                particles = [];
                // 均匀分布：基于网格，y方向密度更大一些，模拟波浪表面
                const cols = Math.ceil(Math.sqrt(count * (W / H)));
                const rows = Math.ceil(count / cols);
                const xStep = W / cols;
                const yStep = H / rows;
                for (let j = 0; j < rows; j++) {
                    for (let i = 0; i < cols; i++) {
                        if (particles.length >= count) break;
                        const x = i * xStep + xStep * 0.5 + (Math.random() - 0.5) * xStep * 0.6;
                        const y = j * yStep + yStep * 0.5 + (Math.random() - 0.5) * yStep * 0.6;
                        particles.push({
                            x: x,
                            y: y,
                            baseX: x,
                            baseY: y,
                            z: 0,             // 当前高度偏移
                            vz: 0,
                            phase: Math.random() * Math.PI * 2,
                            baseHue: 190 + Math.random() * 50 - 25,
                        });
                    }
                }
            }

            // ─── 创建冲击波 ─────────────────────────────────────────────
            function createWave(x, y, strength) {
                waves.push({
                    x: x,
                    y: y,
                    radius: 5,
                    maxRadius: Math.max(W, H) * 0.6,
                    strength: strength || 50,
                    decay: 0.015,
                    growth: 4.5 + Math.random() * 2,
                });
                if (waves.length > 10) waves.shift();
            }

            function updateWaves(dt) {
                for (let i = waves.length - 1; i >= 0; i--) {
                    const w = waves[i];
                    w.radius += w.growth * dt;
                    w.strength -= w.decay * dt;
                    if (w.strength <= 0 || w.radius > w.maxRadius) {
                        waves.splice(i, 1);
                    }
                }
            }

            // ─── 更新粒子（波浪模拟） ──────────────────────────────────
            function updateParticles(dt) {
                const mouseRadius = 140;
                const mouseRadiusSq = mouseRadius * mouseRadius;

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];

                    // 基础波浪：多个正弦叠加
                    const t = time;
                    const wave1 = Math.sin(p.baseX * 0.02 + t * 1.2) * baseAmplitude * 0.8;
                    const wave2 = Math.cos(p.baseX * 0.015 + t * 0.9) * baseAmplitude * 0.5;
                    const wave3 = Math.sin(p.baseY * 0.018 + t * 0.7) * baseAmplitude * 0.4;
                    let targetZ = wave1 + wave2 + wave3;

                    // 鼠标影响：抬升或压低附近粒子
                    if (mouse.active) {
                        const dx = p.baseX - mouse.x;
                        const dy = p.baseY - mouse.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < mouseRadiusSq) {
                            const dist = Math.sqrt(distSq);
                            const falloff = (1 - dist / mouseRadius);
                            // 鼠标吸引：粒子向鼠标位置的高度偏移（模拟手指划过水面）
                            targetZ += falloff * 45;
                        }
                    }

                    // 冲击波影响
                    for (const w of waves) {
                        const dx = p.baseX - w.x;
                        const dy = p.baseY - w.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const bandWidth = 50 + w.radius * 0.1;
                        const innerR = Math.max(0, w.radius - bandWidth);
                        const outerR = w.radius + bandWidth;
                        if (dist > innerR && dist < outerR) {
                            const intensity = (1 - Math.abs(dist - w.radius) / bandWidth) * w.strength;
                            targetZ += intensity;
                        }
                    }

                    // 弹簧模型：平滑趋向目标高度
                    const springForce = (targetZ - p.z) * 0.08;
                    p.vz += springForce;
                    p.vz *= 0.85;
                    p.z += p.vz;

                    // 更新实际显示位置
                    p.y = p.baseY + p.z;
                }
            }

            // ─── 绘制粒子 ───────────────────────────────────────────────
            function drawParticles(ctx) {
                for (const p of particles) {
                    // 根据高度映射颜色
                    const normalizedZ = (p.z + 60) / 120; // 映射到0-1左右
                    const clampedZ = Math.max(0, Math.min(1, normalizedZ));
                    const hue = p.baseHue + colorShift + clampedZ * 40;
                    const sat = 65 + clampedZ * 20;
                    const light = 35 + clampedZ * 45;
                    const alpha = 0.5 + clampedZ * 0.45;
                    const size = 1.2 + clampedZ * 2.5;

                    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fill();

                    // 高亮点发光
                    if (clampedZ > 0.6) {
                        const glowAlpha = (clampedZ - 0.6) * 0.9;
                        const glowSize = size * 2.2;
                        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowSize);
                        gradient.addColorStop(0, `hsla(${hue}, 80%, 80%, ${glowAlpha})`);
                        gradient.addColorStop(1, 'transparent');
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, glowSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ─── 绘制冲击波圆环 ────────────────────────────────────────
            function drawWaveCircles(ctx) {
                for (const w of waves) {
                    const alpha = Math.min(0.25, w.strength * 0.01);
                    const hue = 200 + colorShift;
                    ctx.strokeStyle = `hsla(${hue}, 70%, 75%, ${alpha})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 80;
                const hue = 200 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 60%, 75%, 0.07)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 50%, 70%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    updateWaves(fixedStep / 1000 * 60);
                    updateParticles(fixedStep / 1000 * 60);
                }

                // 半透明清除，产生拖尾效果
                ctx.fillStyle = 'rgba(5, 5, 16, 0.25)';
                ctx.fillRect(0, 0, W, H);

                // 绘制粒子
                drawParticles(ctx);

                // 绘制冲击波圆环
                drawWaveCircles(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createWave(mouse.x, mouse.y, 60);
                // 切换色彩偏移
                colorShift += 30 + Math.random() * 30;
                if (colorShift > 140) colorShift = -30;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createWave(mouse.x, mouse.y, 60);
                    colorShift += 30 + Math.random() * 30;
                    if (colorShift > 140) colorShift = -30;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                setupCanvas();
                initParticles();
                waves = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initParticles();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 确保初始背景填充
            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#050510';
                    ctx.fillRect(0, 0, W, H);
                }
            });

        })();
    </script>
</body>
</html>
