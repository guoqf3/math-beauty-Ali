<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>有机墨滴融合</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a12;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="inkCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('inkCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                maxBlobs: 18,               // 最大墨滴数量
                initialBlobs: 8,            // 初始墨滴数量
                baseRadius: 55,             // 基础半径（像素）
                radiusVariation: 45,        // 半径变化范围
                maxRadius: 120,             // 最大半径
                minRadius: 25,              // 最小半径
                driftSpeed: 0.35,           // 漂移速度
                mouseAttractRadius: 220,    // 鼠标吸引半径
                mouseAttractStrength: 0.12, // 吸引强度
                mouseRepelRadius: 80,       // 鼠标排斥半径（当鼠标靠近时轻微排斥，避免完全重合）
                mouseRepelStrength: 0.8,    // 排斥强度
                clickSpawnRadius: 45,       // 点击生成墨滴的半径
                damping: 0.92,              // 速度阻尼
                returnForce: 0.04,          // 回弹力量
                blendMode: 'lighter',       // 混合模式，增强光感
                alphaBase: 0.55,            // 基础透明度
                hueRangeStart: 0,           // 色相起始
                hueRangeEnd: 360,           // 色相结束
                saturation: 90,
                lightness: 60,
                backgroundFade: 0.12,       // 背景拖尾强度（越小拖尾越长）
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let blobs = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // ---------- 墨滴类 ----------
            class Blob {
                constructor(x, y, radius, hue, saturation, lightness) {
                    this.x = x;
                    this.y = y;
                    this.originX = x;
                    this.originY = y;
                    this.radius = radius;
                    this.targetRadius = radius;
                    this.vx = (Math.random() - 0.5) * CONFIG.driftSpeed;
                    this.vy = (Math.random() - 0.5) * CONFIG.driftSpeed;
                    this.hue = hue;
                    this.saturation = saturation;
                    this.lightness = lightness;
                    this.alpha = CONFIG.alphaBase + Math.random() * 0.2;
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 0.8 + 0.3;
                }

                // 更新位置和半径
                update(dt, time) {
                    // 基础漂移
                    this.vx += (Math.random() - 0.5) * 0.05 * dt;
                    this.vy += (Math.random() - 0.5) * 0.05 * dt;
                    // 限制漂移速度
                    const maxDrift = CONFIG.driftSpeed * 1.2;
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > maxDrift) {
                        this.vx = (this.vx / speed) * maxDrift;
                        this.vy = (this.vy / speed) * maxDrift;
                    }

                    // 鼠标吸引：墨滴向鼠标靠近
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = smoothMouseX - this.x;
                        const dy = smoothMouseY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.mouseAttractRadius && dist > 0.01) {
                            const attractForce = (1 - dist / CONFIG.mouseAttractRadius) * CONFIG.mouseAttractStrength;
                            this.vx += (dx / dist) * attractForce * dt;
                            this.vy += (dy / dist) * attractForce * dt;

                            // 如果鼠标太靠近，产生轻微排斥，防止完全重叠
                            if (dist < CONFIG.mouseRepelRadius) {
                                const repelForce = (1 - dist / CONFIG.mouseRepelRadius) * CONFIG.mouseRepelStrength;
                                this.vx -= (dx / dist) * repelForce * dt;
                                this.vy -= (dy / dist) * repelForce * dt;
                            }
                        }
                    }

                    // 弹性回弹到原始位置（保持墨滴分散在画布各处）
                    const returnAccelX = (this.originX - this.x) * CONFIG.returnForce;
                    const returnAccelY = (this.originY - this.y) * CONFIG.returnForce;
                    this.vx += returnAccelX * dt;
                    this.vy += returnAccelY * dt;

                    // 阻尼
                    this.vx *= CONFIG.damping;
                    this.vy *= CONFIG.damping;

                    // 更新位置
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界处理：反弹或循环
                    const margin = this.radius * 0.5;
                    if (this.x < margin) { this.x = margin; this.vx *= -0.5; }
                    if (this.x > width - margin) { this.x = width - margin; this.vx *= -0.5; }
                    if (this.y < margin) { this.y = margin; this.vy *= -0.5; }
                    if (this.y > height - margin) { this.y = height - margin; this.vy *= -0.5; }

                    // 半径轻微脉动
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 8;
                    this.radius = Math.max(CONFIG.minRadius, Math.min(CONFIG.maxRadius, this.targetRadius + pulse));
                }

                // 绘制墨滴（径向渐变，边缘模糊）
                draw(ctx, time) {
                    const radius = this.radius;
                    const hue = this.hue;
                    const sat = this.saturation;
                    const light = this.lightness;
                    const alpha = this.alpha;

                    // 创建径向渐变：中心亮，边缘透明
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, radius);
                    gradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${Math.min(light + 15, 95)}%, ${alpha})`);
                    gradient.addColorStop(0.6, `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.6})`);
                    gradient.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                    ctx.fill();

                    // 中心更亮的小光晕
                    const innerGlow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, radius * 0.4);
                    innerGlow.addColorStop(0, `hsla(${hue}, ${sat}%, 95%, ${alpha * 0.5})`);
                    innerGlow.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
                    ctx.fillStyle = innerGlow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---------- 初始化墨滴 ----------
            function initBlobs() {
                blobs = [];
                for (let i = 0; i < CONFIG.initialBlobs; i++) {
                    const x = Math.random() * width;
                    const y = Math.random() * height;
                    const radius = CONFIG.baseRadius + Math.random() * CONFIG.radiusVariation;
                    const hue = Math.random() * 360;
                    const saturation = CONFIG.saturation;
                    const lightness = CONFIG.lightness + Math.random() * 10;
                    blobs.push(new Blob(x, y, radius, hue, saturation, lightness));
                }
                // 设置原始位置为随机，但保持分散
                if (blobs.length > 0) {
                    const spacingX = width / Math.ceil(Math.sqrt(blobs.length));
                    const spacingY = height / Math.ceil(Math.sqrt(blobs.length));
                    for (let i = 0; i < blobs.length; i++) {
                        const col = i % Math.ceil(Math.sqrt(blobs.length));
                        const row = Math.floor(i / Math.ceil(Math.sqrt(blobs.length)));
                        blobs[i].originX = col * spacingX + spacingX * 0.3 + (Math.random() - 0.5) * 50;
                        blobs[i].originY = row * spacingY + spacingY * 0.3 + (Math.random() - 0.5) * 50;
                        blobs[i].x = blobs[i].originX;
                        blobs[i].y = blobs[i].originY;
                    }
                }
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                // 填充背景
                ctx.fillStyle = '#0a0a12';
                ctx.fillRect(0, 0, width, height);
                initBlobs();
                // 立即绘制一帧，避免白屏
                drawScene(performance.now());
            }

            // ---------- 绘制场景 ----------
            function drawScene(now) {
                // 背景拖尾：半透明覆盖，产生残影混合效果
                ctx.fillStyle = 'rgba(10, 10, 18, ' + CONFIG.backgroundFade + ')';
                ctx.fillRect(0, 0, width, height);

                // 设置混合模式为“叠加”或“更亮”，增强色彩融合
                ctx.globalCompositeOperation = CONFIG.blendMode;

                // 绘制鼠标周围光晕
                if (mouseActive && smoothMouseX > -1000) {
                    const glowRadius = 150;
                    const glowGrad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY,
                        glowRadius);
                    glowGrad.addColorStop(0, 'rgba(180, 180, 255, 0.12)');
                    glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制所有墨滴
                for (const blob of blobs) {
                    blob.draw(ctx, time);
                }

                // 恢复混合模式
                ctx.globalCompositeOperation = 'source-over';
            }

            // ---------- 更新墨滴 ----------
            function updateBlobs(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                // 平滑鼠标位置
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.14;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.14;
                }

                // 更新每个墨滴
                for (const blob of blobs) {
                    blob.update(dt, time);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updateBlobs(now);
                drawScene(now);

                animationId = requestAnimationFrame(animate);
            }

            // ---------- 鼠标与触摸事件 ----------
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function handleClick(clientX, clientY) {
                // 在点击位置生成一个新墨滴，如果数量达到上限则替换最旧的一个
                const hue = Math.random() * 360;
                const saturation = CONFIG.saturation;
                const lightness = CONFIG.lightness + Math.random() * 15;
                const radius = CONFIG.clickSpawnRadius + Math.random() * 25;
                const newBlob = new Blob(clientX, clientY, radius, hue, saturation, lightness);
                newBlob.originX = clientX;
                newBlob.originY = clientY;
                newBlob.x = clientX;
                newBlob.y = clientY;
                // 给一个初始速度，让它动起来
                newBlob.vx = (Math.random() - 0.5) * CONFIG.driftSpeed * 2;
                newBlob.vy = (Math.random() - 0.5) * CONFIG.driftSpeed * 2;
                blobs.push(newBlob);
                if (blobs.length > CONFIG.maxBlobs) {
                    // 移除第一个（最旧的）
                    blobs.shift();
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                // 触摸事件
                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__inkBlobs = {
                config: CONFIG,
                blobs: blobs,
            };
        })();
    </script>
</body>
</html>
