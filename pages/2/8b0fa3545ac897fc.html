<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>墨线素描</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f0e8;
            font-family: system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #hint {
            position: fixed;
            bottom: 20px;
            left: 24px;
            color: rgba(0, 0, 0, 0.35);
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease;
            font-weight: 300;
        }
        #fps-badge {
            position: fixed;
            top: 16px;
            right: 18px;
            color: rgba(0, 0, 0, 0.25);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="fps-badge"></div>
    <div id="hint">移动旋转 · 点击呼吸</div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─── 安全检查 ───
            if (!window.PIXI) {
                console.warn('PixiJS 加载失败');
                document.body.innerHTML = '<div style="color:#000;text-align:center;padding-top:40vh;font-size:16px;">需要WebGL支持</div>';
                return;
            }

            // ─── 常量定义 ───
            const FOCAL_LENGTH = 1100;
            const BASE_SCALE = 0.12;          // 粒子基础大小
            const PARTICLE_COUNT = 720;       // 总粒子数
            const AUTO_ROTATE_SPEED = 0.25;
            const VIEW_SENSITIVITY_X = 0.6;
            const VIEW_SENSITIVITY_Y = 0.45;
            const BREATH_DECAY = 2.8;         // 呼吸衰减速度

            // ─── 曲线定义 ───
            // 每条曲线由三维参数方程描述，t 范围 0~1
            const CURVES = [
                {
                    // 螺旋墨线
                    getPoint: (t, time) => {
                        const angle = t * Math.PI * 4 + time * 0.5;
                        const R = 240;
                        const y = (t - 0.5) * 300;
                        return {
                            x: R * Math.cos(angle),
                            y: y,
                            z: R * Math.sin(angle) * 0.5
                        };
                    },
                    gray: 0x111111,
                    count: 120,
                },
                {
                    // 波浪墨线
                    getPoint: (t, time) => {
                        const x = (t - 0.5) * 400;
                        const y = Math.sin(t * Math.PI * 6 + time * 1.2) * 80;
                        const z = Math.cos(t * Math.PI * 4 + time * 0.8) * 120;
                        return { x, y, z };
                    },
                    gray: 0x333333,
                    count: 100,
                },
                {
                    // 环状墨线
                    getPoint: (t, time) => {
                        const angle = t * Math.PI * 2 + time * 0.3;
                        const R = 180;
                        const y = Math.sin(angle * 3 + time) * 60;
                        return {
                            x: R * Math.cos(angle),
                            y: y,
                            z: R * Math.sin(angle)
                        };
                    },
                    gray: 0x555555,
                    count: 100,
                },
                {
                    // 交叉曲线（类似书法飞白）
                    getPoint: (t, time) => {
                        const x = (t - 0.5) * 350;
                        const y = Math.sin(t * Math.PI * 5 + time * 2.0) * 100;
                        const z = Math.cos(t * Math.PI * 3 + time * 1.5) * 100;
                        return { x, y, z };
                    },
                    gray: 0x222222,
                    count: 100,
                },
                {
                    // 垂直涡旋
                    getPoint: (t, time) => {
                        const angle = t * Math.PI * 6 + time * 0.7;
                        const R = 200 * (0.7 + 0.3 * Math.sin(t * Math.PI * 2 + time));
                        return {
                            x: R * Math.cos(angle),
                            y: (t - 0.5) * 250,
                            z: R * Math.sin(angle) * 0.8
                        };
                    },
                    gray: 0x444444,
                    count: 100,
                },
                {
                    // 自由曲线（多重正弦）
                    getPoint: (t, time) => {
                        const x = (t - 0.5) * 380;
                        const y = Math.sin(t * Math.PI * 7 + time * 1.8) * 90 + Math.cos(t * Math.PI * 5 + time) * 50;
                        const z = Math.sin(t * Math.PI * 4 + time * 2.2) * 130;
                        return { x, y, z };
                    },
                    gray: 0x2a2a2a,
                    count: 100,
                },
                {
                    // 中心密集环
                    getPoint: (t, time) => {
                        const angle = t * Math.PI * 8 + time * 0.6;
                        const R = 130 + 40 * Math.sin(t * Math.PI * 6 + time * 1.5);
                        return {
                            x: R * Math.cos(angle),
                            y: (t - 0.5) * 100,
                            z: R * Math.sin(angle) * 0.5
                        };
                    },
                    gray: 0x0a0a0a,
                    count: 100,
                }
            ];

            // 计算总粒子数（确保与PARTICLE_COUNT匹配或调整）
            let totalPlanned = 0;
            CURVES.forEach(c => totalPlanned += c.count);
            const finalParticleCount = totalPlanned;

            // ─── DOM 元素 ───
            const fpsBadge = document.getElementById('fps-badge');
            const hintEl = document.getElementById('hint');

            // ─── PixiJS 应用初始化 ───
            let app;
            try {
                app = new PIXI.Application({
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0xf4f0e8,
                    antialias: false,
                    autoDensity: true,
                    resolution: Math.min(window.devicePixelRatio || 1, 2),
                    powerPreference: 'high-performance',
                    forceCanvas: !isWebGLAvailable(),
                });
            } catch (err) {
                console.error('PixiJS 初始化失败:', err);
                document.body.innerHTML = '<div style="color:#000;text-align:center;padding-top:40vh;font-size:16px;">初始化失败</div>';
                return;
            }

            function isWebGLAvailable() {
                try {
                    const canvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext &&
                        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
                } catch (e) { return false; }
            }

            document.body.appendChild(app.view);

            // ─── 创建灰度光斑纹理 ───
            function createGlowTexture(size) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const half = size / 2;
                const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
                gradient.addColorStop(0.0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.1, 'rgba(255,255,255,0.95)');
                gradient.addColorStop(0.35, 'rgba(255,255,255,0.6)');
                gradient.addColorStop(0.65, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                const tex = PIXI.Texture.from(c);
                tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
                return tex;
            }

            const glowTex64 = createGlowTexture(64);
            const glowTex128 = createGlowTexture(128);

            // ─── 粒子容器 ───
            const particleContainer = new PIXI.ParticleContainer(finalParticleCount, {
                position: true,
                scale: true,
                tint: true,
                alpha: true,
            }, finalParticleCount, true);
            // 正常混合模式（不用ADD，因为背景浅色，ADD会使白色变亮，不适合墨线）
            particleContainer.blendMode = PIXI.BLEND_MODES.NORMAL;
            app.stage.addChild(particleContainer);

            // ─── 中心墨点 ───
            const centerInk = new PIXI.Sprite(glowTex128);
            centerInk.anchor.set(0.5);
            centerInk.tint = 0x222222;
            centerInk.alpha = 0.45;
            centerInk.scale.set(1.2);
            centerInk.blendMode = PIXI.BLEND_MODES.NORMAL;
            app.stage.addChild(centerInk);

            // 第二个更小的深色核心
            const centerCore = new PIXI.Sprite(glowTex64);
            centerCore.anchor.set(0.5);
            centerCore.tint = 0x000000;
            centerCore.alpha = 0.6;
            centerCore.scale.set(0.4);
            centerCore.blendMode = PIXI.BLEND_MODES.NORMAL;
            app.stage.addChild(centerCore);

            // ─── 粒子数据结构 ───
            const sprites = [];
            const particleData = [];

            let mouseX = 0;
            let mouseY = 0;
            let smoothMouseX = 0;
            let smoothMouseY = 0;
            let autoRotateY = 0;
            let time = 0;
            let frameCount = 0;
            let fpsLastTime = 0;
            let breathEnergy = 0;

            // ─── 音频上下文 ───
            let audioCtx = null;
            function ensureAudio() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        audioCtx = new AudioContext();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            // 呼吸音效：低频正弦滑音，模拟柔和的呼气
            function playBreathSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const duration = 0.5;

                // 主振荡器：200Hz 降至 60Hz
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + duration);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);

                // 次级谐波，增加“气息”感
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(120, now);
                osc2.frequency.exponentialRampToValueAtTime(45, now + duration * 0.8);
                gain2.gain.setValueAtTime(0.1, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.9);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.02);
                osc2.stop(now + duration);
            }

            // ─── 初始化粒子 ───
            function initParticles() {
                for (let ci = 0; ci < CURVES.length; ci++) {
                    const curve = CURVES[ci];
                    const n = curve.count;
                    for (let i = 0; i < n; i++) {
                        const sprite = new PIXI.Sprite(glowTex64);
                        sprite.anchor.set(0.5);
                        sprite.tint = curve.gray;
                        sprite.alpha = 0.7 + Math.random() * 0.25;
                        sprite.scale.set(BASE_SCALE * (0.8 + Math.random() * 0.4));

                        const phase = Math.random(); // 0-1
                        const speed = 0.5 + Math.random() * 0.7; // 流动速度
                        const flowDir = Math.random() > 0.5 ? 1 : -1;
                        const data = {
                            curveIndex: ci,
                            phase: phase,
                            speed: speed * flowDir,
                            baseAlpha: 0.65 + Math.random() * 0.3,
                        };
                        particleData.push(data);
                        sprites.push(sprite);
                        particleContainer.addChild(sprite);
                    }
                }
                console.log('墨线粒子初始化完成，数量:', sprites.length);
            }

            // ─── 3D 旋转与投影 ───
            function rotatePoint(x, y, z, viewX, viewY) {
                // 绕 Y 轴旋转
                const cosY = Math.cos(viewY);
                const sinY = Math.sin(viewY);
                const x1 = x * cosY + z * sinY;
                const z1 = -x * sinY + z * cosY;
                const y1 = y;
                // 绕 X 轴旋转
                const cosX = Math.cos(viewX);
                const sinX = Math.sin(viewX);
                const y2 = y1 * cosX - z1 * sinX;
                const z2 = y1 * sinX + z1 * cosX;
                const x2 = x1;
                return { x: x2, y: y2, z: z2 };
            }

            function projectPoint(p, centerX, centerY) {
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + p.z);
                return {
                    sx: p.x * scale + centerX,
                    sy: p.y * scale + centerY,
                    scale: scale
                };
            }

            // ─── 更新粒子 ───
            function updateParticles(delta, viewX, viewY, centerX, centerY) {
                // 呼吸能量衰减
                if (breathEnergy > 0) {
                    breathEnergy = Math.max(0, breathEnergy - delta * BREATH_DECAY);
                }

                for (let i = 0; i < sprites.length; i++) {
                    const data = particleData[i];
                    const sprite = sprites[i];
                    const curve = CURVES[data.curveIndex];

                    // 更新相位
                    data.phase += data.speed * delta * 0.55;
                    if (data.phase > 1.0) data.phase -= 1.0;
                    if (data.phase < 0.0) data.phase += 1.0;

                    // 获取曲线上的三维点
                    const pt = curve.getPoint(data.phase, time);

                    // 呼吸效果：粒子沿径向轻微偏移（根据呼吸能量）
                    let offsetX = 0,
                        offsetY = 0,
                        offsetZ = 0;
                    if (breathEnergy > 0) {
                        const dist = Math.sqrt(pt.x * pt.x + pt.y * pt.y + pt.z * pt.z);
                        if (dist > 0.001) {
                            const breathOffset = breathEnergy * 25 * Math.sin(data.phase * Math.PI * 2 + time * 4);
                            offsetX = pt.x / dist * breathOffset;
                            offsetY = pt.y / dist * breathOffset;
                            offsetZ = pt.z / dist * breathOffset;
                        }
                    }

                    const worldX = pt.x + offsetX;
                    const worldY = pt.y + offsetY;
                    const worldZ = pt.z + offsetZ;

                    // 旋转
                    const rp = rotatePoint(worldX, worldY, worldZ, viewX, viewY);
                    const proj = projectPoint(rp, centerX, centerY);

                    // 深度因子
                    const depthFactor = proj.scale;
                    // 呼吸使粒子变亮、变大
                    const breathGlow = 1 + breathEnergy * 0.35;
                    const alphaMod = 0.85 + 0.15 * Math.sin(time * 1.8 + i * 0.07);
                    const finalAlpha = Math.max(0.1, Math.min(1, data.baseAlpha * depthFactor * alphaMod + breathEnergy * 0.1));

                    sprite.position.set(proj.sx, proj.sy);
                    sprite.scale.set(BASE_SCALE * depthFactor * breathGlow);
                    sprite.alpha = finalAlpha;
                }
            }

            // ─── 更新中心墨点 ───
            function updateCenterInk(centerX, centerY) {
                const baseScale = 1.1 + 0.15 * Math.sin(time * 1.2);
                const breathScale = breathEnergy * 0.6;
                const breathAlpha = breathEnergy * 0.3;

                centerInk.position.set(centerX, centerY);
                centerInk.scale.set(baseScale + breathScale);
                centerInk.alpha = 0.4 + 0.1 * Math.sin(time * 1.5) + breathAlpha;

                centerCore.position.set(centerX, centerY);
                centerCore.scale.set(0.35 + 0.05 * Math.sin(time * 2.0) + breathEnergy * 0.25);
                centerCore.alpha = 0.55 + 0.15 * Math.sin(time * 1.3) + breathEnergy * 0.4;
            }

            // ─── 触发呼吸 ───
            function triggerBreath() {
                breathEnergy = 1.0;
                playBreathSound();
                // 中心墨点快速闪动（通过临时修改alpha，由update处理衰减）
            }

            // ─── 主循环 ───
            app.ticker.add((delta) => {
                const dt = Math.min(delta / 60, 0.05);
                time += dt;
                frameCount++;

                const w = window.innerWidth;
                const h = window.innerHeight;
                const cx = w / 2;
                const cy = h / 2;

                // 平滑鼠标
                smoothMouseX += (mouseX - smoothMouseX) * 0.065;
                smoothMouseY += (mouseY - smoothMouseY) * 0.065;

                // 自动旋转
                autoRotateY += AUTO_ROTATE_SPEED * dt;

                const normX = (smoothMouseX / w) * 2 - 1;
                const normY = (smoothMouseY / h) * 2 - 1;
                const viewY = autoRotateY + normX * VIEW_SENSITIVITY_X;
                const viewX = normY * VIEW_SENSITIVITY_Y;

                updateParticles(dt, viewX, viewY, cx, cy);
                updateCenterInk(cx, cy);

                // FPS 显示
                if (time - fpsLastTime > 0.5) {
                    const fps = Math.round(frameCount / (time - fpsLastTime));
                    fpsBadge.textContent = fps + ' fps';
                    frameCount = 0;
                    fpsLastTime = time;
                }
            });

            // ─── 交互事件 ───
            function getCanvasCoords(e) {
                const rect = app.view.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function onPointerMove(e) {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
            }

            function onPointerDown(e) {
                e.preventDefault();
                ensureAudio();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
                triggerBreath();
            }

            function onPointerLeave() {
                mouseX = window.innerWidth / 2;
                mouseY = window.innerHeight / 2;
            }

            app.view.addEventListener('mousemove', onPointerMove);
            app.view.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mouseleave', onPointerLeave);

            app.view.addEventListener('touchmove', onPointerMove, { passive: true });
            app.view.addEventListener('touchstart', onPointerDown, { passive: false });

            // ─── 键盘交互 ───
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    ensureAudio();
                    triggerBreath();
                }
            });

            // ─── 窗口调整 ───
            function handleResize() {
                app.renderer.resize(window.innerWidth, window.innerHeight);
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(handleResize, 300);
            });

            // ─── 启动 ───
            initParticles();

            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
            smoothMouseX = mouseX;
            smoothMouseY = mouseY;

            // 隐藏提示
            setTimeout(() => {
                if (hintEl) {
                    hintEl.style.opacity = '0';
                    setTimeout(() => {
                        if (hintEl) hintEl.style.display = 'none';
                    }, 1600);
                }
            }, 3200);

            handleResize();
            console.log('✨ 墨线素描已启动 — 粒子数:', sprites.length);
        })();
    </script>
</body>
</html>
