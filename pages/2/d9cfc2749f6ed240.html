<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>谢尔宾斯基三角形分形 · 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#03040a;}
  canvas{display:block;position:fixed;inset:0;}

  .hud{
    position:fixed;pointer-events:none;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    color:#9fe8ff;
    z-index:5;
  }

  /* ---------- 左上：标题 + 公式 ---------- */
  .hud-tl{top:clamp(18px,3.2vh,42px);left:clamp(18px,3.2vw,52px);}
  .hud-tl h1{
    font-size:clamp(15px,2.1vw,28px);
    font-weight:500;
    letter-spacing:.22em;
    color:#e6fbff;
    text-shadow:0 0 10px #4ad8ff,0 0 34px #1b6bff,0 0 70px #7b2cff;
    white-space:nowrap;
  }
  .hud-tl .en{
    margin-top:.55em;
    font-size:clamp(8px,0.85vw,11px);
    letter-spacing:.42em;
    color:#5fa9cc;
    text-shadow:0 0 8px rgba(74,216,255,.6);
  }
  .rule{
    margin:1.15em 0 1.05em;
    width:clamp(120px,18vw,260px);height:1px;
    background:linear-gradient(90deg,#4ad8ff,rgba(74,216,255,0));
    box-shadow:0 0 10px #4ad8ff;
  }
  .eq{
    font-size:clamp(10px,1.1vw,14px);
    letter-spacing:.09em;
    line-height:2.05;
    color:#a7e6ff;
    text-shadow:0 0 10px rgba(74,216,255,.85);
    white-space:nowrap;
  }
  .eq .hl{color:#ff9df0;text-shadow:0 0 12px #ff4de0,0 0 30px #a416ff;}
  .eq sub,.eq sup{font-size:.72em;}

  /* ---------- 右下：参数读数 ---------- */
  .hud-br{
    right:clamp(18px,3.2vw,52px);
    bottom:clamp(16px,3vh,40px);
    text-align:right;
    font-size:clamp(9px,0.95vw,12px);
    letter-spacing:.2em;
    line-height:2;
    color:#6fc6e8;
    text-shadow:0 0 9px rgba(74,216,255,.7);
  }
  .hud-br b{color:#ffb3f4;font-weight:400;text-shadow:0 0 12px #ff4de0;}

  /* ---------- 左侧竖条装饰 ---------- */
  .hud-l{
    left:clamp(8px,1.4vw,22px);top:50%;transform:translateY(-50%);
    width:1px;height:34vh;
    background:linear-gradient(180deg,transparent,#4ad8ff,transparent);
    opacity:.5;box-shadow:0 0 12px #4ad8ff;
  }

  /* ---------- 启动提示 ---------- */
  #start{
    position:fixed;left:50%;bottom:7%;transform:translateX(-50%);
    z-index:20;cursor:pointer;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(10px,1vw,13px);letter-spacing:.3em;
    color:#a9e9ff;
    padding:11px 26px;
    border:1px solid rgba(90,220,255,.45);
    border-radius:40px;
    background:rgba(8,26,54,.42);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    text-shadow:0 0 10px #4ad8ff;
    transition:opacity .9s ease,transform .9s ease;
    animation:breathe 2.6s ease-in-out infinite;
    white-space:nowrap;
  }
  #start.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(14px);}
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 rgba(74,216,255,0);border-color:rgba(90,220,255,.3);}
    50%{box-shadow:0 0 26px rgba(74,216,255,.5),inset 0 0 18px rgba(74,216,255,.12);border-color:rgba(140,240,255,.8);}
  }

  /* ---------- 扫描线 ---------- */
  .scan{
    position:fixed;inset:0;z-index:6;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.55;
  }
  .vignette{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 50% 52%,transparent 38%,rgba(0,0,0,.62) 100%);
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="vignette"></div>
<div class="scan"></div>

<div class="hud hud-l"></div>

<div class="hud hud-tl">
  <h1>谢尔宾斯基三角形分形</h1>
  <div class="en">SIERPINSKI TRIANGLE · FRACTAL · 3D</div>
  <div class="rule"></div>
  <div class="eq">S = <span class="hl">⋃</span><sub>i=1</sub><sup>3</sup> S(△<sub>i</sub>) &nbsp;·&nbsp; 迭代函数系统 IFS</div>
  <div class="eq">D = ln 3 / ln 2 ≈ <span class="hl">1.585</span></div>
  <div class="eq">N(ε) ∝ ε<sup>−D</sup> &nbsp;·&nbsp; 自相似 · 无限细分</div>
</div>

<div class="hud hud-br">
  <div>IFS · 迭代函数系统</div>
  <div>DEPTH <b>4</b> &nbsp;|&nbsp; LAYERS <b>6</b></div>
  <div>△ 子三角形 <b>486</b></div>
  <div>DIMENSION <b>1.58496</b></div>
</div>

<div id="start">点击任意处 · 启动音效</div>

<script>
(function () {
'use strict';

/* =======================================================================
   0. 基础设置
   ======================================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, cx = 0, cy = 0, SCALE = 200, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  cx = W / 2;
  cy = H * 0.60;
  SCALE = Math.min(W, H) * 0.175;
}
window.addEventListener('resize', resize, { passive: true });
resize();

/* =======================================================================
   1. 生成谢尔宾斯基三角形（迭代函数系统）
   ======================================================================= */
const DEPTH  = 4;                 // 递归细分层数
const RAD    = 1.7;               // 外接圆半径
const SQ3    = 0.86602540378;

// 水平面 (XZ) 上的等边三角形
const V0 = { x: 0,           z:  RAD };
const V1 = { x: -SQ3 * RAD,  z: -0.5 * RAD };
const V2 = { x:  SQ3 * RAD,  z: -0.5 * RAD };

const baseTris = [];

function mid(a, b) { return { x: (a.x + b.x) * 0.5, z: (a.z + b.z) * 0.5 }; }

/**
 * 移除中央三角形，保留三个角上的子三角形 —— S = S(△) 的迭代
 */
function sierpinski(a, b, c, depth, lvl, out) {
  if (depth === 0) {
    out.push({ p0: a, p1: b, p2: c, lvl: lvl });
    return;
  }
  const ab = mid(a, b);
  const bc = mid(b, c);
  const ca = mid(c, a);

  sierpinski(a,  ab, ca, depth - 1, lvl + 1, out);
  sierpinski(ab, b,  bc, depth - 1, lvl + 1, out);
  sierpinski(ca, bc, c,  depth - 1, lvl + 1, out);
}
sierpinski(V0, V1, V2, DEPTH, 0, baseTris);

/* =======================================================================
   2. 三维层叠结构参数
   ======================================================================= */
const LAYERS = 6;
const layers = [];
for (let j = 0; j < LAYERS; j++) {
  layers.push({
    y     : j * 0.55,            // 向上堆叠高度
    rot   : j * 0.40,            // 每层自旋错位
    scale : 1 - j * 0.07,        // 越往上越小
    phase : j * 0.9,
    hue   : 175 + j * 26         // 青 → 蓝 → 紫 → 品红
  });
}

/* =======================================================================
   3. 相机 / 投影
   ======================================================================= */
const PITCH = 0.72;    // 俯仰角
const CAMD  = 9;       // 相机距离
const cosP  = Math.cos(PITCH);
const sinP  = Math.sin(PITCH);

let rotY = 0;

/* =======================================================================
   4. 背景星尘 & 梦幻光斑
   ======================================================================= */
const stars = [];
for (let i = 0; i < 170; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.5 + 0.35,
    p: Math.random() * Math.PI * 2,
    s: 0.4 + Math.random() * 1.8
  });
}

const blobs = [
  { h: 285, r: 0.58, sx: 0.30, sy: 0.34, sp:  0.13 },
  { h: 192, r: 0.52, sx: 0.72, sy: 0.48, sp: -0.11 },
  { h: 330, r: 0.46, sx: 0.50, sy: 0.72, sp:  0.17 },
  { h: 165, r: 0.44, sx: 0.14, sy: 0.66, sp: -0.09 }
];

function drawBackground(t) {
  // 深空底色
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#03040a';
  ctx.fillRect(0, 0, W, H);

  const minD = Math.min(W, H);

  // 梦幻光斑（背景光效，透过镂空处可见）
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    const x = W * (b.sx + 0.13 * Math.sin(t * b.sp * 3 + i * 1.7));
    const y = H * (b.sy + 0.11 * Math.cos(t * b.sp * 2.3 + i * 2.4));
    const r = minD * b.r * (1 + 0.16 * Math.sin(t * 0.7 + i));
    const hue = b.h + 24 * Math.sin(t * 0.31 + i);

    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0.00, 'hsla(' + hue + ',100%,64%,0.30)');
    g.addColorStop(0.42, 'hsla(' + (hue + 30) + ',100%,52%,0.115)');
    g.addColorStop(1.00, 'hsla(' + (hue + 60) + ',100%,50%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // 星尘
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const a = 0.08 + 0.34 * Math.abs(Math.sin(t * s.s + s.p));
    ctx.fillStyle = 'rgba(178,232,255,' + a.toFixed(3) + ')';
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
}

/* =======================================================================
   5. 三角形渲染
   ======================================================================= */
const triBuf = [];

function buildScene(t) {
  triBuf.length = 0;

  const cosY = Math.cos(rotY);
  const sinY = Math.sin(rotY);

  for (let j = 0; j < LAYERS; j++) {
    const L = layers[j];

    // 该层总旋转 = 全局旋转 + 层自旋错位
    const A  = rotY + L.rot;
    const ca = Math.cos(A);
    const sa = Math.sin(A);
    const s  = L.scale;

    // 层的上下浮动
    const y0 = L.y + Math.sin(t * 0.9 + L.phase) * 0.06;

    // 层次呼吸闪烁
    const breath = 0.42 + 0.58 * (0.5 + 0.5 * Math.sin(t * 1.25 - j * 0.8));

    for (let k = 0; k < baseTris.length; k++) {
      const bt = baseTris[k];
      const p0 = bt.p0, p1 = bt.p1, p2 = bt.p2;

      // --- 顶点 0 ---
      let x1 = (p0.x * ca - p0.z * sa) * s;
      let z1 = (p0.x * sa + p0.z * ca) * s;
      let y2 = y0 * cosP - z1 * sinP;
      let z2 = y0 * sinP + z1 * cosP;
      let f  = CAMD / (CAMD - z2);
      const ax = cx + x1 * f * SCALE, ay = cy - y2 * f * SCALE;
      let zs = z2;

      // --- 顶点 1 ---
      x1 = (p1.x * ca - p1.z * sa) * s;
      z1 = (p1.x * sa + p1.z * ca) * s;
      y2 = y0 * cosP - z1 * sinP;
      z2 = y0 * sinP + z1 * cosP;
      f  = CAMD / (CAMD - z2);
      const bx = cx + x1 * f * SCALE, by = cy - y2 * f * SCALE;
      zs += z2;

      // --- 顶点 2 ---
      x1 = (p2.x * ca - p2.z * sa) * s;
      z1 = (p2.x * sa + p2.z * ca) * s;
      y2 = y0 * cosP - z1 * sinP;
      z2 = y0 * sinP + z1 * cosP;
      f  = CAMD / (CAMD - z2);
      const ccx = cx + x1 * f * SCALE, ccy = cy - y2 * f * SCALE;
      zs += z2;

      triBuf.push({
        ax: ax, ay: ay,
        bx: bx, by: by,
        cx: ccx, cy: ccy,
        z: zs * 0.3333,
        hue: L.hue + bt.lvl * 14,
        b: breath,
        lvl: bt.lvl
      });
    }
  }

  // 画家算法：远 → 近
  triBuf.sort(function (a, b) { return a.z - b.z; });
}

function drawFractal() {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';

  for (let i = 0; i < triBuf.length; i++) {
    const T = triBuf[i];
    const a = T.b;

    ctx.beginPath();
    ctx.moveTo(T.ax, T.ay);
    ctx.lineTo(T.bx, T.by);
    ctx.lineTo(T.cx, T.cy);
    ctx.closePath();

    // 半透明流光填充
    ctx.fillStyle = 'hsla(' + T.hue + ',96%,60%,' + (0.040 * a).toFixed(4) + ')';
    ctx.fill();

    // 发光描边（镂空轮廓）
    ctx.strokeStyle = 'hsla(' + T.hue + ',100%,' + (68 + T.lvl * 3) + '%,' + (0.26 * a).toFixed(4) + ')';
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }
}

/* =======================================================================
   6. 主循环
   ======================================================================= */
function render(now) {
  const t = now * 0.001;
  rotY = t * 0.20;

  drawBackground(t);
  buildScene(t);
  drawFractal();

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* =======================================================================
   7. 科技感背景音效（Web Audio）
   ======================================================================= */
let actx = null;

function initAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  actx = new AC();

  /* ---- 主输出 ---- */
  const master = actx.createGain();
  master.gain.value = 0.0001;
  master.connect(actx.destination);
  master.gain.exponentialRampToValueAtTime(0.45, actx.currentTime + 4);

  /* ---- 反馈延迟（太空感回声） ---- */
  const dly = actx.createDelay(1.0);
  dly.delayTime.value = 0.42;
  const fb = actx.createGain(); fb.gain.value = 0.44;
  const dlyOut = actx.createGain(); dlyOut.gain.value = 0.34;
  dly.connect(fb); fb.connect(dly);
  dly.connect(dlyOut); dlyOut.connect(master);

  /* ---- 低频氛围 Pad ---- */
  const padFilter = actx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 620;
  padFilter.Q.value = 4.5;

  const padGain = actx.createGain();
  padGain.gain.value = 0.14;
  padFilter.connect(padGain);
  padGain.connect(master);

  const chord = [55, 82.41, 110, 164.81, 220, 329.63];
  for (let i = 0; i < chord.length; i++) {
    const o = actx.createOscillator();
    o.type = (i % 2) ? 'sawtooth' : 'sine';
    o.frequency.value = chord[i] * (1 + (i % 2 ? 0.0045 : -0.0035));
    const g = actx.createGain();
    g.gain.value = 0.34 / (i + 1);
    o.connect(g); g.connect(padFilter);
    o.start();
  }

  // 滤波器慢速扫描
  const lfo = actx.createOscillator();
  lfo.frequency.value = 0.045;
  const lfoG = actx.createGain();
  lfoG.gain.value = 380;
  lfo.connect(lfoG); lfoG.connect(padFilter.frequency);
  lfo.start();

  /* ---- 空气噪声层 ---- */
  const bufLen = Math.floor(actx.sampleRate * 2);
  const nBuf = actx.createBuffer(1, bufLen, actx.sampleRate);
  const nData = nBuf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) nData[i] = (Math.random() * 2 - 1) * 0.5;

  const noise = actx.createBufferSource();
  noise.buffer = nBuf; noise.loop = true;

  const nFilter = actx.createBiquadFilter();
  nFilter.type = 'bandpass';
  nFilter.frequency.value = 880;
  nFilter.Q.value = 0.85;

  const nGain = actx.createGain();
  nGain.gain.value = 0.016;

  noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(master);
  noise.start();

  const nLfo = actx.createOscillator();
  nLfo.frequency.value = 0.07;
  const nLfoG = actx.createGain();
  nLfoG.gain.value = 520;
  nLfo.connect(nLfoG); nLfoG.connect(nFilter.frequency);
  nLfo.start();

  /* ---- 数字粒子音（琶音） ---- */
  const scale = [0, 2, 3, 5, 7, 10, 12, 14, 15, 19, 22, 24];
  let step = 0;

  function blip() {
    if (!actx) return;
    const now = actx.currentTime;
    const deg = scale[(step * 5 + Math.floor(Math.random() * 3)) % scale.length];
    const oct = Math.random() < 0.32 ? 2 : 1;
    const f = 220 * Math.pow(2, deg / 12) * oct;

    const o = actx.createOscillator();
    o.type = Math.random() < 0.5 ? 'triangle' : 'sine';
    o.frequency.setValueAtTime(f, now);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.085, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.7);

    o.connect(g);
    g.connect(master);
    g.connect(dly);

    o.start(now);
    o.stop(now + 1.8);
    step++;
  }

  setInterval(function () {
    if (Math.random() < 0.78) blip();
  }, 330);

  /* ---- 深空脉冲 ---- */
  setInterval(function () {
    if (!actx) return;
    const now = actx.currentTime;
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, now);
    o.frequency.exponentialRampToValueAtTime(38, now + 2.2);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.22, now + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
    o.connect(g); g.connect(master); g.connect(dly);
    o.start(now); o.stop(now + 2.5);
  }, 7800);
}

/* ---- 启动交互 ---- */
const startEl = document.getElementById('start');
let started = false;

function startAll() {
  if (started) return;
  started = true;
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  startEl.classList.add('hide');
}

window.addEventListener('pointerdown', startAll, { passive: true });
window.addEventListener('keydown', startAll);
window.addEventListener('touchstart', startAll, { passive: true });

})();
</script>
</body>
</html>
