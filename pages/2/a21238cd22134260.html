<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>三维驻波干涉场 · 3D Standing Wave Interference Field</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(ellipse at 50% 42%, #131648 0%, #070920 42%, #010106 100%);
    font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#cfe4ff;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #c{position:fixed;inset:0;display:block;touch-action:none;}

  .ui{position:fixed;z-index:10;pointer-events:none;opacity:0;animation:fadeUp 1.8s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  /* ---------- 标题 ---------- */
  .title-panel{top:30px;left:34px;animation-delay:.15s;}
  .title-panel h1{
    font-size:27px;font-weight:600;letter-spacing:8px;
    background:linear-gradient(95deg,#fff3c4 0%,#ffc93c 38%,#6fe3ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,190,60,.42));
  }
  .title-panel .en{
    margin-top:8px;font-size:10.5px;letter-spacing:4.4px;
    color:#5fb8dd;opacity:.85;
  }
  .title-panel .line{
    margin-top:14px;width:210px;height:1px;
    background:linear-gradient(90deg,rgba(255,200,80,.9),rgba(80,200,255,.5),transparent);
  }
  .title-panel .desc{
    margin-top:12px;font-size:11.5px;letter-spacing:2px;color:#7e9ec4;
  }

  /* ---------- 公式面板 ---------- */
  .formula-panel{
    left:34px;bottom:34px;padding:18px 22px 16px 22px;
    background:linear-gradient(135deg,rgba(16,28,64,.62),rgba(8,12,32,.42));
    border:1px solid rgba(90,170,255,.22);
    border-left:2px solid rgba(255,200,80,.75);
    border-radius:4px 12px 12px 4px;
    backdrop-filter:blur(9px);
    box-shadow:0 8px 40px rgba(0,20,60,.55),inset 0 0 40px rgba(60,120,255,.06);
    animation-delay:.45s;
    max-width:min(560px,72vw);
  }
  .f-title{font-size:11px;letter-spacing:3px;color:#ffcf5a;margin-bottom:12px;}
  .f-main{
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    font-size:16.5px;letter-spacing:.6px;color:#dff0ff;
    text-shadow:0 0 16px rgba(110,200,255,.45);
    margin-bottom:5px;
  }
  .f-main + .f-main{margin-top:11px;}
  .f-sub{
    font-size:11px;letter-spacing:1.1px;color:#77a6cf;margin-bottom:2px;
  }
  .formula-panel sub{font-size:.68em;}

  /* ---------- 控制面板 ---------- */
  .ctrl-panel{right:34px;bottom:34px;width:190px;animation-delay:.7s;}
  .ctrl-panel button{
    pointer-events:auto;display:block;width:100%;margin-bottom:10px;
    padding:10px 16px;font-family:inherit;font-size:12.5px;letter-spacing:2px;
    color:#a9d6ff;background:rgba(20,42,84,.38);
    border:1px solid rgba(90,180,255,.32);border-radius:7px;
    cursor:pointer;backdrop-filter:blur(7px);
    transition:all .25s ease;
  }
  .ctrl-panel button:hover{
    background:rgba(38,88,164,.55);border-color:rgba(150,225,255,.85);
    color:#fff;box-shadow:0 0 20px rgba(80,180,255,.5);transform:translateX(-2px);
  }
  .ctrl-panel button.on{
    color:#ffd24a;border-color:rgba(255,200,80,.72);
    box-shadow:0 0 20px rgba(255,190,60,.42);
  }
  .ctrl-panel .hint{
    margin-top:14px;font-size:10px;letter-spacing:1.6px;color:#5b7ba0;text-align:right;
  }

  @media (max-width:760px){
    .title-panel{top:18px;left:18px;}
    .title-panel h1{font-size:19px;letter-spacing:5px;}
    .title-panel .desc{display:none;}
    .formula-panel{left:14px;right:14px;bottom:110px;max-width:none;padding:14px 16px;}
    .f-main{font-size:13.5px;}
    .f-sub{font-size:10px;}
    .ctrl-panel{right:14px;left:14px;bottom:16px;width:auto;display:flex;gap:8px;}
    .ctrl-panel button{margin:0;padding:9px 6px;font-size:11px;letter-spacing:1px;}
    .ctrl-panel .hint{display:none;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui title-panel">
  <h1>三维驻波干涉场</h1>
  <div class="en">3D STANDING WAVE INTERFERENCE FIELD</div>
  <div class="line"></div>
  <div class="desc">方形液面 · 多方向正弦驻波叠加 · 网格状起伏地貌</div>
</div>

<div class="ui formula-panel">
  <div class="f-title">◈ 数 学 原 理</div>
  <div class="f-main">y(x, t) = A · sin(kx) · cos(ωt)</div>
  <div class="f-sub">节点 x = n·λ/2 固定不动 ｜ 腹点振幅 2A ｜ 反向行波叠加 A(2cos kx · sin ωt)</div>
  <div class="f-main">z(x, y, t) = Σ A<sub>mn</sub> · sin(mπx/L) · sin(nπy/L) · cos(ω<sub>mn</sub>t)</div>
  <div class="f-sub">ω<sub>mn</sub> = c·π·√(m² + n²) / L ｜ 11 个本征模式叠加</div>
</div>

<div class="ui ctrl-panel">
  <button id="audioBtn">◈ 开启音效</button>
  <button id="flipBtn">⇅ 翻转视角</button>
  <button id="pauseBtn">⏸ 暂停波动</button>
  <div class="hint">拖拽旋转 · 滚轮缩放</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   1. 物理参数：方膜本征模式
   ========================================================= */
const SIZE = 22;              // 面板边长（世界单位）
const HALF = SIZE / 2;
const SEG  = 160;             // 曲面细分
const SPEED = 1.35;           // 时间频率系数

// 各本征模式 (m, n) 及其权重 —— 对应 sin(mπx/L)·sin(nπy/L)·cos(ω_mn t)
const MODES = [
  { m:1, n:1, amp:1.00 },
  { m:2, n:1, amp:0.62 },
  { m:1, n:2, amp:0.62 },
  { m:2, n:2, amp:0.42 },
  { m:3, n:1, amp:0.34 },
  { m:1, n:3, amp:0.34 },
  { m:3, n:2, amp:0.28 },
  { m:2, n:3, amp:0.28 },
  { m:3, n:3, amp:0.20 },
  { m:4, n:1, amp:0.16 },
  { m:1, n:4, amp:0.16 },
];
const AMP_SUM = MODES.reduce((s, x) => s + x.amp, 0);

/* =========================================================
   2. 着色器生成 —— 波函数直接在 GPU 顶点着色器中求值
   ========================================================= */
const modeGLSL = MODES.map(M => {
  const w  = (Math.sqrt(M.m * M.m + M.n * M.n) * SPEED).toFixed(5);
  const kx = (M.m * Math.PI).toFixed(6);
  const ky = (M.n * Math.PI).toFixed(6);
  return `  h += ${M.amp.toFixed(3)} * sin(${kx} * uv.x) * sin(${ky} * uv.y) * cos(${w} * uTime);`;
}).join('\n');

const VERT_COMMON = `
uniform float uTime;
uniform float uAmp;
uniform float uOffset;
varying float vH;

float waveH(vec2 xy){
  vec2 uv = xy / ${HALF.toFixed(1)};
  float h = 0.0;
${modeGLSL}
  h *= ${(1 / AMP_SUM).toFixed(6)};
  return h * uAmp;
}

vec3 waveNormal(vec2 xy){
  float e = 0.05;
  float hL = waveH(xy - vec2(e, 0.0));
  float hR = waveH(xy + vec2(e, 0.0));
  float hD = waveH(xy - vec2(0.0, e));
  float hU = waveH(xy + vec2(0.0, e));
  return normalize(vec3(-(hR - hL), 2.0 * e, -(hU - hD)));
}
`;

const FRAG_COMMON = `
varying float vH;
uniform float uColored;

vec3 wavePalette(float t){
  t = clamp(t, 0.0, 1.0);
  vec3 c = mix(vec3(0.045,0.015,0.115), vec3(0.170,0.065,0.450), smoothstep(0.00,0.22,t));
  c = mix(c, vec3(0.075,0.300,0.900), smoothstep(0.22,0.44,t));
  c = mix(c, vec3(0.130,0.850,0.980), smoothstep(0.44,0.62,t));
  c = mix(c, vec3(1.000,0.720,0.140), smoothstep(0.62,0.82,t));
  c = mix(c, vec3(1.000,0.970,0.820), smoothstep(0.82,1.00,t));
  return c;
}
`;

const uniforms = {
  uTime: { value: 0 },
  uAmp:  { value: 1.75 },
};

function injectWave(material, { offset = 0, colored = true } = {}) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime    = uniforms.uTime;
    shader.uniforms.uAmp     = uniforms.uAmp;
    shader.uniforms.uOffset  = { value: offset };
    shader.uniforms.uColored = { value: colored ? 1.0 : 0.0 };

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + VERT_COMMON)
      .replace('#include <beginnormal_vertex>',
               'vec3 objectNormal = waveNormal(position.xz);')
      .replace('#include <begin_vertex>', `
        vec3 transformed = vec3( position );
        float hNow = waveH(position.xz);
        transformed.y += hNow + uOffset;
        vH = hNow / max(uAmp, 0.0001);
      `);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\n' + FRAG_COMMON)
      .replace('#include <color_fragment>', `
        #include <color_fragment>
        float tCol = clamp(vH * 0.5 + 0.5, 0.0, 1.0);
        tCol = clamp((tCol - 0.5) * 1.55 + 0.5, 0.0, 1.0);
        vec3 wCol = mix(vec3(0.45, 0.85, 1.0), wavePalette(tCol), uColored);
        diffuseColor.rgb *= wCol;
        totalEmissiveRadiance += wCol * pow(tCol, 3.0) * 0.9 * uColored;
        totalEmissiveRadiance += vec3(0.02, 0.05, 0.12) * (1.0 - uColored);
      `);
  };
  return material;
}

/* =========================================================
   3. 场景 / 渲染器 / 相机
   ========================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, alpha: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);

/* ---------- 环境贴图（金属反射用的自绘天光） ---------- */
function makeEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, '#2b3070');
  g.addColorStop(0.34, '#0d1030');
  g.addColorStop(0.52, '#1a1038');
  g.addColorStop(1.00, '#02020a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 512);

  const blobs = [
    [200, 110, 190, 'rgba(255,190,80,0.62)'],
    [770, 150, 230, 'rgba(120,90,255,0.50)'],
    [520,  55, 160, 'rgba(90,220,255,0.38)'],
    [880, 400, 210, 'rgba(255,220,140,0.28)'],
    [ 80, 380, 180, 'rgba(70,120,255,0.28)'],
  ];
  blobs.forEach(([x, y, r, col]) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, col);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  });

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envSrc = makeEnvTexture();
scene.environment = pmrem.fromEquirectangular(envSrc).texture;
envSrc.dispose();
pmrem.dispose();

/* ---------- 灯光 ---------- */
scene.add(new THREE.AmbientLight(0x4a6fb0, 1.1));

const keyLight = new THREE.DirectionalLight(0xfff2d6, 2.4);
keyLight.position.set(12, 22, 9);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x5577ff, 1.5);
fillLight.position.set(-15, 9, -11);
scene.add(fillLight);

const goldLight = new THREE.PointLight(0xffb040, 190, 70, 2);
goldLight.position.set(-9, 6, -7);
scene.add(goldLight);

const violetLight = new THREE.PointLight(0x7a45ff, 190, 70, 2);
violetLight.position.set(10, 5, 8);
scene.add(violetLight);

/* =========================================================
   4. 液面网格 + 网格线覆盖层
   ========================================================= */
const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
geo.rotateX(-Math.PI / 2);

const surfMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  metalness: 0.42,
  roughness: 0.20,
  side: THREE.DoubleSide,
  envMapIntensity: 1.6,
});
injectWave(surfMat, { offset: 0, colored: true });
const surface = new THREE.Mesh(geo, surfMat);
scene.add(surface);

// 网格线覆盖层（低分辨率线框，紧贴曲面）
const wireGeo = new THREE.PlaneGeometry(SIZE, SIZE, 56, 56);
wireGeo.rotateX(-Math.PI / 2);

const wireMat = new THREE.MeshStandardMaterial({
  color: 0x6fe6ff,
  emissive: 0x0d3550,
  wireframe: true,
  transparent: true,
  opacity: 0.22,
  depthWrite: false,
  metalness: 0.0,
  roughness: 1.0,
  side: THREE.DoubleSide,
});
injectWave(wireMat, { offset: 0.035, colored: false });
const wireMesh = new THREE.Mesh(wireGeo, wireMat);
scene.add(wireMesh);

/* =========================================================
   5. 相机轨道控制
   ========================================================= */
const orbit = {
  theta: 0.6,
  phi: 1.05,
  targetPhi: 1.05,
  radius: 34,
  targetRadius: 34,
  autoSpeed: 0.115,
};

let dragging = false;
let lastX = 0, lastY = 0;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;

  orbit.theta -= dx * 0.005;
  orbit.targetPhi = THREE.MathUtils.clamp(
    orbit.targetPhi - dy * 0.005, 0.16, Math.PI - 0.16
  );
});
canvas.addEventListener('pointerup', (e) => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointercancel', () => { dragging = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  orbit.targetRadius = THREE.MathUtils.clamp(
    orbit.targetRadius + e.deltaY * 0.022, 14, 72
  );
}, { passive: false });

/* =========================================================
   6. 界面交互
   ========================================================= */
const audioBtn = document.getElementById('audioBtn');
const flipBtn  = document.getElementById('flipBtn');
const pauseBtn = document.getElementById('pauseBtn');

let paused = false;

pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶ 继续波动' : '⏸ 暂停波动';
  pauseBtn.classList.toggle('on', paused);
});

flipBtn.addEventListener('click', () => {
  orbit.targetPhi = Math.PI - orbit.targetPhi;
  flipBtn.classList.toggle('on');
});

/* =========================================================
   7. 程序化科技音效（Web Audio）
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let bellTimer = null;

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();

  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);

  // 反馈延迟，制造空间感
  const delay = audioCtx.createDelay(1.2);
  delay.delayTime.value = 0.44;
  const fb = audioCtx.createGain();
  fb.gain.value = 0.44;
  const wet = audioCtx.createGain();
  wet.gain.value = 0.42;
  delay.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(masterGain);

  // 低通滤波 + 慢速扫频
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 680;
  lp.Q.value = 4.5;
  lp.connect(masterGain);
  lp.connect(delay);

  // 低频 drone
  [55, 82.41, 110, 138.59, 164.81, 220].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = i < 2 ? 'sawtooth' : 'sine';
    osc.frequency.value = f;
    osc.detune.value = (Math.random() - 0.5) * 14;

    const g = audioCtx.createGain();
    g.gain.value = (i < 2 ? 0.05 : 0.085) / (1 + i * 0.6);
    osc.connect(g);
    g.connect(lp);
    osc.start();

    // 微失谐漂移
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.03 + Math.random() * 0.12;
    const lg = audioCtx.createGain();
    lg.gain.value = 3 + Math.random() * 5;
    lfo.connect(lg);
    lg.connect(osc.detune);
    lfo.start();
  });

  // 滤波器扫频
  const flfo = audioCtx.createOscillator();
  flfo.frequency.value = 0.055;
  const flg = audioCtx.createGain();
  flg.gain.value = 380;
  flfo.connect(flg);
  flg.connect(lp.frequency);
  flfo.start();

  // 淡入
  masterGain.gain.exponentialRampToValueAtTime(
    0.17, audioCtx.currentTime + 4
  );

  bellTimer = setInterval(playBell, 3000);
}

function playBell() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66];
  const f = scale[Math.floor(Math.random() * scale.length)];

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = f;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.34, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);

  osc.connect(g);
  g.connect(masterGain);
  osc.start(t);
  osc.stop(t + 3.15);
}

audioBtn.addEventListener('click', async () => {
  if (!audioCtx) {
    initAudio();
    audioBtn.textContent = '◈ 关闭音效';
    audioBtn.classList.add('on');
    return;
  }
  if (audioCtx.state === 'running') {
    await audioCtx.suspend();
    audioBtn.textContent = '◈ 开启音效';
    audioBtn.classList.remove('on');
  } else {
    await audioCtx.resume();
    audioBtn.textContent = '◈ 关闭音效';
    audioBtn.classList.add('on');
  }
});

/* =========================================================
   8. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let elapsed = 0;

function updateCamera(dt) {
  if (!dragging) orbit.theta += dt * orbit.autoSpeed;

  const k = Math.min(1, dt * 3.2);
  orbit.phi    += (orbit.targetPhi    - orbit.phi)    * k;
  orbit.radius += (orbit.targetRadius - orbit.radius) * k;

  const sp = Math.sin(orbit.phi);
  const cp = Math.cos(orbit.phi);

  camera.position.set(
    orbit.radius * sp * Math.cos(orbit.theta),
    orbit.radius * cp,
    orbit.radius * sp * Math.sin(orbit.theta)
  );
  camera.lookAt(0, 0, 0);
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) elapsed += dt;

  uniforms.uTime.value = elapsed;

  // 光源轻微游走，让金色高光更活
  goldLight.position.x = -9 + Math.sin(elapsed * 0.31) * 3.2;
  goldLight.position.z = -7 + Math.cos(elapsed * 0.24) * 3.2;
  violetLight.position.x = 10 + Math.cos(elapsed * 0.27) * 3.0;
  violetLight.position.z =  8 + Math.sin(elapsed * 0.35) * 3.0;

  updateCamera(dt);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
