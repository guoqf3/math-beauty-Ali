<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>星轨漩涡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="starTrailCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('starTrailCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                particleCount: 180,          // 星尘粒子数量
                maxParticles: 260,           // 最大粒子数
                baseSpeed: 0.4,              // 基础速度
                orbitSpeed: 0.0008,          // 绕中心旋转速度
                attractRadius: 250,          // 鼠标吸引半径
                attractStrength: 0.018,      // 吸引强度
                returnForce: 0.008,          // 回弹力
                damping: 0.94,               // 阻尼
                clickRepelRadius: 280,       // 点击排斥半径
                clickRepelStrength: 20,      // 排斥强度
                randomForce: 0.05,           // 随机扰动
                backgroundFade: 0.12,        // 拖尾强度
                // 颜色：蓝、紫、青、白
                colorPalette: [
                    { r: 150, g: 180, b: 255 },  // 淡蓝
                    { r: 180, g: 140, b: 255 },  // 淡紫
                    { r: 120, g: 220, b: 255 },  // 青
                    { r: 220, g: 220, b: 255 },  // 白
                    { r: 100, g: 160, b: 255 },  // 蓝
                ],
                trailFade: 0.06,             // 星轨拖尾衰减
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let particles = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let centerX = 0;
            let centerY = 0;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // ---------- 粒子类 ----------
            class StarParticle {
                constructor(w, h) {
                    // 初始位置（环绕中心分布）
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * Math.min(w, h) * 0.45;
                    this.homeX = w / 2 + Math.cos(angle) * radius;
                    this.homeY = h / 2 + Math.sin(angle) * radius;
                    this.x = this.homeX;
                    this.y = this.homeY;
                    this.vx = 0;
                    this.vy = 0;
                    // 绕中心旋转的角速度
                    this.orbitAngle = angle;
                    this.orbitRadius = radius;
                    this.orbitSpeed = CONFIG.orbitSpeed * (0.5 + Math.random() * 0.8);
                    // 颜色
                    const palette = CONFIG.colorPalette[Math.floor(Math.random() * CONFIG.colorPalette.length)];
                    this.color = palette;
                    // 大小
                    this.size = Math.random() * 2.5 + 0.8;
                    // 脉冲
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 1.2 + 0.3;
                    // 透明度
                    this.alpha = 0.6 + Math.random() * 0.4;
                }

                update(dt, now, time) {
                    // 更新轨道角度（绕中心旋转）
                    this.orbitAngle += this.orbitSpeed * dt * 2;
                    this.orbitRadius += (Math.random() - 0.5) * 0.3;

                    // 计算新的轨道位置（作为home位置）
                    this.homeX = centerX + Math.cos(this.orbitAngle) * this.orbitRadius;
                    this.homeY = centerY + Math.sin(this.orbitAngle) * this.orbitRadius;

                    // 鼠标吸引
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = smoothMouseX - this.x;
                        const dy = smoothMouseY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.attractRadius && dist > 0.1) {
                            const force = (CONFIG.attractRadius - dist) / CONFIG.attractRadius * CONFIG.attractStrength;
                            this.vx += (dx / dist) * force * dt;
                            this.vy += (dy / dist) * force * dt;
                        }
                    }

                    // 回弹力（向home位置）
                    const returnDx = this.homeX - this.x;
                    const returnDy = this.homeY - this.y;
                    this.vx += returnDx * CONFIG.returnForce * dt;
                    this.vy += returnDy * CONFIG.returnForce * dt;

                    // 随机扰动
                    this.vx += (Math.random() - 0.5) * CONFIG.randomForce * dt;
                    this.vy += (Math.random() - 0.5) * CONFIG.randomForce * dt;

                    // 阻尼
                    this.vx *= CONFIG.damping;
                    this.vy *= CONFIG.damping;

                    // 更新位置
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界处理（软回弹）
                    const margin = 60;
                    if (this.x < -margin) { this.x = -margin; this.vx = Math.abs(this.vx) * 0.5; }
                    if (this.x > width + margin) { this.x = width + margin; this.vx = -Math.abs(this.vx) * 0.5; }
                    if (this.y < -margin) { this.y = -margin; this.vy = Math.abs(this.vy) * 0.5; }
                    if (this.y > height + margin) { this.y = height + margin; this.vy = -Math.abs(this.vy) * 0.5; }
                }

                // 获取当前透明度（带脉冲）
                getAlpha() {
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 0.2;
                    return Math.max(0.2, Math.min(1, this.alpha + pulse));
                }

                // 获取当前大小
                getSize() {
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 0.4;
                    return Math.max(0.5, this.size + pulse);
                }
            }

            // ---------- 初始化粒子 ----------
            function initParticles() {
                particles = [];
                centerX = width / 2;
                centerY = height / 2;
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    particles.push(new StarParticle(width, height));
                }
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, 0, width, height);
                initParticles();
                drawScene(performance.now());
            }

            // ---------- 绘制场景 ----------
            function drawScene(now) {
                // 半透明背景覆盖，形成星轨拖尾
                ctx.fillStyle = 'rgba(5, 5, 16, ' + CONFIG.backgroundFade + ')';
                ctx.fillRect(0, 0, width, height);

                // 开启混合模式让星光叠加
                ctx.globalCompositeOperation = 'lighter';

                // 平滑鼠标位置
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.18;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.18;
                }

                // 绘制鼠标光晕
                if (mouseActive && smoothMouseX > -1000) {
                    const glowRadius = 100;
                    const grad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY,
                        glowRadius);
                    grad.addColorStop(0, 'rgba(140, 170, 255, 0.1)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制所有粒子
                for (const particle of particles) {
                    const alpha = particle.getAlpha();
                    const size = particle.getSize();
                    const { r, g, b } = particle.color;

                    // 星轨光晕
                    const glowRadius = size * 3.5;
                    const glowGrad = ctx.createRadialGradient(particle.x, particle.y, 0, particle.x, particle.y,
                        glowRadius);
                    glowGrad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.45})`);
                    glowGrad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${alpha * 0.2})`);
                    glowGrad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, glowRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心星点
                    ctx.fillStyle = `rgba(${r + 30}, ${g + 30}, ${b + 30}, ${alpha * 0.9})`;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, size, 0, Math.PI * 2);
                    ctx.fill();

                    // 十字光芒（仅较大粒子）
                    if (size > 1.8) {
                        const sparkLen = size * 4;
                        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particle.x - sparkLen, particle.y);
                        ctx.lineTo(particle.x + sparkLen, particle.y);
                        ctx.moveTo(particle.x, particle.y - sparkLen);
                        ctx.lineTo(particle.x, particle.y + sparkLen);
                        ctx.stroke();
                    }
                }

                // 绘制中心微光
                const centerGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
                centerGlow.addColorStop(0, 'rgba(100, 120, 200, 0.06)');
                centerGlow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = centerGlow;
                ctx.beginPath();
                ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
                ctx.fill();

                // 恢复混合模式
                ctx.globalCompositeOperation = 'source-over';
            }

            // ---------- 更新粒子 ----------
            function updateParticles(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                for (const particle of particles) {
                    particle.update(dt, now, time);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updateParticles(now);
                drawScene(now);

                animationId = requestAnimationFrame(animate);
            }

            // ---------- 交互事件 ----------
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function handleClick(clientX, clientY) {
                // 对每个粒子施加向外排斥力
                for (const particle of particles) {
                    const dx = particle.x - clientX;
                    const dy = particle.y - clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.clickRepelRadius && dist > 0.01) {
                        const force = (1 - dist / CONFIG.clickRepelRadius) * CONFIG.clickRepelStrength;
                        particle.vx += (dx / dist) * force;
                        particle.vy += (dy / dist) * force;
                    }
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__starTrail = {
                config: CONFIG,
                particles: particles,
            };
        })();
    </script>
</body>
</html>
