<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clifford平行线 · 球面等距编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Clifford平行线 · 球面等距编织</h2>
        <div class="sub">Clifford parallels in S³ · Equidistant great circles · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">Γ₁: q(t)=e^{it/2}·q₀, 左平移</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">Γ₂: q(t)=q₀·e^{jt/2}, 右平移</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">Γ₃: q(t)=e^{it/4}·q₀·e^{kt/4}, 双平移</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.2, 2.2, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 2.55;
        const PROJ_W = 2.35;
        const CURVE_STEPS = 420;
        const SEED_COUNT = 38;

        // 球极投影 S³→R³
        function stereographic(x1, x2, x3, x4) {
            const denom = PROJ_W - x4;
            if (Math.abs(denom) < 0.022) return null;
            const f = SCALE / denom;
            const pt = new THREE.Vector3(x1 * f, x2 * f, x3 * f);
            return pt.length() < 9.5 ? pt : null;
        }

        // Fibonacci球面点
        function fibSphereSeeds(n) {
            const seeds = [];
            const phi = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < n; i++) {
                const y = 1 - (2 * i + 1) / n;
                const rAtY = Math.sqrt(1 - y * y);
                const theta = phi * i;
                const q = new THREE.Quaternion(
                    rAtY * Math.cos(theta),
                    rAtY * Math.sin(theta),
                    y,
                    0
                ).normalize();
                seeds.push(q);
            }
            return seeds;
        }

        function createCliffordCurve(seedQ, axisQ, isLeft, isDual, steps) {
            const pts3D = [];
            const dt = 4 * Math.PI / steps;
            for (let i = 0; i <= steps; i++) {
                const t = -2 * Math.PI + i * dt;
                let q;
                if (isDual) {
                    const rotL = new THREE.Quaternion(
                        Math.cos(t * 0.5),
                        axisQ.x * Math.sin(t * 0.5),
                        0, 0
                    );
                    const rotR = new THREE.Quaternion(
                        Math.cos(t * 0.5),
                        0, 0,
                        axisQ.z * Math.sin(t * 0.5)
                    );
                    q = rotL.clone().multiply(seedQ).multiply(rotR);
                } else if (isLeft) {
                    const rot = new THREE.Quaternion(
                        Math.cos(t * 0.5),
                        axisQ.x * Math.sin(t * 0.5),
                        axisQ.y * Math.sin(t * 0.5),
                        axisQ.z * Math.sin(t * 0.5)
                    );
                    q = rot.clone().multiply(seedQ);
                } else {
                    const rot = new THREE.Quaternion(
                        Math.cos(t * 0.5),
                        axisQ.x * Math.sin(t * 0.5),
                        axisQ.y * Math.sin(t * 0.5),
                        axisQ.z * Math.sin(t * 0.5)
                    );
                    q = seedQ.clone().multiply(rot);
                }
                const sp = stereographic(q.x, q.y, q.z, q.w);
                if (sp) pts3D.push(sp);
            }
            return pts3D;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'clifford-parallels';
        scene.add(rootGroup);

        const seeds = fibSphereSeeds(SEED_COUNT);
        const axisI = new THREE.Vector3(1, 0, 0);
        const axisJ = new THREE.Vector3(0, 1, 0);
        const axisK = new THREE.Vector3(0, 0, 1);

        // 金色族：左平移（绕i轴）
        seeds.forEach(q0 => {
            const pts = createCliffordCurve(q0, axisI, true, false, CURVE_STEPS);
            if (pts.length >= 2) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: COLOR_GOLD, transparent: true, opacity: 0.55, depthWrite: true, depthTest: true });
                rootGroup.add(new THREE.Line(geom, mat));
            }
        });

        // 青色族：右平移（绕j轴）
        seeds.forEach(q0 => {
            const pts = createCliffordCurve(q0, axisJ, false, false, CURVE_STEPS);
            if (pts.length >= 2) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: COLOR_CYAN, transparent: true, opacity: 0.55, depthWrite: true, depthTest: true });
                rootGroup.add(new THREE.Line(geom, mat));
            }
        });

        // 品红族：双平移（同时左乘i和右乘k）
        seeds.forEach(q0 => {
            const pts = createCliffordCurve(q0, axisK, false, true, CURVE_STEPS);
            if (pts.length >= 2) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: COLOR_MAGENTA, transparent: true, opacity: 0.52, depthWrite: true, depthTest: true });
                rootGroup.add(new THREE.Line(geom, mat));
            }
        });

        // 额外稀疏层
        const extraSeeds = fibSphereSeeds(16);
        extraSeeds.forEach(q0 => {
            const pts = createCliffordCurve(q0, new THREE.Vector3(0.6, 0.8, 0), true, false, CURVE_STEPS);
            if (pts.length >= 2) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: COLOR_GOLD, transparent: true, opacity: 0.32, depthWrite: true, depthTest: true });
                rootGroup.add(new THREE.Line(geom, mat));
            }
        });
        extraSeeds.forEach(q0 => {
            const pts = createCliffordCurve(q0, new THREE.Vector3(0, 0.7, 0.7), false, false, CURVE_STEPS);
            if (pts.length >= 2) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: COLOR_CYAN, transparent: true, opacity: 0.32, depthWrite: true, depthTest: true });
                rootGroup.add(new THREE.Line(geom, mat));
            }
        });

        console.log('Clifford平行线编织总数:', rootGroup.children.length);

        // 辅助球面参考网格
        const refR = SCALE * 1.08;
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = refR * Math.sin(lat);
            const z = refR * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 220; j++) {
                const phi = j * 2 * Math.PI / 220;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 220; j++) {
                const theta = 0.02 + j * Math.PI / 220;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(refR * st * Math.cos(phi), refR * Math.cos(theta), refR * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const sc = 500;
        const sp = new Float32Array(sc * 3);
        for (let i = 0; i < sc; i++) {
            const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), d = 6.5 + Math.random() * 10;
            sp[i * 3] = d * Math.sin(ph) * Math.cos(th);
            sp[i * 3 + 1] = d * Math.sin(ph) * Math.sin(th);
            sp[i * 3 + 2] = d * Math.cos(ph);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(sp, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({ color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false })));
        scene.add(starsGroup);

        // 稳定动画循环
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.23;
            rootGroup.rotation.z = t * 0.09;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;
            const cr = 7.3, ca = t * 0.08, ch = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }, 120));
        console.log('✅ Clifford平行线球极投影编织动画已稳定运行');
    </script>
</body>
</html>
