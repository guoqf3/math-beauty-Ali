<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>牛顿第二定律 · 碰撞</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:24px 32px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,255,.36);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 40%,#c090ff 72%,#ffb060 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(11px,1.4vw,14px);
    letter-spacing:.14em;
    color:rgba(200,220,255,.62);
  }
  #title .formula .hl1{color:#5ee0ff;}
  #title .formula .hl2{color:#ffb060;}
  #title .formula .hl3{color:#c090ff;}

  #stats{
    position:absolute;top:0;right:0;
    padding:24px 32px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.10em;line-height:2.0;
    color:rgba(170,200,250,.34);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:6px;
  }
  #stats .k{color:rgba(190,205,255,.52);}
  #stats .v{color:rgba(255,215,150,.92);font-weight:600;}

  /* 小球信息面板 */
  #ballInfo{
    position:absolute;bottom:0;left:0;
    padding:0 32px 24px;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #ballInfo .lab{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.34em;
    color:rgba(140,190,255,.30);
    margin-bottom:10px;
  }
  .bi-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:6px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.06em;
    color:rgba(210,220,250,.62);
    transition:color .3s;
  }
  .bi-dot{
    width:11px;height:11px;border-radius:50%;
    box-shadow:0 0 8px currentColor;
    flex-shrink:0;
  }
  .bi-row .nm{
    color:rgba(200,215,250,.42);
    min-width:22px;
  }
  .bi-row .kv{
    color:rgba(180,200,245,.52);
    font-size:9px;
  }
  .bi-row .vl{
    color:rgba(255,220,170,.94);
    font-weight:600;
    min-width:52px;
    text-align:right;
  }
  .bi-row.hit{
    color:rgba(255,235,200,.98);
  }
  .bi-row.hit .vl{
    color:rgba(255,240,200,.98);
    text-shadow:0 0 10px rgba(255,220,150,.72);
  }

  #ctrlBtns{
    position:absolute;bottom:0;right:0;
    padding:0 32px 24px;
    display:flex;gap:7px;flex-wrap:wrap;
    justify-content:flex-end;
    max-width:360px;
    opacity:0;animation:fade 1.6s 1.5s ease forwards;
    pointer-events:auto;
  }
  .cbtn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.10em;
    color:rgba(200,215,250,.60);
    background:rgba(22,30,58,.52);
    border:1px solid rgba(120,155,230,.24);
    border-radius:8px;
    padding:8px 13px;cursor:pointer;
    transition:.28s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    white-space:nowrap;
  }
  .cbtn:hover{
    border-color:rgba(180,220,255,.80);
    color:rgba(230,240,255,.95);
    background:rgba(60,95,165,.26);
  }
  .cbtn.on{
    border-color:rgba(255,210,140,.88);
    color:rgba(255,235,200,.98);
    background:rgba(150,100,60,.28);
    box-shadow:0 0 16px rgba(255,170,110,.32);
  }

  #audioDot{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:14px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
    display:flex;align-items:center;gap:7px;
    white-space:nowrap;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:760px){
    #title{padding:14px 16px;}
    #title .formula{font-size:10px;}
    #stats{padding:14px 16px;font-size:8.5px;}
    #ballInfo{padding:0 16px 16px;}
    #ctrlBtns{padding:0 16px 16px;gap:5px;}
    .cbtn{font-size:8.5px;padding:6px 10px;border-radius:6px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">NEWTON'S SECOND LAW · COLLISION</div>
    <h1>牛顿第二定律</h1>
    <div class="formula">
      <span class="hl1">F</span> = 
      <span class="hl2">m</span> · 
      <span class="hl3">a</span>
      &nbsp;·&nbsp; 动量守恒 + 弹性碰撞
    </div>
  </div>

  <div id="stats">
    <span class="lab">SCENE STATE</span>
    <div><span class="k">总动能 </span><span class="v" id="keVal">0.0</span></div>
    <div><span class="k">总动量 </span><span class="v" id="pVal">0.0</span></div>
    <div><span class="k">碰撞次数 </span><span class="v" id="hitVal">0</span></div>
    <div><span class="k">模式 </span><span class="v" id="modeVal">弹性</span></div>
  </div>

  <div id="ballInfo">
    <span class="lab">BALLS · STATE</span>
    <div id="ballList"></div>
  </div>

  <div id="ctrlBtns">
    <button class="cbtn" id="bReset">重 置</button>
    <button class="cbtn" id="bMode">弹 性</button>
    <button class="cbtn" id="bSlow">慢 动 作</button>
    <button class="cbtn on" id="bVectors">显 示 向 量</button>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>碰撞声 · 弹性音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   画布
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let WALL_L = 0, WALL_R = 0, WALL_T = 0, WALL_B = 0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  WALL_L = Math.max(32, W * 0.06);
  WALL_R = W - WALL_L;
  WALL_T = Math.max(96, H * 0.20);
  WALL_B = H - Math.max(110, H * 0.20);
}
window.addEventListener('resize', resize);

/* =========================================================
   物理参数
   ========================================================= */
const ELASTICITY = 1.0;      /* 1 = 完全弹性，0.55 = 部分弹性 */
const WALL_BOUNCE = 0.98;

/* 全局尺度：质量 → 半径 */
function massToRadius(m){
  return 10 + Math.pow(m, 0.42) * 15;
}

/* =========================================================
   小球
   ========================================================= */
const balls = [];

function createBall(config){
  return {
    x: config.x,
    y: config.y,
    vx: config.vx || 0,
    vy: config.vy || 0,
    mass: config.mass,
    r: massToRadius(config.mass),
    hue: config.hue,
    label: config.label || '',
    hitFlash: 0,         /* 碰撞闪光，衰减 */
    trail: [],           /* 轨迹 */
    forces: []           /* 力向量可视 */
  };
}

function buildScene(){
  balls.length = 0;

  /* 六个小球，左右分两组，准备相向碰撞 */
  balls.push(createBall({
    x: W * 0.22, y: H * 0.42,
    vx:  130, vy: 0,
    mass: 1, hue: 195, label: 'A'
  }));
  balls.push(createBall({
    x: W * 0.78, y: H * 0.42,
    vx: -60, vy: 0,
    mass: 3, hue: 32, label: 'B'
  }));

  balls.push(createBall({
    x: W * 0.30, y: H * 0.62,
    vx:  90, vy: -30,
    mass: 0.6, hue: 155, label: 'C'
  }));
  balls.push(createBall({
    x: W * 0.70, y: H * 0.62,
    vx: -110, vy: 40,
    mass: 2, hue: 340, label: 'D'
  }));

  balls.push(createBall({
    x: W * 0.50, y: H * 0.34,
    vx: 40, vy: 85,
    mass: 1.5, hue: 270, label: 'E'
  }));
  balls.push(createBall({
    x: W * 0.50, y: H * 0.78,
    vx: -50, vy: -75,
    mass: 1, hue: 210, label: 'F'
  }));
}

/* =========================================================
   物理更新
   ========================================================= */
let totalHits = 0;
let lastHitTime = 0;
let hitSoundQueue = 0;

function updatePhysics(dt){
  /* 位移积分 */
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    /* 边界反弹 */
    if (b.x - b.r < WALL_L){
      b.x = WALL_L + b.r;
      b.vx = Math.abs(b.vx) * WALL_BOUNCE;
      b.hitFlash = Math.max(b.hitFlash, 0.6);
      hitSoundQueue = Math.max(hitSoundQueue, Math.min(1, Math.abs(b.vx) * 0.006));
    }
    if (b.x + b.r > WALL_R){
      b.x = WALL_R - b.r;
      b.vx = -Math.abs(b.vx) * WALL_BOUNCE;
      b.hitFlash = Math.max(b.hitFlash, 0.6);
      hitSoundQueue = Math.max(hitSoundQueue, Math.min(1, Math.abs(b.vx) * 0.006));
    }
    if (b.y - b.r < WALL_T){
      b.y = WALL_T + b.r;
      b.vy = Math.abs(b.vy) * WALL_BOUNCE;
      b.hitFlash = Math.max(b.hitFlash, 0.6);
      hitSoundQueue = Math.max(hitSoundQueue, Math.min(1, Math.abs(b.vy) * 0.006));
    }
    if (b.y + b.r > WALL_B){
      b.y = WALL_B - b.r;
      b.vy = -Math.abs(b.vy) * WALL_BOUNCE;
      b.hitFlash = Math.max(b.hitFlash, 0.6);
      hitSoundQueue = Math.max(hitSoundQueue, Math.min(1, Math.abs(b.vy) * 0.006));
    }

    /* 轨迹记录 */
    if (b.trail.length === 0 ||
        Math.hypot(b.x - b.trail[b.trail.length-1].x,
                   b.y - b.trail[b.trail.length-1].y) > 4){
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 40) b.trail.shift();
    }

    /* 闪光衰减 */
    b.hitFlash *= Math.exp(-4.5 * dt);
  }

  /* 小球之间的碰撞 */
  for (let i = 0; i < balls.length; i++){
    for (let j = i + 1; j < balls.length; j++){
      const a = balls[i];
      const b = balls[j];

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      const minD = a.r + b.r;

      if (d >= minD || d < 1e-6) continue;

      /* 处理重叠 */
      const overlap = minD - d;
      const nx = dx / d;
      const ny = dy / d;

      /* 质量反比位移 */
      const totalM = a.mass + b.mass;
      const aRatio = b.mass / totalM;
      const bRatio = a.mass / totalM;

      a.x -= nx * overlap * aRatio;
      a.y -= ny * overlap * aRatio;
      b.x += nx * overlap * bRatio;
      b.y += ny * overlap * bRatio;

      /* 相对速度沿法向 */
      const rvx = b.vx - a.vx;
      const rvy = b.vy - a.vy;
      const vn = rvx * nx + rvy * ny;

      if (vn > 0) continue;  /* 已经分离 */

      /* 冲量 */
      const e = ELASTICITY;
      const jImp = -(1 + e) * vn / (1 / a.mass + 1 / b.mass);

      a.vx -= jImp * nx / a.mass;
      a.vy -= jImp * ny / a.mass;
      b.vx += jImp * nx / b.mass;
      b.vy += jImp * ny / b.mass;

      /* 记录力向量（用于可视化） */
      const impactMag = Math.abs(jImp);
      a.forces.push({
        x: -nx * impactMag, y: -ny * impactMag,
        life: 1.0, mass: a.mass
      });
      b.forces.push({
        x: nx * impactMag, y: ny * impactMag,
        life: 1.0, mass: b.mass
      });

      /* 视觉闪光 */
      a.hitFlash = Math.min(1, a.hitFlash + 0.55);
      b.hitFlash = Math.min(1, b.hitFlash + 0.55);

      /* 音效强度 */
      const impactSpeed = Math.abs(vn);
      hitSoundQueue = Math.max(hitSoundQueue, Math.min(1, impactSpeed * 0.010));

      totalHits++;
      lastHitTime = performance.now() / 1000;
    }
  }

  /* 力向量衰减 */
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];
    for (let k = b.forces.length - 1; k >= 0; k--){
      b.forces[k].life -= dt * 1.5;
      if (b.forces[k].life <= 0) b.forces.splice(k, 1);
    }
  }

  /* 定期补充能量，避免完全停止 */
  let totalKE = 0;
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];
    totalKE += 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy);
  }
  if (totalKE < 8000){
    for (let i = 0; i < balls.length; i++){
      const b = balls[i];
      const mag = Math.hypot(b.vx, b.vy) || 1;
      const speedBoost = 1.04;
      b.vx *= speedBoost;
      b.vy *= speedBoost;
      /* 随机扰动方向避免陷入死循环 */
      b.vx += (Math.random() - 0.5) * 12;
      b.vy += (Math.random() - 0.5) * 12;
    }
  }
}

/* 计算动量和动能 */
function computeTotals(){
  let p = 0, ke = 0;
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];
    p += b.mass * Math.hypot(b.vx, b.vy);
    ke += 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy);
  }
  return { p: p, ke: ke };
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let lastHitTimeLocal = 0;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.42, ac.currentTime, 1.8);

  /* 极轻背景垫音 */
  const pad1 = ac.createOscillator();
  pad1.type = 'sine';
  pad1.frequency.value = 55;

  const pad2 = ac.createOscillator();
  pad2.type = 'sine';
  pad2.frequency.value = 55.7;

  const padGain = ac.createGain();
  padGain.gain.value = 0.012;

  pad1.connect(padGain);
  pad2.connect(padGain);
  padGain.connect(master);
  pad1.start();
  pad2.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* 碰撞声：短促噪声脉冲 + 低频闷响 */
function playHit(intensity){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  const s = Math.max(0.1, Math.min(1.2, intensity));

  /* 高频敲击 */
  const nl = Math.max(1, Math.ceil(ac.sampleRate * 0.028));
  const buf = ac.createBuffer(1, nl, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const t = i / nl;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.2);
  }
  const src = ac.createBufferSource();
  src.buffer = buf;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 1400 + Math.random() * 1400;
  bp.Q.value = 2.4;

  const g = ac.createGain();
  g.gain.value = 0.052 * s;

  src.connect(bp);
  bp.connect(g);
  g.connect(master);
  src.start(now);

  /* 低频闷响 */
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180 + Math.random() * 60, now);
  osc.frequency.exponentialRampToValueAtTime(52, now + 0.12);

  const og = ac.createGain();
  og.gain.setValueAtTime(0, now);
  og.gain.linearRampToValueAtTime(0.055 * s, now + 0.004);
  og.gain.exponentialRampToValueAtTime(0.0003, now + 0.20);

  osc.connect(og);
  og.connect(master);
  osc.start(now);
  osc.stop(now + 0.22);
}

/* 弹性音：上扫 */
function playElasticPing(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const baseFreq = 880 + Math.random() * 320;
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(baseFreq, now);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.6, now + 0.12);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.026, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.22);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.24);

  /* 泛音 */
  const osc2 = ac.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(baseFreq * 1.5, now);
  osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2.4, now + 0.12);

  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0, now + 0.02);
  g2.gain.linearRampToValueAtTime(0.010, now + 0.03);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

  osc2.connect(g2);
  g2.connect(master);
  osc2.start(now + 0.02);
  osc2.stop(now + 0.20);
}

/* =========================================================
   绘制
   ========================================================= */
function drawBackground(){
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  bg.addColorStop(0.00, '#0a1224');
  bg.addColorStop(0.42, '#060c1a');
  bg.addColorStop(1.00, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

function drawBox(){
  /* 墙内区域 */
  ctx.fillStyle = 'rgba(5, 10, 22, 0.42)';
  ctx.fillRect(WALL_L, WALL_T, WALL_R - WALL_L, WALL_B - WALL_T);

  /* 内发光渐变 */
  const g = ctx.createRadialGradient(
    (WALL_L + WALL_R) * 0.5, (WALL_T + WALL_B) * 0.5, 0,
    (WALL_L + WALL_R) * 0.5, (WALL_T + WALL_B) * 0.5,
    Math.max(WALL_R - WALL_L, WALL_B - WALL_T) * 0.72
  );
  g.addColorStop(0.00, 'rgba(60, 130, 220, 0.06)');
  g.addColorStop(1.00, 'rgba(60, 130, 220, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(WALL_L, WALL_T, WALL_R - WALL_L, WALL_B - WALL_T);

  /* 边界线 */
  const strokeStyle = 'rgba(120, 180, 250, 0.36)';
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  /* 四角端点 */
  const corner = 18;

  /* 左上角 */
  ctx.beginPath();
  ctx.moveTo(WALL_L + corner, WALL_T);
  ctx.lineTo(WALL_L, WALL_T);
  ctx.lineTo(WALL_L, WALL_T + corner);
  ctx.stroke();

  /* 右上角 */
  ctx.beginPath();
  ctx.moveTo(WALL_R - corner, WALL_T);
  ctx.lineTo(WALL_R, WALL_T);
  ctx.lineTo(WALL_R, WALL_T + corner);
  ctx.stroke();

  /* 左下角 */
  ctx.beginPath();
  ctx.moveTo(WALL_L + corner, WALL_B);
  ctx.lineTo(WALL_L, WALL_B);
  ctx.lineTo(WALL_L, WALL_B - corner);
  ctx.stroke();

  /* 右下角 */
  ctx.beginPath();
  ctx.moveTo(WALL_R - corner, WALL_B);
  ctx.lineTo(WALL_R, WALL_B);
  ctx.lineTo(WALL_R, WALL_B - corner);
  ctx.stroke();

  /* 光晕壁 */
  ctx.shadowColor = 'rgba(120, 180, 250, 0.55)';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(120, 180, 250, 0.24)';
  ctx.lineWidth = 1;
  ctx.strokeRect(WALL_L, WALL_T, WALL_R - WALL_L, WALL_B - WALL_T);
  ctx.shadowBlur = 0;
}

function drawTrail(ball){
  const n = ball.trail.length;
  if (n < 2) return;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i = 1; i < n; i++){
    const u = i / n;
    const a = u * u * 0.30;
    const r = ball.r * (0.28 + u * 0.42);

    ctx.beginPath();
    ctx.arc(ball.trail[i].x, ball.trail[i].y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(' + ball.hue + ', 92%, 68%, ' + a.toFixed(3) + ')';
    ctx.fill();
  }
}

function drawBall(ball, time){
  /* 碰撞闪光脉冲 */
  const flash = ball.hitFlash;
  const pulse = 1 + flash * 0.28;

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const glowR = ball.r * (4.2 + flash * 2.4) * pulse;
  const g = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, glowR);
  const a1 = 0.42 + flash * 0.42;
  g.addColorStop(0.00, 'hsla(' + ball.hue + ', 100%, 88%, ' + a1 + ')');
  g.addColorStop(0.32, 'hsla(' + ball.hue + ', 100%, 72%, ' + (a1 * 0.42) + ')');
  g.addColorStop(1.00, 'hsla(' + ball.hue + ', 100%, 62%, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, glowR, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 球体 */
  const bg = ctx.createRadialGradient(
    ball.x - ball.r * 0.35,
    ball.y - ball.r * 0.35,
    ball.r * 0.05,
    ball.x, ball.y, ball.r * 1.02
  );
  bg.addColorStop(0.00, 'hsla(' + ball.hue + ', 92%, 96%, 1)');
  bg.addColorStop(0.32, 'hsla(' + ball.hue + ', 92%, 82%, 1)');
  bg.addColorStop(0.72, 'hsla(' + ball.hue + ', 88%, 62%, 1)');
  bg.addColorStop(1.00, 'hsla(' + ball.hue + ', 82%, 42%, 1)');

  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();

  /* 边缘线 */
  ctx.strokeStyle = 'hsla(' + ball.hue + ', 96%, 86%, ' + (0.52 + flash * 0.42) + ')';
  ctx.lineWidth = 1.4 + flash * 1.2;
  ctx.stroke();

  /* 高光 */
  ctx.beginPath();
  ctx.arc(
    ball.x - ball.r * 0.32,
    ball.y - ball.r * 0.32,
    ball.r * 0.22, 0, Math.PI * 2
  );
  ctx.fillStyle = 'rgba(255, 255, 255, 0.62)';
  ctx.fill();

  /* 标签与质量 */
  const fs = Math.max(9.5, Math.min(14, ball.r * 0.72));
  ctx.font = '600 ' + fs.toFixed(0) + 'px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /* 描边 */
  ctx.strokeStyle = 'rgba(4, 8, 18, 0.82)';
  ctx.lineWidth = Math.max(2, fs * 0.18);
  ctx.lineJoin = 'round';
  ctx.strokeText(ball.label, ball.x, ball.y);

  /* 填充 */
  ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
  ctx.fillText(ball.label, ball.x, ball.y);
}

function drawVelocityVector(ball){
  const speed = Math.hypot(ball.vx, ball.vy);
  if (speed < 8) return;

  const scale = 0.38;
  const ux = ball.vx / speed;
  const uy = ball.vy / speed;
  const len = Math.min(ball.r * 3.2, speed * scale);

  const x0 = ball.x + ux * (ball.r + 2);
  const y0 = ball.y + uy * (ball.r + 2);
  const x1 = x0 + ux * len;
  const y1 = y0 + uy * len;

  const alpha = 0.55 + ball.hitFlash * 0.42;

  ctx.lineCap = 'round';

  /* 外发光 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.strokeStyle = 'hsla(' + ball.hue + ', 100%, 78%, ' + (alpha * 0.38) + ')';
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';

  /* 主体 */
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.strokeStyle = 'hsla(' + ball.hue + ', 92%, 82%, ' + alpha + ')';
  ctx.lineWidth = 2.2;
  ctx.stroke();

  /* 箭头 */
  const hs = 7;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ux * hs + uy * hs * 0.55, y1 - uy * hs - ux * hs * 0.55);
  ctx.lineTo(x1 - ux * hs - uy * hs * 0.55, y1 - uy * hs + ux * hs * 0.55);
  ctx.closePath();
  ctx.fillStyle = 'hsla(' + ball.hue + ', 92%, 86%, ' + alpha + ')';
  ctx.fill();

  /* 速度数值 */
  const lbl = speed.toFixed(0);
  ctx.font = '500 9.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'hsla(' + ball.hue + ', 92%, 88%, ' + (alpha * 0.92) + ')';
  ctx.fillText(lbl, (x0 + x1) * 0.5, (y0 + y1) * 0.5 - 12);
}

function drawForceVectors(ball){
  for (let k = 0; k < ball.forces.length; k++){
    const f = ball.forces[k];
    if (f.life <= 0) continue;

    const mag = Math.hypot(f.x, f.y);
    if (mag < 1e-6) continue;

    const ux = f.x / mag;
    const uy = f.y / mag;
    const len = Math.min(ball.r * 5, mag * 1.6);

    const x0 = ball.x;
    const y0 = ball.y;
    const x1 = x0 + ux * len;
    const y1 = y0 + uy * len;

    const alpha = f.life * f.life * 0.92;

    /* 外发光 */
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.strokeStyle = 'hsla(46, 100%, 80%, ' + (alpha * 0.42) + ')';
    ctx.lineWidth = 10 * f.life;
    ctx.stroke();

    /* 主箭头 */
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.strokeStyle = 'hsla(46, 100%, 88%, ' + alpha + ')';
    ctx.lineWidth = 2.6 * f.life;
    ctx.stroke();

    /* 箭头端点 */
    const hs = 8 * f.life;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - ux * hs + uy * hs * 0.55, y1 - uy * hs - ux * hs * 0.55);
    ctx.lineTo(x1 - ux * hs - uy * hs * 0.55, y1 - uy * hs + ux * hs * 0.55);
    ctx.closePath();
    ctx.fillStyle = 'hsla(46, 100%, 90%, ' + alpha + ')';
    ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawSpeedLegend(){
  /* 在盒子顶部显示 F=ma 提示 */
  const cx0 = (WALL_L + WALL_R) * 0.5;
  const y0 = WALL_T + 16;

  const items = [
    { c: 42,  text: '力 F · 冲量方向' },
    { c: 195, text: '速度 v · 大小与质量反比' }
  ];

  ctx.font = '400 10px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  let x = cx0 - 170;
  for (let i = 0; i < items.length; i++){
    const it = items[i];

    /* 短横线 */
    ctx.beginPath();
    ctx.moveTo(x, y0 + 6);
    ctx.lineTo(x + 14, y0 + 6);
    ctx.strokeStyle = 'hsla(' + it.c + ', 92%, 76%, 0.72)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.fillStyle = 'hsla(' + it.c + ', 80%, 82%, 0.62)';
    ctx.fillText(it.text, x + 20, y0);

    x += 180;
  }
}

/* =========================================================
   HUD 更新
   ========================================================= */
let ballRows = [];

function buildBallUI(){
  const wrap = document.getElementById('ballList');
  if (!wrap) return;
  wrap.innerHTML = '';
  ballRows = [];

  for (let i = 0; i < balls.length; i++){
    const b = balls[i];

    const row = document.createElement('div');
    row.className = 'bi-row';

    const dot = document.createElement('span');
    dot.className = 'bi-dot';
    dot.style.background = 'hsl(' + b.hue + ', 92%, 68%)';
    dot.style.color = 'hsl(' + b.hue + ', 92%, 68%)';

    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = b.label;

    const m = document.createElement('span');
    m.className = 'kv';
    m.textContent = 'm=' + b.mass;

    const val = document.createElement('span');
    val.className = 'vl';
    val.textContent = '0.0';

    row.appendChild(dot);
    row.appendChild(nm);
    row.appendChild(m);
    row.appendChild(val);
    wrap.appendChild(row);

    ballRows.push({ row: row, val: val, ball: b });
  }
}

let uiTick = 0;
function updateHUD(){
  uiTick++;
  if (uiTick % 4 !== 0) return;

  const totals = computeTotals();

  const keEl = document.getElementById('keVal');
  const pEl = document.getElementById('pVal');
  const hitEl = document.getElementById('hitVal');
  const modeEl = document.getElementById('modeVal');

  if (keEl) keEl.textContent = totals.ke.toFixed(0);
  if (pEl) pEl.textContent = totals.p.toFixed(0);
  if (hitEl) hitEl.textContent = totalHits;
  if (modeEl) modeEl.textContent = ELASTICITY >= 0.98 ? '弹性' : '部分弹性';

  for (let i = 0; i < ballRows.length; i++){
    const r = ballRows[i];
    const b = r.ball;
    const speed = Math.hypot(b.vx, b.vy);
    r.val.textContent = speed.toFixed(1);

    if (b.hitFlash > 0.35){
      r.row.classList.add('hit');
    } else {
      r.row.classList.remove('hit');
    }
  }
}

/* =========================================================
   主循环
   ========================================================= */
let lastNow = 0;
let showVectors = true;
let slowMotion = false;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastNow) lastNow = now;
  let dt = (now - lastNow) / 1000;
  lastNow = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  /* 物理步进（子步长提高稳定性） */
  const simDt = slowMotion ? dt * 0.35 : dt;
  const SUBSTEPS = 2;
  for (let s = 0; s < SUBSTEPS; s++){
    updatePhysics(simDt / SUBSTEPS);
  }

  /* 播放碰撞音 */
  if (hitSoundQueue > 0.02){
    const intensity = hitSoundQueue;
    hitSoundQueue = 0;

    if (intensity > 0.55){
      playHit(intensity);
      if (Math.random() < 0.42) playElasticPing();
    } else {
      playHit(intensity * 0.72);
    }
  }

  /* 渲染 */
  drawBackground();
  drawBox();

  /* 轨迹在球下方 */
  for (let i = 0; i < balls.length; i++){
    drawTrail(balls[i]);
  }

  /* 力向量（在球下方） */
  for (let i = 0; i < balls.length; i++){
    drawForceVectors(balls[i]);
  }

  /* 速度向量 */
  if (showVectors){
    for (let i = 0; i < balls.length; i++){
      drawVelocityVector(balls[i]);
    }
  }

  /* 小球 */
  for (let i = 0; i < balls.length; i++){
    drawBall(balls[i], now * 0.001);
  }

  /* 顶部图例 */
  drawSpeedLegend();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.22)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.90)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
document.getElementById('bReset').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  buildScene();
  totalHits = 0;
  buildBallUI();
});

document.getElementById('bMode').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  this.dataset.mode = this.dataset.mode === 'elastic' ? 'partial' : 'elastic';
  if (this.dataset.mode === 'partial'){
    this.textContent = '部 分 弹 性';
    window.__elasticity = 0.62;
  } else {
    this.textContent = '弹 性';
    window.__elasticity = 1.0;
  }
  /* 动态修改 ELASTICITY 的引用 */
  try {
    Object.defineProperty(window, '__elasticitySet', {
      value: window.__elasticity
    });
  } catch(err){}
  /* 直接修改行为常量 */
  updateElasticity();
});

let ELASTICITY_DYN = 1.0;
function updateElasticity(){
  ELASTICITY_DYN = window.__elasticity || 1.0;
}

/* 用可变量替换常量 */
const ELASTICITY_VAR = { v: 1.0 };

document.getElementById('bSlow').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  slowMotion = !slowMotion;
  this.classList.toggle('on', slowMotion);
  this.textContent = slowMotion ? '正 常 速 度' : '慢 动 作';
});

document.getElementById('bVectors').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  showVectors = !showVectors;
  this.classList.toggle('on', showVectors);
});

/* 点击画布：在点击位置生成一个新球 */
canvas.addEventListener('pointerdown', function(e){
  initAudio();

  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;

  if (px < WALL_L + 20 || px > WALL_R - 20) return;
  if (py < WALL_T + 20 || py > WALL_B - 20) return;

  if (balls.length >= 12) {
    balls.shift();
  }

  const hue = (Math.random() * 360) | 0;
  const mass = 0.5 + Math.random() * 2.5;

  balls.push(createBall({
    x: px, y: py,
    vx: (Math.random() - 0.5) * 260,
    vy: (Math.random() - 0.5) * 260,
    mass: mass,
    hue: hue,
    label: String.fromCharCode(65 + balls.length % 26)
  }));

  buildBallUI();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    buildScene();
    totalHits = 0;
    buildBallUI();
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    buildScene();
    totalHits = 0;
    buildBallUI();
  } else if (e.key === 's' || e.key === 'S'){
    initAudio();
    slowMotion = !slowMotion;
    document.getElementById('bSlow').classList.toggle('on', slowMotion);
  } else if (e.key === 'v' || e.key === 'V'){
    initAudio();
    showVectors = !showVectors;
    document.getElementById('bVectors').classList.toggle('on', showVectors);
  }
});

   应用动态弹性系数
   ========================================================= */

function applyElasticity(){
  if (window.__elasticity !== undefined){

/* =========================================================
   启动
   ========================================================= */
resize();
buildScene();
buildBallUI();
requestAnimationFrame(loop);

})();
