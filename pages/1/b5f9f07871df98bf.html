<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引力波 · Gravitational Waves</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a;}
  body{
    font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
    color:#cfe9ff;-webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;z-index:0;}
  #app canvas{display:block;}

  .hud{
    position:fixed;inset:0;z-index:10;pointer-events:none;
    padding:28px 34px;
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .hud-left{max-width:460px;}
  .title{
    font-size:30px;font-weight:800;letter-spacing:8px;
    background:linear-gradient(100deg,#39f4ff 0%,#8fa8ff 48%,#ff5fd0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 20px rgba(70,200,255,.6));
  }
  .subtitle{
    margin-top:7px;font-size:10.5px;letter-spacing:4.6px;
    color:#4d7ea8;font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .rule{width:130px;height:1px;margin:14px 0 16px;
    background:linear-gradient(90deg,#22e6ff,rgba(34,230,255,0));}
  .eq{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:15px;line-height:2.0;color:#8fd8ff;
    text-shadow:0 0 12px rgba(60,190,255,.5);
  }
  .eq.small{font-size:12.5px;color:#6aa9cc;text-shadow:0 0 10px rgba(60,190,255,.3);}
  .eq b{color:#ff86e4;font-weight:600;}
  .eq .cy{color:#5ff0ff;}

  .hud-right{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;}
  .legend-title{font-size:10px;letter-spacing:4px;color:#4d7ea8;margin-bottom:12px;}
  .lrow{display:flex;align-items:center;justify-content:flex-end;gap:10px;
    font-size:11.5px;line-height:1.9;color:#7fc8e8;}
  .dot{width:22px;height:3px;border-radius:2px;
    box-shadow:0 0 9px currentColor;background:currentColor;}
  .note{margin-top:16px;font-size:10px;letter-spacing:1.6px;color:#3f6c8c;}

  #start{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(8,20,45,.85),rgba(2,3,10,.97));
    backdrop-filter:blur(3px);cursor:pointer;transition:opacity .9s ease;
  }
  #start.hide{opacity:0;pointer-events:none;}
  .start-box{text-align:center;}
  .start-title{
    font-size:38px;font-weight:800;letter-spacing:14px;
    background:linear-gradient(100deg,#39f4ff,#8fa8ff,#ff5fd0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 32px rgba(80,200,255,.65));
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
  .start-sub{margin-top:22px;font-size:12px;letter-spacing:5px;color:#5c92b8;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  .start-sub::after{content:"_";animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0}}

  @media(max-width:760px){
    .hud{padding:18px;}
    .title{font-size:20px;letter-spacing:5px;}
    .eq{font-size:12px;}
    .hud-right{display:none;}
  }
</style>
</head>
<body>

<div id="app"></div>

<div class="hud">
  <div class="hud-left">
    <div class="title">引 力 波</div>
    <div class="subtitle">GRAVITATIONAL WAVES · QUADRUPOLE RADIATION</div>
    <div class="rule"></div>
    <div class="eq">□ h<sub>μν</sub> = 0</div>
    <div class="eq small">度规扰动满足波动方程 · 传播速度 <b>v = c</b></div>
    <div class="eq small">h ∝ <span class="cy">(G/c⁴)</span> · (d²Q/dt²) / r</div>
    <div class="eq small">四极辐射 · 双星系统旋近辐射引力波</div>
  </div>
  <div class="hud-right">
    <div class="legend-title">SPACETIME STRAIN</div>
    <div class="lrow"><span>拉伸 +h</span><span class="dot" style="color:#2fe6ff"></span></div>
    <div class="lrow"><span>压缩 −h</span><span class="dot" style="color:#ff4fd8"></span></div>
    <div class="lrow"><span>波前</span><span class="dot" style="color:#8fa8ff"></span></div>
    <div class="note">时空网格随 h<sub>μν</sub> 周期性形变</div>
  </div>
</div>

<div id="start">
  <div class="start-box">
    <div class="start-title">引 力 波</div>
    <div class="start-sub">点击进入 · 开启背景音效</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================================
   物理参数
   ========================================================= */
const ORBIT_R  = 3.0;              // 双星轨道半径
const ORBIT_W  = 1.5;              // 轨道角速度 ω_orb
const GW_W     = ORBIT_W * 2;      // 引力波角频率 ω_gw = 2 ω_orb（四极辐射）
const GW_C     = 4.5;              // 引力波传播速度 c
const GW_K     = GW_W / GW_C;      // 波数 k = ω/c

const GRID_SIZE = 44;              // 时空网格物理边长
const GRID_N    = 56;              // 每方向分段数

/* =========================================================
   Three.js 基础
   ========================================================= */
const app = document.getElementById('app');

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 19, 30);
camera.lookAt(0, 0.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x02030a, 1);
app.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 1.15, 0.62, 0.16
);
composer.addPass(bloom);

/* =========================================================
   贴图
   ========================================================= */
function makeDotTexture(){
  const S = 64;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.20, 'rgba(255,255,255,0.75)');
  g.addColorStop(0.52, 'rgba(255,255,255,0.18)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const DOT_TEX = makeDotTexture();

/* =========================================================
   星空背景
   ========================================================= */
(function buildStars(){
  const COUNT = 2200;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  const c = new THREE.Color();
  for(let i = 0; i < COUNT; i++){
    const r  = 70 + Math.random() * 130;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.75;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th);
    c.setHSL(0.52 + Math.random() * 0.22, 0.85, 0.38 + Math.random() * 0.5);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 0.62, map: DOT_TEX, vertexColors: true,
    transparent: true, opacity: 0.9, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* =========================================================
   时空网格（随引力波拉伸 / 压缩）
   ========================================================= */
const VPL     = GRID_N + 1;
const TOTAL_V = VPL * VPL;

const posArr  = new Float32Array(TOTAL_V * 3);
const colArr  = new Float32Array(TOTAL_V * 3);
const baseX   = new Float32Array(TOTAL_V);
const baseZ   = new Float32Array(TOTAL_V);
const baseR   = new Float32Array(TOTAL_V);
const basePhi = new Float32Array(TOTAL_V);

for(let j = 0; j <= GRID_N; j++){
  for(let i = 0; i <= GRID_N; i++){
    const idx = j * VPL + i;
    const x = (i / GRID_N - 0.5) * GRID_SIZE;
    const z = (j / GRID_N - 0.5) * GRID_SIZE;
    baseX[idx]   = x;
    baseZ[idx]   = z;
    baseR[idx]   = Math.hypot(x, z) + 1e-4;
    basePhi[idx] = Math.atan2(z, x);
  }
}

// 索引：横向 + 纵向线段
const idxList = [];
for(let j = 0; j <= GRID_N; j++){
  for(let i = 0; i < GRID_N; i++){
    const a = j * VPL + i;
    idxList.push(a, a + 1);
  }
}
for(let i = 0; i <= GRID_N; i++){
  for(let j = 0; j < GRID_N; j++){
    const a = j * VPL + i;
    idxList.push(a, a + VPL);
  }
}

const gridGeo = new THREE.BufferGeometry();
gridGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
gridGeo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));
gridGeo.setIndex(new THREE.BufferAttribute(new Uint16Array(idxList), 1));

const gridMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const gridLines = new THREE.LineSegments(gridGeo, gridMat);
scene.add(gridLines);

const _col = new THREE.Color();

function updateGrid(t){
  const orbPhase = t * ORBIT_W;
  const p = posArr, c = colArr;

  for(let i = 0; i < TOTAL_V; i++){
    const r   = baseR[i];
    const phi = basePhi[i];

    // 相位：向外传播的行波
    const phase = GW_K * r - GW_W * t;

    // 四极辐射图样 cos2φ，随双星旋转
    const quad = Math.cos(2 * (phi - orbPhase));

    // 几何衰减 1/r
    const falloff = 1 / (1 + r * 0.19);

    const s = Math.sin(phase) * quad * falloff;

    // 径向拉伸/压缩 + 垂直起伏
    const dr = s * 1.15;
    const dy = s * 1.55;

    const ux = baseX[i] / r;
    const uz = baseZ[i] / r;

    p[i*3]     = baseX[i] + dr * ux;
    p[i*3 + 1] = dy;
    p[i*3 + 2] = baseZ[i] + dr * uz;

    // 颜色映射：拉伸→青，压缩→品红
    const sv  = Math.max(-1, Math.min(1, s * 3.2));
    const hue = 0.52 + (1 - sv) * 0.165;
    const fade = Math.exp(-r * 0.055);
    _col.setHSL(hue % 1, 1.0, 0.06 + 0.56 * fade);

    c[i*3]     = _col.r;
    c[i*3 + 1] = _col.g;
    c[i*3 + 2] = _col.b;
  }

  gridGeo.attributes.position.needsUpdate = true;
  gridGeo.attributes.color.needsUpdate    = true;
}

/* =========================================================
   引力波涟漪环
   ========================================================= */
const RING_POOL     = 24;
const RING_SPEED    = GW_C;      // 与引力波同速扩散
const RING_MAX_R    = 27;
const RING_INTERVAL = 0.40;      // 发射间隔

const ringPool = [];
for(let i = 0; i < RING_POOL; i++){
  const geo = new THREE.RingGeometry(0.972, 1.0, 180);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide, depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.visible = false;
  mesh.position.y = 0.55;
  scene.add(mesh);
  ringPool.push({ mesh, mat, r: 0, active: false, hue: 0 });
}

let ringCursor = 0;
let ringTimer  = 0;
let hueBase    = 0.52;

function spawnRing(){
  const ring = ringPool[ringCursor];
  ringCursor = (ringCursor + 1) % RING_POOL;
  ring.active = true;
  ring.r = 0.35;
  ring.hue = hueBase;
  ring.mesh.visible = true;
  ring.mesh.scale.setScalar(ring.r);
}

function updateRings(dt){
  for(const ring of ringPool){
    if(!ring.active) continue;
    ring.r += RING_SPEED * dt;
    if(ring.r > RING_MAX_R){
      ring.active = false;
      ring.mesh.visible = false;
      continue;
    }
    const pr = ring.r / RING_MAX_R;
    ring.mesh.scale.setScalar(ring.r);

    // 亮度：起始渐亮，随后衰减
    const fadeIn  = Math.min(1, pr * 6.0);
    const fadeOut = Math.pow(1 - pr, 1.45);
    ring.mat.opacity = 0.95 * fadeIn * fadeOut;

    // 色相随传播距离渐变（青 → 紫 → 品红）
    ring.mat.color.setHSL((ring.hue + pr * 0.30) % 1, 0.95, 0.63);
  }
}

/* =========================================================
   双星系统
   ========================================================= */
function makeStar(hex){
  const g = new THREE.Group();

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.40, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  g.add(core);

  const glow1 = new THREE.Sprite(new THREE.SpriteMaterial({
    map: DOT_TEX, color: hex, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow1.scale.set(5.0, 5.0, 1);
  g.add(glow1);

  const glow2 = new THREE.Sprite(new THREE.SpriteMaterial({
    map: DOT_TEX, color: hex, transparent: true, opacity: 0.42,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow2.scale.set(11.0, 11.0, 1);
  g.add(glow2);

  return g;
}

const starA = makeStar(0x66e0ff);
const starB = makeStar(0xff7ad8);
scene.add(starA, starB);

// 轨道参考圆
(function orbitGuide(){
  const pts = [];
  for(let i = 0; i <= 200; i++){
    const a = i / 200 * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * ORBIT_R, 0, Math.sin(a) * ORBIT_R));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineBasicMaterial({
    color: 0x2a6a9a, transparent: true, opacity: 0.30,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Line(g, m));
})();

/* 拖尾 */
const TRAIL_LEN = 70;
function makeTrail(color){
  const arr = new Float32Array(TRAIL_LEN * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const m = new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const line = new THREE.Line(g, m);
  scene.add(line);
  return { line, arr, geo: g };
}
const trailA = makeTrail(0x66e0ff);
const trailB = makeTrail(0xff7ad8);
let trailInit = false;

/* =========================================================
   HUD 图例
   ========================================================= */
(function legend(){ /* 静态 HTML 已提供 */ })();

/* =========================================================
   音频系统
   ========================================================= */
let audioCtx = null, master = null;

function initAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();

  master = audioCtx.createGain();
  master.gain.value = 0.5;
  master.connect(audioCtx.destination);

  /* ---- 低频 drone ---- */
  const droneGain = audioCtx.createGain();
  droneGain.gain.value = 0;
  droneGain.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 4);
  droneGain.connect(master);

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 340;
  lp.Q.value = 4.5;
  lp.connect(droneGain);

  [[41.2, 0.55, 'sine'],
   [41.9, 0.48, 'sine'],
   [82.4, 0.20, 'triangle'],
   [123.5, 0.10, 'triangle']].forEach(([f, g, type])=>{
    const o = audioCtx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    const gg = audioCtx.createGain();
    gg.gain.value = g;
    o.connect(gg); gg.connect(lp);
    o.start();
  });

  // 滤波器缓慢扫描
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.045;
  const lfoG = audioCtx.createGain();
  lfoG.gain.value = 190;
  lfo.connect(lfoG); lfoG.connect(lp.frequency);
  lfo.start();

  /* ---- 空气噪声层 ---- */
  const len = Math.floor(audioCtx.sampleRate * 4);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const noise = audioCtx.createBufferSource();
  noise.buffer = buf; noise.loop = true;

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 750;
  bp.Q.value = 0.65;

  const ng = audioCtx.createGain();
  ng.gain.value = 0.05;

  noise.connect(bp); bp.connect(ng); ng.connect(master);
  noise.start();

  const lfo2 = audioCtx.createOscillator();
  lfo2.frequency.value = 0.031;
  const lfo2g = audioCtx.createGain();
  lfo2g.gain.value = 520;
  lfo2.connect(lfo2g); lfo2g.connect(bp.frequency);
  lfo2.start();
}

/* 引力波脉冲（每次轨道周期） */
function playPulse(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;

  const o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.7);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.24, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);

  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 1.6);
}

/* 涟漪铃声 */
function playRipple(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const base = 700 + Math.random() * 320;
  [1, 2.01, 3.03].forEach((m, i)=>{
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = base * m;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05 / (i + 1), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 1.7);
  });
}

/* =========================================================
   动画循环
   ========================================================= */
const clock = new THREE.Clock();
let prevAngle = 0;

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();

  /* ---- 时空网格 ---- */
  updateGrid(t);

  /* ---- 涟漪环 ---- */
  ringTimer += dt;
  if(ringTimer >= RING_INTERVAL){
    ringTimer -= RING_INTERVAL;
    spawnRing();
    if(audioCtx && Math.random() < 0.55) playRipple();
  }
  updateRings(dt);

  // 色相缓慢漂移，让涟漪呈现色彩渐变
  hueBase = (0.52 + t * 0.012) % 1;

  /* ---- 双星公转 ---- */
  const a  = t * ORBIT_W;
  const ax = Math.cos(a) * ORBIT_R;
  const az = Math.sin(a) * ORBIT_R;
  const bx = -ax, bz = -az;

  starA.position.set(ax, 0, az);
  starB.position.set(bx, 0, bz);

  // 星体脉动
  const pulse = 1 + 0.08 * Math.sin(t * 6.0);
  starA.scale.setScalar(pulse);
  starB.scale.setScalar(pulse);

  /* ---- 拖尾 ---- */
  if(!trailInit){
    for(let i = 0; i < TRAIL_LEN; i++){
      trailA.arr[i*3]     = ax; trailA.arr[i*3+1] = 0; trailA.arr[i*3+2] = az;
      trailB.arr[i*3]     = bx; trailB.arr[i*3+1] = 0; trailB.arr[i*3+2] = bz;
    }
    trailInit = true;
  } else {
    trailA.arr.copyWithin(0, 3);
    trailB.arr.copyWithin(0, 3);
    const li = (TRAIL_LEN - 1) * 3;
    trailA.arr[li] = ax; trailA.arr[li+1] = 0; trailA.arr[li+2] = az;
    trailB.arr[li] = bx; trailB.arr[li+1] = 0; trailB.arr[li+2] = bz;
  }
  trailA.geo.attributes.position.needsUpdate = true;
  trailB.geo.attributes.position.needsUpdate = true;

  /* ---- 每周期触发一次引力波脉冲 ---- */
  const ang = (t * ORBIT_W) % (Math.PI * 2);
  if(ang < prevAngle) playPulse();
  prevAngle = ang;

  /* ---- 摄像机缓慢环绕 ---- */
  const camA = t * 0.055;
  camera.position.x = Math.sin(camA) * 6.5;
  camera.position.y = 19 + Math.sin(t * 0.21) * 1.2;
  camera.position.z = 30 + Math.cos(camA) * 3.0;
  camera.lookAt(0, 0.6, 0);

  /* ---- 辉光呼吸 ---- */
  bloom.strength = 1.05 + 0.22 * Math.sin(t * 0.9);

  composer.render();
}

/* =========================================================
   交互 / 尺寸
   ========================================================= */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

const startEl = document.getElementById('start');
startEl.addEventListener('click', ()=>{
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startEl.classList.add('hide');
  setTimeout(()=>startEl.remove(), 1000);
  playPulse();
});

animate();
</script>
</body>
</html>
