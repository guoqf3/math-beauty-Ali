<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>电磁波偏振叠加 · EM Polarization</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#01030a;}
  body{
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#cfefff; -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;z-index:1;}
  canvas{display:block;}

  #vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(110% 82% at 50% 48%, rgba(0,0,0,0) 34%, rgba(0,0,0,0.82) 100%);
    mix-blend-mode:multiply;
  }

  #hud{position:fixed;inset:0;z-index:5;pointer-events:none;}

  .panel{
    position:absolute;
    background:linear-gradient(150deg, rgba(6,20,38,0.72), rgba(2,8,20,0.52));
    border:1px solid rgba(90,200,255,0.20);
    border-radius:14px;
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    box-shadow:0 0 30px rgba(0,110,180,0.16), inset 0 0 26px rgba(0,150,220,0.06);
    padding:18px 20px;
  }

  /* ---------- 左上：公式 ---------- */
  .panel-tl{ top:22px; left:22px; width:346px; }

  .title{
    font-size:21px; font-weight:700; letter-spacing:3px;
    background:linear-gradient(92deg,#9df3ff,#5bc8ff 55%,#ff9de8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 26px rgba(80,210,255,0.35);
  }
  .subtitle{
    margin-top:5px; font-size:9.5px; letter-spacing:2.6px;
    color:#4e8fb3; text-transform:uppercase;
  }
  .divider{
    height:1px; margin:12px 0 11px;
    background:linear-gradient(90deg, rgba(90,220,255,0.55), rgba(90,220,255,0.02));
  }
  .eq{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:12.5px; line-height:2.0; color:#a9ddf5; letter-spacing:0.3px;
    white-space:nowrap;
  }
  .eq.dim{color:#5f93ad; font-size:11px;}
  .eq.hot{
    color:#ff9de8;
    text-shadow:0 0 14px rgba(255,80,215,0.5);
  }
  .eq.hot b{color:#ffffff; font-weight:700;}
  .eq .lbl{color:#7fd0e8;}
  .eq .cx{color:#ff8090;}
  .eq .cy{color:#80ffb0;}

  /* ---------- 右上：状态 ---------- */
  .panel-tr{ top:22px; right:22px; width:286px; }
  .stat{
    display:flex; align-items:center; gap:9px;
    font-size:13px; color:#a9ddf5; line-height:2.15;
    letter-spacing:0.5px;
  }
  .stat b{
    margin-left:auto;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;
    font-size:15px; color:#fff;
  }
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot.ex{background:#ff5566; box-shadow:0 0 12px #ff5566, 0 0 22px rgba(255,85,102,0.55);}
  .dot.ey{background:#5effa0; box-shadow:0 0 12px #5effa0, 0 0 22px rgba(94,255,160,0.55);}
  .dot.phi{background:#ff9de8; box-shadow:0 0 12px #ff9de8, 0 0 22px rgba(255,157,232,0.55);}

  .pol-badge{
    display:inline-block; margin-top:10px;
    font-size:13px; letter-spacing:1.6px; padding:5px 12px;
    border-radius:8px; font-weight:700;
    color:#04121c;
    background:linear-gradient(92deg,#5df0ff,#3fb4ff);
    box-shadow:0 0 22px rgba(80,220,255,0.55);
  }
  .pol-badge.circ{ background:linear-gradient(92deg,#ffb0f0,#ff6ad6); box-shadow:0 0 22px rgba(255,106,214,0.55); }
  .pol-badge.linear{ background:linear-gradient(92deg,#a0ffd0,#5effa0); box-shadow:0 0 22px rgba(94,255,160,0.55); }

  .note{
    font-size:11px; line-height:1.75; color:#6ea9c4; letter-spacing:0.3px;
    margin-top:8px;
  }
  .note em{color:#8ff0ff; font-style:normal;}
  .note i{color:#ffc97a; font-style:normal;}

  /* ---------- 左下：控制 ---------- */
  .panel-bl{
    left:22px; bottom:22px; padding:14px 16px; width:346px;
    pointer-events:auto;
  }
  .ctrl-row{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .ctrl-label{
    font-size:11.5px; letter-spacing:1.4px; color:#8fd0ea;
    min-width:62px;
  }
  #phaseSlider{
    flex:1; -webkit-appearance:none; appearance:none;
    height:5px; border-radius:3px; outline:none; cursor:pointer;
    background:linear-gradient(90deg,#5df0ff,#ff6ad6,#5effa0);
    box-shadow:0 0 12px rgba(80,200,255,0.4);
  }
  #phaseSlider::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#e8fbff; border:2px solid #3fb4ff; cursor:pointer;
    box-shadow:0 0 14px rgba(90,220,255,0.95);
  }
  #phaseSlider::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background:#e8fbff; border:2px solid #3fb4ff; cursor:pointer;
    box-shadow:0 0 14px rgba(90,220,255,0.95);
  }
  #phaseVal{
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;
    font-size:12.5px; color:#ffd6f4; min-width:52px; text-align:right;
  }

  .btn-row{ display:flex; gap:7px; flex-wrap:wrap; }
  .mini-btn{
    cursor:pointer; font-family:inherit; font-size:10.5px;
    letter-spacing:0.8px; padding:6px 10px; border-radius:7px;
    color:#9fe4ff; background:rgba(20,90,140,0.25);
    border:1px solid rgba(80,210,255,0.35);
    transition:all .18s ease;
  }
  .mini-btn:hover{
    background:rgba(40,150,220,0.36); color:#fff;
    box-shadow:0 0 14px rgba(60,200,255,0.5);
  }
  .mini-btn.active{
    color:#04121c; font-weight:700;
    background:linear-gradient(92deg,#5df0ff,#3fb4ff);
    border-color:#8ff4ff;
  }

  #audioBtn{
    pointer-events:auto; cursor:pointer;
    font-family:inherit; font-size:11.5px; letter-spacing:1.4px;
    color:#9fe4ff; background:rgba(20,90,140,0.25);
    border:1px solid rgba(80,210,255,0.42);
    border-radius:8px; padding:7px 13px;
    transition:all .22s ease;
    width:100%; margin-top:9px;
  }
  #audioBtn:hover{
    background:rgba(40,150,220,0.34); color:#fff;
    box-shadow:0 0 18px rgba(60,200,255,0.5);
  }
  #audioBtn.on{
    color:#04121c; font-weight:700;
    background:linear-gradient(92deg,#5df0ff,#3fb4ff);
    border-color:#8ff4ff;
    box-shadow:0 0 22px rgba(80,220,255,0.7);
  }

  /* ---------- 右下：提示 ---------- */
  .panel-br{
    right:22px; bottom:22px; padding:10px 16px;
    font-size:11px; letter-spacing:0.9px; color:#5f9ab5;
  }
  .panel-br span{color:#9fe4ff;}

  @media (max-width: 1080px){
    .panel-tl{ width:266px; padding:13px 14px; }
    .title{font-size:16px; letter-spacing:2px;}
    .eq{font-size:10px;}
    .panel-tr{ width:210px; padding:13px 14px; }
    .stat{font-size:11.5px;}
    .stat b{font-size:12.5px;}
    .panel-bl{ width:266px; padding:11px 13px; }
    .panel-br{display:none;}
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="app"></div>
<div id="vignette"></div>

<div id="hud">

  <div class="panel panel-tl">
    <div class="title">电磁波偏振叠加</div>
    <div class="subtitle">EM Wave Polarization · Superposition</div>
    <div class="divider"></div>
    <div class="eq">E = <span class="cx">E₀cos(kz−ωt)</span> ê<sub>x</sub> + <span class="cy">E₀cos(kz−ωt+φ)</span> ê<sub>y</sub></div>
    <div class="eq dim">相位差 φ 决定偏振态</div>
    <div class="eq"><span class="lbl">线偏振</span> φ = 0, π</div>
    <div class="eq"><span class="lbl">圆偏振</span> φ = ±π/2</div>
    <div class="eq hot">椭圆偏振 &nbsp;<b>其他 φ</b></div>
  </div>

  <div class="panel panel-tr">
    <div class="stat"><span class="dot ex"></span>E<sub>x</sub> 分量<b id="hudEx">0.00</b></div>
    <div class="stat"><span class="dot ey"></span>E<sub>y</sub> 分量<b id="hudEy">0.00</b></div>
    <div class="stat"><span class="dot phi"></span>相位差 φ<b id="hudPhi">90°</b></div>
    <div id="polBadge" class="pol-badge circ">圆偏振</div>
    <div class="note">
      电场矢量 <em>旋转扫描</em> 出螺旋轨迹<br>
      虚线为 <i>正交分量分解</i>
    </div>
  </div>

  <div class="panel panel-bl">
    <div class="ctrl-row">
      <span class="ctrl-label">相位差 φ</span>
      <input type="range" id="phaseSlider" min="0" max="360" step="1" value="90">
      <span id="phaseVal">90°</span>
    </div>
    <div class="btn-row">
      <button class="mini-btn" data-phi="0">线偏振 0°</button>
      <button class="mini-btn active" data-phi="90">圆偏振 90°</button>
      <button class="mini-btn" data-phi="45">椭圆 45°</button>
      <button class="mini-btn" data-phi="180">线偏振 180°</button>
      <button class="mini-btn" data-phi="270">圆偏振 −90°</button>
    </div>
    <button id="audioBtn">♪&nbsp; 开启音效</button>
  </div>

  <div class="panel panel-br">
    拖拽 <span>旋转</span> · 滚轮 <span>缩放</span>
  </div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ============================================================
   1. 波参数
   ============================================================ */
const AMP      = 3.2;          // 振幅
const K_WAVE   = 0.62;         // 波数 k
const OMEGA    = 2.10;         // 角频率 ω
const Z_MIN    = -32.0;
const Z_MAX    =  32.0;
const N_CURVE  = 560;          // 螺旋轨迹采样点
const N_ARROW  = 14;           // 电场矢量箭头数量

let PHI = Math.PI / 2;         // 相位差 φ（可变）

/* 头部长度常量 */
const HEAD_LEN = 0.44;

/* ============================================================
   2. 渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x01040c, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.00;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  48, window.innerWidth / window.innerHeight, 0.5, 4000
);
camera.position.set(42, 30, 62);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping   = true;
controls.dampingFactor   = 0.06;
controls.minDistance     = 22;
controls.maxDistance     = 220;
controls.enablePan       = false;
controls.autoRotate      = false;
controls.update();

/* ============================================================
   3. 星空背景
   ============================================================ */
(function buildStars(){
  const N = 2800;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);

  for (let i = 0; i < N; i++){
    const r  = 700 + Math.random() * 1200;
    const u  = Math.random() * 2 - 1;
    const ph = Math.random() * Math.PI * 2;
    const s  = Math.sqrt(1 - u * u);

    pos[i*3]     = r * s * Math.cos(ph);
    pos[i*3 + 1] = r * u;
    pos[i*3 + 2] = r * s * Math.sin(ph);

    const t = Math.random();
    col[i*3]     = 0.42 + t * 0.36;
    col[i*3 + 1] = 0.52 + t * 0.26;
    col[i*3 + 2] = 0.78 + t * 0.14;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 1.6, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: 0.62, depthWrite: false,
    blending: THREE.AdditiveBlending
  })));
})();

/* 淡星云 */
(function buildNebula(){
  const mk = (hex, size, x, y, z, op) => {
    const S = 256;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d');
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0.0, hex.replace('1)', '0.34)'));
    grd.addColorStop(0.5, hex.replace('1)', '0.08)'));
    grd.addColorStop(1.0, hex.replace('1)', '0)'));
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);

    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;

    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, blending: THREE.AdditiveBlending,
      transparent: true, depthWrite: false, depthTest: false, opacity: op
    }));
    sp.scale.set(size, size, 1);
    sp.position.set(x, y, z);
    scene.add(sp);
  };

  mk('rgba(70,190,255,1)',  760, -420, 200, -760, 0.42);
  mk('rgba(200,90,255,1)',  580,  560, 260, -800, 0.30);
  mk('rgba(60,255,220,1)',  500,  180, -140, -600, 0.22);
})();

/* ============================================================
   4. 传播轴 + 坐标参考
   ============================================================ */
(function buildAxis(){
  /* Z 传播轴 —— 暗青细线 */
  const zPts = [
    new THREE.Vector3(0, 0, Z_MIN - 3),
    new THREE.Vector3(0, 0, Z_MAX + 3)
  ];
  const zLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(zPts),
    new THREE.LineBasicMaterial({
      color: 0x2f7fb8, transparent: true, opacity: 0.52,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  scene.add(zLine);

  /* Z 轴末端箭头 */
  const zArrow = new THREE.Mesh(
    new THREE.ConeGeometry(0.24, 0.9, 14),
    new THREE.MeshBasicMaterial({ color: 0x54b8f0, transparent: true, opacity: 0.75 })
  );
  zArrow.rotation.x = Math.PI / 2;
  zArrow.position.set(0, 0, Z_MAX + 3.4);
  scene.add(zArrow);

  /* 原点 XY 参考小十字（暗） */
  const crossMat = new THREE.LineBasicMaterial({
    color: 0x2a6f9c, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  const refLen = 4.6;

  [[1,0,0,'x'],[-1,0,0,'x'],[0,1,0,'y'],[0,-1,0,'y']].forEach(d => {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0,0,0),
      new THREE.Vector3(d[0]*refLen, d[1]*refLen, 0)
    ]);
    scene.add(new THREE.Line(g, crossMat));
  });

  /* 参考圆环（淡） */
  const ringPts = [];
  for (let i = 0; i <= 96; i++){
    const a = i / 96 * Math.PI * 2;
    ringPts.push(new THREE.Vector3(
      Math.cos(a) * AMP, Math.sin(a) * AMP, 0
    ));
  }
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(ringPts),
    new THREE.LineBasicMaterial({
      color: 0x3a86b8, transparent: true, opacity: 0.22,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  ));
})();

/* ============================================================
   5. 螺旋轨迹曲线（电场矢量端点轨迹）
   ============================================================ */
const curveGeo = new THREE.BufferGeometry();
const curvePos = new Float32Array(N_CURVE * 3);
const curveCol = new Float32Array(N_CURVE * 3);

/* 顶点颜色沿 z 做青→紫渐变 */
for (let i = 0; i < N_CURVE; i++){
  const u = i / (N_CURVE - 1);
  /* 青 → 白蓝 → 品红 */
  const c1 = new THREE.Color(0x36e8ff);
  const c2 = new THREE.Color(0xb8e8ff);
  const c3 = new THREE.Color(0xff6ad6);
  let col;
  if (u < 0.5){
    col = c1.clone().lerp(c2, u / 0.5);
  } else {
    col = c2.clone().lerp(c3, (u - 0.5) / 0.5);
  }
  curveCol[i*3]     = col.r;
  curveCol[i*3 + 1] = col.g;
  curveCol[i*3 + 2] = col.b;
}

curveGeo.setAttribute('position', new THREE.BufferAttribute(curvePos, 3));
curveGeo.setAttribute('color',    new THREE.BufferAttribute(curveCol, 3));

const curveMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.90,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const curveLine = new THREE.Line(curveGeo, curveMat);
curveLine.frustumCulled = false;
curveLine.renderOrder = 6;
scene.add(curveLine);

/* ============================================================
   6. 电场矢量箭头（自定义：圆柱 + 圆锥）
   ============================================================ */
const UP = new THREE.Vector3(0, 1, 0);

function makeArrow(colorHex, radius = 0.055, headR = 0.17){
  const group = new THREE.Group();

  const mat = new THREE.MeshBasicMaterial({
    color: colorHex,
    transparent: true,
    opacity: 0.98,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const shaftGeo = new THREE.CylinderGeometry(radius, radius, 1, 8);
  shaftGeo.translate(0, 0.5, 0);        // 底端在原点
  const shaft = new THREE.Mesh(shaftGeo, mat);

  const head = new THREE.Mesh(new THREE.ConeGeometry(headR, HEAD_LEN, 14), mat);

  group.add(shaft);
  group.add(head);
  group.userData = { shaft, head, mat };

  return group;
}

function updateArrow(group, origin, tip){
  const dx = tip.x - origin.x;
  const dy = tip.y - origin.y;
  const dz = tip.z - origin.z;
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz);

  if (len < 0.06){
    group.visible = false;
    return;
  }
  group.visible = true;

  const dir = new THREE.Vector3(dx, dy, dz).divideScalar(len);
  const q = new THREE.Quaternion().setFromUnitVectors(UP, dir);

  group.position.copy(origin);
  group.quaternion.copy(q);

  const shaftLen = Math.max(0.02, len - HEAD_LEN);
  group.userData.shaft.scale.y = shaftLen;
  group.userData.head.position.y = shaftLen + HEAD_LEN * 0.5;
}

/* ---- 主电场矢量箭头（14 根，沿 z 分布）---- */
const eArrows = [];
const eArrowZ = [];

for (let i = 0; i < N_ARROW; i++){
  /* 沿 z 均匀分布（略向内收） */
  const u  = i / (N_ARROW - 1);
  const zi = Z_MIN + 1.5 + u * (Z_MAX - Z_MIN - 3.0);
  eArrowZ.push(zi);

  const color = 0x66f0ff;   // 亮青
  const g = makeArrow(color, 0.052, 0.165);
  g.renderOrder = 20;
  scene.add(g);
  eArrows.push(g);
}

/* ---- 中心正交分量分解箭头（仅 z = 0 处）---- */
const origin0 = new THREE.Vector3(0, 0, 0);

const arrEx = makeArrow(0xff5566, 0.055, 0.155);   // 红：Ex
arrEx.renderOrder = 22;
scene.add(arrEx);

const arrEy = makeArrow(0x5effa0, 0.055, 0.155);   // 绿：Ey
arrEy.renderOrder = 22;
scene.add(arrEy);

const arrE  = makeArrow(0xffffff, 0.065, 0.185);   // 白：合矢量
arrE.renderOrder = 24;
scene.add(arrE);

/* ---- 分量到合矢量的虚线投影（z = 0 平面）---- */
function makeDashed(colorHex){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  const m = new THREE.LineDashedMaterial({
    color: colorHex, dashSize: 0.36, gapSize: 0.24,
    transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const line = new THREE.Line(g, m);
  line.frustumCulled = false;
  line.renderOrder = 18;
  scene.add(line);
  return line;
}

const dash1 = makeDashed(0x8a9bb5);   // Ex 端 → 矢量端
const dash2 = makeDashed(0x8a9bb5);   // Ey 端 → 矢量端

/* ============================================================
   7. 计算电场
   ============================================================ */
function computeE(z, t){
  const theta = K_WAVE * z - OMEGA * t;
  const ex = AMP * Math.cos(theta);
  const ey = AMP * Math.cos(theta + PHI);
  return [ex, ey];
}

/* ============================================================
   8. 后期辉光
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.55,   // strength
  0.52,   // radius
  0.72    // threshold
);
composer.addPass(bloom);

/* ============================================================
   9. 背景音效（Web Audio）
   ============================================================ */
let audioCtx = null;
let masterGain = null;
let audioOn = false;

function buildAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(audioCtx.destination);

  /* 主低通滤波 */
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = 420;
  filt.Q.value = 1.6;
  filt.connect(masterGain);

  /* 低频 drone */
  const voices = [
    { f: 49.00,  type: 'sine',     g: 0.46, det: -5 },
    { f: 73.42,  type: 'sine',     g: 0.30, det:  4 },
    { f: 98.00,  type: 'triangle', g: 0.16, det: -8 },
    { f: 146.83, type: 'sine',     g: 0.08, det:  6 },
    { f: 196.00, type: 'sine',     g: 0.045, det: -3 }
  ];

  voices.forEach(v => {
    const o = audioCtx.createOscillator();
    o.type = v.type;
    o.frequency.value = v.f;
    o.detune.value = v.det;

    const g = audioCtx.createGain();
    g.gain.value = v.g;

    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.026 + Math.random() * 0.05;

    const lg = audioCtx.createGain();
    lg.gain.value = v.g * 0.48;
    lfo.connect(lg);
    lg.connect(g.gain);
    lfo.start();

    o.connect(g);
    g.connect(filt);
    o.start();
  });

  /* 滤波扫频 */
  const sweep = audioCtx.createOscillator();
  sweep.type = 'sine';
  sweep.frequency.value = 0.035;

  const sweepGain = audioCtx.createGain();
  sweepGain.gain.value = 300;

  sweep.connect(sweepGain);
  sweepGain.connect(filt.frequency);
  sweep.start();

  /* 电磁"嗡"声层（带通噪声） */
  const bufLen = audioCtx.sampleRate * 4;
  const buffer = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for (let i = 0; i < bufLen; i++){
    const white = Math.random() * 2 - 1;
    last = (last + 0.022 * white) / 1.022;
    data[i] = last * 3.6;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  noise.loop = true;

  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 620;
  nf.Q.value = 0.72;

  const ng = audioCtx.createGain();
  ng.gain.value = 0.11;

  noise.connect(nf);
  nf.connect(ng);
  ng.connect(masterGain);
  noise.start();

  /* 高频"滋滋"层 */
  const bufLen2 = audioCtx.sampleRate * 3;
  const buffer2 = audioCtx.createBuffer(1, bufLen2, audioCtx.sampleRate);
  const d2 = buffer2.getChannelData(0);
  for (let i = 0; i < bufLen2; i++){
    d2[i] = (Math.random() * 2 - 1) * 0.52;
  }

  const hiss = audioCtx.createBufferSource();
  hiss.buffer = buffer2;
  hiss.loop = true;

  const hf = audioCtx.createBiquadFilter();
  hf.type = 'bandpass';
  hf.frequency.value = 3200;
  hf.Q.value = 2.2;

  const hg = audioCtx.createGain();
  hg.gain.value = 0.018;

  hiss.connect(hf);
  hf.connect(hg);
  hg.connect(masterGain);
  hiss.start();

  /* 旋转脉冲（模拟电场旋转） */
  const pulseGain = audioCtx.createGain();
  pulseGain.gain.value = 0.0;
  pulseGain.connect(masterGain);

  const pulseOsc = audioCtx.createOscillator();
  pulseOsc.type = 'sine';
  pulseOsc.frequency.value = 196;
  pulseOsc.connect(pulseGain);
  pulseOsc.start();

  const pulseLfo = audioCtx.createOscillator();
  pulseLfo.type = 'sine';
  pulseLfo.frequency.value = 0.18;

  const pulseDepth = audioCtx.createGain();
  pulseDepth.gain.value = 0.028;
  pulseLfo.connect(pulseDepth);
  pulseDepth.connect(pulseGain.gain);
  pulseLfo.start();
}

const audioBtn = document.getElementById('audioBtn');

audioBtn.addEventListener('click', () => {
  if (!audioCtx) buildAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  if (!audioOn){
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(0.15, audioCtx.currentTime, 1.2);
    audioBtn.textContent = '♪  关闭音效';
    audioBtn.classList.add('on');
    audioOn = true;
  } else {
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.6);
    audioBtn.textContent = '♪  开启音效';
    audioBtn.classList.remove('on');
    audioOn = false;
  }
});

/* ============================================================
   10. UI 控制
   ============================================================ */
const phaseSlider = document.getElementById('phaseSlider');
const phaseVal    = document.getElementById('phaseVal');
const polBadge    = document.getElementById('polBadge');
const hudEx       = document.getElementById('hudEx');
const hudEy       = document.getElementById('hudEy');
const hudPhi      = document.getElementById('hudPhi');
const miniBtns    = document.querySelectorAll('.mini-btn');

function setPhi(deg){
  const d = ((deg % 360) + 360) % 360;
  PHI = d * Math.PI / 180;
  phaseSlider.value = d;
  phaseVal.textContent = d + '°';
  hudPhi.textContent   = d + '°';

  /* 判定偏振态 */
  const s = Math.abs(Math.sin(PHI));
  let name, cls;
  if (s < 0.06){
    name = '线偏振'; cls = 'linear';
  } else if (s > 0.985){
    name = (d < 180) ? '圆偏振 ⟲' : '圆偏振 ⟳'; cls = 'circ';
  } else {
    name = '椭圆偏振'; cls = '';
  }
  polBadge.textContent = name;
  polBadge.className = 'pol-badge ' + cls;
}

phaseSlider.addEventListener('input', e => {
  setPhi(parseFloat(e.target.value));
  miniBtns.forEach(b => b.classList.remove('active'));
});

miniBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const d = parseFloat(btn.dataset.phi);
    setPhi(d);
    miniBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

/* 初始化 */
setPhi(90);

/* ============================================================
   11. 主循环
   ============================================================ */
const clock = new THREE.Clock();
let simTime = 0;

const tmpOrigin = new THREE.Vector3();
const tmpTip    = new THREE.Vector3();

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  const t = simTime;

  /* ---------- 1. 更新螺旋轨迹曲线 ---------- */
  const cPos = curveGeo.attributes.position.array;
  for (let i = 0; i < N_CURVE; i++){
    const u  = i / (N_CURVE - 1);
    const zi = Z_MIN + u * (Z_MAX - Z_MIN);
    const theta = K_WAVE * zi - OMEGA * t;
    const ex = AMP * Math.cos(theta);
    const ey = AMP * Math.cos(theta + PHI);

    cPos[i*3]     = ex;
    cPos[i*3 + 1] = ey;
    cPos[i*3 + 2] = zi;
  }
  curveGeo.attributes.position.needsUpdate = true;

  /* ---------- 2. 更新 14 根电场矢量箭头 ---------- */
  for (let i = 0; i < N_ARROW; i++){
    const zi = eArrowZ[i];
    const theta = K_WAVE * zi - OMEGA * t;
    const ex = AMP * Math.cos(theta);
    const ey = AMP * Math.cos(theta + PHI);

    tmpOrigin.set(0, 0, zi);
    tmpTip.set(ex, ey, zi);

    updateArrow(eArrows[i], tmpOrigin, tmpTip);
  }

  /* ---------- 3. 中心正交分量分解 ---------- */
  const th0 = -OMEGA * t;                 // z = 0 处相位
  const ex0 = AMP * Math.cos(th0);
  const ey0 = AMP * Math.cos(th0 + PHI);

  origin0.set(0, 0, 0);

  /* Ex 分量箭头（红） */
  tmpTip.set(ex0, 0, 0);
  updateArrow(arrEx, origin0, tmpTip);

  /* Ey 分量箭头（绿） */
  tmpTip.set(0, ey0, 0);
  updateArrow(arrEy, origin0, tmpTip);

  /* 合矢量箭头（白） */
  tmpTip.set(ex0, ey0, 0);
  updateArrow(arrE, origin0, tmpTip);

  /* 虚线投影 */
  /* dash1: (ex0, 0, 0) → (ex0, ey0, 0) */
  const p1 = dash1.geometry.attributes.position;
  p1.setXYZ(0, ex0, 0, 0);
  p1.setXYZ(1, ex0, ey0, 0);
  p1.needsUpdate = true;
  dash1.computeLineDistances();

  /* dash2: (0, ey0, 0) → (ex0, ey0, 0) */
  const p2 = dash2.geometry.attributes.position;
  p2.setXYZ(0, 0, ey0, 0);
  p2.setXYZ(1, ex0, ey0, 0);
  p2.needsUpdate = true;
  dash2.computeLineDistances();

  /* ---------- 4. HUD 数值（取中心 z=0 的瞬时分量）---------- */
  hudEx.textContent = (ex0 / AMP).toFixed(2);
  hudEy.textContent = (ey0 / AMP).toFixed(2);

  /* ---------- 5. 渲染 ---------- */
  controls.update();
  composer.render();
}

renderer.setAnimationLoop(animate);

/* ============================================================
   12. 自适应
   ============================================================ */
window.addEventListener('resize', () => {
  const W = window.innerWidth;
  const H = window.innerHeight;

  camera.aspect = W / H;
  camera.updateProjectionMatrix();

  const pr = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(pr);
  renderer.setSize(W, H);

  composer.setSize(W, H);
  bloom.setSize(W, H);
});
</script>
