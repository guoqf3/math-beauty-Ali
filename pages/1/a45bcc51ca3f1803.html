<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>十二律吕 · 三分损益</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#05070c;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    color:#c8d4e4; user-select:none; -webkit-tap-highlight-color:transparent;
    cursor:grab;
  }
  html.dragging, html.dragging body { cursor:grabbing; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }

  #hud {
    position:fixed; top:22px; left:26px; z-index:5;
    pointer-events:none; font-size:12px; line-height:1.72;
    letter-spacing:0.03em; text-shadow:0 0 22px rgba(0,0,0,0.95);
  }
  #hud .title {
    font-size:18px; font-weight:300; letter-spacing:0.3em;
    color:#e0dcd0; margin-bottom:2px;
  }
  #hud .sub {
    font-size:10px; letter-spacing:0.26em;
    color:rgba(180,170,150,0.45); margin-bottom:14px;
  }
  #hud .row { display:flex; gap:9px; font-variant-numeric:tabular-nums; }
  #hud .k { color:rgba(170,160,140,0.42); width:46px; }
  #hud .v { color:#e0d4b8; }

  #info {
    position:fixed; bottom:26px; left:26px; z-index:5;
    min-width:232px;
    padding:14px 18px 15px;
    background:rgba(10,14,22,0.78);
    border:1px solid rgba(160,140,100,0.22);
    border-radius:12px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    pointer-events:none;
    transition:opacity 0.35s, transform 0.35s;
  }
  #info.hide { opacity:0; transform:translateY(10px); }
  #info .nm {
    font-size:22px; font-weight:300; letter-spacing:0.22em;
    color:#f0e2c8; margin-bottom:3px;
    font-family:"KaiTi","STKaiti","Songti SC",serif;
  }
  #info .sub {
    font-size:10px; letter-spacing:0.2em;
    color:rgba(180,170,150,0.5); margin-bottom:11px;
  }
  #info .fm {
    font-size:12px; letter-spacing:0.04em;
    color:#ffd89b; font-variant-numeric:tabular-nums;
    margin-bottom:9px; padding-bottom:9px;
    border-bottom:1px solid rgba(180,160,120,0.13);
    line-height:1.5;
  }
  #info .fm .op { color:#7fe4ff; }
  #info .row {
    display:flex; justify-content:space-between;
    font-size:11px; margin-bottom:4px;
    color:rgba(190,180,160,0.6);
  }
  #info .row b {
    color:#e8dcc0; font-weight:500;
    font-variant-numeric:tabular-nums;
  }

  .btn {
    position:fixed; z-index:6;
    padding:10px 19px;
    background:rgba(14,20,30,0.74);
    border:1px solid rgba(160,150,120,0.24);
    border-radius:999px;
    color:#c8bca0; font-size:12px; letter-spacing:0.14em;
    font-family:inherit; cursor:pointer;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  .btn:hover {
    background:rgba(40,46,58,0.82);
    border-color:rgba(220,200,150,0.55);
    color:#f0e4c8;
  }
  .btn.on {
    background:rgba(90,76,48,0.55);
    border-color:rgba(255,226,170,0.7);
    color:#fff2d8;
    box-shadow:0 0 24px rgba(255,210,140,0.22);
  }
  #btn-spin  { right:24px; bottom:24px; }
  #btn-reset { right:24px; bottom:76px; }

  #hint {
    position:fixed; bottom:30px; right:26px; z-index:5;
    font-size:10.5px; letter-spacing:0.1em;
    color:rgba(170,160,140,0.4);
    pointer-events:none; transition:opacity 0.9s;
    text-align:right;
  }
  #hint.hide { opacity:0; }

  @media (max-width:720px) {
    #hud { top:14px; left:14px; font-size:10.5px; }
    #hud .title { font-size:14px; letter-spacing:0.22em; }
    #info { bottom:16px; left:14px; min-width:170px; padding:10px 13px; }
    #info .nm { font-size:17px; }
    #info .fm { font-size:10.5px; }
    #info .row { font-size:10px; }
    .btn { padding:8px 13px; font-size:11px; }
    #btn-spin  { right:12px; bottom:14px; }
    #btn-reset { right:12px; bottom:56px; }
    #hint { left:14px; right:auto; bottom:auto; top:auto; }
    #hint { display:none; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="hud">
  <div class="title">十二律吕</div>
  <div class="sub">三分损益 · 编钟阵列</div>
  <div class="row"><span class="k">悬停</span><span class="v" id="v-hover">—</span></div>
  <div class="row"><span class="k">点击</span><span class="v" id="v-click">—</span></div>
</div>

<div id="info" class="hide">
  <div class="nm" id="i-name">—</div>
  <div class="sub" id="i-sub">—</div>
  <div class="fm" id="i-formula">—</div>
  <div class="row"><span>律管长度</span><b id="i-len">—</b></div>
  <div class="row"><span>频率</span><b id="i-freq">—</b></div>
  <div class="row"><span>对应音名</span><b id="i-note">—</b></div>
</div>

<button class="btn on" id="btn-spin">自动环视</button>
<button class="btn" id="btn-reset">重置视角</button>
<div id="hint">拖动旋转 · 滚轮缩放<br>悬停律管看三分损益 · 点击奏响</div>

<script>
(() => {
'use strict';

// ============================================================
//  画布
// ============================================================
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, focal = 0;

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W * 0.5;
  cy = H * 0.54;
  focal = Math.min(W, H) * 1.05;
}

// ============================================================
//  十二律吕数据
//  生成顺序（三分损益）：
//  黄钟 81 → 林钟 54 → 太簇 72 → 南吕 48 → 姑洗 64 → 应钟 42.667
//       → 蕤宾 56.889 → 大吕 75.852 → 夷则 50.568 → 夹钟 67.424
//       → 无射 44.949 → 仲吕 59.932
// ============================================================
const FREQ_K = 261.63 * 81;  // 黄钟 = C4

const LÜ = [
  { name:'黄钟', len:81.0000, prev:null,          tone:'宫',   op:'基准' },
  { name:'大吕', len:75.8519, prev:'蕤宾',        tone:'清宫', op:'× 4/3' },
  { name:'太簇', len:72.0000, prev:'林钟',        tone:'商',   op:'× 4/3' },
  { name:'夹钟', len:67.4238, prev:'夷则',        tone:'清商', op:'× 4/3' },
  { name:'姑洗', len:64.0000, prev:'南吕',        tone:'角',   op:'× 4/3' },
  { name:'仲吕', len:59.9323, prev:'无射',        tone:'清角', op:'× 4/3' },
  { name:'蕤宾', len:56.8889, prev:'应钟',        tone:'变徵', op:'× 4/3' },
  { name:'林钟', len:54.0000, prev:'黄钟',        tone:'徵',   op:'× 2/3' },
  { name:'夷则', len:50.5679, prev:'大吕',        tone:'清徵', op:'× 2/3' },
  { name:'南吕', len:48.0000, prev:'太簇',        tone:'羽',   op:'× 2/3' },
  { name:'无射', len:44.9492, prev:'夹钟',        tone:'清羽', op:'× 2/3' },
  { name:'应钟', len:42.6667, prev:'姑洗',        tone:'变宫', op:'× 2/3' },
];

// 补全频率与音名
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
LÜ.forEach((l, i) => {
  l.freq = FREQ_K / l.len;
  l.hue  = (40 + i * 20) % 360;
  l.midi = Math.round(69 + 12 * Math.log2(l.freq / 440));
  l.note = NOTE_NAMES[l.midi % 12] + (Math.floor(l.midi / 12) - 1);

  // 生成公式文本
  if (l.prev) {
    const prev = LÜ.find(x => x.name === l.prev);
    l.formula = `${l.prev} ${prev.len.toFixed(2)} ${l.op} = ${l.len.toFixed(2)}`;
  } else {
    l.formula = `黄钟基准 81.00（宫）`;
  }
});

// ============================================================
//  几何构建
// ============================================================
const ARC_R  = 5.2;     // 律管圆弧半径
const ARC_A0 = -70 * Math.PI / 180;
const ARC_A1 =  70 * Math.PI / 180;
const TUBE_R = 0.27;    // 律管半径
const TUBE_MAX_H = 4.2; // 最长律管高度
const H_SCALE = TUBE_MAX_H / 81;

// 编钟背景弧
const BELL_R = 9.2;
const BELL_A0 = -88 * Math.PI / 180;
const BELL_A1 =  88 * Math.PI / 180;
const BELL_COUNT = 12;

const tubes = [];
const bells = [];

function buildScene() {
  tubes.length = 0;
  bells.length = 0;

  // 律管
  for (let i = 0; i < 12; i++) {
    const a = ARC_A0 + (ARC_A1 - ARC_A0) * (i / 11);
    const l = LÜ[i];
    const h = l.len * H_SCALE;

    tubes.push({
      ...l,
      angle: a,
      bx: ARC_R * Math.sin(a),
      bz: -ARC_R * Math.cos(a),
      by: 0,
      height: h,
      radius: TUBE_R,
      idx: i,
      pulse: 0,
      hover: 0,
      glow: 0,
      projBot: null,
      projTop: null,
      projMid: null,
    });
  }

  // 编钟
  for (let i = 0; i < BELL_COUNT; i++) {
    const a = BELL_A0 + (BELL_A1 - BELL_A0) * (i / (BELL_COUNT - 1));
    const l = LÜ[i];
    bells.push({
      angle: a,
      bx: BELL_R * Math.sin(a),
      bz: -BELL_R * Math.cos(a),
      by: 0,
      height: 1.65,
      widthBot: 0.94,
      widthTop: 0.62,
      hue: 168 + (i % 3) * 8,
      idx: i,
      freq: l.freq * 0.5,
      name: l.name,
      pulse: 0,
      hover: 0,
      projBot: null,
      projTop: null,
    });
  }
}

// ============================================================
//  相机
// ============================================================
const cam = {
  theta: 0,
  phi: 0.24,
  dist: 15.2,
  target: { x:0, y:2.0, z:0 },
};
const camTarget = {
  theta: 0,
  phi: 0.24,
};

const camState = {
  dragging: false,
  lastX: 0,
  lastY: 0,
  spin: true,
  spinSpeed: 0.14,
};

// ============================================================
//  3D 投影
// ============================================================
function project(p) {
  const cp = Math.cos(cam.phi), sp = Math.sin(cam.phi);
  const ct = Math.cos(cam.theta), st = Math.sin(cam.theta);

  const eyeX = cam.target.x + cam.dist * cp * st;
  const eyeY = cam.target.y + cam.dist * sp;
  const eyeZ = cam.target.z + cam.dist * cp * ct;

  let fx = cam.target.x - eyeX;
  let fy = cam.target.y - eyeY;
  let fz = cam.target.z - eyeZ;
  const fl = Math.hypot(fx, fy, fz) || 1;
  fx /= fl; fy /= fl; fz /= fl;

  // right = normalize(cross(f, up))  where up=(0,1,0)
  let rx = -fz, ry = 0, rz = fx;
  const rl = Math.hypot(rx, ry, rz) || 1;
  rx /= rl; ry /= rl; rz /= rl;

  // up = cross(right, forward)
  const ux = ry * fz - rz * fy;
  const uy = rz * fx - rx * fz;
  const uz = rx * fy - ry * fx;

  const dx = p.x - eyeX;
  const dy = p.y - eyeY;
  const dz = p.z - eyeZ;

  const vx = dx * rx + dy * ry + dz * rz;
  const vy = dx * ux + dy * uy + dz * uz;
  const vz = dx * fx + dy * fy + dz * fz;

  if (vz < 0.4) return null;

  const f = focal / vz;
  return {
    x: cx + vx * f,
    y: cy - vy * f,
    z: vz,
    scale: f,
  };
}

// ============================================================
//  音频 —— 编钟
// ============================================================
const audio = {
  ctx: null,
  master: null,
  reverb: null,
  ready: false,
};

function makeIR(actx, dur, decay) {
  const rate = actx.sampleRate;
  const len = Math.floor(rate * dur);
  const buf = actx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      d[i] = (Math.random()*2 - 1) * Math.pow(1 - t, decay);
    }
  }
  return buf;
}

function ensureAudio() {
  if (audio.ctx) {
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const actx = new AC();
  audio.ctx = actx;

  const master = actx.createGain();
  master.gain.value = 0.46;
  master.connect(actx.destination);
  audio.master = master;

  const conv = actx.createConvolver();
  conv.buffer = makeIR(actx, 6.5, 2.7);
  const wet = actx.createGain();
  wet.gain.value = 0.68;
  conv.connect(wet);
  wet.connect(master);
  audio.reverb = conv;

  audio.ready = true;
}

/**
 * 编钟音色
 * 分音：1, 2, 2.76, 4, 5.4, 6.8, 8.4, 10.2
 * 非谐分音赋予编钟特有的金属感
 */
function playBell(freq, vel, dur, brightness) {
  ensureAudio();
  if (!audio.ready) return;
  const actx = audio.ctx;
  const t0 = actx.currentTime;
  const v = clamp(vel, 0.04, 1);
  const D = dur || 5.0;
  const br = brightness !== undefined ? brightness : 1;

  const out = actx.createGain();
  out.gain.value = 0.9;
  out.connect(audio.master);
  out.connect(audio.reverb);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = clamp(freq * (6 + br * 6) + 2000, 1200, 14000);
  lp.Q.value = 0.35;
  lp.connect(out);

  const partials = [
    { m: 1.000, g: 1.00, d: D },
    { m: 2.000, g: 0.50 * br, d: D * 0.85 },
    { m: 2.760, g: 0.32 * br, d: D * 0.66 },
    { m: 4.000, g: 0.16 * br, d: D * 0.48 },
    { m: 5.400, g: 0.082 * br, d: D * 0.33 },
    { m: 6.800, g: 0.042 * br, d: D * 0.22 },
    { m: 8.400, g: 0.020 * br, d: D * 0.15 },
    { m: 10.20, g: 0.009 * br, d: D * 0.10 },
  ];

  for (const p of partials) {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq * p.m;
    o.detune.value = (Math.random() - 0.5) * 4;

    const g = actx.createGain();
    const peak = 0.095 * v * p.g;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.00005, t0 + p.d);

    o.connect(g);
    g.connect(lp);
    o.start(t0);
    o.stop(t0 + p.d + 0.12);
  }

  // 击打瞬态
  const nlen = Math.floor(actx.sampleRate * 0.065);
  const nbuf = actx.createBuffer(1, nlen, actx.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) {
    nd[i] = (Math.random()*2 - 1) * Math.pow(1 - i/nlen, 4);
  }
  const ns = actx.createBufferSource();
  ns.buffer = nbuf;

  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = clamp(freq * 5.5, 700, 7000);
  nf.Q.value = 1.4;

  const ng = actx.createGain();
  ng.gain.value = 0.075 * v;

  ns.connect(nf);
  nf.connect(ng);
  ng.connect(out);
  ns.start(t0);
}

// ============================================================
//  状态
// ============================================================
let nowT = 0;
const pulses = [];

const input = {
  mode: null,        // 'orbit'
  hoverTube: -1,
  hoverBell: -1,
  moved: false,
  startX: 0, startY: 0,
};

// ============================================================
//  点到线段距离
// ============================================================
function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  if (len2 < 0.001) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / len2;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + dx*t), py - (ay + dy*t));
}

// ============================================================
//  渲染 —— 背景
// ============================================================
let bgGrad = null, bgKey = '';

function drawBackground() {
  const key = W + 'x' + H;
  if (key !== bgKey) {
    bgGrad = ctx.createRadialGradient(
      W * 0.5, H * 0.52, 0,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.8
    );
    bgGrad.addColorStop(0,    '#10182a');
    bgGrad.addColorStop(0.4,  '#080c18');
    bgGrad.addColorStop(1,    '#05070c');
    bgKey = key;
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 地面同心圆
  ctx.save();
  ctx.strokeStyle = 'rgba(120, 150, 190, 0.032)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 6; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy + H * 0.06, i * Math.min(W, H) * 0.10, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
//  地面反射
// ============================================================
function drawGround() {
  // 简单的椭圆地面阴影
  ctx.save();
  const g = ctx.createRadialGradient(
    cx, cy + H * 0.06, 0,
    cx, cy + H * 0.06, Math.min(W, H) * 0.5
  );
  g.addColorStop(0, 'rgba(30, 44, 70, 0.22)');
  g.addColorStop(0.6, 'rgba(18, 28, 46, 0.08)');
  g.addColorStop(1, 'rgba(10, 14, 24, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(cx, cy + H * 0.06, Math.min(W, H) * 0.52, Math.min(W, H) * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ============================================================
//  绘制 —— 编钟
// ============================================================
function drawBell(bell, t) {
  if (!bell.projBot || !bell.projTop) return;

  const bp = bell.projBot;
  const tp = bell.projTop;

  const baseW = bell.widthBot * bp.scale;
  const topW  = bell.widthTop * tp.scale;

  const pulse = bell.pulse;
  const hover = bell.hover;

  const hue = bell.hue;
  const light = 44 + pulse * 26 + hover * 12;
  const sat = 42 + pulse * 22;

  ctx.save();

  // 光晕
  if (pulse > 0.02 || hover > 0.02) {
    const halo = ctx.createRadialGradient(
      bp.x, (bp.y + tp.y) * 0.5, 0,
      bp.x, (bp.y + tp.y) * 0.5, baseW * (2.2 + pulse * 1.2)
    );
    halo.addColorStop(0, `hsla(${hue}, 80%, 70%, ${0.24 * (pulse + hover)})`);
    halo.addColorStop(1, `hsla(${hue}, 80%, 70%, 0)`);
    ctx.fillStyle = halo;
    ctx.fillRect(
      bp.x - baseW * 3.5, tp.y - baseW * 0.6,
      baseW * 7, bp.y - tp.y + baseW * 1.4
    );
  }

  // 钟身（梯形）
  ctx.beginPath();
  ctx.moveTo(tp.x - topW * 0.5, tp.y);
  ctx.lineTo(tp.x + topW * 0.5, tp.y);
  ctx.lineTo(bp.x + baseW * 0.5, bp.y);
  ctx.lineTo(bp.x - baseW * 0.5, bp.y);
  ctx.closePath();

  const grd = ctx.createLinearGradient(
    bp.x - baseW * 0.5, 0,
    bp.x + baseW * 0.5, 0
  );
  grd.addColorStop(0,    `hsla(${hue}, ${sat}%, ${light - 18}%, 0.94)`);
  grd.addColorStop(0.32, `hsla(${hue}, ${sat}%, ${light + 14}%, 0.96)`);
  grd.addColorStop(0.55, `hsla(${hue}, ${sat - 6}%, ${light + 24}%, 0.92)`);
  grd.addColorStop(1,    `hsla(${hue}, ${sat}%, ${light - 22}%, 0.92)`);

  ctx.fillStyle = grd;
  ctx.shadowColor = `hsla(${hue}, 70%, 60%, ${0.35 + pulse * 0.5})`;
  ctx.shadowBlur = 12 + pulse * 26;
  ctx.fill();
  ctx.shadowBlur = 0;

  // 钟体纹饰
  ctx.beginPath();
  ctx.moveTo(tp.x - topW * 0.5, tp.y);
  ctx.lineTo(tp.x + topW * 0.5, tp.y);
  ctx.lineTo(bp.x + baseW * 0.5, bp.y);
  ctx.lineTo(bp.x - baseW * 0.5, bp.y);
  ctx.closePath();
  ctx.strokeStyle = `hsla(${hue}, 60%, 78%, ${0.42 + pulse * 0.4})`;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 横向乳钉纹
  const rows = 3;
  for (let r = 1; r <= rows; r++) {
    const k = r / (rows + 1);
    const yy = lerp(tp.y, bp.y, k);
    const w = lerp(topW, baseW, k);
    ctx.beginPath();
    ctx.moveTo(bp.x - w * 0.42, yy);
    ctx.lineTo(bp.x + w * 0.42, yy);
    ctx.strokeStyle = `hsla(${hue}, 55%, 68%, ${0.28 + pulse * 0.3})`;
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }

  // 顶部椭圆（钟顶）
  ctx.beginPath();
  ctx.ellipse(
    tp.x, tp.y,
    topW * 0.5, topW * 0.5 * 0.36,
    0, 0, Math.PI * 2
  );
  ctx.fillStyle = `hsla(${hue}, 48%, ${light - 6}%, 0.98)`;
  ctx.fill();
  ctx.strokeStyle = `hsla(${hue}, 62%, 78%, ${0.5 + pulse * 0.4})`;
  ctx.lineWidth = 1.1;
  ctx.stroke();

  // 钟钮
  ctx.beginPath();
  ctx.arc(tp.x, tp.y - topW * 0.34, topW * 0.15, 0, Math.PI * 2);
  ctx.fillStyle = `hsla(${hue}, 50%, ${light + 8}%, 0.85)`;
  ctx.fill();

  ctx.restore();
}

// ============================================================
//  绘制 —— 律管
// ============================================================
function drawTube(tube, t) {
  if (!tube.projBot || !tube.projTop) return;

  const bp = tube.projBot;
  const tp = tube.projTop;

  const wBot = tube.radius * bp.scale * 2;
  const wTop = tube.radius * tp.scale * 2;
  const avgW = (wBot + wTop) * 0.5;

  const pulse = tube.pulse;
  const hover = tube.hover;

  const hue = tube.hue;
  const light = 48 + pulse * 22 + hover * 16;
  const sat = 52 + pulse * 20;
  const bright = 1 + pulse * 0.4 + hover * 0.25;

  ctx.save();

  // 地面阴影
  ctx.beginPath();
  ctx.ellipse(bp.x, bp.y + avgW * 0.12, avgW * 0.9, avgW * 0.28, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
  ctx.fill();

  // 外光晕
  const haloR = avgW * (3.4 + pulse * 2.6 + hover * 1.6);
  const halo = ctx.createRadialGradient(
    tp.x, tp.y, 0,
    tp.x, tp.y, haloR
  );
  halo.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 20}%, ${0.32 + pulse * 0.35 + hover * 0.2})`);
  halo.addColorStop(0.42, `hsla(${hue}, ${sat}%, ${light}%, ${0.10 + pulse * 0.16})`);
  halo.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(tp.x, tp.y, haloR, 0, Math.PI * 2);
  ctx.fill();

  // 管身：粗线
  ctx.beginPath();
  ctx.moveTo(bp.x, bp.y);
  ctx.lineTo(tp.x, tp.y);
  ctx.lineWidth = avgW;
  ctx.lineCap = 'round';

  const grd = ctx.createLinearGradient(
    bp.x - avgW * 0.6, 0,
    bp.x + avgW * 0.6, 0
  );
  const l1 = Math.max(10, light - 32);
  const l2 = Math.min(88, light + 10);
  const l3 = Math.min(96, light + 30);
  const l4 = Math.max(12, light - 26);

  grd.addColorStop(0,    `hsla(${hue}, ${sat - 12}%, ${l1}%, 1)`);
  grd.addColorStop(0.30, `hsla(${hue}, ${sat}%, ${l2}%, 1)`);
  grd.addColorStop(0.50, `hsla(${hue}, ${sat - 8}%, ${l3}%, 1)`);
  grd.addColorStop(0.72, `hsla(${hue}, ${sat}%, ${l2}%, 1)`);
  grd.addColorStop(1,    `hsla(${hue}, ${sat - 12}%, ${l4}%, 1)`);

  ctx.strokeStyle = grd;
  ctx.shadowColor = `hsla(${hue}, 80%, 65%, ${0.28 + pulse * 0.6 + hover * 0.3})`;
  ctx.shadowBlur = 14 + pulse * 28 + hover * 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 管身高光线
  ctx.beginPath();
  ctx.moveTo(bp.x - avgW * 0.18, bp.y);
  ctx.lineTo(tp.x - avgW * 0.18, tp.y);
  ctx.lineWidth = Math.max(0.9, avgW * 0.16);
  ctx.strokeStyle = `rgba(255, 255, 255, ${0.14 + pulse * 0.28 + hover * 0.16})`;
  ctx.stroke();

  // 底部椭圆
  ctx.beginPath();
  ctx.ellipse(
    bp.x, bp.y,
    avgW * 0.5, avgW * 0.5 * 0.34,
    0, 0, Math.PI * 2
  );
  ctx.fillStyle = `hsla(${hue}, ${sat - 10}%, ${l1}%, 0.96)`;
  ctx.fill();

  // 顶部管口
  const topRX = avgW * 0.5;
  const topRY = avgW * 0.5 * 0.34;

  // 外环
  ctx.beginPath();
  ctx.ellipse(tp.x, tp.y, topRX, topRY, 0, 0, Math.PI * 2);
  ctx.fillStyle = `hsla(${hue}, ${sat}%, ${l3}%, 0.98)`;
  ctx.fill();
  ctx.strokeStyle = `hsla(${hue}, ${sat + 10}%, ${Math.min(94, l3 + 22)}%, ${0.7 + pulse * 0.3})`;
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // 内孔（空心）
  ctx.beginPath();
  ctx.ellipse(tp.x, tp.y, topRX * 0.62, topRY * 0.62, 0, 0, Math.PI * 2);
  ctx.fillStyle = `hsla(${hue}, ${sat + 14}%, 10%, 0.94)`;
  ctx.fill();

  // 内孔边缘
  ctx.beginPath();
  ctx.ellipse(tp.x, tp.y, topRX * 0.62, topRY * 0.62, 0, 0, Math.PI * 2);
  ctx.strokeStyle = `hsla(${hue}, ${sat + 20}%, ${Math.min(96, l3 + 34)}%, ${0.55 + pulse * 0.4})`;
  ctx.lineWidth = 0.9;
  ctx.stroke();

  // 脉冲环
  if (pulse > 0.02) {
    const ringR = avgW * 0.6 + (1 - pulse) * avgW * 3.0;
    ctx.beginPath();
    ctx.arc(tp.x, tp.y, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${hue}, ${sat + 16}%, ${Math.min(94, l3 + 30)}%, ${pulse * 0.62})`;
    ctx.lineWidth = 2.0 * pulse;
    ctx.shadowColor = `hsla(${hue}, 85%, 70%, ${pulse * 0.9})`;
    ctx.shadowBlur = 18 * pulse;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(tp.x, tp.y, ringR * 0.68, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${hue}, ${sat + 16}%, ${Math.min(94, l3 + 30)}%, ${pulse * 0.3})`;
    ctx.lineWidth = 1.2 * pulse;
    ctx.stroke();
  }

  ctx.restore();
}

// ============================================================
//  脉冲
// ============================================================
function drawPulses(t) {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    const age = t - p.t0;
    if (age > 1.5) { pulses.splice(i, 1); continue; }

    const k = age / 1.5;
    const r = p.baseR + k * Math.max(W, H) * 0.35;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${p.hue}, 82%, 70%, ${(1 - k) * 0.52})`;
    ctx.lineWidth = 2.4 * (1 - k);
    ctx.shadowColor = `hsla(${p.hue}, 82%, 70%, ${(1 - k) * 0.85})`;
    ctx.shadowBlur = 20 * (1 - k);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 0.6, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${p.hue}, 82%, 78%, ${(1 - k) * 0.26})`;
    ctx.lineWidth = 1.3 * (1 - k);
    ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.restore();
  }
}

// ============================================================
//  HUD & 信息面板
// ============================================================
const elHover = document.getElementById('v-hover');
const elClick = document.getElementById('v-click');

const infoEl  = document.getElementById('info');
const iName   = document.getElementById('i-name');
const iSub    = document.getElementById('i-sub');
const iFormula= document.getElementById('i-formula');
const iLen    = document.getElementById('i-len');
const iFreq   = document.getElementById('i-freq');
const iNote   = document.getElementById('i-note');

let hudT = 0;

function updateHUD(dt) {
  hudT += dt;
  if (hudT < 0.09) return;
  hudT = 0;
}

function showInfo(tube) {
  if (!tube) {
    infoEl.classList.add('hide');
    elHover.textContent = '—';
    return;
  }

  infoEl.classList.remove('hide');
  iName.textContent = tube.name;
  iSub.textContent = `${tube.tone}  ·  第 ${tube.idx + 1} 律`;

  iFormula.innerHTML = tube.formula;

  iLen.textContent = tube.len.toFixed(4);
  iFreq.textContent = tube.freq.toFixed(2) + ' Hz';
  iNote.textContent = tube.note;

  elHover.textContent = tube.name;
}

// ============================================================
//  指针交互
// ============================================================
function getPointer(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top,
  };
}

function findTubeAt(px, py) {
  let best = -1, bestD = 1e9;
  for (let i = 0; i < tubes.length; i++) {
    const tb = tubes[i];
    if (!tb.projBot || !tb.projTop) continue;

    const w = (tb.radius * tb.projBot.scale + tb.radius * tb.projTop.scale);
    const threshold = Math.max(16, w * 0.7);

    const d = distToSeg(
      px, py,
      tb.projBot.x, tb.projBot.y,
      tb.projTop.x, tb.projTop.y
    );

    if (d < threshold && d < bestD) {
      bestD = d;
      best = i;
    }
  }
  return best;
}

function findBellAt(px, py) {
  let best = -1, bestD = 1e9;
  for (let i = 0; i < bells.length; i++) {
    const b = bells[i];
    if (!b.projBot || !b.projTop) continue;

    const w = b.widthBot * b.projBot.scale * 0.5;
    const mx = (b.projBot.x + b.projTop.x) * 0.5;
    const my = (b.projBot.y + b.projTop.y) * 0.5;
    const rad = Math.max(w, (b.projBot.y - b.projTop.y) * 0.5);

    const d = Math.hypot(px - mx, py - my);
    if (d < rad && d < bestD) {
      bestD = d;
      best = i;
    }
  }
  return best;
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  document.getElementById('hint').classList.add('hide');

  canvas.setPointerCapture(e.pointerId);

  const { x, y } = getPointer(e);

  input.moved = false;
  input.startX = x;
  input.startY = y;

  // 优先律管
  const ti = findTubeAt(x, y);
  if (ti >= 0) {
    const tb = tubes[ti];
    tb.pulse = 1;
    playBell(tb.freq, 0.88, 5.2, 1);
    pulses.push({
      x: tb.projTop ? tb.projTop.x : x,
      y: tb.projTop ? tb.projTop.y : y,
      baseR: 12,
      t0: nowT,
      hue: tb.hue,
    });
    elClick.textContent = tb.name + '  ' + tb.note;

    // 停止自动旋转
    camState.spin = false;
    document.getElementById('btn-spin').classList.remove('on');
    return;
  }

  // 其次编钟
  const bi = findBellAt(x, y);
  if (bi >= 0) {
    const b = bells[bi];
    b.pulse = 1;
    playBell(b.freq, 0.78, 6.5, 1.25);
    pulses.push({
      x: (b.projBot.x + b.projTop.x) * 0.5,
      y: (b.projBot.y + b.projTop.y) * 0.5,
      baseR: 16,
      t0: nowT,
      hue: b.hue,
    });
    elClick.textContent = '编钟 · ' + b.name;
    return;
  }

  // 否则旋转
  input.mode = 'orbit';
  camState.dragging = true;
  camState.lastX = x;
  camState.lastY = y;
  document.documentElement.classList.add('dragging');
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  const { x, y } = getPointer(e);

  if (input.mode === 'orbit') {
    e.preventDefault();
    const dx = x - camState.lastX;
    const dy = y - camState.lastY;
    camState.lastX = x;
    camState.lastY = y;

    if (Math.abs(dx) + Math.abs(dy) > 2) input.moved = true;

    camTarget.theta -= dx * 0.0072;
    camTarget.phi = clamp(camTarget.phi + dy * 0.0058, -0.10, 0.92);
    return;
  }

  // 悬停检测
  const ti = findTubeAt(x, y);
  const bi = ti < 0 ? findBellAt(x, y) : -1;

  input.hoverTube = ti;
  input.hoverBell = bi;

  if (ti >= 0) {
    showInfo(tubes[ti]);
    canvas.style.cursor = 'pointer';
  } else if (bi >= 0) {
    showInfo(null);
    elHover.textContent = '编钟 · ' + bells[bi].name;
    canvas.style.cursor = 'pointer';
  } else {
    showInfo(null);
    canvas.style.cursor = 'grab';
  }
}, { passive: false });

function endPointer() {
  input.mode = null;
  camState.dragging = false;
  document.documentElement.classList.remove('dragging');
}

canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
window.addEventListener('blur', endPointer);

canvas.addEventListener('pointerleave', () => {
  input.hoverTube = -1;
  input.hoverBell = -1;
  showInfo(null);
});

// 滚轮缩放
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  ensureAudio();
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0009), 6.5, 30);
}, { passive: false });

// 双指缩放
let pinchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinchDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchDist > 0) {
    e.preventDefault();
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    cam.dist = clamp(cam.dist * (pinchDist / (d || 1)), 6.5, 30);
    pinchDist = d;
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { pinchDist = 0; });

// ============================================================
//  按钮
// ============================================================
document.getElementById('btn-spin').addEventListener('click', () => {
  ensureAudio();
  camState.spin = !camState.spin;
  const btn = document.getElementById('btn-spin');
  btn.classList.toggle('on', camState.spin);
  btn.textContent = camState.spin ? '自动环视' : '停止环视';
});

document.getElementById('btn-reset').addEventListener('click', () => {
  camTarget.theta = 0;
  camTarget.phi = 0.24;
  cam.dist = 15.2;
  camState.spin = true;
  const btn = document.getElementById('btn-spin');
  btn.classList.add('on');
  btn.textContent = '自动环视';
});

window.addEventListener('keydown', e => {
  if (e.key === ' ') {
    e.preventDefault();
    document.getElementById('btn-spin').click();
  }
  if (e.key === 'r' || e.key === 'R') {
    document.getElementById('btn-reset').click();
  }
});

window.addEventListener('resize', resize);

// ============================================================
//  更新
// ============================================================
function updateScene(t, dt) {
  // 投影律管
  for (const tb of tubes) {
    tb.projBot = project({ x: tb.bx, y: tb.by, z: tb.bz });
    tb.projTop = project({ x: tb.bx, y: tb.by + tb.height, z: tb.bz });
    tb.projMid = tb.projBot && tb.projTop
      ? { x: (tb.projBot.x + tb.projTop.x) * 0.5, y: (tb.projBot.y + tb.projTop.y) * 0.5 }
      : null;
  }

  // 投影编钟
  for (const b of bells) {
    b.projBot = project({ x: b.bx, y: b.by, z: b.bz });
    b.projTop = project({ x: b.bx, y: b.by + b.height, z: b.bz });
  }

  // 动画衰减
  for (const tb of tubes) {
    tb.pulse = Math.max(0, tb.pulse - dt * 1.4);
    tb.hover += ((input.hoverTube === tb.idx ? 1 : 0) - tb.hover) * Math.min(1, dt * 10);
  }

  for (const b of bells) {
    b.pulse = Math.max(0, b.pulse - dt * 1.2);
    b.hover += ((input.hoverBell === b.idx ? 1 : 0) - b.hover) * Math.min(1, dt * 10);
  }

  // 相机
  if (camState.spin && !camState.dragging) {
    camTarget.theta += dt * camState.spinSpeed;
  }

  cam.theta += (camTarget.theta - cam.theta) * Math.min(1, dt * 5);
  cam.phi   += (camTarget.phi   - cam.phi)   * Math.min(1, dt * 5);
}

// ============================================================
//  主循环
// ============================================================
let lastT = performance.now() / 1000;

function frame(nowMs) {
  const t = nowMs / 1000;
  const dt = Math.min(t - lastT, 0.05);
  lastT = t;
  nowT = t;

  updateScene(t, dt);

  // ── 绘制 ──
  drawBackground();
  drawGround();

  // 合并所有 3D 物体，按深度排序
  const items = [];

  for (const b of bells) {
    if (!b.projBot) continue;
    items.push({ type: 'bell', z: b.projBot.z + 0.01, obj: b });
  }

  for (const tb of tubes) {
    if (!tb.projBot || !tb.projTop) continue;
    // 用中点深度排序
    const zAvg = (tb.projBot.z + tb.projTop.z) * 0.5;
    items.push({ type: 'tube', z: zAvg, obj: tb });
  }

  items.sort((a, b) => b.z - a.z);

  for (const it of items) {
    if (it.type === 'bell') drawBell(it.obj, t);
    else drawTube(it.obj, t);
  }

  drawPulses(t);
  updateHUD(dt);

  requestAnimationFrame(frame);
}

// ============================================================
//  启动
// ============================================================
resize();
buildScene();
requestAnimationFrame(frame);

})();
</script>
