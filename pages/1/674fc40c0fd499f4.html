<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛伦兹力 · 等离子蝎子</title>
<style>
  :root{ --split: 20%; }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
  }

  /* ================= 左侧：洛伦兹力公式 ================= */
  #left{
    position:fixed; left:0; top:0; bottom:0;
    width: var(--split);
    display:flex; align-items:center; justify-content:center;
    padding: 18px 9px;
    background:
      radial-gradient(120% 80% at 18% 22%, rgba(176,60,255,.09), transparent 62%),
      radial-gradient(120% 80% at 82% 84%, rgba(255,140,40,.07), transparent 62%),
      #000;
    border-right:1px solid rgba(190,90,255,.18);
    color:#d9a6ff;
    font-family:"Cambria Math","Latin Modern Math","Times New Roman",serif;
    overflow:hidden;
    z-index:2;
  }
  #left::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(200,110,255,.06) 50%, transparent 100%);
    background-size:100% 220%;
    animation: scan 9s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ from{ background-position: 0 -110%; } to{ background-position: 0 110%; } }

  .stack{ width:100%; text-align:center; position:relative; z-index:1; }

  .kicker{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(7px, .55vw, 10px);
    letter-spacing:.28em;
    color: rgba(210,140,255,.5);
    margin-bottom: 1.7em;
    white-space: nowrap;
  }

  .eq{
    font-size: clamp(8px, .92vw, 16px);
    line-height: 1.95;
    color:#dbaaff;
    text-shadow:
      0 0 10px rgba(180,80,255,.55),
      0 0 26px rgba(140,40,255,.20);
    animation: pulse 5.6s ease-in-out infinite;
    word-break: keep-all;
  }
  .eq.big{
    font-size: clamp(9px, 1.04vw, 18px);
    color:#efc8ff;
  }
  .eq i{ font-style: italic; }
  .eq b{
    font-weight:600; color:#ffa02a;
    text-shadow: 0 0 10px rgba(255,150,40,.75), 0 0 24px rgba(255,110,0,.35);
  }
  .eq sup, .eq sub{ font-size:.6em; }

  @keyframes pulse{
    0%,100%{ opacity:.84; }
    50%    { opacity:1; }
  }

  .vec{
    position:relative;
    display:inline-block;
    padding:0 .12em;
  }
  .vec::after{
    content:"→";
    position:absolute;
    left:50%; top:-0.62em;
    transform:translateX(-50%);
    font-size:.72em;
    color:#ffa02a;
    text-shadow:0 0 8px rgba(255,150,40,.8);
  }

  .rule{
    height:1px; width:62%;
    margin: 1.45em auto;
    background:linear-gradient(90deg, transparent, rgba(190,90,255,.42), transparent);
  }

  .meta{
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(7px, .54vw, 10px);
    letter-spacing:.16em;
    color: rgba(220,170,255,.62);
    white-space: nowrap;
  }
  .dot{
    display:inline-block; width:.6em; height:.6em; border-radius:50%;
    vertical-align:middle; margin:0 .3em 0 .1em;
  }
  .dot.pp{ background:#b03cff; box-shadow:0 0 10px #b03cff, 0 0 22px rgba(176,60,255,.65); }
  .dot.oo{ background:#ff9424; box-shadow:0 0 10px #ff9424, 0 0 22px rgba(255,148,36,.65); }

  /* ================= 右侧：等离子蝎子 ================= */
  #right{
    position:fixed; left: var(--split); top:0; right:0; bottom:0;
    background:#000;
    overflow:hidden;
  }
  #right canvas{ display:block; position:absolute; inset:0; }

  @media (max-width: 900px){
    :root{ --split: 27%; }
    .kicker{ letter-spacing:.16em; }
    .meta{ letter-spacing:.06em; }
  }
</style>
</head>
<body>

<!-- ============ 左：公式 ============ -->
<div id="left">
  <div class="stack">
    <div class="kicker">LORENTZ FORCE</div>

    <div class="eq big">
      <span class="vec">F</span> = <i>q</i> (
      <span class="vec">E</span> +
      <span class="vec">v</span> ×
      <span class="vec">B</span> )
    </div>

    <div class="rule"></div>

    <div class="eq">
      <span class="vec">F</span><sub>mag</sub> =
      <i>q</i> <span class="vec">v</span> × <span class="vec">B</span>
    </div>

    <div class="rule"></div>

    <div class="eq">
      |<span class="vec">F</span>| = |<i>q</i>| <i>vB</i> sin <i>θ</i>
    </div>

    <div class="rule"></div>

    <div class="eq">
      <b>d<span class="vec">p</span>/d<i>t</i></b> =
      <i>q</i> ( <span class="vec">E</span> +
      <span class="vec">v</span> × <span class="vec">B</span> )
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span class="dot pp"></span>电场
      <span class="dot oo"></span>磁场
    </div>
  </div>
</div>

<!-- ============ 右：场景 ============ -->
<div id="right"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

const host = document.getElementById('right');

/* =========================================================
   0. 渲染器 / 场景 / 相机
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 1);
renderer.domElement.style.display = 'block';
host.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

const CENTER   = new THREE.Vector3(0.22, 0.86, 0);
const VIEW_DIR = new THREE.Vector3(0.55, 0.40, 0.73).normalize();
const BOUND_R  = 2.02;

function fitCamera(){
  const w = host.clientWidth  || 1;
  const h = host.clientHeight || 1;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);

  camera.aspect = w / h;
  const vFov = camera.fov * Math.PI / 180;
  const tan  = Math.tan(vFov / 2);
  const dV   = BOUND_R / tan;
  const dH   = BOUND_R / (tan * camera.aspect);
  const d    = Math.max(dV, dH) * 1.03;

  camera.position.copy(CENTER).addScaledVector(VIEW_DIR, d);
  camera.lookAt(CENTER);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fitCamera);

/* =========================================================
   1. 粒子数据缓冲
   ========================================================= */
const MAXP = 24000;

const gPos  = new Float32Array(MAXP * 3);
const gDir  = new Float32Array(MAXP * 3);
const gSeed = new Float32Array(MAXP);
const gSize = new Float32Array(MAXP);
const gMix  = new Float32Array(MAXP);
const gSway = new Float32Array(MAXP);
let   gCount = 0;

function addP(x, y, z, mix, size, sway, dx, dy, dz){
  if (gCount >= MAXP) return;
  const i3 = gCount * 3;

  gPos[i3]     = x;  gPos[i3 + 1] = y;  gPos[i3 + 2] = z;
  gDir[i3]     = dx; gDir[i3 + 1] = dy; gDir[i3 + 2] = dz;

  gSeed[gCount] = Math.random();
  gSize[gCount] = size;
  gMix [gCount] = mix;
  gSway[gCount] = sway;
  gCount++;
}

/* 沿曲线铺管状粒子 */
const _bp = new THREE.Vector3();
const _bt = new THREE.Vector3();
const _bn1 = new THREE.Vector3();
const _bn2 = new THREE.Vector3();
const _bup = new THREE.Vector3();

function tubeParticles(curve, radiusFn, rings, perRing, opts){
  for (let i = 0; i < rings; i++){
    const s = i / (rings - 1);
    curve.getPointAt(s, _bp);
    curve.getTangentAt(s, _bt).normalize();

    _bup.set(0, 1, 0);
    if (Math.abs(_bt.dot(_bup)) > 0.9) _bup.set(1, 0, 0);

    _bn1.crossVectors(_bt, _bup).normalize();
    _bn2.crossVectors(_bt, _bn1).normalize();

    const r = radiusFn(s);

    for (let j = 0; j < perRing; j++){
      const th = (j / perRing) * Math.PI * 2;
      const rr = r * (0.80 + 0.20 * Math.random());

      const ct = Math.cos(th), st = Math.sin(th);

      const dx = _bn1.x * ct + _bn2.x * st;
      const dy = _bn1.y * ct + _bn2.y * st;
      const dz = _bn1.z * ct + _bn2.z * st;

      const x = _bp.x + dx * rr;
      const y = _bp.y + dy * rr;
      const z = _bp.z + dz * rr;

      addP(
        x, y, z,
        opts.mixFn(s, th),
        opts.sizeFn(s),
        opts.sway,
        dx, dy, dz
      );
    }
  }
}

/* =========================================================
   2. 身体（头胸部 + 腹部）
   ========================================================= */
(function buildBody(){
  const NS = 66, NA = 46;
  const X0 =  0.80, X1 = -0.62;

  for (let i = 0; i < NS; i++){
    const s = i / (NS - 1);
    const x = X0 + (X1 - X0) * s;

    const shape = Math.sin(Math.PI * Math.pow(s, 0.72));
    const w = 0.34 * (0.52 + 0.48 * shape);
    const h = 0.185 * (0.52 + 0.48 * shape);
    const yc = 0.06 + 0.035 * Math.sin(Math.PI * s);

    for (let j = 0; j < NA; j++){
      const th = (j / NA) * Math.PI * 2;
      const rr = 0.85 + 0.15 * Math.random();

      const py = yc + h * rr * Math.sin(th);
      const pz = w * rr * Math.cos(th);

      let mix = 0.10 + 0.42 * (0.5 + 0.5 * Math.sin(s * 9.0 + th * 2.4));
      mix = Math.min(1, mix + Math.random() * 0.12);

      const size = 0.85 + Math.random() * 0.95;
      const sway = 0.012 + Math.random() * 0.022;

      const dx = 0;
      const dy = Math.sin(th) * 0.75;
      const dz = Math.cos(th) * 0.75;

      addP(x, py, pz, mix, size, sway, dx, dy, dz);
    }
  }
})();

/* =========================================================
   3. 尾巴（弧形上卷）
   ========================================================= */
const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.58, 0.12,  0.00),
  new THREE.Vector3(-0.88, 0.40,  0.02),
  new THREE.Vector3(-1.12, 0.92,  0.05),
  new THREE.Vector3(-1.06, 1.50,  0.06),
  new THREE.Vector3(-0.66, 1.96,  0.03),
  new THREE.Vector3(-0.10, 2.12, -0.03),
  new THREE.Vector3( 0.38, 2.00, -0.06),
  new THREE.Vector3( 0.66, 1.68, -0.03),
  new THREE.Vector3( 0.84, 1.28,  0.00)
], false, 'catmullrom', 0.5);

(function buildTail(){
  const NS = 118, NA = 26;

  for (let i = 0; i < NS; i++){
    const s = i / (NS - 1);

    tailCurve.getPointAt(s, _bp);
    tailCurve.getTangentAt(s, _bt).normalize();

    _bup.set(0, 1, 0);
    if (Math.abs(_bt.dot(_bup)) > 0.9) _bup.set(1, 0, 0);
    _bn1.crossVectors(_bt, _bup).normalize();
    _bn2.crossVectors(_bt, _bn1).normalize();

    const r = 0.155 * (1 - 0.88 * s) * (1 + 0.10 * Math.sin(s * Math.PI * 2 * 6));

    for (let j = 0; j < NA; j++){
      const th = (j / NA) * Math.PI * 2;
      const rr = r * (0.80 + 0.20 * Math.random());

      const ct = Math.cos(th), st = Math.sin(th);
      const dx = _bn1.x * ct + _bn2.x * st;
      const dy = _bn1.y * ct + _bn2.y * st;
      const dz = _bn1.z * ct + _bn2.z * st;

      const x = _bp.x + dx * rr;
      const y = _bp.y + dy * rr;
      const z = _bp.z + dz * rr;

      let mix = 0.42 + 0.50 * (0.5 + 0.5 * Math.sin(s * 22 - th * 2.0));
      mix = Math.min(1, mix + Math.random() * 0.08);

      const size = 0.85 + Math.random() * 1.05;
      const sway = 0.016 + Math.random() * 0.026;

      addP(x, y, z, mix, size, sway, dx, dy, dz);
    }
  }
})();

/* =========================================================
   4. 步足（8 条）
   ========================================================= */
(function buildLegs(){
  const LEGS = [
    { x:  0.60, kx: 0.14, kz: 0.74, fx: 0.28, fz: 1.04 },
    { x:  0.33, kx: 0.14, kz: 0.70, fx: 0.28, fz: 1.00 },
    { x:  0.06, kx: 0.13, kz: 0.66, fx: 0.26, fz: 0.95 },
    { x: -0.22, kx: 0.12, kz: 0.60, fx: 0.24, fz: 0.87 }
  ];

  for (const L of LEGS){
    for (const side of [1, -1]){
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(L.x,               0.00, side * 0.24),
        new THREE.Vector3(L.x + L.kx,        0.34, side * L.kz),
        new THREE.Vector3(L.x + L.fx,       -0.44, side * L.fz)
      ], false, 'catmullrom', 0.5);

      tubeParticles(
        curve,
        s => 0.058 * (1 - 0.62 * s),
        32, 14,
        {
          mixFn : (s, th) => Math.min(1,
                    0.22 + 0.55 * s + 0.18 * Math.sin(th * 2.0 + s * 8.0)),
          sizeFn: s => 0.80 + (1 - s) * 0.70,
          sway  : 0.020
        }
      );
    }
  }
})();

/* =========================================================
   5. 螯肢（钳子）+ 磁场涟漪
   ========================================================= */
const RING_DATA = [];

(function buildArms(){
  for (const side of [1, -1]){

    /* --- 前臂 --- */
    const arm = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.70, 0.05, side * 0.14),
      new THREE.Vector3(1.02, 0.06, side * 0.36),
      new THREE.Vector3(1.32, 0.06, side * 0.50)
    ], false, 'catmullrom', 0.5);

    tubeParticles(
      arm,
      s => 0.082 * (1 - 0.30 * s),
      30, 16,
      {
        mixFn : (s, th) => Math.min(1, 0.55 + 0.35 * s),
        sizeFn: s => 0.90 + 0.55 * (1 - s),
        sway  : 0.016
      }
    );

    /* --- 固定钳 --- */
    const fixed = new THREE.CatmullRomCurve3([
      new THREE.Vector3(1.30, 0.05, side * 0.50),
      new THREE.Vector3(1.56, 0.07, side * 0.88),
      new THREE.Vector3(1.94, 0.07, side * 0.68)
    ], false, 'catmullrom', 0.5);

    tubeParticles(
      fixed,
      s => 0.070 * (1 - 0.55 * s),
      36, 18,
      {
        mixFn : (s, th) => Math.min(1, 0.70 + 0.28 * Math.sin(s * 6 + th)),
        sizeFn: s => 0.95 + 0.60 * (1 - s),
        sway  : 0.018
      }
    );

    /* --- 可动钳 --- */
    const move = new THREE.CatmullRomCurve3([
      new THREE.Vector3(1.30, 0.05, side * 0.50),
      new THREE.Vector3(1.56, 0.07, side * 0.26),
      new THREE.Vector3(1.94, 0.07, side * 0.46)
    ], false, 'catmullrom', 0.5);

    tubeParticles(
      move,
      s => 0.066 * (1 - 0.55 * s),
      36, 18,
      {
        mixFn : (s, th) => Math.min(1, 0.68 + 0.30 * Math.sin(s * 6 + th + 1.4)),
        sizeFn: s => 0.92 + 0.58 * (1 - s),
        sway  : 0.018
      }
    );

    /* --- 磁场涟漪（同心圆环） --- */
    for (let k = 0; k < 3; k++){
      const geo = new THREE.RingGeometry(0.93, 1.0, 84);
      const col = (k % 2 === 0) ? 0xff9424 : 0xb03cff;

      const mat = new THREE.MeshBasicMaterial({
        color: col,
        transparent: true,
        opacity: 0.5,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(1.62, 0.02, side * 0.52);
      scene.add(mesh);

      RING_DATA.push({ mesh: mesh, phase: k / 3 });
    }
  }
})();

/* =========================================================
   6. 粒子材质（霓虹紫 ↔ 亮橙）
   ========================================================= */
const uniforms = {
  uTime       : { value: 0 },
  uPixelRatio : { value: renderer.getPixelRatio() },
  uSize       : { value: 20.0 },
  uPurple     : { value: new THREE.Color(0xb03cff) },
  uOrange     : { value: new THREE.Color(0xff9424) }
};

const vert = /* glsl */`
  uniform float uTime;
  uniform float uPixelRatio;
  uniform float uSize;
  uniform vec3  uPurple;
  uniform vec3  uOrange;

  attribute float aSeed;
  attribute float aSize;
  attribute float aMix;
  attribute float aSway;
  attribute vec3  aDir;

  varying vec3  vColor;
  varying float vAlpha;

  void main(){
    vec3 pos = position;

    /* 等离子体抖动：沿法向摆动 */
    float ph = aSeed * 6.2831853;
    pos += aDir * sin(uTime * 1.9 + ph) * aSway;

    /* 高频湍流 */
    pos.x += sin(uTime * 3.1 + ph * 1.7) * 0.0075;
    pos.y += cos(uTime * 2.7 + ph * 2.3) * 0.0075;
    pos.z += sin(uTime * 3.5 + ph * 3.1) * 0.0075;

    /* 整体呼吸 */
    pos.y += sin(uTime * 1.05) * 0.010;

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mv;

    /* 颜色：霓虹紫 ↔ 亮橙 */
    vColor = mix(uPurple, uOrange, clamp(aMix, 0.0, 1.0));

    /* 脉动亮度 */
    float pulse = 0.55 + 0.45 * sin(uTime * 4.2 + ph * 3.0);
    float alive = 0.70 + 0.30 * sin(uTime * 1.7 + ph);
    vAlpha = pulse * alive;

    gl_PointSize = aSize * uSize * uPixelRatio / max(0.001, -mv.z);
    gl_PointSize = clamp(gl_PointSize, 0.6, 34.0 * uPixelRatio);
  }
`;

const frag = /* glsl */`
  varying vec3  vColor;
  varying float vAlpha;

  void main(){
    vec2 d = gl_PointCoord - vec2(0.5);
    float r = length(d);
    if (r > 0.5) discard;

    float f = 1.0 - r * 2.0;
    float core = pow(f, 2.2);
    float glow = pow(f, 0.85);

    vec3 c = vColor * (core * 1.70 + glow * 0.42);

    gl_FragColor = vec4(c, core * vAlpha);
  }
`;

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(gPos.subarray(0, gCount * 3), 3));
geo.setAttribute('aDir',     new THREE.BufferAttribute(gDir.subarray(0, gCount * 3), 3));
geo.setAttribute('aSeed',    new THREE.BufferAttribute(gSeed.subarray(0, gCount), 1));
geo.setAttribute('aSize',    new THREE.BufferAttribute(gSize.subarray(0, gCount), 1));
geo.setAttribute('aMix',     new THREE.BufferAttribute(gMix .subarray(0, gCount), 1));
geo.setAttribute('aSway',    new THREE.BufferAttribute(gSway.subarray(0, gCount), 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader  : vert,
  fragmentShader: frag,
  transparent   : true,
  depthWrite    : false,
  depthTest     : false,
  blending      : THREE.AdditiveBlending
});

const points = new THREE.Points(geo, mat);
scene.add(points);

/* =========================================================
   7. 尾巴高压电弧
   ========================================================= */
const ARC_N   = 36;
const ARC_SEG = 6;

const arcVerts = ARC_N * ARC_SEG * 2;
const arcPos = new Float32Array(arcVerts * 3);
const arcCol = new Float32Array(arcVerts * 3);

const arcGeo = new THREE.BufferGeometry();
arcGeo.setAttribute('position', new THREE.BufferAttribute(arcPos, 3));
arcGeo.setAttribute('color',    new THREE.BufferAttribute(arcCol, 3));

const arcMat = new THREE.LineBasicMaterial({
  vertexColors : true,
  transparent  : true,
  opacity      : 0.95,
  blending     : THREE.AdditiveBlending,
  depthWrite   : false,
  depthTest    : false
});

const arcLines = new THREE.LineSegments(arcGeo, arcMat);
scene.add(arcLines);

/* =========================================================
   8. 主循环
   ========================================================= */
const clock = new THREE.Clock();
const _ap = new THREE.Vector3();

function updateArcs(t){
  const pos = arcGeo.attributes.position.array;
  const col = arcGeo.attributes.color.array;

  let vi = 0;

  for (let a = 0; a < ARC_N; a++){

    /* 在尾巴上随机取起点 */
    tailCurve.getPointAt(Math.random(), _ap);

    const px = _ap.x + (Math.random() - 0.5) * 0.22;
    const py = _ap.y + (Math.random() - 0.5) * 0.22;
    const pz = _ap.z + (Math.random() - 0.5) * 0.22;

    /* 随机终点 */
    const ang = Math.random() * Math.PI * 2;
    const len = 0.22 + Math.random() * 0.80;

    const ex = px + Math.cos(ang) * len * (0.6 + Math.random() * 0.9);
    const ey = py + (Math.random() - 0.15) * len * 1.35;
    const ez = pz + Math.sin(ang) * len * (0.6 + Math.random() * 0.9);

    /* 沿折线推进并抖动 */
    let cx = px, cy = py, cz = pz;

    for (let k = 0; k < ARC_SEG; k++){
      const f1 = (k + 1) / ARC_SEG;

      const nx = px + (ex - px) * f1 + (Math.random() - 0.5) * 0.10;
      const ny = py + (ey - py) * f1 + (Math.random() - 0.5) * 0.10;
      const nz = pz + (ez - pz) * f1 + (Math.random() - 0.5) * 0.10;

      const i0 = vi * 3;
      pos[i0]     = cx; pos[i0 + 1] = cy; pos[i0 + 2] = cz;
      vi++;
      const i1 = vi * 3;
      pos[i1]     = nx; pos[i1 + 1] = ny; pos[i1 + 2] = nz;
      vi++;

      /* 颜色：亮橙 → 熄灭 */
      const fade0 = 1.0 - k / ARC_SEG;
      const fade1 = 1.0 - (k + 1) / ARC_SEG;

      const b0 = fade0 * fade0;
      const b1 = fade1 * fade1;

      col[i0]     = 1.00 * b0; col[i0 + 1] = 0.58 * b0; col[i0 + 2] = 0.12 * b0;
      col[i1]     = 1.00 * b1; col[i1 + 1] = 0.58 * b1; col[i1 + 2] = 0.12 * b1;

      cx = nx; cy = ny; cz = nz;
    }
  }

  arcGeo.attributes.position.needsUpdate = true;
  arcGeo.attributes.color.needsUpdate    = true;
}

function updateRings(t){
  for (let i = 0; i < RING_DATA.length; i++){
    const r = RING_DATA[i];

    const u  = (t * 0.42 + r.phase) % 1;
    const sc = 0.12 + u * 1.15;

    r.mesh.scale.set(sc, sc, sc);

    const fadeIn  = Math.min(1, u / 0.08);
    const fadeOut = 1 - u;
    r.mesh.material.opacity = fadeIn * fadeOut * 0.58;
  }
}

function frame(){
  requestAnimationFrame(frame);

  const t = clock.getElapsedTime();

  uniforms.uTime.value = t;

  updateRings(t);
  updateArcs(t);

  /* 蝎子轻微蓄势抖动 */
  points.position.y = Math.sin(t * 1.05) * 0.012;
  points.position.x = Math.sin(t * 0.63) * 0.008;

  renderer.render(scene, camera);
}

/* =========================================================
   9. 启动
   ========================================================= */
fitCamera();
uniforms.uPixelRatio.value = renderer.getPixelRatio();

requestAnimationFrame(frame);

})();
</script>
