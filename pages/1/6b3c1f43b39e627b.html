<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;

                 0 0 36px rgba(230, 130, 30, .55),
                 0 0 80px rgba(180, 80, 10, .35);
  }
  #title-block .line {
    margin-top: 14px; width: 74px; height: 1px;
    background: linear-gradient(90deg, #ffbe5a, rgba(255, 190, 90, 0));

  }

  /* ---- 方程 ---- */

  }
  #eq-block .eq {
    font-family: "Cambria Math", "Latin Modern Math", Georgia, serif;
    font-style: italic;
    font-size: 18px; line-height: 1.9; letter-spacing: .5px;
    color: #ffe4b5;
    text-shadow: 0 0 10px rgba(255, 180, 80, .5);
  }
  #eq-block .eq .op  { color: #c9a06a; font-style: normal; }
  #eq-block .eq .sup { font-size: 12px; vertical-align: super; font-style: normal; }
  #eq-block .params {
    margin-top: 16px; font-size: 11px; letter-spacing: 2.4px;
    color: #9a7b4d; font-family: "Consolas", monospace;
  }

  /* ---- 参数面板 ---- */
  #param-block { bottom: 54px; right: 46px; text-align: right; }
  #param-block .row {
    font-family: "Consolas", monospace;
    font-size: 11px; letter-spacing: 2.2px;
    color: #8a6b3d; margin-bottom: 9px;
  }
  #param-block .row b {
    color: #ffd28a; font-weight: 400;
    text-shadow: 0 0 8px rgba(255, 180, 80, .7);
  }
  #param-block .row b.big {
    font-size: 14px;
    color: #fff0c8;
    text-shadow: 0 0 14px rgba(255, 200, 100, .9);
  }

  /* ---- 提示 ---- */
  #hint {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 3px; color: #6a5230;
    z-index: 10; pointer-events: none;
  }

  /* ---- 开场遮罩 ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 50%, #0a0a04 0%, #000206 70%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; cursor: pointer;
    transition: opacity 1.2s ease;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay .enter {

    border-radius: 2px;
    text-shadow: 0 0 16px rgba(255, 190, 90, .9);
    box-shadow: 0 0 30px rgba(255, 170, 60, .12),

    animation: breathe 3s ease-in-out infinite;
  }
  #overlay .enter:hover {
    background: rgba(255, 190, 90, .08);
    border-color: rgba(255, 190, 90, .85);
    box-shadow: 0 0 60px rgba(255, 190, 90, .3),
                inset 0 0 40px rgba(255, 190, 90, .12);
  }
  #overlay .tip {
    margin-top: 26px; font-size: 10px; letter-spacing: 4px; color: #6a5230;
  }
  @keyframes breathe {
    0%, 100% { opacity: .78; }
    50%      { opacity: 1; }
  }

  @media (max-width: 760px) {
    #title-block { top: 26px; left: 22px; }
    #title-block h1 { font-size: 17px; letter-spacing: 4px; }
    #eq-block { bottom: 30px; left: 22px; }
    #eq-block .eq { font-size: 13px; }
    #param-block { bottom: 30px; right: 22px; }
    #param-block .row { font-size: 9px; letter-spacing: 1.4px; }
  }
</style>
</head>
<body>

<div id="scene"></div>

<div class="hud" id="title-block">
  <div class="en">Celestial Mechanics</div>
  <h1>开普勒椭圆轨道</h1>
  <div class="line"></div>
</div>

<div class="hud" id="eq-block">
  <div class="cap">Kepler's Laws</div>
  <div class="eq">
    <div>r <span class="op">=</span> a(1 <span class="op">−</span> e<span class="sup">2</span>) / (1 <span class="op">+</span> e·cos θ)</div>
    <div style="margin-top:6px;">r<span class="sup">2</span> · dθ/dt <span class="op">=</span> h <span class="op">=</span> 常数</div>
  </div>
  <div class="params">近日点加速 · 远日点减速 · 等面积扫过</div>
</div>

<div class="hud" id="param-block">
  <div class="row">半长轴 a <b>15.0 AU</b></div>
  <div class="row">偏心率 e <b>0.62</b></div>
  <div class="row">近/远日点速度比 <b class="big" id="vratio">4.26</b></div>
  <div class="row">轨道周期 T <b>16.0 s</b></div>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放</div>

<div id="overlay">
  <div class="enter">进 入 轨 道</div>
  <div class="tip">CLICK TO START</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================================
   0. 轨道参数
   ========================================================= */
const A      = 15.0;                          // 半长轴
const ECC    = 0.62;                          // 偏心率
const B      = A * Math.sqrt(1 - ECC * ECC);  // 半短轴
const PERIOD = 16.0;                          // 轨道周期（秒）
const NSECT  = 12;                            // 等面积扇区数量

// 派生量
const R_PERI = A * (1 - ECC);                 // 近日点距离 = 5.70
const R_APHE = A * (1 + ECC);                 // 远日点距离 = 24.30
const V_RATIO = (1 + ECC) / (1 - ECC);        // 速度比 ≈ 4.26

/* =========================================================
   1. 开普勒方程求解
   ========================================================= */
function solveKepler(M, e) {
  // 归一化 M 到 [-π, π]
  let m = M % (Math.PI * 2);
  if (m >  Math.PI) m -= Math.PI * 2;
  if (m < -Math.PI) m += Math.PI * 2;

  // 初值：小偏心率用 M，大偏心率用 π·sign
  let E = (e < 0.8) ? m : Math.PI * Math.sign(m || 1);

  for (let i = 0; i < 12; i++) {
    const f  = E - e * Math.sin(E) - m;
    const fp = 1 - e * Math.cos(E);
    const d  = f / fp;
    E -= d;
    if (Math.abs(d) < 1e-10) break;
  }
  return E;
}

// tNorm ∈ [0,1) → 世界坐标 { x, z }
function orbitalPos(tNorm) {
  const M = tNorm * Math.PI * 2;
  const E = solveKepler(M, ECC);
  return {
    x: A * (Math.cos(E) - ECC),
    z: B * Math.sin(E),
  };
}

/* =========================================================
   2. 场景 / 相机 / 渲染器
   ========================================================= */
const container = document.getElementById('scene');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000206, 0.0028);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 6000);
camera.position.set(-4, 30, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000206, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.055;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.30;
controls.minDistance     = 20;
controls.maxDistance     = 160;
controls.enablePan       = false;
controls.minPolarAngle   = Math.PI * 0.12;
controls.maxPolarAngle   = Math.PI * 0.72;
// 视觉中心：椭圆几何中心在 x = -A·e = -9.3
controls.target.set(-A * ECC * 0.55, 0, 0);

/* =========================================================
   3. 发光贴图（共享）
   ========================================================= */
function makeGlowTexture() {
  const size = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.14, 'rgba(255,248,225,0.92)');
  g.addColorStop(0.34, 'rgba(255,200,110,0.42)');
  g.addColorStop(0.62, 'rgba(255,140,50,0.12)');
  g.addColorStop(1.00, 'rgba(255,90,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeWhiteGlow() {
  const size = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.22, 'rgba(230,245,255,0.75)');
  g.addColorStop(0.55, 'rgba(120,190,255,0.18)');
  g.addColorStop(1.00, 'rgba(30,80,160,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const glowTex  = makeGlowTexture();
const whiteTex = makeWhiteGlow();

/* =========================================================
   4. 星空背景
   ========================================================= */
const STAR_COUNT = 9000;
const starPos = new Float32Array(STAR_COUNT * 3);
const starCol = new Float32Array(STAR_COUNT * 3);

(function buildStars() {
  const c = new THREE.Color();
  for (let i = 0; i < STAR_COUNT; i++) {
    const r     = 300 + Math.random() * 1400;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);

    starPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    starPos[i * 3 + 1] = r * Math.cos(phi);
    starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const tint = Math.random();
    if (tint < 0.55)      c.setHSL(0.58, 0.45, 0.85);   // 冷白蓝
    else if (tint < 0.86) c.setHSL(0.10, 0.60, 0.82);   // 暖黄
    else                  c.setHSL(0.03, 0.65, 0.80);   // 橙红

    const b = 0.20 + Math.random() * 0.72;
    starCol[i * 3]     = c.r * b;
    starCol[i * 3 + 1] = c.g * b;
    starCol[i * 3 + 2] = c.b * b;
  }
})();

const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('color',    new THREE.BufferAttribute(starCol, 3));

const starMat = new THREE.PointsMaterial({
  size            : 1.6,
  sizeAttenuation : false,
  map             : whiteTex,
  vertexColors    : true,
  transparent     : true,
  opacity         : 0.7,
  blending        : THREE.AdditiveBlending,
  depthWrite      : false,
});

const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

/* ---- 近景漂浮星尘 ---- */
const DUST_COUNT = 1400;
const dustPos = new Float32Array(DUST_COUNT * 3);
const dustCol = new Float32Array(DUST_COUNT * 3);
const dustSeed = new Float32Array(DUST_COUNT);

(function buildDust() {
  const c = new THREE.Color();
  for (let i = 0; i < DUST_COUNT; i++) {
    const r     = 18 + Math.random() * 55;
    const theta = Math.random() * Math.PI * 2;
    const y     = (Math.random() - 0.5) * 26;

    dustPos[i * 3]     = Math.cos(theta) * r - A * ECC * 0.55;
    dustPos[i * 3 + 1] = y;
    dustPos[i * 3 + 2] = Math.sin(theta) * r;

    c.setHSL(0.08 + Math.random() * 0.08, 0.75, 0.72);
    const b = 0.25 + Math.random() * 0.6;
    dustCol[i * 3]     = c.r * b;
    dustCol[i * 3 + 1] = c.g * b;
    dustCol[i * 3 + 2] = c.b * b;

    dustSeed[i] = Math.random() * Math.PI * 2;
  }
})();

const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color',    new THREE.BufferAttribute(dustCol, 3));

const dustMat = new THREE.PointsMaterial({
  size            : 0.55,
  sizeAttenuation : true,
  map             : glowTex,
  vertexColors    : true,
  transparent     : true,
  opacity         : 0.5,
  blending        : THREE.AdditiveBlending,
  depthWrite      : false,
});

const dust = new THREE.Points(dustGeo, dustMat);
dust.frustumCulled = false;
scene.add(dust);

/* =========================================================
   5. 太阳（焦点处发光天体）
   ========================================================= */
const sunGroup = new THREE.Group();
scene.add(sunGroup);

// 核心球
const sunCore = new THREE.Mesh(
  new THREE.SphereGeometry(1.55, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xfff3d0 })
);
sunGroup.add(sunCore);

// 内层光晕
const sunGlow1 = new THREE.Sprite(new THREE.SpriteMaterial({
  map        : glowTex,
  color      : 0xffdd88,
  blending   : THREE.AdditiveBlending,
  transparent: true,
  depthWrite : false,
  opacity    : 0.95,
}));
sunGlow1.scale.set(11, 11, 1);
sunGroup.add(sunGlow1);

// 外层光晕
const sunGlow2 = new THREE.Sprite(new THREE.SpriteMaterial({
  map        : glowTex,
  color      : 0xff9a3c,
  blending   : THREE.AdditiveBlending,
  transparent: true,
  depthWrite : false,
  opacity    : 0.4,
}));
sunGlow2.scale.set(26, 26, 1);
sunGroup.add(sunGlow2);

// 太阳光柱（旋转的柔光环）
const sunHalo = new THREE.Mesh(
  new THREE.RingGeometry(2.4, 2.9, 96),
  new THREE.MeshBasicMaterial({
    color: 0xffc46a,
    transparent: true,
    opacity: 0.35,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    depthWrite: false,
  })
);
sunHalo.rotation.x = -Math.PI / 2;
sunGroup.add(sunHalo);

/* =========================================================
   6. 金色椭圆轨道（双管：亮芯 + 外晕）
   ========================================================= */
(function buildOrbit() {
  const pts = [];
  const SEG = 400;
  for (let i = 0; i < SEG; i++) {
    const E = (i / SEG) * Math.PI * 2;
    pts.push(new THREE.Vector3(
      A * (Math.cos(E) - ECC),
      0,
      B * Math.sin(E)
    ));
  }

  const curve = new THREE.CatmullRomCurve3(pts, true);

  // 外层柔光管
  const outerGeo = new THREE.TubeGeometry(curve, 600, 0.24, 8, true);
  const outerMat = new THREE.MeshBasicMaterial({
    color      : 0xff9a3c,
    transparent: true,
    opacity    : 0.16,
    blending   : THREE.AdditiveBlending,
    depthWrite : false,
  });
  const outerTube = new THREE.Mesh(outerGeo, outerMat);
  outerTube.frustumCulled = false;
  scene.add(outerTube);

  // 内层亮芯
  const innerGeo = new THREE.TubeGeometry(curve, 600, 0.075, 8, true);
  const innerMat = new THREE.MeshBasicMaterial({
    color      : 0xffe9a8,
    transparent: true,
    opacity    : 0.95,
    blending   : THREE.AdditiveBlending,
    depthWrite : false,
  });
  const innerTube = new THREE.Mesh(innerGeo, innerMat);
  innerTube.frustumCulled = false;
  scene.add(innerTube);
})();

/* =========================================================
   7. 等面积扇区（开普勒第二定律可视化）
   ========================================================= */
const sectorMats = [];

for (let s = 0; s < NSECT; s++) {
  const t0 = s / NSECT;
  const t1 = (s + 1) / NSECT;
  const SEG = 44;

  const positions = [0, 0, 0];   // 顶点 0 = 太阳（焦点）
  const indices   = [];

  for (let j = 0; j <= SEG; j++) {
    const tn = t0 + (t1 - t0) * (j / SEG);
    const p = orbitalPos(tn);
    positions.push(p.x, 0, p.z);
  }
  for (let j = 1; j <= SEG; j++) {
    indices.push(0, j, j + 1);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const hue = (s / NSECT) * 0.88 + 0.02;
  const col = new THREE.Color().setHSL(hue, 0.92, 0.56);

  const mat = new THREE.MeshBasicMaterial({
    color      : col,
    transparent: true,
    opacity    : 0.05,
    blending   : THREE.AdditiveBlending,
    side       : THREE.DoubleSide,
    depthWrite : false,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  sectorMats.push({ mat, base: 0.05, mesh });
}

/* ---- 扇区边界射线（近日点/远日点方向的径向虚线） ---- */
(function buildSectorEdges() {
  const pts = [];
  for (let s = 0; s < NSECT; s++) {
    const tn = s / NSECT;
    const p = orbitalPos(tn);
    pts.push(0, 0, 0, p.x, 0, p.z);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const mat = new THREE.LineBasicMaterial({
    color      : 0xffc46a,
    transparent: true,
    opacity    : 0.11,
    blending   : THREE.AdditiveBlending,
    depthWrite : false,
  });
  const lines = new THREE.LineSegments(geo, mat);
  lines.frustumCulled = false;
  scene.add(lines);
})();

/* =========================================================
   8. 行星 + 轨迹尾迹
   ========================================================= */
const planetGroup = new THREE.Group();
scene.add(planetGroup);

const planetCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.62, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xdff2ff })
);
planetGroup.add(planetCore);

const planetGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map        : whiteTex,
  color      : 0x8fd8ff,
  blending   : THREE.AdditiveBlending,
  transparent: true,
  depthWrite : false,
  opacity    : 0.9,
}));
planetGlow.scale.set(5.2, 5.2, 1);
planetGroup.add(planetGlow);

// ---- 尾迹 ----
const TAIL_LEN = 90;
const tailPositions = new Float32Array(TAIL_LEN * 3);
const tailColors    = new Float32Array(TAIL_LEN * 3);

(function initTail() {
  const c = new THREE.Color();
  for (let k = 0; k < TAIL_LEN; k++) {
    const f = 1 - k / (TAIL_LEN - 1);
    c.setHSL(0.55 - 0.06 * f, 0.85, 0.62);
    const a = Math.pow(f, 2.2);
    tailColors[k * 3]     = c.r * a;
    tailColors[k * 3 + 1] = c.g * a;
    tailColors[k * 3 + 2] = c.b * a;
  }
})();

const tailGeo = new THREE.BufferGeometry();
tailGeo.setAttribute('position',
  new THREE.BufferAttribute(tailPositions, 3).setUsage(THREE.DynamicDrawUsage));
tailGeo.setAttribute('color', new THREE.BufferAttribute(tailColors, 3));
tailGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e5);

const tailLine = new THREE.Line(tailGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent : true,
  blending    : THREE.AdditiveBlending,
  depthWrite  : false,
}));
tailLine.frustumCulled = false;
scene.add(tailLine);

// 尾迹位置循环缓冲
const tailBuf = [];
for (let k = 0; k < TAIL_LEN; k++) tailBuf.push(new THREE.Vector3(0, 0, 0));
let tailHead = 0;

/* =========================================================
   9. 太阳→行星 连线（半径矢量）
   ========================================================= */
const radiusGeo = new THREE.BufferGeometry();
radiusGeo.setAttribute('position',
  new THREE.BufferAttribute(new Float32Array(6), 3).setUsage(THREE.DynamicDrawUsage));
const radiusLine = new THREE.Line(radiusGeo, new THREE.LineBasicMaterial({
  color      : 0xffd28a,
  transparent: true,
  opacity    : 0.32,
  blending   : THREE.AdditiveBlending,
  depthWrite : false,
}));
radiusLine.frustumCulled = false;
scene.add(radiusLine);

/* =========================================================
   10. 后期泛光
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.72,   // strength
  0.48,   // radius
  0.34    // threshold
);
composer.addPass(bloomPass);

/* =========================================================
   11. 动画主循环
   ========================================================= */
const clock = new THREE.Clock();
let tNorm = 0;          // 归一化轨道时间 [0,1)
let lastSec = -1;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const et = clock.elapsedTime;

  // ---- 时间推进 ----
  tNorm += dt / PERIOD;
  if (tNorm >= 1) tNorm -= 1;

  // ---- 行星位置 ----
  const p = orbitalPos(tNorm);
  planetGroup.position.set(p.x, 0, p.z);

  // 行星相对太阳的距离 → 亮度与尺寸微调（近日点更亮）
  const r = Math.sqrt(p.x * p.x + p.z * p.z);
  const rNorm = (r - R_PERI) / (R_APHE - R_PERI);   // 0 = 近日点, 1 = 远日点
  const nearFactor = 1 - rNorm;

  const pulse = 4.6 + nearFactor * 2.0 + Math.sin(et * 6.0) * 0.35;
  planetGlow.scale.set(pulse, pulse, 1);
  planetGlow.material.opacity = 0.6 + nearFactor * 0.4;

  const coreScale = 0.92 + nearFactor * 0.22;
  planetCore.scale.setScalar(coreScale);

  // ---- 尾迹：写入当前点 ----
  const head = tailBuf[tailHead];
  head.set(p.x, 0, p.z);
  tailHead = (tailHead + 1) % TAIL_LEN;

  // 展开到顶点数组（从最新到最旧）
  for (let k = 0; k < TAIL_LEN; k++) {
    const idx = (tailHead - 1 - k + TAIL_LEN * 2) % TAIL_LEN;
    const v = tailBuf[idx];
    tailPositions[k * 3]     = v.x;
    tailPositions[k * 3 + 1] = v.y + 0.05;
    tailPositions[k * 3 + 2] = v.z;
  }
  tailGeo.attributes.position.needsUpdate = true;

  // ---- 半径矢量连线 ----
  const rp = radiusGeo.attributes.position.array;
  rp[0] = 0; rp[1] = 0; rp[2] = 0;
  rp[3] = p.x; rp[4] = 0; rp[5] = p.z;
  radiusGeo.attributes.position.needsUpdate = true;

  // ---- 扇区高亮（当前所在扇区） ----
  const secF = tNorm * NSECT;
  const secIdx = Math.floor(secF) % NSECT;
  const prevIdx = (secIdx - 1 + NSECT) % NSECT;

  for (let s = 0; s < NSECT; s++) {
    let target = 0.045;
    if (s === secIdx)      target = 0.30;
    else if (s === prevIdx) target = 0.12;

    const entry = sectorMats[s];
    entry.mat.opacity += (target - entry.mat.opacity) * Math.min(1, dt * 7.0);
  }

  // ---- 太阳脉动 ----
  const sunPulse = 10.5 + Math.sin(et * 1.4) * 0.8;
  sunGlow1.scale.set(sunPulse, sunPulse, 1);
  sunGlow2.scale.set(sunPulse * 2.3, sunPulse * 2.3, 1);
  sunHalo.scale.setScalar(1 + Math.sin(et * 2.1) * 0.04);
  sunHalo.material.opacity = 0.28 + Math.sin(et * 2.1) * 0.08;

  // ---- 星尘缓慢起伏 ----
  dust.rotation.y += dt * 0.012;
  const dpos = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST_COUNT; i++) {
    const s = dustSeed[i];
    dpos[i * 3 + 1] += Math.sin(et * 0.5 + s) * dt * 0.16;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // ---- 星空自转 ----
  stars.rotation.y += dt * 0.004;
  stars.rotation.x += dt * 0.0012;

  // ---- 泛光呼吸 ----
  bloomPass.strength = 0.66 + Math.sin(et * 1.5) * 0.07;

  controls.update();
  composer.render();
}

/* =========================================================
   12. 窗口自适应
   ========================================================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});

/* =========================================================
   13. 科技感背景音效（Web Audio 实时合成）
   ========================================================= */
let audioStarted = false;

function startAudio() {
  if (audioStarted) return;
  audioStarted = true;

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();

  // ---- 总输出 ----
  const master = ctx.createGain();
  master.gain.value = 0.0001;
  master.connect(ctx.destination);
  master.gain.exponentialRampToValueAtTime(0.24, ctx.currentTime + 4.0);

  // ---- 空间延迟 ----
  const delay = ctx.createDelay(1.6);
  delay.delayTime.value = 0.48;
  const fb = ctx.createGain();
  fb.gain.value = 0.38;
  const wet = ctx.createGain();
  wet.gain.value = 0.30;
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(wet);
  wet.connect(master);

  // ---- 低频 drone（温暖 pad） ----
  const droneFilter = ctx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = 380;
  droneFilter.Q.value = 5;
  droneFilter.connect(master);

  const droneGain = ctx.createGain();
  droneGain.gain.value = 0.17;
  droneGain.connect(droneFilter);

  // D 小调五声音阶低频铺底
  const droneFreqs = [73.42, 110.0, 146.83, 220.0, 293.66];
  droneFreqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    osc.type = (i % 2 === 0) ? 'sine' : 'triangle';
    osc.frequency.value = f * (1 + (Math.random() - 0.5) * 0.006);
    const g = ctx.createGain();
    g.gain.value = 0.5 / (i + 1);
    osc.connect(g);
    g.connect(droneGain);
    osc.start();
  });

  // ---- 滤波器缓慢扫频 ----
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.038;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 190;
  lfo.connect(lfoGain);
  lfoGain.connect(droneFilter.frequency);
  lfo.start();

  // ---- 柔和钟声（谐波对应行星轨道位置） ----
  const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

  function chime() {
    const now = ctx.currentTime;
    const semi = scale[Math.floor(Math.random() * scale.length)];
    const oct  = Math.floor(Math.random() * 2);
    const freq = 440.0 * Math.pow(2, (semi + 12 * oct) / 12);

    const osc = ctx.createOscillator();
    osc.type = Math.random() > 0.5 ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(freq, now);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.055, now + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

    osc.connect(g);
    g.connect(master);
    g.connect(delay);

    osc.start(now);
    osc.stop(now + 3.2);
  }

  setInterval(() => {
    if (Math.random() < 0.7) chime();
  }, 1900);

  // ---- 行星过近日点时的低频能量音 ----
  let lastSecForSound = -1;
  setInterval(() => {
    const sec = Math.floor(tNorm * NSECT) % NSECT;
    if (sec === lastSecForSound) return;
    lastSecForSound = sec;

    // 越靠近近日点（扇区索引越小），音越高越亮
    const nearness = 1 - sec / NSECT;
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    const base = 130.81 * (1 + nearness * 1.6);
    osc.frequency.setValueAtTime(base, now);
    osc.frequency.exponentialRampToValueAtTime(base * 0.55, now + 0.9);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.05 + nearness * 0.03, now + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);

    osc.connect(g);
    g.connect(master);
    g.connect(delay);
    osc.start(now);
    osc.stop(now + 1.2);
  }, 90);

  // ---- 偶尔的深空扫频 ----
  setInterval(() => {
    if (Math.random() > 0.45) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 2.2);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.032, now + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);

    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 760;

    osc.connect(f);
    f.connect(g);
    g.connect(master);
    g.connect(delay);
    osc.start(now);
    osc.stop(now + 2.5);
  }, 7000);
}

/* =========================================================
   14. 启动
   ========================================================= */
const overlay = document.getElementById('overlay');

function boot() {
  overlay.classList.add('hide');
  startAudio();
}

overlay.addEventListener('click', boot);
overlay.addEventListener('touchstart', boot, { passive: true });

// 速度比显示
document.getElementById('vratio').textContent = V_RATIO.toFixed(2);

// 立即开始渲染
animate();
</script>
