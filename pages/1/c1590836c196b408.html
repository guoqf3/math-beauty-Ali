<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids 纳米蜂群 · 数字生命</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

/* ================================================================== */
/*  布局                                                               */
/* ================================================================== */
let W = 0, H = 0, DPR = 1;
let PW = 0, RW = 0, CX = 0, CY = 0, SC = 1;

/* ================================================================== */
/*  发光精灵（预渲染，避免逐帧创建渐变）                                 */
/* ================================================================== */
function makeSprite(r, g, b) {
  const SZ = 28;
  const s  = document.createElement('canvas');
  s.width = s.height = SZ;
  const c = s.getContext('2d');
  const grd = c.createRadialGradient(SZ / 2, SZ / 2, 0, SZ / 2, SZ / 2, SZ / 2);
  grd.addColorStop(0.00, `rgba(${r},${g},${b},1)`);
  grd.addColorStop(0.16, `rgba(${r},${g},${b},0.78)`);
  grd.addColorStop(0.42, `rgba(${r},${g},${b},0.22)`);
  grd.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
  c.fillStyle = grd;
  c.fillRect(0, 0, SZ, SZ);
  return s;
}
const SPR_GREEN = makeSprite(70, 255, 150);   // 纳米蜂 · 翠绿
const SPR_GOLD  = makeSprite(255, 205, 70);   // 纳米蜂 · 流金

/* ================================================================== */
/*  虫形躯体的空间骨架                                                  */
/* ================================================================== */
let L  = 300;    // 体长（头 → 尾）
let R0 = 40;     // 头部最大半径

let curAng = 0;  // 体轴朝向（平滑后）
const FR = { x: 0, y: 0, dx: 1, dy: 0, px: 0, py: 1 };

/* 头部沿李萨如轨迹游走 */
function headAt(t) {
  return {
    x: CX + RW * 0.120 * Math.sin(t * 0.31)
           + RW * 0.045 * Math.sin(t * 0.53 + 2.1),
    y: CY + H  * 0.135 * Math.sin(t * 0.43 + 1.1)
           + H  * 0.045 * Math.sin(t * 0.29 + 0.4)
  };
}

/* 每帧更新一次体轴坐标系 */
function updateFrame(t) {
  const a = headAt(t - 0.15);
  const b = headAt(t + 0.15);
  const h = headAt(t);

  const vx = b.x - a.x, vy = b.y - a.y;
  let target = (Math.hypot(vx, vy) > 0.5) ? Math.atan2(vy, vx) : curAng;

  /* 角度平滑（处理 -π/π 环绕） */
  let d = target - curAng;
  while (d >  Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  curAng += d * 0.08;

  FR.x = h.x;  FR.y = h.y;
  FR.dx = Math.cos(curAng); FR.dy = Math.sin(curAng);
  FR.px = -FR.dy;           FR.py = FR.dx;
}

/* 躯干半径包络：头圆尾尖 */
function bodyRadius(s) {
  const k = 1 - s * s * 0.97;
  return R0 * Math.pow(k > 0 ? k : 0, 0.55);
}

/* 粒子 (s, a) 的目标世界坐标 —— 头在 s=0，尾在 s=1 */
function targetOf(s, a, t) {
  const dist = s * L;
  /* 沿体轴的蠕动波，越靠尾部摆幅越大 */
  const wave = Math.sin(s * 5.5 - t * 2.6) * L * 0.085 * Math.pow(s, 1.4);

  const bx = FR.x - FR.dx * dist + FR.px * wave;
  const by = FR.y - FR.dy * dist + FR.py * wave;

  /* 截面偏移：sin(a) 让粒子在管壁边缘自然堆积 */
  const off = Math.sin(a) * bodyRadius(s);

  return { x: bx + FR.px * off, y: by + FR.py * off };
}

/* ================================================================== */
/*  粒子系统                                                            */
/* ================================================================== */
let parts = [], N = 0;

/* 空间网格 */
let CELL = 24, GW = 0, GH = 0, buckets = null;

function initParticles() {
  L  = 300 * SC;
  R0 = 42  * SC;

  N = Math.round(Math.min(1900, Math.max(600, (RW * H) / 1250)));
  parts = new Array(N);

  updateFrame(0);

  for (let i = 0; i < N; i++) {
    const s = Math.pow(Math.random(), 0.95);   // 0 头 → 1 尾
    const a = Math.random() * TAU;
    const T0 = targetOf(s, a, 0);

    parts[i] = {
      s, a,
      x: T0.x + (Math.random() - 0.5) * 90 * SC,
      y: T0.y + (Math.random() - 0.5) * 90 * SC,
      vx: 0, vy: 0,
      ph:  Math.random() * TAU,
      /* 头部偏金，尾部偏绿 */
      gold: Math.random() < 0.72 - 0.48 * s,
      sz:  (6 + Math.random() * 7) * SC,
      al:  0.42 + Math.random() * 0.55
    };
  }

  CELL = Math.max(16, 24 * SC);
  buckets = null;   // 强制重建网格
}

/* 构建空间网格 */
function buildGrid() {
  GW = Math.ceil(W / CELL) + 2;
  GH = Math.ceil(H / CELL) + 2;
  const total = GW * GH;

  if (!buckets || buckets.length !== total) {
    buckets = new Array(total);
    for (let i = 0; i < total; i++) buckets[i] = [];
  } else {
    for (let i = 0; i < total; i++) buckets[i].length = 0;
  }

  for (let i = 0; i < N; i++) {
    const p  = parts[i];
    const gx = Math.floor(p.x / CELL) + 1;
    const gy = Math.floor(p.y / CELL) + 1;
    if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) continue;
    buckets[gy * GW + gx].push(p);
  }
}

/* ================================================================== */
/*  物理更新：目标弹簧 + Boids 三力                                     */
/* ================================================================== */
function update(dt, t) {
  updateFrame(t);
  buildGrid();

  const SEP_R  = 17 * SC;
  const SEP_R2 = SEP_R * SEP_R;

  const damp   = Math.pow(0.90, dt * 60);
  const MAXV   = 290 * SC;

  const K      = 22;     // 目标弹簧刚度
  const W_SEP  = 1500;   // 分离权重
  const W_ALI  = 1.1;    // 对齐权重
  const W_COH  = 0.55;   // 聚合权重

  for (let i = 0; i < N; i++) {
    const p = parts[i];
    const T = targetOf(p.s, p.a, t);

    /* —— 目标弹簧 + 细微量子抖动 —— */
    const jx = Math.sin(t * 2.7 + p.ph)       * 4 * SC;
    const jy = Math.cos(t * 3.1 + p.ph * 1.7) * 4 * SC;

    let fx = (T.x + jx - p.x) * K;
    let fy = (T.y + jy - p.y) * K;

    /* —— 邻域搜索（3×3 网格） —— */
    let sepX = 0, sepY = 0;
    let aliX = 0, aliY = 0;
    let cohX = 0, cohY = 0;
    let cnt  = 0;

    const gx = Math.floor(p.x / CELL) + 1;
    const gy = Math.floor(p.y / CELL) + 1;

    for (let oy = -1; oy <= 1; oy++) {
      const yy = gy + oy;
      if (yy < 0 || yy >= GH) continue;
      const row = yy * GW;
      for (let ox = -1; ox <= 1; ox++) {
        const xx = gx + ox;
        if (xx < 0 || xx >= GW) continue;
        const arr = buckets[row + xx];
        for (let m = 0; m < arr.length; m++) {
          const q = arr[m];
          if (q === p) continue;

          const ddx = p.x - q.x;
          const ddy = p.y - q.y;
          const d2  = ddx * ddx + ddy * ddy;
          if (d2 > SEP_R2 || d2 < 1e-6) continue;

          const d = Math.sqrt(d2);
          const f = (SEP_R - d) / SEP_R;

          sepX += (ddx / d) * f;
          sepY += (ddy / d) * f;

          aliX += q.vx;  aliY += q.vy;
          cohX += q.x;   cohY += q.y;
          cnt++;
        }
      }
    }

    if (cnt > 0) {
      /* 分离：方向归一化后限幅，避免爆炸 */
      const sm = Math.hypot(sepX, sepY);
      if (sm > 1) { sepX /= sm; sepY /= sm; }
      fx += sepX * W_SEP;
      fy += sepY * W_SEP;

      const inv = 1 / cnt;
      /* 对齐 */
      fx += (aliX * inv - p.vx) * W_ALI;
      fy += (aliY * inv - p.vy) * W_ALI;
      /* 聚合 */
      fx += (cohX * inv - p.x) * W_COH;
      fy += (cohY * inv - p.y) * W_COH;
    }

    /* —— 积分 —— */
    p.vx = (p.vx + fx * dt) * damp;
    p.vy = (p.vy + fy * dt) * damp;

    const sp = Math.hypot(p.vx, p.vy);
    if (sp > MAXV) {
      const k = MAXV / sp;
      p.vx *= k;  p.vy *= k;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

/* ================================================================== */
/*  渲染：粒子                                                          */
/* ================================================================== */
function drawParticles() {
  ctx.save();
  ctx.beginPath();
  ctx.rect(PW, 0, RW, H);
  ctx.clip();
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < N; i++) {
    const p  = parts[i];
    const sz = p.sz;
    ctx.globalAlpha = p.al;
    ctx.drawImage(
      p.gold ? SPR_GOLD : SPR_GREEN,
      p.x - sz * 0.5, p.y - sz * 0.5, sz, sz
    );
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ================================================================== */
/*  渲染：左侧 Boids 公式                                               */
/* ================================================================== */
function drawFormula(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cx = PW / 2;
  const cy = H * 0.40;
  const fs = Math.max(12, Math.min(PW * 0.105, H * 0.040));

  const serif = `italic ${fs}px "Cambria Math","Times New Roman",Georgia,serif`;
  const rows  = ['F = ws·Sep', '+ wa·Ali', '+ wc·Coh'];

  /* —— 观测扰动虚影 —— */
  ctx.font = serif;
  for (let k = 0; k < 4; k++) {
    const jx = Math.sin(t * 11.3 + k * 2.4) * fs * 0.07;
    const jy = Math.cos(t * 9.7  + k * 1.9) * fs * 0.07;
    ctx.globalAlpha = 0.07 + 0.06 * (0.5 + 0.5 * Math.sin(t * 5.1 + k * 3.3));
    ctx.fillStyle   = (k % 2) ? '#4dff9c' : '#ffd24d';
    for (let i = 0; i < rows.length; i++) {
      ctx.fillText(rows[i], cx + jx, cy + (i - 1) * fs * 1.38 + jy);
    }
  }

  /* —— 主字 —— */
  ctx.globalAlpha = 1;
  ctx.shadowColor = '#3dff9e';
  ctx.shadowBlur  = fs * 0.85;
  ctx.fillStyle   = '#eafff4';
  for (let i = 0; i < rows.length; i++) {
    ctx.fillText(rows[i], cx, cy + (i - 1) * fs * 1.38);
  }
  ctx.shadowBlur = 0;

  /* —— 分隔线 —— */
  const dy = cy + fs * 1.35;
  ctx.strokeStyle = 'rgba(80,220,150,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - PW * 0.30, dy);
  ctx.lineTo(cx + PW * 0.30, dy);
  ctx.stroke();

  /* —— 图例 —— */
  const fs2 = Math.max(9, fs * 0.52);
  ctx.font = `${fs2}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;

  const items = [
    ['Sep · 分离', '#4dff9c'],
    ['Ali · 对齐', '#9dff6a'],
    ['Coh · 聚合', '#ffd24d']
  ];
  for (let i = 0; i < items.length; i++) {
    const y = dy + fs2 * 1.9 + i * fs2 * 1.85;
    ctx.globalAlpha = 0.55 + 0.30 * (0.5 + 0.5 * Math.sin(t * 2.2 + i * 1.3));
    ctx.fillStyle   = items[i][1];
    ctx.fillText(items[i][0], cx, y);
  }

  /* —— 底部小注 —— */
  ctx.globalAlpha = 0.30 + 0.16 * (0.5 + 0.5 * Math.sin(t * 1.7));
  ctx.font = `italic ${fs2}px "Cambria Math","Times New Roman",Georgia,serif`;
  ctx.fillStyle = '#9fd8ff';
  ctx.fillText('|v| ≤ v_max', cx, dy + fs2 * 8.4);

  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ================================================================== */
/*  渲染：中缝光带                                                      */
/* ================================================================== */
function drawDivider() {
  const g = ctx.createLinearGradient(PW - 34, 0, PW + 34, 0);
  g.addColorStop(0.0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, 'rgba(60,220,140,0.20)');
  g.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(PW - 34, 0, 68, H);
}

/* ================================================================== */
/*  尺寸变化                                                            */
/* ================================================================== */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  W = innerWidth;
  H = innerHeight;

  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  PW = Math.max(120, W * 0.2);     // 左侧 1/5
  RW = W - PW;                     // 右侧 4/5
  CX = PW + RW * 0.5;
  CY = H  * 0.5;

  SC = Math.min(RW / 760, H / 660);
  if (SC < 0.42) SC = 0.42;

  initParticles();
}
addEventListener('resize', resize);

/* ================================================================== */
/*  主循环                                                              */
/* ================================================================== */
let T = 0, last = 0;

function loop(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;      // 防止切后台后跳变
  if (dt < 0.0005) dt = 0.0005;
  T += dt;

  /* —— 拖尾：整屏渐隐 —— */
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  ctx.fillRect(0, 0, W, H);

  /* —— 物理 —— */
  update(dt, T);

  /* —— 绘制 —— */
  drawParticles();
  drawDivider();
  drawFormula(T);

  requestAnimationFrame(loop);
}

/* 启动 */
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
