<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发光萤火虫 · Glowing Fireflies</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #071a24 0%, #03101a 55%, #010509 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #d8f0e6;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding: 22px;
    display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap;
  }
  .stage {
    flex: 1 1 580px; min-width: 300px;
    position: relative;
    aspect-ratio: 760 / 520;
    border-radius: 26px;
    overflow: hidden;
    background: #020a10;
    box-shadow: 0 24px 56px -24px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(180, 255, 160, .13) inset;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  .sound-toggle {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    background: rgba(8, 30, 36, .84);
    color: #c8ff9e;
    box-shadow: 0 5px 16px -5px rgba(0, 0, 0, .85),
                0 0 0 1px rgba(180, 255, 160, .28) inset;
    transition: transform .12s;
    z-index: 3;
  }
  .sound-toggle:active { transform: scale(.92); }

  .panel {
    flex: 0 1 352px; min-width: 292px;
    background: rgba(7, 24, 30, .78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 26px;
    padding: 22px 22px 18px;
    box-shadow: 0 24px 56px -26px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(180, 255, 160, .12) inset;
    display: flex; flex-direction: column; gap: 13px;
  }
  h1 {
    font-size: 20px; margin: 0; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
    color: #e6ffe0;
  }
  h1 .emoji { font-size: 23px; }

  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 15.5px; text-align: center;
    padding: 11px 10px; border-radius: 15px;
    background: linear-gradient(135deg, rgba(22, 52, 38, .92), rgba(12, 34, 42, .92));
    color: #9ff0a8;
    letter-spacing: .4px;
    box-shadow: 0 0 0 1px rgba(160, 250, 150, .2) inset;
    line-height: 1.7;
  }
  .formula b { color: #ffe08a; font-weight: 700; }
  .formula .note { font-size: 12px; color: #7fa88c; letter-spacing: .3px; }

  .readout {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
    padding: 11px 13px; border-radius: 15px;
    background: rgba(10, 34, 36, .92);
    box-shadow: 0 0 0 1px rgba(160, 250, 150, .16) inset;
    font-size: 12.5px;
  }
  .readout .k { color: #6fa88a; font-weight: 700; }
  .readout .v {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    color: #b6ff9e; font-weight: 700; font-size: 13.5px;
    text-align: right;
  }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    color: #8ab8a0;
  }
  .field .val {
    color: #b6ff9e; font-variant-numeric: tabular-nums; font-size: 13.5px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #2a6b46, #9be86c);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: #06201a; border: 3.5px solid #9be86c;
    box-shadow: 0 0 12px rgba(160, 240, 110, .7);
    transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #06201a; border: 3.5px solid #9be86c;
    box-shadow: 0 0 12px rgba(160, 240, 110, .7);
  }
  input[type=range]::-moz-range-track {
    height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #2a6b46, #9be86c);
  }

  .btns { display: flex; gap: 10px; }
  button.main {
    flex: 1; padding: 11px 8px; border: none; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: .4px;
    background: linear-gradient(180deg, #9be86c, #5fb63c);
    color: #08200a;
    box-shadow: 0 7px 18px -8px rgba(140, 230, 110, .95);
    transition: transform .12s, filter .12s;
  }
  button.main:hover { filter: brightness(1.08); }
  button.main:active { transform: translateY(2px) scale(.98); }
  button.main.ghost {
    flex: 0 0 auto; padding: 11px 18px;
    background: rgba(12, 40, 38, .95);
    color: #b6ff9e;
    box-shadow: 0 5px 14px -8px rgba(0, 0, 0, .9),
                0 0 0 1.5px rgba(160, 250, 150, .24) inset;
  }

  .hint {
    margin: 0; font-size: 12.5px; line-height: 1.7; color: #5f8878;
    text-align: center;
  }
  .hint kbd {
    background: rgba(16, 48, 44, .9); border-radius: 5px; padding: 1px 6px;
    font-family: inherit; font-size: 11.5px; color: #b6ff9e;
    box-shadow: 0 0 0 1px rgba(160, 250, 150, .22) inset;
  }
  @media (max-width: 740px) {
    .wrap { padding: 14px; gap: 16px; }
    .panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
  </div>

  <div class="panel">
    <h1><span class="emoji">✨</span> 发光萤火虫</h1>

    <div class="formula">
      B<sub>i</sub>(t) = [0.5 + 0.5·sin(2π<b>f</b>t + φ<sub>i</sub>)]<sup>2.4</sup><br>
      <span class="note">φ<sub>i</sub> = (x<sub>i</sub>/W) · Δφ　相位随位置线性分布</span>
    </div>

    <div class="readout">
      <span class="k">闪烁频率 f</span><span class="v" id="roF">0.75 Hz</span>
      <span class="k">周期 T</span><span class="v" id="roT">1.33 s</span>
      <span class="k">相位跨度 Δφ</span><span class="v" id="roSpan">2.00 π</span>
      <span class="k">同时亮起的比例</span><span class="v" id="roLit">—</span>
    </div>

    <div class="field">
      <div class="row"><span>萤火虫数量</span><span class="val" id="cntVal">48</span></div>
      <input type="range" id="cntRange" min="12" max="100" step="1" value="48">
    </div>

    <div class="field">
      <div class="row"><span>闪烁频率 f</span><span class="val" id="fVal">0.75 Hz</span></div>
      <input type="range" id="fRange" min="20" max="250" step="1" value="75">
    </div>

    <div class="field">
      <div class="row"><span>相位跨度 Δφ</span><span class="val" id="spanVal">2.00 π</span></div>
      <input type="range" id="spanRange" min="0" max="400" step="1" value="200">
    </div>

    <div class="field">
      <div class="row"><span>频率离散度</span><span class="val" id="spVal">0.12</span></div>
      <input type="range" id="spRange" min="0" max="60" step="1" value="12">
    </div>

    <div class="btns">
      <button class="main" id="btnSync">让全场同步</button>
      <button class="main ghost" id="btnReset">重置</button>
    </div>

    <p class="hint">
      把「频率离散度」调到 0，再调「相位跨度」<br>
      就能看到光点连成一条扫过夜空的<b>波动光带</b> · <kbd>点击画面</kbd> 惊起一片微光
    </p>

  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     基础
  ============================================================ */
  const W = 760, H = 520;
  const TAU = Math.PI * 2;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  let KX = 1, KY = 1;

  function resizeCanvas() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.max(1, Math.round(rect.width  * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
    KX = cv.width / W;
    KY = cv.height / H;
  }
  window.addEventListener('resize', resizeCanvas);

  const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;

  /* ============================================================
     音频
  ============================================================ */
  let ac = null, masterGain = null, muted = false;

  function ensureAudio() {
    if (muted) return null;
    if (ac) {
      if (ac.state === 'suspended') ac.resume();
      return ac;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();

    masterGain = ac.createGain();
    masterGain.gain.value = 0.9;

    // 整体柔化
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 5200;
    lp.Q.value = 0.6;

    masterGain.connect(lp);
    lp.connect(ac.destination);

    return ac;
  }

  /** 萤火虫闪烁音：柔和的双分音铃响 */
  function playChirp(freq, vol) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    vol = Math.max(0.006, Math.min(0.05, vol));

    const o1 = ac.createOscillator();
    const o2 = ac.createOscillator();
    const g1 = ac.createGain();
    const g2 = ac.createGain();
    const out = ac.createGain();

    o1.type = 'sine';
    o1.frequency.setValueAtTime(freq, t);
    o2.type = 'sine';
    o2.frequency.setValueAtTime(freq * 2.01, t);

    g1.gain.value = 1;
    g2.gain.value = 0.26;

    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 0.46);

    o1.connect(g1); g1.connect(out);
    o2.connect(g2); g2.connect(out);
    out.connect(masterGain);

    o1.start(t); o1.stop(t + 0.5);
    o2.start(t); o2.stop(t + 0.5);
  }

  /** 点击惊起：一阵清脆的上行音 */
  function playStartle() {
    if (!ac || muted) return;
    const base = 620;
    for (let i = 0; i < 5; i++) {
      const f = base * Math.pow(1.18, i);
      const t = ac.currentTime + i * 0.045;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.024 - i * 0.003, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      o.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t + 0.38);
    }
  }

  let lastBlip = 0;
  function sndBlip(freq) {
    const now = performance.now();
    if (now - lastBlip < 70) return;
    lastBlip = now;
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.022, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.13);
  }

  /* ============================================================
     参数
  ============================================================ */
  const P = {
    count: 48,
    freq: 0.75,
    phaseSpan: Math.PI * 2,
    spread: 0.12
  };

  /* ============================================================
     光晕精灵
  ============================================================ */
  function makeGlowSprite(hue) {
    const S = 96;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    grd.addColorStop(0.00, 'rgba(255, 255, 235, 1)');
    grd.addColorStop(0.10, 'hsla(' + hue + ', 100%, 82%, 0.96)');
    grd.addColorStop(0.26, 'hsla(' + hue + ', 100%, 66%, 0.52)');
    grd.addColorStop(0.52, 'hsla(' + hue + ', 100%, 58%, 0.16)');
    grd.addColorStop(0.78, 'hsla(' + hue + ', 100%, 52%, 0.04)');
    grd.addColorStop(1.00, 'hsla(' + hue + ', 100%, 50%, 0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);
    return c;
  }

  const SPRITES = [makeGlowSprite(68), makeGlowSprite(78), makeGlowSprite(88), makeGlowSprite(58)];

  /* ============================================================
     状态
  ============================================================ */
  const S = {
    time: 0,
    litRatio: 0
  };

  const fireflies = [];
  const ripples = [];
  const soundQueue = [];
  let lastSoundAt = 0;

  /* ---------- 音阶（五声，从左到右音高升高） ---------- */
  const SCALE = [
    261.63, 293.66, 329.63, 392.00, 440.00,
    523.25, 587.33, 659.25, 783.99, 880.00, 1046.50
  ];

  /* ============================================================
     生成 / 重建萤火虫
  ============================================================ */
  function buildFireflies() {
    fireflies.length = 0;
    const n = P.count;

    for (let i = 0; i < n; i++) {
      const bx = 24 + Math.random() * (W - 48);
      const by = 56 + Math.random() * (H - 160);

      fireflies.push({
        bx: bx,
        by: by,
        x: bx,
        y: by,
        seed1: Math.random() * TAU,
        seed2: Math.random() * TAU,
        seed3: Math.random() * TAU,
        seed4: Math.random() * TAU,
        amp1: 24 + Math.random() * 46,
        amp2: 14 + Math.random() * 34,
        size: 7 + Math.random() * 9,
        sprite: SPRITES[i % SPRITES.length],
        freqMul: 1 + (Math.random() - 0.5) * P.spread,
        phaseJitter: (Math.random() - 0.5) * 0.34,
        phase: 0,
        bright: 0,
        raw: 0,
        boost: 0,
        wasHigh: false,
        toneIndex: 0
      });
    }

    // 按基准 x 排序，便于相位线性分布
    fireflies.sort(function (a, b) { return a.bx - b.bx; });

    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      f.phase = (f.bx / W) * P.phaseSpan + f.phaseJitter;
      f.toneIndex = Math.min(SCALE.length - 1,
        Math.round((f.bx / W) * (SCALE.length - 1)));
    }
  }

  function refreshPhases() {
    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      f.phase = (f.bx / W) * P.phaseSpan + f.phaseJitter;
    }
  }

  function refreshFreqMul() {
    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      f.freqMul = 1 + (Math.random() - 0.5) * P.spread;
    }
  }

  /* ============================================================
     更新
  ============================================================ */
  function update(dt) {
    S.time += dt;
    const t = S.time;

    let lit = 0;

    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];

      // ---- 漂浮运动（多重正弦叠加） ----
      f.x = f.bx + Math.sin(t * 0.31 + f.seed1) * f.amp1
                  + Math.sin(t * 0.17 + f.seed2) * (f.amp1 * 0.42);
      f.y = f.by + Math.cos(t * 0.27 + f.seed3) * f.amp2
                  + Math.cos(t * 0.13 + f.seed4) * (f.amp2 * 0.55)
                  + Math.sin(t * 1.6 + f.seed1) * 3.2;

      // ---- 发光计算 ----
      let raw = 0.5 + 0.5 * Math.sin(TAU * P.freq * f.freqMul * t + f.phase);
      raw += f.boost;
      raw = clamp01(raw);
      f.raw = raw;

      // 2.4 次幂 → 峰值更锐利，形成明显的"一闪一闪"
      f.bright = Math.pow(raw, 2.4);

      if (f.bright > 0.30) lit++;

      // ---- 增强衰减 ----
      f.boost *= Math.exp(-dt * 2.4);
      if (f.boost < 0.002) f.boost = 0;

      // ---- 峰值检测 → 声音队列 ----
      const high = f.bright > 0.86;
      if (high && !f.wasHigh) {
        if (soundQueue.length < 4) soundQueue.push(f);
      }
      f.wasHigh = high;
    }

    S.litRatio = fireflies.length ? lit / fireflies.length : 0;

    // ---- 声音调度（节流） ----
    const nowMs = performance.now();
    if (soundQueue.length && nowMs - lastSoundAt > 82) {
      lastSoundAt = nowMs;
      const f = soundQueue.shift();
      if (ac && !muted) {
        const vol = 0.012 + f.bright * 0.030;
        playChirp(SCALE[f.toneIndex], vol);
      }
    }

    // ---- 涟漪 ----
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += dt * 260;
      r.life -= dt * 1.1;
      if (r.life <= 0) ripples.splice(i, 1);
    }
  }

  /* ============================================================
     背景元素
  ============================================================ */
  const STARS = [];
  for (let i = 0; i < 110; i++) {
    STARS.push({
      x: Math.random() * W,
      y: Math.random() * (H * 0.72),
      r: 0.4 + Math.random() * 1.15,
      ph: Math.random() * TAU,
      sp: 0.8 + Math.random() * 1.8
    });
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.00, '#071c26');
    g.addColorStop(0.35, '#04141e');
    g.addColorStop(0.68, '#020c12');
    g.addColorStop(1.00, '#01060a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 星星
    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      const tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(S.time * s.sp + s.ph));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fillStyle = 'rgba(200, 235, 255, ' + (tw * 0.55) + ')';
      ctx.fill();
    }

    // 月亮
    const mx = 646, my = 78;
    const mg = ctx.createRadialGradient(mx, my, 6, mx, my, 150);
    mg.addColorStop(0, 'rgba(200, 240, 220, 0.18)');
    mg.addColorStop(0.45, 'rgba(160, 220, 200, 0.06)');
    mg.addColorStop(1, 'rgba(160, 220, 200, 0)');
    ctx.fillStyle = mg;
    ctx.fillRect(mx - 150, my - 150, 300, 300);

    ctx.beginPath();
    ctx.arc(mx, my, 21, 0, TAU);
    ctx.fillStyle = 'rgba(226, 250, 235, 0.86)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(mx - 8, my + 5, 18, 0, TAU);
    ctx.fillStyle = 'rgba(180, 225, 205, 0.22)';
    ctx.fill();
  }

  function drawGround() {
    const gy = H - 108;

    // 远山
    ctx.beginPath();
    ctx.moveTo(0, gy + 26);
    ctx.quadraticCurveTo(120, gy - 42, 250, gy + 10);
    ctx.quadraticCurveTo(360, gy - 30, 480, gy + 16);
    ctx.quadraticCurveTo(610, gy - 36, 760, gy + 20);
    ctx.lineTo(760, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = 'rgba(4, 14, 14, 0.92)';
    ctx.fill();

    // 地面
    const gg = ctx.createLinearGradient(0, gy + 40, 0, H);
    gg.addColorStop(0, '#04100c');
    gg.addColorStop(1, '#010604');
    ctx.fillStyle = gg;
    ctx.fillRect(0, gy + 40, W, H - gy - 40);

    // 草丛剪影
    ctx.strokeStyle = 'rgba(6, 24, 16, 0.95)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    for (let i = 0; i < 90; i++) {
      const x = (i * 8.7 + 5) % (W + 20) - 10;
      const baseY = H - 4 - ((i * 37) % 34);
      const hgt = 22 + ((i * 53) % 46);
      const bend = ((i * 17) % 13) - 6 + Math.sin(S.time * 0.7 + i * 0.4) * 2.4;
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.quadraticCurveTo(x + bend * 0.6, baseY - hgt * 0.6, x + bend * 1.5, baseY - hgt);
      ctx.stroke();
    }
  }

  /* ============================================================
     绘制：涟漪
  ============================================================ */
  function drawRipples() {
    for (let i = 0; i < ripples.length; i++) {
      const r = ripples[i];
      const a = Math.max(0, r.life);
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.strokeStyle = 'rgba(180, 255, 170, ' + (a * 0.28) + ')';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r * 0.78, 0, TAU);
      ctx.strokeStyle = 'rgba(220, 255, 200, ' + (a * 0.14) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  /* ============================================================
     绘制：萤火虫
  ============================================================ */
  function drawFireflies() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      const b = f.bright;

      // 光晕
      const size = f.size * (2.0 + b * 3.4);
      ctx.globalAlpha = Math.min(1, 0.10 + b * 0.92);
      ctx.drawImage(f.sprite, f.x - size / 2, f.y - size / 2, size, size);

      // 核心亮点
      if (b > 0.06) {
        ctx.globalAlpha = Math.min(1, b * 1.05);
        ctx.beginPath();
        ctx.arc(f.x, f.y, 1.4 + b * 2.4, 0, TAU);
        ctx.fillStyle = 'rgba(255, 255, 238, 0.98)';
        ctx.fill();
      }
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ============================================================
     绘制：亮度曲线面板（展示正弦相位分布）
  ============================================================ */
  function drawWavePanel() {
    const bx = 22, by = H - 74, bw = 216, bh = 52;

    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 11);
    else ctx.rect(bx, by, bw, bh);
    ctx.fillStyle = 'rgba(3, 16, 18, 0.72)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(160, 250, 150, 0.16)';
    ctx.lineWidth = 1;
    ctx.stroke();

    const midY = by + bh * 0.5;

    // 中轴线
    ctx.beginPath();
    ctx.moveTo(bx + 8, midY);
    ctx.lineTo(bx + bw - 8, midY);
    ctx.strokeStyle = 'rgba(160, 250, 150, 0.14)';
    ctx.setLineDash([3, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 相位分布曲线：展示从 0 到 Δφ 的正弦采样
    const N = 96;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const ph = u * P.phaseSpan;
      const v = 0.5 + 0.5 * Math.sin(TAU * P.freq * S.time + ph);
      const x = bx + 8 + u * (bw - 16);
      const y = midY - (v - 0.5) * (bh - 16);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(150, 245, 130, 0.85)';
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // 采样点（代表萤火虫）
    const dots = Math.min(22, fireflies.length);
    for (let i = 0; i < dots; i++) {
      const u = dots > 1 ? i / (dots - 1) : 0.5;
      const ph = u * P.phaseSpan;
      const v = 0.5 + 0.5 * Math.sin(TAU * P.freq * S.time + ph);
      const x = bx + 8 + u * (bw - 16);
      const y = midY - (v - 0.5) * (bh - 16);

      ctx.beginPath();
      ctx.arc(x, y, 2.1, 0, TAU);
      ctx.fillStyle = 'rgba(210, 255, 170, ' + (0.28 + v * 0.72) + ')';
      ctx.fill();
    }

    // 标签
    ctx.font = '600 10px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(150, 220, 160, 0.5)';
    ctx.fillText('沿 x 轴的相位分布', bx + 9, by + 13);

    ctx.restore();
  }

  /* ============================================================
     绘制：HUD
  ============================================================ */
  function drawHud() {
    ctx.font = '600 12.5px -apple-system, "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(160, 235, 165, 0.44)';

    let tag;
    if (P.spread < 0.02 && P.phaseSpan > 0.3) {
      tag = '同步模式 · 光带正在扫过夜空';
    } else if (P.spread < 0.02) {
      tag = '全场同相 · 一起明灭';
    } else if (P.phaseSpan < 0.15) {
      tag = '全场同相 · 一起明灭';
    } else {
      tag = '自由闪烁 · 离散度 ' + P.spread.toFixed(2);
    }

    ctx.fillText(tag, 24, 34);
  }

  /* ============================================================
     渲染
  ============================================================ */
  function render() {
    ctx.setTransform(KX, 0, 0, KY, 0, 0);
    ctx.clearRect(0, 0, W, H);

    drawSky();
    drawGround();
    drawRipples();
    drawFireflies();
    drawWavePanel();
    drawHud();
  }

  /* ============================================================
     主循环
  ============================================================ */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     UI
  ============================================================ */
  const cntRange = document.getElementById('cntRange');
  const fRange = document.getElementById('fRange');
  const spanRange = document.getElementById('spanRange');
  const spRange = document.getElementById('spRange');

  const cntVal = document.getElementById('cntVal');
  const fVal = document.getElementById('fVal');
  const spanVal = document.getElementById('spanVal');
  const spVal = document.getElementById('spVal');

  const roF = document.getElementById('roF');
  const roT = document.getElementById('roT');
  const roSpan = document.getElementById('roSpan');
  const roLit = document.getElementById('roLit');

  function syncLabels() {
    cntVal.textContent = P.count;
    fVal.textContent = P.freq.toFixed(2) + ' Hz';
    spanVal.textContent = (P.phaseSpan / Math.PI).toFixed(2) + ' π';
    spVal.textContent = P.spread.toFixed(2);

    roF.textContent = P.freq.toFixed(2) + ' Hz';
    roT.textContent = (1 / P.freq).toFixed(2) + ' s';
    roSpan.textContent = (P.phaseSpan / Math.PI).toFixed(2) + ' π';
  }

  setInterval(function () {
    roLit.textContent = Math.round(S.litRatio * 100) + '%';
  }, 120);

  cntRange.addEventListener('input', function () {
    P.count = +this.value;
    cntVal.textContent = P.count;
    buildFireflies();
    sndBlip(300 + P.count * 5);
  });

  fRange.addEventListener('input', function () {
    P.freq = +this.value / 100;
    syncLabels();
    sndBlip(280 + P.freq * 220);
  });

  spanRange.addEventListener('input', function () {
    P.phaseSpan = (+this.value / 100) * Math.PI;
    syncLabels();
    refreshPhases();
    sndBlip(340 + (+this.value) * 1.1);
  });

  spRange.addEventListener('input', function () {
    P.spread = +this.value / 100;
    spVal.textContent = P.spread.toFixed(2);
    refreshFreqMul();
    sndBlip(400 + P.spread * 300);
  });

  document.getElementById('btnSync').addEventListener('click', function () {
    ensureAudio();
    // 离散度归零 + 相位跨度设为 2π → 形成清晰的行进光带
    P.spread = 0;
    spRange.value = 0;
    spVal.textContent = '0.00';
    refreshFreqMul();

    P.phaseSpan = Math.PI * 2;
    spanRange.value = 200;
    syncLabels();
    refreshPhases();

    // 惊起一片微光
    playStartle();
    for (let i = 0; i < fireflies.length; i++) {
      fireflies[i].boost = 0.5;
    }
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    ensureAudio();
    P.count = 48;
    P.freq = 0.75;
    P.phaseSpan = Math.PI * 2;
    P.spread = 0.12;

    cntRange.value = 48;
    fRange.value = 75;
    spanRange.value = 200;
    spRange.value = 12;

    buildFireflies();
    syncLabels();

    sndBlip(523.25);
    setTimeout(function () { sndBlip(659.25); }, 90);
  });

  /* ---------- 点击画面：惊起微光 ---------- */
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();

    const rect = cv.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width * W;
    const my = (e.clientY - rect.top) / rect.height * H;

    ripples.push({ x: mx, y: my, r: 6, life: 1 });

    // 按距离给附近的萤火虫一个亮度脉冲
    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      const d = Math.hypot(f.x - mx, f.y - my);
      const boost = Math.max(0, 1 - d / 190) * 0.95;
      if (boost > f.boost) f.boost = boost;
    }

    playStartle();
  });

  /* ---------- 音效开关 ---------- */
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function () {
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    if (!muted) {
      ensureAudio();
      sndBlip(880);
    }
  });

  /* ============================================================
     启动
  ============================================================ */
  resizeCanvas();
  buildFireflies();
  syncLabels();
  requestAnimationFrame(loop);

  window.addEventListener('pointerdown', function once() {
    ensureAudio();
    window.removeEventListener('pointerdown', once);
  });

})();
</script>
</body>
