<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>数学曲线之美 · 傅里叶曲线编织</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a14;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', serif;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      left: 0;
      right: 0;
      text-align: center;
    }
    #title-overlay {
      top: clamp(16px, 4vh, 42px);
    }
    #title-overlay h1 {
      font-size: clamp(1.2rem, 2.8vw, 1.9rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #f5eedd;
      text-shadow: 0 0 30px rgba(210, 180, 140, 0.5), 0 0 80px rgba(160, 130, 90, 0.25);
      margin: 0;
      line-height: 1.3;
    }
    #title-overlay .subtitle {
      font-size: clamp(0.7rem, 1.4vw, 0.95rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: #b8aa90;
      text-shadow: 0 0 18px rgba(180, 150, 110, 0.35);
      margin-top: 6px;
    }
    #formula-overlay {
      bottom: clamp(20px, 5vh, 50px);
    }
    .formula-box {
      display: inline-block;
      background: rgba(18, 16, 12, 0.7);
      border: 1px solid rgba(180, 145, 100, 0.35);
      border-radius: 14px;
      padding: clamp(10px, 2vh, 18px) clamp(20px, 3.5vw, 36px);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      box-shadow: 0 10px 36px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
      transition: opacity 0.8s ease;
    }
    .formula-line {
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      color: #d4c8aa;
      letter-spacing: 0.05em;
      line-height: 1.9;
      font-style: italic;
      white-space: nowrap;
    }
    .fn { color: #e8c97a; font-style: normal; font-weight: bold; }
    .paren { color: #c4a870; font-style: normal; }
    .op { color: #b8956e; font-style: normal; }
    .sum-symbol { color: #c9aa5e; font-style: normal; font-size: 1.3em; }
    .param { color: #a09070; font-style: normal; }
    @media (max-width: 600px) {
      .formula-line { font-size: 0.7rem; letter-spacing: 0.02em; white-space: normal; }
      .formula-box { padding: 8px 12px; border-radius: 10px; }
      #title-overlay h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="overlay" id="title-overlay">
    <h1>数学曲线之美</h1>
    <div class="subtitle">傅里叶曲线编织 · Fourier Curve Weave</div>
  </div>

  <div class="overlay" id="formula-overlay">
    <div class="formula-box">
      <div class="formula-line">
        <span class="fn">x</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="sum-symbol">Σ</span> <span class="fn">aₙ sin</span><span class="paren">(</span>ωₙ t <span class="op">+</span> φₙ<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">y</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="sum-symbol">Σ</span> <span class="fn">bₙ cos</span><span class="paren">(</span>νₙ t <span class="op">+</span> ψₙ<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">z</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="sum-symbol">Σ</span> <span class="fn">cₙ sin</span><span class="paren">(</span>λₙ t <span class="op">+</span> θₙ<span class="paren">)</span>
      </div>
      <div class="formula-line" style="margin-top: 4px; color: #b8a070; font-style: normal; font-size: 0.8em;">
        ω,ν,λ ∈ ℤ⁺ , n=1..3 , t ∈ [0,2π]
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ----- DOM 元素 -----
    const container = document.getElementById('canvas-container');
    const formulaBox = document.querySelector('.formula-box');

    // ----- 场景初始化 -----
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a14, 0.0001);

    // 相机
    const camera = new THREE.PerspectiveCamera(
      48,
      container.clientWidth / container.clientHeight,
      0.4,
      30
    );
    camera.position.set(3.8, 2.0, 5.8);
    camera.lookAt(0, 0, 0);

    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x0a0a14);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // ----- 背景星场 -----
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 460;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 10 + Math.random() * 12;
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({
      color: 0xd3cdbc,
      size: 0.02,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // ----- 曲线参数 -----
    const TOTAL_VERTICES = 3000;          // 每条曲线的顶点数
    const CURVE_COUNT = 48;              // 曲线数量
    const GROW_DURATION = 15.0;
    const PAUSE_DURATION = 1.5;
    const SHRINK_DURATION = 15.0;
    const CYCLE_TOTAL = GROW_DURATION + PAUSE_DURATION + SHRINK_DURATION;

    // 为每条曲线生成傅里叶级数参数（每个轴3项）
    function buildCurveParams(count) {
      const params = [];
      const freqPool = [2, 3, 4, 5, 6, 7, 8];
      for (let i = 0; i < count; i++) {
        // X轴参数：频率ω₁,ω₂,ω₃，相位φ₁,φ₂,φ₃，振幅a₁,a₂,a₃
        const wx1 = freqPool[i % freqPool.length];
        const wx2 = freqPool[(i + 2) % freqPool.length];
        const wx3 = freqPool[(i + 5) % freqPool.length];
        const phx1 = (i * 0.73) % (Math.PI * 2);
        const phx2 = (i * 0.91 + 0.8) % (Math.PI * 2);
        const phx3 = (i * 0.55 + 2.1) % (Math.PI * 2);
        const ax1 = 0.35 + (i % 5) * 0.05;
        const ax2 = 0.28 + ((i + 1) % 5) * 0.04;
        const ax3 = 0.22 + ((i + 3) % 5) * 0.04;

        // Y轴参数：频率ν₁,ν₂,ν₃，相位ψ₁,ψ₂,ψ₃，振幅b₁,b₂,b₃
        const wy1 = freqPool[(i + 1) % freqPool.length];
        const wy2 = freqPool[(i + 4) % freqPool.length];
        const wy3 = freqPool[(i + 6) % freqPool.length];
        const phy1 = (i * 0.81 + 0.4) % (Math.PI * 2);
        const phy2 = (i * 0.63 + 1.7) % (Math.PI * 2);
        const phy3 = (i * 0.92 + 2.8) % (Math.PI * 2);
        const by1 = 0.35 + ((i + 2) % 5) * 0.05;
        const by2 = 0.28 + ((i + 4) % 5) * 0.04;
        const by3 = 0.22 + ((i + 0) % 5) * 0.04;

        // Z轴参数：频率λ₁,λ₂,λ₃，相位θ₁,θ₂,θ₃，振幅c₁,c₂,c₃
        const wz1 = freqPool[(i + 3) % freqPool.length];
        const wz2 = freqPool[(i + 7) % freqPool.length];
        const wz3 = freqPool[(i + 2) % freqPool.length];
        const phz1 = (i * 0.68 + 0.2) % (Math.PI * 2);
        const phz2 = (i * 0.84 + 1.4) % (Math.PI * 2);
        const phz3 = (i * 0.57 + 3.0) % (Math.PI * 2);
        const cz1 = 0.34 + (i % 5) * 0.04;
        const cz2 = 0.27 + ((i + 2) % 5) * 0.04;
        const cz3 = 0.21 + ((i + 4) % 5) * 0.04;

        params.push({
          wx1, wx2, wx3, phx1, phx2, phx3, ax1, ax2, ax3,
          wy1, wy2, wy3, phy1, phy2, phy3, by1, by2, by3,
          wz1, wz2, wz3, phz1, phz2, phz3, cz1, cz2, cz3
        });
      }
      return params;
    }
    const curveParamsList = buildCurveParams(CURVE_COUNT);

    // 每条曲线分配一个色相
    const hues = Array.from({ length: CURVE_COUNT }, (_, k) => (k / CURVE_COUNT + 0.07) % 1);

    // 生成一条傅里叶级数曲线的顶点位置和颜色
    function generateCurveData(p, hue) {
      const positions = new Float32Array(TOTAL_VERTICES * 3);
      const colors = new Float32Array(TOTAL_VERTICES * 3);
      for (let i = 0; i < TOTAL_VERTICES; i++) {
        const t = (i / (TOTAL_VERTICES - 1)) * Math.PI * 2;

        // x = Σ aₙ sin(ωₙ t + φₙ)
        const x = p.ax1 * Math.sin(p.wx1 * t + p.phx1)
                + p.ax2 * Math.sin(p.wx2 * t + p.phx2)
                + p.ax3 * Math.sin(p.wx3 * t + p.phx3);
        // y = Σ bₙ cos(νₙ t + ψₙ)
        const y = p.by1 * Math.cos(p.wy1 * t + p.phy1)
                + p.by2 * Math.cos(p.wy2 * t + p.phy2)
                + p.by3 * Math.cos(p.wy3 * t + p.phy3);
        // z = Σ cₙ sin(λₙ t + θₙ)
        const z = p.cz1 * Math.sin(p.wz1 * t + p.phz1)
                + p.cz2 * Math.sin(p.wz2 * t + p.phz2)
                + p.cz3 * Math.sin(p.wz3 * t + p.phz3);

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // 颜色微调
        const hueShift = Math.sin(t * 2.7 + hue * 12) * 0.02;
        const h = (hue + hueShift + 1) % 1;
        const s = 0.72 + Math.sin(t * 3.5 + hue * 9) * 0.12;
        const l = 0.52 + Math.cos(t * 5.1 + hue * 7) * 0.08;
        const color = new THREE.Color();
        color.setHSL(h, s, l);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      return { positions, colors };
    }

    // ----- 创建所有曲线 -----
    const curveGroup = new THREE.Group();
    scene.add(curveGroup);
    const allGeometries = [];

    curveParamsList.forEach((params, idx) => {
      const { positions, colors } = generateCurveData(params, hues[idx]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      // 初始完全隐藏
      geometry.setDrawRange(0, 0);

      const material = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.NormalBlending,
        depthTest: true,
        depthWrite: true,
      });
      const line = new THREE.Line(geometry, material);
      line.renderOrder = idx;
      curveGroup.add(line);
      allGeometries.push(geometry);
    });

    // ----- 装饰参考环 -----
    const ringGeo = new THREE.TorusGeometry(1.1, 0.006, 32, 150);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x3e3932,
      transparent: true,
      opacity: 0.22,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.renderOrder = 999;
    curveGroup.add(ring);

    const ring2Geo = new THREE.TorusGeometry(0.88, 0.005, 24, 110);
    const ring2Mat = new THREE.MeshBasicMaterial({
      color: 0x4c463d,
      transparent: true,
      opacity: 0.18,
      depthWrite: false,
    });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    ring2.rotation.x = Math.PI / 3;
    ring2.rotation.y = Math.PI / 5;
    ring2.renderOrder = 998;
    curveGroup.add(ring2);

    // ----- 动画状态 -----
    const clock = new THREE.Clock();
    let lastDrawCount = -1;
    let currentPhase = 'grow';

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // ----- 渲染循环（确保第一帧后持续更新）-----
    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const cycleTime = elapsed % CYCLE_TOTAL;

      let progress;
      if (cycleTime < GROW_DURATION) {
        const raw = cycleTime / GROW_DURATION;
        progress = easeInOutCubic(raw);
        currentPhase = 'grow';
      } else if (cycleTime < GROW_DURATION + PAUSE_DURATION) {
        progress = 1.0;
        currentPhase = 'pause';
      } else {
        const shrinkElapsed = cycleTime - (GROW_DURATION + PAUSE_DURATION);
        const raw = 1.0 - shrinkElapsed / SHRINK_DURATION;
        progress = easeInOutCubic(Math.max(0, Math.min(1, raw)));
        currentPhase = 'shrink';
      }

      const drawCount = Math.max(0, Math.floor(progress * TOTAL_VERTICES));

      // 只在绘制数量变化时更新几何体，提高性能
      if (drawCount !== lastDrawCount) {
        allGeometries.forEach(geo => geo.setDrawRange(0, drawCount));
        lastDrawCount = drawCount;
      }

      // 曲线组缓慢旋转并轻微摆动
      curveGroup.rotation.y += 0.0025;
      curveGroup.rotation.x = Math.sin(elapsed * 0.23) * 0.15;
      curveGroup.rotation.z = Math.cos(elapsed * 0.27) * 0.12;

      // 星场微动
      stars.rotation.y += 0.00022;
      stars.rotation.x += 0.00012;

      // 光环呼吸效果
      const breathe = 1 + Math.sin(elapsed * 0.7) * 0.04;
      ring.scale.setScalar(breathe);
      ring.material.opacity = 0.18 + Math.sin(elapsed * 0.55) * 0.06;
      ring2.scale.setScalar(1 + Math.cos(elapsed * 0.65) * 0.05);
      ring2.material.opacity = 0.15 + Math.cos(elapsed * 0.6) * 0.05;

      // 公式面板透明度随阶段变化
      if (formulaBox) {
        let op;
        if (currentPhase === 'pause') op = 0.95;
        else if (currentPhase === 'grow' && progress > 0.5) op = 0.5 + (progress - 0.5) * 0.9;
        else if (currentPhase === 'shrink' && progress < 0.5) op = 0.5 + progress * 0.9;
        else op = 0.55 + progress * 0.4;
        formulaBox.style.opacity = Math.max(0.35, Math.min(1, op));
      }

      renderer.render(scene, camera);
    }

    // ----- 响应式处理 -----
    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / Math.max(h, 1);
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }, 150);
    });

    // ----- 启动动画（确保第一帧完全隐藏）-----
    allGeometries.forEach(geo => geo.setDrawRange(0, 0));
    lastDrawCount = 0;
    clock.start();
    requestAnimationFrame(animate);

    console.log('%c🌐 傅里叶曲线编织 %c已启动', 'color:#e8c97a;font-size:1.1em;', 'color:#b8aa90;');
    console.log('%c'+CURVE_COUNT+'条傅里叶级数曲线 | 从无到有15s → 停顿1.5s → 从有到无15s | 完美闭合',
      'color:#b8956e;font-size:0.9em;');
  </script>
</body>
</html>
