<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面调和共振 - 数学公式之美</title>
    <style>
        :root {
            --bg: #06060f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        /* 标题覆盖层 */
        #title-overlay {
            position: fixed;
            top: clamp(20px, 4vh, 48px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            color: #e8d5b0;
            font-size: clamp(1.2rem, 2.4vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 30px rgba(220, 180, 130, 0.5), 0 0 80px rgba(200, 150, 100, 0.25);
            margin: 0;
            line-height: 1.3;
        }
        #title-overlay .subtitle {
            color: #b8a080;
            font-size: clamp(0.7rem, 1.3vw, 1rem);
            letter-spacing: 0.06em;
            margin-top: 0.3em;
            text-shadow: 0 0 15px rgba(180, 140, 100, 0.35);
        }

        /* 公式覆盖层 */
        #formula-overlay {
            position: fixed;
            bottom: clamp(28px, 5vh, 56px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(20, 16, 28, 0.7);
            border: 1px solid rgba(180, 150, 120, 0.3);
            border-radius: 12px;
            padding: clamp(10px, 1.6vh, 18px) clamp(18px, 3vw, 32px);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #formula-overlay .formula-main {
            color: #f0dcc0;
            font-size: clamp(0.85rem, 1.5vw, 1.25rem);
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a09078;
            font-size: clamp(0.65rem, 1.1vw, 0.9rem);
            letter-spacing: 0.03em;
            margin-top: 0.25em;
            line-height: 1.5;
        }

        /* 响应式微调 */
        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.04em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>球面调和共振</h1>
        <div class="subtitle">Spherical Harmonic Resonance</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                𝒮<sub>p,q,δ</sub> :&ensp;θ(t) = π/2 + α·sin(qt + δ),&ensp;φ(t) = pt
            </div>
            <div class="formula-detail">
                t ∈ [0, 2π]&emsp;|&emsp;p, q ∈ ℕ&emsp;|&emsp;α ∈ [0.2, 0.6]&emsp;|&emsp;δ ∈ [0, π]
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // 深邃背景
        scene.background = new THREE.Color('#070610');
        scene.fog = new THREE.Fog('#070610', 8, 22);

        // 相机
        const camera = new THREE.PerspectiveCamera(
            55,
            container.clientWidth / container.clientHeight,
            0.5,
            30
        );
        camera.position.set(0, 0.9, 6.2);
        camera.lookAt(0, 0, 0);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // ==================== 光照（用于可能的参考球体） ====================
        const ambientLight = new THREE.AmbientLight('#303050', 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight('#ffe8d0', 3, 15, 1.5);
        pointLight.position.set(3, 4, 5);
        scene.add(pointLight);

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // 所有需要控制drawRange的线条引用
        const allLines = [];
        const totalPoints = 1200; // 每条曲线的采样点数

        // ==================== 工具函数 ====================
        /**
         * 在球面上生成参数曲线的顶点数组
         * @param {number} p - φ频率（绕z轴圈数）
         * @param {number} q - θ振荡频率
         * @param {number} amplitude - θ振荡幅度
         * @param {number} phase - 相位偏移
         * @param {number} radius - 球面半径
         * @param {number} radialMod - 径向调制幅度（0=严格球面）
         * @param {number} radialFreq - 径向调制频率
         * @returns {Float32Array} 顶点位置数组 [x0,y0,z0, x1,y1,z1, ...]
         */
        function generateSphericalCurve(p, q, amplitude, phase, radius, radialMod = 0, radialFreq = 1) {
            const vertices = new Float32Array(totalPoints * 3);
            for (let i = 0; i < totalPoints; i++) {
                const t = (i / (totalPoints - 1)) * Math.PI * 2;
                const theta = Math.PI / 2 + amplitude * Math.sin(q * t + phase);
                const phi = p * t;
                let r = radius;
                if (radialMod > 0) {
                    r += radialMod * Math.sin(radialFreq * q * t + phase) * Math.cos(p * t * 0.5);
                    r = Math.max(0.5, Math.min(2.5, r));
                }
                const sinTheta = Math.sin(theta);
                vertices[i * 3] = r * sinTheta * Math.cos(phi); // x
                vertices[i * 3 + 1] = r * Math.cos(theta); // y
                vertices[i * 3 + 2] = r * sinTheta * Math.sin(phi); // z
            }
            return vertices;
        }

        /**
         * 创建一条球面曲线Line
         */
        function createCurveLine(vertices, colorHSL, opacity = 0.85) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0); // 初始不可见

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.NormalBlending,
                depthWrite: true,
                depthTest: true,
            });

            const line = new THREE.Line(geometry, material);
            line.visible = false; // 初始隐藏
            line.frustumCulled = false; // 确保曲线在视口边缘也能正确渲染
            return line;
        }

        // ==================== 生成参考球体框架（3个正交大圆） ====================
        function createGreatCircle(plane, radius, colorHSL, opacity) {
            const pts = 600;
            const vertices = new Float32Array(pts * 3);
            for (let i = 0; i < pts; i++) {
                const angle = (i / (pts - 1)) * Math.PI * 2;
                let x, y, z;
                switch (plane) {
                    case 'xy': // 赤道面 - 在xz平面（水平）
                        x = radius * Math.cos(angle);
                        y = 0;
                        z = radius * Math.sin(angle);
                        break;
                    case 'xz': // 在xy平面
                        x = radius * Math.cos(angle);
                        y = radius * Math.sin(angle);
                        z = 0;
                        break;
                    case 'yz': // 在yz平面
                        x = 0;
                        y = radius * Math.cos(angle);
                        z = radius * Math.sin(angle);
                        break;
                }
                vertices[i * 3] = x;
                vertices[i * 3 + 1] = y;
                vertices[i * 3 + 2] = z;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0);
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.NormalBlending,
                depthWrite: true,
            });
            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // 3个正交大圆 - 极淡的蓝白色
        const greatCircleOpacity = 0.35;
        const gcColor = { h: 0.6, s: 0.2, l: 0.55 };
        const gcXY = createGreatCircle('xy', 1.5, gcColor, greatCircleOpacity);
        const gcXZ = createGreatCircle('xz', 1.5, gcColor, greatCircleOpacity);
        const gcYZ = createGreatCircle('yz', 1.5, gcColor, greatCircleOpacity);
        mainGroup.add(gcXY);
        mainGroup.add(gcXZ);
        mainGroup.add(gcYZ);
        allLines.push(gcXY, gcXZ, gcYZ);

        // ==================== 生成主要球面曲线 ====================
        const curveConfigs = [
            // { p, q, amplitude, phase, radius, radialMod, radialFreq, colorHSL }
            // 组1：暖金色系 - p=1
            { p: 1, q: 2, amp: 0.45, phase: 0.0, r: 1.5, rm: 0, rf: 0, c: { h: 0.115, s: 0.85, l: 0.62 } },
            { p: 1, q: 3, amp: 0.38, phase: 0.6, r: 1.5, rm: 0, rf: 0, c: { h: 0.125, s: 0.9, l: 0.6 } },
            { p: 1, q: 4, amp: 0.5, phase: 1.2, r: 1.5, rm: 0, rf: 0, c: { h: 0.13, s: 0.82, l: 0.64 } },
            { p: 1, q: 5, amp: 0.35, phase: 1.8, r: 1.5, rm: 0.08, rf: 3, c: { h: 0.14, s: 0.88, l: 0.58 } },
            { p: 1, q: 7, amp: 0.42, phase: 2.4, r: 1.5, rm: 0, rf: 0, c: { h: 0.12, s: 0.78, l: 0.66 } },
            { p: 1, q: 9, amp: 0.3, phase: 3.0, r: 1.5, rm: 0.06, rf: 5, c: { h: 0.135, s: 0.85, l: 0.61 } },

            // 组2：冷蓝色系 - p=2
            { p: 2, q: 3, amp: 0.48, phase: 0.3, r: 1.5, rm: 0, rf: 0, c: { h: 0.56, s: 0.75, l: 0.58 } },
            { p: 2, q: 5, amp: 0.4, phase: 1.0, r: 1.5, rm: 0.07, rf: 4, c: { h: 0.57, s: 0.8, l: 0.6 } },
            { p: 2, q: 7, amp: 0.44, phase: 1.7, r: 1.5, rm: 0, rf: 0, c: { h: 0.55, s: 0.72, l: 0.63 } },
            { p: 2, q: 9, amp: 0.33, phase: 2.2, r: 1.5, rm: 0, rf: 0, c: { h: 0.58, s: 0.78, l: 0.56 } },
            { p: 2, q: 11, amp: 0.36, phase: 2.9, r: 1.5, rm: 0.05, rf: 6, c: { h: 0.56, s: 0.7, l: 0.62 } },

            // 组3：玫瑰铜色系 - p=3
            { p: 3, q: 2, amp: 0.5, phase: 0.15, r: 1.5, rm: 0.06, rf: 2, c: { h: 0.04, s: 0.7, l: 0.6 } },
            { p: 3, q: 4, amp: 0.42, phase: 1.1, r: 1.5, rm: 0, rf: 0, c: { h: 0.05, s: 0.75, l: 0.58 } },
            { p: 3, q: 5, amp: 0.38, phase: 1.9, r: 1.5, rm: 0, rf: 0, c: { h: 0.03, s: 0.68, l: 0.63 } },
            { p: 3, q: 7, amp: 0.46, phase: 2.5, r: 1.5, rm: 0.04, rf: 3, c: { h: 0.045, s: 0.72, l: 0.59 } },
            { p: 3, q: 8, amp: 0.34, phase: 3.1, r: 1.5, rm: 0, rf: 0, c: { h: 0.055, s: 0.7, l: 0.61 } },

            // 组4：青绿色系 - p=4
            { p: 4, q: 3, amp: 0.44, phase: 0.5, r: 1.5, rm: 0, rf: 0, c: { h: 0.46, s: 0.65, l: 0.56 } },
            { p: 4, q: 5, amp: 0.4, phase: 1.4, r: 1.5, rm: 0.05, rf: 5, c: { h: 0.47, s: 0.7, l: 0.58 } },
            { p: 4, q: 7, amp: 0.36, phase: 2.1, r: 1.5, rm: 0, rf: 0, c: { h: 0.45, s: 0.62, l: 0.6 } },
            { p: 4, q: 9, amp: 0.3, phase: 2.7, r: 1.5, rm: 0, rf: 0, c: { h: 0.48, s: 0.68, l: 0.55 } },

            // 组5：紫罗兰系 - p=5
            { p: 5, q: 2, amp: 0.48, phase: 0.25, r: 1.5, rm: 0.04, rf: 4, c: { h: 0.78, s: 0.6, l: 0.6 } },
            { p: 5, q: 3, amp: 0.42, phase: 1.3, r: 1.5, rm: 0, rf: 0, c: { h: 0.79, s: 0.65, l: 0.58 } },
            { p: 5, q: 4, amp: 0.38, phase: 2.0, r: 1.5, rm: 0, rf: 0, c: { h: 0.77, s: 0.58, l: 0.62 } },
            { p: 5, q: 6, amp: 0.35, phase: 2.6, r: 1.5, rm: 0.06, rf: 3, c: { h: 0.8, s: 0.62, l: 0.57 } },
        ];

        curveConfigs.forEach(config => {
            const vertices = generateSphericalCurve(
                config.p, config.q, config.amp, config.phase,
                config.r, config.rm, config.rf
            );
            const line = createCurveLine(vertices, config.c, 0.8);
            mainGroup.add(line);
            allLines.push(line);
        });

        // ==================== 微小的参考光点环（球面纬度参考线） ====================
        function createLatitudeRing(latAngle, radius, colorHSL, opacity) {
            const pts = 500;
            const vertices = new Float32Array(pts * 3);
            const theta = latAngle;
            const sinTheta = Math.sin(theta);
            const cosTheta = Math.cos(theta);
            const r = radius * sinTheta;
            const y = radius * cosTheta;
            for (let i = 0; i < pts; i++) {
                const phi = (i / (pts - 1)) * Math.PI * 2;
                vertices[i * 3] = r * Math.cos(phi);
                vertices[i * 3 + 1] = y;
                vertices[i * 3 + 2] = r * Math.sin(phi);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0);
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.NormalBlending,
                depthWrite: true,
            });
            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // 添加几条微妙的纬度参考线
        const refRingColor = { h: 0.55, s: 0.15, l: 0.5 };
        const refRingOpacity = 0.22;
        const latAngles = [Math.PI / 6, Math.PI / 3, Math.PI / 2, 2 * Math.PI / 3, 5 * Math.PI / 6];
        const refRings = [];
        latAngles.forEach(angle => {
            const ring = createLatitudeRing(angle, 1.5, refRingColor, refRingOpacity);
            mainGroup.add(ring);
            allLines.push(ring);
            refRings.push(ring);
        });

        console.log(`✅ 已创建 ${allLines.length} 条线条（含参考框架和纬度线）`);
        console.log(`   - 主曲线: ${curveConfigs.length} 条`);
        console.log(`   - 正交大圆: 3 条`);
        console.log(`   - 纬度参考线: ${refRings.length} 条`);

        // ==================== 动画状态 ====================
        const TOTAL_CYCLE_DURATION = 7.0; // 总周期（秒）
        const APPEAR_DURATION = 3.0; // 出现阶段
        const PAUSE_DURATION = 1.0; // 停顿阶段
        const DISAPPEAR_DURATION = 3.0; // 消失阶段
        // 验证：APPEAR + PAUSE + DISAPPEAR = 3 + 1 + 3 = 7 = TOTAL_CYCLE_DURATION ✓

        let animationStartTime = null;
        let isFirstFrame = true;
        let frameCount = 0;

        // ==================== 缓动函数 ====================
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function easeInCubic(t) {
            return t * t * t;
        }

        function easeInOutSine(t) {
            return -(Math.cos(Math.PI * t) - 1) / 2;
        }

        // ==================== 计算动画进度 ====================
        function getAnimationProgress(elapsedSeconds) {
            const cycleTime = elapsedSeconds % TOTAL_CYCLE_DURATION;

            if (cycleTime < APPEAR_DURATION) {
                // 出现阶段
                const t = cycleTime / APPEAR_DURATION;
                return {
                    progress: easeOutCubic(t),
                    phase: 'appear',
                    cycleTime: cycleTime,
                };
            } else if (cycleTime < APPEAR_DURATION + PAUSE_DURATION) {
                // 停顿阶段
                return {
                    progress: 1.0,
                    phase: 'pause',
                    cycleTime: cycleTime,
                };
            } else {
                // 消失阶段
                const t = (cycleTime - APPEAR_DURATION - PAUSE_DURATION) / DISAPPEAR_DURATION;
                return {
                    progress: 1.0 - easeInCubic(t),
                    phase: 'disappear',
                    cycleTime: cycleTime,
                };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            // 初始化起始时间
            if (animationStartTime === null) {
                animationStartTime = timestamp;
                console.log('🎬 动画开始 | 起始时间戳:', timestamp);
            }

            // 首次帧特殊处理
            if (isFirstFrame) {
                console.log('🖼 渲染第一帧 | 所有线条初始隐藏');
                isFirstFrame = false;
                // 确保所有线条初始不可见
                allLines.forEach(line => {
                    line.visible = false;
                    if (line.geometry && line.geometry.setDrawRange) {
                        line.geometry.setDrawRange(0, 0);
                    }
                });
                mainGroup.rotation.set(0, 0, 0);
                renderer.render(scene, camera);
                // 第一帧后立即返回，下一帧开始正常动画
                animationStartTime = timestamp;
                return;
            }

            frameCount++;
            const elapsed = (timestamp - animationStartTime) / 1000;
            const animState = getAnimationProgress(elapsed);
            const progress = animState.progress;

            // 计算drawRange的count值
            const drawCount = Math.floor(progress * totalPoints);

            // 批量更新所有线条
            const effectiveCount = Math.max(0, drawCount);
            const shouldBeVisible = effectiveCount >= 2;

            for (let i = 0; i < allLines.length; i++) {
                const line = allLines[i];
                if (!line || !line.geometry) continue;

                if (shouldBeVisible) {
                    line.visible = true;
                    // 对于每条线，使用其几何体的实际顶点数
                    const maxPts = line.geometry.attributes.position.count;
                    const lineDrawCount = Math.min(effectiveCount, maxPts);
                    line.geometry.setDrawRange(0, Math.max(2, lineDrawCount));
                } else {
                    line.visible = false;
                    line.geometry.setDrawRange(0, 0);
                }
            }

            // 旋转整个图案组
            const baseRotationSpeed = 0.25; // 基础旋转速度（弧度/秒）
            const yRotation = elapsed * baseRotationSpeed;
            const xTilt = Math.sin(elapsed * 0.35) * 0.18;
            const zTilt = Math.cos(elapsed * 0.42) * 0.1;

            mainGroup.rotation.set(xTilt, yRotation, zTilt);

            // 相机微动
            const camSwayX = Math.sin(elapsed * 0.22) * 0.15;
            const camSwayY = Math.cos(elapsed * 0.28) * 0.12;
            camera.position.x = camSwayX;
            camera.position.y = 0.9 + camSwayY;
            camera.lookAt(0, 0, 0);

            // 渲染
            renderer.render(scene, camera);

            // 每120帧输出一次调试信息
            if (frameCount % 120 === 0) {
                const visibleCount = allLines.filter(l => l.visible).length;
                console.log(
                    `📐 帧${frameCount} | 阶段:${animState.phase} | ` +
                    `进度:${progress.toFixed(3)} | ` +
                    `drawCount:${drawCount} | ` +
                    `可见线条:${visibleCount}/${allLines.length} | ` +
                    `旋转Y:${(yRotation % (Math.PI * 2)).toFixed(2)}rad`
                );
            }
        }

        // ==================== 窗口大小调整 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => {
            setTimeout(onResize, 150);
        }, { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 球面调和共振动画初始化完成');
        console.log(`   - 总线条数: ${allLines.length}`);
        console.log(`   - 每条曲线采样点: ${totalPoints}`);
        console.log(`   - 动画周期: ${TOTAL_CYCLE_DURATION}s (出现${APPEAR_DURATION}s + 停顿${PAUSE_DURATION}s + 消失${DISAPPEAR_DURATION}s)`);
        console.log('   - 初始状态: 所有线条隐藏，等待首帧渲染');

        // 使用requestAnimationFrame启动，确保在浏览器准备好后开始
        requestAnimationFrame(animate);
    </script>
</body>
</html>
