<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>数学曲线之美 · 环面结群</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a10;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', serif;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      left: 0;
      right: 0;
      text-align: center;
    }
    #title-overlay {
      top: clamp(16px, 4vh, 42px);
    }
    #title-overlay h1 {
      font-size: clamp(1.2rem, 2.8vw, 1.9rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #e8dfcf;
      text-shadow: 0 0 30px rgba(210, 180, 140, 0.5), 0 0 80px rgba(160, 130, 90, 0.25);
      margin: 0;
      line-height: 1.3;
    }
    #title-overlay .subtitle {
      font-size: clamp(0.7rem, 1.4vw, 0.95rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: #b8aa90;
      text-shadow: 0 0 18px rgba(180, 150, 110, 0.35);
      margin-top: 6px;
    }
    #formula-overlay {
      bottom: clamp(20px, 5vh, 50px);
    }
    .formula-box {
      display: inline-block;
      background: rgba(18, 16, 12, 0.7);
      border: 1px solid rgba(180, 145, 100, 0.35);
      border-radius: 14px;
      padding: clamp(10px, 2vh, 18px) clamp(20px, 3.5vw, 36px);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      box-shadow: 0 10px 36px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
      transition: opacity 0.8s ease;
    }
    .formula-line {
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      color: #d4c8aa;
      letter-spacing: 0.05em;
      line-height: 1.9;
      font-style: italic;
      white-space: nowrap;
    }
    .fn { color: #e8c97a; font-style: normal; font-weight: bold; }
    .paren { color: #c4a870; font-style: normal; }
    .op { color: #b8956e; font-style: normal; }
    .param { color: #a09070; font-style: normal; }
    @media (max-width: 600px) {
      .formula-line { font-size: 0.7rem; letter-spacing: 0.02em; white-space: normal; }
      .formula-box { padding: 8px 12px; border-radius: 10px; }
      #title-overlay h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="overlay" id="title-overlay">
    <h1>数学曲线之美</h1>
    <div class="subtitle">环面结群 · Torus Knot Ensemble</div>
  </div>

  <div class="overlay" id="formula-overlay">
    <div class="formula-box">
      <div class="formula-line">
        <span class="fn">x</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="fn">(R + r cos</span><span class="paren">(</span>q t<span class="paren">))</span> <span class="fn">cos</span><span class="paren">(</span>p t<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">y</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="fn">(R + r cos</span><span class="paren">(</span>q t<span class="paren">))</span> <span class="fn">sin</span><span class="paren">(</span>p t<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">z</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="fn">r sin</span><span class="paren">(</span>q t<span class="paren">)</span>
        &nbsp;&nbsp;<span class="param">p,q ∈ ℤ</span>&nbsp;<span class="param">t ∈ [0,2π]</span>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ----- DOM 元素 -----
    const container = document.getElementById('canvas-container');
    const formulaBox = document.querySelector('.formula-box');

    // ----- 场景初始化 -----
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a10, 0.0001);

    // 相机
    const camera = new THREE.PerspectiveCamera(
      50,
      container.clientWidth / container.clientHeight,
      0.5,
      35
    );
    camera.position.set(4.2, 2.1, 6.8);
    camera.lookAt(0, 0, 0);

    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x0a0a10);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // ----- 背景星场 -----
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 400;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 11 + Math.random() * 13;
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({
      color: 0xcfc8b8,
      size: 0.02,
      transparent: true,
      opacity: 0.55,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // ----- 曲线参数 -----
    const TOTAL_VERTICES = 2800;          // 每条曲线顶点数（细密）
    const CURVE_COUNT = 28;              // 环面结数量
    const GROW_DURATION = 15.0;
    const PAUSE_DURATION = 1.5;
    const SHRINK_DURATION = 15.0;
    const CYCLE_TOTAL = GROW_DURATION + PAUSE_DURATION + SHRINK_DURATION; // 31.5s

    // 生成 (p,q) 环面结参数集，并附加不同的 R, r, 相位偏移
    function buildCurveParams(count) {
      // 选取一系列互质的整数对，保证结的结构丰富
      const pqPairs = [
        [2, 3], [3, 2], [2, 5], [5, 2],
        [3, 4], [4, 3], [2, 7], [7, 2],
        [3, 5], [5, 3], [4, 5], [5, 4],
        [3, 7], [7, 3], [4, 7], [7, 4],
        [2, 9], [9, 2], [5, 6], [6, 5]
      ];
      const params = [];
      for (let i = 0; i < count; i++) {
        const baseIdx = i % pqPairs.length;
        const [p, q] = pqPairs[baseIdx];
        // R 在 2.0 到 2.6 之间变化，r 在 0.65 到 0.95 之间变化
        const R = 2.0 + (i * 0.023) % 0.6;
        const r = 0.65 + (i * 0.017) % 0.3;
        // 相位偏移，使曲线起点错开
        const phase = (i / count) * Math.PI * 2;
        params.push({ p, q, R, r, phase });
      }
      return params;
    }
    const curveParamsList = buildCurveParams(CURVE_COUNT);

    // 为每条曲线分配一个主色相（均匀环）
    const hues = Array.from({ length: CURVE_COUNT }, (_, k) => (k / CURVE_COUNT + 0.07) % 1);

    // 生成一条环面结的顶点位置和颜色
    function generateCurveData(p, q, R, r, phase, hue) {
      const positions = new Float32Array(TOTAL_VERTICES * 3);
      const colors = new Float32Array(TOTAL_VERTICES * 3);
      for (let i = 0; i < TOTAL_VERTICES; i++) {
        const rawT = (i / (TOTAL_VERTICES - 1)) * Math.PI * 2;
        const t = rawT + phase; // 加入相位偏移

        const cos_qt = Math.cos(q * t);
        const sin_qt = Math.sin(q * t);
        const cos_pt = Math.cos(p * t);
        const sin_pt = Math.sin(p * t);

        const x = (R + r * cos_qt) * cos_pt;
        const y = (R + r * cos_qt) * sin_pt;
        const z = r * sin_qt;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // 颜色：主色相随t轻微变化
        const hueShift = Math.sin(t * 2.5 + hue * 12) * 0.02;
        const h = (hue + hueShift + 1) % 1;
        const s = 0.68 + Math.sin(t * 3.3 + hue * 9) * 0.14;
        const l = 0.5 + Math.cos(t * 4.8 + hue * 7) * 0.09 + Math.sin(t * 6.2) * 0.04;
        const color = new THREE.Color();
        color.setHSL(h, s, l);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      return { positions, colors };
    }

    // ----- 创建所有环面结曲线 -----
    const curveGroup = new THREE.Group();
    scene.add(curveGroup);
    const allLines = [];
    const allGeometries = [];

    curveParamsList.forEach((params, idx) => {
      const { positions, colors } = generateCurveData(
        params.p, params.q, params.R, params.r, params.phase, hues[idx]
      );
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      // 初始隐藏
      geometry.setDrawRange(0, 0);

      const material = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.NormalBlending,
        depthTest: true,
        depthWrite: true,
      });
      const line = new THREE.Line(geometry, material);
      line.renderOrder = idx;
      curveGroup.add(line);
      allLines.push(line);
      allGeometries.push(geometry);
    });

    // ----- 装饰：极细参考环 -----
    const ringGeo = new THREE.TorusGeometry(1.55, 0.01, 32, 180);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x3a3530,
      transparent: true,
      opacity: 0.28,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.renderOrder = 999;
    curveGroup.add(ring);

    const ring2Geo = new THREE.TorusGeometry(1.2, 0.008, 24, 140);
    const ring2Mat = new THREE.MeshBasicMaterial({
      color: 0x4a4238,
      transparent: true,
      opacity: 0.22,
      depthWrite: false,
    });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    ring2.rotation.x = Math.PI / 3;
    ring2.rotation.y = Math.PI / 5;
    ring2.renderOrder = 998;
    curveGroup.add(ring2);

    // ----- 动画状态 -----
    const clock = new THREE.Clock();
    let lastDrawCount = -1;
    let currentPhase = 'grow';

    // 缓动函数（生长和消失使用平滑曲线）
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // ----- 渲染循环 -----
    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const cycleTime = elapsed % CYCLE_TOTAL;

      let progress;
      if (cycleTime < GROW_DURATION) {
        const raw = cycleTime / GROW_DURATION;
        progress = easeInOutCubic(raw);
        currentPhase = 'grow';
      } else if (cycleTime < GROW_DURATION + PAUSE_DURATION) {
        progress = 1.0;
        currentPhase = 'pause';
      } else {
        const shrinkElapsed = cycleTime - (GROW_DURATION + PAUSE_DURATION);
        const raw = 1.0 - shrinkElapsed / SHRINK_DURATION;
        progress = easeInOutCubic(Math.max(0, Math.min(1, raw)));
        currentPhase = 'shrink';
      }

      const drawCount = Math.max(0, Math.floor(progress * TOTAL_VERTICES));

      // 仅在顶点绘制数量变化时更新，提高性能
      if (drawCount !== lastDrawCount) {
        allGeometries.forEach(geo => geo.setDrawRange(0, drawCount));
        lastDrawCount = drawCount;
      }

      // 曲线组整体缓慢旋转
      curveGroup.rotation.y += 0.0025;
      curveGroup.rotation.x = Math.sin(elapsed * 0.21) * 0.18;
      curveGroup.rotation.z = Math.cos(elapsed * 0.26) * 0.14;

      // 星场微动
      stars.rotation.y += 0.0003;
      stars.rotation.x += 0.00015;

      // 光环呼吸
      const breathe = 1 + Math.sin(elapsed * 0.7) * 0.04;
      ring.scale.setScalar(breathe);
      ring.material.opacity = 0.22 + Math.sin(elapsed * 0.55) * 0.07;
      ring2.scale.setScalar(1 + Math.cos(elapsed * 0.65) * 0.05);
      ring2.material.opacity = 0.18 + Math.cos(elapsed * 0.6) * 0.06;

      // 公式面板透明度跟随阶段微调
      if (formulaBox) {
        let op;
        if (currentPhase === 'pause') op = 0.95;
        else if (currentPhase === 'grow' && progress > 0.5) op = 0.5 + (progress - 0.5) * 0.9;
        else if (currentPhase === 'shrink' && progress < 0.5) op = 0.5 + progress * 0.9;
        else op = 0.55 + progress * 0.4;
        formulaBox.style.opacity = Math.max(0.35, Math.min(1, op));
      }

      renderer.render(scene, camera);
    }

    // ----- 响应式 -----
    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / Math.max(h, 1);
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }, 150);
    });

    // ----- 启动动画 -----
    allGeometries.forEach(geo => geo.setDrawRange(0, 0));
    lastDrawCount = 0;
    clock.start();
    requestAnimationFrame(animate);

    console.log('%c💠 环面结群 %c已启动', 'color:#e8c97a;font-size:1.1em;', 'color:#b8aa90;');
    console.log('%c'+CURVE_COUNT+'条环面结曲线 | 从无到有15s → 停顿1.5s → 从有到无15s | 完美闭合',
      'color:#b8956e;font-size:0.9em;');
  </script>
</body>
</html>
