            text-shadow:0 0 10px rgba(90,210,255,.9)}

<script type="importmap">
{

<body>
<canvas id="c"></canvas>

<div id="hud">
  <h1>伯努利流体效应</h1>
  <div class="en">Bernoulli's Principle · Venturi Flow</div>

  <div class="eq"><span class="hl">p&nbsp;+&nbsp;½ρv²&nbsp;+&nbsp;ρgh&nbsp;=&nbsp;常数</span></div>
  <div class="eq"><span class="cy">v₁A₁</span>&nbsp;=&nbsp;<span class="mg">v₂A₂</span>&nbsp;&nbsp;<span class="dim">(连续性方程)</span></div>
  <div class="eq"><span class="gd">A = πr²</span>&nbsp;&nbsp;<span class="dim">→</span>&nbsp;&nbsp;v&nbsp;∝&nbsp;1/r²</div>
  <div class="eq dim">窄处流速↑ &nbsp;压强↓ &nbsp;·&nbsp; 宽处流速↓ &nbsp;压强↑</div>

  <div class="btns">

<script type="module">
import * as THREE from 'three';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ==================================================================
   一、管道几何剖面
   ================================================================== */
const X0 = -18, X1 = 18;          // 管道两端
const XT = 7.5;                    // 过渡区半宽
const R_WIDE   = 1.75;
const R_NARROW = 0.82;

/** 管道半径 R(x)：中心窄，两端宽，余弦平滑过渡 */
function pipeRadius(x){
  const ax = Math.abs(x);
  if (ax >= XT) return R_WIDE;
  const t = ax / XT;                          // 0 中心 → 1 边缘
  const s = 0.5 - 0.5 * Math.cos(t * Math.PI); // 平滑插值，两端导数为 0
  return R_NARROW + (R_WIDE - R_NARROW) * s;
}

const V_REF = 5.5;                            // 宽管处基准流速
const V_MIN = V_REF;                          // 宽管流速（最小）
const V_MAX = V_REF * (R_WIDE / R_NARROW) ** 2; // 窄管流速（最大）

function speedAt(x){
  const R = pipeRadius(x);
  return V_REF * (R_WIDE / R) ** 2;
}

/* ==================================================================
   二、查找表（半径 / 流速 / 颜色）
   ================================================================== */
const LUTN = 512;
const rLUT = new Float32Array(LUTN + 1);
const vLUT = new Float32Array(LUTN + 1);
const cLUT = new Float32Array((LUTN + 1) * 3);

{
  const tmpC = new THREE.Color();
  for (let i = 0; i <= LUTN; i++){
    const x = X0 + (X1 - X0) * i / LUTN;
    const R = pipeRadius(x);
    rLUT[i] = R;

    const v = speedAt(x);
    vLUT[i] = v;

    /* 归一化速度 0（宽）→ 1（窄） */
    const sn = (v - V_MIN) / (V_MAX - V_MIN);

    /* 色相：宽管暖金 0.09 → 窄管青蓝 0.58 */
    const hue = 0.09 + 0.49 * sn;
    /* 亮度：宽管暗 → 窄管亮 */
    const br  = 0.34 + 0.86 * sn;

    tmpC.setHSL(hue, 1.0, 0.5);
    cLUT[i * 3]     = tmpC.r * br;
    cLUT[i * 3 + 1] = tmpC.g * br;
    cLUT[i * 3 + 2] = tmpC.b * br;
  }
}

/** 由 x 取 LUT 索引 */
function lutIndex(x){
  const u = (x - X0) / (X1 - X0);
  return Math.max(0, Math.min(LUTN, Math.round(u * LUTN)));
}

/* ==================================================================
   三、Three.js 基础
   ================================================================== */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.NoToneMapping;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 4000);

let yaw = 0.36, pitch = 0.26, dist = 34;
let dragging = false, lastX = 0, lastY = 0;

function updateCamera(){
  const cp = Math.cos(pitch);
  camera.position.set(
    dist * cp * Math.sin(yaw),
    dist * Math.sin(pitch),
    dist * cp * Math.cos(yaw)
  );
  camera.lookAt(0, 0, 0);
}

/* ==================================================================
   四、背景星尘
   ================================================================== */
(function buildStars(){
  const N = 2400;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();

  for (let i = 0; i < N; i++){
    const r  = 180 + Math.random() * 1100;
    const th = Math.acos(2 * Math.random() - 1);
    const ph = Math.random() * Math.PI * 2;
    pos[i*3]     = r * Math.sin(th) * Math.cos(ph);
    pos[i*3 + 1] = r * Math.cos(th);
    pos[i*3 + 2] = r * Math.sin(th) * Math.sin(ph);

    const t = Math.random();
    if (t < 0.70)      c.setHSL(0.56, 0.55, 0.18 + Math.random() * 0.30);
    else if (t < 0.90) c.setHSL(0.10, 0.55, 0.22 + Math.random() * 0.28);
    else               c.setHSL(0.86, 0.62, 0.28 + Math.random() * 0.28);

    col[i*3] = c.r; col[i*3 + 1] = c.g; col[i*3 + 2] = c.b;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 1.8, vertexColors: true, transparent: true, opacity: 0.88,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: false
  })));
})();

/* ==================================================================
   五、透明管道（壳体 + 菲涅尔辉光）
   ================================================================== */
function buildPipeGeometry(){
  const NX = 260, NA = 72;
  const verts = [], norms = [], cols = [], idx = [];
  const tmpC = new THREE.Color();

  for (let i = 0; i <= NX; i++){
    const x = X0 + (X1 - X0) * i / NX;
    const R = pipeRadius(x);

    /* 数值求导 R'(x) */
    const h = 0.02;
    const Rp = (pipeRadius(Math.min(X1, x + h)) - pipeRadius(Math.max(X0, x - h))) / (2 * h);

    /* 局部流速 → 归一化压强 */
    const v  = speedAt(x);
    const sn = (v - V_MIN) / (V_MAX - V_MIN);       // 0 宽 → 1 窄
    const pN = 1 - sn;                               // 1 高压 → 0 低压

    /* 管壁颜色：高压偏冷青，低压偏暖金 */
    const hue = 0.52 - 0.40 * pN;
    const lum = 0.34 + 0.30 * pN;
    tmpC.setHSL(hue, 0.80, lum);

    for (let j = 0; j <= NA; j++){
      const th = Math.PI * 2 * j / NA;
      const sy = Math.sin(th), cz = Math.cos(th);

      verts.push(x, R * sy, R * cz);

      const nl = Math.hypot(Rp, 1);
      norms.push(-Rp / nl, sy / nl, cz / nl);

      cols.push(tmpC.r, tmpC.g, tmpC.b);
    }
  }

  for (let i = 0; i < NX; i++){
    for (let j = 0; j < NA; j++){
      const a = i * (NA + 1) + j;
      const b = a + 1;
      const c = a + (NA + 1);
      const d = c + 1;
      idx.push(a, c, b);
      idx.push(b, c, d);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(norms, 3));
  g.setAttribute('aColor',   new THREE.Float32BufferAttribute(cols, 3));
  g.setIndex(idx);
  return g;
}

const pipeMat = new THREE.ShaderMaterial({
  uniforms: {
    uOpacity: { value: 0.42 },
    uTime:    { value: 0 }
  },
  vertexShader: /* glsl */`
    attribute vec3 aColor;
    varying vec3 vNormal;
    varying vec3 vViewDir;
    varying vec3 vColor;

    void main(){
      vColor  = aColor;
      vNormal = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vViewDir = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vViewDir;
    varying vec3 vColor;
    uniform float uOpacity;
    uniform float uTime;

    void main(){
      float fres = 1.0 - abs(dot(vNormal, vViewDir));
      fres = pow(fres, 2.2);

      /* 沿轮廓的流动微光 */
      float flow = 0.5 + 0.5 * sin(vNormal.y * 12.0 + uTime * 1.4);

      vec3 col = vColor * (0.55 + 1.35 * fres) * (0.85 + 0.25 * flow);

      float alpha = fres * uOpacity + 0.022;
      gl_FragColor = vec4(col, alpha);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide
});

const pipeMesh = new THREE.Mesh(buildPipeGeometry(), pipeMat);
pipeMesh.frustumCulled = false;
scene.add(pipeMesh);

/* ==================================================================
   六、流体粒子（LineSegments 拖尾）
   ================================================================== */
let N_PARTICLES = 12000;
const TAU = 0.075;                 // 拖尾时间常数

let px, pRho, pCos, pSin;
let trailGeo, trailLines;
let posArr, colArr;

function buildParticles(count){
  /* 清理旧的 */
  if (trailLines){
    scene.remove(trailLines);
    trailGeo.dispose();
  }

  N_PARTICLES = count;

  px   = new Float32Array(count);
  pRho = new Float32Array(count);
  pCos = new Float32Array(count);
  pSin = new Float32Array(count);

  for (let i = 0; i < count; i++){
    px[i]   = X0 + Math.random() * (X1 - X0);
    /* 径向分布：略偏向外壁，形成空腔感 */
    pRho[i] = Math.pow(Math.random(), 0.60) * 0.86;
    const th = Math.random() * Math.PI * 2;
    pCos[i] = Math.cos(th);
    pSin[i] = Math.sin(th);
  }

  posArr = new Float32Array(count * 6);   // 每粒子 2 顶点（头/尾）
  colArr = new Float32Array(count * 6);

  trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  trailGeo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));
  trailGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 40);

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  trailLines = new THREE.LineSegments(trailGeo, mat);
  trailLines.frustumCulled = false;
  scene.add(trailLines);

  /* 先跑一帧，避免初始位置为 0 */
  updateParticles(0.0001);
}

/* ==================================================================
   七、粒子更新
   ================================================================== */
let flowFactor = 1.0;
let elapsed = 0;

function updateParticles(dt){
  const flow = flowFactor;

  for (let i = 0; i < N_PARTICLES; i++){
    let x = px[i];

    /* ---- 查表得局部流速 ---- */
    const li = lutIndex(x);
    const v  = vLUT[li] * flow;

    /* ---- 推进 ---- */
    x += v * dt;

    /* ---- 出口回绕（保持分布均匀） ---- */
    if (x > X1){
      x -= (X1 - X0);
      x += (Math.random() - 0.5) * 1.2;
      if (x < X0) x = X0;
    } else if (x < X0){
      x = X0;
    }
    px[i] = x;

    /* ---- 重新采样截面半径 ---- */
    const li2 = lutIndex(x);
    const R   = rLUT[li2];
    const r   = pRho[i] * R;
    const y   = r * pCos[i];
    const z   = r * pSin[i];

    /* ---- 拖尾长度 ∝ 流速 ---- */
    let tl = v * TAU;
    if (tl > 2.6) tl = 2.6;
    const tailX = Math.max(X0, x - tl);

    const i6 = i * 6;
    /* 头部顶点 */
    posArr[i6]     = x;
    posArr[i6 + 1] = y;
    posArr[i6 + 2] = z;
    /* 尾部顶点 */
    posArr[i6 + 3] = tailX;
    posArr[i6 + 4] = y;
    posArr[i6 + 5] = z;

    /* ---- 颜色（查表 + 流量增益） ---- */
    const gain = 0.72 + 0.42 * Math.min(flow, 1.6);
    const cr = cLUT[li2 * 3]     * gain;
    const cg = cLUT[li2 * 3 + 1] * gain;
    const cb = cLUT[li2 * 3 + 2] * gain;

    /* 头部亮 */
    colArr[i6]     = cr * 1.75;
    colArr[i6 + 1] = cg * 1.75;
    colArr[i6 + 2] = cb * 1.75;
    /* 尾部渐隐 */
    colArr[i6 + 3] = cr * 0.08;
    colArr[i6 + 4] = cg * 0.08;
    colArr[i6 + 5] = cb * 0.08;
  }

  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;
}

/* ==================================================================
   八、后处理 Bloom
   ================================================================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.85,   // 强度
  0.55,   // 半径
  0.18    // 阈值
);
composer.addPass(bloom);

/* ==================================================================
   九、UI
   ================================================================== */
const sFlow  = document.getElementById('sFlow');
const sDens  = document.getElementById('sDens');
const vFlow  = document.getElementById('vFlow');
const vDens  = document.getElementById('vDens');
const qVal   = document.getElementById('qVal');

document.getElementById('ratioVal').textContent =
  ((V_MAX / V_MIN).toFixed(1)) + '×';

sFlow.addEventListener('input', () => {
  const raw = +sFlow.value;
  flowFactor = raw / 100;
  const txt = flowFactor.toFixed(2);
  vFlow.textContent = txt;
  qVal.textContent  = txt;
});

sDens.addEventListener('input', () => {
  const pct = +sDens.value;
  vDens.textContent = pct;
  const count = Math.round(3000 + (pct / 100) * 16000);
  buildParticles(count);
});

/* 图层开关 */
let pipeVisible = true, trailVisible = true;

document.getElementById('btnPipe').addEventListener('click', function(){
  pipeVisible = !pipeVisible;
  pipeMesh.visible = pipeVisible;
  this.classList.toggle('on', pipeVisible);
});
document.getElementById('btnTrail').addEventListener('click', function(){
  trailVisible = !trailVisible;
  trailLines.visible = trailVisible;
  this.classList.toggle('on', trailVisible);
});

document.getElementById('btnReset').addEventListener('click', () => {
  yaw = 0.36; pitch = 0.26; dist = 34;
  updateCamera();
});

/* 初始化数值 */
flowFactor = +sFlow.value / 100;
vFlow.textContent = flowFactor.toFixed(2);
qVal.textContent  = flowFactor.toFixed(2);

/* ==================================================================
   十、Web Audio 科技感音效（流体质感）
   ================================================================== */
let audio = null;

function initAudio(){
  if (audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  const ctx = new AC();

  const master = ctx.createGain();
  master.gain.value = 0.0001;
  master.connect(ctx.destination);

  /* --- 低频和声层 --- */
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 620;
  lp.Q.value = 1.4;
  lp.connect(master);

  const base = [55, 82.41, 110, 164.81, 220, 329.63];
  base.forEach((f, i) => {
    const o = ctx.createOscillator();
    o.type = i < 2 ? 'sine' : (i < 5 ? 'triangle' : 'sine');
    o.frequency.value = f * (1 + (Math.random() - 0.5) * 0.004);
    o.detune.value = (Math.random() - 0.5) * 12;

    const g = ctx.createGain();
    g.gain.value = 0.15 / (1 + i * 0.9);

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.03 + i * 0.02;
    const lg = ctx.createGain();
    lg.gain.value = f * 0.0045;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start();

    o.connect(g); g.connect(lp); o.start();
  });

  /* --- 流体噪声层（带通扫频，模拟水流） --- */
  const nlen = Math.floor(ctx.sampleRate * 3);
  const nbuf = ctx.createBuffer(1, nlen, ctx.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) nd[i] = (Math.random() * 2 - 1) * 0.55;

  const noise = ctx.createBufferSource();
  noise.buffer = nbuf; noise.loop = true;

  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 900;
  bp.Q.value = 0.9;

  const ng = ctx.createGain();
  ng.gain.value = 0.028;

  noise.connect(bp); bp.connect(ng); ng.connect(master); noise.start();

  /* 噪声带的缓慢扫频，呼应管道变径 */
  const bpLfo = ctx.createOscillator();
  bpLfo.type = 'sine';
  bpLfo.frequency.value = 0.11;
  const bpLfoGain = ctx.createGain();
  bpLfoGain.gain.value = 520;
  bpLfo.connect(bpLfoGain); bpLfoGain.connect(bp.frequency); bpLfo.start();

  /* --- 脉冲点缀 --- */
  const shimmer = ctx.createOscillator();
  shimmer.type = 'sine'; shimmer.frequency.value = 880;
  const sg = ctx.createGain(); sg.gain.value = 0;
  shimmer.connect(sg); sg.connect(master); shimmer.start();

  function pulse(){
    if (!audio || !audio.alive) return;
    const t = ctx.currentTime;
    const scale = [0, 2, 4, 5, 7, 9, 11, 12];
    const semi = scale[Math.floor(Math.random() * scale.length)];
    const f = 480 * Math.pow(2, semi / 12);
    shimmer.frequency.setValueAtTime(f, t);
    sg.gain.cancelScheduledValues(t);
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(0.030, t + 0.06);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    setTimeout(pulse, 1100 + Math.random() * 3000);
  }
  setTimeout(pulse, 1300);

  audio = { ctx, master, lp, bp, ng, alive: true };
}

const btnAudio = document.getElementById('btnAudio');
let audioOn = false;

btnAudio.addEventListener('click', () => {
  if (!audio) initAudio();
  if (!audio) return;
  if (audio.ctx.state === 'suspended') audio.ctx.resume();

  audioOn = !audioOn;
  const t = audio.ctx.currentTime;
  audio.master.gain.cancelScheduledValues(t);
  audio.master.gain.setTargetAtTime(audioOn ? 0.52 : 0.0001, t, 0.6);
  btnAudio.classList.toggle('on', audioOn);
  btnAudio.textContent = audioOn ? '🔊 音效' : '🔇 静音';
});

window.addEventListener('pointerdown', () => {
  if (!audio) initAudio();
  if (audio && audio.ctx.state === 'suspended') audio.ctx.resume();
}, { once: true });

/* ==================================================================
   十一、相机交互
   ================================================================== */
canvas.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  yaw -= dx * 0.006;
  pitch += dy * 0.005;
  pitch = Math.max(-1.25, Math.min(1.25, pitch));
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  dist *= (1 + Math.sign(e.deltaY) * 0.08);
  dist = Math.max(7, Math.min(95, dist));
}, { passive: false });

/* ==================================================================
   十二、主循环
   ================================================================== */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updateCamera();

  /* 粒子推进 */
  updateParticles(dt);

  /* 管道流动微光 */
  pipeMat.uniforms.uTime.value = elapsed;

  /* 音频随流量微调 */
  if (audio && audioOn){
    const t = audio.ctx.currentTime;
    audio.bp.frequency.setTargetAtTime(700 + flowFactor * 620, t, 0.6);
    audio.lp.frequency.setTargetAtTime(520 + flowFactor * 220, t, 0.6);
  }

  composer.render();
}

/* ==================================================================
   十三、自适应
   ================================================================== */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

/* ==================================================================
   启动
   ================================================================== */
buildParticles(Math.round(3000 + (+sDens.value / 100) * 16000));
updateCamera();
animate();
</script>
