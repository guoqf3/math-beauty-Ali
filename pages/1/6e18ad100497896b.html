<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>双缝干涉波场 · 杨氏实验 · 量子波动</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#010409;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;}

  /* ---------- 顶部主标题（中文） ---------- */
  .title{
    position:fixed;
    left:clamp(16px,4.2vw,58px);
    top:clamp(16px,4.2vh,50px);
    z-index:12;
    pointer-events:none;
    user-select:none;
    color:#d8ffe6;
    font-family:"Songti SC","STSong","SimSun","Times New Roman",serif;
    animation:titleIn 2.1s cubic-bezier(.2,.8,.25,1) both;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateY(-18px);filter:blur(8px);}
    to{opacity:1;transform:none;filter:blur(0);}
  }
  .title h1{
    font-size:clamp(19px,3.05vw,40px);
    font-weight:400;
    letter-spacing:.30em;
    line-height:1.35;
    color:#eafff0;
    text-shadow:
      0 0 26px rgba(90,255,150,.85),
      0 0 68px rgba(40,200,100,.55),
      0 2px 10px rgba(0,0,0,.95);
  }
  .title h1 .em{
    color:#8fffc0;
    text-shadow:0 0 30px rgba(100,255,160,.95),0 0 78px rgba(50,220,110,.5);
  }
  .title .sub{
    margin-top:.62em;
    font-size:clamp(10px,1.42vw,15px);
    letter-spacing:.42em;
    color:#8fe8b0;
    opacity:.88;
    text-shadow:0 0 22px rgba(80,230,140,.75),0 2px 8px rgba(0,0,0,.9);
  }
  .title .line{
    margin-top:.85em;
    width:clamp(70px,11vw,150px);
    height:1px;
    background:linear-gradient(90deg,
      rgba(120,255,170,.9),
      rgba(60,220,120,.5),
      rgba(120,255,170,0));
    box-shadow:0 0 12px rgba(100,255,160,.75);
  }

  /* ---------- 右上角角标 ---------- */
  .corner{
    position:fixed;
    right:clamp(16px,4.2vw,58px);
    top:clamp(16px,4.2vh,52px);
    z-index:10;pointer-events:none;user-select:none;
    text-align:right;color:#8fe8b0;
    font-family:"Songti SC","STSong","Times New Roman",serif;
    font-size:clamp(9.5px,1.24vw,13px);
    letter-spacing:.24em;line-height:2.1;opacity:.75;
    text-shadow:0 0 20px rgba(80,230,140,.65),0 2px 7px rgba(0,0,0,.9);
  }
  .corner .cn{
    font-size:clamp(10.5px,1.42vw,15px);
    color:#c2ffd8;letter-spacing:.30em;
    text-shadow:0 0 24px rgba(100,255,160,.85);
  }
  .corner .n{color:#7fffb4;text-shadow:0 0 20px rgba(90,255,150,.85);}

  /* ---------- 左下数学公式 HUD ---------- */
  .hud{
    position:fixed;
    left:clamp(16px,4.2vw,58px);
    bottom:clamp(16px,4.4vh,56px);
    z-index:10;
    pointer-events:none;user-select:none;
    max-width:min(94vw,1000px);
    color:#c2ffd8;
    font-family:"Times New Roman","Songti SC","STSong",Georgia,serif;
    text-shadow:
      0 0 24px rgba(80,230,140,.6),
      0 0 64px rgba(30,180,90,.35),
      0 2px 9px rgba(0,0,0,.9);
    animation:hudIn 1.9s cubic-bezier(.2,.8,.25,1) both .25s;
  }
  @keyframes hudIn{
    from{opacity:0;transform:translateY(22px);filter:blur(8px);}
    to{opacity:1;transform:none;filter:blur(0);}
  }
  .hud .tag{
    font-size:clamp(9.5px,1.32vw,13.5px);
    letter-spacing:.30em;
    opacity:.92;margin-bottom:.9em;
    white-space:nowrap;color:#9ff5c0;
    font-family:"Songti SC","STSong",serif;
  }
  .hud .tag .dot{
    display:inline-block;width:.46em;height:.46em;border-radius:50%;
    background:#5cff9e;
    box-shadow:0 0 16px 5px rgba(80,255,150,.95);
    vertical-align:.02em;margin-right:.7em;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.3;transform:scale(.66);}
    50%    {opacity:1;  transform:scale(1.22);}
  }
  .hud .eq{
    font-size:clamp(12.5px,1.95vw,22px);
    line-height:1.95;font-style:italic;letter-spacing:.012em;
    opacity:.97;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hud .eq .hl{color:#a8ffcc;text-shadow:0 0 26px rgba(100,255,170,.95);font-style:normal;}
  .hud .eq .hl2{color:#7fffd4;text-shadow:0 0 26px rgba(70,255,190,.95);font-style:normal;}
  .hud .eq.sm{
    font-size:clamp(10px,1.38vw,14.5px);
    opacity:.74;margin-top:.55em;color:#8fe8b0;
    text-shadow:0 0 24px rgba(70,220,130,.6),0 2px 8px rgba(0,0,0,.9);
  }
  .hud .cnline{
    margin-top:.6em;
    font-size:clamp(10px,1.34vw,14px);
    letter-spacing:.28em;
    color:#a8ffcc;
    opacity:.8;
    font-family:"Songti SC","STSong",serif;
    text-shadow:0 0 22px rgba(90,255,150,.75);
  }
  .hud sub{font-size:.62em;font-style:normal;vertical-align:-.22em;letter-spacing:0;}
  .hud sup{font-size:.6em;font-style:normal;vertical-align:.42em;}

  /* ---------- 音频控制条 ---------- */
  .audiobar{
    position:fixed;
    right:clamp(16px,4.2vw,58px);
    bottom:clamp(16px,4.4vh,56px);
    z-index:20;
    display:flex;align-items:center;
    gap:clamp(8px,1.1vw,14px);
    padding:clamp(8px,1.1vw,13px) clamp(12px,1.6vw,19px);
    border-radius:999px;
    background:linear-gradient(150deg,
        rgba(8,42,26,.78) 0%,
        rgba(6,36,30,.7) 55%,
        rgba(4,44,38,.7) 100%);
    border:1px solid rgba(100,255,160,.32);
    box-shadow:
      0 0 26px rgba(60,220,120,.24),
      0 0 66px rgba(30,180,110,.18),
      inset 0 0 26px rgba(80,230,140,.08);
    backdrop-filter:blur(10px) saturate(1.5);
    -webkit-backdrop-filter:blur(10px) saturate(1.5);
    user-select:none;
    animation:barIn 2.1s cubic-bezier(.2,.8,.25,1) both .4s;
  }
  @keyframes barIn{
    from{opacity:0;transform:translateY(16px) scale(.94);filter:blur(6px);}
    to{opacity:1;transform:none;filter:blur(0);}
  }
  .audiobar button{
    appearance:none;border:none;outline:none;cursor:pointer;
    display:grid;place-items:center;
    width:clamp(34px,3.6vw,44px);height:clamp(34px,3.6vw,44px);
    border-radius:50%;color:#d8ffe6;
    background:radial-gradient(circle at 34% 28%,
        rgba(100,255,160,.32),
        rgba(10,50,30,.34) 72%);
    border:1px solid rgba(120,255,170,.48);
    box-shadow:
      0 0 18px rgba(70,230,130,.4),
      inset 0 0 14px rgba(100,255,160,.16);
    transition:transform .2s ease, box-shadow .25s ease;
  }
  .audiobar button:hover{
    transform:scale(1.09);
    box-shadow:0 0 32px rgba(100,255,160,.7),inset 0 0 20px rgba(140,255,180,.26);
  }
  .audiobar button:active{transform:scale(.94);}
  .audiobar button svg{width:52%;height:52%;display:block;fill:currentColor;}

  .audiobar .meta{
    display:flex;flex-direction:column;gap:3px;
    font-family:"Songti SC","STSong","Times New Roman",serif;
    line-height:1.35;white-space:nowrap;
  }
  .audiobar .meta .ttl{
    font-size:clamp(9.5px,1.14vw,12.5px);
    letter-spacing:.24em;
    color:#a8ffcc;text-shadow:0 0 16px rgba(90,255,150,.75);
  }
  .audiobar .meta .sub{
    font-size:clamp(8px,.94vw,10.5px);
    letter-spacing:.16em;color:#8fe8b0;opacity:.8;
    text-shadow:0 0 14px rgba(70,220,130,.6);
  }
  .leds{display:flex;align-items:flex-end;gap:3px;height:clamp(16px,2vw,22px);}
  .leds i{
    display:block;width:3px;border-radius:2px;
    background:linear-gradient(180deg,#a8ffcc,#3cd87a);
    box-shadow:0 0 9px rgba(100,255,160,.95);
    transform-origin:bottom;opacity:.3;height:100%;
    transition:opacity .18s linear;
  }
  .audiobar.on .leds i{opacity:.95;animation:eq .8s ease-in-out infinite alternate;}
  .audiobar.on .leds i:nth-child(1){animation-delay:0s;   --h:.42;}
  .audiobar.on .leds i:nth-child(2){animation-delay:.12s; --h:.86;}
  .audiobar.on .leds i:nth-child(3){animation-delay:.24s; --h:.58;}
  .audiobar.on .leds i:nth-child(4){animation-delay:.07s; --h:.96;}
  .audiobar.on .leds i:nth-child(5){animation-delay:.31s; --h:.50;}
  @keyframes eq{
    from{transform:scaleY(.2);}
    to  {transform:scaleY(var(--h,1));}
  }

  /* 加载层 */
  .loader{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:#010409;color:#9ff5c0;
    font:13px/1.7 "Songti SC","STSong",serif;letter-spacing:.34em;
    transition:opacity .9s ease, visibility .9s;
  }
  .loader.gone{opacity:0;pointer-events:none;visibility:hidden;}
  .loader .ring{
    width:56px;height:56px;border-radius:50%;
    border:1px solid rgba(120,255,170,.25);
    border-top-color:#5cff9e;
    animation:spin 1s linear infinite;margin:0 auto 18px;
    box-shadow:0 0 26px rgba(80,255,150,.5);
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .err{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:60;color:#ff8a8a;font:13px/1.7 monospace;letter-spacing:.08em;
    text-align:center;padding:20px 28px;border-radius:10px;
    background:rgba(20,0,10,.85);border:1px solid rgba(255,120,120,.35);
    display:none;max-width:80vw;
  }

  @media (max-width:760px){
    .title h1{letter-spacing:.18em;}
    .title .sub{letter-spacing:.24em;}
    .corner{display:none;}
  }
  @media (max-width:560px){
    .audiobar .meta .sub{display:none;}
    .leds{display:none;}
    .hud .eq{font-size:clamp(10.5px,3.2vw,15px);}
    .hud .eq.sm{font-size:clamp(8.5px,2.6vw,12px);}
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
/* 全局错误捕获 */
window.addEventListener('error', function(e){
  var el = document.getElementById('err');
  if (el && !el.dataset.shown) {
    el.dataset.shown = '1';
    el.style.display = 'block';
    el.textContent = '初始化出错：' + (e.message || '未知错误') + '\n请尝试刷新页面';
  }
  var ld = document.getElementById('loader');
  if (ld) ld.classList.add('gone');
});

import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   音频引擎（Web Audio 实时合成 · 科技氛围）
   ============================================================ */
const Audio = (function () {
  let ctx = null, master = null, revIn = null;
  let started = false, timerId = null;
  let nextStepTime = 0, stepIdx = 0;

  const BPM = 76;
  const SPB = 60 / BPM;
  const S16 = SPB / 4;
  /* 明亮科技音阶：D 大调五声 + 高八度闪烁 */
  const SCALE = [62, 66, 69, 74, 78, 81, 86, 90];

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function buildIR(dur, decay) {
    const rate = ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * dur));
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  /* FM 铃音：科技感清亮音色 */
  function bell(freq, t, dur, gain) {
    const car = ctx.createOscillator();
    car.type = 'sine';
    car.frequency.value = freq;

    const mod = ctx.createOscillator();
    mod.type = 'sine';
    mod.frequency.value = freq * 3.01;

    const modG = ctx.createGain();
    modG.gain.setValueAtTime(freq * 2.0, t);
    modG.gain.exponentialRampToValueAtTime(freq * 0.015, t + dur * 0.7);
    mod.connect(modG); modG.connect(car.frequency);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const pan = ctx.createStereoPanner();
    pan.pan.value = (Math.random() * 2 - 1) * 0.45;

    car.connect(g);
    g.connect(pan);
    pan.connect(master);
    if (revIn) g.connect(revIn);

    car.start(t); mod.start(t);
    car.stop(t + dur + 0.06); mod.stop(t + dur + 0.06);
  }

  /* 低频脉冲 */
  function kick(t, gain) {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.20);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);

    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.44);
  }

  /* 高频空气感噪声 */
  function air(t, vol) {
    const rate = ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * 0.06));
    const buf = ctx.createBuffer(1, len, rate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    const src = ctx.createBufferSource();
    src.buffer = buf;

    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 8200;

    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.052);

    src.connect(hp); hp.connect(g); g.connect(master);
    src.start(t); src.stop(t + 0.07);
  }

  function scheduleStep(step, t) {
    /* 低频脉冲：每拍 */
    if (step % 4 === 0) kick(t, 0.26);

    /* 铃音琶音：8 分为主 */
    if (step % 2 === 0 || Math.random() < 0.20) {
      const n = SCALE[(step * 3 + Math.floor(step / 16) * 2) % SCALE.length];
      bell(mtof(n), t, 0.85 + Math.random() * 0.75, 0.048);
    }
    /* 偶发高八度闪烁 */
    if (Math.random() < 0.075) {
      const n = SCALE[Math.floor(Math.random() * SCALE.length)] + 12;
      bell(mtof(n), t, 0.55, 0.026);
    }
    /* 空气感细碎噪声 */
    if (step % 4 === 2) air(t, 0.020);
  }

  function scheduler() {
    if (!started || !ctx) return;
    const now = ctx.currentTime;
    while (nextStepTime < now + 0.16) {
      scheduleStep(stepIdx, nextStepTime);
      nextStepTime += S16;
      stepIdx = (stepIdx + 1) % 64;
    }
  }

  /* 持续低频氛围 */
  function startDrone() {
    const now = ctx.currentTime;
    const dg = ctx.createGain();
    dg.gain.setValueAtTime(0.0001, now);
    dg.gain.exponentialRampToValueAtTime(0.10, now + 4.5);
    dg.connect(master);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 480;
    lp.Q.value = 3.0;
    lp.connect(dg);

    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.058;
    const lfoG = ctx.createGain();
    lfoG.gain.value = 280;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    lfo.start();

    [55, 73.42, 110, 146.83].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = i % 2 === 0 ? 'sawtooth' : 'triangle';
      o.frequency.value = f;
      o.detune.value = (i - 1.5) * 6;
      const g = ctx.createGain();
      g.gain.value = 0.22;
      o.connect(g); g.connect(lp);
      o.start();
    });
  }

  return {
    get ctx() { return ctx; },
    get started() { return started; },
    _timer: null,

    init() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();

      master = ctx.createGain();
      master.gain.value = 0.85;
      master.connect(ctx.destination);

      const conv = ctx.createConvolver();
      conv.buffer = buildIR(3.6, 2.4);
      revIn = ctx.createGain();
      revIn.gain.value = 0.9;
      revIn.connect(conv);
      const revOut = ctx.createGain();
      revOut.gain.value = 0.32;
      conv.connect(revOut);
      revOut.connect(master);
    },

    start() {
      if (!ctx) this.init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      if (started) return;
      started = true;
      stepIdx = 0;
      nextStepTime = ctx.currentTime + 0.1;
      startDrone();
      this._timer = setInterval(scheduler, 25);
    },

    stop() {
      if (!ctx || !started) return;
      started = false;
      if (this._timer) { clearInterval(this._timer); this._timer = null; }
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(Math.max(master.gain.value, 0.0001), t);
      master.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      const m = master;
      setTimeout(() => {
        try {
          m.gain.cancelScheduledValues(ctx.currentTime);
          m.gain.setValueAtTime(0.85, ctx.currentTime);
        } catch (e) {}
      }, 900);
    },

    /* 波前经过屏幕时的清脆提示音 */
    ping() {
      if (!ctx || !started) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(1400, t);
      o.frequency.exponentialRampToValueAtTime(560, t + 0.30);

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.055, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);

      const pan = ctx.createStereoPanner();
      pan.pan.value = (Math.random() * 2 - 1) * 0.6;

      o.connect(g); g.connect(pan);
      pan.connect(master);
      if (revIn) g.connect(revIn);
      o.start(t); o.stop(t + 0.55);
    }
  };
})();

/* ============================================================
   基础三件套
   ============================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.setClearColor(0x010409, 1);

const scene = new THREE.Scene();

/* 正交相机：俯视波场平面 */
const camera = new THREE.OrthographicCamera(-18, 18, 11, -11, 0.1, 100);
camera.position.set(-2, 0, 10);
camera.lookAt(-2, 0, 0);

/* ============================================================
   波场着色器
   ------------------------------------------------------------
   物理布局（世界坐标）：
     · 光源      (-16, 0)         点光源，发出球面波
     · 双缝挡板   x = -5          两条缝在 y = ±1.8
     · 投影屏     x = +12         显示干涉条纹
     · 波长 λ = 0.85   →  k = 2π/λ ≈ 7.391
     · 条纹间距   Δy = λL/d ≈ 4.01
   ============================================================ */
const vertexShader = [
  'varying vec2 vWorld;',
  'void main(){',
  '  vec4 wp = modelMatrix * vec4(position, 1.0);',
  '  vWorld = wp.xy;',
  '  gl_Position = projectionMatrix * viewMatrix * wp;',
  '}'
].join('\n');

const fragmentShader = [
  'precision highp float;',
  '',
  'uniform float uTime;',
  'uniform vec2  uCamCenter;',
  'uniform vec2  uRes;',
  '',
  'varying vec2 vWorld;',
  '',
  '#define SRC_X     (-16.0)',
  '#define BARRIER_X ( -5.0)',
  '#define SLIT_Y    (  1.8)',
  '#define SCREEN_X  ( 12.0)',
  '#define K         (  7.3912)',
  '#define OMEGA     (  8.0)',
  '',
  '/* 波场：返回该点的瞬时振幅 */',
  'float waveField(vec2 p, float t){',
  '    /* 光源发出的球面波（左半区） */',
  '    float r0 = length(p - vec2(SRC_X, 0.0));',
  '    float inc = sin(K * r0 - OMEGA * t) / (1.0 + r0 * 0.055);',
  '',
  '    /* 两条缝各自发出的半圆球面波（右半区） */',
  '    float d1 = length(p - vec2(BARRIER_X, -SLIT_Y));',
  '    float d2 = length(p - vec2(BARRIER_X,  SLIT_Y));',
  '    float s1 = sin(K * d1 - OMEGA * t) / (1.0 + d1 * 0.075);',
  '    float s2 = sin(K * d2 - OMEGA * t) / (1.0 + d2 * 0.075);',
  '',
  '    /* 挡板前后平滑过渡 */',
  '    float m = smoothstep(BARRIER_X - 0.55, BARRIER_X + 0.55, p.x);',
  '    return mix(inc, s1 + s2, m);',
  '}',
  '',
  'void main(){',
  '    vec2  p = vWorld;',
  '    float t = uTime;',
  '',
  '    float f = waveField(p, t);',
  '',
  '    /* ---------- 基底：深空暗色 ---------- */',
  '    vec3 col = vec3(0.004, 0.010, 0.018);',
  '',
  '    /* 远处微弱青绿雾霭，强化景深 */',
  '    col += vec3(0.008, 0.028, 0.020) * exp(-length(p - uCamCenter) * 0.045);',
  '',
  '    /* ---------- 波场着色：翠绿波峰 + 暗绿波谷 ---------- */',
  '    float v   = f * 0.68;',
  '    float pos = max(v, 0.0);',
  '    float neg = max(-v, 0.0);',
  '',
  '    col += vec3(0.070, 0.440, 0.170) * pos;',
  '    col += vec3(0.440, 1.000, 0.560) * pow(pos, 4.0) * 1.45;',
  '    col += vec3(0.020, 0.100, 0.055) * neg;',
  '',
  '    /* 细密波峰高光，让波前更锐利 */',
  '    col += vec3(0.60, 1.00, 0.72) * pow(pos, 12.0) * 1.8;',
  '',
  '    /* ---------- 投影屏：干涉条纹 ---------- */',
  '    float scrMask = smoothstep(SCREEN_X - 1.1, SCREEN_X - 0.15, p.x);',
  '    if (scrMask > 0.001){',
  '        /* 条纹强度 I ∝ |A|² */',
  '        float I = f * f;',
  '',
  '        /* 明纹：亮绿；暗纹：几乎全黑 */',
  '        vec3 scrCol = vec3(0.010, 0.030, 0.016);',
  '        scrCol += vec3(0.180, 0.620, 0.280) * I * 0.72;',
  '        scrCol += vec3(0.520, 1.000, 0.620) * pow(clamp(I, 0.0, 1.0), 2.6) * 2.0;',
  '',
  '        /* 屏幕上下端渐隐 */',
  '        scrCol *= smoothstep(10.5, 8.0, abs(p.y));',
  '',
  '        col = mix(col, scrCol, scrMask * 0.94);',
  '    }',
  '',
  '    /* 屏幕边缘辉光 */',
  '    float scrEdge = exp(-pow((p.x - SCREEN_X) * 1.6, 2.0)) * smoothstep(10.8, 8.5, abs(p.y));',
  '    col += vec3(0.130, 0.700, 0.300) * scrEdge * 0.42;',
  '',
  '    /* ---------- 双缝挡板 ---------- */',
  '    float bx = abs(p.x - BARRIER_X);',
  '    float barrierMask = smoothstep(0.34, 0.14, bx);',
  '',
  '    float slitDist = min(abs(p.y - SLIT_Y), abs(p.y + SLIT_Y));',
  '    float slitGap  = smoothstep(0.52, 0.30, slitDist);',
  '',
  '    float barrier = barrierMask * (1.0 - slitGap);',
  '',
  '    col = mix(col, vec3(0.070, 0.095, 0.120), barrier * 0.92);',
  '',
  '    /* 挡板边缘的青绿描边 */',
  '    float edge = smoothstep(0.55, 0.14, bx) - smoothstep(0.14, 0.0, bx);',
  '    col += vec3(0.180, 0.780, 0.340) * edge * 0.55;',
  '',
  '    /* 缝口的柔光 */',
  '    float slitGlow = exp(-slitDist * slitDist * 6.5) * barrierMask;',
  '    col += vec3(0.300, 1.000, 0.480) * slitGlow * 0.90;',
  '',
  '    /* ---------- 光源 ---------- */',
  '    float srcD = length(p - vec2(SRC_X, 0.0));',
  '    col += vec3(0.550, 1.000, 0.640) * exp(-srcD * srcD * 0.32) * 2.6;',
  '    col += vec3(0.200, 0.900, 0.400) * exp(-srcD * 0.32) * 0.42;',
  '',
  '    /* ---------- 呼吸律动 ---------- */',
  '    col *= 0.93 + 0.07 * sin(t * 1.15);',
  '',
  '    /* ---------- 暗角 ---------- */',
  '    float vig = smoothstep(30.0, 7.0, length(p - uCamCenter));',
  '    col *= 0.36 + 0.64 * vig;',
  '',
  '    /* ---------- 色调映射与抖动 ---------- */',
  '    col = col / (1.0 + col * 0.30);',
  '    col = pow(max(col, 0.0), vec3(0.90));',
  '',
  '    float n = fract(sin(dot(gl_FragCoord.xy + fract(t), vec2(12.9898, 78.233))) * 43758.5453);',
  '    col += (n - 0.5) * 0.010;',
  '',
  '    gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

const uniforms = {
  uTime:      { value: 0 },
  uCamCenter: { value: new THREE.Vector2(-2, 0) },
  uRes:       { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const planeGeo = new THREE.PlaneGeometry(400, 400);
const planeMat = new THREE.ShaderMaterial({
  uniforms: uniforms,
  vertexShader: vertexShader,
  fragmentShader: fragmentShader,
  depthWrite: false,
  depthTest: false
});

const wavePlane = new THREE.Mesh(planeGeo, planeMat);
wavePlane.position.set(-2, 0, 0);
scene.add(wavePlane);

/* ============================================================
   后期处理（泛光）
   ============================================================ */
let composer = null;
let bloomPass = null;
try {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));

  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.95,   // strength
    0.70,   // radius
    0.10    // threshold
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
} catch (e) {
  composer = null;
  console.warn('后期处理初始化失败，改用直出渲染:', e);
}

/* ============================================================
   尺寸自适应
   ============================================================ */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / h;

  const targetW = 36;
  const targetH = 22;

  let vw, vh;
  if (aspect > targetW / targetH) {
    vh = targetH;
    vw = vh * aspect;
  } else {
    vw = targetW;
    vh = vw / aspect;
  }

  camera.left   = -vw / 2;
  camera.right  =  vw / 2;
  camera.top    =  vh / 2;
  camera.bottom = -vh / 2;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);

  uniforms.uRes.value.set(w, h);
}
window.addEventListener('resize', onResize, { passive: true });
window.addEventListener('orientationchange', onResize, { passive: true });

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let time = 0;
let pingTimer = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  uniforms.uTime.value = time;

  /* 周期性轻响：模拟波前扫过屏幕的节拍 */
  pingTimer += dt;
  if (pingTimer > 1.35) {
    pingTimer = 0;
    if (Audio.started) Audio.ping();
  }

  if (composer) composer.render();
  else renderer.render(scene, camera);
}

/* ============================================================
   UI 绑定
   ============================================================ */
const playBtn   = document.getElementById('playBtn');
const iconPlay  = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');
const bar       = document.getElementById('audiobar');
const subText   = document.getElementById('subText');

playBtn.addEventListener('click', async () => {
  if (!Audio.ctx) Audio.init();
  if (Audio.ctx && Audio.ctx.state === 'suspended') {
    try { await Audio.ctx.resume(); } catch (e) {}
  }

  if (Audio.started) {
    Audio.stop();
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
    bar.classList.remove('on');
    subText.textContent = '点击播放 · 干涉音景';
  } else {
    Audio.start();
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
    bar.classList.add('on');
    subText.textContent = '正在播放 · 点击暂停';
  }
});

window.addEventListener('pointerdown', function once() {
  window.removeEventListener('pointerdown', once);
  if (!Audio.ctx) {
    Audio.init();
    if (Audio.ctx && Audio.ctx.state === 'suspended') {
      Audio.ctx.resume().catch(() => {});
    }
  }
}, { once: true, passive: true });

document.addEventListener('visibilitychange', () => {
  if (!Audio.ctx || !Audio.started) return;
  if (document.hidden) {
    if (Audio._timer) { clearInterval(Audio._timer); Audio._timer = null; }
  } else {
    if (!Audio._timer) Audio._timer = setInterval(() => {}, 25);
  }
});

/* ============================================================
   启动
   ============================================================ */
onResize();
animate();

setTimeout(() => {
  const ld = document.getElementById('loader');
  if (ld) ld.classList.add('gone');
}, 500);
</script>
</body>
</html>
