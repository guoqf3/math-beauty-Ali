<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极地蝴蝶共振 · 多翼曲线</title>
    <style>
        :root {
            --bg: #03030c;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: clamp(18px, 3.8vh, 44px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #title-overlay h1 {
            color: #e2d0b5;
            font-size: clamp(1.2rem, 2.3vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 30px rgba(220, 180, 130, 0.55), 0 0 80px rgba(190, 150, 100, 0.25);
            margin: 0;
        }
        #title-overlay .subtitle {
            color: #bca68a;
            font-size: clamp(0.7rem, 1.2vw, 0.95rem);
            letter-spacing: 0.06em;
            margin-top: 0.3em;
            text-shadow: 0 0 15px rgba(180, 140, 100, 0.4);
        }

        #formula-overlay {
            position: fixed;
            bottom: clamp(26px, 4.8vh, 56px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(16, 12, 22, 0.72);
            border: 1px solid rgba(170, 140, 110, 0.28);
            border-radius: 12px;
            padding: clamp(10px, 1.4vh, 16px) clamp(18px, 3vw, 30px);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        #formula-overlay .formula-main {
            color: #f2dfc2;
            font-size: clamp(0.82rem, 1.4vw, 1.2rem);
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a6957c;
            font-size: clamp(0.62rem, 0.95vw, 0.82rem);
            letter-spacing: 0.03em;
            margin-top: 0.25em;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.05em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>极地蝴蝶共振</h1>
        <div class="subtitle">Polar Butterfly Resonance · Multiphase Curves</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                ℬ<sub>α</sub> : r(θ) = e<sup>cos θ</sup> − 2 cos 4θ + sin<sup>5</sup>(θ/12)<br>
                &emsp;&emsp; x = r(θ)·cos(θ+α)&ensp; z = H·sin(ωθ)
            </div>
            <div class="formula-detail">
                θ ∈ [0, 6π] | α ∈ [0, 2π] | H=1.6  ω=0.75
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#040410');
        scene.fog = new THREE.Fog('#040410', 5.5, 16);

        const camera = new THREE.PerspectiveCamera(
            48,
            container.clientWidth / container.clientHeight,
            0.3,
            25
        );
        camera.position.set(0, 0.3, 6.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight('#202040', 0.5));

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const allLines = [];
        const totalPoints = 1800; // 采样点数，保证曲线细腻

        // ==================== 蝴蝶曲线生成 ====================
        function butterflyR(theta) {
            // 经典极坐标蝴蝶曲线
            return Math.exp(Math.cos(theta)) - 2 * Math.cos(4 * theta) + Math.pow(Math.sin(theta / 12), 5);
        }

        function generateButterfly3D(phaseAlpha, H, omega, scale) {
            const vertices = new Float32Array(totalPoints * 3);
            for (let i = 0; i < totalPoints; i++) {
                const theta = (i / (totalPoints - 1)) * Math.PI * 6; // θ: 0 -> 6π
                const r = butterflyR(theta);
                const angle = theta + phaseAlpha;
                const x = scale * r * Math.cos(angle);
                const y = scale * r * Math.sin(angle);
                const z = scale * H * Math.sin(omega * theta);
                vertices[i * 3] = x;
                vertices[i * 3 + 1] = y;
                vertices[i * 3 + 2] = z;
            }
            return vertices;
        }

        function createLine(vertices, colorHSL, opacity = 0.8) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0); // 初始隐藏

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.NormalBlending,
                depthWrite: true,
                depthTest: true,
            });

            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // ==================== 曲线配置 ====================
        // 多相位曲线，覆盖整个色环
        const phaseColors = [
            { h: 0.08, s: 0.90, l: 0.62 },
            { h: 0.12, s: 0.92, l: 0.60 },
            { h: 0.16, s: 0.88, l: 0.64 },
            { h: 0.22, s: 0.90, l: 0.59 },
            { h: 0.28, s: 0.85, l: 0.63 },
            { h: 0.35, s: 0.82, l: 0.61 },
            { h: 0.42, s: 0.78, l: 0.62 },
            { h: 0.50, s: 0.70, l: 0.58 },
            { h: 0.57, s: 0.74, l: 0.60 },
            { h: 0.64, s: 0.68, l: 0.59 },
            { h: 0.72, s: 0.62, l: 0.61 },
            { h: 0.79, s: 0.60, l: 0.60 },
        ];

        const scaleFactor = 0.42;   // 整体缩放
        const H = 1.6;
        const omega = 0.75;
        const alphaCount = 12;      // 12条曲线，均匀分布相位
        for (let i = 0; i < alphaCount; i++) {
            const alpha = (i / alphaCount) * Math.PI * 2;
            const color = phaseColors[i % phaseColors.length];
            const vertices = generateButterfly3D(alpha, H, omega, scaleFactor);
            const line = createLine(vertices, color, 0.78);
            mainGroup.add(line);
            allLines.push(line);
        }

        // 添加几条淡淡的径向参考线（从中心辐射）
        function createRadialRef(length, angleH, colorHSL, opacity) {
            const pts = 2;
            const vertices = new Float32Array(pts * 3);
            const x = length * Math.cos(angleH);
            const y = length * Math.sin(angleH);
            vertices[0] = 0; vertices[1] = 0; vertices[2] = 0;
            vertices[3] = x; vertices[4] = y; vertices[5] = 0;
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0);
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.NormalBlending,
                depthWrite: true,
            });
            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        const refRadials = [];
        const refColor = { h: 0.55, s: 0.12, l: 0.48 };
        const radialCount = 24;
        for (let i = 0; i < radialCount; i++) {
            const angle = (i / radialCount) * Math.PI * 2;
            const line = createRadialRef(2.8, angle, refColor, 0.15);
            mainGroup.add(line);
            allLines.push(line);
            refRadials.push(line);
        }

        console.log(`✅ 已生成 ${alphaCount} 条蝴蝶曲线 + ${refRadials.length} 条参考辐线`);

        // ==================== 动画状态机 ====================
        const CYCLE_TOTAL = 7.0;
        const APPEAR_TIME = 3.0;
        const PAUSE_TIME = 1.0;
        const DISAPPEAR_TIME = 3.0;

        let animationStartTime = null;
        let firstFrameDone = false;

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInCubic(t) { return t * t * t; }

        function getProgress(elapsedSeconds) {
            const cycle = elapsedSeconds % CYCLE_TOTAL;
            if (cycle < APPEAR_TIME) {
                const t = cycle / APPEAR_TIME;
                return { progress: easeOutCubic(t), phase: 'appear' };
            } else if (cycle < APPEAR_TIME + PAUSE_TIME) {
                return { progress: 1.0, phase: 'pause' };
            } else {
                const t = (cycle - APPEAR_TIME - PAUSE_TIME) / DISAPPEAR_TIME;
                return { progress: 1.0 - easeInCubic(t), phase: 'disappear' };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            if (animationStartTime === null) {
                animationStartTime = timestamp;
                // 确保第一帧所有线条完全隐藏
                allLines.forEach(line => {
                    line.visible = false;
                    if (line.geometry) line.geometry.setDrawRange(0, 0);
                });
                renderer.render(scene, camera);
                firstFrameDone = true;
                return;
            }

            const elapsed = (timestamp - animationStartTime) / 1000;
            const { progress } = getProgress(elapsed);
            const drawCount = Math.floor(progress * totalPoints);
            const visible = drawCount >= 2;

            // 批量更新线条
            for (let i = 0; i < allLines.length; i++) {
                const line = allLines[i];
                if (!line || !line.geometry) continue;
                const maxPts = line.geometry.attributes.position.count;
                const lineDraw = Math.min(drawCount, maxPts);
                if (visible && lineDraw >= 2) {
                    line.visible = true;
                    line.geometry.setDrawRange(0, lineDraw);
                } else {
                    line.visible = false;
                    line.geometry.setDrawRange(0, 0);
                }
            }

            // 缓慢自转与轻微摇摆
            const rotY = elapsed * 0.15;          // 较慢的旋转
            const rotX = Math.sin(elapsed * 0.28) * 0.1;
            const rotZ = Math.cos(elapsed * 0.35) * 0.08;
            mainGroup.rotation.set(rotX, rotY, rotZ);

            // 相机微动
            camera.position.x = Math.sin(elapsed * 0.19) * 0.35;
            camera.position.y = 0.3 + Math.cos(elapsed * 0.26) * 0.25;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 极地蝴蝶共振动画启动');
        console.log(`   - 蝴蝶曲线: ${alphaCount} 条`);
        console.log(`   - 参考辐线: ${refRadials.length} 条`);
        console.log(`   - 采样点/曲线: ${totalPoints}`);
        console.log(`   - 动画周期: ${CYCLE_TOTAL}s (出现${APPEAR_TIME}s + 停顿${PAUSE_TIME}s + 消失${DISAPPEAR_TIME}s)`);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
