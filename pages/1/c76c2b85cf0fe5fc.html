<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷诺数 · 机械鲸鱼</title>
<style>
  :root{ --split: 20%; }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
  }

  /* ================= 左侧：雷诺数公式 ================= */
  #left{
    position:fixed; left:0; top:0; bottom:0;
    width: var(--split);
    display:flex; align-items:center; justify-content:center;
    padding: 18px 9px;
    background:
      radial-gradient(120% 80% at 18% 22%, rgba(40,220,255,.08), transparent 62%),
      radial-gradient(120% 80% at 82% 84%, rgba(200,30,60,.07), transparent 62%),
      #000;
    border-right:1px solid rgba(60,220,255,.16);
    color:#9fe8ff;
    font-family:"Cambria Math","Latin Modern Math","Times New Roman",serif;
    overflow:hidden;
    z-index:2;
  }
  #left::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(60,220,255,.05) 50%, transparent 100%);
    background-size:100% 220%;
    animation: scan 9.5s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ from{ background-position: 0 -110%; } to{ background-position: 0 110%; } }

  .stack{ width:100%; text-align:center; position:relative; z-index:1; }

  .kicker{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(7px, .55vw, 10px);
    letter-spacing:.26em;
    color: rgba(130,230,255,.5);
    margin-bottom: 1.7em;
    white-space: nowrap;
  }

  .eq{
    font-size: clamp(8px, .88vw, 15px);
    line-height: 1.95;
    color:#a8e8ff;
    text-shadow:
      0 0 10px rgba(50,220,255,.5),
      0 0 26px rgba(0,160,220,.2);
    animation: pulse 5.6s ease-in-out infinite;
    word-break: keep-all;
  }
  .eq.big{
    font-size: clamp(9px, 1.0vw, 17px);
    color:#c8f2ff;
  }
  .eq i{ font-style: italic; }
  .eq b{
    font-weight:600; color:#ffc62e;
    text-shadow: 0 0 10px rgba(255,198,46,.75), 0 0 24px rgba(220,150,0,.35);
  }
  .eq sup, .eq sub{ font-size:.6em; }

  @keyframes pulse{
    0%,100%{ opacity:.84; }
    50%    { opacity:1; }
  }

  .frac{
    display:inline-flex; flex-direction:column;
    vertical-align:middle; text-align:center;
    font-size:.82em; line-height:1.08;
    margin:0 .18em;
  }
  .frac > span:first-child{
    border-bottom:1px solid rgba(150,235,255,.8);
    padding:0 .22em .05em;
  }
  .frac > span:last-child{ padding-top:.05em; }

  .rule{
    height:1px; width:62%;
    margin: 1.4em auto;
    background:linear-gradient(90deg, transparent, rgba(60,220,255,.42), transparent);
  }

  .meta{
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(7px, .54vw, 10px);
    letter-spacing:.16em;
    color: rgba(180,240,255,.62);
    white-space: nowrap;
  }
  .dot{
    display:inline-block; width:.6em; height:.6em; border-radius:50%;
    vertical-align:middle; margin:0 .28em 0 .1em;
  }
  .dot.cy{ background:#2fe0ff; box-shadow:0 0 10px #2fe0ff, 0 0 22px rgba(47,224,255,.65); }
  .dot.go{ background:#ffc62e; box-shadow:0 0 10px #ffc62e, 0 0 22px rgba(255,198,46,.65); }
  .dot.cr{ background:#d81e3c; box-shadow:0 0 10px #d81e3c, 0 0 22px rgba(216,30,60,.65); }

  /* ================= 右侧：机械鲸鱼 ================= */
  #right{
    position:fixed; left: var(--split); top:0; right:0; bottom:0;
    background:#000;
    overflow:hidden;
  }
  #right canvas{ display:block; position:absolute; inset:0; }

  @media (max-width: 900px){
    :root{ --split: 27%; }
    .kicker{ letter-spacing:.15em; }
    .meta{ letter-spacing:.06em; }
  }
</style>
</head>
<body>

<!-- ============ 左：公式 ============ -->
<div id="left">
  <div class="stack">
    <div class="kicker">REYNOLDS NUMBER</div>

    <div class="eq big">
      <i>Re</i> =
      <span class="frac">
        <span>ρ<i>vL</i></span>
        <span>μ</span>
      </span>
      =
      <span class="frac">
        <span><i>vL</i></span>
        <span>ν</span>
      </span>
    </div>

    <div class="rule"></div>

    <div class="eq">
      惯性力 / 粘性力
    </div>

    <div class="rule"></div>

    <div class="eq">
      <b>Re &lt; 2300</b> &nbsp;层流<br>
      <b>Re &gt; 4000</b> &nbsp;湍流
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span class="dot cy"></span>粘性
      <span class="dot go"></span>惯性
      <span class="dot cr"></span>湍流
    </div>
  </div>
</div>

<!-- ============ 右：场景 ============ -->
<div id="right"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* =========================================================
   0. 渲染器 / 场景 / 相机
   ========================================================= */
const host = document.getElementById('right');

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 1);
renderer.domElement.style.display = 'block';
host.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

const LOOK_AT = new THREE.Vector3(0.15, 0.05, 0);

function fitCamera(){
  const w = host.clientWidth  || 1;
  const h = host.clientHeight || 1;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);

  camera.aspect = w / h;

  const vFov = camera.fov * Math.PI / 180;
  const halfH = 1.60;
  const halfW = 3.40;
  const tan   = Math.tan(vFov / 2);
  const dV    = halfH / tan;
  const dH    = halfW / (tan * camera.aspect);
  const d     = Math.max(dV, dH) * 1.02;

  const dir = new THREE.Vector3(0.22, 0.34, 1).normalize();
  camera.position.copy(LOOK_AT).addScaledVector(dir, d);
  camera.lookAt(LOOK_AT);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fitCamera);

/* =========================================================
   1. 配色
   ========================================================= */
const COL_CYAN = new THREE.Color(0x2fe0ff);
const COL_GOLD = new THREE.Color(0xffc62e);
const COL_CRIM = new THREE.Color(0xd81e3c);

const _cTmp = new THREE.Color();
function colorAt(s, out){
  s = s < 0 ? 0 : s > 1 ? 1 : s;
  if (s < 0.5) out.copy(COL_CYAN).lerp(COL_GOLD, s * 2);
  else         out.copy(COL_GOLD).lerp(COL_CRIM, (s - 0.5) * 2);
  return out;
}

/* =========================================================
   2. 中轴
   ========================================================= */
function spinePoint(s){
  return {
    x: -2.20 + 4.40 * s,
    y: 0.26 * Math.sin(Math.PI * Math.pow(s, 0.75)) - 0.14 * s
  };
}

function bodyRadius(s){
  const r = Math.sin(Math.pow(s, 0.62) * Math.PI) * 0.46;
  return Math.max(0.016, r * (1 - 0.34 * Math.pow(s, 2)));
}

function sampleFrame(s, t, out){
  const h = 1e-3;
  const s0 = Math.max(0, s - h), s1 = Math.min(1, s + h);
  const p0 = spinePoint(s0), p1 = spinePoint(s1);

  let tx = p1.x - p0.x, ty = p1.y - p0.y;
  const tl = Math.hypot(tx, ty) || 1;
  tx /= tl; ty /= tl;

  const base = spinePoint(s);

  const amp  = 0.035 + 0.235 * Math.pow(s, 1.8);
  const wave = amp * Math.sin(s * 6.6 - t * 2.7);

  const px = base.x - ty * wave;
  const py = base.y + tx * wave;
  const pz = 0;

  out.px = px; out.py = py; out.pz = pz;
  out.n1x = 0; out.n1y = 0; out.n1z = 1;
  out.n2x = -ty; out.n2y = tx; out.n2z = 0;
  out.r  = bodyRadius(s);
  out.s  = s;
  return out;
}

function surfacePoint(f, ang, out){
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const rH = f.r * 0.86;
  const rV = f.r;

  out.x = f.px + f.n1x * ca * rH + f.n2x * sa * rV;
  out.y = f.py + f.n1y * ca * rH + f.n2y * sa * rV;
  out.z = f.pz + f.n1z * ca * rH + f.n2z * sa * rV;
  return out;
}

/* =========================================================
   3. 身体线框（已加密）
   ========================================================= */
const NSEG  = 110;   // 沿体（原 68 → 110）
const NRING = 40;    // 环向（原 24 → 40）
const NLONG = 34;    // 纵向线条（原 20 → 34）

const ringVerts = (NSEG + 1) * NRING * 2;
const longVerts = NSEG * NLONG * 2;

const ringPos = new Float32Array(ringVerts * 3);
const ringCol = new Float32Array(ringVerts * 3);
const longPos = new Float32Array(longVerts * 3);
const longCol = new Float32Array(longVerts * 3);

const ringGeo = new THREE.BufferGeometry();
ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
ringGeo.setAttribute('color',    new THREE.BufferAttribute(ringCol, 3));

const longGeo = new THREE.BufferGeometry();
longGeo.setAttribute('position', new THREE.BufferAttribute(longPos, 3));
longGeo.setAttribute('color',    new THREE.BufferAttribute(longCol, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors : true,
  transparent  : true,
  opacity      : 0.72,
  blending     : THREE.AdditiveBlending,
  depthWrite   : false,
  depthTest    : false
});

const ringLines = new THREE.LineSegments(ringGeo, lineMat);
const longLines = new THREE.LineSegments(longGeo, lineMat);

const whale = new THREE.Group();
whale.add(ringLines);
whale.add(longLines);
scene.add(whale);

const FRAMES = new Array(NSEG + 1);
for (let i = 0; i <= NSEG; i++) FRAMES[i] = {};

const _pA = new THREE.Vector3();
const _pB = new THREE.Vector3();
const _cA = new THREE.Color();
const _cB = new THREE.Color();

function updateBody(t){
  for (let i = 0; i <= NSEG; i++){
    sampleFrame(i / NSEG, t, FRAMES[i]);
  }

  /* ---- 环向线圈 ---- */
  let vi = 0, ci = 0;
  for (let i = 0; i <= NSEG; i++){
    const f = FRAMES[i];
    colorAt(f.s, _cA);

    const glow = 0.55 + 0.45 * Math.sin(f.s * 8.0 - t * 1.8);

    for (let j = 0; j < NRING; j++){
      const a1 = (j / NRING) * Math.PI * 2;
      const a2 = ((j + 1) / NRING) * Math.PI * 2;

      surfacePoint(f, a1, _pA);
      surfacePoint(f, a2, _pB);

      ringPos[vi++] = _pA.x; ringPos[vi++] = _pA.y; ringPos[vi++] = _pA.z;
      ringPos[vi++] = _pB.x; ringPos[vi++] = _pB.y; ringPos[vi++] = _pB.z;

      const k = 0.24 + 0.44 * glow;
      ringCol[ci++] = _cA.r * k; ringCol[ci++] = _cA.g * k; ringCol[ci++] = _cA.b * k;
      ringCol[ci++] = _cA.r * k; ringCol[ci++] = _cA.g * k; ringCol[ci++] = _cA.b * k;
    }
  }
  ringGeo.attributes.position.needsUpdate = true;
  ringGeo.attributes.color.needsUpdate    = true;

  /* ---- 纵向管线 ---- */
  vi = 0; ci = 0;
  for (let i = 0; i < NSEG; i++){
    const f0 = FRAMES[i], f1 = FRAMES[i + 1];

    for (let j = 0; j < NLONG; j++){
      const a = (j / NLONG) * Math.PI * 2;

      surfacePoint(f0, a, _pA);
      surfacePoint(f1, a, _pB);

      longPos[vi++] = _pA.x; longPos[vi++] = _pA.y; longPos[vi++] = _pA.z;
      longPos[vi++] = _pB.x; longPos[vi++] = _pB.y; longPos[vi++] = _pB.z;

      const s = (i + 0.5) / NSEG;
      colorAt(s * 0.85 + 0.08, _cB);
      const k = 0.32 + 0.32 * Math.sin(s * 11.0 + j * 1.7 - t * 2.4);

      longCol[ci++] = _cB.r * k; longCol[ci++] = _cB.g * k; longCol[ci++] = _cB.b * k;
      longCol[ci++] = _cB.r * k; longCol[ci++] = _cB.g * k; longCol[ci++] = _cB.b * k;
    }
  }
  longGeo.attributes.position.needsUpdate = true;
  longGeo.attributes.color.needsUpdate    = true;
}

/* =========================================================
   4. 齿轮环（更细密的分段）
   ========================================================= */
const GEAR_S = [0.14, 0.30, 0.46, 0.62, 0.78];
const gears  = [];

const gearMatGold = new THREE.MeshBasicMaterial({
  color: 0xffc62e, transparent:true, opacity:0.80,
  blending: THREE.AdditiveBlending, depthWrite:false, depthTest:false
});
const gearMatCrim = new THREE.MeshBasicMaterial({
  color: 0xd81e3c, transparent:true, opacity:0.70,
  blending: THREE.AdditiveBlending, depthWrite:false, depthTest:false
});
const gearMatCyan = new THREE.MeshBasicMaterial({
  color: 0x2fe0ff, transparent:true, opacity:0.75,
  blending: THREE.AdditiveBlending, depthWrite:false, depthTest:false
});

for (let g = 0; g < GEAR_S.length; g++){
  const s = GEAR_S[g];
  const r = bodyRadius(s);

  /* 外齿环：分段 14 → 26，管径更细 */
  const torus = new THREE.Mesh(
    new THREE.TorusGeometry(r * 1.16, 0.022, 4, 26),
    (g % 3 === 0) ? gearMatCrim : (g % 3 === 1) ? gearMatGold : gearMatCyan
  );

  /* 第二层齿环 */
  const torus2 = new THREE.Mesh(
    new THREE.TorusGeometry(r * 1.05, 0.014, 4, 20),
    gearMatGold
  );

  /* 内环：分段 22 → 40 */
  const inner = new THREE.Mesh(
    new THREE.TorusGeometry(r * 0.94, 0.011, 4, 40),
    gearMatGold
  );

  /* 最内环 */
  const inner2 = new THREE.Mesh(
    new THREE.TorusGeometry(r * 0.80, 0.008, 4, 32),
    gearMatCyan
  );

  const holder = new THREE.Group();
  holder.add(torus);
  holder.add(torus2);
  holder.add(inner);
  holder.add(inner2);

  whale.add(holder);

  gears.push({
    holder : holder,
    torus  : torus,
    torus2 : torus2,
    inner  : inner,
    inner2 : inner2,
    s      : s,
    spin   : (g % 2 === 0 ? 1 : -1) * (0.7 + 0.25 * g)
  });
}

const _q = new THREE.Quaternion();
const _vz = new THREE.Vector3(0, 0, 1);
const _vt = new THREE.Vector3();

function updateGears(t){
  for (let i = 0; i < gears.length; i++){
    const G = gears[i];
    const f = FRAMES[Math.round(G.s * NSEG)];

    G.holder.position.set(f.px, f.py, f.pz);

    _vt.set(f.n2x, f.n2y, f.n2z).normalize();
    _q.setFromUnitVectors(_vz, _vt);
    G.holder.quaternion.copy(_q);

    const spin = t * G.spin;
    G.torus.rotation.z  = spin;
    G.torus2.rotation.z = -spin * 0.8;
    G.inner.rotation.z  = -spin * 1.4;
    G.inner2.rotation.z = spin * 1.9;
  }
}

/* =========================================================
   5. 尾鳍（已加密）
   ========================================================= */
const FIN_N = 52;    // 原 30 → 52

const finPos = new Float32Array(FIN_N * 2 * 3);
const finCol = new Float32Array(FIN_N * 2 * 3);

const finGeo = new THREE.BufferGeometry();
finGeo.setAttribute('position', new THREE.BufferAttribute(finPos, 3));
finGeo.setAttribute('color',    new THREE.BufferAttribute(finCol, 3));

const finLines = new THREE.LineSegments(finGeo, lineMat);
whale.add(finLines);

function updateFin(t){
  const fe = FRAMES[NSEG];
  const tipX = fe.px, tipY = fe.py;

  let vi = 0, ci = 0;

  for (let k = 0; k < FIN_N; k++){
    const f = k / (FIN_N - 1);

    const ang = (-0.5 + f) * Math.PI * 0.80
              + 0.10 * Math.sin(t * 2.4);

    const len = (0.62 + 0.55 * Math.sin(f * Math.PI))
              * (0.90 + 0.12 * Math.sin(t * 3.1 + k * 0.5));

    const ex = tipX + Math.cos(ang) * len;
    const ey = tipY + Math.sin(ang) * len;

    finPos[vi++] = tipX; finPos[vi++] = tipY; finPos[vi++] = 0;
    finPos[vi++] = ex;   finPos[vi++] = ey;   finPos[vi++] = 0;

    colorAt(0.62 + f * 0.36, _cA);
    const kk = 0.48 + 0.38 * (1 - Math.abs(f - 0.5) * 2);

    finCol[ci++] = _cA.r * kk; finCol[ci++] = _cA.g * kk; finCol[ci++] = _cA.b * kk;
    finCol[ci++] = _cA.r * kk * 0.30; finCol[ci++] = _cA.g * kk * 0.30; finCol[ci++] = _cA.b * kk * 0.30;
  }

  finGeo.attributes.position.needsUpdate = true;
  finGeo.attributes.color.needsUpdate    = true;
}

/* =========================================================
   6. 胸鳍（已加密）
   ========================================================= */
const PEC_N = 28;    // 原 16 → 28
const pecPos = new Float32Array(PEC_N * 2 * 3 * 2);
const pecCol = new Float32Array(PEC_N * 2 * 3 * 2);

const pecGeo = new THREE.BufferGeometry();
pecGeo.setAttribute('position', new THREE.BufferAttribute(pecPos, 3));
pecGeo.setAttribute('color',    new THREE.BufferAttribute(pecCol, 3));

const pecLines = new THREE.LineSegments(pecGeo, lineMat);
whale.add(pecLines);

function updatePec(t){
  let vi = 0, ci = 0;

  for (const side of [1, -1]){
    const f = FRAMES[Math.round(0.30 * NSEG)];
    const root = surfacePoint(f, side > 0 ? 0.0 : Math.PI, _pA);

    for (let k = 0; k < PEC_N; k++){
      const ff = k / (PEC_N - 1);
      const ang = -Math.PI * 0.68 + ff * Math.PI * 0.55
                + 0.14 * Math.sin(t * 2.6 + k * 0.6 + side);
      const len = (0.44 + 0.20 * Math.sin(ff * Math.PI))
                * (0.88 + 0.16 * Math.sin(t * 2.2 + side));

      const ex = root.x + Math.cos(ang) * len * 0.35;
      const ey = root.y + Math.sin(ang) * len;
      const ez = root.z + side * len * 0.72;

      pecPos[vi++] = root.x; pecPos[vi++] = root.y; pecPos[vi++] = root.z;
      pecPos[vi++] = ex;     pecPos[vi++] = ey;     pecPos[vi++] = ez;

      colorAt(0.20 + ff * 0.25, _cA);
      const kk = 0.34 + 0.30 * (1 - Math.abs(ff - 0.5) * 2);

      pecCol[ci++] = _cA.r * kk; pecCol[ci++] = _cA.g * kk; pecCol[ci++] = _cA.b * kk;
      pecCol[ci++] = _cA.r * kk * 0.28; pecCol[ci++] = _cA.g * kk * 0.28; pecCol[ci++] = _cA.b * kk * 0.28;
    }
  }

  pecGeo.attributes.position.needsUpdate = true;
  pecGeo.attributes.color.needsUpdate    = true;
}

/* =========================================================
   7. 涡旋拖尾（已加密）
   ========================================================= */
const TRAIL_N = 190;      // 原 110 → 190
const TRAIL_LEN = 5.0;

const trailPosA = new Float32Array(TRAIL_N * 3);
const trailPosB = new Float32Array(TRAIL_N * 3);
const trailColA = new Float32Array(TRAIL_N * 3);
const trailColB = new Float32Array(TRAIL_N * 3);

const trailGeoA = new THREE.BufferGeometry();
trailGeoA.setAttribute('position', new THREE.BufferAttribute(trailPosA, 3));
trailGeoA.setAttribute('color',    new THREE.BufferAttribute(trailColA, 3));

const trailGeoB = new THREE.BufferGeometry();
trailGeoB.setAttribute('position', new THREE.BufferAttribute(trailPosB, 3));
trailGeoB.setAttribute('color',    new THREE.BufferAttribute(trailColB, 3));

const trailMat = new THREE.LineBasicMaterial({
  vertexColors : true,
  transparent  : true,
  opacity      : 0.88,
  blending     : THREE.AdditiveBlending,
  depthWrite   : false,
  depthTest    : false
});

const trailA = new THREE.Line(trailGeoA, trailMat);
const trailB = new THREE.Line(trailGeoB, trailMat);
scene.add(trailA);
scene.add(trailB);

function updateTrail(t){
  const fe = FRAMES[NSEG];
  const tx = fe.px + 0.15;
  const ty = fe.py;

  for (let i = 0; i < TRAIL_N; i++){
    const f = i / (TRAIL_N - 1);
    const x = tx + f * TRAIL_LEN;

    /* 螺距更高：8.5 → 13.5 */
    const ph  = f * 13.5 - t * 3.2;
    const rad = 0.05 + f * 1.05;

    const y1 = ty + Math.sin(ph) * rad;
    const z1 = Math.cos(ph) * rad;
    const y2 = ty - Math.sin(ph) * rad;
    const z2 = -Math.cos(ph) * rad;

    const i3 = i * 3;
    trailPosA[i3] = x; trailPosA[i3 + 1] = y1; trailPosA[i3 + 2] = z1;
    trailPosB[i3] = x; trailPosB[i3 + 1] = y2; trailPosB[i3 + 2] = z2;

    colorAt(f * 0.9 + 0.05, _cA);
    const k = Math.pow(1 - f, 1.5) * 0.82;

    trailColA[i3] = _cA.r * k; trailColA[i3 + 1] = _cA.g * k; trailColA[i3 + 2] = _cA.b * k;
    trailColB[i3] = _cA.b * k; trailColB[i3 + 1] = _cA.g * k; trailColB[i3 + 2] = _cA.r * k;
  }

  trailGeoA.attributes.position.needsUpdate = true;
  trailGeoA.attributes.color.needsUpdate    = true;
  trailGeoB.attributes.position.needsUpdate = true;
  trailGeoB.attributes.color.needsUpdate    = true;
}

/* =========================================================
   8. 拖尾粒子（已加密）
   ========================================================= */
const P_N = 1200;    // 原 620 → 1200

const pPos = new Float32Array(P_N * 3);
const pCol = new Float32Array(P_N * 3);

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));

const pMat = new THREE.PointsMaterial({
  size         : 0.021,
  vertexColors : true,
  transparent  : true,
  opacity      : 0.82,
  blending     : THREE.AdditiveBlending,
  depthWrite   : false,
  depthTest    : false,
  sizeAttenuation : true
});

const pPoints = new THREE.Points(pGeo, pMat);
scene.add(pPoints);

const pOff = new Float32Array(P_N);
for (let i = 0; i < P_N; i++) pOff[i] = Math.random();

function updateParticles(t){
  const fe = FRAMES[NSEG];
  const tx = fe.px + 0.10;
  const ty = fe.py;

  for (let i = 0; i < P_N; i++){
    const o = pOff[i];
    const f = (t * 0.30 + o) % 1;

    const x = tx + f * 5.6;

    const ph  = f * 15.0 + o * 42.0;
    const rad = 0.05 + f * 1.45;

    const spiral = (o < 0.5) ? 1 : -1;
    const y = ty + Math.sin(ph) * rad * spiral + (Math.sin(o * 91.7) * 0.14 * f);
    const z = Math.cos(ph) * rad * spiral + (Math.cos(o * 57.3) * 0.14 * f);

    const i3 = i * 3;
    pPos[i3] = x; pPos[i3 + 1] = y; pPos[i3 + 2] = z;

    colorAt(f * 0.85 + 0.08, _cA);

    const env = Math.sin(Math.PI * f);
    const k = env * env * 0.80;

    pCol[i3] = _cA.r * k; pCol[i3 + 1] = _cA.g * k; pCol[i3 + 2] = _cA.b * k;
  }

  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate    = true;
}

/* =========================================================
   9. 背景流线（已加密）
   ========================================================= */
const FLOW_N = 84;      // 原 48 → 84
const FLOW_SEG = 3;     // 原 2 → 3

const flowPos = new Float32Array(FLOW_N * FLOW_SEG * 2 * 3);
const flowCol = new Float32Array(FLOW_N * FLOW_SEG * 2 * 3);

const flowGeo = new THREE.BufferGeometry();
flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3));
flowGeo.setAttribute('color',    new THREE.BufferAttribute(flowCol, 3));

const flowMat = new THREE.LineBasicMaterial({
  vertexColors : true,
  transparent  : true,
  opacity      : 0.42,
  blending     : THREE.AdditiveBlending,
  depthWrite   : false,
  depthTest    : false
});

const flowLines = new THREE.LineSegments(flowGeo, flowMat);
scene.add(flowLines);

const flowSeed = [];
for (let i = 0; i < FLOW_N; i++){
  flowSeed.push({
    y : (Math.random() - 0.5) * 5.2,
    z : (Math.random() - 0.5) * 2.6,
    o : Math.random(),
    sp: 0.28 + Math.random() * 0.55
  });
}

function updateFlow(t){
  let vi = 0, ci = 0;

  for (let i = 0; i < FLOW_N; i++){
    const d = flowSeed[i];

    const span = 12.0;
    const x0 = ((t * d.sp + d.o * span) % span) - span * 0.5;
    const len = 0.55 + 0.45 * Math.sin(t * 0.9 + i * 1.3);

    for (let k = 0; k < FLOW_SEG; k++){
      const xA = x0 + k * len;
      const xB = xA + len * 0.92;

      flowPos[vi++] = xA; flowPos[vi++] = d.y; flowPos[vi++] = d.z;
      flowPos[vi++] = xB; flowPos[vi++] = d.y; flowPos[vi++] = d.z;

      const envA = 1 - Math.abs(xA / (span * 0.5));
      const envB = 1 - Math.abs(xB / (span * 0.5));

      const aA = Math.max(0, envA) * 0.18;
      const aB = Math.max(0, envB) * 0.18;

      colorAt(0.18 + d.o * 0.3, _cA);

      flowCol[ci++] = _cA.r * aA; flowCol[ci++] = _cA.g * aA; flowCol[ci++] = _cA.b * aA;
      flowCol[ci++] = _cA.r * aB; flowCol[ci++] = _cA.g * aB; flowCol[ci++] = _cA.b * aB;
    }
  }

  flowGeo.attributes.position.needsUpdate = true;
  flowGeo.attributes.color.needsUpdate    = true;
}

/* =========================================================
   10. 主循环
   ========================================================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  whale.position.y = Math.sin(t * 0.95) * 0.030;
  whale.rotation.z = Math.sin(t * 0.70) * 0.030;
  whale.rotation.y = Math.sin(t * 0.42) * 0.055;

  updateBody(t);
  updateGears(t);
  updateFin(t);
  updatePec(t);
  updateTrail(t);
  updateParticles(t);
  updateFlow(t);

  renderer.render(scene, camera);
}

/* =========================================================
   11. 启动
   ========================================================= */
fitCamera();
animate();

})();
</script>
