<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>散度与旋度 · 向量场可视化</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:28px 36px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,190,255,.36);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(18px,2.5vw,30px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 38%,#c090ff 72%,#ffd080 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(11px,1.4vw,14px);
    letter-spacing:.14em;
    color:rgba(200,220,255,.60);
  }
  #title .formula .hl1{color:#5ee0ff;}
  #title .formula .hl2{color:#c090ff;}

  #modePanel{
    position:absolute;top:0;right:0;
    padding:28px 36px;text-align:right;
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #modePanel .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.28);margin-bottom:8px;
  }
  #modePanel .bigv{
    font-size:clamp(20px,2.4vw,28px);
    font-weight:200;letter-spacing:.24em;
    color:rgba(200,230,255,.92);
    line-height:1;margin-bottom:5px;
    filter:drop-shadow(0 0 14px rgba(140,200,255,.42));
    transition:color .8s;
  }
  #modePanel .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.28em;
    color:rgba(160,195,240,.42);
    margin-bottom:16px;
  }
  .bar-row{
    display:flex;align-items:center;gap:10px;
    justify-content:flex-end;
    margin-bottom:6px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;
  }
  .bar-row .nm{color:rgba(190,205,255,.54);min-width:44px;text-align:right;}
  .bar-row .bar{
    width:88px;height:3px;
    background:rgba(120,155,240,.16);
    border-radius:2px;overflow:hidden;
    position:relative;
  }
  .bar-row .bar-fill{
    position:absolute;left:0;top:0;height:100%;
    width:0%;
    border-radius:2px;
    transition:width .25s ease;
  }
  .bar-row.src .bar-fill{background:linear-gradient(90deg,#ff9a55,#ffb080);box-shadow:0 0 8px rgba(255,150,80,.65);}
  .bar-row.sink .bar-fill{background:linear-gradient(90deg,#5ea8ff,#8ac8ff);box-shadow:0 0 8px rgba(100,180,255,.65);}
  .bar-row.swl .bar-fill{background:linear-gradient(90deg,#c090ff,#e0b8ff);box-shadow:0 0 8px rgba(190,140,255,.65);}
  .bar-row .val{color:rgba(255,220,170,.88);min-width:32px;font-weight:600;}

  #legend{
    position:absolute;bottom:0;left:0;
    padding:0 36px 30px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;line-height:2.0;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #legend .item{
    display:flex;align-items:center;gap:9px;
    color:rgba(190,205,255,.48);
  }
  #legend .sw{
    width:16px;height:3px;border-radius:2px;
  }

  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 36px 30px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:14px 16px;}
    #title .formula{font-size:10px;}
    #modePanel{padding:14px 16px;}
    #modePanel .bigv{font-size:18px;}
    #modePanel .bar-row{font-size:8.5px;}
    #modePanel .bar-row .bar{width:60px;}
    #legend{padding:0 16px 16px;font-size:8.5px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">DIVERGENCE · CURL</div>
    <h1>散度与旋度</h1>
    <div class="formula">
      <span class="hl1">∇·F</span> &nbsp;·&nbsp; <span class="hl2">∇×F</span>
    </div>
  </div>

  <div id="modePanel">
    <span class="lab">CURRENT FIELD</span>
    <div class="bigv" id="modeName">源 · 汇</div>
    <div class="sub" id="modeSub">SOURCE · SINK</div>

    <div class="bar-row src">
      <span class="nm">源</span>
      <div class="bar"><div class="bar-fill" id="barSrc"></div></div>
      <span class="val" id="valSrc">1.0</span>
    </div>
    <div class="bar-row sink">
      <span class="nm">汇</span>
      <div class="bar"><div class="bar-fill" id="barSink"></div></div>
      <span class="val" id="valSink">1.0</span>
    </div>
    <div class="bar-row swl">
      <span class="nm">涡</span>
      <div class="bar"><div class="bar-fill" id="barSwl"></div></div>
      <span class="val" id="valSwl">0.0</span>
    </div>
  </div>

  <div id="legend">
    <div class="item">
      <span class="sw" style="background:linear-gradient(90deg,#ff9a55,#ffb080)"></span>
      <span>正散度（源 · 发散）</span>
    </div>
    <div class="item">
      <span class="sw" style="background:linear-gradient(90deg,#5ea8ff,#8ac8ff)"></span>
      <span>负散度（汇 · 收敛）</span>
    </div>
    <div class="item">
      <span class="sw" style="background:linear-gradient(90deg,#c090ff,#e0b8ff)"></span>
      <span>非零旋度（旋涡）</span>
    </div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>流动声 · 漩涡音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   画布
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, SCALE = 100;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.5;
  SCALE = Math.min(W, H) * 0.40;

  buildSprites();
  buildArrows();
}
window.addEventListener('resize', resize);

function worldToScreen(x, y){
  return { px: CX + x * SCALE, py: CY - y * SCALE };
}
function screenToWorld(px, py){
  return { x: (px - CX) / SCALE, y: (CY - py) / SCALE };
}

/* =========================================================
   场：三组基本场叠加
   ========================================================= */
const POS = {
  src: { x: -0.55, y:  0.26 },
  sink: { x: 0.55, y: -0.26 },
  swl: { x: 0.02, y:  0.04 }
};

const SOFT = 0.058;   // 软化半径，避免奇点

const state = {
  t: 0,
  modeIdx: 0,
  modeTime: 0,
  weights: { src: 1.0, sink: 1.0, swl: 0.0 },
  target: { src: 1.0, sink: 1.0, swl: 0.0 }
};

const MODES = [
  { name: '源 · 汇', sub: 'SOURCE · SINK', target: { src: 1.0, sink: 1.0, swl: 0.0 } },
  { name: '旋 涡', sub: 'PURE VORTEX',    target: { src: 0.0, sink: 0.0, swl: 1.0 } },
  { name: '源 + 涡', sub: 'COMBINED FIELD', target: { src: 0.75, sink: 0.45, swl: 0.70 } }
];

const MODE_DUR = 8.5;

/* 场函数：返回归一化坐标下的向量 */
function getField(x, y){
  let vx = 0, vy = 0;
  const w = state.weights;

  /* 源（径向流出） */
  if (w.src > 0.001){
    const dx = x - POS.src.x;
    const dy = y - POS.src.y;
    const r2 = dx*dx + dy*dy + SOFT*SOFT;
    const k = w.src * 0.045 / r2;
    vx += dx * k;
    vy += dy * k;
  }

  /* 汇（径向流入） */
  if (w.sink > 0.001){
    const dx = x - POS.sink.x;
    const dy = y - POS.sink.y;
    const r2 = dx*dx + dy*dy + SOFT*SOFT;
    const k = -w.sink * 0.045 / r2;
    vx += dx * k;
    vy += dy * k;
  }

  /* 旋涡（切向旋转） */
  if (w.swl > 0.001){
    const dx = x - POS.swl.x;
    const dy = y - POS.swl.y;
    const r2 = dx*dx + dy*dy + SOFT*SOFT;
    const k = w.swl * 0.045 / r2;
    vx += -dy * k;
    vy +=  dx * k;
  }

  return { vx: vx, vy: vy };
}

/* =========================================================
   粒子
   ========================================================= */
const PARTICLE_COUNT = 320;
const particles = [];

function initParticles(){
  particles.length = 0;
  for (let i = 0; i < PARTICLE_COUNT; i++){
    particles.push({
      x: Math.random() * 2.4 - 1.2,
      y: Math.random() * 1.6 - 0.8,
      age: Math.random() * 5,
      maxAge: 3 + Math.random() * 5,
      size: 0.7 + Math.random() * 0.9,
      hue: 195 + Math.random() * 40,
      trail: []
    });
  }
}

function respawnParticle(p){
  const w = state.weights;

  if (w.src > 0.3){
    /* 从源附近喷出 */
    const a = Math.random() * Math.PI * 2;
    const r = 0.04 + Math.random() * 0.06;
    p.x = POS.src.x + Math.cos(a) * r;
    p.y = POS.src.y + Math.sin(a) * r;
  } else if (w.swl > 0.5){
    /* 旋涡模式：均匀分布在环上 */
    const a = Math.random() * Math.PI * 2;
    const r = 0.15 + Math.random() * 0.35;
    p.x = POS.swl.x + Math.cos(a) * r;
    p.y = POS.swl.y + Math.sin(a) * r;
  } else {
    p.x = Math.random() * 2.4 - 1.2;
    p.y = Math.random() * 1.6 - 0.8;
  }

  p.age = 0;
  p.maxAge = 3 + Math.random() * 5;
  p.trail.length = 0;
}

function updateParticles(dt){
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const f = getField(p.x, p.y);

    /* 限制速度，避免飞出去 */
    let sp = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
    const MAXSP = 1.6;
    let fx = f.vx, fy = f.vy;
    if (sp > MAXSP){
      fx = fx / sp * MAXSP;
      fy = fy / sp * MAXSP;
    }

    p.x += fx * dt;
    p.y += fy * dt;
    p.age += dt;

    /* 记录拖尾 */
    if (p.trail.length === 0 ||
        Math.hypot(p.x - p.trail[p.trail.length-1].x,
                   p.y - p.trail[p.trail.length-1].y) > 0.008){
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 10) p.trail.shift();
    }

    /* 重生条件 */
    const dSinkX = p.x - POS.sink.x;
    const dSinkY = p.y - POS.sink.y;
    const dSink = Math.sqrt(dSinkX*dSinkX + dSinkY*dSinkY);

    if (dSink < 0.05 ||
        Math.abs(p.x) > 1.5 || Math.abs(p.y) > 1.0 ||
        p.age > p.maxAge){
      respawnParticle(p);
    }
  }
}

/* =========================================================
   精灵
   ========================================================= */
const particleSprite = document.createElement('canvas');

function buildSprites(){
  const SZ = 48;
  particleSprite.width = SZ;
  particleSprite.height = SZ;
  const g = particleSprite.getContext('2d');

  const grad = g.createRadialGradient(SZ/2, SZ/2, 0, SZ/2, SZ/2, SZ/2);
  grad.addColorStop(0.00, 'rgba(240, 250, 255, 1)');
  grad.addColorStop(0.18, 'rgba(140, 220, 255, 0.9)');
  grad.addColorStop(0.45, 'rgba(90, 180, 255, 0.35)');
  grad.addColorStop(0.75, 'rgba(70, 140, 255, 0.08)');
  grad.addColorStop(1.00, 'rgba(50, 110, 240, 0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, SZ, SZ);
}

/* =========================================================
   背景：散度与旋度的颜色场
   ========================================================= */
const BG_SIZE = 80;
const bgCanvas = document.createElement('canvas');
bgCanvas.width = bgCanvas.height = BG_SIZE;
const bgCtx = bgCanvas.getContext('2d');
const bgImage = bgCtx.createImageData(BG_SIZE, BG_SIZE);

function updateBackground(){
  const data = bgImage.data;
  const eps = 0.018;

  for (let j = 0; j < BG_SIZE; j++){
    for (let i = 0; i < BG_SIZE; i++){
      const u = (i + 0.5) / BG_SIZE;
      const v = (j + 0.5) / BG_SIZE;

      /* 屏幕 → 归一化坐标 */
      const wx = (u - 0.5) * W / SCALE;
      const wy = (0.5 - v) * H / SCALE;

      /* 有限差分 */
      const f0 = getField(wx, wy);
      const fX = getField(wx + eps, wy);
      const fY = getField(wx, wy + eps);

      const div  = (fX.vx - f0.vx) / eps + (fY.vy - f0.vy) / eps;
      const curl = (fX.vy - f0.vy) / eps - (fY.vx - f0.vx) / eps;

      /* 基础深色 */
      let r = 4, g = 6, b = 16;

      /* 散度：正 → 暖橙，负 → 冷蓝 */
      const dVal = div * 0.5;
      if (dVal > 0){
        const t = Math.min(1, dVal);
        r += t * 130;
        g += t * 52;
        b += t * 14;
      } else if (dVal < 0){
        const t = Math.min(1, -dVal);
        r += t * 14;
        g += t * 72;
        b += t * 140;
      }

      /* 旋度：正 → 紫，负 → 青绿 */
      const cVal = curl * 0.5;
      if (cVal > 0){
        const t = Math.min(1, cVal);
        r += t * 80;
        g += t * 32;
        b += t * 130;
      } else if (cVal < 0){
        const t = Math.min(1, -cVal);
        r += t * 14;
        g += t * 110;
        b += t * 100;
      }

      const idx = (j * BG_SIZE + i) * 4;
      data[idx]     = Math.min(255, r);
      data[idx + 1] = Math.min(255, g);
      data[idx + 2] = Math.min(255, b);
      data[idx + 3] = 255;
    }
  }

  bgCtx.putImageData(bgImage, 0, 0);
}

/* =========================================================
   箭头网格
   ========================================================= */
let arrows = [];

function buildArrows(){
  arrows.length = 0;
  const spacing = Math.max(52, Math.min(W, H) * 0.075);
  const cols = Math.ceil(W / spacing) + 2;
  const rows = Math.ceil(H / spacing) + 2;
  const offX = (W - (cols - 1) * spacing) * 0.5;
  const offY = (H - (rows - 1) * spacing) * 0.5;

  for (let j = 0; j < rows; j++){
    for (let i = 0; i < cols; i++){
      const px = offX + i * spacing;
      const py = offY + j * spacing;
      arrows.push({ px: px, py: py });
    }
  }
}

function drawArrowHead(x, y, angle, size, color, alpha){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(size, 0);
  ctx.lineTo(-size * 0.4, -size * 0.55);
  ctx.lineTo(-size * 0.4, size * 0.55);
  ctx.closePath();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawArrows(){
  const arrowLen = Math.max(10, Math.min(W, H) * 0.032);

  for (let i = 0; i < arrows.length; i++){
    const a = arrows[i];
    const w = screenToWorld(a.px, a.py);
    const f = getField(w.x, w.y);

    const mag = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
    if (mag < 1e-5) continue;

    /* 方向 */
    const dirX = f.vx / mag;
    const dirY = -f.vy / mag;   /* 屏幕 y 轴向下 */

    /* 显示长度：随场强增大，但有上限 */
    const displayLen = arrowLen * Math.min(1.5, 0.35 + mag * 0.85);
    const endX = a.px + dirX * displayLen;
    const endY = a.py + dirY * displayLen;

    /* 透明度随场强 */
    const alpha = Math.min(0.42, 0.06 + mag * 0.55);

    /* 颜色：靠近源暖色，靠近汇冷色，旋涡紫，其它青 */
    let hue = 195;
    let sat = 76;
    let light = 62;

    /* 根据场强的影响权重决定颜色 */
    const sDist = Math.hypot(w.x - POS.src.x, w.y - POS.src.y);
    const kDist = Math.hypot(w.x - POS.sink.x, w.y - POS.sink.y);
    const vDist = Math.hypot(w.x - POS.swl.x, w.y - POS.swl.y);

    const wSrc = state.weights.src * Math.exp(-sDist * 3.2);
    const wSink = state.weights.sink * Math.exp(-kDist * 3.2);
    const wSwl = state.weights.swl * Math.exp(-vDist * 3.2);
    const wTotal = wSrc + wSink + wSwl + 0.001;

    /* 混合色相：源=25，汇=215，涡=275 */
    hue = (wSrc * 25 + wSink * 215 + wSwl * 275 + 0.001 * 195) / wTotal;
    sat = 72 + Math.min(20, mag * 80);

    ctx.strokeStyle = 'hsla(' + hue.toFixed(0) + ',' + sat.toFixed(0) + '%,' + light + '%,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 0.9 + Math.min(1.4, mag * 1.5);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a.px, a.py);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    /* 箭头头部 */
    if (mag > 0.04){
      const angle = Math.atan2(dirY, dirX);
      drawArrowHead(
        endX, endY,
        angle,
        arrowLen * 0.30,
        'hsl(' + hue.toFixed(0) + ',' + sat.toFixed(0) + '%,' + light + '%)',
        alpha * 1.2
      );
    }
  }
}

/* =========================================================
   绘制粒子
   ========================================================= */
function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';

  /* 轨迹 */
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const n = p.trail.length;
    if (n < 2) continue;

    const head = worldToScreen(p.x, p.y);

    for (let k = 1; k < n; k++){
      const a0 = worldToScreen(p.trail[k-1].x, p.trail[k-1].y);
      const a1 = worldToScreen(p.trail[k].x, p.trail[k].y);

      const u = k / n;
      const alpha = u * u * 0.42;
      if (alpha < 0.02) continue;

      ctx.strokeStyle = 'hsla(' + p.hue + ',100%,' + (62 + u * 20) + '%,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = u * 1.6 + 0.25;
      ctx.beginPath();
      ctx.moveTo(a0.px, a0.py);
      ctx.lineTo(a1.px, a1.py);
      ctx.stroke();
    }
  }

  /* 粒子核心光点 */
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const s = worldToScreen(p.x, p.y);
    const sz = p.size * Math.max(7, Math.min(W, H) * 0.016);

    ctx.globalAlpha = 0.72;
    ctx.drawImage(particleSprite, s.px - sz * 0.5, s.py - sz * 0.5, sz, sz);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制源 / 汇 / 旋涡标记
   ========================================================= */
function drawSource(t){
  if (state.weights.src < 0.03) return;
  const w = POS.src;
  const s = worldToScreen(w.x, w.y);
  const a = state.weights.src;
  const baseR = SCALE * 0.045 * a;
  const pulse = 1 + 0.30 * Math.sin(t * 3.4);

  ctx.globalCompositeOperation = 'lighter';

  /* 光晕 */
  const g = ctx.createRadialGradient(s.px, s.py, 0, s.px, s.py, baseR * 6 * pulse);
  g.addColorStop(0.00, 'rgba(255, 220, 160, ' + (0.85 * a) + ')');
  g.addColorStop(0.22, 'rgba(255, 160, 90, ' + (0.42 * a) + ')');
  g.addColorStop(0.55, 'rgba(255, 120, 60, ' + (0.12 * a) + ')');
  g.addColorStop(1.00, 'rgba(200, 80, 40, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.px, s.py, baseR * 6 * pulse, 0, Math.PI * 2);
  ctx.fill();

  /* 外扩脉冲环 */
  for (let k = 0; k < 3; k++){
    const age = ((t * 0.55 + k / 3) % 1);
    const ringR = baseR * (1 + age * 5.5);
    const ringA = (1 - age) * (1 - age) * 0.65 * a;

    if (ringA < 0.02) continue;
    ctx.beginPath();
    ctx.arc(s.px, s.py, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 190, 120, ' + ringA + ')';
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  /* 核心 */
  ctx.beginPath();
  ctx.arc(s.px, s.py, baseR * 0.72, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 245, 220, ' + (0.92 * a) + ')';
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';

  /* 标签 */
  ctx.font = '500 11px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255, 220, 160, ' + (0.72 * a) + ')';
  ctx.fillText('源', s.px, s.py - baseR * 3.2);
}

function drawSink(t){
  if (state.weights.sink < 0.03) return;
  const w = POS.sink;
  const s = worldToScreen(w.x, w.y);
  const a = state.weights.sink;
  const baseR = SCALE * 0.045 * a;
  const pulse = 1 + 0.22 * Math.sin(t * 2.8 + 1);

  ctx.globalCompositeOperation = 'lighter';

  const g = ctx.createRadialGradient(s.px, s.py, 0, s.px, s.py, baseR * 6 * pulse);
  g.addColorStop(0.00, 'rgba(180, 230, 255, ' + (0.70 * a) + ')');
  g.addColorStop(0.22, 'rgba(90, 170, 255, ' + (0.36 * a) + ')');
  g.addColorStop(0.55, 'rgba(60, 130, 240, ' + (0.10 * a) + ')');
  g.addColorStop(1.00, 'rgba(40, 90, 200, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.px, s.py, baseR * 6 * pulse, 0, Math.PI * 2);
  ctx.fill();

  /* 向内收缩的环 */
  for (let k = 0; k < 3; k++){
    const age = ((t * 0.65 + k / 3) % 1);
    const ringR = baseR * (5.5 - age * 4.5);
    const ringA = age * age * 0.65 * a;

    if (ringA < 0.02) continue;
    ctx.beginPath();
    ctx.arc(s.px, s.py, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(140, 210, 255, ' + ringA + ')';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  /* 中心暗核 */
  ctx.beginPath();
  ctx.arc(s.px, s.py, baseR * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(15, 30, 70, ' + (0.85 * a) + ')';
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';

  ctx.font = '500 11px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(140, 210, 255, ' + (0.72 * a) + ')';
  ctx.fillText('汇', s.px, s.py - baseR * 3.2);
}

function drawSwirl(t){
  if (state.weights.swl < 0.03) return;
  const w = POS.swl;
  const s = worldToScreen(w.x, w.y);
  const a = state.weights.swl;
  const baseR = SCALE * 0.055 * a;

  ctx.globalCompositeOperation = 'lighter';

  /* 中心光晕 */
  const g = ctx.createRadialGradient(s.px, s.py, 0, s.px, s.py, baseR * 5);
  g.addColorStop(0.00, 'rgba(220, 180, 255, ' + (0.62 * a) + ')');
  g.addColorStop(0.32, 'rgba(170, 130, 255, ' + (0.28 * a) + ')');
  g.addColorStop(1.00, 'rgba(130, 90, 240, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.px, s.py, baseR * 5, 0, Math.PI * 2);
  ctx.fill();

  /* 旋转的弧线 */
  const ROT = t * 1.3;
  for (let k = 0; k < 4; k++){
    const phase = ROT + k * (Math.PI * 2 / 4);
    const rr = baseR * (1.6 + k * 0.35);

    ctx.beginPath();
    ctx.arc(
      s.px, s.py,
      rr,
      phase,
      phase + 1.3
    );
    ctx.strokeStyle = 'hsla(276, 92%, 78%, ' + (0.62 * a) + ')';
    ctx.lineWidth = 2.0;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  /* 中心点 */
  ctx.beginPath();
  ctx.arc(s.px, s.py, baseR * 0.32, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(240, 220, 255, ' + (0.92 * a) + ')';
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';

  ctx.font = '500 11px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(220, 180, 255, ' + (0.72 * a) + ')';
  ctx.fillText('涡', s.px, s.py - baseR * 3.8);
}

/* =========================================================
   暗角
   ========================================================= */
function drawVignette(){
  const g = ctx.createRadialGradient(
    CX, CY, Math.min(W, H) * 0.32,
    CX, CY, Math.max(W, H) * 0.85
  );
  g.addColorStop(0.00, 'rgba(0,0,0,0)');
  g.addColorStop(0.60, 'rgba(2, 4, 10, 0.28)');
  g.addColorStop(1.00, 'rgba(0, 1, 4, 0.92)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let flowSrc = null, flowFilter = null, flowGain = null;
let swirlOsc = null, swirlGain = null, swirlVibGain = null;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.48, ac.currentTime, 1.8);

  /* 流动声：带通白噪 */
  const bufLen = ac.sampleRate * 4;
  const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;

  flowSrc = ac.createBufferSource();
  flowSrc.buffer = buf;
  flowSrc.loop = true;

  flowFilter = ac.createBiquadFilter();
  flowFilter.type = 'bandpass';
  flowFilter.frequency.value = 520;
  flowFilter.Q.value = 1.4;

  flowGain = ac.createGain();
  flowGain.gain.value = 0.024;

  flowSrc.connect(flowFilter);
  flowFilter.connect(flowGain);
  flowGain.connect(master);
  flowSrc.start();

  /* 流动调制 LFO */
  const lfo1 = ac.createOscillator();
  lfo1.frequency.value = 0.13;
  const lfo1g = ac.createGain();
  lfo1g.gain.value = 0.012;
  lfo1.connect(lfo1g);
  lfo1g.connect(flowGain.gain);
  lfo1.start();

  const lfo2 = ac.createOscillator();
  lfo2.frequency.value = 0.08;
  const lfo2g = ac.createGain();
  lfo2g.gain.value = 260;
  lfo2.connect(lfo2g);
  lfo2g.connect(flowFilter.frequency);
  lfo2.start();

  /* 漩涡音：锯齿波 + 滤波 */
  swirlOsc = ac.createOscillator();
  swirlOsc.type = 'sawtooth';
  swirlOsc.frequency.value = 180;

  const swirlFilter = ac.createBiquadFilter();
  swirlFilter.type = 'lowpass';
  swirlFilter.frequency.value = 520;
  swirlFilter.Q.value = 4.0;

  swirlGain = ac.createGain();
  swirlGain.gain.value = 0;

  /* 漩涡颤音 */
  const vib = ac.createOscillator();
  vib.frequency.value = 8.4;
  swirlVibGain = ac.createGain();
  swirlVibGain.gain.value = 6;
  vib.connect(swirlVibGain);
  swirlVibGain.connect(swirlOsc.frequency);
  vib.start();

  swirlOsc.connect(swirlFilter);
  swirlFilter.connect(swirlGain);
  swirlGain.connect(master);
  swirlOsc.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

function updateAudio(){
  if (!ac || !master || ac.state !== 'running') return;
  const t = ac.currentTime;
  const w = state.weights;

  /* 流动声：源或汇越强，噪声越明显 */
  const flowLevel = 0.018 + (w.src + w.sink) * 0.014;
  flowGain.gain.setTargetAtTime(flowLevel, t, 0.3);
  flowFilter.frequency.setTargetAtTime(420 + (w.src + w.sink) * 260, t, 0.4);

  /* 漩涡音：音高与音量随旋涡强度 */
  const swirlFreq = 130 + w.swl * 180;
  swirlOsc.frequency.setTargetAtTime(swirlFreq, t, 0.25);
  swirlGain.gain.setTargetAtTime(w.swl * 0.026, t, 0.25);
  swirlVibGain.gain.setTargetAtTime(4 + w.swl * 14, t, 0.25);
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;
let bgTick = 0;

function update(dt){
  state.t += dt;
  state.modeTime += dt;

  /* 模式切换 */
  if (state.modeTime >= MODE_DUR){
    state.modeTime = 0;
    state.modeIdx = (state.modeIdx + 1) % MODES.length;
    updateModeUI();
  }

  /* 平滑逼近目标权重 */
  const target = MODES[state.modeIdx].target;
  const k = 1 - Math.exp(-dt / 1.3);
  state.weights.src  += (target.src  - state.weights.src)  * k;
  state.weights.sink += (target.sink - state.weights.sink) * k;
  state.weights.swl  += (target.swl  - state.weights.swl)  * k;

  /* 更新粒子 */
  updateParticles(dt);

  /* 更新音频 */
  updateAudio();
}

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  update(dt);

  /* 背景：每 2 帧更新一次，节约性能 */
  bgTick++;
  if (bgTick % 2 === 0){
    updateBackground();
  }

  /* 渲染 */
  ctx.fillStyle = '#02040a';
  ctx.fillRect(0, 0, W, H);

  /* 背景颜色场（平滑放大） */
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha = 1.0;
  ctx.drawImage(bgCanvas, 0, 0, W, H);

  /* 向量场箭头 */
  drawArrows();

  /* 流动粒子 */
  drawParticles();

  /* 标记 */
  drawSource(t);
  drawSink(t);
  drawSwirl(t);

  /* 暗角 */
  drawVignette();

  /* 更新 UI */
  updateBars();
}

/* =========================================================
   UI 更新
   ========================================================= */
let lastModeIdx = -1;

function updateModeUI(){
  const m = MODES[state.modeIdx];
  const el1 = document.getElementById('modeName');
  const el2 = document.getElementById('modeSub');
  if (el1) el1.textContent = m.name;
  if (el2) el2.textContent = m.sub;
  lastModeIdx = state.modeIdx;
}

function updateBars(){
  const w = state.weights;

  const bs = document.getElementById('barSrc');
  const bk = document.getElementById('barSink');
  const bv = document.getElementById('barSwl');
  const vs = document.getElementById('valSrc');
  const vk = document.getElementById('valSink');
  const vv = document.getElementById('valSwl');

  if (bs) bs.style.width = (w.src * 100).toFixed(0) + '%';
  if (bk) bk.style.width = (w.sink * 100).toFixed(0) + '%';
  if (bv) bv.style.width = (w.swl * 100).toFixed(0) + '%';

  if (vs) vs.textContent = w.src.toFixed(1);
  if (vk) vk.textContent = w.sink.toFixed(1);
  if (vv) vv.textContent = w.swl.toFixed(1);
}

/* =========================================================
   交互
   ========================================================= */
window.addEventListener('pointerdown', function(){
  initAudio();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    state.modeTime = MODE_DUR;   /* 立即切到下一模式 */
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
initParticles();
updateModeUI();
requestAnimationFrame(loop);

})();
</script>
