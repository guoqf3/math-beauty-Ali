<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>量子纠缠 · 双粒子之舞</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#04020a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{
    display:block;position:fixed;inset:0;
    cursor:grab;touch-action:none;
  }
  canvas:active{cursor:grabbing;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:38px 44px;opacity:0;
    animation:fade 1.8s 0.3s ease forwards;
  }
  #title .en{
    font-size:9.5px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(180,140,255,.36);font-weight:300;margin-bottom:14px;
  }
  #title h1{
    font-size:clamp(22px,3.2vw,42px);
    font-weight:200;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(96deg,#4af0ff 0%,#7ab8ff 34%,#d090ff 68%,#ff90e0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 32px rgba(130,140,255,.48));
  }
  #title .sub{
    font-size:11px;letter-spacing:.22em;line-height:2.0;
    color:rgba(180,195,245,.34);font-weight:300;
  }

  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 44px 38px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(170,180,240,.30);
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
  }
  #stats .k{color:rgba(200,180,255,.52);}
  #stats .v{color:rgba(255,215,150,.76);}
  #stats .lab{
    display:block;font-size:8.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(160,140,230,.26);margin-bottom:8px;
  }

  #meter{
    position:absolute;bottom:0;right:0;
    padding:0 44px 38px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(170,180,240,.30);
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  #meter .big{
    display:block;font-size:clamp(20px,2.4vw,30px);
    font-weight:200;letter-spacing:.22em;
    color:rgba(200,220,255,.88);
    margin-bottom:2px;
    transition:color .6s ease;
  }
  #meter .en{
    font-size:9px;letter-spacing:.38em;text-indent:.38em;
    color:rgba(180,200,255,.42);
  }
  #audioDot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:rgba(200,180,255,.22);
    margin-left:6px;vertical-align:middle;
    transition:background .4s;
  }
  #audioDot.on{
    background:rgba(150,240,180,.9);
    box-shadow:0 0 8px rgba(150,240,180,.8);
  }

  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:42px;white-space:nowrap;
    font-size:10px;letter-spacing:.28em;
    color:rgba(180,195,245,.44);
    opacity:0;animation:fade 1.8s 1.8s ease forwards;
  }
  #hint .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:rgba(200,150,255,.9);vertical-align:middle;
    margin:0 8px;position:relative;top:-1px;
    animation:pulse 2.0s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.35;transform:scale(1);}
    50%{opacity:1;transform:scale(1.5);}
  }
  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:22px 22px;}
    #title .sub{font-size:9.5px;}
    #stats{padding:0 22px 22px;font-size:8.5px;}
    #meter{padding:0 22px 22px;font-size:8.5px;}
    #hint{padding-bottom:22px;font-size:8.5px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">QUANTUM ENTANGLEMENT · DUAL DANCE</div>
    <h1>双粒子之舞</h1>
    <div class="sub">
      纠缠对 · 超距同步<br>
      拖动任一粒子 · 另一个瞬间响应
    </div>
  </div>

  <div id="stats">
    <span class="lab">ENTANGLED STATE</span>
    <div><span class="k">|ψ⟩ = (|↑↓⟩ − |↓↑⟩)/√2</span></div>
    <div><span class="k">相干性 </span><span class="v" id="cohVal">0.94</span></div>
    <div><span class="k">相位差 </span><span class="v" id="phaseVal">π</span></div>
    <div><span class="k">纠缠度 </span><span class="v" id="entVal">1.00</span></div>
    <div style="margin-top:4px;"><span class="k">音频 </span><span class="v">神秘 + 闪烁</span><span id="audioDot"></span></div>
  </div>

  <div id="meter">
    <span class="big" id="stateBig">缠 绕</span>
    <div class="en" id="stateEn">ENTANGLED</div>
  </div>

  <div id="hint">
    <span class="dot"></span>拖动粒子 · 感受超距同步<span class="dot"></span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   画布
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let cx = 0, cy = 0, maxDim = 0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  cx = W * 0.5;
  cy = H * 0.5;
  maxDim = Math.max(W, H);

  state.radius = Math.min(W, H) * 0.26;
  state.centerX = cx;
  state.centerY = cy;
}
window.addEventListener('resize', resize);

/* =========================================================
   状态
   ========================================================= */
const state = {
  t: 0,
  theta: 0.6,
  radius: 180,
  centerX: 0,
  centerY: 0,

  /* 实际位置 */
  ax: 0, ay: 0,
  bx: 0, by: 0,

  /* 拖拽 */
  dragging: null,       // 'A' | 'B' | null
  targetX: 0, targetY: 0,

  /* 平滑量 */
  dragGlow: 0,
  coherence: 0.94,
  flash: 0,

  /* 粒子自旋相位（用于显示反向） */
  spinA: 0,
  spinB: Math.PI
};

/* =========================================================
   位置更新
   ========================================================= */
function updatePositions(dt){
  state.t += dt;

  /* 自然旋转 */
  if (!state.dragging){
    state.theta += dt * 0.32;
  }

  /* 中心极缓慢漂移 */
  const dcx = cx + Math.sin(state.t * 0.21) * Math.min(W, H) * 0.025;
  const dcy = cy + Math.cos(state.t * 0.27) * Math.min(W, H) * 0.025;

  if (state.dragging === 'A'){
    /* 限制拖拽距离 */
    let tx = state.targetX;
    let ty = state.targetY;
    const dx = tx - dcy * 0;
    /* 不用 dr 变量了，直接用中心约束 */
    const ddx = tx - dcy * 0; // 占位
    const rx = tx - cx;
    const ry = ty - cy;
    const rdist = Math.hypot(rx, ry);
    const rmax = Math.min(W, H) * 0.42;
    if (rdist > rmax){
      tx = cx + rx / rdist * rmax;
      ty = cy + ry / rdist * rmax;
    }

    state.ax = tx;
    state.ay = ty;
    /* 瞬间镜像 */
    state.bx = 2 * dcy * 0 + 2 * cx - tx;
    state.by = 2 * cy - ty;

  } else if (state.dragging === 'B'){
    let tx = state.targetX;
    let ty = state.targetY;
    const rx = tx - cx;
    const ry = ty - cy;
    const rdist = Math.hypot(rx, ry);
    const rmax = Math.min(W, H) * 0.42;
    if (rdist > rmax){
      tx = cx + rx / rdist * rmax;
      ty = cy + ry / rdist * rmax;
    }

    state.bx = tx;
    state.by = ty;
    state.ax = 2 * cx - tx;
    state.ay = 2 * cy - ty;

  } else {
    /* 自然运动：关于中心对称 */
    const r = state.radius * (1 + 0.065 * Math.sin(state.t * 0.9));
    const ca = Math.cos(state.theta);
    const sa = Math.sin(state.theta);

    state.ax = dcy * 0 + cx + r * ca;
    state.ay = cy + r * sa;
    state.bx = cx - r * ca;
    state.by = cy - r * sa;
  }

  /* 自旋反向旋转（视觉上表现纠缠的反相关） */
  state.spinA += dt * 1.6;
  state.spinB = state.spinA + Math.PI;

  /* 拖拽光晕 */
  const targetGlow = state.dragging ? 1 : 0;
  state.dragGlow += (targetGlow - state.dragGlow) * (1 - Math.exp(-7 * dt));

  state.flash *= Math.exp(-4.5 * dt);
}

/* =========================================================
   音频 —— 神秘音乐 + 量子闪烁
   ========================================================= */
let ac = null;
let masterGain = null;
let audioReady = false;
let droneNodes = [];
let shimmerGain = null;
let lastShimmer = 0;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  masterGain = ac.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(ac.destination);
  masterGain.gain.setTargetAtTime(0.62, ac.currentTime, 2.2);

  const kick = function(){
    setAudioDot(true);
    startDrone();
    startShimmerBed();
  };

  if (ac.state === 'suspended'){
    ac.resume().then(kick).catch(function(){ audioReady = false; });
  } else {
    kick();
  }
}

/* ---- 神秘持续音：两个近频正弦产生拍频 ---- */
function startDrone(){
  const now = ac.currentTime;

  /* 基础低音对：55 Hz 与 55.55 Hz —— 产生 0.55 Hz 的缓慢拍频 */
  const specs = [
    { f: 55.00, g: 0.045, type: 'sine', detune: 0 },
    { f: 55.55, g: 0.045, type: 'sine', detune: 0 },
    { f: 82.40, g: 0.028, type: 'sine', detune: 0 },
    { f: 110.0, g: 0.014, type: 'triangle', detune: 0 }
  ];

  for (let i = 0; i < specs.length; i++){
    const sp = specs[i];

    const osc = ac.createOscillator();
    osc.type = sp.type;
    osc.frequency.value = sp.f;

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 520;
    lp.Q.value = 1.8;

    const g = ac.createGain();
    g.gain.value = sp.g;

    /* 每个音加一个独立的缓慢起伏 LFO */
    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.055 + i * 0.017;
    const lg = ac.createGain();
    lg.gain.value = sp.g * 0.55;
    lfo.connect(lg);
    lg.connect(g.gain);
    lfo.start(now);

    osc.connect(lp);
    lp.connect(g);
    g.connect(masterGain);
    osc.start(now);

    droneNodes.push({ osc, g, lp, lfo });
  }

  /* 高通滤波过的太空噪声层 */
  const len = ac.sampleRate * 3;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 1200;
  bp.Q.value = 2.4;

  const ng = ac.createGain();
  ng.gain.value = 0.010;

  src.connect(bp);
  bp.connect(ng);
  ng.connect(masterGain);
  src.start(now);

  const lfo2 = ac.createOscillator();
  lfo2.frequency.value = 0.08;
  const lg2 = ac.createGain();
  lg2.gain.value = 480;
  lfo2.connect(lg2);
  lg2.connect(bp.frequency);
  lfo2.start(now);
}

/* ---- 闪烁底噪层：极高音段的轻柔噪声 ---- */
function startShimmerBed(){
  const now = ac.currentTime;

  const len = ac.sampleRate * 2;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){
    /* 用两个随机数之差制造高频倾向的噪声 */
    d[i] = (Math.random() * 2 - 1) - (Math.random() * 2 - 1);
  }

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 5000;

  shimmerGain = ac.createGain();
  shimmerGain.gain.value = 0;

  src.connect(hp);
  hp.connect(shimmerGain);
  shimmerGain.connect(masterGain);
  src.start(now);

  shimmerGain.gain.setTargetAtTime(0.0075, now, 3.0);

  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.37;
  const lg = ac.createGain();
  lg.gain.value = 0.0045;
  lfo.connect(lg);
  lg.connect(shimmerGain.gain);
  lfo.start(now);
}

/* ---- 量子闪烁：短促高频上扫 ---- */
function playQuantumFlash(intensity){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  const s = intensity || 1;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  const f0 = 1800 + Math.random() * 1600;
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f0 * 2.8, now + 0.075);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.028 * s, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 0.16);

  /* 二次谐波增加“水晶感” */
  const osc2 = ac.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(f0 * 2.01, now);
  osc2.frequency.exponentialRampToValueAtTime(f0 * 5.6, now + 0.075);

  const g2 = ac.createGain();
  g2.gain.value = 0.28;

  osc.connect(g);
  osc2.connect(g2);
  g2.connect(g);

  g.connect(masterGain);

  osc.start(now);
  osc.stop(now + 0.18);
  osc2.start(now);
  osc2.stop(now + 0.18);
}

/* ---- 拖拽时的持续“纠缠”音 ---- */
let dragOsc = null;
let dragGain = null;

function startDragTone(){
  if (!ac || ac.state !== 'running') return;
  if (dragOsc) return;

  const now = ac.currentTime;

  dragOsc = ac.createOscillator();
  dragOsc.type = 'triangle';
  dragOsc.frequency.value = 440;

  dragGain = ac.createGain();
  dragGain.gain.setValueAtTime(0, now);
  dragGain.gain.linearRampToValueAtTime(0.018, now + 0.08);

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 1600;

  dragOsc.connect(lp);
  lp.connect(dragGain);
  dragGain.connect(masterGain);
  dragOsc.start(now);
}

function stopDragTone(){
  if (!dragOsc) return;
  const now = ac.currentTime;
  dragGain.gain.cancelScheduledValues(now);
  dragGain.gain.setTargetAtTime(0, now, 0.06);
  dragOsc.stop(now + 0.4);
  dragOsc = null;
  dragGain = null;
}

/* 根据拖拽位置调整音高 */
function updateDragTone(x, y){
  if (!dragOsc) return;
  const now = ac.currentTime;
  const nx = (x - cx) / (Math.min(W, H) * 0.4);
  const ny = (y - cy) / (Math.min(W, H) * 0.4);
  const d = Math.min(1, Math.hypot(nx, ny));
  const f = 380 + d * 480 + ny * 90;
  dragOsc.frequency.setTargetAtTime(f, now, 0.08);
}

/* =========================================================
   背景星空
   ========================================================= */
const stars = [];
for (let i = 0; i < 220; i++){
  stars.push({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.3 + 0.2,
    ph: Math.random() * TAU,
    sp: 0.2 + Math.random() * 0.9,
    hue: 220 + Math.random() * 120
  });
}

/* 量子闪烁粒子 */
const sparks = [];

function spawnSpark(x, y, hue){
  const count = 3 + (Math.random() * 4) | 0;
  for (let i = 0; i < count; i++){
    const a = Math.random() * TAU;
    const sp = 30 + Math.random() * 120;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.6 + Math.random() * 1.8,
      r: 1.0 + Math.random() * 2.4,
      hue: hue
    });
  }
}

/* =========================================================
   绘制
   ========================================================= */
function drawBackground(t){
  /* 深空 */
  ctx.fillStyle = '#04020a';
  ctx.fillRect(0, 0, W, H);

  /* 中心紫色光晕 */
  const bgGlow = ctx.createRadialGradient(
    cx, cy, 0,
    cx, cy, maxDim * 0.72
  );
  bgGlow.addColorStop(0.00, 'rgba(80, 40, 130, 0.32)');
  bgGlow.addColorStop(0.42, 'rgba(40, 20, 80, 0.14)');
  bgGlow.addColorStop(1.00, 'rgba(4, 2, 10, 0)');
  ctx.fillStyle = bgGlow;
  ctx.fillRect(0, 0, W, H);

  /* 星空 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = 0.10 + 0.38 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    ctx.fillStyle = 'hsla(' + s.hue + ', 85%, 82%, ' + (a * 0.7) + ')';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- 概率云 ---- */
function drawProbabilityCloud(x, y, hue, phase){
  const baseR = Math.min(W, H) * 0.14;
  const r = baseR * (1 + 0.14 * Math.sin(state.t * 1.3 + phase));

  ctx.globalCompositeOperation = 'lighter';

  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0.00, 'hsla(' + hue + ', 100%, 78%, 0.14)');
  g.addColorStop(0.30, 'hsla(' + hue + ', 100%, 66%, 0.065)');
  g.addColorStop(0.62, 'hsla(' + hue + ', 100%, 58%, 0.020)');
  g.addColorStop(1.00, 'hsla(' + hue + ', 100%, 50%, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();

  /* 第二层更紧的云 */
  const r2 = baseR * 0.5 * (1 + 0.20 * Math.sin(state.t * 2.1 + phase + 1));
  const g2 = ctx.createRadialGradient(x, y, 0, x, y, r2);
  g2.addColorStop(0.00, 'hsla(' + hue + ', 100%, 88%, 0.22)');
  g2.addColorStop(0.55, 'hsla(' + hue + ', 100%, 70%, 0.06)');
  g2.addColorStop(1.00, 'hsla(' + hue + ', 100%, 60%, 0)');
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.arc(x, y, r2, 0, TAU);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
}

/* ---- 纠缠连接 ---- */
function drawEntanglementLink(){
  const ax = state.ax, ay = state.ay;
  const bx = state.bx, by = state.by;

  const dx = bx - ax;
  const dy = by - ay;
  const len = Math.hypot(dx, dy);
  if (len < 1) return;

  const nx = dx / len;
  const ny = dy / len;
  const perpX = -ny;
  const perpY = nx;

  /* 波动幅度：拖拽时更大 */
  const amp = Math.min(80, len * 0.13) * (0.4 + state.dragGlow * 0.9);
  const freq = 3.2;
  const speed = 1.7 + state.dragGlow * 1.4;

  const SEGS = 64;

  /* 主链条 */
  ctx.globalCompositeOperation = 'lighter';

  for (let layer = 0; layer < 3; layer++){
    const widthScale = [3.2, 1.5, 0.7][layer];
    const alphaScale = [0.10, 0.18, 0.55][layer];
    const phaseOff = [0, 0.8, 1.6][layer];

    ctx.beginPath();
    for (let i = 0; i <= SEGS; i++){
      const u = i / SEGS;
      const wave = Math.sin(u * TAU * freq - state.t * speed + phaseOff)
                 + Math.sin(u * TAU * freq * 1.7 + state.t * speed * 0.6) * 0.35;
      const wobble = wave * amp * Math.sin(u * Math.PI);

      const px = ax + dx * u + perpX * wobble;
      const py = ay + dy * u + perpY * wobble;

      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }

    /* 颜色：A 端青色 → B 端品红 */
    const grad = ctx.createLinearGradient(ax, ay, bx, by);
    grad.addColorStop(0.00, 'hsla(186, 100%, 70%, ' + alphaScale + ')');
    grad.addColorStop(0.50, 'hsla(260, 100%, 76%, ' + alphaScale + ')');
    grad.addColorStop(1.00, 'hsla(310, 100%, 72%, ' + alphaScale + ')');

    ctx.strokeStyle = grad;
    ctx.lineWidth = widthScale;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';

  /* 中央纠缠核心 */
  const midX = (ax + bx) * 0.5;
  const midY = (ay + by) * 0.5;
  const coreR = 4 + state.dragGlow * 5 + 2 * Math.sin(state.t * 2.4);

  ctx.globalCompositeOperation = 'lighter';
  const cg = ctx.createRadialGradient(midX, midY, 0, midX, midY, coreR * 5);
  cg.addColorStop(0.00, 'rgba(240, 210, 255, 0.60)');
  cg.addColorStop(0.30, 'rgba(180, 140, 255, 0.26)');
  cg.addColorStop(1.00, 'rgba(120, 80, 220, 0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(midX, midY, coreR * 5, 0, TAU);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 245, 255, 0.92)';
  ctx.beginPath();
  ctx.arc(midX, midY, coreR * 0.55, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- 粒子 ---- */
function drawParticle(x, y, hue, label, isDragged, spin){
  const baseR = Math.min(W, H) * 0.020;
  const r = baseR * (1 + 0.10 * Math.sin(state.t * 2.6 + spin));

  /* 外层光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const glowR = r * 7;
  const gg = ctx.createRadialGradient(x, y, 0, x, y, glowR);
  gg.addColorStop(0.00, 'hsla(' + hue + ', 100%, 82%, ' + (0.42 + state.dragGlow * 0.25) + ')');
  gg.addColorStop(0.24, 'hsla(' + hue + ', 100%, 68%, ' + (0.18 + state.dragGlow * 0.12) + ')');
  gg.addColorStop(0.62, 'hsla(' + hue + ', 100%, 58%, 0.045)');
  gg.addColorStop(1.00, 'hsla(' + hue + ', 100%, 50%, 0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(x, y, glowR, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 内层球体 */
  const bg = ctx.createRadialGradient(
    x - r * 0.35, y - r * 0.35, 0,
    x, y, r
  );
  bg.addColorStop(0.00, 'hsla(' + hue + ', 100%, 96%, 1)');
  bg.addColorStop(0.35, 'hsla(' + hue + ', 100%, 82%, 1)');
  bg.addColorStop(0.78, 'hsla(' + hue + ', 100%, 60%, 1)');
  bg.addColorStop(1.00, 'hsla(' + hue + ', 100%, 44%, 1)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();

  /* 自旋指示环（反向旋转显示反相关） */
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);

  ctx.beginPath();
  ctx.arc(0, 0, r * 1.7, -0.55, 0.55);
  ctx.strokeStyle = 'hsla(' + hue + ', 100%, 88%, 0.78)';
  ctx.lineWidth = Math.max(1.2, r * 0.16);
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, r * 1.7, Math.PI - 0.55, Math.PI + 0.55);
  ctx.strokeStyle = 'hsla(' + hue + ', 100%, 88%, 0.42)';
  ctx.stroke();

  ctx.restore();

  /* 拖拽高亮环 */
  if (isDragged){
    const pr = r * 2.4 + 4 * Math.sin(state.t * 6.0);
    ctx.beginPath();
    ctx.arc(x, y, pr, 0, TAU);
    ctx.strokeStyle = 'hsla(' + hue + ', 100%, 92%, ' + (0.42 + 0.20 * Math.sin(state.t * 5)) + ')';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y, pr + 8 + 3 * Math.sin(state.t * 3.7), 0, TAU);
    ctx.strokeStyle = 'hsla(' + hue + ', 100%, 88%, 0.20)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }

  /* 标签 */
  ctx.font = '10px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'hsla(' + hue + ', 100%, 88%, 0.72)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(label, x, y + r * 2.6);
}

/* ---- 闪烁粒子 ---- */
function drawSparks(dt){
  ctx.globalCompositeOperation = 'lighter';

  for (let i = sparks.length - 1; i >= 0; i--){
    const sp = sparks[i];
    sp.life -= sp.decay * dt;
    if (sp.life <= 0){ sparks.splice(i, 1); continue; }

    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;
    sp.vx *= 0.94;
    sp.vy *= 0.94;

    const a = sp.life * 0.9;
    const rr = sp.r * sp.life;

    const g = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, rr * 3.5);
    g.addColorStop(0.00, 'hsla(' + sp.hue + ', 100%, 92%, ' + a + ')');
    g.addColorStop(0.42, 'hsla(' + sp.hue + ', 100%, 74%, ' + (a * 0.32) + ')');
    g.addColorStop(1.00, 'hsla(' + sp.hue + ', 100%, 60%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, rr * 3.5, 0, TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   交互
   ========================================================= */
function getPointer(e){
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX) - rect.left;
  const y = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY) - rect.top;
  return { x: x, y: y };
}

function onDown(e){
  initAudio();

  const p = getPointer(e);

  const dA = Math.hypot(p.x - state.ax, p.y - state.ay);
  const dB = Math.hypot(p.x - state.bx, p.y - state.by);
  const hitR = Math.min(W, H) * 0.10;

  if (dA < hitR && dA <= dB){
    state.dragging = 'A';
    state.targetX = p.x;
    state.targetY = p.y;
    startDragTone();
    playQuantumFlash(1.0);
    spawnSpark(state.bx, state.by, 310);
  } else if (dB < hitR){
    state.dragging = 'B';
    state.targetX = p.x;
    state.targetY = p.y;
    startDragTone();
    playQuantumFlash(1.0);
    spawnSpark(state.ax, state.ay, 186);
  } else {
    /* 点击空白：在点击处产生闪烁 */
    playQuantumFlash(0.7);
    spawnSpark(p.x, p.y, 240 + Math.random() * 100);
  }

  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  if (e.cancelable) e.preventDefault();
}

function onMove(e){
  if (!state.dragging) return;
  const p = getPointer(e);
  state.targetX = p.x;
  state.targetY = p.y;

  /* 拖拽时，让另一个粒子位置立即更新（下一帧 updatePositions 就会生效） */
  /* 这里直接计算一次，保证视觉上即时响应 */
  if (state.dragging === 'A'){
    state.ax = p.x;
    state.ay = p.y;
    state.bx = 2 * cx - p.x;
    state.by = 2 * cy - p.y;
  } else {
    state.bx = p.x;
    state.by = p.y;
    state.ax = 2 * cx - p.x;
    state.ay = 2 * cy - p.y;
  }

  updateDragTone(p.x, p.y);

  /* 偶尔产生小闪烁 */
  if (Math.random() < 0.09){
    spawnSpark(state.ax, state.ay, 186);
    spawnSpark(state.bx, state.by, 310);
  }
}

function onUp(e){
  if (state.dragging){
    /* 平滑地恢复自然运动：根据当前位置重新计算 theta 和 radius */
    const dx = state.ax - cx;
    const dy = state.ay - cy;
    state.theta = Math.atan2(dy, dx);
    state.radius = Math.hypot(dx, dy);

    state.dragging = null;
    stopDragTone();

    /* 松开时放出两组闪烁 */
    spawnSpark(state.ax, state.ay, 186);
    spawnSpark(state.bx, state.by, 310);
    playQuantumFlash(0.8);
  }

  if (e && e.pointerId !== undefined){
    try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
  }
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('pointerleave', function(e){
  if (state.dragging) onUp(e);
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    /* 空间触发一次量子闪烁 */
    playQuantumFlash(1.0);
    spawnSpark(state.ax, state.ay, 186);
    spawnSpark(state.bx, state.by, 310);
    state.flash = 1;
  }
});

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.08) dt = 0.08;

  const t = now * 0.001;

  /* 更新位置 */
  updatePositions(dt);

  /* 拖拽时，位置在 onMove 中已设，这里再确保一次 */
  if (state.dragging === 'A'){
    state.bx = 2 * cx - state.ax;
    state.by = 2 * cy - state.ay;
  } else if (state.dragging === 'B'){
    state.ax = 2 * cx - state.bx;
    state.ay = 2 * cy - state.by;
  }

  /* 音频：随机量子闪烁 */
  if (audioReady && ac && ac.state === 'running'){
    if (t - lastShimmer > 0.9 + Math.random() * 2.6){
      lastShimmer = t;
      playQuantumFlash(0.42 + Math.random() * 0.36);
      if (Math.random() < 0.5){
        const isA = Math.random() < 0.5;
        spawnSpark(
          isA ? state.ax : state.bx,
          isA ? state.ay : state.by,
          isA ? 186 : 310
        );
      }
    }
  }

  /* ---- 绘制 ---- */
  drawBackground(t);

  /* 概率云 */
  drawProbabilityCloud(state.ax, state.ay, 186, 0);
  drawProbabilityCloud(state.bx, state.by, 310, Math.PI);

  /* 纠缠连接 */
  drawEntanglementLink();

  /* 粒子 */
  drawParticle(state.ax, state.ay, 186, 'A', state.dragging === 'A', state.spinA);
  drawParticle(state.bx, state.by, 310, 'B', state.dragging === 'B', state.spinB);

  /* 闪烁 */
  drawSparks(dt);

  /* 全屏闪光 */
  if (state.flash > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(200, 180, 255, ' + (state.flash * 0.06) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    cx, cy, Math.min(W, H) * 0.28,
    cx, cy, maxDim * 0.78
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.60, 'rgba(4, 2, 12, 0.28)');
  vg.addColorStop(1.00, 'rgba(0, 0, 4, 0.84)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* ---- HUD ---- */
  const coh = 0.94 - state.dragGlow * 0.04 + 0.01 * Math.sin(t * 1.3);
  const cv = document.getElementById('cohVal');
  if (cv && (t | 0) % 4 === 0) cv.textContent = coh.toFixed(2);

  const sb = document.getElementById('stateBig');
  const se = document.getElementById('stateEn');
  if (sb && se && (t | 0) % 4 === 0){
    if (state.dragging){
      sb.textContent = '测 量 中';
      se.textContent = 'MEASURING';
      sb.style.color = 'rgba(255, 220, 160, 0.92)';
    } else {
      sb.textContent = '缠 绕';
      se.textContent = 'ENTANGLED';
      sb.style.color = 'rgba(200, 220, 255, 0.88)';
    }
  }
}

/* =========================================================
   启动
   ========================================================= */
resize();
requestAnimationFrame(loop);

})();
</script>
