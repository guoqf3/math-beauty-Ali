<canvas id="c"></canvas>

  </div>

<script type="module">
import * as THREE from 'three';

/* ==========================================================
   1. 基础常量
   ========================================================== */
const R_CORE   = 2.0;      // 中心质量球半径
const R_GRID   = 74;       // 时空网格半范围
const GRID_DEPTH = 6.0;    // 漏斗深度系数
const GRID_RC    = 7.0;    // 漏斗特征半径

const GM_EFF   = 4.0;      // 有效引力参数 (决定偏折强度)
const R_START  = 62;       // 光线起始坐标
const N_RAYS   = 30;       // 光线数量

/* ==========================================================
   2. 渲染器 / 场景 / 相机
   ========================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, alpha: false, powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03030c);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.5, 900);

/* ==========================================================
   3. 环境贴图（金属/自发光反射）
   ========================================================== */
function makeEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, '#241a4e');
  g.addColorStop(0.36, '#0a0a22');
  g.addColorStop(0.60, '#120a30');
  g.addColorStop(1.00, '#020208');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 512);

  const blobs = [
    [512, 130, 250, 'rgba(255,180,70,0.55)'],
    [180, 200, 220, 'rgba(90,80,255,0.42)'],
    [840, 190, 230, 'rgba(60,200,255,0.36)'],
    [350, 420, 200, 'rgba(255,140,220,0.22)'],
    [760, 400, 210, 'rgba(80,120,255,0.24)'],
  ];
  blobs.forEach(([x, y, r, col]) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, col);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  });

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envSrc = makeEnvTexture();
scene.environment = pmrem.fromEquirectangular(envSrc).texture;
envSrc.dispose();
pmrem.dispose();

/* ==========================================================
   4. 灯光
   ========================================================== */
scene.add(new THREE.AmbientLight(0x334a80, 0.9));

const keyLight = new THREE.DirectionalLight(0xfff0d8, 1.6);
keyLight.position.set(18, 34, 14);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x5588ff, 1.1);
rimLight.position.set(-22, 10, -18);
scene.add(rimLight);

/* 中心质量球自身的光源 */
const coreLight = new THREE.PointLight(0xffb340, 260, 120, 2);
scene.add(coreLight);

const coreLight2 = new THREE.PointLight(0xaa60ff, 140, 90, 2);
coreLight2.position.set(4, 2, 4);
scene.add(coreLight2);

/* ==========================================================
   5. 中心质量球 + 辉光
   ========================================================== */
const coreGroup = new THREE.Group();
coreGroup.position.y = -1.6;
scene.add(coreGroup);

/* 5.1 球体本体 */
const coreGeo = new THREE.SphereGeometry(R_CORE, 48, 32);
const coreMat = new THREE.MeshStandardMaterial({
  color: 0x1a0c02,
  emissive: 0xffa030,
  emissiveIntensity: 3.4,
  roughness: 0.32,
  metalness: 0.25,
  envMapIntensity: 1.2,
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
coreGroup.add(coreMesh);

/* 5.2 辉光贴图生成 */
function makeGlowTexture(inner, mid, outer) {
  const size = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const cx = cv.getContext('2d');
  const g = cx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.00, inner);
  g.addColorStop(0.18, mid);
  g.addColorStop(0.45, outer);
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  cx.fillStyle = g;
  cx.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* 5.3 外层暖色辉光 */
const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture('rgba(255,255,240,0.95)', 'rgba(255,215,130,0.62)', 'rgba(255,150,40,0.18)'),
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
  depthTest: true,
}));
glowSprite.scale.set(24, 24, 1);
coreGroup.add(glowSprite);

/* 5.4 内层炽热核心 */
const hotSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture('rgba(255,255,255,1)', 'rgba(255,240,190,0.8)', 'rgba(255,190,80,0.25)'),
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
}));
hotSprite.scale.set(7.5, 7.5, 1);
coreGroup.add(hotSprite);

/* 5.5 冷色外层光晕 */
const coolSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture('rgba(190,150,255,0.28)', 'rgba(120,110,255,0.14)', 'rgba(60,80,255,0.05)'),
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
}));
coolSprite.scale.set(44, 44, 1);
coreGroup.add(coolSprite);

/* ==========================================================
   6. 时空网格（向下凹陷成漏斗）
   ========================================================== */
function gridY(r) {
  // 橡胶膜下沉模型：y = -A / (1 + (r/rc)^2)
  return -GRID_DEPTH / (1 + (r * r) / (GRID_RC * GRID_RC));
}

function buildSpacetimeGrid() {
  const N_LINES = 46;
  const N_SEG   = 132;
  const R       = R_GRID;
  const step    = (2 * R) / N_SEG;

  const pos = [];
  const col = [];

  const cCenter = new THREE.Color(0xffc44e);   // 近处：金橙
  const cMid    = new THREE.Color(0x3f8dff);   // 中距：亮蓝
  const cFar    = new THREE.Color(0x1b1e58);   // 远处：深紫蓝

  const tmp = new THREE.Color();

  function colorAt(r) {
    const t = THREE.MathUtils.smoothstep(r, 2.0, 44.0);
    if (t < 0.5) {
      tmp.copy(cCenter).lerp(cMid, t * 2);
    } else {
      tmp.copy(cMid).lerp(cFar, (t - 0.5) * 2);
    }
    return tmp;
  }

  function push(x, z) {
    const r = Math.sqrt(x * x + z * z);
    const y = gridY(r);
    pos.push(x, y, z);
    const c = colorAt(r);
    col.push(c.r, c.g, c.b);
  }

  /* 平行于 X 轴的线 */
  for (let i = 0; i < N_LINES; i++) {
    const z = -R + (2 * R) * (i / (N_LINES - 1));
    for (let j = 0; j < N_SEG; j++) {
      const xa = -R + step * j;
      const xb = -R + step * (j + 1);
      push(xa, z);
      push(xb, z);
    }
  }

  /* 平行于 Z 轴的线 */
  for (let i = 0; i < N_LINES; i++) {
    const x = -R + (2 * R) * (i / (N_LINES - 1));
    for (let j = 0; j < N_SEG; j++) {
      const za = -R + step * j;
      const zb = -R + step * (j + 1);
      push(x, za);
      push(x, zb);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  return new THREE.LineSegments(geo, mat);
}

const gridMesh = buildSpacetimeGrid();
scene.add(gridMesh);

/* ==========================================================
   7. 测地线追踪（2D 平面内积分，再映射到 3D）
   ========================================================== */
function traceGeodesic2D(b) {
  const pts = [];
  let x = -R_START;
  let y = b;
  let vx = 1, vy = 0;

  const MAX_STEPS = 2600;

  for (let i = 0; i < MAX_STEPS; i++) {
    const r = Math.sqrt(x * x + y * y);
    pts.push(x, y);

    if (i > 24 && r > R_START * 1.16 && (x * vx + y * vy) > 0) break;
    if (r < 0.5) break;

    // 自适应步长：越靠近中心，步长越小
    const dt = THREE.MathUtils.clamp(0.042 * r, 0.018, 0.55);

    const r3 = r * r * r;
    const ax = -GM_EFF * x / r3;
    const ay = -GM_EFF * y / r3;

    vx += ax * dt;
    vy += ay * dt;

    // 光速恒定 —— 速度方向更新后归一化
    const vm = Math.sqrt(vx * vx + vy * vy) || 1;
    vx /= vm;
    vy /= vm;

    x += vx * dt;
    y += vy * dt;
  }

  return pts;
}

/* ==========================================================
   8. 生成光线（3D 映射 + 顶点渐变着色）
   ========================================================== */
const rayPaths = [];   // 每条光线的 [x,y,z,...] 扁平数组
const rayData  = [];   // { positions:Float32Array, n, progress, speed }

const goldColor = new THREE.Color(0xffcb52);
const tmpColor  = new THREE.Color();

function buildRays() {
  const container = new THREE.Group();
  scene.add(container);

  for (let i = 0; i < N_RAYS; i++) {
    const t  = i / (N_RAYS - 1);
    const b  = 3.0 + t * 25.0;                       // 碰撞参数 3 → 28
    const alpha = i * 2.39996323;                    // 黄金角，均匀分布
    const beta  = Math.sin(i * 1.73) * 0.36;         // 轨道面倾角

    const pts2D = traceGeodesic2D(b);
    const n = pts2D.length / 2;

    // 冷色基调，按序号渐变
    const hue = 0.47 + t * 0.30;
    const cold = new THREE.Color().setHSL(hue, 0.92, 0.62);

    // 正交基
    const ca = Math.cos(alpha), sa = Math.sin(alpha);
    const cb = Math.cos(beta),  sb = Math.sin(beta);

    const hx = ca,        hy = 0,    hz = -sa;       // 传播方向
    const qx = sa * cb,   qy = sb,   qz = ca * cb;   // 偏移方向

    const positions = new Float32Array(n * 3);
    const colors    = new Float32Array(n * 3);

    for (let k = 0; k < n; k++) {
      const u = pts2D[k * 2];
      const v = pts2D[k * 2 + 1];

      const px = u * hx + v * qx;
      const py = u * hy + v * qy;
      const pz = u * hz + v * qz;

      positions[k * 3]     = px;
      positions[k * 3 + 1] = py;
      positions[k * 3 + 2] = pz;

      // 距离中心越近 → 越偏金色（弯曲最剧烈处高亮）
      const r = Math.sqrt(u * u + v * v);
      const mixT = THREE.MathUtils.smoothstep(r, 3.5, 26.0);
      tmpColor.copy(goldColor).lerp(cold, mixT);
      // 近心处额外提亮
      const boost = 1.0 + (1.0 - mixT) * 0.65;
      colors[k * 3]     = Math.min(tmpColor.r * boost, 1.6);
      colors[k * 3 + 1] = Math.min(tmpColor.g * boost, 1.6);
      colors[k * 3 + 2] = Math.min(tmpColor.b * boost, 1.6);
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.88,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    const line = new THREE.Line(geo, mat);
    line.frustumCulled = false;
    container.add(line);

    rayPaths.push(positions);
    rayData.push({
      positions,
      n,
      progress: Math.random(),
      speed: 0.055 + Math.random() * 0.05,
    });
  }
}
buildRays();

/* ==========================================================
   9. 移动光子（Points）
   ========================================================== */
function makePhotonTexture() {
  const size = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const cx = cv.getContext('2d');
  const g = cx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.28, 'rgba(255,235,170,0.85)');
  g.addColorStop(0.62, 'rgba(255,180,60,0.25)');
  g.addColorStop(1.0, 'rgba(255,140,0,0)');
  cx.fillStyle = g;
  cx.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const photonPositions = new Float32Array(N_RAYS * 3);
const photonColors    = new Float32Array(N_RAYS * 3);

const photonGeo = new THREE.BufferGeometry();
photonGeo.setAttribute('position', new THREE.BufferAttribute(photonPositions, 3));
photonGeo.setAttribute('color', new THREE.BufferAttribute(photonColors, 3));

const photonMat = new THREE.PointsMaterial({
  size: 1.5,
  map: makePhotonTexture(),
  vertexColors: true,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});

const photons = new THREE.Points(photonGeo, photonMat);
photons.frustumCulled = false;
scene.add(photons);

/* 初始化光子颜色 */
for (let i = 0; i < N_RAYS; i++) {
  const t = i / (N_RAYS - 1);
  const c = new THREE.Color().setHSL(0.47 + t * 0.30, 0.6, 0.85);
  photonColors[i * 3]     = c.r;
  photonColors[i * 3 + 1] = c.g;
  photonColors[i * 3 + 2] = c.b;
}

/* ==========================================================
   10. 星空背景
   ========================================================== */
(function buildStars() {
  const COUNT = 2600;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  const c = new THREE.Color();

  for (let i = 0; i < COUNT; i++) {
    const r  = 200 + Math.random() * 320;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);

    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph);
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);

    // 大部分冷色，少量暖色星
    const warm = Math.random() < 0.14;
    c.setHSL(
      warm ? 0.09 + Math.random() * 0.06 : 0.52 + Math.random() * 0.16,
      warm ? 0.85 : 0.55,
      0.55 + Math.random() * 0.42
    );
    col[i * 3]     = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 2.1,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  const stars = new THREE.Points(geo, mat);
  stars.frustumCulled = false;
  scene.add(stars);
})();

/* ==========================================================
   11. 相机轨道控制
   ========================================================== */
const orbit = {
  theta: 0.85,
  phi: 0.98,
  targetPhi: 0.98,
  radius: 66,
  targetRadius: 66,
  autoSpeed: 0.055,
};

let dragging = false;
let lastX = 0, lastY = 0;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;

  orbit.theta -= dx * 0.005;
  orbit.targetPhi = THREE.MathUtils.clamp(
    orbit.targetPhi - dy * 0.005, 0.16, Math.PI - 0.16
  );
});

canvas.addEventListener('pointerup', (e) => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointercancel', () => { dragging = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  orbit.targetRadius = THREE.MathUtils.clamp(
    orbit.targetRadius + e.deltaY * 0.038, 18, 150
  );
}, { passive: false });

/* ==========================================================
   12. 界面交互
   ========================================================== */
const audioBtn = document.getElementById('audioBtn');
const flipBtn  = document.getElementById('flipBtn');
const pauseBtn = document.getElementById('pauseBtn');

let paused = false;

pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶ 继续光线' : '⏸ 暂停光线';
  pauseBtn.classList.toggle('on', paused);
});

flipBtn.addEventListener('click', () => {
  orbit.targetPhi = Math.PI - orbit.targetPhi;
  flipBtn.classList.toggle('on');
});

/* ==========================================================
   13. 程序化科技音效
   ========================================================== */
let audioCtx = null;
let masterGain = null;
let bellTimer = null;

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();

  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);

  /* 空间反馈延迟 */
  const delay = audioCtx.createDelay(2.0);
  delay.delayTime.value = 0.52;
  const fb = audioCtx.createGain();
  fb.gain.value = 0.46;
  const wet = audioCtx.createGain();
  wet.gain.value = 0.4;
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(wet);
  wet.connect(masterGain);

  /* 低通 + 慢扫频 */
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 520;
  lp.Q.value = 5.5;
  lp.connect(masterGain);
  lp.connect(delay);

  /* 低频 drone 层 */
  [41.2, 61.74, 82.41, 110.0, 146.83, 196.0].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = i < 2 ? 'sawtooth' : 'sine';
    osc.frequency.value = f;
    osc.detune.value = (Math.random() - 0.5) * 16;

    const g = audioCtx.createGain();
    g.gain.value = (i < 2 ? 0.045 : 0.08) / (1 + i * 0.55);
    osc.connect(g);
    g.connect(lp);
    osc.start();

    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.025 + Math.random() * 0.1;
    const lg = audioCtx.createGain();
    lg.gain.value = 3 + Math.random() * 6;
    lfo.connect(lg);
    lg.connect(osc.detune);
    lfo.start();
  });

  /* 滤波器扫频 */
  const flfo = audioCtx.createOscillator();
  flfo.frequency.value = 0.045;
  const flg = audioCtx.createGain();
  flg.gain.value = 340;
  flfo.connect(flg);
  flg.connect(lp.frequency);
  flfo.start();

  /* 淡入 */
  masterGain.gain.exponentialRampToValueAtTime(0.16, audioCtx.currentTime + 4.5);

  bellTimer = setInterval(playSpark, 2400);
}

function playSpark() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  const scale = [587.33, 659.25, 783.99, 880.0, 1046.5, 1318.5, 1567.98];
  const f = scale[Math.floor(Math.random() * scale.length)];

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = f;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.28, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);

  osc.connect(g);
  g.connect(masterGain);
  osc.start(t);
  osc.stop(t + 3.6);
}

audioBtn.addEventListener('click', async () => {
  if (!audioCtx) {
    initAudio();
    audioBtn.textContent = '◈ 关闭音效';
    audioBtn.classList.add('on');
    return;
  }
  if (audioCtx.state === 'running') {
    await audioCtx.suspend();
    audioBtn.textContent = '◈ 开启音效';
    audioBtn.classList.remove('on');
  } else {
    await audioCtx.resume();
    audioBtn.textContent = '◈ 关闭音效';
    audioBtn.classList.add('on');
  }
});

/* ==========================================================
   14. 主循环
   ========================================================== */
const clock = new THREE.Clock();
let elapsed = 0;

function updateCamera(dt) {
  if (!dragging) orbit.theta += dt * orbit.autoSpeed;

  const k = Math.min(1, dt * 3.0);
  orbit.phi    += (orbit.targetPhi    - orbit.phi)    * k;
  orbit.radius += (orbit.targetRadius - orbit.radius) * k;

  const sp = Math.sin(orbit.phi);
  const cp = Math.cos(orbit.phi);

  camera.position.set(
    orbit.radius * sp * Math.cos(orbit.theta),
    orbit.radius * cp,
    orbit.radius * sp * Math.sin(orbit.theta)
  );
  camera.lookAt(0, -2.5, 0);
}

function updatePhotons(dt) {
  const posArr = photonGeo.attributes.position.array;

  for (let i = 0; i < N_RAYS; i++) {
    const rd = rayData[i];

    if (!paused) {
      rd.progress += rd.speed * dt;
      if (rd.progress > 1) rd.progress -= 1;
    }

    const n = rd.n;
    const fIdx = rd.progress * (n - 1);
    const i0 = Math.floor(fIdx);
    const i1 = Math.min(i0 + 1, n - 1);
    const frac = fIdx - i0;

    const p = rd.positions;
    const a0 = i0 * 3, a1 = i1 * 3;

    posArr[i * 3]     = p[a0]     + (p[a1]     - p[a0])     * frac;
    posArr[i * 3 + 1] = p[a0 + 1] + (p[a1 + 1] - p[a0 + 1]) * frac;
    posArr[i * 3 + 2] = p[a0 + 2] + (p[a1 + 2] - p[a0 + 2]) * frac;
  }

  photonGeo.attributes.position.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) elapsed += dt;

  /* 核心球脉动 */
  const pulse = 1 + Math.sin(elapsed * 1.7) * 0.06;
  coreMat.emissiveIntensity = 3.4 * pulse;
  coreLight.intensity = 260 * pulse;
  hotSprite.scale.setScalar(7.5 * (1 + Math.sin(elapsed * 2.3) * 0.05));
  glowSprite.scale.setScalar(24 * (1 + Math.sin(elapsed * 1.1) * 0.04));

  /* 光子流动 */
  updatePhotons(dt);

  /* 相机 */
  updateCamera(dt);

  renderer.render(scene, camera);
}

/* 自适应窗口 */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
