<style>

<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="hud">
  <div class="tag">物 理 现 象</div>
  <h1>贝塞尔函数波前</h1>
  <div class="en">BESSEL FUNCTION MODES · CIRCULAR MEMBRANE VIBRATION</div>

  <div class="formula">
    ρ<sup>2</sup>R″ <span class="op">+</span> ρR′ <span class="op">+</span>
    (<span class="num">k</span><sup>2</sup>ρ<sup>2</sup> <span class="op">−</span> <span class="num">m</span><sup>2</sup>)R <span class="op">=</span> 0
  </div><br>

  <div class="formula">
    R(ρ) <span class="op">=</span> J<sub><span class="num">m</span></sub>( <span class="num">k</span><sub><span class="num">mn</span></sub> ρ )
  </div>

  <div class="info">
    当前模式 <b id="modeTxt">m = 0, n = 1</b><br>
    径向节圆 <b id="nodeTxt">0</b> &nbsp;|&nbsp; 角向节线 <b id="petalTxt">0</b><br>
    <span class="dim">J<sub>m</sub> 的零点分布决定鼓面节线 · 振幅由中心向外振荡衰减</span>
  </div>
</div>

<div class="status">
  <div>波数 <span class="k">k<sub>mn</sub></span> = <span class="v" id="kTxt">2.405</span></div>
  <div>径向节圆数 = n − 1 &nbsp;·&nbsp; 角向节线数 = 2m</div>
  <div>圆膜本征振动 · 边界固定 u(R) = 0</div>
</div>

<div class="panel">
  <h2>参 数 控 制</h2>

  <div class="row">
    <div class="lab"><span>角向阶数 m</span><span class="val" id="mVal">0</span></div>
    <input type="range" id="mSlider" min="0" max="6" step="1" value="0">
  </div>

  <div class="row">
    <div class="lab"><span>径向阶数 n</span><span class="val" id="nVal">1</span></div>
    <input type="range" id="nSlider" min="1" max="4" step="1" value="1">
  </div>

  <div class="btns">
    <button class="btn on" id="autoBtn">◉ 自动演化</button>
    <button class="btn" id="audioBtn">♪ 音效</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================================
   1. 参数
   ========================================================= */
const RADIAL_SEG  = 120;
const ANGULAR_SEG = 120;
const N_VERT      = (RADIAL_SEG + 1) * (ANGULAR_SEG + 1);
const RADIUS      = 1.0;
const AMP_SCALE   = 0.42;

const params = { m: 0, n: 1, auto: true };

/* ---- J_m 的前 4 个零点 ---- */
const ROOTS = [
  [2.4048, 5.5201, 8.6537, 11.7915],
  [3.8317, 7.0156, 10.1735, 13.3237],
  [5.1356, 8.4172, 11.6198, 14.7960],
  [6.3802, 9.7610, 13.0152, 16.2235],
  [7.5883, 11.0647, 14.3725, 17.6160],
  [8.7715, 12.3386, 15.7002, 19.0046],
  [9.9361, 13.5893, 17.0038, 20.3208],
];

/* =========================================================
   2. 贝塞尔函数 J_m(x)
   级数展开：J_m(x) = (x/2)^m · Σ (-1)^k (x²/4)^k / (k!(m+k)!)
   ========================================================= */
function besselJ(m, x) {
  const mA = Math.abs(m);
  if (Math.abs(x) < 1e-12) return mA === 0 ? 1 : 0;

  const xh = x * 0.5;

  // 首项 (x/2)^m / m!
  let term = 1;
  for (let i = 1; i <= mA; i++) term *= xh / i;

  let sum = term;
  for (let k = 1; k < 80; k++) {
    term *= -(xh * xh) / (k * (mA + k));
    sum += term;
    if (Math.abs(term) < 1e-15 * Math.abs(sum) + 1e-30) break;
  }

  return (m < 0 && mA % 2 === 1) ? -sum : sum;
}

/* =========================================================
   3. 渲染器 / 场景 / 相机
   ========================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.10;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x02030a, 0.055);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 200);
camera.position.set(1.65, 1.85, 2.65);
camera.lookAt(0, 0, 0);

/* =========================================================
   4. 背景辉光 + 星尘
   ========================================================= */
function radialTex(c0, c1, c2) {
  const s = 256, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0, c0); g.addColorStop(0.45, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
}

const bgGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radialTex('rgba(70,40,200,0.38)', 'rgba(30,60,170,0.10)', 'rgba(0,0,0,0)'),
  blending: THREE.AdditiveBlending,
  depthWrite: false, transparent: true, opacity: 0.55
}));
bgGlow.scale.set(13, 13, 1);
bgGlow.position.z = -7;
scene.add(bgGlow);

(function stars() {
  const N = 900;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r  = 18 + Math.random() * 40;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph) * 0.7;
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    size: 0.055, color: 0x6fb4ff, transparent: true, opacity: 0.55,
    sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const p = new THREE.Points(g, m);
  p.name = 'stars';
  scene.add(p);
})();

/* =========================================================
   5. 圆膜网格（极坐标网格）
   ========================================================= */
const positions = new Float32Array(N_VERT * 3);
const colors    = new Float32Array(N_VERT * 3);
const rhoArr    = new Float32Array(N_VERT);
const phiArr    = new Float32Array(N_VERT);

let vi = 0;
for (let i = 0; i <= RADIAL_SEG; i++) {
  const rho = i / RADIAL_SEG;
  for (let j = 0; j <= ANGULAR_SEG; j++) {
    const phi = (j / ANGULAR_SEG) * Math.PI * 2;
    const x = rho * Math.cos(phi) * RADIUS;
    const z = rho * Math.sin(phi) * RADIUS;

    positions[vi*3]     = x;
    positions[vi*3 + 1] = 0;
    positions[vi*3 + 2] = z;

    rhoArr[vi] = rho;
    phiArr[vi] = phi;
    vi++;
  }
}

const indices = [];
for (let i = 0; i < RADIAL_SEG; i++) {
  for (let j = 0; j < ANGULAR_SEG; j++) {
    const a = i * (ANGULAR_SEG + 1) + j;
    const b = a + 1;
    const c = a + (ANGULAR_SEG + 1);
    const d = c + 1;
    indices.push(a, c, b);
    indices.push(b, c, d);
  }
}

const discGeo = new THREE.BufferGeometry();
const posAttr = new THREE.BufferAttribute(positions, 3);
posAttr.setUsage(THREE.DynamicDrawUsage);
const colAttr = new THREE.BufferAttribute(colors, 3);
colAttr.setUsage(THREE.DynamicDrawUsage);

discGeo.setAttribute('position', posAttr);
discGeo.setAttribute('color',    colAttr);
discGeo.setIndex(indices);

const discMat = new THREE.MeshBasicMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.98,
  blending: THREE.NormalBlending,
  depthWrite: true
});

const discMesh = new THREE.Mesh(discGeo, discMat);
scene.add(discMesh);

/* =========================================================
   6. 边缘参考圆环
   ========================================================= */
const ringGeo = new THREE.BufferGeometry();
{
  const N = 200;
  const pts = new Float32Array((N + 1) * 3);
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    pts[i*3]     = Math.cos(a) * RADIUS;
    pts[i*3 + 1] = 0;
    pts[i*3 + 2] = Math.sin(a) * RADIUS;
  }
  ringGeo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
}
const edgeRing = new THREE.Line(ringGeo, new THREE.LineBasicMaterial({
  color: 0x4fd6ff, transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(edgeRing);

/* =========================================================
   7. 节线圆环组
   ========================================================= */
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

const nodeRingGeo = new THREE.RingGeometry(0.985, 1.0, 128);
const nodeMats = [];

function buildNodeRings() {
  // 清理
  while (nodeGroup.children.length) {
    const c = nodeGroup.children.pop();
    if (c.geometry && c.geometry !== nodeRingGeo) c.geometry.dispose();
  }

  const m = params.m;
  const n = params.n;
  const rootN = ROOTS[m][n - 1];

  // 径向节圆：J_m 零点在 ρ = root_i / root_n
  for (let i = 0; i < n - 1; i++) {
    const rhoNode = ROOTS[m][i] / rootN;
    if (rhoNode <= 0.001 || rhoNode >= 0.999) continue;

    const mat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.75,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const ring = new THREE.Mesh(nodeRingGeo, mat);
    ring.scale.setScalar(rhoNode);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.008;
    nodeGroup.add(ring);
    nodeMats.push({ mat, base: 0.65, phase: i * 1.7 });
  }
}

/* =========================================================
   8. 后期辉光
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.05,   // 强度
  0.72,   // 半径
  0.14    // 阈值
);
composer.addPass(bloom);

/* =========================================================
   9. 径向 / 角向预计算缓存
   ========================================================= */
const radialVals  = new Float32Array(RADIAL_SEG + 1);
const angularVals = new Float32Array(ANGULAR_SEG + 1);

function computeRadial() {
  const m = params.m;
  const n = params.n;
  const root = ROOTS[m][n - 1];

  let maxAbs = 1e-10;
  for (let i = 0; i <= RADIAL_SEG; i++) {
    const rho = i / RADIAL_SEG;
    const v = besselJ(m, root * rho);
    radialVals[i] = v;
    const av = Math.abs(v);
    if (av > maxAbs) maxAbs = av;
  }
  const inv = 1 / maxAbs;
  for (let i = 0; i <= RADIAL_SEG; i++) radialVals[i] *= inv;

  for (let j = 0; j <= ANGULAR_SEG; j++) {
    const phi = (j / ANGULAR_SEG) * Math.PI * 2;
    angularVals[j] = Math.cos(m * phi);
  }
}

/* =========================================================
   10. HSL → RGB
   ========================================================= */
function hsl2rgb(h, s, l, out) {
  h = ((h % 1) + 1) % 1;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h * 6) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if      (h < 1/6) { r = c; g = x; b = 0; }
  else if (h < 2/6) { r = x; g = c; b = 0; }
  else if (h < 3/6) { r = 0; g = c; b = x; }
  else if (h < 4/6) { r = 0; g = x; b = c; }
  else if (h < 5/6) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  out[0] = r + m; out[1] = g + m; out[2] = b + m;
}

const rgbOut = [0, 0, 0];

/* =========================================================
   11. 音频引擎
   ========================================================= */
let AC = null, masterGain = null, audioOn = false;

function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { return; }

  masterGain = AC.createGain();
  masterGain.gain.setValueAtTime(0.0001, AC.currentTime);
  masterGain.connect(AC.destination);

  /* ---- 低频 drone ---- */
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 310;
  lp.Q.value = 4.6;
  lp.connect(masterGain);

  [55, 82.5, 110, 138.6, 165, 220].forEach((f, i) => {
    const o = AC.createOscillator();
    o.type = (i % 2 === 0) ? 'sine' : 'sawtooth';
    o.frequency.value = f;
    o.detune.value = (i - 2.5) * 6;
    const g = AC.createGain();
    g.gain.value = 0.078 / (i * 0.68 + 1);
    o.connect(g); g.connect(lp);
    o.start();
  });

  const lfo = AC.createOscillator();
  lfo.frequency.value = 0.046;
  const lg = AC.createGain();
  lg.gain.value = 175;
  lfo.connect(lg); lg.connect(lp.frequency);
  lfo.start();

  /* ---- 带通噪声铺底 ---- */
  const len = Math.floor(AC.sampleRate * 5);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const dd = buf.getChannelData(0);
  for (let i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;

  const ns = AC.createBufferSource();
  ns.buffer = buf; ns.loop = true;

  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.85;

  const ng = AC.createGain(); ng.gain.value = 0.028;

  ns.connect(bp); bp.connect(ng); ng.connect(masterGain);
  ns.start();

  const nLfo = AC.createOscillator();
  nLfo.frequency.value = 0.060;
  const nLg = AC.createGain(); nLg.gain.value = 740;
  nLfo.connect(nLg); nLg.connect(bp.frequency);
  nLfo.start();
}

/* ---- 模式切换铃声 ---- */
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];

function playBell(m, n) {
  if (!AC || !audioOn) return;
  const t0 = AC.currentTime;

  const idx = (m * 4 + n * 2 + 30) % SCALE.length;
  const freq = 196 * Math.pow(2, (SCALE[idx] + m * 1.2 + n * 0.8) / 12);

  [[1, 0.085, 2.6],
   [2.004, 0.036, 1.9],
   [3.008, 0.014, 1.3]].forEach(([mult, amp, dur]) => {
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq * mult;

    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(amp, t0 + 0.016);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.3);
  });
}

/* =========================================================
   12. UI 绑定
   ========================================================= */
const mSlider  = document.getElementById('mSlider');
const nSlider  = document.getElementById('nSlider');
const mVal     = document.getElementById('mVal');
const nVal     = document.getElementById('nVal');
const modeTxt  = document.getElementById('modeTxt');
const nodeTxt  = document.getElementById('nodeTxt');
const petalTxt = document.getElementById('petalTxt');
const kTxt     = document.getElementById('kTxt');
const autoBtn  = document.getElementById('autoBtn');
const audioBtn = document.getElementById('audioBtn');

function updateHUD() {
  const m = params.m, n = params.n;
  modeTxt.textContent = `m = ${m}, n = ${n}`;
  mVal.textContent = m;
  nVal.textContent = n;

  nodeTxt.textContent = n - 1;
  petalTxt.textContent = 2 * m;
  kTxt.textContent = ROOTS[m][n - 1].toFixed(3);
}

function applyMode(playSound) {
  computeRadial();
  buildNodeRings();
  updateHUD();
  if (playSound) playBell(params.m, params.n);
}

mSlider.addEventListener('input', () => {
  params.m = parseInt(mSlider.value, 10);
  params.auto = false;
  autoBtn.classList.remove('on');
  autoBtn.textContent = '◌ 自动演化';
  applyMode(true);
});

nSlider.addEventListener('input', () => {
  params.n = parseInt(nSlider.value, 10);
  params.auto = false;
  autoBtn.classList.remove('on');
  autoBtn.textContent = '◌ 自动演化';
  applyMode(true);
});

autoBtn.addEventListener('click', () => {
  params.auto = !params.auto;
  autoBtn.classList.toggle('on', params.auto);
  autoBtn.textContent = params.auto ? '◉ 自动演化' : '◌ 自动演化';
});

audioBtn.addEventListener('click', () => {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  audioOn = !audioOn;
  audioBtn.classList.toggle('on', audioOn);
  audioBtn.textContent = audioOn ? '♪ 音效开' : '♪ 音效';

  if (masterGain && AC) {
    masterGain.gain.cancelScheduledValues(AC.currentTime);
    masterGain.gain.setTargetAtTime(audioOn ? 0.5 : 0.0, AC.currentTime, 0.4);
  }
});

/* =========================================================
   13. 动画循环
   ========================================================= */
const clock = new THREE.Clock();
const stars = scene.getObjectByName('stars');

let elapsed = 0;
let autoTimer = 0;
const AUTO_INTERVAL = 2.8;

let mx = 0, my = 0;
addEventListener('mousemove', e => {
  mx = (e.clientX / innerWidth) * 2 - 1;
  my = (e.clientY / innerHeight) * 2 - 1;
});

applyMode(false);

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;

  /* ---------- 自动演化：遍历 (m, n) ---------- */
  if (params.auto) {
    autoTimer += dt;
    if (autoTimer >= AUTO_INTERVAL) {
      autoTimer = 0;

      let nm = params.m;
      let nn = params.n + 1;

      if (nn > 4) {
        nn = 1;
        nm += 1;
        if (nm > 6) { nm = 0; nn = 1; }
      }

      params.m = nm;
      params.n = nn;
      mSlider.value = nm;
      nSlider.value = nn;
      applyMode(true);
    }
  }

  /* ---------- 时间振荡 ---------- */
  const omega = 1.55;
  const phase = Math.cos(t * omega);

  /* ---------- 更新鼓面 ---------- */
  const pos = posAttr.array;
  const col = colAttr.array;

  let vi = 0;
  for (let i = 0; i <= RADIAL_SEG; i++) {
    const rv = radialVals[i] * phase;

    for (let j = 0; j <= ANGULAR_SEG; j++) {
      const val = rv * angularVals[j];

      // 位移
      pos[vi*3 + 1] = val * AMP_SCALE;

      // 颜色：蓝 → 青 → 绿 → 黄 → 红
      const t01 = val * 0.5 + 0.5;
      const hue = 0.60 - t01 * 0.60;
      const sat = 0.95;
      const lig = 0.34 + Math.abs(val) * 0.32;

      hsl2rgb(hue, sat, lig, rgbOut);
      col[vi*3]     = rgbOut[0];
      col[vi*3 + 1] = rgbOut[1];
      col[vi*3 + 2] = rgbOut[2];

      vi++;
    }
  }

  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;

  /* ---------- 节圆脉动 ---------- */
  for (let k = 0; k < nodeMats.length; k++) {
    const nm = nodeMats[k];
    nm.mat.opacity = nm.base * (0.55 + 0.45 * Math.sin(t * 2.1 + nm.phase));
  }

  /* ---------- 边缘圆环呼吸 ---------- */
  edgeRing.material.opacity = 0.42 + 0.22 * Math.sin(t * 1.6);

  /* ---------- 整体旋转（缓慢） ---------- */
  discMesh.rotation.y = t * 0.13;
  edgeRing.rotation.y = t * 0.13;
  nodeGroup.rotation.y = t * 0.13;

  // 倾角微动
  const tilt = Math.sin(t * 0.22) * 0.10;
  discMesh.rotation.x = tilt;
  edgeRing.rotation.x = tilt;
  nodeGroup.rotation.x = tilt;

  /* ---------- 星尘 ---------- */
  if (stars) {
    stars.rotation.y = t * 0.009;
    stars.rotation.x = Math.sin(t * 0.038) * 0.06;
  }

  /* ---------- 背景辉光呼吸 ---------- */
  bgGlow.material.opacity = 0.48 + 0.10 * Math.sin(t * 0.55);
  bgGlow.scale.setScalar(12.5 + Math.sin(t * 0.42) * 0.7);

  /* ---------- 相机视差 ---------- */
  const camR = 3.45;
  const camA = t * 0.055;
  const px = Math.cos(camA) * camR * 0.62 + mx * 0.42;
  const pz = Math.sin(camA) * camR * 0.62 + 0.95;
  const py = 1.75 + Math.sin(t * 0.19) * 0.22 - my * 0.36;

  camera.position.x += (px - camera.position.x) * 0.035;
  camera.position.y += (py - camera.position.y) * 0.035;
  camera.position.z += (pz - camera.position.z) * 0.035;
  camera.lookAt(0, 0, 0);

  composer.render();
}

renderer.setAnimationLoop(animate);

/* =========================================================
   14. 自适应
   ========================================================= */
addEventListener('resize', () => {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
});
</script>
