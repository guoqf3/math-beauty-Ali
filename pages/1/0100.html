<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相位调制空间编织 · 多谐曲线</title>
    <style>
        :root {
            --bg: #03020f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: clamp(16px, 3.5vh, 42px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #title-overlay h1 {
            color: #e1d0b5;
            font-size: clamp(1.2rem, 2.4vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 28px rgba(215, 180, 130, 0.55), 0 0 75px rgba(190, 150, 100, 0.25);
            margin: 0;
        }
        #title-overlay .subtitle {
            color: #bda78c;
            font-size: clamp(0.7rem, 1.2vw, 0.95rem);
            letter-spacing: 0.06em;
            margin-top: 0.3em;
            text-shadow: 0 0 14px rgba(180, 140, 100, 0.4);
        }

        #formula-overlay {
            position: fixed;
            bottom: clamp(24px, 4.5vh, 54px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(15, 11, 20, 0.72);
            border: 1px solid rgba(170, 145, 115, 0.28);
            border-radius: 12px;
            padding: clamp(10px, 1.4vh, 16px) clamp(16px, 3vw, 28px);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        #formula-overlay .formula-main {
            color: #f2dec5;
            font-size: clamp(0.8rem, 1.35vw, 1.15rem);
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a6947c;
            font-size: clamp(0.62rem, 0.95vw, 0.82rem);
            letter-spacing: 0.03em;
            margin-top: 0.25em;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.05em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>相位调制空间编织</h1>
        <div class="subtitle">Phase Modulated Weaving · Multiharmonic Curves</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                x<sub>j</sub> = A sin(2t + α<sub>j</sub> sin(5t))<br>
                y<sub>j</sub> = B cos(3t + β<sub>j</sub> cos(4t))<br>
                z<sub>j</sub> = C sin(4t + γ<sub>j</sub> sin(3t))
            </div>
            <div class="formula-detail">
                t ∈ [0, 2π] | A,B,C ∈ ℝ | α,β,γ ∈ [0, π] | j = 1…12
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#03020f');
        scene.fog = new THREE.Fog('#03020f', 5.5, 18);

        const camera = new THREE.PerspectiveCamera(
            46,
            container.clientWidth / container.clientHeight,
            0.3,
            26
        );
        camera.position.set(0, 0.4, 6.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight('#202040', 0.4));

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const totalPoints = 1600; // 每条曲线的采样点数
        const allLines = [];

        /**
         * 生成相位调制空间曲线顶点
         * @param {number} alpha - 调制相位参数
         * @param {number} beta
         * @param {number} gamma
         * @param {number} scale - 整体缩放
         */
        function generatePhaseModCurve(alpha, beta, gamma, scale = 1.0) {
            const A = 1.5;
            const B = 1.4;
            const C = 1.3;
            const vertices = new Float32Array(totalPoints * 3);
            for (let i = 0; i < totalPoints; i++) {
                const t = (i / (totalPoints - 1)) * Math.PI * 2;

                const x = scale * A * Math.sin(2 * t + alpha * Math.sin(5 * t));
                const y = scale * B * Math.cos(3 * t + beta * Math.cos(4 * t));
                const z = scale * C * Math.sin(4 * t + gamma * Math.sin(3 * t));

                vertices[i * 3] = x;
                vertices[i * 3 + 1] = y;
                vertices[i * 3 + 2] = z;
            }
            return vertices;
        }

        function createLine(vertices, colorHSL, opacity = 0.78) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0); // 初始隐藏

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: true,
                depthTest: true,
            });

            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // ==================== 生成12条曲线，各具不同的调制参数 ====================
        const curveCount = 12;
        for (let j = 0; j < curveCount; j++) {
            // 调制参数均匀分布
            const alpha = (j / curveCount) * Math.PI * 0.8 + 0.2;
            const beta  = ((j + 1) / curveCount) * Math.PI * 0.7 + 0.3;
            const gamma = ((j + 2) / curveCount) * Math.PI * 0.75 + 0.15;

            const vertices = generatePhaseModCurve(alpha, beta, gamma, 0.68);
            // 色相沿色环均匀分布
            const hue = (j / curveCount) * 0.85;
            const color = { h: hue, s: 0.85, l: 0.60 };
            const line = createLine(vertices, color, 0.76);
            mainGroup.add(line);
            allLines.push(line);
        }

        console.log(`✅ 已生成 ${curveCount} 条相位调制空间曲线`);

        // ==================== 动画状态机 ====================
        const CYCLE_TOTAL = 7.0;    // 出现3s + 停顿1s + 消失3s
        const APPEAR_TIME = 3.0;
        const PAUSE_TIME = 1.0;
        const DISAPPEAR_TIME = 3.0;

        let animationStartTime = null;
        let firstFrameDone = false;

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInCubic(t) { return t * t * t; }

        function getProgress(elapsedSeconds) {
            const cycle = elapsedSeconds % CYCLE_TOTAL;
            if (cycle < APPEAR_TIME) {
                const t = cycle / APPEAR_TIME;
                return { progress: easeOutCubic(t), phase: 'appear' };
            } else if (cycle < APPEAR_TIME + PAUSE_TIME) {
                return { progress: 1.0, phase: 'pause' };
            } else {
                const t = (cycle - APPEAR_TIME - PAUSE_TIME) / DISAPPEAR_TIME;
                return { progress: 1.0 - easeInCubic(t), phase: 'disappear' };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            // 第一帧强制渲染空白，避免初始黑屏或错乱
            if (animationStartTime === null) {
                animationStartTime = timestamp;
                allLines.forEach(line => {
                    line.visible = false;
                    if (line.geometry) line.geometry.setDrawRange(0, 0);
                });
                renderer.render(scene, camera);
                firstFrameDone = true;
                return;
            }

            const elapsed = (timestamp - animationStartTime) / 1000;
            const { progress } = getProgress(elapsed);
            const drawCount = Math.floor(progress * totalPoints);
            const shouldBeVisible = drawCount >= 2;

            // 批量更新所有线条的绘制范围
            for (let i = 0; i < allLines.length; i++) {
                const line = allLines[i];
                if (!line || !line.geometry) continue;
                const maxPts = line.geometry.attributes.position.count;
                const lineDraw = Math.min(drawCount, maxPts);
                if (shouldBeVisible && lineDraw >= 2) {
                    line.visible = true;
                    line.geometry.setDrawRange(0, lineDraw);
                } else {
                    line.visible = false;
                    line.geometry.setDrawRange(0, 0);
                }
            }

            // 整体缓慢旋转，展现空间编织
            const rotY = elapsed * 0.13;
            const rotX = Math.sin(elapsed * 0.22) * 0.07;
            const rotZ = Math.cos(elapsed * 0.28) * 0.06;
            mainGroup.rotation.set(rotX, rotY, rotZ);

            // 相机轻柔晃动，增强立体感
            camera.position.x = Math.sin(elapsed * 0.17) * 0.25;
            camera.position.y = 0.4 + Math.cos(elapsed * 0.23) * 0.25;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 相位调制空间编织动画启动');
        console.log(`   - 曲线数量: ${curveCount}`);
        console.log(`   - 采样点/曲线: ${totalPoints}`);
        console.log(`   - 动画周期: ${CYCLE_TOTAL}s (出现${APPEAR_TIME}s + 停顿${PAUSE_TIME}s + 消失${DISAPPEAR_TIME}s)`);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
