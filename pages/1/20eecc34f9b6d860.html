<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>公式孵化器 · Formula Hatchery</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  /* ============ HUD ============ */
  #hud{
    position:fixed;top:0;left:0;right:0;
    padding:16px 22px;
    display:flex;justify-content:space-between;align-items:flex-start;
    z-index:20;pointer-events:none;
    opacity:0;animation:fade 1.2s 0.3s ease forwards;
  }
  .hud-block{display:flex;flex-direction:column;gap:4px;}
  .hud-block.right{text-align:right;align-items:flex-end;}

  .hud-en{
    font-size:8px;letter-spacing:.48em;text-indent:.48em;
    color:rgba(140,200,255,.38);font-weight:300;
  }
  .hud-title{
    font-size:clamp(14px,1.8vw,18px);
    font-weight:300;letter-spacing:.14em;
    color:rgba(220,235,255,.96);
  }
  .hud-sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;
    color:rgba(170,200,245,.52);
  }
  .hud-sub b{color:rgba(140,225,255,.94);font-weight:600;}

  .hud-count{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(18px,2.4vw,26px);
    font-weight:200;letter-spacing:.04em;
    color:rgba(200,235,255,.96);
    line-height:1;
    filter:drop-shadow(0 0 14px rgba(120,200,255,.45));
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), color .3s;
  }
  .hud-count.pop{
    transform:scale(1.22);
    color:rgba(180,255,220,.98);
  }
  @keyframes fade{to{opacity:1;}}

  /* ============ 收藏图鉴 ============ */
  #collection{
    position:fixed;
    top:70px;right:18px;
    display:flex;flex-direction:column;gap:5px;
    z-index:20;pointer-events:none;
    opacity:0;animation:fade 1.2s 1.0s ease forwards;
  }
  .col-item{
    display:flex;align-items:center;gap:8px;
    padding:6px 11px;
    border-radius:9px;
    background:rgba(16,24,48,.62);
    border:1px solid rgba(120,155,230,.18);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.08em;
    color:rgba(180,200,245,.32);
    transition:.5s cubic-bezier(.34,1.4,.64,1);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    max-width:170px;
  }
  .col-item .ic{
    width:14px;height:14px;border-radius:50%;
    background:rgba(100,120,180,.24);
    flex-shrink:0;
    transition:.5s;
    position:relative;
  }
  .col-item .ic::after{
    content:'?';
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;
    color:rgba(150,170,220,.42);
  }
  .col-item.on{
    color:rgba(255,225,180,.98);
    border-color:rgba(255,200,120,.62);
    background:rgba(70,50,20,.72);
    box-shadow:0 0 20px rgba(255,190,90,.42);
  }
  .col-item.on .ic{
    background:radial-gradient(circle at 35% 35%,var(--c1),var(--c2));
    box-shadow:0 0 10px var(--c2);
  }
  .col-item.on .ic::after{display:none;}
  .col-item .nm{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ============ 公式栏 ============ */
  #formulaBar{
    position:fixed;bottom:0;left:0;right:0;
    padding:0 16px 20px;
    z-index:20;
    opacity:0;animation:fade 1.2s 1.2s ease forwards;
    pointer-events:none;
  }
  #formulaLabel{
    text-align:center;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.34em;
    color:rgba(160,200,245,.42);
    margin-bottom:10px;
  }
  #formulaScroll{
    display:flex;gap:10px;
    justify-content:flex-start;
    overflow-x:auto;
    padding:6px 4px 10px;
    pointer-events:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  #formulaScroll::-webkit-scrollbar{display:none;}

  .fcard{
    flex-shrink:0;
    min-width:150px;
    padding:12px 14px;
    border-radius:13px;
    background:linear-gradient(150deg,rgba(40,60,110,.72),rgba(22,32,66,.62));
    border:1.5px solid rgba(120,170,255,.30);
    box-shadow:
      0 8px 22px rgba(0,0,0,.42),
      inset 0 1px 0 rgba(180,215,255,.18);
    cursor:pointer;
    transition:.26s cubic-bezier(.34,1.4,.64,1);
    position:relative;
    overflow:hidden;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    text-align:left;
  }
  .fcard::before{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(140deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 42%);
    pointer-events:none;
  }
  .fcard:hover{
    transform:translateY(-4px);
    border-color:rgba(180,220,255,.72);
    box-shadow:
      0 14px 32px rgba(0,0,0,.52),
      0 0 26px rgba(100,170,255,.42),
      inset 0 1px 0 rgba(200,230,255,.28);
  }
  .fcard:active{transform:translateY(-1px) scale(.98);}
  .fcard.disabled{
    opacity:.42;
    cursor:not-allowed;
    transform:none;
    box-shadow:0 6px 18px rgba(0,0,0,.32);
  }
  .fcard.disabled:hover{transform:none;border-color:rgba(120,170,255,.30);}

  .fcard .ftag{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:7.5px;letter-spacing:.34em;
    color:rgba(160,200,245,.42);
    margin-bottom:6px;
  }
  .fcard .fex{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:14px;font-weight:500;
    letter-spacing:.04em;
    color:rgba(220,238,255,.98);
    margin-bottom:5px;
    text-shadow:0 0 14px rgba(120,200,255,.48);
  }
  .fcard .fdesc{
    font-size:9.5px;
    letter-spacing:.06em;
    line-height:1.5;
    color:rgba(180,200,245,.52);
  }
  .fcard .frarity{
    position:absolute;
    top:10px;right:12px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:7.5px;letter-spacing:.18em;
  }
  .fcard .frarity.common{color:rgba(150,190,240,.52);}
  .fcard .frarity.rare{color:rgba(120,225,255,.86);}
  .fcard .frarity.epic{color:rgba(255,205,120,.94);}
  .fcard.hatched .fex{color:rgba(255,225,170,.98);text-shadow:0 0 16px rgba(255,190,100,.55);}

  /* ============ 音频指示 ============ */
  #audioDot{
    position:fixed;bottom:0;right:16px;
    padding-bottom:16px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.20em;
    color:rgba(160,200,240,.30);
    display:flex;align-items:center;gap:6px;
    opacity:0;animation:fade 1.2s 1.6s ease forwards;
    z-index:20;pointer-events:none;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }
  #audioDot.on{color:rgba(160,220,200,.52);}

  /* ============ Toast ============ */
  #toast{
    position:fixed;
    top:38%;left:50%;
    transform:translate(-50%,-50%) scale(.86);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(15px,2vw,22px);
    font-weight:300;letter-spacing:.24em;
    color:rgba(180,255,220,.98);
    text-shadow:0 0 30px rgba(120,240,190,.85);
    opacity:0;pointer-events:none;
    transition:opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
    z-index:100;
    white-space:nowrap;
    text-align:center;
    padding:14px 28px;
    border-radius:14px;
    background:rgba(8,20,16,.72);
    border:1px solid rgba(140,240,190,.42);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #toast.rare{
    color:rgba(255,235,160,.98);
    border-color:rgba(255,205,120,.72);
    background:rgba(50,32,12,.72);
    text-shadow:0 0 30px rgba(255,200,100,.95);
  }

  @media (max-width:720px){
    #hud{padding:10px 14px;}
    .hud-en{display:none;}
    #collection{top:60px;right:12px;}
    .col-item{font-size:8px;padding:5px 8px;max-width:130px;}
    .col-item .ic{width:11px;height:11px;}
    #formulaBar{padding:0 10px 14px;}
    .fcard{min-width:130px;padding:10px 12px;border-radius:11px;}
    .fcard .fex{font-size:12.5px;}
    .fcard .fdesc{font-size:8.5px;}
    #audioDot{right:12px;padding-bottom:12px;font-size:7.5px;}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-block">
    <div class="hud-en">FORMULA HATCHERY</div>
    <div class="hud-title">公式孵化器</div>
    <div class="hud-sub">已孵化 <b id="hatchedCount">0</b> / <b id="totalCount">6</b></div>
  </div>
  <div class="hud-block right">
    <div class="hud-count" id="eggCount">0</div>
    <div class="hud-sub">孵化次数</div>
  </div>
</div>

<div id="collection"></div>

<div id="formulaBar">
  <div id="formulaLabel">选择公式 · 孵化宠物蛋</div>
  <div id="formulaScroll"></div>
</div>

<div id="audioDot">
  <span class="dot"></span>
  <span>背景音 · 交互音</span>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0;
let BASE_R = 100;

/* =========================================================
   宠物定义
   ========================================================= */
const PETS = [
  {
    id: 'sin',
    name: '波动兽',
    formula: 'y = sin(x)',
    desc: '正弦周期起伏',
    hue: 195,
    rarity: 'common',
    body: 'wave'
  },
  {
    id: 'phi',
    name: '螺旋兽',
    formula: 'r = φ^θ',
    desc: '黄金比例生长',
    hue: 42,
    rarity: 'rare',
    body: 'spiral'
  },
  {
    id: 'rose',
    name: '花瓣兽',
    formula: 'r = cos(3θ)',
    desc: '三叶玫瑰绽放',
    hue: 320,
    rarity: 'common',
    body: 'rose'
  },
  {
    id: 'star',
    name: '星芒兽',
    formula: 'r = e^(|θ|)',
    desc: '指数放射尖刺',
    hue: 22,
    rarity: 'rare',
    body: 'star'
  },
  {
    id: 'circle',
    name: '圆点兽',
    formula: 'x² + y² = r²',
    desc: '同心圆之完美',
    hue: 260,
    rarity: 'common',
    body: 'circle'
  },
  {
    id: 'lissajous',
    name: '扭结兽',
    formula: 'x=sin(3t), y=sin(2t)',
    desc: '利萨如缠绕',
    hue: 150,
    rarity: 'epic',
    body: 'lissajous'
  }
];

/* 稀有度显示文本 */
const RARITY_TEXT = {
  common: '普通',
  rare: '稀有',
  epic: '传说'
};

/* =========================================================
   游戏状态
   ========================================================= */
const game = {
  hatched: [],
  eggCount: 0,
  phase: 'idle',        /* idle / charging / cracking / burst / emerging / active */
  phaseT: 0,
  currentPet: null,
  currentFormula: null,
  burstX: 0,
  burstY: 0,
  petScale: 0,
  petRotation: 0,
  eggShake: 0,
  eggGlow: 0,
  crackCount: 0,
  flash: 0,
  hatchQueue: []
};

/* =========================================================
   音效系统
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let ambienceOn = false;
let bubbleTimer = null;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.48, ac.currentTime, 1.6);

  startAmbience();
  scheduleBubble();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioDot(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioDot(true);
  }
}

/* ---- 背景：温暖氛围 ---- */
function startAmbience(){
  if (ambienceOn) return;
  ambienceOn = true;
  const now = ac.currentTime;

  const o1 = ac.createOscillator();
  o1.type = 'sine';
  o1.frequency.value = 55;

  const o2 = ac.createOscillator();
  o2.type = 'sine';
  o2.frequency.value = 82.4;

  const o3 = ac.createOscillator();
  o3.type = 'triangle';
  o3.frequency.value = 110;

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 340;
  lp.Q.value = 1.4;

  const g = ac.createGain();
  g.gain.value = 0;
  g.gain.setTargetAtTime(0.026, now, 3.0);

  const g3 = ac.createGain();
  g3.gain.value = 0.14;

  o1.connect(lp);
  o2.connect(lp);
  o3.connect(g3);
  g3.connect(lp);
  lp.connect(g);
  g.connect(master);

  o1.start(); o2.start(); o3.start();

  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.046;
  const lg = ac.createGain();
  lg.gain.value = 0.012;
  lfo.connect(lg);
  lg.connect(g.gain);
  lfo.start();

  const flfo = ac.createOscillator();
  flfo.frequency.value = 0.034;
  const flg = ac.createGain();
  flg.gain.value = 120;
  flfo.connect(flg);
  flg.connect(lp.frequency);
  flfo.start();
}

/* ---- 气泡音 ---- */
function playBubble(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const f0 = 280 + Math.random() * 460;
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f0 * 1.7, now + 0.06);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.010 + Math.random() * 0.006, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.10);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.12);
}

function scheduleBubble(){
  if (bubbleTimer) clearTimeout(bubbleTimer);
  const wait = 1600 + Math.random() * 3200;
  bubbleTimer = setTimeout(function(){
    if (audioReady && ac && ac.state === 'running'){
      playBubble();
    }
    scheduleBubble();
  }, wait);
}

/* ---- 选择公式：点击音 ---- */
function playSelect(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(660, now);
  osc.frequency.exponentialRampToValueAtTime(990, now + 0.08);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.020, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.14);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.16);
}

/* ---- 孵化中：上升音 ---- */
function playCharging(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(220, now);
  osc.frequency.exponentialRampToValueAtTime(880, now + 1.4);

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(600, now);
  lp.frequency.exponentialRampToValueAtTime(2800, now + 1.4);
  lp.Q.value = 4.5;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.026, now + 0.20);
  g.gain.setValueAtTime(0.026, now + 1.0);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 1.5);

  osc.connect(lp);
  lp.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 1.6);

  /* 颤音 */
  const vib = ac.createOscillator();
  vib.frequency.value = 9;
  const vg = ac.createGain();
  vg.gain.value = 24;
  vib.connect(vg);
  vg.connect(osc.frequency);
  vib.start(now);
  vib.stop(now + 1.6);
}

/* ---- 孵化完成：上行和弦 ---- */
function playHatch(rarity){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  let notes;
  if (rarity === 'epic'){
    notes = [392.00, 523.25, 659.25, 783.99, 1046.50, 1318.51];
  } else if (rarity === 'rare'){
    notes = [392.00, 523.25, 659.25, 783.99];
  } else {
    notes = [440.00, 554.37, 659.25];
  }

  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.075;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.042, t0 + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.8);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 2.0);

    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = notes[i] * 2;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.03);
    g2.gain.linearRampToValueAtTime(0.012, t0 + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.3);
    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.03);
    osc2.stop(t0 + 1.5);
  }
}

/* ---- 光爆 ---- */
function playBurst(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(880, now);
  osc.frequency.exponentialRampToValueAtTime(120, now + 0.42);

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(3600, now);
  lp.frequency.exponentialRampToValueAtTime(280, now + 0.42);
  lp.Q.value = 3.2;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.055, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.55);

  osc.connect(lp);
  lp.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.58);

  /* 噪声冲击 */
  const nl = Math.ceil(ac.sampleRate * 0.32);
  const nbuf = ac.createBuffer(1, nl, ac.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const t = i / nl;
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.2);
  }
  const src = ac.createBufferSource();
  src.buffer = nbuf;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 1800;
  bp.Q.value = 1.4;
  const ng = ac.createGain();
  ng.gain.value = 0.045;
  src.connect(bp);
  bp.connect(ng);
  ng.connect(master);
  src.start(now);
}

/* =========================================================
   画布
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  const topPad = 90;
  const bottomPad = 140;
  const availH = H - topPad - bottomPad;
  CY = topPad + availH * 0.48;

  BASE_R = Math.min(W * 0.14, availH * 0.30, 130);
  BASE_R = Math.max(52, BASE_R);
}
window.addEventListener('resize', resize);

/* =========================================================
   工具函数
   ========================================================= */
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
function easeOutQuart(x){ return 1 - Math.pow(1 - x, 4); }
function easeInCubic(x){ return x * x * x; }
function easeInOutCubic(x){
  return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
}

function hsla(h, s, l, a){
  return 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')';
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* =========================================================
   粒子系统
   ========================================================= */
const particles = [];

function spawnParticles(x, y, count, hue, speed){
  const sp = speed || 220;
  for (let i = 0; i < count; i++){
    const a = Math.random() * TAU;
    const v = 60 + Math.random() * sp;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v,
      life: 1,
      decay: 1.2 + Math.random() * 1.4,
      size: 1.4 + Math.random() * 2.8,
      hue: hue + (Math.random() - 0.5) * 40
    });
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= p.decay * dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.vy += 80 * dt;
  }
}

function drawParticles(){
  if (particles.length === 0) return;

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const a = p.life * p.life * 0.92;
    const r = p.size * p.life;

    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4.5);
    g.addColorStop(0.00, hsla(p.hue, 100, 92, a));
    g.addColorStop(0.42, hsla(p.hue, 100, 72, a * 0.32));
    g.addColorStop(1.00, hsla(p.hue, 100, 62, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(t){
  const bg = ctx.createRadialGradient(
    CX, CY, 0,
    CX, CY, Math.max(W, H) * 0.92
  );
  bg.addColorStop(0.00, '#0a0a1c');
  bg.addColorStop(0.42, '#050612');
  bg.addColorStop(1.00, '#010106');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星点 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++){
    const sx = ((i * 137.5 + t * 8) % W);
    const sy = ((i * 97.3 + t * 3) % H);
    const a = 0.06 + 0.18 * Math.sin(t * 1.1 + i * 1.7);
    if (a < 0.02) continue;
    ctx.fillStyle = 'rgba(200, 225, 255, ' + a + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, 1.1, 0, TAU);
    ctx.fill();
  }

  /* 中心柔光 */
  const hue = game.currentPet ? game.currentPet.hue : 220;
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.min(W, H) * 0.68);
  g.addColorStop(0.00, hsla(hue, 90, 58, 0.075));
  g.addColorStop(0.42, hsla(hue, 90, 50, 0.028));
  g.addColorStop(1.00, hsla(hue, 90, 48, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：蛋
   ========================================================= */
function drawEgg(t){
  const shakeX = game.eggShake * Math.sin(t * 34);
  const shakeY = game.eggShake * Math.cos(t * 28) * 0.6;

  ctx.save();
  ctx.translate(CX + shakeX, CY + shakeY);

  const R = BASE_R;
  const rx = R * 0.78;
  const ry = R * 1.06;

  /* 光晕 */
  if (game.eggGlow > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 3.2);
    gg.addColorStop(0.00, hsla(game.currentPet ? game.currentPet.hue : 220, 100, 78, game.eggGlow * 0.45));
    gg.addColorStop(0.42, hsla(game.currentPet ? game.currentPet.hue : 220, 100, 62, game.eggGlow * 0.18));
    gg.addColorStop(1.00, hsla(game.currentPet ? game.currentPet.hue : 220, 100, 55, 0));
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(0, 0, R * 3.2, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 蛋身 */
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);

  const eggGrad = ctx.createRadialGradient(
    -rx * 0.32, -ry * 0.40, 0,
    0, 0, ry * 1.05
  );
  eggGrad.addColorStop(0.00, 'rgba(250, 244, 234, 1)');
  eggGrad.addColorStop(0.35, 'rgba(220, 210, 232, 1)');
  eggGrad.addColorStop(0.72, 'rgba(170, 168, 210, 1)');
  eggGrad.addColorStop(1.00, 'rgba(110, 118, 168, 1)');
  ctx.fillStyle = eggGrad;
  ctx.fill();

  /* 蛋壳斑纹 */
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  ctx.clip();

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 12; i++){
    const ang = i / 12 * TAU + t * 0.08;
    const rr = R * (0.35 + (i % 3) * 0.20);
    const px = Math.cos(ang) * rr * 0.7;
    const py = Math.sin(ang) * rr * 0.9 + Math.sin(t * 0.5 + i) * 6;
    const sr = R * (0.10 + (i % 4) * 0.03);

    const sg = ctx.createRadialGradient(px, py, 0, px, py, sr);
    sg.addColorStop(0.00, hsla(game.currentPet ? game.currentPet.hue : 220, 90, 82, 0.24));
    sg.addColorStop(1.00, hsla(game.currentPet ? game.currentPet.hue : 220, 90, 68, 0));
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(px, py, sr, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  /* 高光 */
  ctx.beginPath();
  ctx.ellipse(-rx * 0.36, -ry * 0.42, rx * 0.24, ry * 0.18, -0.5, 0, TAU);
  const hl = ctx.createRadialGradient(
    -rx * 0.36, -ry * 0.42, 0,
    -rx * 0.36, -ry * 0.42, rx * 0.24
  );
  hl.addColorStop(0.00, 'rgba(255, 255, 255, 0.72)');
  hl.addColorStop(1.00, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = hl;
  ctx.fill();

  /* 蛋壳边缘 */
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  ctx.strokeStyle = 'rgba(200, 220, 255, 0.34)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* 裂纹 */
  if (game.crackCount > 0){
    ctx.strokeStyle = 'rgba(255, 200, 140, 0.92)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255, 180, 100, 0.85)';
    ctx.shadowBlur = 8;

    for (let k = 0; k < game.crackCount; k++){
      const seed = k * 1.7;
      const baseAng = seed % TAU;
      const startR = R * (0.1 + (seed % 0.3));

      ctx.beginPath();
      let px = Math.cos(baseAng) * startR * 0.6;
      let py = Math.sin(baseAng) * startR * 0.8;
      ctx.moveTo(px, py);

      let ang = baseAng;
      for (let s = 0; s < 5; s++){
        ang += (Math.random() - 0.5) * 0.6 + 0.1;
        const segLen = R * (0.10 + Math.random() * 0.14);
        px += Math.cos(ang) * segLen;
        py += Math.sin(ang) * segLen;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

/* =========================================================
   绘制：宠物
   ========================================================= */
function drawPetBody(pet, R, t){
  const hue = pet.hue;

  /* 身体轮廓 */
  const N = 120;
  const bodyPts = [];

  for (let i = 0; i <= N; i++){
    const th = i / N * TAU;
    let r;

    switch (pet.body){
      case 'wave':
        r = R * (1 + 0.14 * Math.sin(5 * th + t * 2.0));
        break;
      case 'spiral':
        r = R * (0.78 + 0.22 * Math.abs(Math.cos(th + t * 0.3)));
        break;
      case 'rose':
        r = R * (0.20 + 0.80 * Math.abs(Math.cos(3 * th)));
        break;
      case 'star':
        r = R * (0.55 + 0.45 * Math.abs(Math.cos(7 * th)));
        break;
      case 'circle':
        r = R * (1 + 0.045 * Math.sin(3 * th + t * 1.6));
        break;
      case 'lissajous':
        r = R * (0.72 + 0.28 * Math.abs(Math.cos(5 * th + t * 1.2)));
        break;
      default:
        r = R;
    }

    bodyPts.push({
      x: Math.cos(th) * r,
      y: Math.sin(th) * r
    });
  }

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const glowR = R * 2.4;
  const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
  gg.addColorStop(0.00, hsla(hue, 100, 78, 0.42));
  gg.addColorStop(0.42, hsla(hue, 100, 62, 0.14));
  gg.addColorStop(1.00, hsla(hue, 100, 55, 0));
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(0, 0, glowR, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 身体填充 */
  ctx.beginPath();
  ctx.moveTo(bodyPts[0].x, bodyPts[0].y);
  for (let i = 1; i < bodyPts.length; i++){
    ctx.lineTo(bodyPts[i].x, bodyPts[i].y);
  }
  ctx.closePath();

  const bodyGrad = ctx.createRadialGradient(
    -R * 0.30, -R * 0.35, 0,
    0, 0, R * 1.15
  );
  bodyGrad.addColorStop(0.00, hsla(hue, 100, 88, 0.98));
  bodyGrad.addColorStop(0.32, hsla(hue, 92, 72, 0.96));
  bodyGrad.addColorStop(0.68, hsla(hue, 88, 54, 0.90));
  bodyGrad.addColorStop(1.00, hsla(hue, 82, 38, 0.88));
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  /* 内部特征纹理 */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(bodyPts[0].x, bodyPts[0].y);
  for (let i = 1; i < bodyPts.length; i++){
    ctx.lineTo(bodyPts[i].x, bodyPts[i].y);
  }
  ctx.closePath();
  ctx.clip();

  ctx.globalCompositeOperation = 'lighter';

  if (pet.body === 'wave'){
    /* 波浪线纹理 */
    for (let k = 0; k < 5; k++){
      const yOff = (k - 2) * R * 0.30;
      ctx.beginPath();
      for (let x = -R * 1.2; x <= R * 1.2; x += R * 0.05){
        const y = yOff + Math.sin(x * 0.14 + t * 2.6 + k * 0.7) * R * 0.12;
        if (x === -R * 1.2) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = hsla(hue + 20, 100, 82, 0.35);
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  } else if (pet.body === 'spiral'){
    /* 黄金螺旋线 */
    const PHI = (1 + Math.sqrt(5)) / 2;
    const B = Math.log(PHI) / (Math.PI * 0.5);
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 200; i++){
      const th = i / 200 * Math.PI * 4.5;
      const rr = R * 0.08 * Math.exp(B * th);
      if (rr > R * 1.4) break;
      const x = Math.cos(th + t * 0.5) * rr;
      const y = Math.sin(th + t * 0.5) * rr;
      if (first){ ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = hsla(48, 100, 84, 0.55);
    ctx.lineWidth = 1.8;
    ctx.stroke();
  } else if (pet.body === 'rose'){
    /* 玫瑰线纹理 */
    for (let k = 0; k < 3; k++){
      const thOff = k / 3 * TAU + t * 0.3;
      ctx.beginPath();
      for (let i = 0; i <= 80; i++){
        const th = i / 80 * TAU;
        const rr = R * 0.72 * Math.abs(Math.cos(3 * (th + thOff)));
        const x = Math.cos(th) * rr;
        const y = Math.sin(th) * rr;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = hsla(hue + 20, 100, 86, 0.42);
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  } else if (pet.body === 'star'){
    /* 放射线 */
    for (let k = 0; k < 14; k++){
      const ang = k / 14 * TAU + t * 0.4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * R * 1.1, Math.sin(ang) * R * 1.1);
      ctx.strokeStyle = hsla(hue + 12, 100, 86, 0.42);
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  } else if (pet.body === 'circle'){
    /* 同心圆 */
    for (let k = 1; k <= 5; k++){
      ctx.beginPath();
      ctx.arc(0, 0, R * k * 0.18, 0, TAU);
      ctx.strokeStyle = hsla(hue + 20, 100, 86, 0.40);
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  } else if (pet.body === 'lissajous'){
    /* 利萨如曲线 */
    ctx.beginPath();
    for (let i = 0; i <= 400; i++){
      const th = i / 400 * TAU;
      const x = Math.sin(3 * th + t * 0.6) * R * 0.80;
      const y = Math.sin(2 * th) * R * 0.80;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = hsla(hue + 20, 100, 86, 0.48);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  /* 轮廓描边 */
  ctx.beginPath();
  ctx.moveTo(bodyPts[0].x, bodyPts[0].y);
  for (let i = 1; i < bodyPts.length; i++){
    ctx.lineTo(bodyPts[i].x, bodyPts[i].y);
  }
  ctx.closePath();
  ctx.strokeStyle = hsla(hue + 20, 100, 88, 0.82);
  ctx.lineWidth = 2.0;
  ctx.stroke();

  /* 眼睛 */
  const eyeY = -R * 0.10;
  const eyeSpacing = R * 0.30;
  const eyeR = R * 0.10;

  for (let side = -1; side <= 1; side += 2){
    const ex = side * eyeSpacing;
    const ey = eyeY;

    /* 眼白 */
    ctx.beginPath();
    ctx.arc(ex, ey, eyeR, 0, TAU);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
    ctx.fill();

    /* 瞳孔 */
    const lookX = Math.sin(t * 0.8 + side * 0.5) * eyeR * 0.32;
    const lookY = Math.cos(t * 0.6) * eyeR * 0.20;

    ctx.beginPath();
    ctx.arc(ex + lookX, ey + lookY, eyeR * 0.52, 0, TAU);
    ctx.fillStyle = 'rgba(10, 16, 32, 0.94)';
    ctx.fill();

    /* 高光 */
    ctx.beginPath();
    ctx.arc(ex + lookX - eyeR * 0.18, ey + lookY - eyeR * 0.18, eyeR * 0.20, 0, TAU);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.fill();
  }

  /* 腮红 */
  ctx.globalCompositeOperation = 'lighter';
  for (let side = -1; side <= 1; side += 2){
    const bx = side * R * 0.52;
    const by = R * 0.10;
    const bg = ctx.createRadialGradient(bx, by, 0, bx, by, R * 0.18);
    bg.addColorStop(0.00, hsla(hue + 10, 100, 78, 0.42));
    bg.addColorStop(1.00, hsla(hue + 10, 100, 62, 0));
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(bx, by, R * 0.18, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：孵化中的宠物（淡入上升）
   ========================================================= */
function drawEmergingPet(t){
  const pet = game.currentPet;
  if (!pet) return;

  const p = clamp01(game.petScale);
  const eased = easeOutQuart(p);

  ctx.save();
  ctx.translate(CX, CY - (1 - eased) * 30);
  ctx.rotate(game.petRotation);
  ctx.scale(eased, eased);
  ctx.globalAlpha = eased;

  drawPetBody(pet, BASE_R, t);

  ctx.restore();
}

/* =========================================================
   绘制：光爆
   ========================================================= */
function drawBurst(){
  if (game.phase !== 'burst') return;

  const p = clamp01(game.phaseT / 0.55);
  const R = BASE_R * (1 + p * 8);
  const a = (1 - p) * (1 - p) * 0.92;

  ctx.globalCompositeOperation = 'lighter';

  /* 多圈扩散 */
  for (let k = 0; k < 3; k++){
    const rr = R * (0.5 + k * 0.35);
    const aa = a * (1 - k * 0.28);
    if (aa < 0.01) continue;

    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, rr);
    g.addColorStop(0.00, hsla(game.currentPet.hue, 100, 92, aa * 0.42));
    g.addColorStop(0.42, hsla(game.currentPet.hue, 100, 74, aa * 0.16));
    g.addColorStop(1.00, hsla(game.currentPet.hue, 100, 62, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(CX, CY, rr, 0, TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   游戏状态更新
   ========================================================= */
function updateGame(dt, t){
  /* 粒子更新 */
  updateParticles(dt);

  if (game.phase === 'idle'){
    game.eggGlow += (0.15 - game.eggGlow) * dt * 3;
    game.eggShake = 0;
  }

  else if (game.phase === 'charging'){
    game.phaseT += dt;
    const p = game.phaseT / 1.4;
    game.eggGlow = Math.min(1, 0.15 + p * 0.85);
    game.eggShake = p * 3.5;

    if (p >= 1){
      game.phase = 'cracking';
      game.phaseT = 0;
      game.crackCount = 0;
    }
  }

  else if (game.phase === 'cracking'){
    game.phaseT += dt;
    game.eggGlow = 1;
    game.eggShake = 3.5 + Math.sin(game.phaseT * 30) * 1.5;

    const newCracks = Math.floor(game.phaseT / 0.18);
    if (newCracks > game.crackCount){
      game.crackCount = Math.min(8, newCracks);
      playBubble();
    }

    if (game.phaseT > 1.4){
      game.phase = 'burst';
      game.phaseT = 0;
      playBurst();
      spawnParticles(CX, CY, 60, game.currentPet.hue, 320);
      game.flash = 1;
    }
  }

  else if (game.phase === 'burst'){
    game.phaseT += dt;
    game.flash *= Math.exp(-6 * dt);

    if (game.phaseT > 0.55){
      game.phase = 'emerging';
      game.phaseT = 0;
      game.petScale = 0;
      game.petRotation = 0;
      playHatch(game.currentPet.rarity);
    }
  }

  else if (game.phase === 'emerging'){
    game.phaseT += dt;
    game.petScale = Math.min(1, game.phaseT / 0.9);
    game.petRotation = (1 - game.petScale) * 0.6 * Math.sin(game.phaseT * 6);

    if (game.phaseT > 0.9){
      game.phase = 'active';
      game.phaseT = 0;
      game.petScale = 1;
      game.petRotation = 0;
      game.flash = 0.6;
    }
  }

  else if (game.phase === 'active'){
    game.phaseT += dt;
    game.flash *= Math.exp(-4 * dt);

    /* 长期待机：宠物缓慢呼吸旋转 */
    if (game.petScale < 1) game.petScale = 1;
  }
}

/* =========================================================
   渲染
   ========================================================= */
function render(t){
  drawBackground(t);

  /* 蛋（未爆开时） */
  if (game.phase !== 'burst' && game.phase !== 'emerging' && game.phase !== 'active'){
    drawEgg(t);
  }

  /* 光爆 */
  drawBurst();

  /* 宠物 */
  if (game.phase === 'emerging' || game.phase === 'active'){
    drawEmergingPet(t);
  }

  /* 粒子 */
  drawParticles();

  /* 全屏闪光 */
  if (game.flash > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 240, 220, ' + (game.flash * 0.42) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    CX, CY, Math.min(W, H) * 0.36,
    CX, CY, Math.max(W, H) * 0.92
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(1, 2, 6, 0.26)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   UI 更新
   ========================================================= */
function updateHUD(){
  const hatchedEl = document.getElementById('hatchedCount');
  const totalEl = document.getElementById('totalCount');
  const eggEl = document.getElementById('eggCount');

  if (hatchedEl) hatchedEl.textContent = game.hatched.length;
  if (totalEl) totalEl.textContent = PETS.length;
  if (eggEl) eggEl.textContent = game.eggCount;
}

function popCount(){
  const el = document.getElementById('eggCount');
  if (!el) return;
  el.classList.add('pop');
  setTimeout(function(){ el.classList.remove('pop'); }, 320);
}

/* ---- 收藏图鉴 ---- */
function buildCollection(){
  const wrap = document.getElementById('collection');
  if (!wrap) return;
  wrap.innerHTML = '';

  for (let i = 0; i < PETS.length; i++){
    const pet = PETS[i];
    const item = document.createElement('div');
    item.className = 'col-item';
    item.dataset.id = pet.id;

    const ic = document.createElement('span');
    ic.className = 'ic';
    ic.style.setProperty('--c1', 'hsl(' + (pet.hue + 20) + ', 100%, 84%)');
    ic.style.setProperty('--c2', 'hsl(' + pet.hue + ', 100%, 62%)');

    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = pet.name;

    item.appendChild(ic);
    item.appendChild(nm);
    wrap.appendChild(item);
  }
}

function markCollection(petId){
  const el = document.querySelector('.col-item[data-id="' + petId + '"]');
  if (el) el.classList.add('on');
}

/* ---- 公式卡片 ---- */
function buildFormulaCards(){
  const wrap = document.getElementById('formulaScroll');
  if (!wrap) return;
  wrap.innerHTML = '';

  for (let i = 0; i < PETS.length; i++){
    const pet = PETS[i];
    const card = document.createElement('div');
    card.className = 'fcard';
    card.dataset.id = pet.id;

    const tag = document.createElement('div');
    tag.className = 'ftag';
    tag.textContent = 'FORMULA';

    const ex = document.createElement('div');
    ex.className = 'fex';
    ex.textContent = pet.formula;

    const desc = document.createElement('div');
    desc.className = 'fdesc';
    desc.textContent = pet.desc;

    const rarity = document.createElement('div');
    rarity.className = 'frarity ' + pet.rarity;
    rarity.textContent = RARITY_TEXT[pet.rarity];

    card.appendChild(tag);
    card.appendChild(ex);
    card.appendChild(desc);
    card.appendChild(rarity);

    if (game.hatched.indexOf(pet.id) >= 0){
      card.classList.add('hatched');
    }

    card.addEventListener('click', function(e){
      e.stopPropagation();
      onFormulaSelect(pet, card);
    });

    wrap.appendChild(card);
  }
}

/* =========================================================
   选择公式
   ========================================================= */
function onFormulaSelect(pet, card){
  if (game.phase !== 'idle' && game.phase !== 'active') return;

  initAudio();

  /* 已有的宠物：重复孵化给提示 */
  if (game.hatched.indexOf(pet.id) >= 0){
    showToast('已收集 · ' + pet.name, false);
    playSelect();
    return;
  }

  /* 开始孵化 */
  game.currentPet = pet;
  game.currentFormula = pet.formula;
  game.phase = 'charging';
  game.phaseT = 0;
  game.crackCount = 0;
  game.eggGlow = 0.15;
  game.eggShake = 0;
  game.petScale = 0;

  game.eggCount++;
  updateHUD();
  popCount();

  playSelect();
  playCharging();

  /* 卡片视觉反馈 */
  card.classList.add('hatched');

  /* 关闭"已收集"标记 */
  if (game.hatched.indexOf(pet.id) < 0){
    game.hatched.push(pet.id);
    markCollection(pet.id);
  }
}

/* =========================================================
   Toast
   ========================================================= */
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(text, isRare){
  toastEl.textContent = text;
  toastEl.classList.toggle('rare', !!isRare);
  toastEl.classList.add('show');

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toastEl.classList.remove('show');
  }, 1800);
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;
let frameCount = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  updateGame(dt, t);
  render(t);

  /* HUD 节流 */
  frameCount++;
  if (frameCount % 6 === 0) updateHUD();
}

/* =========================================================
   初始化
   ========================================================= */
resize();
buildCollection();
buildFormulaCards();
updateHUD();

/* 首次交互初始化音频 */
window.addEventListener('pointerdown', function(){
  initAudio();
}, { once: false });

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    initAudio();
  }
});

requestAnimationFrame(loop);

/* 首次进入的提示 */
setTimeout(function(){
  showToast('选择公式 · 孵化宠物蛋', false);
}, 800);

})();
</script>
