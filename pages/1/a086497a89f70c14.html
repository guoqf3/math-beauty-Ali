<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛伦兹蝶 · Lorenz Butterfly</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#03060d;
    color:#cfe8ff;
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Courier New",monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100vh;height:100dvh;}

  /* ---------- 左侧面板 ---------- */
  .panel{
    width:370px;flex:0 0 370px;
    padding:30px 26px 24px;
    border-right:1px solid rgba(90,200,255,.14);
    background:
      radial-gradient(120% 70% at 0% 0%, rgba(30,90,170,.18), transparent 60%),
      linear-gradient(180deg,#050c18,#02060d);
    display:flex;flex-direction:column;gap:18px;
    overflow-y:auto;
  }
  .panel::-webkit-scrollbar{width:6px;}
  .panel::-webkit-scrollbar-thumb{background:rgba(90,200,255,.25);border-radius:3px;}

  .title{font-size:22px;letter-spacing:.14em;color:#bfeaff;
    text-shadow:0 0 18px rgba(80,190,255,.75),0 0 42px rgba(80,190,255,.35);}
  .subtitle{font-size:10.5px;letter-spacing:.42em;color:#4c86b8;margin-top:6px;text-transform:uppercase;}

  .card{
    border:1px solid rgba(90,200,255,.18);
    border-radius:12px;
    padding:16px 16px 14px;
    background:linear-gradient(180deg,rgba(22,66,120,.18),rgba(10,26,48,.12));
    box-shadow:inset 0 1px 0 rgba(140,220,255,.08), 0 0 26px rgba(30,110,200,.10);
  }
  .card h3{
    font-size:10px;letter-spacing:.28em;color:#5f9dcc;font-weight:400;
    text-transform:uppercase;margin-bottom:12px;
  }

  .eq{
    font-size:14px;line-height:2.0;color:#9fdcff;
    white-space:nowrap;overflow-x:auto;
    text-shadow:0 0 14px rgba(90,200,255,.55);
  }
  .eq + .eq{margin-top:4px;padding-top:4px;border-top:1px dashed rgba(90,200,255,.10);}
  .eq:first-of-type{border-top:none;}
  .eq .v{color:#7ef0ff;font-weight:600;}
  .eq .n{color:#ffb3e6;font-weight:600;}

  .rows{display:flex;flex-direction:column;gap:8px;font-size:12px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#7fb6da;}
  .row b{color:#c9ecff;font-weight:500;}

  .legend{display:flex;flex-direction:column;gap:11px;font-size:12px;color:#7fb6da;line-height:1.55;}
  .legend .item{display:flex;gap:9px;align-items:flex-start;}
  .legend .dot{
    width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:4px;
    background:var(--c);box-shadow:0 0 10px var(--c),0 0 20px var(--c);
  }
  .bar{
    height:8px;border-radius:4px;margin-top:12px;
    background:linear-gradient(to right,
      hsl(245,100%,55%),
      hsl(280,100%,58%),
      hsl(320,100%,58%),
      hsl(355,100%,58%),
      hsl(25,100%,58%));
    box-shadow:0 0 14px rgba(140,120,255,.35), inset 0 0 6px rgba(0,0,0,.4);
  }
  .bar-labels{
    display:flex;justify-content:space-between;
    font-size:10px;color:#4d7fa6;margin-top:6px;letter-spacing:.06em;
  }

  .readout{
    margin-top:auto;
    display:flex;justify-content:space-between;gap:8px;
    font-size:10.5px;letter-spacing:.06em;color:#4d7fa6;
    padding-top:14px;border-top:1px solid rgba(90,200,255,.10);
  }
  .readout b{color:#8fd6ff;font-weight:500;}

  /* ---------- 右侧画布 ---------- */
  .stage{flex:1;position:relative;min-width:0;overflow:hidden;}
  canvas{display:block;position:absolute;inset:0;}

  @media (max-width:880px){
    .app{flex-direction:column;}
    .panel{width:100%;flex:0 0 auto;max-height:46vh;border-right:none;
      border-bottom:1px solid rgba(90,200,255,.14);}
    .readout{margin-top:0;}
    .stage{flex:1;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- 左：公式 -->
  <aside class="panel">
    <div>
      <div class="title">洛伦兹蝶</div>
      <div class="subtitle">Lorenz Butterfly</div>
    </div>

    <div class="card">
      <h3>Lorenz System</h3>
      <div class="eq">d<span class="v">x</span>/dt = <span class="n">σ</span>(<span class="v">y</span> − <span class="v">x</span>)</div>
      <div class="eq">d<span class="v">y</span>/dt = <span class="v">x</span>(<span class="n">ρ</span> − <span class="v">z</span>) − <span class="v">y</span></div>
      <div class="eq">d<span class="v">z</span>/dt = <span class="v">x</span><span class="v">y</span> − <span class="n">β</span><span class="v">z</span></div>
    </div>

    <div class="card">
      <h3>Parameters</h3>
      <div class="rows">
        <div class="row"><span>σ · Prandtl</span><b>10</b></div>
        <div class="row"><span>ρ · Rayleigh</span><b>28</b></div>
        <div class="row"><span>β · 几何因子</span><b>8 / 3</b></div>
        <div class="row"><span>积分方法</span><b>RK4</b></div>
        <div class="row"><span>步长 dt</span><b>0.005</b></div>
      </div>
    </div>

    <div class="card">
      <h3>Color Logic · 速度映射</h3>
      <div class="legend">
        <div class="item">
          <span class="dot" style="--c:#5560ff"></span>
          <span><b style="color:#9fdcff">低速</b> 冷色 —— 蓝 / 紫，涡旋中心的滞留区</span>
        </div>
        <div class="item">
          <span class="dot" style="--c:#ff3ea0"></span>
          <span><b style="color:#9fdcff">中速</b> 品红 —— 穿越双翼的过渡段</span>
        </div>
        <div class="item">
          <span class="dot" style="--c:#ff7a1a"></span>
          <span><b style="color:#9fdcff">高速</b> 暖色 —— 红 / 橙，翼尖的剧烈甩动</span>
        </div>
      </div>
      <div class="bar"></div>
      <div class="bar-labels"><span>slow</span><span>fast</span></div>
    </div>

    <div class="readout">
      <span>t = <b id="rt">0.00</b>s</span>
      <span>|v| = <b id="rv">0</b></span>
      <span>N = <b id="rn">0</b></span>
    </div>
  </aside>

  <!-- 右：Canvas -->
  <main class="stage">
    <canvas id="c"></canvas>
  </main>
</div>

<script>
(() => {
  'use strict';

  /* ============================================================
     洛伦兹系统参数
     ============================================================ */
  const SIGMA = 10;
  const RHO   = 28;
  const BETA  = 8 / 3;

  const DT    = 0.005;   // RK4 步长
  const SUB   = 4;       // 每帧子步数
  const FADE  = 0.005;   // 轨迹衰减系数
  const SPEED_MAX = 150; // 速度→暖色 的归一化上限

  /* ============================================================
     画布
     ============================================================ */
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');

  // 轨迹持久层
  const trail  = document.createElement('canvas');
  const tctx   = trail.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let SCALE = 1;
  let bgGrad = null;
  let particles = [];

  /* ============================================================
     RK4 积分 —— 全程复用局部变量，零对象分配
     ============================================================ */
  function step(p, dt) {
    const x = p.x, y = p.y, z = p.z;
    const h  = dt;
    const h2 = h * 0.5;

    // k1
    const k1x = SIGMA * (y - x);
    const k1y = x * (RHO - z) - y;
    const k1z = x * y - BETA * z;

    // k2
    const xa = x + k1x * h2, ya = y + k1y * h2, za = z + k1z * h2;
    const k2x = SIGMA * (ya - xa);
    const k2y = xa * (RHO - za) - ya;
    const k2z = xa * ya - BETA * za;

    // k3
    const xb = x + k2x * h2, yb = y + k2y * h2, zb = z + k2z * h2;
    const k3x = SIGMA * (yb - xb);
    const k3y = xb * (RHO - zb) - yb;
    const k3z = xb * yb - BETA * zb;

    // k4
    const xc = x + k3x * h, yc = y + k3y * h, zc = z + k3z * h;
    const k4x = SIGMA * (yc - xc);
    const k4y = xc * (RHO - zc) - yc;
    const k4z = xc * yc - BETA * zc;

    const s = h / 6;
    p.x = x + s * (k1x + 2 * k2x + 2 * k3x + k4x);
    p.y = y + s * (k1y + 2 * k2y + 2 * k3y + k4y);
    p.z = z + s * (k1z + 2 * k2z + 2 * k3z + k4z);
  }

  /* 速度大小 |v| = sqrt(ẋ² + ẏ² + ż²) */
  function speedAt(x, y, z) {
    const dx = SIGMA * (y - x);
    const dy = x * (RHO - z) - y;
    const dz = x * y - BETA * z;
    return Math.sqrt(dx * dx + dy * dy + dz * dz);
  }

  /* ============================================================
     粒子初始化：随机撒点 → 预热 → 全部落到吸引子上
     ============================================================ */
  function buildParticles() {
    particles = [];
    const N = Math.round(
      Math.min(Math.max((W * H) / 14000, 32), 72)
    );

    for (let i = 0; i < N; i++) {
      const p = {
        x: (Math.random() - 0.5) * 24,
        y: (Math.random() - 0.5) * 24,
        z: 12 + Math.random() * 24
      };
      // 预热：甩掉瞬态，落入吸引子
      for (let k = 0; k < 1200; k++) step(p, 0.006);
      particles.push(p);
    }
  }

  /* ============================================================
     尺寸 / 投影
     ============================================================ */
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = Math.max(rect.width, 1);
    H = Math.max(rect.height, 1);
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    // 主画布
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // 轨迹画布
    trail.width  = Math.round(W * DPR);
    trail.height = Math.round(H * DPR);
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    tctx.clearRect(0, 0, W, H);

    // 投影比例：x ∈ [-21,21]，z ∈ [0,50]
    SCALE = Math.min(W * 0.90 / 42, H * 0.90 / 54);

    // 深海背景
    bgGrad = ctx.createRadialGradient(
      W * 0.5, H * 0.42, 0,
      W * 0.5, H * 0.50, Math.max(W, H) * 0.86
    );
    bgGrad.addColorStop(0.00, '#0a1426');
    bgGrad.addColorStop(0.42, '#050b16');
    bgGrad.addColorStop(1.00, '#010307');
  }

  /* ============================================================
     主循环
     ============================================================ */
  let lastT = performance.now();
  let T = 0;
  let frame = 0;
  let avgSpeed = 0;

  const $rt = document.getElementById('rt');
  const $rv = document.getElementById('rv');
  const $rn = document.getElementById('rn');

  function loop(now) {
    const dtr = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    T += dtr;

    /* --- 1. 轨迹缓慢衰减 --- */
    tctx.globalCompositeOperation = 'destination-out';
    tctx.fillStyle = 'rgba(0,0,0,' + FADE + ')';
    tctx.fillRect(0, 0, W, H);

    /* --- 2. 逐粒子积分 + 描线 --- */
    tctx.globalCompositeOperation = 'lighter';
    tctx.lineCap = 'round';
    tctx.lineJoin = 'round';

    const cx = W * 0.5;
    const cy = H * 0.5;
    let spdSum = 0;

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      for (let s = 0; s < SUB; s++) {
        const ox = p.x, oy = p.y, oz = p.z;

        // 速度 → 颜色（用积分前的位置采样）
        const sp = speedAt(ox, oy, oz);
        spdSum += sp;

        step(p, DT);

        const t01 = sp > SPEED_MAX ? 1 : sp / SPEED_MAX;

        /* 色相：245°(蓝紫) → 385°(橙红) */
        const hue  = 245 + 140 * t01;
        const light = 45 + 22 * t01;
        const alpha = 0.16 + 0.26 * t01;

        tctx.strokeStyle =
          'hsla(' + hue.toFixed(1) + ',100%,' + light.toFixed(1) + '%,' + alpha.toFixed(3) + ')';
        tctx.lineWidth = 0.9 + 0.9 * t01;

        // x–z 投影：左翼在负 x，右翼在正 x，z 向上
        tctx.beginPath();
        tctx.moveTo(cx + ox * SCALE, cy - (oz - 24) * SCALE);
        tctx.lineTo(cx + p.x * SCALE, cy - (p.z - 24) * SCALE);
        tctx.stroke();
      }
    }

    avgSpeed = spdSum / (particles.length * SUB);

    /* --- 3. 合成到主画布 --- */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(trail, 0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    /* --- 4. 读数 --- */
    if ((frame++ & 9) === 0) {
      $rt.textContent = T.toFixed(2);
      $rv.textContent = avgSpeed.toFixed(0);
      $rn.textContent = particles.length;
    }

    requestAnimationFrame(loop);
  }

  /* ============================================================
     启动
     ============================================================ */
  window.addEventListener('resize', () => {
    resize();
    // 尺寸变化后轨迹错位，清空重来
    tctx.clearRect(0, 0, W, H);
  });

  resize();
  buildParticles();
  $rn.textContent = particles.length;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
