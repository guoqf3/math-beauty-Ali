<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>混沌摆 · 蝴蝶效应</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#04060d;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;touch-action:none;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:32px 40px;opacity:0;
    animation:fade 1.6s 0.2s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,230,.32);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(20px,3vw,36px);
    font-weight:200;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(96deg,#4ae0ff 0%,#7ab8ff 40%,#d090ff 72%,#ff90e0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 28px rgba(110,180,255,.42));
  }
  #title .sub{
    font-size:10px;letter-spacing:.22em;line-height:1.9;
    color:rgba(150,195,235,.28);font-weight:300;
  }

  #stats{
    position:absolute;top:0;right:0;
    padding:32px 40px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.12em;line-height:2.0;
    color:rgba(140,185,225,.28);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .k{color:rgba(180,195,255,.48);}
  #stats .v{color:rgba(255,215,150,.78);}
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(120,165,215,.22);margin-bottom:6px;
  }
  #stats .ca{color:rgba(90,230,255,.90);}
  #stats .cb{color:rgba(255,130,210,.90);}
  #audioDot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:rgba(200,180,255,.22);

  #audioDot.on{
    background:rgba(150,240,180,.9);

  #controls{
    position:absolute;bottom:0;right:0;
    padding:0 40px 26px;
    display:flex;flex-direction:column;gap:14px;
    align-items:flex-end;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
    pointer-events:auto;
  }
  .ctrl-row{
    display:flex;align-items:center;gap:12px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;
  }
  .ctrl-label{
    color:rgba(170,195,235,.58);
    min-width:72px;text-align:right;
  }
  .ctrl-val{
    color:rgba(255,215,150,.92);
    min-width:58px;text-align:right;
    font-weight:500;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:160px;height:3px;
    background:rgba(120,165,225,.18);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:13px;height:13px;border-radius:50%;
    background:rgba(200,225,255,.92);
    border:1px solid rgba(140,190,255,.85);
    box-shadow:0 0 10px rgba(120,180,255,.55);
    cursor:pointer;transition:transform .18s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25);}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;
    background:rgba(200,225,255,.92);
    border:1px solid rgba(140,190,255,.85);
    box-shadow:0 0 10px rgba(120,180,255,.55);
    cursor:pointer;
  }
  .btn{
    font-family:inherit;
    font-size:9.5px;letter-spacing:.20em;text-indent:.20em;
    color:rgba(220,230,255,.85);
    background:rgba(20,30,55,.48);
    border:1px solid rgba(120,155,230,.28);
    border-radius:999px;
    padding:8px 18px;cursor:pointer;
    transition:.3s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .btn:hover{
    border-color:rgba(180,220,255,.85);

    background:rgba(60,95,165,.22);

  #hint{
    position:absolute;bottom:0;left:0;
    padding:0 40px 26px;
    font-size:9px;letter-spacing:.24em;
    color:rgba(150,195,230,.28);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
    max-width:340px;line-height:1.9;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:760px){
    #title{padding:16px 16px;}
    #title .sub{font-size:8.5px;}
    #stats{padding:16px 16px;font-size:8.5px;}
    #controls{padding:0 16px 16px;gap:9px;}
    .ctrl-label{min-width:56px;font-size:8.5px;}
    .ctrl-val{min-width:46px;font-size:8.5px;}
    input[type=range]{width:100px;}
    .btn{padding:6px 13px;font-size:8.5px;letter-spacing:.12em;}
    #hint{display:none;}
  }
</style>

<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">CHAOTIC PENDULUM · BUTTERFLY EFFECT</div>
    <h1>混沌摆</h1>
    <div class="sub">
      双摆系统 · 对初始条件的敏感依赖<br>
      微小的角度差异 · 完全不同的轨迹
    </div>
  </div>

  <div id="stats">
    <span class="lab">SYSTEM STATE</span>
    <div><span class="k">时间 </span><span class="v" id="tVal">0.0 s</span></div>
    <div><span class="k">扰动 ε </span><span class="v" id="epsVal">0.50°</span></div>
    <div><span class="k">发散 </span><span class="v" id="divVal">0.000</span></div>
    <div><span class="ca">● 摆 A</span> &nbsp; <span class="cb">● 摆 B</span></div>
    <div style="margin-top:3px;"><span class="k">音频 </span><span class="v">悬疑 + 摆动</span><span id="audioDot"></span></div>
  </div>

  <div id="controls">
    <div class="ctrl-row">
      <span class="ctrl-label">初始 θ₁</span>
      <input type="range" id="th1" min="60" max="175" step="1" value="120">
      <span class="ctrl-val" id="th1Val">120°</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">初始 θ₂</span>
      <input type="range" id="th2" min="60" max="175" step="1" value="120">
      <span class="ctrl-val" id="th2Val">120°</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">扰动 ε</span>
      <input type="range" id="eps" min="0.1" max="5" step="0.1" value="0.5">
      <span class="ctrl-val" id="epsVal">0.50°</span>
    </div>
    <button class="btn" id="resetBtn">重 置</button>
  </div>

  <div id="hint">
    <span style="color:rgba(90,230,255,.6)">拖动滑块调整初始条件</span><br>
    两摆从几乎相同的状态出发，几秒后轨迹完全分离
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   双摆物理
   ========================================================= */
class Pendulum {
  constructor(th1, th2){
    this.th1 = th1;
    this.th2 = th2;
    this.w1 = 0;
    this.w2 = 0;
    this.trail = [];   // 归一化坐标下的摆锤 2 轨迹
  }

  /* 导数 */
  deriv(th1, w1, th2, w2){
    const m1 = 1, m2 = 1, L1 = 1, L2 = 1, g = 9.81;
    const d  = th1 - th2;
    const sd = Math.sin(d);
    const cd = Math.cos(d);
    const den = 2 * m1 + m2 - m2 * Math.cos(2 * d);

    const a1 = (-g * (2 * m1 + m2) * Math.sin(th1)
                - m2 * g * Math.sin(th1 - 2 * th2)
                - 2 * sd * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * cd))
               / (L1 * den);

    const a2 = (2 * sd * (w1 * w1 * L1 * (m1 + m2)
                + g * (m1 + m2) * Math.cos(th1)
                + w2 * w2 * L2 * m2 * cd))
               / (L2 * den);

    return [w1, a1, w2, a2];
  }

  /* RK4 步进 */
  step(dt){
    const s  = [this.th1, this.w1, this.th2, this.w2];
    const k1 = this.deriv(s[0], s[1], s[2], s[3]);

    const s2 = [s[0] + k1[0]*dt/2, s[1] + k1[1]*dt/2, s[2] + k1[2]*dt/2, s[3] + k1[3]*dt/2];
    const k2 = this.deriv(s2[0], s2[1], s2[2], s2[3]);

    const s3 = [s[0] + k2[0]*dt/2, s[1] + k2[1]*dt/2, s[2] + k2[2]*dt/2, s[3] + k2[3]*dt/2];
    const k3 = this.deriv(s3[0], s3[1], s3[2], s3[3]);

    const s4 = [s[0] + k3[0]*dt, s[1] + k3[1]*dt, s[2] + k3[2]*dt, s[3] + k3[3]*dt];
    const k4 = this.deriv(s4[0], s4[1], s4[2], s4[3]);

    this.th1 += (k1[0] + 2*k2[0] + 2*k3[0] + k4[0]) * dt / 6;
    this.w1  += (k1[1] + 2*k2[1] + 2*k3[1] + k4[1]) * dt / 6;
    this.th2 += (k1[2] + 2*k2[2] + 2*k3[2] + k4[2]) * dt / 6;
    this.w2  += (k1[3] + 2*k2[3] + 2*k3[3] + k4[3]) * dt / 6;
  }

  /* 归一化位置（摆长 = 1） */
  norm(){
    const x1 = Math.sin(this.th1);
    const y1 = Math.cos(this.th1);
    const x2 = x1 + Math.sin(this.th2);
    const y2 = y1 + Math.cos(this.th2);
    return { x1, y1, x2, y2 };
  }

  /* 运动强度 */
  energy(){
    return Math.sqrt(this.w1 * this.w1 + this.w2 * this.w2);
  }
}

/* =========================================================
   全局状态
   ========================================================= */
let pendA = null;
let pendB = null;

const BASE_TH1 = 120 * Math.PI / 180;
const BASE_TH2 = 120 * Math.PI / 180;
let epsilonDeg = 0.5;

let simTime = 0;
let divHistory = [];   // {t, d}
const DIV_WINDOW = 12;

/* 前一帧位置，用于速度触发音效 */
let prevSpeedA = 0;
let prevSpeedB = 0;
let lastSwingSound = 0;

/* =========================================================
   画布
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

let panelA = { x: 0, y: 0, w: 0, h: 0 };
let panelB = { x: 0, y: 0, w: 0, h: 0 };

let chartRect = { x: 0, y: 0, w: 0, h: 0 };
let showChart = true;

function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const narrow = W < 760;
  const padX = narrow ? 14 : 40;
  const padTop = narrow ? 96 : 128;
  const padBot = narrow ? 150 : 230;

  const availW = W - padX * 2;
  const availH = Math.max(120, H - padTop - padBot);

  if (narrow){
    /* 上下堆叠 */
    const gap = 14;
    const ph = (availH - gap) / 2;
    panelA = { x: padX, y: padTop, w: availW, h: ph };
    panelB = { x: padX, y: padTop + ph + gap, w: availW, h: ph };
    showChart = false;
  } else {
    /* 左右并排 */
    const gap = 28;
    const pw = (availW - gap) / 2;
    panelA = { x: padX, y: padTop, w: pw, h: availH };
    panelB = { x: padX + pw + gap, y: padTop, w: pw, h: availH };

    chartRect = {
      x: padX,
      y: H - 210,
      w: Math.min(360, availW * 0.42),
      h: 176
    };
    showChart = true;
  }
}
window.addEventListener('resize', layout);

/* =========================================================
   重置
   ========================================================= */
function reset(){
  const epsRad = epsilonDeg * Math.PI / 180;

  pendA = new Pendulum(BASE_TH1, BASE_TH2);
  pendB = new Pendulum(BASE_TH1 + epsRad, BASE_TH2);

  simTime = 0;
  divHistory = [];
  prevSpeedA = 0;
  prevSpeedB = 0;

  updateHUD();
}

/* =========================================================
   音频 —— 悬疑音乐 + 摆动声
   ========================================================= */
let ac = null;
let masterGain = null;
let droneGain = null;
let noiseGain = null;
let noiseFilter = null;
let audioReady = false;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  masterGain = ac.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(ac.destination);
  masterGain.gain.setTargetAtTime(0.58, ac.currentTime, 2.2);

  const kick = function(){
    setAudioDot(true);
    startDrone();
    startNoiseBed();
  };

  if (ac.state === 'suspended'){
    ac.resume().then(kick).catch(function(){ audioReady = false; });
  } else {
    kick();
  }
}

/* ---- 悬疑持续音 ---- */
function startDrone(){
  const now = ac.currentTime;

  droneGain = ac.createGain();
  droneGain.gain.value = 0;
  droneGain.connect(masterGain);
  droneGain.gain.setTargetAtTime(0.048, now, 3.0);

  /* 两个近频正弦制造缓慢拍频 —— 不安的脉动 */
  const freqs = [
    { f: 55.00, g: 1.00, type: 'sine' },
    { f: 55.62, g: 1.00, type: 'sine' },
    { f: 82.41, g: 0.52, type: 'sine' },
    { f: 110.0, g: 0.22, type: 'triangle' }
  ];

  for (let i = 0; i < freqs.length; i++){
    const sp = freqs[i];

    const osc = ac.createOscillator();
    osc.type = sp.type;
    osc.frequency.value = sp.f;

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 460;
    lp.Q.value = 1.6;

    const g = ac.createGain();
    g.gain.value = 0;
    g.gain.setTargetAtTime(0.12 * sp.g, now, 3.2);

    /* 每个音独立的缓慢起伏 */
    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.047 + i * 0.021;
    const lg = ac.createGain();
    lg.gain.value = 0.055 * sp.g;
    lfo.connect(lg);
    lg.connect(g.gain);
    lfo.start(now);

    /* 滤波器缓慢扫动 */
    const flfo = ac.createOscillator();
    flfo.frequency.value = 0.033 + i * 0.014;
    const flg = ac.createGain();
    flg.gain.value = 130;
    flfo.connect(flg);
    flg.connect(lp.frequency);
    flfo.start(now);

    osc.connect(lp);
    lp.connect(g);
    g.connect(droneGain);
    osc.start(now);
  }
}

/* ---- 太空噪声层 ---- */
function startNoiseBed(){
  const now = ac.currentTime;
  const len = ac.sampleRate * 4;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  noiseFilter = ac.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 1400;
  noiseFilter.Q.value = 2.2;

  noiseGain = ac.createGain();
  noiseGain.gain.value = 0;
  noiseGain.gain.setTargetAtTime(0.010, now, 3.4);

  src.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(masterGain);
  src.start(now);

  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.075;
  const lg = ac.createGain();
  lg.gain.value = 420;
  lfo.connect(lg);
  lg.connect(noiseFilter.frequency);
  lfo.start(now);

  const lfo2 = ac.createOscillator();
  lfo2.frequency.value = 0.11;
  const lg2 = ac.createGain();
  lg2.gain.value = 0.006;
  lfo2.connect(lg2);
  lg2.connect(noiseGain.gain);
  lfo2.start(now);
}

/* ---- 摆动声：速度越快，声音越亮 ---- */
function playSwing(intensity){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'triangle';
  const f0 = 220 + Math.random() * 180 + intensity * 240;
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f0 * 1.55, now + 0.09);

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 800 + intensity * 1400;
  bp.Q.value = 3.2;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.020 * Math.min(1, intensity), now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 0.17);

  osc.connect(bp);
  bp.connect(g);
  g.connect(masterGain);

  osc.start(now);
  osc.stop(now + 0.19);
}

/* =========================================================
   更新音频动态
   ========================================================= */
function updateAudio(){
  if (!audioReady || !ac || ac.state !== 'running') return;

  const sA = pendA.energy();
  const sB = pendB.energy();
  const avgSpeed = (sA + sB) * 0.5;

  /* 运动越剧烈，噪声层越亮 */
  if (noiseGain){
    const target = 0.008 + Math.min(0.018, avgSpeed * 0.0030);
    noiseGain.gain.setTargetAtTime(target, ac.currentTime, 0.5);
  }

  /* 检测速度突变（加速度峰值）→ 摆动声 */
  const accA = Math.abs(sA - prevSpeedA);
  const accB = Math.abs(sB - prevSpeedB);

  const now = performance.now() / 1000;
  if (now - lastSwingSound > 0.14){
    const peak = Math.max(accA, accB);
    if (peak > 2.4){
      lastSwingSound = now;
      playSwing(Math.min(1, peak / 8));
    }
  }

  prevSpeedA = sA;
  prevSpeedB = sB;
}

/* =========================================================
   绘制辅助
   ========================================================= */
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

/* ---- 单个摆面板 ---- */
function drawPanel(panel, pend, color, label, colorDim){
  const cx0 = panel.x + panel.w * 0.5;
  const oy  = panel.y + panel.h * 0.20;
  const scale = Math.min(panel.w * 0.40, panel.h * 0.34);

  /* 面板背景 */
  ctx.fillStyle = 'rgba(6, 10, 22, 0.55)';
  roundRect(ctx, panel.x, panel.y, panel.w, panel.h, 12);
  ctx.fill();

  ctx.strokeStyle = 'rgba(90, 140, 210, 0.16)';
  ctx.lineWidth = 1;
  roundRect(ctx, panel.x, panel.y, panel.w, panel.h, 12);
  ctx.stroke();

  /* 面板内柔光 */
  const pg = ctx.createRadialGradient(
    cx0, oy + scale * 0.6, 0,
    cx0, oy + scale * 0.6, Math.max(panel.w, panel.h) * 0.75
  );
  pg.addColorStop(0.00, colorDim.replace('A', '0.10'));
  pg.addColorStop(0.55, colorDim.replace('A', '0.03'));
  pg.addColorStop(1.00, colorDim.replace('A', '0'));
  ctx.fillStyle = pg;
  ctx.fillRect(panel.x, panel.y, panel.w, panel.h);

  /* 底部参考线 */
  ctx.beginPath();
  ctx.setLineDash([3, 6]);
  ctx.moveTo(panel.x + 20, oy + scale);
  ctx.lineTo(panel.x + panel.w - 20, oy + scale);
  ctx.strokeStyle = 'rgba(120, 160, 220, 0.09)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);

  const pos = pend.norm();
  const px0 = cx0 + pos.x1 * scale;
  const py0 = oy  + pos.y1 * scale;
  const px1 = cx0 + pos.x2 * scale;
  const py1 = oy  + pos.y2 * scale;

  /* 轨迹 */
  const trail = pend.trail;
  if (trail.length > 1){
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < trail.length; i++){
      const u = i / trail.length;
      const a = u * u * 0.34;
      if (a < 0.006) continue;

      const x0 = cx0 + trail[i - 1].x * scale;
      const y0 = oy  + trail[i - 1].y * scale;
      const x1 = cx0 + trail[i].x * scale;
      const y1 = oy  + trail[i].y * scale;

      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.strokeStyle = color.replace('rgb', 'rgba').replace(')', ',' + a + ')');
      ctx.lineWidth = u * 1.9 + 0.4;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 悬挂点 */
  ctx.beginPath();
  ctx.arc(cx0, oy, 4.2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(180, 210, 250, 0.65)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx0, oy, 8, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(160, 200, 250, 0.20)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 摆杆 1 */
  ctx.beginPath();
  ctx.moveTo(cx0, oy);
  ctx.lineTo(px0, py0);
  ctx.strokeStyle = 'rgba(150, 200, 250, 0.42)';
  ctx.lineWidth = 2.0;
  ctx.lineCap = 'round';
  ctx.stroke();

  /* 摆杆 2 */
  ctx.beginPath();
  ctx.moveTo(px0, py0);
  ctx.lineTo(px1, py1);
  ctx.strokeStyle = 'rgba(190, 220, 255, 0.58)';
  ctx.lineWidth = 2.2;
  ctx.stroke();

  /* 摆锤 1 */
  const r1 = Math.max(4, scale * 0.052);
  ctx.beginPath();
  ctx.arc(px0, py0, r1, 0, Math.PI * 2);
  const g1 = ctx.createRadialGradient(
    px0 - r1 * 0.3, py0 - r1 * 0.3, 0,
    px0, py0, r1
  );
  g1.addColorStop(0.00, 'rgba(230, 245, 255, 0.95)');
  g1.addColorStop(0.55, 'rgba(160, 200, 240, 0.85)');
  g1.addColorStop(1.00, 'rgba(100, 150, 210, 0.70)');
  ctx.fillStyle = g1;
  ctx.fill();

  /* 摆锤 2（主摆锤，带光晕） */
  const r2 = Math.max(5, scale * 0.070);

  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(px1, py1, 0, px1, py1, r2 * 5.5);
  halo.addColorStop(0.00, color.replace('rgb', 'rgba').replace(')', ',0.38)'));
  halo.addColorStop(0.34, color.replace('rgb', 'rgba').replace(')', ',0.13)'));
  halo.addColorStop(1.00, color.replace('rgb', 'rgba').replace(')', ',0)'));
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(px1, py1, r2 * 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.beginPath();
  ctx.arc(px1, py1, r2, 0, Math.PI * 2);
  const g2 = ctx.createRadialGradient(
    px1 - r2 * 0.35, py1 - r2 * 0.35, 0,
    px1, py1, r2
  );
  g2.addColorStop(0.00, 'rgba(255, 255, 255, 0.98)');
  g2.addColorStop(0.42, color.replace('rgb', 'rgba').replace(')', ',0.95)'));
  g2.addColorStop(1.00, color.replace('rgb', 'rgba').replace(')', ',0.72)'));
  ctx.fillStyle = g2;
  ctx.fill();

  /* 标签 */
  ctx.font = '600 11px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = color.replace('rgb', 'rgba').replace(')', ',0.80)');
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(label, panel.x + 16, panel.y + 14);

  ctx.font = '9px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(150, 190, 230, 0.34)';
  ctx.fillText(
    'θ₁ ' + (pend.th1 * 180 / Math.PI).toFixed(1) + '°  θ₂ ' +
    (pend.th2 * 180 / Math.PI).toFixed(1) + '°',
    panel.x + 16, panel.y + 30
  );
}

/* ---- 发散曲线 ---- */
function drawChart(){
  if (!showChart) return;

  const { x, y, w, h } = chartRect;

  ctx.fillStyle = 'rgba(6, 10, 22, 0.80)';
  roundRect(ctx, x, y, w, h, 10);
  ctx.fill();

  ctx.strokeStyle = 'rgba(90, 140, 210, 0.20)';
  ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, h, 10);
  ctx.stroke();

  const pl = 34, pr = 14, pt = 26, pb = 22;
  const gx = x + pl;
  const gy = y + pt;
  const gw = w - pl - pr;
  const gh = h - pt - pb;

  /* 网格 */
  ctx.strokeStyle = 'rgba(90, 140, 210, 0.09)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++){
    const yy = gy + gh * i / 3;
    ctx.beginPath();
    ctx.moveTo(gx, yy);
    ctx.lineTo(gx + gw, yy);
    ctx.stroke();
  }

  /* 标题 */
  ctx.font = '8.5px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(150, 190, 230, 0.44)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('两摆锤距离 · DIVERGENCE', x + 12, y + 9);

  /* 纵轴 */
  const maxY = 2.0;
  ctx.fillStyle = 'rgba(140, 180, 220, 0.34)';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('2', gx - 6, gy);
  ctx.fillText('1', gx - 6, gy + gh * 0.5);
  ctx.fillText('0', gx - 6, gy + gh);

  /* 曲线 */
  if (divHistory.length > 1){
    ctx.beginPath();
    let started = false;

    for (let i = 0; i < divHistory.length; i++){
      const pt2 = divHistory[i];
      const u = 1 - (simTime - pt2.t) / DIV_WINDOW;
      if (u < 0 || u > 1) continue;

      const xx = gx + u * gw;
      const vv = Math.min(1, pt2.d / maxY);
      const yy = gy + gh - vv * gh;

      if (!started){ ctx.moveTo(xx, yy); started = true; }
      else ctx.lineTo(xx, yy);
    }

    ctx.strokeStyle = 'rgba(255, 170, 210, 0.92)';
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    /* 填充 */
    if (started){
      ctx.lineTo(gx + gw, gy + gh);
      ctx.lineTo(gx, gy + gh);
      ctx.closePath();
      const cg = ctx.createLinearGradient(0, gy, 0, gy + gh);
      cg.addColorStop(0.00, 'rgba(255, 130, 200, 0.18)');
      cg.addColorStop(1.00, 'rgba(255, 130, 200, 0.01)');
      ctx.fillStyle = cg;
      ctx.fill();
    }
  }

  /* 横轴时间标注 */
  ctx.fillStyle = 'rgba(140, 180, 220, 0.28)';
  ctx.font = '8px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('−' + DIV_WINDOW + 's', gx, gy + gh + 5);
  ctx.fillText('now', gx + gw, gy + gh + 5);
}

/* =========================================================
   渲染
   ========================================================= */
function render(){
  /* 背景 */
  ctx.fillStyle = '#04060d';
  ctx.fillRect(0, 0, W, H);

  const bgG = ctx.createRadialGradient(
    W * 0.5, H * 0.42, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.80
  );
  bgG.addColorStop(0.00, 'rgba(16, 26, 52, 0.34)');
  bgG.addColorStop(0.50, 'rgba(8, 14, 30, 0.14)');
  bgG.addColorStop(1.00, 'rgba(2, 4, 10, 0)');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  drawPanel(panelA, pendA, 'rgb(90,225,255)', '摆 A · 参考', 'rgba(90,225,255,A)');
  drawPanel(panelB, pendB, 'rgb(255,125,210)', '摆 B · 扰动 +ε', 'rgba(255,125,210,A)');

  drawChart();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.32,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.76
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.82)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   HUD
   ========================================================= */
let hudTick = 0;
function updateHUD(){
  hudTick++;
  if (hudTick % 5 !== 0) return;

  const tEl = document.getElementById('tVal');
  if (tEl) tEl.textContent = simTime.toFixed(1) + ' s';

  const eEl = document.getElementById('epsVal');
  if (eEl) eEl.textContent = epsilonDeg.toFixed(2) + '°';

  /* 当前发散距离 */
  if (pendA && pendB){
    const pa = pendA.norm();
    const pb = pendB.norm();
    const dx = pa.x2 - pb.x2;
    const dy = pa.y2 - pb.y2;
    const dist = Math.sqrt(dx * dx + dy * dy);

    const dEl = document.getElementById('divVal');
    if (dEl) dEl.textContent = dist.toFixed(3);
  }
}

/* =========================================================
   主循环
   ========================================================= */
const SIM_DT = 0.002;
let simAccum = 0;
let lastFrameTime = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastFrameTime) lastFrameTime = now;
  let realDt = (now - lastFrameTime) / 1000;
  lastFrameTime = now;

  if (realDt > 0.06) realDt = 0.06;

  /* 固定子步积分 */
  simAccum += realDt;
  let steps = 0;
  while (simAccum >= SIM_DT && steps < 40){
    pendA.step(SIM_DT);
    pendB.step(SIM_DT);
    simAccum -= SIM_DT;
    simTime += SIM_DT;
    steps++;
  }
  if (steps >= 40) simAccum = 0;

  /* 记录轨迹（每帧一次） */
  const pa = pendA.norm();
  const pb = pendB.norm();

  pendA.trail.push({ x: pa.x2, y: pa.y2 });
  if (pendA.trail.length > 220) pendA.trail.shift();

  pendB.trail.push({ x: pb.x2, y: pb.y2 });
  if (pendB.trail.length > 220) pendB.trail.shift();

  /* 记录发散历史 */
  const ddx = pa.x2 - pb.x2;
  const ddy = pa.y2 - pb.y2;
  const dist = Math.sqrt(ddx * ddx + ddy * ddy);

  divHistory.push({ t: simTime, d: dist });
  while (divHistory.length > 0 && divHistory[0].t < simTime - DIV_WINDOW){
    divHistory.shift();
  }

  /* 音频 */
  updateAudio();

  render();
  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
const th1Slider = document.getElementById('th1');
const th2Slider = document.getElementById('th2');
const epsSlider = document.getElementById('eps');

let customTh1 = 120;
let customTh2 = 120;

th1Slider.addEventListener('input', function(e){
  customTh1 = parseFloat(e.target.value);
  document.getElementById('th1Val').textContent = customTh1.toFixed(0) + '°';
  resetWithCustom();
});

th2Slider.addEventListener('input', function(e){
  customTh2 = parseFloat(e.target.value);
  document.getElementById('th2Val').textContent = customTh2.toFixed(0) + '°';
  resetWithCustom();
});

epsSlider.addEventListener('input', function(e){
  epsilonDeg = parseFloat(e.target.value);
  document.getElementById('epsVal').textContent = epsilonDeg.toFixed(2) + '°';
  resetWithCustom();
});

function resetWithCustom(){
  const th1 = customTh1 * Math.PI / 180;
  const th2 = customTh2 * Math.PI / 180;
  const eps = epsilonDeg * Math.PI / 180;

  pendA = new Pendulum(th1, th2);
  pendB = new Pendulum(th1 + eps, th2);

  simTime = 0;
  divHistory = [];
  prevSpeedA = 0;
  prevSpeedB = 0;
  lastSwingSound = 0;
}

document.getElementById('resetBtn').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  resetWithCustom();
});

/* 首次点击启动音频 */
window.addEventListener('pointerdown', initAudio);
window.addEventListener('keydown', function(e){
  if (e.key === 'r' || e.key === 'R'){
    initAudio();
    resetWithCustom();
  }
});

/* =========================================================
   启动
   ========================================================= */
layout();
reset();
requestAnimationFrame(loop);

})();
</script>
