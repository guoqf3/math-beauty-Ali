<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高斯曲率 · 拓扑海龟</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; position:absolute; inset:0; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

/* =========================================================
   0. 画布 / 尺寸
   ========================================================= */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });

let W = 1, H = 1, DPR = 1;
let PANEL = 1, CX = 0, CY = 0, SC = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(2, innerWidth);
  H = Math.max(2, innerHeight);

  cv.width  = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  PANEL = W * 0.2;
  CX = PANEL + (W - PANEL) * 0.5;
  CY = H * 0.52;
  SC = Math.min(W - PANEL, H) * 0.255;
}
addEventListener('resize', resize);

const TAU = Math.PI * 2;

/* =========================================================
   1. 相机 / 投影
   ========================================================= */
let yaw = 0, pitch = 0, roll = 0, bobY = 0;
let cosY = 1, sinY = 0, cosP = 1, sinP = 0, cosR = 1, sinR = 0;

const CAMZ = 5.0, FOCAL = 4.4;
const _p = [0, 0, 0];

function project(x, y, z) {
  const yy = y + bobY;

  // 横滚（绕 Z）
  const rx =  x * cosR - yy * sinR;
  const ry =  x * sinR + yy * cosR;
  const rz =  z;

  // 偏航（绕 Y）
  const ax =  rx * cosY + rz * sinY;
  const az = -rx * sinY + rz * cosY;

  // 俯仰（绕 X）
  const ay  = ry * cosP - az * sinP;
  const az2 = ry * sinP + az * cosP;

  const d = Math.max(0.6, CAMZ - az2);
  const f = FOCAL / d * SC;

  _p[0] = CX + ax * f;
  _p[1] = CY - ay * f;
  _p[2] = d;
  return _p;
}

function updateCamera(t) {
  yaw   = t * 0.24;
  pitch = -0.32 + Math.sin(t * 0.35) * 0.18;
  roll  = Math.sin(t * 0.46) * 0.13;
  bobY  = Math.sin(t * 0.90) * 0.09;

  cosY = Math.cos(yaw);  sinY = Math.sin(yaw);
  cosP = Math.cos(pitch); sinP = Math.sin(pitch);
  cosR = Math.cos(roll);  sinR = Math.sin(roll);
}

/* =========================================================
   2. 色带批处理（霓虹绿 → 紫）
   ========================================================= */
const NBANDS = 7;
const BAND_STYLES = [];
for (let i = 0; i < NBANDS; i++) {
  const f = i / (NBANDS - 1);
  const hue   = 152 + 128 * f;          // 152 绿 → 280 紫
  const light = 56 + 14 * f;
  const alpha = 0.09 + 0.17 * f;
  BAND_STYLES.push(`hsla(${hue.toFixed(0)},100%,${light.toFixed(0)}%,${alpha.toFixed(3)})`);
}

const bucketArr = [];
for (let i = 0; i < NBANDS; i++) bucketArr.push([]);

function beginBuckets() {
  for (let i = 0; i < NBANDS; i++) bucketArr[i].length = 0;
}
function addSeg(band, x1, y1, x2, y2) {
  const a = bucketArr[band];
  a.push(x1, y1, x2, y2);
}
function flushBuckets(lw) {
  ctx.lineWidth = lw;
  for (let b = 0; b < NBANDS; b++) {
    const arr = bucketArr[b];
    if (!arr.length) continue;
    ctx.beginPath();
    for (let q = 0; q < arr.length; q += 4) {
      ctx.moveTo(arr[q], arr[q + 1]);
      ctx.lineTo(arr[q + 2], arr[q + 3]);
    }
    ctx.strokeStyle = BAND_STYLES[b];
    ctx.stroke();
  }
}

function bandOf(v, u, t) {
  const f = 0.5 + 0.5 * Math.sin(v * 1.10 + t * 0.55 + u * 1.6);
  let b = Math.floor(f * NBANDS);
  if (b < 0) b = 0;
  if (b >= NBANDS) b = NBANDS - 1;
  return b;
}

/* =========================================================
   3. 龟壳 —— 曲率形变
   ========================================================= */
const SU = 22;
const SV = 44;
const gx = new Float32Array((SU + 1) * SV);
const gy = new Float32Array((SU + 1) * SV);
const gv = new Float32Array((SU + 1) * SV);

function shellPt(u, v, t) {
  const theta = Math.pow(u, 0.90) * Math.PI * 0.5;
  const st = Math.sin(theta);
  const ct = Math.cos(theta);

  const m = Math.sin(t * 0.55);          // 曲率形变参数

  // 双环 / 鞍形调制 + 行波
  const ripple =
      0.30 * m * Math.sin(2 * v) * st * st
    + 0.16 * Math.sin(3 * v + t * 0.72) * st
    + 0.07 * Math.sin(5 * v - u * 6.0 + t * 0.5) * st * st;

  const mod = 1 + ripple;

  const RX = 0.86, RY = 0.60, RZ = 1.06;

  return [
    RX * st * Math.cos(v) * mod,
    RY * ct * mod,
    RZ * st * Math.sin(v) * mod
  ];
}

function drawShell(t) {
  let k = 0;
  for (let i = 0; i <= SU; i++) {
    const u = i / SU;
    for (let j = 0; j < SV; j++) {
      const v = j / SV * TAU;
      const p = shellPt(u, v, t);
      const q = project(p[0], p[1], p[2]);
      gx[k] = q[0];
      gy[k] = q[1];
      gv[k] = v;
      k++;
    }
  }

  beginBuckets();

  // 纬线
  for (let i = 0; i <= SU; i++) {
    const row = i * SV;
    const u = i / SU;
    for (let j = 0; j < SV; j++) {
      const j2 = (j + 1) % SV;
      const a = row + j, b = row + j2;
      addSeg(bandOf(gv[a], u, t), gx[a], gy[a], gx[b], gy[b]);
    }
  }

  // 经线
  for (let i = 0; i < SU; i++) {
    const row  = i * SV;
    const row2 = (i + 1) * SV;
    const u = i / SU;
    for (let j = 0; j < SV; j++) {
      const a = row + j, b = row2 + j;
      addSeg(bandOf(gv[a], u, t), gx[a], gy[a], gx[b], gy[b]);
    }
  }

  flushBuckets(0.95);
}

/* =========================================================
   4. 头部
   ========================================================= */
const HU = 10, HV = 16;

function headPt(u, v, t) {
  const theta = u * Math.PI;
  const st = Math.sin(theta), ct = Math.cos(theta);

  const RX = 0.25, RY = 0.21, RZ = 0.34;
  const nod = Math.sin(t * 1.25) * 0.06;
  const bob = Math.sin(t * 1.70) * 0.03;

  return [
    RX * st * Math.cos(v) * 0.95,
    -0.06 + RY * ct + bob + nod,
    1.06 + RZ * st * Math.sin(v)
  ];
}

function drawHead(t) {
  const px = new Float32Array((HU + 1) * HV);
  const py = new Float32Array((HU + 1) * HV);
  const pv = new Float32Array((HU + 1) * HV);

  let k = 0;
  for (let i = 0; i <= HU; i++) {
    const u = i / HU;
    for (let j = 0; j < HV; j++) {
      const v = j / HV * TAU;
      const p = headPt(u, v, t);
      const q = project(p[0], p[1], p[2]);
      px[k] = q[0]; py[k] = q[1]; pv[k] = v;
      k++;
    }
  }

  beginBuckets();

  for (let i = 0; i <= HU; i++) {
    const row = i * HV, u = i / HU;
    for (let j = 0; j < HV; j++) {
      const j2 = (j + 1) % HV;
      const a = row + j, b = row + j2;
      addSeg(bandOf(pv[a], u, t), px[a], py[a], px[b], py[b]);
    }
  }
  for (let i = 0; i < HU; i++) {
    const row = i * HV, row2 = (i + 1) * HV, u = i / HU;
    for (let j = 0; j < HV; j++) {
      const a = row + j, b = row2 + j;
      addSeg(bandOf(pv[a], u, t), px[a], py[a], px[b], py[b]);
    }
  }

  flushBuckets(0.85);

  // 双眼
  const eyeA = headPt(0.35, 0.6, t);
  const eyeB = headPt(0.35, TAU - 0.6, t);
  for (const e of [eyeA, eyeB]) {
    const q = project(e[0], e[1], e[2]);
    const g = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], 6);
    g.addColorStop(0.0, 'rgba(220,255,240,0.85)');
    g.addColorStop(0.4, 'rgba(120,255,190,0.35)');
    g.addColorStop(1.0, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(q[0], q[1], 6, 0, TAU);
    ctx.fill();
  }
}

/* =========================================================
   5. 鳍状肢
   ========================================================= */
function drawFlipper(t, side, isFront) {
  const phase = side * 1.9 + (isFront ? 0 : 2.3);
  const flap  = Math.sin(t * 2.30 + phase);

  const baseX = side * 0.52;
  const baseY = -0.12;
  const baseZ = isFront ? 0.48 : -0.56;

  const NL = 8, NS = 12;

  beginBuckets();

  for (let li = 0; li <= NL; li++) {
    const s = (li / NL) * 2 - 1;

    let prevX = null, prevY = null, prevZ = 0;

    for (let i = 0; i <= NS; i++) {
      const u = i / NS;

      const px = baseX + side * u * 0.92;
      const py = baseY - u * 0.10 + flap * u * 0.60
               + s * 0.055 * Math.sin(u * Math.PI);
      const pz = baseZ + (isFront ? -u * 0.30 : -u * 0.36)
               + s * 0.33 * Math.sin(Math.PI * Math.pow(u, 0.65));

      const q = project(px, py, pz);

      if (prevX !== null) {
        addSeg(bandOf(pz * 1.8, u, t), prevX, prevY, q[0], q[1]);
      }
      prevX = q[0]; prevY = q[1]; prevZ = pz;
    }
  }

  flushBuckets(0.85);
}

/* =========================================================
   6. 尾部
   ========================================================= */
function drawTail(t) {
  const sway = Math.sin(t * 1.45) * 0.10;
  const NL = 6, NS = 14;

  beginBuckets();

  for (let li = 0; li < NL; li++) {
    const s = li / (NL - 1) - 0.5;

    let prevX = null, prevY = null;

    for (let i = 0; i <= NS; i++) {
      const u = i / NS;

      const px = s * 0.11 * (1 - u * 0.55);
      const py = -0.04 - u * 0.13 + sway * u * u;
      const pz = -0.82 - u * 0.92;

      const q = project(px, py, pz);

      if (prevX !== null) {
        addSeg(bandOf(u * 3.0, u, t), prevX, prevY, q[0], q[1]);
      }
      prevX = q[0]; prevY = q[1];
    }
  }

  flushBuckets(0.85);
}

/* =========================================================
   7. 整只海龟
   ========================================================= */
function drawTurtle(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  drawShell(t);
  drawHead(t);
  drawFlipper(t,  1, true);
  drawFlipper(t, -1, true);
  drawFlipper(t,  1, false);
  drawFlipper(t, -1, false);
  drawTail(t);

  ctx.restore();
}

/* =========================================================
   8. 左侧 1/5：高斯曲率面板
   ========================================================= */
function fitText(str, maxW, size, family, italic) {
  const pre = italic ? 'italic ' : '';
  ctx.font = `${pre}${size}px ${family}`;
  const w = ctx.measureText(str).width;
  if (w > maxW) {
    size *= maxW / w;
    ctx.font = `${pre}${size}px ${family}`;
  }
  return size;
}

function drawPanel(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cx = PANEL * 0.5;
  const pulse = 0.78 + 0.22 * Math.sin(t * 1.7);

  const SERIF = '"Times New Roman", Georgia, "Songti SC", serif';
  const SANS  = '"Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif';

  /* ---- 主公式 ---- */
  const mainStr = 'K = k₁ · k₂';
  const fs1 = fitText(mainStr, PANEL * 0.90,
                      Math.min(PANEL * 0.150, H * 0.050), SERIF, true);
  const my = H * 0.27;

  ctx.shadowColor = `rgba(60,255,170,${0.85 * pulse})`;
  ctx.shadowBlur = 26;
  ctx.fillStyle = `rgba(160,255,215,${0.96 * pulse})`;
  ctx.fillText(mainStr, cx, my);
  ctx.shadowBlur = 0;

  /* ---- 中文标题 ---- */
  const fs2 = Math.min(PANEL * 0.066, H * 0.024);
  ctx.font = `${fs2}px ${SANS}`;
  ctx.fillStyle = 'rgba(200,120,255,0.75)';
  ctx.fillText('高 斯 曲 率', cx, my + fs1 * 1.36);

  /* ---- 分隔光带 ---- */
  const ly = my + fs1 * 2.08;
  const lg = ctx.createLinearGradient(PANEL * 0.10, 0, PANEL * 0.90, 0);
  lg.addColorStop(0.0, 'rgba(0,0,0,0)');
  lg.addColorStop(0.5, 'rgba(60,255,175,0.50)');
  lg.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(PANEL * 0.10, ly, PANEL * 0.80, Math.max(1, H * 0.0016));

  /* ---- 附属公式 ---- */
  const lines = [
    'K = (LN − M²) / (EG − F²)',
    '球面: K = 1/R² > 0',
    '鞍面: K < 0',
    '∮ K dA = 2π χ'
  ];

  let y = H * 0.50;
  const step = Math.min(H * 0.078, H * 0.026 * 3.0);

  for (let i = 0; i < lines.length; i++) {
    const sz = fitText(lines[i], PANEL * 0.90,
                       Math.min(PANEL * 0.078, H * 0.026), SERIF, true);
    const a = (0.52 + 0.26 * Math.sin(t * 1.4 + i * 0.9)) * (i === 0 ? 1.0 : 0.80);
    ctx.font = `italic ${sz}px ${SERIF}`;
    ctx.fillStyle = (i % 2 === 0)
      ? `rgba(120,255,195,${a})`
      : `rgba(205,125,255,${a})`;
    ctx.fillText(lines[i], cx, y);
    y += step;
  }

  /* ---- 底部注记 ---- */
  const fs4 = Math.min(PANEL * 0.044, H * 0.017);
  ctx.font = `${fs4}px ${SANS}`;
  ctx.fillStyle = `rgba(160,220,255,${0.26 + 0.12 * Math.sin(t * 2.0)})`;
  ctx.fillText('GAUSS · TOPOLOGY', cx, H * 0.89);

  /* ---- 右边界光带 ---- */
  const dg = ctx.createLinearGradient(0, 0, 0, H);
  dg.addColorStop(0.00, 'rgba(0,0,0,0)');
  dg.addColorStop(0.28, 'rgba(60,255,170,0.30)');
  dg.addColorStop(0.52, 'rgba(200,110,255,0.26)');
  dg.addColorStop(0.78, 'rgba(60,255,170,0.30)');
  dg.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = dg;
  ctx.fillRect(PANEL - Math.max(1, W * 0.0008), 0, Math.max(2, W * 0.0020), H);

  ctx.restore();
}

/* =========================================================
   9. 主循环
   ========================================================= */
let T = 0, lastMs = 0;

function frame(now) {
  if (!lastMs) lastMs = now;
  let dt = (now - lastMs) / 1000;
  lastMs = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  T += dt;

  /* ---- 拖尾 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.fillRect(0, 0, W, H);

  /* ---- 左侧面板保持纯黑 ---- */
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, PANEL, H);

  /* ---- 更新相机 ---- */
  updateCamera(T);

  /* ---- 画海龟 ---- */
  drawTurtle(T);

  /* ---- 公式面板 ---- */
  drawPanel(T);

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
