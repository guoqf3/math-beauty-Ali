<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>罗斯勒吸引子 · 混沌螳螂</title>
<style>
  :root{ --split: 20%; }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
  }

  /* ================= 左侧：罗斯勒方程 ================= */
  #left{
    position:fixed; left:0; top:0; bottom:0;
    width: var(--split);
    display:flex; align-items:center; justify-content:center;
    padding: 18px 9px;
    background:
      radial-gradient(120% 80% at 18% 22%, rgba(240,230,60,.08), transparent 62%),
      radial-gradient(120% 80% at 82% 84%, rgba(160,40,255,.08), transparent 62%),
      #000;
    border-right:1px solid rgba(200,255,80,.16);
    color:#e6ff9a;
    font-family:"Cambria Math","Latin Modern Math","Times New Roman",serif;
    overflow:hidden;
    z-index:2;
  }
  #left::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(220,255,90,.05) 50%, transparent 100%);
    background-size:100% 220%;
    animation: scan 9s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ from{ background-position: 0 -110%; } to{ background-position: 0 110%; } }

  .stack{ width:100%; text-align:center; position:relative; z-index:1; }

  .kicker{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(7px, .55vw, 10px);
    letter-spacing:.26em;
    color: rgba(215,255,120,.5);
    margin-bottom: 1.7em;
    white-space: nowrap;
  }

  .eq{
    font-size: clamp(8px, .88vw, 15px);
    line-height: 1.95;
    color:#dcff8a;
    text-shadow:
      0 0 10px rgba(220,255,80,.5),
      0 0 26px rgba(160,220,0,.2);
    animation: pulse 5.6s ease-in-out infinite;
    word-break: keep-all;
  }
  .eq.big{
    font-size: clamp(9px, 1.0vw, 17px);
    color:#eeffb8;
  }
  .eq i{ font-style: italic; }
  .eq b{
    font-weight:600; color:#b06cff;
    text-shadow: 0 0 10px rgba(170,90,255,.75), 0 0 24px rgba(130,40,220,.35);
  }
  .eq sup, .eq sub{ font-size:.6em; }

  @keyframes pulse{
    0%,100%{ opacity:.84; }
    50%    { opacity:1; }
  }

  .frac{
    display:inline-flex; flex-direction:column;
    vertical-align:middle; text-align:center;
    font-size:.82em; line-height:1.08;
    margin:0 .18em;
  }
  .frac > span:first-child{
    border-bottom:1px solid rgba(220,255,140,.8);
    padding:0 .22em .05em;
  }
  .frac > span:last-child{ padding-top:.05em; }

  .rule{
    height:1px; width:62%;
    margin: 1.35em auto;
    background:linear-gradient(90deg, transparent, rgba(210,255,90,.42), transparent);
  }

  .meta{
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(7px, .54vw, 10px);
    letter-spacing:.16em;
    color: rgba(225,255,160,.62);
    white-space: nowrap;
  }
  .dot{
    display:inline-block; width:.6em; height:.6em; border-radius:50%;
    vertical-align:middle; margin:0 .28em 0 .1em;
  }
  .dot.ye{ background:#f0e63c; box-shadow:0 0 10px #f0e63c, 0 0 22px rgba(240,230,60,.65); }
  .dot.gr{ background:#39ff14; box-shadow:0 0 10px #39ff14, 0 0 22px rgba(57,255,20,.65); }
  .dot.pp{ background:#b026ff; box-shadow:0 0 10px #b026ff, 0 0 22px rgba(176,38,255,.65); }

  /* ================= 右侧：混沌螳螂 ================= */
  #right{
    position:fixed; left: var(--split); top:0; right:0; bottom:0;
    background:#000;
    overflow:hidden;
  }
  #right canvas{ display:block; position:absolute; inset:0; }

  @media (max-width: 900px){
    :root{ --split: 27%; }
    .kicker{ letter-spacing:.15em; }
    .meta{ letter-spacing:.06em; }
  }
</style>
</head>
<body>

<!-- ============ 左：公式 ============ -->
<div id="left">
  <div class="stack">
    <div class="kicker">RÖSSLER ATTRACTOR</div>

    <div class="eq big">
      <span class="frac"><span>d<i>x</i></span><span>d<i>t</i></span></span>
      = −<i>y</i> − <i>z</i>
    </div>

    <div class="eq big">
      <span class="frac"><span>d<i>y</i></span><span>d<i>t</i></span></span>
      = <i>x</i> + <i>a y</i>
    </div>

    <div class="eq big">
      <span class="frac"><span>d<i>z</i></span><span>d<i>t</i></span></span>
      = <i>b</i> + <i>z</i>(<i>x</i> − <i>c</i>)
    </div>

    <div class="rule"></div>

    <div class="eq">
      <b>a</b> = 0.2 &nbsp; <b>b</b> = 0.2 &nbsp; <b>c</b> = 5.7
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span class="dot ye"></span>有序
      <span class="dot gr"></span>临界
      <span class="dot pp"></span>混沌
    </div>
  </div>
</div>

<!-- ============ 右：场景 ============ -->
<div id="right"></div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 画布与自适应
   ========================================================= */
const host = document.getElementById('right');
const cv   = document.createElement('canvas');
host.appendChild(cv);
const ctx  = cv.getContext('2d');

const TAU = Math.PI * 2;
let W, H, CX, CY, S, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = host.clientWidth  || 1;
  H = host.clientHeight || 1;

  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.5;

  /* 世界坐标约 2.5 × 1.9 */
  S = Math.min(W / 2.55, H / 1.90);
}
window.addEventListener('resize', resize);

/* =========================================================
   1. 工具
   ========================================================= */
function lerp(a,b,f){ return a + (b-a)*f; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function smooth(f){ return f*f*(3-2*f); }

function mixRGB(c1,c2,f){
  return [lerp(c1[0],c2[0],f), lerp(c1[1],c2[1],f), lerp(c1[2],c2[2],f)];
}
function rgba(c,a){
  return 'rgba(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ',' + a + ')';
}

/* 霓虹黄 → 绿 → 紫 */
const C_YELLOW = [242, 232,  56];
const C_GREEN  = [ 57, 255,  20];
const C_PURPLE = [176,  38, 255];

function triColor(f){
  f = ((f % 1) + 1) % 1;
  if (f < 1/3) return mixRGB(C_YELLOW, C_GREEN, f*3);
  if (f < 2/3) return mixRGB(C_GREEN, C_PURPLE, (f-1/3)*3);
  return mixRGB(C_PURPLE, C_YELLOW, (f-2/3)*3);
}

/* =========================================================
   2. Rössler 积分器
   ========================================================= */
function Rossler(x0, y0, z0, c){
  this.x = x0; this.y = y0; this.z = z0;
  this.a = 0.2; this.b = 0.2; this.c = (c === undefined ? 5.7 : c);
}

function dRossler(x, y, z, a, b, c, out){
  out[0] = -y - z;
  out[1] =  x + a*y;
  out[2] =  b + z*(x - c);
  return out;
}

const _k1 = [0,0,0], _k2 = [0,0,0], _k3 = [0,0,0], _k4 = [0,0,0];
const _tmp = [0,0,0];

Rossler.prototype.step = function(dt){
  const a = this.a, b = this.b, c = this.c;

  dRossler(this.x, this.y, this.z, a, b, c, _k1);

  dRossler(this.x + dt*0.5*_k1[0],
           this.y + dt*0.5*_k1[1],
           this.z + dt*0.5*_k1[2], a, b, c, _k2);

  dRossler(this.x + dt*0.5*_k2[0],
           this.y + dt*0.5*_k2[1],
           this.z + dt*0.5*_k2[2], a, b, c, _k3);

  dRossler(this.x + dt*_k3[0],
           this.y + dt*_k3[1],
           this.z + dt*_k3[2], a, b, c, _k4);

  this.x += dt/6 * (_k1[0] + 2*_k2[0] + 2*_k3[0] + _k4[0]);
  this.y += dt/6 * (_k1[1] + 2*_k2[1] + 2*_k3[1] + _k4[1]);
  this.z += dt/6 * (_k1[2] + 2*_k2[2] + 2*_k3[2] + _k4[2]);
};

/* 两个相位不同的系统 → 左右前肢 */
const sysL = new Rossler( 1.00, 1.00, 1.00, 5.70);
const sysR = new Rossler( 1.25, 0.88, 0.75, 5.75);

/* 吸引子坐标 → 前肢尖端世界坐标 */
function tipFromSys(sys, out){
  /* x ∈ [-9, 12]，y ∈ [-12, 9] */
  const tx = clamp((sys.x + 9) / 21, 0, 1);
  const ty = clamp((sys.y + 12) / 21, 0, 1);

  out.x = -0.92 + tx * 0.64;
  out.y = -0.58 + ty * 0.78;
  return out;
}

const _tipL = {x:0, y:0};
const _tipR = {x:0, y:0};

/* =========================================================
   3. 轨迹缓存
   ========================================================= */
const TRAIL_MAX = 180;
const trailL = [];
const trailR = [];

function pushTrail(arr, x, y){
  arr.push({ x: x, y: y });
  while (arr.length > TRAIL_MAX) arr.shift();
}

/* =========================================================
   4. 身体骨架
   ========================================================= */
function bodySpine(s){
  if (s < 0.42){
    const t = s / 0.42;
    return {
      x: -0.48 + 0.46 * t,
      y: -0.08 + 0.14 * t
    };
  }
  const t = (s - 0.42) / 0.58;
  return {
    x: -0.02 + 0.74 * t,
    y:  0.06 + 0.14 * t + 0.055 * Math.sin(Math.PI * t)
  };
}

function bodyHalfW(s){
  let w;
  if (s < 0.42){
    const t = s / 0.42;
    w = 0.034 + 0.030 * t;
  } else {
    const t = (s - 0.42) / 0.58;
    w = 0.064 + 0.118 * Math.sin(Math.pow(t, 0.75) * Math.PI);
    w *= 1 - 0.58 * Math.pow(Math.max(0, (t - 0.76) / 0.24), 2);
  }
  return Math.max(0.011, w);
}

function bodyFrame(s){
  s = clamp(s, 0, 1);
  const h = 0.002;
  const p  = bodySpine(s);
  const p0 = bodySpine(Math.max(0, s - h));
  const p1 = bodySpine(Math.min(1, s + h));

  let dx = p1.x - p0.x, dy = p1.y - p0.y;
  const L = Math.hypot(dx, dy) || 1;
  dx /= L; dy /= L;

  return {
    x: p.x, y: p.y,
    tx: dx, ty: dy,
    nx: -dy, ny: dx,
    w: bodyHalfW(s)
  };
}

/* =========================================================
   5. 绘制：身体
   ========================================================= */
const NSEG_BODY = 96;
const NV_LONG   = 26;
const NH_RING   = 96;

function drawBody(t){
  const F = new Array(NSEG_BODY + 1);
  for (let i = 0; i <= NSEG_BODY; i++){
    F[i] = bodyFrame(i / NSEG_BODY);
  }

  /* ---- 5.1 体积填充 ---- */
  ctx.beginPath();
  for (let i = 0; i <= NSEG_BODY; i++){
    const f = F[i];
    const x = f.x + f.nx * f.w;
    const y = f.y + f.ny * f.w;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (let i = NSEG_BODY; i >= 0; i--){
    const f = F[i];
    ctx.lineTo(f.x - f.nx * f.w, f.y - f.ny * f.w);
  }
  ctx.closePath();

  const g = ctx.createLinearGradient(-0.50, -0.10, 0.75, 0.25);
  g.addColorStop(0.00, rgba(C_YELLOW, 0.14));
  g.addColorStop(0.45, rgba(C_GREEN , 0.11));
  g.addColorStop(1.00, rgba(C_PURPLE, 0.15));
  ctx.fillStyle = g;
  ctx.fill();

  /* ---- 5.2 横向环线 ---- */
  for (let i = 0; i <= NH_RING; i++){
    const s = i / NH_RING;
    const f = bodyFrame(s);

    const bow = 0.020 * (1 - Math.abs(s - 0.5) * 0.9);
    const x1 = f.x + f.nx * f.w;
    const y1 = f.y + f.ny * f.w;
    const x2 = f.x - f.nx * f.w;
    const y2 = f.y - f.ny * f.w;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(f.x + f.tx * bow, f.y + f.ty * bow, x2, y2);

    const col = triColor(s * 0.62 + t * 0.055);
    const k = 0.10 + 0.16 * (1 - Math.abs(s - 0.45) * 1.2);
    ctx.strokeStyle = rgba(col, Math.max(0, k));
    ctx.lineWidth = 0.0034;
    ctx.stroke();
  }

  /* ---- 5.3 纵向流动线 ---- */
  for (let j = 0; j < NV_LONG; j++){
    const u = (j / (NV_LONG - 1)) * 2 - 1;
    const edge = Math.abs(u);

    ctx.beginPath();
    for (let i = 0; i <= NSEG_BODY; i++){
      const s = i / NSEG_BODY;
      const f = bodyFrame(s);

      const ww = f.w * u
               * (1 + 0.09 * Math.sin(s * 11.0 - t * 3.1 + u * 2.0));

      const x = f.x + f.nx * ww;
      const y = f.y + f.ny * ww;

      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }

    const col = triColor(u * 0.18 + t * 0.055 + 0.10);
    const a = 0.075 + 0.16 * (1 - edge * 0.75);
    ctx.strokeStyle = rgba(col, a);
    ctx.lineWidth = 0.0040 * (1.10 - 0.42 * edge);
    ctx.stroke();
  }

  /* ---- 5.4 主脊 ---- */
  ctx.beginPath();
  for (let i = 0; i <= 140; i++){
    const s = i / 140;
    const f = bodyFrame(s);
    if (i === 0) ctx.moveTo(f.x, f.y); else ctx.lineTo(f.x, f.y);
  }
  ctx.strokeStyle = rgba(triColor(t * 0.055 + 0.16), 0.24);
  ctx.lineWidth = 0.0075;
  ctx.stroke();

  /* ---- 5.5 翅膀轮廓（覆盖腹部） ---- */
  for (let k = 0; k < 4; k++){
    const off = 0.024 + k * 0.020;

    ctx.beginPath();
    for (let i = 0; i <= 90; i++){
      const s = 0.42 + 0.56 * (i / 90);
      const f = bodyFrame(s);
      const ww = (f.w + off) * (1 - 0.05 * Math.sin(s * 8));
      const x = f.x + f.nx * ww;
      const y = f.y + f.ny * ww;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    const col = triColor(0.35 + k * 0.12 + t * 0.055);
    ctx.strokeStyle = rgba(col, 0.10 - k * 0.012);
    ctx.lineWidth = 0.0030;
    ctx.stroke();
  }
}

/* =========================================================
   6. 绘制：头部与眼睛
   ========================================================= */
function drawHead(t){
  const hx = -0.610, hy = -0.140;
  const jx = 0.008 * Math.sin(t * 33.0);
  const jy = 0.008 * Math.cos(t * 41.0);

  const X = hx + jx, Y = hy + jy;

  /* 头部轮廓：三角形 */
  ctx.beginPath();
  ctx.moveTo(X - 0.135, Y - 0.010);
  ctx.quadraticCurveTo(X - 0.05, Y - 0.095, X + 0.075, Y - 0.055);
  ctx.lineTo(X + 0.075, Y + 0.045);
  ctx.quadraticCurveTo(X - 0.05, Y + 0.085, X - 0.135, Y + 0.010);
  ctx.closePath();

  const g = ctx.createRadialGradient(X, Y, 0, X, Y, 0.16);
  g.addColorStop(0.00, rgba(C_YELLOW, 0.20));
  g.addColorStop(0.55, rgba(C_GREEN , 0.12));
  g.addColorStop(1.00, rgba(C_PURPLE, 0.04));
  ctx.fillStyle = g;
  ctx.fill();

  /* 头部网格 */
  for (let k = 0; k < 16; k++){
    const f = k / 15;
    const a1 = -Math.PI * 0.72 + f * Math.PI * 1.44;

    ctx.beginPath();
    ctx.moveTo(X + Math.cos(a1) * 0.135, Y + Math.sin(a1) * 0.055);
    ctx.lineTo(X + Math.cos(a1) * 0.028, Y + Math.sin(a1) * 0.016);
    ctx.strokeStyle = rgba(triColor(f * 0.5 + t * 0.055), 0.11);
    ctx.lineWidth = 0.0026;
    ctx.stroke();
  }

  /* 轮廓线 */
  ctx.beginPath();
  ctx.moveTo(X - 0.135, Y - 0.010);
  ctx.quadraticCurveTo(X - 0.05, Y - 0.095, X + 0.075, Y - 0.055);
  ctx.lineTo(X + 0.075, Y + 0.045);
  ctx.quadraticCurveTo(X - 0.05, Y + 0.085, X - 0.135, Y + 0.010);
  ctx.closePath();
  ctx.strokeStyle = rgba(C_YELLOW, 0.34);
  ctx.lineWidth = 0.0060;
  ctx.stroke();

  /* ---- 复眼 ---- */
  const eyes = [
    { x: X - 0.040, y: Y - 0.050 },
    { x: X - 0.040, y: Y + 0.050 }
  ];

  for (let e = 0; e < eyes.length; e++){
    const E = eyes[e];
    const r = 0.048 * (1 + 0.04 * Math.sin(t * 4.2 + e * 2.1));

    /* 外晕 */
    const ge = ctx.createRadialGradient(E.x, E.y, 0, E.x, E.y, r * 3.4);
    ge.addColorStop(0.00, rgba(C_GREEN , 0.45));
    ge.addColorStop(0.35, rgba(C_YELLOW, 0.20));
    ge.addColorStop(1.00, 'rgba(0,0,0,0)');
    ctx.fillStyle = ge;
    ctx.beginPath();
    ctx.arc(E.x, E.y, r * 3.4, 0, TAU);
    ctx.fill();

    /* 虹膜 */
    ctx.strokeStyle = rgba(C_YELLOW, 0.85);
    ctx.lineWidth = 0.0075;
    ctx.beginPath();
    ctx.arc(E.x, E.y, r, 0, TAU);
    ctx.stroke();

    /* 复眼小面 */
    for (let k = 0; k < 10; k++){
      const a = (k / 10) * TAU + t * 0.5;
      ctx.beginPath();
      ctx.moveTo(E.x, E.y);
      ctx.lineTo(E.x + Math.cos(a) * r * 0.86, E.y + Math.sin(a) * r * 0.86);
      ctx.strokeStyle = rgba(C_GREEN, 0.14);
      ctx.lineWidth = 0.0022;
      ctx.stroke();
    }

    /* 瞳孔 */
    ctx.fillStyle = rgba(C_PURPLE, 0.92);
    ctx.beginPath();
    ctx.arc(E.x, E.y, r * 0.40, 0, TAU);
    ctx.fill();
  }

  /* ---- 触角 ---- */
  for (const side of [-1, 1]){
    ctx.beginPath();
    let px = X - 0.055, py = Y + side * 0.045;

    for (let i = 0; i <= 34; i++){
      const f = i / 34;
      const x = X - 0.055 - f * 0.44;
      const y = Y + side * 0.045 + side * f * 0.36
              + Math.sin(f * 5.4 - t * 2.6 + side) * 0.055 * f;

      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }

    ctx.strokeStyle = rgba(triColor(side > 0 ? 0.22 : 0.55), 0.28);
    ctx.lineWidth = 0.0044;
    ctx.stroke();
  }
}

/* =========================================================
   7. 绘制：捕捉足（前肢）
   ========================================================= */
const SHOULDER_L = { x: -0.455, y: -0.040 };
const SHOULDER_R = { x: -0.455, y: -0.010 };

function drawForeleg(sx, sy, tipX, tipY, t, side, phase){
  /* 肘部：中点 + 法向偏移 */
  const mx = (sx + tipX) * 0.5;
  const my = (sy + tipY) * 0.5;

  let dx = tipX - sx, dy = tipY - sy;
  const L = Math.hypot(dx, dy) || 1;
  dx /= L; dy /= L;

  const bulge = 0.16 * side;
  const ex = mx + (-dy) * bulge;
  const ey = my + ( dx) * bulge;

  const col = triColor(phase + t * 0.09);

  /* ---- 7.1 基节（肩 → 肘） ---- */
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.quadraticCurveTo(
    (sx + ex) * 0.5 - dy * 0.04 * side,
    (sy + ey) * 0.5 + dx * 0.04 * side,
    ex, ey
  );
  ctx.strokeStyle = rgba(col, 0.30);
  ctx.lineWidth = 0.014;
  ctx.stroke();

  ctx.strokeStyle = rgba([250, 255, 220], 0.42);
  ctx.lineWidth = 0.0055;
  ctx.stroke();

  /* ---- 7.2 胫节（肘 → 尖端） ---- */
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.quadraticCurveTo(
    (ex + tipX) * 0.5 + dy * 0.05 * side,
    (ey + tipY) * 0.5 - dx * 0.05 * side,
    tipX, tipY
  );
  ctx.strokeStyle = rgba(col, 0.34);
  ctx.lineWidth = 0.012;
  ctx.stroke();

  ctx.strokeStyle = rgba([250, 255, 220], 0.48);
  ctx.lineWidth = 0.0048;
  ctx.stroke();

  /* ---- 7.3 胫刺 ---- */
  const NSP = 11;
  for (let k = 1; k < NSP; k++){
    const f = k / NSP;

    /* 沿二次曲线取点 */
    const u = 1 - f;
    const cxp = (ex + tipX) * 0.5 + dy * 0.05 * side;
    const cyp = (ey + tipY) * 0.5 - dx * 0.05 * side;

    const px = u*u*ex + 2*u*f*cxp + f*f*tipX;
    const py = u*u*ey + 2*u*f*cyp + f*f*tipY;

    /* 切线 */
    const tx = 2*u*(cxp - ex) + 2*f*(tipX - cxp);
    const ty = 2*u*(cyp - ey) + 2*f*(tipY - cyp);
    const tl = Math.hypot(tx, ty) || 1;

    const nx = -ty / tl, ny = tx / tl;
    const sl = (0.035 + 0.020 * Math.sin(k * 1.7)) * (0.9 + 0.3 * Math.sin(t * 6 + k));

    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + nx * sl * side, py + ny * sl * side);
    ctx.strokeStyle = rgba(col, 0.30);
    ctx.lineWidth = 0.0040;
    ctx.stroke();
  }

  /* ---- 7.4 尖端光点 ---- */
  const tw = 0.5 + 0.5 * Math.sin(t * 9.0 + phase * 6.0);

  ctx.fillStyle = rgba(col, 0.30 * tw);
  ctx.beginPath();
  ctx.arc(tipX, tipY, 0.055 * (0.7 + 0.6 * tw), 0, TAU);
  ctx.fill();

  ctx.fillStyle = rgba([255, 255, 235], 0.62 + 0.30 * tw);
  ctx.beginPath();
  ctx.arc(tipX, tipY, 0.014 * (0.8 + 0.5 * tw), 0, TAU);
  ctx.fill();
}

/* =========================================================
   8. 绘制：步行足
   ========================================================= */
function drawLegs(t){
  const att = [
    { s: 0.50, kx: 0.13, ky: 0.34, fx: 0.24, fy: 0.66 },
    { s: 0.60, kx: 0.14, ky: 0.33, fx: 0.26, fy: 0.63 },
    { s: 0.70, kx: 0.15, ky: 0.30, fx: 0.28, fy: 0.58 }
  ];

  for (let i = 0; i < att.length; i++){
    const A = att[i];

    for (const side of [1, -1]){
      const f = bodyFrame(A.s);
      const bx = f.x, by = f.y;

      const jx = 0.006 * Math.sin(t * 24 + i * 2.1 + side);
      const jy = 0.006 * Math.cos(t * 29 + i * 1.7 + side);

      const kx = bx + A.kx * side * 0.9 + jx;
      const ky = by + A.ky * side + jy;

      const fx = bx + A.fx + jx * 1.4;
      const fy = by + A.fy * side + jy * 1.2;

      const col = triColor(A.s * 0.6 + t * 0.055);

      /* 腿节 */
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(kx, ky, fx, fy);
      ctx.strokeStyle = rgba(col, 0.22);
      ctx.lineWidth = 0.0072;
      ctx.stroke();

      /* 关节光点 */
      ctx.fillStyle = rgba(col, 0.40);
      ctx.beginPath();
      ctx.arc(kx, ky, 0.011, 0, TAU);
      ctx.fill();

      /* 跗节 */
      ctx.beginPath();
      ctx.moveTo(fx, fy);
      ctx.lineTo(fx + 0.055, fy + 0.035 * side);
      ctx.strokeStyle = rgba(col, 0.28);
      ctx.lineWidth = 0.0055;
      ctx.stroke();
    }
  }
}

/* =========================================================
   9. 绘制：混沌轨迹
   ========================================================= */
function drawTrail(arr, phase){
  if (arr.length < 2) return;

  const n = arr.length;

  /* 分层绘制：外层光晕 + 内层亮芯 */
  for (let layer = 0; layer < 2; layer++){
    const isGlow = (layer === 0);

    for (let i = 1; i < n; i++){
      const f  = i / n;                    /* 越新越靠前 */
      const f0 = (i - 1) / n;

      const p0 = arr[i - 1];
      const p1 = arr[i];

      const col = triColor(phase + f * 0.55 + 0.12);

      /* 两端渐隐 */
      const env = Math.sin(Math.PI * f);
      const a = (isGlow ? 0.10 : 0.42) * env * env;

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);

      ctx.strokeStyle = rgba(col, a);
      ctx.lineWidth = isGlow ? 0.030 * (0.4 + f) : 0.0055 * (0.5 + f);
      ctx.stroke();
    }
  }
}

/* =========================================================
   10. 混沌吸引子投影（背景点缀）
   ========================================================= */
const ATTRACT_N = 900;
const attractPts = [];
(function seedAttractor(){
  const sys = new Rossler(1, 1, 1, 5.7);
  /* 预热 */
  for (let i = 0; i < 2200; i++) sys.step(0.012);
  for (let i = 0; i < ATTRACT_N; i++){
    sys.step(0.030);
    attractPts.push({ x: sys.x, y: sys.y, z: sys.z });
  }
})();

const ATTRACT_CX = 1.95;
const ATTRACT_CY = -0.62;
const ATTRACT_SC = 0.052;

function drawAttractor(t){
  for (let i = 0; i < ATTRACT_N; i++){
    const p = attractPts[i];

    const x = ATTRACT_CX + p.x * ATTRACT_SC;
    const y = ATTRACT_CY - p.y * ATTRACT_SC;

    const ph = (i / ATTRACT_N + t * 0.02) % 1;
    const tw = 0.4 + 0.6 * Math.sin(t * 2.4 + i * 0.7);

    const col = triColor(ph * 0.7 + t * 0.05);

    ctx.fillStyle = rgba(col, 0.045 * tw);
    ctx.beginPath();
    ctx.arc(x, y, 0.020, 0, TAU);
    ctx.fill();

    ctx.fillStyle = rgba([255, 255, 240], 0.12 * tw);
    ctx.beginPath();
    ctx.arc(x, y, 0.006, 0, TAU);
    ctx.fill();
  }
}

/* =========================================================
   11. 主循环
   ========================================================= */
let T = 0;
let last = performance.now();

function frame(now){
  requestAnimationFrame(frame);

  let dt = (now - last) / 1000;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  dt = Math.min(dt, 0.05);
  last = now;
  T += dt;

  /* ---- 积分 Rössler（多个子步保证精度） ---- */
  const SUB = 6;
  const hstep = dt * 0.015 / SUB;
  for (let k = 0; k < SUB; k++){
    sysL.step(hstep);
    sysR.step(hstep);
  }

  tipFromSys(sysL, _tipL);
  tipFromSys(sysR, _tipR);

  pushTrail(trailL, _tipL.x, _tipL.y);
  pushTrail(trailR, _tipR.x, _tipR.y);

  /* ---- 拖影 ---- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(0, 0, W, H);

  /* ---- 世界坐标 ---- */
  ctx.save();
  ctx.translate(CX, CY);
  ctx.scale(S, S);
  ctx.translate(0.06, 0.14);

  /* 混沌抖动 */
  const jx = 0.008 * Math.sin(T * 37.0) + 0.005 * Math.sin(T * 53.7);
  const jy = 0.008 * Math.cos(T * 41.0) + 0.005 * Math.cos(T * 61.3);
  ctx.translate(jx, jy);

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  drawAttractor(T);
  drawTrail(trailL, 0.00);
  drawTrail(trailR, 0.30);
  drawLegs(T);
  drawBody(T);
  drawForeleg(SHOULDER_L.x, SHOULDER_L.y, _tipL.x, _tipL.y, T, -1, 0.00);
  drawForeleg(SHOULDER_R.x, SHOULDER_R.y, _tipR.x, _tipR.y, T,  1, 0.30);
  drawHead(T);

  ctx.restore();
}

/* =========================================================
   12. 启动
   ========================================================= */
resize();
requestAnimationFrame(frame);

})();
</script>
