<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">GOLDEN SPIRAL · FIBONACCI</div>
    <h1>黄金分割螺旋</h1>
    <div class="sub">φ = (1 + √5) / 2 ≈ 1.6180339887…</div>
  </div>

  <div id="phiPanel">
    <span class="lab">GOLDEN RATIO</span>
    <span class="phi-sym">φ</span>
    <div class="phi-val">1.618033988749894…</div>
    <div class="kv">
      <div><span class="k">比值 </span><span class="v" id="ratioVal">—</span></div>
      <div><span class="k">误差 </span><span class="v" id="errorVal">—</span></div>
      <div><span class="k">当前 n </span><span class="v" id="nVal">0</span></div>
      <div><span class="k">缩放 </span><span class="v" id="zoomVal">1.0×</span></div>
    </div>
  </div>

  <div id="fibPanel">
    <div class="lab">FIBONACCI SEQUENCE · 30 BLOCKS</div>
    <div id="fibList"></div>
  </div>

  <div id="btns">
    <button class="btn" id="btnReplay">重 播</button>
    <button class="btn" id="btnFast">快 速 模 式</button>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>钟声渐强 · 螺旋旋转音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const PHI = (1 + Math.sqrt(5)) / 2;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1, S = 0;

/* =========================================================
   斐波那契数列 —— 方块数量翻倍到 30
   ========================================================= */
const N_BLOCKS = 30;
const FIB = [1, 1];
while (FIB.length < N_BLOCKS + 2){
  FIB.push(FIB[FIB.length - 1] + FIB[FIB.length - 2]);
}

/* =========================================================
   方块布局
   ========================================================= */
const blocks = [];
const DIRS = [
  { dx:  1, dy:  0 },
  { dx:  0, dy:  1 },
  { dx: -1, dy:  0 },
  { dx:  0, dy: -1 }
];

function buildBlocks(){
  blocks.length = 0;

  let x = 0, y = 0;
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;

  for (let i = 0; i < N_BLOCKS; i++){
    const size = FIB[N_BLOCKS - i];
    const dir = DIRS[Math.floor(i / 2) % 4];

    blocks.push({
      x: x, y: y,
      size: size,
      dirIdx: Math.floor(i / 2) % 4,
      index: i
    });

    if (x < minX) minX = x;
    if (y < minY) minY = y;
    if (x + size > maxX) maxX = x + size;
    if (y + size > maxY) maxY = y + size;

    if (dir.dx > 0){
      x = x + size;
    } else if (dir.dy > 0){
      y = y + size;
    } else if (dir.dx < 0){
      x = x - FIB[N_BLOCKS - i - 1];
    } else if (dir.dy < 0){
      y = y - FIB[N_BLOCKS - i - 1];
    }
  }

  const ww = maxX - minX;
  const hh = maxY - minY;
  const ox = -(minX + maxX) * 0.5;
  const oy = -(minY + maxY) * 0.5;

  for (let i = 0; i < blocks.length; i++){
    blocks[i].x += ox;
    blocks[i].y += oy;
  }

  return { ww: ww, hh: hh };
}

let worldInfo = { ww: 1, hh: 1 };

/* =========================================================
   相机系统 —— 跟随当前绘制的方块，实现连续放大效果
   ========================================================= */
const cam = {
  scale: 1,
  ox: 0,
  oy: 0
};

let camKeys = [];   // 每个方块对应的相机关键帧

function buildCamKeys(){
  camKeys = blocks.map(function(b){
    return {
      cx: b.x + b.size * 0.5,
      cy: b.y + b.size * 0.5,
      viewSize: b.size * 3.8
    };
  });
}

/* 全局屏幕映射（由相机实时更新） */
let scale = 1, originX = 0, originY = 0;

/* 根据 animT 求相机目标状态 */
function camTargetAt(t){
  const perBlock = BLOCK_DUR + BLOCK_GAP;
  let p = (t - T_START) / perBlock;
  if (p < 0) p = 0;
  if (p > N_BLOCKS - 1) p = N_BLOCKS - 1;

  const i0 = Math.floor(p);
  const i1 = Math.min(N_BLOCKS - 1, i0 + 1);
  const fr = p - i0;

  const k0 = camKeys[i0];
  const k1 = camKeys[i1];

  return {
    cxw: k0.cx + (k1.cx - k0.cx) * fr,
    cyw: k0.cy + (k1.cy - k0.cy) * fr,
    viewSize: Math.exp(
      Math.log(k0.viewSize) * (1 - fr) + Math.log(k1.viewSize) * fr
    )
  };
}

function snapCamera(t){
  if (camKeys.length === 0) return;
  const tg = camTargetAt(t);
  const ts = Math.min(W, H) / tg.viewSize;
  const tox = W * 0.5 - tg.cxw * ts;
  const toy = H * 0.5 - tg.cyw * ts;

  cam.scale = ts;
  cam.ox = tox;
  cam.oy = toy;

  scale = ts;
  originX = tox;
  originY = toy;
}

function updateCamera(t, dt){
  if (camKeys.length === 0) return;

  const tg = camTargetAt(t);
  const ts  = Math.min(W, H) / tg.viewSize;
  const tox = W * 0.5 - tg.cxw * ts;
  const toy = H * 0.5 - tg.cyw * ts;

  /* 平滑追踪 —— 用较高系数保证不滞帧 */
  const k = 1 - Math.exp(-7.5 * dt);

  cam.scale += (ts  - cam.scale) * k;
  cam.ox    += (tox - cam.ox)    * k;
  cam.oy    += (toy - cam.oy)    * k;

  scale = cam.scale;
  originX = cam.ox;
  originY = cam.oy;
}

/* 世界坐标 → 屏幕坐标 */
function toScreen(wx, wy){
  return {
    x: originX + wx * scale,
    y: originY + wy * scale
  };
}

/* =========================================================
   初始布局
   ========================================================= */
function computeTransform(){
  worldInfo = buildBlocks();
  buildCamKeys();
  snapCamera(0);
}

/* =========================================================
   弧线参数
   ========================================================= */
function getArc(block){
  const x = block.x;
  const y = block.y;
  const s = block.size;
  const idx = block.dirIdx;

  let cx0, cy0, startAng, endAng;

  if (idx === 0){
    cx0 = x; cy0 = y;
    startAng = -Math.PI / 2;
    endAng = 0;
  } else if (idx === 1){
    cx0 = x; cy0 = y;
    startAng = 0;
    endAng = Math.PI / 2;
  } else if (idx === 2){
    cx0 = x + s; cy0 = y;
    startAng = Math.PI / 2;
    endAng = Math.PI;
  } else {
    cx0 = x + s; cy0 = y;
    startAng = Math.PI;
    endAng = Math.PI * 1.5;
  }

  return {
    cx: cx0, cy: cy0,
    r: s,
    startAng: startAng,
    endAng: endAng
  };
}

/* =========================================================
   时间轴
   ========================================================= */
const BLOCK_DUR = 0.52;
const BLOCK_GAP = 0.035;
const ARC_DUR   = 0.38;
const START_DELAY = 0.55;
const FINAL_HOLD = 3.2;

let T_START = START_DELAY;
let T_END = 0;

function recomputeTimeline(){
  T_START = START_DELAY;
  T_END = T_START + N_BLOCKS * (BLOCK_DUR + BLOCK_GAP) + FINAL_HOLD;
}
recomputeTimeline();

let animT = 0;
let playing = true;

const blockP = new Array(N_BLOCKS).fill(0);
const arcP   = new Array(N_BLOCKS).fill(0);

/* =========================================================
   粒子
   ========================================================= */
const sparks = [];

function spawnSpark(x, y, hue, count){
  for (let i = 0; i < count; i++){
    const a = Math.random() * TAU;
    const sp = 40 + Math.random() * 180;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.6 + Math.random() * 1.6,
      size: 0.9 + Math.random() * 2.4,
      hue: hue + (Math.random() - 0.5) * 30
    });
  }
}

function updateSparks(dt){
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= s.decay * dt;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.94;
    s.vy *= 0.94;
  }
}

function drawSparks(){
  if (sparks.length === 0) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < sparks.length; i++){
    const s = sparks[i];
    const a = s.life * s.life * 0.86;
    const r = s.size * s.life;

    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4.5);
    g.addColorStop(0.00, 'hsla(' + s.hue + ', 100%, 92%, ' + a + ')');
    g.addColorStop(0.42, 'hsla(' + s.hue + ', 100%, 74%, ' + (a * 0.30) + ')');
    g.addColorStop(1.00, 'hsla(' + s.hue + ', 100%, 62%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let spinOsc = null;
let spinGain = null;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.54, ac.currentTime, 1.8);

  const kick = function(){
    setAudioOn(true);
    startSpin();
  };

  if (ac.state === 'suspended'){
    ac.resume().then(kick).catch(function(){ audioReady = false; });
  } else {
    kick();
  }
}

function startSpin(){
  const now = ac.currentTime;

  spinOsc = ac.createOscillator();
  spinOsc.type = 'sawtooth';
  spinOsc.frequency.value = 62;

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 380;
  lp.Q.value = 3.8;

  spinGain = ac.createGain();
  spinGain.gain.value = 0;
  spinGain.gain.setTargetAtTime(0.014, now, 3.0);

  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.065;
  const lg = ac.createGain();
  lg.gain.value = 14;
  lfo.connect(lg);
  lg.connect(spinOsc.frequency);
  lfo.start(now);

  const flfo = ac.createOscillator();
  flfo.frequency.value = 0.11;
  const flg = ac.createGain();
  flg.gain.value = 210;
  flfo.connect(flg);
  flg.connect(lp.frequency);
  flfo.start(now);

  const glfo = ac.createOscillator();
  glfo.frequency.value = 0.18;
  const glg = ac.createGain();
  glg.gain.value = 0.007;
  glfo.connect(glg);
  glg.connect(spinGain.gain);
  glfo.start(now);

  spinOsc.connect(lp);
  lp.connect(spinGain);
  spinGain.connect(master);
  spinOsc.start(now);
}

/* 钟声：音高随方块序号上升 */
function playBell(blockIdx){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const base = 261.63;
  const idx = Math.min(blockIdx, 24);
  const mult = Math.pow(PHI, idx * 0.11);
  const freq = base * mult;

  /* 限制频率范围，避免刺耳 */
  const f = Math.max(140, Math.min(3600, freq));

  const partials = [
    { ratio: 1.0000, gain: 0.045, decay: 1.4 },
    { ratio: 2.0034, gain: 0.022, decay: 1.1 },
    { ratio: 2.9945, gain: 0.012, decay: 0.85 },
    { ratio: 4.0100, gain: 0.005, decay: 0.65 },
    { ratio: 5.4200, gain: 0.0025, decay: 0.5 }
  ];

  for (let i = 0; i < partials.length; i++){
    const pr = partials[i];
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f * pr.ratio;

    const g = ac.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(pr.gain, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now + pr.decay);

    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + pr.decay + 0.1);
  }

  const nl = Math.max(1, Math.ceil(ac.sampleRate * 0.02));
  const nbuf = ac.createBuffer(1, nl, ac.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const tt = i / nl;
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - tt, 3.0);
  }
  const nsrc = ac.createBufferSource();
  nsrc.buffer = nbuf;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = Math.min(6000, f * 3.5);
  bp.Q.value = 2.4;

  const ng = ac.createGain();
  ng.gain.value = 0.010;

  nsrc.connect(bp);
  bp.connect(ng);
  ng.connect(master);
  nsrc.start(now);
}

function playFinalChord(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
  for (let i = 0; i < notes.length; i++){
    const f = notes[i];
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;

    const g = ac.createGain();
    const t0 = now + i * 0.11;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.055, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0003, t0 + 2.4);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 2.6);
  }
}

const bellFlags = new Array(N_BLOCKS).fill(false);
let finalFlag = false;

/* =========================================================
   绘制：方块
   ========================================================= */
function drawBlock(b, p, arcProgress){
  if (p <= 0.001) return;

  const x = b.x, y = b.y;
  const s = b.size;

  const s1 = toScreen(x, y);
  const s2 = toScreen(x + s, y + s);
  const px = s1.x, py = s1.y;
  const pw = s2.x - s1.x, ph = s2.y - s1.y;

  const e = 1 - Math.pow(1 - p, 3);

  /* 光晕 */
  const cxw = x + s * 0.5, cyw = y + s * 0.5;
  const cScr = toScreen(cxw, cyw);
  const glowR = Math.max(pw, ph) * 1.1;

  ctx.globalCompositeOperation = 'lighter';
  const gg = ctx.createRadialGradient(cScr.x, cScr.y, 0, cScr.x, cScr.y, glowR);
  gg.addColorStop(0.00, 'hsla(42, 100%, 78%, ' + (0.09 * e) + ')');
  gg.addColorStop(0.42, 'hsla(34, 100%, 68%, ' + (0.034 * e) + ')');
  gg.addColorStop(1.00, 'hsla(28, 100%, 60%, 0)');
  ctx.fillStyle = gg;
  ctx.fillRect(px - pw * 0.4, py - ph * 0.4, pw * 1.8, ph * 1.8);
  ctx.globalCompositeOperation = 'source-over';

  /* 填充 */
  ctx.save();
  ctx.beginPath();
  ctx.rect(px, py, pw, ph);
  ctx.clip();

  const bg = ctx.createLinearGradient(px, py, px + pw, py + ph);
  bg.addColorStop(0.00, 'hsla(228, 42%, 12%, ' + (0.62 * e) + ')');
  bg.addColorStop(0.45, 'hsla(232, 40%, 14%, ' + (0.55 * e) + ')');
  bg.addColorStop(1.00, 'hsla(236, 38%, 10%, ' + (0.62 * e) + ')');
  ctx.fillStyle = bg;
  ctx.fillRect(px, py, pw, ph);

  const rg = ctx.createRadialGradient(cScr.x, cScr.y, 0, cScr.x, cScr.y, glowR);
  rg.addColorStop(0.00, 'hsla(42, 100%, 74%, ' + (0.15 * e) + ')');
  rg.addColorStop(0.55, 'hsla(34, 90%, 62%, ' + (0.05 * e) + ')');
  rg.addColorStop(1.00, 'hsla(30, 90%, 52%, 0)');
  ctx.fillStyle = rg;
  ctx.fillRect(px, py, pw, ph);

  const dg = ctx.createLinearGradient(px, py, px + pw, py + ph);
  dg.addColorStop(0.00, 'rgba(255,220,160,' + (0.06 * e) + ')');
  dg.addColorStop(0.50, 'rgba(255,220,160,0)');
  dg.addColorStop(1.00, 'rgba(200,160,255,' + (0.04 * e) + ')');
  ctx.fillStyle = dg;
  ctx.fillRect(px, py, pw, ph);

  ctx.restore();

  /* 边框 */
  ctx.strokeStyle = 'hsla(40, 88%, 72%, ' + (0.20 + 0.45 * e) + ')';
  ctx.lineWidth = 1.2;
  ctx.strokeRect(px, py, pw, ph);

  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'hsla(42, 100%, 70%, ' + (0.09 * e) + ')';
  ctx.lineWidth = 5;
  ctx.strokeRect(px, py, pw, ph);
  ctx.globalCompositeOperation = 'source-over';

  /* 边长标签 */
  if (e > 0.35){
    const a = (e - 0.35) / 0.65;
    const fs = Math.max(10, Math.min(22, Math.min(pw, ph) * 0.22));

    ctx.font = '500 ' + fs.toFixed(0) + 'px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const text = String(s);

    ctx.strokeStyle = 'rgba(4,6,16,' + (a * 0.85) + ')';
    ctx.lineWidth = Math.max(2, fs * 0.18);
    ctx.lineJoin = 'round';
    ctx.strokeText(text, cScr.x, cScr.y);

    ctx.fillStyle = 'hsla(42, 100%, 84%, ' + (a * 0.90) + ')';
    ctx.fillText(text, cScr.x, cScr.y);
  }

  /* 圆弧 */
  if (arcProgress > 0.001){
    drawArc(b, arcProgress);
  }
}

function drawArc(b, progress){
  const arc = getArc(b);
  const p = 1 - Math.pow(1 - progress, 3);

  const cScr = toScreen(arc.cx, arc.cy);
  const rScr = arc.r * scale;

  if (rScr < 2) return;

  const endAng = arc.startAng + (arc.endAng - arc.startAng) * p;

  /* 外发光 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.arc(cScr.x, cScr.y, rScr, arc.startAng, endAng);
  ctx.strokeStyle = 'rgba(255, 210, 140, 0.18)';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.stroke();

  /* 主弧线 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath();
  ctx.arc(cScr.x, cScr.y, rScr, arc.startAng, endAng);

  const grad = ctx.createLinearGradient(
    cScr.x - rScr, cScr.y - rScr,
    cScr.x + rScr, cScr.y + rScr
  );
  grad.addColorStop(0.00, '#ffe4a8');
  grad.addColorStop(0.50, '#ffc274');
  grad.addColorStop(1.00, '#e8a0c8');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.stroke();

  /* 弧端高光 */
  if (p > 0.05){
    const headX = cScr.x + Math.cos(endAng) * rScr;
    const headY = cScr.y + Math.sin(endAng) * rScr;

    const hg = ctx.createRadialGradient(headX, headY, 0, headX, headY, rScr * 0.14 + 8);
    hg.addColorStop(0.00, 'rgba(255, 245, 220, 0.92)');
    hg.addColorStop(0.42, 'rgba(255, 200, 140, 0.32)');
    hg.addColorStop(1.00, 'rgba(255, 180, 120, 0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(headX, headY, rScr * 0.14 + 8, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* =========================================================
   背景
   ========================================================= */
const stars = [];

function buildStars(){
  stars.length = 0;
  const n = Math.min(260, Math.round(S * 0.38));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.1 + 0.15,
      ph: Math.random() * TAU,
      sp: 0.22 + Math.random() * 0.85,
      hue: 220 + Math.random() * 80,
      base: 0.08 + Math.random() * 0.28
    });
  }
}

function drawBackground(t){
  ctx.fillStyle = '#04060e';
  ctx.fillRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.82
  );
  bg.addColorStop(0.00, 'rgba(38, 26, 62, 0.38)');
  bg.addColorStop(0.42, 'rgba(20, 14, 42, 0.16)');
  bg.addColorStop(1.00, 'rgba(2, 4, 10, 0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.02) continue;
    ctx.fillStyle = 'hsla(' + s.hue + ', 80%, 86%, ' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   已完成弧的集合光带
   ========================================================= */
function drawFullSpiral(){
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();

  let started = false;

  for (let i = 0; i < N_BLOCKS; i++){
    if (arcP[i] <= 0.001) continue;

    const arc = getArc(blocks[i]);
    const cScr = toScreen(arc.cx, arc.cy);
    const rScr = arc.r * scale;
    if (rScr < 2) continue;

    const p = 1 - Math.pow(1 - arcP[i], 3);
    const endAng = arc.startAng + (arc.endAng - arc.startAng) * p;

    if (!started){
      ctx.moveTo(
        cScr.x + Math.cos(arc.startAng) * rScr,
        cScr.y + Math.sin(arc.startAng) * rScr
      );
      started = true;
    }

    ctx.arc(cScr.x, cScr.y, rScr, arc.startAng, endAng);
  }

  if (started){
    ctx.strokeStyle = 'rgba(255, 220, 160, 0.16)';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   主渲染
   ========================================================= */
function render(t){
  drawBackground(t);

  drawFullSpiral();

  for (let i = 0; i < N_BLOCKS; i++){
    if (blockP[i] <= 0.001 && arcP[i] <= 0.001) continue;
    drawBlock(blocks[i], blockP[i], arcP[i]);
  }

  drawSparks();

  /* 中心十字标记（相机跟踪点） */
  const centerX = W * 0.5;
  const centerY = H * 0.5;
  const pulse = 1 + 0.2 * Math.sin(t * 2.4);

  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.arc(centerX, centerY, 2.4 * pulse, 0, TAU);
  ctx.fillStyle = 'rgba(255, 230, 180, 0.42)';
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.32,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.82
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.26)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.88)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   HUD
   ========================================================= */
let hudTick = 0;

function updateHUD(){
  hudTick++;
  if (hudTick % 6 !== 0) return;

  let n = 0;
  for (let i = 0; i < N_BLOCKS; i++){
    if (blockP[i] > 0.01) n = i + 1;
  }

  let ratio = '—';
  let error = '—';

  if (n >= 3){
    const fA = FIB[n - 1];
    const fB = FIB[n - 2];
    if (fB > 0){
      const r = fA / fB;
      ratio = r.toFixed(6);
      error = Math.abs(r - PHI).toExponential(2);
    }
  }

  const rv = document.getElementById('ratioVal');
  const ev = document.getElementById('errorVal');
  const nv = document.getElementById('nVal');
  if (rv) rv.textContent = ratio;
  if (ev) ev.textContent = error;
  if (nv) nv.textContent = n;

  /* 缩放倍率显示 */
  const zv = document.getElementById('zoomVal');
  if (zv && camKeys.length > 0){
    const baseScale = Math.min(W, H) / camKeys[0].viewSize;
    zv.textContent = (cam.scale / baseScale).toFixed(2) + '×';
  }

  /* 斐波那契点亮 */
  for (let i = 0; i < N_BLOCKS; i++){
    const el = document.getElementById('fib-' + i);
    if (el) el.classList.toggle('on', blockP[i] > 0.5);
  }
}

/* =========================================================
   构建斐波那契列表
   ========================================================= */
function buildFibList(){
  const list = document.getElementById('fibList');
  if (!list) return;
  list.innerHTML = '';

  for (let i = 0; i < N_BLOCKS; i++){
    const span = document.createElement('span');
    span.id = 'fib-' + i;
    span.textContent = FIB[N_BLOCKS - i];
    list.appendChild(span);
  }
}

/* =========================================================
   动画推进
   ========================================================= */
function advance(dt){
  if (!playing) return;

  animT += dt;

  for (let i = 0; i < N_BLOCKS; i++){
    const t0 = T_START + i * (BLOCK_DUR + BLOCK_GAP);

    blockP[i] = Math.max(0, Math.min(1, (animT - t0) / BLOCK_DUR));

    const arcStart = t0 + BLOCK_DUR * 0.55;
    arcP[i] = Math.max(0, Math.min(1, (animT - arcStart) / ARC_DUR));

    /* 钟声 + 火花 */
    if (!bellFlags[i] && animT >= t0){
      bellFlags[i] = true;
      playBell(i);

      const b = blocks[i];
      const cScr = toScreen(b.x + b.size * 0.5, b.y + b.size * 0.5);
      spawnSpark(cScr.x, cScr.y, 38, 10);
    }
  }

  if (!finalFlag && animT >= T_END - FINAL_HOLD + 0.6){
    finalFlag = true;
    playFinalChord();
  }

  /* 循环 */
  if (animT > T_END){
    animT = 0;
    for (let i = 0; i < N_BLOCKS; i++){
      blockP[i] = 0;
      arcP[i] = 0;
      bellFlags[i] = false;
    }
    finalFlag = false;
    snapCamera(0);
  }
}

/* =========================================================
   布局
   ========================================================= */
function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);
  computeTransform();
  buildStars();
}
window.addEventListener('resize', layout);

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  advance(dt);
  updateCamera(animT, dt);
  updateSparks(dt);
  render(t);
  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
function restart(){
  animT = 0;
  for (let i = 0; i < N_BLOCKS; i++){
    blockP[i] = 0;
    arcP[i] = 0;
    bellFlags[i] = false;
  }
  finalFlag = false;
  sparks.length = 0;
  playing = true;
  snapCamera(0);
}

document.getElementById('btnReplay').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  restart();
});

document.getElementById('btnFast').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();

  animT = T_END - FINAL_HOLD + 0.4;
  for (let i = 0; i < N_BLOCKS; i++){
    blockP[i] = 1;
    arcP[i] = 1;
    bellFlags[i] = true;
  }
  finalFlag = true;
  snapCamera(animT);
  playFinalChord();
});

canvas.addEventListener('pointerdown', function(){
  initAudio();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    restart();
  } else if (e.key === 'f' || e.key === 'F'){
    initAudio();
    animT = T_END - FINAL_HOLD + 0.4;
    for (let i = 0; i < N_BLOCKS; i++){
      blockP[i] = 1;
      arcP[i] = 1;
      bellFlags[i] = true;
    }
    finalFlag = true;
    snapCamera(animT);
    playFinalChord();
  }
});

/* =========================================================
   启动
   ========================================================= */
buildFibList();
layout();
requestAnimationFrame(loop);

})();
</script>
