<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分形真菌 · 数字孢子</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; width: 100%; height: 100%; }

  /* ================= 左侧 1/5 公式面板 ================= */
  #panel {
    flex: 0 0 20%;
    width: 20%;
    min-width: 190px;
    position: relative;
    box-sizing: border-box;
    padding: 0 2.2% 0 3%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background:
      radial-gradient(150% 90% at 100% 42%, rgba(255, 210, 40, 0.13), rgba(0,0,0,0) 62%),
      radial-gradient(130% 80% at 0% 88%, rgba(255, 60, 160, 0.12), rgba(0,0,0,0) 60%),
      radial-gradient(120% 70% at 60% 8%, rgba(60, 255, 120, 0.08), rgba(0,0,0,0) 58%),
      #000;
    border-right: 1px solid rgba(255, 215, 70, 0.24);
    box-shadow: 8px 0 34px -14px rgba(255, 200, 60, 0.42);
    overflow: hidden;
  }
  #panel::after {
    content: "";
    position: absolute; top: 0; right: -1px; width: 2px; height: 100%;
    background: linear-gradient(180deg,
      rgba(0,0,0,0) 0%,
      rgba(255, 225, 90, 0.95) 30%,
      rgba(255, 70, 170, 0.95) 62%,
      rgba(70, 255, 130, 0.95) 84%,
      rgba(0,0,0,0) 100%);
    filter: blur(1px);
    opacity: .7;
    animation: seam 5.5s ease-in-out infinite;
  }
  @keyframes seam {
    0%, 100% { opacity: .42; }
    50%      { opacity: 1; }
  }

  .kicker {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(8px, 0.7vw, 11.5px);
    letter-spacing: .32em;
    color: #ffd84a;
    opacity: .85;
    margin-bottom: 1.1em;
    text-shadow: 0 0 12px rgba(255, 210, 50, .85);
  }
  h1 {
    font-size: clamp(15px, 1.45vw, 26px);
    line-height: 1.3;
    font-weight: 600;
    margin: 0 0 .18em 0;
    color: #f4fff6;
    letter-spacing: .02em;
    text-shadow: 0 0 20px rgba(120, 255, 150, .5);
  }
  .sub {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(8px, 0.7vw, 12px);
    color: #ff5fb0;
    letter-spacing: .12em;
    margin-bottom: 2.4em;
    text-shadow: 0 0 14px rgba(255, 70, 170, .8);
  }
  .eq {
    margin: 0 0 1.5em 0;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 0;
    scrollbar-width: none;
  }
  .eq::-webkit-scrollbar { height: 3px; }
  .eq::-webkit-scrollbar-thumb { background: rgba(255, 215, 70, .3); }

  .eq .katex {
    color: #ffe14d;
    text-shadow:
      0 0 10px rgba(255, 215, 50, .85),
      0 0 30px rgba(255, 170, 0, .40);
  }
  .eq.pink .katex {
    color: #ff74c0;
    text-shadow:
      0 0 10px rgba(255, 80, 170, .9),
      0 0 30px rgba(255, 30, 130, .45);
  }

  .desc {
    font-size: clamp(9px, 0.76vw, 12.5px);
    line-height: 1.9;
    color: rgba(215, 235, 220, .60);
    border-left: 2px solid rgba(120, 255, 150, .32);
    padding-left: .9em;
    letter-spacing: .03em;
  }
  .desc b { color: #8dffb0; font-weight: 500; }

  /* ================= 右侧 4/5 舞台 ================= */
  #stage {
    flex: 1 1 80%;
    position: relative;
    background: #000;
    overflow: hidden;
  }
  #c {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div id="app">

  <aside id="panel">
    <div class="kicker">FRACTAL DIMENSION</div>
    <h1>分形维数</h1>
    <div class="sub">FRACTAL DIMENSION</div>

    <div class="eq" id="eq1"></div>
    <div class="eq pink" id="eq2"></div>

    <div class="desc">
      <b>自相似</b>的递归结构，<br>
      在尺度变换下保持形态。<br>
      维数不必是整数——<br>
      它是生长在缝隙里的<br>
      <b>数字生命</b>。
    </div>
  </aside>

  <main id="stage">
    <canvas id="c"></canvas>
  </main>

</div>

<script>
/* =====================================================================
   0. KaTeX 渲染分形维数公式
   ===================================================================== */
function renderMath() {
  if (!window.katex) return;
  const eq1 = document.getElementById('eq1');
  const eq2 = document.getElementById('eq2');
  try {
    katex.render(
      String.raw`D \;=\; \dfrac{\log N}{\log(1/r)}`,
      eq1, { displayMode: true, throwOnError: false }
    );
    katex.render(
      String.raw`D_{B} \;=\; \lim_{\varepsilon \to 0} \dfrac{\log N(\varepsilon)}{\log(1/\varepsilon)}`,
      eq2, { displayMode: true, throwOnError: false }
    );
  } catch (e) {
    eq1.textContent = 'D = log N / log(1/r)';
    eq2.textContent = 'D_B = lim log N(ε) / log(1/ε)';
  }
}
window.addEventListener('load', renderMath);

/* =====================================================================
   1. 基础
   ===================================================================== */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

const TAU  = Math.PI * 2;
const HUES = [58, 330, 132];   // 荧光黄 · 粉红 · 亮绿

let W, H, CX, CY, S, DPR;

/* 分形参数 */
const MAX_NODES  = 220;
const MAX_DEPTH  = 5;
const MAX_SPORES = 700;

let nodes = [];
let spores = [];
let T = 0;

/* =====================================================================
   2. 尺寸
   ===================================================================== */
let lastW = 0, lastH = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, cv.clientWidth);
  const h = Math.max(1, cv.clientHeight);
  if (w === lastW && h === lastH) return;
  lastW = w; lastH = h;

  DPR = dpr;
  W = cv.width  = Math.floor(w * dpr);
  H = cv.height = Math.floor(h * dpr);
  CX = W / 2;
  CY = H / 2;
  S  = Math.min(W, H) / 800;

  init();
}

/* =====================================================================
   3. 节点模型
   ===================================================================== */
function makeNode(x, y, ang, r, depth, hue, birth, parent) {
  return {
    x, y, ang, r, depth, hue,
    birth,
    parent,
    children: [],
    split: false,
    isRoot: false,
    splitTimer: 0,
    sporeTimer: Math.random() * 0.5,
    seed: Math.random() * 1000,
    _g: 0,
    growDur:  (1.10 + Math.random() * 0.70) * Math.pow(0.87, depth),
    holdDur:  2.20 + Math.random() * 1.80,
    fadeDur:  1.40 + Math.random() * 1.00
  };
}

function init() {
  nodes = [];
  spores = [];

  const root = makeNode(
    CX, CY + H * 0.26,
    -Math.PI / 2,
    130 * S,
    0, HUES[0],
    T - 3,
    null
  );
  root.isRoot   = true;
  root.holdDur  = 1e9;
  root.splitTimer = 0.6;
  root._g = 1;

  nodes.push(root);
}

/* 生长曲线：0 → 1 → 1 → 0 */
function growOf(node, t) {
  const age = t - node.birth;
  if (age <= 0) return 0;
  const { growDur, holdDur, fadeDur } = node;
  if (age < growDur) {
    const u = age / growDur;
    return 1 - Math.pow(1 - u, 3);
  }
  if (age < growDur + holdDur) return 1;
  const u = (age - growDur - holdDur) / fadeDur;
  return Math.max(0, 1 - u);
}

/* =====================================================================
   4. 孢子
   ===================================================================== */
function pushSpore(x, y, vx, vy, hue, size, life) {
  if (spores.length >= MAX_SPORES) return;
  spores.push({
    x, y, px: x, py: y,
    vx, vy,
    hue, r: size,
    life, maxLife: life,
    seed: Math.random() * 1000
  });
}

/* 单个孢子（缓慢逸散） */
function emitSpore(node) {
  const g = node._g;
  if (g < 0.5) return;
  const a  = node.ang + (Math.random() - 0.5) * 2.1;
  const rr = node.r * g * (0.72 + Math.random() * 0.35);
  const x  = node.x + Math.cos(a) * rr;
  const y  = node.y + Math.sin(a) * rr;
  const sp = (14 + Math.random() * 30) * S;

  pushSpore(
    x, y,
    Math.cos(a) * sp, Math.sin(a) * sp - 6 * S,
    node.hue + (Math.random() - 0.5) * 46,
    (0.7 + Math.random() * 1.3) * S,
    2.6 + Math.random() * 2.6
  );
}

/* 分裂瞬间的孢子爆发 */
function burstSpores(node, count) {
  const g = Math.max(0.55, node._g);
  for (let i = 0; i < count; i++) {
    const a  = node.ang + (Math.random() - 0.5) * 2.5;
    const rr = node.r * g * (0.55 + Math.random() * 0.65);
    const x  = node.x + Math.cos(a) * rr;
    const y  = node.y + Math.sin(a) * rr;
    const sp = (28 + Math.random() * 58) * S;

    pushSpore(
      x, y,
      Math.cos(a) * sp, Math.sin(a) * sp - 10 * S,
      node.hue + (Math.random() - 0.5) * 55,
      (0.8 + Math.random() * 1.7) * S,
      3.0 + Math.random() * 3.2
    );
  }
}

/* =====================================================================
   5. 递归分裂
   ===================================================================== */
function spawnChildren(node) {
  const n      = 2 + (Math.random() < 0.45 ? 1 : 0);
  const spread = 0.82 + Math.random() * 0.50;

  for (let i = 0; i < n; i++) {
    const f   = n === 1 ? 0 : (i / (n - 1) - 0.5);
    const ang = node.ang + f * spread + (Math.random() - 0.5) * 0.22;

    const dist = node.r * (0.42 + Math.random() * 0.22);
    const x = node.x + Math.cos(ang) * dist;
    const y = node.y + Math.sin(ang) * dist;

    const r   = node.r * (0.60 + Math.random() * 0.12);
    const hue = HUES[(node.depth + 1 + ((Math.random() * 2) | 0)) % 3];

    const child = makeNode(
      x, y, ang, r,
      node.depth + 1,
      ((hue + (Math.random() - 0.5) * 16) % 360 + 360) % 360,
      T + Math.random() * 0.28,
      node
    );

    node.children.push(child);
    nodes.push(child);
  }

  burstSpores(node, 10 + ((Math.random() * 8) | 0));
}

/* =====================================================================
   6. 更新
   ===================================================================== */
function update(dt) {
  /* --- 6.1 生长进度 & 清理死亡节点 --- */
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    n._g = growOf(n, T);
    const total = n.growDur + n.holdDur + n.fadeDur;
    if (T - n.birth > total) nodes.splice(i, 1);
  }

  /* --- 6.2 分裂 --- */
  const snapshot = nodes.slice();
  for (let i = 0; i < snapshot.length; i++) {
    const n = snapshot[i];

    if (n.isRoot) {
      n.splitTimer -= dt;
      if (n.splitTimer <= 0) {
        n.splitTimer = 2.0 + Math.random() * 1.8;
        if (nodes.length < MAX_NODES) spawnChildren(n);
      }
    } else if (!n.split && n._g > 0.55 &&
               n.depth < MAX_DEPTH && nodes.length < MAX_NODES) {
      n.split = true;
      spawnChildren(n);
    }
  }

  /* --- 6.3 孢子生成 --- */
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.isRoot || n._g <= 0.5) continue;
    n.sporeTimer -= dt;
    if (n.sporeTimer <= 0) {
      n.sporeTimer = 0.35 + Math.random() * 0.85;
      emitSpore(n);
    }
  }

  /* --- 6.4 孢子物理 --- */
  const damp = Math.pow(0.985, dt * 60);
  for (let i = spores.length - 1; i >= 0; i--) {
    const s = spores[i];
    s.life -= dt;
    if (s.life <= 0) { spores.splice(i, 1); continue; }

    s.px = s.x; s.py = s.y;

    s.vx *= damp;
    s.vy *= damp;
    s.vy -= 26 * S * dt;                                // 上浮
    s.vx += Math.sin(T * 1.4 + s.seed) * 18 * S * dt;   // 漂移
    s.vy += Math.cos(T * 1.1 + s.seed * 1.7) * 14 * S * dt;

    s.x += s.vx * dt;
    s.y += s.vy * dt;
  }
}

/* =====================================================================
   7. 绘制
   ===================================================================== */

/* ---- 7.1 菌柄：平行密线 ---- */
function drawStem(node) {
  const p = node.parent;
  if (!p) return;

  const g = node._g;
  const dx = node.x - p.x;
  const dy = node.y - p.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len;
  const ny =  dx / len;

  const w = Math.max(2, node.r * 0.52 * g);
  const N = 6;
  const hue = node.hue;

  for (let i = 0; i < N; i++) {
    const f   = (i / (N - 1) - 0.5) * 2;
    const off = f * w;
    const bow = Math.sin(f * 2.4 + T * 1.7 + node.seed * 0.01) * w * 0.22;

    const mx = (p.x + node.x) * 0.5 + nx * (off + bow);
    const my = (p.y + node.y) * 0.5 + ny * (off + bow);

    ctx.strokeStyle = `hsla(${hue},100%,${26 + 12 * (1 - Math.abs(f))}%,${0.070 * g})`;
    ctx.lineWidth = 0.9 * S;
    ctx.beginPath();
    ctx.moveTo(p.x + nx * off * 0.5, p.y + ny * off * 0.5);
    ctx.quadraticCurveTo(mx, my, node.x + nx * off * 0.1, node.y + ny * off * 0.1);
    ctx.stroke();
  }
}

/* ---- 7.2 菌盖：放射状密线 + 外缘弧 ---- */
function drawCap(node, g) {
  const r = node.r * g;
  if (r < 1.5) return;

  const base = node.ang;
  const HALF = 1.12;

  /* 柔和辉光底盘 */
  ctx.fillStyle = `hsla(${node.hue},100%,46%,${0.042 * g})`;
  ctx.beginPath();
  ctx.arc(node.x, node.y, r * 0.95, 0, TAU);
  ctx.fill();

  const N = Math.max(5, Math.min(34, Math.round(r * 0.30)));

  /* 放射状菌褶 */
  for (let i = 0; i < N; i++) {
    const f    = N === 1 ? 0.5 : i / (N - 1);
    const a    = base + (f - 0.5) * 2 * HALF;
    const edge = Math.sin(Math.PI * f);
    const len  = r * (0.70 + 0.32 * edge);

    const ca = Math.cos(a), sa = Math.sin(a);
    const px = -sa, py = ca;

    const hue   = ((node.hue + (f - 0.5) * 36) % 360 + 360) % 360;
    const lum   = 24 + 22 * edge;
    const alpha = (0.050 + 0.070 * edge) * g;

    ctx.strokeStyle = `hsla(${hue},100%,${lum}%,${alpha})`;
    ctx.lineWidth = (0.45 + 0.85 * edge) * S;
    ctx.beginPath();

    const steps = 4;
    for (let m = 0; m <= steps; m++) {
      const q  = m / steps;
      const rr = len * q;
      const wob = Math.sin(q * 2.6 + f * 7.5 + T * 2.6 + node.seed * 0.017) * r * 0.11 * q;
      const X = node.x + ca * rr + px * wob;
      const Y = node.y + sa * rr + py * wob;
      m ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.stroke();
  }

  /* 外缘轮廓 */
  ctx.strokeStyle = `hsla(${node.hue},100%,55%,${0.075 * g})`;
  ctx.lineWidth = 0.8 * S;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const f    = i / N;
    const a    = base + (f - 0.5) * 2 * HALF;
    const edge = Math.sin(Math.PI * f);
    const len  = r * (0.70 + 0.32 * edge);
    const X = node.x + Math.cos(a) * len;
    const Y = node.y + Math.sin(a) * len;
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.stroke();
}

/* ---- 7.3 孢子 ---- */
function drawSpores() {
  for (let i = 0; i < spores.length; i++) {
    const s = spores[i];
    const lifeF = s.life / s.maxLife;
    const a = Math.min(1, lifeF * 1.7) * lifeF;
    if (a <= 0.012) continue;

    const hue = ((s.hue % 360) + 360) % 360;

    /* 拖尾 */
    const tx = s.x - s.vx * 0.045;
    const ty = s.y - s.vy * 0.045;
    ctx.strokeStyle = `hsla(${hue},100%,58%,${0.26 * a})`;
    ctx.lineWidth = s.r * 0.85;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();

    /* 核心光点 */
    ctx.fillStyle = `hsla(${hue},100%,72%,${0.55 * a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
}

/* ---- 7.4 主绘制 ---- */
function draw() {
  /* 拖尾衰减 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(0, 0, W, H);

  /* 发光叠加模式 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  /* 菌柄 */
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.parent && n._g > 0.02) drawStem(n);
  }

  /* 菌盖 */
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n._g > 0.02) drawCap(n, n._g);
  }

  /* 孢子 */
  drawSpores();
}

/* =====================================================================
   8. 主循环
   ===================================================================== */
let lastT = 0;
let started = false;

function frame(now) {
  const nowS = now / 1000;
  if (!started) { started = true; lastT = nowS; }

  let dt = nowS - lastT;
  lastT = nowS;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0)    dt = 0;

  T += dt;

  resize();
  update(dt);
  draw();

  requestAnimationFrame(frame);
}

/* 启动 */
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
