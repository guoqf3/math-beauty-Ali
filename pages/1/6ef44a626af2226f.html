<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>普朗克黑体辐射 · 光子灯笼鱼</title>
<style>
  :root{ --split: 20%; }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
  }

  /* ================= 左侧：普朗克公式 ================= */
  #left{
    position:fixed; left:0; top:0; bottom:0;
    width: var(--split);
    display:flex; align-items:center; justify-content:center;
    padding: 18px 9px;
    background:
      radial-gradient(120% 80% at 18% 22%, rgba(255,220,60,.08), transparent 62%),
      radial-gradient(120% 80% at 82% 84%, rgba(120,90,255,.08), transparent 62%),
      #000;
    border-right:1px solid rgba(255,210,90,.16);
    color:#ffe9a8;
    font-family:"Cambria Math","Latin Modern Math","Times New Roman",serif;
    overflow:hidden;
    z-index:2;
  }
  #left::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(255,215,90,.05) 50%, transparent 100%);
    background-size:100% 220%;
    animation: scan 9.5s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ from{ background-position: 0 -110%; } to{ background-position: 0 110%; } }

  .stack{ width:100%; text-align:center; position:relative; z-index:1; }

  .kicker{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(7px, .55vw, 10px);
    letter-spacing:.26em;
    color: rgba(255,225,130,.5);
    margin-bottom: 1.7em;
    white-space: nowrap;
  }

  .eq{
    font-size: clamp(8px, .88vw, 15px);
    line-height: 1.95;
    color:#ffe08a;
    text-shadow:
      0 0 10px rgba(255,205,60,.5),
      0 0 26px rgba(220,140,0,.2);
    animation: pulse 5.6s ease-in-out infinite;
    word-break: keep-all;
  }
  .eq.big{
    font-size: clamp(9px, 1.0vw, 17px);
    color:#fff0b8;
  }
  .eq i{ font-style: italic; }
  .eq b{
    font-weight:600; color:#a97bff;
    text-shadow: 0 0 10px rgba(150,100,255,.75), 0 0 24px rgba(110,60,255,.35);
  }
  .eq sup, .eq sub{ font-size:.6em; }

  @keyframes pulse{
    0%,100%{ opacity:.84; }
    50%    { opacity:1; }
  }

  .frac{
    display:inline-flex; flex-direction:column;
    vertical-align:middle; text-align:center;
    font-size:.82em; line-height:1.08;
    margin:0 .18em;
  }
  .frac > span:first-child{
    border-bottom:1px solid rgba(255,225,140,.8);
    padding:0 .22em .05em;
  }
  .frac > span:last-child{ padding-top:.05em; }

  .rule{
    height:1px; width:62%;
    margin: 1.4em auto;
    background:linear-gradient(90deg, transparent, rgba(255,210,90,.42), transparent);
  }

  .meta{
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(7px, .54vw, 10px);
    letter-spacing:.16em;
    color: rgba(255,235,170,.62);
    white-space: nowrap;
  }
  .dot{
    display:inline-block; width:.6em; height:.6em; border-radius:50%;
    vertical-align:middle; margin:0 .28em 0 .1em;
  }
  .dot.ye{ background:#ffdf3c; box-shadow:0 0 10px #ffdf3c, 0 0 22px rgba(255,223,60,.65); }
  .dot.pp{ background:#b04cff; box-shadow:0 0 10px #b04cff, 0 0 22px rgba(176,76,255,.65); }
  .dot.bb{ background:#48baff; box-shadow:0 0 10px #48baff, 0 0 22px rgba(72,186,255,.65); }

  /* ================= 右侧：光子灯笼鱼 ================= */
  #right{
    position:fixed; left: var(--split); top:0; right:0; bottom:0;
    background:#000;
    overflow:hidden;
  }
  #right canvas{ display:block; position:absolute; inset:0; }

  @media (max-width: 900px){
    :root{ --split: 27%; }
    .kicker{ letter-spacing:.15em; }
    .meta{ letter-spacing:.06em; }
  }
</style>
</head>
<body>

<!-- ============ 左：公式 ============ -->
<div id="left">
  <div class="stack">
    <div class="kicker">PLANCK · BLACKBODY</div>

    <div class="eq big">
      <i>B</i><sub>λ</sub>(<i>T</i>) =
      <span class="frac">
        <span>2<i>hc</i><sup>2</sup></span>
        <span>λ<sup>5</sup></span>
      </span>
      ·
      <span class="frac">
        <span>1</span>
        <span><i>e</i><sup><i>hc</i>/λ<i>k</i><sub>B</sub><i>T</i></sup> − 1</span>
      </span>
    </div>

    <div class="rule"></div>

    <div class="eq">
      <b>λ<sub>max</sub><i>T</i></b> = <i>b</i> ≈ 2.898 × 10<sup>−3</sup> m·K
    </div>

    <div class="rule"></div>

    <div class="eq">
      <i>j</i><sup>★</sup> = σ<i>T</i><sup>4</sup>
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span class="dot ye"></span>低温
      <span class="dot pp"></span>中温
      <span class="dot bb"></span>高温
    </div>
  </div>
</div>

<!-- ============ 右：场景 ============ -->
<div id="right"></div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 画布与自适应
   ========================================================= */
const host = document.getElementById('right');
const cv   = document.createElement('canvas');
host.appendChild(cv);
const ctx  = cv.getContext('2d');

const TAU = Math.PI * 2;
let W, H, CX, CY, S, DPR;

/* 世界坐标：y 轴向上，中心 (CAMX, CAMY) */
const CAMX = -0.20;
const CAMY =  0.40;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = host.clientWidth  || 1;
  H = host.clientHeight || 1;

  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.5;

  S = Math.min(W / 5.00, H / 3.05);
}
window.addEventListener('resize', resize);

/* =========================================================
   1. 工具
   ========================================================= */
function lerp(a, b, f){ return a + (b - a) * f; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function smooth(f){ return f * f * (3 - 2 * f); }

function mixRGB(c1, c2, f){
  return [
    lerp(c1[0], c2[0], f),
    lerp(c1[1], c2[1], f),
    lerp(c1[2], c2[2], f)
  ];
}
function rgba(c, a){
  return 'rgba(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ',' + a + ')';
}

/* 三色渐变：霓虹黄 → 紫 → 蓝 */
const C_YELLOW = [255, 226,  64];
const C_PURPLE = [196,  78, 255];
const C_BLUE   = [ 72, 186, 255];

function triColor(f){
  f = ((f % 1) + 1) % 1;
  if (f < 1/3) return mixRGB(C_YELLOW, C_PURPLE, f * 3);
  if (f < 2/3) return mixRGB(C_PURPLE, C_BLUE, (f - 1/3) * 3);
  return mixRGB(C_BLUE, C_YELLOW, (f - 2/3) * 3);
}

/* 温度参数 → 颜色（黄 → 紫 → 蓝） */
function tempColor(f){
  f = clamp(f, 0, 1);
  return f < 0.5
    ? mixRGB(C_YELLOW, C_PURPLE, f * 2)
    : mixRGB(C_PURPLE, C_BLUE, (f - 0.5) * 2);
}

/* =========================================================
   2. 体形：中轴 + 半宽包络
   ========================================================= */
function bodyCenter(s, t){
  const wave = 0.13 * Math.sin(t * 1.75 - s * 3.3) * (0.18 + 0.82 * s * s);
  return {
    x: -1.55 + 3.10 * s,
    y: wave + 0.085 * Math.sin(t * 1.05)
  };
}

const WKEYS = [
  [0.00, 0.045],
  [0.04, 0.225],
  [0.10, 0.445],
  [0.18, 0.600],
  [0.27, 0.680],
  [0.37, 0.680],
  [0.47, 0.600],
  [0.57, 0.470],
  [0.67, 0.330],
  [0.77, 0.200],
  [0.86, 0.110],
  [0.94, 0.055],
  [1.00, 0.022]
];

function halfW(s, t){
  s = clamp(s, 0, 1);
  let w = WKEYS[WKEYS.length - 1][1];
  for (let i = 1; i < WKEYS.length; i++){
    if (s <= WKEYS[i][0]){
      const s0 = WKEYS[i - 1][0], w0 = WKEYS[i - 1][1];
      const s1 = WKEYS[i][0],     w1 = WKEYS[i][1];
      let f = (s - s0) / ((s1 - s0) || 1);
      f = smooth(clamp(f, 0, 1));
      w = w0 + (w1 - w0) * f;
      break;
    }
  }
  w *= 1 + 0.055 * Math.sin(t * 2.0 - s * 5.0);
  return w;
}

/* 表面点：u ∈ [-1, 1]，+1 为背侧 */
function surf(s, u, t){
  const c = bodyCenter(s, t);
  const w = halfW(s, t);
  const ripple = 0.048 * Math.sin(s * 13.0 - t * 2.6 + u * 2.0)
               * (1 - Math.abs(u));
  return {
    x: c.x + ripple,
    y: c.y + u * w
  };
}

/* =========================================================
   3. 温度模拟
   ========================================================= */
let tempF   = 0.5;
let tempCol = [196, 78, 255];
let tempInt = 0.7;

function updateTemp(t, dt){
  let target = 0.5
    + 0.34 * Math.sin(t * 0.24)
    + 0.16 * Math.sin(t * 0.41 + 2.1)
    + 0.08 * Math.sin(t * 0.87 + 0.7);
  target = clamp(target, 0, 1);

  tempF += (target - tempF) * Math.min(1, dt * 2.2);
  tempCol = tempColor(tempF);
  tempInt = 0.36 + 0.64 * tempF * (0.86 + 0.14 * Math.sin(t * 5.3));
}

/* =========================================================
   4. 诱饵（钓竿 + 发光球）
   ========================================================= */
function lureRoot(t){
  return {
    x: -1.32 + 0.055 * Math.sin(t * 0.9),
    y:  0.52 + 0.050 * Math.cos(t * 1.1)
  };
}
function lureTip(t){
  return {
    x: -2.26 + 0.10 * Math.sin(t * 0.7 + 1.2),
    y:  1.34 + 0.09 * Math.sin(t * 0.95)
  };
}
function stalkPt(f, t){
  const A = lureRoot(t), B = lureTip(t);
  const cx = -2.02 + 0.07 * Math.sin(t * 1.2);
  const cy =  0.86;
  const u = 1 - f;
  return {
    x: u*u*A.x + 2*u*f*cx + f*f*B.x,
    y: u*u*A.y + 2*u*f*cy + f*f*B.y
  };
}

/* =========================================================
   5. 静态数据
   ========================================================= */
/* 背景尘埃 */
const dust = [];
for (let i = 0; i < 140; i++){
  dust.push({
    x0 : (Math.random() - 0.5) * 7.0,
    y0 : Math.random() * 6.0,
    r  : 0.006 + Math.random() * 0.016,
    sp : 0.02 + Math.random() * 0.08,
    ph : Math.random() * TAU
  });
}

/* 沿体流动的光子 */
const photons = [];
for (let i = 0; i < 180; i++){
  photons.push({
    s  : Math.random(),
    u  : Math.random() * 2 - 1,
    sp : 0.05 + Math.random() * 0.14,
    ph : Math.random() * TAU,
    r  : 0.008 + Math.random() * 0.013
  });
}

/* =========================================================
   6. 绘制：背景
   ========================================================= */
function drawDust(t){
  for (let i = 0; i < dust.length; i++){
    const d = dust[i];
    let y = ((d.y0 + t * d.sp) % 6.0 + 6.0) % 6.0 - 3.0;
    const x = d.x0 + 0.16 * Math.sin(t * 0.4 + d.ph);
    const tw = 0.4 + 0.6 * Math.sin(t * 1.7 + d.ph);

    const col = triColor(d.ph / TAU + t * 0.04);
    ctx.fillStyle = rgba(col, 0.04 + 0.13 * tw);
    ctx.beginPath();
    ctx.arc(x, y, d.r * (0.6 + 0.6 * tw), 0, TAU);
    ctx.fill();
  }
}

/* =========================================================
   7. 绘制：光子晶格身体（已加密）
   ========================================================= */
const NS = 64;   // 沿体（原 42 → 64）
const NU = 25;   // 横向（原 17 → 25）

function drawLattice(t){
  /* ---- 7.1 经线（纵向） ---- */
  for (let i = 0; i < NU; i++){
    const u = (i / (NU - 1)) * 2 - 1;
    const edge = Math.abs(u);

    ctx.beginPath();
    for (let j = 0; j <= NS; j++){
      const s = j / NS;
      const p = surf(s, u, t);
      if (j === 0) ctx.moveTo(p.x, p.y);
      else         ctx.lineTo(p.x, p.y);
    }

    const col = triColor(u * 0.17 + t * 0.045);
    ctx.strokeStyle = rgba(col, 0.075 + 0.185 * (1 - edge));
    ctx.lineWidth = 0.0072 * (1.15 - 0.45 * edge);
    ctx.stroke();
  }

  /* ---- 7.2 纬线（横向） ---- */
  for (let j = 0; j <= NS; j++){
    const s = j / NS;

    ctx.beginPath();
    for (let i = 0; i < NU; i++){
      const u = (i / (NU - 1)) * 2 - 1;
      const p = surf(s, u, t);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else         ctx.lineTo(p.x, p.y);
    }

    const col = triColor(s * 0.55 + t * 0.045);
    const midFade = 1 - Math.abs(s - 0.45) * 1.35;
    ctx.strokeStyle = rgba(col, 0.065 + 0.140 * Math.max(0, midFade));
    ctx.lineWidth = 0.0052;
    ctx.stroke();
  }

  /* ---- 7.3 晶格节点光点 ---- */
  for (let j = 0; j <= NS; j++){
    const s = j / NS;
    for (let i = 0; i < NU; i++){
      if ((i + j) % 2) continue;

      const u = (i / (NU - 1)) * 2 - 1;
      const p = surf(s, u, t);

      const tw = 0.5 + 0.5 * Math.sin(t * 3.4 + j * 0.72 + i * 1.31);
      const col = triColor(s * 0.55 + u * 0.12 + t * 0.045);
      const rad = 0.014 * (0.55 + 0.75 * tw);

      /* 外晕 */
      ctx.fillStyle = rgba(col, 0.045 * tw);
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad * 3.4, 0, TAU);
      ctx.fill();

      /* 核心 */
      ctx.fillStyle = rgba([255, 250, 235], 0.26 + 0.38 * tw);
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, TAU);
      ctx.fill();
    }
  }

  /* ---- 7.4 主脊线 ---- */
  ctx.beginPath();
  for (let j = 0; j <= 120; j++){
    const s = j / 120;
    const p = surf(s, 0, t);
    if (j === 0) ctx.moveTo(p.x, p.y);
    else         ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = rgba(triColor(t * 0.045 + 0.15), 0.16);
  ctx.lineWidth = 0.012;
  ctx.stroke();
}

/* =========================================================
   8. 绘制：鳍（已加密）
   ========================================================= */
function drawFins(t){
  /* ---- 8.1 背鳍 ---- */
  for (let k = 0; k < 34; k++){                 // 原 20 → 34
    const f = k / 33;
    const s = 0.34 + 0.36 * f;
    const p = surf(s, 1, t);

    const ang = Math.PI * 0.5
              + 0.42 * Math.sin(s * 9.0 - t * 2.0)
              + 0.10;
    const len = (0.19 + 0.15 * Math.sin(f * Math.PI))
              * (0.85 + 0.25 * Math.sin(t * 2.2 + k * 0.8));

    const ex = p.x + Math.cos(ang) * len;
    const ey = p.y + Math.sin(ang) * len;

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(ex, ey);

    const col = triColor(s * 0.55 + t * 0.045);
    ctx.strokeStyle = rgba(col, 0.17 + 0.14 * (1 - Math.abs(f - 0.5) * 2));
    ctx.lineWidth = 0.0060 * (1 - 0.4 * f);
    ctx.stroke();

    /* 鳍端光点 */
    ctx.fillStyle = rgba([255, 248, 225], 0.18);
    ctx.beginPath();
    ctx.arc(ex, ey, 0.010, 0, TAU);
    ctx.fill();
  }

  /* ---- 8.2 胸鳍 ---- */
  const pc = surf(0.31, -0.60, t);
  for (let k = 0; k < 28; k++){                 // 原 16 → 28
    const f = k / 27;
    const ang = -Math.PI * 0.78 + f * Math.PI * 0.62
              + 0.16 * Math.sin(t * 2.3 + k * 0.9);
    const len = (0.30 + 0.16 * Math.sin(f * Math.PI))
              * (0.86 + 0.20 * Math.sin(t * 2.0));

    const ex = pc.x + Math.cos(ang) * len;
    const ey = pc.y + Math.sin(ang) * len;

    ctx.beginPath();
    ctx.moveTo(pc.x, pc.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = rgba(triColor(f * 0.3 + t * 0.045), 0.14);
    ctx.lineWidth = 0.0054;
    ctx.stroke();
  }

  /* ---- 8.3 尾鳍 ---- */
  const tc = surf(1.0, 0, t);
  const ct = bodyCenter(1, t);
  const cd = bodyCenter(0.94, t);
  let baseAng = Math.atan2(ct.y - cd.y, ct.x - cd.x);

  for (let k = 0; k < 44; k++){                 // 原 26 → 44
    const f = k / 43;
    const off = (f - 0.5) * 1.45 + 0.12 * Math.sin(t * 2.1);
    const ang = baseAng + off;
    const len = 0.46 * (0.55 + 0.62 * Math.sin(f * Math.PI))
              * (0.9 + 0.14 * Math.sin(t * 2.6 + k * 0.6));

    const ex = tc.x + Math.cos(ang) * len;
    const ey = tc.y + Math.sin(ang) * len;

    ctx.beginPath();
    ctx.moveTo(tc.x, tc.y);
    ctx.lineTo(ex, ey);

    const col = triColor(0.75 + f * 0.25 + t * 0.045);
    ctx.strokeStyle = rgba(col, 0.14 + 0.12 * (1 - Math.abs(f - 0.5) * 2));
    ctx.lineWidth = 0.0056;
    ctx.stroke();

    ctx.fillStyle = rgba([255, 248, 225], 0.14);
    ctx.beginPath();
    ctx.arc(ex, ey, 0.009, 0, TAU);
    ctx.fill();
  }
}

/* =========================================================
   9. 绘制：口部与牙齿（已加密）
   ========================================================= */
function drawMouth(t){
  const N = 34;                                 // 原 22 → 34
  const pts = [];

  ctx.beginPath();
  for (let k = 0; k <= N; k++){
    const f = k / N;
    const s = 0.012 + 0.335 * f;
    const u = -0.16 - 0.84 * smooth(f);
    const p = surf(s, u, t);
    pts.push(p);
    if (k === 0) ctx.moveTo(p.x, p.y);
    else         ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = rgba(C_YELLOW, 0.30);
  ctx.lineWidth = 0.010;
  ctx.stroke();

  /* 下颌牙齿（朝上） */
  ctx.fillStyle = rgba([255, 245, 200], 0.48);
  for (let k = 1; k < N; k += 1){
    const p = pts[k];
    ctx.beginPath();
    ctx.moveTo(p.x - 0.017, p.y);
    ctx.lineTo(p.x + 0.017, p.y);
    ctx.lineTo(p.x, p.y + 0.045);
    ctx.closePath();
    ctx.fill();
  }

  /* 上颌牙齿（朝下） */
  for (let k = 0; k < 9; k++){                  // 原 5 → 9
    const s = 0.035 + 0.17 * (k / 8);
    const p = surf(s, 1, t);
    ctx.beginPath();
    ctx.moveTo(p.x - 0.016, p.y);
    ctx.lineTo(p.x + 0.016, p.y);
    ctx.lineTo(p.x, p.y - 0.042);
    ctx.closePath();
    ctx.fill();
  }
}

/* =========================================================
   10. 绘制：眼睛
   ========================================================= */
function drawEye(t){
  const p = surf(0.145, 0.36, t);
  const r = 0.082 * (1 + 0.035 * Math.sin(t * 3.1));

  /* 光晕 */
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3.6);
  g.addColorStop(0.00, rgba(C_YELLOW, 0.50));
  g.addColorStop(0.32, rgba(C_PURPLE, 0.22));
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 3.6, 0, TAU);
  ctx.fill();

  /* 虹膜 */
  ctx.strokeStyle = rgba(C_YELLOW, 0.90);
  ctx.lineWidth = 0.010;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, TAU);
  ctx.stroke();

  /* 瞳孔 */
  ctx.fillStyle = rgba(C_PURPLE, 0.95);
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 0.44, 0, TAU);
  ctx.fill();
}

/* =========================================================
   11. 绘制：沿体光子
   ========================================================= */
function drawPhotons(t, dt){
  for (let i = 0; i < photons.length; i++){
    const ph = photons[i];
    ph.s += ph.sp * dt;
    if (ph.s > 1) ph.s -= 1;

    const p = surf(ph.s, ph.u, t);
    const tw = 0.4 + 0.6 * Math.sin(t * 4.0 + ph.ph);
    const col = triColor(ph.s * 0.55 + ph.u * 0.14 + t * 0.045);

    ctx.fillStyle = rgba(col, 0.09 * tw);
    ctx.beginPath();
    ctx.arc(p.x, p.y, ph.r * 3.2, 0, TAU);
    ctx.fill();

    ctx.fillStyle = rgba([255, 252, 240], 0.30 * tw);
    ctx.beginPath();
    ctx.arc(p.x, p.y, ph.r, 0, TAU);
    ctx.fill();
  }
}

/* =========================================================
   12. 绘制：诱饵
   ========================================================= */
function drawLure(t){
  /* ---- 12.1 钓竿 ---- */
  ctx.beginPath();
  const NP = 46;                                // 原 30 → 46
  for (let k = 0; k <= NP; k++){
    const f = k / NP;
    const p = stalkPt(f, t);
    if (k === 0) ctx.moveTo(p.x, p.y);
    else         ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = rgba(tempCol, 0.30);
  ctx.lineWidth = 0.010;
  ctx.stroke();

  /* 钓竿上的光子 */
  for (let k = 1; k < NP; k += 2){              // 步长 3 → 2
    const p = stalkPt(k / NP, t);
    const tw = 0.5 + 0.5 * Math.sin(t * 5.0 + k * 0.9);
    ctx.fillStyle = rgba(tempCol, 0.28 * tw);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 0.012 * (0.7 + 0.6 * tw), 0, TAU);
    ctx.fill();
  }

  /* ---- 12.2 诱饵光球 ---- */
  const tip = lureTip(t);
  const puls = 0.5 + 0.5 * Math.sin(t * 3.4);
  const coreR = 0.055 * (0.82 + 0.36 * puls);

  /* 超大外晕 */
  const gh = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 1.55);
  gh.addColorStop(0.00, rgba(tempCol, 0.20 * tempInt));
  gh.addColorStop(0.28, rgba(tempCol, 0.085 * tempInt));
  gh.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = gh;
  ctx.beginPath();
  ctx.arc(tip.x, tip.y, 1.55, 0, TAU);
  ctx.fill();

  /* 中层光晕 */
  const gm = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 0.34);
  gm.addColorStop(0.00, rgba(tempCol, 0.72 * tempInt));
  gm.addColorStop(0.42, rgba(tempCol, 0.24 * tempInt));
  gm.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = gm;
  ctx.beginPath();
  ctx.arc(tip.x, tip.y, 0.34, 0, TAU);
  ctx.fill();

  /* 核心 */
  ctx.fillStyle = rgba([255, 253, 245], 0.72 + 0.24 * puls);
  ctx.beginPath();
  ctx.arc(tip.x, tip.y, coreR, 0, TAU);
  ctx.fill();

  /* ---- 12.3 扩散光环 ---- */
  for (let k = 0; k < 4; k++){                  // 原 3 → 4
    const f  = ((t * 0.34 + k / 4) % 1);
    const rr = 0.18 + f * 1.15;
    const a  = (1 - f) * (1 - f) * 0.32 * tempInt;

    ctx.strokeStyle = rgba(tempCol, a);
    ctx.lineWidth = 0.014 * (1 - f * 0.5);
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, rr, 0, TAU);
    ctx.stroke();
  }

  /* ---- 12.4 逸散光子 ---- */
  for (let k = 0; k < 22; k++){                 // 原 14 → 22
    const f  = ((t * 0.52 + k * (1 / 22)) % 1);
    const ang = k * 2.399 + t * 0.4;
    const rr = 0.10 + f * 0.95;

    const px = tip.x + Math.cos(ang) * rr;
    const py = tip.y + Math.sin(ang) * rr;
    const a  = (1 - f) * 0.55 * tempInt;
    const sz = 0.012 * (1 - f * 0.6);

    ctx.fillStyle = rgba(tempCol, a * 0.35);
    ctx.beginPath();
    ctx.arc(px, py, sz * 2.8, 0, TAU);
    ctx.fill();

    ctx.fillStyle = rgba([255, 252, 240], a);
    ctx.beginPath();
    ctx.arc(px, py, sz, 0, TAU);
    ctx.fill();
  }
}

/* =========================================================
   13. 主循环
   ========================================================= */
let T = 0;
let last = performance.now();

function frame(now){
  requestAnimationFrame(frame);

  let dt = (now - last) / 1000;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  dt = Math.min(dt, 0.05);
  last = now;
  T += dt;

  updateTemp(T, dt);

  /* ---- 拖影 ---- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  ctx.fillRect(0, 0, W, H);

  /* ---- 世界坐标 ---- */
  ctx.save();
  ctx.translate(CX, CY);
  ctx.scale(S, -S);
  ctx.translate(-CAMX, -CAMY);

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  drawDust(T);
  drawLure(T);
  drawLattice(T);
  drawFins(T);
  drawMouth(T);
  drawEye(T);
  drawPhotons(T, dt);

  ctx.restore();
}

/* =========================================================
   14. 启动
   ========================================================= */
resize();
requestAnimationFrame(frame);

})();
</script>
