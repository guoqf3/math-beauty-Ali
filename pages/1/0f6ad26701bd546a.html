<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>正弦波生成 · y = A·sin(ωt + φ)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#050a12;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  /* 左上标题 */
  #title{
    position:absolute;top:0;left:0;
    padding:28px 36px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,190,255,.36);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(18px,2.6vw,30px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#6ab8ff 38%,#a090ff 70%,#e090d0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(11px,1.4vw,14px);
    letter-spacing:.10em;
    color:rgba(200,220,255,.58);
  }
  #title .formula .hl1{color:#5ee0ff;}
  #title .formula .hl2{color:#a090ff;}
  #title .formula .hl3{color:#e090d0;}

  /* 右上数据面板 */
  #stats{
    position:absolute;top:0;right:0;
    padding:28px 36px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.12em;line-height:2.0;
    color:rgba(170,200,250,.34);
    opacity:0;animation:fade 1.6s 1.1s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(140,180,240,.26);margin-bottom:6px;
  }
  #stats .k{color:rgba(190,200,255,.52);}
  #stats .v{color:rgba(255,215,150,.88);}
  #stats .v1{color:rgba(94,224,255,.90);}
  #stats .v2{color:rgba(160,144,255,.90);}
  #stats .v3{color:rgba(224,144,208,.90);}

  /* 底部控制器 */
  #controls{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:34px;
    display:flex;gap:28px;flex-wrap:wrap;justify-content:center;
    opacity:0;animation:fade 1.6s 1.4s ease forwards;
    pointer-events:auto;
    max-width:92vw;
  }
  .ctrl{
    display:flex;flex-direction:column;
    gap:9px;min-width:170px;
  }
  .ctrl-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.18em;
  }
  .ctrl-head .lb{color:rgba(180,205,250,.62);}
  .ctrl-head .vl{
    font-size:12px;font-weight:600;
    letter-spacing:.04em;
    color:rgba(255,220,160,.96);
  }
  .ctrl.a .ctrl-head .vl{color:rgba(94,224,255,.96);}
  .ctrl.f .ctrl-head .vl{color:rgba(160,144,255,.96);}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:3px;
    background:rgba(120,160,230,.18);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:rgba(220,235,255,.96);
    border:1px solid rgba(140,190,255,.85);
    box-shadow:0 0 12px rgba(120,180,255,.62);
    cursor:pointer;transition:transform .18s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25);}
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:rgba(220,235,255,.96);
    border:1px solid rgba(140,190,255,.85);
    box-shadow:0 0 12px rgba(120,180,255,.62);
    cursor:pointer;
  }
  .ctrl.a input[type=range]::-webkit-slider-thumb{
    border-color:rgba(94,224,255,.85);
    box-shadow:0 0 12px rgba(94,224,255,.62);
  }
  .ctrl.f input[type=range]::-webkit-slider-thumb{
    border-color:rgba(160,144,255,.85);
    box-shadow:0 0 12px rgba(160,144,255,.62);
  }

  /* 音频指示 */
  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 36px 30px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(170,200,250,.28);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s, box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:680px){
    #title{padding:14px 16px;}
    #stats{display:none;}
    #controls{padding-bottom:16px;gap:14px;}
    .ctrl{min-width:130px;gap:6px;}
    #audioDot{padding:0 16px 14px;font-size:8px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">SINE WAVE · GENERATION</div>
    <h1>正弦波生成</h1>
    <div class="formula">
      <span class="hl1">y</span> = 
      <span class="hl1">A</span> · sin(
      <span class="hl2">ω</span>t + 
      <span class="hl3">φ</span>)
    </div>
  </div>

  <div id="stats">
    <span class="lab">LIVE PARAMETERS</span>
    <div><span class="k">振幅 A </span><span class="v1" id="sA">1.00</span></div>
    <div><span class="k">频率 ω </span><span class="v2" id="sW">0.60</span></div>
    <div><span class="k">周期 T </span><span class="v2" id="sT">1.67 s</span></div>
    <div><span class="k">相位 φ </span><span class="v3" id="sPh">0.00 π</span></div>
    <div><span class="k">当前值 y </span><span class="v" id="sY">0.000</span></div>
  </div>

  <div id="controls">
    <div class="ctrl a">
      <div class="ctrl-head">
        <span class="lb">振幅 A</span>
        <span class="vl" id="ampVal">1.00</span>
      </div>
      <input type="range" id="amp" min="0.3" max="1.5" step="0.01" value="1.0">
    </div>
    <div class="ctrl f">
      <div class="ctrl-head">
        <span class="lb">频率 ω</span>
        <span class="vl" id="freqVal">0.60</span>
      </div>
      <input type="range" id="freq" min="0.15" max="2.5" step="0.01" value="0.6">
    </div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>波浪声 · 电子嗡鸣</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

/* 布局参数 */
let cx = 0, cy = 0, R = 0;
let startXBase = 0;

/* =========================================================
   状态
   ========================================================= */
const params = {
  amplitude: 1.0,
  frequency: 0.60
};

let phase = 0;            // 当前相位（弧度）
let lastT = 0;

/* 曲线历史缓冲区：每个元素代表 1 像素宽的时间切片 */
const PPS = 110;          // 每秒对应的像素数
let history = [];
let historyAccum = 0;
let MAX_HISTORY = 1200;

/* 波浪粒子 */
const sparks = [];

/* 星星 */
const stars = [];

/* =========================================================
   布局
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  R = Math.min(W, H) * 0.135;
  cx = R * 1.85 + 28;
  cy = H * 0.50;

  /* 曲线起始 x */
  startXBase = cx + R * 1.5;

  /* 缓冲区大小 */
  MAX_HISTORY = Math.max(200, Math.ceil(W - startXBase) + 20);

  /* 重置历史（尺寸变了） */
  history = new Array(MAX_HISTORY).fill(0);

  buildStars();
}
window.addEventListener('resize', resize);

/* =========================================================
   星星背景
   ========================================================= */
function buildStars(){
  stars.length = 0;
  const n = Math.min(240, Math.round(W * H / 7200));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.05 + 0.14,
      ph: Math.random() * TAU,
      sp: 0.22 + Math.random() * 0.85,
      hue: 210 + Math.random() * 80,
      base: 0.07 + Math.random() * 0.26
    });
  }
}

/* =========================================================
   音频系统
   ========================================================= */
let ac = null;
let master = null;
let humOsc = null;
let humOsc2 = null;
let humGain = null;
let audioReady = false;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.52, ac.currentTime, 1.8);

  /* ---- 波浪声：低通棕噪声 + 缓慢起伏 ---- */
  const bufLen = Math.floor(ac.sampleRate * 3.5);
  const noiseBuf = ac.createBuffer(1, bufLen, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  let lastN = 0;
  for (let i = 0; i < bufLen; i++){
    const w = Math.random() * 2 - 1;
    lastN = (lastN + 0.028 * w) / 1.028;
    nd[i] = lastN * 3.2;
  }

  const noiseSrc = ac.createBufferSource();
  noiseSrc.buffer = noiseBuf;
  noiseSrc.loop = true;

  const noiseLp = ac.createBiquadFilter();
  noiseLp.type = 'lowpass';
  noiseLp.frequency.value = 460;
  noiseLp.Q.value = 0.62;

  const noiseHp = ac.createBiquadFilter();
  noiseHp.type = 'highpass';
  noiseHp.frequency.value = 60;

  const noiseG = ac.createGain();
  noiseG.gain.value = 0;

  noiseSrc.connect(noiseLp);
  noiseLp.connect(noiseHp);
  noiseHp.connect(noiseG);
  noiseG.connect(master);
  noiseSrc.start();

  noiseG.gain.setTargetAtTime(0.052, ac.currentTime, 2.4);

  /* 波浪起伏 LFO */
  const wLfo = ac.createOscillator();
  wLfo.frequency.value = 0.13;
  const wLfoG = ac.createGain();
  wLfoG.gain.value = 0.024;
  wLfo.connect(wLfoG);
  wLfoG.connect(noiseG.gain);
  wLfo.start();

  const wLfo2 = ac.createOscillator();
  wLfo2.frequency.value = 0.077;
  const wLfo2G = ac.createGain();
  wLfo2G.gain.value = 200;
  wLfo2.connect(wLfo2G);
  wLfo2G.connect(noiseLp.frequency);
  wLfo2.start();

  /* ---- 电子嗡鸣：两个纯音 ---- */
  humOsc = ac.createOscillator();
  humOsc.type = 'sine';
  humOsc.frequency.value = 140;

  humOsc2 = ac.createOscillator();
  humOsc2.type = 'sine';
  humOsc2.frequency.value = 70;

  humGain = ac.createGain();
  humGain.gain.value = 0;

  const humGain2 = ac.createGain();
  humGain2.gain.value = 0.45;

  humOsc.connect(humGain);
  humOsc2.connect(humGain2);
  humGain2.connect(humGain);
  humGain.connect(master);

  humOsc.start();
  humOsc2.start();

  humGain.gain.setTargetAtTime(0.020, ac.currentTime, 2.0);

  /* 轻微颤音 */
  const vib = ac.createOscillator();
  vib.frequency.value = 4.2;
  const vibG = ac.createGain();
  vibG.gain.value = 2.4;
  vib.connect(vibG);
  vibG.connect(humOsc.frequency);
  vib.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }

  updateHum();
}

function updateHum(){
  if (!ac || !humOsc) return;
  const f = 90 + params.frequency * 130;
  const t = ac.currentTime;
  humOsc.frequency.setTargetAtTime(f, t, 0.10);
  humOsc2.frequency.setTargetAtTime(f * 0.5, t, 0.10);
}

/* ---- 数字滴答：相位经过 π/2 整数倍时触发 ---- */
let lastTickPhase = 0;
function playTick(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  const f = 880 + Math.random() * 120;
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 0.65, now + 0.07);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.018, now + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.09);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.11);
}

/* =========================================================
   更新
   ========================================================= */
function update(dt){
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;

  /* 相位推进 */
  const omega = TAU * params.frequency;
  phase += dt * omega;
  if (phase > TAU * 1000) phase -= TAU * 1000;

  /* 每经过 π/2 触发一次滴答 */
  const tickEvery = Math.PI * 0.5;
  const cur = Math.floor(phase / tickEvery);
  if (cur > lastTickPhase){
    lastTickPhase = cur;
    playTick();
  }

  /* 历史缓冲区推进 */
  historyAccum += dt;
  const slice = 1 / PPS;

  let steps = 0;
  while (historyAccum >= slice && steps < 120){
    historyAccum -= slice;
    steps++;
    history.push(Math.sin(phase - historyAccum * omega));
    if (history.length > MAX_HISTORY) history.shift();
  }

  /* 波浪粒子 */
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= dt * 1.6;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 60 * dt;
    s.vx *= 0.97;
    s.vy *= 0.97;
  }
}

/* =========================================================
   绘制
   ========================================================= */
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawBackground(t){
  /* 渐变背景 */
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.85
  );
  bg.addColorStop(0.00, '#0a1424');
  bg.addColorStop(0.42, '#060c18');
  bg.addColorStop(1.00, '#020408');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星星 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.015) continue;
    ctx.fillStyle = 'hsla(' + s.hue + ', 82%, 86%, ' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- 参考网格 ---- */
function drawGrid(){
  const A = params.amplitude;
  const r = R * A;

  ctx.strokeStyle = 'rgba(80, 130, 210, 0.055)';
  ctx.lineWidth = 1;

  /* 水平线（代表 y = ±1, ±0.5 等） */
  const levels = [1, 0.5, 0, -0.5, -1];
  for (let i = 0; i < levels.length; i++){
    const yy = cy - r * levels[i];
    ctx.beginPath();
    ctx.moveTo(cx - r * 1.5, yy);
    ctx.lineTo(W - 20, yy);
    ctx.stroke();
  }

  /* 垂直线 */
  const startX = cx + r;
  const spacing = PPS * (1 / Math.max(0.2, params.frequency)) * 0.5;
  for (let x = startX; x < W - 20; x += spacing){
    ctx.beginPath();
    ctx.moveTo(x, cy - r * 1.4);
    ctx.lineTo(x, cy + r * 1.4);
    ctx.stroke();
  }
}

/* ---- 单位圆 ---- */
function drawCircle(t){
  const A = params.amplitude;
  const r = R * A;

  /* 外圈柔光 */
  ctx.globalCompositeOperation = 'lighter';
  const haloR = r * 1.45;
  const hg = ctx.createRadialGradient(cx, cy, r * 0.88, cx, cy, haloR);
  hg.addColorStop(0.00, 'rgba(94, 200, 255, 0)');
  hg.addColorStop(0.55, 'rgba(94, 180, 255, 0.05)');
  hg.addColorStop(1.00, 'rgba(94, 160, 255, 0)');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(cx, cy, haloR, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 圆 */
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.strokeStyle = 'rgba(94, 200, 255, 0.36)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 内圈虚圆 */
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.5, 0, TAU);
  ctx.strokeStyle = 'rgba(94, 200, 255, 0.10)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 5]);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 水平轴 */
  ctx.beginPath();
  ctx.moveTo(cx - r * 1.5, cy);
  ctx.lineTo(cx + r * 1.5, cy);
  ctx.strokeStyle = 'rgba(94, 200, 255, 0.20)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 垂直轴 */
  ctx.beginPath();
  ctx.moveTo(cx, cy - r * 1.5);
  ctx.lineTo(cx, cy + r * 1.5);
  ctx.strokeStyle = 'rgba(94, 200, 255, 0.14)';
  ctx.stroke();

  /* 相位弧（从 0 到当前 phase） */
  const curAngle = -phase;   // canvas 中 y 轴向下，所以取负
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.32, 0, curAngle, phase > 0 ? false : true);
  ctx.strokeStyle = 'rgba(255, 210, 130, 0.38)';
  ctx.lineWidth = 2.0;
  ctx.stroke();

  /* 圆心点 */
  ctx.beginPath();
  ctx.arc(cx, cy, 3.2, 0, TAU);
  ctx.fillStyle = 'rgba(94, 200, 255, 0.52)';
  ctx.fill();
}

/* ---- 正弦曲线 ---- */
function drawCurve(t){
  const A = params.amplitude;
  const r = R * A;
  const startX = cx + r;

  if (history.length < 2) return;

  const N = Math.min(history.length, Math.ceil(W - startX));

  /* 构造路径点 */
  const pts = [];
  for (let i = 0; i < N; i++){
    const val = history[history.length - 1 - i];
    const x = startX + i;
    const y = cy - r * val;
    pts.push({ x: x, y: y, v: val });
  }

  /* ---- 曲线下方填充 ---- */
  ctx.beginPath();
  ctx.moveTo(pts[0].x, cy);
  for (let i = 0; i < pts.length; i++){
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.lineTo(pts[pts.length - 1].x, cy);
  ctx.closePath();

  const fillGrad = ctx.createLinearGradient(startX, cy - r, startX, cy + r);
  fillGrad.addColorStop(0.00, 'rgba(94, 200, 255, 0.16)');
  fillGrad.addColorStop(0.50, 'rgba(120, 150, 255, 0.06)');
  fillGrad.addColorStop(1.00, 'rgba(160, 144, 255, 0.02)');
  ctx.fillStyle = fillGrad;
  ctx.fill();

  /* ---- 曲线本体（双色渐变） ---- */
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++){
    ctx.lineTo(pts[i].x, pts[i].y);
  }

  const lineGrad = ctx.createLinearGradient(startX, 0, W, 0);
  lineGrad.addColorStop(0.00, '#5ee0ff');
  lineGrad.addColorStop(0.42, '#6ab8ff');
  lineGrad.addColorStop(0.78, '#a090ff');
  lineGrad.addColorStop(1.00, '#e090d0');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 2.6;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(110, 180, 255, 0.10)';
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';

  /* ---- 波前标记 ---- */
  if (pts.length > 0){
    const head = pts[0];
    ctx.globalCompositeOperation = 'lighter';
    const hg = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 18);
    hg.addColorStop(0.00, 'rgba(255, 245, 220, 0.92)');
    hg.addColorStop(0.42, 'rgba(150, 220, 255, 0.32)');
    hg.addColorStop(1.00, 'rgba(120, 180, 255, 0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 18, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ---- 旋转点与投影 ---- */
function drawPoint(t){
  const A = params.amplitude;
  const r = R * A;

  /* 点位置 */
  const px = cx + r * Math.cos(phase);
  const py = cy - r * Math.sin(phase);

  /* 曲线起点 */
  const startX = cx + r;

  /* 从圆心到点的半径 */
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(px, py);
  ctx.strokeStyle = 'rgba(255, 210, 130, 0.42)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 水平投影虚线 */
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(startX, py);
  ctx.strokeStyle = 'rgba(255, 210, 130, 0.42)';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([5, 5]);
  ctx.lineDashOffset = -(t * 32) % 10;
  ctx.stroke();
  ctx.setLineDash([]);

  /* 投影垂直线（在曲线起点） */
  ctx.beginPath();
  ctx.moveTo(startX, py);
  ctx.lineTo(startX, cy - r);
  ctx.strokeStyle = 'rgba(255, 210, 130, 0.14)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 点的光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const glowR = 26;
  const gg = ctx.createRadialGradient(px, py, 0, px, py, glowR);
  gg.addColorStop(0.00, 'rgba(255, 245, 220, 0.95)');
  gg.addColorStop(0.28, 'rgba(255, 210, 130, 0.55)');
  gg.addColorStop(0.62, 'rgba(255, 180, 100, 0.16)');
  gg.addColorStop(1.00, 'rgba(255, 160, 80, 0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(px, py, glowR, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 点本体 */
  ctx.beginPath();
  ctx.arc(px, py, 5.5, 0, TAU);
  ctx.fillStyle = '#fff5d8';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 190, 100, 0.85)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* 曲线起点的同步点 */
  ctx.beginPath();
  ctx.arc(startX, py, 4, 0, TAU);
  ctx.fillStyle = 'rgba(110, 200, 255, 0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(200, 235, 255, 0.65)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 闪烁粒子 */
  if (Math.random() < 0.22){
    const a = Math.random() * TAU;
    const sp = 40 + Math.random() * 120;
    sparks.push({
      x: startX, y: py,
      vx: Math.cos(a) * sp * 0.4 + 60,
      vy: Math.sin(a) * sp - 20,
      life: 1,
      size: 1.0 + Math.random() * 1.8
    });
  }
}

/* ---- 火花 ---- */
function drawSparks(){
  if (sparks.length === 0) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < sparks.length; i++){
    const s = sparks[i];
    const a = s.life * s.life * 0.72;
    const r = s.size * s.life;

    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4.5);
    g.addColorStop(0.00, 'rgba(255, 235, 200, ' + a + ')');
    g.addColorStop(0.38, 'rgba(150, 210, 255, ' + (a * 0.30) + ')');
    g.addColorStop(1.00, 'rgba(110, 170, 255, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- 标签 ---- */
function drawLabels(t){
  const A = params.amplitude;
  const r = R * A;

  /* 圆上标记 "单位圆" */
  ctx.font = '8.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(94, 200, 255, 0.42)';
  ctx.fillText('UNIT CIRCLE', cx, cy + r * 1.5 + 22);

  /* 圆的右边缘标记 */
  const startX = cx + r;
  ctx.fillStyle = 'rgba(255, 210, 130, 0.52)';
  ctx.textAlign = 'left';
  ctx.fillText('t = 0', startX + 6, cy - r * 1.35);
}

/* =========================================================
   渲染
   ========================================================= */
function render(t){
  drawBackground(t);
  drawGrid();
  drawCircle(t);
  drawCurve(t);
  drawPoint(t);
  drawSparks();
  drawLabels(t);

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.82
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.26)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.88)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   HUD 更新
   ========================================================= */
let hudTick = 0;

function updateHUD(){
  hudTick++;
  if (hudTick % 5 !== 0) return;

  const A = params.amplitude;
  const f = params.frequency;
  const T = 1 / f;
  const phNorm = ((phase / Math.PI) % 2 + 2) % 2;
  const curY = A * Math.sin(phase);

  const sA = document.getElementById('sA');
  const sW = document.getElementById('sW');
  const sT = document.getElementById('sT');
  const sPh = document.getElementById('sPh');
  const sY = document.getElementById('sY');

  if (sA) sA.textContent = A.toFixed(2);
  if (sW) sW.textContent = f.toFixed(2);
  if (sT) sT.textContent = T.toFixed(2) + ' s';
  if (sPh) sPh.textContent = phNorm.toFixed(2) + ' π';
  if (sY) sY.textContent = curY.toFixed(3);
}

/* =========================================================
   主循环
   ========================================================= */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;

  const t = now * 0.001;

  update(dt);
  render(t);
  updateHUD();
}

/* =========================================================
   滑块
   ========================================================= */
const ampSlider = document.getElementById('amp');
const freqSlider = document.getElementById('freq');
const ampLabel = document.getElementById('ampVal');
const freqLabel = document.getElementById('freqVal');

ampSlider.addEventListener('input', function(e){
  initAudio();
  params.amplitude = parseFloat(e.target.value);
  ampLabel.textContent = params.amplitude.toFixed(2);
});

freqSlider.addEventListener('input', function(e){
  initAudio();
  params.frequency = parseFloat(e.target.value);
  freqLabel.textContent = params.frequency.toFixed(2);
  updateHum();
});

/* =========================================================
   交互：首次点击启动音频
   ========================================================= */
window.addEventListener('pointerdown', initAudio);
window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
requestAnimationFrame(loop);

})();
</script>
