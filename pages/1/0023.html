<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莫比乌斯曲线 · 不可定向之美</title>
    <style>
        :root {
            --bg: #060611;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.05rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(200, 170, 150, 0.5), 0 0 6px rgba(180, 155, 135, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.68rem, 1.25vw, 0.82rem);
            font-weight: 300;
            letter-spacing: 0.07em;
            color: rgba(200, 192, 180, 0.7);
            margin-top: 0.25em;
            text-shadow: 0 0 13px rgba(160, 145, 130, 0.3);
        }
        #formula-overlay {
            bottom: clamp(16px, 4vh, 44px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.7rem, 1.3vw, 0.95rem);
            font-style: italic;
            letter-spacing: 0.05em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(160, 145, 135, 0.42), 0 0 5px rgba(170, 155, 140, 0.28);
            line-height: 1.55;
            background: rgba(10, 9, 16, 0.48);
            padding: 0.42em 1.3em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(150, 130, 110, 0.22);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.35em 0.9em;
                letter-spacing: 0.03em;
                font-size: 0.64rem;
            }
            #title-overlay .title {
                letter-spacing: 0.07em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">莫比乌斯曲线 · 不可定向之美</div>
        <div class="subtitle">Closed Curves on the Möbius Strip</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            γ<sub>u</sub>(θ) = ( (R+u cos(θ/2)) cos θ , (R+u cos(θ/2)) sin θ , u sin(θ/2) )
            &emsp;|&emsp; θ ∈ [0, 4π]
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        // 莫比乌斯带参数
        const R = 2.2;       // 大半径
        const W = 0.9;       // 带宽半幅
        const CURVE_SEGMENTS = 800; // θ∈[0,4π]采样，保证光滑
        const TOTAL_VERTICES = CURVE_SEGMENTS + 1;

        // ==================== 三种颜色 ====================
        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');
        const THREE_COLORS = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x060611, 0.00008);

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.4, 18);
        camera.position.set(1.0, 1.2, 4.8);
        camera.lookAt(0, 0.1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 主旋转组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 200;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 2.8 + Math.random() * 3.8;
            starPosArr[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phi) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xb8b0d0,
            size: 0.011,
            transparent: true,
            opacity: 0.32,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const starPts = new THREE.Points(starGeom, starMat);
        starsGroup.add(starPts);

        // 莫比乌斯带附近光点
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 80;
        const glowArr = new Float32Array(glowCount * 3);
        for (let i = 0; i < glowCount; i++) {
            const u = (Math.random() - 0.5) * 2 * W;
            const v = Math.random() * 4 * Math.PI;
            const halfV = v / 2;
            const x = (R + u * Math.cos(halfV)) * Math.cos(v);
            const y = (R + u * Math.cos(halfV)) * Math.sin(v);
            const z = u * Math.sin(halfV);
            glowArr[i * 3] = x + (Math.random() - 0.5) * 0.2;
            glowArr[i * 3 + 1] = y + (Math.random() - 0.5) * 0.2;
            glowArr[i * 3 + 2] = z + (Math.random() - 0.5) * 0.2;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e2c8,
            size: 0.025,
            transparent: true,
            opacity: 0.45,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const glowPts = new THREE.Points(glowGeom, glowMat);
        glowGroup.add(glowPts);

        // ==================== 莫比乌斯带线框（半透明参考） ====================
        const stripWireGroup = new THREE.Group();
        mainGroup.add(stripWireGroup);
        const stripWireMats = [];

        function createMobiusStripWireframe(R, w, color, opacity) {
            const linesU = 5;  // 宽度方向线条数
            const linesV = 60; // 环绕方向线条数

            // 沿u方向的线（v固定，u从-w到w）
            for (let j = 0; j <= linesV; j++) {
                const v = (j / linesV) * 2 * Math.PI; // 从0到2π展示带子单面
                const pts = [];
                for (let i = 0; i <= 20; i++) {
                    const u = -w + (i / 20) * 2 * w;
                    const halfV = v / 2;
                    const x = (R + u * Math.cos(halfV)) * Math.cos(v);
                    const y = (R + u * Math.cos(halfV)) * Math.sin(v);
                    const z = u * Math.sin(halfV);
                    pts.push(new THREE.Vector3(x, y, z));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    depthWrite: false,
                });
                stripWireMats.push(mat);
                stripWireGroup.add(new THREE.Line(geom, mat));
            }

            // 沿v方向的线（u固定，v从0到2π）
            for (let i = 0; i <= linesU; i++) {
                const u = -w + (i / linesU) * 2 * w;
                const pts = [];
                for (let j = 0; j <= 150; j++) {
                    const v = (j / 150) * 2 * Math.PI;
                    const halfV = v / 2;
                    const x = (R + u * Math.cos(halfV)) * Math.cos(v);
                    const y = (R + u * Math.cos(halfV)) * Math.sin(v);
                    const z = u * Math.sin(halfV);
                    pts.push(new THREE.Vector3(x, y, z));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    depthWrite: false,
                });
                stripWireMats.push(mat);
                stripWireGroup.add(new THREE.Line(geom, mat));
            }
        }
        createMobiusStripWireframe(R, W, 0x5a5570, 0.14);

        // ==================== 莫比乌斯曲线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        const numCurves = 15; // 3的倍数
        const uValues = [];
        for (let i = 0; i < numCurves; i++) {
            // 从 -W+0.1 到 W-0.1 均匀分布，避免边界
            const u = -W + 0.1 + (i / (numCurves - 1)) * (2 * W - 0.2);
            uValues.push(u);
        }

        uValues.forEach((u, idx) => {
            const color = THREE_COLORS[idx % 3];
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            for (let i = 0; i <= CURVE_SEGMENTS; i++) {
                const theta = (i / CURVE_SEGMENTS) * 4 * Math.PI; // 关键：4π闭合
                const halfTheta = theta / 2;
                const cosHalf = Math.cos(halfTheta);
                const sinHalf = Math.sin(halfTheta);
                const cosTheta = Math.cos(theta);
                const sinTheta = Math.sin(theta);
                const x = (R + u * cosHalf) * cosTheta;
                const y = (R + u * cosHalf) * sinTheta;
                const z = u * sinHalf;
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setDrawRange(0, 0);

            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.82,
                depthWrite: false,
            });
            const line = new THREE.Line(geometry, material);
            allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
            curvesGroup.add(line);
        });

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        clock.getDelta(); // 消耗初始累积

        function getCycleTime() {
            const now = performance.now() / 1000;
            return (now - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            // 主旋转
            mainGroup.rotation.y += 0.23 * dt;
            mainGroup.rotation.x += 0.065 * dt;
            mainGroup.rotation.z += 0.018 * Math.sin(cycleTime * 0.55) * dt;

            // 相机微动
            const sway = 0.12 * Math.sin(cycleTime * (Math.PI * 2 / 36));
            camera.position.y = 1.2 + sway;
            camera.lookAt(0, 0.1, 0);

            // 绘制进度
            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            // 更新所有曲线绘制范围
            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            // 背景透明度渐变
            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.32 * bgOp;
            glowMat.opacity = 0.45 * bgOp;
            for (const mat of stripWireMats) {
                mat.opacity = 0.14 * bgOp;
            }

            // 粒子微动
            glowGroup.rotation.y += dt * 0.09;
            glowGroup.rotation.x += dt * 0.05;
            starsGroup.rotation.y += dt * 0.03;
            starsGroup.rotation.x += dt * 0.02;

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 可选重置键
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        // 预热渲染，防止第一帧空白
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🌀 莫比乌斯曲线动画已启动');
        console.log(`   - ${numCurves} 条闭合曲线，3种颜色各${numCurves/3}条`);
        console.log(`   - 莫比乌斯带参数 R=${R} , w=${W}`);
        console.log(`   - 周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
