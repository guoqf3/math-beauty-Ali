<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心形线刺猬 · r = a(1 - k·cosθ)</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: linear-gradient(160deg, #fff3e3 0%, #ffe2c9 55%, #ffd6bb 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #4a2f1e;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1140px; margin: 0 auto; padding: 22px;
    display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap;
  }
  .stage {
    flex: 1 1 560px; min-width: 300px;
    position: relative;
    aspect-ratio: 760 / 520;
    border-radius: 26px;
    overflow: hidden;
    background: #fff7ec;
    box-shadow: 0 20px 44px -20px rgba(150, 90, 40, .55),
                0 0 0 1px rgba(255, 255, 255, .7) inset;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .sound-toggle {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    background: rgba(255, 255, 255, .88);
    box-shadow: 0 5px 14px -5px rgba(160, 100, 50, .55);
    transition: transform .12s;
    z-index: 3;
  }
  .sound-toggle:active { transform: scale(.92); }

  .panel {
    flex: 0 1 336px; min-width: 285px;
    background: rgba(255, 255, 255, .74);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 26px;
    padding: 22px 22px 18px;
    box-shadow: 0 20px 44px -24px rgba(150, 90, 40, .6),
                0 0 0 1px rgba(255, 255, 255, .85) inset;
    display: flex; flex-direction: column; gap: 15px;
  }
  h1 {
    font-size: 21px; margin: 0; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
  }
  h1 .emoji { font-size: 24px; }

  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 20px; text-align: center;
    padding: 11px 10px; border-radius: 15px;
    background: linear-gradient(135deg, #fff2e1, #ffe0c3);
    color: #8a4a1e;
    letter-spacing: .6px;
    box-shadow: 0 0 0 1px rgba(255, 210, 170, .8) inset;
  }
  .formula.small { font-size: 15.5px; padding: 8px; background: rgba(255, 244, 232, .9); }
  .formula b { color: #d4642a; font-weight: 700; }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .field .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
  }
  .field .val { color: #b5652a; font-variant-numeric: tabular-nums; font-size: 14px; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #ffc48c, #ff8f5a);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: #fff; border: 3.5px solid #ff8f5a;
    box-shadow: 0 2px 7px rgba(180, 90, 40, .45);
    transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; border: 3.5px solid #ff8f5a;
    box-shadow: 0 2px 7px rgba(180, 90, 40, .45);
  }
  input[type=range]::-moz-range-track {
    height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #ffc48c, #ff8f5a);
  }

  .btns { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 11px 8px; border: none; border-radius: 14px;
    font-size: 14.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: .4px;
    background: linear-gradient(180deg, #ffb072, #ff8a4c);
    color: #fff;
    box-shadow: 0 7px 15px -7px rgba(220, 110, 50, .95);
    transition: transform .12s, filter .12s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(2px) scale(.98); }
  button.ghost {
    background: rgba(255, 255, 255, .95);
    color: #b5652a;
    box-shadow: 0 5px 13px -7px rgba(180, 110, 60, .8),
                0 0 0 1.5px #ffd0ab inset;
  }
  .hint {
    margin: 0; font-size: 12.5px; line-height: 1.65; color: #9a7355;
    text-align: center;
  }
  .hint kbd {
    background: #fff0e0; border-radius: 5px; padding: 1px 5px;
    font-family: inherit; font-size: 11.5px; color: #b5652a;
    box-shadow: 0 0 0 1px #ffd8bb inset;
  }
  @media (max-width: 720px) {
    .wrap { padding: 14px; gap: 16px; }
    .panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
  </div>

  <div class="panel">
    <h1><span class="emoji">🦔</span> 心形线刺猬</h1>

    <div class="formula">r = a (1 − k·cos θ)</div>

    <div class="field">
      <div class="row"><span>大小 a</span><span class="val" id="aVal">85</span></div>
      <input type="range" id="aRange" min="50" max="130" step="1" value="85">
    </div>

    <div class="field">
      <div class="row"><span>圆润程度</span><span class="val" id="kVal">0%</span></div>
      <input type="range" id="kRange" min="0" max="100" step="1" value="0">
    </div>

    <div class="formula small">
      当前：r = <b id="eqA">85</b>(1 − <b id="eqK">1.00</b>·cos θ)
    </div>

    <div class="btns">
      <button id="btnPuff">竖起刺！</button>
      <button id="btnReset" class="ghost">重置</button>
    </div>

    <p class="hint">
      拖动滑块调参数 · <kbd>点击刺猬</kbd> 它会竖起刺哦～
    </p>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     常量与画布
  ============================================================ */
  const CW = 760, CH = 520;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resizeCanvas() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.max(1, Math.round(rect.width  * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
  }
  window.addEventListener('resize', resizeCanvas);

  /* ============================================================
     音频（Web Audio 合成，无外部文件）
  ============================================================ */
  let actx = null;
  let muted = false;

  function ensureAudio() {
    if (muted) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  /** 基础音 —— 短促的正弦/三角音 */
  function blip(freq, dur, type, vol, delay) {
    const ac = ensureAudio();
    if (!ac) return;
    dur = dur || 0.1; type = type || 'sine'; vol = vol || 0.08; delay = delay || 0;
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  /** 噪声扫频 —— 刺竖起来时的“唰”声 */
  function swoosh() {
    const ac = ensureAudio();
    if (!ac) return;
    const dur = 0.42, sr = ac.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = ac.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.4;
    const t0 = ac.currentTime;
    bp.frequency.setValueAtTime(450, t0);
    bp.frequency.exponentialRampToValueAtTime(4200, t0 + 0.15);
    bp.frequency.exponentialRampToValueAtTime(850, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.17, t0 + 0.045);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(t0);
  }

  /** 可爱的吱吱声 */
  function squeak() {
    blip(880, 0.075, 'sine', 0.09, 0);
    blip(1320, 0.09, 'sine', 0.07, 0.065);
    blip(1100, 0.07, 'triangle', 0.05, 0.14);
  }

  /** 滑块滑动时的轻响（带节流） */
  let lastBlipTime = 0;
  function sliderBlip(freq) {
    const now = performance.now();
    if (now - lastBlipTime < 65) return;
    lastBlipTime = now;
    blip(freq, 0.055, 'sine', 0.045);
  }

  /* ============================================================
     状态
  ============================================================ */
  const state = {
    a: 85,
    k: 1,
    puff: 0,        // 0..1 刺竖起的程度
    puffTarget: 0,
    blink: 0,       // 0..1 眨眼进度
    blinkTimer: 2.5,
    time: 0
  };

  /* ============================================================
     心形线几何
  ============================================================ */
  function heartPoint(theta, a, k) {
    const r = a * (1 - k * Math.cos(theta));
    return [r * Math.cos(theta), r * Math.sin(theta)];
  }

  /** 按弧长均匀重采样，返回 count 个点（数学坐标） */
  function buildOutline(a, k, count) {
    const M = 1200;
    const px = new Float64Array(M + 1);
    const py = new Float64Array(M + 1);

    for (let i = 0; i <= M; i++) {
      const th = i / M * Math.PI * 2;
      const r = a * (1 - k * Math.cos(th));
      px[i] = r * Math.cos(th);
      py[i] = r * Math.sin(th);
    }

    const cum = new Float64Array(M + 1);
    for (let i = 1; i <= M; i++) {
      const dx = px[i] - px[i - 1];
      const dy = py[i] - py[i - 1];
      cum[i] = cum[i - 1] + Math.sqrt(dx * dx + dy * dy);
    }
    const total = cum[M] || 1;

    const ox = new Float64Array(count);
    const oy = new Float64Array(count);
    let j = 0;
    for (let i = 0; i < count; i++) {
      const target = total * i / count;
      while (j < M - 1 && cum[j + 1] < target) j++;
      const seg = cum[j + 1] - cum[j];
      const f = seg > 1e-9 ? (target - cum[j]) / seg : 0;
      ox[i] = px[j] + (px[j + 1] - px[j]) * f;
      oy[i] = py[j] + (py[j + 1] - py[j]) * f;
    }
    return { x: ox, y: oy, n: count };
  }

  /* 预计算刺的颜色，避免每帧拼字符串 */
  const SPIKE_N = 200;
  const SPIKE_COLORS = new Array(SPIKE_N);
  for (let i = 0; i < SPIKE_N; i++) {
    const hue = 22 + (i % 4) * 4;
    const light = 27 + (i % 5) * 3;
    SPIKE_COLORS[i] = 'hsl(' + hue + ', 46%, ' + light + '%)';
  }

  /* ============================================================
     更新
  ============================================================ */
  function update(dt) {
    state.time += dt;

    // 刺的竖起 / 落下
    const rate = state.puffTarget > state.puff ? 16 : 6.5;
    state.puff += (state.puffTarget - state.puff) * Math.min(1, dt * rate);

    // 自动眨眼
    state.blinkTimer -= dt;
    if (state.blinkTimer <= 0) {
      state.blink = 1;
      state.blinkTimer = 2 + Math.random() * 3.5;
    }
    state.blink = Math.max(0, state.blink - dt * 9);
  }

  /* ============================================================
     渲染
  ============================================================ */
  function render() {
    const t = state.time;
    const a = state.a;
    const k = state.k;
    const N = SPIKE_N;

    // 依据实际显示尺寸设置变换
    ctx.setTransform(cv.width / CW, 0, 0, cv.height / CH, 0, 0);
    ctx.clearRect(0, 0, CW, CH);

    /* ---------- 背景 ---------- */
    const bg = ctx.createLinearGradient(0, 0, 0, CH);
    bg.addColorStop(0, '#fffaf2');
    bg.addColorStop(0.55, '#ffeeda');
    bg.addColorStop(1, '#ffdcbe');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, CW, CH);

    const glow = ctx.createRadialGradient(CW / 2, CH / 2 - 20, 20, CW / 2, CH / 2, 340);
    glow.addColorStop(0, 'rgba(255,255,255,0.9)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, CW, CH);

    /* ---------- 几何 ---------- */
    const out = buildOutline(a, k, N);

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < N; i++) {
      const x = out.x[i], y = out.y[i];
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
    const ox = -(minX + maxX) / 2;
    const oy = -(minY + maxY) / 2;
    const CCX = CW / 2, CCY = CH / 2;

    const toSX = (x) => x + ox + CCX;
    const toSY = (y) => CCY - (y + oy);

    // 上下呼吸浮动
    const bob = Math.sin(t * 1.9) * 3.5;
    ctx.save();
    ctx.translate(0, bob);

    /* ---------- 刺 ---------- */
    const puff = state.puff;
    for (let i = 0; i < N; i++) {
      const th = i / N * Math.PI * 2;
      const d = Math.min(th, Math.PI * 2 - th);   // 到鼻尖的角距

      // 鼻尖附近刺短一些，像个小圆鼻子
      let f = Math.min(1, d / 0.9);
      f = f * f * (3 - 2 * f);
      f = 0.20 + 0.80 * f;

      // 呼吸摆动 + 竖起时的抖动
      const wob = 1 + 0.085 * Math.sin(t * 2.6 + i * 0.72);
      const jitter = puff * Math.sin(t * 42 + i * 1.7) * 3.5;
      const L = a * 0.30 * f * wob * (1 + puff * 0.8) + jitter;
      const w = Math.max(1.5, L * 0.29);

      const p  = i;
      const pv = (i - 1 + N) % N;
      const nx2 = (i + 1) % N;

      let tx = out.x[nx2] - out.x[pv];
      let ty = out.y[nx2] - out.y[pv];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      // 逆时针曲线的外法线
      const nX = ty, nY = -tx;

      const bx = out.x[p], by = out.y[p];
      // 根部略微内缩，藏进身体里
      const inset = a * 0.045;
      const tipX = bx + nX * L,               tipY = by + nY * L;
      const b1x = bx - tx * w - nX * inset,   b1y = by - ty * w - nY * inset;
      const b2x = bx + tx * w - nX * inset,   b2y = by + ty * w - nY * inset;

      ctx.beginPath();
      ctx.moveTo(toSX(b1x), toSY(b1y));
      ctx.lineTo(toSX(tipX), toSY(tipY));
      ctx.lineTo(toSX(b2x), toSY(b2y));
      ctx.closePath();
      ctx.fillStyle = SPIKE_COLORS[i];
      ctx.fill();
    }

    /* ---------- 身体 ---------- */
    ctx.beginPath();
    ctx.moveTo(toSX(out.x[0]), toSY(out.y[0]));
    for (let i = 1; i < N; i++) {
      ctx.lineTo(toSX(out.x[i]), toSY(out.y[i]));
    }
    ctx.closePath();

    ctx.save();
    ctx.shadowColor = 'rgba(140, 80, 30, 0.35)';
    ctx.shadowBlur = 26;
    ctx.shadowOffsetY = 10;

    const bodyGrad = ctx.createRadialGradient(
      CCX - a * 0.25, CCY - a * 0.40, a * 0.08,
      CCX, CCY, a * 1.85
    );
    bodyGrad.addColorStop(0, '#fff1dc');
    bodyGrad.addColorStop(0.45, '#f4d0a4');
    bodyGrad.addColorStop(1, '#cf8f57');
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.restore();

    /* ---------- 五官 ---------- */
    // 眼睛
    const eyeX = -0.42 * a, eyeY = 0.26 * a;
    const eyeR = 0.085 * a;
    const open = 1 - state.blink;

    for (let s = 0; s < 2; s++) {
      const sgn = s === 0 ? 1 : -1;
      const ex = toSX(eyeX);
      const ey = toSY(sgn * eyeY);

      if (open > 0.18) {
        ctx.beginPath();
        ctx.ellipse(ex, ey, eyeR, eyeR * open, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#33200f';
        ctx.fill();

        if (open > 0.65) {
          ctx.beginPath();
          ctx.arc(ex - eyeR * 0.28, ey - eyeR * 0.32 * sgn, eyeR * 0.32, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.fill();
        }
      } else {
        ctx.beginPath();
        ctx.moveTo(ex - eyeR, ey);
        ctx.quadraticCurveTo(ex, ey + eyeR * 0.65 * sgn, ex + eyeR, ey);
        ctx.strokeStyle = '#33200f';
        ctx.lineWidth = Math.max(1.5, eyeR * 0.48);
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }

    // 腮红
    for (let s = 0; s < 2; s++) {
      const sgn = s === 0 ? 1 : -1;
      const bx = toSX(-0.55 * a);
      const by = toSY(sgn * 0.45 * a);
      const rr = 0.17 * a;
      const rg = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
      rg.addColorStop(0, 'rgba(255, 138, 132, 0.55)');
      rg.addColorStop(1, 'rgba(255, 138, 132, 0)');
      ctx.beginPath();
      ctx.arc(bx, by, rr, 0, Math.PI * 2);
      ctx.fillStyle = rg;
      ctx.fill();
    }

    // 鼻子
    const noseX = toSX(-0.035 * a);
    const noseY = toSY(0);
    ctx.beginPath();
    ctx.ellipse(noseX, noseY, a * 0.078, a * 0.066, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#3b2317';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(noseX - a * 0.022, noseY - a * 0.022, a * 0.024, a * 0.019, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();

    ctx.restore();
  }

  /* ============================================================
     主循环
  ============================================================ */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     交互
  ============================================================ */
  const aRange = document.getElementById('aRange');
  const kRange = document.getElementById('kRange');
  const aVal = document.getElementById('aVal');
  const kVal = document.getElementById('kVal');
  const eqA = document.getElementById('eqA');
  const eqK = document.getElementById('eqK');

  function syncEquation() {
    eqA.textContent = state.a;
    eqK.textContent = state.k.toFixed(2);
  }

  aRange.addEventListener('input', function () {
    state.a = +this.value;
    aVal.textContent = state.a;
    syncEquation();
    sliderBlip(190 + state.a * 4.2);
  });

  kRange.addEventListener('input', function () {
    const v = +this.value / 100;            // 0 → 1
    state.k = 1 - 0.65 * v;                 // 1.0 → 0.35
    kVal.textContent = this.value + '%';
    syncEquation();
    sliderBlip(280 + v * 420);
  });

  // 点击 / 触摸刺猬
  let puffTimer = null;
  function triggerPuff() {
    state.puffTarget = 1;
    clearTimeout(puffTimer);
    puffTimer = setTimeout(function () { state.puffTarget = 0; }, 520);

    swoosh();
    blip(660, 0.07, 'triangle', 0.07, 0.16);
    blip(990, 0.09, 'triangle', 0.055, 0.23);
  }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    triggerPuff();
    squeak();
  });

  document.getElementById('btnPuff').addEventListener('click', function () {
    ensureAudio();
    triggerPuff();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    aRange.value = 85;
    kRange.value = 0;
    state.a = 85;
    state.k = 1;
    aVal.textContent = '85';
    kVal.textContent = '0%';
    syncEquation();
    blip(520, 0.09, 'sine', 0.07);
    blip(780, 0.11, 'sine', 0.06, 0.08);
  });

  // 音效开关
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function () {
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    if (!muted) {
      ensureAudio();
      blip(880, 0.08, 'sine', 0.07);
    }
  });

  /* ============================================================
     启动
  ============================================================ */
  resizeCanvas();
  syncEquation();
  requestAnimationFrame(loop);

  // 首次任意交互时唤醒音频上下文
  window.addEventListener('pointerdown', function once() {
    ensureAudio();
    window.removeEventListener('pointerdown', once);
  });

})();
</script>
</body>
