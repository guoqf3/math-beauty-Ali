<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>科里奥利旋转效应</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #000206;
    color: #e9f4ff;
    font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }

  /* ---------- 背景 ---------- */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 50% 52%, rgba(10,50,90,0.32) 0%, rgba(1,3,8,0) 58%),
      radial-gradient(ellipse at 50% 20%, rgba(90,30,20,0.10) 0%, rgba(1,3,8,0) 55%),
      linear-gradient(180deg, #020610 0%, #010308 55%, #000000 100%);
  }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 50% 48%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.88) 100%);
  }
  #scene { position: fixed; inset: 0; z-index: 1; }
  canvas { display: block; }

  /* ---------- UI ---------- */
  .ui { position: fixed; z-index: 4; pointer-events: none; }

  header.ui { top: 34px; left: 42px; }
  .tag {
    font-size: 11px; letter-spacing: .38em; color: #3fb8d8;
    margin-bottom: 12px; text-transform: uppercase;
  }
  h1 {
    margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .14em;
    background: linear-gradient(92deg, #ff5a3c 0%, #ff9a44 28%, #7fffc4 66%, #3fe0ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(60,200,220,.42));
  }
  .sub {
    margin-top: 10px; font-size: 11px; letter-spacing: .26em; color: #3d6a80;
  }

  .panel {
    left: 42px; bottom: 44px;
    padding: 18px 24px 16px; border-radius: 14px;
    background: linear-gradient(160deg, rgba(10,44,64,.42), rgba(4,10,20,.32));
    border: 1px solid rgba(70,200,230,.22);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    box-shadow:
      0 0 40px rgba(30,140,180,.12) inset,
      0 10px 44px rgba(0,0,0,.55);
  }
  .eq {
    font-family: "Cambria Math", Georgia, "Times New Roman", serif;
    font-size: 20px; line-height: 1.6; color: #cfeaff;
    text-shadow: 0 0 16px rgba(80,200,230,.40);
    margin: 3px 0; letter-spacing: .02em;
  }
  .eq.small { font-size: 13.5px; color: #8ab8d0; text-shadow: 0 0 12px rgba(50,150,190,.35); }
  .eq .hl  { color: #ff7a5c; }
  .eq .hl2 { color: #7fffc4; }
  .eq .hl3 { color: #3fe0ff; }

  .hint {
    right: 42px; bottom: 46px; font-size: 11px;
    letter-spacing: .22em; color: #3d607a; text-align: right; line-height: 1.9;
  }

  /* ---------- 启动层 ---------- */
  #startScreen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px;
    background: radial-gradient(circle at 50% 50%, rgba(6,24,40,.80), rgba(0,1,3,.96));
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: opacity 1s ease, visibility 1s ease;
  }
  #startScreen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  #startScreen .st {
    font-size: 12px; letter-spacing: .5em; color: #3f9ac0; text-indent: .5em;
  }
  #startBtn {
    pointer-events: auto; cursor: pointer;
    padding: 16px 52px; font-size: 15px; letter-spacing: .42em; text-indent: .42em;
    color: #eaf8ff; background: rgba(16,80,110,.20);
    border: 1px solid rgba(90,220,255,.52); border-radius: 40px;
    font-family: inherit;
    box-shadow: 0 0 32px rgba(60,190,240,.35), 0 0 70px rgba(255,120,60,.12) inset;
    transition: all .35s ease;
    animation: pulseBtn 2.6s ease-in-out infinite;
  }
  #startBtn:hover {
    background: rgba(30,130,180,.32);
    box-shadow: 0 0 56px rgba(90,220,255,.65), 0 0 90px rgba(255,120,60,.22) inset;
    transform: translateY(-2px);
  }
  @keyframes pulseBtn {
    0%, 100% { box-shadow: 0 0 26px rgba(60,190,240,.28), 0 0 60px rgba(255,120,60,.10) inset; }
    50%      { box-shadow: 0 0 52px rgba(90,220,255,.60), 0 0 90px rgba(255,120,60,.22) inset; }
  }

  @media (max-width: 720px) {
    header.ui { top: 22px; left: 20px; }
    h1 { font-size: 19px; }
    .sub { font-size: 9px; }
    .panel { left: 20px; bottom: 24px; padding: 13px 16px; }
    .eq { font-size: 15px; }
    .eq.small { font-size: 11px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="scene"></div>
<div id="vignette"></div>

<header class="ui">
  <div class="tag">Non-inertial Frame</div>
  <h1>科里奥利旋转效应</h1>
  <div class="sub">CORIOLIS EFFECT · ROTATING REFERENCE FRAME</div>
</header>

<div class="panel ui">
  <div class="eq">F<sub>Cor</sub> = <span class="hl">−2m ω × v</span></div>
  <div class="eq small">ΔR = 2vω·sinθ·t²</div>
  <div class="eq small">旋转系中：<span class="hl2">轨迹向侧向弯曲</span></div>
  <div class="eq small">惯性系中：<span class="hl3">沿直线匀速运动</span></div>
</div>

<div class="hint ui">
  拖动鼠标 · 俯仰观察<br>
  滚轮 · 缩放
</div>

<div id="startScreen">
  <div class="st">ROTATING FRAME SIMULATION</div>
  <button id="startBtn">启 动</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   0. 参数
   ============================================================ */
const DISK_RADIUS = 4.6;      // 圆盘半径
const OMEGA       = 0.72;     // 圆盘角速度 rad/s
const SPEED       = 1.75;     // 小球径向速度 (单位/秒)
const SPAWN_INT   = 1.55;     // 发射间隔 (秒)
const MAX_TRAIL   = 240;      // 每条轨迹最大点数
const GOLDEN      = 2.39996323;

/* ============================================================
   1. 全局变量
   ============================================================ */
let scene, camera, renderer, clock;
let diskGroup;
const marbles = [];

/* 相机轨道 */
let camTheta = Math.PI / 2;
let camPhi   = 0.30;
let camRadius = 13.5;
let tgtTheta = camTheta;
let tgtPhi   = camPhi;
let tgtRadius = camRadius;
let mouseX = 0, mouseY = 0;

let lastSpawnTime = -999;
let spawnCounter = 0;

/* ============================================================
   2. 工具：贴图生成
   ============================================================ */
function makeDiskTexture() {
  const S = 1024;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const cx = S / 2, cy = S / 2;
  const maxR = S / 2 - 6;

  /* 基底 */
  const baseGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
  baseGrad.addColorStop(0.00, 'rgba(14,48,78,0.95)');
  baseGrad.addColorStop(0.35, 'rgba(8,30,54,0.92)');
  baseGrad.addColorStop(0.72, 'rgba(4,16,32,0.94)');
  baseGrad.addColorStop(1.00, 'rgba(1,6,16,0.97)');
  ctx.fillStyle = baseGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
  ctx.fill();

  /* 同心刻度环 */
  const nRings = 14;
  for (let i = 1; i <= nRings; i++) {
    const t = i / nRings;
    const r = t * maxR;
    const isMajor = (i % 3 === 0);
    const isMain  = (i === nRings);

    let alpha, w;
    if (isMain)        { alpha = 0.85; w = 4; }
    else if (isMajor)  { alpha = 0.42; w = 2.0; }
    else               { alpha = 0.16; w = 1.0; }

    ctx.strokeStyle = `rgba(90,220,255,${alpha})`;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    /* 主环内侧金色细线 */
    if (isMajor && !isMain) {
      ctx.strokeStyle = 'rgba(255,190,80,0.20)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, r - 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /* 径向刻度标记 */
  const N_TICKS = 96;
  for (let i = 0; i < N_TICKS; i++) {
    const a = (i / N_TICKS) * Math.PI * 2;
    const isMajor = (i % 8 === 0);
    const isMid   = (i % 4 === 0);

    const r1 = maxR * 0.93;
    const r2 = maxR * (isMajor ? 0.80 : isMid ? 0.855 : 0.885);

    ctx.strokeStyle = isMajor
      ? 'rgba(255,200,80,0.60)'
      : isMid
        ? 'rgba(90,220,255,0.42)'
        : 'rgba(90,220,255,0.18)';
    ctx.lineWidth = isMajor ? 2.5 : isMid ? 1.6 : 1.0;

    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    ctx.stroke();
  }

  /* 螺旋导向线 */
  ctx.strokeStyle = 'rgba(60,180,240,0.10)';
  ctx.lineWidth = 1;
  for (let arm = 0; arm < 6; arm++) {
    ctx.beginPath();
    const baseA = (arm / 6) * Math.PI * 2;
    for (let k = 0; k <= 120; k++) {
      const t = k / 120;
      const r = t * maxR * 0.93;
      const a = baseA + t * 0.85;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (k === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  /* 内圈核心 */
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 0.10);
  coreGrad.addColorStop(0.00, 'rgba(120,240,255,0.55)');
  coreGrad.addColorStop(0.50, 'rgba(60,160,220,0.22)');
  coreGrad.addColorStop(1.00, 'rgba(20,80,140,0.00)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, maxR * 0.10, 0, Math.PI * 2);
  ctx.fill();

  /* 外边界 */
  ctx.strokeStyle = 'rgba(110,235,255,0.92)';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,200,90,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, maxR - 8, 0, Math.PI * 2);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 8;
  return tex;
}

function makeGlowTexture(r, g, b) {
  const S = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const grad = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grad.addColorStop(0.00, `rgba(255,255,255,1)`);
  grad.addColorStop(0.14, `rgba(${r},${g},${b},0.92)`);
  grad.addColorStop(0.42, `rgba(${r},${g},${b},0.28)`);
  grad.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

/* ============================================================
   3. 场景初始化
   ============================================================ */
let diskTex, redGlowTex, greenGlowTex;

function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000408, 0.016);

  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
  camera.position.set(0, 13, 3.5);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.getElementById('scene').appendChild(renderer.domElement);

  /* ---------- 光照 ---------- */
  scene.add(new THREE.AmbientLight(0x88aacc, 1.15));

  const keyLight = new THREE.DirectionalLight(0x9fd4ff, 0.95);
  keyLight.position.set(6, 14, 8);
  scene.add(keyLight);

  const warmLight = new THREE.DirectionalLight(0xff8860, 0.55);
  warmLight.position.set(-8, 6, -7);
  scene.add(warmLight);

  const rimLight = new THREE.DirectionalLight(0x60e0ff, 0.45);
  rimLight.position.set(-3, 4, 12);
  scene.add(rimLight);

  /* ---------- 贴图 ---------- */
  diskTex     = makeDiskTexture();
  redGlowTex  = makeGlowTexture(255, 110, 70);
  greenGlowTex = makeGlowTexture(80, 255, 160);

  /* ---------- 圆盘组 ---------- */
  diskGroup = new THREE.Group();
  scene.add(diskGroup);

  /* 圆盘主体 */
  const diskGeo = new THREE.CircleGeometry(DISK_RADIUS, 128);
  diskGeo.rotateX(-Math.PI / 2);

  const diskMat = new THREE.MeshBasicMaterial({
    map: diskTex,
    transparent: true,
    opacity: 0.95,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const diskMesh = new THREE.Mesh(diskGeo, diskMat);
  diskGroup.add(diskMesh);

  /* 外边界环（立体感） */
  const outerRingGeo = new THREE.TorusGeometry(DISK_RADIUS, 0.045, 10, 160);
  outerRingGeo.rotateX(Math.PI / 2);
  const outerRingMat = new THREE.MeshStandardMaterial({
    color: 0x55ddff,
    emissive: 0x1a7fb0,
    emissiveIntensity: 2.0,
    metalness: 0.4,
    roughness: 0.30
  });
  const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
  outerRing.position.y = 0.01;
  diskGroup.add(outerRing);

  /* 金色装饰环 */
  const goldRingGeo = new THREE.TorusGeometry(DISK_RADIUS * 0.66, 0.018, 8, 128);
  goldRingGeo.rotateX(Math.PI / 2);
  const goldRingMat = new THREE.MeshStandardMaterial({
    color: 0xffc050,
    emissive: 0xb06a10,
    emissiveIntensity: 1.6,
    metalness: 0.55,
    roughness: 0.28
  });
  diskGroup.add(new THREE.Mesh(goldRingGeo, goldRingMat));

  /* ---------- 中心轴 ---------- */
  const hubGeo = new THREE.CylinderGeometry(0.13, 0.17, 0.34, 20);
  const hubMat = new THREE.MeshStandardMaterial({
    color: 0x9aeeff,
    emissive: 0x30a0d0,
    emissiveIntensity: 2.4,
    metalness: 0.55,
    roughness: 0.22
  });
  const hub = new THREE.Mesh(hubGeo, hubMat);
  hub.position.y = 0.17;
  scene.add(hub);

  /* 中心光晕 */
  const hubGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: greenGlowTex,
    color: 0x50e0ff,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: 0.55
  }));
  hubGlow.position.set(0, 0.10, 0);
  hubGlow.scale.set(1.8, 1.8, 1);
  scene.add(hubGlow);

  /* ---------- 背景星点 ---------- */
  const starN = 700;
  const starPos = new Float32Array(starN * 3);
  const starCol = new Float32Array(starN * 3);
  for (let i = 0; i < starN; i++) {
    const u = Math.random() * 2 - 1;
    const phi = Math.random() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    const r = 40 + Math.random() * 90;
    starPos[i * 3]     = s * Math.cos(phi) * r;
    starPos[i * 3 + 1] = u * r * 0.6 + 8;
    starPos[i * 3 + 2] = s * Math.sin(phi) * r;

    if (Math.random() < 0.25) {
      starCol[i * 3] = 1.0; starCol[i * 3 + 1] = 0.78; starCol[i * 3 + 2] = 0.45;
    } else {
      starCol[i * 3] = 0.52; starCol[i * 3 + 1] = 0.82; starCol[i * 3 + 2] = 1.0;
    }
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color',    new THREE.BufferAttribute(starCol, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    size: 0.55,
    vertexColors: true,
    transparent: true,
    opacity: 0.65,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  }));
  scene.add(stars);

  clock = new THREE.Clock();

  addEventListener('resize', onResize);
  addEventListener('pointermove', onPointerMove);
  addEventListener('wheel', onWheel, { passive: true });

  animate();
}

/* ============================================================
   4. 小球（弹珠）生成与管理
   ============================================================ */
function spawnMarble(time) {
  const phi0 = (spawnCounter * GOLDEN) % (Math.PI * 2);
  spawnCounter++;

  /* --- 小球主体 --- */
  const ballMat = new THREE.MeshStandardMaterial({
    color: 0xff4a2a,
    emissive: 0xff2200,
    emissiveIntensity: 3.2,
    metalness: 0.35,
    roughness: 0.22,
    transparent: true,
    opacity: 1.0
  });
  const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 16), ballMat);
  ballMesh.position.set(0, 0.10, 0);
  scene.add(ballMesh);

  /* --- 光晕 --- */
  const glowMat = new THREE.SpriteMaterial({
    map: redGlowTex,
    color: 0xff8855,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: 0.92
  });
  const ballGlow = new THREE.Sprite(glowMat);
  ballGlow.scale.set(1.0, 1.0, 1);
  ballGlow.position.set(0, 0.10, 0);
  scene.add(ballGlow);

  /* --- 内层强光 --- */
  const coreGlowMat = new THREE.SpriteMaterial({
    map: redGlowTex,
    color: 0xffffff,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: 0.65
  });
  const ballCoreGlow = new THREE.Sprite(coreGlowMat);
  ballCoreGlow.scale.set(0.42, 0.42, 1);
  ballCoreGlow.position.set(0, 0.10, 0);
  scene.add(ballCoreGlow);

  /* --- 轨迹几何体（圆盘局部坐标） --- */
  const trailGeo = new THREE.BufferGeometry();
  const posArr = new Float32Array(MAX_TRAIL * 3);
  const colArr = new Float32Array(MAX_TRAIL * 3);
  const alpArr = new Float32Array(MAX_TRAIL);
  trailGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  trailGeo.setAttribute('aColor',   new THREE.BufferAttribute(colArr, 3));
  trailGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(alpArr, 1));
  trailGeo.setDrawRange(0, 0);

  const trailMat = new THREE.ShaderMaterial({
    uniforms: {
      uAlpha: { value: 1.0 }
    },
    vertexShader: `
      attribute vec3  aColor;
      attribute float aAlpha;
      varying vec3  vColor;
      varying float vAlpha;
      void main() {
        vColor = aColor;
        vAlpha = aAlpha;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uAlpha;
      varying vec3  vColor;
      varying float vAlpha;
      void main() {
        gl_FragColor = vec4(vColor, vAlpha * uAlpha);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    linewidth: 2
  });

  const trailLine = new THREE.Line(trailGeo, trailMat);
  trailLine.frustumCulled = false;
  diskGroup.add(trailLine);

  /* --- 记录对象 --- */
  const marble = {
    t0: time,
    phi0: phi0,
    mesh: ballMesh,
    glow: ballGlow,
    coreGlow: ballCoreGlow,
    trailGeo: trailGeo,
    trailMat: trailMat,
    trailLine: trailLine,
    trailPts: [],       // [ [lx, lz], ... ] 圆盘局部坐标
    alpha: 1.0,
    dying: false,
    dead: false
  };

  marbles.push(marble);
}

/* ============================================================
   5. 轨迹几何体更新
   ============================================================ */
function updateTrailGeometry(marble) {
  const pts = marble.trailPts;
  const n = pts.length;
  if (n < 2) {
    marble.trailGeo.setDrawRange(0, 0);
    return;
  }

  const posArr = marble.trailGeo.attributes.position.array;
  const colArr = marble.trailGeo.attributes.aColor.array;
  const alpArr = marble.trailGeo.attributes.aAlpha.array;

  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    posArr[i3]     = pts[i][0];
    posArr[i3 + 1] = 0.045;
    posArr[i3 + 2] = pts[i][1];

    /* 颜色渐变：旧 → 青绿，新 → 亮黄绿 */
    const t = i / Math.max(n - 1, 1);
    const f = Math.pow(t, 1.4);
    colArr[i3]     = 0.10 + 0.55 * f;
    colArr[i3 + 1] = 0.70 + 0.30 * f;
    colArr[i3 + 2] = 0.42 + 0.45 * f;

    /* 透明度：尾部低，头部高 */
    let a = 0.22 + 0.78 * Math.pow(t, 1.5);
    if (i > n - 20) {
      const hb = (i - (n - 20)) / 20;
      a = Math.min(1.0, a + hb * 0.5);
    }
    alpArr[i] = a;
  }

  marble.trailGeo.attributes.position.needsUpdate = true;
  marble.trailGeo.attributes.aColor.needsUpdate   = true;
  marble.trailGeo.attributes.aAlpha.needsUpdate   = true;
  marble.trailGeo.setDrawRange(0, n);
  marble.trailGeo.computeBoundingSphere();
}

/* ============================================================
   6. 更新所有小球
   ============================================================ */
function updateMarbles(time, dt) {
  const diskAngle = OMEGA * time;

  for (let i = marbles.length - 1; i >= 0; i--) {
    const m = marbles[i];
    if (m.dead) { marbles.splice(i, 1); continue; }

    const age = time - m.t0;
    if (age < 0) continue;

    /* ---------- 世界坐标位置（沿直线径向运动） ---------- */
    const r = SPEED * age;
    const wx = r * Math.cos(m.phi0);
    const wz = r * Math.sin(m.phi0);

    m.mesh.position.set(wx, 0.10, wz);
    m.glow.position.set(wx, 0.10, wz);
    m.coreGlow.position.set(wx, 0.10, wz);

    /* ---------- 到达边缘 → 开始淡出 ---------- */
    if (r >= DISK_RADIUS) {
      m.dying = true;
    }

    /* ---------- 圆盘局部坐标 ---------- */
    const localAngle = m.phi0 + diskAngle;
    const lx = r * Math.cos(localAngle);
    const lz = r * Math.sin(localAngle);

    /* ---------- 添加轨迹点 ---------- */
    if (!m.dying) {
      const pts = m.trailPts;
      if (pts.length === 0) {
        pts.push([lx, lz]);
        updateTrailGeometry(m);
      } else {
        const last = pts[pts.length - 1];
        const dx = lx - last[0];
        const dz = lz - last[1];
        if (dx * dx + dz * dz > 0.0018) {  // ~0.042 距离
          pts.push([lx, lz]);
          if (pts.length > MAX_TRAIL) pts.shift();
          updateTrailGeometry(m);
        }
      }
    }

    /* ---------- 淡出 ---------- */
    if (m.dying) {
      m.alpha -= dt * 1.6;
      if (m.alpha <= 0) {
        /* 移除资源 */
        scene.remove(m.mesh);
        scene.remove(m.glow);
        scene.remove(m.coreGlow);
        diskGroup.remove(m.trailLine);

        m.mesh.geometry.dispose();
        m.mesh.material.dispose();
        m.glow.material.dispose();
        m.coreGlow.material.dispose();
        m.trailGeo.dispose();
        m.trailMat.dispose();

        m.dead = true;
        continue;
      }

      m.mesh.material.opacity = m.alpha;
      m.glow.material.opacity = m.alpha * 0.92;
      m.coreGlow.material.opacity = m.alpha * 0.65;
      m.trailMat.uniforms.uAlpha.value = m.alpha;

      /* 缩小的视觉反馈 */
      const s = 1 + (1 - m.alpha) * 0.6;
      m.glow.scale.set(1.0 * s, 1.0 * s, 1);
    } else {
      /* 光晕脉动 */
      const pulse = 1.0 + 0.20 * Math.sin(time * 6.0 + m.phi0 * 3.0);
      m.glow.scale.set(1.0 * pulse, 1.0 * pulse, 1);

      const corePulse = 0.42 * (1 + 0.25 * Math.sin(time * 9.0 + m.phi0 * 5.0));
      m.coreGlow.scale.set(corePulse, corePulse, 1);
    }
  }
}

/* ============================================================
   7. 相机
   ============================================================ */
function updateCamera(dt) {
  tgtTheta  = Math.PI / 2 + mouseX * 0.45;
  tgtPhi    = 0.30 + mouseY * 0.18;
  tgtPhi    = Math.max(0.08, Math.min(0.95, tgtPhi));

  camTheta  += (tgtTheta  - camTheta)  * 0.055;
  camPhi    += (tgtPhi    - camPhi)    * 0.055;
  camRadius += (tgtRadius - camRadius) * 0.060;

  const r = camRadius;
  camera.position.set(
    r * Math.sin(camPhi) * Math.cos(camTheta),
    r * Math.cos(camPhi),
    r * Math.sin(camPhi) * Math.sin(camTheta)
  );
  camera.lookAt(0, 0, 0);
}

/* ============================================================
   8. 事件
   ============================================================ */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function onPointerMove(e) {
  mouseX = (e.clientX / innerWidth) * 2 - 1;
  mouseY = (e.clientY / innerHeight) * 2 - 1;
}

function onWheel(e) {
  tgtRadius += e.deltaY * 0.012;
  tgtRadius = Math.max(7, Math.min(26, tgtRadius));
}

/* ============================================================
   9. 主循环
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.045);
  const time = clock.getElapsedTime();

  /* ---------- 圆盘旋转 ---------- */
  diskGroup.rotation.y = OMEGA * time;

  /* ---------- 发射新小球 ---------- */
  if (time - lastSpawnTime > SPAWN_INT) {
    lastSpawnTime = time;
    spawnMarble(time);
  }

  /* ---------- 更新小球与轨迹 ---------- */
  updateMarbles(time, dt);

  /* ---------- 相机 ---------- */
  updateCamera(dt);

  renderer.render(scene, camera);
}

/* ============================================================
   10. 科技感背景音效
   ============================================================ */
let audioStarted = false;

function startAudio() {
  if (audioStarted) return;
  audioStarted = true;

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();

    /* ---------- 总输出（长淡入） ---------- */
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.48, ctx.currentTime + 5.5);
    master.connect(ctx.destination);

    /* ---------- 低频持续音 ---------- */
    const droneGain = ctx.createGain();
    droneGain.gain.value = 0.14;

    const droneFilter = ctx.createBiquadFilter();
    droneFilter.type = 'lowpass';
    droneFilter.frequency.value = 500;
    droneFilter.Q.value = 0.8;

    droneGain.connect(droneFilter);
    droneFilter.connect(master);

    /* 旋转式幅度调制（模拟旋转参考系） */
    const rotLfo = ctx.createOscillator();
    rotLfo.frequency.value = 0.115;
    const rotDepth = ctx.createGain();
    rotDepth.gain.value = 0.06;
    rotLfo.connect(rotDepth);
    rotDepth.connect(droneGain.gain);
    rotLfo.start();

    [55, 82.41, 110, 164.81, 220, 329.63].forEach((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = i % 2 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (Math.random() - 0.5) * 14;

      const g = ctx.createGain();
      g.gain.value = 0.50 / (i + 1.2);

      osc.connect(g);
      g.connect(droneGain);

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.035 + 0.05 * i;
      const lg = ctx.createGain();
      lg.gain.value = 0.28 * g.gain.value;
      lfo.connect(lg);
      lg.connect(g.gain);
      lfo.start();

      osc.start();
    });

    /* ---------- 噪声层（旋转气流） ---------- */
    const len = Math.floor(ctx.sampleRate * 4);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const nFilter = ctx.createBiquadFilter();
    nFilter.type = 'bandpass';
    nFilter.frequency.value = 1100;
    nFilter.Q.value = 1.2;

    const nGain = ctx.createGain();
    nGain.gain.value = 0.048;

    noise.connect(nFilter);
    nFilter.connect(nGain);
    nGain.connect(master);
    noise.start();

    const sweep1 = ctx.createOscillator();
    sweep1.frequency.value = 0.036;
    const sd1 = ctx.createGain();
    sd1.gain.value = 850;
    sweep1.connect(sd1);
    sd1.connect(nFilter.frequency);
    sweep1.start();

    const sweep2 = ctx.createOscillator();
    sweep2.frequency.value = 0.013;
    const sd2 = ctx.createGain();
    sd2.gain.value = 320;
    sweep2.connect(sd2);
    sd2.connect(nFilter.frequency);
    sweep2.start();

    /* ---------- 周期性清脆音（小球撞击） ---------- */
    const freqs = [880, 1046.5, 1174.7, 1318.5, 1568, 1760, 2093, 2637];

    function blip() {
      if (!audioStarted) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();

        osc.type = Math.random() < 0.55 ? 'sine' : 'triangle';
        osc.frequency.value = freqs[Math.floor(Math.random() * freqs.length)];
        osc.detune.value = (Math.random() - 0.5) * 35;

        const peak = 0.008 + Math.random() * 0.018;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(peak, now + 0.007);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.28 + Math.random() * 0.35);

        osc.connect(g);
        g.connect(master);

        osc.start(now);
        osc.stop(now + 0.8);
      } catch (e) { /* ignore */ }

      setTimeout(blip, 200 + Math.random() * 800);
    }
    setTimeout(blip, 1500);

    /* ---------- 高频微弱泛音 ---------- */
    const shimmer = ctx.createOscillator();
    shimmer.type = 'sine';
    shimmer.frequency.value = 1760;
    const shGain = ctx.createGain();
    shGain.gain.value = 0.005;

    const shLfo = ctx.createOscillator();
    shLfo.frequency.value = 0.06;
    const shDepth = ctx.createGain();
    shDepth.gain.value = 0.004;
    shLfo.connect(shDepth);
    shDepth.connect(shGain.gain);
    shLfo.start();

    shimmer.connect(shGain);
    shGain.connect(master);
    shimmer.start();

  } catch (err) {
    console.warn('音频初始化失败：', err);
  }
}

/* ============================================================
   11. 启动
   ============================================================ */
init();

const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', () => {
  startScreen.classList.add('hide');
  startAudio();
});
</script>
