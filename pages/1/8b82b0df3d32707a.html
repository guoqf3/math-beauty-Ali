<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>黑洞吸积盘 · Black Hole Accretion Disk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, #0c0602 0%, #050201 50%, #000000 100%);
    font-family: "SF Mono", "JetBrains Mono", Consolas, Menlo, monospace;
    color: #ffd9a8;
    user-select: none;
  }
  canvas { display: block; }
  #scene { position: fixed; inset: 0; }

  /* 暗角 */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 48%, transparent 30%, rgba(0,0,0,.45) 72%, rgba(0,0,0,.86) 100%);
  }

  /* ---------- 标题 ---------- */
  .hud-title {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 10;
  }
  .hud-title h1 {
    font-size: 15px; letter-spacing: 10px; font-weight: 400;
    color: #ffd9a8;
    text-shadow: 0 0 20px rgba(255, 150, 40, .95), 0 0 60px rgba(255, 90, 20, .55);
  }
  .hud-title p {
    font-size: 10px; letter-spacing: 5px; margin-top: 9px;
    color: rgba(255, 180, 110, .42);
  }

  /* ---------- 通用面板 ---------- */
  .panel {
    position: fixed; z-index: 10;
    background: linear-gradient(135deg, rgba(48, 22, 4, .58), rgba(16, 7, 2, .44));
    border: 1px solid rgba(255, 150, 60, .2);
    border-radius: 11px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 13px 16px;
    box-shadow: 0 0 40px rgba(255, 110, 30, .1), inset 0 0 40px rgba(255, 80, 20, .05);
  }
  .cap {
    font-size: 10px; letter-spacing: 3px; margin-bottom: 9px;
    color: rgba(255, 180, 110, .48);
  }

  /* ---------- 公式：左下角 ---------- */
  #formulas {
    bottom: 28px;
    left: 28px;
    max-width: 46vw;
  }
  #formulas .eq {
    font-size: 12.5px; line-height: 2.0; letter-spacing: .3px;
    color: #ffdfb8; text-shadow: 0 0 14px rgba(255, 140, 50, .55);
    white-space: nowrap;
  }
  #formulas .eq em { font-style: normal; color: #ff9a3c; }
  #formulas .eq .hl { color: #ffd24d; }
  #formulas .eq .dim { color: rgba(255, 180, 110, .45); font-size: 11px; }

  /* ---------- 读数：右下角 ---------- */
  #readout {
    bottom: 28px;
    right: 28px;
    min-width: 248px;
    max-width: 46vw;
  }
  #readout .row {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 14px;
    font-size: 11.5px; line-height: 2.0; color: rgba(255, 200, 150, .74);
  }
  #readout .row b {
    font-weight: 500; color: #ff9a3c;
    text-shadow: 0 0 12px rgba(255, 140, 50, .85);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #readout .row b.gold { color: #ffd24d; text-shadow: 0 0 12px rgba(255, 210, 80, .85); }
  #readout .divider {
    height: 1px; margin: 7px 0;
    background: linear-gradient(90deg, transparent, rgba(255,150,60,.3), transparent);
  }

  /* ---------- 音频按钮 ---------- */
  #soundBtn {
    position: fixed; top: 26px; right: 28px; z-index: 20;
    padding: 9px 18px; font-size: 11px; letter-spacing: 2px;
    font-family: inherit; color: #ff9a3c; cursor: pointer;
    background: linear-gradient(135deg, rgba(70, 28, 6, .62), rgba(22, 10, 3, .5));
    border: 1px solid rgba(255, 150, 60, .32);
    border-radius: 8px;

    transition: all .25s;
    box-shadow: 0 0 20px rgba(255, 110, 30, .16);
  }
  #soundBtn:hover {
    background: linear-gradient(135deg, rgba(100, 42, 8, .78), rgba(38, 16, 5, .62));
    box-shadow: 0 0 32px rgba(255, 140, 50, .45);
    transform: translateY(-1px);
  }
  #soundBtn:active { transform: translateY(0); }

  /* ---------- 操作提示：右上角按钮下方 ---------- */
  #hint {
    position: fixed; top: 78px; right: 28px; z-index: 10;
    font-size: 9.5px; letter-spacing: 2px; line-height: 1.95;
    color: rgba(255, 180, 110, .32); text-align: right;
    pointer-events: none;

  @media (max-width: 860px) {
    #formulas { max-width: 47vw; padding: 10px 12px; }

    #readout { max-width: 47vw; min-width: 0; padding: 10px 12px; }
    #readout .row { font-size: 9.5px; line-height: 1.85; gap: 8px; }
    .cap { font-size: 8.5px; margin-bottom: 6px; }
    .hud-title h1 { font-size: 12px; letter-spacing: 6px; }
    #hint { display: none; }

</style>

<script type="importmap">
{

<body>

<div id="scene"></div>
<div id="vignette"></div>

<div class="hud-title">
  <h1>黑 洞 吸 积 盘</h1>
  <p>BLACK HOLE ACCRETION DISK</p>
</div>

<button id="soundBtn">🔈 开启音效</button>

<div id="hint">
  移动鼠标 · 环绕观察<br>
  粒子螺旋内落 · 视界不可逃逸
</div>

<!-- 左下角：数学公式 -->
<div id="formulas" class="panel">
  <div class="cap">RELATIVISTIC MODEL</div>
  <div class="eq">角动量守恒 <em>L = r × p = const</em></div>
  <div class="eq">开普勒角速度 <span class="hl">Ω = √(GM / r³)</span></div>
  <div class="eq">史瓦西半径 <em>r<sub>s</sub> = 2GM / c²</em></div>
  <div class="eq">最内稳定轨道 <span class="hl">r<sub>ISCO</sub> = 3 r<sub>s</sub></span></div>
  <div class="eq">盘面温度 <span class="hl">T ∝ r<sup>−3/4</sup></span></div>
  <div class="eq"><span class="dim">内热外冷 · 螺旋下坠 · 视界吞没</span></div>
</div>

<!-- 右下角：实时读数 -->
<div id="readout" class="panel">
  <div class="cap">ACCRETION STATUS</div>
  <div class="row"><span>视界半径 r<sub>s</sub></span><b id="vrs">—</b></div>
  <div class="row"><span>ISCO 半径</span><b id="visco">—</b></div>
  <div class="divider"></div>
  <div class="row"><span>内缘轨道速度</span><b class="gold" id="vvin">—</b></div>
  <div class="row"><span>外缘轨道速度</span><b class="gold" id="vvout">—</b></div>
  <div class="divider"></div>
  <div class="row"><span>内缘温度</span><b class="gold" id="vtin">—</b></div>
  <div class="row"><span>吸积率</span><b id="vmdot">—</b></div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   物理尺度（无量纲化）
   ============================================================ */
const RS        = 1.0;                 // 史瓦西半径（视界）
const R_PHOTON  = 1.5 * RS;            // 光子球
const R_ISCO    = 3.0 * RS;            // 最内稳定圆轨道
const R_OUT     = 15.0;                // 吸积盘外缘
const DISC_N    = 68000;               // 吸积盘粒子数

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const container = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearAlpha(0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.position.set(0, 5.6, 18.5);
camera.lookAt(0, 0, 0);

/* ============================================================
   事件视界 —— 纯黑球体
   ============================================================ */
const horizon = new THREE.Mesh(
  new THREE.SphereGeometry(RS, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(horizon);

/* 视界外缘极微弱的引力边界（避免边缘锯齿生硬） */
const horizonRim = new THREE.Mesh(
  new THREE.SphereGeometry(RS * 1.006, 64, 64),
  new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(0x2a1004) } },
    vertexShader: /* glsl */`
      varying vec3 vN;
      varying vec3 vV;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vN = normalize(mat3(modelMatrix) * normal);
        vV = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uColor;
      varying vec3 vN;
      varying vec3 vV;
      void main() {
        float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
        float rim = pow(f, 5.0);
        gl_FragColor = vec4(uColor * rim, rim * 0.55);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.FrontSide
  })
);
scene.add(horizonRim);

/* ============================================================
   光子环 —— 明亮细线 + 引力透镜弧
   ============================================================ */
const photonRing = new THREE.Mesh(
  new THREE.TorusGeometry(R_PHOTON, 0.016, 12, 220),
  new THREE.MeshBasicMaterial({
    color: 0xfff4d6,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
photonRing.rotation.x = Math.PI / 2;
scene.add(photonRing);

const photonHalo = new THREE.Mesh(
  new THREE.TorusGeometry(R_PHOTON, 0.075, 12, 220),
  new THREE.MeshBasicMaterial({
    color: 0xffb050,
    transparent: true,
    opacity: 0.16,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
photonHalo.rotation.x = Math.PI / 2;
scene.add(photonHalo);

const lensRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.62, 0.05, 12, 220),
  new THREE.MeshBasicMaterial({
    color: 0xffa63c,
    transparent: true,
    opacity: 0.12,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
lensRing.rotation.x = Math.PI / 2;
scene.add(lensRing);

/* ============================================================
   中心辉光 Sprite 贴图
   ============================================================ */
function makeGlowTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0.00, 'rgba(255,240,210,1)');
  g.addColorStop(0.14, 'rgba(255,170,70,0.75)');
  g.addColorStop(0.42, 'rgba(255,100,20,0.20)');
  g.addColorStop(1.00, 'rgba(255,60,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = makeGlowTex();

const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex,
  color: 0xffb060,
  transparent: true,
  opacity: 0.52,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
coreGlow.scale.set(9.5, 9.5, 1);
scene.add(coreGlow);

/* ============================================================
   吸积盘粒子系统
   ============================================================ */
const discGeo = new THREE.BufferGeometry();

const dSeed   = new Float32Array(DISC_N);
const dTheta  = new Float32Array(DISC_N);
const dPhase  = new Float32Array(DISC_N);
const dY      = new Float32Array(DISC_N);
const dSize   = new Float32Array(DISC_N);
const dRand   = new Float32Array(DISC_N);
const dDur    = new Float32Array(DISC_N);

for (let i = 0; i < DISC_N; i++) {
  dSeed[i]  = Math.random();
  dTheta[i] = Math.random() * Math.PI * 2;
  dPhase[i] = Math.random();
  dY[i]     = (Math.random() + Math.random() + Math.random() - 1.5) * 0.42;
  dSize[i]  = 0.6 + Math.random() * 1.9;
  dRand[i]  = Math.random();
  dDur[i]   = 6.5 + Math.random() * 9.5;
}

discGeo.setAttribute('aSeed',  new THREE.BufferAttribute(dSeed, 1));
discGeo.setAttribute('aTheta', new THREE.BufferAttribute(dTheta, 1));
discGeo.setAttribute('aPhase', new THREE.BufferAttribute(dPhase, 1));
discGeo.setAttribute('aY',     new THREE.BufferAttribute(dY, 1));
discGeo.setAttribute('aSize',  new THREE.BufferAttribute(dSize, 1));
discGeo.setAttribute('aRand',  new THREE.BufferAttribute(dRand, 1));
discGeo.setAttribute('aDur',   new THREE.BufferAttribute(dDur, 1));

discGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DISC_N * 3), 3));
discGeo.attributes.position.setUsage(THREE.DynamicDrawUsage);

const discUniforms = {
  uTime:       { value: 0 },
  uRIn:        { value: R_ISCO },
  uROut:       { value: R_OUT },
  uSpin:       { value: 1.55 },
  uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
  uBright:     { value: 1.0 }
};

const discMat = new THREE.ShaderMaterial({
  uniforms: discUniforms,
  vertexShader: /* glsl */`
    attribute float aSeed;
    attribute float aTheta;
    attribute float aPhase;
    attribute float aY;
    attribute float aSize;
    attribute float aRand;
    attribute float aDur;

    uniform float uTime;
    uniform float uRIn;
    uniform float uROut;
    uniform float uSpin;
    uniform float uPixelRatio;
    uniform float uBright;

    varying vec3  vColor;
    varying float vAlpha;

    void main() {
      /* ---- 下落进度 s ∈ [0,1) ---- */
      float s = fract(aPhase + uTime / aDur);

      /* ---- 每颗粒子独立的外半径 ---- */
      float rOut = uROut * (0.70 + 0.30 * aSeed);

      /* ---- 半径：几何螺旋内落 ---- */
      float r = rOut * pow(uRIn / rOut, s);

      /* ---- 开普勒角速度积分：θ ∝ ∫ r^(-3/2) ds ---- */
      float ratioP = rOut / uRIn;
      float spinK  = 0.75 + aRand * 0.65;
      float theta  = aTheta + uSpin * spinK * (pow(ratioP, 1.5 * s) - 1.0);

      /* ---- 盘面厚度：内薄外厚 ---- */
      float rn = clamp((r - uRIn) / (rOut - uRIn), 0.0, 1.0);
      float y  = aY * mix(0.28, 1.0, rn);

      /* ---- 轻微垂直摆动 ---- */
      y += sin(theta * 3.1 + uTime * 1.7 + aSeed * 40.0) * 0.055 * (1.0 - rn * 0.5);

      vec3 pos = vec3(cos(theta) * r, y, sin(theta) * r);

      /* ---- 温度 / 颜色：内热外冷 ---- */
      float heat = pow(1.0 - rn, 1.55);

      vec3 cOuter = vec3(0.95, 0.16, 0.02);
      vec3 cMid   = vec3(1.00, 0.46, 0.04);
      vec3 cWarm  = vec3(1.00, 0.72, 0.14);
      vec3 cInner = vec3(1.00, 0.95, 0.66);

      vec3 col = mix(cOuter, cMid,  smoothstep(0.00, 0.42, heat));
      col = mix(col, cWarm,  smoothstep(0.38, 0.78, heat));
      col = mix(col, cInner, smoothstep(0.74, 1.00, heat));

      col *= 0.84 + 0.32 * aRand;

      float bright = (0.42 + heat * 1.55) * uBright;
      col *= bright;

      float fadeIn  = smoothstep(0.00, 0.055, s);
      float fadeOut = 1.0 - smoothstep(0.84, 1.00, s);
      vAlpha = fadeIn * fadeOut * (0.32 + 0.68 * heat);

      vColor = col;

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mv;

      float ps = aSize * uPixelRatio * (34.0 / max(0.001, -mv.z)) * (0.72 + heat * 0.85);
      gl_PointSize = clamp(ps, 0.7, 22.0);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3  vColor;
    varying float vAlpha;

    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d2 = dot(c, c);
      if (d2 > 0.25) discard;

      float a = smoothstep(0.25, 0.0, d2);
      a = pow(a, 1.7);

      vec3 col = vColor + vec3(1.0, 0.92, 0.78) * pow(a, 8.0) * 0.65;

      gl_FragColor = vec4(col, a * vAlpha * 0.92);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true
});

const discPoints = new THREE.Points(discGeo, discMat);
discPoints.frustumCulled = false;
scene.add(discPoints);

/* ============================================================
   内缘高温亮环
   ============================================================ */
const iscoRing = new THREE.Mesh(
  new THREE.TorusGeometry(R_ISCO * 1.002, 0.06, 10, 220),
  new THREE.MeshBasicMaterial({
    color: 0xffe9b0,
    transparent: true,
    opacity: 0.22,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
iscoRing.rotation.x = Math.PI / 2;
scene.add(iscoRing);

/* ============================================================
   背景星空
   ============================================================ */
{
  const N = 9000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  const tmp = new THREE.Color();

  for (let i = 0; i < N; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = 320 + Math.random() * 900;

    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi);
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const t = Math.random();
    if (t < 0.55)      tmp.setHSL(0.58 + Math.random() * 0.07, 0.42, 0.86);
    else if (t < 0.80) tmp.setHSL(0.10 + Math.random() * 0.06, 0.55, 0.84);
    else if (t < 0.93) tmp.setHSL(0.06 + Math.random() * 0.03, 0.72, 0.78);
    else               tmp.setHSL(0.00, 0.0, 0.95);

    col[i * 3]     = tmp.r;
    col[i * 3 + 1] = tmp.g;
    col[i * 3 + 2] = tmp.b;

    siz[i] = 0.9 + Math.random() * 3.2;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));

  const m = new THREE.ShaderMaterial({
    uniforms: {
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
      uTime:       { value: 0 }
    },
    vertexShader: /* glsl */`
      attribute float aSize;
      attribute vec3  aColor;
      uniform float uPixelRatio;
      uniform float uTime;
      varying vec3  vColor;
      varying float vTw;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;

        float tw = 0.70 + 0.30 * sin(uTime * 1.25 + position.x * 0.09 + position.y * 0.07);
        vTw = tw;

        gl_PointSize = clamp(aSize * uPixelRatio * (420.0 / max(0.001, -mv.z)), 0.8, 7.0);
        vColor = aColor;
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3  vColor;
      varying float vTw;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d2 = dot(c, c);
        if (d2 > 0.25) discard;
        float a = smoothstep(0.25, 0.0, d2);
        gl_FragColor = vec4(vColor * vTw, a * 0.95);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const stars = new THREE.Points(g, m);
  stars.frustumCulled = false;
  scene.add(stars);

  window.__stars = stars;
}

/* ============================================================
   读数面板
   ============================================================ */
const elRs   = document.getElementById('vrs');
const elIsco = document.getElementById('visco');
const elVin  = document.getElementById('vvin');
const elVout = document.getElementById('vvout');
const elTin  = document.getElementById('vtin');
const elMdot = document.getElementById('vmdot');

const vIn  = Math.sqrt(1 / R_ISCO);
const vOut = Math.sqrt(1 / R_OUT);

elRs.textContent   = RS.toFixed(2) + ' r₀';
elIsco.textContent = R_ISCO.toFixed(2) + ' r₀';
elVin.textContent  = vIn.toFixed(3) + ' c';
elVout.textContent = vOut.toFixed(3) + ' c';
elTin.textContent  = '1.00 × 10⁷ K';
elMdot.textContent = '0.37 ṀEdd';

/* ============================================================
   音频 —— 深空 / 吸积盘氛围
   ============================================================ */
let audioCtx = null;
let masterGain = null;
let audioOn = false;
let droneGain = null;
let hissGain = null;
let shimmerGain = null;
let bellTimer = null;

const soundBtn = document.getElementById('soundBtn');

function makeImpulse(ctx, duration, decay) {
  const rate = ctx.sampleRate;
  const len  = Math.floor(rate * duration);
  const buf  = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);

  /* ---- 混响 ---- */
  const convolver = audioCtx.createConvolver();
  convolver.buffer = makeImpulse(audioCtx, 5.5, 2.8);

  const wet = audioCtx.createGain();
  wet.gain.value = 0.55;
  convolver.connect(wet);
  wet.connect(masterGain);

  const bus = audioCtx.createGain();
  bus.gain.value = 1.0;
  bus.connect(masterGain);
  bus.connect(convolver);

  /* ---- 低频引力嗡鸣 ---- */
  droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.24;
  droneGain.connect(bus);

  [32.7, 49.0, 65.4, 98.0].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = i < 2 ? 'sine' : 'triangle';
    o.frequency.value = f;
    o.detune.value = (Math.random() - 0.5) * 10;

    const g = audioCtx.createGain();
    g.gain.value = [0.26, 0.16, 0.075, 0.030][i];

    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 300;
    lp.Q.value = 0.6;

    o.connect(lp);
    lp.connect(g);
    g.connect(droneGain);
    o.start();
  });

  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.062;
  const lfoAmt = audioCtx.createGain();
  lfoAmt.gain.value = 0.10;
  lfo.connect(lfoAmt);
  lfoAmt.connect(droneGain.gain);
  lfo.start();

  /* ---- 中频 Pad 和弦 ---- */
  const padFilter = audioCtx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 640;
  padFilter.Q.value = 3.0;
  padFilter.connect(bus);

  [110, 130.81, 164.81, 196.00, 246.94].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f;
    o.detune.value = (i - 2) * 8;

    const g = audioCtx.createGain();
    g.gain.value = 0.030;
    o.connect(g);
    g.connect(padFilter);
    o.start();
  });

  const padLFO = audioCtx.createOscillator();
  padLFO.type = 'sine';
  padLFO.frequency.value = 0.043;
  const padAmt = audioCtx.createGain();
  padAmt.gain.value = 380;
  padLFO.connect(padAmt);
  padAmt.connect(padFilter.frequency);
  padLFO.start();

  /* ---- 等离子体嘶嘶声 ---- */
  const nLen = audioCtx.sampleRate * 4;
  const nBuf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const nd = nBuf.getChannelData(0);
  for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;

  const nSrc = audioCtx.createBufferSource();
  nSrc.buffer = nBuf;
  nSrc.loop = true;

  const nFilter = audioCtx.createBiquadFilter();
  nFilter.type = 'bandpass';
  nFilter.frequency.value = 2200;
  nFilter.Q.value = 0.7;

  hissGain = audioCtx.createGain();
  hissGain.gain.value = 0.014;

  nSrc.connect(nFilter);
  nFilter.connect(hissGain);
  hissGain.connect(bus);
  nSrc.start();

  const hissLFO = audioCtx.createOscillator();
  hissLFO.type = 'sine';
  hissLFO.frequency.value = 0.11;
  const hissAmt = audioCtx.createGain();
  hissAmt.gain.value = 900;
  hissLFO.connect(hissAmt);
  hissAmt.connect(nFilter.frequency);
  hissLFO.start();

  /* ---- 高频微光 ---- */
  shimmerGain = audioCtx.createGain();
  shimmerGain.gain.value = 0.0;

  const shFilter = audioCtx.createBiquadFilter();
  shFilter.type = 'bandpass';
  shFilter.frequency.value = 3200;
  shFilter.Q.value = 2.4;
  shFilter.connect(shimmerGain);
  shimmerGain.connect(bus);
  shimmerGain.connect(convolver);

  [1567.98, 2093.00, 2637.02].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    o.detune.value = (i - 1) * 11;

    const g = audioCtx.createGain();
    g.gain.value = 0.0032;
    o.connect(g);
    g.connect(shFilter);
    o.start();
  });

  scheduleBell();
}

/* ---- 随机深空钟声 ---- */
function playBell() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime + Math.random() * 0.5;

  const scale = [220, 261.63, 293.66, 349.23, 392.00, 440, 523.25];
  const f = scale[Math.floor(Math.random() * scale.length)] * (Math.random() < 0.35 ? 2 : 1);

  const o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.value = f;

  const o2 = audioCtx.createOscillator();
  o2.type = 'sine';
  o2.frequency.value = f * 2.01;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0, now);
  g.gain.linearRampToValueAtTime(0.028 + Math.random() * 0.022, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 5.5 + Math.random() * 3);

  const g2 = audioCtx.createGain();
  g2.gain.value = 0.35;
  o2.connect(g2);
  g2.connect(g);

  o.connect(g);
  g.connect(masterGain);

  const conv = audioCtx.createConvolver();
  conv.buffer = makeImpulse(audioCtx, 4.0, 2.6);
  const cg = audioCtx.createGain();
  cg.gain.value = 0.5;
  g.connect(conv);
  conv.connect(cg);
  cg.connect(masterGain);

  o.start(now); o.stop(now + 9);
  o2.start(now); o2.stop(now + 9);
}

function scheduleBell() {
  if (!audioCtx) return;
  const delay = 3500 + Math.random() * 7000;
  bellTimer = setTimeout(() => {
    if (audioOn) playBell();
    scheduleBell();
  }, delay);
}

soundBtn.addEventListener('click', () => {
  if (!audioCtx) {
    initAudio();
    audioOn = true;
    masterGain.gain.setTargetAtTime(0.34, audioCtx.currentTime, 1.0);
    soundBtn.textContent = '🔊 关闭音效';
  } else {
    audioOn = !audioOn;
    masterGain.gain.setTargetAtTime(audioOn ? 0.34 : 0.0, audioCtx.currentTime, 0.45);
    soundBtn.textContent = audioOn ? '🔊 关闭音效' : '🔈 开启音效';
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
});

/* ============================================================
   鼠标视差
   ============================================================ */
let mouseX = 0, mouseY = 0;
let targetMX = 0, targetMY = 0;

window.addEventListener('pointermove', (e) => {
  targetMX = (e.clientX / window.innerWidth  - 0.5) * 2.0;
  targetMY = (e.clientY / window.innerHeight - 0.5) * 2.0;
});

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let simTime = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  /* ---- 相机缓慢环绕 + 视差 ---- */
  mouseX += (targetMX - mouseX) * 0.05;
  mouseY += (targetMY - mouseY) * 0.05;

  const autoAz = simTime * 0.045;
  const az = autoAz + mouseX * 0.55;
  const el = 0.28 + mouseY * 0.30 + Math.sin(simTime * 0.07) * 0.045;
  const dist = 19.5 + Math.sin(simTime * 0.05) * 0.8;

  camera.position.set(
    Math.sin(az) * Math.cos(el) * dist,
    Math.sin(el) * dist,
    Math.cos(az) * Math.cos(el) * dist
  );
  camera.lookAt(0, 0, 0);

  /* ---- 吸积盘时间 ---- */
  discUniforms.uTime.value = simTime;

  /* ---- 光子环脉动 ---- */
  const pulse = 0.92 + 0.08 * Math.sin(simTime * 2.2);
  photonRing.material.opacity = 0.88 * pulse;
  photonHalo.material.opacity = 0.14 + 0.06 * Math.sin(simTime * 1.5);
  lensRing.material.opacity   = 0.10 + 0.045 * Math.sin(simTime * 0.9 + 1.0);

  /* ---- 中心辉光呼吸 ---- */
  coreGlow.material.opacity = 0.46 + 0.12 * Math.sin(simTime * 0.65);
  coreGlow.scale.setScalar(9.2 + Math.sin(simTime * 0.9) * 0.5);

  /* ---- 星空时间 ---- */
  if (window.__stars) window.__stars.material.uniforms.uTime.value = simTime;

  /* ---- 音频联动 ---- */
  if (audioCtx && audioOn) {
    const now = audioCtx.currentTime;
    const mod = 0.5 + 0.5 * Math.sin(simTime * 0.5);

    if (hissGain) {
      hissGain.gain.setTargetAtTime(0.010 + mod * 0.016, now, 0.4);
    }
    if (droneGain) {
      droneGain.gain.setTargetAtTime(0.20 + mod * 0.10, now, 0.6);
    }
    if (shimmerGain) {
      const s = 0.0015 + mod * 0.008;
      shimmerGain.gain.setTargetAtTime(s, now, 0.8);
    }
  }

  renderer.render(scene, camera);
}

/* ============================================================
   自适应
   ============================================================ */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const dpr = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);

  discUniforms.uPixelRatio.value = dpr;
  if (window.__stars) window.__stars.material.uniforms.uPixelRatio.value = dpr;
}

window.addEventListener('resize', onResize);

/* ============================================================
   启动
   ============================================================ */
animate();
</script>
