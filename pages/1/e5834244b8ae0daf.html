<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>声波驻波模式 · 鼓面振动 · Circular Membrane Modes</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060e;}
  canvas{display:block;position:fixed;inset:0;touch-action:none;}

  .hud{
    position:fixed;pointer-events:none;z-index:5;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
  }

  /* ---------- 左上：标题 + 公式 ---------- */
  .hud-tl{
    top:clamp(16px,3vh,40px);
    left:clamp(16px,3vw,50px);
  }
  .hud-tl h1{
    font-size:clamp(15px,2.0vw,27px);
    font-weight:500;
    letter-spacing:.2em;
    color:#e9fbff;
    white-space:nowrap;
    text-shadow:0 0 10px #3ad2ff,0 0 34px #1a6aff,0 0 72px #8a2cff;
  }
  .hud-tl .en{
    margin-top:.6em;
    font-size:clamp(8px,.82vw,11px);
    letter-spacing:.4em;
    color:#5aa8cc;
    text-shadow:0 0 8px rgba(58,210,255,.55);
    white-space:nowrap;
  }
  .rule{
    margin:1.1em 0 1em;
    width:clamp(130px,17vw,250px);
    height:1px;
    background:linear-gradient(90deg,#3ad2ff,rgba(58,210,255,0));
    box-shadow:0 0 10px #3ad2ff;
  }
  .eq{
    font-size:clamp(10px,1.05vw,14px);
    letter-spacing:.07em;
    line-height:2.0;
    color:#a9e6ff;
    white-space:nowrap;
    text-shadow:0 0 10px rgba(58,210,255,.8);
  }
  .eq .hl{color:#ff9df0;text-shadow:0 0 12px #ff4de0,0 0 30px #a416ff;}
  .eq2{
    margin-top:.35em;
    color:#ffd8fb;
    text-shadow:0 0 12px rgba(255,90,230,.9),0 0 32px rgba(160,40,255,.6);
  }

  /* ---------- 右侧：模式读数 ---------- */
  .hud-br{
    right:clamp(16px,3vw,50px);
    top:50%;
    transform:translateY(-50%);
    text-align:right;
    font-size:clamp(9px,.9vw,12px);
    letter-spacing:.18em;
    line-height:2.15;
    color:#6ec4e6;
    text-shadow:0 0 9px rgba(58,210,255,.65);
  }
  .hud-br b{color:#ffb3f4;font-weight:400;text-shadow:0 0 12px #ff4de0;}
  .hud-br .dim{color:#3f7a99;}

  /* ---------- 左侧竖条 ---------- */
  .hud-line{
    position:fixed;left:clamp(7px,1.3vw,21px);top:50%;
    transform:translateY(-50%);
    width:1px;height:32vh;z-index:5;pointer-events:none;
    background:linear-gradient(180deg,transparent,#3ad2ff,transparent);
    opacity:.45;box-shadow:0 0 12px #3ad2ff;
  }

  /* ---------- 控制面板 ---------- */
  .panel{
    position:fixed;left:50%;bottom:clamp(16px,3.6vh,42px);
    transform:translateX(-50%);
    z-index:10;
    display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);
    padding:clamp(9px,1.2vh,15px) clamp(16px,2.2vw,30px);
    border:1px solid rgba(90,215,255,.28);
    border-radius:44px;
    background:rgba(7,20,42,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(9px,.95vw,12px);
    letter-spacing:.18em;
    color:#8fd8f5;
    box-shadow:0 0 30px rgba(30,120,255,.18),inset 0 0 22px rgba(58,210,255,.06);
    white-space:nowrap;
  }
  .panel .lab{color:#5fa6c8;}
  .panel .val{
    min-width:9.6em;color:#ffb3f4;
    text-shadow:0 0 12px #ff4de0;
    font-variant-numeric:tabular-nums;
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:clamp(120px,18vw,260px);height:2px;
    border-radius:2px;outline:none;
    background:linear-gradient(90deg,#3ad2ff,#9b6bff,#ff4de0);
    box-shadow:0 0 10px rgba(58,210,255,.6);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px;height:15px;border-radius:50%;
    background:#fff;cursor:pointer;
    box-shadow:0 0 12px #3ad2ff,0 0 26px #ff4de0;
    transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22);}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border:none;border-radius:50%;
    background:#fff;cursor:pointer;
    box-shadow:0 0 12px #3ad2ff,0 0 26px #ff4de0;
  }

  /* ---------- 启动提示 ---------- */
  #start{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    z-index:30;cursor:pointer;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(10px,1vw,13px);
    letter-spacing:.32em;
    color:#b0ecff;
    padding:13px 30px;
    border:1px solid rgba(90,220,255,.45);
    border-radius:44px;
    background:rgba(8,26,54,.5);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    text-shadow:0 0 10px #3ad2ff;
    animation:breathe 2.6s ease-in-out infinite;
    transition:opacity .8s ease,transform .8s ease;
    white-space:nowrap;
  }
  #start.hide{
    opacity:0;pointer-events:none;
    transform:translate(-50%,-50%) scale(.94);
  }
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 rgba(58,210,255,0);border-color:rgba(90,220,255,.3);}
    50%{box-shadow:0 0 30px rgba(58,210,255,.55),inset 0 0 20px rgba(58,210,255,.12);border-color:rgba(150,240,255,.85);}
  }

  /* ---------- 扫描线 & 暗角 ---------- */
  .scan{
    position:fixed;inset:0;z-index:6;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.5;
  }
  .vig{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 50% 52%,transparent 32%,rgba(0,0,0,.7) 100%);
  }

  @media (max-width:640px){
    .hud-br{display:none;}
    .hud-tl .en{letter-spacing:.26em;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vig"></div>
<div class="scan"></div>
<div class="hud-line"></div>

<div class="hud hud-tl">
  <h1>声波驻波模式 · 鼓面振动</h1>
  <div class="en">CIRCULAR MEMBRANE · STANDING WAVES · BESSEL</div>
  <div class="rule"></div>
  <div class="eq">∂²u/∂t² = c²∇²u &nbsp;·&nbsp; 二维波动方程</div>
  <div class="eq eq2">u(r,θ,t) = J<sub>m</sub>(kr) · cos(mθ) · cos(ωt)</div>
  <div class="eq">k<sub>mn</sub> = j<sub>mn</sub> / a &nbsp;·&nbsp; J<sub>m</sub>(j<sub>mn</sub>) = 0</div>
</div>

<div class="hud hud-br">
  <div class="dim">—— 模式参数 ——</div>
  <div>模式 <b id="r-mode">(0, 1)</b></div>
  <div>j<sub>mn</sub> <b id="r-j">2.4048</b></div>
  <div>径向节线 <b id="r-rad">0</b></div>
  <div>角向节线 <b id="r-ang">0</b></div>
  <div>花瓣数 <b id="r-pet">1</b></div>
</div>

<div class="panel">
  <span class="lab">振动模式</span>
  <input type="range" id="mode" min="0" max="19" step="1" value="0">
  <span class="val" id="modeval">(m,n) = (0,1)</span>
</div>

<div id="start">点击任意处 · 启动音效</div>

<script>
(function () {
'use strict';

/* ======================================================================
   0 · 画布 & 尺寸
   ====================================================================== */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const TAU    = Math.PI * 2;

let W = 0, H = 0, DPR = 1, S = 0;
let CX = 0, CY = 0, pScale = 340;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);
  CX = W * 0.5;
  CY = H * 0.52;
  pScale = S * 0.42;
}
window.addEventListener('resize', resize, { passive: true });
resize();

/* ======================================================================
   1 · 三维投影
   ====================================================================== */
const CAMD  = 5.0;
const PITCH = 0.80;                       // 俯仰角
const cosP  = Math.cos(PITCH);
const sinP  = Math.sin(PITCH);

let yaw  = 0.42;
let cosY = Math.cos(yaw);
let sinY = Math.sin(yaw);

/* ======================================================================
   2 · 贝塞尔函数 J_m(x) —— 级数展开
   ====================================================================== */
function besselJ(m, x) {
  if (x === 0) return (m === 0) ? 1 : 0;

  let fact = 1;
  for (let i = 2; i <= m; i++) fact *= i;

  const half = x * 0.5;
  let pow = Math.pow(half, m);
  let term = pow / fact;
  let sum  = term;

  for (let k = 1; k < 80; k++) {
    term *= -(half * half) / (k * (k + m));
    sum  += term;
    if (Math.abs(term) < 1e-15 * Math.abs(sum) + 1e-18) break;
  }
  return sum;
}

/* ======================================================================
   3 · 模式定义（J_m 的零点）
   ====================================================================== */
const ZEROS = [
  [2.4048, 5.5201,  8.6537, 11.7915],   // m = 0
  [3.8317, 7.0156, 10.1735, 13.3237],   // m = 1
  [5.1356, 8.4172, 11.6198, 14.7960],   // m = 2
  [6.3802, 9.7610, 13.0152, 16.2235],   // m = 3
  [7.5883, 11.0647, 14.3725, 17.6160]   // m = 4
];

const MODES = [];
for (let m = 0; m <= 4; m++) {
  for (let n = 1; n <= 4; n++) {
    MODES.push({ m: m, n: n, j: ZEROS[m][n - 1] });
  }
}

/* ======================================================================
   4 · 网格预计算
   ====================================================================== */
const RINGS = 16;      // 径向环数
const SEGS  = 56;      // 角向段数
const RAD   = 1.0;     // 膜半径
const AMP   = 0.50;    // 振动幅度（视觉放大）

const NV = (RINGS + 1) * SEGS;

const vX = new Float32Array(NV);
const vY = new Float32Array(NV);
const vZ = new Float32Array(NV);
const vU = new Float32Array(NV);

const rArr = new Float32Array(RINGS + 1);
for (let i = 0; i <= RINGS; i++) rArr[i] = i / RINGS;

const cosT = new Float32Array(SEGS);
const sinT = new Float32Array(SEGS);
for (let j = 0; j < SEGS; j++) {
  const a = j / SEGS * TAU;
  cosT[j] = Math.cos(a);
  sinT[j] = Math.sin(a);
}

/* 当前模式 */
let modeIdx = 0;
let modeM   = 0;
let modeN   = 1;
let kJ      = 2.4048;
let omega   = 2.0;         // 角频率
let phase   = 0;           // 累积相位
let normF   = 1;

const radB = new Float32Array(RINGS + 1);
const cosM = new Float32Array(SEGS);

function applyMode(idx) {
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;

  const md = MODES[modeIdx];
  modeM = md.m;
  modeN = md.n;
  kJ    = md.j;

  /* 径向基函数 J_m(k r) */
  for (let i = 0; i <= RINGS; i++) {
    radB[i] = besselJ(modeM, kJ * rArr[i]);
  }

  /* 角向因子 cos(mθ) */
  for (let j = 0; j < SEGS; j++) {
    cosM[j] = Math.cos(modeM * j / SEGS * TAU);
  }

  /* 归一化 */
  let mx = 0;
  for (let i = 0; i <= RINGS; i++) {
    const a = Math.abs(radB[i]);
    if (a > mx) mx = a;
  }
  normF = (mx > 1e-6) ? 1 / mx : 1;

  /* 角频率 ∝ 波数（高阶模式振动更快） */
  omega = 0.62 * kJ + 0.65;

  updateHUD();
  updateTone();
}

/* ======================================================================
   5 · 背景
   ====================================================================== */
const stars = [];
(function seed() {
  let s = 24681357;
  const rnd = function () {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  };
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: rnd(), y: rnd(),
      r: rnd() * 1.4 + 0.3,
      p: rnd() * TAU,
      sp: 0.4 + rnd() * 1.6
    });
  }
})();

const BLOBS = [
  { h: 196, x: 0.24, y: 0.30, r: 0.56, sp:  0.10 },
  { h: 292, x: 0.78, y: 0.42, r: 0.50, sp: -0.085 },
  { h: 336, x: 0.52, y: 0.78, r: 0.46, sp:  0.12 },
  { h: 168, x: 0.10, y: 0.66, r: 0.40, sp: -0.07 }
];

let time = 0;

function drawBackground() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#04060e';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  const md = Math.min(W, H);

  for (let i = 0; i < BLOBS.length; i++) {
    const b  = BLOBS[i];
    const px = W * (b.x + 0.06 * Math.sin(time * b.sp * 2.1 + i * 1.7));
    const py = H * (b.y + 0.05 * Math.cos(time * b.sp * 1.7 + i * 2.3));
    const r  = md * b.r * (1 + 0.14 * Math.sin(time * 0.6 + i));
    const hue = b.h + 22 * Math.sin(time * 0.27 + i);

    const g = ctx.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0.00, 'hsla(' + hue + ',95%,58%,0.24)');
    g.addColorStop(0.45, 'hsla(' + (hue + 25) + ',95%,50%,0.08)');
    g.addColorStop(1.00, 'hsla(' + (hue + 50) + ',95%,50%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(px - r, py - r, r * 2, r * 2);
  }

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const a = 0.06 + 0.30 * Math.abs(Math.sin(time * s.sp + s.p));
    ctx.fillStyle = 'rgba(170,228,255,' + a.toFixed(3) + ')';
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
}

/* ======================================================================
   6 · 参考圆（鼓面平衡位置）
   ====================================================================== */
function drawReference() {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 0.7;
  ctx.strokeStyle = 'rgba(70,140,220,0.055)';

  /* 内部参考同心圆 */
  for (let k = 1; k <= 4; k++) {
    const rr = RAD * k / 5;
    ctx.beginPath();
    for (let j = 0; j <= 72; j++) {
      const a  = j / 72 * TAU;
      const x3 = rr * Math.cos(a);
      const z3 = rr * Math.sin(a);
      const X1 = x3 * cosY + z3 * sinY;
      const Z1 = -x3 * sinY + z3 * cosY;
      const Y2 = -Z1 * sinP;
      const Z2 = Z1 * cosP;
      const d  = CAMD + Z2;
      const f  = pScale * 2.6 / d;
      const px = CX + X1 * f;
      const py = CY - Y2 * f;
      if (j === 0) ctx.moveTo(px, py);
      else         ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  /* 径向参考线 */
  ctx.strokeStyle = 'rgba(70,140,220,0.035)';
  for (let k = 0; k < 12; k++) {
    const a  = k / 12 * TAU;
    const x3 = RAD * Math.cos(a);
    const z3 = RAD * Math.sin(a);
    const X1 = x3 * cosY + z3 * sinY;
    const Z1 = -x3 * sinY + z3 * cosY;
    const Y2 = -Z1 * sinP;
    const Z2 = Z1 * cosP;
    const d  = CAMD + Z2;
    const f  = pScale * 2.6 / d;
    ctx.beginPath();
    ctx.moveTo(CX, CY + (-0) * f);
    ctx.lineTo(CX + X1 * f, CY - Y2 * f);
    ctx.stroke();
  }
}

/* ======================================================================
   7 · 鼓面顶点计算 & 绘制
   ====================================================================== */
function computeSurface() {
  const cp = Math.cos(phase);

  for (let i = 0; i <= RINGS; i++) {
    const r  = rArr[i] * RAD;
    const rb = radB[i] * normF * cp;

    for (let j = 0; j < SEGS; j++) {
      const u  = rb * cosM[j];
      const y3 = AMP * u;
      const x3 = r * cosT[j];
      const z3 = r * sinT[j];

      const X1 =  x3 * cosY + z3 * sinY;
      const Z1 = -x3 * sinY + z3 * cosY;
      const Y2 =  y3 * cosP - Z1 * sinP;
      const Z2 =  y3 * sinP + Z1 * cosP;

      const d = CAMD + Z2;
      const f = pScale * 2.6 / (d > 0.5 ? d : 0.5);

      const k = i * SEGS + j;
      vX[k] = CX + X1 * f;
      vY[k] = CY - Y2 * f;
      vZ[k] = Z2;
      vU[k] = u;
    }
  }
}

function drawSurface() {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';

  for (let i = 0; i < RINGS; i++) {
    const rowA = i * SEGS;
    const rowB = (i + 1) * SEGS;

    for (let j = 0; j < SEGS; j++) {
      const j2 = (j + 1 === SEGS) ? 0 : j + 1;

      const ia = rowA + j;
      const ib = rowA + j2;
      const ic = rowB + j2;
      const id = rowB + j;

      const uAvg = (vU[ia] + vU[ib] + vU[ic] + vU[id]) * 0.25;
      const au   = uAvg < 0 ? -uAvg : uAvg;

      /* 深度衰减 */
      const zAvg = (vZ[ia] + vZ[ib] + vZ[ic] + vZ[id]) * 0.25;
      let dep = (zAvg + 1.4) / 2.8;
      if (dep < 0) dep = 0;
      if (dep > 1) dep = 1;
      dep = 0.55 + 0.45 * dep;

      const hue   = (185 + 150 * uAvg + 360) % 360;
      const light = 42 + 42 * au;
      const alpha = (0.045 + 0.44 * au) * dep;

      ctx.beginPath();
      ctx.moveTo(vX[ia], vY[ia]);
      ctx.lineTo(vX[ib], vY[ib]);
      ctx.lineTo(vX[ic], vY[ic]);
      ctx.lineTo(vX[id], vY[id]);
      ctx.closePath();

      ctx.fillStyle = 'hsla(' + hue + ',100%,' + light + '%,' + alpha + ')';
      ctx.fill();

      ctx.strokeStyle = 'hsla(' + hue + ',100%,' + (light + 24) + '%,' + (alpha * 0.62) + ')';
      ctx.lineWidth = 0.55;
      ctx.stroke();
    }
  }
}

/* 边界发光环 */
function drawRim() {
  ctx.globalCompositeOperation = 'lighter';

  ctx.beginPath();
  for (let j = 0; j < SEGS; j++) {
    const k = RINGS * SEGS + j;
    if (j === 0) ctx.moveTo(vX[k], vY[k]);
    else         ctx.lineTo(vX[k], vY[k]);
  }
  ctx.closePath();

  const pulse = 0.62 + 0.38 * Math.sin(time * 2.0);

  ctx.strokeStyle = 'rgba(80,200,255,' + (0.10 * pulse) + ')';
  ctx.lineWidth = 12;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(140,180,255,' + (0.28 * pulse) + ')';
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(230,252,255,' + (0.78 * pulse) + ')';
  ctx.lineWidth = 1.4;
  ctx.stroke();
}

/* ======================================================================
   8 · 主循环
   ====================================================================== */
let last = 0;

function loop(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0)    dt = 0;

  time += dt;

  /* 缓慢自转 */
  yaw += dt * 0.10;
  cosY = Math.cos(yaw);
  sinY = Math.sin(yaw);

  /* 相位累积（模式切换时相位连续） */
  phase += omega * dt;
  if (phase > 1e6) phase -= 1e6;

  computeSurface();

  drawBackground();
  drawReference();
  drawSurface();
  drawRim();

  requestAnimationFrame(loop);
}

/* ======================================================================
   9 · HUD
   ====================================================================== */
const elMode = document.getElementById('r-mode');
const elJ    = document.getElementById('r-j');
const elRad  = document.getElementById('r-rad');
const elAng  = document.getElementById('r-ang');
const elPet  = document.getElementById('r-pet');
const elVal  = document.getElementById('modeval');

function updateHUD() {
  elMode.textContent = '(' + modeM + ', ' + modeN + ')';
  elJ.textContent    = kJ.toFixed(4);
  elRad.textContent  = (modeN - 1);
  elAng.textContent  = modeM;
  elPet.textContent  = (modeM === 0) ? 1 : (2 * modeM);
  elVal.textContent  = '(m,n) = (' + modeM + ',' + modeN + ')';
}

/* ======================================================================
   10 · UI 交互
   ====================================================================== */
const slider = document.getElementById('mode');

slider.addEventListener('input', function () {
  applyMode(parseInt(slider.value, 10));
  playSwitch();
});

/* ======================================================================
   11 · 科技感音效（Web Audio）
   ====================================================================== */
let actx = null;
let masterGain = null;
let echoDelay = null;
let oscA = null, oscB = null, oscC = null;
let toneGain = null;
let toneFilter = null;
let noiseGainNode = null;
let lastWhoosh = 0;

function initAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  actx = new AC();

  /* ---- 主输出 ---- */
  masterGain = actx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(actx.destination);
  masterGain.gain.exponentialRampToValueAtTime(0.34, actx.currentTime + 3.5);

  /* ---- 太空回声 ---- */
  echoDelay = actx.createDelay(1.0);
  echoDelay.delayTime.value = 0.44;
  const fb   = actx.createGain(); fb.gain.value = 0.42;
  const dOut = actx.createGain(); dOut.gain.value = 0.30;
  echoDelay.connect(fb); fb.connect(echoDelay);
  echoDelay.connect(dOut); dOut.connect(masterGain);

  /* ---- 膜振动的嗡鸣声（频率随模式变化） ---- */
  toneFilter = actx.createBiquadFilter();
  toneFilter.type = 'lowpass';
  toneFilter.frequency.value = 1400;
  toneFilter.Q.value = 3.2;

  toneGain = actx.createGain();
  toneGain.gain.value = 0.0001;
  toneFilter.connect(toneGain);
  toneGain.connect(masterGain);
  toneGain.connect(echoDelay);

  /* 基频 */
  oscA = actx.createOscillator();
  oscA.type = 'sine';
  oscA.frequency.value = 65;
  const gA = actx.createGain(); gA.gain.value = 0.62;
  oscA.connect(gA); gA.connect(toneFilter);
  oscA.start();

  /* 五度 */
  oscB = actx.createOscillator();
  oscB.type = 'triangle';
  oscB.frequency.value = 97.5;
  const gB = actx.createGain(); gB.gain.value = 0.22;
  oscB.connect(gB); gB.connect(toneFilter);
  oscB.start();

  /* 低八度 */
  oscC = actx.createOscillator();
  oscC.type = 'sine';
  oscC.frequency.value = 32.5;
  const gC = actx.createGain(); gC.gain.value = 0.55;
  oscC.connect(gC); gC.connect(toneFilter);
  oscC.start();

  toneGain.gain.exponentialRampToValueAtTime(0.16, actx.currentTime + 4);

  /* 滤波器慢扫 */
  const lfo = actx.createOscillator();
  lfo.frequency.value = 0.055;
  const lfoG = actx.createGain();
  lfoG.gain.value = 420;
  lfo.connect(lfoG); lfoG.connect(toneFilter.frequency);
  lfo.start();

  /* ---- 空气噪声层 ---- */
  const bufLen = Math.floor(actx.sampleRate * 2);
  const nbuf   = actx.createBuffer(1, bufLen, actx.sampleRate);
  const nd     = nbuf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;

  const noise = actx.createBufferSource();
  noise.buffer = nbuf;
  noise.loop = true;

  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 880;
  nf.Q.value = 0.9;

  noiseGainNode = actx.createGain();
  noiseGainNode.gain.value = 0.013;

  noise.connect(nf); nf.connect(noiseGainNode); noiseGainNode.connect(masterGain);
  noise.start();

  const nLfo = actx.createOscillator();
  nLfo.frequency.value = 0.068;
  const nLfoG = actx.createGain();
  nLfoG.gain.value = 520;
  nLfo.connect(nLfoG); nLfoG.connect(nf.frequency);
  nLfo.start();

  /* ---- 周期性“敲击”共鸣 ---- */
  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    const t = actx.currentTime;
    const base = 65 * (kJ / 2.4048);

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(base * 2.0, t);
    o.frequency.exponentialRampToValueAtTime(base * 0.9, t + 1.4);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 2.0);
  }, 3600);

  /* ---- 粒子琶音 ---- */
  const scale = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];
  let step = 0;

  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    if (Math.random() > 0.55) return;

    const t = actx.currentTime;
    const deg = scale[(step * 3 + Math.floor(Math.random() * 3)) % scale.length];
    const f = 320 * Math.pow(2, deg / 12);
    step++;

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 1.8);
  }, 480);

  /* ---- 深空脉冲 ---- */
  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    const t = actx.currentTime;

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(36, t + 2.2);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.17, t + 0.24);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 2.5);
  }, 7600);

  updateTone();
}

/* 模式改变时平滑更新音高 */
function updateTone() {
  if (!actx || !oscA || !oscB || !oscC) return;

  const t = actx.currentTime;
  const base = 65 * (kJ / 2.4048);

  oscA.frequency.setTargetAtTime(base,        t, 0.14);
  oscB.frequency.setTargetAtTime(base * 1.5,  t, 0.14);
  oscC.frequency.setTargetAtTime(base * 0.5,  t, 0.14);
}

/* 切换模式：高频扫掠音 */
function playSwitch() {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  if (t - lastWhoosh < 0.08) return;
  lastWhoosh = t;

  const base = 65 * (kJ / 2.4048);

  const o = actx.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(base * 6.2, t);
  o.frequency.exponentialRampToValueAtTime(base * 1.6, t + 0.34);

  const f = actx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(2600, t);
  f.frequency.exponentialRampToValueAtTime(700, t + 0.34);
  f.Q.value = 5;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.075, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);

  o.connect(f); f.connect(g);
  g.connect(masterGain);
  g.connect(echoDelay);

  o.start(t);
  o.stop(t + 0.46);
}

/* ======================================================================
   12 · 启动
   ====================================================================== */
const startEl = document.getElementById('start');
let started = false;

function startAll() {
  if (started) return;
  started = true;
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  startEl.classList.add('hide');
}

window.addEventListener('pointerdown', startAll, { passive: true });
window.addEventListener('keydown', startAll);
window.addEventListener('touchstart', startAll, { passive: true });

/* ======================================================================
   13 · 启动
   ====================================================================== */
applyMode(0);
resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
