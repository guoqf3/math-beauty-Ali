<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>拉普拉斯变换 · s 域映射</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#03060d;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:26px 34px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,255,.36);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 38%,#c090ff 72%,#ffd080 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(10px,1.3vw,13px);
    letter-spacing:.12em;
    color:rgba(200,220,255,.58);
  }
  #title .formula .hl1{color:#5ee0ff;}
  #title .formula .hl2{color:#c090ff;}
  #title .formula .hl3{color:#ffd080;}

  #stats{
    position:absolute;top:0;right:0;
    padding:26px 34px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.10em;line-height:2.0;
    color:rgba(170,200,250,.34);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:6px;
  }
  #stats .k{color:rgba(190,205,255,.52);}
  #stats .v{color:rgba(255,215,150,.92);font-weight:600;}

  #panel{
    position:absolute;bottom:0;left:0;
    padding:0 34px 28px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #panel .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:10px;
  }
  .func-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:5px;
    font-size:10.5px;letter-spacing:.06em;
    color:rgba(200,215,250,.42);
    transition:color .5s, opacity .5s;
    opacity:.32;
  }
  .func-row.on{
    color:rgba(230,240,255,.95);
    opacity:1;
  }
  .func-row .sw{
    width:16px;height:2.5px;border-radius:2px;
    transition:box-shadow .5s;
  }
  .func-row.on .sw{
    box-shadow:0 0 10px currentColor;
  }
  .func-row .nm{
    min-width:84px;
  }
  .func-row .F{
    color:rgba(255,220,170,.88);
    font-weight:600;
  }

  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 34px 28px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:14px 16px;}
    #title .formula{font-size:10px;}
    #stats{padding:14px 16px;font-size:8.5px;}
    #panel{padding:0 16px 16px;}
    .func-row{font-size:9px;}
    .func-row .nm{min-width:64px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">LAPLACE TRANSFORM · S-DOMAIN</div>
    <h1>拉普拉斯变换</h1>
    <div class="formula">
      <span class="hl1">L</span>{f(t)} = 
      <span class="hl2">∫₀^∞</span> f(t) e<sup><span class="hl3">−st</span></sup> dt
    </div>
  </div>

  <div id="stats">
    <span class="lab">LIVE STATE</span>
    <div><span class="k">函数 </span><span class="v" id="funcName">指数衰减</span></div>
    <div><span class="k">衰减率 a </span><span class="v" id="paramA">1.00</span></div>
    <div><span class="k">极点 </span><span class="v" id="poleVal">s = −1</span></div>
    <div><span class="k">收敛域 </span><span class="v" id="rocVal">Re(s) &gt; −1</span></div>
  </div>

  <div id="panel">
    <span class="lab">COMMON TRANSFORM PAIRS</span>
    <div class="func-row" id="fr-0">
      <span class="sw" style="background:#5ee0ff"></span>
      <span class="nm">e^(−at)</span>
      <span class="F">1/(s+a)</span>
    </div>
    <div class="func-row" id="fr-1">
      <span class="sw" style="background:#7ab8ff"></span>
      <span class="nm">sin(ωt)</span>
      <span class="F">ω/(s²+ω²)</span>
    </div>
    <div class="func-row" id="fr-2">
      <span class="sw" style="background:#a890ff"></span>
      <span class="nm">cos(ωt)</span>
      <span class="F">s/(s²+ω²)</span>
    </div>
    <div class="func-row" id="fr-3">
      <span class="sw" style="background:#e090d0"></span>
      <span class="nm">t·e^(−at)</span>
      <span class="F">1/(s+a)²</span>
    </div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>传送音 · 空间转换音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

/* =========================================================
   布局
   ========================================================= */
let tdX = 0, tdY = 0, tdW = 0, tdH = 0;
let spX = 0, spY = 0, spW = 0, spH = 0;
let spCX = 0, spCY = 0, spScale = 60;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const padX = Math.max(26, W * 0.052);
  const padTop = 92;
  const padBot = 84;
  const availH = H - padTop - padBot;

  tdX = padX;
  tdW = W - padX * 2;
  tdH = availH * 0.42;
  tdY = padTop;

  spX = padX;
  spW = W - padX * 2;
  spH = availH * 0.48;
  spY = tdY + tdH + availH * 0.10;

  spCX = spX + spW * 0.5;
  spCY = spY + spH * 0.5;
  spScale = Math.min(spW, spH) * 0.42 / 3;
}
window.addEventListener('resize', resize);

/* =========================================================
   函数库
   ========================================================= */
const FUNCS = [
  {
    name: '指数衰减',
    label: 'e^(−at)',
    color: '#5ee0ff',
    hue: 195,
    a: 1.0,
    f: function(t, p){ return Math.exp(-p * t); },
    pole: function(p){ return { re: -p, im: 0 }; },
    roc: function(p){ return 'Re(s) > ' + (-p).toFixed(2); },
    sExpr: function(p){ return '1 / (s + ' + p.toFixed(1) + ')'; },
    /* s 域幅度（沿虚轴 ω 取值）*/
    mag: function(sigma, omega, p){
      const sr = sigma + p;
      const si = omega;
      const d = sr * sr + si * si;
      return 1 / Math.sqrt(Math.max(1e-6, d));
    },
    phase: function(sigma, omega, p){
      return -Math.atan2(omega, sigma + p);
    }
  },
  {
    name: '正弦',
    label: 'sin(ωt)',
    color: '#7ab8ff',
    hue: 220,
    a: 1.4,
    f: function(t, p){ return Math.sin(p * t); },
    pole: function(p){
      return [{ re: 0, im: p }, { re: 0, im: -p }];
    },
    roc: function(){ return 'Re(s) > 0'; },
    sExpr: function(p){ return 'ω / (s² + ω²)'; },
    mag: function(sigma, omega, p){
      const a = sigma * sigma - omega * omega + p * p;
      const b = 2 * sigma * omega;
      const d = a * a + b * b;
      return p / Math.sqrt(Math.max(1e-6, d));
    },
    phase: function(sigma, omega, p){
      const a = sigma * sigma - omega * omega + p * p;
      const b = 2 * sigma * omega;
      return -Math.atan2(b, a);
    }
  },
  {
    name: '余弦',
    label: 'cos(ωt)',
    color: '#a890ff',
    hue: 262,
    a: 1.4,
    f: function(t, p){ return Math.cos(p * t); },
    pole: function(p){
      return [{ re: 0, im: p }, { re: 0, im: -p }];
    },
    roc: function(){ return 'Re(s) > 0'; },
    sExpr: function(p){ return 's / (s² + ω²)'; },
    mag: function(sigma, omega, p){
      const a = sigma * sigma - omega * omega + p * p;
      const b = 2 * sigma * omega;
      const d = a * a + b * b;
      return Math.sqrt(Math.max(1e-6, sigma * sigma + omega * omega)) /
             Math.sqrt(Math.max(1e-6, d));
    },
    phase: function(sigma, omega, p){
      const a = sigma * sigma - omega * omega + p * p;
      const b = 2 * sigma * omega;
      return Math.atan2(omega, sigma) - Math.atan2(b, a);
    }
  },
  {
    name: '斜坡指数',
    label: 't·e^(−at)',
    color: '#e090d0',
    hue: 320,
    a: 1.0,
    f: function(t, p){ return t * Math.exp(-p * t); },
    pole: function(p){ return { re: -p, im: 0, order: 2 }; },
    roc: function(p){ return 'Re(s) > ' + (-p).toFixed(2); },
    sExpr: function(p){ return '1 / (s + ' + p.toFixed(1) + ')²'; },
    mag: function(sigma, omega, p){
      const sr = sigma + p;
      const si = omega;
      const d = sr * sr + si * si;
      return 1 / Math.max(1e-6, d);
    },
    phase: function(sigma, omega, p){
      return -2 * Math.atan2(omega, sigma + p);
    }
  }
];

let funcIdx = 0;
let F = FUNCS[0];

/* 参数 a 的可视化调制 */
let paramPhase = 0;

/* =========================================================
   动画时间轴
   ========================================================= */
const CYCLE = 12;
let cycleT = 0;

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let teleportOsc = null;
let teleportGain = null;
let teleportFilter = null;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.44, ac.currentTime, 1.8);

  /* 传送音底噪：带通噪声 + 缓慢上升/下降 */
  const bufLen = ac.sampleRate * 4;
  const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  teleportFilter = ac.createBiquadFilter();
  teleportFilter.type = 'bandpass';
  teleportFilter.frequency.value = 800;
  teleportFilter.Q.value = 2.4;

  teleportGain = ac.createGain();
  teleportGain.gain.value = 0.014;

  src.connect(teleportFilter);
  teleportFilter.connect(teleportGain);
  teleportGain.connect(master);
  src.start();

  /* 传送音：上扫正弦 */
  teleportOsc = ac.createOscillator();
  teleportOsc.type = 'sawtooth';
  teleportOsc.frequency.value = 130;

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 640;
  lp.Q.value = 4.2;

  const g = ac.createGain();
  g.gain.value = 0;

  teleportOsc.connect(lp);
  lp.connect(g);
  g.connect(master);
  teleportOsc.start();

  /* 缓慢摆动的 LFO */
  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.11;
  const lfoG = ac.createGain();
  lfoG.gain.value = 48;
  lfo.connect(lfoG);
  lfoG.connect(teleportOsc.frequency);
  lfo.start();

  teleportGain.gainNode = g;

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* 传送脉冲：场景切换时的上扫音 */
function playWhoosh(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.exponentialRampToValueAtTime(1400, now + 0.45);
  osc.frequency.exponentialRampToValueAtTime(260, now + 0.85);

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(400, now);
  bp.frequency.exponentialRampToValueAtTime(3200, now + 0.45);
  bp.frequency.exponentialRampToValueAtTime(700, now + 0.85);
  bp.Q.value = 3.2;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.055, now + 0.10);
  g.gain.exponentialRampToValueAtTime(0.0003, now + 0.95);

  osc.connect(bp);
  bp.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 1.0);
}

/* 空间转换音：和弦上行 */
function playSpatialChord(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.08;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.038, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.6);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.7);

    /* 泛音 */
    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = notes[i] * 2;

    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.03);
    g2.gain.linearRampToValueAtTime(0.014, t0 + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);

    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.03);
    osc2.stop(t0 + 1.3);
  }
}

/* 更新传送底噪的强度与音高 */
function updateTeleportAudio(dt){
  if (!audioReady || !ac || ac.state !== 'running') return;
  if (!teleportGain) return;
  const now = ac.currentTime;

  /* 场景变化的强度来自 cycleT 的阶段 */
  const phase = (cycleT / CYCLE);
  let intensity = 0;

  /* 在 0.15 – 0.45 和 0.55 – 0.85 两个区间能量高 */
  if (phase > 0.12 && phase < 0.48){
    intensity = Math.sin(((phase - 0.12) / 0.36) * Math.PI);
  } else if (phase > 0.55 && phase < 0.92){
    intensity = Math.sin(((phase - 0.55) / 0.37) * Math.PI);
  }

  teleportGain.gain.setTargetAtTime(0.010 + intensity * 0.028, now, 0.15);
  teleportFilter.frequency.setTargetAtTime(600 + intensity * 2600, now, 0.18);
  if (teleportGain.gainNode){
    teleportGain.gainNode.gain.setTargetAtTime(intensity * 0.018, now, 0.15);
  }
}

/* =========================================================
   坐标转换
   ========================================================= */
function tToScreen(t){
  return {
    px: tdX + (t / 5) * tdW,
    py: 0
  };
}

function sToScreen(sr, si){
  return {
    px: spCX + sr * spScale,
    py: spCY - si * spScale
  };
}

/* =========================================================
   绘制：时域
   ========================================================= */
function drawTimeDomain(t){
  /* 面板 */
  ctx.fillStyle = 'rgba(5, 10, 22, 0.58)';
  roundRect(tdX, tdY, tdW, tdH, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 140, 220, 0.14)';
  ctx.lineWidth = 1;
  roundRect(tdX, tdY, tdW, tdH, 12);
  ctx.stroke();

  const centerY = tdY + tdH * 0.5;
  const ampScale = tdH * 0.40;

  /* 网格 —— 时间刻度 */
  ctx.strokeStyle = 'rgba(80, 130, 210, 0.075)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++){
    const x = tdX + (i / 5) * tdW;
    ctx.beginPath();
    ctx.moveTo(x, tdY + 6);
    ctx.lineTo(x, tdY + tdH - 6);
    ctx.stroke();
  }

  /* 水平参考线 */
  for (let i = -2; i <= 2; i++){
    const y = centerY - i * ampScale * 0.5;
    if (y < tdY + 4 || y > tdY + tdH - 4) continue;

    ctx.beginPath();
    ctx.moveTo(tdX + 4, y);
    ctx.lineTo(tdX + tdW - 4, y);
    ctx.strokeStyle = i === 0
      ? 'rgba(100, 160, 240, 0.28)'
      : 'rgba(80, 130, 210, 0.070)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* 函数曲线（随时间滚动扫过） */
  const N = 460;
  const aParam = F.a;

  ctx.beginPath();
  for (let i = 0; i <= N; i++){
    const tNorm = i / N;
    const tt = tNorm * 5;
    const val = F.f(tt, aParam);
    const py = centerY - val * ampScale;

    const px = tdX + tNorm * tdW;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  /* 外发光 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'hsla(' + F.hue + ', 100%, 68%, 0.18)';
  ctx.lineWidth = 10;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.strokeStyle = 'hsla(' + F.hue + ', 100%, 74%, 0.10)';
  ctx.lineWidth = 18;
  ctx.stroke();

  /* 主体 */
  ctx.globalCompositeOperation = 'source-over';
  const grad = ctx.createLinearGradient(tdX, 0, tdX + tdW, 0);
  grad.addColorStop(0.00, 'hsla(' + F.hue + ', 100%, 82%, 0.96)');
  grad.addColorStop(0.55, 'hsla(' + (F.hue + 30) + ', 100%, 74%, 0.94)');
  grad.addColorStop(1.00, 'hsla(' + (F.hue + 60) + ', 92%, 68%, 0.88)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.6;
  ctx.stroke();

  /* t 轴刻度标签 */
  ctx.font = '400 9.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(150, 185, 240, 0.42)';
  for (let i = 0; i <= 5; i++){
    const x = tdX + (i / 5) * tdW;
    ctx.fillText(i.toString(), x, tdY + tdH - 18);
  }

  /* 面板标题 */
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(140, 190, 250, 0.46)';
  ctx.font = '500 10px "SF Mono", Consolas, Monaco, monospace';
  ctx.fillText('时域 · f(t)', tdX + 14, tdY + 12);

  /* 函数名 */
  ctx.textAlign = 'right';
  ctx.font = '600 14px "SF Mono", Consolas, Monaco, monospace';
  ctx.fillStyle = 'hsla(' + F.hue + ', 100%, 82%, 0.92)';
  ctx.fillText(F.label, tdX + tdW - 14, tdY + 12);
}

/* =========================================================
   绘制：s 域复平面
   ========================================================= */
function drawSDomain(t){
  /* 面板 */
  ctx.fillStyle = 'rgba(5, 10, 22, 0.58)';
  roundRect(spX, spY, spW, spH, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 140, 220, 0.14)';
  ctx.lineWidth = 1;
  roundRect(spX, spY, spW, spH, 12);
  ctx.stroke();

  /* 网格 */
  ctx.strokeStyle = 'rgba(80, 130, 210, 0.070)';
  ctx.lineWidth = 1;
  for (let i = -3; i <= 3; i++){
    const p = sToScreen(i, 0);
    if (p.px < spX + 4 || p.px > spX + spW - 4) continue;
    ctx.beginPath();
    ctx.moveTo(p.px, spY + 4);
    ctx.lineTo(p.px, spY + spH - 4);
    ctx.stroke();
  }
  for (let i = -3; i <= 3; i++){
    const p = sToScreen(0, i);
    if (p.py < spY + 4 || p.py > spY + spH - 4) continue;
    ctx.beginPath();
    ctx.moveTo(spX + 4, p.py);
    ctx.lineTo(spX + spW - 4, p.py);
    ctx.stroke();
  }

  /* 坐标轴 */
  ctx.strokeStyle = 'rgba(100, 160, 240, 0.32)';
  ctx.lineWidth = 1.2;
  const origin = sToScreen(0, 0);

  ctx.beginPath();
  ctx.moveTo(spX + 6, origin.py);
  ctx.lineTo(spX + spW - 6, origin.py);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(origin.px, spY + 6);
  ctx.lineTo(origin.px, spY + spH - 6);
  ctx.stroke();

  /* 轴标签 */
  ctx.font = '400 9px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(150, 185, 240, 0.44)';
  ctx.fillText('σ', spX + spW - 18, origin.py - 10);
  ctx.fillText('jω', origin.px + 10, spY + 12);

  /* 刻度 */
  ctx.font = '400 8.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(150, 185, 240, 0.34)';
  for (let i = -3; i <= 3; i++){
    if (i === 0) continue;
    const p = sToScreen(i, 0);
    if (p.px < spX + 10 || p.px > spX + spW - 10) continue;
    ctx.fillText(i.toString(), p.px, origin.py + 5);
  }

  /* 收敛域（Re(s) > −a）：虚线竖线 + 右侧淡色区域 */
  const aVal = F.a;
  const rocX = sToScreen(-aVal, 0).px;

  if (F.pole && (F.name !== '正弦' && F.name !== '余弦')){
    /* 单极点函数 */
    /* 收敛域淡色填充 */
    if (rocX < spX + spW - 4){
      const g = ctx.createLinearGradient(rocX, 0, spX + spW, 0);
      g.addColorStop(0.00, 'rgba(255, 180, 100, 0.055)');
      g.addColorStop(1.00, 'rgba(255, 180, 100, 0.012)');
      ctx.fillStyle = g;
      ctx.fillRect(rocX, spY + 4, spX + spW - rocX - 4, spH - 8);
    }

    /* 分界线 */
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = 'rgba(255, 180, 100, 0.42)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(rocX, spY + 4);
    ctx.lineTo(rocX, spY + spH - 4);
    ctx.stroke();
    ctx.setLineDash([]);

    /* ROC 文字 */
    ctx.font = '500 9.5px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255, 200, 140, 0.68)';
    ctx.fillText('收敛域 ROC', rocX + 8, spY + 12);
  }

  /* 极点 */
  const poles = F.pole(aVal);
  const poleArr = Array.isArray(poles) ? poles : [poles];

  for (let k = 0; k < poleArr.length; k++){
    const pole = poleArr[k];
    const p = sToScreen(pole.re, pole.im);
    const order = pole.order || 1;

    /* 光晕 */
    ctx.globalCompositeOperation = 'lighter';
    const pulse = 1 + 0.24 * Math.sin(t * 2.8 + k * 1.7);
    const gr = 22 * pulse;
    const g = ctx.createRadialGradient(p.px, p.py, 0, p.px, p.py, gr);
    g.addColorStop(0.00, 'hsla(' + F.hue + ', 100%, 78%, 0.65)');
    g.addColorStop(0.42, 'hsla(' + F.hue + ', 100%, 62%, 0.22)');
    g.addColorStop(1.00, 'hsla(' + F.hue + ', 100%, 52%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.px, p.py, gr, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    /* 极点叉号 */
    const s = 7;
    ctx.strokeStyle = 'hsla(' + F.hue + ', 100%, 86%, 0.96)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.px - s, p.py - s);
    ctx.lineTo(p.px + s, p.py + s);
    ctx.moveTo(p.px + s, p.py - s);
    ctx.lineTo(p.px - s, p.py + s);
    ctx.stroke();

    /* 二阶极点：外圈 */
    if (order === 2){
      ctx.beginPath();
      ctx.arc(p.px, p.py, 13, 0, TAU);
      ctx.strokeStyle = 'hsla(' + F.hue + ', 100%, 76%, 0.62)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    /* 极点标签 */
    ctx.font = '500 9.5px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'hsla(' + F.hue + ', 100%, 88%, 0.92)';
    const label = 's = ' + pole.re.toFixed(2) +
                  (pole.im !== 0
                    ? (pole.im > 0 ? ' + ' : ' − ') + Math.abs(pole.im).toFixed(2) + 'j'
                    : '');
    ctx.fillText(label, p.px + 14, p.py - 14);
  }

  /* 幅度场：用半透明热图表示 |F(s)| 在复平面上的分布 */
  drawMagnitudeField(t);

  /* 面板标题 */
  ctx.font = '500 10px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(140, 190, 250, 0.46)';
  ctx.fillText('s 域 · F(s)', spX + 14, spY + 12);

  ctx.textAlign = 'right';
  ctx.font = '600 14px "SF Mono", Consolas, Monaco, monospace';
  ctx.fillStyle = 'hsla(' + F.hue + ', 100%, 82%, 0.92)';
  ctx.fillText(F.sExpr(aVal), spX + spW - 14, spY + 12);
}

/* 幅度场热图 */
function drawMagnitudeField(t){
  const CELL = 10;
  const cols = Math.ceil(spW / CELL);
  const rows = Math.ceil(spH / CELL);
  const aVal = F.a;

  ctx.globalCompositeOperation = 'lighter';

  for (let j = 0; j < rows; j++){
    for (let i = 0; i < cols; i++){
      const px = spX + i * CELL + CELL * 0.5;
      const py = spY + j * CELL + CELL * 0.5;

      if (px < spX + 4 || px > spX + spW - 4) continue;
      if (py < spY + 4 || py > spY + spH - 4) continue;

      const sigma = (px - spCX) / spScale;
      const omega = (spCY - py) / spScale;

      if (Math.abs(sigma) > 4 || Math.abs(omega) > 4) continue;

      const mag = F.mag(sigma, omega, aVal);

      /* 归一化：幅度以对数方式显示 */
      const t2 = Math.min(1, Math.pow(mag, 0.55));
      if (t2 < 0.02) continue;

      ctx.fillStyle = 'hsla(' + F.hue + ', 90%, 62%, ' + (t2 * 0.14) + ')';
      ctx.fillRect(px - CELL * 0.5, py - CELL * 0.5, CELL, CELL);
    }
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：变换动画（曲线从时域流向 s 域）
   ========================================================= */
const particles = [];

function spawnTransformParticles(){
  for (let i = 0; i < 3; i++){
    const t0 = Math.random() * 5;
    const val = F.f(t0, F.a);
    const s0 = tToScreen(t0);
    const s0y = tdY + tdH * 0.5 - val * tdH * 0.40;

    /* 目标：s 域上的极点或虚轴采样点 */
    let targetSX, targetSY;

    const poles = F.pole(F.a);
    const poleArr = Array.isArray(poles) ? poles : [poles];
    const pole = poleArr[Math.floor(Math.random() * poleArr.length)];
    const ps = sToScreen(pole.re, pole.im);

    targetSX = ps.px + (Math.random() - 0.5) * 30;
    targetSY = ps.py + (Math.random() - 0.5) * 30;

    particles.push({
      x: s0.px, y: s0y,
      tx: targetSX, ty: targetSY,
      p: 0,
      speed: 0.55 + Math.random() * 0.45,
      hue: F.hue + (Math.random() - 0.5) * 40,
      size: 1.4 + Math.random() * 1.4,
      curve: (Math.random() - 0.5) * 0.42
    });
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.p += p.speed * dt;
    if (p.p > 1){
      particles.splice(i, 1);
      continue;
    }

    /* 贝塞尔曲线路径 */
    const u = p.p;
    const mx = (p.x + p.tx) * 0.5;
    const my = (p.y + p.ty) * 0.5 + p.curve * (p.ty - p.y) * 0.6;

    const w0 = (1 - u) * (1 - u);
    const w1 = 2 * (1 - u) * u;
    const w2 = u * u;

    p.cx = w0 * p.x + w1 * mx + w2 * p.tx;
    p.cy = w0 * p.y + w1 * my + w2 * p.ty;
  }
}

function drawParticles(){
  if (particles.length === 0) return;

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    if (p.cx === undefined) continue;

    const u = p.p;
    const alpha = u < 0.5 ? u * 1.6 : (1 - u) * 1.6;
    const g = ctx.createRadialGradient(
      p.cx, p.cy, 0,
      p.cx, p.cy, p.size * 4
    );
    g.addColorStop(0.00, 'hsla(' + p.hue + ', 100%, 88%, ' + alpha + ')');
    g.addColorStop(0.42, 'hsla(' + p.hue + ', 100%, 70%, ' + (alpha * 0.42) + ')');
    g.addColorStop(1.00, 'hsla(' + p.hue + ', 100%, 60%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.cx, p.cy, p.size * 4, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   连接线：从时域面板底部到 s 域面板顶部
   ========================================================= */
function drawBridge(t){
  const leftX = tdX + tdW * 0.5;
  const y0 = tdY + tdH;
  const y1 = spY;

  const grad = ctx.createLinearGradient(leftX, y0, leftX, y1);
  grad.addColorStop(0.00, 'hsla(' + F.hue + ', 100%, 72%, 0.05)');
  grad.addColorStop(0.50, 'hsla(' + (F.hue + 40) + ', 100%, 72%, 0.22)');
  grad.addColorStop(1.00, 'hsla(' + F.hue + ', 100%, 72%, 0.05)');

  ctx.strokeStyle = grad;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(leftX - 60, y0 + 4);
  ctx.lineTo(leftX + 60, y1 - 4);
  ctx.stroke();

  /* 中间连接光点 */
  const midY = (y0 + y1) * 0.5;
  const pulse = 1 + 0.5 * Math.sin(t * 3);

  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(leftX, midY, 0, leftX, midY, 22 * pulse);
  g.addColorStop(0.00, 'hsla(' + F.hue + ', 100%, 82%, 0.42)');
  g.addColorStop(0.55, 'hsla(' + F.hue + ', 100%, 66%, 0.14)');
  g.addColorStop(1.00, 'hsla(' + F.hue + ', 100%, 56%, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(leftX, midY, 22 * pulse, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* "L" 符号 */
  ctx.font = '200 22px "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'hsla(' + F.hue + ', 100%, 80%, 0.52)';
  ctx.fillText('L', leftX, midY);
}

/* =========================================================
   工具函数
   ========================================================= */
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;
let spawnTimer = 0;
let whooshTimer = 0;
let chordTimer = 0;
let lastStage = -1;
let uiTick = 0;

function update(dt){
  cycleT += dt;
  if (cycleT >= CYCLE){
    cycleT -= CYCLE;
  }

  paramPhase += dt;

  /* 生成变换粒子 */
  spawnTimer += dt;
  if (spawnTimer > 0.06){
    spawnTimer = 0;
    spawnTransformParticles();
  }

  updateParticles(dt);
  updateTeleportAudio(dt);

  /* 场景阶段：0 - 1 - 2 */
  const stage = Math.floor((cycleT / CYCLE) * 3);
  if (stage !== lastStage){
    lastStage = stage;

    if (stage === 1){
      playWhoosh();
    } else if (stage === 2){
      playSpatialChord();
    }
  }

  /* 每周期切换函数 */
  if (cycleT < dt * 2){
    /* 刚进入新周期 */
  }
}

/* =========================================================
   HUD 更新
   ========================================================= */
function updateUI(){
  uiTick++;
  if (uiTick % 6 !== 0) return;

  const fnEl = document.getElementById('funcName');
  const paEl = document.getElementById('paramA');
  const poEl = document.getElementById('poleVal');
  const rocEl = document.getElementById('rocVal');

  if (fnEl) fnEl.textContent = F.name;
  if (paEl) paEl.textContent = F.a.toFixed(2);

  const poles = F.pole(F.a);
  const poleArr = Array.isArray(poles) ? poles : [poles];

  if (poEl){
    if (poleArr.length === 1){
      const p = poleArr[0];
      poEl.textContent = 's = ' + p.re.toFixed(2) +
        (p.im ? (p.im > 0 ? ' ± ' : ' ') + Math.abs(p.im).toFixed(2) + 'j' : '');
    } else {
      poEl.textContent = 's = ±' + Math.abs(poleArr[0].im).toFixed(2) + 'j';
    }
  }

  if (rocEl) rocEl.textContent = F.roc(F.a);

  /* 更新函数列表的高亮 */
  for (let i = 0; i < FUNCS.length; i++){
    const el = document.getElementById('fr-' + i);
    if (el) el.classList.toggle('on', i === funcIdx);
  }
}

/* =========================================================
   切换函数
   ========================================================= */
function switchFunc(idx){
  funcIdx = ((idx % FUNCS.length) + FUNCS.length) % FUNCS.length;
  F = FUNCS[funcIdx];
  cycleT = 0;
  lastStage = -1;
  particles.length = 0;
}

/* =========================================================
   主循环
   ========================================================= */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  update(dt);

  /* 背景 */
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.42, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  bg.addColorStop(0.00, '#0a1226');
  bg.addColorStop(0.42, '#060c1a');
  bg.addColorStop(1.00, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawBridge(t);
  drawTimeDomain(t);
  drawSDomain(t);
  drawParticles();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.85
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.90)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  updateUI();
}

/* =========================================================
   交互
   ========================================================= */
window.addEventListener('pointerdown', function(){
  initAudio();
  /* 点击切换函数 */
  switchFunc(funcIdx + 1);
  playWhoosh();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    switchFunc(funcIdx + 1);
    playWhoosh();
  } else if (e.key >= '1' && e.key <= '4'){
    initAudio();
    switchFunc(parseInt(e.key, 10) - 1);
    playWhoosh();
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    cycleT = 0;
    lastStage = -1;
    particles.length = 0;
  }
});

/* 点击函数列表切换 */
document.querySelectorAll('.func-row').forEach(function(el){
  el.style.pointerEvents = 'auto';
  el.style.cursor = 'pointer';
  el.addEventListener('click', function(e){
    e.stopPropagation();
    initAudio();
    const idx = parseInt(this.id.replace('fr-', ''), 10);
    if (idx !== funcIdx){
      switchFunc(idx);
      playWhoosh();
    }
  });
});

/* =========================================================
   启动
   ========================================================= */
resize();
requestAnimationFrame(loop);

})();
</script>
