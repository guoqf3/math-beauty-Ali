<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>数学曲线之美 · 混合函数交织</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #080810;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', serif;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      left: 0;
      right: 0;
      text-align: center;
    }
    #title-overlay {
      top: clamp(16px, 4vh, 42px);
    }
    #title-overlay h1 {
      font-size: clamp(1.2rem, 2.8vw, 1.9rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #f2ead8;
      text-shadow: 0 0 30px rgba(210, 180, 140, 0.5), 0 0 80px rgba(160, 130, 90, 0.25);
      margin: 0;
      line-height: 1.3;
    }
    #title-overlay .subtitle {
      font-size: clamp(0.7rem, 1.4vw, 0.95rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: #b8aa90;
      text-shadow: 0 0 18px rgba(180, 150, 110, 0.35);
      margin-top: 6px;
    }
    #formula-overlay {
      bottom: clamp(20px, 5vh, 50px);
    }
    .formula-box {
      display: inline-block;
      background: rgba(18, 16, 12, 0.7);
      border: 1px solid rgba(180, 145, 100, 0.35);
      border-radius: 14px;
      padding: clamp(10px, 2vh, 18px) clamp(20px, 3.5vw, 36px);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      box-shadow: 0 10px 36px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
      transition: opacity 0.8s ease;
    }
    .formula-line {
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      color: #d4c8aa;
      letter-spacing: 0.05em;
      line-height: 1.9;
      font-style: italic;
      white-space: nowrap;
    }
    .fn { color: #e8c97a; font-style: normal; font-weight: bold; }
    .paren { color: #c4a870; font-style: normal; }
    .op { color: #b8956e; font-style: normal; }
    .sum { color: #c9aa5e; font-style: normal; font-size: 1.2em; }
    .param { color: #a09070; font-style: normal; }
    @media (max-width: 600px) {
      .formula-line { font-size: 0.7rem; letter-spacing: 0.02em; white-space: normal; }
      .formula-box { padding: 8px 12px; border-radius: 10px; }
      #title-overlay h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="overlay" id="title-overlay">
    <h1>数学曲线之美</h1>
    <div class="subtitle">混合函数交织 · Mixed Function Interlace</div>
  </div>

  <div class="overlay" id="formula-overlay">
    <div class="formula-box">
      <div class="formula-line">
        <span class="fn">x</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="sum">Σ</span> <span class="fn">sin</span><span class="paren">(</span>aₙt<span class="paren">)</span><span class="fn">cos</span><span class="paren">(</span>bₙt<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">y</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="sum">Σ</span> <span class="fn">cos</span><span class="paren">(</span>cₙt<span class="paren">)</span><span class="fn">sin</span><span class="paren">(</span>dₙt<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">z</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="sum">Σ</span> <span class="paren">[</span><span class="fn">sin</span><span class="paren">(</span>eₙt<span class="paren">)</span><span class="fn">sin</span><span class="paren">(</span>fₙt<span class="paren">)</span><span class="op">+</span><span class="fn">cos</span><span class="paren">(</span>gₙt<span class="paren">)</span><span class="fn">cos</span><span class="paren">(</span>hₙt<span class="paren">)</span><span class="paren">]</span>
      </div>
      <div class="formula-line" style="margin-top: 4px; color: #b8a070; font-style: normal; font-size: 0.8em;">
        a..h ∈ ℤ⁺ , t ∈ [0,2π] , 每条曲线由两组乘积项构成
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ----- DOM 元素 -----
    const container = document.getElementById('canvas-container');
    const formulaBox = document.querySelector('.formula-box');

    // ----- 场景初始化 -----
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x080810, 0.0001);

    // 相机
    const camera = new THREE.PerspectiveCamera(
      50,
      container.clientWidth / container.clientHeight,
      0.4,
      30
    );
    camera.position.set(3.8, 1.9, 6.0);
    camera.lookAt(0, 0, 0);

    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x080810);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // ----- 背景星场 -----
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 480;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 10 + Math.random() * 11;
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({
      color: 0xcec8b5,
      size: 0.02,
      transparent: true,
      opacity: 0.48,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // ----- 曲线参数 -----
    const TOTAL_VERTICES = 3000;          // 极细密
    const CURVE_COUNT = 48;              // 曲线总数
    const GROW_DURATION = 15.0;
    const PAUSE_DURATION = 1.5;
    const SHRINK_DURATION = 15.0;
    const CYCLE_TOTAL = GROW_DURATION + PAUSE_DURATION + SHRINK_DURATION;

    // 生成每条曲线的参数（两组乘积项，每轴各有四项频率和相位）
    function buildCurveParams(count) {
      const params = [];
      const freqPool = [2, 3, 4, 5, 6, 7];
      for (let i = 0; i < count; i++) {
        // X轴：sin(a1*t+ph1)*cos(a2*t+ph2) + sin(a3*t+ph3)*cos(a4*t+ph4)
        const a1 = freqPool[i % freqPool.length];
        const a2 = freqPool[(i+1) % freqPool.length];
        const a3 = freqPool[(i+3) % freqPool.length];
        const a4 = freqPool[(i+5) % freqPool.length];
        const phX1 = (i * 0.7) % (Math.PI*2);
        const phX2 = (i * 1.2 + 0.5) % (Math.PI*2);
        const phX3 = (i * 0.9 + 1.8) % (Math.PI*2);
        const phX4 = (i * 1.4 + 2.1) % (Math.PI*2);
        const ampX1 = 0.5 + (i%5)*0.06;
        const ampX2 = 0.4 + ((i+2)%5)*0.07;

        // Y轴：cos(b1*t+ph5)*sin(b2*t+ph6) + cos(b3*t+ph7)*sin(b4*t+ph8)
        const b1 = freqPool[(i+2) % freqPool.length];
        const b2 = freqPool[(i+4) % freqPool.length];
        const b3 = freqPool[(i+6) % freqPool.length];
        const b4 = freqPool[(i+0) % freqPool.length];
        const phY1 = (i * 0.8 + 0.4) % (Math.PI*2);
        const phY2 = (i * 1.1 + 1.3) % (Math.PI*2);
        const phY3 = (i * 0.6 + 2.2) % (Math.PI*2);
        const phY4 = (i * 1.3 + 0.9) % (Math.PI*2);
        const ampY1 = 0.5 + ((i+1)%5)*0.06;
        const ampY2 = 0.45 + ((i+3)%5)*0.06;

        // Z轴：sin(c1*t+ph9)*sin(c2*t+ph10) + cos(c3*t+ph11)*cos(c4*t+ph12)
        const c1 = freqPool[(i+5) % freqPool.length];
        const c2 = freqPool[(i+7) % freqPool.length];
        const c3 = freqPool[(i+1) % freqPool.length];
        const c4 = freqPool[(i+3) % freqPool.length];
        const phZ1 = (i * 0.5 + 0.1) % (Math.PI*2);
        const phZ2 = (i * 1.6 + 1.0) % (Math.PI*2);
        const phZ3 = (i * 1.0 + 2.5) % (Math.PI*2);
        const phZ4 = (i * 1.8 + 1.4) % (Math.PI*2);
        const ampZ1 = 0.48 + (i%5)*0.05;
        const ampZ2 = 0.42 + ((i+2)%5)*0.06;

        params.push({
          a1,a2,a3,a4, phX1,phX2,phX3,phX4, ampX1,ampX2,
          b1,b2,b3,b4, phY1,phY2,phY3,phY4, ampY1,ampY2,
          c1,c2,c3,c4, phZ1,phZ2,phZ3,phZ4, ampZ1,ampZ2
        });
      }
      return params;
    }
    const curveParamsList = buildCurveParams(CURVE_COUNT);

    // 色相均匀分布
    const hues = Array.from({ length: CURVE_COUNT }, (_, k) => (k / CURVE_COUNT + 0.06) % 1);

    // 生成一条曲线的顶点位置和颜色
    function generateCurveData(p, hue) {
      const positions = new Float32Array(TOTAL_VERTICES * 3);
      const colors = new Float32Array(TOTAL_VERTICES * 3);
      for (let i = 0; i < TOTAL_VERTICES; i++) {
        const t = (i / (TOTAL_VERTICES - 1)) * Math.PI * 2;
        
        // X
        const x1 = Math.sin(p.a1 * t + p.phX1) * Math.cos(p.a2 * t + p.phX2);
        const x2 = Math.sin(p.a3 * t + p.phX3) * Math.cos(p.a4 * t + p.phX4);
        const x = p.ampX1 * x1 + p.ampX2 * x2;
        
        // Y
        const y1 = Math.cos(p.b1 * t + p.phY1) * Math.sin(p.b2 * t + p.phY2);
        const y2 = Math.cos(p.b3 * t + p.phY3) * Math.sin(p.b4 * t + p.phY4);
        const y = p.ampY1 * y1 + p.ampY2 * y2;
        
        // Z
        const z1 = Math.sin(p.c1 * t + p.phZ1) * Math.sin(p.c2 * t + p.phZ2);
        const z2 = Math.cos(p.c3 * t + p.phZ3) * Math.cos(p.c4 * t + p.phZ4);
        const z = p.ampZ1 * z1 + p.ampZ2 * z2;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // 颜色微调
        const hueShift = Math.sin(t * 2.7 + hue * 11) * 0.02;
        const h = (hue + hueShift + 1) % 1;
        const s = 0.7 + Math.sin(t * 3.5 + hue * 8) * 0.12;
        const l = 0.52 + Math.cos(t * 5.0 + hue * 6) * 0.09;
        const color = new THREE.Color();
        color.setHSL(h, s, l);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      return { positions, colors };
    }

    // ----- 创建所有曲线 -----
    const curveGroup = new THREE.Group();
    scene.add(curveGroup);
    const allGeometries = [];

    curveParamsList.forEach((params, idx) => {
      const { positions, colors } = generateCurveData(params, hues[idx]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.setDrawRange(0, 0);

      const material = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.NormalBlending,
        depthTest: true,
        depthWrite: true,
      });
      const line = new THREE.Line(geometry, material);
      line.renderOrder = idx;
      curveGroup.add(line);
      allGeometries.push(geometry);
    });

    // ----- 装饰参考环 -----
    const ringGeo = new THREE.TorusGeometry(1.05, 0.006, 32, 160);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x3e3830,
      transparent: true,
      opacity: 0.22,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.renderOrder = 999;
    curveGroup.add(ring);

    const ring2Geo = new THREE.TorusGeometry(0.85, 0.005, 24, 120);
    const ring2Mat = new THREE.MeshBasicMaterial({
      color: 0x4c453c,
      transparent: true,
      opacity: 0.18,
      depthWrite: false,
    });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    ring2.rotation.x = Math.PI / 3;
    ring2.rotation.y = Math.PI / 5;
    ring2.renderOrder = 998;
    curveGroup.add(ring2);

    // ----- 动画状态 -----
    const clock = new THREE.Clock();
    let lastDrawCount = -1;
    let currentPhase = 'grow';

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // ----- 渲染循环 -----
    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const cycleTime = elapsed % CYCLE_TOTAL;

      let progress;
      if (cycleTime < GROW_DURATION) {
        const raw = cycleTime / GROW_DURATION;
        progress = easeInOutCubic(raw);
        currentPhase = 'grow';
      } else if (cycleTime < GROW_DURATION + PAUSE_DURATION) {
        progress = 1.0;
        currentPhase = 'pause';
      } else {
        const shrinkElapsed = cycleTime - (GROW_DURATION + PAUSE_DURATION);
        const raw = 1.0 - shrinkElapsed / SHRINK_DURATION;
        progress = easeInOutCubic(Math.max(0, Math.min(1, raw)));
        currentPhase = 'shrink';
      }

      const drawCount = Math.max(0, Math.floor(progress * TOTAL_VERTICES));

      if (drawCount !== lastDrawCount) {
        allGeometries.forEach(geo => geo.setDrawRange(0, drawCount));
        lastDrawCount = drawCount;
      }

      // 曲线组缓慢旋转并轻微摆动
      curveGroup.rotation.y += 0.0024;
      curveGroup.rotation.x = Math.sin(elapsed * 0.22) * 0.16;
      curveGroup.rotation.z = Math.cos(elapsed * 0.26) * 0.12;

      // 星场微动
      stars.rotation.y += 0.0002;
      stars.rotation.x += 0.00012;

      // 光环呼吸
      const breathe = 1 + Math.sin(elapsed * 0.7) * 0.04;
      ring.scale.setScalar(breathe);
      ring.material.opacity = 0.18 + Math.sin(elapsed * 0.55) * 0.06;
      ring2.scale.setScalar(1 + Math.cos(elapsed * 0.65) * 0.05);
      ring2.material.opacity = 0.15 + Math.cos(elapsed * 0.6) * 0.05;

      // 公式面板透明度
      if (formulaBox) {
        let op;
        if (currentPhase === 'pause') op = 0.95;
        else if (currentPhase === 'grow' && progress > 0.5) op = 0.5 + (progress - 0.5) * 0.9;
        else if (currentPhase === 'shrink' && progress < 0.5) op = 0.5 + progress * 0.9;
        else op = 0.55 + progress * 0.4;
        formulaBox.style.opacity = Math.max(0.35, Math.min(1, op));
      }

      renderer.render(scene, camera);
    }

    // ----- 响应式 -----
    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / Math.max(h, 1);
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }, 150);
    });

    // ----- 启动动画 -----
    allGeometries.forEach(geo => geo.setDrawRange(0, 0));
    lastDrawCount = 0;
    clock.start();
    requestAnimationFrame(animate);

    console.log('%c🌐 混合函数交织 %c已启动', 'color:#e8c97a;font-size:1.1em;', 'color:#b8aa90;');
    console.log('%c'+CURVE_COUNT+'条乘积和交织曲线 | 从无到有15s → 停顿1.5s → 从有到无15s | 完美闭合',
      'color:#b8956e;font-size:0.9em;');
  </script>
</body>
</html>
