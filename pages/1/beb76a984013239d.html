<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>抛物运动 · 3D 光轨 | Projectile Motion</title>
<style>
  :root{
    --cyan:#5ffbf1;
    --pink:#ff5fd2;
    --violet:#9d7bff;
    --gold:#ffd166;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:radial-gradient(circle at 50% 42%, #0a1630 0%, #04060f 58%, #010206 100%);
    color:#dff8ff;
    font-family:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{ position:fixed; inset:0; }
  #app canvas{ display:block; }

  /* 暗角 */
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode:multiply;
  }

  .panel{
    position:fixed;
    z-index:5;
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    background:linear-gradient(160deg, rgba(12,30,52,0.72), rgba(5,12,24,0.55));
    border:1px solid rgba(95,251,241,0.22);
    border-radius:14px;
    box-shadow:0 10px 40px rgba(0,0,0,0.55), inset 0 0 26px rgba(95,251,241,0.05);
    padding:14px 18px;
    font-size:13px;
    line-height:1.55;
    animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* 标题 / 公式 */
  #titlePanel{ top:20px; left:20px; max-width:340px; }
  .tag{
    font-size:10px; letter-spacing:3px; color:var(--cyan); opacity:.75;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  #titlePanel h1{
    margin:6px 0 10px; font-size:23px; letter-spacing:3px; font-weight:600;
    color:#eafcff;
    text-shadow:0 0 22px rgba(95,251,241,0.65), 0 0 60px rgba(95,251,241,0.25);
  }
  #titlePanel h1 span{
    display:block; margin-top:5px; font-size:11px; font-weight:400;
    letter-spacing:5px; color:var(--cyan); opacity:.85;
  }
  .formula{
    margin-top:10px; padding-top:10px;
    border-top:1px dashed rgba(95,251,241,0.2);
    font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;
    font-size:12.5px; color:#a9d7e6;
  }
  .formula div{ margin:3px 0; }
  .formula i{ color:#ffd166; font-style:italic; }
  .formula .hl{
    color:#fff;
    text-shadow:0 0 14px rgba(95,251,241,0.75);
  }

  /* HUD 数据 */
  #hud{ top:20px; right:20px; min-width:190px; }
  #hud .h{ font-size:10px; letter-spacing:3px; color:var(--cyan); opacity:.7; margin-bottom:8px;
           font-family:ui-monospace,Menlo,Consolas,monospace; }
  #hud .row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px; padding:3px 0;
    border-bottom:1px solid rgba(95,251,241,0.08);
  }
  #hud .row:last-child{ border-bottom:none; }
  #hud .row b{ color:#fff; font-size:14px; text-shadow:0 0 12px rgba(95,251,241,0.8); }
  #hud .row span{ color:#7fb6c6; }

  /* 控制面板 */
  #controls{
    bottom:22px; left:50%; transform:translateX(-50%);
    width:min(560px, calc(100vw - 40px));
    animation:fadeUp 1s cubic-bezier(.2,.8,.2,1) both;
  }
  .ctl{ margin-bottom:12px; }
  .ctl .lbl{
    display:flex; justify-content:space-between;
    font-size:11.5px; letter-spacing:1.5px; color:#8fd3e2;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    margin-bottom:6px;
  }
  .ctl .lbl output{ color:var(--cyan); text-shadow:0 0 12px rgba(95,251,241,0.8); }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:4px; border-radius:4px; outline:none;
    background:linear-gradient(90deg, rgba(95,251,241,0.85), rgba(157,123,255,0.7), rgba(255,95,210,0.6));
    box-shadow:0 0 14px rgba(95,251,241,0.35);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #ffffff, #5ffbf1 55%, #1a8f9c);
    border:none; cursor:pointer;
    box-shadow:0 0 14px rgba(95,251,241,0.95), 0 0 30px rgba(95,251,241,0.5);
  }
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 35%, #ffffff, #5ffbf1 55%, #1a8f9c);
    box-shadow:0 0 14px rgba(95,251,241,0.95);
  }

  .btns{ display:flex; gap:10px; margin-top:14px; }
  button{
    flex:1; cursor:pointer; position:relative; overflow:hidden;
    padding:10px 12px; border-radius:10px;
    font-family:inherit; font-size:13px; letter-spacing:2px;
    color:#d9feff;
    background:linear-gradient(150deg, rgba(95,251,241,0.16), rgba(157,123,255,0.14));
    border:1px solid rgba(95,251,241,0.4);
    transition:all .22s ease;
    box-shadow:0 0 18px rgba(95,251,241,0.12), inset 0 0 14px rgba(95,251,241,0.06);
  }
  button:hover{
    color:#fff;
    border-color:rgba(95,251,241,0.95);
    box-shadow:0 0 26px rgba(95,251,241,0.5), inset 0 0 22px rgba(95,251,241,0.16);
    transform:translateY(-1px);
  }
  button:active{ transform:translateY(1px) scale(.985); }

  #muteBtn{
    position:fixed; top:20px; right:20px; z-index:6;
    width:40px; height:40px; padding:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  #hud{ margin-top:52px; }

  .hint{
    margin-top:10px; text-align:center;
    font-size:10.5px; letter-spacing:2px; color:#5b8a99;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }

  @media (max-width:720px){
    #titlePanel{ max-width:210px; padding:10px 12px; }
    #titlePanel h1{ font-size:16px; letter-spacing:2px; }
    #titlePanel h1 span{ font-size:9px; letter-spacing:3px; }
    .formula{ font-size:10px; }
    #hud{ min-width:140px; padding:10px 12px; font-size:11px; }
    #hud .row b{ font-size:12px; }
    #controls{ width:calc(100vw - 24px); padding:10px 12px; bottom:12px; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="vignette"></div>

<button class="panel" id="muteBtn" title="静音 / 取消静音">🔊</button>

<!-- 标题 & 公式 -->
<div class="panel" id="titlePanel">
  <div class="tag">PHYSICS · 3D SIMULATION</div>
  <h1>抛物运动<span>抛 体 轨 迹</span></h1>
  <div class="formula">
    <div><i>x</i> = v₀·cosθ · t</div>
    <div><i>y</i> = v₀·sinθ · t − ½g t²</div>
    <div class="hl">y = x·tanθ − gx² / (2v₀²cos²θ)</div>
  </div>
</div>

<!-- 实时数据 -->
<div class="panel" id="hud">
  <div class="h">THEORY VALUES</div>
  <div class="row"><span>v₀</span><b id="hv0">20.0</b></div>
  <div class="row"><span>θ</span><b id="hAng">45°</b></div>
  <div class="row"><span>射程 R</span><b id="hRange">40.8</b></div>
  <div class="row"><span>最大高度 H</span><b id="hMax">10.2</b></div>
  <div class="row"><span>飞行时间 T</span><b id="hTime">2.89</b></div>
</div>

<!-- 控制面板 -->
<div class="panel" id="controls">
  <div class="ctl">
    <div class="lbl"><span>初速度 v₀</span><output id="ov0">20.0 m/s</output></div>
    <input type="range" id="v0" min="8" max="30" step="0.5" value="20">
  </div>
  <div class="ctl">
    <div class="lbl"><span>抛射角 θ</span><output id="oAng">45°</output></div>
    <input type="range" id="ang" min="10" max="85" step="1" value="45">
  </div>
  <div class="btns">
    <button id="fireBtn">发 射 ⚡</button>
    <button id="burstBtn">抛物线束 ✦</button>
  </div>
  <div class="hint">拖动旋转 · 滚轮缩放 · [空格] 发射 · [B] 齐射</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   常量与工具
============================================================ */
const G = 9.8;                         // 重力加速度 m/s²
const PALETTE = [0x5ffbf1, 0xff5fd2, 0xffd166, 0x9d7bff, 0x6bff8f, 0xff8a5f, 0x5fb0ff];
let colorIndex = 0;

/* 发光贴图 */
let glowTexture = null;
function getGlowTexture(){
  if (glowTexture) return glowTexture;
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0.00, 'rgba(255,255,255,1)');
  grad.addColorStop(0.22, 'rgba(255,255,255,0.72)');
  grad.addColorStop(0.52, 'rgba(255,255,255,0.20)');
  grad.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  glowTexture = new THREE.CanvasTexture(c);
  glowTexture.colorSpace = THREE.SRGBColorSpace;
  return glowTexture;
}

/* ============================================================
   场景 / 相机 / 渲染器
============================================================ */
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x04060f, 1);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060f, 0.0062);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(-18, 36, 78);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(34, 10, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.492;
controls.minDistance = 14;
controls.maxDistance = 240;
controls.update();

/* ============================================================
   地面网格 + 坐标轴
============================================================ */
// 半透明反射地面
const groundMat = new THREE.MeshBasicMaterial({
  color: 0x061420, transparent:true, opacity:0.55, depthWrite:false
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.08;
scene.add(ground);

// 网格
const grid = new THREE.GridHelper(260, 130, 0x2a7f92, 0x0e3c4a);
grid.material.transparent = true;
grid.material.opacity = 0.5;
grid.material.depthWrite = false;
scene.add(grid);

// 更细的辅助网格（更暗）
const grid2 = new THREE.GridHelper(260, 260, 0x11404d, 0x0a2630);
grid2.material.transparent = true;
grid2.material.opacity = 0.25;
grid2.material.depthWrite = false;
grid2.position.y = 0.01;
scene.add(grid2);

// 坐标轴
function makeAxis(end, color, opacity=0.6){
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,0,0), end
  ]);
  const mat = new THREE.LineBasicMaterial({
    color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false
  });
  const line = new THREE.Line(geo, mat);
  line.frustumCulled = false;
  return line;
}
scene.add(makeAxis(new THREE.Vector3(130, 0, 0), 0x5ffbf1, 0.55)); // X
scene.add(makeAxis(new THREE.Vector3(0, 46, 0), 0xff5fd2, 0.45));  // Y
scene.add(makeAxis(new THREE.Vector3(0, 0, 70), 0x9d7bff, 0.30));  // Z

// 发射点光环
const launchRing = new THREE.Mesh(
  new THREE.RingGeometry(1.3, 2.0, 64),
  new THREE.MeshBasicMaterial({
    color: 0x5ffbf1, transparent:true, opacity:0.55,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite:false
  })
);
launchRing.rotation.x = -Math.PI/2;
launchRing.position.set(0, 0.06, 0);
scene.add(launchRing);

/* ============================================================
   音频系统（Web Audio API）
============================================================ */
let audioCtx = null, master = null, noiseBuffer = null, muted = false;

function ensureAudio(){
  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    master = audioCtx.createGain();
    master.gain.value = 0.0001;
    master.connect(audioCtx.destination);
    master.gain.exponentialRampToValueAtTime(muted ? 0.0001 : 0.55, audioCtx.currentTime + 1.6);
    startDrone();
    startSparkles();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

/* 低频环境铺底 */
function startDrone(){
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 380;
  filter.Q.value = 5;

  const dg = audioCtx.createGain();
  dg.gain.value = 0.20;
  filter.connect(dg);
  dg.connect(master);

  [55, 82.41, 110.5].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = i === 2 ? 'triangle' : 'sawtooth';
    o.frequency.value = f * (1 + (i - 1) * 0.0035);
    const g = audioCtx.createGain();
    g.gain.value = i === 2 ? 0.07 : 0.20;
    o.connect(g); g.connect(filter);
    o.start();
  });

  // 缓慢滤波扫频，制造空间呼吸感
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.065;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 190;
  lfo.connect(lfoGain);
  lfoGain.connect(filter.frequency);
  lfo.start();
}

/* 随机高频闪烁音 */
function startSparkles(){
  const tick = () => {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    const base = 900 + Math.random() * 1800;
    o.frequency.setValueAtTime(base, now);
    o.frequency.exponentialRampToValueAtTime(base * 1.6, now + 0.20);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.045, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);
    o.connect(g); g.connect(master);
    o.start(now); o.stop(now + 0.45);
    setTimeout(tick, 700 + Math.random() * 2400);
  };
  setTimeout(tick, 700);
}

/* 发射「咻」声 */
function playLaunch(pitch = 1){
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(920 * pitch, now);
  o.frequency.exponentialRampToValueAtTime(170 * pitch, now + 0.42);

  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = 850;
  f.Q.value = 1.1;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.20, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);

  o.connect(f); f.connect(g); g.connect(master);
  o.start(now); o.stop(now + 0.52);
}

/* 落地烟花爆炸声 */
function getNoise(){
  if (noiseBuffer) return noiseBuffer;
  const len = Math.floor(audioCtx.sampleRate * 1.2);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  noiseBuffer = buf;
  return buf;
}

function playBoom(){
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  // 噪声爆裂
  const src = audioCtx.createBufferSource();
  src.buffer = getNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(1700, now);
  f.frequency.exponentialRampToValueAtTime(180, now + 0.75);
  f.Q.value = 1.4;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.36, now + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.95);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(now); src.stop(now + 1.05);

  // 低频冲击
  const o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(170, now);
  o.frequency.exponentialRampToValueAtTime(42, now + 0.36);
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.0001, now);
  g2.gain.exponentialRampToValueAtTime(0.30, now + 0.01);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);
  o.connect(g2); g2.connect(master);
  o.start(now); o.stop(now + 0.52);
}

/* ============================================================
   抛体小球
============================================================ */
const balls = [];
const MAX_TRAIL = 150;

class Ball {
  constructor(v0, angleDeg, colorHex, z = 0){
    this.angle = THREE.MathUtils.degToRad(angleDeg);
    this.color = new THREE.Color(colorHex);
    this.pos = new THREE.Vector3(0, 0.75, z);
    this.vel = new THREE.Vector3(
      v0 * Math.cos(this.angle),
      v0 * Math.sin(this.angle),
      0
    );
    this.alive = true;
    this.dead = false;
    this.fadeT = 0;
    this.trail = [];

    /* --- 小球本体 --- */
    const sphereGeo = new THREE.SphereGeometry(0.75, 20, 14);
    const sphereMat = new THREE.MeshBasicMaterial({ color: this.color });
    this.mesh = new THREE.Mesh(sphereGeo, sphereMat);
    this.mesh.position.copy(this.pos);
    scene.add(this.mesh);

    /* --- 光晕 --- */
    this.glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: getGlowTexture(),
      color: this.color,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    this.glow.scale.set(7, 7, 1);
    this.glow.position.copy(this.pos);
    scene.add(this.glow);

    /* --- 拖尾几何（线与点共用） --- */
    this.positions = new Float32Array(MAX_TRAIL * 3);
    this.colorsArr = new Float32Array(MAX_TRAIL * 3);
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
    this.geo.setAttribute('color', new THREE.BufferAttribute(this.colorsArr, 3));
    this.geo.setDrawRange(0, 0);

    this.lineMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.line = new THREE.Line(this.geo, this.lineMat);
    this.line.frustumCulled = false;
    scene.add(this.line);

    this.ptsMat = new THREE.PointsMaterial({
      vertexColors: true,
      size: 2.0,
      sizeAttenuation: true,
      map: getGlowTexture(),
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.points = new THREE.Points(this.geo, this.ptsMat);
    this.points.frustumCulled = false;
    scene.add(this.points);
  }

  update(dt){
    if (this.alive){
      /* 物理积分（3 次子步提升精度） */
      const steps = 3;
      const h = dt / steps;
      for (let i = 0; i < steps; i++){
        this.vel.y -= G * h;
        this.pos.x += this.vel.x * h;
        this.pos.y += this.vel.y * h;
        if (this.pos.y <= 0.75 && this.vel.y < 0){
          this.pos.y = 0.75;
          this.land();
          break;
        }
      }

      if (this.alive){
        // 记录轨迹
        this.trail.unshift(this.pos.clone());
        if (this.trail.length > MAX_TRAIL) this.trail.pop();

        this.mesh.position.copy(this.pos);
        this.glow.position.copy(this.pos);
      }
      this.updateGeometry(false);
    } else {
      /* 消散阶段 */
      this.fadeT += dt;
      const k = Math.max(0, 1 - this.fadeT / 1.05);
      this.lineMat.opacity = k;
      this.ptsMat.opacity = k;
      this.glow.material.opacity = k * 0.95;
      this.glow.scale.setScalar(7 * (1 + (1 - k) * 2.2));
      this.mesh.scale.setScalar(Math.max(0.001, k));
      this.mesh.material.opacity = k;
      this.mesh.material.transparent = true;
      this.updateGeometry(true);
      if (this.fadeT > 1.05) this.dead = true;
    }
  }

  updateGeometry(fadingOnly){
    const n = this.trail.length;
    if (n === 0) return;

    const p = this.positions;
    const c = this.colorsArr;
    const col = this.color;

    for (let i = 0; i < n; i++){
      const v = this.trail[i];
      const i3 = i * 3;
      p[i3]     = v.x;
      p[i3 + 1] = v.y;
      p[i3 + 2] = v.z;

      if (!fadingOnly){
        const f = 1 - i / n;      // 头部 1 → 尾部 0
        const a = f * f;          // 平方衰减
        c[i3]     = col.r * a;
        c[i3 + 1] = col.g * a;
        c[i3 + 2] = col.b * a;
      }
    }

    this.geo.attributes.position.needsUpdate = true;
    if (!fadingOnly) this.geo.attributes.color.needsUpdate = true;
    this.geo.setDrawRange(0, n);
  }

  land(){
    this.alive = false;
    this.mesh.position.copy(this.pos);
    spawnFirework(this.pos, this.color);
    playBoom();
  }

  dispose(){
    scene.remove(this.mesh, this.glow, this.line, this.points);
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();
    this.glow.material.dispose();
    this.geo.dispose();
    this.lineMat.dispose();
    this.ptsMat.dispose();
  }
}

/* ============================================================
   烟花粒子爆炸
============================================================ */
const fireworks = [];

class Firework {
  constructor(origin, color){
    this.count = 120;
    this.duration = 1.7;
    this.life = 0;
    this.dead = false;

    const pos = new Float32Array(this.count * 3);
    const col = new Float32Array(this.count * 3);
    this.vel = new Float32Array(this.count * 3);

    for (let i = 0; i < this.count; i++){
      const i3 = i * 3;
      pos[i3]     = origin.x;
      pos[i3 + 1] = origin.y + 0.25;
      pos[i3 + 2] = origin.z;

      // 球面均匀方向（偏向上半球）
      const theta = Math.random() * Math.PI * 2;
      const u = Math.random() * 2 - 1;
      const phi = Math.acos(u);
      const speed = 7 + Math.random() * 17;

      const sx = Math.sin(phi) * Math.cos(theta);
      const sy = Math.abs(Math.cos(phi)) * 1.15 + 0.38;
      const sz = Math.sin(phi) * Math.sin(theta);

      this.vel[i3]     = sx * speed;
      this.vel[i3 + 1] = sy * speed;
      this.vel[i3 + 2] = sz * speed;

      const c = color.clone().offsetHSL(
        (Math.random() - 0.5) * 0.18,
        0.06,
        (Math.random() - 0.5) * 0.32
      );
      col[i3]     = c.r;
      col[i3 + 1] = c.g;
      col[i3 + 2] = c.b;
    }

    this.positions = pos;
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    this.geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

    this.mat = new THREE.PointsMaterial({
      size: 1.6,
      vertexColors: true,
      map: getGlowTexture(),
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    this.points = new THREE.Points(this.geo, this.mat);
    this.points.frustumCulled = false;
    scene.add(this.points);

    // 地面冲击波环
    this.ring = new THREE.Mesh(
      new THREE.RingGeometry(0.9, 1.35, 56),
      new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );
    this.ring.rotation.x = -Math.PI / 2;
    this.ring.position.set(origin.x, 0.14, origin.z);
    scene.add(this.ring);
  }

  update(dt){
    this.life += dt;
    const k = this.life / this.duration;
    const drag = Math.pow(0.12, dt);   // 强阻尼，模拟空气阻力

    for (let i = 0; i < this.count; i++){
      const i3 = i * 3;
      this.vel[i3]     *= drag;
      this.vel[i3 + 2] *= drag;
      this.vel[i3 + 1]  = this.vel[i3 + 1] * drag - 14 * dt;

      this.positions[i3]     += this.vel[i3] * dt;
      this.positions[i3 + 1] += this.vel[i3 + 1] * dt;
      this.positions[i3 + 2] += this.vel[i3 + 2] * dt;

      if (this.positions[i3 + 1] < 0.08) this.positions[i3 + 1] = 0.08;
    }

    this.geo.attributes.position.needsUpdate = true;
    this.mat.opacity = Math.max(0, 1 - k * k);

    const rs = 1 + k * 24;
    this.ring.scale.setScalar(rs);
    this.ring.material.opacity = Math.max(0, 0.85 * (1 - k * 1.35));

    if (this.life >= this.duration) this.dead = true;
  }

  dispose(){
    scene.remove(this.points, this.ring);
    this.geo.dispose();
    this.mat.dispose();
    this.ring.geometry.dispose();
    this.ring.material.dispose();
  }
}

function spawnFirework(pos, color){
  if (fireworks.length > 24) return;
  fireworks.push(new Firework(pos, color));
}

/* ============================================================
   发射逻辑
============================================================ */
const v0Slider = document.getElementById('v0');
const angSlider = document.getElementById('ang');
const ov0 = document.getElementById('ov0');
const oAng = document.getElementById('oAng');

function fireOne(){
  ensureAudio();
  if (balls.length > 40) return;
  const v0 = parseFloat(v0Slider.value);
  const ang = parseFloat(angSlider.value);
  const color = PALETTE[colorIndex++ % PALETTE.length];
  balls.push(new Ball(v0, ang, color, 0));
  playLaunch(1);
}

function fireBurst(){
  ensureAudio();
  const v0 = parseFloat(v0Slider.value);
  const angles = [15, 27, 39, 51, 63, 75];
  angles.forEach((a, i) => {
    setTimeout(() => {
      if (balls.length > 45) return;
      const z = (i - (angles.length - 1) / 2) * 4.2;
      const color = PALETTE[i % PALETTE.length];
      balls.push(new Ball(v0, a, color, z));
      playLaunch(0.82 + i * 0.07);
    }, i * 115);
  });
}

/* ============================================================
   HUD 刷新
============================================================ */
const hV0 = document.getElementById('hv0');
const hAng = document.getElementById('hAng');
const hRange = document.getElementById('hRange');
const hMax = document.getElementById('hMax');
const hTime = document.getElementById('hTime');

function updateHUD(){
  const v0 = parseFloat(v0Slider.value);
  const ang = parseFloat(angSlider.value);
  const rad = ang * Math.PI / 180;

  const R = v0 * v0 * Math.sin(2 * rad) / G;
  const H = Math.pow(v0 * Math.sin(rad), 2) / (2 * G);
  const T = 2 * v0 * Math.sin(rad) / G;

  ov0.textContent = v0.toFixed(1) + ' m/s';
  oAng.textContent = ang + '°';
  hV0.textContent = v0.toFixed(1);
  hAng.textContent = ang + '°';
  hRange.textContent = R.toFixed(1);
  hMax.textContent = H.toFixed(1);
  hTime.textContent = T.toFixed(2);
}

v0Slider.addEventListener('input', updateHUD);
angSlider.addEventListener('input', updateHUD);
document.getElementById('fireBtn').addEventListener('click', fireOne);
document.getElementById('burstBtn').addEventListener('click', fireBurst);

/* 静音按钮 */
const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio();
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (master && audioCtx){
    master.gain.cancelScheduledValues(audioCtx.currentTime);
    master.gain.setTargetAtTime(muted ? 0.0001 : 0.55, audioCtx.currentTime, 0.12);
  }
});

/* 键盘 */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){ e.preventDefault(); fireOne(); }
  if (e.code === 'KeyB'){ e.preventDefault(); fireBurst(); }
});

/* 首次交互开启音频 */
window.addEventListener('pointerdown', ensureAudio, { passive: true });

/* ============================================================
   动画主循环
============================================================ */
let last = performance.now();
let clockTime = 0;

function animate(){
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;   // 防止切标签页后大跳
  clockTime += dt;

  // 更新抛体
  for (let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];
    b.update(dt);
    if (b.dead){
      b.dispose();
      balls.splice(i, 1);
    }
  }

  // 更新烟花
  for (let i = fireworks.length - 1; i >= 0; i--){
    const f = fireworks[i];
    f.update(dt);
    if (f.dead){
      f.dispose();
      fireworks.splice(i, 1);
    }
  }

  // 发射点光环脉冲
  const pulse = 1 + Math.sin(clockTime * 2.6) * 0.13;
  launchRing.scale.setScalar(pulse);
  launchRing.material.opacity = 0.42 + Math.sin(clockTime * 2.6) * 0.16;

  // 网格缓慢呼吸
  grid.material.opacity = 0.42 + Math.sin(clockTime * 0.8) * 0.08;

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   尺寸自适应
============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* 启动 */
updateHUD();
animate();

// 开场自动演示一束抛物线
setTimeout(() => {
  fireBurst();
}, 900);
</script>
