<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>泰勒展开 · sin(x) 的多项式逼近</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#03060d;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  /* 左上标题 */
  #title{
    position:absolute;top:0;left:0;
    padding:28px 36px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(255,180,130,.36);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(18px,2.6vw,30px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#ffc080 0%,#ff9a80 38%,#e080b0 70%,#a090ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 26px rgba(255,170,120,.42));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:11px;letter-spacing:.16em;
    color:rgba(255,215,190,.52);font-weight:300;
  }

  /* 右上统计 */
  #stats{
    position:absolute;top:0;right:0;
    padding:28px 36px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(255,180,130,.30);margin-bottom:6px;
  }
  #stats .bigv{
    font-size:clamp(20px,2.4vw,28px);
    font-weight:300;letter-spacing:.06em;
    color:rgba(255,215,180,.94);
    display:block;line-height:1;
    margin-bottom:8px;
    filter:drop-shadow(0 0 14px rgba(255,180,120,.4));
  }
  #stats .kv{
    font-size:9.5px;letter-spacing:.12em;line-height:2.0;
    color:rgba(230,200,190,.44);
  }
  #stats .kv .k{color:rgba(255,200,180,.58);}
  #stats .kv .v{color:rgba(140,225,255,.90);}

  /* 底部公式 */
  #formula{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:32px;
    display:flex;align-items:center;flex-wrap:wrap;justify-content:center;
    gap:4px 8px;
    max-width:92vw;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #formula .sinx{
    font-size:clamp(13px,1.6vw,16px);
    color:rgba(140,225,255,.90);
    letter-spacing:.06em;
    margin-right:4px;
  }
  #formula .eq{
    font-size:clamp(13px,1.6vw,16px);
    color:rgba(180,200,240,.62);
    margin-right:2px;
  }
  #formula .term{
    font-size:clamp(12px,1.5vw,15px);
    letter-spacing:.04em;
    color:rgba(180,190,220,.24);
    padding:2px 4px;
    border-radius:4px;
    transition:color .5s ease, text-shadow .5s ease, background .5s ease;
    white-space:nowrap;
  }
  #formula .term.on{
    color:rgba(255,215,160,.96);
    text-shadow:0 0 12px rgba(255,180,100,.62);
  }
  #formula .term.new{
    background:rgba(255,180,110,.12);
    color:rgba(255,235,200,1);
    text-shadow:0 0 18px rgba(255,200,140,.9);
  }
  #formula .op{
    font-size:clamp(12px,1.5vw,15px);
    color:rgba(180,200,240,.42);
    padding:0 2px;
  }
  #formula .dots{
    font-size:clamp(12px,1.5vw,15px);
    color:rgba(180,200,240,.32);
    letter-spacing:.14em;
  }

  /* 音频指示 */
  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 36px 28px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(255,190,140,.30);
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(200,160,220,.24);
    transition:background .4s, box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(255,180,140,.92);
    box-shadow:0 0 10px rgba(255,170,120,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:760px){
    #title{padding:14px 16px;}
    #title .sub{font-size:9.5px;}
    #stats{padding:14px 16px;}
    #stats .bigv{font-size:18px;}
    #formula{padding-bottom:16px;gap:2px 5px;max-width:96vw;}
    #audioDot{padding:0 16px 14px;font-size:7.5px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">TAYLOR SERIES · POLYNOMIAL APPROXIMATION</div>
    <h1>泰勒展开</h1>
    <div class="sub">sin(x) 的多项式逼近</div>
  </div>

  <div id="stats">
    <span class="lab">APPROXIMATION</span>
    <span class="bigv" id="termCount">1 项</span>
    <div class="kv">
      <div><span class="k">最大误差 </span><span class="v" id="maxErr">0.000</span></div>
      <div><span class="k">最高次幂 </span><span class="v" id="maxPower">x¹</span></div>
      <div><span class="k">状态 </span><span class="v" id="status">收敛中</span></div>
    </div>
  </div>

  <div id="formula">
    <span class="sinx">sin(x)</span>
    <span class="eq">=</span>
    <span id="formulaTerms"></span>
    <span class="dots">…</span>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>层叠音效 · 拼合完成</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1, S = 0;

/* =========================================================
   泰勒多项式
   sin(x) = x − x³/3! + x⁵/5! − x⁷/7! + …
   ========================================================= */
const MAX_TERMS = 13;

const factorials = [1];
function fact(n){
  if (factorials[n] !== undefined) return factorials[n];
  for (let i = factorials.length; i <= n; i++){
    factorials[i] = factorials[i - 1] * i;
  }
  return factorials[n];
}

/* 第 i 项（i 从 0 开始）：(-1)^i · x^(2i+1) / (2i+1)! */
function termValue(x, i){
  const power = 2 * i + 1;
  const sign = (i % 2 === 0) ? 1 : -1;
  return sign * Math.pow(x, power) / fact(power);
}

/* 使用浮点项数求值：小数部分平滑引入下一项 */
function taylorValue(x, termFloat){
  const full = Math.floor(termFloat);
  const frac = termFloat - full;

  let sum = 0;
  for (let i = 0; i < full; i++){
    sum += termValue(x, i);
  }
  if (full < MAX_TERMS){
    /* 缓动引入，避免突变 */
    const fe = frac < 0.5
      ? 2 * frac * frac
      : 1 - Math.pow(-2 * frac + 2, 2) * 0.5;
    sum += termValue(x, full) * fe;
  }
  return sum;
}

/* =========================================================
   动画状态
   ========================================================= */
const GROW_DUR  = 1.35;      // 每项增长时长（秒）
const HOLD_DUR  = 4.2;       // 完成后停留
const FADE_DUR  = 1.2;       // 淡出

let termFloat = 1;
let phase = 'grow';
let phaseT = 0;
let lastPlayed = 1;
let completionPlayed = false;

/* 舞台模式：显示区域 */
const xRange = Math.PI * 2.2;
const yRange = 2.6;

let plotCX = 0, plotCY = 0;
let plotW = 0, plotH = 0;
let scaleX = 1, scaleY = 1;

/* 星星 */
const stars = [];

/* 完成时的粒子爆发 */
const sparks = [];

/* =========================================================
   布局
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);

  /* 绘图区域 */
  const availW = W * 0.88;
  const availH = H * 0.50;

  const aspectWorld = (2 * xRange) / (2 * yRange);   // ≈ 2.66
  let pw = availW;
  let ph = pw / aspectWorld;
  if (ph > availH){
    ph = availH;
    pw = ph * aspectWorld;
  }

  plotW = pw;
  plotH = ph;
  plotCX = W * 0.5;
  plotCY = H * 0.42;

  scaleX = plotW / (2 * xRange);
  scaleY = plotH / (2 * yRange);

  buildStars();
}
window.addEventListener('resize', resize);

/* 世界坐标 → 屏幕坐标 */
function toScreen(wx, wy){
  return {
    px: plotCX + wx * scaleX,
    py: plotCY - wy * scaleY
  };
}

/* =========================================================
   星空
   ========================================================= */
function buildStars(){
  stars.length = 0;
  const n = Math.min(220, Math.round(W * H / 8500));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.0 + 0.15,
      ph: Math.random() * TAU,
      sp: 0.22 + Math.random() * 0.85,
      hue: 210 + Math.random() * 70,
      base: 0.06 + Math.random() * 0.24
    });
  }
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;

/* 五声音阶：C D E G A（跨多个八度） */
const PENTA = [
  261.63, 293.66, 329.63, 392.00, 440.00,
  523.25, 587.33, 659.25, 783.99, 880.00,
  1046.50, 1174.66, 1318.51
];

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.50, ac.currentTime, 1.8);

  /* 背景环境：极轻的低频垫 */
  const o = ac.createOscillator();
  o.type = 'sine';
  o.frequency.value = 55;
  const og = ac.createGain();
  og.gain.value = 0.014;
  o.connect(og);
  og.connect(master);
  o.start();

  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.08;
  const lg = ac.createGain();
  lg.gain.value = 0.008;
  lfo.connect(lg);
  lg.connect(og.gain);
  lfo.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* ---- 分层音效：每加入一项触发 ---- */
function playLayer(n){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const freq = PENTA[Math.min(n - 1, PENTA.length - 1)];

  /* 主音 */
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.048, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0003, now + 0.62);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.68);

  /* 五度泛音，让音色更亮 */
  const osc2 = ac.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 1.5;

  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0, now + 0.02);
  g2.gain.linearRampToValueAtTime(0.022, now + 0.028);
  g2.gain.exponentialRampToValueAtTime(0.0002, now + 0.5);

  osc2.connect(g2);
  g2.connect(master);
  osc2.start(now + 0.02);
  osc2.stop(now + 0.55);

  /* 轻微敲击起音 */
  const nl = Math.max(1, Math.ceil(ac.sampleRate * 0.015));
  const nbuf = ac.createBuffer(1, nl, ac.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const tt = i / nl;
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - tt, 3.5);
  }
  const nsrc = ac.createBufferSource();
  nsrc.buffer = nbuf;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = freq * 3.2;
  bp.Q.value = 2.4;
  const ng = ac.createGain();
  ng.gain.value = 0.008;
  nsrc.connect(bp);
  bp.connect(ng);
  ng.connect(master);
  nsrc.start(now);
}

/* ---- 完成音效 ---- */
function playCompletion(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 上行大三和弦 + 高八度 */
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];

  for (let i = 0; i < notes.length; i++){
    const f = notes[i];

    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;

    const g = ac.createGain();
    const t0 = now + i * 0.07;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.055, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0003, t0 + 2.2);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 2.4);

    /* 高八度泛音 */
    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = f * 2;

    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.04);
    g2.gain.linearRampToValueAtTime(0.018, t0 + 0.06);
    g2.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.6);

    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.04);
    osc2.stop(t0 + 1.8);
  }
}

/* =========================================================
   粒子
   ========================================================= */
function spawnSparks(x, y, count){
  for (let i = 0; i < count; i++){
    const a = Math.random() * TAU;
    const sp = 80 + Math.random() * 260;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.5 + Math.random() * 1.4,
      size: 1.0 + Math.random() * 2.4,
      hue: 30 + Math.random() * 40
    });
  }
}

function updateSparks(dt){
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= s.decay * dt;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.94;
    s.vy *= 0.94;
  }
}

function drawSparks(){
  if (sparks.length === 0) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < sparks.length; i++){
    const s = sparks[i];
    const a = s.life * s.life * 0.85;
    const r = s.size * s.life;

    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4.5);
    g.addColorStop(0.00, 'hsla(' + s.hue + ', 100%, 88%, ' + a + ')');
    g.addColorStop(0.42, 'hsla(' + s.hue + ', 100%, 68%, ' + (a * 0.28) + ')');
    g.addColorStop(1.00, 'hsla(' + s.hue + ', 100%, 58%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制
   ========================================================= */
function drawBackground(t){
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.42, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  bg.addColorStop(0.00, '#0a1020');
  bg.addColorStop(0.42, '#050a16');
  bg.addColorStop(1.00, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.015) continue;
    ctx.fillStyle = 'hsla(' + s.hue + ', 80%, 86%, ' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* 网格 + 坐标轴 */
function drawGrid(){
  const left = plotCX - plotW * 0.5;
  const top  = plotCY - plotH * 0.5;

  /* 网格 */
  ctx.strokeStyle = 'rgba(80, 130, 210, 0.075)';
  ctx.lineWidth = 1;

  /* 垂直线：每 π/2 */
  const vStep = Math.PI * 0.5;
  const vCount = Math.floor(xRange / vStep);
  for (let i = -vCount; i <= vCount; i++){
    const wx = i * vStep;
    const { px } = toScreen(wx, 0);
    ctx.beginPath();
    ctx.moveTo(px, top);
    ctx.lineTo(px, top + plotH);
    ctx.stroke();
  }

  /* 水平线：每 0.5 */
  for (let i = -5; i <= 5; i++){
    const wy = i * 0.5;
    if (Math.abs(wy) > yRange) continue;
    const { py } = toScreen(0, wy);
    ctx.beginPath();
    ctx.moveTo(left, py);
    ctx.lineTo(left + plotW, py);
    ctx.stroke();
  }

  /* x 轴 */
  const { py: axisY } = toScreen(0, 0);
  ctx.beginPath();
  ctx.moveTo(left, axisY);
  ctx.lineTo(left + plotW, axisY);
  ctx.strokeStyle = 'rgba(90, 150, 230, 0.28)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* y 轴 */
  ctx.beginPath();
  ctx.moveTo(plotCX, top);
  ctx.lineTo(plotCX, top + plotH);
  ctx.strokeStyle = 'rgba(90, 150, 230, 0.28)';
  ctx.stroke();

  /* 轴上的 π 标记 */
  ctx.font = '400 10px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(140, 180, 240, 0.42)';

  const labels = [
    { x: -2 * Math.PI, txt: '−2π' },
    { x: -Math.PI,     txt: '−π' },
    { x: Math.PI,      txt: 'π' },
    { x: 2 * Math.PI,  txt: '2π' }
  ];
  for (let i = 0; i < labels.length; i++){
    const { px } = toScreen(labels[i].x, 0);
    ctx.fillText(labels[i].txt, px, axisY + 6);
  }

  /* y 轴刻度 */
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const yLabels = [-2, -1, 1, 2];
  for (let i = 0; i < yLabels.length; i++){
    const { py } = toScreen(0, yLabels[i]);
    ctx.fillText(String(yLabels[i]), plotCX - 8, py);
  }
}

/* sin(x) 参考曲线 */
function drawSinCurve(t){
  ctx.save();
  ctx.beginPath();
  ctx.rect(plotCX - plotW * 0.5 - 2, plotCY - plotH * 0.5 - 2,
           plotW + 4, plotH + 4);
  ctx.clip();

  const N = 500;
  ctx.beginPath();
  for (let i = 0; i <= N; i++){
    const wx = -xRange + 2 * xRange * i / N;
    const wy = Math.sin(wx);
    const { px, py } = toScreen(wx, wy);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(94, 200, 255, 0.18)';
  ctx.lineWidth = 9;
  ctx.lineJoin = 'round';
  ctx.stroke();

  /* 主体 */
  ctx.globalCompositeOperation = 'source-over';
  const grad = ctx.createLinearGradient(
    plotCX - plotW * 0.5, 0,
    plotCX + plotW * 0.5, 0
  );
  grad.addColorStop(0.00, 'rgba(94, 224, 255, 0.92)');
  grad.addColorStop(0.42, 'rgba(110, 190, 255, 0.96)');
  grad.addColorStop(0.78, 'rgba(150, 170, 255, 0.92)');
  grad.addColorStop(1.00, 'rgba(200, 160, 255, 0.88)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.4;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

/* 泰勒多项式曲线 */
function drawTaylorCurve(t){
  ctx.save();
  ctx.beginPath();
  ctx.rect(plotCX - plotW * 0.5 - 2, plotCY - plotH * 0.5 - 2,
           plotW + 4, plotH + 4);
  ctx.clip();

  const N = 620;
  ctx.beginPath();
  for (let i = 0; i <= N; i++){
    const wx = -xRange + 2 * xRange * i / N;
    const wy = taylorValue(wx, termFloat);
    /* 数值保护 */
    const safeWy = isFinite(wy) ? Math.max(-50, Math.min(50, wy)) : 0;
    const { px, py } = toScreen(wx, safeWy);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255, 160, 100, 0.16)';
  ctx.lineWidth = 10;
  ctx.lineJoin = 'round';
  ctx.stroke();

  /* 主体 */
  ctx.globalCompositeOperation = 'source-over';
  const grad = ctx.createLinearGradient(
    plotCX - plotW * 0.5, 0,
    plotCX + plotW * 0.5, 0
  );
  grad.addColorStop(0.00, 'rgba(255, 200, 130, 0.94)');
  grad.addColorStop(0.42, 'rgba(255, 160, 110, 0.96)');
  grad.addColorStop(0.78, 'rgba(255, 130, 140, 0.92)');
  grad.addColorStop(1.00, 'rgba(230, 130, 200, 0.88)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.4;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

/* 当前项数的最大误差 */
function computeMaxError(){
  let mx = 0;
  const N = 240;
  for (let i = 0; i <= N; i++){
    const x = -xRange + 2 * xRange * i / N;
    const s = Math.sin(x);
    const tv = taylorValue(x, termFloat);
    if (!isFinite(tv)) continue;
    const d = Math.abs(s - tv);
    if (d > mx) mx = d;
  }
  return mx;
}

/* 完成时的整体脉冲 */
function drawCompletionPulse(t){
  if (phase !== 'hold') return;
  const u = phaseT / HOLD_DUR;
  if (u > 0.85) return;

  const pulse = Math.sin(Math.min(1, u / 0.20) * Math.PI);
  if (pulse < 0.02) return;

  ctx.globalCompositeOperation = 'lighter';
  const r = Math.min(plotW, plotH) * 0.65 * (1 + 0.30 * pulse);
  const g = ctx.createRadialGradient(
    plotCX, plotCY, 0,
    plotCX, plotCY, r
  );
  g.addColorStop(0.00, 'rgba(255, 230, 190, ' + (0.14 * pulse) + ')');
  g.addColorStop(0.42, 'rgba(255, 180, 130, ' + (0.05 * pulse) + ')');
  g.addColorStop(1.00, 'rgba(255, 150, 200, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(plotCX, plotCY, r, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   公式 UI 构建
   ========================================================= */
const formulaTermsEl = document.getElementById('formulaTerms');
let termEls = [];

function buildFormulaUI(){
  if (!formulaTermsEl) return;
  formulaTermsEl.innerHTML = '';
  termEls = [];

  for (let i = 0; i < MAX_TERMS; i++){
    const power = 2 * i + 1;
    const sign = (i % 2 === 0) ? '+' : '−';

    if (i > 0){
      const op = document.createElement('span');
      op.className = 'op';
      op.textContent = sign;
      formulaTermsEl.appendChild(op);
    }

    const term = document.createElement('span');
    term.className = 'term';
    if (i === 0){
      term.textContent = 'x';
    } else {
      term.textContent = 'x' + toSup(power) + '/' + power + '!';
    }
    formulaTermsEl.appendChild(term);
    termEls.push(term);
  }

  /* 若超过 9 项，后面用省略号 */
  if (termEls.length > 9){
    for (let i = 9; i < termEls.length; i++){
      termEls[i].style.display = 'none';
    }
  }
}

function toSup(n){
  const map = {
    '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
    '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'
  };
  return String(n).split('').map(function(c){ return map[c] || c; }).join('');
}

function updateFormulaUI(){
  const full = Math.floor(termFloat);

  for (let i = 0; i < termEls.length; i++){
    if (i >= 9){ termEls[i].style.display = 'none'; continue; }

    if (i < full){
      termEls[i].classList.add('on');
      termEls[i].classList.remove('new');
    } else if (i === full && termFloat - full > 0.05){
      termEls[i].classList.add('new');
      termEls[i].classList.add('on');
    } else {
      termEls[i].classList.remove('on', 'new');
    }
  }
}

/* =========================================================
   主更新
   ========================================================= */
function update(dt){
  if (phase === 'grow'){
    phaseT += dt;
    termFloat += dt / GROW_DUR;

    if (termFloat >= MAX_TERMS){
      termFloat = MAX_TERMS;
      phase = 'hold';
      phaseT = 0;

      if (!completionPlayed){
        completionPlayed = true;
        playCompletion();
        spawnSparks(plotCX, plotCY, 36);
      }
    }

    /* 每增加一项播放分层音效 */
    const full = Math.floor(termFloat);
    if (full > lastPlayed){
      lastPlayed = full;
      playLayer(full);
    }

  } else if (phase === 'hold'){
    phaseT += dt;
    if (phaseT > HOLD_DUR){
      phase = 'fade';
      phaseT = 0;
    }

  } else if (phase === 'fade'){
    phaseT += dt;
    /* 淡出：同时降低显示项数 */
    termFloat = MAX_TERMS * (1 - phaseT / FADE_DUR);
    if (termFloat < 1) termFloat = 1;

    if (phaseT > FADE_DUR){
      /* 重置 */
      termFloat = 1;
      phase = 'grow';
      phaseT = 0;
      lastPlayed = 1;
      completionPlayed = false;
      sparks.length = 0;
    }
  }

  updateSparks(dt);
}

/* =========================================================
   渲染主函数
   ========================================================= */
function render(t){
  drawBackground(t);

  /* 绘图区域底衬 */
  const left = plotCX - plotW * 0.5;
  const top  = plotCY - plotH * 0.5;

  ctx.fillStyle = 'rgba(4, 8, 18, 0.42)';
  ctx.fillRect(left, top, plotW, plotH);

  ctx.strokeStyle = 'rgba(90, 140, 220, 0.12)';
  ctx.lineWidth = 1;
  ctx.strokeRect(left, top, plotW, plotH);

  drawGrid();
  drawSinCurve(t);
  drawTaylorCurve(t);
  drawCompletionPulse(t);
  drawSparks();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.82
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.90)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   HUD
   ========================================================= */
let hudTick = 0;

function updateHUD(){
  hudTick++;
  if (hudTick % 4 !== 0) return;

  const full = Math.floor(termFloat);
  const cnt = Math.max(1, full + ((termFloat - full > 0.1) ? 1 : 0));

  const tc = document.getElementById('termCount');
  if (tc) tc.textContent = cnt + ' 项';

  const mp = document.getElementById('maxPower');
  if (mp){
    const p = 2 * cnt - 1;
    mp.textContent = 'x' + toSup(p);
  }

  const me = document.getElementById('maxErr');
  if (me){
    const e = computeMaxError();
    if (e < 0.001) me.textContent = e.toExponential(2);
    else me.textContent = e.toFixed(4);
  }

  const st = document.getElementById('status');
  if (st){
    if (phase === 'hold'){
      st.textContent = '完美贴合';
    } else if (phase === 'fade'){
      st.textContent = '重新开始';
    } else if (cnt <= 2){
      st.textContent = '粗略近似';
    } else if (cnt <= 5){
      st.textContent = '逐渐逼近';
    } else if (cnt <= 8){
      st.textContent = '高度吻合';
    } else {
      st.textContent = '几乎重合';
    }
  }

  updateFormulaUI();
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  update(dt);
  render(t);
  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
function restartAnim(){
  termFloat = 1;
  phase = 'grow';
  phaseT = 0;
  lastPlayed = 1;
  completionPlayed = false;
  sparks.length = 0;
}

window.addEventListener('pointerdown', function(){
  initAudio();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    restartAnim();
  } else if (e.key === 'f' || e.key === 'F'){
    initAudio();
    /* 直接跳到完成 */
    termFloat = MAX_TERMS;
    phase = 'hold';
    phaseT = 0;
    lastPlayed = MAX_TERMS;
    if (!completionPlayed){
      completionPlayed = true;
      playCompletion();
      spawnSparks(plotCX, plotCY, 36);
    }
  }
});

/* =========================================================
   启动
   ========================================================= */
buildFormulaUI();
resize();
requestAnimationFrame(loop);

})();
</script>
