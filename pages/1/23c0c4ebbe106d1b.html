<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叶序方程与硅基花朵</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .formula-panel {
            width: 20%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid rgba(200, 100, 255, 0.2);
            background: radial-gradient(circle at center, rgba(30, 10, 50, 0.8) 0%, #000 100%);
            position: relative;
            overflow: hidden;
        }
        .formula-panel::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                transparent,
                transparent 10px,
                rgba(255, 100, 200, 0.05) 10px,
                rgba(255, 100, 200, 0.05) 11px
            );
            animation: spin 40s linear infinite;
            pointer-events: none;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .formula {
            font-size: 1.6vw;
            color: #e0b0ff;
            text-shadow: 0 0 10px #9d4edd, 0 0 20px #9d4edd;
            text-align: center;
            z-index: 1;
            line-height: 2;
            animation: pulse 3s ease-in-out infinite;
        }
        .formula sub, .formula sup {
            font-size: 0.8em;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; text-shadow: 0 0 10px #9d4edd, 0 0 20px #9d4edd; }
            50% { opacity: 1; text-shadow: 0 0 15px #e0b0ff, 0 0 30px #e0b0ff, 0 0 40px #9d4edd; }
        }
        .canvas-container {
            width: 80%;
            height: 100%;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="formula-panel">
            <div class="formula">
                r = c &radic;<span style="text-decoration: overline;">n</span><br>
                &theta; = n &times; 137.507&deg;
            </div>
        </div>
        <div class="canvas-container">
            <canvas id="c"></canvas>
        </div>
    </div>

    <script>
        "use strict";
        const cv = document.getElementById('c');
        const ctx = cv.getContext('2d');

        let W, H, CX, CY, S;

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = cv.parentElement.getBoundingClientRect();
            W = cv.width = rect.width * dpr;
            H = cv.height = rect.height * dpr;
            cv.style.width = rect.width + 'px';
            cv.style.height = rect.height + 'px';
            CX = W / 2;
            CY = H / 2;
            S = Math.min(W, H) / 800; // 根据画布大小调整缩放
        }
        window.addEventListener('resize', resize);
        resize();

        // ---------------- 基本参数与叶序数学 ----------------
        const TAU = Math.PI * 2;
        const GOLDEN_ANGLE = 137.507764 * Math.PI / 180;
        const N = 600; // 花朵晶格元素数量（花瓣/种子）
        const BASE_RADIUS = 9; // 基础径向系数

        // 颜色映射：霓虹紫、橙、绿
        function getSiliconHue(index, t, growth) {
            // 基于索引和时间的颜色循环
            let hue = (index * 0.6 + t * 30 + growth * 60) % 360;
            // 约束到目标色相区间：紫(270-300)，橙(15-45)，绿(100-140)
            if (hue < 60) return 30 + (hue * 0.3);          // 橙
            if (hue >= 60 && hue < 180) return 120 + (hue * 0.1); // 绿
            return 280 + (hue * 0.05);                       // 紫
        }

        function hsl(h, l, a) {
            return `hsla(${h}, 100%, ${l}%, ${a})`;
        }

        // ---------------- 绘制硅基花朵 ----------------
        function drawSiliconFlower(t) {
            ctx.save();
            ctx.translate(CX, CY);
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 整体生长与呼吸脉动
            const globalPulse = Math.sin(t * 0.8) * 0.5 + 0.5; // 0~1
            const growth = 0.3 + 0.7 * globalPulse;

            // 1. 绘制叶序螺旋骨架与花瓣线条
            for (let i = 0; i < N; i++) {
                const n = i + 1;
                // 叶序公式：r = c * sqrt(n), theta = n * 137.5度
                const r = Math.sqrt(n) * BASE_RADIUS * growth;
                const theta = n * GOLDEN_ANGLE + t * 0.15; // 整体缓慢旋转

                // 晶体摆动幅度（越靠近边缘摆动越大）
                const swayAmp = 5 + 25 * (r / (Math.sqrt(N) * BASE_RADIUS));
                const sway = Math.sin(t * 2.5 + n * 0.2) * swayAmp;
                const sway2 = Math.cos(t * 1.8 + n * 0.15) * swayAmp * 0.6;

                const x = Math.cos(theta) * (r + sway);
                const y = Math.sin(theta) * (r + sway2);

                // 颜色计算
                const hue = getSiliconHue(i, t, growth);
                const alpha = 0.15 + 0.5 * (n / N) * globalPulse;

                // 绘制花瓣晶体结构：从中心向外辐射的密集线条
                const lineLen = (12 + Math.sin(n * 0.5 + t * 4) * 8) * growth;
                const segments = 8; // 线段分段，模拟晶体棱角

                ctx.beginPath();
                ctx.moveTo(x, y);

                // 生成晶体尖端的多段线
                for (let m = 1; m <= segments; m++) {
                    const f = m / segments;
                    // 基础方向沿径向向外
                    let fx = x + Math.cos(theta) * f * lineLen;
                    let fy = y + Math.sin(theta) * f * lineLen;

                    // 垂直方向摆动，制造晶体棱角与灵活性
                    const perpX = -Math.sin(theta);
                    const perpY = Math.cos(theta);
                    const crystalWave = Math.sin(f * Math.PI * 2 + n * 0.3 + t * 5) * 8 * f;
                    
                    fx += perpX * crystalWave;
                    fy += perpY * crystalWave;

                    // 加上高频抖动
                    fx += Math.sin(t * 8 + n * 1.5) * 1.5;
                    fy += Math.cos(t * 7 + n * 1.5) * 1.5;

                    ctx.lineTo(fx, fy);
                }

                ctx.strokeStyle = hsl(hue, 55 + 30 * Math.sin(n), alpha);
                ctx.lineWidth = (0.4 + 1.2 * (1 - n / N)) * S;
                ctx.stroke();

                // 绘制尖端发光节点
                const tipX = x + Math.cos(theta) * lineLen;
                const tipY = y + Math.sin(theta) * lineLen;
                ctx.beginPath();
                ctx.arc(tipX, tipY, (0.8 + 1.5 * (1 - n / N)) * S, 0, TAU);
                ctx.fillStyle = hsl(hue, 80, 0.8 * globalPulse);
                ctx.fill();

                // 绘制次级连接线（增强晶体网结构）
                if (i % 3 === 0) {
                    const prevTheta = (n - 1) * GOLDEN_ANGLE + t * 0.15;
                    const prevR = Math.sqrt(n - 1) * BASE_RADIUS * growth;
                    const px = Math.cos(prevTheta) * prevR;
                    const py = Math.sin(prevTheta) * prevR;
                    
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(px, py);
                    ctx.strokeStyle = hsl(hue, 60, 0.08 * globalPulse);
                    ctx.lineWidth = 0.5 * S;
                    ctx.stroke();
                }
            }

            // 2. 绘制中心光晕（晶体核心）
            const coreHue = getSiliconHue(0, t, growth);
            const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 80 * growth * S);
            coreGrad.addColorStop(0, hsl(coreHue, 70, 0.4));
            coreGrad.addColorStop(0.5, hsl((coreHue + 60) % 360, 70, 0.15));
            coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 80 * growth * S, 0, TAU);
            ctx.fill();

            ctx.restore();
        }

        // ---------------- 发光数字花粉粒子系统 ----------------
        const pollen = [];
        function updatePollen(t) {
            // 生成花粉
            if (Math.random() < 0.15 && pollen.length < 200) {
                // 从花朵边缘附近生成
                const angle = Math.random() * TAU;
                const radius = (Math.sqrt(N) * BASE_RADIUS) * (0.5 + Math.random() * 0.5) * S;
                const x = CX + Math.cos(angle) * radius;
                const y = CY + Math.sin(angle) * radius;

                // 向外漂移的速度
                const speed = 0.5 + Math.random() * 2;
                pollen.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 1.5,
                    vy: Math.sin(angle) * speed + (Math.random() - 0.5) * 1.5,
                    life: 1.0,
                    decay: 0.003 + Math.random() * 0.005,
                    hue: Math.random() < 0.5 ? 280 + Math.random() * 30 : (Math.random() < 0.5 ? 30 : 120),
                    size: (0.5 + Math.random() * 1.5) * S
                });
            }

            // 更新并绘制花粉
            for (let i = pollen.length - 1; i >= 0; i--) {
                const p = pollen[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.99;
                p.vy *= 0.99;
                p.life -= p.decay;

                if (p.life <= 0) {
                    pollen.splice(i, 1);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, TAU);
                    ctx.fillStyle = hsl(p.hue, 100, 0.7, p.life * 0.8);
                    ctx.fill();

                    // 花粉光晕
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 3 * p.life, 0, TAU);
                    ctx.fillStyle = hsl(p.hue, 100, 0.4, p.life * 0.2);
                    ctx.fill();
                }
            }
        }

        // ---------------- 动画主循环 ----------------
        let T = 0;
        function frame() {
            T += 1 / 60;

            // 清屏与拖尾效果（参考附件中的处理方式）
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // 产生运动拖尾
            ctx.fillRect(0, 0, W, H);

            // 绘制硅基花朵
            drawSiliconFlower(T);

            // 绘制花粉粒子
            ctx.globalCompositeOperation = 'lighter';
            updatePollen(T);

            requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
    </script>
</body>
</html>
