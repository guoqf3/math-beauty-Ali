<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>阻尼振动衰减 · 欠阻尼</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #000304;
    color: #e6fff8;
    font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }

  /* ---------- 背景 ---------- */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 46% 50%, rgba(10,70,60,0.30) 0%, rgba(0,4,4,0) 58%),
      radial-gradient(ellipse at 80% 22%, rgba(30,90,60,0.10) 0%, rgba(0,4,4,0) 52%),
      linear-gradient(180deg, #020a0a 0%, #010505 55%, #000000 100%);
  }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 50% 48%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.86) 100%);
  }
  #scene { position: fixed; inset: 0; z-index: 1; }
  canvas { display: block; }

  /* ---------- UI ---------- */
  .ui { position: fixed; z-index: 4; pointer-events: none; }

  header.ui { top: 34px; left: 42px; }
  .tag {
    font-size: 11px; letter-spacing: .38em; color: #35c0a0;
    margin-bottom: 12px; text-transform: uppercase;
  }
  h1 {
    margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .14em;
    background: linear-gradient(92deg, #4fffc4 0%, #7dffe0 32%, #9de8b0 62%, #ffe98a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(70,230,180,.42));
  }
  .sub {
    margin-top: 10px; font-size: 11px; letter-spacing: .26em; color: #3d7a68;
  }

  .panel {
    left: 42px; bottom: 44px;
    padding: 18px 24px 16px; border-radius: 14px;
    background: linear-gradient(160deg, rgba(8,48,42,.42), rgba(3,10,10,.32));
    border: 1px solid rgba(70,230,180,.22);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    box-shadow:
      0 0 40px rgba(30,180,140,.12) inset,
      0 10px 44px rgba(0,0,0,.55);
  }
  .eq {
    font-family: "Cambria Math", Georgia, "Times New Roman", serif;
    font-size: 20px; line-height: 1.6; color: #d0fff0;
    text-shadow: 0 0 16px rgba(80,230,190,.40);
    margin: 3px 0; letter-spacing: .02em;
  }
  .eq.small { font-size: 13.5px; color: #8ac8b6; text-shadow: 0 0 12px rgba(50,180,150,.35); }
  .eq .hl  { color: #4fffc4; }
  .eq .hl2 { color: #ffe98a; }
  .eq .hl3 { color: #7de8ff; }

  .hint {
    right: 42px; bottom: 46px; font-size: 11px;
    letter-spacing: .22em; color: #3d7060; text-align: right; line-height: 1.9;
  }

  /* ---------- 启动层 ---------- */
  #startScreen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px;
    background: radial-gradient(circle at 50% 50%, rgba(4,26,22,.80), rgba(0,1,2,.96));
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: opacity 1s ease, visibility 1s ease;
  }
  #startScreen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  #startScreen .st {
    font-size: 12px; letter-spacing: .5em; color: #3fae92; text-indent: .5em;
  }
  #startBtn {
    pointer-events: auto; cursor: pointer;
    padding: 16px 52px; font-size: 15px; letter-spacing: .42em; text-indent: .42em;
    color: #e8fff8; background: rgba(16,80,66,.20);
    border: 1px solid rgba(90,255,200,.50); border-radius: 40px;
    font-family: inherit;
    box-shadow: 0 0 32px rgba(60,230,180,.35), 0 0 70px rgba(255,220,120,.10) inset;
    transition: all .35s ease;
    animation: pulseBtn 2.6s ease-in-out infinite;
  }
  #startBtn:hover {
    background: rgba(30,140,110,.32);
    box-shadow: 0 0 56px rgba(90,255,200,.65), 0 0 90px rgba(255,220,120,.22) inset;
    transform: translateY(-2px);
  }
  @keyframes pulseBtn {
    0%, 100% { box-shadow: 0 0 26px rgba(60,230,180,.28), 0 0 60px rgba(255,220,120,.10) inset; }
    50%      { box-shadow: 0 0 52px rgba(90,255,200,.60), 0 0 90px rgba(255,220,120,.22) inset; }
  }

  @media (max-width: 720px) {
    header.ui { top: 22px; left: 20px; }
    h1 { font-size: 19px; }
    .sub { font-size: 9px; }
    .panel { left: 20px; bottom: 24px; padding: 13px 16px; }
    .eq { font-size: 15px; }
    .eq.small { font-size: 11px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="scene"></div>
<div id="vignette"></div>

<header class="ui">
  <div class="tag">Oscillation · 11</div>
  <h1>阻尼振动衰减</h1>
  <div class="sub">DAMPED HARMONIC OSCILLATION · UNDERDAMPED</div>
</header>

<div class="panel ui">
  <div class="eq">x(t) = A e<sup>−βt</sup> cos(ω′t)</div>
  <div class="eq small">包络：±A e<sup>−βt</sup> &nbsp;·&nbsp; 阻尼比 ζ = β/ω₀</div>
  <div class="eq small">E ∝ e<sup>−2βt</sup> &nbsp;&nbsp;<span class="hl2">能量指数衰减</span></div>
  <div class="eq small">ω′ = ω₀√(1−ζ²) &nbsp;·&nbsp; 欠阻尼 ζ&lt;1</div>
</div>

<div class="hint ui">
  拖动鼠标 · 视角微调<br>
  滚轮 · 缩放
</div>

<div id="startScreen">
  <div class="st">DAMPED OSCILLATION FIELD</div>
  <button id="startBtn">启 动</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   0. 物理参数
   ============================================================ */
const A0      = 3.4;                        // 初始振幅
const BETA    = 0.30;                       // 阻尼系数 β
const OMEGA0  = 3.0;                        // 固有角频率 ω₀
const ZETA    = BETA / OMEGA0;              // 阻尼比 ζ ≈ 0.10
const OMEGA_D = OMEGA0 * Math.sqrt(1 - ZETA * ZETA);   // 阻尼角频率 ω′
const X_ANCHOR = -8.0;                      // 弹簧锚点 x
const LOOP_T   = 15.0;                      // 循环周期(秒)

/* ============================================================
   1. 全局
   ============================================================ */
let scene, camera, renderer, clock;
let t = 0;

let springMesh, ballMesh, ballGlow, ballCore;
let envPlaneL, envPlaneR, envRingL, envRingR;
let markL, markR, markBar;
let particles, pBaseX, pBaseY, pBaseZ, pPhase;
let anchorCap;

const dummy = new THREE.Object3D();

/* 相机 */
const CAM_CENTER = new THREE.Vector3(-2.4, 0, 0);
const CAM_DIST   = 17.5;
let camYaw = 0, camPitch = 0.13;
let tgtYaw = 0, tgtPitch = 0.13;
let tgtDist = CAM_DIST, camDist = CAM_DIST;

/* ============================================================
   2. 贴图
   ============================================================ */
function makeEnvelopeTexture() {
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');

  const g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  g.addColorStop(0.00, 'rgba(120,255,215,0.60)');
  g.addColorStop(0.18, 'rgba(70,230,190,0.34)');
  g.addColorStop(0.42, 'rgba(40,180,160,0.14)');
  g.addColorStop(0.72, 'rgba(25,110,120,0.04)');
  g.addColorStop(1.00, 'rgba(10,50,70,0.00)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);

  /* 同心环刻度 */
  ctx.strokeStyle = 'rgba(120,255,215,0.13)';
  for (let i = 1; i <= 9; i++) {
    ctx.lineWidth = (i % 3 === 0) ? 1.6 : 0.8;
    ctx.beginPath();
    ctx.arc(S/2, S/2, i * S / 20, 0, Math.PI * 2);
    ctx.stroke();
  }

  /* 十字准线 */
  ctx.strokeStyle = 'rgba(140,255,220,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(S/2, 0); ctx.lineTo(S/2, S); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, S/2); ctx.lineTo(S, S/2); ctx.stroke();

  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

function makeGlowTexture(r, g, b) {
  const S = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const grad = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grad.addColorStop(0.00, 'rgba(255,255,255,1)');
  grad.addColorStop(0.15, `rgba(${r},${g},${b},0.92)`);
  grad.addColorStop(0.44, `rgba(${r},${g},${b},0.26)`);
  grad.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

/* ============================================================
   3. 场景初始化
   ============================================================ */
let glowTexCyan, glowTexMint;

function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000808, 0.018);

  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.getElementById('scene').appendChild(renderer.domElement);

  /* ---------- 光照 ---------- */
  scene.add(new THREE.AmbientLight(0x88bbaa, 1.05));

  const key = new THREE.DirectionalLight(0xaaffdd, 1.00);
  key.position.set(5, 12, 10);
  scene.add(key);

  const fill = new THREE.DirectionalLight(0x55ffcc, 0.55);
  fill.position.set(-9, 4, -8);
  scene.add(fill);

  const warm = new THREE.DirectionalLight(0xffe088, 0.32);
  warm.position.set(0, -8, 6);
  scene.add(warm);

  /* ---------- 贴图 ---------- */
  glowTexCyan = makeGlowTexture(90, 255, 220);
  glowTexMint = makeGlowTexture(140, 255, 200);

  /* ---------- 背景粒子 ---------- */
  buildParticles();

  /* ---------- 弹簧锚点柱 ---------- */
  const capMat = new THREE.MeshStandardMaterial({
    color: 0x4fe8c0,
    emissive: 0x147a60,
    emissiveIntensity: 1.5,
    metalness: 0.55,
    roughness: 0.30
  });
  anchorCap = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1.9, 16), capMat);
  anchorCap.position.set(X_ANCHOR, 0, 0);
  scene.add(anchorCap);

  const capGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexCyan,
    color: 0x4fe8c0,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: 0.42
  }));
  capGlow.position.set(X_ANCHOR, 0, 0);
  capGlow.scale.set(1.8, 1.8, 1);
  scene.add(capGlow);

  /* ---------- 弹簧（InstancedMesh） ---------- */
  buildSpring();

  /* ---------- 振子小球 ---------- */
  buildBall();

  /* ---------- 包络平面 ---------- */
  buildEnvelope();

  /* ---------- 振幅刻度 ---------- */
  buildMarkers();

  clock = new THREE.Clock();

  addEventListener('resize', onResize);
  addEventListener('pointermove', onPointerMove);
  addEventListener('wheel', onWheel, { passive: true });

  /* 初始化一帧 */
  updateScene(0);

  animate();
}

/* ============================================================
   4. 弹簧
   ============================================================ */
const SPRING_N      = 250;
const SPRING_TURNS  = 17;
const SPRING_RADIUS = 0.36;

function buildSpring() {
  const geo = new THREE.SphereGeometry(0.082, 6, 5);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x4ae8c0,
    emissive: 0x1a8a6e,
    emissiveIntensity: 1.9,
    metalness: 0.60,
    roughness: 0.28
  });

  springMesh = new THREE.InstancedMesh(geo, mat, SPRING_N);
  springMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  springMesh.frustumCulled = false;
  scene.add(springMesh);
}

function updateSpring(ballX) {
  const len = ballX - X_ANCHOR;

  for (let i = 0; i < SPRING_N; i++) {
    const u = i / (SPRING_N - 1);
    const px = X_ANCHOR + u * len;
    const ang = u * SPRING_TURNS * Math.PI * 2;
    const py = Math.cos(ang) * SPRING_RADIUS;
    const pz = Math.sin(ang) * SPRING_RADIUS;

    dummy.position.set(px, py, pz);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    springMesh.setMatrixAt(i, dummy.matrix);
  }
  springMesh.instanceMatrix.needsUpdate = true;
}

/* ============================================================
   5. 振子小球
   ============================================================ */
function buildBall() {
  ballMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.46, 32, 24),
    new THREE.MeshStandardMaterial({
      color: 0x7dffd4,
      emissive: 0x22b890,
      emissiveIntensity: 1.7,
      metalness: 0.35,
      roughness: 0.22
    })
  );
  scene.add(ballMesh);

  ballGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexCyan,
    color: 0x60ffd0,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: 0.85
  }));
  ballGlow.scale.set(2.6, 2.6, 1);
  scene.add(ballGlow);

  ballCore = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexMint,
    color: 0xffffff,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    opacity: 0.62
  }));
  ballCore.scale.set(0.95, 0.95, 1);
  scene.add(ballCore);
}

/* ============================================================
   6. 包络平面
   ============================================================ */
const ENV_SIZE = 13.5;

function buildEnvelope() {
  const tex = makeEnvelopeTexture();

  const makeMat = () => new THREE.MeshBasicMaterial({
    map: tex,
    color: 0x45ffc8,
    transparent: true,
    opacity: 0.40,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  const geo = new THREE.PlaneGeometry(ENV_SIZE, ENV_SIZE);

  envPlaneL = new THREE.Mesh(geo, makeMat());
  envPlaneL.rotation.y = Math.PI / 2;
  scene.add(envPlaneL);

  envPlaneR = new THREE.Mesh(geo, makeMat());
  envPlaneR.rotation.y = Math.PI / 2;
  scene.add(envPlaneR);

  /* 边缘光环 */
  const ringGeo = new THREE.TorusGeometry(ENV_SIZE * 0.5, 0.022, 8, 120);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x7dffd8,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  envRingL = new THREE.Mesh(ringGeo, ringMat);
  envRingL.rotation.y = Math.PI / 2;
  scene.add(envRingL);

  envRingR = new THREE.Mesh(ringGeo, ringMat.clone());
  envRingR.rotation.y = Math.PI / 2;
  scene.add(envRingR);
}

/* ============================================================
   7. 振幅刻度球
   ============================================================ */
function buildMarkers() {
  const mkMat = () => new THREE.MeshStandardMaterial({
    color: 0x9dffe0,
    emissive: 0x40ffb0,
    emissiveIntensity: 3.2,
    metalness: 0.20,
    roughness: 0.20
  });

  const mGeo = new THREE.SphereGeometry(0.155, 18, 14);

  markL = new THREE.Mesh(mGeo, mkMat());
  scene.add(markL);

  markR = new THREE.Mesh(mGeo, mkMat());
  scene.add(markR);

  /* 连接横杆 */
  markBar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.018, 1, 8),
    new THREE.MeshBasicMaterial({
      color: 0x6dffcc,
      transparent: true,
      opacity: 0.42,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  markBar.rotation.z = Math.PI / 2;
  scene.add(markBar);
}

/* ============================================================
   8. 背景粒子
   ============================================================ */
const PCOUNT = 780;

function buildParticles() {
  const pos   = new Float32Array(PCOUNT * 3);
  const col   = new Float32Array(PCOUNT * 3);

  pBaseX = new Float32Array(PCOUNT);
  pBaseY = new Float32Array(PCOUNT);
  pBaseZ = new Float32Array(PCOUNT);
  pPhase = new Float32Array(PCOUNT);

  for (let i = 0; i < PCOUNT; i++) {
    const i3 = i * 3;
    const x = -20 + Math.random() * 34;
    const y = -9 + Math.random() * 18;
    const z = -12 + Math.random() * 24;

    pBaseX[i] = x;
    pBaseY[i] = y;
    pBaseZ[i] = z;
    pPhase[i] = Math.random() * Math.PI * 2;

    pos[i3]     = x;
    pos[i3 + 1] = y;
    pos[i3 + 2] = z;

    /* 青色 → 薄荷绿 → 少量暖金 */
    const k = Math.random();
    if (k < 0.14) {
      col[i3] = 1.0; col[i3 + 1] = 0.88; col[i3 + 2] = 0.46;
    } else {
      col[i3]     = 0.18 + 0.30 * k;
      col[i3 + 1] = 0.72 + 0.28 * k;
      col[i3 + 2] = 0.60 + 0.35 * (1 - k);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.11,
    vertexColors: true,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });

  particles = new THREE.Points(geo, mat);
  particles.frustumCulled = false;
  scene.add(particles);
}

/* ============================================================
   9. 场景更新
   ============================================================ */
function updateScene(time) {
  /* ---------- 物理量 ---------- */
  const env = A0 * Math.exp(-BETA * time);                 // 包络
  const x   = env * Math.sin(OMEGA_D * time);              // 位移

  /* ---------- 弹簧 ---------- */
  updateSpring(x);

  /* ---------- 小球 ---------- */
  ballMesh.position.set(x, 0, 0);
  ballGlow.position.set(x, 0, 0);
  ballCore.position.set(x, 0, 0);

  /* ---------- 包络平面 ---------- */
  envPlaneL.position.set(-env, 0, 0);
  envPlaneR.position.set( env, 0, 0);
  envRingL.position.set(-env, 0, 0);
  envRingR.position.set( env, 0, 0);

  /* 包络透明度随振幅微调 */
  const envA = 0.16 + 0.32 * Math.min(1, env / A0);
  envPlaneL.material.opacity = envA;
  envPlaneR.material.opacity = envA;
  envRingL.material.opacity  = 0.22 + 0.38 * Math.min(1, env / A0);
  envRingR.material.opacity  = 0.22 + 0.38 * Math.min(1, env / A0);

  /* ---------- 振幅刻度 ---------- */
  const markY = 2.75;
  markL.position.set(-env, markY, 0);
  markR.position.set( env, markY, 0);

  const mPulse = 1 + 0.18 * Math.sin(time * 5.0);
  markL.scale.setScalar(mPulse);
  markR.scale.setScalar(mPulse);

  markBar.position.set(0, markY, 0);
  markBar.scale.y = env * 2;

  /* ---------- 背景粒子浮动 ---------- */
  const pPos = particles.geometry.attributes.position.array;
  for (let i = 0; i < PCOUNT; i++) {
    const i3 = i * 3;
    const ph = pPhase[i];
    pPos[i3]     = pBaseX[i] + Math.cos(time * 0.45 + ph) * 0.34;
    pPos[i3 + 1] = pBaseY[i] + Math.sin(time * 0.72 + ph) * 0.40;
    pPos[i3 + 2] = pBaseZ[i] + Math.sin(time * 0.36 + ph * 1.7) * 0.34;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  /* ---------- 小球呼吸脉动 ---------- */
  const bp = 1 + 0.08 * Math.sin(time * 6.0);
  ballGlow.scale.set(2.6 * bp, 2.6 * bp, 1);
  ballCore.scale.set(0.95 * (1 + 0.15 * Math.sin(time * 9.0)), 0.95 * (1 + 0.15 * Math.sin(time * 9.0)), 1);
}

/* ============================================================
   10. 相机
   ============================================================ */
function updateCamera() {
  camYaw   += (tgtYaw   - camYaw)   * 0.055;
  camPitch += (tgtPitch - camPitch) * 0.055;
  camDist  += (tgtDist  - camDist)  * 0.060;

  const cp = Math.max(-0.55, Math.min(0.85, camPitch));

  camera.position.set(
    CAM_CENTER.x + camDist * Math.sin(camYaw) * Math.cos(cp),
    CAM_CENTER.y + camDist * Math.sin(cp),
    CAM_CENTER.z + camDist * Math.cos(camYaw) * Math.cos(cp)
  );
  camera.lookAt(CAM_CENTER);
}

/* ============================================================
   11. 事件
   ============================================================ */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function onPointerMove(e) {
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = (e.clientY / innerHeight) * 2 - 1;
  tgtYaw   = nx * 0.42;
  tgtPitch = 0.13 - ny * 0.30;
}

function onWheel(e) {
  tgtDist += e.deltaY * 0.012;
  tgtDist = Math.max(9, Math.min(32, tgtDist));
}

/* ============================================================
   12. 主循环
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.045);

  t += dt;
  if (t > LOOP_T) t = 0;

  updateScene(t);
  updateCamera();

  renderer.render(scene, camera);
}

/* ============================================================
   13. 科技感背景音效
   ============================================================ */
let audioStarted = false;

function startAudio() {
  if (audioStarted) return;
  audioStarted = true;

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();

    /* ---------- 总输出 ---------- */
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.46, ctx.currentTime + 5.5);
    master.connect(ctx.destination);

    /* ---------- 低频持续音 ---------- */
    const droneGain = ctx.createGain();
    droneGain.gain.value = 0.13;

    const droneFilter = ctx.createBiquadFilter();
    droneFilter.type = 'lowpass';
    droneFilter.frequency.value = 480;
    droneFilter.Q.value = 0.8;

    droneGain.connect(droneFilter);
    droneFilter.connect(master);

    /* 呼吸式调制 */
    const breathLfo = ctx.createOscillator();
    breathLfo.frequency.value = 0.10;
    const breathDepth = ctx.createGain();
    breathDepth.gain.value = 0.055;
    breathLfo.connect(breathDepth);
    breathDepth.connect(droneGain.gain);
    breathLfo.start();

    [55, 82.41, 110, 164.81, 220, 329.63].forEach((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = i % 2 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (Math.random() - 0.5) * 14;

      const g = ctx.createGain();
      g.gain.value = 0.48 / (i + 1.2);

      osc.connect(g);
      g.connect(droneGain);

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.032 + 0.048 * i;
      const lg = ctx.createGain();
      lg.gain.value = 0.28 * g.gain.value;
      lfo.connect(lg);
      lg.connect(g.gain);
      lfo.start();

      osc.start();
    });

    /* ---------- 噪声层 ---------- */
    const len = Math.floor(ctx.sampleRate * 4);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const nFilter = ctx.createBiquadFilter();
    nFilter.type = 'bandpass';
    nFilter.frequency.value = 1050;
    nFilter.Q.value = 1.25;

    const nGain = ctx.createGain();
    nGain.gain.value = 0.044;

    noise.connect(nFilter);
    nFilter.connect(nGain);
    nGain.connect(master);
    noise.start();

    const sweep1 = ctx.createOscillator();
    sweep1.frequency.value = 0.034;
    const sd1 = ctx.createGain();
    sd1.gain.value = 820;
    sweep1.connect(sd1);
    sd1.connect(nFilter.frequency);
    sweep1.start();

    const sweep2 = ctx.createOscillator();
    sweep2.frequency.value = 0.012;
    const sd2 = ctx.createGain();
    sd2.gain.value = 300;
    sweep2.connect(sd2);
    sd2.connect(nFilter.frequency);
    sweep2.start();

    /* ---------- 周期性拨弦音（与振动同频，带衰减包络） ---------- */
    function pluck() {
      if (!audioStarted) return;
      try {
        const now = ctx.currentTime;
        const base = 440 * (0.985 + Math.random() * 0.03);

        const osc = ctx.createOscillator();
        const g   = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(base, now);
        osc.frequency.exponentialRampToValueAtTime(base * 0.86, now + 1.3);

        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.026, now + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.45);

        osc.connect(g);
        g.connect(master);

        osc.start(now);
        osc.stop(now + 1.8);

        /* 上方五度泛音 */
        const osc2 = ctx.createOscillator();
        const g2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.value = base * 1.5;
        g2.gain.setValueAtTime(0.0001, now);
        g2.gain.exponentialRampToValueAtTime(0.010, now + 0.012);
        g2.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
        osc2.connect(g2);
        g2.connect(master);
        osc2.start(now);
        osc2.stop(now + 1.3);
      } catch (e) { /* ignore */ }

      setTimeout(pluck, 2100);
    }
    setTimeout(pluck, 900);

    /* ---------- 高频微弱泛音 ---------- */
    const shimmer = ctx.createOscillator();
    shimmer.type = 'sine';
    shimmer.frequency.value = 1760;
    const shGain = ctx.createGain();
    shGain.gain.value = 0.0048;

    const shLfo = ctx.createOscillator();
    shLfo.frequency.value = 0.055;
    const shDepth = ctx.createGain();
    shDepth.gain.value = 0.0038;
    shLfo.connect(shDepth);
    shDepth.connect(shGain.gain);
    shLfo.start();

    shimmer.connect(shGain);
    shGain.connect(master);
    shimmer.start();

  } catch (err) {
    console.warn('音频初始化失败：', err);
  }
}

/* ============================================================
   14. 启动
   ============================================================ */
init();

const startScreen = document.getElementById('startScreen');
const startBtn    = document.getElementById('startBtn');

startBtn.addEventListener('click', () => {
  startScreen.classList.add('hide');
  startAudio();
});
</script>
