<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>情绪波发光脑 · Emotional Wave Brain</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; }
  .hint {
    position:fixed; left:12px; bottom:10px;
    color:rgba(180,220,255,0.3);
    font:12px/1.6 -apple-system,"PingFang SC",sans-serif;
    letter-spacing:1.5px;
    user-select:none; pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">EMOTIONAL WAVE BRAIN · 自动漂浮 · 脉冲波动</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR, cx, cy, R;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W * 0.5;
  cy = H * 0.5;
  R  = Math.min(W, H) * 0.32;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

// ---------- 可调参数 ----------
const LAYERS        = 42;    // 脑回层数（线条密度）
const PTS_PER_LAYER = 120;   // 每层采样点数
const NUM_PULSES    = 220;   // 内部电流脉冲数量

let t    = 0;
let last = performance.now();

// ---------- 预生成每层波形参数 ----------
const layerParams = [];
for (let i = 0; i < LAYERS; i++) {
  layerParams.push({
    baseR: 0.12 + 0.82 * (i / (LAYERS - 1)),  // 从内到外的半径比例
    phase1: Math.random() * Math.PI * 2,
    phase2: Math.random() * Math.PI * 2,
    freq1: 3 + Math.random() * 5,
    freq2: 6 + Math.random() * 8,
    speed1: 0.25 + Math.random() * 0.6,
    speed2: 0.15 + Math.random() * 0.5
  });
}

// ---------- 脉冲对象 ----------
const pulses = [];
for (let i = 0; i < NUM_PULSES; i++) {
  pulses.push({
    layer: Math.floor(Math.random() * LAYERS),
    u: Math.random(),
    speed: 0.15 + Math.random() * 0.5,
    size: 1.2 + Math.random() * 2.8,
    hueShift: (Math.random() - 0.5) * 30
  });
}

// ---------- 情绪颜色映射：蓝(210) → 红(0) → 黄(60) ----------
function emotionColor(e, alpha = 1, light = 60) {
  let h;
  if (e < 0.5) {
    const k = e / 0.5;
    h = 210 - 210 * k;
  } else {
    const k = (e - 0.5) / 0.5;
    h = 0 + 60 * k;
  }
  return `hsla(${h}, 100%, ${light}%, ${alpha})`;
}

// ---------- 主循环 ----------
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
  last = now;
  t += dt;

  // 情绪值：0~1 剧烈波动
  const emotion = 0.5 + 0.5 * (
    Math.sin(t * 0.7) * 0.6 +
    Math.sin(t * 1.9) * 0.3 +
    Math.sin(t * 3.7) * 0.1
  );
  // 活跃度：0~1，控制起伏与脉冲速度
  const active = 0.5 + 0.5 * (
    Math.sin(t * 1.1) * 0.7 +
    Math.sin(t * 2.3) * 0.3
  );
  const waveAmp   = 0.04 + active * 0.14;
  const speedBase = 0.2 + active * 0.9;

  // 整体漂浮：微小圆周
  const offX = Math.sin(t * 0.5) * 15;
  const offY = Math.cos(t * 0.7) * 12;
  const ox = cx + offX;
  const oy = cy + offY;

  // 硬清屏（无拖尾）
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // ---- 1. 计算所有层的点 ----
  const allPts = [];
  const brainPath = new Path2D();

  for (let li = 0; li < LAYERS; li++) {
    const lp = layerParams[li];
    const rBase = R * lp.baseR;
    const pts = [];
    for (let pi = 0; pi <= PTS_PER_LAYER; pi++) {
      const theta = (pi / PTS_PER_LAYER) * Math.PI * 2;
      const wave = 1 +
        Math.sin(theta * lp.freq1 + lp.phase1 + t * lp.speed1) * waveAmp +
        Math.cos(theta * lp.freq2 + lp.phase2 - t * lp.speed2) * waveAmp * 0.7;
      const r = rBase * wave;
      const x = ox + Math.cos(theta) * r;
      const y = oy + Math.sin(theta) * r * 0.94;   // 稍微压扁，更像大脑
      pts.push({ x, y });
      if (pi === 0) brainPath.moveTo(x, y);
      else brainPath.lineTo(x, y);
    }
    brainPath.closePath();
    allPts.push(pts);
  }

  // ---- 2. 半透明填充：最外层轮廓 ----
  const outerPts = allPts[LAYERS - 1];
  const outerPath = new Path2D();
  outerPath.moveTo(outerPts[0].x, outerPts[0].y);
  for (let i = 1; i < outerPts.length; i++) {
    outerPath.lineTo(outerPts[i].x, outerPts[i].y);
  }
  outerPath.closePath();

  const grad = ctx.createRadialGradient(ox, oy, R * 0.1, ox, oy, R * 1.15);
  grad.addColorStop(0,   'hsla(210, 80%, 60%, 0.10)');
  grad.addColorStop(0.6, 'hsla(220, 70%, 45%, 0.06)');
  grad.addColorStop(1,   'hsla(230, 60%, 20%, 0)');
  ctx.fillStyle = grad;
  ctx.fill(outerPath);

  // ---- 3. 沟壑线条：发光双层描边 ----
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'lighter';

  // 粗辉光层
  ctx.strokeStyle = 'hsla(200, 80%, 60%, 0.07)';
  ctx.lineWidth = 3.5;
  ctx.stroke(brainPath);

  // 细核心层
  ctx.strokeStyle = 'hsla(190, 100%, 85%, 0.32)';
  ctx.lineWidth = 0.9;
  ctx.stroke(brainPath);

  // ---- 4. 内部电流脉冲 ----
  for (let p of pulses) {
    p.u += p.speed * speedBase * dt;
    if (p.u >= 1) p.u -= 1;

    const pts = allPts[p.layer];
    const idx = p.u * PTS_PER_LAYER;
    const i0  = Math.floor(idx);
    const i1  = (i0 + 1) % PTS_PER_LAYER;
    const frac = idx - i0;

    const x = pts[i0].x + (pts[i1].x - pts[i0].x) * frac;
    const y = pts[i0].y + (pts[i1].y - pts[i0].y) * frac;

    // 根据情绪值调整颜色，加一点个体偏移
    const e = Math.min(1, Math.max(0, emotion + p.hueShift / 100));
    const col     = emotionColor(e, 0.9, 65);
    const glowCol = emotionColor(e, 0.25, 70);

    // 光晕
    ctx.beginPath();
    ctx.arc(x, y, p.size * 3.5, 0, Math.PI * 2);
    ctx.fillStyle = glowCol;
    ctx.fill();

    // 核心
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
  }

  // ---- 5. 中心冰蓝高光 ----
  const centerGlow = ctx.createRadialGradient(ox, oy, 0, ox, oy, R * 0.5);
  centerGlow.addColorStop(0, 'hsla(200, 100%, 70%, 0.12)');
  centerGlow.addColorStop(1, 'hsla(200, 100%, 60%, 0)');
  ctx.fillStyle = centerGlow;
  ctx.beginPath();
  ctx.arc(ox, oy, R * 0.5, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
