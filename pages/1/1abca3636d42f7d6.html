<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>勾股定理 · 动态证明</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#05070f;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  /* ---- 左上标题 ---- */
  #title{
    position:absolute;top:0;left:0;
    padding:32px 40px;opacity:0;
    animation:fade 1.6s 0.2s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(130,190,255,.34);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(18px,2.6vw,32px);
    font-weight:200;letter-spacing:.30em;text-indent:.30em;
    background:linear-gradient(96deg,#5ea8ff 0%,#7ab8ff 34%,#b090ff 68%,#e090ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 26px rgba(110,150,255,.42));
  }
  #title .sub{
    font-size:10px;letter-spacing:.22em;line-height:1.9;
    color:rgba(170,195,240,.30);font-weight:300;
  }

  /* ---- 右上数据面板 ---- */
  #panel{
    position:absolute;top:0;right:0;
    padding:32px 40px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    text-align:right;
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #panel .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(140,180,240,.26);margin-bottom:8px;
  }
  .stat{
    display:flex;align-items:baseline;justify-content:flex-end;
    gap:10px;margin-bottom:7px;
    font-size:11px;letter-spacing:.08em;
    transition:opacity .5s;
    opacity:.32;
  }
  .stat.on{opacity:1;}
  .stat .nm{
    font-size:10px;letter-spacing:.14em;
    min-width:22px;text-align:right;
  }
  .stat .eq{
    color:rgba(180,200,245,.50);
  }
  .stat .val{
    font-size:13px;font-weight:600;
    min-width:34px;text-align:right;
    letter-spacing:.04em;
  }
  .stat.a .nm, .stat.a .val{color:#6ab8ff;}
  .stat.b .nm, .stat.b .val{color:#9a9eff;}
  .stat.c .nm, .stat.c .val{color:#c490ff;}

  /* ---- 底部公式 ---- */
  #formula{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:38px;
    display:flex;align-items:center;gap:14px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    white-space:nowrap;
    opacity:0;animation:fade 1.6s 1.4s ease forwards;
  }
  .fbox{
    display:flex;flex-direction:column;align-items:center;
    gap:4px;
    opacity:.22;
    transition:opacity .55s ease, transform .55s cubic-bezier(.34,1.56,.64,1);
    transform:scale(.92);
  }
  .fbox.on{
    opacity:1;
    transform:scale(1);
  }
  .fbox .sym{
    font-size:11px;letter-spacing:.14em;
  }
  .fbox .num{
    font-size:clamp(18px,2.4vw,28px);
    font-weight:600;letter-spacing:.04em;
    line-height:1;
  }
  .fbox.a .sym, .fbox.a .num{color:#6ab8ff;}
  .fbox.b .sym, .fbox.b .num{color:#9a9eff;}
  .fbox.c .sym, .fbox.c .num{color:#c490ff;}
  .fop{
    font-size:clamp(16px,2.2vw,24px);
    color:rgba(160,185,240,.55);
    font-weight:200;
  }

  /* ---- 右下按钮 ---- */
  #btns{
    position:absolute;bottom:0;right:0;
    padding:0 40px 32px;
    display:flex;gap:9px;
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
    pointer-events:auto;
  }
  .btn{
    font-family:inherit;
    font-size:9.5px;letter-spacing:.20em;text-indent:.20em;
    color:rgba(215,228,255,.85);
    background:rgba(22,32,60,.50);
    border:1px solid rgba(120,155,230,.28);
    border-radius:999px;
    padding:9px 18px;cursor:pointer;
    transition:.32s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    white-space:nowrap;
  }
  .btn:hover{
    border-color:rgba(180,220,255,.88);
    box-shadow:0 0 22px rgba(120,170,255,.40);
    background:rgba(60,95,165,.26);
    transform:translateY(-1px);
  }
  .btn:active{transform:translateY(0);}

  /* ---- 音效提示 ---- */
  #audioDot{
    position:absolute;bottom:0;left:40px;
    padding-bottom:32px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.20em;
    color:rgba(140,180,240,.28);
    opacity:0;animation:fade 1.6s 1.8s ease forwards;
    display:flex;align-items:center;gap:7px;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.28);
    transition:background .4s, box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,190,.92);
    box-shadow:0 0 9px rgba(140,240,190,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:680px){
    #title{padding:16px 18px;}
    #title .sub{display:none;}
    #panel{padding:16px 18px;}
    .stat{font-size:10px;gap:7px;margin-bottom:5px;}
    .stat .val{font-size:11px;min-width:28px;}
    #btns{padding:0 18px 18px;gap:6px;}
    .btn{padding:7px 12px;font-size:8.5px;letter-spacing:.12em;}
    #audioDot{left:18px;padding-bottom:18px;font-size:8px;}
    #formula{padding-bottom:22px;gap:9px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">PYTHAGOREAN THEOREM · VISUAL PROOF</div>
    <h1>勾股定理</h1>
    <div class="sub">
      直角三角形三边上的正方形<br>
      面积之和 · 几何证明
    </div>
  </div>

  <div id="panel">
    <span class="lab">AREA METRICS</span>
    <div class="stat a" id="statA">
      <span class="nm">a²</span>
      <span class="eq">=</span>
      <span class="val" id="valA">0</span>
    </div>
    <div class="stat b" id="statB">
      <span class="nm">b²</span>
      <span class="eq">=</span>
      <span class="val" id="valB">0</span>
    </div>
    <div class="stat c" id="statC">
      <span class="nm">c²</span>
      <span class="eq">=</span>
      <span class="val" id="valC">0</span>
    </div>
  </div>

  <div id="formula">
    <div class="fbox a" id="fboxA">
      <span class="sym">a²</span>
      <span class="num" id="fnumA">0</span>
    </div>
    <span class="fop" id="fop1">+</span>
    <div class="fbox b" id="fboxB">
      <span class="sym">b²</span>
      <span class="num" id="fnumB">0</span>
    </div>
    <span class="fop" id="fop2">=</span>
    <div class="fbox c" id="fboxC">
      <span class="sym">c²</span>
      <span class="num" id="fnumC">0</span>
    </div>
  </div>

  <div id="btns">
    <button class="btn" id="btnReplay">重 播</button>
    <button class="btn" id="btnSkip">跳 到 结 果</button>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>几何构建音 · 数字跳动音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, DPR = 1;

/* =========================================================
   三角形参数（勾股数）
   ========================================================= */
const PRESETS = [
  { a: 3, b: 4 },
  { a: 6, b: 8 },
  { a: 5, b: 12 },
  { a: 8, b: 15 }
];
let presetIdx = 0;

let A = 3, B = 4, C = 5;

function loadPreset(i){
  presetIdx = ((i % PRESETS.length) + PRESETS.length) % PRESETS.length;
  A = PRESETS[presetIdx].a;
  B = PRESETS[presetIdx].b;
  C = Math.sqrt(A * A + B * B);
}

/* 世界坐标中的三个顶点（直角在原点） */
function getPoints(){
  return {
    O: { x: 0, y: 0 },
    Px: { x: A, y: 0 },
    Py: { x: 0, y: B }
  };
}

/* 三条边及外法线（世界坐标） */
function getSquares(){
  const P = getPoints();

  /* 直角边 a：O → Px，向下（−y）为外侧 */
  const sqA = {
    p1: P.O,
    p2: P.Px,
    nx: 0, ny: -1,
    side: A,
    hueIn: 198, hueOut: 224
  };

  /* 直角边 b：O → Py，向左（−x）为外侧 */
  const sqB = {
    p1: P.O,
    p2: P.Py,
    nx: -1, ny: 0,
    side: B,
    hueIn: 216, hueOut: 250
  };

  /* 斜边 c：Py → Px，外法线垂直于边并背离原点 */
  const dx = P.Px.x - P.Py.x;
  const dy = P.Px.y - P.Py.y;
  const len = Math.hypot(dx, dy);
  let nx = -dy / len;
  let ny = dx / len;
  /* 确保背离原点：法线与原点方向点积应为负 */
  const midX = (P.Px.x + P.Py.x) * 0.5;
  const midY = (P.Px.y + P.Py.y) * 0.5;
  if (nx * (P.O.x - midX) + ny * (P.O.y - midY) > 0){
    nx = -nx; ny = -ny;
  }

  const sqC = {
    p1: P.Py,
    p2: P.Px,
    nx: nx, ny: ny,
    side: len,
    hueIn: 252, hueOut: 292
  };

  return { sqA, sqB, sqC };
}

/* =========================================================
   画布与投影
   ========================================================= */
let scale = 1, originX = 0, originY = 0;

function computeTransform(){
  const P = getPoints();
  const sq = getSquares();

  /* 世界坐标包围盒：四个角点 */
  function corners(s){
    const side = s.side;
    return [
      s.p1, s.p2,
      { x: s.p2.x + s.nx * side, y: s.p2.y + s.ny * side },
      { x: s.p1.x + s.nx * side, y: s.p1.y + s.ny * side }
    ];
  }

  let xMin = 1e9, xMax = -1e9, yMin = 1e9, yMax = -1e9;
  [sq.sqA, sq.sqB, sq.sqC].forEach(function(s){
    corners(s).forEach(function(c){
      if (c.x < xMin) xMin = c.x;
      if (c.x > xMax) xMax = c.x;
      if (c.y < yMin) yMin = c.y;
      if (c.y > yMax) yMax = c.y;
    });
  });

  const worldW = Math.max(0.001, xMax - xMin);
  const worldH = Math.max(0.001, yMax - yMin);

  /* 边距 */
  const padX = W * 0.20;
  const padY = H * 0.16;

  const availW = Math.max(80, W - padX * 2);
  const availH = Math.max(80, H - padY * 2);

  scale = Math.min(availW / worldW, availH / worldH);

  const wcx = (xMin + xMax) * 0.5;
  const wcy = (yMin + yMax) * 0.5;

  originX = W * 0.5 - wcx * scale;
  originY = H * 0.5 + wcy * scale;   /* y 轴翻转 */
}

function toScreen(wx, wy){
  return {
    x: originX + wx * scale,
    y: originY - wy * scale
  };
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeTransform();
}
window.addEventListener('resize', resize);

/* =========================================================
   动画时间轴
   ========================================================= */
const TL = {
  triangle: { start: 0.30, dur: 1.30 },
  sqA:      { start: 1.80, dur: 1.30 },
  sqB:      { start: 3.30, dur: 1.30 },
  sqC:      { start: 4.80, dur: 1.70 },
  finale:   { start: 6.70, dur: 1.30 }
};
const TOTAL = 8.20;

let animT = 0;
let playing = true;
let finished = false;

/* 各阶段进度 */
function prog(stage){
  const s = TL[stage];
  return Math.max(0, Math.min(1, (animT - s.start) / s.dur));
}

/* 缓动 */
function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
function easeOutBack(x){
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }

/* =========================================================
   数值显示（面积滚动）
   ========================================================= */
const areaState = {
  a: { target: 0, current: 0, shown: 0 },
  b: { target: 0, current: 0, shown: 0 },
  c: { target: 0, current: 0, shown: 0 }
};

function resetAreas(){
  areaState.a.target = A * A;
  areaState.b.target = B * B;
  areaState.c.target = C * C;
  areaState.a.current = 0;
  areaState.b.current = 0;
  areaState.c.current = 0;
  areaState.a.shown = 0;
  areaState.b.shown = 0;
  areaState.c.shown = 0;
}

function updateAreas(dt){
  /* a² 在 sqA 阶段滚动 */
  const pA = prog('sqA');
  if (pA > 0.35){
    const t = clamp01((pA - 0.35) / 0.60);
    areaState.a.current = easeOutCubic(t);
  }
  /* b² 在 sqB 阶段滚动 */
  const pB = prog('sqB');
  if (pB > 0.35){
    const t = clamp01((pB - 0.35) / 0.60);
    areaState.b.current = easeOutCubic(t);
  }
  /* c² 在 sqC 阶段滚动 */
  const pC = prog('sqC');
  if (pC > 0.45){
    const t = clamp01((pC - 0.45) / 0.55);
    areaState.c.current = easeOutCubic(t);
  }

  /* 计算显示值 */
  const va = Math.round(areaState.a.target * areaState.a.current);
  const vb = Math.round(areaState.b.target * areaState.b.current);
  const vc = Math.round(areaState.c.target * areaState.c.current);

  /* 数字跳动音 */
  tickNumberSound('a', va);
  tickNumberSound('b', vb);
  tickNumberSound('c', vc);

  areaState.a.shown = va;
  areaState.b.shown = vb;
  areaState.c.shown = vc;
}

/* 数字变化时触发音效 */
const lastShown = { a: -1, b: -1, c: -1 };
function tickNumberSound(key, val){
  if (val === lastShown[key]) return;
  if (lastShown[key] >= 0 && val > lastShown[key]){
    playNumberTick(key);
  }
  lastShown[key] = val;
}

/* =========================================================
   绘制工具
   ========================================================= */
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

/* =========================================================
   绘制单个正方形
   ========================================================= */
function drawSquare(sq, progress, pulse){
  if (progress <= 0.001) return;

  const p = easeOutCubic(progress);
  const side = sq.side;
  const Hh = side * p;

  /* 四个角（世界坐标） */
  const c1 = sq.p1;
  const c2 = sq.p2;
  const c3 = { x: sq.p2.x + sq.nx * Hh, y: sq.p2.y + sq.ny * Hh };
  const c4 = { x: sq.p1.x + sq.nx * Hh, y: sq.p1.y + sq.ny * Hh };

  /* 屏幕坐标 */
  const s1 = toScreen(c1.x, c1.y);
  const s2 = toScreen(c2.x, c2.y);
  const s3 = toScreen(c3.x, c3.y);
  const s4 = toScreen(c4.x, c4.y);

  /* ---- 内部柔和光晕 ---- */
  const cxW = (c1.x + c2.x + c3.x + c4.x) * 0.25;
  const cyW = (c1.y + c2.y + c3.y + c4.y) * 0.25;
  const cScr = toScreen(cxW, cyW);
  const diagLen = Math.hypot(s3.x - s1.x, s3.y - s1.y) * 0.5;

  ctx.globalCompositeOperation = 'lighter';
  const glowR = diagLen * 1.45;
  const gg = ctx.createRadialGradient(
    cScr.x, cScr.y, 0,
    cScr.x, cScr.y, glowR
  );
  gg.addColorStop(0.00, 'hsla(' + sq.hueIn + ', 95%, 68%, ' + (0.22 * p * pulse) + ')');
  gg.addColorStop(0.42, 'hsla(' + ((sq.hueIn + sq.hueOut) * 0.5) + ', 90%, 62%, ' + (0.09 * p) + ')');
  gg.addColorStop(1.00, 'hsla(' + sq.hueOut + ', 85%, 58%, 0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(cScr.x, cScr.y, glowR, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* ---- 填充：从内到外的渐变 ---- */
  const grad = ctx.createLinearGradient(s1.x, s1.y, s4.x, s4.y);
  const alphaBase = 0.30 + 0.28 * p;

  grad.addColorStop(0.00,
    'hsla(' + sq.hueIn + ', 92%, 62%, ' + (alphaBase * 0.85) + ')');
  grad.addColorStop(0.42,
    'hsla(' + ((sq.hueIn + sq.hueOut) * 0.5) + ', 88%, 56%, ' + (alphaBase * 0.72) + ')');
  grad.addColorStop(1.00,
    'hsla(' + sq.hueOut + ', 85%, 52%, ' + (alphaBase * 0.55) + ')');

  ctx.beginPath();
  ctx.moveTo(s1.x, s1.y);
  ctx.lineTo(s2.x, s2.y);
  ctx.lineTo(s3.x, s3.y);
  ctx.lineTo(s4.x, s4.y);
  ctx.closePath();

  ctx.fillStyle = grad;
  ctx.fill();

  /* ---- 单位网格（仅在 p 足够大时显示） ---- */
  if (p > 0.55 && side <= 8){
    const gridAlpha = (p - 0.55) / 0.45;
    const ux = (sq.p2.x - sq.p1.x) / side;
    const uy = (sq.p2.y - sq.p1.y) / side;

    ctx.beginPath();

    /* 平行于边的线 */
    const maxI = Math.min(Math.floor(Hh), side);
    for (let i = 1; i <= maxI; i++){
      const ax = sq.p1.x + sq.nx * i;
      const ay = sq.p1.y + sq.ny * i;
      const bx = ax + ux * side;
      const by = ay + uy * side;
      const sa = toScreen(ax, ay);
      const sb = toScreen(bx, by);
      ctx.moveTo(sa.x, sa.y);
      ctx.lineTo(sb.x, sb.y);
    }

    /* 垂直于边的线 */
    for (let i = 1; i < side; i++){
      const ax = sq.p1.x + ux * i;
      const ay = sq.p1.y + uy * i;
      const bx = ax + sq.nx * Hh;
      const by = ay + sq.ny * Hh;
      const sa = toScreen(ax, ay);
      const sb = toScreen(bx, by);
      ctx.moveTo(sa.x, sa.y);
      ctx.lineTo(sb.x, sb.y);
    }

    ctx.strokeStyle = 'hsla(' + ((sq.hueIn + sq.hueOut) * 0.5) + ', 80%, 82%, ' +
                      (0.14 * gridAlpha) + ')';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  /* ---- 轮廓 ---- */
  ctx.beginPath();
  ctx.moveTo(s1.x, s1.y);
  ctx.lineTo(s2.x, s2.y);
  ctx.lineTo(s3.x, s3.y);
  ctx.lineTo(s4.x, s4.y);
  ctx.closePath();

  ctx.strokeStyle = 'hsla(' + sq.hueOut + ', 92%, 78%, ' +
                    (0.42 + 0.42 * p * pulse) + ')';
  ctx.lineWidth = 1.8;
  ctx.lineJoin = 'round';
  ctx.stroke();

  /* 外发光描边 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'hsla(' + sq.hueOut + ', 100%, 72%, ' +
                    (0.10 * p * pulse) + ')';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';

  return { c3: c3, c4: c4 };
}

/* =========================================================
   绘制三角形
   ========================================================= */
function drawTriangle(progress){
  if (progress <= 0.001) return;

  const P = getPoints();
  const O  = toScreen(P.O.x,  P.O.y);
  const Px = toScreen(P.Px.x, P.Px.y);
  const Py = toScreen(P.Py.x, P.Py.y);

  /* 三条边分阶段绘制 */
  const seg = 1 / 3;
  const p1 = clamp01((progress) / seg);
  const p2 = clamp01((progress - seg) / seg);
  const p3 = clamp01((progress - seg * 2) / seg);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  /* 三角形填充 */
  if (progress > 0.1){
    ctx.beginPath();
    ctx.moveTo(O.x, O.y);
    ctx.lineTo(
      O.x + (Px.x - O.x) * easeOutCubic(p1),
      O.y + (Px.y - O.y) * easeOutCubic(p1)
    );
    if (p2 > 0){
      ctx.lineTo(Px.x, Px.y);
      ctx.lineTo(
        Px.x + (Py.x - Px.x) * easeOutCubic(p3),
        Px.y + (Py.y - Px.y) * easeOutCubic(p3)
      );
    }
    if (p3 > 0 && p2 > 0){
      ctx.lineTo(Py.x, Py.y);
      ctx.lineTo(Py.x + (O.x - Py.x) * easeOutCubic(p1), Py.y + (O.y - Py.y) * easeOutCubic(p1));
    }
    ctx.closePath();

    const tg = ctx.createLinearGradient(O.x, O.y, Px.x, Py.y);
    tg.addColorStop(0.00, 'rgba(150, 200, 255, 0.10)');
    tg.addColorStop(0.50, 'rgba(190, 180, 255, 0.14)');
    tg.addColorStop(1.00, 'rgba(220, 170, 255, 0.10)');
    ctx.fillStyle = tg;
    ctx.fill();
  }

  /* 三条边 */
  const edges = [
    { a: O,  b: Px, p: p1, c: '#7ac0ff' },
    { a: O,  b: Py, p: p2, c: '#9aa8ff' },
    { a: Py, b: Px, p: p3, c: '#c490ff' }
  ];

  for (let i = 0; i < edges.length; i++){
    const e = edges[i];
    if (e.p <= 0) continue;

    const ex = e.a.x + (e.b.x - e.a.x) * easeOutCubic(e.p);
    const ey = e.a.y + (e.b.y - e.a.y) * easeOutCubic(e.p);

    /* 外发光 */
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.moveTo(e.a.x, e.a.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = e.c.replace(')', ', 0.16)').replace('#', 'rgba(')
      .replace('rgba(', 'rgba(');
    /* 简化：手动设置 */
    ctx.strokeStyle = 'rgba(150, 200, 255, 0.16)';
    ctx.lineWidth = 9;
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';

    /* 主边 */
    ctx.beginPath();
    ctx.moveTo(e.a.x, e.a.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = e.c;
    ctx.lineWidth = 3.0;
    ctx.stroke();
  }

  /* 直角标记 */
  if (progress > 0.9){
    const markSize = Math.min(scale * 0.42, 22);
    ctx.beginPath();
    ctx.moveTo(O.x + markSize, O.y);
    ctx.lineTo(O.x + markSize, O.y - markSize);
    ctx.lineTo(O.x, O.y - markSize);
    ctx.strokeStyle = 'rgba(170, 210, 255, 0.72)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }
}

/* =========================================================
   边长标签
   ========================================================= */
function drawEdgeLabels(progress){
  if (progress < 0.35) return;

  const P = getPoints();
  const O  = toScreen(P.O.x,  P.O.y);
  const Px = toScreen(P.Px.x, P.Px.y);
  const Py = toScreen(P.Py.x, P.Py.y);

  const alpha = clamp01((progress - 0.35) / 0.5);

  ctx.font = '600 15px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /* a 标签：底边中点下方 */
  const ax = (O.x + Px.x) * 0.5;
  const ay = (O.y + Px.y) * 0.5;
  ctx.fillStyle = 'rgba(122, 192, 255, ' + alpha + ')';
  ctx.fillText('a = ' + A, ax, ay + 22);

  /* b 标签：左边中点左方 */
  const bx = (O.x + Py.x) * 0.5;
  const by = (O.y + Py.y) * 0.5;
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(154, 168, 255, ' + alpha + ')';
  ctx.fillText('b = ' + B, bx - 18, by);

  /* c 标签：斜边中点外侧 */
  const cxm = (Py.x + Px.x) * 0.5;
  const cym = (Py.y + Px.y) * 0.5;
  /* 法向外推 */
  const dxc = Px.x - Py.x;
  const dyc = Px.y - Py.y;
  const lenC = Math.hypot(dxc, dyc) || 1;
  const nx = -dyc / lenC;
  const ny = dxc / lenC;
  const sign = (nx * (O.x - cxm) + ny * (O.y - cym)) > 0 ? -1 : 1;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(196, 144, 255, ' + alpha + ')';
  ctx.fillText(
    'c = ' + (Math.round(C * 1000) / 1000),
    cxm + nx * sign * 30,
    cym + ny * sign * 30
  );
}

/* =========================================================
   面积数字（绘制在正方形中心）
   ========================================================= */
function drawAreaNumber(sq, progress, value, showValue){
  if (progress <= 0.55) return;

  const p = easeOutCubic(progress);
  const side = sq.side;
  const Hh = side * p;

  const c1 = sq.p1;
  const c2 = sq.p2;
  const c3 = { x: sq.p2.x + sq.nx * Hh, y: sq.p2.y + sq.ny * Hh };
  const c4 = { x: sq.p1.x + sq.nx * Hh, y: sq.p1.y + sq.ny * Hh };

  const cxW = (c1.x + c2.x + c3.x + c4.x) * 0.25;
  const cyW = (c1.y + c2.y + c3.y + c4.y) * 0.25;
  const cScr = toScreen(cxW, cyW);

  const alpha = clamp01((progress - 0.55) / 0.35);
  const scaleP = 0.6 + 0.4 * easeOutBack(alpha);

  /* 数字大小随正方形尺寸 */
  const diagScr = Math.hypot(
    toScreen(c3.x, c3.y).x - toScreen(c1.x, c1.y).x,
    toScreen(c3.x, c3.y).y - toScreen(c1.x, c1.y).y
  ) * 0.5;
  const fontSize = Math.max(14, Math.min(46, diagScr * 0.62));

  /* 背景光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const glowR = fontSize * 1.8;
  const gg = ctx.createRadialGradient(cScr.x, cScr.y, 0, cScr.x, cScr.y, glowR);
  gg.addColorStop(0.00, 'hsla(' + sq.hueOut + ', 100%, 78%, ' + (0.22 * alpha) + ')');
  gg.addColorStop(0.55, 'hsla(' + sq.hueOut + ', 100%, 68%, ' + (0.07 * alpha) + ')');
  gg.addColorStop(1.00, 'hsla(' + sq.hueOut + ', 100%, 60%, 0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(cScr.x, cScr.y, glowR, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 数字 */
  ctx.save();
  ctx.translate(cScr.x, cScr.y);
  ctx.scale(scaleP, scaleP);

  ctx.font = '600 ' + fontSize.toFixed(0) + 'px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /* 描边 */
  ctx.strokeStyle = 'rgba(8, 12, 26, ' + (0.75 * alpha) + ')';
  ctx.lineWidth = Math.max(2, fontSize * 0.14);
  ctx.lineJoin = 'round';
  ctx.strokeText(String(value), 0, 0);

  /* 填充 */
  ctx.fillStyle = 'hsla(' + sq.hueOut + ', 100%, 90%, ' + alpha + ')';
  ctx.fillText(String(value), 0, 0);

  ctx.restore();
}

/* =========================================================
   渲染
   ========================================================= */
function render(){
  /* 背景 */
  ctx.fillStyle = '#05070f';
  ctx.fillRect(0, 0, W, H);

  /* 中心光晕 */
  const bgG = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  bgG.addColorStop(0.00, 'rgba(30, 45, 100, 0.24)');
  bgG.addColorStop(0.42, 'rgba(18, 26, 62, 0.11)');
  bgG.addColorStop(1.00, 'rgba(4, 6, 14, 0)');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  /* 淡网格底纹 */
  const gridStep = Math.max(40, Math.round(Math.min(W, H) / 22));
  ctx.strokeStyle = 'rgba(70, 110, 190, 0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W + gridStep; x += gridStep){
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = 0; y <= H + gridStep; y += gridStep){
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  const sq = getSquares();

  /* 三个正方形（a、b 同时画，c 在它们之后） */
  const pA = prog('sqA');
  const pB = prog('sqB');
  const pC = prog('sqC');
  const pF = prog('finale');

  /* 完成后脉冲 */
  function pulseAt(p){
    if (p >= 1) return 1 + 0.06 * Math.sin((animT - 0) * 4 + 1);
    return 1 + 0.10 * Math.sin(p * Math.PI * 5);
  }

  /* ---- 正方形 a ---- */
  drawSquare(sq.sqA, pA, 1);
  /* ---- 正方形 b ---- */
  drawSquare(sq.sqB, pB, 1);
  /* ---- 正方形 c ---- */
  drawSquare(sq.sqC, pC, 1);

  /* ---- 三角形 ---- */
  drawTriangle(prog('triangle'));

  /* ---- 边长标签 ---- */
  drawEdgeLabels(prog('triangle'));

  /* ---- 面积数字 ---- */
  drawAreaNumber(sq.sqA, pA, areaState.a.shown, true);
  drawAreaNumber(sq.sqB, pB, areaState.b.shown, true);
  drawAreaNumber(sq.sqC, pC, areaState.c.shown, true);

  /* ---- 完成时的全屏柔光 ---- */
  if (pF > 0){
    const flash = Math.sin(clamp01(pF) * Math.PI);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(140, 170, 255, ' + (flash * 0.045) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 暗角 */
  const vg = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.32, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(3, 5, 12, 0.28)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.86)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let masterGain = null;
let audioReady = false;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  masterGain = ac.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(ac.destination);
  masterGain.gain.setTargetAtTime(0.50, ac.currentTime, 1.6);

  /* 环境底噪：轻微的低频嗡鸣 */
  const now = ac.currentTime;
  const o = ac.createOscillator();
  o.type = 'sine';
  o.frequency.value = 55;
  const og = ac.createGain();
  og.gain.value = 0.020;
  o.connect(og);
  og.connect(masterGain);
  o.start(now);

  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.07;
  const lg = ac.createGain();
  lg.gain.value = 0.010;
  lfo.connect(lg);
  lg.connect(og.gain);
  lfo.start(now);

  if (ac.state === 'suspended') ac.resume();
  setAudioOn(true);
}

/* ---- 几何构建音：短促、清亮的三角波 ---- */
function playConstruction(pitch){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const f = (pitch || 1) * (520 + Math.random() * 160);
  const osc = ac.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 1.18, now + 0.05);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.055, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 0.11);

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = f * 1.6;
  bp.Q.value = 3.0;

  osc.connect(bp);
  bp.connect(g);
  g.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.13);
}

/* ---- 数字跳动音：短促方波 ---- */
function playNumberTick(key){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const base = key === 'a' ? 1150 : key === 'b' ? 1340 : 1580;
  const f = base + Math.random() * 90;

  const osc = ac.createOscillator();
  osc.type = 'square';
  osc.frequency.value = f;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.016, now + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0003, now + 0.045);

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 3200;

  osc.connect(lp);
  lp.connect(g);
  g.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.06);
}

/* ---- 和弦：正方形完成时 ---- */
function playChord(key){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const roots = { a: 220, b: 246.94, c: 293.66 };
  const root = roots[key] || 220;

  [1, 1.2599, 1.4983].forEach(function(mult, i){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = root * mult;

    const g = ac.createGain();
    const t0 = now + i * 0.018;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.075, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0006, t0 + 1.1);

    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + 1.2);
  });
}

/* ---- 最终和弦 ---- */
function playFinale(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [261.63, 329.63, 392.00, 523.25];
  notes.forEach(function(f, i){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;

    const g = ac.createGain();
    const t0 = now + i * 0.10;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.065, t0 + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0004, t0 + 2.0);

    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + 2.2);
  });
}

/* =========================================================
   音效触发标记
   ========================================================= */
const flags = {
  tri1: false, tri2: false, tri3: false,
  sqA0: false, sqA1: false, sqB0: false, sqB1: false, sqC0: false, sqC1: false,
  fin: false
};

let lastConstructSound = 0;

function checkSounds(){
  const pTri = prog('triangle');
  const pA = prog('sqA');
  const pB = prog('sqB');
  const pC = prog('sqC');
  const pF = prog('finale');

  /* 三角形三条边的构建音 */
  if (pTri > 0.05 && pTri < 0.98){
    const now = performance.now();
    if (now - lastConstructSound > 130){
      lastConstructSound = now;
      playConstruction(1 + presetIdx * 0.08);
    }
  }

  /* 正方形生长过程中的构建音 */
  [pA, pB, pC].forEach(function(p, i){
    if (p > 0.02 && p < 0.98){
      const now = performance.now();
      if (now - lastConstructSound > 150){
        lastConstructSound = now;
        playConstruction(0.8 + i * 0.25);
      }
    }
  });

  /* 完成和弦 */
  if (pA >= 0.98 && !flags.sqA1){ flags.sqA1 = true; playChord('a'); }
  if (pB >= 0.98 && !flags.sqB1){ flags.sqB1 = true; playChord('b'); }
  if (pC >= 0.98 && !flags.sqC1){ flags.sqC1 = true; playChord('c'); }
  if (pF > 0.04 && !flags.fin){ flags.fin = true; playFinale(); }
}

/* =========================================================
   UI 更新
   ========================================================= */
let uiTick = 0;
function updateUI(){
  uiTick++;
  if (uiTick % 3 !== 0) return;

  const va = areaState.a.shown;
  const vb = areaState.b.shown;
  const vc = areaState.c.shown;

  /* 右上角数值 */
  const elA = document.getElementById('valA');
  const elB = document.getElementById('valB');
  const elC = document.getElementById('valC');
  if (elA) elA.textContent = va;
  if (elB) elB.textContent = vb;
  if (elC) elC.textContent = vc;

  /* 状态点亮 */
  const pA = prog('sqA'), pB = prog('sqB'), pC = prog('sqC');
  const stA = document.getElementById('statA');
  const stB = document.getElementById('statB');
  const stC = document.getElementById('statC');
  if (stA) stA.classList.toggle('on', pA > 0.35);
  if (stB) stB.classList.toggle('on', pB > 0.35);
  if (stC) stC.classList.toggle('on', pC > 0.35);

  /* 底部公式 */
  const fbA = document.getElementById('fboxA');
  const fbB = document.getElementById('fboxB');
  const fbC = document.getElementById('fboxC');
  const fnA = document.getElementById('fnumA');
  const fnB = document.getElementById('fnumB');
  const fnC = document.getElementById('fnumC');

  if (fbA) fbA.classList.toggle('on', pA > 0.50);
  if (fbB) fbB.classList.toggle('on', pB > 0.50);
  if (fbC) fbC.classList.toggle('on', pC > 0.55);

  if (fnA) fnA.textContent = va;
  if (fnB) fnB.textContent = vb;
  if (fnC) fnC.textContent = vc;
}

/* =========================================================
   重置 / 播放控制
   ========================================================= */
function resetAnim(){
  animT = 0;
  playing = true;
  finished = false;

  resetAreas();

  lastShown.a = -1;
  lastShown.b = -1;
  lastShown.c = -1;

  flags.tri1 = flags.tri2 = flags.tri3 = false;
  flags.sqA0 = flags.sqA1 = false;
  flags.sqB0 = flags.sqB1 = false;
  flags.sqC0 = flags.sqC1 = false;
  flags.fin = false;

  lastConstructSound = 0;
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;

  if (playing){
    animT += dt;
    if (animT >= TOTAL){
      animT = TOTAL;
      playing = false;
      finished = true;
    }
  }

  updateAreas(dt);
  checkSounds();
  render();
  updateUI();
}

/* =========================================================
   按钮
   ========================================================= */
document.getElementById('btnReplay').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  resetAnim();
});

document.getElementById('btnSkip').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  /* 直接跳到完成状态 */
  resetAnim();
  animT = TOTAL;
  playing = false;
  finished = true;
  areaState.a.current = 1;
  areaState.b.current = 1;
  areaState.c.current = 1;
  areaState.a.shown = A * A;
  areaState.b.shown = B * B;
  areaState.c.shown = Math.round(C * C);
  lastShown.a = areaState.a.shown;
  lastShown.b = areaState.b.shown;
  lastShown.c = areaState.c.shown;
  flags.sqA1 = flags.sqB1 = flags.sqC1 = true;
  flags.fin = true;
  playFinale();
});

/* 点击画布：首次交互启动音频 */
canvas.addEventListener('pointerdown', function(){
  initAudio();
});
window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    resetAnim();
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    resetAnim();
  }
});

/* =========================================================
   启动
   ========================================================= */
loadPreset(0);
resize();
resetAnim();
requestAnimationFrame(loop);

})();
