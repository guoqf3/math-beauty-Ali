<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>脉动生物 · 共生体 · Symbiont</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#020308;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:40px 46px;
    opacity:0;animation:fade 1.8s .4s ease forwards;
  }
  #title h1{
    font-size:clamp(18px,2.4vw,30px);
    font-weight:200;
    letter-spacing:.42em;text-indent:.42em;
    background:linear-gradient(96deg,#5ce0d0 0%,#7fb8ff 32%,#c48fff 62%,#ffb87a 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 26px rgba(90,200,220,.42));
  }
  #title .en{
    font-size:9.5px;letter-spacing:.50em;text-indent:.50em;
    color:rgba(150,190,220,.36);
  }

  #formula{
    position:absolute;bottom:0;left:0;
    padding:0 46px 34px;
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:clamp(9px,1.0vw,11.5px);
    line-height:2.05;
    letter-spacing:.02em;
    color:rgba(130,175,205,.28);
    max-width:min(820px,86vw);
  }
  #formula .lab{
    display:block;font-size:8.5px;
    letter-spacing:.44em;text-indent:.44em;
    color:rgba(110,155,185,.22);
    margin-bottom:10px;
  }
  #formula .kw{color:rgba(140,230,225,.58);}
  #formula .fn{color:rgba(130,200,255,.60);}
  #formula .nm{color:rgba(255,200,130,.64);}
  #formula .op{color:rgba(150,180,215,.30);}
  #formula .cm{color:rgba(110,150,180,.22);font-style:italic;}

  #hint{
    position:absolute;bottom:0;right:0;
    padding:0 46px 34px;
    text-align:right;
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  #hint .big{
    font-size:clamp(9.5px,1.0vw,12px);
    letter-spacing:.34em;text-indent:.34em;
    color:rgba(255,200,130,.42);
    margin-bottom:10px;font-weight:300;
  }
  #hint .small{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(140,175,205,.24);
    line-height:1.9;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:20px 20px;}
    #formula{padding:0 20px 18px;font-size:7.5px;}
    #hint{padding:0 20px 18px;}
    #hint .small{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <h1>脉动生物 · 共生体</h1>
    <div class="en">SYMBIONT · PULSE ORGANISM II</div>
  </div>

  <div id="formula">
    <span class="lab">MULTIPLICATIVE MODULATION</span>
    <span class="kw">const</span> <span class="fn">form</span> <span class="op">=</span> (a,t) <span class="op">=&gt;</span> <span class="nm">1</span>
    <span class="op">+</span> <span class="nm">.26</span><span class="op">·</span>sin(<span class="nm">4</span>a<span class="op">+</span><span class="nm">.85</span>t)<span class="op">·</span>cos(<span class="nm">2</span>a<span class="op">−</span><span class="nm">.45</span>t)
    <span class="op">+</span> <span class="nm">.15</span><span class="op">·</span>sin(<span class="nm">7</span>a<span class="op">−</span><span class="nm">1.15</span>t)<span class="op">·</span>sin(<span class="nm">3</span>a<span class="op">+</span><span class="nm">.55</span>t)
    <span class="op">+</span> <span class="nm">.09</span><span class="op">·</span>sin(<span class="nm">11</span>a<span class="op">+</span><span class="nm">1.55</span>t)
    <span class="op">+</span> <span class="nm">.05</span><span class="op">·</span>sin(<span class="nm">17</span>a<span class="op">−</span><span class="nm">2.10</span>t)
    <span class="cm">&nbsp;&nbsp;// + 10 触手 · 36 节点 · 脉动核心</span>
  </div>

  <div id="hint">
    <div class="big">乘法调制 · 触手共生</div>
    <div class="small">
      PRODUCT OF SINE WAVES<br>
      TENTACLES · NODES · CORE
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 基础
   ========================================================= */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, R = 0;

const TAU = Math.PI * 2;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.5;
  R  = Math.min(W, H) * 0.20;
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   1. ★ 乘法调制的形态函数 ★
   与上一版不同：不再是四个正弦直接相加，
   而是让低频与高频相乘 —— 产生"瓣状/触手状"有机轮廓。
   ========================================================= */
const form = (a, t) =>
  1
  + 0.26 * Math.sin(4 * a + t * 0.85) * Math.cos(2 * a - t * 0.45)
  + 0.15 * Math.sin(7 * a - t * 1.15) * Math.sin(3 * a + t * 0.55)
  + 0.09 * Math.sin(11 * a + t * 1.55)
  + 0.05 * Math.sin(17 * a - t * 2.10);

/* =========================================================
   2. 参数
   ========================================================= */
const BODY_N     = 320;   // 身体轮廓采样数
const TENTACLES  = 10;    // 触手数量
const TENT_STEPS = 36;    // 每条触手的采样段
const MEMBRANES  = 4;     // 同心膜层数
const NODES      = 36;    // 身体边缘发光节点
const BLOBS      = 64;    // 环绕漂浮粒子

const GOLDEN = 2.399963229728653;

/* =========================================================
   3. 主循环
   ========================================================= */
let T0 = performance.now();

function frame(now){
  requestAnimationFrame(frame);

  const t = (now - T0) / 1000;

  /* ---------- 清屏 ---------- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#020308';
  ctx.fillRect(0, 0, W, H);

  /* ---------- 加法混合 ---------- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  /* ---------- 呼吸 ---------- */
  const breath = 1 + 0.055 * Math.sin(t * 0.68);

  /* ---------- 生物背后的大范围冷光 ---------- */
  const halo = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 2.4);
  halo.addColorStop(0.00, 'rgba(28, 78, 108, 0.22)');
  halo.addColorStop(0.38, 'rgba(46, 40, 110, 0.09)');
  halo.addColorStop(1.00, 'rgba(10, 8, 26, 0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);

  /* =======================================================
     4. 触手 —— 从身体边缘甩出的共生触角
     ======================================================= */
  for (let i = 0; i < TENTACLES; i++){
    const baseAng = (i / TENTACLES) * TAU + 0.14 * Math.sin(t * 0.28 + i * 0.9);
    const hue     = (172 + i * 14 + t * 6) % 360;

    /* 每条触手摆动相位各不相同 */
    const swayA = Math.sin(t * 1.15 + i * 1.30) * 0.42;
    const swayB = Math.sin(t * 1.75 + i * 0.65) * 0.22;

    /* 触手长度随时间伸缩 */
    const lenK = 0.55 + 0.45 * Math.sin(t * 1.05 + i * 0.75);

    ctx.beginPath();
    for (let j = 0; j <= TENT_STEPS; j++){
      const p = j / TENT_STEPS;

      /* 根部贴合身体表面 */
      const r0 = R * 0.94 * breath * form(baseAng, t);

      /* 向外伸展 */
      const ext = R * 0.90 * lenK * p * p;   // 用 p² 让触手尖更细长

      /* 弯曲摆动 */
      const ang = baseAng + swayA * p + swayB * p * p
                + 0.10 * Math.sin(t * 2.1 + i + p * 3.4) * p;

      const rr = r0 + ext;
      const x  = CX + Math.cos(ang) * rr;
      const y  = CY + Math.sin(ang) * rr;

      if (j) ctx.lineTo(x, y);
      else   ctx.moveTo(x, y);
    }

    /* 外层柔光 */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ', 90%, 62%, 0.09)';
    ctx.lineWidth = 7.5;
    ctx.stroke();

    /* 内核亮线 */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ', 95%, 78%, 0.38)';
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }

  /* =======================================================
     5. 身体 —— 四层同心脉动膜
     ======================================================= */
  for (let m = 0; m < MEMBRANES; m++){
    const km     = m / (MEMBRANES - 1);
    const scale  = (0.52 + km * 0.48) * breath;
    const phase  = m * 0.42;

    /* 色相：内层青绿 → 外层品红 */
    const hue = (172 + km * 148 + t * 8) % 360;

    ctx.beginPath();
    for (let i = 0; i <= BODY_N; i++){
      const a  = (i / BODY_N) * TAU;
      const rr = R * scale * form(a + phase, t);
      const x  = CX + Math.cos(a) * rr;
      const y  = CY + Math.sin(a) * rr;
      if (i) ctx.lineTo(x, y);
      else   ctx.moveTo(x, y);
    }
    ctx.closePath();

    /* 外层光晕 */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ', 88%, 62%, ' +
                      (0.042 + km * 0.055).toFixed(3) + ')';
    ctx.lineWidth = 13 - km * 5;
    ctx.stroke();

    /* 内核细线 */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ', 94%, ' +
                      (66 + km * 22).toFixed(0) + '%, ' +
                      (0.28 + km * 0.36).toFixed(3) + ')';
    ctx.lineWidth = 0.9 + km * 1.4;
    ctx.stroke();
  }

  /* =======================================================
     6. 边缘发光节点 —— 沿最外层膜分布
     ======================================================= */
  for (let i = 0; i < NODES; i++){
    const a  = (i / NODES) * TAU;
    const rr = R * 1.0 * breath * form(a, t);
    const x  = CX + Math.cos(a) * rr;
    const y  = CY + Math.sin(a) * rr;

    const ps  = 1.3 + 2.2 * Math.abs(Math.sin(t * 2.4 + i * 0.55));
    const hue = (172 + i * 4.2 + t * 14) % 360;

    /* 光晕 */
    const gg = ctx.createRadialGradient(x, y, 0, x, y, ps * 4.2);
    gg.addColorStop(0.00, 'hsla(' + hue.toFixed(1) + ', 95%, 85%, 0.62)');
    gg.addColorStop(0.38, 'hsla(' + hue.toFixed(1) + ', 90%, 66%, 0.17)');
    gg.addColorStop(1.00, 'hsla(' + hue.toFixed(1) + ', 90%, 60%, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(x, y, ps * 4.2, 0, TAU);
    ctx.fill();

    /* 亮核 */
    ctx.fillStyle = 'hsla(' + hue.toFixed(1) + ', 98%, 94%, 0.92)';
    ctx.beginPath();
    ctx.arc(x, y, ps * 0.38, 0, TAU);
    ctx.fill();
  }

  /* =======================================================
     7. 脉动核心
     ======================================================= */
  const coreR = R * 0.125 * (1 + 0.34 * Math.sin(t * 1.75));

  const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR * 4.6);
  cg.addColorStop(0.00, 'rgba(245, 255, 252, 0.94)');
  cg.addColorStop(0.18, 'rgba(150, 245, 232, 0.56)');
  cg.addColorStop(0.48, 'rgba(190, 110, 235, 0.17)');
  cg.addColorStop(1.00, 'rgba(170, 60, 200, 0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(CX, CY, coreR * 4.6, 0, TAU);
  ctx.fill();

  /* 核心最亮点 */
  ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
  ctx.beginPath();
  ctx.arc(CX, CY, coreR * 0.32, 0, TAU);
  ctx.fill();

  /* =======================================================
     8. 环绕漂浮粒子
     ======================================================= */
  for (let i = 0; i < BLOBS; i++){
    const a  = i * GOLDEN + t * (0.14 + (i % 5) * 0.075);
    const rr = R * (0.16 + 0.78 * Math.pow((i % 13) / 13, 0.72)) * breath;

    const x = CX + Math.cos(a) * rr;
    const y = CY + Math.sin(a) * rr;

    const s   = 0.9 + 1.8 * Math.abs(Math.sin(t * 2.6 + i * 1.1));
    const hue = (172 + (i % 10) * 14 + t * 18) % 360;

    ctx.fillStyle = 'hsla(' + hue.toFixed(1) + ', 92%, 78%, 0.40)';
    ctx.beginPath();
    ctx.arc(x, y, s, 0, TAU);
    ctx.fill();
  }

  /* =======================================================
     9. 暗角
     ======================================================= */
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(
    CX, CY, Math.min(W, H) * 0.28,
    CX, CY, Math.max(W, H) * 0.78
  );
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   10. 启动
   ========================================================= */
T0 = performance.now();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
