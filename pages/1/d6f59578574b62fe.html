<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高斯-博内定理 · 微分几何变色龙</title>
<style>
  :root{ --split: 20%; }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
  }

  /* ================= 左侧：高斯-博内定理 ================= */
  #left{
    position:fixed; left:0; top:0; bottom:0;
    width: var(--split);
    display:flex; align-items:center; justify-content:center;
    padding: 18px 9px;
    background:
      radial-gradient(120% 80% at 20% 22%, rgba(40,255,90,.07), transparent 62%),
      radial-gradient(120% 80% at 80% 84%, rgba(255,30,220,.06), transparent 62%),
      #000;
    border-right:1px solid rgba(70,255,120,.16);
    color:#8dffb0;
    font-family:"Cambria Math","Latin Modern Math","Times New Roman",serif;
    overflow:hidden;
    z-index:2;
  }
  #left::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(60,255,110,.05) 50%, transparent 100%);
    background-size:100% 220%;
    animation: scan 10s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ from{ background-position: 0 -110%; } to{ background-position: 0 110%; } }

  .stack{ width:100%; text-align:center; position:relative; z-index:1; }

  .kicker{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(7px, .55vw, 10px);
    letter-spacing:.30em;
    color: rgba(120,255,150,.48);
    margin-bottom: 1.9em;
    white-space: nowrap;
  }

  .eq{
    font-size: clamp(8px, .95vw, 16px);
    line-height: 1.95;
    color:#9dffbe;
    text-shadow:
      0 0 10px rgba(50,255,110,.55),
      0 0 26px rgba(0,220,90,.20);
    animation: pulse 5.8s ease-in-out infinite;
    word-break: keep-all;
  }
  .eq.big{
    font-size: clamp(9px, 1.05vw, 18px);
    color:#b8ffcd;
  }
  .eq i{ font-style: italic; }
  .eq b{
    font-weight:600; color:#ff44dd;
    text-shadow: 0 0 10px rgba(255,60,220,.7), 0 0 24px rgba(255,0,200,.32);
  }
  .eq sup, .eq sub{ font-size:.6em; }

  @keyframes pulse{
    0%,100%{ opacity:.84; }
    50%    { opacity:1; }
  }

  .rule{
    height:1px; width:62%;
    margin: 1.55em auto;
    background:linear-gradient(90deg, transparent, rgba(90,255,130,.42), transparent);
  }

  .meta{
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(7px, .54vw, 10px);
    letter-spacing:.18em;
    color: rgba(160,255,190,.6);
    white-space: nowrap;
  }
  .dot{
    display:inline-block; width:.6em; height:.6em; border-radius:50%;
    vertical-align:middle; margin:0 .35em 0 .1em;
  }
  .dot.gr{ background:#39ff14; box-shadow:0 0 10px #39ff14, 0 0 22px rgba(57,255,20,.6); }
  .dot.mg{ background:#ff22cc; box-shadow:0 0 10px #ff22cc, 0 0 22px rgba(255,34,204,.6); }

  /* ================= 右侧：变色龙 ================= */
  #right{
    position:fixed; left: var(--split); top:0; right:0; bottom:0;
    background:#000;
    overflow:hidden;
  }
  #right canvas{ display:block; position:absolute; inset:0; }

  @media (max-width: 900px){
    :root{ --split: 27%; }
    .kicker{ letter-spacing:.18em; }
    .meta{ letter-spacing:.08em; }
  }
</style>
</head>
<body>

<!-- ============ 左：公式 ============ -->
<div id="left">
  <div class="stack">
    <div class="kicker">GAUSS–BONNET</div>

    <div class="eq big">
      ∫<sub>M</sub> <i>K</i> d<i>A</i> &nbsp;+&nbsp; ∮<sub>∂M</sub> <i>k</i><sub>g</sub> d<i>s</i>
      &nbsp;=&nbsp; 2π χ(<i>M</i>)
    </div>

    <div class="rule"></div>

    <div class="eq">
      χ(<i>M</i>) = 2 − 2<i>g</i> − <i>b</i>
    </div>

    <div class="rule"></div>

    <div class="eq">
      <b>K</b> = <span style="white-space:nowrap">
        <i>R</i><sub>1212</sub> / det(<i>g</i>)
      </span>
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span class="dot gr"></span>测地线 &nbsp;·&nbsp;
      <span class="dot mg"></span>曲率流
    </div>
  </div>
</div>

<!-- ============ 右：场景 ============ -->
<div id="right"></div>

<script>
(function () {
  "use strict";

  /* =========================================================
     0. 画布与自适应
     ========================================================= */
  const host = document.getElementById('right');
  const cv = document.createElement('canvas');
  host.appendChild(cv);
  const ctx = cv.getContext('2d');

  const TAU = Math.PI * 2;
  let W, H, CX, CY, S, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = host.clientWidth  || 1;
    H = host.clientHeight || 1;
    cv.width  = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W * 0.5;
    CY = H * 0.5;
    /* 世界坐标约 1.9 × 1.1，留出边距 */
    S = Math.min(W * 0.44, H * 0.80);
  }
  window.addEventListener('resize', resize);

  /* =========================================================
     1. 中轴曲线：吻 → 头 → 颈 → 躯干 → 卷尾
     ========================================================= */
  const CTRL = [];
  (function buildCtrl() {
    const body = [
      [-1.05,  0.00],   // 吻
      [-0.92, -0.13],
      [-0.78, -0.27],   // 头顶
      [-0.63, -0.30],
      [-0.50, -0.19],   // 颈
      [-0.36, -0.16],
      [-0.17, -0.28],
      [ 0.05, -0.36],   // 背隆
      [ 0.27, -0.32],
      [ 0.46, -0.18],
      [ 0.60,  0.02]    // 尾根
    ];
    for (const p of body) CTRL.push(p);

    /* 卷尾：对数螺线 */
    const cx = 0.48, cy = 0.40;
    const rx = 0.60, ry = 0.02;
    const a0 = Math.atan2(ry - cy, rx - cx);
    const r0 = Math.hypot(rx - cx, ry - cy);
    const N = 30, TURNS = 1.45;
    for (let i = 1; i <= N; i++) {
      const f = i / N;
      const a = a0 + TURNS * TAU * f;
      const r = r0 * Math.pow(0.10, f);
      CTRL.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  })();

  function cr(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return [
      0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t
        + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2
        + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
      0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t
        + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2
        + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
    ];
  }

  /* 按弧长均匀重采样 */
  const LINE = [];
  (function buildLine() {
    const P = CTRL, n = P.length, SUB = 12;
    const raw = [];
    for (let i = 0; i < n - 1; i++) {
      const p0 = P[Math.max(0, i - 1)], p1 = P[i],
            p2 = P[i + 1], p3 = P[Math.min(n - 1, i + 2)];
      for (let j = 0; j < SUB; j++) raw.push(cr(p0, p1, p2, p3, j / SUB));
    }
    raw.push(P[n - 1].slice());

    const cum = [0];
    for (let i = 1; i < raw.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(raw[i][0] - raw[i - 1][0],
                                       raw[i][1] - raw[i - 1][1]));
    }
    const total = cum[cum.length - 1];
    const NL = 520;
    let k = 0;
    for (let i = 0; i < NL; i++) {
      const target = total * i / (NL - 1);
      while (k < cum.length - 2 && cum[k + 1] < target) k++;
      const seg = (cum[k + 1] - cum[k]) || 1e-6;
      const f = (target - cum[k]) / seg;
      LINE.push({
        x: raw[k][0] + (raw[k + 1][0] - raw[k][0]) * f,
        y: raw[k][1] + (raw[k + 1][1] - raw[k][1]) * f
      });
    }
  })();

  const NL = LINE.length;

  /* 取体轴上一点（含切线、法线） */
  function axisBase(s) {
    s = s < 0 ? 0 : s > 1 ? 1 : s;
    const fi = s * (NL - 1);
    const i = Math.min(NL - 2, Math.floor(fi));
    const f = fi - i;
    const a = LINE[i], b = LINE[i + 1];
    const x = a.x + (b.x - a.x) * f;
    const y = a.y + (b.y - a.y) * f;

    const i0 = Math.max(0, i - 2), i1 = Math.min(NL - 1, i + 3);
    let dx = LINE[i1].x - LINE[i0].x;
    let dy = LINE[i1].y - LINE[i0].y;
    const L = Math.hypot(dx, dy) || 1;
    dx /= L; dy /= L;
    return { x, y, tx: dx, ty: dy, nx: -dy, ny: dx };
  }

  /* 体轴整体爬行波 */
  function axisAt(s, t) {
    const A = axisBase(s);
    const amp = Math.sin(s * 7.0 - t * 2.0) * 0.024 * (1 - s * 0.35);
    return {
      x: A.x + A.nx * amp,
      y: A.y + A.ny * amp,
      tx: A.tx, ty: A.ty, nx: A.nx, ny: A.ny
    };
  }

  /* =========================================================
     2. 体宽包络
     ========================================================= */
  const WKEYS = [
    [0.00, 0.012],
    [0.04, 0.058],
    [0.09, 0.118],
    [0.14, 0.156],
    [0.19, 0.158],
    [0.24, 0.114],
    [0.29, 0.134],
    [0.36, 0.184],
    [0.44, 0.214],
    [0.50, 0.198],
    [0.56, 0.144],
    [0.63, 0.094],
    [0.72, 0.061],
    [0.82, 0.039],
    [0.92, 0.025],
    [1.00, 0.013]
  ];
  function widthAt(s) {
    s = s < 0 ? 0 : s > 1 ? 1 : s;
    for (let i = 1; i < WKEYS.length; i++) {
      if (s <= WKEYS[i][0]) {
        const s0 = WKEYS[i - 1][0], w0 = WKEYS[i - 1][1];
        const s1 = WKEYS[i][0],     w1 = WKEYS[i][1];
        let f = (s - s0) / ((s1 - s0) || 1);
        f = f * f * (3 - 2 * f);
        return w0 + (w1 - w0) * f;
      }
    }
    return WKEYS[WKEYS.length - 1][1];
  }

  /* =========================================================
     3. 曲面采样：把 (s,u) 映射到屏幕世界坐标
        s ∈ [0,1] 沿体轴；u ∈ [-1,1] 横跨体宽
     ========================================================= */
  function surfacePoint(s, u, t) {
    const A = axisAt(s, t);
    const w0 = widthAt(s);

    /* 呼吸形变 */
    const breathe = 1 + 0.085 * Math.sin(s * 6.2 - t * 2.1);
    const w = w0 * breathe;

    /* 横向波纹：让纵向测地线起伏 */
    const waveU = 1 + 0.11 * Math.sin(u * 3.4 + s * 7.5 - t * 2.7);
    const rad = u * w * waveU;

    /* 沿切向鼓起：让横向测地线弯成弧 */
    const bulge = 0.145 * w *
      Math.sin(s * 4.2 - t * 1.7 + u * 1.5) * (1 - u * u * 0.32);

    /* 轴线微摆 */
    const sway = 0.011 * Math.sin(s * 10 - t * 2.5);

    const r = rad + sway;
    return {
      x: A.x + A.nx * r + A.tx * bulge,
      y: A.y + A.ny * r + A.ty * bulge
    };
  }

  /* =========================================================
     4. 颜色
     ========================================================= */
  const GREEN   = [ 57, 255,  20];
  const MAGENTA = [255,  34, 204];

  function mix(a, b, f) {
    return [
      (a[0] + (b[0] - a[0]) * f) | 0,
      (a[1] + (b[1] - a[1]) * f) | 0,
      (a[2] + (b[2] - a[2]) * f) | 0
    ];
  }

  /* =========================================================
     5. 绘制本体
     ========================================================= */
  function drawBody(t) {
    const LW = Math.max(0.75, S * 0.0052);

    /* ---------- 5.1 纵向测地线 ---------- */
    const NU = 13, NS = 130;
    for (let iu = 0; iu < NU; iu++) {
      const u = (iu / (NU - 1)) * 2 - 1;
      const edge = Math.abs(u);

      ctx.beginPath();
      for (let i = 0; i <= NS; i++) {
        const s = i / NS;
        const p = surfacePoint(s, u, t);
        const X = p.x * S, Y = p.y * S;
        if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }

      const cf = 0.5 + 0.5 * Math.sin(0.5 * 6.0 - t * 1.4 + u * 2.6);
      const col = mix(GREEN, MAGENTA, cf);
      const alpha = 0.14 + 0.28 * (1 - edge * 0.55);

      ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
      ctx.lineWidth = LW * (1.5 - 0.8 * edge);
      ctx.stroke();
    }

    /* ---------- 5.2 横向测地线 ---------- */
    const NT = 56, NU2 = 34;
    for (let it = 0; it < NT; it++) {
      const s = it / (NT - 1);

      ctx.beginPath();
      for (let j = 0; j <= NU2; j++) {
        const u = (j / NU2) * 2 - 1;
        const p = surfacePoint(s, u, t);
        const X = p.x * S, Y = p.y * S;
        if (j === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }

      const cf = 0.5 + 0.5 * Math.sin(s * 6.0 - t * 1.4 + 1.7);
      const col = mix(GREEN, MAGENTA, cf);
      const flow = 0.55 + 0.45 * Math.sin(s * 14 - t * 3.2);

      ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.075 + 0.10 * flow})`;
      ctx.lineWidth = LW * 0.72;
      ctx.stroke();
    }

    /* ---------- 5.3 主脊线：沿体轴，最亮 ---------- */
    ctx.beginPath();
    for (let i = 0; i <= 150; i++) {
      const s = i / 150;
      const A = axisAt(s, t);
      const X = A.x * S, Y = A.y * S;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    const cf0 = 0.5 + 0.5 * Math.sin(0.5 * 6.0 - t * 1.4);
    const c0 = mix(GREEN, MAGENTA, cf0);
    ctx.strokeStyle = `rgba(${c0[0]},${c0[1]},${c0[2]},0.30)`;
    ctx.lineWidth = LW * 1.6;
    ctx.stroke();

    /* ---------- 5.4 沿脊线流动的测地脉冲 ---------- */
    for (let k = 0; k < 5; k++) {
      const s = ((t * 0.16 + k / 5) % 1);
      const A = axisAt(s, t);
      const w = widthAt(s);
      const g = ctx.createRadialGradient(
        A.x * S, A.y * S, 0,
        A.x * S, A.y * S, w * 2.6 * S
      );
      const cg = mix(GREEN, MAGENTA,
        0.5 + 0.5 * Math.sin(s * 6.0 - t * 1.4));
      g.addColorStop(0, `rgba(${cg[0]},${cg[1]},${cg[2]},0.42)`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(A.x * S, A.y * S, w * 2.6 * S, 0, TAU);
      ctx.fill();
    }
  }

  /* =========================================================
     6. 眼睛
     ========================================================= */
  function drawEye(t) {
    const s = 0.088, u = -0.76;
    const A = axisAt(s, t);
    const w = widthAt(s);
    const ex = A.x + A.nx * u * w;
    const ey = A.y + A.ny * u * w;

    const r = 0.072 * (1 + 0.035 * Math.sin(t * 3.1));

    /* 光晕 */
    const g = ctx.createRadialGradient(ex * S, ey * S, 0,
                                       ex * S, ey * S, r * 3.4 * S);
    g.addColorStop(0,   'rgba(57,255,20,0.55)');
    g.addColorStop(0.32,'rgba(255,34,204,0.22)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ex * S, ey * S, r * 3.4 * S, 0, TAU);
    ctx.fill();

    /* 虹膜 */
    ctx.strokeStyle = 'rgba(57,255,20,0.92)';
    ctx.lineWidth = Math.max(0.9, S * 0.0075);
    ctx.beginPath();
    ctx.arc(ex * S, ey * S, r * S, 0, TAU);
    ctx.stroke();

    /* 瞳孔 */
    ctx.fillStyle = 'rgba(255,34,204,0.95)';
    ctx.beginPath();
    ctx.arc(ex * S, ey * S, r * 0.44 * S, 0, TAU);
    ctx.fill();
  }

  /* =========================================================
     7. 四肢
     ========================================================= */
  function drawLeg(s, dirSign, t) {
    const A = axisAt(s, t);
    const w = widthAt(s);

    const nx = A.nx, ny = A.ny;
    const sx = A.x + nx * w * 0.88;
    const sy = A.y + ny * w * 0.88;

    const swing = Math.sin(t * 2.3 + s * 12) * 0.055;

    const seg = 0.30;
    const mx = sx + nx * seg * 0.52 + 0.13 * dirSign;
    const my = sy + ny * seg * 0.52 - 0.03;
    const fx = sx + nx * seg + 0.10 * dirSign + swing;
    const fy = sy + ny * seg + Math.abs(swing) * 0.2;

    ctx.beginPath();
    ctx.moveTo(sx * S, sy * S);
    ctx.quadraticCurveTo(mx * S, my * S, fx * S, fy * S);
    ctx.strokeStyle = 'rgba(57,255,20,0.42)';
    ctx.lineWidth = Math.max(0.8, S * 0.006);
    ctx.stroke();

    /* 爪 */
    ctx.beginPath();
    ctx.arc(fx * S, fy * S, Math.max(1.2, 0.032 * S), 0, TAU);
    ctx.fillStyle = 'rgba(255,34,204,0.55)';
    ctx.fill();
  }

  function drawLegs(t) {
    drawLeg(0.295, -1, t);
    drawLeg(0.475,  1, t);
  }

  /* =========================================================
     8. 主循环
     ========================================================= */
  let T = 0;

  function frame() {
    T += 1 / 60;

    /* 拖影 */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(CX, CY);
    /* 把模型包围盒中心移到画布中心 */
    ctx.translate(0.115 * S, -0.125 * S);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    drawLegs(T);
    drawBody(T);
    drawEye(T);

    ctx.restore();

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
