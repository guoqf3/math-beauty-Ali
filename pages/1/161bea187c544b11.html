<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>级数收敛判别 · Σ aₙ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:24px 32px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,255,.36);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 40%,#c090ff 72%,#ffd080 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(11px,1.4vw,14px);
    letter-spacing:.14em;
    color:rgba(200,220,255,.62);
  }
  #title .formula .hl1{color:#5ee0ff;}
  #title .formula .hl2{color:#c090ff;}

  #stats{
    position:absolute;top:0;right:0;
    padding:24px 32px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.10em;line-height:2.0;
    color:rgba(170,200,250,.34);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:6px;
  }
  #stats .k{color:rgba(190,205,255,.52);}
  #stats .v{color:rgba(255,215,150,.92);font-weight:600;}
  #stats .v2{color:rgba(140,225,255,.94);font-weight:600;}
  #stats .vd{font-size:clamp(15px,1.9vw,20px);
    font-weight:300;display:block;line-height:1;
    color:rgba(200,230,255,.94);
    margin:5px 0;
    letter-spacing:.04em;
    filter:drop-shadow(0 0 12px rgba(140,200,255,.42));}
  #stats .status{
    display:inline-block;
    margin-top:6px;
    font-size:9.5px;
    padding:2px 10px;
    border-radius:999px;
    letter-spacing:.14em;
  }
  #stats .status.converge{
    color:rgba(140,240,200,.95);
    background:rgba(70,200,150,.16);
    border:1px solid rgba(100,220,180,.34);
  }
  #stats .status.diverge{
    color:rgba(255,160,120,.95);
    background:rgba(220,100,60,.16);
    border:1px solid rgba(255,140,90,.34);
  }

  #seriesNav{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:22px;
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    max-width:94vw;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
    pointer-events:auto;
  }
  .sbtn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.06em;
    color:rgba(200,215,250,.58);
    background:rgba(22,30,58,.52);
    border:1px solid rgba(120,155,230,.24);
    border-radius:8px;
    padding:7px 12px;cursor:pointer;
    transition:.28s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    white-space:nowrap;
  }
  .sbtn:hover{
    border-color:rgba(180,220,255,.80);
    color:rgba(230,240,255,.95);
    background:rgba(60,95,165,.26);
  }
  .sbtn.on{
    border-color:rgba(255,210,140,.88);
    color:rgba(255,235,200,.98);
    background:rgba(150,100,60,.28);
    box-shadow:0 0 16px rgba(255,170,110,.32);
  }

  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 32px 22px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:14px 16px;}
    #title .formula{font-size:10px;}
    #stats{padding:14px 16px;font-size:8.5px;}
    #stats .vd{font-size:14px;}
    #seriesNav{padding-bottom:14px;gap:5px;}
    .sbtn{font-size:8.5px;padding:5px 9px;border-radius:6px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">SERIES CONVERGENCE · PARTIAL SUMS</div>
    <h1>级数收敛判别</h1>
    <div class="formula">
      <span class="hl1">Σ</span> aₙ &nbsp;·&nbsp; 
      Sₙ = a₁ + a₂ + ... + aₙ &nbsp;→&nbsp; 
      <span class="hl2">L</span>
    </div>
  </div>

  <div id="stats">
    <span class="lab">LIVE STATE</span>
    <span class="vd" id="sVal">0.0000</span>
    <div><span class="k">n </span><span class="v2" id="nVal">0</span></div>
    <div><span class="k">极限 L </span><span class="v" id="lVal">—</span></div>
    <div><span class="k">间隙 </span><span class="v" id="gVal">—</span></div>
    <span class="status" id="stVal">等待</span>
  </div>

  <div id="seriesNav"></div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>节拍音 · 收敛音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

/* =========================================================
   级数定义
   ========================================================= */
function factorial(n){
  if (n <= 1) return 1;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

const SERIES = [
  {
    name: '几何级数',
    en: 'Σ (1/2)ⁿ',
    formula: 'Σ (1/2)ⁿ',
    term: function(n){ return Math.pow(0.5, n); },
    nMax: 22,
    limit: 1,
    convergent: true,
    hue: 195,
    judgement: '比值判别法 |r| = 1/2 < 1'
  },
  {
    name: 'p-级数',
    en: 'Σ 1/n²',
    formula: 'Σ 1/n²',
    term: function(n){ return 1 / (n * n); },
    nMax: 34,
    limit: Math.PI * Math.PI / 6,
    convergent: true,
    hue: 155,
    judgement: 'p-级数 p = 2 > 1'
  },
  {
    name: '调和级数',
    en: 'Σ 1/n',
    formula: 'Σ 1/n',
    term: function(n){ return 1 / n; },
    nMax: 60,
    limit: Infinity,
    convergent: false,
    hue: 32,
    judgement: 'p-级数 p = 1 ≤ 1'
  },
  {
    name: '交错级数',
    en: 'Σ (−1)ⁿ⁺¹/n',
    formula: 'Σ (−1)ⁿ⁺¹ / n',
    term: function(n){ return (n % 2 === 1 ? 1 : -1) / n; },
    nMax: 32,
    limit: Math.LN2,
    convergent: true,
    hue: 270,
    judgement: '莱布尼茨判别法'
  },
  {
    name: '阶乘级数',
    en: 'Σ 1/n!',
    formula: 'Σ 1/n!',
    term: function(n){ return 1 / factorial(n); },
    nMax: 14,
    limit: Math.E - 1,
    convergent: true,
    hue: 340,
    judgement: '比值判别法 aₙ₊₁/aₙ → 0'
  }
];

let seriesIdx = 0;
let series = SERIES[0];

/* =========================================================
   状态
   ========================================================= */
let animT = 0;
let currentN = 0;
let sValues = [];
let terms = [];
let holdTimer = 0;
let convergencePlayed = false;
let lastBeatN = 0;

const BEAT_TIME = 0.17;

/* 布局 */
let mainPlot = {}, termsPlot = {};

/* =========================================================
   画布
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const padX = Math.max(20, W * 0.035);
  const padTop = 92;
  const padBot = 80;

  const availH = H - padTop - padBot;
  const mainH = availH * 0.62;
  const gap = availH * 0.06;
  const termH = availH - mainH - gap;

  mainPlot = {
    x: padX,
    y: padTop,
    w: W - padX * 2,
    h: mainH
  };

  termsPlot = {
    x: padX,
    y: padTop + mainH + gap,
    w: W - padX * 2,
    h: termH
  };
}
window.addEventListener('resize', resize);

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let padOsc = null, padOsc2 = null, padGain = null;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.42, ac.currentTime, 1.8);

  /* 背景垫音 */
  padOsc = ac.createOscillator();
  padOsc.type = 'sine';
  padOsc.frequency.value = 55;

  padOsc2 = ac.createOscillator();
  padOsc2.type = 'sine';
  padOsc2.frequency.value = 55.5;

  padGain = ac.createGain();
  padGain.gain.value = 0.014;

  padOsc.connect(padGain);
  padOsc2.connect(padGain);
  padGain.connect(master);
  padOsc.start();
  padOsc2.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* 节拍音：短促脉冲，音高随 n 略变 */
function playBeat(n){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 隔项播放避免过密 */
  if (n % 2 !== 0 && series.nMax > 20) return;

  const t = n / series.nMax;
  const freq = 480 + t * 320 + Math.random() * 30;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.75, now + 0.055);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.010, now + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.10);
}

/* 收敛提示音 */
function playConvergence(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.07;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.040, t0 + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.5);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.6);

    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = notes[i] * 2;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.03);
    g2.gain.linearRampToValueAtTime(0.013, t0 + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0);
    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.03);
    osc2.stop(t0 + 1.1);
  }
}

/* =========================================================
   更新
   ========================================================= */
function update(dt){
  if (dt > 0.05) dt = 0.05;

  /* 已展示完所有项：保持后切换 */
  if (currentN >= series.nMax){
    holdTimer += dt;
    if (holdTimer > 3.6){
      switchSeries((seriesIdx + 1) % SERIES.length);
    }
    return;
  }

  animT += dt;

  const targetN = Math.min(series.nMax, Math.floor(animT / BEAT_TIME) + 1);

  while (currentN < targetN){
    currentN++;
    const a = series.term(currentN);
    const prev = sValues.length > 0 ? sValues[sValues.length - 1] : 0;
    const s = prev + a;
    sValues.push(s);
    terms.push(a);

    playBeat(currentN);

    /* 检查是否足够接近极限 */
    if (!convergencePlayed && series.convergent && isFinite(series.limit)){
      const gap = Math.abs(s - series.limit);
      if (gap < 0.0025 && currentN > 3){
        convergencePlayed = true;
        playConvergence();
      }
    }
  }
}

/* =========================================================
   颜色工具
   ========================================================= */
function hsla(h, s, l, a){
  return 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')';
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(){
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.4, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.85
  );
  bg.addColorStop(0.00, '#0a1226');
  bg.addColorStop(0.42, '#060c1a');
  bg.addColorStop(1.00, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* =========================================================
   y 范围
   ========================================================= */
function computeYRange(){
  if (sValues.length === 0) return { min: 0, max: 1 };

  let minV = Infinity, maxV = -Infinity;
  for (let i = 0; i < sValues.length; i++){
    const v = sValues[i];
    if (v < minV) minV = v;
    if (v > maxV) maxV = v;
  }

  /* 包含 0 */
  if (minV > 0) minV = 0;
  if (maxV < 0) maxV = 0;

  /* 收敛时包含极限 */
  if (series.convergent && isFinite(series.limit)){
    if (series.limit > maxV) maxV = series.limit;
    if (series.limit < minV) minV = series.limit;
  }

  let range = maxV - minV;
  if (range < 0.01) range = 1;

  /* 上下 8% 内边距 */
  return {
    min: minV - range * 0.10,
    max: maxV + range * 0.10
  };
}

/* =========================================================
   绘制：主图（部分和）
   ========================================================= */
function drawMainPlot(){
  const p = mainPlot;

  /* 面板背景 */
  ctx.fillStyle = 'rgba(5, 10, 22, 0.55)';
  roundRect(p.x, p.y, p.w, p.h, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 140, 220, 0.14)';
  ctx.lineWidth = 1;
  roundRect(p.x, p.y, p.w, p.h, 12);
  ctx.stroke();

  const padL = 64;
  const padR = 24;
  const padT = 32;
  const padB = 40;

  const plotX = p.x + padL;
  const plotY = p.y + padT;
  const plotW = p.w - padL - padR;
  const plotH = p.h - padT - padB;

  const yr = computeYRange();

  /* n → x 像素 */
  function nToX(n){
    const t = (n - 1) / Math.max(1, series.nMax - 1);
    return plotX + t * plotW;
  }
  /* 值 → y 像素 */
  function vToY(v){
    const t = (v - yr.min) / Math.max(1e-6, yr.max - yr.min);
    return plotY + plotH - t * plotH;
  }

  /* y 网格 */
  const ySteps = 4;
  ctx.font = '400 9.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= ySteps; i++){
    const v = yr.min + (yr.max - yr.min) * i / ySteps;
    const py = vToY(v);

    ctx.beginPath();
    ctx.moveTo(plotX, py);
    ctx.lineTo(plotX + plotW, py);
    ctx.strokeStyle = 'rgba(80, 130, 210, 0.07)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(150, 185, 240, 0.42)';
    ctx.fillText(v.toFixed(2), plotX - 8, py);
  }

  /* x 网格 */
  const xSteps = 5;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let i = 0; i <= xSteps; i++){
    const n = 1 + (series.nMax - 1) * i / xSteps;
    const px = nToX(n);

    ctx.beginPath();
    ctx.moveTo(px, plotY);
    ctx.lineTo(px, plotY + plotH);
    ctx.strokeStyle = 'rgba(80, 130, 210, 0.06)';
    ctx.stroke();

    ctx.fillStyle = 'rgba(150, 185, 240, 0.38)';
    ctx.fillText(Math.round(n).toString(), px, plotY + plotH + 6);
  }

  /* 极限虚线 */
  if (series.convergent && isFinite(series.limit)){
    const ly = vToY(series.limit);

    ctx.beginPath();
    ctx.setLineDash([6, 5]);
    ctx.moveTo(plotX, ly);
    ctx.lineTo(plotX + plotW, ly);
    ctx.strokeStyle = 'rgba(255, 215, 130, 0.68)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);

    /* 标签 */
    ctx.font = '500 10.5px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(255, 225, 160, 0.92)';
    ctx.fillText('L = ' + series.limit.toFixed(5), plotX + plotW - 10, ly - 5);
  }

  /* 绘制 S_n 曲线 */
  if (sValues.length > 0){
    /* 外发光 */
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    for (let i = 0; i < sValues.length; i++){
      const x = nToX(i + 1);
      const y = vToY(sValues[i]);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = hsla(series.hue, 100, 70, 0.20);
    ctx.lineWidth = 10;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.strokeStyle = hsla(series.hue, 100, 78, 0.32);
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';

    /* 主曲线 */
    ctx.beginPath();
    for (let i = 0; i < sValues.length; i++){
      const x = nToX(i + 1);
      const y = vToY(sValues[i]);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    const grad = ctx.createLinearGradient(plotX, 0, plotX + plotW, 0);
    grad.addColorStop(0, hsla(series.hue, 100, 82, 0.96));
    grad.addColorStop(1, hsla((series.hue + 40) % 360, 100, 74, 0.96));
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.4;
    ctx.stroke();

    /* 数据点 */
    for (let i = 0; i < sValues.length; i++){
      const x = nToX(i + 1);
      const y = vToY(sValues[i]);
      const isLast = i === sValues.length - 1;

      if (isLast){
        /* 当前点光晕 */
        ctx.globalCompositeOperation = 'lighter';
        const pulse = 1 + 0.28 * Math.sin(animT * 7);
        const g = ctx.createRadialGradient(x, y, 0, x, y, 22 * pulse);
        g.addColorStop(0.00, hsla(series.hue, 100, 92, 0.85));
        g.addColorStop(0.42, hsla(series.hue, 100, 74, 0.28));
        g.addColorStop(1.00, hsla(series.hue, 100, 62, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, 22 * pulse, 0, TAU);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';

        ctx.beginPath();
        ctx.arc(x, y, 4.5, 0, TAU);
        ctx.fillStyle = hsla(series.hue, 100, 96, 1);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(x, y, 2.2, 0, TAU);
        ctx.fillStyle = hsla(series.hue, 100, 78, 0.72);
        ctx.fill();
      }
    }
  }

  /* 面板标题 */
  ctx.font = '500 10.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = hsla(series.hue, 90, 78, 0.72);
  ctx.fillText('部分和序列 · Sₙ = a₁ + a₂ + ... + aₙ', p.x + 14, p.y + 11);

  /* 右侧公式 */
  ctx.font = '600 13px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = hsla(series.hue, 100, 84, 0.92);
  ctx.fillText(series.formula, p.x + p.w - 14, p.y + 11);
}

/* =========================================================
   绘制：项条形
   ========================================================= */
function drawTermsPlot(){
  const p = termsPlot;

  /* 面板背景 */
  ctx.fillStyle = 'rgba(5, 10, 22, 0.55)';
  roundRect(p.x, p.y, p.w, p.h, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 140, 220, 0.14)';
  ctx.lineWidth = 1;
  roundRect(p.x, p.y, p.w, p.h, 12);
  ctx.stroke();

  const padL = 64;
  const padR = 24;
  const padT = 26;
  const padB = 20;

  const plotX = p.x + padL;
  const plotY = p.y + padT;
  const plotW = p.w - padL - padR;
  const plotH = p.h - padT - padB;

  /* 有正有负时零线居中，否则偏底 */
  let hasNeg = false;
  for (let i = 0; i < terms.length; i++){
    if (terms[i] < -1e-9){ hasNeg = true; break; }
  }
  const zeroY = hasNeg
    ? plotY + plotH * 0.5
    : plotY + plotH * 0.88;

  const maxUp = hasNeg ? plotH * 0.44 : plotH * 0.82;
  const maxDown = hasNeg ? plotH * 0.44 : plotH * 0.10;

  /* 计算最大 |a| */
  let maxA = 0;
  for (let i = 0; i < terms.length; i++){
    const v = Math.abs(terms[i]);
    if (v > maxA) maxA = v;
  }
  maxA = Math.max(maxA, 1e-9);

  const barW = plotW / series.nMax;
  const barPad = Math.min(2.2, barW * 0.18);
  const bw = Math.max(1, barW - barPad);

  /* 零线 */
  ctx.beginPath();
  ctx.moveTo(plotX, zeroY);
  ctx.lineTo(plotX + plotW, zeroY);
  ctx.strokeStyle = 'rgba(140, 180, 240, 0.30)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 绘制条形 */
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < terms.length; i++){
    const a = terms[i];
    const n = i + 1;

    /* 幂次缩放 */
    const mag = Math.pow(Math.abs(a) / maxA, 0.32);

    const x = plotX + (n - 1) * barW + barPad * 0.5;
    const isLast = i === terms.length - 1;
    const isNeg = a < 0;

    let h, hue;
    if (isNeg){
      h = mag * maxDown;
      hue = 340;
    } else {
      h = mag * maxUp;
      hue = series.hue;
    }

    if (h < 0.5) h = 0.5;

    const y = isNeg ? zeroY : zeroY - h;

    /* 光晕 */
    if (isLast){
      ctx.fillStyle = hsla(hue, 100, 74, 0.42);
      ctx.fillRect(x - 2, y - 2, bw + 4, h + 4);
    }

    /* 条形主体 */
    const grad = ctx.createLinearGradient(0, zeroY, 0, isNeg ? zeroY + h : zeroY - h);
    if (isNeg){
      grad.addColorStop(0, hsla(hue, 92, 66, 0.90));
      grad.addColorStop(1, hsla(hue, 92, 54, 0.55));
    } else {
      grad.addColorStop(0, hsla(hue, 92, 66, 0.90));
      grad.addColorStop(1, hsla(hue, 92, 54, 0.55));
    }
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, bw, h);

    /* 顶部高光 */
    if (isLast && h > 4){
      ctx.fillStyle = hsla(hue, 100, 90, 0.72);
      ctx.fillRect(x, isNeg ? zeroY + h - 1.5 : y, bw, 1.5);
    }
  }

  ctx.globalCompositeOperation = 'source-over';

  /* 面板标题 */
  ctx.font = '500 10.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = hsla(series.hue, 80, 76, 0.62);
  ctx.fillText('项 aₙ', p.x + 14, p.y + 8);

  /* y 轴标签 */
  ctx.font = '400 9px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(150, 185, 240, 0.36)';
  ctx.fillText(maxA.toFixed(2), plotX - 8, plotY + 6);
  ctx.fillText('0', plotX - 8, zeroY);
  if (hasNeg){
    ctx.fillText('−' + maxA.toFixed(2), plotX - 8, plotY + plotH - 6);
  }
}

/* =========================================================
   绘制：HUD 状态
   ========================================================= */
function drawStatus(){
  /* 主图右上角 */
}

/* =========================================================
   渲染
   ========================================================= */
function render(){
  drawBackground();
  drawMainPlot();
  drawTermsPlot();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.22)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.90)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   主循环
   ========================================================= */
let lastNow = 0;
let uiTick = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastNow) lastNow = now;
  let dt = (now - lastNow) / 1000;
  lastNow = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();

  uiTick++;
  if (uiTick % 4 === 0) updateHUD();
}

/* =========================================================
   HUD 更新
   ========================================================= */
function updateHUD(){
  const sEl = document.getElementById('sVal');
  const nEl = document.getElementById('nVal');
  const lEl = document.getElementById('lVal');
  const gEl = document.getElementById('gVal');
  const stEl = document.getElementById('stVal');

  const cur = sValues.length > 0 ? sValues[sValues.length - 1] : 0;

  if (sEl) sEl.textContent = cur.toFixed(5);
  if (nEl) nEl.textContent = currentN;

  if (lEl){
    if (series.convergent && isFinite(series.limit)){
      lEl.textContent = series.limit.toFixed(5);
    } else {
      lEl.textContent = '∞ (发散)';
    }
  }

  if (gEl){
    if (series.convergent && isFinite(series.limit)){
      const gap = Math.abs(cur - series.limit);
      gEl.textContent = gap < 0.00005 ? gap.toExponential(2) : gap.toFixed(5);
    } else {
      gEl.textContent = '—';
    }
  }

  if (stEl){
    if (convergencePlayed && series.convergent){
      stEl.textContent = '已收敛';
      stEl.className = 'status converge';
    } else if (series.convergent){
      stEl.textContent = '收敛中';
      stEl.className = 'status converge';
    } else {
      stEl.textContent = '发散';
      stEl.className = 'status diverge';
    }
  }
}

/* =========================================================
   级数按钮
   ========================================================= */
function buildSeriesBtns(){
  const wrap = document.getElementById('seriesNav');
  if (!wrap) return;
  wrap.innerHTML = '';

  for (let i = 0; i < SERIES.length; i++){
    const s = SERIES[i];
    const btn = document.createElement('button');
    btn.className = 'sbtn' + (i === seriesIdx ? ' on' : '');
    btn.textContent = s.en;
    btn.dataset.idx = i;

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      initAudio();
      switchSeries(parseInt(this.dataset.idx, 10));
    });

    wrap.appendChild(btn);
  }
}

function switchSeries(idx){
  if (idx === seriesIdx && sValues.length > 0) {
    /* 强制重置 */
  }
  seriesIdx = idx;
  series = SERIES[idx];

  animT = 0;
  currentN = 0;
  sValues = [];
  terms = [];
  holdTimer = 0;
  convergencePlayed = false;
  lastBeatN = 0;

  document.querySelectorAll('.sbtn').forEach(function(b, i){
    b.classList.toggle('on', i === idx);
  });

  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
window.addEventListener('pointerdown', function(){
  initAudio();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    animT = 0;
    currentN = 0;
    sValues = [];
    terms = [];
    holdTimer = 0;
    convergencePlayed = false;
  } else if (e.key >= '1' && e.key <= '5'){
    initAudio();
    const idx = parseInt(e.key, 10) - 1;
    if (idx >= 0 && idx < SERIES.length){
      switchSeries(idx);
    }
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
buildSeriesBtns();
updateHUD();
requestAnimationFrame(loop);

})();
</script>
