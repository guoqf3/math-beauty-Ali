<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>分形几何 · 曼德博集合</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  /* 左上 */
  #title{
    position:absolute;top:0;left:0;
    padding:24px 32px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,255,.36);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 40%,#c090ff 72%,#ffd080 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10.5px;letter-spacing:.18em;
    color:rgba(200,220,255,.52);font-weight:300;
  }

  /* 右上 */
  #stats{
    position:absolute;top:0;right:0;
    padding:24px 32px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:8px;
  }
  #stats .formula{
    font-size:clamp(12px,1.4vw,15px);
    letter-spacing:.06em;
    color:rgba(200,220,255,.72);
    margin-bottom:10px;
  }
  #stats .formula .hl1{color:#5ee0ff;}
  #stats .formula .hl2{color:#c090ff;}

  #stats .zoom{
    font-size:clamp(20px,2.6vw,30px);
    font-weight:200;
    letter-spacing:.04em;
    color:rgba(200,230,255,.94);
    line-height:1;
    display:block;
    margin-bottom:6px;
    filter:drop-shadow(0 0 14px rgba(140,200,255,.42));
  }
  #stats .kv{
    font-size:9.5px;
    letter-spacing:.10em;
    line-height:1.9;
    color:rgba(170,200,245,.42);
  }
  #stats .kv .k{color:rgba(200,190,255,.50);}
  #stats .kv .v{color:rgba(140,225,255,.88);font-weight:600;}

  /* 左下 */
  #bottom{
    position:absolute;bottom:0;left:0;
    padding:0 32px 26px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #bottom .hint{
    font-size:9.5px;
    letter-spacing:.20em;
    color:rgba(160,200,240,.32);
    line-height:1.9;
  }
  #bottom .hint .hl{
    color:rgba(140,225,255,.62);
  }

  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 32px 26px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:14px 16px;}
    #title .sub{font-size:9px;}
    #stats{padding:14px 16px;}
    #stats .kv{display:none;}
    #bottom{padding:0 16px 16px;}
    #audioDot{padding:0 16px 16px;font-size:8px;}
  }
</style>
</head>
<body>

<canvas id="glcanvas"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">FRACTAL GEOMETRY · MANDELBROT SET</div>
    <h1>分形几何</h1>
    <div class="sub">自相似 · 无限细节 · 混沌边缘</div>
  </div>

  <div id="stats">
    <span class="lab">ITERATION FORMULA</span>
    <div class="formula">
      z<sub>n+1</sub> = <span class="hl1">z<sub>n</sub>²</span> + <span class="hl2">c</span>
    </div>
    <span class="zoom" id="zoomVal">×1.0</span>
    <div class="kv">
      <div><span class="k">中心 </span><span class="v" id="cVal">−0.500 + 0.000i</span></div>
      <div><span class="k">迭代 </span><span class="v" id="iterVal">128</span></div>
      <div><span class="k">当前区域 </span><span class="v" id="regionVal">初始视野</span></div>
    </div>
  </div>

  <div id="bottom">
    <div class="hint">
      <span class="hl">∞</span> 曼德博集合是复平面上所有使迭代有界的 c 的集合<br>
      <span class="hl">∞</span> 放大任意倍数 · 总能看到与原图相似的结构
    </div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>回声叠加 · 深渊音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   WebGL 初始化
   ========================================================= */
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl', {
  antialias: false,
  preserveDrawingBuffer: false,
  powerPreference: 'high-performance'
}) || canvas.getContext('experimental-webgl');

if (!gl){
  document.body.innerHTML = '<div style="color:#fff;padding:40px;font-family:monospace">您的浏览器不支持 WebGL</div>';
  return;
}

/* =========================================================
   着色器源码
   ========================================================= */
const VERTEX_SHADER = `
attribute vec2 a_position;
void main() {
  gl_Position = vec4(a_position, 0.0, 1.0);
}
`;

const FRAGMENT_SHADER = `
precision highp float;

uniform vec2  u_resolution;
uniform vec2  u_center;
uniform float u_scale;
uniform float u_maxIter;
uniform float u_time;
uniform float u_flash;

vec3 palette(float t) {
  // 深空蓝 → 青 → 金 → 白 的循环
  float ph = t * 6.28318;
  vec3 col = vec3(
    0.52 + 0.48 * cos(ph + 3.55),
    0.52 + 0.48 * cos(ph + 4.05),
    0.58 + 0.42 * cos(ph + 4.90)
  );
  // 提升对比
  col = pow(col, vec3(0.92));
  // 边缘增亮
  col += vec3(0.06, 0.10, 0.14) * pow(1.0 - t, 6.0);
  return col;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;
  vec2 c = u_center + uv * u_scale;

  vec2 z = vec2(0.0);
  float iter = 0.0;
  bool escaped = false;

  // 曼德博迭代：z = z² + c
  for (int i = 0; i < 1500; i++) {
    if (float(i) >= u_maxIter) break;
    float x = z.x * z.x - z.y * z.y + c.x;
    float y = 2.0 * z.x * z.y + c.y;
    z.x = x;
    z.y = y;
    if (z.x * z.x + z.y * z.y > 256.0) {
      escaped = true;
      break;
    }
    iter += 1.0;
  }

  vec3 color;

  if (!escaped) {
    // 内部：深黑带一点蓝紫
    color = vec3(0.008, 0.010, 0.022);
    // 让内部有一丝微妙的呼吸感
    color += vec3(0.006, 0.004, 0.014) * (0.5 + 0.5 * sin(u_time * 0.6));
  } else {
    // 平滑迭代（消除色带）
    float log_zn = log(z.x * z.x + z.y * z.y) * 0.5;
    float nu = log(log_zn / 0.693147) / 0.693147;
    float smoothIter = iter + 1.0 - nu;

    // 归一化：低频区域映射到暖色，高频区域映射到冷色
    float t = smoothIter / u_maxIter;
    t = pow(t, 0.40);

    // 色相缓慢偏移
    float hueShift = u_time * 0.025;

    color = palette(t + hueShift);

    // 边缘增亮：让分形边界更醒目
    float edge = smoothstep(0.02, 0.35, t);
    color *= (0.55 + 0.85 * edge);

    // 最外层极淡的辉光
    color += vec3(0.05, 0.08, 0.14) * (1.0 - t) * (1.0 - t);
  }

  // 过渡闪光
  color = mix(color, vec3(1.0, 0.97, 0.90), u_flash);

  gl_FragColor = vec4(color, 1.0);
}
`;

/* =========================================================
   编译着色器
   ========================================================= */
function createShader(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(sh));
    return null;
  }
  return sh;
}

const vs = createShader(gl.VERTEX_SHADER, VERTEX_SHADER);
const fs = createShader(gl.FRAGMENT_SHADER, FRAGMENT_SHADER);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);

if (!gl.getProgramParameter(program, gl.LINK_STATUS)){
  console.error(gl.getProgramInfoLog(program));
}

gl.useProgram(program);

/* =========================================================
   全屏四边形
   ========================================================= */
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1, -1,
   1, -1,
  -1,  1,
   1,  1
]), gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(program, 'a_position');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

/* =========================================================
   Uniform 位置
   ========================================================= */
const uResolution = gl.getUniformLocation(program, 'u_resolution');
const uCenter     = gl.getUniformLocation(program, 'u_center');
const uScale      = gl.getUniformLocation(program, 'u_scale');
const uMaxIter    = gl.getUniformLocation(program, 'u_maxIter');
const uTime       = gl.getUniformLocation(program, 'u_time');
const uFlash      = gl.getUniformLocation(program, 'u_flash');

/* =========================================================
   缩放路径（waypoint）
   ========================================================= */
const WAYPOINTS = [
  { x: -0.55,    y: 0.0,       maxLog: 0.60, name: '初始视野'    },
  { x: -0.74543, y: 0.11301,   maxLog: 4.40, name: '海马谷'      },
  { x:  0.28221, y: 0.01142,   maxLog: 4.40, name: '大象谷'      },
  { x: -0.08800, y: 0.65400,   maxLog: 4.20, name: '双旋臂'      },
  { x: -1.74934, y: 0.00000,   maxLog: 4.30, name: '迷你曼德博'  },
  { x: -0.15920, y: -1.03000,  maxLog: 4.20, name: '螺旋海湾'    }
];

/* =========================================================
   视图状态
   ========================================================= */
let zoomLog = 0;              // 缩放倍率的对数值（以 10 为底）
let centerX = WAYPOINTS[0].x;
let centerY = WAYPOINTS[0].y;
let waypointIdx = 0;
let flashAlpha = 0;

/* 平滑跟随 */
let targetX = centerX;
let targetY = centerY;

const BASE_SCALE = 2.8;       // 初始视野高度（复平面坐标）
const ZOOM_SPEED = 0.16;      // 每秒缩放的对数增量

/* =========================================================
   画布尺寸
   ========================================================= */
let cw = 0, ch = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));

  if (w === cw && h === ch) return;

  cw = w;
  ch = h;
  canvas.width = cw;
  canvas.height = ch;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';

  gl.viewport(0, 0, cw, ch);
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   音频
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let audioStarted = false;
let droneOsc1 = null;
let droneOsc2 = null;
let droneFilter = null;
let droneGain = null;
let lastEchoTime = 0;
let lastFlashIdx = -1;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioStarted) {
    if (audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().catch(function(){});
    }
    return;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { audioCtx = new AC(); } catch(e){ return; }
  audioStarted = true;

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);
  masterGain.gain.setTargetAtTime(0.42, audioCtx.currentTime, 1.8);

  /* ---- 深渊嗡鸣：两个近频正弦 ---- */
  droneOsc1 = audioCtx.createOscillator();
  droneOsc1.type = 'sine';
  droneOsc1.frequency.value = 41.0;

  droneOsc2 = audioCtx.createOscillator();
  droneOsc2.type = 'sine';
  droneOsc2.frequency.value = 41.7;

  droneFilter = audioCtx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = 180;
  droneFilter.Q.value = 3.2;

  droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.018;

  droneOsc1.connect(droneFilter);
  droneOsc2.connect(droneFilter);
  droneFilter.connect(droneGain);
  droneGain.connect(masterGain);

  droneOsc1.start();
  droneOsc2.start();

  /* 缓慢的滤波器与音高漂移 */
  const lfoA = audioCtx.createOscillator();
  lfoA.frequency.value = 0.045;
  const lfoAGain = audioCtx.createGain();
  lfoAGain.gain.value = 6;
  lfoA.connect(lfoAGain);
  lfoAGain.connect(droneOsc1.frequency);
  lfoA.start();

  const lfoB = audioCtx.createOscillator();
  lfoB.frequency.value = 0.062;
  const lfoBGain = audioCtx.createGain();
  lfoBGain.gain.value = 42;
  lfoB.connect(lfoBGain);
  lfoBGain.connect(droneFilter.frequency);
  lfoB.start();

  /* ---- 深空噪声层 ---- */
  const bufLen = Math.floor(audioCtx.sampleRate * 3);
  const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < bufLen; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.022 * w) / 1.022;
    d[i] = last * 3.2;
  }

  const noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = buf;
  noiseSrc.loop = true;

  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 620;
  noiseFilter.Q.value = 1.4;

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.008;

  noiseSrc.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(masterGain);
  noiseSrc.start();

  const noiseLfo = audioCtx.createOscillator();
  noiseLfo.frequency.value = 0.11;
  const noiseLfoGain = audioCtx.createGain();
  noiseLfoGain.gain.value = 340;
  noiseLfo.connect(noiseLfoGain);
  noiseLfoGain.connect(noiseFilter.frequency);
  noiseLfo.start();

  /* 显示音频已就绪 */
  setAudioOn(true);

  if (audioCtx.state === 'suspended'){
    audioCtx.resume().then(function(){ setAudioOn(true); }).catch(function(){});
  }
}

/* ---- 回声脉冲（缩放时的“深渊回声”） ---- */
function playEcho(intensity, isDeep){
  if (!audioStarted || !audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;
  if (now - lastEchoTime < 0.28) return;
  lastEchoTime = now;

  const s = Math.max(0.15, Math.min(1.2, intensity || 1));

  /* 主音：频率随缩放深度升高 */
  const baseF = 180 + Math.random() * 220 + (isDeep ? 280 : 0);

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(baseF, now);
  osc.frequency.exponentialRampToValueAtTime(baseF * 0.42, now + 1.4);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.038 * s, now + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

  /* 延迟与反馈，产生回声层叠 */
  const delay = audioCtx.createDelay(2.0);
  delay.delayTime.value = 0.32 + Math.random() * 0.12;

  const fb = audioCtx.createGain();
  fb.gain.value = 0.52;

  const fbFilter = audioCtx.createBiquadFilter();
  fbFilter.type = 'lowpass';
  fbFilter.frequency.value = 1200;
  fbFilter.Q.value = 0.7;

  /* 反馈回路 */
  delay.connect(fbFilter);
  fbFilter.connect(fb);
  fb.connect(delay);

  osc.connect(g);
  g.connect(masterGain);
  g.connect(delay);
  delay.connect(masterGain);

  osc.start(now);
  osc.stop(now + 2.2);
}

/* ---- 切换区域时的深空音 ---- */
function playTransition(){
  if (!audioStarted || !audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;

  /* 低频下扫 */
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.exponentialRampToValueAtTime(32, now + 1.2);

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1400, now);
  lp.frequency.exponentialRampToValueAtTime(140, now + 1.2);
  lp.Q.value = 3.6;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.055, now + 0.08);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 1.4);

  osc.connect(lp);
  lp.connect(g);
  g.connect(masterGain);
  osc.start(now);
  osc.stop(now + 1.5);

  /* 上方飘散的高音泛音 */
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(880, now);
  osc2.frequency.exponentialRampToValueAtTime(220, now + 1.0);

  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0, now + 0.06);
  g2.gain.linearRampToValueAtTime(0.020, now + 0.12);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

  osc2.connect(g2);
  g2.connect(masterGain);
  osc2.start(now + 0.06);
  osc2.stop(now + 1.3);
}

/* =========================================================
   更新视图
   ========================================================= */
let echoTimer = 0;

function updateView(dt){
  /* 缩放推进 */
  zoomLog += ZOOM_SPEED * dt;

  const wp = WAYPOINTS[waypointIdx];

  /* 中心平滑跟随目标点 */
  centerX += (targetX - centerX) * Math.min(1, dt * 1.6);
  centerY += (targetY - centerY) * Math.min(1, dt * 1.6);

  /* 到达缩放上限：切换目标 */
  if (zoomLog >= wp.maxLog){
    waypointIdx = (waypointIdx + 1) % WAYPOINTS.length;
    const next = WAYPOINTS[waypointIdx];

    zoomLog = 0;
    centerX = next.x;
    centerY = next.y;
    targetX = next.x;
    targetY = next.y;

    flashAlpha = 0.85;
    lastFlashIdx = waypointIdx;

    playTransition();
  }

  /* 闪光淡出 */
  flashAlpha *= Math.exp(-4.2 * dt);

  /* 周期性回声（模拟深渊回响） */
  echoTimer += dt;
  const depth = zoomLog / Math.max(0.001, wp.maxLog);
  const echoInterval = 0.9 - depth * 0.55;

  if (echoTimer > echoInterval){
    echoTimer = 0;
    playEcho(0.5 + depth * 0.7, depth > 0.6);
  }

  /* 音频动态调整：越深入，嗡鸣越低越沉 */
  if (audioStarted && audioCtx && audioCtx.state === 'running'){
    const now = audioCtx.currentTime;

    if (droneFilter){
      droneFilter.frequency.setTargetAtTime(160 + depth * 90, now, 0.4);
    }
    if (droneGain){
      droneGain.gain.setTargetAtTime(0.014 + depth * 0.012, now, 0.4);
    }
    if (droneOsc1){
      droneOsc1.frequency.setTargetAtTime(41 - depth * 8, now, 0.5);
      droneOsc2.frequency.setTargetAtTime(41.7 - depth * 8, now, 0.5);
    }
  }
}

/* =========================================================
   HUD
   ========================================================= */
let uiTick = 0;

function formatZoom(z){
  const v = Math.pow(10, z);
  if (v < 100) return '×' + v.toFixed(1);
  if (v < 1000) return '×' + v.toFixed(0);
  if (v < 1e6) return '×' + (v / 1000).toFixed(1) + 'K';
  if (v < 1e9) return '×' + (v / 1e6).toFixed(1) + 'M';
  return '×' + (v / 1e9).toFixed(1) + 'G';
}

function updateHUD(){
  uiTick++;
  if (uiTick % 6 !== 0) return;

  const zoomEl = document.getElementById('zoomVal');
  const cEl = document.getElementById('cVal');
  const iterEl = document.getElementById('iterVal');
  const regionEl = document.getElementById('regionVal');

  if (zoomEl) zoomEl.textContent = formatZoom(zoomLog);

  if (cEl){
    const sr = centerX >= 0 ? '+' : '−';
    const si = centerY >= 0 ? '+' : '−';
    cEl.textContent =
      sr + Math.abs(centerX).toFixed(4) + ' ' +
      si + ' ' + Math.abs(centerY).toFixed(4) + 'i';
  }

  /* 当前迭代次数 */
  const iter = Math.round(computeMaxIter());
  if (iterEl) iterEl.textContent = iter;

  if (regionEl){
    regionEl.textContent = WAYPOINTS[waypointIdx].name;
  }
}

/* =========================================================
   迭代次数：随缩放深度自适应
   ========================================================= */
function computeMaxIter(){
  const wp = WAYPOINTS[waypointIdx];
  const depth = zoomLog / Math.max(0.001, wp.maxLog);

  /* 基础 128，随深度增加到约 700 */
  const iter = 128 + Math.pow(depth, 1.15) * 620;

  return Math.min(900, iter);
}

/* =========================================================
   主循环
   ========================================================= */
let lastTime = 0;
let startTime = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!startTime) startTime = now;
  if (!lastTime) lastTime = now;

  let dt = (now - lastTime) / 1000;
  lastTime = now;

  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  /* 更新视图 */
  updateView(dt);

  /* 计算缩放尺度 */
  const wp = WAYPOINTS[waypointIdx];
  const scale = BASE_SCALE / Math.pow(10, zoomLog);

  /* WebGL 渲染 */
  gl.uniform2f(uResolution, cw, ch);
  gl.uniform2f(uCenter, centerX, centerY);
  gl.uniform1f(uScale, scale);
  gl.uniform1f(uMaxIter, computeMaxIter());
  gl.uniform1f(uTime, (now - startTime) / 1000);
  gl.uniform1f(uFlash, flashAlpha);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  /* HUD */
  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
window.addEventListener('pointerdown', function(){
  initAudio();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    /* 立即跳转到下一个缩放区 */
    waypointIdx = (waypointIdx + 1) % WAYPOINTS.length;
    const wp = WAYPOINTS[waypointIdx];
    zoomLog = 0;
    centerX = wp.x;
    centerY = wp.y;
    targetX = wp.x;
    targetY = wp.y;
    flashAlpha = 0.85;
    playTransition();
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    /* 重置 */
    waypointIdx = 0;
    zoomLog = 0;
    centerX = WAYPOINTS[0].x;
    centerY = WAYPOINTS[0].y;
    targetX = centerX;
    targetY = centerY;
    flashAlpha = 0.6;
  }
});

/* =========================================================
   启动
   ========================================================= */
requestAnimationFrame(loop);

})();
</script>
