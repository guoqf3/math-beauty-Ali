<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>麦克斯韦方程组 · 电磁波</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;cursor:grab;}
  canvas:active{cursor:grabbing;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  /* 标题 */
  #title{
    position:absolute;top:0;left:0;
    padding:26px 34px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,255,.36);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#ff8a4a 0%,#ffb060 32%,#5ee0ff 72%,#7ab8ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(255,150,90,.42));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10.5px;letter-spacing:.18em;
    color:rgba(200,220,255,.50);font-weight:300;
  }

  /* 方程卡片 */
  #equations{
    position:absolute;top:50%;right:0;transform:translateY(-50%);
    padding:0 30px;
    display:flex;flex-direction:column;gap:9px;
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  .eq-card{
    width:clamp(200px,20vw,272px);
    padding:12px 14px;
    background:rgba(8,14,28,.52);
    border:1px solid rgba(90,140,220,.18);
    border-left:3px solid rgba(90,140,220,.30);
    border-radius:8px;
    transition:all .55s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .eq-card.active{
    background:rgba(20,35,65,.72);
    border-color:rgba(120,190,255,.55);
    box-shadow:0 0 24px rgba(100,170,255,.32),
               inset 0 0 18px rgba(100,170,255,.10);
    transform:translateX(-6px);
  }
  .eq-sym{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:12px;
    letter-spacing:.04em;
    color:rgba(180,205,250,.62);
    margin-bottom:5px;
    transition:color .5s;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .eq-card.active .eq-sym{
    color:rgba(200,230,255,.98);
    text-shadow:0 0 12px rgba(140,200,255,.72);
  }
  .eq-name{
    font-size:10px;
    letter-spacing:.18em;
    color:rgba(150,190,240,.48);
    margin-bottom:3px;
    transition:color .5s;
  }
  .eq-card.active .eq-name{
    color:rgba(255,200,140,.92);
  }
  .eq-desc{
    font-size:9px;
    letter-spacing:.06em;
    color:rgba(140,175,230,.36);
    line-height:1.5;
  }
  .eq-card.active .eq-desc{
    color:rgba(180,210,250,.72);
  }

  /* 左下状态 */
  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 34px 26px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.10em;line-height:2.0;
    color:rgba(170,200,250,.34);
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:6px;
  }
  #stats .k{color:rgba(190,205,255,.52);}
  #stats .vE{color:rgba(255,170,100,.96);font-weight:600;}
  #stats .vB{color:rgba(120,220,255,.96);font-weight:600;}

  /* 图例 */
  #legend{
    position:absolute;bottom:0;right:0;
    padding:0 34px 26px;
    display:flex;flex-direction:column;gap:6px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;
    opacity:0;animation:fade 1.6s 1.5s ease forwards;
  }
  #legend .item{
    display:flex;align-items:center;gap:9px;
    color:rgba(190,205,255,.48);
  }
  #legend .sw{
    width:18px;height:3px;border-radius:2px;
  }

  /* 音频指示 */
  #audioDot{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:14px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
    display:flex;align-items:center;gap:7px;
    white-space:nowrap;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:820px){
    #title{padding:14px 16px;}
    #title .sub{font-size:9px;}
    #equations{
      top:auto;bottom:0;transform:none;
      right:0;padding:0 16px 76px;
      flex-direction:row;
      overflow-x:auto;
      max-width:100%;
    }
    .eq-card{
      width:150px;
      padding:8px 10px;
      flex-shrink:0;
    }
    .eq-sym{font-size:10px;}
    .eq-name{font-size:8.5px;}
    .eq-desc{font-size:8px;}
    #stats{padding:0 16px 70px;font-size:8.5px;}
    #legend{display:none;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">MAXWELL'S EQUATIONS</div>
    <h1>麦克斯韦方程组</h1>
    <div class="sub">电磁波传播 · 场与场的交替</div>
  </div>

  <div id="equations">
    <div class="eq-card" data-idx="0">
      <div class="eq-sym">∇·E = ρ/ε₀</div>
      <div class="eq-name">高斯定律</div>
      <div class="eq-desc">电荷产生电场</div>
    </div>
    <div class="eq-card" data-idx="1">
      <div class="eq-sym">∇×E = −∂B/∂t</div>
      <div class="eq-name">法拉第定律</div>
      <div class="eq-desc">变化磁场产生电场</div>
    </div>
    <div class="eq-card" data-idx="2">
      <div class="eq-sym">∇·B = 0</div>
      <div class="eq-name">高斯磁定律</div>
      <div class="eq-desc">不存在磁单极子</div>
    </div>
    <div class="eq-card" data-idx="3">
      <div class="eq-sym">∇×B = μ₀J + μ₀ε₀∂E/∂t</div>
      <div class="eq-name">安培-麦克斯韦定律</div>
      <div class="eq-desc">电流与变化电场产生磁场</div>
    </div>
  </div>

  <div id="stats">
    <span class="lab">WAVE STATE</span>
    <div><span class="k">波长 λ </span><span class="vE" id="vLam">3.60</span></div>
    <div><span class="k">振幅 E₀ </span><span class="vE" id="vEamp">1.35</span></div>
    <div><span class="k">振幅 B₀ </span><span class="vB" id="vBamp">1.35</span></div>
    <div><span class="k">相位 </span><span class="vB" id="vPhase">0°</span></div>
  </div>

  <div id="legend">
    <div class="item">
      <span class="sw" style="background:linear-gradient(90deg,#ff6b35,#ffb060)"></span>
      <span>电场 E (y 方向)</span>
    </div>
    <div class="item">
      <span class="sw" style="background:linear-gradient(90deg,#00d4ff,#7ab8ff)"></span>
      <span>磁场 B (z 方向)</span>
    </div>
    <div class="item">
      <span class="sw" style="background:linear-gradient(90deg,#5a7fbf,#8ab0e0)"></span>
      <span>传播方向 (x 轴)</span>
    </div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>电流声 · 波动音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0;
let baseScale = 60;

/* =========================================================
   相机
   ========================================================= */
let baseYaw = 0.55;
let yaw = baseYaw;
let pitch = 0.26;
const CAM_DIST = 12;

/* 拖拽 */
let dragging = false;
let lastMX = 0, lastMY = 0;

/* 正弦三角函数缓存 */
let cosY = 1, sinY = 0, cosP = 1, sinP = 0;

function updateCamera(dt, t){
  /* 轻微摆动 */
  if (!dragging){
    yaw = baseYaw + Math.sin(t * 0.23) * 0.09;
  }
  cosY = Math.cos(yaw); sinY = Math.sin(yaw);
  cosP = Math.cos(pitch); sinP = Math.sin(pitch);
}

/* =========================================================
   3D 投影
   ========================================================= */
function project(x, y, z){
  /* 绕 Y 轴 yaw 旋转 */
  const X1 =  x * cosY + z * sinY;
  const Z1 = -x * sinY + z * cosY;
  const Y1 =  y;

  /* 绕 X 轴 pitch 旋转 */
  const Y2 = Y1 * cosP - Z1 * sinP;
  const Z2 = Y1 * sinP + Z1 * cosP;

  const d = CAM_DIST - Z2;
  if (d < 1){
    return { x: 0, y: 0, s: 0, depth: 99, valid: false };
  }

  const persp = CAM_DIST / d;
  const s = baseScale * persp;

  return {
    x: CX + X1 * s,
    y: CY - Y2 * s,
    s: s,
    depth: Z2,
    valid: true
  };
}

/* =========================================================
   波参数
   ========================================================= */
const WAVE = {
  L: 6,           /* 半长度（世界单位） */
  A: 1.35,        /* 振幅 */
  lambda: 3.6,    /* 波长 */
  k: 0,
  omega: 3.0,     /* 角频率 */
  phase: 0
};

function updateWaveParams(){
  WAVE.k = TAU / WAVE.lambda;
}

/* =========================================================
   布局
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5 + Math.min(W, H) * 0.045;
  CY = H * 0.5;

  baseScale = Math.min(W * 0.065, H * 0.095);

  /* 生成星空 */
  buildStars();
}
window.addEventListener('resize', resize);

/* =========================================================
   星空
   ========================================================= */
const stars = [];
function buildStars(){
  stars.length = 0;
  const n = Math.min(160, Math.round(W * H / 11000));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.0 + 0.15,
      ph: Math.random() * TAU,
      sp: 0.18 + Math.random() * 0.72,
      hue: 200 + Math.random() * 70,
      base: 0.05 + Math.random() * 0.24
    });
  }
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let humGain = null;
let waveGain = null;
let waveOsc = null;
let waveFilter = null;
let lastBeatTime = 0;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.42, ac.currentTime, 1.8);

  /* ===== 电流声：两个失谐锯齿波 + 低通 ===== */
  const hum1 = ac.createOscillator();
  hum1.type = 'sawtooth';
  hum1.frequency.value = 58;

  const hum2 = ac.createOscillator();
  hum2.type = 'sawtooth';
  hum2.frequency.value = 58.7;

  const humFilter = ac.createBiquadFilter();
  humFilter.type = 'lowpass';
  humFilter.frequency.value = 220;
  humFilter.Q.value = 3.4;

  humGain = ac.createGain();
  humGain.gain.value = 0.032;

  hum1.connect(humFilter);
  hum2.connect(humFilter);
  humFilter.connect(humGain);
  humGain.connect(master);
  hum1.start();
  hum2.start();

  /* 电流缓慢起伏 */
  const humLfo = ac.createOscillator();
  humLfo.frequency.value = 0.11;
  const humLfoG = ac.createGain();
  humLfoG.gain.value = 0.010;
  humLfo.connect(humLfoG);
  humLfoG.connect(humGain.gain);
  humLfo.start();

  /* ===== 波动音：中频正弦 + 缓慢漂移 ===== */
  waveOsc = ac.createOscillator();
  waveOsc.type = 'sine';
  waveOsc.frequency.value = 220;

  waveFilter = ac.createBiquadFilter();
  waveFilter.type = 'bandpass';
  waveFilter.frequency.value = 440;
  waveFilter.Q.value = 2.6;

  waveGain = ac.createGain();
  waveGain.gain.value = 0;

  waveOsc.connect(waveFilter);
  waveFilter.connect(waveGain);
  waveGain.connect(master);
  waveOsc.start();

  waveGain.gain.setTargetAtTime(0.018, ac.currentTime, 3.0);

  /* 波动音缓慢摆动 */
  const waveLfo = ac.createOscillator();
  waveLfo.frequency.value = 0.14;
  const waveLfoG = ac.createGain();
  waveLfoG.gain.value = 60;
  waveLfo.connect(waveLfoG);
  waveLfoG.connect(waveOsc.frequency);
  waveLfo.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* 波峰经过时的脉冲音 */
function playWavePing(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  if (now - lastBeatTime < 0.28) return;
  lastBeatTime = now;

  const baseF = 380 + Math.random() * 180;
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(baseF, now);
  osc.frequency.exponentialRampToValueAtTime(baseF * 1.5, now + 0.14);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.014, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.24);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.26);
}

/* =========================================================
   方程高亮
   ========================================================= */
const eqCards = [];
let eqIdx = 0;
let eqTimer = 0;
const EQ_INTERVAL = 4.2;

function initEqCards(){
  const cards = document.querySelectorAll('.eq-card');
  for (let i = 0; i < cards.length; i++){
    eqCards.push(cards[i]);
  }
  updateEqHighlight();
}

function updateEqHighlight(){
  for (let i = 0; i < eqCards.length; i++){
    eqCards[i].classList.toggle('active', i === eqIdx);
  }
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(t){
  const bg = ctx.createRadialGradient(
    CX, CY, 0, CX, CY, Math.max(W, H) * 0.86
  );
  bg.addColorStop(0.00, '#060d1a');
  bg.addColorStop(0.42, '#030711');
  bg.addColorStop(1.00, '#010207');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星空 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.012) continue;
    ctx.fillStyle = 'hsla(' + s.hue + ', 80%, 86%, ' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：地面网格
   ========================================================= */
function drawGround(){
  const y0 = -2.0;
  const L = WAVE.L + 0.6;
  const Z = 2.6;

  ctx.strokeStyle = 'rgba(70, 120, 200, 0.075)';
  ctx.lineWidth = 1;

  /* 沿 z 方向的线 */
  for (let x = -WAVE.L; x <= WAVE.L + 0.001; x += 1){
    const p1 = project(x, y0, -Z);
    const p2 = project(x, y0, Z);
    if (!p1.valid || !p2.valid) continue;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }

  /* 沿 x 方向的线 */
  for (let z = -Z; z <= Z + 0.001; z += 1){
    const p1 = project(-WAVE.L, y0, z);
    const p2 = project(WAVE.L, y0, z);
    if (!p1.valid || !p2.valid) continue;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
}

/* =========================================================
   绘制：传播轴
   ========================================================= */
function drawAxis(){
  const p1 = project(-WAVE.L, 0, 0);
  const p2 = project(WAVE.L, 0, 0);
  if (!p1.valid || !p2.valid) return;

  ctx.lineCap = 'round';

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.strokeStyle = 'rgba(120, 170, 240, 0.12)';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';

  /* 主体 */
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.strokeStyle = 'rgba(150, 190, 250, 0.42)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 传播方向箭头 */
  const px = p2.x, py = p2.y;
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const dl = Math.sqrt(dx*dx + dy*dy);
  if (dl > 2){
    const ux = dx / dl, uy = dy / dl;
    const hs = 12;

    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px - ux * hs + uy * hs * 0.55, py - uy * hs - ux * hs * 0.55);
    ctx.lineTo(px - ux * hs - uy * hs * 0.55, py - uy * hs + ux * hs * 0.55);
    ctx.closePath();
    ctx.fillStyle = 'rgba(150, 190, 250, 0.62)';
    ctx.fill();
  }
}

/* =========================================================
   绘制：E/B 波
   ========================================================= */
let lastPeakTime = 0;

function drawWaves(t){
  const N = 130;
  const L = WAVE.L;
  const A = WAVE.A;
  const k = WAVE.k;
  const ph0 = WAVE.phase;

  /* 采样 */
  const samples = [];
  for (let i = 0; i <= N; i++){
    const x = -L + 2 * L * i / N;
    const ph = k * x - ph0;

    /* 两端边缘淡出 */
    const u = i / N;
    const edge = Math.min(1, Math.min(u, 1 - u) / 0.075);

    const eVal = A * Math.sin(ph) * edge;
    const bVal = A * Math.sin(ph) * edge;

    const base = project(x, 0, 0);
    const ePt  = project(x, eVal, 0);
    const bPt  = project(x, 0, bVal);

    samples.push({ x: x, eVal: eVal, bVal: bVal, base: base, ePt: ePt, bPt: bPt, ph: ph, edge: edge });
  }

  /* ===== 1. E 场幕帘 ===== */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  for (let i = 0; i < samples.length; i++){
    const s = samples[i];
    if (!s.base.valid || !s.ePt.valid) continue;

    const mag = Math.abs(s.eVal) / A;
    if (mag < 0.005) continue;

    const alpha = 0.030 + mag * 0.16;

    ctx.beginPath();
    ctx.moveTo(s.base.x, s.base.y);
    ctx.lineTo(s.ePt.x, s.ePt.y);
    ctx.strokeStyle = 'hsla(22, 100%, ' + (58 + mag * 22) + '%, ' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }

  /* ===== 2. B 场幕帘 ===== */
  for (let i = 0; i < samples.length; i++){
    const s = samples[i];
    if (!s.base.valid || !s.bPt.valid) continue;

    const mag = Math.abs(s.bVal) / A;
    if (mag < 0.005) continue;

    const alpha = 0.030 + mag * 0.16;

    ctx.beginPath();
    ctx.moveTo(s.base.x, s.base.y);
    ctx.lineTo(s.bPt.x, s.bPt.y);
    ctx.strokeStyle = 'hsla(198, 100%, ' + (56 + mag * 22) + '%, ' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }

  /* ===== 3. E 曲线 ===== */
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  /* 光晕层 */
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < samples.length; i++){
    const p = samples[i].ePt;
    if (!p.valid){ started = false; continue; }
    if (!started){ ctx.moveTo(p.x, p.y); started = true; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(255, 140, 60, 0.22)';
  ctx.lineWidth = 9;
  ctx.stroke();

  /* 中层 */
  ctx.beginPath();
  started = false;
  for (let i = 0; i < samples.length; i++){
    const p = samples[i].ePt;
    if (!p.valid){ started = false; continue; }
    if (!started){ ctx.moveTo(p.x, p.y); started = true; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(255, 165, 85, 0.52)';
  ctx.lineWidth = 3.6;
  ctx.stroke();

  /* 核心亮线 */
  ctx.beginPath();
  started = false;
  for (let i = 0; i < samples.length; i++){
    const p = samples[i].ePt;
    if (!p.valid){ started = false; continue; }
    if (!started){ ctx.moveTo(p.x, p.y); started = true; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(255, 220, 160, 0.95)';
  ctx.lineWidth = 1.7;
  ctx.stroke();

  /* ===== 4. B 曲线 ===== */
  /* 光晕层 */
  ctx.beginPath();
  started = false;
  for (let i = 0; i < samples.length; i++){
    const p = samples[i].bPt;
    if (!p.valid){ started = false; continue; }
    if (!started){ ctx.moveTo(p.x, p.y); started = true; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(0, 180, 255, 0.22)';
  ctx.lineWidth = 9;
  ctx.stroke();

  /* 中层 */
  ctx.beginPath();
  started = false;
  for (let i = 0; i < samples.length; i++){
    const p = samples[i].bPt;
    if (!p.valid){ started = false; continue; }
    if (!started){ ctx.moveTo(p.x, p.y); started = true; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(60, 200, 255, 0.52)';
  ctx.lineWidth = 3.6;
  ctx.stroke();

  /* 核心 */
  ctx.beginPath();
  started = false;
  for (let i = 0; i < samples.length; i++){
    const p = samples[i].bPt;
    if (!p.valid){ started = false; continue; }
    if (!started){ ctx.moveTo(p.x, p.y); started = true; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(190, 240, 255, 0.95)';
  ctx.lineWidth = 1.7;
  ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';

  /* ===== 5. 波峰高亮标记 ===== */
  /* 找出当前波峰位置 */
  for (let i = 1; i < samples.length - 1; i++){
    const s = samples[i];
    if (!s.ePt.valid) continue;

    /* 检视 E 场波峰 */
    if (Math.abs(s.eVal) > A * 0.96 && s.edge > 0.9){
      const p = s.ePt;

      /* 脉冲光晕 */
      const pulse = 1 + 0.35 * Math.sin(t * 5 + i * 0.5);
      const r = 8 * pulse;

      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.6);
      g.addColorStop(0.00, 'rgba(255, 240, 200, 0.72)');
      g.addColorStop(0.42, 'rgba(255, 180, 100, 0.28)');
      g.addColorStop(1.00, 'rgba(255, 140, 60, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 2.6, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      /* 只在第一次碰到时触发音效 */
      if (t - lastPeakTime > 0.25){
        lastPeakTime = t;
        playWavePing();
      }
    }
  }
}

/* =========================================================
   绘制：场方向指示
   ========================================================= */
function drawFieldLabels(){
  /* E 场方向指示：在 x = -5 处画一个小箭头 */
  const px = -5.2;

  const eb = project(px, 0, 0);
  const et = project(px, 1.9, 0);

  if (eb.valid && et.valid){
    drawArrow(eb, et, 'rgba(255, 180, 110, 0.62)');

    ctx.font = '500 11px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255, 190, 130, 0.72)';
    ctx.fillText('E', et.x + 8, et.y);
  }

  const bb = project(px, 0, 0);
  const bt = project(px, 0, 1.9);

  if (bb.valid && bt.valid){
    drawArrow(bb, bt, 'rgba(120, 220, 255, 0.62)');

    ctx.font = '500 11px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(140, 225, 255, 0.72)';
    ctx.fillText('B', bt.x + 8, bt.y);
  }
}

function drawArrow(a, b, color){
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dl = Math.sqrt(dx*dx + dy*dy);
  if (dl < 3) return;

  const ux = dx / dl, uy = dy / dl;
  const hs = Math.min(9, dl * 0.3);
  const bx = b.x - ux * hs;
  const by = b.y - uy * hs;

  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(bx, by);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(bx - uy * hs * 0.55, by + ux * hs * 0.55);
  ctx.lineTo(bx + uy * hs * 0.55, by - ux * hs * 0.55);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

/* =========================================================
   更新
   ========================================================= */
let lastT = 0;
let phaseDeg = 0;

function update(dt){
  if (dt > 0.05) dt = 0.05;

  /* 波相位推进 */
  WAVE.phase += WAVE.omega * dt;

  /* 防止无限增长 */
  if (WAVE.phase > TAU * 1000){
    WAVE.phase -= TAU * 1000;
  }

  /* 方程切换 */
  eqTimer += dt;
  if (eqTimer > EQ_INTERVAL){
    eqTimer = 0;
    eqIdx = (eqIdx + 1) % 4;
    updateEqHighlight();
  }

  /* 音频动态调整 */
  if (audioReady && ac && ac.state === 'running'){
    /* 电流声随相位强度变化 */
    const now = ac.currentTime;
    const intensity = 0.5 + 0.5 * Math.sin(WAVE.phase * 0.5);
    if (humGain){
      humGain.gain.setTargetAtTime(0.026 + intensity * 0.014, now, 0.4);
    }
    if (waveOsc && waveFilter){
      /* 波动音频率随波速缓慢摆动 */
      const f = 210 + intensity * 60;
      waveOsc.frequency.setTargetAtTime(f, now, 0.5);
      waveFilter.frequency.setTargetAtTime(f * 2, now, 0.5);
    }
  }
}

/* =========================================================
   HUD
   ========================================================= */
let uiTick = 0;

function updateHUD(){
  uiTick++;
  if (uiTick % 5 !== 0) return;

  const lam = document.getElementById('vLam');
  const ea = document.getElementById('vEamp');
  const ba = document.getElementById('vBamp');
  const ph = document.getElementById('vPhase');

  if (lam) lam.textContent = WAVE.lambda.toFixed(2);
  if (ea) ea.textContent = WAVE.A.toFixed(2);
  if (ba) ba.textContent = WAVE.A.toFixed(2);

  /* 相位：0..360 */
  const deg = ((WAVE.phase / TAU) % 1 + 1) % 1;
  if (ph) ph.textContent = Math.round(deg * 360) + '°';
}

/* =========================================================
   主循环
   ========================================================= */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  /* 相机 */
  updateCamera(dt, t);

  /* 更新 */
  update(dt);

  /* 渲染 */
  drawBackground(t);
  drawGround();
  drawAxis();
  drawWaves(t);
  drawFieldLabels();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.20)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.88)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
canvas.addEventListener('pointerdown', function(e){
  initAudio();
  dragging = true;
  lastMX = e.clientX;
  lastMY = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
});

canvas.addEventListener('pointermove', function(e){
  if (!dragging) return;

  const dx = e.clientX - lastMX;
  const dy = e.clientY - lastMY;

  baseYaw += dx * 0.006;
  pitch += dy * 0.005;

  if (pitch > 1.10) pitch = 1.10;
  if (pitch < -0.35) pitch = -0.35;

  yaw = baseYaw;

  lastMX = e.clientX;
  lastMY = e.clientY;
});

function endDrag(e){
  dragging = false;
  if (e && e.pointerId !== undefined){
    try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* 滚轮：调整波长 */
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  initAudio();

  WAVE.lambda += e.deltaY * 0.0016;
  if (WAVE.lambda < 1.6) WAVE.lambda = 1.6;
  if (WAVE.lambda > 7.5) WAVE.lambda = 7.5;
  updateWaveParams();
}, { passive: false });

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    WAVE.phase = 0;
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    baseYaw = 0.55;
    pitch = 0.26;
    WAVE.lambda = 3.6;
    updateWaveParams();
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
updateWaveParams();
initEqCards();
requestAnimationFrame(loop);

})();
