<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪球面闭合曲线 · 负曲率之美</title>
    <style>
        :root {
            --bg: #04040e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.05rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.11em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(190, 165, 140, 0.5), 0 0 6px rgba(170, 148, 125, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.68rem, 1.25vw, 0.82rem);
            font-weight: 300;
            letter-spacing: 0.07em;
            color: rgba(200, 192, 180, 0.7);
            margin-top: 0.25em;
            text-shadow: 0 0 13px rgba(155, 140, 120, 0.3);
        }
        #formula-overlay {
            bottom: clamp(16px, 4vh, 44px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.6rem, 1.1vw, 0.82rem);
            font-style: italic;
            letter-spacing: 0.04em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(155, 140, 125, 0.42), 0 0 5px rgba(165, 148, 130, 0.28);
            line-height: 1.6;
            background: rgba(10, 9, 16, 0.48);
            padding: 0.42em 1.3em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(145, 125, 105, 0.22);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.32em 0.8em;
                letter-spacing: 0.02em;
                font-size: 0.52rem;
            }
            #title-overlay .title {
                letter-spacing: 0.07em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">伪球面闭合曲线 · 负曲率之美</div>
        <div class="subtitle">Closed Loops on the Pseudosphere</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            ψ(u,v) = ( sech(u) cos v , sech(u) sin v , u − tanh(u) )
            &emsp;|&emsp; (u,v) = (u₀ + r cos(t+φ), v₀ + r sin(t+φ))
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        // 伪球面参数
        const PSEUDOSPHERE_SCALE = 1.45; // 缩放
        const U_MAX = 2.8;               // u 上限
        const CURVE_SEGMENTS = 780;
        const TOTAL_VERTICES = CURVE_SEGMENTS + 1;

        // ==================== 三种颜色 ====================
        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');
        const THREE_COLORS = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        // 伪球面上点计算 (Tractroid)
        function pseudosphere(u, v) {
            const sechU = 1 / Math.cosh(u);
            const x = PSEUDOSPHERE_SCALE * sechU * Math.cos(v);
            const y = PSEUDOSPHERE_SCALE * sechU * Math.sin(v);
            const z = PSEUDOSPHERE_SCALE * (u - Math.tanh(u));
            return [x, y, z];
        }

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x04040e, 0.00005);

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.4, 18);
        camera.position.set(0.85, 0.75, 4.6);
        camera.lookAt(0, 0.0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 主旋转组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 190;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 3.5 + Math.random() * 4.2;
            starPosArr[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phi) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xb6b0c9,
            size: 0.009,
            transparent: true,
            opacity: 0.26,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const starPts = new THREE.Points(starGeom, starMat);
        starsGroup.add(starPts);

        // 伪球面附近漂浮光点
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 85;
        const glowArr = new Float32Array(glowCount * 3);
        for (let i = 0; i < glowCount; i++) {
            const u = 0.3 + Math.random() * (U_MAX - 0.3);
            const v = Math.random() * Math.PI * 2;
            const [x, y, z] = pseudosphere(u, v);
            glowArr[i * 3] = x + (Math.random() - 0.5) * 0.35;
            glowArr[i * 3 + 1] = y + (Math.random() - 0.5) * 0.35;
            glowArr[i * 3 + 2] = z + (Math.random() - 0.5) * 0.35;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e2cc,
            size: 0.022,
            transparent: true,
            opacity: 0.42,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const glowPts = new THREE.Points(glowGeom, glowMat);
        glowGroup.add(glowPts);

        // ==================== 伪球面参考线框 ====================
        const surfaceWireGroup = new THREE.Group();
        mainGroup.add(surfaceWireGroup);
        const bgWireMats = [];

        // u-曲线（水平圆）：固定u，v从0到2π
        function createUCircle(uValue, steps = 280) {
            const pts = [];
            for (let i = 0; i <= steps; i++) {
                const v = (i / steps) * Math.PI * 2;
                const [x, y, z] = pseudosphere(uValue, v);
                pts.push(new THREE.Vector3(x, y, z));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x3c3852,
                transparent: true,
                opacity: 0.13,
                depthWrite: false,
            });
            bgWireMats.push(mat);
            return new THREE.Line(geom, mat);
        }

        // v-曲线（子午线）：固定v，u从0.2到U_MAX
        function createVCurve(vValue, steps = 260) {
            const pts = [];
            for (let i = 0; i <= steps; i++) {
                const u = 0.2 + (i / steps) * (U_MAX - 0.2);
                const [x, y, z] = pseudosphere(u, vValue);
                pts.push(new THREE.Vector3(x, y, z));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x3c3852,
                transparent: true,
                opacity: 0.13,
                depthWrite: false,
            });
            bgWireMats.push(mat);
            return new THREE.Line(geom, mat);
        }

        const U_STEP = 0.22;
        const V_COUNT = 22;

        // 生成水平圆（u-曲线）
        for (let u = 0.35; u <= U_MAX + 0.001; u += U_STEP) {
            surfaceWireGroup.add(createUCircle(u));
        }
        // 生成子午线（v-曲线）
        for (let i = 0; i < V_COUNT; i++) {
            const v = (i / V_COUNT) * Math.PI * 2;
            surfaceWireGroup.add(createVCurve(v));
        }
        // 边界强调（最大u处的圆）
        {
            const rimCircle = createUCircle(U_MAX);
            rimCircle.material.color.setHex(0x58527a);
            rimCircle.material.opacity = 0.20;
            surfaceWireGroup.add(rimCircle);
        }

        // ==================== 伪球面上闭合曲线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        /**
         * 在伪球面上创建闭合曲线
         * @param {number} uCenter - 参数平面中圆的中心u坐标
         * @param {number} vCenter - 参数平面中圆的中心v坐标
         * @param {number} radius - 圆的半径
         * @param {THREE.Color} color - 曲线颜色
         */
        function createClosedPseudosphereCurve(uCenter, vCenter, radius, color) {
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            for (let i = 0; i <= CURVE_SEGMENTS; i++) {
                const t = (i / CURVE_SEGMENTS) * Math.PI * 2;
                const u = uCenter + radius * Math.cos(t);
                const v = vCenter + radius * Math.sin(t);
                // 钳制u在有效范围
                const clampedU = Math.max(0.18, Math.min(U_MAX - 0.02, u));
                const [x, y, z] = pseudosphere(clampedU, v);
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setDrawRange(0, 0);

            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
            });
            const line = new THREE.Line(geometry, material);
            allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
            return line;
        }

        // 定义三组中心点（在参数平面内均匀选取）
        const centers = [];
        const numCentersPerColor = 6;
        // 为每种颜色准备不同(u,v)中心，通过斐波那契球面分布在柱坐标上
        const totalCenters = 18;
        const phiGolden = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < totalCenters; i++) {
            // 使用z范围映射到u: u in [0.5, U_MAX-0.5]
            const t = i / (totalCenters - 0.999);
            const u = 0.55 + t * (U_MAX - 1.1);
            const v = phiGolden * i;
            centers.push({ u, v });
        }

        // 半径序列：从小到大
        const radii = [0.24, 0.32, 0.44, 0.56, 0.68, 0.80];

        // 分配颜色：按中心顺序循环
        centers.forEach((center, idx) => {
            const color = THREE_COLORS[idx % 3];
            const radius = radii[idx % radii.length];
            curvesGroup.add(createClosedPseudosphereCurve(center.u, center.v, radius, color));
        });

        const totalCurves = allCurveData.length; // 18条

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        clock.getDelta(); // 消耗初始累积时间

        function getCycleTime() {
            const now = performance.now() / 1000;
            return (now - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            // 主旋转——缓慢而优雅
            mainGroup.rotation.y += 0.25 * dt;
            mainGroup.rotation.x += 0.05 * dt;
            mainGroup.rotation.z += 0.013 * Math.sin(cycleTime * 0.58) * dt;

            // 相机微动
            const sway = 0.09 * Math.sin(cycleTime * (Math.PI * 2 / 34));
            camera.position.y = 0.75 + sway;
            camera.lookAt(0, 0.0, 0);

            // 绘制进度
            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            // 更新所有曲线绘制范围
            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            // 背景透明度渐变
            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.26 * bgOp;
            glowMat.opacity = 0.42 * bgOp;
            for (const mat of bgWireMats) {
                mat.opacity = (mat.opacity ?? 0.13) * bgOp;
            }

            // 粒子微动
            glowGroup.position.y = Math.sin(cycleTime * 1.10) * 0.06;
            starsGroup.rotation.y += dt * 0.024;
            starsGroup.rotation.x += dt * 0.017;

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 可选重置键
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        // 预热渲染，防止第一帧空白
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🎺 伪球面闭合曲线动画已启动');
        console.log(`   - ${totalCurves} 条闭合曲线，3种颜色各${totalCurves / 3}条`);
        console.log(`   - 伪球面方程：x²+y² = sech²(u)，z = u − tanh(u)`);
        console.log(`   - 采样点：${CURVE_SEGMENTS}，周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
