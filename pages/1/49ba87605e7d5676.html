<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lissajous纽结 · 频率交响</title>
    <style>
        :root {
            --bg: #03030e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.05rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(180, 160, 220, 0.5), 0 0 6px rgba(160, 140, 200, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.68rem, 1.25vw, 0.82rem);
            font-weight: 300;
            letter-spacing: 0.07em;
            color: rgba(200, 192, 220, 0.7);
            margin-top: 0.25em;
            text-shadow: 0 0 13px rgba(160, 145, 190, 0.3);
        }
        #formula-overlay {
            bottom: clamp(16px, 4vh, 44px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.72rem, 1.35vw, 1.0rem);
            font-style: italic;
            letter-spacing: 0.05em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(160, 145, 135, 0.42), 0 0 5px rgba(170, 155, 140, 0.28);
            line-height: 1.55;
            background: rgba(10, 9, 16, 0.48);
            padding: 0.42em 1.3em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(130, 115, 155, 0.22);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.35em 0.9em;
                letter-spacing: 0.03em;
                font-size: 0.66rem;
            }
            #title-overlay .title {
                letter-spacing: 0.07em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">Lissajous纽结 · 频率交响</div>
        <div class="subtitle">Harmonic Knots in a Cube</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            γ(t) = (cos(a t + φ<sub>x</sub>), cos(b t + φ<sub>y</sub>), cos(c t + φ<sub>z</sub>))
            &emsp;|&emsp; t ∈ [0, 2π]
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        // Lissajous曲线采样点数
        const CURVE_SEGMENTS = 640;
        const TOTAL_VERTICES = CURVE_SEGMENTS + 1;

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03030e, 0.0001);

        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(1.1, 1.2, 4.2);
        camera.lookAt(0, 0.05, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 主旋转组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 200;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 2.2 + Math.random() * 3.5;
            starPosArr[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phi) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xb0b8d8,
            size: 0.011,
            transparent: true,
            opacity: 0.35,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const starPts = new THREE.Points(starGeom, starMat);
        starsGroup.add(starPts);

        // 立方体附近漂浮光点
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 70;
        const glowArr = new Float32Array(glowCount * 3);
        for (let i = 0; i < glowCount; i++) {
            glowArr[i * 3] = (Math.random() - 0.5) * 2.4;
            glowArr[i * 3 + 1] = (Math.random() - 0.5) * 2.4;
            glowArr[i * 3 + 2] = (Math.random() - 0.5) * 2.4;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e2c8,
            size: 0.022,
            transparent: true,
            opacity: 0.45,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const glowPts = new THREE.Points(glowGeom, glowMat);
        glowGroup.add(glowPts);

        // ==================== 立方体线框（参考框架） ====================
        const cubeWireGroup = new THREE.Group();
        mainGroup.add(cubeWireGroup);
        const cubeSize = 2.0; // 范围[-1,1]
        const h = cubeSize / 2;
        // 手工创建12条棱，每条用两个点，存入LineSegments geometry
        const corners = [
            [-h, -h, -h], [ h, -h, -h], [ h,  h, -h], [-h,  h, -h], // 底面
            [-h, -h,  h], [ h, -h,  h], [ h,  h,  h], [-h,  h,  h]  // 顶面
        ];
        const edges = [
            [0,1], [1,2], [2,3], [3,0], // 底面
            [4,5], [5,6], [6,7], [7,4], // 顶面
            [0,4], [1,5], [2,6], [3,7]  // 竖边
        ];
        const edgeVertices = [];
        edges.forEach(([i, j]) => {
            edgeVertices.push(...corners[i], ...corners[j]);
        });
        const cubeEdgeGeom = new THREE.BufferGeometry();
        cubeEdgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgeVertices, 3));
        const cubeEdgeMat = new THREE.LineBasicMaterial({
            color: 0x6a6588,
            transparent: true,
            opacity: 0.18,
            depthWrite: false,
        });
        const cubeLines = new THREE.LineSegments(cubeEdgeGeom, cubeEdgeMat);
        cubeWireGroup.add(cubeLines);

        // ==================== Lissajous曲线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        /**
         * 创建Lissajous曲线
         * @param {number} a - 频率1
         * @param {number} b - 频率2
         * @param {number} c - 频率3
         * @param {number} phaseX 
         * @param {number} phaseY 
         * @param {number} phaseZ 
         * @param {THREE.Color} color 
         * @returns {THREE.Line}
         */
        function createLissajousCurve(a, b, c, phaseX, phaseY, phaseZ, color) {
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            for (let i = 0; i <= CURVE_SEGMENTS; i++) {
                const t = (i / CURVE_SEGMENTS) * Math.PI * 2;
                positions[i * 3] = Math.cos(a * t + phaseX);
                positions[i * 3 + 1] = Math.cos(b * t + phaseY);
                positions[i * 3 + 2] = Math.cos(c * t + phaseZ);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setDrawRange(0, 0);

            const material = new THREE.LineBasicMaterial({
                color,
                transparent: true,
                opacity: 0.8,
                depthWrite: false,
            });
            const line = new THREE.Line(geometry, material);
            allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
            return line;
        }

        // 频率组（互质三元组）
        const freqTriplets = [
            [2, 3, 5], [2, 3, 7], [2, 5, 7], [3, 4, 5],
            [3, 5, 7], [4, 5, 7], [2, 3, 11], [2, 5, 9],
            [3, 4, 7], [3, 5, 8], [4, 5, 9], [5, 6, 7],
            [2, 7, 9], [3, 7, 8], [4, 7, 9], [5, 7, 8],
            [5, 8, 9], [2, 9, 11], [3, 8, 11], [4, 9, 11]
        ];

        // 为每个频率组生成2-3个不同相位的变体，形成丰富线条
        const phaseSets = [];
        freqTriplets.forEach(([a, b, c]) => {
            // 基础相位
            phaseSets.push({ a, b, c, phaseX: 0, phaseY: 0, phaseZ: 0 });
            phaseSets.push({ a, b, c, phaseX: Math.PI/2, phaseY: Math.PI/3, phaseZ: Math.PI/4 });
            // 避免过多线条，选择部分频率组增加第三个变体
            if ((a + b + c) % 2 === 0) {
                phaseSets.push({ a, b, c, phaseX: Math.PI/3, phaseY: Math.PI/5, phaseZ: Math.PI/6 });
            }
        });

        // 颜色生成
        function getColor(index, total) {
            const hue = (index / total) * 0.85 + 0.1;
            return new THREE.Color().setHSL(hue % 1, 0.7, 0.68);
        }

        // 创建所有Lissajous曲线
        phaseSets.forEach((ps, idx) => {
            const color = getColor(idx, phaseSets.length);
            const curve = createLissajousCurve(ps.a, ps.b, ps.c, ps.phaseX, ps.phaseY, ps.phaseZ, color);
            curvesGroup.add(curve);
        });

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;

        function getCycleTime() {
            const now = performance.now() / 1000;
            return (now - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            // 主旋转
            mainGroup.rotation.y += 0.25 * dt;
            mainGroup.rotation.x += 0.07 * dt;
            mainGroup.rotation.z += 0.02 * Math.sin(cycleTime * 0.6) * dt;

            // 相机微动
            const sway = 0.1 * Math.sin(cycleTime * (Math.PI * 2 / 32));
            camera.position.y = 1.2 + sway;
            camera.lookAt(0, 0.05, 0);

            // 绘制进度
            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            // 更新所有曲线绘制范围
            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            // 背景透明度渐变
            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.35 * bgOp;
            glowMat.opacity = 0.45 * bgOp;
            cubeEdgeMat.opacity = 0.18 * bgOp;

            // 粒子微动
            glowGroup.rotation.y += dt * 0.1;
            glowGroup.rotation.x += dt * 0.05;
            starsGroup.rotation.y += dt * 0.03;
            starsGroup.rotation.x += dt * 0.02;

            renderer.render(scene, camera);
        }

        // ==================== 响应式 ====================
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 可选重置键
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        // 预热渲染，防止第一帧空白
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🎵 Lissajous纽结动画已启动');
        console.log(`   - ${phaseSets.length} 条频率组合曲线`);
        console.log(`   - 周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
