<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 损失函数 · 进化学习数字生命</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#03040a;overflow:hidden;}
  body{
    font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    color:#bfe6f5;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;height:100%;width:100%;}

  /* ================= 左侧公式面板 ================= */
  #panel{
    flex:0 0 20%;
    min-width:196px;
    max-width:360px;
    height:100%;
    padding:20px 16px;
    display:flex;flex-direction:column;gap:15px;
    background:
      radial-gradient(120% 60% at 20% 0%,rgba(0,180,255,.10),transparent 62%),
      linear-gradient(180deg,#05070f,#04060c 70%,#03040a);
    border-right:1px solid rgba(60,220,255,.13);
    position:relative;overflow:hidden;
  }
  #panel::after{
    content:'';position:absolute;left:0;top:0;width:2px;height:100%;
    background:linear-gradient(180deg,transparent,rgba(0,220,255,.55),transparent);
    opacity:.6;pointer-events:none;
  }
  .title{
    font-size:clamp(13px,1.15vw,18px);
    font-weight:700;letter-spacing:.12em;color:#eafcff;
    text-shadow:0 0 14px rgba(0,220,255,.55);
  }
  .subtitle{
    margin-top:-10px;font-size:9px;letter-spacing:.26em;
    color:rgba(120,220,255,.45);
  }

  /* 公式 */
  .formula{
    display:flex;align-items:center;flex-wrap:wrap;gap:3px 5px;
    font-family:"Times New Roman",Georgia,serif;
    font-size:clamp(13px,1.12vw,19px);
    color:#e2faff;
    text-shadow:0 0 12px rgba(0,220,255,.5);
    padding:12px 10px;border-radius:9px;
    border:1px solid rgba(60,200,255,.15);
    background:linear-gradient(180deg,rgba(0,140,200,.08),rgba(0,0,0,0));
  }
  .formula .lhs{font-style:italic;font-size:1.18em;}
  .frac{
    display:inline-flex;flex-direction:column;align-items:center;
    line-height:1.05;font-size:.82em;vertical-align:middle;
  }
  .frac i{font-style:italic;padding:0 4px;}
  .frac b{font-weight:400;font-style:italic;border-top:1px solid currentColor;padding:0 4px;}
  .sum{
    display:inline-flex;flex-direction:column;align-items:center;
    line-height:1;vertical-align:middle;margin:0 2px;
  }
  .sum em{font-style:italic;font-size:.5em;opacity:.85;}
  .sum strong{font-size:1.45em;font-weight:400;line-height:.92;}
  .sum .lo{margin-top:-.1em;}
  .formula .term{font-style:italic;}

  .note{
    margin:-6px 0 0;font-size:9.5px;line-height:1.7;
    color:rgba(150,205,228,.5);letter-spacing:.04em;
  }
  .note i{font-family:"Times New Roman",serif;font-style:italic;color:rgba(180,235,255,.75);}

  /* 指标 */
  .metrics{display:flex;flex-direction:column;gap:7px;}
  .m{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:5px 9px;border-radius:6px;
    background:rgba(0,120,180,.08);
    border-left:2px solid rgba(0,220,255,.38);
  }
  .m span{letter-spacing:.16em;color:rgba(140,210,235,.6);font-size:9px;}
  .m b{
    font-weight:600;color:#5ef0ff;font-size:12px;
    text-shadow:0 0 10px rgba(0,220,255,.65);
  }

  /* 曲线 */
  #chart{
    width:100%;height:64px;flex:0 0 auto;display:block;
    border-radius:7px;
    background:rgba(0,80,120,.09);
    border:1px solid rgba(60,200,255,.11);
  }

  /* 进度 */
  .bar{
    height:4px;border-radius:2px;flex:0 0 auto;
    background:rgba(80,180,220,.15);overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:0%;border-radius:2px;
    background:linear-gradient(90deg,#ff3df0,#7a5cff,#22e6ff);
    box-shadow:0 0 12px rgba(0,220,255,.85);
    transition:width .08s linear;
  }
  .phase{
    margin-top:auto;font-size:10px;letter-spacing:.1em;
    color:rgba(125,232,255,.8);
    text-shadow:0 0 10px rgba(0,200,255,.45);
  }

  /* ================= 右侧舞台 ================= */
  #stage{
    flex:1 1 80%;position:relative;background:#000;
    min-width:0;overflow:hidden;
  }
  #life{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="title">交叉熵损失</div>
    <div class="subtitle">CROSS-ENTROPY LOSS</div>

    <div class="formula">
      <span class="lhs">L</span>
      <span>=</span>
      <span>−</span>
      <span class="frac"><i>1</i><b>N</b></span>
      <span class="sum"><em>N</em><strong>∑</strong><em class="lo">i=1</em></span>
      <span class="term">y<sub>i</sub>·log&thinsp;p<sub>i</sub></span>
    </div>

    <p class="note">
      <i>y<sub>i</sub></i> — 真实标签 ∈ {0,1}<br>
      <i>p<sub>i</sub></i> — 模型预测概率<br>
      梯度下降最小化 <i>L</i>，驱动形态进化
    </p>

    <div class="metrics">
      <div class="m"><span>STEP</span><b id="m-iter">0</b></div>
      <div class="m"><span>LOSS</span><b id="m-loss">2.3026</b></div>
      <div class="m"><span>ACC</span><b id="m-acc">9.8%</b></div>
    </div>

    <canvas id="chart"></canvas>

    <div class="bar"><i id="m-bar"></i></div>
    <div class="phase" id="m-phase">初始化 · 简单发光体</div>
  </aside>

  <main id="stage">
    <canvas id="life"></canvas>
  </main>
</div>

<script>
"use strict";
(function () {

  const TAU = Math.PI * 2;

  /* ============ 画布初始化 ============ */
  const cv = document.getElementById('life');
  const ctx = cv.getContext('2d');
  const chartCv = document.getElementById('chart');
  const chartCtx = chartCv.getContext('2d');

  let W = 1, H = 1, CX = 0, CY = 0, DPR = 1, M = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    const r = cv.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width * DPR));
    H = Math.max(1, Math.round(r.height * DPR));
    cv.width = W;
    cv.height = H;
    CX = W / 2;
    CY = H / 2;
    M = Math.min(W, H);

    const cr = chartCv.getBoundingClientRect();
    chartCv.width = Math.max(1, Math.round(cr.width * DPR));
    chartCv.height = Math.max(1, Math.round(cr.height * DPR));
  }
  window.addEventListener('resize', resize);

  /* ============ 生命体数据 ============ */
  const N = 200;          // 体轴采样点数
  const spine = [];       // 每帧重建

  // 由进度 P 与时间 t 生成中心线、法线、体宽
  function buildSpine(P, t) {
    const len = M * (0.42 + 0.72 * P);
    const ds = len / (N - 1);
    const A1 = 0.30 + 1.55 * P;   // 主弯曲
    const A2 = 0.10 + 0.75 * P;   // 次弯曲

    const rx = new Float32Array(N);
    const ry = new Float32Array(N);

    let x = 0, y = 0, ang = -Math.PI * 0.30;
    for (let i = 0; i < N; i++) {
      const s = i / (N - 1);
      rx[i] = x; ry[i] = y;
      const turn = A1 * Math.sin(s * 5.2 + t * 1.35)
                 + A2 * Math.sin(s * 11.3 - t * 2.50);
      ang += turn * ds * 0.0026;
      x += Math.cos(ang) * ds;
      y += Math.sin(ang) * ds;
    }

    // 居中
    let mx = 0, my = 0;
    for (let i = 0; i < N; i++) { mx += rx[i]; my += ry[i]; }
    mx /= N; my /= N;

    // 法线 + 宽度
    spine.length = 0;
    const baseW = M * (0.0032 + 0.0105 * P);
    const segN = 7 + 24 * P;

    for (let i = 0; i < N; i++) {
      const s = i / (N - 1);
      const i0 = i > 0 ? i - 1 : 0;
      const i1 = i < N - 1 ? i + 1 : N - 1;
      let dx = rx[i1] - rx[i0];
      let dy = ry[i1] - ry[i0];
      const dl = Math.hypot(dx, dy) || 1;
      dx /= dl; dy /= dl;

      let w = baseW * (1 - 0.42 * s);
      w *= 1 + 0.10 * Math.sin(s * segN * TAU - t * 2.0);
      w *= 1 + 0.55 * Math.exp(-s * 30);   // 头部略粗

      spine.push({
        x: rx[i] - mx, y: ry[i] - my, s: s,
        dx: dx, dy: dy, nx: -dy, ny: dx, w: w
      });
    }
  }

  /* ============ 绘制：身体 ============ */
  function drawBody(P, t, hue) {
    const n = spine.length;

    // ---- 轮廓路径 ----
    ctx.beginPath();
    let p = spine[0];
    ctx.moveTo(p.x + p.nx * p.w, p.y + p.ny * p.w);
    for (let i = 1; i < n; i++) {
      p = spine[i];
      ctx.lineTo(p.x + p.nx * p.w, p.y + p.ny * p.w);
    }
    for (let i = n - 1; i >= 0; i--) {
      p = spine[i];
      ctx.lineTo(p.x - p.nx * p.w, p.y - p.ny * p.w);
    }
    ctx.closePath();

    // 体内辉光
    ctx.fillStyle = 'hsla(' + hue + ',95%,' + (14 + 9 * P) + '%,' + (0.30 + 0.26 * P) + ')';
    ctx.fill();

    // 外层柔光
    ctx.strokeStyle = 'hsla(' + hue + ',100%,45%,0.09)';
    ctx.lineWidth = M * 0.014;
    ctx.stroke();

    // 描边亮线
    ctx.strokeStyle = 'hsla(' + (hue + 10) + ',100%,62%,' + (0.35 + 0.30 * P) + ')';
    ctx.lineWidth = Math.max(1, M * 0.0022);
    ctx.stroke();

    // ---- 中轴光带 ----
    ctx.beginPath();
    ctx.moveTo(spine[0].x, spine[0].y);
    for (let i = 1; i < n; i++) ctx.lineTo(spine[i].x, spine[i].y);
    ctx.strokeStyle = 'hsla(' + (hue + 22) + ',100%,72%,' + (0.16 + 0.18 * P) + ')';
    ctx.lineWidth = Math.max(1, M * 0.005);
    ctx.stroke();

    // ---- 体节环纹 ----
    const step = Math.max(2, Math.round(n / (7 + 26 * P)));
    for (let i = step; i < n - 2; i += step) {
      const q = spine[i];
      const k = 0.5 + 0.5 * Math.sin(q.s * 9 - t * 3.0);
      ctx.beginPath();
      ctx.moveTo(q.x + q.nx * q.w * 1.15, q.y + q.ny * q.w * 1.15);
      ctx.lineTo(q.x - q.nx * q.w * 1.15, q.y - q.ny * q.w * 1.15);
      ctx.strokeStyle = 'hsla(' + (hue + 30) + ',100%,75%,' + ((0.10 + 0.24 * k) * P) + ')';
      ctx.lineWidth = Math.max(0.8, M * 0.0018);
      ctx.stroke();
    }
  }

  /* ============ 绘制：步足 ============ */
  function drawLegs(P, t, hue) {
    const op = Math.min(1, (P - 0.18) / 0.34);
    if (op <= 0) return;

    const count = Math.max(2, Math.floor(3 + 22 * P));
    const legLen = M * (0.014 + 0.055 * P);

    for (let k = 0; k < count; k++) {
      const s = 0.10 + 0.80 * (k / (count - 1 || 1));
      const idx = Math.round(s * (N - 1));
      const p = spine[idx];
      const lenScale = 0.55 + 0.45 * Math.sin(Math.PI * Math.min(1, s * 1.05));

      for (let side = -1; side <= 1; side += 2) {
        const phase = k * 0.9 + side * 0.8 - t * 5.0;
        const swing = Math.sin(phase) * 0.5;

        const L1 = legLen * lenScale;
        const L2 = L1 * 0.85;

        const bx = p.x + p.nx * side * p.w * 0.9;
        const by = p.y + p.ny * side * p.w * 0.9;

        const kx = bx + (p.nx * side * 0.85 + p.dx * swing) * L1;
        const ky = by + (p.ny * side * 0.85 + p.dy * swing) * L1;

        const fx = kx + (p.nx * side * 0.45 + p.dx * swing * 1.6) * L2;
        const fy = ky + (p.ny * side * 0.45 + p.dy * swing * 1.6) * L2;

        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(kx, ky);
        ctx.lineTo(fx, fy);

        ctx.strokeStyle = 'hsla(' + hue + ',100%,45%,' + (0.16 * op) + ')';
        ctx.lineWidth = Math.max(2, M * 0.006);
        ctx.stroke();

        ctx.strokeStyle = 'hsla(' + (hue + 12) + ',100%,72%,' + (0.78 * op) + ')';
        ctx.lineWidth = Math.max(0.9, M * 0.0018);
        ctx.stroke();

        // 足尖光点
        ctx.fillStyle = 'hsla(' + (hue + 24) + ',100%,82%,' + (0.5 * op) + ')';
        ctx.beginPath();
        ctx.arc(fx, fy, Math.max(1, M * 0.0022), 0, TAU);
        ctx.fill();
      }
    }
  }

  /* ============ 绘制：头部 ============ */
  function drawHead(P, t, hue) {
    const h = spine[0];
    if (!h) return;

    // 头部光晕
    const r = h.w * (2.2 + 2.0 * P);
    const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, r);
    g.addColorStop(0, 'hsla(' + (hue + 25) + ',100%,88%,' + (0.55 + 0.30 * P) + ')');
    g.addColorStop(0.35, 'hsla(' + (hue + 8) + ',100%,62%,0.35)');
    g.addColorStop(1, 'hsla(' + hue + ',100%,50%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(h.x, h.y, r, 0, TAU);
    ctx.fill();

    // 复眼
    if (P > 0.35) {
      const op = Math.min(1, (P - 0.35) / 0.25);
      for (let side = -1; side <= 1; side += 2) {
        const ex = h.x + h.nx * side * h.w * 0.55 + h.dx * h.w * 0.55;
        const ey = h.y + h.ny * side * h.w * 0.55 + h.dy * h.w * 0.55;
        ctx.fillStyle = 'hsla(' + (hue + 45) + ',100%,92%,' + (0.9 * op) + ')';
        ctx.beginPath();
        ctx.arc(ex, ey, Math.max(1.2, h.w * 0.24), 0, TAU);
        ctx.fill();
      }
    }

    // 触须
    if (P > 0.50) {
      const op = Math.min(1, (P - 0.50) / 0.30);
      const L = M * 0.05 * (0.5 + P);
      for (let side = -1; side <= 1; side += 2) {
        const bx = h.x + h.nx * side * h.w * 0.6;
        const by = h.y + h.ny * side * h.w * 0.6;
        const wob = Math.sin(t * 3.0 + side * 1.7) * L * 0.18;
        const mx = bx + h.dx * L * 0.55 + h.nx * side * L * 0.42 + wob;
        const my = by + h.dy * L * 0.55 + h.ny * side * L * 0.42 + wob;
        const ex = mx + h.dx * L * 0.55 + h.nx * side * L * 0.22;
        const ey = my + h.dy * L * 0.55 + h.ny * side * L * 0.22;

        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(mx, my, ex, ey);
        ctx.strokeStyle = 'hsla(' + (hue + 35) + ',100%,78%,' + (0.6 * op) + ')';
        ctx.lineWidth = Math.max(0.9, M * 0.0016);
        ctx.stroke();
      }
    }

    // 尾须
    if (P > 0.60) {
      const op = Math.min(1, (P - 0.60) / 0.30);
      const tl = spine[N - 1];
      const L = M * 0.035 * (0.5 + P);
      for (let side = -1; side <= 1; side += 2) {
        const bx = tl.x + tl.nx * side * tl.w * 0.6;
        const by = tl.y + tl.ny * side * tl.w * 0.6;
        const ex = bx - tl.dx * L + tl.nx * side * L * 0.9;
        const ey = by - tl.dy * L + tl.ny * side * L * 0.9;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo((bx + ex) / 2 + tl.dx * L * 0.2, (by + ey) / 2 + tl.dy * L * 0.2, ex, ey);
        ctx.strokeStyle = 'hsla(' + (hue + 40) + ',100%,72%,' + (0.5 * op) + ')';
        ctx.lineWidth = Math.max(0.8, M * 0.0014);
        ctx.stroke();
      }
    }
  }

  /* ============ 绘制：沿体轴流动的光脉冲 ============ */
  function drawPulses(P, t, hue) {
    const count = 5;
    for (let k = 0; k < count; k++) {
      const ph = ((t * 0.18 + k / count) % 1);
      const i = Math.min(N - 1, Math.floor(ph * (N - 1)));
      const p = spine[i];
      const a = Math.sin(ph * Math.PI);

      ctx.fillStyle = 'hsla(' + (hue + 30) + ',100%,85%,' + (0.16 * a) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.w * 2.6, 0, TAU);
      ctx.fill();

      ctx.fillStyle = 'hsla(' + (hue + 30) + ',100%,93%,' + (0.55 * a) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1, p.w * 0.7), 0, TAU);
      ctx.fill();
    }
  }

  /* ============ 综合绘制 ============ */
  function drawCreature(P, t) {
    buildSpine(P, t);

    const hue = 308 - 126 * P;   // 品红(308) → 青(182)

    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(Math.sin(t * 0.22) * 0.09);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (P > 0.18) drawLegs(P, t, hue);
    drawBody(P, t, hue);
    drawHead(P, t, hue);
    drawPulses(P, t, hue);

    ctx.restore();
  }

  /* ============ 左侧面板 ============ */
  const elIter  = document.getElementById('m-iter');
  const elLoss  = document.getElementById('m-loss');
  const elAcc   = document.getElementById('m-acc');
  const elBar   = document.getElementById('m-bar');
  const elPhase = document.getElementById('m-phase');

  const lossOf = p => 2.3026 * Math.pow(1 - p, 2.15) + 0.0213;

  function updatePanel(P, t) {
    const loss = lossOf(P) + 0.006 * Math.sin(t * 9.3);
    elIter.textContent  = Math.floor(P * 14800).toLocaleString('en-US');
    elLoss.textContent  = loss.toFixed(4);
    elAcc.textContent   = (9.8 + 89.3 * P).toFixed(1) + '%';
    elBar.style.width   = (P * 100).toFixed(1) + '%';

    let phase;
    if (P < 0.12)      phase = '初始化 · 简单发光体';
    else if (P < 0.35) phase = '梯度下降 · 形态扭曲';
    else if (P < 0.60) phase = '结构分化 · 体节生成';
    else if (P < 0.85) phase = '肢体萌发 · 神经连接';
    else if (P < 1)    phase = '收敛中 · 复杂化';
    else               phase = '收敛 · 霓虹蜈蚣成型';
    elPhase.textContent = phase;
  }

  function drawChart(P) {
    const w = chartCv.width, h = chartCv.height;
    if (w < 2 || h < 2) return;
    chartCtx.clearRect(0, 0, w, h);

    const pad = 8 * DPR;

    // 基线
    chartCtx.strokeStyle = 'rgba(90,150,190,0.28)';
    chartCtx.lineWidth = DPR;
    chartCtx.beginPath();
    chartCtx.moveTo(pad, h - pad);
    chartCtx.lineTo(w - pad, h - pad);
    chartCtx.stroke();

    if (P <= 0.001) return;

    // 损失下降曲线
    const steps = 90;
    chartCtx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const p = (i / steps) * P;
      const x = pad + p * (w - 2 * pad);
      const y = (h - pad) - (lossOf(p) / 2.35) * (h - 2 * pad);
      if (i === 0) chartCtx.moveTo(x, y);
      else chartCtx.lineTo(x, y);
    }
    chartCtx.strokeStyle = '#38e8ff';
    chartCtx.lineWidth = 1.6 * DPR;
    chartCtx.shadowColor = '#38e8ff';
    chartCtx.shadowBlur = 6 * DPR;
    chartCtx.stroke();
    chartCtx.shadowBlur = 0;

    // 当前点
    const cx = pad + P * (w - 2 * pad);
    const cy = (h - pad) - (lossOf(P) / 2.35) * (h - 2 * pad);
    chartCtx.fillStyle = '#d8fbff';
    chartCtx.beginPath();
    chartCtx.arc(cx, cy, 2.2 * DPR, 0, TAU);
    chartCtx.fill();
  }

  /* ============ 主循环 ============ */
  const DURATION = 24;   // 进化总时长（秒）
  let startTime = 0;

  function frame(now) {
    if (!startTime) startTime = now;
    const elapsed = (now - startTime) / 1000;

    const x = Math.min(1, elapsed / DURATION);
    const P = x * x * (3 - 2 * x);   // smoothstep 缓动

    // 拖尾（产生柔和残影）
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(2,3,9,0.30)';
    ctx.fillRect(0, 0, W, H);

    drawCreature(P, elapsed);
    updatePanel(P, elapsed);
    drawChart(P);

    requestAnimationFrame(frame);
  }

  // 启动
  resize();
  requestAnimationFrame(function boot() {
    resize();
    requestAnimationFrame(frame);
  });

})();
</script>
</body>
</html>
