<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>函数图像钓鱼 · Function Fishing</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#02060e;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  /* ============ HUD ============ */
  #hud{
    position:fixed;top:0;left:0;right:0;
    padding:18px 26px;
    display:flex;justify-content:space-between;align-items:flex-start;
    z-index:20;pointer-events:none;
    opacity:0;animation:fade 1.2s 0.3s ease forwards;
  }
  .hud-block{display:flex;flex-direction:column;gap:5px;}
  .hud-block.right{text-align:right;align-items:flex-end;}

  .hud-en{
    font-size:8px;letter-spacing:.48em;text-indent:.48em;
    color:rgba(140,200,255,.38);
    font-weight:300;
  }
  .hud-main{
    font-size:clamp(15px,1.9vw,20px);
    font-weight:300;letter-spacing:.14em;
    color:rgba(220,235,255,.96);
  }
  .hud-sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.10em;
    color:rgba(170,200,245,.52);
  }
  .hud-sub b{color:rgba(140,225,255,.94);font-weight:600;}

  .hud-score{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(20px,2.7vw,30px);
    font-weight:200;letter-spacing:.04em;
    color:rgba(200,235,255,.96);
    line-height:1;
    filter:drop-shadow(0 0 14px rgba(120,200,255,.45));
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), color .3s;
  }
  .hud-score.pop{
    transform:scale(1.24);
    color:rgba(180,255,220,.98);
  }
  @keyframes fade{to{opacity:1;}}

  /* ============ 任务提示 ============ */
  #quest{
    position:fixed;top:98px;left:50%;transform:translateX(-50%);
    padding:14px 26px;
    border-radius:14px;
    background:rgba(8,16,32,.66);
    border:1px solid rgba(140,200,255,.30);
    box-shadow:
      0 14px 40px rgba(0,0,0,.5),
      0 0 34px rgba(80,160,255,.24);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    z-index:20;
    max-width:92vw;
    text-align:center;
    opacity:0;
    animation:fade 1.2s 0.6s ease forwards;
    transition:border-color .4s, box-shadow .4s;
  }
  #quest.hit{
    border-color:rgba(255,200,120,.72);
    box-shadow:
      0 14px 40px rgba(0,0,0,.5),
      0 0 40px rgba(255,180,90,.50);
  }
  #quest .qtag{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(255,190,120,.72);
    margin-bottom:8px;
  }
  #quest .qtext{
    font-size:clamp(12px,1.55vw,15px);
    letter-spacing:.10em;
    color:rgba(220,235,255,.94);
    line-height:1.6;
  }
  #quest .qtext .hl{
    color:rgba(140,225,255,.98);
    font-weight:600;
  }
  #quest .qtext .hl2{
    color:rgba(255,210,140,.98);
    font-weight:600;
  }

  /* ============ 浮空提示 ============ */
  .float-tip{
    position:fixed;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:13px;
    font-weight:600;
    letter-spacing:.06em;
    padding:6px 12px;
    border-radius:9px;
    pointer-events:none;
    z-index:200;
    white-space:nowrap;
    animation:floatUp 1.4s ease-out forwards;
  }
  .float-tip.good{
    color:rgba(180,255,220,.98);
    background:rgba(30,90,60,.72);
    border:1px solid rgba(140,240,190,.42);
    text-shadow:0 0 12px rgba(120,240,180,.72);
  }
  .float-tip.bad{
    color:rgba(255,175,150,.98);
    background:rgba(90,30,30,.72);
    border:1px solid rgba(255,140,110,.42);
    text-shadow:0 0 12px rgba(255,120,90,.72);
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.86);}
    18%{opacity:1;transform:translate(-50%,-72%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-160%) scale(.94);}
  }

  /* ============ 底部选项栏 ============ */
  #options{
    position:fixed;bottom:0;left:0;right:0;
    padding:0 26px 26px;
    display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
    z-index:20;
    opacity:0;
    animation:fade 1.2s 1.0s ease forwards;
    pointer-events:none;
  }
  .opt{
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:clamp(12px,1.5vw,15px);
    font-weight:500;
    letter-spacing:.04em;
    color:rgba(215,235,255,.96);
    background:linear-gradient(145deg,rgba(58,84,148,.62),rgba(32,46,92,.55));
    border:1px solid rgba(120,170,255,.34);
    border-radius:11px;
    padding:12px 20px;
    cursor:pointer;
    transition:.24s cubic-bezier(.34,1.4,.64,1);
    box-shadow:
      0 6px 18px rgba(0,0,0,.34),
      inset 0 1px 0 rgba(180,215,255,.20);
    pointer-events:auto;
    white-space:nowrap;
    position:relative;
    overflow:hidden;
  }
  .opt::before{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(140deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 42%);
    pointer-events:none;
  }
  .opt:hover{
    transform:translateY(-3px);
    border-color:rgba(170,215,255,.72);
    box-shadow:
      0 12px 28px rgba(0,0,0,.42),
      0 0 26px rgba(100,170,255,.40),
      inset 0 1px 0 rgba(200,230,255,.30);
  }
  .opt:active{transform:translateY(-1px) scale(1.02);}
  .opt.correct{
    border-color:rgba(140,240,190,.90);
    background:linear-gradient(145deg,rgba(40,130,90,.72),rgba(24,86,60,.62));
    box-shadow:
      0 0 30px rgba(120,240,180,.62),
      inset 0 1px 0 rgba(200,255,225,.32);
  }
  .opt.wrong{
    border-color:rgba(255,140,110,.80);
    background:linear-gradient(145deg,rgba(130,40,30,.72),rgba(86,24,20,.62));
    animation:shakeOpt .4s;
  }
  @keyframes shakeOpt{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  /* ============ 音频指示 ============ */
  #audioDot{
    position:fixed;bottom:0;right:26px;
    padding-bottom:26px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    display:flex;align-items:center;gap:7px;
    opacity:0;animation:fade 1.2s 1.4s ease forwards;
    z-index:20;pointer-events:none;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }
  #audioDot.on{color:rgba(160,220,200,.52);}

  /* ============ 成就面板 ============ */
  #achievements{
    position:fixed;
    top:18px;right:26px;
    display:flex;gap:6px;
    z-index:30;
    opacity:0;
    animation:fade 1.2s 1.7s ease forwards;
    pointer-events:none;
    margin-top:80px;
    flex-direction:column;
    align-items:flex-end;
  }
  .ach{
    display:flex;align-items:center;gap:8px;
    padding:7px 13px;
    border-radius:9px;
    background:rgba(20,30,58,.62);
    border:1px solid rgba(120,155,230,.22);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;
    color:rgba(200,220,255,.38);
    transition:.5s cubic-bezier(.34,1.4,.64,1);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .ach .ic{
    font-size:14px;
    filter:grayscale(1) brightness(.5);
    transition:.5s;
  }
  .ach.on{
    color:rgba(255,225,170,.98);
    border-color:rgba(255,200,120,.72);
    background:rgba(80,55,20,.72);
    box-shadow:0 0 22px rgba(255,190,90,.52);
  }
  .ach.on .ic{
    filter:none;
    animation:achPop .6s cubic-bezier(.34,1.6,.64,1);
  }
  @keyframes achPop{
    0%{transform:scale(.4) rotate(-30deg);}
    60%{transform:scale(1.25) rotate(10deg);}
    100%{transform:scale(1) rotate(0);}
  }

  /* ============ Toast ============ */
  #toast{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.86);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(18px,2.6vw,30px);
    font-weight:300;letter-spacing:.28em;
    color:rgba(180,255,220,.98);
    text-shadow:0 0 32px rgba(120,240,190,.85);
    opacity:0;pointer-events:none;
    transition:opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
    z-index:100;
    white-space:nowrap;
    text-align:center;
  }
  #toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #toast.bad{
    color:rgba(255,170,140,.98);
    text-shadow:0 0 32px rgba(255,120,90,.85);
  }

  /* ============ 稀有提示 ============ */
  #rareToast{
    position:fixed;
    top:30%;left:50%;
    transform:translate(-50%,-50%) scale(.7);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(14px,1.9vw,20px);
    font-weight:300;letter-spacing:.34em;
    color:rgba(255,235,160,.98);
    text-shadow:
      0 0 30px rgba(255,200,100,.95),
      0 0 60px rgba(255,180,80,.62);
    opacity:0;pointer-events:none;
    transition:opacity .5s, transform .5s cubic-bezier(.34,1.6,.64,1);
    z-index:110;
    white-space:nowrap;
    text-align:center;
    padding:16px 32px;
    border-radius:16px;
    border:1px solid rgba(255,210,140,.62);
    background:rgba(50,32,12,.72);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  #rareToast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }

  @media (max-width:720px){
    #hud{padding:12px 16px;}
    .hud-en{display:none;}
    #quest{top:82px;padding:11px 18px;}
    #options{padding:0 12px 16px;gap:8px;}
    .opt{padding:10px 14px;font-size:12px;}
    #audioDot{right:16px;padding-bottom:16px;font-size:8px;}
    #achievements{right:12px;top:12px;margin-top:60px;}
    .ach{font-size:8.5px;padding:5px 9px;}
    .ach .ic{font-size:12px;}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-block">
    <div class="hud-en">FUNCTION FISHING</div>
    <div class="hud-main" id="lvName">第一水域</div>
    <div class="hud-sub">已钓起 <b id="caughtCount">0</b> / <b id="totalCount">8</b></div>
  </div>
  <div class="hud-block right">
    <div class="hud-score" id="scoreVal">0</div>
    <div class="hud-sub">分数</div>
  </div>
</div>

<div id="quest">
  <div class="qtag">CURRENT TASK · 今日鱼讯</div>
  <div class="qtext" id="questText">等待鱼群...</div>
</div>

<div id="achievements">
  <div class="ach" data-a="odd"><span class="ic">◆</span><span>奇偶大师</span></div>
  <div class="ach" data-a="mono"><span class="ic">▲</span><span>单调专家</span></div>
  <div class="ach" data-a="rare"><span class="ic">★</span><span>稀有猎手</span></div>
  <div class="ach" data-a="perfect"><span class="ic">✦</span><span>完美垂钓</span></div>
</div>

<div id="options"></div>

<div id="audioDot">
  <span class="dot"></span>
  <span>湖水声 · 交互音</span>
</div>

<div id="toast"></div>
<div id="rareToast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let WATER_Y = 0;

/* =========================================================
   函数库
   每条"鱼"对应一个函数 f(x) 与其特征
   ========================================================= */
const FISH_LIB = [
  {
    id: 'x2',
    name: '抛物线',
    expr: 'y = x²',
    fn: function(x){ return x * x; },
    domain: [-1.8, 1.8],
    hue: 200,
    rarity: 'common',
    traits: {
      parity: '偶函数',
      monotone: '先减后增',
      symmetry: '关于 y 轴对称'
    }
  },
  {
    id: 'x3',
    name: '立方曲线',
    expr: 'y = x³',
    fn: function(x){ return x * x * x; },
    domain: [-1.4, 1.4],
    hue: 260,
    rarity: 'common',
    traits: {
      parity: '奇函数',
      monotone: '单调递增',
      symmetry: '关于原点对称'
    }
  },
  {
    id: 'abs',
    name: '绝对值',
    expr: 'y = |x|',
    fn: function(x){ return Math.abs(x); },
    domain: [-1.6, 1.6],
    hue: 165,
    rarity: 'common',
    traits: {
      parity: '偶函数',
      monotone: '先减后增',
      symmetry: '关于 y 轴对称'
    }
  },
  {
    id: 'sin',
    name: '正弦鱼',
    expr: 'y = sin(x)',
    fn: function(x){ return Math.sin(x * 2.2); },
    domain: [-1.5, 1.5],
    hue: 195,
    rarity: 'common',
    traits: {
      parity: '奇函数',
      monotone: '周期振荡',
      symmetry: '关于原点对称'
    }
  },
  {
    id: 'lin',
    name: '直线鱼',
    expr: 'y = 2x',
    fn: function(x){ return 2 * x; },
    domain: [-1.0, 1.0],
    hue: 40,
    rarity: 'common',
    traits: {
      parity: '奇函数',
      monotone: '单调递增',
      symmetry: '关于原点对称'
    }
  },
  {
    id: 'recip',
    name: '反比例',
    expr: 'y = 1/x',
    fn: function(x){
      if (Math.abs(x) < 0.05) return x > 0 ? 12 : -12;
      return 1 / x;
    },
    domain: [-2.0, 2.0],
    hue: 320,
    rarity: 'rare',
    traits: {
      parity: '奇函数',
      monotone: '分段递减',
      symmetry: '关于原点对称'
    }
  },
  {
    id: 'exp',
    name: '指数鱼',
    expr: 'y = e^x',
    fn: function(x){ return Math.exp(x * 1.6) * 0.35; },
    domain: [-1.6, 1.0],
    hue: 285,
    rarity: 'rare',
    traits: {
      parity: '非奇非偶',
      monotone: '单调递增',
      symmetry: '无对称性'
    }
  },
  {
    id: 'log',
    name: '对数鱼',
    expr: 'y = ln(x)',
    fn: function(x){
      if (x <= 0.06) return -8;
      return Math.log(x) * 1.2;
    },
    domain: [0.06, 3.2],
    hue: 100,
    rarity: 'rare',
    traits: {
      parity: '非奇非偶',
      monotone: '单调递增',
      symmetry: '无对称性'
    }
  },
  {
    id: 'gauss',
    name: '高斯钟形',
    expr: 'y = e^(−x²)',
    fn: function(x){ return Math.exp(-x * x * 1.6) * 1.6; },
    domain: [-1.7, 1.7],
    hue: 215,
    rarity: 'epic',
    traits: {
      parity: '偶函数',
      monotone: '先增后减',
      symmetry: '关于 y 轴对称'
    }
  },
  {
    id: 'sinc',
    name: 'sinc 之灵',
    expr: 'y = sin(x)/x',
    fn: function(x){
      if (Math.abs(x) < 0.05) return 1.6;
      return Math.sin(x * 3.2) / (x * 3.2) * 1.6;
    },
    domain: [-2.0, 2.0],
    hue: 15,
    rarity: 'epic',
    traits: {
      parity: '偶函数',
      monotone: '多峰振荡',
      symmetry: '关于 y 轴对称'
    }
  }
];

/* =========================================================
   提示题库
   ========================================================= */
const QUEST_TEMPLATES = [
  { key: 'parity', text: '找一条 <span class="hl">{v}</span> 的鱼', label: '奇偶性' },
  { key: 'parity', text: '找一条 <span class="hl">{v}</span> 的鱼', label: '奇偶性' },
  { key: 'monotone', text: '这条鱼在区间上 <span class="hl">{v}</span>', label: '单调性' },
  { key: 'monotone', text: '这条鱼在区间上 <span class="hl">{v}</span>', label: '单调性' },
  { key: 'symmetry', text: '这条鱼 <span class="hl">{v}</span>', label: '对称性' },
  { key: 'symmetry', text: '这条鱼 <span class="hl">{v}</span>', label: '对称性' }
];

/* =========================================================
   游戏状态
   ========================================================= */
const game = {
  fish: [],
  score: 0,
  caught: 0,
  total: 10,
  round: 0,
  maxRounds: 10,
  currentTarget: null,
  options: [],
  locked: false,
  hitStreak: 0,
  achievements: {
    odd: false,       /* 钓到 3 条奇函数 */
    mono: false,      /* 钓到 3 条单调递增 */
    rare: false,      /* 钓到稀有鱼 */
    perfect: false    /* 连续 3 次正确 */
  },
  oddCaught: 0,
  monoCaught: 0,
  rareCaught: 0
};

/* =========================================================
   音频系统
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let waterGain = null;
let waterFilter = null;
let bubbleTimer = null;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.50, ac.currentTime, 1.6);

  startWater();
  scheduleBubble();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioDot(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioDot(true);
  }
}

/* ---- 湖水环境音：低通噪声 ---- */
function startWater(){
  const now = ac.currentTime;
  const bufLen = Math.floor(ac.sampleRate * 4);
  const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
  const d = buf.getChannelData(0);

  let last = 0;
  for (let i = 0; i < bufLen; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.024 * w) / 1.024;
    d[i] = last * 3.6;
  }

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  waterFilter = ac.createBiquadFilter();
  waterFilter.type = 'lowpass';
  waterFilter.frequency.value = 520;
  waterFilter.Q.value = 0.7;

  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 60;

  waterGain = ac.createGain();
  waterGain.gain.value = 0;

  src.connect(waterFilter);
  waterFilter.connect(hp);
  hp.connect(waterGain);
  waterGain.connect(master);
  src.start(now);

  waterGain.gain.setTargetAtTime(0.036, now, 3.0);

  /* 缓慢起伏 */
  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.09;
  const lg = ac.createGain();
  lg.gain.value = 0.014;
  lfo.connect(lg);
  lg.connect(waterGain.gain);
  lfo.start();

  /* 滤波漂移 */
  const flfo = ac.createOscillator();
  flfo.frequency.value = 0.062;
  const flg = ac.createGain();
  flg.gain.value = 240;
  flfo.connect(flg);
  flg.connect(waterFilter.frequency);
  flfo.start();
}

/* ---- 气泡音 ---- */
function playBubble(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const f0 = 320 + Math.random() * 520;
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f0 * 1.9, now + 0.075);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.018 + Math.random() * 0.014, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.13);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.15);
}

function scheduleBubble(){
  if (bubbleTimer) clearTimeout(bubbleTimer);
  const wait = 700 + Math.random() * 2200;
  bubbleTimer = setTimeout(function(){
    if (audioReady && ac && ac.state === 'running'){
      playBubble();
      if (Math.random() < 0.35){
        setTimeout(playBubble, 100 + Math.random() * 220);
      }
    }
    scheduleBubble();
  }, wait);
}

/* ---- 抛竿音 ---- */
function playCast(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(880, now + 0.22);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.026, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.28);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.30);
}

/* ---- 正确咬钩：清脆铃音 ---- */
function playCorrect(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [523.25, 659.25, 783.99, 1046.50];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.06;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.042, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.2);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.3);

    /* 泛音 */
    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = notes[i] * 2;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.03);
    g2.gain.linearRampToValueAtTime(0.012, t0 + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.03);
    osc2.stop(t0 + 1.0);
  }
}

/* ---- 错误：沉闷弦音 ---- */
function playWrong(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(196, now);
  osc.frequency.exponentialRampToValueAtTime(82, now + 0.42);

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 520;
  lp.Q.value = 3.2;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.038, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.55);

  osc.connect(lp);
  lp.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.58);
}

/* ---- 稀有鱼成就音 ---- */
function playRare(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [392.00, 523.25, 659.25, 783.99, 1046.50, 1318.51];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.075;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.046, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.8);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 2.0);
  }
}

/* =========================================================
   画布
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  WATER_Y = H * 0.22;
}
window.addEventListener('resize', resize);

/* =========================================================
   鱼群生成
   ========================================================= */
function createFish(){
  const hue = 180 + Math.random() * 120;
  const y = H * 0.30 + Math.random() * (H * 0.48);
  const dir = Math.random() < 0.5 ? 1 : -1;
  const speed = 18 + Math.random() * 26;

  return {
    x: dir > 0 ? -200 : W + 200,
    y: y,
    dir: dir,
    speed: speed,
    baseY: y,
    bobPhase: Math.random() * TAU,
    bobAmp: 8 + Math.random() * 14,
    libEntry: null,
    active: true,
    scale: 0.9 + Math.random() * 0.3,
    hue: hue,
    caughtAnim: 0
  };
}

/* =========================================================
   回合逻辑
   ========================================================= */
function startRound(){
  if (game.round >= game.maxRounds){
    finishGame();
    return;
  }
  game.round++;

  /* 选择目标鱼 */
  const pool = FISH_LIB.slice();
  /* 前期排除 epic，只在后期出现 */
  const validPool = pool.filter(function(f){
    if (game.round < 3 && f.rarity === 'epic') return false;
    return true;
  });

  const target = validPool[Math.floor(Math.random() * validPool.length)];
  game.currentTarget = target;

  /* 生成提示 */
  const traitKeys = Object.keys(target.traits);
  const traitKey = traitKeys[Math.floor(Math.random() * traitKeys.length)];
  const traitValue = target.traits[traitKey];

  const template = QUEST_TEMPLATES.filter(function(t){
    return t.key === traitKey;
  })[0] || QUEST_TEMPLATES[0];

  const questEl = document.getElementById('questText');
  if (questEl){
    questEl.innerHTML = template.text.replace('{v}', traitValue);
  }

  /* 生成选项：目标 + 3 条干扰 */
  const others = FISH_LIB.filter(function(f){ return f.id !== target.id; });
  shuffle(others);
  const optionFish = [target].concat(others.slice(0, 3));
  shuffle(optionFish);

  game.options = optionFish;

  /* 渲染选项按钮 */
  renderOptions();

  /* 生成鱼群：目标 + 3~5 条干扰 */
  spawnFish(optionFish, target);

  game.locked = false;

  document.getElementById('quest').classList.remove('hit');
}

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function spawnFish(fishList, target){
  game.fish = [];

  /* 目标鱼必定出现 */
  for (let i = 0; i < fishList.length; i++){
    const entry = fishList[i];
    const f = createFish();
    f.libEntry = entry;

    /* 确保目标鱼出现 */
    if (entry.id === target.id){
      f.isTarget = true;
    }

    game.fish.push(f);
  }

  /* 再加入几条额外的干扰鱼（复刻现有池中已有的） */
  const extraCount = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < extraCount; i++){
    const entry = fishList[Math.floor(Math.random() * fishList.length)];
    const f = createFish();
    f.libEntry = entry;
    f.isTarget = false;
    game.fish.push(f);
  }

  /* 打乱顺序 */
  shuffle(game.fish);
}

/* =========================================================
   选项渲染
   ========================================================= */
function renderOptions(){
  const wrap = document.getElementById('options');
  wrap.innerHTML = '';

  for (let i = 0; i < game.options.length; i++){
    const entry = game.options[i];
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = entry.expr;
    btn.dataset.id = entry.id;

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      onOptionClick(entry, btn);
    });

    wrap.appendChild(btn);
  }
}

/* =========================================================
   作答判定
   ========================================================= */
function onOptionClick(entry, btn){
  if (game.locked) return;
  initAudio();
  game.locked = true;

  const target = game.currentTarget;

  if (entry.id === target.id){
    /* 正确 */
    btn.classList.add('correct');
    playCast();
    setTimeout(playCorrect, 120);

    game.caught++;
    game.hitStreak++;

    /* 分数：稀有度加成 */
    let base = 100;
    let bonus = 0;

    if (target.rarity === 'rare'){ base = 180; game.rareCaught++; }
    else if (target.rarity === 'epic'){ base = 300; game.rareCaught++; }
    if (game.hitStreak >= 3) bonus = 60;

    const gained = base + bonus;
    game.score += gained;

    if (target.traits.parity === '奇函数') game.oddCaught++;
    if (target.traits.monotone === '单调递增') game.monoCaught++;

    updateHUD();
    popScore();

    showFloatTip(btn, '+' + gained, false);

    /* 钓起动画 */
    catchFishAnim(target.id);

    /* 稀有提示 */
    if (target.rarity === 'rare'){
      showRareToast('★ 稀有鱼 · ' + target.name);
      playRare();
    } else if (target.rarity === 'epic'){
      showRareToast('✦ 传说鱼 · ' + target.name);
      playRare();
    } else {
      showToast('钓起 · ' + target.name, false);
    }

    /* 成就检查 */
    checkAchievements();

    /* 下一回合 */
    setTimeout(function(){
      startRound();
    }, 1600);

  } else {
    /* 错误 */
    btn.classList.add('wrong');
    playWrong();

    game.hitStreak = 0;

    showFloatTip(btn, '× 不是这条', true);
    showToast('这条鱼的特征不符', true);

    setTimeout(function(){
      btn.classList.remove('wrong');
      game.locked = false;
    }, 700);
  }
}

/* =========================================================
   UI 反馈
   ========================================================= */
function showFloatTip(el, text, isBad){
  const rect = el.getBoundingClientRect();
  const tip = document.createElement('div');
  tip.className = 'float-tip ' + (isBad ? 'bad' : 'good');
  tip.textContent = text;
  tip.style.left = (rect.left + rect.width / 2) + 'px';
  tip.style.top = (rect.top + rect.height / 2) + 'px';
  tip.style.transform = 'translate(-50%,-50%)';
  document.body.appendChild(tip);

  setTimeout(function(){
    tip.remove();
  }, 1500);
}

function showToast(text, isBad){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.toggle('bad', !!isBad);
  el.classList.add('show');

  clearTimeout(el._timer);
  el._timer = setTimeout(function(){
    el.classList.remove('show');
  }, 1300);
}

function showRareToast(text){
  const el = document.getElementById('rareToast');
  el.textContent = text;
  el.classList.add('show');

  clearTimeout(el._timer);
  el._timer = setTimeout(function(){
    el.classList.remove('show');
  }, 2200);
}

function popScore(){
  const el = document.getElementById('scoreVal');
  if (!el) return;
  el.classList.add('pop');
  setTimeout(function(){
    el.classList.remove('pop');
  }, 320);
}

function updateHUD(){
  const scoreEl = document.getElementById('scoreVal');
  const caughtEl = document.getElementById('caughtCount');
  const totalEl = document.getElementById('totalCount');

  if (scoreEl) scoreEl.textContent = game.score;
  if (caughtEl) caughtEl.textContent = game.caught;
  if (totalEl) totalEl.textContent = game.maxRounds;
}

/* =========================================================
   成就
   ========================================================= */
function checkAchievements(){
  const a = game.achievements;

  if (!a.odd && game.oddCaught >= 3){
    a.odd = true;
    setAch('odd');
  }
  if (!a.mono && game.monoCaught >= 3){
    a.mono = true;
    setAch('mono');
  }
  if (!a.rare && game.rareCaught >= 2){
    a.rare = true;
    setAch('rare');
  }
  if (!a.perfect && game.hitStreak >= 3){
    a.perfect = true;
    setAch('perfect');
  }
}

function setAch(id){
  const el = document.querySelector('.ach[data-a="' + id + '"]');
  if (el){
    el.classList.add('on');
  }
  playRare();
}

/* =========================================================
   钓起动画
   ========================================================= */
const burstParticles = [];

function catchFishAnim(targetId){
  for (let i = 0; i < game.fish.length; i++){
    const f = game.fish[i];
    if (f.libEntry.id === targetId && f.active){
      f.caughtAnim = 1;
    }
  }

  /* 全屏粒子 */
  const sx = W * 0.5;
  const sy = H * 0.55;

  for (let i = 0; i < 40; i++){
    const a = Math.random() * TAU;
    const sp = 60 + Math.random() * 260;
    burstParticles.push({
      x: sx, y: sy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.2 + Math.random() * 1.4,
      size: 1.8 + Math.random() * 3.0,
      hue: 40 + Math.random() * 40
    });
  }
}

function updateBurst(dt){
  for (let i = burstParticles.length - 1; i >= 0; i--){
    const p = burstParticles[i];
    p.life -= p.decay * dt;
    if (p.life <= 0){ burstParticles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.vy += 60 * dt;
  }
}

/* =========================================================
   更新鱼群
   ========================================================= */
function updateFish(dt, t){
  for (let i = game.fish.length - 1; i >= 0; i--){
    const f = game.fish[i];

    /* 钓起动画 */
    if (f.caughtAnim > 0){
      f.caughtAnim -= dt * 1.2;
      f.y -= 220 * dt;
      f.x += (W * 0.5 - f.x) * dt * 2.0;
      if (f.caughtAnim <= 0){
        game.fish.splice(i, 1);
      }
      continue;
    }

    f.x += f.dir * f.speed * dt;
    f.y = f.baseY + Math.sin(t * 1.4 + f.bobPhase) * f.bobAmp;

    /* 出界回收 */
    if (f.dir > 0 && f.x > W + 260) game.fish.splice(i, 1);
    if (f.dir < 0 && f.x < -260) game.fish.splice(i, 1);
  }

  /* 保持鱼群数量 */
  if (game.fish.length < 5 && !game.locked && game.currentTarget){
    const pool = FISH_LIB.filter(function(x){
      return x.id !== game.currentTarget.id;
    });
    const entry = pool[Math.floor(Math.random() * pool.length)];
    const f = createFish();
    f.libEntry = entry;
    f.isTarget = false;
    game.fish.push(f);
  }
}

/* =========================================================
   绘制
   ========================================================= */
function drawBackground(t){
  /* 天空 */
  const skyGrad = ctx.createLinearGradient(0, 0, 0, WATER_Y);
  skyGrad.addColorStop(0.00, '#06101e');
  skyGrad.addColorStop(0.55, '#0a1a2e');
  skyGrad.addColorStop(1.00, '#0e2a44');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, WATER_Y);

  /* 月亮 */
  const moonX = W * 0.82;
  const moonY = WATER_Y * 0.32;
  const moonR = Math.min(W, H) * 0.035;

  ctx.globalCompositeOperation = 'lighter';
  const mg = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR * 6);
  mg.addColorStop(0.00, 'rgba(255, 245, 220, 0.30)');
  mg.addColorStop(0.14, 'rgba(240, 245, 255, 0.14)');
  mg.addColorStop(0.45, 'rgba(180, 210, 255, 0.04)');
  mg.addColorStop(1.00, 'rgba(140, 180, 255, 0)');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR * 6, 0, TAU);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, TAU);
  ctx.fillStyle = 'rgba(248, 250, 255, 0.94)';
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 月亮倒影 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 12; i++){
    const ry = WATER_Y + 10 + i * 14;
    const a = Math.max(0, 0.20 - i * 0.016);
    if (a < 0.01) continue;
    const wobble = Math.sin(t * 1.4 + i * 0.9) * 10;

    const g = ctx.createRadialGradient(
      moonX + wobble, ry, 0,
      moonX + wobble, ry, 40 + i * 3
    );
    g.addColorStop(0.00, 'rgba(230, 240, 255, ' + a + ')');
    g.addColorStop(1.00, 'rgba(200, 220, 255, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(moonX + wobble - 60, ry - 12, 120, 24);
  }
  ctx.globalCompositeOperation = 'source-over';

  /* 星空 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 40; i++){
    const sx = (i * 137.5 + t * 4) % W;
    const sy = (i * 97.3) % (WATER_Y * 0.85);
    const a = 0.12 + 0.24 * Math.sin(t * 1.3 + i * 1.7);
    if (a < 0.02) continue;
    ctx.fillStyle = 'rgba(200, 225, 255, ' + a + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, 0.9, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* 水面 */
  const waterGrad = ctx.createLinearGradient(0, WATER_Y, 0, H);
  waterGrad.addColorStop(0.00, '#0a1e3a');
  waterGrad.addColorStop(0.30, '#061428');
  waterGrad.addColorStop(0.68, '#030a18');
  waterGrad.addColorStop(1.00, '#01040c');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, WATER_Y, W, H - WATER_Y);

  /* 水面波纹 */
  ctx.strokeStyle = 'rgba(120, 190, 255, 0.14)';
  ctx.lineWidth = 1.2;
  for (let row = 0; row < 10; row++){
    const y = WATER_Y + 6 + row * (H - WATER_Y) / 10;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 16){
      const w = Math.sin(x * 0.012 + t * 1.2 + row * 0.55) * (4 + row * 0.9)
              + Math.cos(x * 0.018 + t * 0.85 + row * 0.42) * 3;
      const py = y + w;
      if (x === 0) ctx.moveTo(x, py);
      else ctx.lineTo(x, py);
    }
    ctx.globalAlpha = Math.max(0.02, 0.16 - row * 0.012);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* 水面光线 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++){
    const bx = W * (0.15 + i * 0.24) + Math.sin(t * 0.4 + i * 1.6) * W * 0.04;
    const g = ctx.createLinearGradient(bx, WATER_Y, bx + 30, H);
    g.addColorStop(0.00, 'rgba(120, 200, 255, 0.055)');
    g.addColorStop(0.45, 'rgba(90, 160, 240, 0.020)');
    g.addColorStop(1.00, 'rgba(60, 120, 220, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(bx - 30, WATER_Y, 100, H - WATER_Y);
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- 鱼：曲线形状 ---- */
function drawFish(f, t){
  const entry = f.libEntry;
  if (!entry) return;

  const baseY = f.y;
  const baseX = f.x;
  const fishSize = Math.min(W, H) * 0.085 * f.scale;
  const dir = f.dir;

  /* 钓起时的旋转和缩放 */
  const caughtT = f.caughtAnim;
  let scale = 1;
  let rotation = 0;
  let alpha = 1;

  if (caughtT > 0){
    const u = 1 - caughtT;
    scale = 1 + u * 0.6;
    rotation = u * 0.5;
    alpha = Math.max(0, caughtT);
  }

  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.rotate(rotation);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const glowR = fishSize * 1.6;
  const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
  gg.addColorStop(0.00, 'hsla(' + f.hue + ', 90%, 62%, 0.40)');
  gg.addColorStop(0.42, 'hsla(' + f.hue + ', 88%, 56%, 0.14)');
  gg.addColorStop(1.00, 'hsla(' + f.hue + ', 88%, 52%, 0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(0, 0, glowR, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 画出函数曲线作为鱼的"身体" */
  const domain = entry.domain;
  const N = 60;

  ctx.beginPath();
  let first = true;

  for (let i = 0; i <= N; i++){
    const u = i / N;
    const xv = domain[0] + (domain[1] - domain[0]) * u;
    let yv = entry.fn(xv);

    /* 数值保护 */
    if (!isFinite(yv)) yv = 0;
    if (yv > 8) yv = 8;
    if (yv < -8) yv = -8;

    /* 映射到鱼的尺寸 */
    const px = dir * (u - 0.5) * fishSize * 1.8;
    const py = -yv * fishSize * 0.30;

    if (first){
      ctx.moveTo(px, py);
      first = false;
    } else {
      ctx.lineTo(px, py);
    }
  }

  /* 光晕描边 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'hsla(' + f.hue + ', 100%, 72%, 0.30)';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';

  /* 中层描边 */
  ctx.strokeStyle = 'hsla(' + f.hue + ', 92%, 68%, 0.62)';
  ctx.lineWidth = 4.5;
  ctx.stroke();

  /* 核心亮线 */
  const lineGrad = ctx.createLinearGradient(
    -fishSize, 0, fishSize, 0
  );
  lineGrad.addColorStop(0.00, 'hsla(' + f.hue + ', 100%, 78%, 0.72)');
  lineGrad.addColorStop(0.50, 'hsla(' + (f.hue + 20) + ', 100%, 88%, 0.98)');
  lineGrad.addColorStop(1.00, 'hsla(' + (f.hue + 40) + ', 100%, 78%, 0.72)');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 1.9;
  ctx.stroke();

  /* 鱼尾：在曲线的一端画一个小三角 */
  const tailX = dir * -0.5 * fishSize * 1.8;
  const tailY = 0;
  const tailSize = fishSize * 0.24;

  ctx.beginPath();
  ctx.moveTo(tailX, tailY);
  ctx.lineTo(tailX - dir * tailSize, tailY - tailSize * 0.7);
  ctx.lineTo(tailX - dir * tailSize, tailY + tailSize * 0.7);
  ctx.closePath();

  ctx.fillStyle = 'hsla(' + f.hue + ', 88%, 62%, 0.72)';
  ctx.fill();
  ctx.strokeStyle = 'hsla(' + (f.hue + 20) + ', 100%, 80%, 0.92)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 眼睛 */
  const eyeX = dir * 0.32 * fishSize * 1.8;
  const eyeY = -fishSize * 0.10;

  ctx.beginPath();
  ctx.arc(eyeX, eyeY, fishSize * 0.075, 0, TAU);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(eyeX + dir * fishSize * 0.018, eyeY, fishSize * 0.038, 0, TAU);
  ctx.fillStyle = 'rgba(8, 16, 32, 0.94)';
  ctx.fill();

  /* 稀有鱼额外光环 */
  if (entry.rarity === 'rare' || entry.rarity === 'epic'){
    ctx.globalCompositeOperation = 'lighter';
    const haloPulse = 1 + 0.20 * Math.sin(t * 3.4 + f.bobPhase);

    ctx.beginPath();
    ctx.arc(0, 0, fishSize * 0.95 * haloPulse, 0, TAU);
    ctx.strokeStyle = entry.rarity === 'epic'
      ? 'hsla(48, 100%, 82%, 0.52)'
      : 'hsla(200, 100%, 78%, 0.42)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    /* 闪烁星点 */
    for (let k = 0; k < 4; k++){
      const ang = t * 1.6 + k * TAU / 4 + f.bobPhase;
      const rr = fishSize * 1.1;
      const sx2 = Math.cos(ang) * rr;
      const sy2 = Math.sin(ang) * rr;

      ctx.beginPath();
      ctx.arc(sx2, sy2, 1.6, 0, TAU);
      ctx.fillStyle = entry.rarity === 'epic'
        ? 'rgba(255, 235, 160, 0.92)'
        : 'rgba(160, 220, 255, 0.82)';
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 表达式标签 */
  ctx.font = '600 ' + Math.max(11, fishSize * 0.22).toFixed(0) +
             'px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const labelY = fishSize * 0.62;

  /* 描边 */
  ctx.strokeStyle = 'rgba(2, 6, 18, 0.86)';
  ctx.lineWidth = Math.max(2.4, fishSize * 0.055);
  ctx.lineJoin = 'round';
  ctx.strokeText(entry.expr, 0, labelY);

  /* 填充 */
  ctx.fillStyle = 'hsla(' + (f.hue + 20) + ', 100%, 88%, 0.96)';
  ctx.fillText(entry.expr, 0, labelY);

  ctx.restore();

  /* 稀有度标记 */
  if (entry.rarity !== 'common' && caughtT <= 0){
    ctx.save();
    ctx.translate(baseX, baseY - fishSize * 0.80);
    ctx.font = '500 ' + Math.max(9, fishSize * 0.16).toFixed(0) +
               'px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = entry.rarity === 'epic'
      ? 'rgba(255, 225, 150, 0.92)'
      : 'rgba(150, 215, 255, 0.82)';
    ctx.fillText(entry.rarity === 'epic' ? '✦ 传说' : '★ 稀有', 0, 0);
    ctx.restore();
  }
}

/* ---- 粒子 ---- */
function drawBurst(){
  if (burstParticles.length === 0) return;

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < burstParticles.length; i++){
    const p = burstParticles[i];
    const a = p.life * p.life * 0.92;
    const r = p.size * p.life;

    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4.5);
    g.addColorStop(0.00, 'hsla(' + p.hue + ', 100%, 92%, ' + a + ')');
    g.addColorStop(0.42, 'hsla(' + p.hue + ', 100%, 72%, ' + (a * 0.32) + ')');
    g.addColorStop(1.00, 'hsla(' + p.hue + ', 100%, 62%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  updateFish(dt, t);
  updateBurst(dt);

  drawBackground(t);

  /* 鱼按深度排序 */
  const sorted = game.fish.slice().sort(function(a, b){ return a.y - b.y; });
  for (let i = 0; i < sorted.length; i++){
    drawFish(sorted[i], t);
  }

  drawBurst();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.36,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(1, 3, 8, 0.26)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   结算
   ========================================================= */
function finishGame(){
  game.locked = true;

  const acc = Math.round((game.caught / game.maxRounds) * 100);

  showToast('垂钓结束 · ' + game.caught + '/' + game.maxRounds + ' · ' + acc + '%', false);
  playRare();

  setTimeout(function(){
    showToast('总分 ' + game.score, false);
  }, 1800);

  setTimeout(function(){
    /* 重开 */
    game.round = 0;
    game.score = 0;
    game.caught = 0;
    game.hitStreak = 0;
    game.oddCaught = 0;
    game.monoCaught = 0;
    game.rareCaught = 0;
    game.achievements = { odd: false, mono: false, rare: false, perfect: false };

    document.querySelectorAll('.ach').forEach(function(el){
      el.classList.remove('on');
    });

    updateHUD();
    startRound();
  }, 4200);
}

/* =========================================================
   启动
   ========================================================= */
resize();
updateHUD();
startRound();

window.addEventListener('pointerdown', function(){
  initAudio();
}, { once: false });

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    initAudio();
  }
});

requestAnimationFrame(loop);

})();
</script>
