<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>薛定谔方程 · 波函数与能级</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:24px 32px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(140,180,255,.38);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#a090ff 40%,#ff90d0 72%,#ffd080 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(160,140,255,.48));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10.5px;letter-spacing:.18em;
    color:rgba(200,210,250,.52);font-weight:300;
  }

  /* 右上：方程 */
  #equation{
    position:absolute;top:0;right:0;
    padding:24px 32px;text-align:right;
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #equation .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(160,180,240,.30);margin-bottom:8px;
  }
  #equation .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(13px,1.5vw,16px);
    letter-spacing:.08em;
    color:rgba(200,220,255,.74);
    margin-bottom:6px;
  }
  #equation .formula .hl1{color:#5ee0ff;}
  #equation .formula .hl2{color:#ff90d0;}
  #equation .note{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.14em;
    color:rgba(160,185,240,.38);
  }

  /* 左下：量子数 */
  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 32px 26px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.10em;line-height:2.0;
    color:rgba(170,200,250,.36);
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(150,180,240,.26);margin-bottom:6px;
  }
  #stats .k{color:rgba(190,205,255,.54);}
  #stats .v{color:rgba(160,230,255,.96);font-weight:600;}
  #stats .v2{color:rgba(255,190,240,.96);font-weight:600;}

  /* 右下：能级柱 */
  #levels{
    position:absolute;bottom:0;right:0;
    padding:0 32px 26px;
    display:flex;flex-direction:column;gap:7px;
    align-items:flex-end;
    opacity:0;animation:fade 1.6s 1.5s ease forwards;
    pointer-events:auto;
  }
  .lv-row{
    display:flex;align-items:center;gap:10px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.08em;
    color:rgba(190,205,250,.42);
    padding:5px 12px 5px 14px;
    border:1px solid rgba(120,155,230,.16);
    border-radius:7px;
    background:rgba(16,22,44,.42);
    transition:.4s cubic-bezier(.4,0,.2,1);
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    min-width:140px;
    justify-content:space-between;
  }
  .lv-row:hover{
    border-color:rgba(180,220,255,.62);
    background:rgba(40,65,120,.32);
  }
  .lv-row.on{
    border-color:rgba(160,200,255,.82);
    background:rgba(60,95,180,.30);
    color:rgba(230,240,255,.96);
    box-shadow:0 0 18px rgba(120,180,255,.42);
  }
  .lv-row .nm{
    color:rgba(200,215,255,.62);
    min-width:24px;
  }
  .lv-row.on .nm{color:rgba(255,235,200,.96);}
  .lv-row .en{
    font-size:9px;
    color:rgba(150,190,240,.44);
  }

  #audioDot{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:14px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
    display:flex;align-items:center;gap:7px;
    white-space:nowrap;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:760px){
    #title{padding:14px 16px;}
    #title .sub{font-size:9px;}
    #equation{padding:14px 16px;}
    #equation .formula{font-size:11px;}
    #stats{padding:0 16px 16px;font-size:8.5px;}
    #levels{padding:0 16px 16px;gap:5px;}
    .lv-row{font-size:8.5px;padding:4px 9px 4px 11px;min-width:106px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">SCHRÖDINGER EQUATION · WAVE FUNCTION</div>
    <h1>薛定谔方程</h1>
    <div class="sub">波函数演化 · 概率云 · 能级跃迁</div>
  </div>

  <div id="equation">
    <span class="lab">TIME-DEPENDENT</span>
    <div class="formula">
      iℏ ∂<span class="hl1">ψ</span>/∂t = 
      <span class="hl2">Ĥ</span><span class="hl1">ψ</span>
    </div>
    <div class="note">|ψ|² = 概率密度</div>
  </div>

  <div id="stats">
    <span class="lab">QUANTUM STATE</span>
    <div><span class="k">主量子数 n </span><span class="v" id="vN">2</span></div>
    <div><span class="k">角量子数 ℓ </span><span class="v" id="vL">1</span></div>
    <div><span class="k">磁量子数 m </span><span class="v2" id="vM">0</span></div>
    <div><span class="k">能量 E </span><span class="v" id="vE">-3.40 eV</span></div>
    <div><span class="k">跃迁态 </span><span class="v2" id="vTrans">叠加中</span></div>
  </div>

  <div id="levels"></div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>量子闪烁 · 跃迁音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0;

/* =========================================================
   量子态定义
   ========================================================= */
const STATES = [
  {
    id: '1s',
    n: 1, l: 0, m: 0,
    label: '1s',
    energy: -13.6,
    hueA: 195,
    hueB: 220,
    /* 径向分布峰值半径（归一化） */
    radius: 0.28,
    /* 节点数 */
    nodes: 0,
    /* 角向特征：0=球形，1=哑铃，2=四叶 */
    ang: 0
  },
  {
    id: '2s',
    n: 2, l: 0, m: 0,
    label: '2s',
    energy: -3.40,
    hueA: 160,
    hueB: 190,
    radius: 0.58,
    nodes: 1,
    ang: 0
  },
  {
    id: '2p',
    n: 2, l: 1, m: 0,
    label: '2p',
    energy: -3.40,
    hueA: 260,
    hueB: 290,
    radius: 0.62,
    nodes: 0,
    ang: 1
  },
  {
    id: '3s',
    n: 3, l: 0, m: 0,
    label: '3s',
    energy: -1.51,
    hueA: 130,
    hueB: 165,
    radius: 0.90,
    nodes: 2,
    ang: 0
  },
  {
    id: '3p',
    n: 3, l: 1, m: 0,
    label: '3p',
    energy: -1.51,
    hueA: 330,
    hueB: 360,
    radius: 0.86,
    nodes: 1,
    ang: 1
  },
  {
    id: '3d',
    n: 3, l: 2, m: 0,
    label: '3d',
    energy: -1.51,
    hueA: 40,
    hueB: 70,
    radius: 0.82,
    nodes: 0,
    ang: 2
  }
];

/* 当前状态 */
let stateA = STATES[1];   /* 2s */
let stateB = STATES[2];   /* 2p */
let mixRatio = 0;         /* 0 = A, 1 = B */
let mixTarget = 0;        /* 目标混合比 */
let transPhase = 0;       /* 跃迁进度 0 → 1 */

const TRANS_DUR = 1.8;    /* 跃迁时长 */
const HOLD_DUR = 3.2;     /* 保持时长 */

let cycleState = 'hold';
let cycleTimer = 0;
let lastLvIdx = 1;

/* =========================================================
   布局
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5 - Math.min(W, H) * 0.06;
  CY = H * 0.5;

  buildStars();
}
window.addEventListener('resize', resize);

/* =========================================================
   星空背景
   ========================================================= */
const stars = [];
function buildStars(){
  stars.length = 0;
  const n = Math.min(200, Math.round(W * H / 9000));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.0 + 0.15,
      ph: Math.random() * TAU,
      sp: 0.18 + Math.random() * 0.72,
      hue: 210 + Math.random() * 70,
      base: 0.05 + Math.random() * 0.22
    });
  }
}

/* =========================================================
   概率云粒子
   ========================================================= */
const cloudParticles = [];
const CLOUD_COUNT = 420;

function randomUnitVector(){
  /* 单位球面上均匀分布 */
  const u = Math.random() * 2 - 1;
  const th = Math.random() * TAU;
  const r = Math.sqrt(1 - u * u);
  return { x: r * Math.cos(th), y: u, z: r * Math.sin(th) };
}

function initCloud(){
  cloudParticles.length = 0;
  for (let i = 0; i < CLOUD_COUNT; i++){
    const dir = randomUnitVector();
    cloudParticles.push({
      /* 归一化半径（由径向分布确定） */
      r: 0,
      dir: dir,
      /* 相位用于闪烁 */
      phase: Math.random() * TAU,
      /* 每个粒子的相对速度 */
      speed: 0.6 + Math.random() * 0.8,
      /* 大小 */
      size: 0.5 + Math.random() * 1.4,
      /* 出生延时 */
      born: Math.random()
    });
  }
  respawnCloud(true);
}

/* 按径向分布函数采样半径 */
function sampleRadius(state){
  /* 简化的径向分布：r^(2l+2) * exp(-2r/n) 的采样
     使用拒绝采样 */
  const n = state.n;
  const l = state.l;
  const RMAX = 4.6;

  /* 峰值近似 */
  const peak = state.radius;
  const width = 0.22 + state.n * 0.10;

  /* 使用 Gaussian 近似，并叠加节点 */
  let r;
  let guard = 0;
  do {
    r = Math.abs(gaussRand(peak, width));
    guard++;
  } while (r > RMAX && guard < 20);

  if (r > RMAX) r = RMAX;
  return r;
}

function gaussRand(mu, sigma){
  /* Box-Muller */
  const u1 = Math.random();
  const u2 = Math.random();
  const z = Math.sqrt(-2 * Math.log(u1 + 1e-9)) * Math.cos(TAU * u2);
  return mu + sigma * z;
}

function respawnCloud(initial){
  for (let i = 0; i < cloudParticles.length; i++){
    const p = cloudParticles[i];
    if (!initial && Math.random() > 0.15) continue;

    p.dir = randomUnitVector();
    p.r = sampleRadius(stateB);
    p.born = performance.now() * 0.001 + Math.random() * 0.8;
    p.phase = Math.random() * TAU;
  }
}

/* 单个粒子的当前半径（径向振荡） */
function particleRadius(p, t){
  const state = mixRatio < 0.5 ? stateA : stateB;

  /* 径向节点：在 r1, r2 处概率为 0 */
  const nodes = state.nodes;

  let baseR;
  if (nodes === 0){
    baseR = state.radius;
  } else if (nodes === 1){
    /* 两峰分布 */
    const rPeak = state.radius;
    const rInner = rPeak * 0.42;
    baseR = p.dir.x > 0 ? rPeak : rInner;
    if (Math.random() < 0.4) baseR = rPeak;
  } else {
    const rPeak = state.radius;
    const rInner = rPeak * 0.35;
    const rMid = rPeak * 0.68;
    const pick = Math.floor(p.phase * 10) % 3;
    baseR = pick === 0 ? rPeak : (pick === 1 ? rInner : rMid);
  }

  /* 轻微抖动 */
  const jitter = Math.sin(t * 1.6 + p.phase) * 0.028;
  return baseR * (1 + jitter);
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let droneOsc = null;
let droneGain = null;
let lastFlash = 0;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.42, ac.currentTime, 1.8);

  /* 背景底噪：低频持续音 */
  droneOsc = ac.createOscillator();
  droneOsc.type = 'sine';
  droneOsc.frequency.value = 62;

  const droneOsc2 = ac.createOscillator();
  droneOsc2.type = 'sine';
  droneOsc2.frequency.value = 62.8;

  droneGain = ac.createGain();
  droneGain.gain.value = 0.018;

  droneOsc.connect(droneGain);
  droneOsc2.connect(droneGain);
  droneGain.connect(master);
  droneOsc.start();
  droneOsc2.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* 量子闪烁音：极短的高频微音 */
function playQuantumFlash(pitch){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  if (now - lastFlash < 0.045) return;
  lastFlash = now;

  const f = 2400 + Math.random() * 2200 + (pitch || 0) * 220;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 0.72, now + 0.040);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.008, now + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.055);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.06);
}

/* 能级跃迁音：上行/下行滑音 + 泛音 */
function playTransition(from, to, upward){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const f1 = 220 + from * 110;
  const f2 = 220 + to * 110;

  const osc = ac.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(f1, now);
  osc.frequency.exponentialRampToValueAtTime(f2, now + 0.55);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.048, now + 0.03);
  g.gain.setValueAtTime(0.048, now + 0.25);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.72);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.75);

  /* 泛音层 */
  const osc2 = ac.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(f1 * 2, now);
  osc2.frequency.exponentialRampToValueAtTime(f2 * 2, now + 0.55);

  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0, now + 0.04);
  g2.gain.linearRampToValueAtTime(0.020, now + 0.07);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.68);

  osc2.connect(g2);
  g2.connect(master);
  osc2.start(now + 0.04);
  osc2.stop(now + 0.70);

  /* 高频光泽音 */
  const osc3 = ac.createOscillator();
  osc3.type = 'sine';
  const baseF = upward ? 1320 : 990;
  osc3.frequency.setValueAtTime(baseF, now);
  osc3.frequency.exponentialRampToValueAtTime(baseF * (upward ? 1.6 : 0.62), now + 0.42);

  const g3 = ac.createGain();
  g3.gain.setValueAtTime(0, now + 0.06);
  g3.gain.linearRampToValueAtTime(0.014, now + 0.09);
  g3.gain.exponentialRampToValueAtTime(0.0001, now + 0.60);

  osc3.connect(g3);
  g3.connect(master);
  osc3.start(now + 0.06);
  osc3.stop(now + 0.62);
}

/* =========================================================
   能级面板
   ========================================================= */
let lvRows = [];

function buildLevels(){
  const wrap = document.getElementById('levels');
  if (!wrap) return;
  wrap.innerHTML = '';
  lvRows = [];

  for (let i = 0; i < STATES.length; i++){
    const s = STATES[i];
    const row = document.createElement('div');
    row.className = 'lv-row' + (i === lastLvIdx ? ' on' : '');
    row.dataset.idx = i;

    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = s.label;

    const en = document.createElement('span');
    en.className = 'en';
    en.textContent = s.energy.toFixed(2) + ' eV';

    row.appendChild(nm);
    row.appendChild(en);

    row.addEventListener('click', function(e){
      e.stopPropagation();
      initAudio();
      jumpToState(parseInt(this.dataset.idx, 10));
    });

    wrap.appendChild(row);
    lvRows.push(row);
  }
}

/* 用户点击直接跳到某个态 */
function jumpToState(idx){
  if (idx === lastLvIdx) return;

  const fromN = stateA.n + stateA.l;
  const toState = STATES[idx];
  const toN = toState.n + toState.l;
  const upward = toN > fromN;

  playTransition(fromN, toN, upward);

  stateA = stateB;
  stateB = toState;
  lastLvIdx = idx;

  mixRatio = 0;
  mixTarget = 0;
  transPhase = 0;
  cycleState = 'transition';
  cycleTimer = 0;

  updateLvHighlight();
  respawnCloud(true);
}

function updateLvHighlight(){
  for (let i = 0; i < lvRows.length; i++){
    lvRows[i].classList.toggle('on', i === lastLvIdx);
  }
}

/* =========================================================
   自动循环跃迁
   ========================================================= */
function autoAdvance(dt){
  cycleTimer += dt;

  if (cycleState === 'hold'){
    if (cycleTimer > HOLD_DUR){
      /* 随机选择下一个不同的态 */
      let next = lastLvIdx;
      let guard = 0;
      while (next === lastLvIdx && guard < 30){
        next = Math.floor(Math.random() * STATES.length);
        guard++;
      }

      const fromN = stateA.n + stateA.l;
      const toState = STATES[next];
      const toN = toState.n + toState.l;
      const upward = toN > fromN;

      playTransition(fromN, toN, upward);

      stateA = stateB;
      stateB = toState;
      lastLvIdx = next;

      mixRatio = 0;
      mixTarget = 0;
      transPhase = 0;
      cycleState = 'transition';
      cycleTimer = 0;

      updateLvHighlight();
      respawnCloud(true);
    }
  } else if (cycleState === 'transition'){
    transPhase += dt / TRANS_DUR;

    /* 缓动混合 */
    const eased = transPhase < 0.5
      ? 2 * transPhase * transPhase
      : 1 - Math.pow(-2 * transPhase + 2, 2) / 2;

    mixRatio = eased;

    if (transPhase >= 1){
      mixRatio = 1;
      transPhase = 1;
      cycleState = 'hold';
      cycleTimer = 0;
      stateA = stateB;
      mixRatio = 0;
    }
  }
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(t){
  const bg = ctx.createRadialGradient(
    CX, CY, 0,
    CX, CY, Math.max(W, H) * 0.85
  );
  bg.addColorStop(0.00, '#080a1c');
  bg.addColorStop(0.42, '#04060f');
  bg.addColorStop(1.00, '#010207');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星空 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.012) continue;
    ctx.fillStyle = 'hsla(' + s.hue + ', 80%, 86%, ' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：概率云
   ========================================================= */
function mixColor(hA, hB){
  /* 混合两个色相（线性插值） */
  const h = hA + (hB - hA) * mixRatio;
  return ((h % 360) + 360) % 360;
}

function drawProbabilityCloud(t){
  const scale = Math.min(W, H) * 0.115;
  const state = mixRatio < 0.5 ? stateA : stateB;

  const hA = stateA.hueA;
  const hB = stateB.hueA;
  const hue = mixRatio < 0.5
    ? hA
    : hA + (hB - hA) * mixRatio;

  /* 径向节点数 */
  const nodes = state.nodes;

  /* 背景柔光 */
  ctx.globalCompositeOperation = 'lighter';
  const bgGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, scale * 4.2);
  bgGrad.addColorStop(0.00, 'hsla(' + hue + ', 92%, 62%, 0.10)');
  bgGrad.addColorStop(0.42, 'hsla(' + hue + ', 88%, 56%, 0.04)');
  bgGrad.addColorStop(1.00, 'hsla(' + hue + ', 88%, 52%, 0)');
  ctx.fillStyle = bgGrad;
  ctx.beginPath();
  ctx.arc(CX, CY, scale * 4.2, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 粒子 */
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < cloudParticles.length; i++){
    const p = cloudParticles[i];

    /* 出现延时 */
    const bornT = t - p.born;
    if (bornT < 0) continue;

    /* 渐入 */
    const fadeIn = Math.min(1, bornT / 0.8);

    /* 径向位置 */
    let baseR = particleRadius(p, t);
    baseR *= (1 + 0.05 * Math.sin(t * 0.8 + p.phase));

    /* 屏幕坐标 */
    const px = CX + p.dir.x * baseR * scale;
    const py = CY + p.dir.y * baseR * scale * 0.86;
    const pz = p.dir.z;

    /* 呼吸闪烁 */
    const breath = 0.55 + 0.45 * Math.sin(t * 2.2 + p.phase);

    /* 大小 */
    const sz = p.size * (0.8 + pz * 0.4) * 1.7 * fadeIn;

    if (sz < 0.2) continue;

    /* 颜色：核心亮、外围暗 */
    const innerFactor = 1 - Math.min(1, baseR / 1.6);
    const alpha = breath * fadeIn * (0.30 + innerFactor * 0.55);

    /* 画光点 */
    const g = ctx.createRadialGradient(px, py, 0, px, py, sz * 3.2);
    g.addColorStop(0.00, 'hsla(' + hue + ', 100%, 92%, ' + alpha + ')');
    g.addColorStop(0.38, 'hsla(' + hue + ', 100%, 74%, ' + (alpha * 0.42) + ')');
    g.addColorStop(1.00, 'hsla(' + hue + ', 100%, 62%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, sz * 3.2, 0, TAU);
    ctx.fill();

    /* 核心亮点 */
    if (Math.random() < 0.06){
      playQuantumFlash(baseR);
    }
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：波函数曲线（径向 1D 截面）
   ========================================================= */
function drawWaveFunction(t){
  const w = Math.min(W, H) * 0.34;
  const h = Math.min(H * 0.20, 160);
  const x0 = CX - w * 0.5;
  const y0 = CY + Math.min(W, H) * 0.30;

  /* 面板底 */
  ctx.fillStyle = 'rgba(6, 10, 24, 0.52)';
  roundRect(x0 - 14, y0 - 14, w + 28, h + 28, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 140, 220, 0.14)';
  ctx.lineWidth = 1;
  roundRect(x0 - 14, y0 - 14, w + 28, h + 28, 10);
  ctx.stroke();

  const centerY = y0 + h * 0.5;

  /* 零线 */
  ctx.beginPath();
  ctx.moveTo(x0, centerY);
  ctx.lineTo(x0 + w, centerY);
  ctx.strokeStyle = 'rgba(140, 180, 240, 0.28)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 竖直网格 */
  ctx.strokeStyle = 'rgba(80, 130, 210, 0.075)';
  for (let i = 1; i <= 4; i++){
    const x = x0 + w * i / 5;
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.lineTo(x, y0 + h);
    ctx.stroke();
  }

  /* 状态参数 */
  const sA = stateA;
  const sB = stateB;
  const mix = mixRatio;

  /* 计算径向波函数 */
  function R(state, r){
    const n = state.n;
    const l = state.l;

    /* 简化的类氢径向波函数（归一化形状） */
    /* R ∝ r^l * exp(-r/n) * Laguerre(r) */
    let val = Math.pow(r, l + 1) * Math.exp(-r / (0.8 * n));

    /* 节点位置：为 s 轨道添加额外的节点 */
    if (l === 0 && n >= 2){
      /* 简化的 Laguerre 零点 */
      const r1 = n * 1.6;
      if (n === 2) val *= (1 - r / r1);
      if (n === 3){
        const r2 = n * 1.6;
        const r3 = n * 0.85;
        val *= (1 - r / r2) * (1 - r / r3);
      }
    }
    if (l === 1 && n >= 3){
      val *= (1 - r / (n * 1.7));
    }

    return val;
  }

  /* 采样 */
  const SAMPLES = 220;
  const R_MAX = 4.6;
  const pointsA = [];
  const pointsB = [];

  let maxAbs = 0;
  for (let i = 0; i <= SAMPLES; i++){
    const r = (i / SAMPLES) * R_MAX;
    const va = R(sA, r);
    const vb = R(sB, r);
    if (Math.abs(va) > maxAbs) maxAbs = Math.abs(va);
    if (Math.abs(vb) > maxAbs) maxAbs = Math.abs(vb);
    pointsA.push({ r: r, v: va });
    pointsB.push({ r: r, v: vb });
  }

  maxAbs = maxAbs || 1;
  const yScale = h * 0.42 / maxAbs;

  /* 绘制 A（淡） */
  if (mix < 0.99){
    ctx.beginPath();
    for (let i = 0; i < pointsA.length; i++){
      const p = pointsA[i];
      const px = x0 + (p.r / R_MAX) * w;
      const py = centerY - p.v * yScale;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = 'hsla(' + sA.hueA + ', 88%, 70%, ' + (1 - mix) * 0.42 + ')';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  /* 绘制 B（淡） */
  if (mix > 0.01){
    ctx.beginPath();
    for (let i = 0; i < pointsB.length; i++){
      const p = pointsB[i];
      const px = x0 + (p.r / R_MAX) * w;
      const py = centerY - p.v * yScale;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = 'hsla(' + sB.hueA + ', 88%, 70%, ' + mix * 0.42 + ')';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  /* 绘制混合曲线（主体） */
  ctx.beginPath();
  for (let i = 0; i < pointsA.length; i++){
    const pa = pointsA[i];
    const pb = pointsB[i];
    const v = pa.v * (1 - mix) + pb.v * mix;
    const px = x0 + (pa.r / R_MAX) * w;
    const py = centerY - v * yScale;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  const hueA = sA.hueA;
  const hueB = sB.hueA;
  const hueNow = hueA + (hueB - hueA) * mix;

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'hsla(' + hueNow + ', 100%, 68%, 0.16)';
  ctx.lineWidth = 9;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';

  /* 主线 */
  const grad = ctx.createLinearGradient(x0, 0, x0 + w, 0);
  grad.addColorStop(0, 'hsla(' + hueNow + ', 100%, 88%, 0.94)');
  grad.addColorStop(1, 'hsla(' + ((hueNow + 30) % 360) + ', 100%, 82%, 0.94)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.2;
  ctx.stroke();

  /* 填充（|ψ|² 概率密度） */
  ctx.beginPath();
  ctx.moveTo(x0, centerY);
  for (let i = 0; i < pointsA.length; i++){
    const pa = pointsA[i];
    const pb = pointsB[i];
    const v = pa.v * (1 - mix) + pb.v * mix;
    const px = x0 + (pa.r / R_MAX) * w;
    const py = centerY - v * yScale;
    ctx.lineTo(px, py);
  }
  ctx.lineTo(x0 + w, centerY);
  ctx.closePath();
  const fillGrad = ctx.createLinearGradient(0, centerY - h * 0.4, 0, centerY + h * 0.4);
  fillGrad.addColorStop(0, 'hsla(' + hueNow + ', 92%, 62%, 0.18)');
  fillGrad.addColorStop(1, 'hsla(' + hueNow + ', 92%, 52%, 0.02)');
  ctx.fillStyle = fillGrad;
  ctx.fill();

  /* 曲线上的波动点（概率云中粒子的投影） */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++){
    const r = ((t * 0.6 + i / 6) % 1) * R_MAX;
    const pa = R(sA, r);
    const pb = R(sB, r);
    const v = pa * (1 - mix) + pb * mix;

    const px = x0 + (r / R_MAX) * w;
    const py = centerY - v * yScale;

    const sz = 3 + 1.5 * Math.sin(t * 3 + i);

    const g = ctx.createRadialGradient(px, py, 0, px, py, sz * 2.8);
    g.addColorStop(0, 'hsla(' + hueNow + ', 100%, 90%, 0.62)');
    g.addColorStop(1, 'hsla(' + hueNow + ', 100%, 62%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, sz * 2.8, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* 标题 */
  ctx.font = '400 9.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(150, 190, 240, 0.42)';
  ctx.fillText('径向波函数 R(r)', x0 - 6, y0 - 30);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(150, 190, 240, 0.34)';
  ctx.fillText('r →', x0 + w + 6, centerY + 6);

  /* 当前量子数标注 */
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.font = '500 10px "SF Mono", Consolas, Monaco, monospace';

  const label = mix < 0.5 ? sA.label : sB.label;
  const hueLbl = mix < 0.5 ? sA.hueA : sB.hueA;

  ctx.fillStyle = 'hsla(' + hueLbl + ', 92%, 84%, 0.92)';
  ctx.fillText(label, x0 - 6, y0 + h + 24);
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* =========================================================
   绘制：能级轨道
   ========================================================= */
function drawEnergyLevels(){
  const x0 = W - Math.min(W * 0.22, 260);
  const y0 = CY - Math.min(H * 0.30, 200);
  const h = Math.min(H * 0.60, 400);

  const levelY = {
    1: y0 + h * 0.08,
    2: y0 + h * 0.40,
    3: y0 + h * 0.72
  };

  /* 竖线（能量轴） */
  const yMin = y0 + h * 0.02;
  const yMax = y0 + h * 0.96;

  ctx.beginPath();
  ctx.moveTo(x0, yMin);
  ctx.lineTo(x0, yMax);
  ctx.strokeStyle = 'rgba(150, 190, 240, 0.24)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 三个能级 */
  const levels = [1, 2, 3];

  for (let i = 0; i < levels.length; i++){
    const n = levels[i];
    const y = levelY[n];
    const active = (stateB.n === n) || (mixRatio > 0.4 && stateA.n === n);

    ctx.beginPath();
    ctx.moveTo(x0 - 8, y);
    ctx.lineTo(x0 + 120, y);

    if (active){
      ctx.strokeStyle = 'hsla(' + stateB.hueA + ', 92%, 76%, 0.92)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'hsla(' + stateB.hueA + ', 100%, 68%, 0.72)';
      ctx.shadowBlur = 12;
    } else {
      ctx.strokeStyle = 'rgba(140, 180, 240, 0.32)';
      ctx.lineWidth = 1.2;
      ctx.shadowBlur = 0;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    /* 能级标签 */
    ctx.font = '500 10px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    const label = 'n = ' + n;
    ctx.fillStyle = active
      ? 'hsla(' + stateB.hueA + ', 92%, 84%, 0.98)'
      : 'rgba(150, 190, 240, 0.48)';
    ctx.fillText(label, x0 + 126, y);
  }

  /* 跃迁箭头 */
  if (cycleState === 'transition'){
    const fromN = stateA.n;
    const toN = stateB.n;

    const yF = levelY[fromN];
    const yT = levelY[toN];

    const px = x0 + 60;
    const alpha = Math.min(1, transPhase * 2);

    /* 箭头 */
    const dir = yT < yF ? -1 : 1;

    ctx.beginPath();
    ctx.moveTo(px, yF);
    ctx.lineTo(px, yT - dir * 6);
    ctx.strokeStyle = 'hsla(' + stateB.hueA + ', 100%, 78%, ' + (alpha * 0.92) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 箭头头 */
    ctx.beginPath();
    ctx.moveTo(px, yT);
    ctx.lineTo(px - 5, yT - dir * 9);
    ctx.lineTo(px + 5, yT - dir * 9);
    ctx.closePath();
    ctx.fillStyle = 'hsla(' + stateB.hueA + ', 100%, 82%, ' + (alpha * 0.92) + ')';
    ctx.fill();

    /* 光子符号 */
    if (transPhase > 0.4){
      const t2 = (transPhase - 0.4) / 0.6;
      const rx = px + t2 * 30;
      const ry = (yF + yT) * 0.5;

      ctx.globalCompositeOperation = 'lighter';
      const r = 6 + t2 * 8;
      const g = ctx.createRadialGradient(rx, ry, 0, rx, ry, r);
      g.addColorStop(0, 'hsla(48, 100%, 88%, ' + (1 - t2) * 0.92 + ')');
      g.addColorStop(0.42, 'hsla(42, 100%, 68%, ' + (1 - t2) * 0.42 + ')');
      g.addColorStop(1, 'hsla(42, 100%, 58%, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(rx, ry, r, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      ctx.font = '500 10px "SF Mono", Consolas, Monaco, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'hsla(48, 100%, 90%, ' + (1 - t2) * 0.92 + ')';
      ctx.fillText('hν', rx, ry - 14);
    }
  }

  /* 标题 */
  ctx.font = '400 9.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(150, 190, 240, 0.42)';
  ctx.fillText('能级', x0 - 30, yMin - 18);
}

/* =========================================================
   HUD
   ========================================================= */
let uiTick = 0;

function updateHUD(){
  uiTick++;
  if (uiTick % 5 !== 0) return;

  const curState = mixRatio < 0.5 ? stateA : stateB;

  const vN = document.getElementById('vN');
  const vL = document.getElementById('vL');
  const vM = document.getElementById('vM');
  const vE = document.getElementById('vE');
  const vT = document.getElementById('vTrans');

  if (vN) vN.textContent = curState.n;
  if (vL) vL.textContent = curState.l;
  if (vM) vM.textContent = curState.m;
  if (vE) vE.textContent = curState.energy.toFixed(2) + ' eV';

  if (vT){
    if (cycleState === 'transition'){
      vT.textContent = stateA.label + ' → ' + stateB.label;
    } else {
      vT.textContent = stateB.label + ' 稳定';
    }
  }
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  /* 自动跃迁 */
  autoAdvance(dt);

  /* 渲染 */
  drawBackground(t);
  drawProbabilityCloud(t);
  drawEnergyLevels();
  drawWaveFunction(t);

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.22)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.90)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
window.addEventListener('pointerdown', function(){
  initAudio();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    /* 立即跃迁到下一态 */
    cycleTimer = HOLD_DUR;
  } else if (e.key >= '1' && e.key <= '6'){
    initAudio();
    const idx = parseInt(e.key, 10) - 1;
    if (idx >= 0 && idx < STATES.length) jumpToState(idx);
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    stateA = STATES[1];
    stateB = STATES[2];
    mixRatio = 0;
    transPhase = 0;
    cycleState = 'hold';
    cycleTimer = 0;
    lastLvIdx = 1;
    updateLvHighlight();
    respawnCloud(true);
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
initCloud();
buildLevels();
requestAnimationFrame(loop);

})();
