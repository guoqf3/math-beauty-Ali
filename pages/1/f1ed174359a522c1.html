<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高斯定律 · 电磁海星</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; top: 0; }
  #fx  { left: 20%; width: 80%; height: 100%; }
  #hud { left: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<canvas id="hud"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
"use strict";

/* ================================================================== */
/*  0. 基础量                                                           */
/* ================================================================== */
const TAU = Math.PI * 2;
const fx  = document.getElementById('fx');
const hud = document.getElementById('hud');
const hctx = hud.getContext('2d');

let W = 0, H = 0, PW = 0, RW = 0;
let T = 0;

/* ================================================================== */
/*  1. Three.js 场景                                                    */
/* ================================================================== */
const renderer = new THREE.WebGLRenderer({ canvas: fx, antialias: true });
renderer.setClearColor(0x000000, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 3000);

/* ================================================================== */
/*  2. 海星几何参数                                                     */
/* ================================================================== */
const ARMS           = 5;      // 五条腕
const LINES_PER_ARM  = 30;     // 每条腕的场线数
const PTS_PER_LINE   = 50;     // 每条场线采样点
const TURNS          = 2.4;    // 螺旋圈数
const L              = 62;     // 腕长
const R0             = 10.5;   // 腕根半径

const SEG_PER_LINE = PTS_PER_LINE - 1;
const SEG_TOTAL    = ARMS * LINES_PER_ARM * SEG_PER_LINE;
const VERT_TOTAL   = SEG_TOTAL * 2;

const posArr = new Float32Array(VERT_TOTAL * 3);
const colArr = new Float32Array(VERT_TOTAL * 3);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors : true,
  blending     : THREE.AdditiveBlending,
  transparent  : true,
  depthWrite   : false,
  opacity      : 1.0
});

const starLines = new THREE.LineSegments(geo, lineMat);
starLines.frustumCulled = false;
scene.add(starLines);

/* ---------- 中心辉光 ---------- */
function glowTexture() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grd.addColorStop(0.00, 'rgba(210,255,255,0.95)');
  grd.addColorStop(0.18, 'rgba(0,255,255,0.45)');
  grd.addColorStop(0.45, 'rgba(120,60,255,0.16)');
  grd.addColorStop(1.00, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);
  return new THREE.CanvasTexture(c);
}
const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture(),
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.9
}));
coreGlow.scale.set(56, 56, 1);
scene.add(coreGlow);

/* ================================================================== */
/*  3. 预计算：腕轴、切向基、半径包络                                    */
/* ================================================================== */
const AXP = new Float32Array(ARMS * PTS_PER_LINE * 3);
const AN1 = new Float32Array(ARMS * PTS_PER_LINE * 3);
const AN2 = new Float32Array(ARMS * PTS_PER_LINE * 3);

const RAD = new Float32Array(PTS_PER_LINE);
for (let i = 0; i < PTS_PER_LINE; i++) {
  const u = i / (PTS_PER_LINE - 1);
  RAD[i] = R0 * (0.15 + 0.85 * Math.pow(1 - u, 0.7));
}

/* 腕轴局部参数化 → 世界坐标 */
const _v = new THREE.Vector3();
function armPoint(u, t, ai, ca, sa, out) {
  const r  = L * u;
  const ly = Math.sin(u * 3.6 - t * 2.1 + ai * 1.70) * 3.4 * u;
  const lz = Math.sin(u * 2.4 + t * 1.5 + ai * 2.60) * 2.4 * u;
  out.x = r * ca - lz * sa;
  out.z = r * sa + lz * ca;
  out.y = ly;
  return out;
}

const _p0 = new THREE.Vector3(), _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();
const _T  = new THREE.Vector3(), _N1 = new THREE.Vector3(), _N2 = new THREE.Vector3();
const YUP = new THREE.Vector3(0, 1, 0);

function precomputeAxis(t) {
  for (let a = 0; a < ARMS; a++) {
    const ang = a * TAU / ARMS + t * 0.12;
    const ca = Math.cos(ang), sa = Math.sin(ang);

    for (let i = 0; i < PTS_PER_LINE; i++) {
      const u   = i / (PTS_PER_LINE - 1);
      const idx = (a * PTS_PER_LINE + i) * 3;

      armPoint(u, t, a, ca, sa, _p0);

      const du = 0.01;
      armPoint(Math.max(0, u - du), t, a, ca, sa, _p1);
      armPoint(Math.min(1, u + du), t, a, ca, sa, _p2);
      _T.subVectors(_p2, _p1).normalize();

      _N1.crossVectors(_T, YUP);
      if (_N1.lengthSq() < 1e-8) _N1.set(0, 0, 1);
      _N1.normalize();
      _N2.crossVectors(_N1, _T).normalize();

      AXP[idx] = _p0.x; AXP[idx+1] = _p0.y; AXP[idx+2] = _p0.z;
      AN1[idx] = _N1.x; AN1[idx+1] = _N1.y; AN1[idx+2] = _N1.z;
      AN2[idx] = _N2.x; AN2[idx+1] = _N2.y; AN2[idx+2] = _N2.z;
    }
  }
}

/* ================================================================== */
/*  4. 每帧生成几何 + 颜色                                              */
/* ================================================================== */
const tmpP = new Float32Array(PTS_PER_LINE * 3);
const tmpC = new Float32Array(PTS_PER_LINE * 3);

function updateGeometry(t) {
  precomputeAxis(t);

  let ptr = 0;

  for (let a = 0; a < ARMS; a++) {
    for (let j = 0; j < LINES_PER_ARM; j++) {
      const phi = (j / LINES_PER_ARM) * TAU;

      /* ---- ① 算出这条场线的全部采样点 ---- */
      for (let i = 0; i < PTS_PER_LINE; i++) {
        const u   = i / (PTS_PER_LINE - 1);
        const idx = (a * PTS_PER_LINE + i) * 3;

        const px = AXP[idx],   py = AXP[idx+1],   pz = AXP[idx+2];
        const e1x = AN1[idx],  e1y = AN1[idx+1],  e1z = AN1[idx+2];
        const e2x = AN2[idx],  e2y = AN2[idx+1],  e2z = AN2[idx+2];

        /* 螺旋缠绕 */
        const theta = phi + u * TURNS * TAU;
        const ct = Math.cos(theta), st = Math.sin(theta);

        /* 半径呼吸，让场线有"鼓包" */
        const rho = RAD[i] * (0.80 + 0.20 * Math.sin(u * 8.0 + phi * 1.5));

        tmpP[i*3]     = px + (e1x * ct + e2x * st) * rho;
        tmpP[i*3 + 1] = py + (e1y * ct + e2y * st) * rho;
        tmpP[i*3 + 2] = pz + (e1z * ct + e2z * st) * rho;

        /* ---- ② 颜色 ---- */
        const mix = 0.5 + 0.5 * Math.sin(phi * 1.6 + u * 4.5 - t * 0.7 + a * 0.9);
        const cr  = mix;          // 品红分量
        const cg  = 1 - mix;      // 青 分量
        const cb  = 1;

        const pulse1 = Math.pow(0.5 + 0.5 * Math.sin(u * 17.0 - t * 6.0 + phi * 0.9 + a * 1.25), 9);
        const pulse2 = Math.pow(0.5 + 0.5 * Math.sin(u *  7.0 - t * 3.0 + phi * 1.6 + a * 0.60), 5);
        const flick  = 0.5 + 0.5 * Math.sin(u * 13.0 + t * 2.4 - phi * 2.2);

        const inten = 0.045 + 0.055 * flick + 0.85 * pulse1 + 0.38 * pulse2;

        tmpC[i*3]     = cr * inten;
        tmpC[i*3 + 1] = cg * inten;
        tmpC[i*3 + 2] = cb * inten;
      }

      /* ---- ③ 拆成线段写入缓冲区 ---- */
      for (let i = 0; i < SEG_PER_LINE; i++) {
        /* 段起点 */
        posArr[ptr]     = tmpP[i * 3];
        posArr[ptr + 1] = tmpP[i * 3 + 1];
        posArr[ptr + 2] = tmpP[i * 3 + 2];
        colArr[ptr]     = tmpC[i * 3];
        colArr[ptr + 1] = tmpC[i * 3 + 1];
        colArr[ptr + 2] = tmpC[i * 3 + 2];
        ptr += 3;

        /* 段终点 */
        const k = (i + 1) * 3;
        posArr[ptr]     = tmpP[k];
        posArr[ptr + 1] = tmpP[k + 1];
        posArr[ptr + 2] = tmpP[k + 2];
        colArr[ptr]     = tmpC[k];
        colArr[ptr + 1] = tmpC[k + 1];
        colArr[ptr + 2] = tmpC[k + 2];
        ptr += 3;
      }
    }
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate    = true;
}

/* ================================================================== */
/*  5. 左侧 HUD —— 高斯定律                                              */
/* ================================================================== */
function drawHUD(t) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hctx.clearRect(0, 0, W, H);

  hctx.save();
  hctx.globalCompositeOperation = 'lighter';
  hctx.textAlign = 'center';
  hctx.textBaseline = 'middle';

  const cx = PW / 2;
  const cy = H * 0.42;
  const fs = Math.max(13, Math.min(PW * 0.150, H * 0.050));

  const rows = ['∮ E · dA', '=  Q / ε₀'];
  const fontMain = `italic ${fs}px "Cambria Math","Times New Roman",Georgia,serif`;

  /* ---------- 观测扰动虚影 ---------- */
  hctx.font = fontMain;
  for (let k = 0; k < 4; k++) {
    const jx = Math.sin(t * 11.3 + k * 2.4) * fs * 0.065;
    const jy = Math.cos(t *  9.7 + k * 1.9) * fs * 0.065;
    hctx.globalAlpha = 0.055 + 0.055 * (0.5 + 0.5 * Math.sin(t * 5.1 + k * 3.3));
    hctx.fillStyle   = (k % 2) ? '#ff4dff' : '#4dffff';
    hctx.fillText(rows[0], cx + jx, cy - fs * 0.78 + jy);
    hctx.fillText(rows[1], cx + jx, cy + fs * 0.78 + jy);
  }

  /* ---------- 主体 ---------- */
  hctx.globalAlpha = 1;
  hctx.shadowBlur  = fs * 0.85;
  hctx.shadowColor = '#00ffff';
  hctx.fillStyle   = '#eaffff';
  hctx.fillText(rows[0], cx, cy - fs * 0.78);

  hctx.shadowColor = '#ff00ff';
  hctx.fillStyle   = '#ffeaff';
  hctx.fillText(rows[1], cx, cy + fs * 0.78);
  hctx.shadowBlur  = 0;

  /* ---------- 装饰线 ---------- */
  const dy = cy + fs * 2.25;
  hctx.strokeStyle = 'rgba(0,230,255,0.22)';
  hctx.lineWidth = 1;
  hctx.beginPath();
  hctx.moveTo(cx - PW * 0.30, dy);
  hctx.lineTo(cx + PW * 0.30, dy);
  hctx.stroke();

  /* ---------- 标注 ---------- */
  const fs2 = Math.max(9, fs * 0.38);
  hctx.font = `${fs2}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;

  const tags = [
    ['E  电场强度',  '#4dffff'],
    ['dA 面积元',    '#8fd8ff'],
    ['Q  净电荷',    '#ff8dff'],
    ['ε₀ 真空介电常数', '#ff4dff']
  ];
  for (let i = 0; i < tags.length; i++) {
    const y = dy + fs2 * 2.3 + i * fs2 * 2.0;
    hctx.globalAlpha = 0.42 + 0.28 * (0.5 + 0.5 * Math.sin(t * 2.1 + i * 1.25));
    hctx.fillStyle   = tags[i][1];
    hctx.fillText(tags[i][0], cx, y);
  }

  /* ---------- 底部小字 ---------- */
  hctx.globalAlpha = 0.26 + 0.16 * (0.5 + 0.5 * Math.sin(t * 1.6));
  hctx.font = `italic ${fs2 * 1.05}px "Cambria Math","Times New Roman",Georgia,serif`;
  hctx.fillStyle = '#9fe9ff';
  hctx.fillText('∇·E = ρ / ε₀', cx, dy + fs2 * 12.2);

  hctx.restore();
  hctx.globalAlpha = 1;
}

/* ================================================================== */
/*  6. 中缝光带                                                         */
/* ================================================================== */
function drawDivider() {
  const g = hctx.createLinearGradient(PW - 40, 0, PW + 40, 0);
  g.addColorStop(0.0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, 'rgba(0,220,255,0.16)');
  g.addColorStop(1.0, 'rgba(0,0,0,0)');
  hctx.save();
  hctx.globalCompositeOperation = 'lighter';
  hctx.fillStyle = g;
  hctx.fillRect(PW - 40, 0, 80, H);
  hctx.restore();
}

/* ================================================================== */
/*  7. 尺寸                                                             */
/* ================================================================== */
function resize() {
  W = innerWidth;
  H = innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  PW = Math.max(110, W * 0.2);
  RW = W - PW;

  /* --- HUD --- */
  hud.width  = Math.round(W * dpr);
  hud.height = Math.round(H * dpr);
  hud.style.width  = W + 'px';
  hud.style.height = H + 'px';

  /* --- WebGL --- */
  fx.style.left   = PW + 'px';
  fx.style.width  = RW + 'px';
  fx.style.height = H  + 'px';

  renderer.setPixelRatio(dpr);
  renderer.setSize(RW, H, false);

  /* --- 相机自适应取景 --- */
  camera.aspect = RW / H;

  const fovV = 42 * Math.PI / 180;
  const fovH = 2 * Math.atan(Math.tan(fovV / 2) * camera.aspect);
  const FIT  = 168;                                   // 想容纳的世界尺度
  const dV   = (FIT / 2) / Math.tan(fovV / 2);
  const dH   = (FIT / 2) / Math.tan(fovH / 2);
  const dist = Math.max(dV, dH) * 1.02;

  camera.position.set(0, dist * 0.40, dist * 0.92);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ================================================================== */
/*  8. 主循环                                                           */
/* ================================================================== */
let last = 0;

function loop(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05)  dt = 0.05;
  if (dt < 0.0005) dt = 0.0005;
  T += dt;

  /* 相机轻微呼吸 */
  const cd = camera.position.length();
  camera.position.y = cd * 0.40 + Math.sin(T * 0.42) * 5.0;
  camera.lookAt(0, 0, 0);

  /* 几何更新 */
  updateGeometry(T);

  /* 中心辉光脉动 */
  const pulse = 0.75 + 0.25 * Math.sin(T * 2.1);
  coreGlow.scale.set(56 * pulse, 56 * pulse, 1);
  coreGlow.material.opacity = 0.55 + 0.35 * pulse;

  renderer.render(scene, camera);

  /* HUD */
  drawHUD(T);
  drawDivider();

  requestAnimationFrame(loop);
}

/* 启动 */
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
