<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月球盈亏相位 · Moon Phases</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#01030a;}
  body{
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#cfefff; -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;z-index:1;}
  canvas{display:block;}

  #vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.70) 100%);
    mix-blend-mode:multiply;
  }

  #hud{position:fixed;inset:0;z-index:5;pointer-events:none;}

  .panel{
    position:absolute;
    background:linear-gradient(150deg, rgba(7,20,38,0.64), rgba(3,9,20,0.42));
    border:1px solid rgba(90,200,255,0.20);
    border-radius:14px;
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    box-shadow:0 0 30px rgba(0,110,180,0.16), inset 0 0 26px rgba(0,150,220,0.06);
    padding:18px 20px;
  }

  /* ---------- 左上：公式 ---------- */
  .panel-tl{ top:22px; left:22px; width:328px; }

  .title{
    font-size:21px; font-weight:700; letter-spacing:3px;
    background:linear-gradient(92deg,#9df3ff,#5bc8ff 55%,#c39bff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 26px rgba(80,210,255,0.35);
  }
  .subtitle{
    margin-top:5px; font-size:9.5px; letter-spacing:2.6px;
    color:#4e8fb3; text-transform:uppercase;
  }
  .divider{
    height:1px; margin:12px 0 11px;
    background:linear-gradient(90deg, rgba(90,220,255,0.55), rgba(90,220,255,0.02));
  }
  .eq{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:13px; line-height:1.95; color:#a9ddf5; letter-spacing:0.3px;
    white-space:nowrap;
  }
  .eq.dim{color:#5f93ad; font-size:11.5px;}
  .eq.hot{
    color:#ff9de8;
    text-shadow:0 0 14px rgba(255,80,215,0.5);
  }
  .eq.hot b{color:#ffffff; font-weight:700;}

  /* ---------- 右上：数值 ---------- */
  .panel-tr{ top:22px; right:22px; width:268px; }
  .stat{
    display:flex; align-items:center; gap:9px;
    font-size:13px; color:#a9ddf5; line-height:2.15;
    letter-spacing:0.5px;
  }
  .stat b{
    margin-left:auto;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;
    font-size:15px; color:#fff;
  }
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot.moon{background:#ffe9a8; box-shadow:0 0 12px #ffe9a8, 0 0 24px rgba(255,233,168,0.5);}
  .dot.sun {background:#ffb44d; box-shadow:0 0 12px #ffb44d, 0 0 24px rgba(255,180,77,0.5);}
  .dot.ang {background:#5ce9ff; box-shadow:0 0 12px #5ce9ff, 0 0 24px rgba(92,233,255,0.5);}

  .note{
    font-size:11px; line-height:1.75; color:#6ea9c4; letter-spacing:0.3px;
  }
  .note em{color:#ffc97a; font-style:normal;}

  /* ---------- 左下：按钮 ---------- */
  .panel-bl{
    left:22px; bottom:22px; padding:10px 12px;
    display:flex; align-items:center; gap:10px;
  }
  #audioBtn{
    pointer-events:auto; cursor:pointer;
    font-family:inherit; font-size:12px; letter-spacing:1.4px;
    color:#9fe4ff; background:rgba(20,90,140,0.25);
    border:1px solid rgba(80,210,255,0.42);
    border-radius:9px; padding:9px 16px;
    transition:all .22s ease;
    box-shadow:0 0 16px rgba(0,140,220,0.18) inset;
  }
  #audioBtn:hover{
    background:rgba(40,150,220,0.34); color:#ffffff;
    box-shadow:0 0 22px rgba(60,200,255,0.5);
  }
  #audioBtn.on{
    color:#04121c; font-weight:700;
    background:linear-gradient(92deg,#5df0ff,#3fb4ff);
    border-color:#8ff4ff;
    box-shadow:0 0 26px rgba(80,220,255,0.75);
  }

  /* ---------- 画中画边框 ---------- */
  #pipBox{
    position:fixed; z-index:6; pointer-events:none;
    border:1px solid rgba(90,200,255,0.32);
    border-radius:12px;
    box-shadow:0 0 26px rgba(0,140,220,0.30), inset 0 0 20px rgba(0,120,200,0.10);
    overflow:hidden;
  }
  #pipBox .pip-label{
    position:absolute; top:8px; left:11px;
    font-size:10px; letter-spacing:1.8px; color:#8fd8ff;
    text-shadow:0 0 10px rgba(0,150,220,0.9);
  }
  #pipBox .pip-sub{
    position:absolute; bottom:8px; right:11px;
    font-size:9px; letter-spacing:1.2px; color:#4f8fb0;
  }

  /* ---------- 右下：提示 ---------- */
  .panel-br{
    right:22px; padding:10px 16px;
    font-size:11px; letter-spacing:0.9px; color:#5f9ab5;
  }
  .panel-br span{color:#9fe4ff;}

  @media (max-width: 980px){
    .panel-tl{ width:250px; padding:13px 14px; }
    .title{font-size:16px; letter-spacing:2px;}
    .eq{font-size:11px;}
    .panel-tr{ width:200px; padding:13px 14px; }
    .stat{font-size:11.5px;}
    .stat b{font-size:13px;}
    .panel-br{display:none;}
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>

<div id="app"></div>
<div id="vignette"></div>

<div id="hud">

  <div class="panel panel-tl">
    <div class="title">月球盈亏相位</div>
    <div class="subtitle">Moon Phases · Synodic Motion</div>
    <div class="divider"></div>
    <div class="eq">k = (1 − cos θ) / 2</div>
    <div class="eq dim">θ = 2π t / T<sub>公转</sub></div>
    <div class="eq">1/T = 1/T<sub>s</sub> − 1/T<sub>E</sub></div>
    <div class="eq hot">T<sub>自转</sub> = T<sub>公转</sub></div>
    <div class="eq dim">T = 29.53 d &nbsp;·&nbsp; T<sub>s</sub> = 27.32 d</div>
  </div>

  <div class="panel panel-tr">
    <div class="stat"><span class="dot moon"></span>当前相位<b id="hudName">新月</b></div>

    <div class="divider"></div>
    <div class="note">☀ 太阳光沿 <em>+X</em> 方向恒定照射<br>月球同一面始终朝向地球</div>
  </div>

  <div class="panel panel-bl">
    <button id="audioBtn">♪&nbsp; 开启音效</button>
  </div>

  <div class="panel panel-br" style="bottom:22px;">
    拖拽 <span>旋转</span> · 滚轮 <span>缩放</span>
  </div>

</div>

<div id="pipBox">
  <div class="pip-label">从地球看月球</div>
  <div class="pip-sub">EARTH VIEW</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ============================================================
   0. 物理常量
   ============================================================ */
const R_ORBIT       = 13.0;    // 月球轨道半径
const R_EARTH       = 2.0;     // 地球半径
const R_MOON        = 0.90;    // 月球半径
const ORBIT_PERIOD  = 30.0;    // 公转周期（秒，演示用）
const SUN_DIR       = new THREE.Vector3(1, 0, 0).normalize(); // 太阳光方向（恒定）

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000308, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const scene  = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.5, 4000
);
camera.position.set(0, 19, 33);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance   = 13;
controls.maxDistance   = 95;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = 1.45;
controls.enablePan     = false;
controls.update();

/* 画中画相机（位于地球中心，看向月球） */
const moonCam = new THREE.PerspectiveCamera(15, 1, 0.1, 3000);

/* ============================================================
   2. 星空背景
   ============================================================ */
(function buildStars(){
  const N = 3600;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);

  for (let i = 0; i < N; i++){
    const r  = 500 + Math.random() * 900;
    const u  = Math.random() * 2 - 1;
    const ph = Math.random() * Math.PI * 2;
    const s  = Math.sqrt(1 - u * u);

    pos[i*3]     = r * s * Math.cos(ph);
    pos[i*3 + 1] = r * u;
    pos[i*3 + 2] = r * s * Math.sin(ph);

    const t = Math.random();
    // 冷白 / 淡蓝 / 微紫
    col[i*3]     = 0.62 + t * 0.36;
    col[i*3 + 1] = 0.72 + t * 0.26;
    col[i*3 + 2] = 0.92 + t * 0.08;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const m = new THREE.PointsMaterial({
    size: 1.9,
    sizeAttenuation: false,
    vertexColors: true,
    transparent: true,
    opacity: 0.92,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  scene.add(new THREE.Points(g, m));
})();

/* 淡淡星云辉光 */
(function buildNebula(){
  const mk = (hex, size, x, y, z, op) => {
    const S = 256;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d');
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0.0, hex.replace('1)', '0.55)'));
    grd.addColorStop(0.5, hex.replace('1)', '0.14)'));
    grd.addColorStop(1.0, hex.replace('1)', '0)'));
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);

    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;

    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false,
      depthTest: false,
      opacity: op
    }));
    sp.scale.set(size, size, 1);
    sp.position.set(x, y, z);
    scene.add(sp);
  };

  mk('rgba(80,190,255,1)', 620, -420, -180, -600, 0.55);
  mk('rgba(190,110,255,1)', 520,  520,  140, -680, 0.40);
  mk('rgba(60,255,220,1)', 460,  180, -320, -520, 0.34);
})();

/* ============================================================
   3. 纹理生成
   ============================================================ */
function makeEarthTexture(){
  const W = 1024, H = 512;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');

  /* 海洋 */
  const oc = g.createLinearGradient(0, 0, 0, H);
  oc.addColorStop(0.00, '#07203c');
  oc.addColorStop(0.45, '#0b3f6e');
  oc.addColorStop(0.60, '#0d4d80');
  oc.addColorStop(1.00, '#07203c');
  g.fillStyle = oc;
  g.fillRect(0, 0, W, H);

  let s = 987654321;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };

  /* 大陆 */
  for (let i = 0; i < 46; i++){
    const cx = rnd() * W;
    const cy = H * 0.15 + rnd() * H * 0.7;
    const rx = 25 + rnd() * 105;
    const ry = 18 + rnd() * 65;

    g.save();
    g.translate(cx, cy);
    g.rotate(rnd() * Math.PI);
    g.beginPath();
    g.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);

    const green = 90 + rnd() * 70;
    g.fillStyle = `rgba(${30 + rnd()*50}, ${green + 30}, ${40 + rnd()*40}, ${0.72 + rnd()*0.22})`;
    g.fill();
    g.restore();
  }

  /* 沙漠 / 高原暖色斑块 */
  for (let i = 0; i < 22; i++){
    const cx = rnd() * W, cy = H * 0.2 + rnd() * H * 0.6;
    const r = 20 + rnd() * 55;
    const grd = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    grd.addColorStop(0, `rgba(190,155,90,${0.32 + rnd()*0.25})`);
    grd.addColorStop(1, 'rgba(190,155,90,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.fill();
  }

  /* 极冠 */
  const north = g.createLinearGradient(0, 0, 0, H * 0.13);
  north.addColorStop(0, 'rgba(235,248,255,0.92)');
  north.addColorStop(1, 'rgba(235,248,255,0)');
  g.fillStyle = north;
  g.fillRect(0, 0, W, H * 0.13);

  const south = g.createLinearGradient(0, H, 0, H * 0.87);
  south.addColorStop(0, 'rgba(235,248,255,0.92)');
  south.addColorStop(1, 'rgba(235,248,255,0)');
  g.fillStyle = south;
  g.fillRect(0, H * 0.87, W, H * 0.13);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makeMoonTexture(){
  const W = 1024, H = 512;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');

  g.fillStyle = '#a9a9b6';
  g.fillRect(0, 0, W, H);

  let s = 24681357;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };

  /* 斑驳 */
  for (let i = 0; i < 900; i++){
    const x = rnd() * W, y = rnd() * H;
    const r = 5 + rnd() * 58;
    const a = 0.015 + rnd() * 0.055;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    g.fillStyle = rnd() > 0.5
      ? `rgba(72,72,88,${a})`
      : `rgba(216,216,232,${a})`;
    g.fill();
  }

  /* 月海 */
  for (let i = 0; i < 15; i++){
    const x = rnd() * W;
    const y = H * 0.18 + rnd() * H * 0.64;
    const r = 45 + rnd() * 115;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(86,90,110,0.52)');
    grd.addColorStop(1, 'rgba(86,90,110,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }

  /* 环形山 */
  for (let i = 0; i < 300; i++){
    const x = rnd() * W, y = rnd() * H;
    const r = 1.6 + rnd() * 13;

    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2);
    g.fillStyle = 'rgba(58,60,76,0.32)'; g.fill();

    g.beginPath(); g.arc(x - r*0.14, y - r*0.14, r*0.76, 0, Math.PI*2);
    g.fillStyle = 'rgba(206,206,222,0.19)'; g.fill();

    g.beginPath(); g.arc(x + r*0.09, y + r*0.09, r*0.88, 0, Math.PI*2);
    g.fillStyle = 'rgba(48,50,64,0.14)'; g.fill();
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* ============================================================
   4. 光照
   ============================================================ */
const sunLight = new THREE.DirectionalLight(0xfff2d8, 3.3);
sunLight.position.copy(SUN_DIR).multiplyScalar(60);
scene.add(sunLight);
scene.add(sunLight.target);   // 默认目标在原点

/* 极弱环境光，让暗面保留一丝轮廓 */
scene.add(new THREE.AmbientLight(0x22334f, 0.55));

/* 补一盏极弱冷光，避免暗面全黑 */
const fill = new THREE.DirectionalLight(0x224466, 0.35);
fill.position.set(-0.5, 0.6, 1);
scene.add(fill);

/* ============================================================
   5. 地球
   ============================================================ */
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(R_EARTH, 64, 48),
  new THREE.MeshStandardMaterial({
    map: makeEarthTexture(),
    roughness: 0.86,
    metalness: 0.0,
    emissive: new THREE.Color(0x0a1e33),
    emissiveIntensity: 0.55
  })
);
scene.add(earth);

/* 大气辉光 */
const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(R_EARTH * 1.16, 48, 36),
  new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(0x4fc3ff) },
      uSun:   { value: SUN_DIR.clone() }
    },
    vertexShader: /* glsl */`
      varying vec3 vN;
      varying vec3 vP;
      void main(){
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vP = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uColor;
      uniform vec3 uSun;
      varying vec3 vN;
      varying vec3 vP;
      void main(){
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vP);
        float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        float sunAmt = max(dot(N, normalize(uSun)), 0.0);
        vec3 col = uColor * rim * (0.22 + 0.95 * sunAmt) * 1.7;
        gl_FragColor = vec4(col, rim * 0.9);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.FrontSide
  })
);
atmo.renderOrder = 3;
scene.add(atmo);

/* ============================================================
   6. 月球（含同步自转标记）
   ============================================================ */
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(R_MOON, 56, 40),
  new THREE.MeshStandardMaterial({
    map: makeMoonTexture(),
    roughness: 0.97,
    metalness: 0.0,
    emissive: new THREE.Color(0x1a2233),
    emissiveIntensity: 0.30
  })
);
scene.add(moon);

/* 近地面标记：始终朝向地球 */
const nearSideMark = new THREE.Mesh(
  new THREE.SphereGeometry(0.115, 14, 10),
  new THREE.MeshBasicMaterial({ color: 0x45f2ff })
);
nearSideMark.position.set(0, 0, R_MOON * 1.0);
moon.add(nearSideMark);

/* 标记辉光 */
(function(){
  const S = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grd.addColorStop(0.0, 'rgba(150,255,255,1)');
  grd.addColorStop(0.25, 'rgba(69,242,255,0.65)');
  grd.addColorStop(1.0, 'rgba(69,242,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;

  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    opacity: 0.85
  }));
  sp.scale.set(0.85, 0.85, 1);
  sp.position.set(0, 0, R_MOON * 1.0);
  moon.add(sp);
})();

/* ============================================================
   7. 月球轨道
   ============================================================ */
const orbitPts = [];
const SEGS = 320;
for (let i = 0; i <= SEGS; i++){
  const a = (i / SEGS) * Math.PI * 2;
  orbitPts.push(new THREE.Vector3(
    Math.cos(a) * R_ORBIT, 0, Math.sin(a) * R_ORBIT
  ));
}
const orbitRing = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(orbitPts),
  new THREE.LineBasicMaterial({
    color: 0x2f8fd0,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
scene.add(orbitRing);

/* 轨道内圈细光晕 */
const orbitGlow = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(orbitPts),
  new THREE.LineBasicMaterial({
    color: 0x7fe4ff,
    transparent: true,
    opacity: 0.16,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
orbitGlow.scale.set(1.004, 1, 1.004);
scene.add(orbitGlow);

/* ============================================================
   8. 后期辉光
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.72,   // strength
  0.62,   // radius
  0.55    // threshold
);
composer.addPass(bloom);

/* ============================================================
   9. 科技感背景音效
   ============================================================ */
let audioCtx = null;
let masterGain = null;
let audioOn = false;

function buildAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(audioCtx.destination);

  /* 主滤波器（缓慢扫频） */
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = 380;
  filt.Q.value = 1.6;
  filt.connect(masterGain);

  /* 低频和弦层 */
  const voices = [
    { f: 55.00,  type: 'sine',     g: 0.42, det: -5 },
    { f: 82.41,  type: 'sine',     g: 0.25, det:  4 },
    { f: 110.00, type: 'triangle', g: 0.14, det: -8 },
    { f: 164.81, type: 'sine',     g: 0.07, det:  6 }
  ];

  voices.forEach(v => {
    const o = audioCtx.createOscillator();
    o.type = v.type;
    o.frequency.value = v.f;
    o.detune.value = v.det;

    const g = audioCtx.createGain();
    g.gain.value = v.g;

    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.03 + Math.random() * 0.06;

    const lg = audioCtx.createGain();
    lg.gain.value = v.g * 0.45;
    lfo.connect(lg);
    lg.connect(g.gain);
    lfo.start();

    o.connect(g);
    g.connect(filt);
    o.start();
  });

  /* 滤波器扫频 */
  const sweep = audioCtx.createOscillator();
  sweep.type = 'sine';
  sweep.frequency.value = 0.04;

  const sweepGain = audioCtx.createGain();
  sweepGain.gain.value = 260;

  sweep.connect(sweepGain);
  sweepGain.connect(filt.frequency);
  sweep.start();

  /* 太空噪声层 */
  const bufLen = audioCtx.sampleRate * 4;
  const buffer = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for (let i = 0; i < bufLen; i++){
    const white = Math.random() * 2 - 1;
    last = (last + 0.018 * white) / 1.018;
    data[i] = last * 3.4;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  noise.loop = true;

  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 760;
  nf.Q.value = 0.7;

  const ng = audioCtx.createGain();
  ng.gain.value = 0.10;

  noise.connect(nf);
  nf.connect(ng);
  ng.connect(masterGain);
  noise.start();

  /* 微弱高频脉冲 */
  const pulseGain = audioCtx.createGain();
  pulseGain.gain.value = 0.0;
  pulseGain.connect(masterGain);

  const pulseOsc = audioCtx.createOscillator();
  pulseOsc.type = 'sine';
  pulseOsc.frequency.value = 1046.5;
  pulseOsc.connect(pulseGain);
  pulseOsc.start();

  const pulseLfo = audioCtx.createOscillator();
  pulseLfo.type = 'sine';
  pulseLfo.frequency.value = 0.16;

  const pulseDepth = audioCtx.createGain();
  pulseDepth.gain.value = 0.020;
  pulseLfo.connect(pulseDepth);
  pulseDepth.connect(pulseGain.gain);
  pulseLfo.start();
}

const audioBtn = document.getElementById('audioBtn');

audioBtn.addEventListener('click', () => {
  if (!audioCtx) buildAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  if (!audioOn){
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(0.15, audioCtx.currentTime, 1.2);
    audioBtn.textContent = '♪  关闭音效';
    audioBtn.classList.add('on');
    audioOn = true;
  } else {
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.6);
    audioBtn.textContent = '♪  开启音效';
    audioBtn.classList.remove('on');
    audioOn = false;
  }
});

/* ============================================================
   10. 画中画布局
   ============================================================ */
const pipBox = document.getElementById('pipBox');
let pipLeft = 0, pipBottom = 22, pipSize = 250;

function updatePipLayout(){
  const W = window.innerWidth;
  const H = window.innerHeight;

  pipSize = Math.round(Math.min(260, Math.max(140, Math.min(W, H) * 0.26)));

  const margin = 22;
  pipLeft   = W - pipSize - margin;
  pipBottom = margin;

  pipBox.style.left   = pipLeft + 'px';
  pipBox.style.top    = (H - pipSize - margin) + 'px';
  pipBox.style.width  = pipSize + 'px';
  pipBox.style.height = pipSize + 'px';

  /* 右下角提示面板挪到画中画上方 */
  const br = document.querySelector('.panel-br');
  if (br) br.style.bottom = (pipSize + margin + 14) + 'px';
}
updatePipLayout();

/* ============================================================
   11. HUD 元素
   ============================================================ */
const hudName  = document.getElementById('hudName');
const hudFrac  = document.getElementById('hudFrac');
const hudAngle = document.getElementById('hudAngle');

function phaseInfo(theta){
  const e = (1 - Math.cos(theta)) / 2;                 // 照亮比例 k
  let deg = (theta * 180 / Math.PI) % 360;
  if (deg < 0) deg += 360;

  let name;
  if (e < 0.02)                       name = '新月';
  else if (e > 0.98)                  name = '满月';
  else if (Math.abs(e - 0.5) < 0.02)  name = (deg < 180) ? '上弦月' : '下弦月';
  else if (e < 0.5)                   name = (deg < 180) ? '娥眉月' : '残月';
  else                                name = (deg < 180) ? '盈凸月' : '亏凸月';

  return { e, deg, name };
}

/* ============================================================
   12. 主循环
   ============================================================ */
const clock = new THREE.Clock();
let simTime = 0;

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  /* ---- 轨道角 ---- */
  const theta = (simTime / ORBIT_PERIOD) * Math.PI * 2;

  /* ---- 月球位置：沿轨道公转 ---- */
  moon.position.set(
    R_ORBIT * Math.cos(theta),
    0,
    R_ORBIT * Math.sin(theta)
  );

  /* ---- 同步自转：同一面永远朝向地球 ----
     让月球局部 +Z 轴指向地心方向 (-cosθ, 0, -sinθ) */
  moon.rotation.y = Math.atan2(-Math.cos(theta), -Math.sin(theta));

  /* ---- 地球缓慢自转（视觉） ---- */
  earth.rotation.y += dt * 0.18;

  /* ---- 画中画相机：位于地球中心看向月球 ---- */
  moonCam.position.set(0, 0, 0);
  moonCam.up.set(0, 1, 0);
  moonCam.lookAt(moon.position);

  /* ---- 更新 HUD ---- */
  const info = phaseInfo(theta);
  hudName.textContent  = info.name;
  hudFrac.textContent  = (info.e * 100).toFixed(1) + '%';
  hudAngle.textContent = info.deg.toFixed(1) + '°';

  /* ---- 控制器 ---- */
  controls.update();

  /* ============================================================
     渲染
     ============================================================ */
  const W = window.innerWidth;
  const H = window.innerHeight;

  /* 主视图 + 泛光 */
  renderer.setViewport(0, 0, W, H);
  renderer.setScissorTest(false);
  composer.render();

  /* 画中画（叠加在右下角） */
  renderer.setScissorTest(true);
  renderer.setViewport(pipLeft, pipBottom, pipSize, pipSize);
  renderer.setScissor(pipLeft, pipBottom, pipSize, pipSize);
  renderer.clear(true, true, false);
  renderer.render(scene, moonCam);

  /* 恢复状态 */
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, W, H);
}

renderer.setAnimationLoop(animate);

/* ============================================================
   13. 自适应
   ============================================================ */
window.addEventListener('resize', () => {
  const W = window.innerWidth;
  const H = window.innerHeight;

  camera.aspect = W / H;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H);

  composer.setSize(W, H);
  bloom.setSize(W, H);

  updatePipLayout();
});
</script>
