<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enneper极小曲面 · 闭合环线</title>
    <style>
        :root {
            --bg: #04040e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.05rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.11em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(190, 165, 140, 0.5), 0 0 6px rgba(170, 148, 125, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.68rem, 1.25vw, 0.82rem);
            font-weight: 300;
            letter-spacing: 0.07em;
            color: rgba(200, 192, 180, 0.7);
            margin-top: 0.25em;
            text-shadow: 0 0 13px rgba(155, 140, 120, 0.3);
        }
        #formula-overlay {
            bottom: clamp(16px, 4vh, 44px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.68rem, 1.25vw, 0.92rem);
            font-style: italic;
            letter-spacing: 0.04em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(155, 140, 125, 0.42), 0 0 5px rgba(165, 148, 130, 0.28);
            line-height: 1.55;
            background: rgba(10, 9, 16, 0.48);
            padding: 0.42em 1.3em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(145, 125, 105, 0.22);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.35em 0.85em;
                letter-spacing: 0.03em;
                font-size: 0.62rem;
            }
            #title-overlay .title {
                letter-spacing: 0.07em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">Enneper极小曲面 · 闭合环线</div>
        <div class="subtitle">Closed Loops on a Minimal Surface</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            X(r,θ) = ( u - u³/3 + u v² , v - v³/3 + v u² , u² - v² )
            &emsp;|&emsp; u=r cosθ , v=r sinθ , θ∈[0,2π]
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        const CURVE_SEGMENTS = 780;
        const TOTAL_VERTICES = CURVE_SEGMENTS + 1;

        // ==================== 三种颜色 ====================
        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');
        const THREE_COLORS = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x04040e, 0.00007);

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.35, 17);
        camera.position.set(0.45, 0.75, 4.0);
        camera.lookAt(0, -0.05, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 主旋转组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 200;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 2.2 + Math.random() * 3.6;
            starPosArr[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phi) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xbab2cc,
            size: 0.010,
            transparent: true,
            opacity: 0.32,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const starPts = new THREE.Points(starGeom, starMat);
        starsGroup.add(starPts);

        // 曲面附近光点
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 70;
        const glowArr = new Float32Array(glowCount * 3);
        for (let i = 0; i < glowCount; i++) {
            const rad = 0.25 + Math.random() * 1.25;
            const ang = Math.random() * Math.PI * 2;
            const u = rad * Math.cos(ang);
            const v = rad * Math.sin(ang);
            const x = u - u * u * u / 3 + u * v * v;
            const y = v - v * v * v / 3 + v * u * u;
            const z = u * u - v * v;
            glowArr[i * 3] = x + (Math.random() - 0.5) * 0.18;
            glowArr[i * 3 + 1] = y + (Math.random() - 0.5) * 0.18;
            glowArr[i * 3 + 2] = z + (Math.random() - 0.5) * 0.18;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e4cc,
            size: 0.022,
            transparent: true,
            opacity: 0.44,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const glowPts = new THREE.Points(glowGeom, glowMat);
        glowGroup.add(glowPts);

        // ==================== Enneper曲线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        // 18条曲线，r从0.28到1.38均匀分布，分三组颜色
        const totalCurves = 18;
        const rValues = [];
        for (let i = 0; i < totalCurves; i++) {
            const r = 0.28 + (i / (totalCurves - 1)) * (1.38 - 0.28);
            rValues.push(r);
        }

        rValues.forEach((r, idx) => {
            const color = THREE_COLORS[Math.floor(idx / (totalCurves / 3)) % 3];
            const positions = new Float32Array(TOTAL_VERTICES * 3);

            for (let i = 0; i <= CURVE_SEGMENTS; i++) {
                const theta = (i / CURVE_SEGMENTS) * Math.PI * 2;
                const cost = Math.cos(theta);
                const sint = Math.sin(theta);
                const u = r * cost;
                const v = r * sint;
                const u2 = u * u;
                const v2 = v * v;
                const u3 = u2 * u;
                const v3 = v2 * v;
                const x = u - u3 / 3 + u * v2;
                const y = v - v3 / 3 + v * u2;
                const z = u2 - v2;
                positions[i * 3] = x;
                positions[i * 3 + 1] = z; // 交换Y/Z使曲面竖直展示更美观
                positions[i * 3 + 2] = y;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setDrawRange(0, 0);

            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.83,
                depthWrite: false,
            });
            const line = new THREE.Line(geometry, material);
            allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
            curvesGroup.add(line);
        });

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        clock.getDelta(); // 初始消耗

        function getCycleTime() {
            const now = performance.now() / 1000;
            return (now - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            // 主旋转
            mainGroup.rotation.y += 0.23 * dt;
            mainGroup.rotation.x += 0.05 * dt;
            mainGroup.rotation.z += 0.012 * Math.sin(cycleTime * 0.58) * dt;

            // 相机微动
            const sway = 0.10 * Math.sin(cycleTime * (Math.PI * 2 / 36));
            camera.position.y = 0.75 + sway;
            camera.lookAt(0, -0.05, 0);

            // 绘制进度
            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            // 更新所有曲线绘制范围
            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            // 背景透明度渐变
            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.32 * bgOp;
            glowMat.opacity = 0.44 * bgOp;

            // 粒子微动
            glowGroup.rotation.y += dt * 0.04;
            glowGroup.rotation.x += dt * 0.025;
            starsGroup.rotation.y += dt * 0.03;
            starsGroup.rotation.x += dt * 0.02;

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 可选重置键
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        // 预热渲染，防止第一帧空白
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🔮 Enneper极小曲面·闭合环线动画已启动');
        console.log(`   - ${totalCurves} 条闭合环线，3种颜色各${totalCurves / 3}条`);
        console.log(`   - 采样点：${CURVE_SEGMENTS}，周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
