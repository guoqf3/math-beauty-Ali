<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玻尔兹曼熵 · 热力学蝾螈</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
  }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- 左侧 1/5 ：玻尔兹曼熵 ---------- */
  #panel {
    position: absolute; left: 0; top: 0;
    width: 20%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 3;
    border-right: 1px solid rgba(60, 150, 255, 0.10);
    background: radial-gradient(circle at 50% 50%,
                rgba(8, 26, 52, 0.55) 0%,
                rgba(0, 0, 0, 0) 72%);
  }
  .eqwrap { text-align: center; }

  .eq {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: clamp(17px, 2.6vw, 42px);
    color: #8fd8ff;
    letter-spacing: .02em;
    white-space: nowrap;
    text-shadow:
      0 0 10px rgba(70, 180, 255, 0.90),
      0 0 30px rgba(30, 120, 255, 0.50),
      0 0 60px rgba(20, 80, 220, 0.28);
    animation: breathe 5.5s ease-in-out infinite;
  }
  .eq i { font-style: italic; }
  .eq sub {
    font-size: .55em; font-style: normal;
    vertical-align: -0.28em; letter-spacing: 0;
    color: #cfeeff;
  }

  .en {
    margin-top: 1.0em;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(6px, 0.60vw, 11px);
    letter-spacing: .34em;
    color: rgba(120, 190, 255, 0.42);
    text-indent: .34em;
  }
  .cn {
    margin-top: 0.7em;
    font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    font-size: clamp(7px, 0.68vw, 12px);
    letter-spacing: .34em;
    color: rgba(255, 140, 60, 0.38);
    text-indent: .34em;
    animation: breathe 7s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: .72; }
    50%      { opacity: 1;   }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="panel">
  <div class="eqwrap">
    <div class="eq"><i>S</i> = <i>k</i><sub>B</sub> ln&thinsp;<i>&Omega;</i></div>
    <div class="en">BOLTZMANN ENTROPY</div>
    <div class="cn">熵 · 崩解 · 重组</div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   基础环境
   ========================================================= */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let RX = 0, RW = 0, OX = 0, OY = 0, SCALE = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  cv.width  = Math.max(1, Math.floor(W * DPR));
  cv.height = Math.max(1, Math.floor(H * DPR));
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';

  RX = W * 0.2;                 // 右侧区域起点
  RW = W - RX;                  // 右侧区域宽度
  OX = RX + RW * 0.5;           // 右侧中心
  OY = H * 0.5;
  SCALE = Math.min(RW * 0.78, H * 0.92);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();


/* =========================================================
   体形参数（全部在“单位空间”里，绘制时由 ctx.scale 放大）
   s : 0 = 吻端  →  1 = 尾尖
   ========================================================= */
const NB = 160;      // 体轴采样数
const NP = 1400;     // 粒子数
const LEN = 1.0;     // 单位空间体长

/* ---- 体轴中心线：游动波 ---- */
function spinePos(s, t) {
  const A1 = 0.058 * (0.30 + 0.95 * s * s);   // 摆幅向尾部增大
  const A2 = 0.032 * (0.40 + 0.80 * s);
  const a1 = s * 5.2 - t * 1.9;
  const a2 = s * 2.1 - t * 1.1 + 1.3;

  const x = (s - 0.5) * LEN;
  const y = A1 * Math.sin(a1) + A2 * Math.sin(a2);

  let tx = LEN;
  let ty = A1 * 5.2 * Math.cos(a1) + A2 * 2.1 * Math.cos(a2);
  const il = 1 / (Math.hypot(tx, ty) || 1);

  return { x, y, tx: tx * il, ty: ty * il };
}

/* ---- 半宽包络：头圆、颈收、躯干厚、尾渐尖 ---- */
function halfWidth(s) {
  const taper = Math.pow(Math.max(0.02, 1 - s * 0.96), 0.55);
  const head  = 1 + 0.85 * Math.exp(-Math.pow((s - 0.12) / 0.13, 2));
  const neck  = 1 - 0.22 * Math.exp(-Math.pow((s - 0.32) / 0.11, 2));
  const bulge = 1 + 0.16 * Math.exp(-Math.pow((s - 0.55) / 0.18, 2));
  return 0.036 * taper * head * neck * bulge;
}

/* ---- 热场：0 = 冷（稳固） 1 = 热（崩解） ---- */
function smoothstep(e0, e1, x) {
  const k = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
  return k * k * (3 - 2 * k);
}

function heatAt(s, v, t, ph) {
  const w = (
    Math.sin(s * 6.4 - t * 1.7 + ph) +
    Math.sin(s * 3.1 + v * 2.4 - t * 1.15 + ph * 1.7) +
    Math.sin(s * 1.7 - v * 1.4 + t * 0.8 + ph * 2.3)
  ) / 3;

  const g = 0.5 + 0.5 * Math.sin(t * 0.62 - 1.0);   // 全局热循环 0..1
  const val = 0.34 + 0.72 * w + 0.95 * (g - 0.5);

  return smoothstep(0.24, 0.88, val);
}

/* ---- 调色板：电光蓝 → 紫 → 品红 → 霓虹橙 → 红 ---- */
const PAL = [];
for (let i = 0; i < 32; i++) {
  const k = i / 31;
  const hue = (205 + 178 * k) % 360;      // 205 → 383(=23)
  const li  = 52 + 14 * k;
  PAL.push(`hsl(${hue | 0},100%,${li | 0}%)`);
}
function hueOf(k) {                        // 给 strokeStyle 用
  return (205 + 178 * k) % 360;
}


/* =========================================================
   粒子云：每个粒子拥有自己的 s / v 与相位
   ========================================================= */
const parts = [];
for (let i = 0; i < NP; i++) {
  parts.push({
    s   : Math.random(),
    v   : Math.random() * 2 - 1,
    ph  : Math.random() * TAU,
    spd : 0.5 + Math.random() * 1.5,
    rad : 0.25 + Math.random() * 0.9,
    size: 0.6 + Math.random() * 1.2
  });
}


/* =========================================================
   绘制：躯干骨架
   ========================================================= */
function drawBody(t) {
  /* --- 采样体轴 --- */
  const pts = [];
  let hSum = 0;
  for (let i = 0; i <= NB; i++) {
    const s  = i / NB;
    const sp = spinePos(s, t);
    const hw = halfWidth(s);
    const h  = heatAt(s, 0, t, 0);
    hSum += h;
    pts.push({
      s, x: sp.x, y: sp.y,
      nx: -sp.ty, ny: sp.tx,
      tx: sp.tx,  ty: sp.ty,
      hw, h
    });
  }
  const avgH = hSum / (NB + 1);
  const alive = 1 - 0.92 * avgH;

  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  /* --- 1. 密集肋纹（横向） --- */
  const NR = 78;
  for (let k = 0; k < NR; k++) {
    const p = pts[Math.round((k / (NR - 1)) * NB)];
    const a = (1 - p.h) * 0.075 * alive;
    if (a < 0.006) continue;

    const spread = 0.92;
    ctx.strokeStyle = `hsla(${hueOf(0.30 + 0.70 * p.h) | 0},100%,62%,${a})`;
    ctx.lineWidth = 0.0016 * (0.6 + 0.6 * Math.abs(Math.sin(k * 0.7 + t * 2.0)));
    ctx.beginPath();
    ctx.moveTo(p.x - p.nx * p.hw * spread, p.y - p.ny * p.hw * spread);
    ctx.lineTo(p.x + p.nx * p.hw * spread, p.y + p.ny * p.hw * spread);
    ctx.stroke();
  }

  /* --- 2. 纵向轮廓线（分段着色，热区自动断开） --- */
  const VS  = [-1, -0.72, -0.42, 0, 0.42, 0.72, 1];
  const SEG = 10;
  for (let vi = 0; vi < VS.length; vi++) {
    const v = VS[vi];
    const isAxis = (vi === 3);

    for (let i0 = 0; i0 < NB; i0 += SEG) {
      const i1 = Math.min(NB, i0 + SEG);

      let hs = 0;
      for (let i = i0; i <= i1; i++) hs += pts[i].h;
      hs /= (i1 - i0 + 1);

      const a = (1 - hs * 0.95) * (isAxis ? 0.30 : 0.11);
      if (a < 0.008) continue;

      ctx.strokeStyle = `hsla(${hueOf(0.28 + 0.72 * hs) | 0},100%,${isAxis ? 72 : 58}%,${a})`;
      ctx.lineWidth = isAxis ? 0.0042 : 0.0022;

      ctx.beginPath();
      for (let i = i0; i <= i1; i++) {
        const p = pts[i];
        const x = p.x + p.nx * p.hw * v;
        const y = p.y + p.ny * p.hw * v;
        if (i > i0) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  }

  /* --- 3. 尾鳍羽丝 --- */
  for (let k = 0; k < 46; k++) {
    const s = 0.66 + 0.34 * (k / 45);
    const p = pts[Math.round(s * NB)];
    const a = (1 - p.h) * 0.16 * alive;
    if (a < 0.008) continue;

    const side = (k % 2) ? 1 : -1;
    const len  = p.hw * (2.0 + 1.7 * Math.abs(Math.sin(s * 9 + t * 2.5)));

    const x1 = p.x + p.nx * p.hw * side;
    const y1 = p.y + p.ny * p.hw * side;
    const x2 = p.x + p.nx * (p.hw + len) * side + p.tx * len * 1.25;
    const y2 = p.y + p.ny * (p.hw + len) * side + p.ty * len * 1.25;

    ctx.strokeStyle = `hsla(${hueOf(0.28 + 0.72 * p.h) | 0},100%,60%,${a})`;
    ctx.lineWidth = 0.0013;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  /* --- 4. 四肢 --- */
  const limbs = [
    { s: 0.20, dir: -1 }, { s: 0.20, dir: 1 },
    { s: 0.63, dir: -1 }, { s: 0.63, dir: 1 }
  ];
  for (const L of limbs) {
    const p = pts[Math.round(L.s * NB)];
    const a = (1 - p.h) * 0.30 * alive;
    if (a < 0.01) continue;

    const len = p.hw * 2.9;
    const bx = p.x + p.nx * p.hw * L.dir * 0.80;
    const by = p.y + p.ny * p.hw * L.dir * 0.80;
    const ex = bx + p.nx * L.dir * len * 0.95 + p.tx * len * 0.80;
    const ey = by + p.ny * L.dir * len * 0.95 + p.ty * len * 0.80;
    const cx = bx + p.nx * L.dir * len * 0.60 + p.tx * len * 0.10;
    const cy = by + p.ny * L.dir * len * 0.60 + p.ty * len * 0.10;

    ctx.strokeStyle = `hsla(${hueOf(0.28 + 0.72 * p.h) | 0},100%,60%,${a})`;
    ctx.lineWidth = 0.0032;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(cx, cy, ex, ey);
    ctx.stroke();

    for (let f = -1; f <= 1; f++) {
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(
        ex + (p.nx * L.dir * 0.40 + p.tx * 0.45) * len * 0.55 + p.ty * f * len * 0.30,
        ey + (p.ny * L.dir * 0.40 + p.ty * 0.45) * len * 0.55 - p.tx * f * len * 0.30
      );
      ctx.stroke();
    }
  }

  /* --- 5. 头部高光 + 双眼 --- */
  const hp = pts[0];
  const ha = (1 - hp.h) * 0.55;
  if (ha > 0.01) {
    const g = ctx.createRadialGradient(hp.x, hp.y, 0, hp.x, hp.y, 0.075);
    g.addColorStop(0, `hsla(${hueOf(0.55) | 0},100%,66%,${0.30 * ha})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(hp.x, hp.y, 0.075, 0, TAU);
    ctx.fill();
  }

  const ep = pts[Math.round(0.06 * NB)];
  for (const sg of [-1, 1]) {
    const a = (1 - ep.h) * 0.75;
    if (a < 0.02) continue;
    ctx.fillStyle = `hsla(${hueOf(0.95) | 0},100%,70%,${a})`;
    ctx.beginPath();
    ctx.arc(
      ep.x + ep.nx * ep.hw * 0.44 * sg,
      ep.y + ep.ny * ep.hw * 0.44 * sg,
      0.0062, 0, TAU
    );
    ctx.fill();
  }
}


/* =========================================================
   绘制：崩解 / 重组粒子
   ========================================================= */
function drawParticles(t) {
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];

    const sp = spinePos(p.s, t);
    const hw = halfWidth(p.s);
    const nx = -sp.ty, ny = sp.tx;

    /* 稳定态位置：贴在躯体上 */
    const bx = sp.x + nx * p.v * hw;
    const by = sp.y + ny * p.v * hw;

    /* 该点的热度 */
    const h = heatAt(p.s, p.v, t, p.ph);

    /* 崩解偏移：沿法线向外 + 涡旋 */
    const amp = h * (0.032 + 0.078 * p.rad);
    const ang = p.ph + t * p.spd;
    const sg  = p.v >= 0 ? 1 : -1;

    let dx = nx * sg * 0.62 + Math.cos(ang) * 0.82;
    let dy = ny * sg * 0.62 + Math.sin(ang * 1.3) * 0.82;
    const dl = Math.hypot(dx, dy) || 1;
    dx = dx / dl * amp;
    dy = dy / dl * amp;

    const x = bx + dx;
    const y = by + dy;

    const alpha = 0.14 + 0.48 * h;
    const r = 0.0016 * p.size * (0.8 + 1.1 * h);

    ctx.globalAlpha = alpha;
    ctx.fillStyle = PAL[(h * 31) | 0];
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}


/* =========================================================
   主循环
   ========================================================= */
let T = 0;
let last = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  T += dt;

  /* --- 拖影衰减 --- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.fillRect(0, 0, W, H);

  /* --- 进入右侧 4/5 区域 --- */
  ctx.save();
  ctx.translate(OX, OY);
  ctx.rotate(Math.sin(T * 0.35) * 0.05);      // 整体轻微摆动
  ctx.scale(SCALE, SCALE);

  ctx.globalCompositeOperation = 'lighter';

  drawBody(T);
  drawParticles(T);

  ctx.restore();

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
