<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>黑洞吞噬 · 时空弯曲</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{
    display:block;position:fixed;inset:0;
    z-index:1;touch-action:none;cursor:crosshair;
  }

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:30px 38px;opacity:0;
    animation:fade 1.8s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(255,170,110,.36);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(20px,3vw,38px);
    font-weight:200;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(96deg,#ffb066 0%,#ff7a6a 34%,#c080ff 68%,#6ab8ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 30px rgba(255,150,90,.45));
  }
  #title .sub{
    font-size:10px;letter-spacing:.22em;line-height:1.9;
    color:rgba(200,180,220,.32);font-weight:300;
  }

  #stats{
    position:absolute;top:0;right:0;
    padding:30px 38px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.12em;line-height:2.0;
    color:rgba(190,180,240,.34);
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
  }
  #stats .k{color:rgba(210,190,255,.52);}
  #stats .v{color:rgba(255,215,150,.86);}
  #stats .warm{color:rgba(255,175,90,.92);}
  #stats .cool{color:rgba(130,205,255,.92);}
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(200,170,240,.26);margin-bottom:6px;
  }
  #audioDot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:rgba(200,180,255,.22);
    margin-left:6px;vertical-align:middle;
    transition:background .4s;
  }
  #audioDot.on{
    background:rgba(150,240,180,.9);
    box-shadow:0 0 8px rgba(150,240,180,.8);
  }

  #meter{
    position:absolute;bottom:0;left:0;
    padding:0 38px 26px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.12em;line-height:2.0;
    color:rgba(190,180,240,.32);
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  #meter .big{
    display:block;font-size:clamp(17px,2.1vw,24px);
    font-weight:200;letter-spacing:.22em;
    color:rgba(255,200,170,.88);
    margin-bottom:2px;transition:color .5s;
  }
  #meter .en{
    font-size:8.5px;letter-spacing:.38em;text-indent:.38em;
    color:rgba(210,190,240,.42);
  }

  #controls{
    position:absolute;bottom:0;right:0;
    padding:0 38px 26px;
    display:flex;flex-direction:column;gap:12px;
    align-items:flex-end;
    opacity:0;animation:fade 1.8s 1.6s ease forwards;
    pointer-events:auto;
  }
  .ctrl-row{
    display:flex;align-items:center;gap:10px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;
  }
  .ctrl-label{
    color:rgba(200,190,255,.58);
    min-width:74px;text-align:right;
  }
  .ctrl-val{
    color:rgba(255,215,150,.94);
    min-width:52px;text-align:right;
    font-weight:500;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:140px;height:3px;
    background:rgba(150,130,220,.18);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:13px;height:13px;border-radius:50%;
    background:rgba(235,220,255,.94);
    border:1px solid rgba(180,150,255,.85);
    box-shadow:0 0 12px rgba(160,120,255,.65);
    cursor:pointer;transition:transform .18s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25);}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;
    background:rgba(235,220,255,.94);
    border:1px solid rgba(180,150,255,.85);
    box-shadow:0 0 12px rgba(160,120,255,.65);
    cursor:pointer;
  }
  .btn-row{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;
  }
  .btn{
    font-family:inherit;
    font-size:9px;letter-spacing:.18em;text-indent:.18em;
    color:rgba(230,220,255,.86);
    background:rgba(30,20,55,.52);
    border:1px solid rgba(150,120,230,.26);
    border-radius:999px;
    padding:7px 14px;cursor:pointer;
    transition:.3s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .btn:hover{
    border-color:rgba(200,170,255,.88);
    box-shadow:0 0 20px rgba(150,120,255,.42);
    background:rgba(80,50,150,.26);
  }
  .btn:active{transform:translateY(1px);}

  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:16px;white-space:nowrap;
    font-size:9px;letter-spacing:.24em;
    color:rgba(200,180,240,.30);
    opacity:0;animation:fade 1.8s 1.8s ease forwards;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:760px){
    #title{padding:14px 16px;}
    #title .sub{font-size:8.5px;}
    #stats{padding:14px 16px;font-size:8px;}
    #meter{padding:0 16px 16px;font-size:8px;}
    #controls{padding:0 16px 16px;gap:8px;}
    .ctrl-label{min-width:56px;font-size:8px;}
    .ctrl-val{min-width:40px;font-size:8px;}
    input[type=range]{width:90px;}
    .btn{padding:5px 10px;font-size:8px;letter-spacing:.10em;}
    #hint{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">BLACK HOLE · SPACETIME CURVATURE</div>
    <h1>黑洞吞噬</h1>
    <div class="sub">
      广义相对论 · 时空弯曲可视化<br>
      拖动滑块调整质量 · 观察吸积盘演化
    </div>
  </div>

  <div id="stats">
    <span class="lab">BLACK HOLE METRICS</span>
    <div><span class="k">质量 M </span><span class="v" id="massVal">1.00 M☉</span></div>
    <div><span class="k">史瓦西半径 </span><span class="v" id="rsVal">—</span></div>
    <div><span class="k">吸积粒子 </span><span class="warm" id="diskVal">0</span></div>
    <div><span class="k">游离粒子 </span><span class="cool" id="freeVal">0</span></div>
    <div><span class="k">已吞噬 </span><span class="v" id="eatVal">0</span></div>
    <div style="margin-top:3px;"><span class="k">音频 </span><span class="v">轰鸣 + 扭曲</span><span id="audioDot"></span></div>
  </div>

  <div id="meter">
    <span class="big" id="stateBig">沉 默</span>
    <div class="en" id="stateEn">DORMANT</div>
  </div>

  <div id="controls">
    <div class="ctrl-row">
      <span class="ctrl-label">黑洞质量</span>
      <input type="range" id="mass" min="0.35" max="2.60" step="0.05" value="1.00">
      <span class="ctrl-val" id="massCtrl">1.00</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">时间流速</span>
      <input type="range" id="tspeed" min="0.20" max="3.00" step="0.05" value="1.00">
      <span class="ctrl-val" id="tsCtrl">1.00</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="btnFeed">投 喂 物 质</button>
      <button class="btn" id="btnReset">重 置</button>
    </div>
  </div>

  <div id="hint">拖动滑块 · 调整黑洞质量 · 点击画面投喂物质</div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   画布
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1, S = 0;
let bhX = 0, bhY = 0;

/* =========================================================
   黑洞参数
   ========================================================= */
const BH = {
  mass: 1.00,
  Rs: 40,           // 史瓦西半径（像素）
  GM: 2.0e6,        // 引力常数 × 质量
  spinPhase: 0,     // 自旋相位
  glow: 0           // 吞噬时闪光
};

const SOFT = 22;            // 引力软化，避免奇点
let timeSpeed = 1.0;
let eatenCount = 0;

/* =========================================================
   更新黑洞派生参数
   ========================================================= */
function updateBH(){
  const base = S / 800;
  BH.Rs = Math.max(18, 46 * base * BH.mass);
  BH.GM = 2.4e6 * base * base * base * BH.mass;
}

/* =========================================================
   粒子
   ========================================================= */
const DISK_COUNT = 420;
const FREE_COUNT = 90;

const diskParticles = [];
const freeParticles = [];

/* ---- 吸积盘粒子 ---- */
function makeDiskParticle(outermost){
  const rMin = BH.Rs * 1.45;
  const rMax = BH.Rs * 6.2;

  let r;
  if (outermost){
    r = rMax * (0.88 + Math.random() * 0.12);
  } else {
    const u = Math.random();
    r = rMin + (rMax - rMin) * Math.pow(u, 1.7);
  }

  return {
    r: r,
    a: Math.random() * TAU,
    drift: (1.5 + Math.random() * 5.5) * (1 + (rMax - r) / rMax * 2.2),
    size: 0.6 + Math.random() * 1.7,
    alpha: 0.34 + Math.random() * 0.52,
    spark: Math.random() * TAU,
    thick: (Math.random() - 0.5) * 0.34,
    life: 1
  };
}

/* ---- 游离粒子 ---- */
function makeFreeParticle(edge){
  const R = S * (0.62 + Math.random() * 0.42);
  const ang = Math.random() * TAU;

  let r, a;
  if (edge){
    r = R;
    a = ang;
  } else {
    r = R * (0.5 + Math.random() * 0.5);
    a = ang;
  }

  const x = bhX + Math.cos(a) * r;
  const y = bhY + Math.sin(a) * r;

  /* 切向速度，制造椭圆或螺旋轨道 */
  const vOrb = Math.sqrt(BH.GM / (r + SOFT));
  const factor = 0.55 + Math.random() * 0.75;
  const vt = vOrb * factor;

  /* 切向方向（逆时针） */
  const tx = -Math.sin(a);
  const ty = Math.cos(a);

  /* 加上一点径向分量 */
  const vr = (Math.random() - 0.5) * vOrb * 0.35;
  const rx = Math.cos(a);
  const ry = Math.sin(a);

  return {
    x: x, y: y,
    vx: tx * vt + rx * vr,
    vy: ty * vt + ry * vr,
    size: 0.8 + Math.random() * 1.9,
    alpha: 0.42 + Math.random() * 0.55,
    hue: 185 + Math.random() * 80,
    trail: [],
    maxTrail: 8 + Math.floor(Math.random() * 10)
  };
}

/* =========================================================
   初始化粒子系统
   ========================================================= */
function initParticles(){
  diskParticles.length = 0;
  freeParticles.length = 0;

  for (let i = 0; i < DISK_COUNT; i++){
    diskParticles.push(makeDiskParticle(false));
  }
  for (let i = 0; i < FREE_COUNT; i++){
    freeParticles.push(makeFreeParticle(false));
  }
}

/* =========================================================
   物理更新
   ========================================================= */
const DISK_TILT = 0.40;   // y 方向压缩系数（视觉倾斜）

function updateDisk(dt){
  const rMax = BH.Rs * 6.2;
  const rMin = BH.Rs * 1.42;

  for (let i = diskParticles.length - 1; i >= 0; i--){
    const p = diskParticles[i];

    /* 开普勒角速度 ω = sqrt(GM/r³) */
    const omega = Math.sqrt(BH.GM / Math.pow(p.r + SOFT, 1.5));
    p.a += omega * dt;

    /* 向内漂移 */
    p.r -= p.drift * dt * (0.6 + 3.2 * (rMax - p.r) / rMax);

    /* 落入视界 */
    if (p.r <= rMin * 0.94){
      eatenCount++;
      BH.glow = Math.min(1, BH.glow + 0.16);
      playSwallow(0.5 + Math.random() * 0.5);
      /* 在外缘重生 */
      diskParticles[i] = makeDiskParticle(true);
      continue;
    }

    p.spark += dt * (4 + Math.random() * 8);
  }
}

function updateFree(dt){
  for (let i = freeParticles.length - 1; i >= 0; i--){
    const p = freeParticles[i];

    /* 引力加速度 */
    const dx = bhX - p.x;
    const dy = bhY - p.y;
    const r2 = dx * dx + dy * dy;
    const r = Math.sqrt(r2) + 0.001;

    const invR3 = 1 / ((r2 + SOFT * SOFT) * r);
    const ax = BH.GM * dx * invR3;
    const ay = BH.GM * dy * invR3;

    p.vx += ax * dt;
    p.vy += ay * dt;

    /* 记录轨迹 */
    if (p.trail.length === 0 ||
        Math.hypot(p.x - p.trail[p.trail.length - 1].x,
                   p.y - p.trail[p.trail.length - 1].y) > 3){
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > p.maxTrail) p.trail.shift();
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    /* 落入视界 */
    if (r < BH.Rs * 0.96){
      eatenCount++;
      BH.glow = Math.min(1, BH.glow + 0.22);
      playSwallow(0.7 + Math.random() * 0.4);
      freeParticles[i] = makeFreeParticle(true);
      continue;
    }

    /* 太远则回收 */
    if (r > S * 1.65){
      freeParticles[i] = makeFreeParticle(true);
      continue;
    }
  }
}

/* =========================================================
   时空网格 —— 弯曲可视化
   ========================================================= */
function warp(x, y){
  const dx = bhX - x;
  const dy = bhY - y;
  const r = Math.sqrt(dx * dx + dy * dy) + 0.001;

  const pullK = 165 * BH.mass * (S / 800);
  const pullL = 175 * (S / 800);

  const f = pullK * Math.exp(-r / pullL);
  let t = f / r;
  if (t > 0.82) t = 0.82;

  return {
    x: x + dx * t,
    y: y + dy * t,
    r: r
  };
}

function drawWarpedGrid(t){
  const base = S / 800;
  const step = Math.max(48, Math.round(66 * base));

  ctx.lineWidth = 1;

  /* 竖线 */
  for (let x = 0; x <= W + step; x += step){
    ctx.beginPath();
    let started = false;

    for (let y = 0; y <= H + step; y += step * 0.6){
      const w = warp(x, y);

      /* 太靠近黑洞的区域直接跳过 */
      if (w.r < BH.Rs * 0.92){
        started = false;
        continue;
      }

      const alpha = Math.min(1, (w.r - BH.Rs * 0.9) / (BH.Rs * 1.4));
      if (alpha < 0.05){ started = false; continue; }

      if (!started){
        ctx.moveTo(w.x, w.y);
        started = true;
      } else {
        ctx.lineTo(w.x, w.y);
      }
    }

    ctx.strokeStyle = 'rgba(88, 130, 220, 0.115)';
    ctx.stroke();
  }

  /* 横线 */
  for (let y = 0; y <= H + step; y += step){
    ctx.beginPath();
    let started = false;

    for (let x = 0; x <= W + step; x += step * 0.6){
      const w = warp(x, y);

      if (w.r < BH.Rs * 0.92){
        started = false;
        continue;
      }

      const alpha = Math.min(1, (w.r - BH.Rs * 0.9) / (BH.Rs * 1.4));
      if (alpha < 0.05){ started = false; continue; }

      if (!started){
        ctx.moveTo(w.x, w.y);
        started = true;
      } else {
        ctx.lineTo(w.x, w.y);
      }
    }

    ctx.strokeStyle = 'rgba(88, 130, 220, 0.115)';
    ctx.stroke();
  }

  /* 近黑洞处的强调环 */
  const rings = [1.55, 2.10, 2.85, 3.80, 5.00];
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < rings.length; i++){
    const rr = BH.Rs * rings[i];
    ctx.beginPath();
    ctx.ellipse(
      bhX, bhY,
      rr, rr * DISK_TILT,
      0, 0, TAU
    );
    const a = 0.055 - i * 0.008;
    ctx.strokeStyle = 'rgba(120, 160, 255, ' + Math.max(0.008, a) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制吸积盘粒子
   ========================================================= */
function diskParticleScreen(p){
  const sx = bhX + Math.cos(p.a) * p.r;
  const sy = bhY + Math.sin(p.a) * p.r * DISK_TILT;
  return { x: sx, y: sy, sin: Math.sin(p.a) };
}

/* 多普勒增亮：朝"观察者左前方"运动的更亮 */
function dopplerFactor(sinA){
  /* 观察者视线方向：假设是从屏幕下方稍偏左看向黑洞 */
  const viewDir = -0.35;
  const cosA = Math.cos(0);

  /* 切向速度方向在屏幕上的投影近似取 -sin(a) */
  const beta = -Math.sin(0) * 0;  // 占位
  /* 简化：以角度 a 的切向方向与视线方向的点积作为多普勒因子 */
  const dot = -Math.sin(0);
  return 1;
}

/* 真实的简化多普勒：速度方向在屏幕上的投影 */
function doppler(p){
  /* 切向单位向量（俯视） */
  const tx = -Math.sin(p.a);
  const ty = Math.cos(p.a);

  /* 假设观察者视线方向为 (0, -1) —— 从下方观察 */
  /* 那么朝上运动的粒子靠近观察者 */
  const vRadial = tx * 0 + ty * (-1);

  /* 轨道速度 */
  const v = Math.sqrt(BH.GM / (p.r + SOFT));
  const beta = Math.min(0.65, v / (S * 3.2));

  /* 相对论多普勒因子 */
  const D = 1 / Math.max(0.25, (1 - beta * vRadial * 0.9));
  return Math.min(2.6, Math.max(0.35, D));
}

/* =========================================================
   颜色工具
   ========================================================= */
function diskColor(p, d){
  /* 温度由内向外降低 */
  const rMax = BH.Rs * 6.2;
  const u = Math.min(1, Math.max(0, (p.r - BH.Rs * 1.4) / (rMax - BH.Rs * 1.4)));

  /* 内：蓝白 → 中：橙黄 → 外：暗红 */
  let hue, sat, lig;

  if (u < 0.30){
    const k = u / 0.30;
    hue = 205 - k * 40;      // 205 → 165（青蓝 → 青绿）
    sat = 65 + k * 20;
    lig = 88 - k * 20;
  } else if (u < 0.62){
    const k = (u - 0.30) / 0.32;
    hue = 165 - k * 130;     // 165 → 35（青 → 橙金）
    sat = 85 + k * 15;
    lig = 68 - k * 8;
  } else {
    const k = (u - 0.62) / 0.38;
    hue = 35 - k * 30;       // 35 → 5（橙金 → 深红）
    sat = 88 - k * 22;
    lig = 60 - k * 26;
  }

  /* 多普勒调制：偏移色相 + 提升亮度 */
  const dShift = (d - 1) * 26;
  hue = ((hue + dShift) % 360 + 360) % 360;
  lig = Math.min(97, lig * (0.62 + 0.58 * d));
  sat = Math.min(100, sat * (0.86 + 0.24 * d));

  return { h: hue, s: sat, l: lig };
}

/* =========================================================
   渲染吸积盘
   ========================================================= */
function drawDisk(t){
  /* 按屏幕 y 排序，远侧先画 */
  const drawList = [];

  for (let i = 0; i < diskParticles.length; i++){
    const p = diskParticles[i];
    const s = diskParticleScreen(p);

    /* 跳过太靠近黑洞的（会被吞噬） */
    if (p.r < BH.Rs * 1.38) continue;

    drawList.push({ p: p, sx: s.x, sy: s.y, depth: s.sin });
  }

  drawList.sort(function(a, b){ return a.depth - b.depth; });

  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < drawList.length; i++){
    const item = drawList[i];
    const p = item.p;
    const d = doppler(p);
    const col = diskColor(p, d);

    /* 亮度 */
    const pulse = 0.82 + 0.18 * Math.sin(p.spark);
    const a = p.alpha * pulse * (0.40 + 0.62 * d);
    const size = p.size * (0.78 + 0.42 * d);

    /* 柔光 */
    const glowR = size * 5.5;
    const g = ctx.createRadialGradient(
      item.sx, item.sy, 0,
      item.sx, item.sy, glowR
    );
    g.addColorStop(0.00, 'hsla(' + col.h + ',' + col.s + '%,' + Math.min(99, col.l + 6) + '%,' + (a * 0.92) + ')');
    g.addColorStop(0.32, 'hsla(' + col.h + ',' + col.s + '%,' + col.l + '%,' + (a * 0.34) + ')');
    g.addColorStop(1.00, 'hsla(' + col.h + ',' + col.s + '%,' + col.l + '%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(item.sx, item.sy, glowR, 0, TAU);
    ctx.fill();

    /* 亮核 */
    ctx.fillStyle = 'hsla(' + col.h + ',' + Math.min(100, col.s + 8) + '%,' + Math.min(98, col.l + 12) + '%,' + Math.min(1, a * 1.5) + ')';
    ctx.beginPath();
    ctx.arc(item.sx, item.sy, size, 0, TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   渲染游离粒子
   ========================================================= */
function drawFree(behind){
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < freeParticles.length; i++){
    const p = freeParticles[i];

    const isBehind = p.y < bhY;
    if (isBehind !== behind) continue;

    /* 轨迹 */
    if (p.trail.length > 1){
      for (let k = 1; k < p.trail.length; k++){
        const u = k / p.trail.length;
        const a = u * u * 0.34;

        ctx.beginPath();
        ctx.moveTo(p.trail[k - 1].x, p.trail[k - 1].y);
        ctx.lineTo(p.trail[k].x, p.trail[k].y);
        ctx.strokeStyle = 'hsla(' + p.hue + ', 95%, 74%, ' + a + ')';
        ctx.lineWidth = u * 1.6 + 0.3;
        ctx.stroke();
      }
    }

    /* 光晕 */
    const glowR = p.size * 6.5;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
    g.addColorStop(0.00, 'hsla(' + p.hue + ', 100%, 90%, ' + (p.alpha * 0.85) + ')');
    g.addColorStop(0.30, 'hsla(' + p.hue + ', 100%, 74%, ' + (p.alpha * 0.32) + ')');
    g.addColorStop(1.00, 'hsla(' + p.hue + ', 100%, 62%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, glowR, 0, TAU);
    ctx.fill();

    /* 核心 */
    ctx.fillStyle = 'hsla(' + p.hue + ', 100%, 94%, ' + Math.min(1, p.alpha * 1.4) + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制黑洞本体
   ========================================================= */
function drawBlackHole(t){
  const Rs = BH.Rs;
  const glow = BH.glow;

  /* 光子环 —— 事件视界外侧极亮的细环 */
  ctx.globalCompositeOperation = 'lighter';

  const ringR = Rs * 1.22;
  const ringPulse = 1 + 0.030 * Math.sin(t * 2.6);

  /* 外发光 */
  const outerR = Rs * 4.2;
  const gOuter = ctx.createRadialGradient(bhX, bhY, Rs * 0.92, bhX, bhY, outerR);
  gOuter.addColorStop(0.00, 'rgba(255, 190, 120, ' + (0.42 + glow * 0.32) + ')');
  gOuter.addColorStop(0.14, 'rgba(255, 150, 80, ' + (0.20 + glow * 0.16) + ')');
  gOuter.addColorStop(0.42, 'rgba(200, 110, 200, 0.055)');
  gOuter.addColorStop(1.00, 'rgba(110, 80, 220, 0)');
  ctx.fillStyle = gOuter;
  ctx.beginPath();
  ctx.arc(bhX, bhY, outerR, 0, TAU);
  ctx.fill();

  /* 光子环 —— 明亮细线 */
  const ringW = Rs * 0.075;
  const gRing = ctx.createRadialGradient(
    bhX, bhY, ringR - ringW * 3,
    bhX, bhY, ringR + ringW * 3
  );
  gRing.addColorStop(0.00, 'rgba(255, 210, 160, 0)');
  gRing.addColorStop(0.42, 'rgba(255, 232, 190, ' + (0.62 + glow * 0.30) + ')');
  gRing.addColorStop(0.50, 'rgba(255, 248, 225, ' + (0.92 + glow * 0.08) + ')');
  gRing.addColorStop(0.58, 'rgba(255, 214, 168, ' + (0.56 + glow * 0.30) + ')');
  gRing.addColorStop(1.00, 'rgba(255, 180, 120, 0)');
  ctx.fillStyle = gRing;
  ctx.beginPath();
  ctx.arc(bhX, bhY, ringR + ringW * 3, 0, TAU);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';

  /* 事件视界 —— 纯黑圆盘 */
  ctx.beginPath();
  ctx.arc(bhX, bhY, Rs, 0, TAU);

  const gHole = ctx.createRadialGradient(
    bhX - Rs * 0.15, bhY - Rs * 0.15, 0,
    bhX, bhY, Rs
  );
  gHole.addColorStop(0.00, '#06060a');
  gHole.addColorStop(0.55, '#020204');
  gHole.addColorStop(1.00, '#000000');
  ctx.fillStyle = gHole;
  ctx.fill();

  /* 视界内缘极细的光晕边 */
  ctx.beginPath();
  ctx.arc(bhX, bhY, Rs, 0, TAU);
  ctx.strokeStyle = 'rgba(255, 200, 140, ' + (0.24 + glow * 0.30) + ')';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* 吞噬闪光 */
  if (glow > 0.02){
    ctx.globalCompositeOperation = 'lighter';
    const flashR = Rs * (2.2 + glow * 2.8);
    const gF = ctx.createRadialGradient(bhX, bhY, Rs * 0.9, bhX, bhY, flashR);
    gF.addColorStop(0.00, 'rgba(255, 235, 200, ' + (glow * 0.32) + ')');
    gF.addColorStop(0.45, 'rgba(255, 175, 110, ' + (glow * 0.10) + ')');
    gF.addColorStop(1.00, 'rgba(255, 130, 80, 0)');
    ctx.fillStyle = gF;
    ctx.beginPath();
    ctx.arc(bhX, bhY, flashR, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* =========================================================
   背景星空
   ========================================================= */
const stars = [];
function initStars(){
  stars.length = 0;
  const n = Math.min(320, Math.round(S * 0.55));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.15 + 0.18,
      ph: Math.random() * TAU,
      sp: 0.20 + Math.random() * 0.95,
      hue: 200 + Math.random() * 90
    });
  }
}

function drawStars(t){
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = 0.10 + 0.36 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));

    /* 靠近黑洞的星星被拉长并变暗（引力透镜的粗糙近似） */
    const sx = s.x * W;
    const sy = s.y * H;
    const dx = sx - bhX;
    const dy = sy - bhY;
    const r = Math.sqrt(dx * dx + dy * dy) + 0.001;

    const near = Math.min(1, BH.Rs * 3.2 / r);
    const stretch = 1 + near * 2.6;
    const dim = 1 - near * 0.72;

    if (dim < 0.06) continue;

    ctx.fillStyle = 'hsla(' + s.hue + ', 82%, 82%, ' + (a * dim) + ')';
    ctx.beginPath();
    ctx.ellipse(
      sx, sy,
      s.r * stretch, s.r * 0.85,
      Math.atan2(dy, dx), 0, TAU
    );
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let masterGain = null;
let rumbleGain = null;
let rumbleFilter = null;
let warpOsc = null;
let warpGain = null;
let warpFilter = null;
let audioReady = false;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  masterGain = ac.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(ac.destination);
  masterGain.gain.setTargetAtTime(0.58, ac.currentTime, 2.2);

  const kick = function(){
    setAudioDot(true);
    startRumble();
    startWarp();
  };

  if (ac.state === 'suspended'){
    ac.resume().then(kick).catch(function(){ audioReady = false; });
  } else {
    kick();
  }
}

/* ---- 低频轰鸣 ---- */
function startRumble(){
  const now = ac.currentTime;

  rumbleGain = ac.createGain();
  rumbleGain.gain.value = 0;
  rumbleGain.connect(masterGain);
  rumbleGain.gain.setTargetAtTime(0.052, now, 3.0);

  /* 三个低频正弦叠加，制造厚重轰鸣 */
  const freqs = [36, 48, 61];
  const gains = [1.0, 0.62, 0.34];

  for (let i = 0; i < freqs.length; i++){
    const osc = ac.createOscillator();
    osc.type = i === 0 ? 'sine' : 'triangle';
    osc.frequency.value = freqs[i];

    /* 轻微失谐，产生缓慢拍频 */
    const detune = ac.createOscillator();
    detune.frequency.value = 0.03 + i * 0.017;
    const dg = ac.createGain();
    dg.gain.value = 0.85;
    detune.connect(dg);
    dg.connect(osc.frequency);
    detune.start(now);

    const g = ac.createGain();
    g.gain.value = 0.14 * gains[i];

    /* 缓慢起伏 */
    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.047 + i * 0.019;
    const lg = ac.createGain();
    lg.gain.value = 0.06 * gains[i];
    lfo.connect(lg);
    lg.connect(g.gain);
    lfo.start(now);

    osc.connect(g);
    g.connect(rumbleGain);
    osc.start(now);
  }

  /* 低频噪声层 */
  const len = ac.sampleRate * 4;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.012 * w) / 1.012;
    d[i] = last * 4.5;
  }

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  rumbleFilter = ac.createBiquadFilter();
  rumbleFilter.type = 'lowpass';
  rumbleFilter.frequency.value = 180;
  rumbleFilter.Q.value = 1.4;

  const ng = ac.createGain();
  ng.gain.value = 0.32;

  src.connect(rumbleFilter);
  rumbleFilter.connect(ng);
  ng.connect(rumbleGain);
  src.start(now);
}

/* ---- 时间扭曲音：随黑洞质量改变音高 ---- */
function startWarp(){
  const now = ac.currentTime;

  warpOsc = ac.createOscillator();
  warpOsc.type = 'sawtooth';
  warpOsc.frequency.value = 138;

  warpFilter = ac.createBiquadFilter();
  warpFilter.type = 'lowpass';
  warpFilter.frequency.value = 720;
  warpFilter.Q.value = 5.5;

  warpGain = ac.createGain();
  warpGain.gain.value = 0;
  warpGain.gain.setTargetAtTime(0.011, now, 3.2);

  /* 轻微颤音 */
  const vib = ac.createOscillator();
  vib.frequency.value = 0.42;
  const vg = ac.createGain();
  vg.gain.value = 3.4;
  vib.connect(vg);
  vg.connect(warpOsc.frequency);
  vib.start(now);

  /* 缓慢的音高漂移 */
  const drift = ac.createOscillator();
  drift.frequency.value = 0.028;
  const drg = ac.createGain();
  drg.gain.value = 22;
  drift.connect(drg);
  drg.connect(warpOsc.frequency);
  drift.start(now);

  warpOsc.connect(warpFilter);
  warpFilter.connect(warpGain);
  warpGain.connect(masterGain);
  warpOsc.start(now);
}

/* ---- 吞噬音效 ---- */
function playSwallow(intensity){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 下扫的“噗”声 */
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(160 + Math.random() * 60, now);
  osc.frequency.exponentialRampToValueAtTime(38, now + 0.30);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.060 * intensity, now + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 0.40);

  osc.connect(g);
  g.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.44);

  /* 高频“吸收”嘶声 */
  const len = Math.ceil(ac.sampleRate * 0.12);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){
    const e = 1 - i / len;
    d[i] = (Math.random() * 2 - 1) * e * e;
  }

  const src = ac.createBufferSource();
  src.buffer = buf;

  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 2200;

  const g2 = ac.createGain();
  g2.gain.value = 0.028 * intensity;

  src.connect(hp);
  hp.connect(g2);
  g2.connect(masterGain);
  src.start(now);
}

/* ---- 动态调整音频参数 ---- */
let lastAudioMass = -1;
function updateAudio(){
  if (!audioReady || !ac || ac.state !== 'running') return;

  /* 质量变化时更新时间扭曲音的音高和滤波 */
  if (Math.abs(BH.mass - lastAudioMass) > 0.01){
    lastAudioMass = BH.mass;

    const now = ac.currentTime;
    if (warpOsc){
      /* 质量越大，音高越低 —— 时间越慢 */
      const f = 138 / Math.pow(BH.mass, 0.62);
      warpOsc.frequency.setTargetAtTime(f, now, 0.85);
    }
    if (warpFilter){
      const ff = 720 / Math.pow(BH.mass, 0.42);
      warpFilter.frequency.setTargetAtTime(ff, now, 0.85);
    }
    if (rumbleFilter){
      rumbleFilter.frequency.setTargetAtTime(180 + BH.mass * 60, now, 1.2);
    }
  }

  /* 吞噬闪光提升轰鸣 */
  if (rumbleGain && BH.glow > 0.05){
    const now = ac.currentTime;
    const target = 0.052 + BH.glow * 0.028;
    rumbleGain.gain.setTargetAtTime(target, now, 0.28);
  }
}

/* =========================================================
   布局
   ========================================================= */
function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.min(W, H);
  bhX = W * 0.5;
  bhY = H * 0.52;

  updateBH();
  initStars();
}
window.addEventListener('resize', function(){
  const oldMass = BH.mass;
  layout();
  BH.mass = oldMass;
  updateBH();
  initParticles();
});

/* =========================================================
   交互
   ========================================================= */
function eventPos(e){
  const rect = canvas.getBoundingClientRect();
  let cx0, cy0;
  if (e.touches && e.touches.length > 0){
    cx0 = e.touches[0].clientX;
    cy0 = e.touches[0].clientY;
  } else {
    cx0 = e.clientX;
    cy0 = e.clientY;
  }
  return { x: cx0 - rect.left, y: cy0 - rect.top };
}

/* 点击投喂一簇物质 */
function feedAt(x, y){
  const n = 16 + Math.floor(Math.random() * 14);
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU;
    const rr = Math.random() * 26;
    const px = x + Math.cos(a) * rr;
    const py = y + Math.sin(a) * rr;

    const dx = bhX - px;
    const dy = bhY - py;
    const r = Math.sqrt(dx * dx + dy * dy) + 0.001;

    /* 朝黑洞方向的初速度 + 切向分量 */
    const vOrb = Math.sqrt(BH.GM / (r + SOFT)) * (0.42 + Math.random() * 0.42);
    const tx = -dy / r;
    const ty = dx / r;

    freeParticles.push({
      x: px, y: py,
      vx: tx * vOrb + (dx / r) * vOrb * 0.28,
      vy: ty * vOrb + (dy / r) * vOrb * 0.28,
      size: 0.9 + Math.random() * 2.0,
      alpha: 0.55 + Math.random() * 0.42,
      hue: 185 + Math.random() * 85,
      trail: [],
      maxTrail: 8 + Math.floor(Math.random() * 10)
    });
  }

  /* 上限保护 */
  if (freeParticles.length > 400) freeParticles.splice(0, freeParticles.length - 400);

  /* 生成火花 */
  for (let i = 0; i < 10; i++){
    spawnSpark(x, y);
  }
}

canvas.addEventListener('pointerdown', function(e){
  try { initAudio(); } catch(err){}
  if (e.cancelable) e.preventDefault();

  const p = eventPos(e);
  feedAt(p.x, p.y);
});

/* =========================================================
   点击火花
   ========================================================= */
const sparks = [];
function spawnSpark(x, y){
  const a = Math.random() * TAU;
  const sp = 40 + Math.random() * 130;
  sparks.push({
    x: x, y: y,
    vx: Math.cos(a) * sp,
    vy: Math.sin(a) * sp,
    life: 1,
    decay: 1.9 + Math.random() * 1.9,
    size: 1.0 + Math.random() * 2.4,
    hue: 190 + Math.random() * 70
  });
}

function updateSparks(dt){
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= s.decay * dt;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }

    /* 朝黑洞轻微加速 */
    const dx = bhX - s.x;
    const dy = bhY - s.y;
    const r2 = dx * dx + dy * dy + 400;
    s.vx += dx / r2 * 9000 * dt;
    s.vy += dy / r2 * 9000 * dt;

    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.965;
    s.vy *= 0.965;
  }
}

function drawSparks(){
  if (sparks.length === 0) return;

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < sparks.length; i++){
    const s = sparks[i];
    const a = s.life * s.life * 0.82;
    const r = s.size * s.life;

    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4.5);
    g.addColorStop(0.00, 'hsla(' + s.hue + ', 100%, 92%, ' + a + ')');
    g.addColorStop(0.38, 'hsla(' + s.hue + ', 100%, 74%, ' + (a * 0.32) + ')');
    g.addColorStop(1.00, 'hsla(' + s.hue + ', 100%, 62%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

massSlider.addEventListener('input', function(e){

window.addEventListener('keydown', function(e){

    e.preventDefault();

    eatenCount = 0;
    sparks.length = 0;
    BH.glow = 0;
    initParticles();

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;
let hudTick = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;
  const simDt = dt * timeSpeed;

  /* 物理 */
  updateDisk(simDt);
  updateFree(simDt);
  updateSparks(dt);

  BH.glow *= Math.exp(-3.4 * dt);
  BH.spinPhase += dt * 0.35;

  /* 背景 */
  ctx.fillStyle = '#000104';
  ctx.fillRect(0, 0, W, H);

  /* 中心微弱紫光 */
  const bgG = ctx.createRadialGradient(
    bhX, bhY, 0,
    bhX, bhY, S * 0.95
  );
  bgG.addColorStop(0.00, 'rgba(40, 18, 72, 0.34)');
  bgG.addColorStop(0.34, 'rgba(20, 10, 42, 0.16)');
  bgG.addColorStop(0.72, 'rgba(8, 4, 20, 0.05)');
  bgG.addColorStop(1.00, 'rgba(0, 0, 2, 0)');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  drawStars(t);
  drawWarpedGrid(t);

  /* 先画远侧 */
  drawFree(true);
  drawDiskBack(t);

  drawBlackHole(t);

  /* 再画近侧 */
  drawDiskFront(t);
  drawFree(false);

  drawSparks();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    bhX, bhY, S * 0.28,
    bhX, bhY, Math.max(W, H) * 0.78
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(0,0,6,0.30)');
  vg.addColorStop(1.00, 'rgba(0,0,0,0.86)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* 音频动态 */
  updateAudio();

  /* HUD */
  updateHUD();
  hudTick++;
}

/* 把吸积盘分为前后两半绘制 */
let diskSorted = null;
function prepareDisk(){
  diskSorted = [];
  for (let i = 0; i < diskParticles.length; i++){
    const p = diskParticles[i];
    if (p.r < BH.Rs * 1.38) continue;
    const s = diskParticleScreen(p);
    diskSorted.push({
      p: p, sx: s.x, sy: s.y, depth: s.sin
    });
  }
  diskSorted.sort(function(a, b){ return a.depth - b.depth; });
}

function drawDiskBack(t){
  prepareDisk();

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < diskSorted.length; i++){
    const item = diskSorted[i];
    if (item.depth >= 0) break;   // sinθ >= 0 属于近侧
    paintDiskParticle(item);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawDiskFront(t){
  if (!diskSorted) return;

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < diskSorted.length; i++){
    const item = diskSorted[i];
    if (item.depth < 0) continue;
    paintDiskParticle(item);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function paintDiskParticle(item){
  const p = item.p;
  const d = doppler(p);
  const col = diskColor(p, d);

  const pulse = 0.82 + 0.18 * Math.sin(p.spark);
  const a = p.alpha * pulse * (0.40 + 0.62 * d);
  const size = p.size * (0.78 + 0.42 * d);

  const glowR = size * 5.5;
  const g = ctx.createRadialGradient(
    item.sx, item.sy, 0,
    item.sx, item.sy, glowR
  );
  g.addColorStop(0.00, 'hsla(' + col.h + ',' + col.s + '%,' + Math.min(99, col.l + 6) + '%,' + (a * 0.92) + ')');
  g.addColorStop(0.32, 'hsla(' + col.h + ',' + col.s + '%,' + col.l + '%,' + (a * 0.34) + ')');
  g.addColorStop(1.00, 'hsla(' + col.h + ',' + col.s + '%,' + col.l + '%,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(item.sx, item.sy, glowR, 0, TAU);
  ctx.fill();

  ctx.fillStyle = 'hsla(' + col.h + ',' + Math.min(100, col.s + 8) + '%,' + Math.min(98, col.l + 12) + '%,' + Math.min(1, a * 1.5) + ')';
  ctx.beginPath();
  ctx.arc(item.sx, item.sy, size, 0, TAU);
  ctx.fill();
}

/* =========================================================
   HUD
   ========================================================= */
function updateHUD(){
  if (hudTick % 6 !== 0) return;

  const mv = document.getElementById('massVal');
  const rv = document.getElementById('rsVal');
  const dv = document.getElementById('diskVal');
  const fv = document.getElementById('freeVal');
  const ev = document.getElementById('eatVal');

  if (mv) mv.textContent = BH.mass.toFixed(2) + ' M☉';
  if (rv) rv.textContent = Math.round(BH.Rs) + ' px';
  if (dv) dv.textContent = diskParticles.length;
  if (fv) fv.textContent = freeParticles.length;
  if (ev) ev.textContent = eatenCount;

  /* 状态文字 */
  const bigEl = document.getElementById('stateBig');
  const enEl = document.getElementById('stateEn');

  if (bigEl && enEl){
    let big = '沉 默', en = 'DORMANT', col = 'rgba(255, 200, 170, .88)';

    if (BH.glow > 0.42){
      big = '吞 噬'; en = 'DEVOURING'; col = 'rgba(255, 140, 100, .95)';
    } else if (BH.mass > 1.85){
      big = '暴 食'; en = 'RAMPANT'; col = 'rgba(255, 120, 150, .92)';
    } else if (BH.mass < 0.60){
      big = '衰 微'; en = 'DWINDLING'; col = 'rgba(160, 200, 255, .88)';
    } else if (freeParticles.length > 160){
      big = '活 跃'; en = 'ACTIVE'; col = 'rgba(210, 220, 255, .90)';
    } else {
      big = '吸 积'; en = 'ACCRETING'; col = 'rgba(255, 200, 170, .88)';
    }

    if (bigEl.textContent !== big){
      bigEl.textContent = big;
      enEl.textContent = en;
    }
    bigEl.style.color = col;
  }
}

/* =========================================================
   启动
   ========================================================= */
layout();
initParticles();
requestAnimationFrame(loop);

})();
</script>
