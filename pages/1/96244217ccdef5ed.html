<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>病毒传播 · 流行病模拟</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#04060d;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;position:fixed;inset:0;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:36px 44px;opacity:0;
    animation:fade 1.6s 0.2s ease forwards;
  }
  #title .en{
    font-size:9.5px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,180,230,.34);font-weight:300;margin-bottom:12px;
  }
  #title h1{
    font-size:clamp(20px,3vw,38px);
    font-weight:200;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(96deg,#ff7a5c 0%,#ffaa66 38%,#6ab8ff 74%,#5ee0c0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:12px;
    filter:drop-shadow(0 0 30px rgba(255,110,70,.38));
  }
  #title .sub{
    font-size:10.5px;letter-spacing:.22em;line-height:2.0;
    color:rgba(150,190,225,.30);font-weight:300;
  }

  #stats{
    position:absolute;top:0;right:0;
    padding:36px 44px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.13em;line-height:2.1;
    color:rgba(140,185,225,.30);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .k{color:rgba(180,195,255,.50);}
  #stats .v{color:rgba(255,215,150,.78);}
  #stats .lab{
    display:block;font-size:8px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(120,165,215,.24);margin-bottom:7px;
  }
  .dot-mini{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    vertical-align:middle;margin-right:5px;position:relative;top:-1px;
  }
  #audioDot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:rgba(200,180,255,.22);
    margin-left:6px;vertical-align:middle;
    transition:background .4s;
  }
  #audioDot.on{
    background:rgba(150,240,180,.9);
    box-shadow:0 0 8px rgba(150,240,180,.8);
  }

  #controls{
    position:absolute;bottom:0;right:0;
    padding:0 44px 30px;
    display:flex;gap:22px;align-items:flex-end;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
    pointer-events:auto;
  }
  .ctrl-group{
    display:flex;flex-direction:column;gap:7px;
    min-width:130px;
  }
  .ctrl-label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.14em;
    color:rgba(160,195,235,.55);
  }
  .ctrl-val{
    color:rgba(255,215,150,.92);
    font-size:11px;font-weight:500;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:3px;
    background:rgba(120,165,225,.18);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:13px;height:13px;border-radius:50%;
    background:rgba(200,225,255,.92);
    border:1px solid rgba(140,190,255,.85);
    box-shadow:0 0 10px rgba(120,180,255,.55);
    cursor:pointer;transition:transform .18s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25);}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;
    background:rgba(200,225,255,.92);
    border:1px solid rgba(140,190,255,.85);
    box-shadow:0 0 10px rgba(120,180,255,.55);
    cursor:pointer;
  }
  .btn{
    font-family:inherit;
    font-size:10px;letter-spacing:.22em;text-indent:.22em;
    color:rgba(220,230,255,.85);
    background:rgba(20,30,55,.48);
    border:1px solid rgba(120,155,230,.30);
    border-radius:999px;
    padding:9px 18px;cursor:pointer;
    transition:.3s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .btn:hover{
    border-color:rgba(180,220,255,.88);
    box-shadow:0 0 22px rgba(120,180,255,.38);
    background:rgba(60,95,165,.24);
    transform:translateY(-1px);
  }
  .btn:active{transform:translateY(0);}

  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:16px;white-space:nowrap;
    font-size:9px;letter-spacing:.26em;
    color:rgba(150,195,230,.28);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:900px){
    #title{padding:20px 20px;}
    #title .sub{font-size:9px;}
    #stats{padding:20px 20px;font-size:8.5px;}
    #controls{
      padding:0 20px 20px;
      gap:12px;
      left:0;right:0;
      justify-content:center;
      flex-wrap:wrap;
    }
    .ctrl-group{min-width:100px;}
    #hint{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">SIR MODEL · EPIDEMIC NETWORK</div>
    <h1>病毒传播</h1>
    <div class="sub">
      SIR 模型 · 节点网络 · 实时传播曲线<br>
      调整参数 · 观察疫情演化
    </div>
  </div>

  <div id="stats">
    <span class="lab">EPIDEMIC METRICS</span>
    <div><span class="k">时间 </span><span class="v" id="timeVal">0.0</span></div>
    <div><span class="k">平均度 ⟨k⟩ </span><span class="v" id="degVal">—</span></div>
    <div><span class="k">基本传染数 R₀ </span><span class="v" id="r0Val">—</span></div>
    <div>
      <span class="dot-mini" style="background:#4a80d0"></span><span class="k">S </span><span class="v" id="sVal">0</span>
      &nbsp;
      <span class="dot-mini" style="background:#ff6644"></span><span class="k">I </span><span class="v" id="iVal">0</span>
      &nbsp;
      <span class="dot-mini" style="background:#55b090"></span><span class="k">R </span><span class="v" id="rVal">0</span>
    </div>
    <div><span class="k">状态 </span><span class="v" id="phaseVal">初发</span></div>
    <div style="margin-top:4px;"><span class="k">音频 </span><span class="v">悬疑 + 监护仪</span><span id="audioDot"></span></div>
  </div>

  <div id="controls">
    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>感染率 β</span>
        <span class="ctrl-val" id="betaVal">0.12</span>
      </div>
      <input type="range" id="beta" min="0.01" max="0.40" step="0.01" value="0.12">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>恢复率 γ</span>
        <span class="ctrl-val" id="gammaVal">0.25</span>
      </div>
      <input type="range" id="gamma" min="0.05" max="1.00" step="0.01" value="0.25">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>传播速度</span>
        <span class="ctrl-val" id="speedVal">1.0×</span>
      </div>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
    </div>
    <button class="btn" id="pauseBtn">暂 停</button>
    <button class="btn" id="resetBtn">重 置</button>
  </div>

  <div id="hint">拖动滑块 · 调整参数 · 观察传播动态</div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   常量与状态
   ========================================================= */
const TAU = Math.PI * 2;
const NODE_COUNT = 170;
const WINDOW = 40;         // 传播曲线的时间窗口（秒）

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

let nodes = [];
let edges = [];
let adj = [];
let avgDegree = 0;

const counts = { S: 0, I: 0, R: 0 };
let time = 0;
let history = [];
let rings = [];
let running = true;
let accum = 0;
let lastT = 0;

const params = { beta: 0.12, gamma: 0.25, speed: 1.0 };

/* 屏幕坐标映射 */
let PAD_X = 48, PAD_TOP = 78, PAD_BOT = 84;

/* =========================================================
   画布
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (W < 900){
    PAD_X = 24; PAD_TOP = 60; PAD_BOT = 60;
  } else {
    PAD_X = 48; PAD_TOP = 78; PAD_BOT = 84;
  }

  updateNodePositions();
}
window.addEventListener('resize', resize);

/* =========================================================
   构建网络（抖动网格 + 随机几何图）
   ========================================================= */
function buildNetwork(){
  const g = Math.ceil(Math.sqrt(NODE_COUNT * 1.35));
  const cells = [];
  for (let i = 0; i < g; i++){
    for (let j = 0; j < g; j++) cells.push([i, j]);
  }
  /* 洗牌 */
  for (let i = cells.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = cells[i]; cells[i] = cells[j]; cells[j] = t;
  }

  nodes = [];
  const cw = 1 / g;
  for (let k = 0; k < NODE_COUNT; k++){
    const c = cells[k];
    nodes.push({
      x: (c[0] + 0.16 + Math.random() * 0.68) * cw,
      y: (c[1] + 0.16 + Math.random() * 0.68) * cw,
      state: 0,           // 0=S, 1=I, 2=R
      infAge: 0,
      pulse: Math.random() * TAU,
      flash: 0,
      px: 0, py: 0, r: 4
    });
  }

  /* 连边：随机几何图 */
  const R = 0.105;
  const R2 = R * R;
  edges = [];
  adj = nodes.map(function(){ return []; });

  for (let i = 0; i < nodes.length; i++){
    for (let j = i + 1; j < nodes.length; j++){
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      if (dx * dx + dy * dy < R2){
        edges.push([i, j]);
        adj[i].push(j);
        adj[j].push(i);
      }
    }
  }

  /* 平均度 */
  let sum = 0;
  for (let i = 0; i < adj.length; i++) sum += adj[i].length;
  avgDegree = sum / nodes.length;

  updateNodePositions();

  document.getElementById('degVal').textContent = avgDegree.toFixed(2);
}

function updateNodePositions(){
  const netW = Math.max(1, W - PAD_X * 2);
  const netH = Math.max(1, H - PAD_TOP - PAD_BOT);
  const minDim = Math.min(netW, netH);
  const r = Math.max(2.4, Math.min(6.5, minDim * 0.011));

  for (let i = 0; i < nodes.length; i++){
    const n = nodes[i];
    n.px = PAD_X + n.x * netW;
    n.py = PAD_TOP + n.y * netH;
    n.r = r;
  }
}

/* =========================================================
   模拟初始化
   ========================================================= */
function resetSim(){
  for (let i = 0; i < nodes.length; i++){
    nodes[i].state = 0;
    nodes[i].infAge = 0;
    nodes[i].flash = 0;
  }

  /* 随机播种 3 个感染节点，彼此间隔开 */
  const picked = [];
  let guard = 0;
  while (picked.length < 3 && guard < 500){
    guard++;
    const i = (Math.random() * nodes.length) | 0;
    let ok = true;
    for (let k = 0; k < picked.length; k++){
      const dx = nodes[i].px - nodes[picked[k]].px;
      const dy = nodes[i].py - nodes[picked[k]].py;
      if (Math.sqrt(dx * dx + dy * dy) < 160){ ok = false; break; }
    }
    if (ok) picked.push(i);
  }
  while (picked.length < 3){
    picked.push((Math.random() * nodes.length) | 0);
  }

  for (let k = 0; k < picked.length; k++){
    nodes[picked[k]].state = 1;
    nodes[picked[k]].flash = 1;
  }

  time = 0;
  history = [];
  rings = [];
  accum = 0;

  countStates();
  recordHistory();
}

function countStates(){
  let s = 0, i = 0, r = 0;
  for (let k = 0; k < nodes.length; k++){
    const st = nodes[k].state;
    if (st === 0) s++;
    else if (st === 1) i++;
    else r++;
  }
  counts.S = s;
  counts.I = i;
  counts.R = r;
}

function recordHistory(){
  history.push({ t: time, S: counts.S, I: counts.I, R: counts.R });
  if (history.length > 2400) history.shift();
}

/* =========================================================
   SIR 传播步进
   ========================================================= */
function simStep(dt){
  const beta  = params.beta;
  const gamma = params.gamma;

  /* 新感染 */
  for (let i = 0; i < nodes.length; i++){
    if (nodes[i].state !== 0) continue;

    let k = 0;
    const nb = adj[i];
    for (let m = 0; m < nb.length; m++){
      if (nodes[nb[m]].state === 1) k++;
    }
    if (k === 0) continue;

    const p = 1 - Math.exp(-beta * k * dt);
    if (Math.random() < p){
      nodes[i].state = 1;
      nodes[i].infAge = 0;
      nodes[i].flash = 1;
      rings.push({ x: nodes[i].px, y: nodes[i].py, r: nodes[i].r * 0.8, life: 1 });
    }
  }

  /* 恢复 */
  for (let i = 0; i < nodes.length; i++){
    if (nodes[i].state !== 1) continue;
    const p = 1 - Math.exp(-gamma * dt);
    if (Math.random() < p) nodes[i].state = 2;
  }

  time += dt;
  countStates();
}

/* =========================================================
   音频 —— 紧张悬疑 + 医疗监护仪滴答
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let beepTimer = null;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.60, ac.currentTime, 2.0);

  const kick = function(){
    setAudioDot(true);
    startDrone();
    scheduleBeep();
  };

  if (ac.state === 'suspended'){
    ac.resume().then(kick).catch(function(){ audioReady = false; });
  } else {
    kick();
  }
}

/* ---------- 悬疑持续音 ---------- */
function startDrone(){
  const now = ac.currentTime;

  /* 低音 A1 + 三全音 Eb2 —— 制造不安感 */
  const o1 = ac.createOscillator();
  o1.type = 'sawtooth';
  o1.frequency.value = 55;

  const lp1 = ac.createBiquadFilter();
  lp1.type = 'lowpass';
  lp1.frequency.value = 260;
  lp1.Q.value = 2.2;

  const g1 = ac.createGain();
  g1.gain.value = 0.055;

  o1.connect(lp1);
  lp1.connect(g1);
  g1.connect(master);
  o1.start(now);

  const o2 = ac.createOscillator();
  o2.type = 'sine';
  o2.frequency.value = 77.78;   // 三全音
  const g2 = ac.createGain();
  g2.gain.value = 0.020;
  o2.connect(g2);
  g2.connect(master);
  o2.start(now);

  /* 缓慢滤波扫动 */
  const lfo1 = ac.createOscillator();
  lfo1.frequency.value = 0.065;
  const lg1 = ac.createGain();
  lg1.gain.value = 140;
  lfo1.connect(lg1);
  lg1.connect(lp1.frequency);
  lfo1.start(now);

  /* 高频风噪层 */
  const len = ac.sampleRate * 3;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 900;
  bp.Q.value = 1.4;

  const ng = ac.createGain();
  ng.gain.value = 0.010;

  src.connect(bp);
  bp.connect(ng);
  ng.connect(master);
  src.start(now);

  const lfo2 = ac.createOscillator();
  lfo2.frequency.value = 0.10;
  const lg2 = ac.createGain();
  lg2.gain.value = 400;
  lfo2.connect(lg2);
  lg2.connect(bp.frequency);
  lfo2.start(now);
}

/* ---------- 医疗监护仪滴答 ---------- */
function playBeep(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 1020;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.042, now + 0.004);
  g.gain.setValueAtTime(0.042, now + 0.048);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 0.09);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.11);
}

function scheduleBeep(){
  if (beepTimer) clearTimeout(beepTimer);

  const total = Math.max(1, nodes.length);
  const infRatio = counts.I / total;

  /* 感染越多，滴答越快：2.0s → 0.35s */
  const delay = 2.0 - Math.min(1, infRatio * 2.2) * 1.65;

  beepTimer = setTimeout(function(){
    playBeep();
    scheduleBeep();
  }, delay * 1000);
}

/* =========================================================
   绘制
   ========================================================= */
const glowSprite = (function(){
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.00, 'rgba(255, 225, 190, 1)');
  grd.addColorStop(0.16, 'rgba(255, 145, 85, 0.82)');
  grd.addColorStop(0.42, 'rgba(255, 80, 40, 0.30)');
  grd.addColorStop(0.72, 'rgba(220, 50, 25, 0.07)');
  grd.addColorStop(1.00, 'rgba(200, 30, 15, 0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  return c;
})();

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawChart(){
  const cw = 320, chh = 148;
  const cx0 = 40;
  const cy0 = H - chh - 34;

  /* 面板 */
  ctx.fillStyle = 'rgba(6, 13, 26, 0.78)';
  roundRect(ctx, cx0, cy0, cw, chh, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 140, 210, 0.20)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 绘图区 */
  const pl = 32, pr = 14, pt = 22, pb = 20;
  const x0 = cx0 + pl;
  const y0 = cy0 + pt;
  const w  = cw - pl - pr;
  const h  = chh - pt - pb;

  /* 网格 */
  ctx.strokeStyle = 'rgba(90, 140, 210, 0.09)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++){
    const yy = y0 + h * i / 4;
    ctx.beginPath();
    ctx.moveTo(x0, yy);
    ctx.lineTo(x0 + w, yy);
    ctx.stroke();
  }
  for (let i = 0; i <= 4; i++){
    const xx = x0 + w * i / 4;
    ctx.beginPath();
    ctx.moveTo(xx, y0);
    ctx.lineTo(xx, y0 + h);
    ctx.stroke();
  }

  const total = Math.max(1, nodes.length);
  const tMax = Math.max(time, WINDOW);
  const tMin = tMax - WINDOW;

  /* 面积填充 */
  function fillArea(key, color){
    ctx.beginPath();
    ctx.moveTo(x0, y0 + h);
    let started = false;
    let lastX = x0;
    for (let i = 0; i < history.length; i++){
      const hh = history[i];
      if (hh.t < tMin) continue;
      const xx = x0 + ((hh.t - tMin) / WINDOW) * w;
      const yy = y0 + h - (hh[key] / total) * h;
      ctx.lineTo(xx, yy);
      started = true;
      lastX = xx;
    }
    if (!started) return;
    ctx.lineTo(lastX, y0 + h);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  fillArea('S', 'rgba(74, 128, 208, 0.12)');
  fillArea('I', 'rgba(255, 102, 68, 0.16)');
  fillArea('R', 'rgba(85, 176, 144, 0.12)');

  /* 曲线 */
  function line(key, color, lw){
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < history.length; i++){
      const hh = history[i];
      if (hh.t < tMin) continue;
      const xx = x0 + ((hh.t - tMin) / WINDOW) * w;
      const yy = y0 + h - (hh[key] / total) * h;
      if (!started){ ctx.moveTo(xx, yy); started = true; }
      else ctx.lineTo(xx, yy);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  line('S', '#4a80d0', 1.5);
  line('R', '#55b090', 1.5);
  line('I', '#ff6644', 2.0);

  /* 图例 */
  ctx.font = '9px ui-monospace, Menlo, Consolas, monospace';
  const legend = [
    { c: '#4a80d0', t: 'S' },
    { c: '#ff6644', t: 'I' },
    { c: '#55b090', t: 'R' }
  ];
  let lx = x0 + 2;
  for (let i = 0; i < legend.length; i++){
    ctx.fillStyle = legend[i].c;
    ctx.beginPath();
    ctx.arc(lx + 3, y0 + 5, 2.8, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(180, 205, 235, 0.62)';
    ctx.fillText(legend[i].t, lx + 9, y0 + 8);
    lx += 26;
  }
}

function render(t){
  /* 背景 */
  ctx.fillStyle = '#04060d';
  ctx.fillRect(0, 0, W, H);

  const bgG = ctx.createRadialGradient(
    W * 0.5, H * 0.42, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.82
  );
  bgG.addColorStop(0.00, 'rgba(18, 32, 62, 0.34)');
  bgG.addColorStop(0.50, 'rgba(8, 16, 34, 0.14)');
  bgG.addColorStop(1.00, 'rgba(2, 4, 10, 0)');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  /* ---- 边 ---- */
  ctx.beginPath();
  for (let i = 0; i < edges.length; i++){
    const a = nodes[edges[i][0]];
    const b = nodes[edges[i][1]];
    ctx.moveTo(a.px, a.py);
    ctx.lineTo(b.px, b.py);
  }
  ctx.strokeStyle = 'rgba(62, 100, 165, 0.10)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 有感染的边高亮 */
  ctx.beginPath();
  for (let i = 0; i < edges.length; i++){
    const a = nodes[edges[i][0]];
    const b = nodes[edges[i][1]];
    if (a.state === 1 || b.state === 1){
      ctx.moveTo(a.px, a.py);
      ctx.lineTo(b.px, b.py);
    }
  }
  ctx.strokeStyle = 'rgba(255, 110, 70, 0.26)';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  /* ---- 易感节点 ---- */
  ctx.beginPath();
  for (let i = 0; i < nodes.length; i++){
    const n = nodes[i];
    if (n.state !== 0) continue;
    ctx.moveTo(n.px + n.r, n.py);
    ctx.arc(n.px, n.py, n.r, 0, TAU);
  }
  ctx.fillStyle = 'rgba(72, 122, 195, 0.34)';
  ctx.fill();

  /* ---- 恢复节点 ---- */
  ctx.beginPath();
  for (let i = 0; i < nodes.length; i++){
    const n = nodes[i];
    if (n.state !== 2) continue;
    ctx.moveTo(n.px + n.r * 0.82, n.py);
    ctx.arc(n.px, n.py, n.r * 0.82, 0, TAU);
  }
  ctx.fillStyle = 'rgba(80, 150, 125, 0.28)';
  ctx.fill();

  /* ---- 感染节点光晕 ---- */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < nodes.length; i++){
    const n = nodes[i];
    if (n.state !== 1) continue;
    const pulse = 0.82 + 0.34 * Math.sin(t * 6.2 + n.pulse);
    const s = n.r * 7.2 * pulse;
    ctx.drawImage(glowSprite, n.px - s * 0.5, n.py - s * 0.5, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';

  /* ---- 感染节点本体 ---- */
  ctx.beginPath();
  for (let i = 0; i < nodes.length; i++){
    const n = nodes[i];
    if (n.state !== 1) continue;
    const pulse = 1 + 0.16 * Math.sin(t * 6.2 + n.pulse);
    const rr = n.r * 1.28 * pulse;
    ctx.moveTo(n.px + rr, n.py);
    ctx.arc(n.px, n.py, rr, 0, TAU);
  }
  ctx.fillStyle = '#ff5a3a';
  ctx.fill();

  /* ---- 扩散环 ---- */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < rings.length; i++){
    const r = rings[i];
    if (r.life <= 0) continue;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, TAU);
    ctx.strokeStyle = 'rgba(255, 130, 70, ' + (r.life * 0.48) + ')';
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* ---- 传播曲线 ---- */
  drawChart();

  /* ---- 暗角 ---- */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.30,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.74
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.60, 'rgba(2, 4, 10, 0.26)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.80)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   主循环
   ========================================================= */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.10) dt = 0.10;

  const t = now * 0.001;

  /* ---- 模拟推进 ---- */
  if (running){
    const simDt = dt * params.speed;
    const STEP = 0.08;
    accum += simDt;

    let guard = 0;
    while (accum >= STEP && guard < 14){
      simStep(STEP);
      accum -= STEP;
      guard++;
    }
    if (guard >= 14) accum = 0;

    recordHistory();
  }

  /* ---- 视觉更新 ---- */
  for (let i = 0; i < nodes.length; i++){
    const n = nodes[i];
    n.flash *= Math.exp(-4.2 * dt);
    if (n.state === 1) n.infAge += dt;
  }

  for (let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.r += dt * 88;
    r.life -= dt * 1.55;
    if (r.life <= 0) rings.splice(i, 1);
  }

  render(t);
  updateHUD();

  /* 监测仪滴答调速 */
  if (running && (Math.random() < 0.05)) {
    /* 偶尔重新计算一次节奏，避免每帧都调用 */
  }
}

/* =========================================================
   HUD
   ========================================================= */
let hudTick = 0;
function updateHUD(){
  hudTick++;
  if (hudTick % 5 !== 0) return;

  const tEl = document.getElementById('timeVal');
  if (tEl) tEl.textContent = time.toFixed(1);

  const sEl = document.getElementById('sVal');
  const iEl = document.getElementById('iVal');
  const rEl = document.getElementById('rVal');
  if (sEl) sEl.textContent = counts.S;
  if (iEl) iEl.textContent = counts.I;
  if (rEl) rEl.textContent = counts.R;

  const r0 = avgDegree > 0 ? (params.beta * avgDegree / Math.max(0.001, params.gamma)) : 0;
  const r0El = document.getElementById('r0Val');
  if (r0El) r0El.textContent = r0.toFixed(2);

  const phaseEl = document.getElementById('phaseVal');
  if (phaseEl){
    const total = nodes.length;
    const infRatio = counts.I / total;
    if (counts.I === 0 && counts.R === 0){
      phaseEl.textContent = '初发';
    } else if (counts.I === 0){
      phaseEl.textContent = '疫情结束';
    } else if (infRatio < 0.02){
      phaseEl.textContent = '零星';
    } else if (infRatio < 0.10){
      phaseEl.textContent = '扩散';
    } else if (infRatio < 0.25){
      phaseEl.textContent = '爆发';
    } else {
      phaseEl.textContent = '大流行';
    }
  }

  /* R0 提示颜色 */
  if (r0El){
    if (r0 < 1) r0El.style.color = 'rgba(120, 220, 180, 0.85)';
    else if (r0 < 2.5) r0El.style.color = 'rgba(255, 215, 150, 0.88)';
    else r0El.style.color = 'rgba(255, 120, 90, 0.92)';
  }
}

/* =========================================================
   交互
   ========================================================= */
document.getElementById('beta').addEventListener('input', function(e){
  params.beta = parseFloat(e.target.value);
  document.getElementById('betaVal').textContent = params.beta.toFixed(2);
});

document.getElementById('gamma').addEventListener('input', function(e){
  params.gamma = parseFloat(e.target.value);
  document.getElementById('gammaVal').textContent = params.gamma.toFixed(2);
});

document.getElementById('speed').addEventListener('input', function(e){
  params.speed = parseFloat(e.target.value);
  document.getElementById('speedVal').textContent = params.speed.toFixed(1) + '×';
});

const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  running = !running;
  pauseBtn.textContent = running ? '暂 停' : '继 续';
});

document.getElementById('resetBtn').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  resetSim();
});

/* 首次任意点击启动音频 */
window.addEventListener('pointerdown', initAudio);
window.addEventListener('keydown', function(e){
  if (e.key === ' '){
    e.preventDefault();
    initAudio();
    running = !running;
    pauseBtn.textContent = running ? '暂 停' : '继 续';
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    resetSim();
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
buildNetwork();
resetSim();
requestAnimationFrame(loop);

})();
</script>
