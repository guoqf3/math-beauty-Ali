<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>傅里叶级数波形叠加 · Fourier Series</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #03040a;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
    color: #bcd9ff;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #app { position: fixed; inset: 0; z-index: 1; }
  #app canvas { display: block; }

  .vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(20,80,160,0.10) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, transparent 22%, rgba(0,0,0,0.78) 100%);
  }

  .hud {
    position: fixed; top: 26px; left: 32px; z-index: 10;
    pointer-events: none; max-width: 620px;
  }
  .hud h1 {
    margin: 0; font-size: 23px; font-weight: 600;
    letter-spacing: 4px; color: #eaf7ff;
    text-shadow:
      0 0 16px rgba(90,200,255,0.95),
      0 0 46px rgba(40,120,255,0.6),
      0 0 90px rgba(120,60,255,0.35);
  }
  .hud .en {
    margin: 9px 0 0; font-size: 10px;
    letter-spacing: 3.6px; color: #4d9ed6; text-transform: uppercase;
  }
  .eq {
    margin-top: 18px; padding: 10px 16px;
    display: inline-block;
    font-size: 13.5px; line-height: 1.75;
    color: #9fe9ff;
    background: rgba(8, 22, 44, 0.42);
    border: 1px solid rgba(70, 170, 255, 0.20);
    border-left: 2px solid rgba(90, 220, 255, 0.8);
    border-radius: 4px;
    backdrop-filter: blur(8px);
    text-shadow: 0 0 14px rgba(80, 200, 255, 0.7);
    white-space: nowrap;
  }
  .eq.sub {
    margin-top: 8px; font-size: 12px;
    color: #7fe3d4;
    border-left-color: rgba(90, 255, 210, 0.75);
    border-color: rgba(60, 220, 190, 0.16);
    text-shadow: 0 0 14px rgba(90, 255, 210, 0.6);
  }

  .panel {
    position: fixed; right: 30px; bottom: 30px; z-index: 10;
    width: 304px; padding: 18px 20px 16px;
    background: rgba(7, 16, 33, 0.62);
    border: 1px solid rgba(70, 160, 255, 0.24);
    border-radius: 14px;
    backdrop-filter: blur(16px);
    box-shadow:
      0 0 46px rgba(0, 60, 140, 0.35),
      inset 0 0 34px rgba(20, 90, 180, 0.07);
  }
  .panel .head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; letter-spacing: 2px; color: #6fb6e8;
  }
  .panel .head .val {
    font-size: 20px; letter-spacing: 1px; color: #d8f6ff;
    text-shadow: 0 0 14px rgba(70, 220, 255, 0.9);
  }
  .panel .head .val small { font-size: 11px; color: #4d8fbf; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 3px;
    margin: 15px 0 16px;
    outline: none; cursor: pointer;
    background: linear-gradient(90deg, #16e0ff 0%, #6d7bff 45%, #c85cff 75%, #ff4fd8 100%);
    box-shadow: 0 0 14px rgba(60, 180, 255, 0.45);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #eafaff; border: 2px solid #1fd8ff;
    box-shadow: 0 0 12px #1fd8ff, 0 0 30px rgba(31, 216, 255, 0.75);
    cursor: pointer; transition: transform .15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.18); }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #eafaff; border: 2px solid #1fd8ff;
    box-shadow: 0 0 12px #1fd8ff; cursor: pointer;
  }

  .btns { display: flex; gap: 9px; }
  button {
    flex: 1; padding: 9px 0;
    font-family: inherit; font-size: 12px; letter-spacing: 1px;
    color: #9fdcff;
    background: rgba(20, 60, 110, 0.32);
    border: 1px solid rgba(80, 180, 255, 0.28);
    border-radius: 9px;
    cursor: pointer;
    transition: all .2s ease;
  }
  button:hover {
    background: rgba(30, 105, 185, 0.5);
    color: #eafaff;
    box-shadow: 0 0 18px rgba(60, 170, 255, 0.5);
  }
  button:active { transform: scale(0.96); }
  button.active {
    background: rgba(0, 205, 255, 0.22);
    color: #eafaff;
    border-color: #35d5ff;
    box-shadow: 0 0 20px rgba(53, 213, 255, 0.6), inset 0 0 14px rgba(53, 213, 255, 0.2);
  }

  .tip {
    margin-top: 13px; font-size: 10px; line-height: 1.6;
    letter-spacing: 0.6px; color: #3f7398;
  }

  .chips {
    position: fixed; left: 32px; bottom: 30px; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 5px;
    max-width: 400px;
  }
  .chip {
    font-size: 9.5px; letter-spacing: 0.5px;
    padding: 3px 7px; border-radius: 4px;
    border: 1px solid rgba(90, 170, 255, 0.18);
    background: rgba(10, 26, 50, 0.42);
    color: #4f83ad;
    transition: all .25s ease;
  }
  .chip.on {
    color: #d6f6ff;
    border-color: rgba(120, 220, 255, 0.55);
    background: rgba(20, 70, 130, 0.42);
    box-shadow: 0 0 12px rgba(60, 190, 255, 0.35);
  }

  #fallback {
    position: fixed; inset: 0; z-index: 99;
    display: none; place-items: center;
    background: #03040a; color: #7fb8e6; font-size: 13px;
    line-height: 2; text-align: center; padding: 40px;
  }

  @media (max-width: 760px) {
    .hud { top: 14px; left: 14px; }
    .hud h1 { font-size: 15px; letter-spacing: 2px; }
    .hud .en { font-size: 8px; letter-spacing: 2px; }
    .eq { font-size: 10.5px; padding: 7px 10px; }
    .panel { right: 12px; bottom: 12px; width: 240px; padding: 14px; }
    .chips { display: none; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="vignette"></div>

<div class="hud">
  <h1>傅里叶级数波形叠加</h1>
  <p class="en">Fourier Series · Wave Superposition</p>
  <div class="eq">f(x) = a₀/2 + Σ<sub>n=1</sub><sup>∞</sup> [ aₙcos(nωx) + bₙsin(nωx) ]</div>
  <div class="eq sub">S<sub>N</sub>(x,t) = Σ<sub>n=1</sub><sup>N</sup> Aₙ · sin(nωx − ωt)</div>
</div>

<div class="chips" id="chips"></div>

<div class="panel">
  <div class="head">
    <span>谐波层数 N</span>
    <span class="val"><span id="count">07</span><small> / 12</small></span>
  </div>
  <input type="range" id="slider" min="1" max="12" step="1" value="7" />
  <div class="btns">
    <button id="minus">− 移除</button>
    <button id="plus">＋ 叠加</button>
    <button id="audio">◉ 音效</button>
  </div>
  <div class="tip">拖拽旋转 · 滚轮缩放 · 拖动滑块观察逐层逼近</div>
</div>

<div id="fallback">
  Three.js 未能加载。<br>
  请检查网络连接（本页需要访问 cdn.jsdelivr.net）。
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script>
  // 若 4 秒内模块未启动，显示提示
  window.__booted = false;
  setTimeout(function () {
    if (!window.__booted) document.getElementById('fallback').style.display = 'grid';
  }, 4000);
</script>

<script type="module">
import * as THREE from 'three';
window.__booted = true;

/* ============================================================
   0. 参数
   ============================================================ */
const WIDTH      = 19;                       // 波形 X 方向总长
const SEG_X      = 260;                      // X 方向分段
const RIBBON_Z   = 0.55;                     // 每条波带的 Z 向宽度
const MAX_N      = 12;                       // 最大谐波数
const BASE_K     = (Math.PI * 2) / WIDTH;    // 基波波数
const OMEGA      = 1.35;                     // 时间角频率
const GAP_Z      = 0.78;                     // 层间距
const HALF_W     = WIDTH / 2;
const AMP        = n => 2.3 / Math.pow(n, 0.82);

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x03040a, 1);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  48,
  window.innerWidth / window.innerHeight,
  0.1,
  600
);

/* ============================================================
   2. 自制轨道控制（不依赖 addons，稳定可靠）
   ============================================================ */
const orbit = {
  yaw:    0.62,      // 水平角
  pitch:  1.06,      // 极角
  dist:   27,
  tYaw:   0.62,
  tPitch: 1.06,
  tDist:  27,
  auto:   true,
  idle:   0
};

const el = renderer.domElement;
let dragging = false, lastX = 0, lastY = 0;

el.style.touchAction = 'none';

el.addEventListener('pointerdown', e => {
  dragging = true;
  orbit.auto = false;
  orbit.idle = 0;
  lastX = e.clientX;
  lastY = e.clientY;
  el.setPointerCapture(e.pointerId);
});

el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;

  orbit.tYaw   -= dx * 0.0062;
  orbit.tPitch -= dy * 0.0052;
  orbit.tPitch = Math.max(0.16, Math.min(Math.PI * 0.86, orbit.tPitch));
  orbit.idle = 0;
});

function endDrag(e) {
  dragging = false;
  orbit.idle = 0;
  try { el.releasePointerCapture(e.pointerId); } catch (_) {}
}
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);
el.addEventListener('pointerleave', () => { dragging = false; });

el.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.tDist *= (1 + Math.sign(e.deltaY) * 0.09);
  orbit.tDist = Math.max(12, Math.min(70, orbit.tDist));
  orbit.idle = 0;
}, { passive: false });

/* ============================================================
   3. 背景：星域 + 网格
   ============================================================ */
(function buildStars() {
  const COUNT = 1400;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  const c = new THREE.Color();

  for (let i = 0; i < COUNT; i++) {
    const r  = 55 + Math.random() * 130;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.8;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);

    c.setHSL(0.52 + Math.random() * 0.26, 0.9, 0.42 + Math.random() * 0.42);
    col[i * 3]     = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const stars = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.7,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  }));
  stars.name = 'stars';
  scene.add(stars);
})();

(function buildGrid() {
  const grid = new THREE.GridHelper(110, 110, 0x1b4c8c, 0x0a1930);
  grid.position.y = -7.5;
  grid.material.transparent = true;
  grid.material.opacity = 0.30;
  grid.material.depthWrite = false;
  scene.add(grid);
})();

/* ============================================================
   4. 几何构造
   ============================================================ */
function buildRibbon(segX, width, zWidth) {
  const rows = 2;
  const cols = segX + 1;
  const positions = new Float32Array(cols * rows * 3);
  const colors    = new Float32Array(cols * rows * 3);

  for (let i = 0; i < cols; i++) {
    const x = -width / 2 + width * i / segX;
    for (let j = 0; j < rows; j++) {
      const z = -zWidth / 2 + zWidth * j / (rows - 1);
      const o = (i * rows + j) * 3;
      positions[o]     = x;
      positions[o + 1] = 0;
      positions[o + 2] = z;
    }
  }

  const indices = [];
  for (let i = 0; i < segX; i++) {
    for (let j = 0; j < rows - 1; j++) {
      const a = i * rows + j;
      const b = a + 1;
      const c = (i + 1) * rows + j;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  geo.setIndex(indices);
  return geo;
}

function paintRibbon(geo, segX, hueBase, hueSpan, bright) {
  const rows = 2;
  const cols = segX + 1;
  const col = geo.attributes.color.array;
  const c = new THREE.Color();

  for (let i = 0; i < cols; i++) {
    const u = i / segX;
    const hue = hueBase + hueSpan * u;
    const bell = Math.pow(Math.sin(u * Math.PI), 0.4);   // 两端柔化
    const light = bright * (0.45 + 0.55 * bell);
    c.setHSL((hue + 1) % 1, 1.0, Math.min(light, 0.95));

    for (let j = 0; j < rows; j++) {
      const o = (i * rows + j) * 3;
      col[o]     = c.r;
      col[o + 1] = c.g;
      col[o + 2] = c.b;
    }
  }
  geo.attributes.color.needsUpdate = true;
}

/* ============================================================
   5. 谐波层
   ============================================================ */
const layers = [];
const layerGroup = new THREE.Group();
scene.add(layerGroup);

const zStart = -((MAX_N - 1) * GAP_Z) / 2;

for (let n = 1; n <= MAX_N; n++) {
  const geo = buildRibbon(SEG_X, WIDTH, RIBBON_Z);

  // 色相：青 → 蓝 → 紫 → 品红
  const hue = 0.52 + (n - 1) / (MAX_N - 1) * 0.40;
  paintRibbon(geo, SEG_X, hue, 0.06, 0.62);

  const mat = new THREE.MeshBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, 0, zStart + (n - 1) * GAP_Z);
  mesh.frustumCulled = false;
  layerGroup.add(mesh);

  layers.push({
    n,
    amp: AMP(n),
    k:   BASE_K * n,
    show: 0,
    geo,
    mat,
    mesh,
    positions: geo.attributes.position.array
  });
}

/* ============================================================
   6. 合成波（所有谐波之和）
   ============================================================ */
const sumGeo = buildRibbon(SEG_X, WIDTH, 0.30);
paintRibbon(sumGeo, SEG_X, 0.10, 0.04, 0.85);   // 暖金色

const sumMat = new THREE.MeshBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true
});

const sumMesh = new THREE.Mesh(sumGeo, sumMat);
sumMesh.position.set(0, 0, zStart + (MAX_N - 1) * GAP_Z + 1.55);
sumMesh.frustumCulled = false;
scene.add(sumMesh);

const sumPositions = sumGeo.attributes.position.array;

/* ============================================================
   7. UI
   ============================================================ */
let harmonicCount = 7;

const slider  = document.getElementById('slider');
const countEl = document.getElementById('count');
const chipBox = document.getElementById('chips');
const btnPlus = document.getElementById('plus');
const btnMinus = document.getElementById('minus');
const btnAudio = document.getElementById('audio');

const chips = [];
for (let n = 1; n <= MAX_N; n++) {
  const d = document.createElement('div');
  d.className = 'chip';
  d.textContent = 'n=' + n;
  chipBox.appendChild(d);
  chips.push(d);
}

function setCount(v) {
  harmonicCount = Math.max(1, Math.min(MAX_N, v | 0));
  slider.value = harmonicCount;
  countEl.textContent = String(harmonicCount).padStart(2, '0');
  chips.forEach((c, i) => c.classList.toggle('on', i < harmonicCount));
  updateAudio();
}

slider.addEventListener('input', e => setCount(+e.target.value));
btnPlus.addEventListener('click',  () => setCount(harmonicCount + 1));
btnMinus.addEventListener('click', () => setCount(harmonicCount - 1));
setCount(harmonicCount);

/* ============================================================
   8. 音效（Web Audio 实时合成）
   ============================================================ */
let audioCtx = null;
let masterGain = null;
let harmGains = [];
let audioOn = false;

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 2400;
  filter.Q.value = 0.6;

  const delay = audioCtx.createDelay(2.0);
  delay.delayTime.value = 0.36;
  const fb  = audioCtx.createGain(); fb.gain.value  = 0.36;
  const wet = audioCtx.createGain(); wet.gain.value = 0.30;

  masterGain.connect(filter);
  filter.connect(audioCtx.destination);
  filter.connect(delay);
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(wet);
  wet.connect(audioCtx.destination);

  const base = 55;
  for (let n = 1; n <= MAX_N; n++) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = base * n;
    osc.detune.value = (Math.random() - 0.5) * 8;

    const g = audioCtx.createGain();
    g.gain.value = 0;

    osc.connect(g);
    g.connect(masterGain);
    osc.start();
    harmGains.push(g);
  }
  updateAudio();
}

function updateAudio() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  for (let n = 1; n <= MAX_N; n++) {
    const g = harmGains[n - 1];
    if (!g) continue;
    const target = (n <= harmonicCount) ? 0.12 / Math.pow(n, 1.12) : 0.0;
    g.gain.setTargetAtTime(target, now, 0.16);
  }
}

btnAudio.addEventListener('click', () => {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  audioOn = !audioOn;
  const now = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setTargetAtTime(audioOn ? 0.55 : 0.0, now, 0.3);
  btnAudio.classList.toggle('active', audioOn);
});

/* ============================================================
   9. 动画主循环
   ============================================================ */
let elapsed = 0;
let lastTime = performance.now();

function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (dt <= 0) return;
  elapsed += dt;
  const t = elapsed;

  /* ---- 轨道相机 ---- */
  orbit.idle += dt;
  if (!dragging && orbit.idle > 2.2) {
    orbit.tYaw += dt * 0.13;          // 空闲自动旋转
  }

  const lerp = 1 - Math.exp(-dt * 6.5);
  orbit.yaw   += (orbit.tYaw   - orbit.yaw)   * lerp;
  orbit.pitch += (orbit.tPitch - orbit.pitch) * lerp;
  orbit.dist  += (orbit.tDist  - orbit.dist)  * lerp;

  const sp = Math.sin(orbit.pitch);
  camera.position.set(
    orbit.dist * sp * Math.sin(orbit.yaw),
    orbit.dist * Math.cos(orbit.pitch),
    orbit.dist * sp * Math.cos(orbit.yaw)
  );
  camera.lookAt(0, 0, 0);

  /* ---- 星域缓慢自转 ---- */
  const stars = scene.getObjectByName('stars');
  if (stars) stars.rotation.y += dt * 0.013;

  /* ---- 各谐波层 ---- */
  for (let li = 0; li < layers.length; li++) {
    const L = layers[li];
    const target = (L.n <= harmonicCount) ? 1 : 0;

    L.show += (target - L.show) * (1 - Math.exp(-dt * 5.5));
    const s = L.show;

    if (s < 0.012) {
      L.mesh.visible = false;
      continue;
    }
    L.mesh.visible = true;

    // 出现动画：从扁平「长」成波形
    L.mesh.scale.y = 0.05 + 0.95 * s;
    L.mesh.scale.z = 0.6  + 0.4  * s;
    L.mat.opacity  = 0.52 * s;

    // 轻微呼吸浮动
    L.mesh.position.y = Math.sin(t * 0.75 + L.n * 0.85) * 0.09 * s;

    // —— 更新波形顶点 ——
    const arr = L.positions;
    const k   = L.k;
    const A   = L.amp;
    const ph  = -t * OMEGA;

    for (let i = 0; i <= SEG_X; i++) {
      const x = -HALF_W + WIDTH * i / SEG_X;
      const y = A * Math.sin(k * x + ph);
      const o = i * 6;          // rows = 2 → 每列 2 顶点 × 3 分量
      arr[o + 1] = y;
      arr[o + 4] = y;
    }
    L.geo.attributes.position.needsUpdate = true;
  }

  /* ---- 合成波 ---- */
  {
    const N = harmonicCount;
    const arr = sumPositions;
    const ph = -t * OMEGA;

    for (let i = 0; i <= SEG_X; i++) {
      const x = -HALF_W + WIDTH * i / SEG_X;
      let y = 0;
      for (let n = 1; n <= N; n++) {
        y += AMP(n) * Math.sin(BASE_K * n * x + ph);
      }
      const o = i * 6;
      arr[o + 1] = y;
      arr[o + 4] = y;
    }
    sumGeo.attributes.position.needsUpdate = true;

    // 脉动光晕
    sumMat.opacity = 0.78 + 0.20 * Math.sin(t * 2.6);
    sumMesh.scale.z = 0.85 + 0.15 * Math.sin(t * 1.7);
  }

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);

/* ============================================================
   10. 自适应
   ============================================================ */
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
