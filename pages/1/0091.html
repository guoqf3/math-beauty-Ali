<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贝塞尔函数空间编织 · Bessel振荡曲线簇</title>
    <style>
        :root {
            --bg: #02010d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: clamp(16px, 3.5vh, 42px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #title-overlay h1 {
            color: #e1d0b5;
            font-size: clamp(1.2rem, 2.3vw, 1.9rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 28px rgba(215, 180, 130, 0.55), 0 0 75px rgba(190, 150, 100, 0.25);
            margin: 0;
        }
        #title-overlay .subtitle {
            color: #bda78c;
            font-size: clamp(0.68rem, 1.15vw, 0.92rem);
            letter-spacing: 0.06em;
            margin-top: 0.28em;
            text-shadow: 0 0 14px rgba(180, 140, 100, 0.4);
        }

        #formula-overlay {
            position: fixed;
            bottom: clamp(24px, 4.5vh, 54px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(15, 11, 20, 0.72);
            border: 1px solid rgba(170, 145, 115, 0.28);
            border-radius: 12px;
            padding: clamp(10px, 1.4vh, 16px) clamp(16px, 3vw, 28px);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        #formula-overlay .formula-main {
            color: #f2dec5;
            font-size: clamp(0.73rem, 1.25vw, 1.05rem);
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a6947c;
            font-size: clamp(0.56rem, 0.82vw, 0.74rem);
            letter-spacing: 0.03em;
            margin-top: 0.22em;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.05em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>贝塞尔函数空间编织</h1>
        <div class="subtitle">Bessel Function Space Weave · Oscillatory Whorls</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                J<sub>n</sub>(x) = Σ (−1)<sup>k</sup>(x/2)<sup>n+2k</sup>/(k!·(n+k)!)<br>
                r(θ) = R₀ + A·J<sub>n</sub>(ωθ)
            </div>
            <div class="formula-detail">
                x = r·cos θ y = r·sin θ z = B·sin(νθ+δ) | n∈{0…5} | 18 curves
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02010d');
        scene.fog = new THREE.Fog('#02010d', 6.5, 21);

        const camera = new THREE.PerspectiveCamera(
            46,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            27
        );
        camera.position.set(0, 0.35, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight('#1e1e3a', 0.4));

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const totalPoints = 2000;
        const allLines = [];
        const curveCount = 18;

        const globalScale = 0.68;
        const R0 = 1.55;
        const ampA = 0.48;
        const zAmplitude = 0.45;

        // ==================== 贝塞尔函数计算（级数展开） ====================
        /**
         * 计算第一类贝塞尔函数 J_n(x)
         * 使用级数展开：J_n(x) = Σ (-1)^k (x/2)^(n+2k) / (k! · (n+k)!)
         */
        function besselJ(n, x) {
            if (x < 0) {
                return (n % 2 === 0 ? 1 : -1) * besselJ(n, -x);
            }
            if (x === 0) {
                return n === 0 ? 1 : 0;
            }

            const absX = Math.abs(x);
            const halfX = absX / 2;
            const maxTerms = 60;
            let sum = 0;
            let term = Math.pow(halfX, n);

            // 计算 1/(n!)
            let factN = 1;
            for (let i = 2; i <= n; i++) factN *= i;
            term /= factN;

            sum = term;

            for (let k = 1; k < maxTerms; k++) {
                term *= -halfX * halfX / (k * (n + k));
                sum += term;
                if (Math.abs(term) < 1e-14 && k > Math.max(10, n + 5)) break;
            }

            return sum;
        }

        // 预先计算贝塞尔函数值表，加速后续查询
        function buildBesselTable(n, xMax, tableSize) {
            const table = new Float64Array(tableSize);
            for (let i = 0; i < tableSize; i++) {
                const x = (i / (tableSize - 1)) * xMax;
                table[i] = besselJ(n, x);
            }
            return table;
        }

        // 参数范围
        const thetaMax = Math.PI * 7;
        const omegaRange = [0.45, 0.55, 0.65, 0.75, 0.85, 0.95];
        // 为每个n值预计算贝塞尔表 (xMax = omegaMax * thetaMax ≈ 0.95 * 7π ≈ 20.9)
        const tableSize = 3000;
        const xMaxTable = 1.0 * thetaMax;
        const besselTables = [];
        for (let n = 0; n <= 5; n++) {
            besselTables.push(buildBesselTable(n, xMaxTable, tableSize));
        }

        function getBesselFast(n, x) {
            if (x < 0) {
                return (n % 2 === 0 ? 1 : -1) * getBesselFast(n, -x);
            }
            if (x >= xMaxTable) return besselJ(n, x);
            const idx = (x / xMaxTable) * (tableSize - 1);
            const i0 = Math.floor(idx);
            const frac = idx - i0;
            if (i0 >= tableSize - 1) return besselTables[n][tableSize - 1];
            return besselTables[n][i0] + (besselTables[n][i0 + 1] - besselTables[n][i0]) * frac;
        }

        /**
         * 生成贝塞尔调制空间曲线
         * @param {number} n 贝塞尔函数阶数
         * @param {number} omega 角频率缩放
         * @param {number} nu z轴调制频率
         * @param {number} phase z轴调制相位
         * @param {THREE.Euler} rotation 空间旋转
         */
        function createBesselCurve(n, omega, nu, phase, rotation) {
            const rotMatrix = new THREE.Matrix4().makeRotationFromEuler(rotation);
            const vertices = new Float32Array(totalPoints * 3);

            for (let i = 0; i < totalPoints; i++) {
                const theta = (i / (totalPoints - 1)) * thetaMax;
                const jVal = getBesselFast(n, omega * theta);
                const r = R0 + ampA * jVal;
                const x2d = r * Math.cos(theta);
                const y2d = r * Math.sin(theta);
                const z2d = zAmplitude * Math.sin(nu * theta + phase);

                const vec = new THREE.Vector3(x2d, y2d, z2d);
                vec.applyMatrix4(rotMatrix);
                vec.multiplyScalar(globalScale);

                vertices[i * 3] = vec.x;
                vertices[i * 3 + 1] = vec.y;
                vertices[i * 3 + 2] = vec.z;
            }
            return vertices;
        }

        function createLine(vertices, hue, opacity = 0.78) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0);

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(hue, 0.92, 0.64),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: true,
                depthTest: true,
            });

            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // ==================== 生成18条贝塞尔曲线 ====================
        for (let j = 0; j < curveCount; j++) {
            const n = j % 6;                          // 阶数 0~5
            const omega = omegaRange[n];               // 使用对应阶数的频率
            const nu = 3 + (j % 5);                    // z调制频率 3~7
            const phase = j * 0.5;                     // 相位偏移
            const rotY = (j / curveCount) * Math.PI * 2;
            const rotX = (j * 0.62) % Math.PI;
            const rotation = new THREE.Euler(rotX, rotY, 0);

            const vertices = createBesselCurve(n, omega, nu, phase, rotation);
            const hue = (j / curveCount) * 0.85;
            const line = createLine(vertices, hue, 0.75);
            mainGroup.add(line);
            allLines.push(line);
        }

        console.log(`✅ 已生成 ${curveCount} 条贝塞尔函数曲线`);

        // ==================== 动画状态机 ====================
        const APPEAR_TIME = 5.0;
        const PAUSE_TIME = 1.5;
        const DISAPPEAR_TIME = 5.0;
        const CYCLE_TOTAL = APPEAR_TIME + PAUSE_TIME + DISAPPEAR_TIME;

        let animationStartTime = null;
        let firstFrameDone = false;

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInCubic(t) { return t * t * t; }

        function getProgress(elapsedSeconds) {
            const cycle = elapsedSeconds % CYCLE_TOTAL;
            if (cycle < APPEAR_TIME) {
                const t = cycle / APPEAR_TIME;
                return { progress: easeOutCubic(t), phase: 'appear' };
            } else if (cycle < APPEAR_TIME + PAUSE_TIME) {
                return { progress: 1.0, phase: 'pause' };
            } else {
                const t = (cycle - APPEAR_TIME - PAUSE_TIME) / DISAPPEAR_TIME;
                return { progress: 1.0 - easeInCubic(t), phase: 'disappear' };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            if (animationStartTime === null) {
                animationStartTime = timestamp;
                allLines.forEach(line => {
                    line.visible = false;
                    if (line.geometry) line.geometry.setDrawRange(0, 0);
                });
                renderer.render(scene, camera);
                firstFrameDone = true;
                return;
            }

            const elapsed = (timestamp - animationStartTime) / 1000;
            const { progress } = getProgress(elapsed);
            const drawCount = Math.floor(progress * totalPoints);
            const shouldBeVisible = drawCount >= 2;

            for (let i = 0; i < allLines.length; i++) {
                const line = allLines[i];
                if (!line || !line.geometry) continue;
                const maxPts = line.geometry.attributes.position.count;
                const lineDraw = Math.min(drawCount, maxPts);
                if (shouldBeVisible && lineDraw >= 2) {
                    line.visible = true;
                    line.geometry.setDrawRange(0, lineDraw);
                } else {
                    line.visible = false;
                    line.geometry.setDrawRange(0, 0);
                }
            }

            const rotY = elapsed * 0.065;
            const rotX = Math.sin(elapsed * 0.14) * 0.04;
            const rotZ = Math.cos(elapsed * 0.19) * 0.035;
            mainGroup.rotation.set(rotX, rotY, rotZ);

            camera.position.x = Math.sin(elapsed * 0.13) * 0.2;
            camera.position.y = 0.35 + Math.cos(elapsed * 0.17) * 0.16;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (h <= 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 贝塞尔函数空间编织动画启动');
        console.log(`   - 曲线数量: ${curveCount}`);
        console.log(`   - 采样点/曲线: ${totalPoints}`);
        console.log(`   - 贝塞尔阶数: 0~5`);
        console.log(`   - 动画周期: ${CYCLE_TOTAL}s (生长${APPEAR_TIME}s + 停顿${PAUSE_TIME}s + 消散${DISAPPEAR_TIME}s)`);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
