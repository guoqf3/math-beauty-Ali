<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量子水母 · Quantum Jellyfish</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#03060d;
    color:#cfe8ff;
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Courier New",monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100vh;height:100dvh;}

  /* ---------- 左侧面板 ---------- */
  .panel{
    width:370px;flex:0 0 370px;
    padding:30px 26px 24px;
    border-right:1px solid rgba(90,200,255,.14);
    background:
      radial-gradient(120% 70% at 0% 0%, rgba(30,90,170,.18), transparent 60%),
      linear-gradient(180deg,#050c18,#02060d);
    display:flex;flex-direction:column;gap:20px;
    overflow-y:auto;
  }
  .panel::-webkit-scrollbar{width:6px;}
  .panel::-webkit-scrollbar-thumb{background:rgba(90,200,255,.25);border-radius:3px;}

  .title{font-size:22px;letter-spacing:.14em;color:#bfeaff;
    text-shadow:0 0 18px rgba(80,190,255,.75),0 0 42px rgba(80,190,255,.35);}
  .subtitle{font-size:10.5px;letter-spacing:.42em;color:#4c86b8;margin-top:6px;text-transform:uppercase;}

  .card{
    border:1px solid rgba(90,200,255,.18);
    border-radius:12px;
    padding:16px 16px 14px;
    background:linear-gradient(180deg,rgba(22,66,120,.18),rgba(10,26,48,.12));
    box-shadow:inset 0 1px 0 rgba(140,220,255,.08), 0 0 26px rgba(30,110,200,.10);
  }
  .card h3{
    font-size:10px;letter-spacing:.28em;color:#5f9dcc;font-weight:400;
    text-transform:uppercase;margin-bottom:12px;
  }

  .eq{
    font-size:14.5px;line-height:2.05;color:#9fdcff;
    white-space:nowrap;overflow-x:auto;
    text-shadow:0 0 14px rgba(90,200,255,.55);
  }
  .eq + .eq{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(90,200,255,.12);}
  .eq .v{color:#7ef0ff;font-weight:600;}
  .eq .n{color:#ffb3e6;font-weight:600;}
  .eq sup{font-size:10.5px;color:#ffb3e6;}

  .rows{display:flex;flex-direction:column;gap:9px;font-size:12px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#7fb6da;}
  .row b{color:#c9ecff;font-weight:500;}
  .row .tag{
    font-size:10px;padding:2px 7px;border-radius:20px;
    background:rgba(90,200,255,.10);border:1px solid rgba(90,200,255,.20);color:#8fd6ff;
  }

  .legend{display:flex;flex-direction:column;gap:10px;font-size:12px;color:#7fb6da;line-height:1.55;}
  .legend .item{display:flex;gap:9px;align-items:flex-start;}
  .legend .dot{
    width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:4px;
    background:var(--c);box-shadow:0 0 10px var(--c),0 0 20px var(--c);
  }

  .readout{
    margin-top:auto;
    display:flex;justify-content:space-between;gap:8px;
    font-size:10.5px;letter-spacing:.06em;color:#4d7fa6;
    padding-top:14px;border-top:1px solid rgba(90,200,255,.10);
  }
  .readout b{color:#8fd6ff;font-weight:500;}

  /* ---------- 右侧画布 ---------- */
  .stage{flex:1;position:relative;min-width:0;overflow:hidden;}
  canvas{display:block;position:absolute;inset:0;}

  @media (max-width:860px){
    .app{flex-direction:column;}
    .panel{width:100%;flex:0 0 auto;max-height:46vh;border-right:none;
      border-bottom:1px solid rgba(90,200,255,.14);}
    .readout{margin-top:0;}
    .stage{flex:1;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- 左：公式 -->
  <aside class="panel">
    <div>
      <div class="title">量子水母</div>
      <div class="subtitle">Quantum Jellyfish</div>
    </div>

    <div class="card">
      <h3>Core Formula</h3>
      <div class="eq">
        <span class="v">x</span> = <span class="n">A</span> · sin(<span class="n">k</span>·<span class="v">i</span> + <span class="n">ω</span>·<span class="v">t</span>) · e<sup>−<span class="n">λ</span>·<span class="v">y</span></sup>
      </div>
      <div class="eq">
        <span class="v">y</span> = <span class="n">B</span> · cos(<span class="n">k</span>·<span class="v">i</span> − <span class="n">ω</span>·<span class="v">t</span>)
      </div>
    </div>

    <div class="card">
      <h3>Parameters</h3>
      <div class="rows">
        <div class="row"><span>A · 触须摆幅</span><b>38 px</b></div>
        <div class="row"><span>B · 纵向波动</span><b>9 px</b></div>
        <div class="row"><span>k · 波数</span><b>5.0</b></div>
        <div class="row"><span>ω · 角频率</span><b>1.80 rad/s</b></div>
        <div class="row"><span>λ · 衰减系数</span><b>1.05</b></div>
        <div class="row"><span>N · 触须条数</span><b>54</b></div>
      </div>
    </div>

    <div class="card">
      <h3>Color Logic</h3>
      <div class="legend">
        <div class="item">
          <span class="dot" style="--c:#59f0ff"></span>
          <span><b style="color:#9fdcff">色相</b> 随 t 线性增加 —— 深海光谱缓慢漂移</span>
        </div>
        <div class="item">
          <span class="dot" style="--c:#b06cff"></span>
          <span><b style="color:#9fdcff">饱和度</b> 随 y 坐标衰减 —— 越深越幽微</span>
        </div>
        <div class="item">
          <span class="dot" style="--c:#ff7ac8"></span>
          <span><b style="color:#9fdcff">亮度</b> 叠加式发光 —— 模拟生物荧光</span>
        </div>
      </div>
    </div>

    <div class="readout">
      <span>t = <b id="rt">0.00</b>s</span>
      <span>hue = <b id="rh">0</b>°</span>
      <span>ωt = <b id="rw">0.00</b></span>
    </div>
  </aside>

  <!-- 右：Canvas -->
  <main class="stage">
    <canvas id="c"></canvas>
  </main>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  /* ========== 参数 ========== */
  const CFG = {
    A: 38,          // 水平摆幅
    B: 9,           // 纵向波动
    k: 5.0,         // 波数
    omega: 1.8,     // 角频率 ω
    lambda: 1.05,   // 衰减 λ
    hueSpeed: 16,   // 色相线性增长 (度/秒)
    tentacles: 54   // 触须条数（← 已翻倍）
  };

  let W = 0, H = 0, DPR = 1;
  let bgGrad = null;
  const cap = { cx: 0, cy: 0, rx: 0, ry: 0 };
  let TENTACLES = [];
  let particles = [];

  /* 确定性伪随机，保证形状稳定 */
  const rnd = n => {
    const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  };

  /* ========== 尺寸 ========== */
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = Math.max(rect.width, 1);
    H = Math.max(rect.height, 1);
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    computeGeometry();
    buildTentacles();
    buildParticles();
    buildBackground();
  }

  function computeGeometry() {
    cap.cx = W * 0.5;
    cap.cy = H * 0.36;
    cap.rx = Math.min(W * 0.20, 168);
    cap.ry = Math.min(H * 0.165, 132);
  }

  function buildBackground() {
    bgGrad = ctx.createRadialGradient(
      W * 0.5, H * 0.40, 0,
      W * 0.5, H * 0.52, Math.max(W, H) * 0.88
    );
    bgGrad.addColorStop(0.00, '#0a1e35');
    bgGrad.addColorStop(0.42, '#05101f');
    bgGrad.addColorStop(1.00, '#01040a');
  }

  /* ========== 触须数据（条数翻倍，逐条变细） ========== */
  function buildTentacles() {
    TENTACLES = [];
    const N = CFG.tentacles;
    const maxLen = Math.max(H - cap.cy - 40, 60);

    for (let n = 0; n < N; n++) {
      const u = n / (N - 1);
      const r1 = rnd(n * 3.13);
      const r2 = rnd(n * 7.77);
      const r3 = rnd(n * 11.31);

      const len = Math.min(
        cap.ry * (1.25 + 1.75 * Math.sin(Math.PI * u) + 0.55 * r1),
        maxLen
      );

      TENTACLES.push({
        u,
        len,
        /* 摆幅收窄：密集排列时避免互相穿插成噪声 */
        amp: 0.40 + 0.62 * r2,
        phase: r3 * Math.PI * 2,
        /* 线宽变细：0.42 ~ 1.24，呼吸间更显轻透 */
        w: 0.42 + 1.05 * r1,
        /* 色相沿伞缘铺开，密集后过渡更顺滑 */
        hueOff: (u - 0.5) * 82,
        /* 每根触须的轻微亮度抖动，制造鳞次栉比的层次 */
        alpha: 0.62 + 0.38 * r2
      });
    }
  }

  /* ========== 浮游粒子 ========== */
  function buildParticles() {
    particles = [];
    const count = Math.min(Math.round((W * H) / 17000), 84);
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.6 + Math.random() * 1.7,
        sp: 5 + Math.random() * 20,
        ph: Math.random() * Math.PI * 2,
        h: Math.random() * 80
      });
    }
  }

  /* ========== 渲染：背景粒子 ========== */
  function drawParticles(t, hue) {
    for (const p of particles) {
      const x = p.x + Math.sin(t * 0.7 + p.ph) * 14;
      const a = 0.18 + 0.34 * (0.5 + 0.5 * Math.sin(t * 1.6 + p.ph));
      ctx.beginPath();
      ctx.arc(x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue + p.h}, 100%, 78%, ${a})`;
      ctx.fill();
    }
  }

  /* ========== 渲染：触须 ========== */
  function drawTentacles(t, hue, breathe) {
    const cx = cap.cx, cy = cap.cy;
    const rx = cap.rx * breathe;
    const ry = cap.ry * (2 - breathe);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (const T of TENTACLES) {
      const ang = Math.PI * T.u;
      const wob = Math.sin(T.u * Math.PI * 5 + t * 2.2) * ry * 0.15;
      const x0 = cx + rx * Math.cos(ang);
      const y0 = cy + wob - ry * 0.07 * Math.sin(ang);
      const L = T.len * (0.90 + 0.10 * breathe);

      /* ---- 采样核心公式 ---- */
      const N = 20;
      const pts = [];
      for (let s = 0; s <= N; s++) {
        const i = s / N;                                  // 参数 i
        const y = i;                                      // 归一化深度 y
        const dx = CFG.A * T.amp
                 * Math.sin(CFG.k * i + CFG.omega * t + T.phase)
                 * Math.exp(-CFG.lambda * y);             // x = A·sin(ki+ωt)·e^(-λy)
        const dy = CFG.B * Math.cos(CFG.k * i - CFG.omega * t + T.phase);
        pts.push([
          x0 + dx,
          y0 + i * L + dy * (0.35 + 0.65 * i)
        ]);
      }

      /* ---- 平滑路径 ---- */
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let s = 1; s < pts.length - 1; s++) {
        const mx = (pts[s][0] + pts[s + 1][0]) * 0.5;
        const my = (pts[s][1] + pts[s + 1][1]) * 0.5;
        ctx.quadraticCurveTo(pts[s][0], pts[s][1], mx, my);
      }
      ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);

      /* ---- 颜色：色相随 t，饱和度随 y 衰减 ---- */
      const h0 = hue + T.hueOff;
      const g = ctx.createLinearGradient(x0, y0, x0, y0 + L);
      g.addColorStop(0.00, `hsla(${h0}, 100%, 86%, ${0.95 * T.alpha})`);
      g.addColorStop(0.28, `hsla(${h0 + 25}, 96%, 72%, ${0.48 * T.alpha})`);
      g.addColorStop(0.62, `hsla(${h0 + 50}, 78%, 60%, ${0.22 * T.alpha})`);
      g.addColorStop(1.00, `hsla(${h0 + 85}, 55%, 55%, 0.00)`);

      ctx.strokeStyle = g;

      /* 辉光层：条数翻倍后调淡，避免叠加过曝 */
      ctx.globalAlpha = 0.055;
      ctx.lineWidth = T.w * 3.2;
      ctx.stroke();

      /* 核心层 */
      ctx.globalAlpha = 0.92;
      ctx.lineWidth = T.w;
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
  }

  /* ========== 渲染：伞盖 ========== */
  function drawCap(t, hue, breathe) {
    const cx = cap.cx, cy = cap.cy;
    const rx = cap.rx * breathe;
    const ry = cap.ry * (2 - breathe);
    const SEG = 36;

    /* 边缘波浪点 */
    const edge = [];
    for (let s = 0; s <= SEG; s++) {
      const u = s / SEG;
      const ang = Math.PI * u;
      const x = cx + rx * Math.cos(ang);
      const w = Math.sin(u * Math.PI * 5 + t * 2.2) * ry * 0.15;
      const y = cy + w - ry * 0.07 * Math.sin(ang);
      edge.push([x, y]);
    }

    /* 轮廓 */
    ctx.beginPath();
    ctx.moveTo(cx - rx, cy);
    ctx.bezierCurveTo(
      cx - rx * 1.08, cy - ry * 1.62,
      cx + rx * 1.08, cy - ry * 1.62,
      cx + rx, cy
    );
    for (let s = 0; s <= SEG; s++) ctx.lineTo(edge[s][0], edge[s][1]);
    ctx.closePath();

    /* 填充 */
    const g = ctx.createRadialGradient(
      cx, cy - ry * 0.55, ry * 0.05,
      cx, cy - ry * 0.10, rx * 1.65
    );
    g.addColorStop(0.00, `hsla(${hue}, 100%, 88%, 0.70)`);
    g.addColorStop(0.32, `hsla(${hue + 22}, 100%, 68%, 0.40)`);
    g.addColorStop(0.70, `hsla(${hue + 48}, 92%, 56%, 0.14)`);
    g.addColorStop(1.00, `hsla(${hue + 85}, 88%, 50%, 0.02)`);
    ctx.fillStyle = g;
    ctx.fill();

    /* 边缘描边 */
    ctx.strokeStyle = `hsla(${hue + 12}, 100%, 85%, 0.85)`;
    ctx.lineWidth = 1.7;
    ctx.stroke();

    /* 内部伞褶 */
    ctx.lineWidth = 1;
    ctx.strokeStyle = `hsla(${hue + 48}, 100%, 78%, 0.20)`;
    for (let m = 1; m < 10; m++) {
      const u = m / 10;
      const ang = Math.PI * u;
      const ex = cx + rx * Math.cos(ang);
      const ew = Math.sin(u * Math.PI * 5 + t * 2.2) * ry * 0.15;
      const ey = cy + ew - ry * 0.07 * Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(cx, cy - ry * 0.62);
      ctx.quadraticCurveTo(cx + (ex - cx) * 0.60, cy - ry * 0.20, ex, ey);
      ctx.stroke();
    }

    /* 内核光斑 —— 呼吸 */
    const core = ctx.createRadialGradient(
      cx, cy - ry * 0.45, 0,
      cx, cy - ry * 0.45, rx * 0.90
    );
    core.addColorStop(0.00, `hsla(${hue + 30}, 100%, 96%, 0.50)`);
    core.addColorStop(0.45, `hsla(${hue + 62}, 100%, 76%, 0.16)`);
    core.addColorStop(1.00, `hsla(${hue + 95}, 100%, 62%, 0.00)`);
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.ellipse(cx, cy - ry * 0.45, rx * 0.88, ry * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ========== 主循环 ========== */
  let last = performance.now();
  let T = 0;
  let frame = 0;
  const $rt = document.getElementById('rt');
  const $rh = document.getElementById('rh');
  const $rw = document.getElementById('rw');

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    T += dt;

    /* --- 更新 --- */
    for (const p of particles) {
      p.y -= p.sp * dt;
      if (p.y < -12) {
        p.y = H + 12;
        p.x = Math.random() * W;
      }
    }

    /* --- 绘制 --- */
    const hue = (T * CFG.hueSpeed) % 360;
    const breathe = 1 + 0.055 * Math.sin(T * 1.55);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    drawParticles(T, hue);
    drawTentacles(T, hue, breathe);
    drawCap(T, hue, breathe);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    /* --- 面板读数 --- */
    if ((frame++ & 7) === 0) {
      $rt.textContent = T.toFixed(2);
      $rh.textContent = hue.toFixed(0);
      $rw.textContent = (CFG.omega * T % (Math.PI * 2)).toFixed(2);
    }

    requestAnimationFrame(loop);
  }

  /* ========== 启动 ========== */
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
