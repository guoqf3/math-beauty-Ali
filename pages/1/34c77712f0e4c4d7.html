<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>引力透镜效应 · Gravitational Lensing</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060e;}
  canvas{display:block;position:fixed;inset:0;touch-action:none;}

  .hud{
    position:fixed;pointer-events:none;z-index:5;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
  }

  /* ---------- 左上：标题 + 公式 ---------- */
  .hud-tl{
    top:clamp(16px,3vh,40px);
    left:clamp(16px,3vw,50px);
  }
  .hud-tl h1{
    font-size:clamp(15px,2.0vw,27px);
    font-weight:500;
    letter-spacing:.2em;
    color:#e9fbff;
    white-space:nowrap;
    text-shadow:0 0 10px #3ad2ff,0 0 34px #1a6aff,0 0 72px #8a2cff;
  }
  .hud-tl .en{
    margin-top:.6em;
    font-size:clamp(8px,.82vw,11px);
    letter-spacing:.4em;
    color:#5aa8cc;
    text-shadow:0 0 8px rgba(58,210,255,.55);
    white-space:nowrap;
  }
  .rule{
    margin:1.1em 0 1em;
    width:clamp(130px,17vw,250px);
    height:1px;
    background:linear-gradient(90deg,#3ad2ff,rgba(58,210,255,0));
    box-shadow:0 0 10px #3ad2ff;
  }
  .eq{
    font-size:clamp(10px,1.05vw,14px);
    letter-spacing:.07em;
    line-height:2.0;
    color:#a9e6ff;
    white-space:nowrap;
    text-shadow:0 0 10px rgba(58,210,255,.8);
  }
  .eq .hl{color:#ff9df0;text-shadow:0 0 12px #ff4de0,0 0 30px #a416ff;}
  .eq2{
    margin-top:.35em;
    color:#ffd8fb;
    text-shadow:0 0 12px rgba(255,90,230,.9),0 0 32px rgba(160,40,255,.6);
  }

  /* ---------- 右下：实时读数 ---------- */
  .hud-br{
    right:clamp(16px,3vw,50px);
    bottom:clamp(92px,15vh,132px);
    text-align:right;
    font-size:clamp(9px,.9vw,12px);
    letter-spacing:.18em;
    line-height:2.05;
    color:#6ec4e6;
    text-shadow:0 0 9px rgba(58,210,255,.65);
  }
  .hud-br b{color:#ffb3f4;font-weight:400;text-shadow:0 0 12px #ff4de0;}
  .hud-br .dim{color:#3f7a99;}

  /* ---------- 左侧竖条装饰 ---------- */
  .hud-line{
    position:fixed;left:clamp(7px,1.3vw,21px);top:50%;
    transform:translateY(-50%);
    width:1px;height:32vh;z-index:5;pointer-events:none;
    background:linear-gradient(180deg,transparent,#3ad2ff,transparent);
    opacity:.45;box-shadow:0 0 12px #3ad2ff;
  }

  /* ---------- 控制面板 ---------- */
  .panel{
    position:fixed;left:50%;bottom:clamp(16px,3.6vh,42px);
    transform:translateX(-50%);
    z-index:10;
    display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);
    padding:clamp(9px,1.2vh,15px) clamp(16px,2.2vw,30px);
    border:1px solid rgba(90,215,255,.28);
    border-radius:44px;
    background:rgba(7,20,42,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(9px,.95vw,12px);
    letter-spacing:.18em;
    color:#8fd8f5;
    box-shadow:0 0 30px rgba(30,120,255,.18),inset 0 0 22px rgba(58,210,255,.06);
    white-space:nowrap;
  }
  .panel .lab{color:#5fa6c8;}
  .panel .val{
    min-width:8.2em;color:#ffb3f4;
    text-shadow:0 0 12px #ff4de0;
    font-variant-numeric:tabular-nums;
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:clamp(120px,18vw,260px);height:2px;
    border-radius:2px;outline:none;
    background:linear-gradient(90deg,#3ad2ff,#9b6bff,#ff4de0);
    box-shadow:0 0 10px rgba(58,210,255,.6);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px;height:15px;border-radius:50%;
    background:#fff;cursor:pointer;
    box-shadow:0 0 12px #3ad2ff,0 0 26px #ff4de0;
    transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22);}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border:none;border-radius:50%;
    background:#fff;cursor:pointer;
    box-shadow:0 0 12px #3ad2ff,0 0 26px #ff4de0;
  }

  /* ---------- 启动提示 ---------- */
  #start{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    z-index:30;cursor:pointer;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(10px,1vw,13px);
    letter-spacing:.32em;
    color:#b0ecff;
    padding:13px 30px;
    border:1px solid rgba(90,220,255,.45);
    border-radius:44px;
    background:rgba(8,26,54,.5);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    text-shadow:0 0 10px #3ad2ff;
    animation:breathe 2.6s ease-in-out infinite;
    transition:opacity .8s ease,transform .8s ease;
    white-space:nowrap;
  }
  #start.hide{
    opacity:0;pointer-events:none;
    transform:translate(-50%,-50%) scale(.94);
  }
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 rgba(58,210,255,0);border-color:rgba(90,220,255,.3);}
    50%{box-shadow:0 0 30px rgba(58,210,255,.55),inset 0 0 20px rgba(58,210,255,.12);border-color:rgba(150,240,255,.85);}
  }

  /* ---------- 提示文字 ---------- */
  .hint{
    position:fixed;left:50%;top:clamp(90px,14vh,150px);
    transform:translateX(-50%);
    z-index:8;pointer-events:none;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(8px,.85vw,11px);
    letter-spacing:.3em;
    color:rgba(120,190,230,.5);
    text-shadow:0 0 10px rgba(58,210,255,.4);
    white-space:nowrap;
    animation:hintPulse 3.6s ease-in-out infinite;
  }
  @keyframes hintPulse{0%,100%{opacity:.35;}50%{opacity:.85;}}

  /* ---------- 扫描线 & 暗角 ---------- */
  .scan{
    position:fixed;inset:0;z-index:6;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.5;
  }
  .vig{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 50% 52%,transparent 30%,rgba(0,0,0,.74) 100%);
  }

  @media (max-width:640px){
    .hud-br{display:none;}
    .hud-tl .en{letter-spacing:.26em;}
    .hint{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vig"></div>
<div class="scan"></div>
<div class="hud-line"></div>

<div class="hud hud-tl">
  <h1>引力透镜效应</h1>
  <div class="en">GRAVITATIONAL LENSING · EINSTEIN RING</div>
  <div class="rule"></div>
  <div class="eq">α = <span class="hl">4GM</span> / (c²b) &nbsp;·&nbsp; 光线偏折角</div>
  <div class="eq eq2">θ<sub>E</sub> = √( 4GM/c² · D<sub>ls</sub> / (D<sub>l</sub>D<sub>s</sub>) )</div>
  <div class="eq">β = θ − θ<sub>E</sub>² / θ &nbsp;·&nbsp; 透镜方程</div>
</div>

<div class="hud hud-br">
  <div class="dim">—— 实时参数 ——</div>
  <div>透镜质量 M <b id="r-M">1.00</b></div>
  <div>爱因斯坦半径 θ<sub>E</sub> <b id="r-te">82</b> px</div>
  <div>偏折强度 α <b id="r-a">1.00</b></div>
  <div>光源偏移 β <b id="r-b">0.00</b></div>
</div>

<div class="hint">拖动 · 移动前景透镜天体</div>

<div class="panel">
  <span class="lab">透镜质量 M</span>
  <input type="range" id="mass" min="0.30" max="2.50" step="0.01" value="1.00">
  <span class="val" id="massval">1.00 M☉</span>
</div>

<div id="start">点击任意处 · 启动音效</div>

<script>
(function () {
'use strict';

/* ======================================================================
   0 · 基础
   ====================================================================== */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const TAU    = Math.PI * 2;

let W = 0, H = 0, DPR = 1, S = 0;
let CX = 0, CY = 0;

/* 处理画布（低分辨率反向映射） */
const procCanvas = document.createElement('canvas');
const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

/* 源图像画布 */
const srcCanvas = document.createElement('canvas');
const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });

let PW = 280, PH = 160;          // 处理分辨率
let scaleF = 6;                  // 屏幕像素 / 处理像素
let procImg = null;              // ImageData 复用
let srcData = null;              // 源像素缓存

/* ======================================================================
   1 · 尺寸 / 生成源图像
   ====================================================================== */
function calcProcSize() {
  const MAX_PIX = 44000;
  const aspect = Math.max(0.2, Math.min(5.0, W / H));
  PW = Math.round(Math.sqrt(MAX_PIX * aspect));
  PH = Math.round(MAX_PIX / PW);
  PW = Math.max(80, Math.min(420, PW));
  PH = Math.max(60, Math.min(420, PH));

  procCanvas.width  = PW;
  procCanvas.height = PH;
  srcCanvas.width   = PW;
  srcCanvas.height  = PH;

  procImg = procCtx.createImageData(PW, PH);
  scaleF  = W / PW;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.min(W, H);
  CX = W * 0.5;
  CY = H * 0.5;

  calcProcSize();
  generateSource();
  srcData = srcCtx.getImageData(0, 0, PW, PH).data;
}
window.addEventListener('resize', resize, { passive: true });

/* ---------------------------------------------------------------------
   生成源图像：深空星云 + 星场 + 中央星系
   --------------------------------------------------------------------- */
function generateSource() {
  const w = PW, h = PH;
  const c = srcCtx;

  /* 底色 */
  c.fillStyle = '#000206';
  c.fillRect(0, 0, w, h);

  /* 星云斑块 */
  for (let i = 0; i < 12; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = Math.min(w, h) * (0.16 + Math.random() * 0.34);
    const hue = 195 + Math.random() * 150;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0.00, 'hsla(' + hue + ',85%,52%,0.16)');
    g.addColorStop(0.50, 'hsla(' + (hue + 20) + ',85%,48%,0.05)');
    g.addColorStop(1.00, 'hsla(' + (hue + 40) + ',85%,48%,0)');
    c.fillStyle = g;
    c.fillRect(x - r, y - r, r * 2, r * 2);
  }

  /* 星场 */
  for (let i = 0; i < 620; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = 0.18 + Math.random() * 0.85;
    const b = 0.14 + Math.random() * 0.86;
    const hue = 190 + Math.random() * 90;
    c.fillStyle = 'hsla(' + hue + ',72%,88%,' + b.toFixed(3) + ')';
    c.beginPath();
    c.arc(x, y, r, 0, TAU);
    c.fill();
  }

  /* 中央亮星系（产生爱因斯坦环的光源） */
  const cx0 = w * 0.5;
  const cy0 = h * 0.5;
  const gr  = Math.min(w, h) * 0.30;

  const g1 = c.createRadialGradient(cx0, cy0, 0, cx0, cy0, gr);
  g1.addColorStop(0.00, 'rgba(255,253,245,0.98)');
  g1.addColorStop(0.07, 'rgba(255,244,210,0.78)');
  g1.addColorStop(0.20, 'rgba(255,220,165,0.36)');
  g1.addColorStop(0.48, 'rgba(255,180,120,0.11)');
  g1.addColorStop(1.00, 'rgba(255,130,80,0)');
  c.fillStyle = g1;
  c.fillRect(cx0 - gr, cy0 - gr, gr * 2, gr * 2);

  /* 星系核 */
  const g2 = c.createRadialGradient(cx0, cy0, 0, cx0, cy0, gr * 0.22);
  g2.addColorStop(0.00, 'rgba(255,255,255,0.98)');
  g2.addColorStop(0.45, 'rgba(255,248,230,0.50)');
  g2.addColorStop(1.00, 'rgba(255,220,180,0)');
  c.fillStyle = g2;
  c.fillRect(cx0 - gr, cy0 - gr, gr * 2, gr * 2);
}

/* ======================================================================
   2 · 状态
   ====================================================================== */
let lensNX = 0.5;             // 透镜归一化位置
let lensNY = 0.5;
let targetNX = 0.5;           // 平滑目标
let targetNY = 0.5;

let mass = 1.0;               // 质量倍率
let thetaE_screen = 82;       // 屏幕像素
let thetaE_proc   = 82;       // 处理像素

let time = 0;
let dragging = false;

/* ======================================================================
   3 · 背景星尘（固定深空层）
   ====================================================================== */
const stars = [];
(function seed() {
  let s = 31415926;
  const rnd = function () {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  };
  for (let i = 0; i < 170; i++) {
    stars.push({
      x: rnd(), y: rnd(),
      r: rnd() * 1.5 + 0.3,
      p: rnd() * TAU,
      sp: 0.4 + rnd() * 1.7,
      hue: 190 + rnd() * 100
    });
  }
})();

const BLOBS = [
  { h: 198, x: 0.22, y: 0.28, r: 0.58, sp:  0.10 },
  { h: 292, x: 0.80, y: 0.40, r: 0.52, sp: -0.085 },
  { h: 336, x: 0.52, y: 0.80, r: 0.48, sp:  0.12 },
  { h: 170, x: 0.10, y: 0.70, r: 0.42, sp: -0.07 },
  { h: 250, x: 0.62, y: 0.18, r: 0.40, sp:  0.09 }
];

function drawDeepSpace() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#03050c';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  const md = Math.min(W, H);

  for (let i = 0; i < BLOBS.length; i++) {
    const b  = BLOBS[i];
    const px = W * (b.x + 0.055 * Math.sin(time * b.sp * 2.1 + i * 1.7));
    const py = H * (b.y + 0.045 * Math.cos(time * b.sp * 1.7 + i * 2.3));
    const r  = md * b.r * (1 + 0.14 * Math.sin(time * 0.55 + i));
    const hue = b.h + 24 * Math.sin(time * 0.25 + i);

    const g = ctx.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0.00, 'hsla(' + hue + ',95%,56%,0.20)');
    g.addColorStop(0.42, 'hsla(' + (hue + 25) + ',95%,50%,0.07)');
    g.addColorStop(1.00, 'hsla(' + (hue + 50) + ',95%,50%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(px - r, py - r, r * 2, r * 2);
  }

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const a = 0.05 + 0.28 * Math.abs(Math.sin(time * s.sp + s.p));
    ctx.fillStyle = 'hsla(' + s.hue + ',70%,86%,' + a.toFixed(3) + ')';
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
}

/* ======================================================================
   4 · 引力透镜 · 反向映射
      β = θ − θ_E²/θ
   ====================================================================== */
function computeLensed() {
  const out = procImg.data;
  const sd  = srcData;

  const Lx = lensNX * PW;
  const Ly = lensNY * PH;
  const tE2 = thetaE_proc * thetaE_proc;

  for (let y = 0; y < PH; y++) {
    const dy  = y + 0.5 - Ly;
    const dy2 = dy * dy;
    const rowOff = y * PW * 4;

    for (let x = 0; x < PW; x++) {
      const dx  = x + 0.5 - Lx;
      const r2  = dx * dx + dy2;

      let sx, sy;

      if (r2 < 4.0) {
        /* 透镜正后方：映射到源中心 */
        sx = Lx;
        sy = Ly;
      } else {
        const f = 1 - tE2 / r2;
        sx = Lx + dx * f;
        sy = Ly + dy * f;
      }

      let sxi = sx | 0;
      let syi = sy | 0;

      const oi = rowOff + (x << 2);

      if (sxi >= 0 && sxi < PW && syi >= 0 && syi < PH) {
        const si = ((syi * PW) + sxi) << 2;
        out[oi]     = sd[si];
        out[oi + 1] = sd[si + 1];
        out[oi + 2] = sd[si + 2];
        out[oi + 3] = 255;
      } else {
        out[oi]     = 0;
        out[oi + 1] = 0;
        out[oi + 2] = 0;
        out[oi + 3] = 255;
      }
    }
  }

  procCtx.putImageData(procImg, 0, 0);
}

function drawLensedBackground() {
  /* 主体（清晰） */
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(procCanvas, 0, 0, W, H);

  /* 发光叠加 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.45;
  ctx.drawImage(procCanvas, 0, 0, W, H);
  ctx.globalAlpha = 1;
}

/* ======================================================================
   5 · 爱因斯坦环高亮 & 光晕
   ====================================================================== */
function drawEinsteinRing() {
  const lx = lensNX * W;
  const ly = lensNY * H;
  const rE = thetaE_screen;

  const pulse = 0.72 + 0.28 * Math.sin(time * 1.9);

  ctx.globalCompositeOperation = 'lighter';

  /* --- 环外光晕 --- */
  const g = ctx.createRadialGradient(lx, ly, rE * 0.62, lx, ly, rE * 1.42);
  g.addColorStop(0.00, 'rgba(255,220,150,0)');
  g.addColorStop(0.36, 'rgba(255,230,180,' + (0.045 * pulse).toFixed(4) + ')');
  g.addColorStop(0.52, 'rgba(255,240,210,' + (0.13 * pulse).toFixed(4) + ')');
  g.addColorStop(0.66, 'rgba(255,220,170,' + (0.055 * pulse).toFixed(4) + ')');
  g.addColorStop(1.00, 'rgba(255,200,140,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(lx, ly, rE * 1.42, 0, TAU);
  ctx.fill();

  /* --- 环线本体 --- */
  ctx.beginPath();
  ctx.arc(lx, ly, rE, 0, TAU);

  ctx.strokeStyle = 'rgba(255,215,150,' + (0.05 * pulse).toFixed(4) + ')';
  ctx.lineWidth = 16;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,235,190,' + (0.13 * pulse).toFixed(4) + ')';
  ctx.lineWidth = 5.5;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,250,235,' + (0.26 * pulse).toFixed(4) + ')';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* --- 环上流动光点（表现弯曲光线流） --- */
  const N = 26;
  for (let k = 0; k < N; k++) {
    const a = time * 0.55 + k / N * TAU;
    const px = lx + Math.cos(a) * rE;
    const py = ly + Math.sin(a) * rE;

    const flick = 0.55 + 0.45 * Math.sin(k * 2.7 + time * 3.4);

    const g2 = ctx.createRadialGradient(px, py, 0, px, py, 15);
    g2.addColorStop(0.00, 'rgba(255,255,250,' + (0.72 * flick * pulse).toFixed(4) + ')');
    g2.addColorStop(0.30, 'rgba(255,230,170,' + (0.30 * flick * pulse).toFixed(4) + ')');
    g2.addColorStop(1.00, 'rgba(255,200,120,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(px, py, 15, 0, TAU);
    ctx.fill();
  }
}

/* ======================================================================
   6 · 弯曲光线（从源经透镜汇聚的光弧）
   ====================================================================== */
function drawBentRays() {
  const lx = lensNX * W;
  const ly = lensNY * H;
  const rE = thetaE_screen;

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  const inten = Math.min(1.4, mass);
  const NR = 44;

  for (let k = 0; k < NR; k++) {
    const a  = k / NR * TAU + time * 0.06;

    /* 起点：外圈 */
    const rOut = rE * (2.15 + 0.55 * Math.sin(k * 1.7 + time * 0.5));
    const x0 = lx + Math.cos(a) * rOut;
    const y0 = ly + Math.sin(a) * rOut;

    /* 终点：环上 */
    const x1 = lx + Math.cos(a) * rE * 0.92;
    const y1 = ly + Math.sin(a) * rE * 0.92;

    /* 控制点：向环外侧鼓出，模拟弯曲 */
    const mx = lx + Math.cos(a) * rE * 1.62;
    const my = ly + Math.sin(a) * rE * 1.62;

    const hue = 195 + 70 * Math.sin(k * 0.9 + time * 0.8) + 40;

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(mx, my, x1, y1);

    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',100%,72%,' +
                      (0.055 * inten).toFixed(4) + ')';
    ctx.lineWidth = 1.0;
    ctx.stroke();

    /* 流线亮核 */
    ctx.strokeStyle = 'hsla(' + (hue + 20).toFixed(1) + ',100%,88%,' +
                      (0.11 * inten).toFixed(4) + ')';
    ctx.lineWidth = 0.45;
    ctx.stroke();

    /* 流动光点 */
    const tp = (time * 0.42 + k * 0.13) % 1;
    const u  = 1 - tp;
    const ux = (1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * mx + u * u * x1;
    const uy = (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * my + u * u * y1;

    const g = ctx.createRadialGradient(ux, uy, 0, ux, uy, 5.5);
    g.addColorStop(0, 'rgba(255,255,255,0.65)');
    g.addColorStop(1, 'rgba(255,220,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ux, uy, 5.5, 0, TAU);
    ctx.fill();
  }
}

/* ======================================================================
   7 · 前景透镜天体（3D 球体感）
   ====================================================================== */
function drawLensBody() {
  const lx = lensNX * W;
  const ly = lensNY * H;

  /* 半径随质量变化 */
  const rBody = Math.max(9, thetaE_screen * 0.17);

  const pulse = 0.80 + 0.20 * Math.sin(time * 2.1);

  ctx.globalCompositeOperation = 'lighter';

  /* --- 外层辉光 --- */
  const g1 = ctx.createRadialGradient(lx, ly, rBody * 0.6, lx, ly, rBody * 5.2);
  g1.addColorStop(0.00, 'rgba(255,240,210,' + (0.13 * pulse).toFixed(4) + ')');
  g1.addColorStop(0.28, 'rgba(220,180,255,' + (0.075 * pulse).toFixed(4) + ')');
  g1.addColorStop(0.62, 'rgba(140,130,255,' + (0.028 * pulse).toFixed(4) + ')');
  g1.addColorStop(1.00, 'rgba(90,90,255,0)');
  ctx.fillStyle = g1;
  ctx.beginPath();
  ctx.arc(lx, ly, rBody * 5.2, 0, TAU);
  ctx.fill();

  /* --- 球体本体 --- */
  const g2 = ctx.createRadialGradient(
    lx - rBody * 0.35, ly - rBody * 0.35, rBody * 0.05,
    lx, ly, rBody
  );
  g2.addColorStop(0.00, 'rgba(255,252,240,0.98)');
  g2.addColorStop(0.22, 'rgba(255,235,195,0.80)');
  g2.addColorStop(0.55, 'rgba(200,150,255,0.42)');
  g2.addColorStop(0.82, 'rgba(120,90,255,0.20)');
  g2.addColorStop(1.00, 'rgba(60,40,180,0.04)');
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.arc(lx, ly, rBody, 0, TAU);
  ctx.fill();

  /* --- 边缘亮环 --- */
  ctx.beginPath();
  ctx.arc(lx, ly, rBody * 0.98, 0, TAU);
  ctx.strokeStyle = 'rgba(255,240,210,' + (0.42 * pulse).toFixed(4) + ')';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* --- 核心高光 --- */
  const g3 = ctx.createRadialGradient(lx, ly, 0, lx, ly, rBody * 0.34);
  g3.addColorStop(0, 'rgba(255,255,255,0.95)');
  g3.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = g3;
  ctx.beginPath();
  ctx.arc(lx, ly, rBody * 0.34, 0, TAU);
  ctx.fill();
}

/* ======================================================================
   8 · 主循环
   ====================================================================== */
let last = 0;
let frameCount = 0;

function loop(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0)    dt = 0;

  time += dt;
  frameCount++;

  /* ---- 平滑透镜位置 ---- */
  const k = Math.min(1, dt * 9.0);
  lensNX += (targetNX - lensNX) * k;
  lensNY += (targetNY - lensNY) * k;

  /* ---- 爱因斯坦半径：θ_E ∝ √M ---- */
  thetaE_screen = (S * 0.115) * Math.sqrt(mass);
  if (thetaE_screen > Math.min(W, H) * 0.34) {
    thetaE_screen = Math.min(W, H) * 0.34;
  }
  thetaE_proc = thetaE_screen / scaleF;

  /* ---- 绘制 ---- */
  drawDeepSpace();

  computeLensed();
  drawLensedBackground();

  drawBentRays();
  drawEinsteinRing();
  drawLensBody();

  /* ---- HUD 节流更新 ---- */
  if (frameCount % 6 === 0) updateHUD();

  requestAnimationFrame(loop);
}

/* ======================================================================
   9 · HUD
   ====================================================================== */
const elM  = document.getElementById('r-M');
const elTe = document.getElementById('r-te');
const elA  = document.getElementById('r-a');
const elB  = document.getElementById('r-b');
const elVal = document.getElementById('massval');

function updateHUD() {
  elM.textContent  = mass.toFixed(2);
  elTe.textContent = Math.round(thetaE_screen);
  elA.textContent  = mass.toFixed(2);

  /* 光源相对透镜的偏移（归一化） */
  const dx = 0.5 - lensNX;
  const dy = 0.5 - lensNY;
  const beta = Math.sqrt(dx * dx + dy * dy) * 2.0;
  elB.textContent = beta.toFixed(3);

  elVal.textContent = mass.toFixed(2) + ' M☉';
}

/* ======================================================================
   10 · 交互 · 拖动透镜
   ====================================================================== */
function pointerPos(e) {
  if (e.touches && e.touches.length) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

function onDown(e) {
  dragging = true;
  onMove(e);
}

function onMove(e) {
  if (!dragging) return;
  const p = pointerPos(e);
  let nx = p.x / W;
  let ny = p.y / H;
  if (nx < 0.06) nx = 0.06;
  if (nx > 0.94) nx = 0.94;
  if (ny < 0.08) ny = 0.08;
  if (ny > 0.92) ny = 0.92;
  targetNX = nx;
  targetNY = ny;
}

function onUp() {
  dragging = false;
}

canvas.addEventListener('pointerdown', onDown, { passive: true });
window.addEventListener('pointermove', onMove, { passive: true });
window.addEventListener('pointerup', onUp, { passive: true });
window.addEventListener('pointercancel', onUp, { passive: true });

/* 触摸兼容 */
canvas.addEventListener('touchstart', function (e) {
  dragging = true;
  onMove(e);
}, { passive: true });
window.addEventListener('touchmove', onMove, { passive: true });
window.addEventListener('touchend', onUp, { passive: true });

/* ======================================================================
   11 · 质量滑块
   ====================================================================== */
const slider = document.getElementById('mass');

slider.addEventListener('input', function () {
  mass = parseFloat(slider.value);
  updateHUD();
  playWhoosh();
});

/* ======================================================================
   12 · 科技感音效（Web Audio）
   ====================================================================== */
let actx = null;
let masterGain = null;
let echoDelay = null;
let oscA = null, oscB = null, oscC = null;
let toneFilter = null, toneGain = null;
let noiseGainNode = null;
let lastWhoosh = 0;

function initAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  actx = new AC();

  /* ---- 主输出 ---- */
  masterGain = actx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(actx.destination);
  masterGain.gain.exponentialRampToValueAtTime(0.33, actx.currentTime + 3.8);

  /* ---- 太空回声 ---- */
  echoDelay = actx.createDelay(1.0);
  echoDelay.delayTime.value = 0.46;
  const fb   = actx.createGain(); fb.gain.value = 0.46;
  const dOut = actx.createGain(); dOut.gain.value = 0.32;
  echoDelay.connect(fb); fb.connect(echoDelay);
  echoDelay.connect(dOut); dOut.connect(masterGain);

  /* ---- 深空氛围 Pad ---- */
  toneFilter = actx.createBiquadFilter();
  toneFilter.type = 'lowpass';
  toneFilter.frequency.value = 720;
  toneFilter.Q.value = 4.2;

  toneGain = actx.createGain();
  toneGain.gain.value = 0.0001;
  toneFilter.connect(toneGain);
  toneGain.connect(masterGain);
  toneGain.connect(echoDelay);

  const freqs = [55, 82.41, 110, 164.81, 220];
  const oscs = [];
  for (let i = 0; i < freqs.length; i++) {
    const o = actx.createOscillator();
    o.type = (i % 2) ? 'sawtooth' : 'sine';
    o.frequency.value = freqs[i] * (1 + (i % 2 ? 0.0042 : -0.0032));
    const g = actx.createGain();
    g.gain.value = 0.30 / (i + 1);
    o.connect(g); g.connect(toneFilter);
    o.start();
    oscs.push(o);
  }
  oscA = oscs[0]; oscB = oscs[1]; oscC = oscs[2];

  toneGain.gain.exponentialRampToValueAtTime(0.15, actx.currentTime + 4);

  /* 滤波器慢扫 */
  const lfo = actx.createOscillator();
  lfo.frequency.value = 0.048;
  const lfoG = actx.createGain();
  lfoG.gain.value = 420;
  lfo.connect(lfoG); lfoG.connect(toneFilter.frequency);
  lfo.start();

  /* ---- 空气噪声层 ---- */
  const bufLen = Math.floor(actx.sampleRate * 2);
  const nbuf   = actx.createBuffer(1, bufLen, actx.sampleRate);
  const nd     = nbuf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;

  const noise = actx.createBufferSource();
  noise.buffer = nbuf;
  noise.loop = true;

  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 840;
  nf.Q.value = 0.9;

  noiseGainNode = actx.createGain();
  noiseGainNode.gain.value = 0.013;

  noise.connect(nf); nf.connect(noiseGainNode); noiseGainNode.connect(masterGain);
  noise.start();

  const nLfo = actx.createOscillator();
  nLfo.frequency.value = 0.062;
  const nLfoG = actx.createGain();
  nLfoG.gain.value = 520;
  nLfo.connect(nLfoG); nLfoG.connect(nf.frequency);
  nLfo.start();

  /* ---- 透镜共鸣脉冲 ---- */
  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    const t = actx.currentTime;
    const base = 66 / Math.sqrt(mass);

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(base * 3.2, t);
    o.frequency.exponentialRampToValueAtTime(base * 1.0, t + 1.9);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 2.7);
  }, 4200);

  /* ---- 粒子琶音 ---- */
  const scale = [0, 2, 3, 5, 7, 10, 12, 15, 17, 19, 22];
  let step = 0;

  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    if (Math.random() > 0.6) return;

    const t = actx.currentTime;
    const deg = scale[(step * 3 + Math.floor(Math.random() * 3)) % scale.length];
    const f = 300 * Math.pow(2, deg / 12);
    step++;

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.038, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 2.0);
  }, 510);

  /* ---- 深空脉冲 ---- */
  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    const t = actx.currentTime;

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 2.4);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.26);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 2.7);
  }, 7800);

  /* 音高跟随质量 */
  setInterval(function () {
    if (actx && actx.state === 'running') updateTone();
  }, 320);

  updateTone();
}

function updateTone() {
  if (!actx || !oscA || !oscB || !oscC) return;
  const t = actx.currentTime;
  const base = 55 / Math.sqrt(mass);

  oscA.frequency.setTargetAtTime(base * 1.0, t, 0.28);
  oscB.frequency.setTargetAtTime(base * 1.5, t, 0.28);
  oscC.frequency.setTargetAtTime(base * 2.0, t, 0.28);

  if (toneFilter) {
    toneFilter.frequency.setTargetAtTime(560 + mass * 320, t, 0.28);
  }
}

/* 拖动质量滑块：扫掠音 */
function playWhoosh() {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  if (t - lastWhoosh < 0.09) return;
  lastWhoosh = t;

  const o = actx.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(420, t);
  o.frequency.exponentialRampToValueAtTime(130, t + 0.28);

  const f = actx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 1400;
  f.Q.value = 6;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.040, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

  o.connect(f); f.connect(g);
  g.connect(masterGain);
  g.connect(echoDelay);

  o.start(t);
  o.stop(t + 0.36);
}

/* ======================================================================
   13 · 启动
   ====================================================================== */
const startEl = document.getElementById('start');
let started = false;

function startAll() {
  if (started) return;
  started = true;
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  startEl.classList.add('hide');
}

window.addEventListener('pointerdown', startAll, { passive: true });
window.addEventListener('keydown', startAll);
window.addEventListener('touchstart', startAll, { passive: true });

/* ======================================================================
   14 · 启动
   ====================================================================== */
resize();
updateHUD();
requestAnimationFrame(loop);

})();
</script>
