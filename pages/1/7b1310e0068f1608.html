<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球谐函数振动模式 · Spherical Harmonics</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#02030a;
    font-family:'SF Mono','Consolas','Courier New','PingFang SC','Microsoft YaHei',monospace;
    color:#cfe8ff;-webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1}

  .vignette{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,transparent 24%,rgba(0,0,0,.5) 68%,rgba(0,0,0,.93) 100%);
  }

  /* ---------- 标题区 ---------- */
  .hud{
    position:fixed;top:36px;left:44px;z-index:10;pointer-events:none;
    text-shadow:0 0 14px rgba(0,170,255,.6);
    animation:fadeIn 1.8s ease both;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

  .tag{
    display:inline-block;font-size:11px;letter-spacing:5px;color:#4ad6ff;
    padding:3px 12px;border:1px solid rgba(60,190,255,.35);border-radius:3px;
    background:linear-gradient(90deg,rgba(0,120,200,.22),rgba(0,120,200,.02));
    box-shadow:0 0 20px rgba(0,140,255,.25) inset;
  }
  .hud h1{
    margin:16px 0 6px;font-size:clamp(24px,3.4vw,40px);font-weight:700;letter-spacing:8px;
    background:linear-gradient(100deg,#3ae9ff 0%,#8b7bff 34%,#ff61d8 66%,#ffd166 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(80,180,255,.55));
  }
  .en{font-size:10.5px;letter-spacing:3.6px;color:#4d7ba3;margin-bottom:22px}

  .formula{
    display:inline-block;font-size:16px;letter-spacing:1.4px;color:#a9eeff;
    padding:11px 20px;border-left:2px solid #1ea7e0;margin-bottom:8px;
    background:linear-gradient(90deg,rgba(20,120,190,.22),rgba(20,120,190,0));
    box-shadow:-6px 0 26px -8px rgba(50,190,255,.8);
  }
  .formula .op{color:#ff79d6}
  .formula .num{color:#ffd166}
  .formula .fn{color:#7ef2ff}
  .formula sup{font-size:.66em}
  .formula sub{font-size:.66em}

  .info{
    font-size:12.5px;letter-spacing:1.6px;color:#6fb6e0;margin-top:14px;line-height:2;
  }
  .info b{color:#7ef2ff;font-weight:600}
  .info .hi{color:#ffb066;font-weight:600}
  .info .dim{color:#4d7ba3;font-size:11px;letter-spacing:1.2px}

  /* ---------- 控制面板 ---------- */
  .panel{
    position:fixed;right:38px;bottom:36px;z-index:12;
    width:310px;padding:20px 22px 18px;
    background:linear-gradient(160deg,rgba(10,26,48,.84),rgba(6,14,28,.74));
    border:1px solid rgba(46,150,210,.35);border-radius:14px;
    backdrop-filter:blur(14px);
    box-shadow:0 0 44px rgba(0,110,200,.22),0 0 0 1px rgba(80,200,255,.06) inset;
    animation:fadeIn 2.2s ease both;
  }
  .panel h2{
    font-size:10.5px;letter-spacing:4px;color:#4d9dc8;font-weight:400;
    margin-bottom:16px;padding-bottom:9px;border-bottom:1px solid rgba(60,150,210,.2);
  }
  .row{margin-bottom:15px}
  .row .lab{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;letter-spacing:1.6px;color:#84b8d8;margin-bottom:7px;
  }
  .row .lab .val{color:#7ef2ff;font-size:12.5px;letter-spacing:.5px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
    background:linear-gradient(90deg,#1e8fd0,#8b5cf6);
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#e8d0ff,#a878ff 55%,#5b28c0);
    box-shadow:0 0 14px 2px rgba(150,110,255,.85);cursor:pointer;transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#e8d0ff,#a878ff 55%,#5b28c0);
    box-shadow:0 0 14px 2px rgba(150,110,255,.85);cursor:pointer;
  }

  .btns{display:flex;gap:10px;margin-top:18px}
  .btn{
    flex:1;padding:9px 0;font-family:inherit;font-size:11.5px;letter-spacing:1.6px;
    color:#7fdcff;background:rgba(8,26,46,.7);border:1px solid rgba(46,150,210,.5);
    border-radius:8px;cursor:pointer;transition:all .25s;
  }
  .btn:hover{color:#eafcff;border-color:#4fd6ff;background:rgba(24,96,148,.5);
    box-shadow:0 0 22px rgba(70,200,255,.45)}
  .btn.on{
    color:#04141f;background:linear-gradient(100deg,#45e6ff,#7fa8ff);
    border-color:transparent;box-shadow:0 0 26px rgba(90,210,255,.7);
  }

  /* ---------- 底部状态 ---------- */
  .status{
    position:fixed;left:44px;bottom:38px;z-index:10;pointer-events:none;
    font-size:11.5px;letter-spacing:1.7px;color:#527d9e;
    text-shadow:0 0 12px rgba(0,150,255,.45);
    animation:fadeIn 2.6s ease both;
  }
  .status .k{color:#35e0ff}
  .status .v{color:#b98cff}
  .status div{margin-top:5px}

  @media(max-width:860px){
    .hud{top:20px;left:18px}
    .formula{font-size:12.5px;padding:8px 13px}
    .en{letter-spacing:2.4px;margin-bottom:14px}
    .panel{right:12px;bottom:12px;left:12px;width:auto;padding:16px 16px 14px}
    .status{display:none}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="hud">
  <div class="tag">物 理 现 象</div>
  <h1>球 谐 函 数</h1>
  <div class="en">SPHERICAL HARMONICS · ANGULAR VIBRATION MODES</div>

  <div class="formula">
    Y<sub>l</sub><sup>m</sup>(θ,φ) <span class="op">∝</span>
    P<sub>l</sub><sup>m</sup>(cos θ) · e<sup>imφ</sup>
  </div><br>

  <div class="formula">
    <span class="fn">L̂</span><sup>2</sup> Y<sub>l</sub><sup>m</sup>
    <span class="op">=</span>
    <span class="num">l</span>(<span class="num">l</span>+1)ℏ<sup>2</sup> Y<sub>l</sub><sup>m</sup>
  </div>

  <div class="info">
    当前模式 <b id="modeTxt">l = 2, m = 0</b><br>
    角向波节数 = <b id="nodeTxt">2</b> &nbsp;|&nbsp; 花瓣数 = <b id="petalTxt">4</b><br>
    <span class="dim">勒让德多项式 P<sub>l</sub><sup>m</sup>(cos θ) 决定花瓣状角分布</span>
  </div>
</div>

<div class="status">
  <div>本征值 <span class="k">l(l+1)</span> = <span class="v" id="eigenTxt">6</span></div>
  <div>磁量子数 m ∈ [−l, l] &nbsp;·&nbsp; 共 <span class="k" id="degTxt">5</span> 个简并态</div>
  <div>氢原子角向波函数 · 球对称本征振动</div>
</div>

<div class="panel">
  <h2>参 数 控 制</h2>

  <div class="row">
    <div class="lab"><span>角量子数 l</span><span class="val" id="lVal">2</span></div>
    <input type="range" id="lSlider" min="0" max="7" step="1" value="2">
  </div>

  <div class="row">
    <div class="lab"><span>磁量子数 m</span><span class="val" id="mVal">0</span></div>
    <input type="range" id="mSlider" min="-2" max="2" step="1" value="0">
  </div>

  <div class="btns">
    <button class="btn on" id="autoBtn">◉ 自动演化</button>
    <button class="btn" id="audioBtn">♪ 音效</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================================
   1. 参数
   ========================================================= */
const COUNT   = 16000;         // 球面采样点数
const MAX_L   = 7;
const AMP     = 0.58;          // 径向振幅
const GOLDEN  = Math.PI * (3 - Math.sqrt(5));

const params = { l: 2, m: 0, auto: true };

/* =========================================================
   2. 球谐函数计算
   ========================================================= */
const FACT = [1];
for (let i = 1; i <= 24; i++) FACT[i] = FACT[i - 1] * i;
const fact = n => (n < 0 ? 0 : FACT[Math.min(n, 24)]);

/** 关联勒让德多项式 P_l^m(x)，m ≥ 0 */
function plgndr(l, m, x) {
  if (m < 0 || m > l) return 0;
  let pmm = 1.0;
  if (m > 0) {
    const somx2 = Math.sqrt(Math.max(0, (1 - x) * (1 + x)));
    let f = 1.0;
    for (let i = 1; i <= m; i++) {
      pmm *= -f * somx2;
      f += 2.0;
    }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1;
    pmmp1 = pll;
  }
  return pll;
}

/** 实球谐函数 Y_lm（含归一化） */
function sphReal(l, m, theta, phi) {
  const am = Math.abs(m);
  const x  = Math.cos(theta);
  const P  = plgndr(l, am, x);
  const norm = Math.sqrt((2 * l + 1) / (4 * Math.PI) * fact(l - am) / fact(l + am));
  if (m > 0) return Math.SQRT2 * norm * P * Math.cos(am * phi);
  if (m < 0) return Math.SQRT2 * norm * P * Math.sin(am * phi);
  return norm * P;
}

/* =========================================================
   3. 渲染器 / 场景 / 相机
   ========================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.10;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 4.6);
camera.lookAt(0, 0, 0);

/* =========================================================
   4. 背景辉光 + 星尘
   ========================================================= */
function radialTex(c0, c1, c2) {
  const s = 256, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, c0); g.addColorStop(0.45, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
}

const bgGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radialTex('rgba(70,40,200,0.40)', 'rgba(30,60,170,0.10)', 'rgba(0,0,0,0)'),
  blending: THREE.AdditiveBlending,
  depthWrite: false, transparent: true, opacity: 0.55
}));
bgGlow.scale.set(14, 14, 1);
bgGlow.position.z = -6;
scene.add(bgGlow);

(function stars() {
  const N = 1000;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r  = 20 + Math.random() * 45;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.7;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    size: 0.06, color: 0x6fb4ff, transparent: true, opacity: 0.55,
    sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const p = new THREE.Points(g, m);
  p.name = 'stars';
  scene.add(p);
})();

/* =========================================================
   5. 球面点云生成（Fibonacci 均匀分布）
   ========================================================= */
const sphereGroup = new THREE.Group();
scene.add(sphereGroup);

const DIRS  = new Float32Array(COUNT * 3);   // 单位方向向量
const THETAS = new Float32Array(COUNT);
const PHIS   = new Float32Array(COUNT);

for (let i = 0; i < COUNT; i++) {
  const y  = 1 - (i / (COUNT - 1)) * 2;
  const rr = Math.sqrt(Math.max(0, 1 - y * y));
  const th = GOLDEN * i;

  const x = Math.cos(th) * rr;
  const z = Math.sin(th) * rr;

  DIRS[i * 3]     = x;
  DIRS[i * 3 + 1] = y;
  DIRS[i * 3 + 2] = z;

  THETAS[i] = Math.acos(Math.max(-1, Math.min(1, y)));
  let ph = Math.atan2(z, x);
  PHIS[i] = ph;
}

/* =========================================================
   6. 着色器
   ========================================================= */
const VERT = `
  attribute float aY;
  uniform float uTime;
  uniform float uAmp;
  uniform float uPointScale;
  varying float vY;

  void main() {
    vY = aY;

    // 振动脉动：模式随时间呼吸
    float pulse = 1.0 + 0.055 * sin(uTime * 1.9 + aY * 2.2);

    // 径向位移 r = 1 + A·Y_lm(θ,φ)
    float r = 1.0 + uAmp * aY * pulse;

    vec3 p = position * r;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);

    gl_Position = projectionMatrix * mv;

    // 点尺寸：|Y| 越大点越大
    gl_PointSize = uPointScale * (0.0065 + 0.016 * abs(aY)) / max(0.001, -mv.z);
  }
`;

const FRAG = `
  varying float vY;
  uniform float uHueShift;

  vec3 hsl2rgb(float h, float s, float l) {
    vec3 rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
    return l + s * (rgb - 0.5) * (1.0 - abs(2.0 * l - 1.0));
  }

  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if (d > 0.5) discard;

    float a = smoothstep(0.5, 0.0, d);
    a = pow(a, 1.7);

    // 颜色映射：Y < 0 → 蓝紫；Y ≈ 0 → 青绿；Y > 0 → 橙红
    float t01 = clamp(vY * 0.5 + 0.5, 0.0, 1.0);
    float hue = fract(0.68 - t01 * 0.68 + uHueShift);
    float sat = 0.96;
    float lig = 0.50 + 0.16 * abs(vY);

    vec3 rgb = hsl2rgb(hue, sat, lig);

    gl_FragColor = vec4(rgb, a * 0.95);
  }
`;

const yAttr = new THREE.BufferAttribute(new Float32Array(COUNT), 1);
yAttr.setUsage(THREE.DynamicDrawUsage);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(DIRS, 3));
geo.setAttribute('aY', yAttr);

const uniforms = {
  uTime:       { value: 0 },
  uAmp:        { value: AMP },
  uPointScale: { value: 800 },
  uHueShift:   { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  vertexShader: VERT,
  fragmentShader: FRAG,
  uniforms,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true
});

const points = new THREE.Points(geo, mat);
sphereGroup.add(points);

/* ---- 淡光晕层（同几何，更大点） ---- */
const haloMat = new THREE.ShaderMaterial({
  vertexShader: VERT,
  fragmentShader: `
    varying float vY;
    uniform float uHueShift;
    vec3 hsl2rgb(float h, float s, float l) {
      vec3 rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
      return l + s * (rgb - 0.5) * (1.0 - abs(2.0 * l - 1.0));
    }
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d);
      a = pow(a, 2.4);
      float t01 = clamp(vY * 0.5 + 0.5, 0.0, 1.0);
      float hue = fract(0.68 - t01 * 0.68 + uHueShift);
      vec3 rgb = hsl2rgb(hue, 0.95, 0.55);
      gl_FragColor = vec4(rgb, a * 0.085);
    }
  `,
  uniforms: {
    uTime:       uniforms.uTime,
    uAmp:        { value: AMP * 1.04 },
    uPointScale: { value: 800 },
    uHueShift:   uniforms.uHueShift
  },
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true
});

const halo = new THREE.Points(geo, haloMat);
sphereGroup.add(halo);

/* ---- 参考球线框 ---- */
const wire = new THREE.Mesh(
  new THREE.SphereGeometry(1.0, 28, 18),
  new THREE.MeshBasicMaterial({
    color: 0x1a4a78, wireframe: true,
    transparent: true, opacity: 0.08,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
sphereGroup.add(wire);

/* =========================================================
   7. 模式切换
   ========================================================= */
const yRaw = new Float32Array(COUNT);

function updateMode() {
  const l = params.l;
  const m = params.m;

  let maxAbs = 0;

  for (let i = 0; i < COUNT; i++) {
    const v = sphReal(l, m, THETAS[i], PHIS[i]);
    yRaw[i] = v;
    const av = Math.abs(v);
    if (av > maxAbs) maxAbs = av;
  }
  if (maxAbs < 1e-12) maxAbs = 1;

  const inv = 1 / maxAbs;
  const arr = yAttr.array;
  for (let i = 0; i < COUNT; i++) arr[i] = yRaw[i] * inv;
  yAttr.needsUpdate = true;

  /* ---- 更新 HUD ---- */
  modeTxt.textContent = `l = ${l}, m = ${m}`;
  lVal.textContent = l;
  mVal.textContent = m;

  const eigen = l * (l + 1);
  eigenTxt.textContent = eigen;
  degTxt.textContent = 2 * l + 1;

  // 角向波节：θ 方向节点数 = l - |m|，φ 方向节点数 = |m|
  const nodes = (l - Math.abs(m)) + (Math.abs(m) > 0 ? 2 * Math.abs(m) : 0);
  nodeTxt.textContent = Math.max(0, l - Math.abs(m));

  // 花瓣数：|m| > 0 时约 2|m|，否则球状
  const petals = Math.abs(m) > 0 ? 2 * Math.abs(m) : 1;
  petalTxt.textContent = petals;
}

/* =========================================================
   8. 后期辉光
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.15,   // 强度
  0.68,   // 半径
  0.12    // 阈值
);
composer.addPass(bloom);

/* =========================================================
   9. 音频引擎
   ========================================================= */
let AC = null, masterGain = null, audioOn = false;

function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { return; }

  masterGain = AC.createGain();
  masterGain.gain.setValueAtTime(0.0001, AC.currentTime);
  masterGain.connect(AC.destination);

  /* ---- 低频 drone ---- */
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 320;
  lp.Q.value = 4.4;
  lp.connect(masterGain);

  [55, 82.5, 110, 138.6, 165, 220].forEach((f, i) => {
    const o = AC.createOscillator();
    o.type = (i % 2 === 0) ? 'sine' : 'sawtooth';
    o.frequency.value = f;
    o.detune.value = (i - 2.5) * 6;
    const g = AC.createGain();
    g.gain.value = 0.080 / (i * 0.68 + 1);
    o.connect(g); g.connect(lp);
    o.start();
  });

  const lfo = AC.createOscillator();
  lfo.frequency.value = 0.050;
  const lg = AC.createGain();
  lg.gain.value = 185;
  lfo.connect(lg); lg.connect(lp.frequency);
  lfo.start();

  /* ---- 带通噪声铺底 ---- */
  const len = Math.floor(AC.sampleRate * 5);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const dd = buf.getChannelData(0);
  for (let i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;

  const ns = AC.createBufferSource();
  ns.buffer = buf; ns.loop = true;

  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1150; bp.Q.value = 0.85;

  const ng = AC.createGain(); ng.gain.value = 0.028;

  ns.connect(bp); bp.connect(ng); ng.connect(masterGain);
  ns.start();

  const nLfo = AC.createOscillator();
  nLfo.frequency.value = 0.063;
  const nLg = AC.createGain(); nLg.gain.value = 760;
  nLfo.connect(nLg); nLg.connect(bp.frequency);
  nLfo.start();
}

/* ---- 模式切换铃声 ---- */
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];

function playBell(l, m) {
  if (!AC || !audioOn) return;
  const t0 = AC.currentTime;

  const idx = ((l * 3 + m + 30) % SCALE.length);
  const freq = 220 * Math.pow(2, (SCALE[idx] + l * 1.6) / 12);

  [[1, 0.085, 2.6],
   [2.004, 0.036, 1.9],
   [3.008, 0.014, 1.3]].forEach(([mult, amp, dur]) => {
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq * mult;

    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(amp, t0 + 0.016);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.3);
  });
}

/* =========================================================
   10. UI 绑定
   ========================================================= */
const lSlider  = document.getElementById('lSlider');
const mSlider  = document.getElementById('mSlider');
const lVal     = document.getElementById('lVal');
const mVal     = document.getElementById('mVal');
const modeTxt  = document.getElementById('modeTxt');
const nodeTxt  = document.getElementById('nodeTxt');
const petalTxt = document.getElementById('petalTxt');
const eigenTxt = document.getElementById('eigenTxt');
const degTxt   = document.getElementById('degTxt');
const autoBtn  = document.getElementById('autoBtn');
const audioBtn = document.getElementById('audioBtn');

function syncSliders() {
  lSlider.value = params.l;
  mSlider.min = -params.l;
  mSlider.max = params.l;
  if (params.m > params.l)  params.m = params.l;
  if (params.m < -params.l) params.m = -params.l;
  mSlider.value = params.m;
}

lSlider.addEventListener('input', () => {
  params.l = parseInt(lSlider.value, 10);
  params.auto = false;
  autoBtn.classList.remove('on');
  autoBtn.textContent = '◌ 自动演化';
  syncSliders();
  updateMode();
  playBell(params.l, params.m);
});

mSlider.addEventListener('input', () => {
  params.m = parseInt(mSlider.value, 10);
  params.auto = false;
  autoBtn.classList.remove('on');
  autoBtn.textContent = '◌ 自动演化';
  updateMode();
  playBell(params.l, params.m);
});

autoBtn.addEventListener('click', () => {
  params.auto = !params.auto;
  autoBtn.classList.toggle('on', params.auto);
  autoBtn.textContent = params.auto ? '◉ 自动演化' : '◌ 自动演化';
});

audioBtn.addEventListener('click', () => {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  audioOn = !audioOn;
  audioBtn.classList.toggle('on', audioOn);
  audioBtn.textContent = audioOn ? '♪ 音效开' : '♪ 音效';

  if (masterGain && AC) {
    masterGain.gain.cancelScheduledValues(AC.currentTime);
    masterGain.gain.setTargetAtTime(audioOn ? 0.5 : 0.0, AC.currentTime, 0.4);
  }
});

/* =========================================================
   11. 尺寸 / 点缩放
   ========================================================= */
function updatePointScale() {
  const h = renderer.domElement.height;
  const fov = camera.fov * Math.PI / 180;
  const scale = h / (2 * Math.tan(fov / 2));
  uniforms.uPointScale.value = scale;
  haloMat.uniforms.uPointScale.value = scale * 1.15;
}

/* =========================================================
   12. 动画循环
   ========================================================= */
const clock = new THREE.Clock();
const stars = scene.getObjectByName('stars');

let elapsed = 0;
let autoTimer = 0;
const AUTO_INTERVAL = 2.4;

let mx = 0, my = 0;
addEventListener('mousemove', e => {
  mx = (e.clientX / innerWidth) * 2 - 1;
  my = (e.clientY / innerHeight) * 2 - 1;
});

syncSliders();
updateMode();
updatePointScale();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;

  /* ---------- 自动演化：遍历 (l, m) 模式 ---------- */
  if (params.auto) {
    autoTimer += dt;
    if (autoTimer >= AUTO_INTERVAL) {
      autoTimer = 0;

      let nl = params.l;
      let nm = params.m + 1;

      if (nm > nl) {
        nl += 1;
        nm = -nl;
        if (nl > MAX_L) { nl = 0; nm = 0; }
      }

      params.l = nl;
      params.m = nm;
      syncSliders();
      updateMode();
      playBell(params.l, params.m);
    }
  }

  /* ---------- 着色器时间 / 色相漂移 ---------- */
  uniforms.uTime.value = t;
  uniforms.uHueShift.value = 0.06 * Math.sin(t * 0.18);

  /* ---------- 球体旋转 ---------- */
  sphereGroup.rotation.y = t * 0.22;
  sphereGroup.rotation.x = Math.sin(t * 0.19) * 0.28;
  sphereGroup.rotation.z = Math.sin(t * 0.13) * 0.09;

  /* ---------- 线框球呼吸 ---------- */
  wire.rotation.y = -t * 0.11;
  wire.material.opacity = 0.055 + 0.035 * Math.sin(t * 1.1);
  wire.scale.setScalar(1 + 0.012 * Math.sin(t * 1.4));

  /* ---------- 星尘 ---------- */
  if (stars) {
    stars.rotation.y = t * 0.008;
    stars.rotation.x = Math.sin(t * 0.035) * 0.06;
  }

  /* ---------- 背景辉光呼吸 ---------- */
  bgGlow.material.opacity = 0.48 + 0.10 * Math.sin(t * 0.6);
  bgGlow.scale.setScalar(13.5 + Math.sin(t * 0.45) * 0.8);

  /* ---------- 相机视差 ---------- */
  camera.position.x += (mx * 0.55 - camera.position.x) * 0.03;
  camera.position.y += (-my * 0.45 - camera.position.y) * 0.03;
  camera.position.z = 4.6 + Math.sin(t * 0.16) * 0.22;
  camera.lookAt(0, 0, 0);

  composer.render();
}

renderer.setAnimationLoop(animate);

/* =========================================================
   13. 自适应
   ========================================================= */
addEventListener('resize', () => {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  updatePointScale();
});
</script>
