<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椭球面调制曲线 · 空间几何之美</title>
    <style>
        :root {
            --bg: #04040e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.05rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.11em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(190, 165, 140, 0.5), 0 0 6px rgba(170, 148, 125, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.68rem, 1.25vw, 0.82rem);
            font-weight: 300;
            letter-spacing: 0.07em;
            color: rgba(200, 192, 180, 0.7);
            margin-top: 0.25em;
            text-shadow: 0 0 13px rgba(155, 140, 120, 0.3);
        }
        #formula-overlay {
            bottom: clamp(16px, 4vh, 44px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.68rem, 1.25vw, 0.92rem);
            font-style: italic;
            letter-spacing: 0.04em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(155, 140, 125, 0.42), 0 0 5px rgba(165, 148, 130, 0.28);
            line-height: 1.55;
            background: rgba(10, 9, 16, 0.48);
            padding: 0.42em 1.3em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(145, 125, 105, 0.22);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.35em 0.85em;
                letter-spacing: 0.03em;
                font-size: 0.62rem;
            }
            #title-overlay .title {
                letter-spacing: 0.07em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">椭球面调制曲线 · 空间几何之美</div>
        <div class="subtitle">Modulated Curves on an Oblate Spheroid</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            γ<sub>n</sub>(θ) = (a cos(φ(θ)) cosθ , a cos(φ(θ)) sinθ , c sin(φ(θ)))
            &emsp;|&emsp; φ(θ) = φ₀ + A·sin(nθ) , θ∈[0,2π]
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        // 扁椭球参数 (a > c, 赤道半径 > 极半径)
        const SPHEROID_A = 1.38; // 赤道半径
        const SPHEROID_C = 0.82; // 极半径
        const CURVE_SEGMENTS = 720;
        const TOTAL_VERTICES = CURVE_SEGMENTS + 1;

        // ==================== 三种颜色 ====================
        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');
        const THREE_COLORS = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x04040e, 0.00007);

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.35, 17);
        camera.position.set(0.5, 0.65, 4.2);
        camera.lookAt(0, 0.0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 主旋转组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 190;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 2.1 + Math.random() * 3.5;
            starPosArr[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phi) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xbdb6cf,
            size: 0.010,
            transparent: true,
            opacity: 0.30,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const starPts = new THREE.Points(starGeom, starMat);
        starsGroup.add(starPts);

        // 椭球面附近光点
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 75;
        const glowArr = new Float32Array(glowCount * 3);
        const phiG = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < glowCount; i++) {
            const y = 1 - (i / (glowCount - 1)) * 2;
            const rAtY = Math.sqrt(1 - y * y);
            const theta = phiG * i;
            glowArr[i * 3] = SPHEROID_A * rAtY * Math.cos(theta);
            glowArr[i * 3 + 1] = SPHEROID_A * rAtY * Math.sin(theta);
            glowArr[i * 3 + 2] = SPHEROID_C * y;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e4cc,
            size: 0.022,
            transparent: true,
            opacity: 0.46,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const glowPts = new THREE.Points(glowGeom, glowMat);
        glowGroup.add(glowPts);

        // ==================== 椭球面参考线框 ====================
        const spheroidWireGroup = new THREE.Group();
        mainGroup.add(spheroidWireGroup);
        const spheroidWireMats = [];

        // 纬线 (固定φ, θ从0到2π)
        function createSpheroidLatLine(phi) {
            const pts = [];
            const cosPhi = Math.cos(phi);
            const sinPhi = Math.sin(phi);
            const r = SPHEROID_A * cosPhi;
            const z = SPHEROID_C * sinPhi;
            const numPts = 240;
            for (let i = 0; i <= numPts; i++) {
                const theta = (i / numPts) * Math.PI * 2;
                pts.push(new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), z));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({
                color: 0x484460,
                transparent: true,
                opacity: 0.14,
                depthWrite: false,
            });
            spheroidWireMats.push(m);
            return new THREE.Line(g, m);
        }

        // 经线 (固定θ, φ从-π/2到π/2)
        function createSpheroidLongLine(theta) {
            const pts = [];
            const numPts = 200;
            for (let i = 0; i <= numPts; i++) {
                const phi = -Math.PI / 2 + (i / numPts) * Math.PI;
                const cosPhi = Math.cos(phi);
                const sinPhi = Math.sin(phi);
                pts.push(new THREE.Vector3(
                    SPHEROID_A * cosPhi * Math.cos(theta),
                    SPHEROID_A * cosPhi * Math.sin(theta),
                    SPHEROID_C * sinPhi
                ));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({
                color: 0x484460,
                transparent: true,
                opacity: 0.14,
                depthWrite: false,
            });
            spheroidWireMats.push(m);
            return new THREE.Line(g, m);
        }

        for (let i = 1; i <= 8; i++) {
            const phi = -Math.PI / 2 + (i / 9) * Math.PI;
            spheroidWireGroup.add(createSpheroidLatLine(phi));
        }
        for (let i = 0; i < 18; i++) {
            const theta = (i / 18) * Math.PI * 2;
            spheroidWireGroup.add(createSpheroidLongLine(theta));
        }
        // 赤道强调线
        {
            const eqPts = [];
            for (let i = 0; i <= 280; i++) {
                const theta = (i / 280) * Math.PI * 2;
                eqPts.push(new THREE.Vector3(SPHEROID_A * Math.cos(theta), SPHEROID_A * Math.sin(theta), 0));
            }
            const eqG = new THREE.BufferGeometry().setFromPoints(eqPts);
            const eqM = new THREE.LineBasicMaterial({
                color: 0x5c5680,
                transparent: true,
                opacity: 0.20,
                depthWrite: false,
            });
            spheroidWireMats.push(eqM);
            spheroidWireGroup.add(new THREE.Line(eqG, eqM));
        }

        // ==================== 椭球面调制曲线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        // 定义曲线参数: [n, φ₀, A] 每组对应一种颜色
        // 颜色1 - 金色（低纬度，大振幅）
        const goldParams = [
            [2, 0.22, 0.42],
            [3, 0.18, 0.40],
            [4, 0.24, 0.38],
            [5, 0.20, 0.41],
            [6, 0.23, 0.39],
            [7, 0.19, 0.40],
        ];
        // 颜色2 - 玫瑰粉（中等纬度，中等振幅）
        const roseParams = [
            [2, 0.50, 0.26],
            [3, 0.48, 0.28],
            [4, 0.52, 0.24],
            [5, 0.49, 0.27],
            [6, 0.51, 0.25],
            [7, 0.48, 0.27],
        ];
        // 颜色3 - 青蓝（较高纬度，小振幅）
        const cyanParams = [
            [2, 0.72, 0.17],
            [3, 0.70, 0.19],
            [4, 0.73, 0.16],
            [5, 0.71, 0.18],
            [6, 0.70, 0.19],
            [7, 0.72, 0.17],
        ];

        const allParamGroups = [
            { params: goldParams, color: COLOR_WARM_GOLD },
            { params: roseParams, color: COLOR_ROSE },
            { params: cyanParams, color: COLOR_CYAN },
        ];

        allParamGroups.forEach(group => {
            group.params.forEach(([n, phi0, A]) => {
                const positions = new Float32Array(TOTAL_VERTICES * 3);
                for (let i = 0; i <= CURVE_SEGMENTS; i++) {
                    const theta = (i / CURVE_SEGMENTS) * Math.PI * 2;
                    const phi = phi0 + A * Math.sin(n * theta);
                    const cosPhi = Math.cos(phi);
                    const sinPhi = Math.sin(phi);
                    positions[i * 3] = SPHEROID_A * cosPhi * Math.cos(theta);
                    positions[i * 3 + 1] = SPHEROID_A * cosPhi * Math.sin(theta);
                    positions[i * 3 + 2] = SPHEROID_C * sinPhi;
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setDrawRange(0, 0);
                const material = new THREE.LineBasicMaterial({
                    color: group.color,
                    transparent: true,
                    opacity: 0.82,
                    depthWrite: false,
                });
                const line = new THREE.Line(geometry, material);
                allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
                curvesGroup.add(line);
            });
        });

        const totalCurves = allCurveData.length; // 18条

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        clock.getDelta();

        function getCycleTime() {
            const now = performance.now() / 1000;
            return (now - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            // 主旋转
            mainGroup.rotation.y += 0.22 * dt;
            mainGroup.rotation.x += 0.055 * dt;
            mainGroup.rotation.z += 0.015 * Math.sin(cycleTime * 0.62) * dt;

            // 相机微动
            const sway = 0.11 * Math.sin(cycleTime * (Math.PI * 2 / 35));
            camera.position.y = 0.65 + sway;
            camera.lookAt(0, 0.0, 0);

            // 绘制进度
            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            // 更新所有曲线绘制范围
            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            // 背景透明度渐变
            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.30 * bgOp;
            glowMat.opacity = 0.46 * bgOp;
            for (const mat of spheroidWireMats) {
                mat.opacity = (mat.opacity ?? 0.14) * bgOp;
            }

            // 粒子微动
            glowGroup.position.z = Math.sin(cycleTime * 1.05) * 0.028;
            starsGroup.rotation.y += dt * 0.035;
            starsGroup.rotation.x += dt * 0.022;

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 可选重置键
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        // 预热渲染，防止第一帧空白
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🔮 椭球面调制曲线动画已启动');
        console.log(`   - ${totalCurves} 条闭合曲线，3种颜色各${totalCurves / 3}条`);
        console.log(`   - 扁椭球参数：赤道半径=${SPHEROID_A}，极半径=${SPHEROID_C}`);
        console.log(`   - 采样点：${CURVE_SEGMENTS}，周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
