<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>布拉格定律 · 发光晶体蜘蛛</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
  }
  #app { display: flex; height: 100%; width: 100%; }

  /* ---------------- 左侧：布拉格定律 ---------------- */
  #left {
    width: 20%;
    min-width: 168px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 46%, rgba(110, 60, 220, 0.17), transparent 66%),
      radial-gradient(circle at 50% 52%, rgba(0, 150, 150, 0.11), transparent 88%);
    border-right: 1px solid rgba(140, 110, 255, 0.12);
    overflow: hidden;
  }
  #left::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(150, 120, 255, 0.024) 0px,
      rgba(150, 120, 255, 0.024) 1px,
      transparent 1px,
      transparent 4px
    );
    pointer-events: none;
  }
  #bragg { width: 100%; height: 100%; display: block; }

  .halo { animation: haloPulse 5.4s ease-in-out infinite; }
  .core { animation: corePulse 5.4s ease-in-out infinite; }

  @keyframes haloPulse {
    0%, 100% { opacity: 0.13; }
    50%      { opacity: 0.78; }
  }
  @keyframes corePulse {
    0%, 100% { opacity: 0.80; }
    50%      { opacity: 1.00; }
  }

  /* ---------------- 右侧：晶体蜘蛛 ---------------- */
  #right {
    width: 80%;
    position: relative;
    overflow: hidden;
    background: #000205;
  }
  #webgl { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div id="app">

  <!-- ================= 左：布拉格定律 ================= -->
  <div id="left">
    <svg id="bragg" viewBox="0 0 320 560" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#7bf3ff"/>
          <stop offset="52%"  stop-color="#9d7bff"/>
          <stop offset="100%" stop-color="#e07bff"/>
        </linearGradient>
        <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="bigGlow" x="-140%" y="-140%" width="380%" height="380%">
          <feGaussianBlur stdDeviation="11"/>
        </filter>

        <g id="eqs" fill="url(#ng)">
          <!-- 标题 -->
          <text x="160" y="66" text-anchor="middle"
                font-size="17" letter-spacing="8"
                font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"
                fill="#c9a8ff" opacity="0.96">布拉格定律</text>

          <line x1="66" y1="90" x2="254" y2="90"
                stroke="#9d7bff" stroke-width="0.9" opacity="0.38"/>

          <!-- 主公式 -->
          <text x="160" y="164" text-anchor="middle"
                font-size="31" font-style="italic">2d sinθ = nλ</text>

          <line x1="66" y1="204" x2="254" y2="204"
                stroke="#9d7bff" stroke-width="0.9" opacity="0.30"/>

          <!-- 变量释义 -->
          <text x="46" y="256" font-size="17" font-style="italic">d</text>
          <text x="86" y="256" font-size="15"
                font-family="system-ui, 'PingFang SC', sans-serif">晶面间距</text>

          <text x="46" y="306" font-size="17" font-style="italic">θ</text>
          <text x="86" y="306" font-size="15"
                font-family="system-ui, 'PingFang SC', sans-serif">掠射角</text>

          <text x="46" y="356" font-size="17" font-style="italic">λ</text>
          <text x="86" y="356" font-size="15"
                font-family="system-ui, 'PingFang SC', sans-serif">X 射线波长</text>

          <text x="46" y="406" font-size="17" font-style="italic">n</text>
          <text x="86" y="406" font-size="15"
                font-family="system-ui, 'PingFang SC', sans-serif">衍射级数</text>

          <line x1="66" y1="446" x2="254" y2="446"
                stroke="#9d7bff" stroke-width="0.9" opacity="0.30"/>

          <!-- 结论 -->
          <text x="160" y="492" text-anchor="middle" font-size="14"
                font-family="system-ui, 'PingFang SC', sans-serif"
                opacity="0.78">满足条件时发生相长干涉</text>
          <text x="160" y="520" text-anchor="middle" font-size="13"
                font-family="system-ui, 'PingFang SC', sans-serif"
                opacity="0.55">晶体原子层 → 衍射图样</text>
        </g>
      </defs>

      <!-- 外发光层 -->
      <use href="#eqs" class="halo" filter="url(#bigGlow)"/>
      <!-- 清晰层 -->
      <use href="#eqs" class="core" filter="url(#softGlow)"/>
    </svg>
  </div>

  <!-- ================= 右：Three.js 晶体蜘蛛 ================= -->
  <div id="right">
    <canvas id="webgl"></canvas>
  </div>

</div>

<!-- ================= Three.js 及后处理 ================= -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
(function () {
"use strict";

/* =========================================================
   0. 工具
   ========================================================= */
const TAU = Math.PI * 2;
const UP = new THREE.Vector3(0, 1, 0);

const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _q1 = new THREE.Quaternion();
const _q2 = new THREE.Quaternion();

function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
function smoothstep(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
function deg(d) { return d * Math.PI / 180; }

/* 斐波那契球面均匀分布 */
function fibDir(i, n) {
  const y = 1 - (i / (n - 1)) * 2;
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  const th = i * 2.399963229728653;
  return new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r);
}

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const container = document.getElementById('right');
const canvas = document.getElementById('webgl');

const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000205, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x00060c, 0.024);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
camera.position.set(0, 3.2, 10.5);
camera.lookAt(0, 0.6, 0);

/* =========================================================
   2. 灯光（霓虹紫 + 青色）
   ========================================================= */
scene.add(new THREE.AmbientLight(0x1a1040, 1.6));

const lightA = new THREE.PointLight(0x9b30ff, 4.2, 44);
lightA.position.set(-7, 7, 6);
scene.add(lightA);

const lightB = new THREE.PointLight(0x00ffd5, 4.0, 44);
lightB.position.set(8, 5, -5);
scene.add(lightB);

const lightC = new THREE.PointLight(0x6a4cff, 2.6, 60);
lightC.position.set(0, -7, 4);
scene.add(lightC);

/* =========================================================
   3. 材质 & 几何体池
   ========================================================= */
const GEO_OCTA  = new THREE.OctahedronGeometry(1, 0);
const GEO_TETRA = new THREE.TetrahedronGeometry(1, 0);

function crystalMat(emissive, base, intensity) {
  return new THREE.MeshStandardMaterial({
    color: base,
    emissive: emissive,
    emissiveIntensity: intensity,
    metalness: 0.94,
    roughness: 0.14,
    flatShading: true
  });
}

const MAT_PURPLE  = crystalMat(0x8a2be2, 0x1c0436, 1.75);
const MAT_CYAN    = crystalMat(0x00e5d0, 0x032b29, 1.65);
const MAT_MAGENTA = crystalMat(0xc828ff, 0x2c0444, 1.95);
const MAT_TEAL    = crystalMat(0x2bffd0, 0x04403a, 1.85);

const MATS = [MAT_PURPLE, MAT_CYAN, MAT_MAGENTA, MAT_TEAL];

/* =========================================================
   4. 蜘蛛骨架
   ========================================================= */
const spider = new THREE.Group();
scene.add(spider);

const bodyGroup = new THREE.Group();
spider.add(bodyGroup);

/* 身体椭球半径 */
const RX = 0.95, RY = 0.78, RZ = 1.66;

/* ---------- 4.1 身体晶体壳 ---------- */
const bodyCrystals = [];

(function buildBodyShell() {
  const N = 84;
  for (let i = 0; i < N; i++) {
    const dir = fibDir(i + 0.5, N + 1);
    const p = dir.clone().multiply(new THREE.Vector3(RX, RY, RZ));

    const geo = Math.random() < 0.74 ? GEO_OCTA : GEO_TETRA;
    const mat = Math.random() < 0.5 ? MAT_PURPLE : MAT_CYAN;
    const m = new THREE.Mesh(geo, mat);

    /* 朝外方向 + 抖动 */
    const out = dir.clone().normalize();
    out.x += (Math.random() - 0.5) * 0.6;
    out.y += (Math.random() - 0.5) * 0.6;
    out.z += (Math.random() - 0.5) * 0.6;
    out.normalize();

    m.position.copy(p);
    m.quaternion.setFromUnitVectors(UP, out);
    m.rotateY(Math.random() * Math.PI);

    const size = 0.085 + Math.random() * 0.13;
    const sx = size * (0.72 + Math.random() * 0.55);
    m.scale.set(sx, size * (1.25 + Math.random() * 1.15), sx);

    bodyGroup.add(m);
    bodyCrystals.push({
      mesh: m,
      base: m.scale.clone(),
      delay: 0.10 + Math.random() * 0.55,
      phase: Math.random() * TAU,
      spin: (Math.random() - 0.5) * 0.8
    });
  }

  /* 大尖刺 */
  for (let i = 0; i < 14; i++) {
    const th = Math.random() * TAU;
    const ph = Math.acos(2 * Math.random() - 1);
    const dir = new THREE.Vector3(
      Math.sin(ph) * Math.cos(th),
      Math.cos(ph) * 0.82,
      Math.sin(ph) * Math.sin(th)
    ).normalize();

    const p = dir.clone().multiply(new THREE.Vector3(RX, RY, RZ));
    const m = new THREE.Mesh(GEO_OCTA, Math.random() < 0.5 ? MAT_MAGENTA : MAT_TEAL);
    m.position.copy(p);
    m.quaternion.setFromUnitVectors(UP, dir);
    m.rotateY(Math.random() * Math.PI);

    const sz = 0.11 + Math.random() * 0.09;
    const ln = 0.42 + Math.random() * 0.5;
    m.scale.set(sz, ln, sz);

    bodyGroup.add(m);
    bodyCrystals.push({
      mesh: m,
      base: m.scale.clone(),
      delay: 0.30 + Math.random() * 0.6,
      phase: Math.random() * TAU,
      spin: (Math.random() - 0.5) * 0.4
    });
  }
})();

/* ---------- 4.2 八条腿 ---------- */
const L1 = 1.35, L2 = 1.55, L3 = 1.05;
const RADII = [0.115, 0.090, 0.064, 0.040];  // 每段首尾半径
const SEG_CRYSTALS = 5;

const legs = [];
const legCrystals = [];   // 所有腿部晶体（统一更新）

(function buildLegs() {
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    for (let k = 0; k < 4; k++) {
      const idx = legs.length;

      /* 水平方位角：从正前方(+Z)绕 Y 轴 */
      const ang = deg((25 + k * 42) * sgn);
      const d = new THREE.Vector3(Math.sin(ang), 0, Math.cos(ang)).normalize();

      /* 腿根：椭球表面 */
      const sc = 1 / Math.sqrt((d.x / RX) * (d.x / RX) + (d.z / RZ) * (d.z / RZ));
      const root = new THREE.Vector3(d.x * sc * 0.92, 0.10, d.z * sc * 0.92);

      const leg = {
        root: root,
        d: d,
        idx: idx,
        phase: idx * 0.78,
        crystals: []
      };
      legs.push(leg);

      /* 每段腿的晶体 */
      for (let j = 0; j < 3; j++) {
        for (let c = 0; c < SEG_CRYSTALS; c++) {
          const f = (c + 0.5) / SEG_CRYSTALS;
          const mat = (j === 0)
            ? (Math.random() < 0.5 ? MAT_PURPLE : MAT_MAGENTA)
            : (Math.random() < 0.5 ? MAT_CYAN : MAT_TEAL);

          const mesh = new THREE.Mesh(GEO_OCTA, mat);
          spider.add(mesh);

          const entry = {
            mesh: mesh,
            leg: leg,
            seg: j,
            f: f,
            twist: Math.random() * Math.PI,
            sizeMul: 0.82 + Math.random() * 0.42,
            delay: idx * 0.07 + j * 0.11 + c * 0.035,
            phase: Math.random() * TAU
          };
          leg.crystals.push(entry);
          legCrystals.push(entry);
        }
      }

      /* 关节晶体 */
      for (let j = 0; j < 4; j++) {
        const mesh = new THREE.Mesh(GEO_OCTA, j % 2 === 0 ? MAT_MAGENTA : MAT_TEAL);
        const sz = 0.10 - j * 0.016;
        mesh.scale.set(sz, sz * 1.25, sz);
        spider.add(mesh);
        legCrystals.push({
          mesh: mesh,
          leg: leg,
          joint: j,
          sizeMul: 1,
          delay: idx * 0.07 + j * 0.09,
          phase: Math.random() * TAU
        });
      }
    }
  }
})();

/* ---------- 4.3 身体核心光 ---------- */
const coreLight = new THREE.PointLight(0xa860ff, 3.5, 14);
coreLight.position.set(0, 0.15, -0.15);
spider.add(coreLight);

/* =========================================================
   5. 地面辉光
   ========================================================= */
(function buildGround() {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0.00, 'rgba(150,80,255,0.60)');
  grd.addColorStop(0.28, 'rgba(80,130,255,0.22)');
  grd.addColorStop(0.60, 'rgba(0,220,200,0.07)');
  grd.addColorStop(1.00, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);

  const tex = new THREE.CanvasTexture(c);
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(26, 26),
    new THREE.MeshBasicMaterial({
      map: tex,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0.85
    })
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -0.35;
  scene.add(plane);
})();

/* =========================================================
   6. 漂浮碎晶
   ========================================================= */
const debris = [];
(function buildDebris() {
  for (let i = 0; i < 28; i++) {
    const geo = Math.random() < 0.55 ? GEO_OCTA : GEO_TETRA;
    const m = new THREE.Mesh(geo, MATS[(Math.random() * MATS.length) | 0]);

    const r = 5 + Math.random() * 11;
    const th = Math.random() * TAU;
    m.position.set(Math.cos(th) * r, Math.random() * 9 - 1.2, Math.sin(th) * r);

    const s = 0.05 + Math.random() * 0.16;
    m.scale.set(s, s * (1.1 + Math.random() * 1.4), s);

    m.userData = {
      rx: (Math.random() - 0.5) * 0.6,
      ry: (Math.random() - 0.5) * 0.6,
      rz: (Math.random() - 0.5) * 0.6,
      bob: Math.random() * TAU,
      y0: m.position.y
    };
    scene.add(m);
    debris.push(m);
  }
})();

/* =========================================================
   7. 闪烁粒子（自定义 Shader Points）
   ========================================================= */
let particles, particleMat;

(function buildParticles() {
  const COUNT = 900;
  const geo = new THREE.BufferGeometry();

  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  const siz = new Float32Array(COUNT);
  const pha = new Float32Array(COUNT);

  const cPurple = new THREE.Color(0xb066ff);
  const cCyan   = new THREE.Color(0x44ffe4);

  for (let i = 0; i < COUNT; i++) {
    const r = 3.5 + Math.random() * 15;
    const th = Math.random() * TAU;
    const ph = Math.acos(2 * Math.random() - 1);

    pos[i * 3 + 0] = Math.sin(ph) * Math.cos(th) * r;
    pos[i * 3 + 1] = Math.cos(ph) * r * 0.52 + 2.2;
    pos[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * r;

    const c = Math.random() < 0.5 ? cPurple : cCyan;
    const k = 0.55 + Math.random() * 0.65;
    col[i * 3 + 0] = c.r * k;
    col[i * 3 + 1] = c.g * k;
    col[i * 3 + 2] = c.b * k;

    siz[i] = 0.55 + Math.random() * 2.1;
    pha[i] = Math.random();
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));
  geo.setAttribute('aPhase',   new THREE.BufferAttribute(pha, 1));

  particleMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) }
    },
    vertexShader: [
      'attribute float aSize;',
      'attribute float aPhase;',
      'attribute vec3 aColor;',
      'uniform float uTime;',
      'uniform float uPixelRatio;',
      'varying vec3 vColor;',
      'varying float vAlpha;',
      'void main() {',
      '  vColor = aColor;',
      '  float tw = 0.30 + 0.70 * (0.5 + 0.5 * sin(uTime * 2.1 + aPhase * 6.2831));',
      '  vAlpha = tw;',
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
      '  gl_PointSize = aSize * uPixelRatio * (26.0 / max(0.001, -mv.z)) * (0.55 + 0.75 * tw);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vColor;',
      'varying float vAlpha;',
      'void main() {',
      '  vec2 uv = gl_PointCoord - 0.5;',
      '  float d = length(uv);',
      '  if (d > 0.5) discard;',
      '  float a = smoothstep(0.5, 0.0, d);',
      '  a = pow(a, 1.7);',
      '  gl_FragColor = vec4(vColor * (0.85 + 0.9 * vAlpha), a * vAlpha);',
      '}'
    ].join('\n'),
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true
  });

  particles = new THREE.Points(geo, particleMat);
  scene.add(particles);
})();

/* =========================================================
   8. 后处理（Bloom）
   ========================================================= */
let composer = null;
let bloomPass = null;

(function initPost() {
  try {
    if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass) {
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));

      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(1, 1),
        1.25,   // strength
        0.62,   // radius
        0.10    // threshold
      );
      composer.addPass(bloomPass);
    }
  } catch (e) {
    composer = null;
  }
})();

/* =========================================================
   9. 尺寸自适应
   ========================================================= */
function resize() {
  const rect = container.getBoundingClientRect();
  const w = Math.max(1, rect.width  || window.innerWidth  * 0.8);
  const h = Math.max(1, rect.height || window.innerHeight);

  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const pr = renderer.getPixelRatio();
  if (particleMat) particleMat.uniforms.uPixelRatio.value = pr;

  if (composer) {
    const size = renderer.getDrawingBufferSize(new THREE.Vector2());
    composer.setSize(size.width, size.height);
    if (bloomPass) bloomPass.setSize(size.width, size.height);
  }
}

window.addEventListener('resize', resize);
if (window.ResizeObserver) {
  new ResizeObserver(resize).observe(container);
}

/* =========================================================
   10. 动画核心
   ========================================================= */

/* 把晶体摆到 a→b 线段上的 f 位置 */
function placeCrystal(mesh, a, b, f, radius, height, twist, grow) {
  _v1.subVectors(b, a);
  const len = _v1.length() || 0.0001;
  _v1.divideScalar(len);

  mesh.position.copy(a).addScaledVector(_v1, len * f);

  _q1.setFromUnitVectors(UP, _v1);
  _q2.setFromAxisAngle(_v1, twist);
  mesh.quaternion.copy(_q1).multiply(_q2);

  mesh.scale.set(radius * grow, height * grow, radius * grow);
}

/* 计算一条腿的四个关节点 */
const _dirTmp = new THREE.Vector3();

function legJoints(leg, t) {
  const ph = t * 1.55 + leg.phase;

  /* 抬升角（正弦波驱动） */
  const e1 = 0.78 + 0.20 * Math.sin(ph);
  const e2 = -0.22 + 0.26 * Math.sin(ph + 1.45);
  const e3 = -0.92 + 0.22 * Math.sin(ph + 2.65);

  /* 水平摆幅 */
  const sw = 0.11 * Math.sin(ph * 0.72 + 0.6);
  _dirTmp.copy(leg.d).applyAxisAngle(UP, sw);

  const d = _dirTmp;
  const p0 = leg.root;

  _v2.copy(d).multiplyScalar(Math.cos(e1)).addScaledVector(UP, Math.sin(e1)).normalize();
  const p1 = p0.clone().addScaledVector(_v2, L1);

  _v2.copy(d).multiplyScalar(Math.cos(e2)).addScaledVector(UP, Math.sin(e2)).normalize();
  const p2 = p1.clone().addScaledVector(_v2, L2);

  _v2.copy(d).multiplyScalar(Math.cos(e3)).addScaledVector(UP, Math.sin(e3)).normalize();
  const p3 = p2.clone().addScaledVector(_v2, L3);

  return [p0, p1, p2, p3];
}

/* ---------- 主循环 ---------- */
let T = 0;
let lastT = performance.now();

function animate(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  dt = Math.min(dt, 0.05);
  T += dt;

  /* --- 相机轻缓环绕 --- */
  camera.position.x = Math.sin(T * 0.11) * 2.1;
  camera.position.z = 10.5 - Math.cos(T * 0.11) * 1.1;
  camera.position.y = 3.2 + Math.sin(T * 0.17) * 0.35;
  camera.lookAt(0, 0.62, 0);

  /* --- 灯光环绕（产生棱面闪烁） --- */
  lightA.position.set(Math.cos(T * 0.72) * 9.5, 6.5 + Math.sin(T * 0.95) * 2.2, Math.sin(T * 0.72) * 9.5);
  lightB.position.set(Math.cos(T * 0.51 + 2.3) * 9.5, 5.0 + Math.cos(T * 0.83) * 2.2, Math.sin(T * 0.51 + 2.3) * 9.5);

  /* --- 蜘蛛整体呼吸浮动 --- */
  spider.position.y = 0.18 * Math.sin(T * 0.95);
  spider.rotation.y = 0.16 * Math.sin(T * 0.27);
  spider.rotation.z = 0.035 * Math.sin(T * 0.61);

  coreLight.intensity = 3.0 + 1.8 * Math.sin(T * 2.4);

  /* --- 身体晶体生长 / 脉动 --- */
  for (let i = 0; i < bodyCrystals.length; i++) {
    const bc = bodyCrystals[i];
    const g = smoothstep((T * 0.85 - bc.delay) / 0.9);
    const pulse = 1 + 0.09 * Math.sin(T * 2.3 + bc.phase);
    const s = g * pulse;

    bc.mesh.visible = s > 0.02;
    if (bc.mesh.visible) {
      bc.mesh.scale.copy(bc.base).multiplyScalar(s);
      bc.mesh.rotateY(bc.spin * dt);
    }
  }

  /* --- 腿部晶体 --- */
  for (let li = 0; li < legs.length; li++) {
    const leg = legs[li];
    const pts = legJoints(leg, T);

    for (let ci = 0; ci < leg.crystals.length; ci++) {
      const cr = leg.crystals[ci];
      const mesh = cr.mesh;

      const g = smoothstep((T * 0.85 - cr.delay) / 0.95);
      const pulse = 1 + 0.10 * Math.sin(T * 2.8 + cr.phase);
      const grow = g * pulse;

      mesh.visible = grow > 0.02;
      if (!mesh.visible) continue;

      if (cr.joint !== undefined) {
        /* 关节晶体 */
        const jp = pts[cr.joint];
        _v2.copy(leg.d).multiplyScalar(0.25).addScaledVector(UP, 0.6).normalize();
        _v1.copy(jp).addScaledVector(_v2, 0.18);

        mesh.position.copy(jp);
        _q1.setFromUnitVectors(UP, _v1.sub(jp).normalize());
        mesh.quaternion.copy(_q1);
        mesh.rotateY(T * 0.8 + cr.phase);

        const sz = cr.sizeMul * grow;
        mesh.scale.set(0.105 * sz, 0.14 * sz, 0.105 * sz);
      } else {
        /* 段内晶体 */
        const a = pts[cr.seg];
        const b = pts[cr.seg + 1];
        const rA = RADII[cr.seg];
        const rB = RADII[cr.seg + 1];
        const radius = (rA + (rB - rA) * cr.f) * cr.sizeMul;

        /* 段长决定晶体高度 */
        _v1.subVectors(b, a);
        const segLen = _v1.length();
        const height = (segLen / SEG_CRYSTALS) * 0.72 * cr.sizeMul;

        placeCrystal(mesh, a, b, cr.f, radius, height, cr.twist + T * 0.35, grow);
      }
    }
  }

  /* --- 粒子 --- */
  if (particleMat) particleMat.uniforms.uTime.value = T;
  if (particles) {
    particles.rotation.y = T * 0.035;
    particles.rotation.x = Math.sin(T * 0.13) * 0.06;
  }

  /* --- 碎晶 --- */
  for (let i = 0; i < debris.length; i++) {
    const m = debris[i];
    const u = m.userData;
    m.rotation.x += u.rx * dt;
    m.rotation.y += u.ry * dt;
    m.rotation.z += u.rz * dt;
    m.position.y = u.y0 + Math.sin(T * 0.55 + u.bob) * 0.55;
  }

  /* --- 渲染 --- */
  if (composer) {
    composer.render(dt);
  } else {
    renderer.render(scene, camera);
  }

  requestAnimationFrame(animate);
}

/* =========================================================
   11. 启动
   ========================================================= */
resize();
requestAnimationFrame(animate);

})();
</script>
