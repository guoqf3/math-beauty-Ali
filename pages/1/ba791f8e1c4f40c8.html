<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>几何动物俄罗斯方块 · Geo Animal Tetris</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  /* ============ HUD ============ */
  #hud{
    position:fixed;top:0;left:0;right:0;
    padding:14px 22px;
    display:flex;justify-content:space-between;align-items:flex-start;
    z-index:20;pointer-events:none;
    opacity:0;animation:fade 1.2s 0.3s ease forwards;
  }
  .hud-block{display:flex;flex-direction:column;gap:4px;}
  .hud-block.right{text-align:right;align-items:flex-end;}

  .hud-en{
    font-size:8px;letter-spacing:.48em;text-indent:.48em;
    color:rgba(140,200,255,.38);font-weight:300;
  }
  .hud-main{
    font-size:clamp(14px,1.8vw,18px);
    font-weight:300;letter-spacing:.14em;
    color:rgba(220,235,255,.96);
  }
  .hud-sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;
    color:rgba(170,200,245,.52);
  }
  .hud-sub b{color:rgba(140,225,255,.94);font-weight:600;}

  .hud-score{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(18px,2.4vw,26px);
    font-weight:200;letter-spacing:.04em;
    color:rgba(200,235,255,.96);
    line-height:1;
    filter:drop-shadow(0 0 14px rgba(120,200,255,.45));
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), color .3s;
  }
  .hud-score.pop{
    transform:scale(1.22);
    color:rgba(180,255,220,.98);
  }
  @keyframes fade{to{opacity:1;}}

  /* ============ 进度条 ============ */
  #progress{
    position:fixed;top:74px;left:50%;transform:translateX(-50%);
    width:min(420px,86vw);
    height:6px;
    background:rgba(20,30,56,.72);
    border:1px solid rgba(120,155,230,.22);
    border-radius:5px;overflow:hidden;
    z-index:20;
    opacity:0;animation:fade 1.2s 0.6s ease forwards;
    pointer-events:none;
  }
  #progressFill{
    position:absolute;left:0;top:0;height:100%;
    width:0%;
    background:linear-gradient(90deg,#5ee0ff,#a090ff,#ffb060);
    box-shadow:0 0 14px rgba(140,200,255,.72);
    transition:width .35s cubic-bezier(.34,1.4,.64,1);
    border-radius:5px;
  }
  #progressLabel{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,245,.42);
    white-space:nowrap;
  }

  /* ============ 操作按钮 ============ */
  #controls{
    position:fixed;bottom:0;left:0;right:0;
    padding:0 18px 16px;
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    z-index:20;
    opacity:0;animation:fade 1.2s 1.0s ease forwards;
    pointer-events:none;
  }
  .ctrl-btn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:11px;letter-spacing:.14em;
    color:rgba(215,235,255,.96);
    background:linear-gradient(145deg,rgba(58,84,148,.62),rgba(32,46,92,.55));
    border:1px solid rgba(120,170,255,.34);
    border-radius:11px;
    padding:13px 20px;
    min-width:64px;
    cursor:pointer;
    transition:.22s cubic-bezier(.34,1.4,.64,1);
    box-shadow:
      0 6px 18px rgba(0,0,0,.34),
      inset 0 1px 0 rgba(180,215,255,.20);
    pointer-events:auto;
    white-space:nowrap;
    touch-action:manipulation;
  }
  .ctrl-btn:hover{
    transform:translateY(-2px);
    border-color:rgba(170,215,255,.72);
    box-shadow:
      0 10px 24px rgba(0,0,0,.42),
      0 0 22px rgba(100,170,255,.40),
      inset 0 1px 0 rgba(200,230,255,.30);
  }
  .ctrl-btn:active{
    transform:translateY(0) scale(.96);
    background:linear-gradient(145deg,rgba(76,108,180,.72),rgba(44,60,116,.62));
  }
  .ctrl-btn.big{
    padding:13px 30px;
    font-size:12px;
    letter-spacing:.20em;
  }

  /* ============ 音频指示 ============ */
  #audioDot{
    position:fixed;bottom:0;right:18px;
    padding-bottom:16px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.20em;
    color:rgba(160,200,240,.30);
    display:flex;align-items:center;gap:6px;
    opacity:0;animation:fade 1.2s 1.4s ease forwards;
    z-index:20;pointer-events:none;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }
  #audioDot.on{color:rgba(160,220,200,.52);}

  /* ============ Toast ============ */
  #toast{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.86);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(18px,2.6vw,30px);
    font-weight:300;letter-spacing:.28em;
    color:rgba(180,255,220,.98);
    text-shadow:0 0 32px rgba(120,240,190,.85);
    opacity:0;pointer-events:none;
    transition:opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
    z-index:100;
    white-space:nowrap;
    text-align:center;
  }
  #toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #toast.bad{
    color:rgba(255,170,140,.98);
    text-shadow:0 0 32px rgba(255,120,90,.85);
  }

  /* ============ 关卡过渡 ============ */
  #levelBanner{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.8);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(20px,3vw,36px);
    font-weight:300;letter-spacing:.32em;
    color:rgba(255,235,180,.98);
    text-shadow:
      0 0 40px rgba(255,200,100,.95),
      0 0 80px rgba(255,180,80,.62);
    opacity:0;pointer-events:none;
    transition:opacity .5s, transform .5s cubic-bezier(.34,1.6,.64,1);
    z-index:110;
    white-space:nowrap;
    text-align:center;
    padding:20px 40px;
    border-radius:18px;
    border:1px solid rgba(255,210,140,.62);
    background:rgba(50,32,12,.72);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  #levelBanner.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #levelBanner .sub{
    display:block;
    font-size:clamp(10px,1.3vw,13px);
    letter-spacing:.34em;
    color:rgba(255,225,175,.72);
    margin-top:12px;
  }

  @media (max-width:720px){
    #hud{padding:10px 14px;}
    .hud-en{display:none;}
    #progress{top:64px;width:92vw;}
    #controls{padding:0 10px 12px;gap:7px;}
    .ctrl-btn{padding:11px 14px;font-size:10px;min-width:52px;border-radius:9px;}
    .ctrl-btn.big{padding:11px 22px;font-size:11px;}
    #audioDot{right:12px;padding-bottom:12px;font-size:7.5px;}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-block">
    <div class="hud-en">GEO ANIMAL TETRIS</div>
    <div class="hud-main" id="animalName">猫</div>
    <div class="hud-sub">已填充 <b id="filledCount">0</b> / <b id="totalCount">0</b></div>
  </div>
  <div class="hud-block right">
    <div class="hud-score" id="scoreVal">0</div>
    <div class="hud-sub">分数</div>
  </div>
</div>

<div id="progress">
  <div id="progressFill"></div>
  <div id="progressLabel">拼出动物轮廓 · 填充所有虚线格</div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="btnLeft">◀</button>
  <button class="ctrl-btn" id="btnRotate">⟳</button>
  <button class="ctrl-btn" id="btnRight">▶</button>
  <button class="ctrl-btn" id="btnDown">▼</button>
  <button class="ctrl-btn big" id="btnDrop">落 下</button>
</div>

<div id="audioDot">
  <span class="dot"></span>
  <span>背景音 · 交互音</span>
</div>

<div id="toast"></div>
<div id="levelBanner"></div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let cellSize = 32;
let boardX = 0, boardY = 0;

const COLS = 10;
const ROWS = 14;

/* =========================================================
   动物图案
   ========================================================= */
const ANIMALS = [
  {
    id: 'cat',
    name: '猫',
    en: 'CAT',
    hue: 200,
    pattern: [
      "..........",
      "..........",
      "..........",
      "..........",
      ".X......X.",
      "XX.....XX.",
      "XXXXXXXXX.",
      "XXXXXXXXX.",
      ".XXXXXXX..",
      "..XXXXX...",
      "XXXXXXXX..",
      "XXXXXXXX..",
      ".XX..XX...",
      ".........."
    ]
  },
  {
    id: 'dog',
    name: '狗',
    en: 'DOG',
    hue: 36,
    pattern: [
      "..........",
      "..........",
      "..........",
      "..........",
      ".X......X.",
      "XX......XX",
      "XXXXXXXXXX",
      "XXXXXXXXXX",
      ".XXXXXXXX.",
      "..XXXXXX..",
      "XXXXXXXXX.",
      "XXXXXXXXX.",
      ".XX...XX..",
      ".........."
    ]
  },
  {
    id: 'bird',
    name: '鸟',
    en: 'BIRD',
    hue: 280,
    pattern: [
      "..........",
      "..........",
      "..........",
      "....XX....",
      "...XXXX...",
      "..XXXXXX..",
      ".XXXXXXXX.",
      "XXXXXXXXXX",
      "XXXXXXXXXX",
      ".XXXXXXXX.",
      "..XXXXXX..",
      "..X....X..",
      "..........",
      ".........."
    ]
  }
];

let animalIndex = 0;
let currentAnimal = ANIMALS[0];

/* =========================================================
   棋盘状态
   ========================================================= */
let board = [];       /* null 或 {shape, hue, filled} */
let targetMask = [];  /* 布尔：是否是目标剪影格子 */
let totalTargets = 0;

/* =========================================================
   几何形状池
   ========================================================= */
const GEO_SHAPES = ['triangle', 'circle', 'square', 'hexagon', 'diamond', 'star'];

const GEO_HUES = [195, 220, 260, 320, 36, 160, 280, 55];

/* =========================================================
   方块形状定义
   ========================================================= */
const PIECE_SHAPES = [
  { m: [[1,1,1,1]] },         /* I */
  { m: [[1],[1],[1],[1]] },   /* 竖 I */
  { m: [[1,1],[1,1]] },       /* O */
  { m: [[0,1,0],[1,1,1]] },   /* T */
  { m: [[1,0],[1,0],[1,1]] }, /* L */
  { m: [[0,1],[0,1],[1,1]] }, /* J */
  { m: [[0,1,1],[1,1,0]] },   /* S */
  { m: [[1,1,0],[0,1,1]] },   /* Z */
  { m: [[1,1,1]] },           /* 短 I */
  { m: [[1,1],[1,0]] },       /* 小 L */
  { m: [[1,1]] }              /* 二连 */
];

/* =========================================================
   下落方块
   ========================================================= */
let activePiece = null;
let nextPiece = null;
let dropTimer = 0;
let dropInterval = 620;

/* =========================================================
   游戏状态
   ========================================================= */
let score = 0;
let state = 'playing';    /* playing / complete / gameover */
let levelCompleteTimer = 0;
let shakeTimer = 0;
let shakeAmount = 0;

/* 粒子 */
const particles = [];

/* =========================================================
   音效系统
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let ambienceOn = false;
let bubbleTimer = null;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.50, ac.currentTime, 1.6);

  startAmbience();
  scheduleBubble();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioDot(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioDot(true);
  }
}

/* ---- 背景：梦幻氛围 ---- */
function startAmbience(){
  if (ambienceOn) return;
  ambienceOn = true;

  const now = ac.currentTime;

  /* 低频嗡鸣 */
  const o1 = ac.createOscillator();
  o1.type = 'sine';
  o1.frequency.value = 52;

  const o2 = ac.createOscillator();
  o2.type = 'sine';
  o2.frequency.value = 78;

  const o3 = ac.createOscillator();
  o3.type = 'triangle';
  o3.frequency.value = 104;

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 320;
  lp.Q.value = 1.8;

  const g = ac.createGain();
  g.gain.value = 0;
  g.gain.setTargetAtTime(0.028, now, 3.0);

  const g3 = ac.createGain();
  g3.gain.value = 0.16;

  o1.connect(lp);
  o2.connect(lp);
  o3.connect(g3);
  g3.connect(lp);
  lp.connect(g);
  g.connect(master);

  o1.start(); o2.start(); o3.start();

  /* 缓慢起伏 */
  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.048;
  const lg = ac.createGain();
  lg.gain.value = 0.012;
  lfo.connect(lg);
  lg.connect(g.gain);
  lfo.start();

  /* 滤波器漂移 */
  const flfo = ac.createOscillator();
  flfo.frequency.value = 0.036;
  const flg = ac.createGain();
  flg.gain.value = 120;
  flfo.connect(flg);
  flg.connect(lp.frequency);
  flfo.start();
}

/* ---- 气泡音 ---- */
function playBubble(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const f0 = 280 + Math.random() * 460;
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f0 * 1.7, now + 0.06);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.012 + Math.random() * 0.008, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.10);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.12);
}

function scheduleBubble(){
  if (bubbleTimer) clearTimeout(bubbleTimer);
  const wait = 1200 + Math.random() * 2800;
  bubbleTimer = setTimeout(function(){
    if (audioReady && ac && ac.state === 'running'){
      playBubble();
    }
    scheduleBubble();
  }, wait);
}

/* ---- 移动：轻微点击 ---- */
function playMove(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, now);
  osc.frequency.exponentialRampToValueAtTime(620, now + 0.04);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.008, now + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.07);
}

/* ---- 旋转：嗖 ---- */
function playRotate(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(360, now);
  osc.frequency.exponentialRampToValueAtTime(740, now + 0.10);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.016, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.14);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.16);
}

/* ---- 锁定：闷响 ---- */
function playLand(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.exponentialRampToValueAtTime(72, now + 0.14);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.032, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.22);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.24);
}

/* ---- 填充：清脆铃音 ---- */
function playFill(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const f = 660 + Math.random() * 320;
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 1.5, now + 0.09);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.020, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.20);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.22);

  /* 泛音 */
  const osc2 = ac.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = f * 2;
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0, now + 0.02);
  g2.gain.linearRampToValueAtTime(0.008, now + 0.03);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
  osc2.connect(g2);
  g2.connect(master);
  osc2.start(now + 0.02);
  osc2.stop(now + 0.17);
}

/* ---- 完成动物：上行和弦 ---- */
function playComplete(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.075;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.042, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.8);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 2.0);

    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = notes[i] * 2;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.03);
    g2.gain.linearRampToValueAtTime(0.012, t0 + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.03);
    osc2.stop(t0 + 1.4);
  }
}

/* ---- 游戏结束 ---- */
function playGameOver(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [392.00, 311.13, 261.63, 196.00];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.16;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.034, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 0.7);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 0.8);
  }
}

/* =========================================================
   工具
   ========================================================= */
function randShape(){
  return GEO_SHAPES[Math.floor(Math.random() * GEO_SHAPES.length)];
}

function randHue(){
  return GEO_HUES[Math.floor(Math.random() * GEO_HUES.length)];
}

function makeCell(){
  return {
    shape: randShape(),
    hue: randHue()
  };
}

/* 从矩阵构建带元数据的方块 */
function buildPiece(shapeDef){
  const m = shapeDef.m;
  const grid = [];

  for (let r = 0; r < m.length; r++){
    const row = [];
    for (let c = 0; c < m[r].length; c++){
      if (m[r][c]){
        row.push(makeCell());
      } else {
        row.push(null);
      }
    }
    grid.push(row);
  }

  return {
    grid: grid,
    x: Math.floor((COLS - grid[0].length) / 2),
    y: -grid.length
  };
}

function randomPiece(){
  const def = PIECE_SHAPES[Math.floor(Math.random() * PIECE_SHAPES.length)];
  return buildPiece(def);
}

function rotateGrid(grid){
  const rows = grid.length;
  const cols = grid[0].length;
  const out = [];

  for (let c = 0; c < cols; c++){
    const row = [];
    for (let r = rows - 1; r >= 0; r--){
      row.push(grid[r][c]);
    }
    out.push(row);
  }

  return out;
}

/* =========================================================
   布局
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const topPad = 104;
  const bottomPad = 96;
  const sidePad = 20;

  const availW = W - sidePad * 2;
  const availH = H - topPad - bottomPad;

  cellSize = Math.floor(Math.min(availW / COLS, availH / ROWS));
  cellSize = Math.max(18, Math.min(cellSize, 46));

  const boardW = cellSize * COLS;
  const boardH = cellSize * ROWS;

  boardX = (W - boardW) / 2;
  boardY = topPad + (availH - boardH) / 2;
}
window.addEventListener('resize', resize);

/* =========================================================
   初始化棋盘
   ========================================================= */
function initBoard(){
  board = [];
  targetMask = [];
  totalTargets = 0;

  for (let r = 0; r < ROWS; r++){
    const row = [];
    const maskRow = [];
    for (let c = 0; c < COLS; c++){
      row.push(null);
      const isTarget = currentAnimal.pattern[r][c] === 'X';
      maskRow.push(isTarget);
      if (isTarget) totalTargets++;
    }
    board.push(row);
    targetMask.push(maskRow);
  }

  const totalEl = document.getElementById('totalCount');
  if (totalEl) totalEl.textContent = totalTargets;
}

/* =========================================================
   碰撞检测
   ========================================================= */
function collide(grid, px, py){
  for (let r = 0; r < grid.length; r++){
    for (let c = 0; c < grid[r].length; c++){
      if (!grid[r][c]) continue;

      const br = py + r;
      const bc = px + c;

      if (bc < 0 || bc >= COLS) return true;
      if (br >= ROWS) return true;

      if (br < 0) continue;

      /* 只有已经被填充的剪影格子或已放置的方块才算碰撞 */
      if (board[br][bc] && board[br][bc].filled) return true;
    }
  }
  return false;
}

/* =========================================================
   生成方块
   ========================================================= */
function spawnPiece(){
  if (nextPiece){
    activePiece = nextPiece;
    activePiece.x = Math.floor((COLS - activePiece.grid[0].length) / 2);
    activePiece.y = -activePiece.grid.length;
  } else {
    activePiece = randomPiece();
  }

  nextPiece = randomPiece();

  /* 游戏结束检测 */
  if (collide(activePiece.grid, activePiece.x, activePiece.y)){
    onGameOver();
    return;
  }

  dropTimer = 0;
}

/* =========================================================
   移动 / 旋转
   ========================================================= */
function movePiece(dx){
  if (state !== 'playing' || !activePiece) return;
  if (!collide(activePiece.grid, activePiece.x + dx, activePiece.y)){
    activePiece.x += dx;
    playMove();
  }
}

function rotatePiece(){
  if (state !== 'playing' || !activePiece) return;

  const newGrid = rotateGrid(activePiece.grid);

  /* 尝试原地旋转，失败则左右挪一位 */
  const kicks = [0, -1, 1, -2, 2];

  for (let i = 0; i < kicks.length; i++){
    const nx = activePiece.x + kicks[i];
    if (!collide(newGrid, nx, activePiece.y)){
      activePiece.grid = newGrid;
      activePiece.x = nx;
      playRotate();
      return;
    }
  }
}

function softDrop(){
  if (state !== 'playing' || !activePiece) return;

  if (!collide(activePiece.grid, activePiece.x, activePiece.y + 1)){
    activePiece.y += 1;
    dropTimer = 0;
    return true;
  }
  return false;
}

function hardDrop(){
  if (state !== 'playing' || !activePiece) return;

  let steps = 0;
  while (!collide(activePiece.grid, activePiece.x, activePiece.y + 1)){
    activePiece.y += 1;
    steps++;
    if (steps > 30) break;
  }

  /* 落得快，分数奖励 */
  score += steps * 2;
  updateHUD();

  lockPiece();
}

/* =========================================================
   锁定方块
   ========================================================= */
function lockPiece(){
  if (!activePiece) return;

  const grid = activePiece.grid;
  let filledCount = 0;

  for (let r = 0; r < grid.length; r++){
    for (let c = 0; c < grid[r].length; c++){
      const cell = grid[r][c];
      if (!cell) continue;

      const br = activePiece.y + r;
      const bc = activePiece.x + c;

      if (br < 0 || br >= ROWS || bc < 0 || bc >= COLS) continue;

      /* 如果是目标剪影格子 → 填充 */
      if (targetMask[br][bc] && !board[br][bc]){
        board[br][bc] = {
          shape: cell.shape,
          hue: cell.hue,
          filled: true
        };
        filledCount++;
      }
    }
  }

  if (filledCount > 0){
    playFill();
    spawnFillParticles(filledCount);
    score += filledCount * 15;
    updateHUD();
    popScore();
  } else {
    playLand();
    shakeTimer = 0.18;
    shakeAmount = 3;
  }

  activePiece = null;

  /* 检查完成 */
  if (checkComplete()){
    onLevelComplete();
    return;
  }

  spawnPiece();
}

/* =========================================================
   完成检测
   ========================================================= */
function checkComplete(){
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      if (targetMask[r][c] && !board[r][c]) return false;
    }
  }
  return true;
}

function countFilled(){
  let n = 0;
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      if (targetMask[r][c] && board[r][c]) n++;
    }
  }
  return n;
}

/* =========================================================
   关卡完成 / 游戏结束
   ========================================================= */
function onLevelComplete(){
  state = 'complete';
  levelCompleteTimer = 0;

  playComplete();
  spawnCompleteParticles();

  score += 500;
  updateHUD();
  popScore();

  showToast('✦ ' + currentAnimal.name + ' 拼合完成', false);

  setTimeout(function(){
    animalIndex++;
    if (animalIndex >= ANIMALS.length){
      onAllComplete();
    } else {
      nextLevel();
    }
  }, 2200);
}

function onAllComplete(){
  showLevelBanner('全 部 完 成', '总分 ' + score);

  setTimeout(function(){
    animalIndex = 0;
    score = 0;
    updateHUD();
    nextLevel();
  }, 2800);
}

function nextLevel(){
  currentAnimal = ANIMALS[animalIndex];
  initBoard();

  const nameEl = document.getElementById('animalName');
  if (nameEl) nameEl.textContent = currentAnimal.name + ' · ' + currentAnimal.en;

  showLevelBanner('拼 出 一 只 ' + currentAnimal.name, '用几何图形填满虚线轮廓');

  activePiece = null;
  nextPiece = null;
  state = 'playing';
  levelCompleteTimer = 0;

  updateHUD();
  spawnPiece();
}

function onGameOver(){
  state = 'gameover';
  playGameOver();
  showToast('堆叠过高 · 重新开始', true);

  setTimeout(function(){
    score = 0;
    updateHUD();
    nextLevel();
  }, 2400);
}

/* =========================================================
   粒子
   ========================================================= */
function spawnFillParticles(count){
  const cx = boardX + COLS * cellSize / 2;
  const cy = boardY + ROWS * cellSize / 2;

  const n = Math.min(28, count * 6);

  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU;
    const sp = 50 + Math.random() * 180;
    particles.push({
      x: cx + (Math.random() - 0.5) * cellSize * 3,
      y: cy + (Math.random() - 0.5) * cellSize * 3,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.6 + Math.random() * 1.4,
      size: 1.4 + Math.random() * 2.6,
      hue: 40 + Math.random() * 40
    });
  }
}

function spawnCompleteParticles(){
  const cx = boardX + COLS * cellSize / 2;
  const cy = boardY + ROWS * cellSize / 2;

  for (let i = 0; i < 80; i++){
    const a = Math.random() * TAU;
    const sp = 80 + Math.random() * 280;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.0 + Math.random() * 1.2,
      size: 1.8 + Math.random() * 3.2,
      hue: currentAnimal.hue + (Math.random() - 0.5) * 40
    });
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= p.decay * dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.vy += 60 * dt;
  }
}

function drawParticles(){
  if (particles.length === 0) return;

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const a = p.life * p.life * 0.92;
    const r = p.size * p.life;

    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4.5);
    g.addColorStop(0.00, 'hsla(' + p.hue + ', 100%, 92%, ' + a + ')');
    g.addColorStop(0.42, 'hsla(' + p.hue + ', 100%, 72%, ' + (a * 0.32) + ')');
    g.addColorStop(1.00, 'hsla(' + p.hue + ', 100%, 62%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制几何形状
   ========================================================= */
function drawGeoShape(cx, cy, size, shape, hue, light, alpha, glow){
  const fillColor = 'hsla(' + hue + ', 85%, ' + light + '%, ' + alpha + ')';
  const strokeColor = 'hsla(' + hue + ', 95%, ' + Math.min(96, light + 16) + '%, ' + Math.min(1, alpha + 0.18) + ')';

  if (glow){
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 1.2);
    g.addColorStop(0.00, 'hsla(' + hue + ', 100%, ' + (light + 14) + '%, ' + (alpha * 0.42) + ')');
    g.addColorStop(1.00, 'hsla(' + hue + ', 100%, ' + light + '%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, size * 1.2, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.beginPath();

  const s = size * 0.5;

  if (shape === 'triangle'){
    const h = s * 0.90;
    ctx.moveTo(cx, cy - h * 0.70);
    ctx.lineTo(cx + s * 0.86, cy + h * 0.42);
    ctx.lineTo(cx - s * 0.86, cy + h * 0.42);
    ctx.closePath();
  } else if (shape === 'circle'){
    ctx.arc(cx, cy, s * 0.86, 0, TAU);
  } else if (shape === 'square'){
    const q = s * 0.78;
    ctx.rect(cx - q, cy - q, q * 2, q * 2);
  } else if (shape === 'hexagon'){
    for (let i = 0; i < 6; i++){
      const ang = i / 6 * TAU - Math.PI / 2;
      const x = cx + Math.cos(ang) * s * 0.90;
      const y = cy + Math.sin(ang) * s * 0.90;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  } else if (shape === 'diamond'){
    ctx.moveTo(cx, cy - s * 0.94);
    ctx.lineTo(cx + s * 0.76, cy);
    ctx.lineTo(cx, cy + s * 0.94);
    ctx.lineTo(cx - s * 0.76, cy);
    ctx.closePath();
  } else if (shape === 'star'){
    const outer = s * 0.94;
    const inner = outer * 0.42;
    for (let i = 0; i < 10; i++){
      const rr = i % 2 === 0 ? outer : inner;
      const ang = i / 10 * TAU - Math.PI / 2;
      const x = cx + Math.cos(ang) * rr;
      const y = cy + Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = Math.max(1, size * 0.075);
  ctx.lineJoin = 'round';
  ctx.stroke();
}

/* =========================================================
   绘制棋盘
   ========================================================= */
function drawBoard(t){
  const bw = COLS * cellSize;
  const bh = ROWS * cellSize;
  const cs = cellSize;

  /* 底板 */
  ctx.fillStyle = 'rgba(4, 8, 18, 0.62)';
  roundRect(boardX - 4, boardY - 4, bw + 8, bh + 8, 12);
  ctx.fill();

  ctx.strokeStyle = 'rgba(100, 150, 230, 0.20)';
  ctx.lineWidth = 1.4;
  roundRect(boardX - 4, boardY - 4, bw + 8, bh + 8, 12);
  ctx.stroke();

  /* 网格 */
  ctx.strokeStyle = 'rgba(70, 110, 190, 0.055)';
  ctx.lineWidth = 1;

  for (let r = 0; r <= ROWS; r++){
    ctx.beginPath();
    ctx.moveTo(boardX, boardY + r * cs);
    ctx.lineTo(boardX + bw, boardY + r * cs);
    ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++){
    ctx.beginPath();
    ctx.moveTo(boardX + c * cs, boardY);
    ctx.lineTo(boardX + c * cs, boardY + bh);
    ctx.stroke();
  }

  /* 目标剪影（虚线轮廓） */
  const pulse = 0.55 + 0.45 * Math.sin(t * 1.6);

  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      if (!targetMask[r][c]) continue;
      if (board[r][c]) continue;

      const cx = boardX + c * cs + cs / 2;
      const cy = boardY + r * cs + cs / 2;

      /* 虚线圆角方框 */
      const pad = cs * 0.16;
      ctx.save();
      ctx.setLineDash([cs * 0.18, cs * 0.16]);
      ctx.lineDashOffset = -(t * 14) % (cs * 0.34);
      ctx.strokeStyle = 'hsla(' + currentAnimal.hue + ', 85%, 72%, ' + (0.36 + 0.20 * pulse) + ')';
      ctx.lineWidth = Math.max(1, cs * 0.055);
      roundRect(cx - cs / 2 + pad, cy - cs / 2 + pad, cs - pad * 2, cs - pad * 2, cs * 0.16);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* 已填充格子 */
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const cell = board[r][c];
      if (!cell || !cell.filled) continue;

      const cx = boardX + c * cs + cs / 2;
      const cy = boardY + r * cs + cs / 2;

      drawGeoShape(cx, cy, cs * 0.82, cell.shape, cell.hue, 62, 0.88, true);
    }
  }

  /* 正在下落的方块 */
  if (activePiece && state === 'playing'){
    const grid = activePiece.grid;
    const px = activePiece.x;
    const py = activePiece.y;

    /* 阴影（落点提示） */
    let ghostY = py;
    while (!collide(grid, px, ghostY + 1)) ghostY++;
    for (let r = 0; r < grid.length; r++){
      for (let c = 0; c < grid[r].length; c++){
        if (!grid[r][c]) continue;
        const br = ghostY + r;
        const bc = px + c;
        if (br < 0 || br >= ROWS || bc < 0 || bc >= COLS) continue;

        const cx = boardX + bc * cs + cs / 2;
        const cy = boardY + br * cs + cs / 2;

        ctx.strokeStyle = 'hsla(' + grid[r][c].hue + ', 90%, 72%, 0.30)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 4]);
        roundRect(cx - cs * 0.35, cy - cs * 0.35, cs * 0.7, cs * 0.7, cs * 0.12);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    /* 实际方块 */
    for (let r = 0; r < grid.length; r++){
      for (let c = 0; c < grid[r].length; c++){
        const cell = grid[r][c];
        if (!cell) continue;

        const br = py + r;
        const bc = px + c;
        if (br < 0 || br >= ROWS || bc < 0 || bc >= COLS) continue;

        const cx = boardX + bc * cs + cs / 2;
        const cy = boardY + br * cs + cs / 2;

        drawGeoShape(cx, cy, cs * 0.86, cell.shape, cell.hue, 68, 0.96, true);
      }
    }
  }

  /* 下一块预览（右上角小框） */
  if (nextPiece){
    const previewSize = cs * 0.62;
    const pW = nextPiece.grid[0].length * previewSize;
    const pH = nextPiece.grid.length * previewSize;

    const px0 = boardX + bw + 16;
    const py0 = boardY + 10;

    if (px0 + pW + 20 < W){
      ctx.fillStyle = 'rgba(4, 8, 18, 0.62)';
      roundRect(px0 - 10, py0 - 10, Math.max(pW, 40) + 20, Math.max(pH, 40) + 20, 10);
      ctx.fill();
      ctx.strokeStyle = 'rgba(100, 150, 230, 0.20)';
      ctx.lineWidth = 1;
      roundRect(px0 - 10, py0 - 10, Math.max(pW, 40) + 20, Math.max(pH, 40) + 20, 10);
      ctx.stroke();

      ctx.font = '400 9px "SF Mono", Consolas, Monaco, monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(160, 200, 245, 0.48)';
      ctx.fillText('NEXT', px0 - 4, py0 - 26);

      for (let r = 0; r < nextPiece.grid.length; r++){
        for (let c = 0; c < nextPiece.grid[r].length; c++){
          const cell = nextPiece.grid[r][c];
          if (!cell) continue;
          const cx = px0 + c * previewSize + previewSize / 2;
          const cy = py0 + r * previewSize + previewSize / 2;
          drawGeoShape(cx, cy, previewSize * 0.85, cell.shape, cell.hue, 66, 0.90, false);
        }
      }
    }
  }
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* =========================================================
   背景
   ========================================================= */
function drawBackground(t){
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.42, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  bg.addColorStop(0.00, '#080c1e');
  bg.addColorStop(0.42, '#04060f');
  bg.addColorStop(1.00, '#010205');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星点 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 60; i++){
    const sx = ((i * 137.5 + t * 6) % W);
    const sy = ((i * 97.3) % (H * 0.9));
    const a = 0.06 + 0.16 * Math.sin(t * 1.2 + i * 1.9);
    if (a < 0.02) continue;
    ctx.fillStyle = 'rgba(200, 225, 255, ' + a + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, 1.0, 0, TAU);
    ctx.fill();
  }

  /* 中心柔光（跟随动物色相） */
  const g = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.min(W, H) * 0.65
  );
  g.addColorStop(0.00, 'hsla(' + currentAnimal.hue + ', 90%, 58%, 0.075)');
  g.addColorStop(0.42, 'hsla(' + currentAnimal.hue + ', 90%, 50%, 0.028)');
  g.addColorStop(1.00, 'hsla(' + currentAnimal.hue + ', 90%, 48%, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;
let frameCount = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  /* 更新下落 */
  if (state === 'playing' && activePiece){
    dropTimer += dt * 1000;
    if (dropTimer > dropInterval){
      dropTimer = 0;
      if (!collide(activePiece.grid, activePiece.x, activePiece.y + 1)){
        activePiece.y += 1;
      } else {
        lockPiece();
      }
    }
  }

  /* 关卡完成动画 */
  if (state === 'complete'){
    levelCompleteTimer += dt;
  }

  /* 屏幕抖动 */
  if (shakeTimer > 0){
    shakeTimer -= dt;
  }

  updateParticles(dt);

  /* 渲染 */
  ctx.save();
  if (shakeTimer > 0){
    const sx = (Math.random() - 0.5) * shakeAmount * 2;
    const sy = (Math.random() - 0.5) * shakeAmount * 2;
    ctx.translate(sx, sy);
  }

  drawBackground(t);

  /* 通关闪光 */
  if (state === 'complete'){
    const p = Math.min(1, levelCompleteTimer / 1.8);
    const intensity = Math.sin(p * Math.PI) * 0.30;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'hsla(' + currentAnimal.hue + ', 100%, 78%, ' + intensity + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  drawBoard(t);
  drawParticles();

  ctx.restore();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.36,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(1, 3, 8, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* HUD 更新（节流） */
  frameCount++;
  if (frameCount % 4 === 0) updateHUD();
}

/* =========================================================
   HUD
   ========================================================= */
function updateHUD(){
  const scoreEl = document.getElementById('scoreVal');
  const filledEl = document.getElementById('filledCount');
  const totalEl = document.getElementById('totalCount');
  const fill = document.getElementById('progressFill');

  if (scoreEl) scoreEl.textContent = score;
  if (filledEl) filledEl.textContent = countFilled();
  if (totalEl) totalEl.textContent = totalTargets;

  if (fill){
    const ratio = totalTargets > 0 ? countFilled() / totalTargets : 0;
    fill.style.width = (ratio * 100).toFixed(1) + '%';
  }
}

function popScore(){
  const el = document.getElementById('scoreVal');
  if (!el) return;
  el.classList.add('pop');
  setTimeout(function(){ el.classList.remove('pop'); }, 320);
}

/* =========================================================
   Toast / Banner
   ========================================================= */
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(text, isBad){
  toastEl.textContent = text;
  toastEl.classList.toggle('bad', !!isBad);
  toastEl.classList.add('show');

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toastEl.classList.remove('show');
  }, 1500);
}

const bannerEl = document.getElementById('levelBanner');
let bannerTimer = null;

function showLevelBanner(title, sub){
  bannerEl.innerHTML = '';
  const t1 = document.createElement('div');
  t1.textContent = title;
  bannerEl.appendChild(t1);

  if (sub){
    const t2 = document.createElement('span');
    t2.className = 'sub';
    t2.textContent = sub;
    bannerEl.appendChild(t2);
  }

  bannerEl.classList.add('show');
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer = setTimeout(function(){
    bannerEl.classList.remove('show');
  }, 2200);
}

/* =========================================================
   输入
   ========================================================= */
window.addEventListener('keydown', function(e){
  initAudio();

  if (state !== 'playing') return;

  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){
    e.preventDefault();
    movePiece(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){
    e.preventDefault();
    movePiece(1);
  } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){
    e.preventDefault();
    softDrop();
  } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){
    e.preventDefault();
    rotatePiece();
  } else if (e.key === ' '){
    e.preventDefault();
    hardDrop();
  }
});

/* 按钮 */
document.getElementById('btnLeft').addEventListener('click', function(e){
  e.preventDefault();
  initAudio();
  movePiece(-1);
});
document.getElementById('btnRight').addEventListener('click', function(e){
  e.preventDefault();
  initAudio();
  movePiece(1);
});
document.getElementById('btnRotate').addEventListener('click', function(e){
  e.preventDefault();
  initAudio();
  rotatePiece();
});
document.getElementById('btnDown').addEventListener('click', function(e){
  e.preventDefault();
  initAudio();
  softDrop();
});
document.getElementById('btnDrop').addEventListener('click', function(e){
  e.preventDefault();
  initAudio();
  hardDrop();
});

/* 触摸滑动 */
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;

canvas.addEventListener('touchstart', function(e){
  initAudio();
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, { passive: true });

canvas.addEventListener('touchend', function(e){
  if (state !== 'playing') return;
  if (!e.changedTouches.length) return;

  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;

  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  if (absX < 20 && absY < 20 && dt < 250){
    /* 轻触：旋转 */
    rotatePiece();
  } else if (absY > absX && dy > 40){
    /* 下滑：硬降 */
    hardDrop();
  } else if (absX > absY && absX > 30){
    /* 左右移动 */
    const steps = Math.floor(absX / 24);
    const dir = dx > 0 ? 1 : -1;
    for (let i = 0; i < Math.min(steps, 4); i++){
      movePiece(dir);
    }
  } else if (dy < -40){
    /* 上滑：旋转 */
    rotatePiece();
  }
}, { passive: true });

/* 首次交互初始化音频 */
window.addEventListener('pointerdown', function(){
  initAudio();
}, { once: false });

/* =========================================================
   启动
   ========================================================= */
resize();
currentAnimal = ANIMALS[0];
initBoard();

const nameEl = document.getElementById('animalName');
if (nameEl) nameEl.textContent = currentAnimal.name + ' · ' + currentAnimal.en;

updateHUD();
spawnPiece();
requestAnimationFrame(loop);

})();
