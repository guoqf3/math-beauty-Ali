<div class="hud">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================================
   0. 物理常量与数学
   ========================================================= */
const NMAX = 7;                 // n = 0 … 7
const HW   = 1;                 // ħω （取为 1 单位）
const E    = n => (n + 0.5) * HW;      // Eₙ = (n+½)ħω
const V    = x => 0.5 * HW * x * x;    // 势阱 V(x) = ½mω²x²
const turn = n => Math.sqrt(2 * E(n)); // 经典转折点 x_t = √(2E)

// 厄米多项式（递推）
function hermite(n, x){
  if(n === 0) return 1;
  if(n === 1) return 2 * x;
  let h0 = 1, h1 = 2 * x, h2 = 0;
  for(let k = 2; k <= n; k++){
    h2 = 2 * x * h1 - 2 * (k - 1) * h0;
    h0 = h1; h1 = h2;
  }
  return h1;
}
// 未归一化波函数 ψₙ ∝ Hₙ(x)e^(−x²/2)
const psiRaw = (n, x) => hermite(n, x) * Math.exp(-x * x / 2);

// 每个能级的 |ψ| 峰值（用于曲线归一化绘制）
const psiMax = [];
for(let n = 0; n <= NMAX; n++){
  let m = 1e-9;
  for(let i = 0; i <= 800; i++){
    const x = -5 + 10 * i / 800;
    m = Math.max(m, Math.abs(psiRaw(n, x)));
  }
  psiMax[n] = m;
}

// 按 |ψ|² 分布采样位置（逆 CDF）
function samplePsi2(n, count){
  const M = 1400, xmin = -5, xmax = 5;
  const xs = new Float32Array(M + 1);
  const cdf = new Float32Array(M + 1);
  let acc = 0;
  for(let i = 0; i <= M; i++){
    const x = xmin + (xmax - xmin) * i / M;
    xs[i] = x;
    const p = psiRaw(n, x);
    acc += p * p;
    cdf[i] = acc;
  }
  const out = new Float32Array(count);
  for(let k = 0; k < count; k++){
    const r = Math.random() * acc;
    let lo = 0, hi = M;
    while(lo < hi){
      const mid = (lo + hi) >> 1;
      if(cdf[mid] < r) lo = mid + 1; else hi = mid;
    }
    out[k] = xs[lo];
  }
  return out;
}

/* =========================================================
   1. 背景音效（Web Audio）
   ========================================================= */
let audioCtx = null, masterGain = null;

function initAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(audioCtx.destination);

  /* --- 低频 drone --- */
  const droneBus = audioCtx.createGain();
  droneBus.gain.value = 0;
  droneBus.gain.linearRampToValueAtTime(0.20, audioCtx.currentTime + 4);
  droneBus.connect(masterGain);

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 320;
  lp.Q.value = 5;
  lp.connect(droneBus);

  [[55,0.60,'sine'],[55.4,0.50,'sine'],[110,0.20,'triangle'],[164.8,0.10,'triangle']]
  .forEach(([f,g,type])=>{
    const o = audioCtx.createOscillator();
    o.type = type; o.frequency.value = f;
    const gg = audioCtx.createGain(); gg.gain.value = g;
    o.connect(gg); gg.connect(lp); o.start();
  });

  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.05;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = 170;
  lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();

  /* --- 高频空气噪声 --- */
  const len = Math.floor(audioCtx.sampleRate * 3);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const noise = audioCtx.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.7;
  const ng = audioCtx.createGain(); ng.gain.value = 0.045;
  noise.connect(bp); bp.connect(ng); ng.connect(masterGain); noise.start();

  const lfo2 = audioCtx.createOscillator();
  lfo2.frequency.value = 0.037;
  const lfo2g = audioCtx.createGain(); lfo2g.gain.value = 620;
  lfo2.connect(lfo2g); lfo2g.connect(bp.frequency); lfo2.start();
}

function ping(freq, delay = 0, dur = 1.4, vol = 0.10, type = 'sine'){
  if(!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.05);
}

// 五声音阶 —— 能级越高音越亮
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16];
function playLevelNote(n){
  if(!audioCtx) return;
  const semi = SCALE[n % SCALE.length];
  const f = 220 * Math.pow(2, semi / 12);
  ping(f,        0,    1.8, 0.085, 'sine');
  ping(f * 2,    0.02, 1.1, 0.040, 'triangle');
  ping(f * 3.01, 0.05, 0.7, 0.020, 'sine');
}

/* =========================================================
   2. Three.js 场景
   ========================================================= */
const app = document.getElementById('app');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 5.6, 19.5);
camera.lookAt(0, 5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x03040c, 1);
app.appendChild(renderer.domElement);

// 后期辉光
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.65, 0.18
);
composer.addPass(bloomPass);

/* =========================================================
   3. 贴图工具
   ========================================================= */
function makeBarTexture(){
  const W = 256, H = 64;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(W, H);
  for(let j = 0; j < H; j++){
    const v = j / (H - 1);
    const fv = Math.pow(Math.sin(Math.PI * v), 1.7);
    for(let i = 0; i < W; i++){
      const u = i / (W - 1);
      const fu = Math.pow(Math.sin(Math.PI * u), 0.32);
      const k = (j * W + i) * 4;
      img.data[k] = 255;
      img.data[k + 1] = 255;
      img.data[k + 2] = 255;
      img.data[k + 3] = Math.round(fu * fv * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeDotTexture(){
  const S = 64;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.22,'rgba(255,255,255,0.72)');
  g.addColorStop(0.55,'rgba(255,255,255,0.18)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const BAR_TEX = makeBarTexture();
const DOT_TEX = makeDotTexture();

/* =========================================================
   4. 配色
   ========================================================= */
function levelColor(n){
  const h = 188 + n * 17;           // 188° 青 → 307° 品红
  return new THREE.Color().setHSL((h % 360) / 360, 0.95, 0.60);
}

/* =========================================================
   5. 星空背景
   ========================================================= */
(function buildStars(){
  const COUNT = 1600;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  const c = new THREE.Color();
  for(let i = 0; i < COUNT; i++){
    const r = 55 + Math.random() * 90;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.55 + 5;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th) - 30;
    c.setHSL(0.55 + Math.random() * 0.16, 0.8, 0.35 + Math.random() * 0.5);
    col[i*3] = c.r; col[i*3 + 1] = c.g; col[i*3 + 2] = c.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 0.55, map: DOT_TEX, vertexColors: true,
    transparent: true, opacity: 0.85, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* =========================================================
   6. 抛物线势阱
   ========================================================= */
const X_LIMIT = 4.4;
(function buildWell(){
  const pts = [];
  const N = 220;
  for(let i = 0; i <= N; i++){
    const x = -X_LIMIT + 2 * X_LIMIT * i / N;
    pts.push(new THREE.Vector3(x, V(x), 0));
  }
  const curve = new THREE.CatmullRomCurve3(pts);

  // 内芯
  const geoCore = new THREE.TubeGeometry(curve, 280, 0.035, 8, false);
  const matCore = new THREE.MeshBasicMaterial({
    color: 0x2fe3ff, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Mesh(geoCore, matCore));

  // 外辉光
  const geoGlow = new THREE.TubeGeometry(curve, 280, 0.16, 8, false);
  const matGlow = new THREE.MeshBasicMaterial({
    color: 0x0d7fb0, transparent: true, opacity: 0.28,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Mesh(geoGlow, matGlow));
})();

/* =========================================================
   7. 能级 / 驻波 / 概率云
   ========================================================= */
const levels = [];

const PARTICLE_COUNT = 340;

for(let n = 0; n <= NMAX; n++){
  const e  = E(n);
  const xt = turn(n);
  const color = levelColor(n);

  /* ---- 7.1 能级水平线（发光条） ---- */
  const barW = 2 * xt;
  const barGeo = new THREE.PlaneGeometry(barW, 0.22);
  const barMat = new THREE.MeshBasicMaterial({
    map: BAR_TEX, color, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const bar = new THREE.Mesh(barGeo, barMat);
  bar.position.set(0, e, 0);
  scene.add(bar);

  /* ---- 7.2 波函数驻波曲线 ---- */
  const SAMP = 260;
  const wPts = [];
  for(let i = 0; i <= SAMP; i++){
    const x = -xt + 2 * xt * i / SAMP;
    const v = psiRaw(n, x) / psiMax[n];
    wPts.push(new THREE.Vector3(x, e + 0.40 * v, 0));
  }
  const wGeo = new THREE.BufferGeometry().setFromPoints(wPts);
  const wMat = new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.30,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Line(wGeo, wMat));

  /* ---- 7.3 概率云 |ψₙ|² ---- */
  const sx = samplePsi2(n, PARTICLE_COUNT);
  const pos = new Float32Array(PARTICLE_COUNT * 3);
  for(let i = 0; i < PARTICLE_COUNT; i++){
    pos[i*3]     = sx[i];
    pos[i*3 + 1] = e + (Math.random() - 0.5) * 0.52;
    pos[i*3 + 2] = (Math.random() - 0.5) * 0.9;
  }
  const cGeo = new THREE.BufferGeometry();
  cGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const cMat = new THREE.PointsMaterial({
    size: 0.13, map: DOT_TEX, color,
    transparent: true, opacity: 0.22,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(cGeo, cMat));

  levels.push({ n, e, xt, color, barMat, wMat, cMat });
}

/* =========================================================
   8. 经典谐振子概率云团（沿势阱上下振荡）
   ========================================================= */
const coherent = new THREE.Group();
{
  const s1 = new THREE.Sprite(new THREE.SpriteMaterial({
    map: DOT_TEX, color: 0xffffff, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  s1.scale.set(1.05, 1.05, 1);

  const s2 = new THREE.Sprite(new THREE.SpriteMaterial({
    map: DOT_TEX, color: 0x66e8ff, transparent: true, opacity: 0.45,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  s2.scale.set(2.6, 2.6, 1);

  coherent.add(s2, s1);
  coherent.position.z = 0.6;
  scene.add(coherent);
}

/* =========================================================
   9. HUD 图例
   ========================================================= */
(function buildLegend(){
  const box = document.getElementById('legend');
  for(let n = NMAX; n >= 0; n--){
    const c = levelColor(n);
    const hex = '#' + c.getHexString();
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML =
      `<span>n=${n}</span>` +
      `<span style="color:#5d90ad">E=${(n + 0.5).toFixed(1)}ħω</span>` +
      `<span class="dot" style="color:${hex}"></span>`;
    box.appendChild(row);
  }
})();

/* =========================================================
   10. 动画循环
   ========================================================= */
const clock = new THREE.Clock();
const SEG = 1.8;                  // 每个能级停留秒数
let lastActive = -1;

let mouseX = 0, mouseY = 0;
addEventListener('pointermove', e => {
  mouseX = (e.clientX / innerWidth - 0.5) * 2;
  mouseY = (e.clientY / innerHeight - 0.5) * 2;
});

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  /* --- 10.1 能级高亮扫描：0 → 7 → 0 --- */
  const period = 2 * NMAX * SEG;
  const ph = t % period;
  const scanPos = ph < NMAX * SEG
    ? ph / SEG
    : (2 * NMAX * SEG - ph) / SEG;

  const activeIdx = Math.round(scanPos);
  if(activeIdx !== lastActive){
    lastActive = activeIdx;
    playLevelNote(activeIdx);
  }

  for(let i = 0; i < levels.length; i++){
    const L = levels[i];
    const w = Math.exp(-Math.pow((i - scanPos) / 0.78, 2));
    L.barMat.opacity = 0.22 + 0.78 * w;
    L.wMat.opacity   = 0.18 + 0.82 * w;
    L.cMat.opacity   = 0.14 + 0.76 * w;
    L.cMat.size      = 0.115 + 0.075 * w;
  }

  /* --- 10.2 经典谐振子：沿势阱上下振荡 --- */
  const AMP = 3.25;
  const omega = 1.15;
  const xc = AMP * Math.cos(t * omega);
  const yc = V(xc);
  coherent.position.set(xc, yc, 0.6);

  const breath = 1 + 0.16 * Math.sin(t * 9.0);
  coherent.scale.setScalar(breath);
  coherent.children[0].material.opacity = 0.30 + 0.20 * Math.abs(Math.cos(t * omega));
  coherent.children[1].material.opacity = 0.70 + 0.30 * Math.abs(Math.sin(t * 3.1));

  /* --- 10.3 摄像机微动 --- */
  camera.position.x = Math.sin(t * 0.07) * 0.9 + mouseX * 1.6;
  camera.position.y = 5.6 + Math.sin(t * 0.11) * 0.28 - mouseY * 0.9;
  camera.position.z = 19.5 + Math.sin(t * 0.05) * 0.5;
  camera.lookAt(0, 5.0, 0);

  /* --- 10.4 辉光呼吸 --- */
  bloomPass.strength = 0.78 + 0.12 * Math.sin(t * 0.8);

  composer.render();
}

/* =========================================================
   11. 交互 / 尺寸
   ========================================================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});

const startEl = document.getElementById('start');
startEl.addEventListener('click', () => {
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startEl.classList.add('hide');
  setTimeout(() => startEl.remove(), 1000);
  playLevelNote(0);
});

animate();
</script>
</body>
</html>
