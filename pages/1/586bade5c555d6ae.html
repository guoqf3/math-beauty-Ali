<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脉动珊瑚 · Pulsing Coral</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #062836 0%, #031620 55%, #01070c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #d6eef5;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding: 22px;
    display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap;
  }
  .stage {
    flex: 1 1 580px; min-width: 300px;
    position: relative;
    aspect-ratio: 760 / 520;
    border-radius: 26px;
    overflow: hidden;
    background: #020d14;
    box-shadow: 0 24px 56px -24px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(120, 230, 240, .14) inset;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  .sound-toggle {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    background: rgba(8, 34, 44, .84);
    color: #9fe8ff;
    box-shadow: 0 5px 16px -5px rgba(0, 0, 0, .85),
                0 0 0 1px rgba(120, 230, 240, .3) inset;
    transition: transform .12s;
    z-index: 3;
  }
  .sound-toggle:active { transform: scale(.92); }

  .panel {
    flex: 0 1 352px; min-width: 292px;
    background: rgba(7, 26, 34, .78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 26px;
    padding: 22px 22px 18px;
    box-shadow: 0 24px 56px -26px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(120, 230, 240, .13) inset;
    display: flex; flex-direction: column; gap: 13px;
  }
  h1 {
    font-size: 20px; margin: 0; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
    color: #e4f8ff;
  }
  h1 .emoji { font-size: 23px; }

  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 15.5px; text-align: center;
    padding: 11px 10px; border-radius: 15px;
    background: linear-gradient(135deg, rgba(16, 56, 70, .92), rgba(10, 34, 48, .92));
    color: #8fe4f5;
    letter-spacing: .4px;
    box-shadow: 0 0 0 1px rgba(120, 230, 240, .2) inset;
    line-height: 1.7;
  }
  .formula b { color: #ffd88a; font-weight: 700; }
  .formula .note { font-size: 12px; color: #6f9fae; letter-spacing: .3px; }

  .readout {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
    padding: 11px 13px; border-radius: 15px;
    background: rgba(9, 34, 44, .92);
    box-shadow: 0 0 0 1px rgba(120, 230, 240, .16) inset;
    font-size: 12.5px;
  }
  .readout .k { color: #6fa0b0; font-weight: 700; }
  .readout .v {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    color: #7fe0f5; font-weight: 700; font-size: 13.5px;
    text-align: right;
  }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    color: #85b0be;
  }
  .field .val {
    color: #7fe0f5; font-variant-numeric: tabular-nums; font-size: 13.5px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #1e5c6e, #52c8dd);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: #061e26; border: 3.5px solid #52c8dd;
    box-shadow: 0 0 12px rgba(90, 210, 230, .7);
    transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #061e26; border: 3.5px solid #52c8dd;
    box-shadow: 0 0 12px rgba(90, 210, 230, .7);
  }
  input[type=range]::-moz-range-track {
    height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #1e5c6e, #52c8dd);
  }

  .btns { display: flex; gap: 10px; }
  button.main {
    flex: 1; padding: 11px 8px; border: none; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: .4px;
    background: linear-gradient(180deg, #52c8dd, #22879e);
    color: #032027;
    box-shadow: 0 7px 18px -8px rgba(80, 210, 230, .95);
    transition: transform .12s, filter .12s;
  }
  button.main:hover { filter: brightness(1.08); }
  button.main:active { transform: translateY(2px) scale(.98); }
  button.main.ghost {
    flex: 0 0 auto; padding: 11px 18px;
    background: rgba(10, 40, 50, .95);
    color: #7fe0f5;
    box-shadow: 0 5px 14px -8px rgba(0, 0, 0, .9),
                0 0 0 1.5px rgba(120, 230, 240, .26) inset;
  }

  .hint {
    margin: 0; font-size: 12.5px; line-height: 1.7; color: #5c8896;
    text-align: center;
  }
  .hint kbd {
    background: rgba(12, 44, 54, .9); border-radius: 5px; padding: 1px 6px;
    font-family: inherit; font-size: 11.5px; color: #7fe0f5;
    box-shadow: 0 0 0 1px rgba(120, 230, 240, .24) inset;
  }
  @media (max-width: 740px) {
    .wrap { padding: 14px; gap: 16px; }
    .panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
  </div>

  <div class="panel">
    <h1><span class="emoji">🪸</span> 脉动珊瑚</h1>

    <div class="formula">
      L(t) = L₀ · [1 + <b>A</b>·sin(2π(t/T − φ<sub>i</sub>))]<br>
      <span class="note">φ<sub>i</sub> 随位置线性分布，潮汐自左向右扫过</span>
    </div>

    <div class="readout">
      <span class="k">潮汐周期 T</span><span class="v" id="roT">4.00 s</span>
      <span class="k">当前相位</span><span class="v" id="roPhase">0.00</span>
      <span class="k">平均伸展率</span><span class="v" id="roStretch">1.00</span>
      <span class="k">潮位</span><span class="v" id="roLevel">—</span>
    </div>

    <div class="field">
      <div class="row"><span>潮汐周期 T</span><span class="val" id="tVal">4.00 s</span></div>
      <input type="range" id="tRange" min="150" max="900" step="1" value="400">
    </div>

    <div class="field">
      <div class="row"><span>脉动幅度 A</span><span class="val" id="aVal">65%</span></div>
      <input type="range" id="aRange" min="0" max="100" step="1" value="65">
    </div>

    <div class="field">
      <div class="row"><span>珊瑚数量</span><span class="val" id="nVal">12</span></div>
      <input type="range" id="nRange" min="6" max="18" step="1" value="12">
    </div>

    <div class="field">
      <div class="row"><span>枝干柔韧度</span><span class="val" id="wVal">70%</span></div>
      <input type="range" id="wRange" min="0" max="100" step="1" value="70">
    </div>

    <div class="btns">
      <button class="main" id="btnSync">同步潮汐</button>
      <button class="main ghost" id="btnReset">重置</button>
    </div>

    <p class="hint">
      把「珊瑚数量」调大，再慢慢拖动「潮汐周期」<br>
      观察波浪如何自左向右扫过整片珊瑚群 · <kbd>点击画面</kbd> 惊起气泡
    </p>

  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     基础
  ============================================================ */
  const W = 760, H = 520;
  const TAU = Math.PI * 2;
  const SEABED = 436;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  let KX = 1, KY = 1;

  function resizeCanvas() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.max(1, Math.round(rect.width  * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
    KX = cv.width / W;
    KY = cv.height / H;
  }
  window.addEventListener('resize', resizeCanvas);

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  /* ============================================================
     音频
  ============================================================ */
  let ac = null, masterGain = null, muted = false;

  function ensureAudio() {
    if (muted) return null;
    if (ac) {
      if (ac.state === 'suspended') ac.resume();
      return ac;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();

    masterGain = ac.createGain();
    masterGain.gain.value = 0.9;

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 6000;
    lp.Q.value = 0.5;

    masterGain.connect(lp);
    lp.connect(ac.destination);
    return ac;
  }

  /** 潮汐涌动声：低通扫频噪声 */
  function playTideSwell() {
    if (!ac || muted) return;
    const dur = 1.25;
    const sr = ac.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = ac.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const env = Math.pow(Math.sin(Math.PI * i / len), 1.4);
      d[i] = (Math.random() * 2 - 1) * env;
    }

    const src = ac.createBufferSource();
    src.buffer = buf;

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 0.9;

    const t0 = ac.currentTime;
    lp.frequency.setValueAtTime(150, t0);
    lp.frequency.linearRampToValueAtTime(680, t0 + dur * 0.38);
    lp.frequency.linearRampToValueAtTime(190, t0 + dur);

    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.085, t0 + dur * 0.32);
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur);

    src.connect(lp); lp.connect(g); g.connect(masterGain);
    src.start(t0);
  }

  /** 珊瑚枝梢的轻响 */
  function playCoralPing(freq, vol) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    vol = clamp(vol, 0.008, 0.05);

    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 1.006, t + 0.4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.68);

    const o2 = ac.createOscillator();
    const g2 = ac.createGain();
    o2.type = 'sine';
    o2.frequency.value = freq * 2.74;
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(vol * 0.2, t + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    o2.connect(g2); g2.connect(masterGain);
    o2.start(t); o2.stop(t + 0.42);
  }

  /** 气泡声 */
  function playBubble() {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(680 + Math.random() * 320, t);
    o.frequency.exponentialRampToValueAtTime(180, t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.035, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.24);
  }

  /** 点击惊起 */
  function playStartle() {
    if (!ac || muted) return;
    for (let i = 0; i < 4; i++) {
      const f = 520 * Math.pow(1.22, i);
      const t = ac.currentTime + i * 0.055;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.026 - i * 0.004, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t + 0.36);
    }
  }

  let lastBlip = 0;
  function sndBlip(freq) {
    const now = performance.now();
    if (now - lastBlip < 70) return;
    lastBlip = now;
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.022, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.13);
  }

  /* ============================================================
     参数
  ============================================================ */
  const P = {
    period: 4.0,      // 秒
    amp: 0.65,
    count: 12,
    flex: 0.70
  };

  const S = {
    time: 0,
    p: 0,             // 潮汐相位 0..1
    lastP: 0,
    pingBudget: 0
  };

  /* ============================================================
     珊瑚树
  ============================================================ */
  function buildTree(len, depth, maxD) {
    const node = {
      len: len,
      depth: depth,
      angle: 0,
      children: []
    };
    if (depth <= 0 || len < 1.6) return node;

    const count = 2;
    const spread = 0.44 + Math.random() * 0.2;

    for (let i = 0; i < count; i++) {
      const a = (i - (count - 1) / 2) * spread;
      const child = buildTree(len * (0.66 + Math.random() * 0.12), depth - 1, maxD);
      child.angle = a;
      node.children.push(child);
    }
    return node;
  }

  const HUES = [335, 350, 12, 28, 285, 305, 195, 168];
  const corals = [];

  function buildCorals() {
    corals.length = 0;
    const n = P.count;

    for (let i = 0; i < n; i++) {
      const x = 46 + (i + 0.5) * ((W - 92) / n) + (Math.random() - 0.5) * 24;
      const baseLen = 46 + Math.random() * 22;
      const depth = Math.random() < 0.45 ? 5 : 4;

      corals.push({
        x: x,
        y: SEABED + 12 + Math.random() * 28,
        tree: buildTree(baseLen, depth, depth),
        maxDepth: depth,
        baseW: 6.5 + Math.random() * 3.5,
        hue: HUES[i % HUES.length],
        delay: (x / W) * 0.52,
        phase: Math.random() * TAU,
        glow: 0
      });
    }
  }

  function refreshDelays() {
    for (let i = 0; i < corals.length; i++) {
      corals[i].delay = (corals[i].x / W) * 0.52;
    }
  }

  /* ============================================================
     更新
     ============================================================ */
  function update(dt) {
    S.time += dt;

    // 潮汐相位
    const prev = S.p;
    S.p += dt / P.period;
    if (S.p >= 1) {
      S.p -= Math.floor(S.p);
      playTideSwell();
      S.pingBudget = 3;
    }

    // 峰值检测 → 珊瑚轻响
    const cur = S.p;
    const crossed = (v) => {
      if (prev <= cur) return prev < v && v <= cur;
      return prev < v || v <= cur;
    };
    if (S.pingBudget > 0 && crossed(0.25)) {
      S.pingBudget--;
      const c = corals[Math.floor(Math.random() * corals.length)];
      if (c) playCoralPing(440 + (c.x / W) * 520, 0.020 + P.amp * 0.022);
    }

    // 珊瑚发光衰减
    for (let i = 0; i < corals.length; i++) {
      corals[i].glow *= Math.exp(-dt * 3.2);
    }

    // 气泡上升
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y -= b.sp * dt;
      b.x += Math.sin(S.time * 1.1 + b.ph) * 12 * dt;
      b.life -= dt * 0.42;
      if (b.life <= 0 || b.y < -20) bubbles.splice(i, 1);
    }

    // 小鱼游动
    for (let i = 0; i < fishes.length; i++) {
      const f = fishes[i];
      f.x += f.sp * dt;
      f.y += Math.sin(S.time * f.wf + f.ph) * 10 * dt;
      if (f.sp > 0 && f.x > W + 70) { f.x = -70; f.y = 90 + Math.random() * 240; }
      if (f.sp < 0 && f.x < -70) { f.x = W + 70; f.y = 90 + Math.random() * 240; }
    }
  }

  /* ============================================================
     背景元素
     ============================================================ */
  const bubbles = [];
  const fishes = [];
  for (let i = 0; i < 5; i++) {
    fishes.push({
      x: Math.random() * W,
      y: 90 + Math.random() * 240,
      sp: (Math.random() < 0.5 ? -1 : 1) * (14 + Math.random() * 22),
      wf: 0.8 + Math.random() * 0.9,
      ph: Math.random() * TAU,
      size: 7 + Math.random() * 6,
      hue: 28 + Math.random() * 30
    });
  }

  /* 海底沙纹 */
  const SAND_LINES = [];
  for (let i = 0; i < 46; i++) {
    SAND_LINES.push({
      x: Math.random() * W,
      y: SEABED + 12 + Math.random() * 62,
      w: 22 + Math.random() * 90,
      a: 0.03 + Math.random() * 0.06
    });
  }

  /* 海草 */
  const WEEDS = [];
  for (let i = 0; i < 26; i++) {
    WEEDS.push({
      x: 20 + Math.random() * (W - 40),
      h: 40 + Math.random() * 80,
      ph: Math.random() * TAU,
      w: 1.6 + Math.random() * 1.8,
      hue: 150 + Math.random() * 30
    });
  }

  /* ============================================================
     绘制：水体
  ============================================================ */
  function drawWater() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.00, '#0b4a5c');
    g.addColorStop(0.26, '#073a4c');
    g.addColorStop(0.58, '#04222f');
    g.addColorStop(1.00, '#010a11');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 水面波纹（随潮汐上下起伏）
    const surf = 44 + Math.sin(TAU * S.p) * 16;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(W, 0);
    ctx.lineTo(W, surf);
    for (let x = W; x >= 0; x -= 14) {
      const y = surf
        + Math.sin(x * 0.021 + S.time * 1.3) * 6
        + Math.sin(x * 0.047 - S.time * 0.9) * 3.4;
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    const sg = ctx.createLinearGradient(0, 0, 0, surf + 30);
    sg.addColorStop(0, 'rgba(160, 245, 255, 0.34)');
    sg.addColorStop(1, 'rgba(120, 220, 240, 0.02)');
    ctx.fillStyle = sg;
    ctx.fill();
    ctx.restore();

    // 水面高光线
    ctx.beginPath();
    for (let x = 0; x <= W; x += 10) {
      const y = surf
        + Math.sin(x * 0.021 + S.time * 1.3) * 6
        + Math.sin(x * 0.047 - S.time * 0.9) * 3.4;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(190, 255, 255, 0.42)';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // 光柱（焦散）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 7; i++) {
      const bx = 40 + i * 108 + Math.sin(S.time * 0.28 + i * 1.5) * 28;
      const lg = ctx.createLinearGradient(bx, 0, bx + 90, SEABED);
      lg.addColorStop(0, 'rgba(120, 230, 250, 0.07)');
      lg.addColorStop(1, 'rgba(120, 230, 250, 0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(bx - 34, surf);
      ctx.lineTo(bx + 34, surf);
      ctx.lineTo(bx + 118, SEABED + 40);
      ctx.lineTo(bx - 118, SEABED + 40);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  /* ============================================================
     绘制：海底
     ============================================================ */
  function drawSeabed() {
    // 沙地
    const g = ctx.createLinearGradient(0, SEABED - 12, 0, H);
    g.addColorStop(0.00, '#0d3540');
    g.addColorStop(0.35, '#0a2833');
    g.addColorStop(1.00, '#04131b');
    ctx.beginPath();
    ctx.moveTo(0, SEABED + 16);
    for (let x = 0; x <= W; x += 24) {
      const y = SEABED + 12 + Math.sin(x * 0.017) * 9 + Math.sin(x * 0.043 + 1.2) * 4;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();

    // 沙纹
    for (let i = 0; i < SAND_LINES.length; i++) {
      const s = SAND_LINES[i];
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + s.w, s.y + 1.5);
      ctx.strokeStyle = 'rgba(150, 220, 230, ' + s.a + ')';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    // 岩石
    for (let i = 0; i < 6; i++) {
      const rx = 60 + i * 128 + (i % 2) * 30;
      const ry = SEABED + 26 + (i % 3) * 12;
      const rw = 26 + (i % 4) * 10;
      ctx.beginPath();
      ctx.ellipse(rx, ry, rw, rw * 0.62, (i % 3) * 0.2, 0, TAU);
      ctx.fillStyle = 'rgba(8, 30, 38, 0.92)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(80, 160, 180, 0.14)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 海草
    for (let i = 0; i < WEEDS.length; i++) {
      const wd = WEEDS[i];
      const flexAmt = 0.4 + P.flex * 0.9;
      ctx.beginPath();
      ctx.moveTo(wd.x, SEABED + 34);
      for (let s = 1; s <= 10; s++) {
        const t = s / 10;
        const sway = Math.sin(S.time * 1.05 + wd.ph + t * 2.6) * 16 * t * flexAmt;
        const tide = Math.sin(TAU * (S.p - wd.x / W * 0.5)) * 5 * t * P.amp;
        ctx.lineTo(wd.x + sway + tide, SEABED + 34 - wd.h * t);
      }
      ctx.strokeStyle = 'hsla(' + wd.hue + ', 48%, 30%, 0.72)';
      ctx.lineWidth = wd.w;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }

  /* ============================================================
     绘制：珊瑚（递归）
  ============================================================ */
  const glowPts = [];

  function drawCoralNode(node, x, y, ang, coral, p, amp, depth) {
    if (node.len <= 0.6) return;

    const t = depth / coral.maxDepth;         // 0 根部 → 1 枝梢
    const localP = p - coral.delay - t * 0.075;

    // 伸缩：枝梢摆动比根部大
    const stretch = 1 + amp * Math.sin(TAU * localP) * (0.26 + 0.78 * t);

    // 摆动
    const sway = Math.sin(S.time * 1.1 + coral.phase + t * 2.6)
               * 0.062 * (0.18 + t) * (0.35 + P.flex);

    const a = ang + sway;
    const len = node.len * stretch;
    const ex = x + Math.cos(a) * len;
    const ey = y + Math.sin(a) * len;

    // 颜色：根部深，枝梢亮
    const hue = coral.hue;
    const sat = 36 + t * 40;
    const lig = 20 + t * 44 + Math.max(0, Math.sin(TAU * localP)) * 6 * amp;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(ex, ey);
    ctx.lineWidth = coral.baseW * Math.pow(1 - t * 0.86, 1.15) + 0.6;
    ctx.strokeStyle = 'hsl(' + hue + ',' + sat + '%,' + lig + '%)';
    ctx.lineCap = 'round';
    ctx.stroke();

    // 枝梢珊瑚虫发光点
    if (node.children.length === 0 || depth >= coral.maxDepth - 1) {
      const pulse = Math.max(0, Math.sin(TAU * localP));
      glowPts.push({
        x: ex, y: ey,
        r: 1.6 + t * 2.2 + pulse * 2.6 * amp,
        a: (0.22 + pulse * 0.68 * amp) * (0.6 + t * 0.4),
        hue: hue
      });
    }

    for (let i = 0; i < node.children.length; i++) {
      const c = node.children[i];
      const spreadMul = 1 + amp * Math.sin(TAU * localP) * 0.30;
      drawCoralNode(c, ex, ey, a + c.angle * spreadMul, coral, p, amp, depth + 1);
    }
  }

  function drawCorals(p, amp) {
    glowPts.length = 0;

    for (let i = 0; i < corals.length; i++) {
      const c = corals[i];
      drawCoralNode(c.tree, c.x, c.y, -Math.PI / 2, c, p, amp, 0);
    }

    // 统一绘制发光点（加法混合）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < glowPts.length; i++) {
      const g = glowPts[i];
      if (g.a < 0.02) continue;
      const grd = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r * 3.4);
      grd.addColorStop(0, 'hsla(' + g.hue + ', 100%, 82%, ' + g.a + ')');
      grd.addColorStop(0.42, 'hsla(' + g.hue + ', 100%, 68%, ' + (g.a * 0.36) + ')');
      grd.addColorStop(1, 'hsla(' + g.hue + ', 100%, 60%, 0)');
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * 3.4, 0, TAU);
      ctx.fillStyle = grd;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * 0.72, 0, TAU);
      ctx.fillStyle = 'hsla(' + g.hue + ', 100%, 94%, ' + Math.min(1, g.a * 1.25) + ')';
      ctx.fill();
    }
    ctx.restore();
  }

  /* ============================================================
     绘制：气泡与小鱼
  ============================================================ */
  function drawBubbles() {
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      const a = clamp(b.life, 0, 1) * 0.6;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.strokeStyle = 'rgba(180, 240, 255, ' + a + ')';
      ctx.lineWidth = 1.1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.32, 0, TAU);
      ctx.fillStyle = 'rgba(220, 250, 255, ' + (a * 0.9) + ')';
      ctx.fill();
    }
  }

  function drawFishes() {
    ctx.save();
    ctx.globalAlpha = 0.72;
    for (let i = 0; i < fishes.length; i++) {
      const f = fishes[i];
      const dir = f.sp > 0 ? 1 : -1;

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(dir, 1);

      // 身体
      ctx.beginPath();
      ctx.ellipse(0, 0, f.size * 1.5, f.size * 0.72, 0, 0, TAU);
      ctx.fillStyle = 'hsla(' + f.hue + ', 72%, 62%, 0.72)';
      ctx.fill();

      // 尾巴
      ctx.beginPath();
      ctx.moveTo(-f.size * 1.35, 0);
      ctx.lineTo(-f.size * 2.25, -f.size * 0.62);
      ctx.lineTo(-f.size * 2.25, f.size * 0.62);
      ctx.closePath();
      ctx.fillStyle = 'hsla(' + f.hue + ', 72%, 56%, 0.6)';
      ctx.fill();

      // 眼睛
      ctx.beginPath();
      ctx.arc(f.size * 0.72, -f.size * 0.14, f.size * 0.20, 0, TAU);
      ctx.fillStyle = 'rgba(10, 20, 30, 0.85)';
      ctx.fill();

      ctx.restore();
    }
    ctx.restore();
  }

  /* ============================================================
     绘制：潮汐波形面板
  ============================================================ */
  function drawWavePanel() {
    const bx = 22, by = H - 96, bw = 240, bh = 74;

    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 12);
    else ctx.rect(bx, by, bw, bh);
    ctx.fillStyle = 'rgba(3, 18, 24, 0.76)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 230, 240, 0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    const midY = by + bh * 0.56;
    const ampPx = (bh * 0.32) * Math.max(0.05, P.amp);

    // 中轴
    ctx.beginPath();
    ctx.moveTo(bx + 10, midY);
    ctx.lineTo(bx + bw - 10, midY);
    ctx.strokeStyle = 'rgba(120, 230, 240, 0.16)';
    ctx.setLineDash([3, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 振幅参考线
    ctx.beginPath();
    ctx.moveTo(bx + 10, midY - ampPx);
    ctx.lineTo(bx + bw - 10, midY - ampPx);
    ctx.moveTo(bx + 10, midY + ampPx);
    ctx.lineTo(bx + bw - 10, midY + ampPx);
    ctx.strokeStyle = 'rgba(255, 216, 138, 0.14)';
    ctx.setLineDash([2, 6]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 正弦波（显示当前潮汐相位）
    const N = 130;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const ph = S.p + u * 1.0;
      const v = Math.sin(TAU * ph);
      const x = bx + 10 + u * (bw - 20);
      const y = midY - v * ampPx;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(110, 225, 245, 0.92)';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(110, 225, 245, 0.6)';
    ctx.shadowBlur = 7;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 珊瑚采样点（按 delay 分布）
    const dots = Math.min(16, corals.length);
    for (let i = 0; i < dots; i++) {
      const u = dots > 1 ? i / (dots - 1) : 0.5;
      const c = corals[Math.floor(u * (corals.length - 1))];
      const ph = S.p - (c ? c.delay : 0);
      const v = Math.sin(TAU * ph);
      const x = bx + 10 + u * (bw - 20);
      const y = midY - v * ampPx;

      ctx.beginPath();
      ctx.arc(x, y, 2.4, 0, TAU);
      ctx.fillStyle = 'rgba(200, 255, 200, ' + (0.32 + Math.max(0, v) * 0.68) + ')';
      ctx.fill();
    }

    // 当前相位标记
    const cx0 = bx + 10;
    const cy0 = midY - Math.sin(TAU * S.p) * ampPx;

    ctx.beginPath();
    ctx.moveTo(cx0, by + 8);
    ctx.lineTo(cx0, by + bh - 8);
    ctx.strokeStyle = 'rgba(255, 216, 138, 0.28)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx0, cy0, 4.6, 0, TAU);
    ctx.fillStyle = '#ffd88a';
    ctx.shadowColor = 'rgba(255, 216, 138, 0.9)';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;

    // 标签
    ctx.font = '600 10.5px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(120, 200, 220, 0.6)';
    ctx.fillText('潮汐正弦波 · 采样点 = 珊瑚', bx + 11, by + 15);

    ctx.restore();
  }

  /* ============================================================
     绘制：HUD
  ============================================================ */
  function drawHud() {
    ctx.font = '600 12.5px -apple-system, "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(130, 210, 225, 0.44)';

    let tag;
    if (P.amp < 0.04) {
      tag = '潮汐静止 · 珊瑚不再伸缩';
    } else {
      tag = '潮汐周期 T = ' + P.period.toFixed(2) + ' s   ·   波浪自左向右传播';
    }
    ctx.fillText(tag, 24, 34);

    // 相位指示条
    const bxx = 24, byy = 48, bww = 148;
    ctx.beginPath();
    ctx.rect(bxx, byy, bww, 5);
    ctx.fillStyle = 'rgba(60, 130, 150, 0.28)';
    ctx.fill();

    ctx.beginPath();
    ctx.rect(bxx, byy, bww * S.p, 5);
    ctx.fillStyle = 'rgba(130, 230, 245, 0.85)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(bxx + bww * S.p, byy + 2.5, 4.2, 0, TAU);
    ctx.fillStyle = '#ffd88a';
    ctx.fill();
  }

  /* ============================================================
     渲染
  ============================================================ */
  function render() {
    ctx.setTransform(KX, 0, 0, KY, 0, 0);
    ctx.clearRect(0, 0, W, H);

    drawWater();
    drawSeabed();

    // 珊瑚前方（y 小的先画 → 层次）
    corals.sort(function (a, b) { return a.y - b.y; });
    drawCorals(S.p, P.amp);

    drawBubbles();
    drawFishes();

    // 水下雾效
    const fog = ctx.createLinearGradient(0, H * 0.42, 0, H);
    fog.addColorStop(0, 'rgba(4, 24, 32, 0)');
    fog.addColorStop(1, 'rgba(2, 12, 18, 0.48)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, H * 0.42, W, H * 0.58);

    drawWavePanel();
    drawHud();
  }

  /* ============================================================
     主循环
  ============================================================ */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     UI
  ============================================================ */
  const tRange = document.getElementById('tRange');
  const aRange = document.getElementById('aRange');
  const nRange = document.getElementById('nRange');
  const wRange = document.getElementById('wRange');

  const tVal = document.getElementById('tVal');
  const aVal = document.getElementById('aVal');
  const nVal = document.getElementById('nVal');
  const wVal = document.getElementById('wVal');

  const roT = document.getElementById('roT');
  const roPhase = document.getElementById('roPhase');
  const roStretch = document.getElementById('roStretch');
  const roLevel = document.getElementById('roLevel');

  function syncLabels() {
    tVal.textContent = P.period.toFixed(2) + ' s';
    aVal.textContent = Math.round(P.amp * 100) + '%';
    nVal.textContent = P.count;
    wVal.textContent = Math.round(P.flex * 100) + '%';

    roT.textContent = P.period.toFixed(2) + ' s';
    roLevel.textContent = (Math.sin(TAU * S.p) >= 0 ? '涨潮 ↑' : '落潮 ↓');
  }

  setInterval(function () {
    roPhase.textContent = S.p.toFixed(3);
    const s = 1 + P.amp * Math.sin(TAU * S.p);
    roStretch.textContent = s.toFixed(3);
    roLevel.textContent = (Math.sin(TAU * S.p) >= 0 ? '涨潮 ↑' : '落潮 ↓');
  }, 90);

  tRange.addEventListener('input', function () {
    P.period = +this.value / 100;
    syncLabels();
    sndBlip(240 + (900 / P.period));
  });

  aRange.addEventListener('input', function () {
    P.amp = +this.value / 100;
    syncLabels();
    sndBlip(300 + P.amp * 260);
  });

  nRange.addEventListener('input', function () {
    P.count = +this.value;
    nVal.textContent = P.count;
    buildCorals();
    sndBlip(340 + P.count * 12);
  });

  wRange.addEventListener('input', function () {
    P.flex = +this.value / 100;
    syncLabels();
    sndBlip(400 + P.flex * 220);
  });

  document.getElementById('btnSync').addEventListener('click', function () {
    ensureAudio();
    // 消除相位差 → 所有珊瑚同时伸缩
    for (let i = 0; i < corals.length; i++) {
      corals[i].delay = 0;
    }
    P.amp = Math.max(P.amp, 0.55);
    aRange.value = Math.round(P.amp * 100);
    syncLabels();

    for (let i = 0; i < corals.length; i++) {
      corals[i].glow = 1;
    }
    playTideSwell();
    playCoralPing(523.25, 0.05);
    setTimeout(function () { playCoralPing(783.99, 0.038); }, 120);
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    ensureAudio();
    P.period = 4.0;
    P.amp = 0.65;
    P.count = 12;
    P.flex = 0.70;

    tRange.value = 400;
    aRange.value = 65;
    nRange.value = 12;
    wRange.value = 70;

    S.p = 0;
    buildCorals();
    syncLabels();

    playTideSwell();
    sndBlip(523.25);
  });

  /* ---------- 点击画面 ---------- */
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();

    const rect = cv.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width * W;
    const my = (e.clientY - rect.top) / rect.height * H;

    // 气泡
    for (let i = 0; i < 12; i++) {
      bubbles.push({
        x: mx + (Math.random() - 0.5) * 70,
        y: my + (Math.random() - 0.5) * 50,
        r: 1.5 + Math.random() * 4,
        sp: 26 + Math.random() * 52,
        ph: Math.random() * TAU,
        life: 1
      });
    }

    // 附近的珊瑚被"惊"到
    for (let i = 0; i < corals.length; i++) {
      const c = corals[i];
      const d = Math.hypot(c.x - mx, c.y - my);
      if (d < 210) {
        c.glow = Math.max(c.glow, 1 - d / 210);
      }
    }

    playStartle();
    playBubble();
  });

  /* ---------- 音效开关 ---------- */
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function () {
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    if (!muted) {
      ensureAudio();
      playCoralPing(880, 0.04);
    }
  });

  /* ============================================================
     启动
  ============================================================ */
  resizeCanvas();
  buildCorals();
  syncLabels();
  requestAnimationFrame(loop);

  window.addEventListener('pointerdown', function once() {
    ensureAudio();
    window.removeEventListener('pointerdown', once);
  });

})();
</script>
</body>
</html>
