<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双曲螺线章鱼 · Hyperbolic Spiral Octopus</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #1a1035 0%, #0d0722 55%, #05030f 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e3dcf8;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding: 22px;
    display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap;
  }
  .stage {
    flex: 1 1 580px; min-width: 300px;
    position: relative;
    aspect-ratio: 760 / 520;
    border-radius: 26px;
    overflow: hidden;
    background: #0a0620;
    box-shadow: 0 24px 54px -24px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(150, 120, 250, .2) inset;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  .sound-toggle {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    background: rgba(32, 22, 66, .82);
    color: #d0c4ff;
    box-shadow: 0 5px 16px -5px rgba(0, 0, 0, .85),
                0 0 0 1px rgba(150, 120, 250, .35) inset;
    transition: transform .12s;
    z-index: 3;
  }
  .sound-toggle:active { transform: scale(.92); }

  .panel {
    flex: 0 1 350px; min-width: 292px;
    background: rgba(22, 16, 46, .78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 26px;
    padding: 22px 22px 18px;
    box-shadow: 0 24px 54px -26px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(150, 120, 250, .18) inset;
    display: flex; flex-direction: column; gap: 13px;
  }
  h1 {
    font-size: 20px; margin: 0; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
    color: #eee7ff;
  }
  h1 .emoji { font-size: 23px; }

  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 17px; text-align: center;
    padding: 11px 10px; border-radius: 15px;
    background: linear-gradient(135deg, rgba(60, 42, 110, .9), rgba(36, 24, 72, .9));
    color: #c9b5ff;
    letter-spacing: .6px;
    box-shadow: 0 0 0 1px rgba(160, 130, 255, .25) inset;
    line-height: 1.5;
  }
  .formula b { color: #ffd88a; font-weight: 700; }
  .formula .note { font-size: 12px; color: #8f82c4; letter-spacing: .3px; }

  .sect {
    font-size: 12.5px; font-weight: 700; color: #9187bd;
    letter-spacing: .5px;
  }

  .sel {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .sel button {
    aspect-ratio: 1; border: none; border-radius: 11px;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; padding: 0;
    background: rgba(42, 30, 80, .9);
    color: #9c8fd4;
    box-shadow: 0 0 0 1px rgba(140, 115, 230, .3) inset;
    transition: all .15s;
  }
  .sel button:hover { background: rgba(56, 40, 104, .95); }
  .sel button.on {
    background: linear-gradient(180deg, #9b6cf6, #7040d8);
    color: #fff;
    box-shadow: 0 5px 16px -5px rgba(150, 100, 250, .95),
                0 0 0 1px rgba(210, 190, 255, .5) inset;
    transform: scale(1.06);
  }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    color: #a99ddb;
  }
  .field .val {
    color: #c9b5ff; font-variant-numeric: tabular-nums; font-size: 13.5px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #503a94, #9b6cf6);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: #17102e; border: 3.5px solid #a78bfa;
    box-shadow: 0 0 12px rgba(167, 139, 250, .7);
    transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #17102e; border: 3.5px solid #a78bfa;
    box-shadow: 0 0 12px rgba(167, 139, 250, .7);
  }
  input[type=range]::-moz-range-track {
    height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #503a94, #9b6cf6);
  }

  .btns { display: flex; gap: 10px; }
  button.main {
    flex: 1; padding: 11px 8px; border: none; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: .4px;
    background: linear-gradient(180deg, #9b6cf6, #7040d8);
    color: #fff;
    box-shadow: 0 7px 18px -8px rgba(150, 100, 250, .95);
    transition: transform .12s, filter .12s;
  }
  button.main:hover { filter: brightness(1.08); }
  button.main:active { transform: translateY(2px) scale(.98); }
  button.main.ghost {
    background: rgba(42, 30, 80, .95);
    color: #c9b5ff;
    box-shadow: 0 5px 14px -8px rgba(0, 0, 0, .9),
                0 0 0 1.5px rgba(150, 120, 250, .32) inset;
  }

  .hint {
    margin: 0; font-size: 12.5px; line-height: 1.7; color: #7d75a3;
    text-align: center;
  }
  .hint kbd {
    background: rgba(48, 36, 88, .9); border-radius: 5px; padding: 1px 6px;
    font-family: inherit; font-size: 11.5px; color: #c4b5fd;
    box-shadow: 0 0 0 1px rgba(150, 120, 250, .3) inset;
  }
  @media (max-width: 740px) {
    .wrap { padding: 14px; gap: 16px; }
    .panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
  </div>

  <div class="panel">
    <h1><span class="emoji">🐙</span> 双曲螺线章鱼</h1>

    <div class="formula">
      r = a / θ &nbsp;<span class="note">（双曲螺线）</span><br>
      <span class="note">θ → ∞ 时 r → 0，螺线无限收紧</span>
    </div>

    <div class="sect">选择触手（1 – 8）</div>
    <div class="sel" id="sel"></div>

    <div class="field">
      <div class="row"><span>触手长度 a</span><span class="val" id="lenVal">1.00</span></div>
      <input type="range" id="lenRange" min="50" max="180" step="1" value="100">
    </div>

    <div class="field">
      <div class="row"><span>卷曲圈数</span><span class="val" id="turnVal">1.80</span></div>
      <input type="range" id="turnRange" min="100" max="320" step="1" value="180">
    </div>

    <div class="field">
      <div class="row"><span>摆动幅度</span><span class="val" id="wobVal">0.50</span></div>
      <input type="range" id="wobRange" min="0" max="100" step="1" value="50">
    </div>

    <div class="btns">
      <button class="main" id="btnRand">随机姿态</button>
      <button class="main ghost" id="btnReset">重置</button>
    </div>

    <p class="hint">
      拖动滑杆调整选中触手 · <kbd>点击画面</kbd> 章鱼会吐泡泡<br>
      观察 θ 增大时，相邻两圈的间距如何逐渐收紧
    </p>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     基础
  ============================================================ */
  const W = 760, H = 520;
  const BODY = { x: 380, y: 268, r: 50 };

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resizeCanvas() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.max(1, Math.round(rect.width  * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
  }
  window.addEventListener('resize', resizeCanvas);

  /* ============================================================
     音频
  ============================================================ */
  let actx = null, muted = false;

  function ensureAudio() {
    if (muted) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, dur, type, vol, delay, freqEnd) {
    const ac = ensureAudio(); if (!ac) return;
    type = type || 'sine'; vol = vol || 0.055; delay = delay || 0;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur * 0.92);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }

  /** 泡泡声 */
  function bubbleSound(f0, f1, dur) {
    tone(f0, dur, 'sine', 0.062, 0, f1);
    tone(f0 * 1.5, dur * 0.75, 'triangle', 0.024, 0.015, f1 * 1.4);
  }

  /** 选中触手 */
  function playSelectSound(i) {
    const base = 380 + i * 34;
    tone(base, 0.1, 'sine', 0.05);
    tone(base * 1.34, 0.12, 'sine', 0.035, 0.055);
  }

  /** 切换音效短促提示 */
  let lastBlip = 0;
  function sndBlip(freq) {
    const now = performance.now();
    if (now - lastBlip < 68) return;
    lastBlip = now;
    tone(freq, 0.055, 'sine', 0.038);
  }

  /** 随机姿态：上行琶音 */
  function playRandomSound() {
    [392, 466.16, 523.25, 622.25, 698.46].forEach(function (f, i) {
      tone(f, 0.28, 'sine', 0.045 - i * 0.005, i * 0.06);
    });
  }

  /* ============================================================
     触手数据
  ============================================================ */
  const N_TENT = 8;

  const DEF = {
    len:   [1.10, 0.92, 1.16, 0.88, 1.04, 0.95, 1.14, 0.90],
    turns: [1.70, 1.92, 1.62, 2.00, 1.76, 1.86, 1.66, 1.94]
  };

  const tentacles = [];
  let selected = 0;

  function initTentacles() {
    tentacles.length = 0;
    for (let i = 0; i < N_TENT; i++) {
      tentacles.push({
        alpha: (i * 45 + 22.5) * Math.PI / 180,
        len: DEF.len[i],
        turns: DEF.turns[i],
        wobble: 0.5,
        hueShift: (i - 3.5) * 4.5,
        pulse: 0
      });
    }
  }

  /* ============================================================
     气泡
  ============================================================ */
  const bubbles = [];
  for (let i = 0; i < 34; i++) {
    bubbles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 1.2 + Math.random() * 3.4,
      sp: 10 + Math.random() * 26,
      ph: Math.random() * Math.PI * 2,
      a: 0.06 + Math.random() * 0.16
    });
  }

  /* ============================================================
     状态
  ============================================================ */
  const state = { time: 0 };

  /* ============================================================
     更新
  ============================================================ */
  function update(dt) {
    state.time += dt;

    // 触手脉冲衰减
    for (let i = 0; i < N_TENT; i++) {
      tentacles[i].pulse *= Math.exp(-dt * 3.6);
    }

    // 气泡上升
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      b.y -= b.sp * dt;
      b.x += Math.sin(state.time * 0.9 + b.ph) * 10 * dt;
      if (b.y < -12) {
        b.y = H + 12;
        b.x = Math.random() * W;
        b.r = 1.2 + Math.random() * 3.4;
      }
    }
  }

  /* ============================================================
     绘制：背景
  ============================================================ */
  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.00, '#100a28');
    g.addColorStop(0.42, '#160d33');
    g.addColorStop(1.00, '#07041a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 中央柔光
    const rg = ctx.createRadialGradient(BODY.x, BODY.y, 20, BODY.x, BODY.y, 340);
    rg.addColorStop(0, 'rgba(150, 110, 255, 0.14)');
    rg.addColorStop(0.5, 'rgba(120, 80, 220, 0.06)');
    rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    // 光柱
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const x = 90 + i * 152 + Math.sin(state.time * 0.32 + i * 1.3) * 26;
      const lg = ctx.createLinearGradient(x, 0, x + 70, H);
      lg.addColorStop(0, 'rgba(140, 100, 255, 0.075)');
      lg.addColorStop(1, 'rgba(140, 100, 255, 0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(x - 44, 0);
      ctx.lineTo(x + 44, 0);
      ctx.lineTo(x + 116, H);
      ctx.lineTo(x - 116, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // 气泡
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(190, 165, 255, ' + b.a + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(210, 190, 255, ' + (b.a * 0.9) + ')';
      ctx.fill();
    }
  }

  /* ============================================================
     绘制：单条触手（双曲螺线）
  ============================================================ */
  const TH0 = 1.5;        // 起始角（保证根部在身体内）
  const A_BASE = 122;     // 基础尺度
  const ROOT_DIST = 36;   // 根部距身体中心距离

  function drawTentacle(idx, time) {
    const t = tentacles[idx];

    const a = A_BASE * t.len;
    const r0 = a / TH0;
    const D = r0 + ROOT_DIST;

    // 脉冲让卷曲更紧
    const turns = t.turns * (1 + t.pulse * 0.30);
    const th1 = TH0 + Math.PI * 2 * turns;

    // 整体摆动
    const wob = Math.sin(time * 1.25 + idx * 1.17) * 0.07 * t.wobble;
    const alpha = t.alpha + wob;

    const ox = BODY.x + D * Math.cos(alpha);
    const oy = BODY.y + D * Math.sin(alpha);

    // 使 θ = θ0 时恰好指向身体中心
    const psi = alpha + Math.PI - TH0;

    const N = 90;
    const ratio = th1 / TH0;

    for (let k = 0; k <= N; k++) {
      const u = k / N;
      const th = TH0 * Math.pow(ratio, u);
      const r = a / th;

      // 尖端扭转
      const twist = Math.sin(time * 1.6 + u * 4.2 + idx * 0.9) * 0.085 * t.wobble * u;
      const ang = th + psi + twist;

      const px = ox + r * Math.cos(ang);
      const py = oy + r * Math.sin(ang);

      // 半径沿 θ 收紧，粗细沿 u 递减
      const wid = 14.5 * Math.pow(1 - u, 1.12) + 1.7;

      const hue = 262 + t.hueShift + u * 50;
      const sat = 58 + u * 22;
      const li  = 30 + u * 27;

      ctx.beginPath();
      ctx.arc(px, py, wid * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'hsl(' + hue + ', ' + sat + '%, ' + li + '%)';
      ctx.fill();
    }

    // 选中标记：在螺线中心画一个小环
    if (idx === selected) {
      const thEnd = th1;
      const rEnd = a / thEnd;
      const angEnd = thEnd + psi;
      const ex = ox + rEnd * Math.cos(angEnd);
      const ey = oy + rEnd * Math.sin(angEnd);

      ctx.beginPath();
      ctx.arc(ex, ey, 8 + Math.sin(time * 3) * 1.2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 235, 160, ' + (0.45 + 0.25 * Math.sin(time * 3)) + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
  }

  /* ============================================================
     绘制：章鱼身体
  ============================================================ */
  function drawBody(time) {
    const x = BODY.x, y = BODY.y, r = BODY.r;

    // 呼吸
    const br = 1 + Math.sin(time * 1.4) * 0.018;

    // 身体外辉光
    const halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.4);
    halo.addColorStop(0, 'rgba(150, 110, 255, 0.22)');
    halo.addColorStop(1, 'rgba(150, 110, 255, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(x - r * 2.4, y - r * 2.4, r * 4.8, r * 4.8);

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(br, br);
    ctx.translate(-x, -y);

    // 外套膜
    const g = ctx.createRadialGradient(
      x - r * 0.34, y - r * 0.40, r * 0.14,
      x, y, r * 1.30
    );
    g.addColorStop(0.00, '#c4a8ff');
    g.addColorStop(0.34, '#9a6cf5');
    g.addColorStop(0.72, '#6d3fd0');
    g.addColorStop(1.00, '#3f1e8c');

    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.06, r, 0, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.strokeStyle = 'rgba(200, 175, 255, 0.45)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // 头部高光
    ctx.beginPath();
    ctx.ellipse(x - r * 0.30, y - r * 0.44, r * 0.34, r * 0.20, -0.42, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
    ctx.fill();

    // 眼睛
    const eyeY = y - r * 0.16;
    const eyeOff = r * 0.44;
    const eyeR = r * 0.27;

    for (let s = 0; s < 2; s++) {
      const sgn = s === 0 ? -1 : 1;
      const ex = x + sgn * eyeOff;

      // 眼白
      ctx.beginPath();
      ctx.arc(ex, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fillStyle = '#f6f1ff';
      ctx.fill();
      ctx.strokeStyle = 'rgba(120, 90, 200, 0.5)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 瞳孔（缓慢游移）
      const px = ex + sgn * eyeR * 0.16 + Math.sin(time * 0.7) * eyeR * 0.10;
      const py = eyeY + eyeR * 0.06 + Math.cos(time * 0.55) * eyeR * 0.08;
      ctx.beginPath();
      ctx.arc(px, py, eyeR * 0.52, 0, Math.PI * 2);
      ctx.fillStyle = '#17082e';
      ctx.fill();

      // 高光
      ctx.beginPath();
      ctx.arc(px - eyeR * 0.20, py - eyeR * 0.24, eyeR * 0.20, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.fill();
    }

    // 腮红
    for (let s = 0; s < 2; s++) {
      const sgn = s === 0 ? -1 : 1;
      ctx.beginPath();
      ctx.ellipse(x + sgn * r * 0.72, y + r * 0.24, r * 0.20, r * 0.13, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 150, 200, 0.35)';
      ctx.fill();
    }

    ctx.restore();
  }

  /* ============================================================
     渲染
  ============================================================ */
  function render() {
    const kx = cv.width / W;
    const ky = cv.height / H;
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const time = state.time;

    drawBg();

    // 触手
    for (let i = 0; i < N_TENT; i++) {
      drawTentacle(i, time);
    }

    // 身体（盖住触手根部）
    drawBody(time);

    // HUD
    ctx.font = '600 12.5px -apple-system, "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(160, 140, 240, 0.42)';
    ctx.fillText('r = a / θ    触手 ' + (selected + 1) + ' / 8', 22, H - 20);
  }

  /* ============================================================
     主循环
  ============================================================ */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     UI
  ============================================================ */
  const selEl = document.getElementById('sel');
  const lenRange = document.getElementById('lenRange');
  const turnRange = document.getElementById('turnRange');
  const wobRange = document.getElementById('wobRange');
  const lenVal = document.getElementById('lenVal');
  const turnVal = document.getElementById('turnVal');
  const wobVal = document.getElementById('wobVal');

  const selBtns = [];
  for (let i = 0; i < N_TENT; i++) {
    const b = document.createElement('button');
    b.textContent = (i + 1);
    b.addEventListener('click', function () {
      ensureAudio();
      selected = i;
      syncSelUI();
      syncSliders();
      playSelectSound(i);
      tentacles[i].pulse = 1;
    });
    selEl.appendChild(b);
    selBtns.push(b);
  }

  function syncSelUI() {
    selBtns.forEach(function (b, i) {
      b.classList.toggle('on', i === selected);
    });
  }

  function syncSliders() {
    const t = tentacles[selected];
    lenRange.value = Math.round(t.len * 100);
    turnRange.value = Math.round(t.turns * 100);
    wobRange.value = Math.round(t.wobble * 100);
    lenVal.textContent = t.len.toFixed(2);
    turnVal.textContent = t.turns.toFixed(2);
    wobVal.textContent = t.wobble.toFixed(2);
  }

  lenRange.addEventListener('input', function () {
    const t = tentacles[selected];
    t.len = +this.value / 100;
    lenVal.textContent = t.len.toFixed(2);
    sndBlip(260 + t.len * 180);
  });

  turnRange.addEventListener('input', function () {
    const t = tentacles[selected];
    t.turns = +this.value / 100;
    turnVal.textContent = t.turns.toFixed(2);
    sndBlip(320 + t.turns * 130);
  });

  wobRange.addEventListener('input', function () {
    const t = tentacles[selected];
    t.wobble = +this.value / 100;
    wobVal.textContent = t.wobble.toFixed(2);
    sndBlip(400 + t.wobble * 240);
  });

  /* ---------- 随机姿态 ---------- */
  document.getElementById('btnRand').addEventListener('click', function () {
    ensureAudio();
    for (let i = 0; i < N_TENT; i++) {
      const t = tentacles[i];
      t.len = 0.70 + Math.random() * 0.85;
      t.turns = 1.10 + Math.random() * 1.80;
      t.wobble = 0.15 + Math.random() * 0.85;
      t.pulse = 1;
    }
    syncSliders();
    playRandomSound();
  });

  /* ---------- 重置 ---------- */
  document.getElementById('btnReset').addEventListener('click', function () {
    ensureAudio();
    initTentacles();
    selected = 0;
    syncSelUI();
    syncSliders();
    tone(523.25, 0.2, 'sine', 0.05);
    tone(392.00, 0.26, 'sine', 0.04, 0.09);
  });

  /* ---------- 点击画布：吐泡泡 ---------- */
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();

    const rect = cv.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width * W;
    const my = (e.clientY - rect.top) / rect.height * H;

    // 所有触手脉冲
    for (let i = 0; i < N_TENT; i++) tentacles[i].pulse = 1;

    // 从点击处冒出一串泡泡
    for (let i = 0; i < 7; i++) {
      bubbles.push({
        x: mx + (Math.random() - 0.5) * 40,
        y: my + (Math.random() - 0.5) * 30,
        r: 2 + Math.random() * 4.5,
        sp: 40 + Math.random() * 60,
        ph: Math.random() * Math.PI * 2,
        a: 0.25 + Math.random() * 0.35
      });
    }
    // 控制气泡总量
    while (bubbles.length > 90) bubbles.shift();

    bubbleSound(420 + Math.random() * 260, 120, 0.22);
    tone(160, 0.22, 'sine', 0.05, 0.02, 70);
    setTimeout(function () { bubbleSound(560, 180, 0.18); }, 110);
  });

  /* ---------- 音效开关 ---------- */
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function () {
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    if (!muted) { ensureAudio(); tone(660, 0.1, 'sine', 0.05); }
  });

  /* ============================================================
     启动
  ============================================================ */
  resizeCanvas();
  initTentacles();
  syncSelUI();
  syncSliders();
  requestAnimationFrame(loop);

  window.addEventListener('pointerdown', function once() {
    ensureAudio();
    window.removeEventListener('pointerdown', once);
  });

})();
</script>
</body>
</html>
