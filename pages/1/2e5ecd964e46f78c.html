<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>分数披萨店 · Fraction Pizza</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#1a0e08;
    color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;}

  /* ===== 顶部信息栏 ===== */
  #topbar{
    position:absolute;top:0;left:0;right:0;
    padding:16px 24px;
    display:flex;justify-content:space-between;align-items:flex-start;
    opacity:0;animation:fade 1.2s 0.2s ease forwards;
    pointer-events:none;
    gap:12px;
  }
  .tb-block{display:flex;flex-direction:column;gap:4px;}
  .tb-block.right{text-align:right;align-items:flex-end;}

  .tb-title-en{
    font-size:8px;letter-spacing:.5em;text-indent:.5em;
    color:rgba(255,190,120,.42);
    font-weight:300;
  }
  .tb-title{
    font-size:clamp(15px,2vw,22px);
    font-weight:300;letter-spacing:.20em;
    background:linear-gradient(96deg,#ffd080 0%,#ff9a4a 50%,#ff6a4a 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,150,80,.42));
  }

  .stat{
    display:flex;align-items:baseline;gap:8px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.08em;
  }
  .stat .k{color:rgba(255,200,160,.52);}
  .stat .v{color:rgba(255,225,180,.98);font-weight:600;font-size:13px;}
  .stat .v.gold{color:rgba(255,215,120,.98);}
  .stat .v.green{color:rgba(150,240,180,.98);}
  .stat .v.red{color:rgba(255,140,110,.98);}

  /* ===== 顾客对话框 ===== */
  #orderBox{
    position:absolute;
    top:100px;left:50%;transform:translateX(-50%);
    padding:16px 26px;
    border-radius:18px;
    background:rgba(40,22,12,.86);
    border:1.5px solid rgba(255,170,90,.42);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:
      0 20px 50px rgba(0,0,0,.60),
      0 0 40px rgba(255,140,60,.20);
    opacity:0;
    transition:opacity .4s, transform .4s cubic-bezier(.34,1.4,.64,1);
    pointer-events:none;
    z-index:15;
    text-align:center;
    max-width:94vw;
  }
  #orderBox.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  #orderBox.hidden{
    transform:translateX(-50%) translateY(-20px);
  }

  .order-customer{
    font-size:24px;
    margin-bottom:8px;
    line-height:1;
  }
  .order-speech{
    font-size:10px;
    letter-spacing:.20em;
    color:rgba(255,200,150,.62);
    margin-bottom:12px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
  }
  .order-fraction{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 18px;
    border-radius:12px;
    background:rgba(255,180,90,.12);
    border:1px solid rgba(255,180,90,.42);
    margin-bottom:10px;
  }
  .order-fraction .num{
    display:flex;flex-direction:column;align-items:center;
    font-family:"SF Mono",Consolas,Monaco,monospace;
  }
  .order-fraction .n{
    font-size:22px;font-weight:600;
    color:rgba(255,230,180,.98);
    line-height:1;
    padding:0 4px;
  }
  .order-fraction .bar{
    width:100%;height:2px;
    background:rgba(255,210,150,.72);
    margin:3px 0;
  }
  .order-fraction .d{
    font-size:22px;font-weight:600;
    color:rgba(255,230,180,.98);
    line-height:1;
    padding:0 4px;
  }
  .order-flavor{
    font-size:11px;
    letter-spacing:.14em;
    color:rgba(255,200,150,.82);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .order-flavor .sw{
    width:12px;height:12px;border-radius:50%;
    box-shadow:0 0 10px currentColor;
  }

  /* ===== 切分提示 ===== */
  #cutInfo{
    position:absolute;
    top:280px;left:50%;transform:translateX(-50%);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    color:rgba(255,210,160,.72);
    padding:6px 16px;
    border-radius:999px;
    background:rgba(40,22,12,.62);
    border:1px solid rgba(255,170,90,.24);
    opacity:0;
    transition:opacity .4s;
    pointer-events:none;
    z-index:12;
    text-align:center;
  }
  #cutInfo.show{opacity:1;}

  /* ===== 已选分数指示 ===== */
  #selectedInfo{
    position:absolute;
    bottom:160px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;
    padding:10px 22px;
    border-radius:14px;
    background:rgba(40,22,12,.78);
    border:1.5px solid rgba(255,170,90,.32);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    opacity:0;
    transition:opacity .4s;
    pointer-events:none;
    z-index:12;
    font-family:"SF Mono",Consolas,Monaco,monospace;
  }
  #selectedInfo.show{opacity:1;}
  #selectedInfo .k{
    font-size:9.5px;letter-spacing:.20em;
    color:rgba(255,200,150,.52);
  }
  #selectedInfo .frac{
    display:flex;flex-direction:column;align-items:center;
    font-size:16px;font-weight:600;
    color:rgba(255,235,190,.98);
    line-height:1.1;
  }
  #selectedInfo .frac .bar{
    width:100%;height:1.8px;
    background:rgba(255,215,150,.72);
    margin:2px 0;
  }
  #selectedInfo .frac.pending .n,
  #selectedInfo .frac.pending .d{
    color:rgba(255,215,150,.62);
  }

  /* ===== 底部按钮 ===== */
  #bottomBar{
    position:absolute;bottom:0;left:0;right:0;
    padding:0 24px 22px;
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    pointer-events:none;
    opacity:0;animation:fade 1.2s 1.0s ease forwards;
    z-index:15;
  }
  .btn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:11.5px;letter-spacing:.18em;
    padding:14px 26px;
    border-radius:13px;
    cursor:pointer;
    transition:.24s cubic-bezier(.34,1.4,.64,1);
    border:1.5px solid;
    position:relative;
    overflow:hidden;
    white-space:nowrap;
    pointer-events:auto;
  }
  .btn::before{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(140deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 42%);
    pointer-events:none;
  }
  .btn-serve{
    color:rgba(255,240,210,.98);
    background:linear-gradient(150deg,rgba(200,110,40,.90),rgba(140,60,20,.86));
    border-color:rgba(255,190,120,.72);
    box-shadow:0 8px 22px rgba(0,0,0,.45),
      0 0 22px rgba(255,150,60,.42),
      inset 0 1px 0 rgba(255,220,180,.28);
  }
  .btn-serve:hover:not(.disabled){
    transform:translateY(-2px);
    border-color:rgba(255,220,160,.98);
    box-shadow:0 12px 30px rgba(0,0,0,.52),
      0 0 40px rgba(255,170,70,.72),
      inset 0 1px 0 rgba(255,235,200,.42);
  }
  .btn-serve.disabled{
    opacity:.42;
    cursor:not-allowed;
    transform:none;
  }
  .btn-clear{
    color:rgba(255,210,170,.82);
    background:rgba(50,28,16,.72);
    border-color:rgba(255,160,90,.32);
  }
  .btn-clear:hover{
    border-color:rgba(255,190,120,.82);
    color:rgba(255,230,200,.98);
    background:rgba(70,38,20,.82);
    transform:translateY(-1px);
  }
  .btn-hint{
    color:rgba(255,230,180,.72);
    background:rgba(50,28,16,.62);
    border-color:rgba(255,180,100,.28);
  }
  .btn-hint:hover{
    border-color:rgba(255,210,140,.82);
    color:rgba(255,240,210,.98);
    transform:translateY(-1px);
  }

  /* ===== 音频指示 ===== */
  #audioDot{
    position:absolute;bottom:0;right:24px;
    padding-bottom:22px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.20em;
    color:rgba(255,180,140,.30);
    display:flex;align-items:center;gap:6px;
    opacity:0;animation:fade 1.2s 1.4s ease forwards;
    pointer-events:none;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(255,150,90,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(150,240,180,.92);
    box-shadow:0 0 9px rgba(150,240,180,.85);
  }
  #audioDot.on{color:rgba(150,220,180,.52);}

  /* ===== Toast ===== */
  #toast{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.86);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(16px,2.2vw,24px);
    font-weight:300;letter-spacing:.24em;
    color:rgba(180,255,210,.98);
    text-shadow:0 0 32px rgba(120,240,180,.85);
    opacity:0;pointer-events:none;
    transition:opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
    z-index:100;
    white-space:nowrap;
    text-align:center;
    padding:16px 32px;
    border-radius:16px;
    background:rgba(10,30,20,.80);
    border:1px solid rgba(140,240,190,.42);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    max-width:92vw;
  }
  #toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #toast.bad{
    color:rgba(255,180,150,.98);
    border-color:rgba(255,140,110,.62);
    background:rgba(44,16,10,.80);
    text-shadow:0 0 32px rgba(255,120,90,.85);
  }
  #toast.gold{
    color:rgba(255,235,160,.98);
    border-color:rgba(255,210,120,.72);
    background:rgba(52,32,10,.80);
    text-shadow:0 0 32px rgba(255,200,90,.95);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #topbar{padding:10px 14px;}
    .tb-title-en{display:none;}
    .tb-title{font-size:14px;}
    .stat{font-size:8.5px;}
    .stat .v{font-size:11px;}
    #orderBox{top:78px;padding:12px 18px;border-radius:14px;}
    .order-customer{font-size:20px;}
    .order-fraction .n,
    .order-fraction .d{font-size:18px;}
    #cutInfo{top:230px;font-size:9.5px;}
    #selectedInfo{bottom:130px;padding:8px 16px;}
    #selectedInfo .frac{font-size:14px;}
    #bottomBar{padding:0 12px 16px;gap:8px;}
    .btn{font-size:10px;padding:12px 16px;border-radius:10px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="topbar">
    <div class="tb-block">
      <div class="tb-title-en">FRACTION PIZZA</div>
      <div class="tb-title">分数披萨店</div>
    </div>
    <div class="tb-block right">
      <div class="stat">
        <span class="k">💰 营业额</span>
        <span class="v gold" id="moneyVal">$0</span>
      </div>
      <div class="stat">
        <span class="k">📈 第</span>
        <span class="v" id="levelVal">1</span>
        <span class="k">天</span>
      </div>
      <div class="stat">
        <span class="k">⭐ 好评</span>
        <span class="v green" id="repVal">0</span>
      </div>
    </div>
  </div>

  <div id="orderBox">
    <div class="order-customer" id="customerEmoji">🧑</div>
    <div class="order-speech" id="speech">我要一份…</div>
    <div class="order-fraction">
      <div class="num">
        <span class="n" id="ordN">1</span>
        <div class="bar"></div>
        <span class="d" id="ordD">2</span>
      </div>
    </div>
    <div class="order-flavor">
      <span class="sw" id="flavorSw"></span>
      <span id="flavorName">芝士披萨</span>
    </div>
  </div>

  <div id="cutInfo">披萨已切成 8 等份 · 点击选中需要的份数</div>

  <div id="selectedInfo">
    <span class="k">已选</span>
    <div class="frac pending" id="selFrac">
      <span class="n" id="selN">0</span>
      <div class="bar"></div>
      <span class="d" id="selD">8</span>
    </div>
  </div>

  <div id="bottomBar">
    <button class="btn btn-hint" id="btnHint">提 示</button>
    <button class="btn btn-clear" id="btnClear">清 空</button>
    <button class="btn btn-serve" id="btnServe">上 菜</button>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>厨房音 · 交互音</span>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, PIZZA_R = 0;

/* =========================================================
   口味库
   ========================================================= */
const FLAVORS = [
  { id: 'cheese',    name: '芝士披萨',   color: '#f5c842', emoji: '🧀' },
  { id: 'pepperoni', name: '辣肠披萨',   color: '#c83a2a', emoji: '🍕' },
  { id: 'mushroom',  name: '蘑菇披萨',   color: '#9a6a3a', emoji: '🍄' },
  { id: 'olive',     name: '橄榄披萨',   color: '#2a3a2a', emoji: '🫒' },
  { id: 'pepper',    name: '青椒披萨',   color: '#4ab84a', emoji: '🫑' },
  { id: 'basil',     name: '罗勒披萨',   color: '#2a8a4a', emoji: '🌿' }
];

/* =========================================================
   顾客表情
   ========================================================= */
const CUSTOMER_EMOJIS = ['🧑', '👩', '👨', '🧔', '👧', '👦', '👵', '👴', '🧓'];

/* =========================================================
   游戏状态
   ========================================================= */
const game = {
  money: 0,
  level: 1,
  reputation: 0,
  totalCorrect: 0,
  totalWrong: 0,
  combo: 0
};

/* 当前订单 */
const order = {
  num: 1,
  den: 2,
  rawNum: 1,
  rawDen: 2,
  slices: 4,
  flavor: FLAVORS[0],
  customer: '🧑',
  expectedSlices: 2,
  price: 8,
  active: false
};

/* 已选中的块 */
let selected = [];

/* 每块上的配料坐标（预计算） */
let toppings = [];

/* =========================================================
   音效系统
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let ambTimer = null;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.42, ac.currentTime, 1.6);

  startAmbience();
  scheduleAmbience();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioDot(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioDot(true);
  }
}

/* ---- 厨房氛围：温暖爵士和弦 ---- */
function startAmbience(){
  const now = ac.currentTime;

  /* C 大九和弦：C E G B D */
  const notes = [130.81, 164.81, 196.00, 246.94, 293.66];
  const gains = [1.00, 0.62, 0.42, 0.28, 0.16];

  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
    osc.frequency.value = notes[i];

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 480;
    lp.Q.value = 1.0;

    const g = ac.createGain();
    g.gain.value = 0;
    g.gain.setTargetAtTime(0.011 * gains[i], now, 3.0);

    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.024 + i * 0.011;
    const lfoG = ac.createGain();
    lfoG.gain.value = 0.004 * gains[i];
    lfo.connect(lfoG);
    lfoG.connect(g.gain);
    lfo.start();

    osc.connect(lp);
    lp.connect(g);
    g.connect(master);
    osc.start();
  }
}

/* ---- 厨房碰撞声 ---- */
function playClatter(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const nl = Math.ceil(ac.sampleRate * 0.07);
  const buf = ac.createBuffer(1, nl, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const t = i / nl;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.0);
  }
  const src = ac.createBufferSource();
  src.buffer = buf;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2400 + Math.random() * 1800;
  bp.Q.value = 2.4;

  const g = ac.createGain();
  g.gain.value = 0.006 + Math.random() * 0.006;

  src.connect(bp);
  bp.connect(g);
  g.connect(master);
  src.start(now);
}

function scheduleAmbience(){
  if (ambTimer) clearTimeout(ambTimer);
  const wait = 2200 + Math.random() * 4200;
  ambTimer = setTimeout(function(){
    if (audioReady && ac && ac.state === 'running') playClatter();
    scheduleAmbience();
  }, wait);
}

/* ---- 点击切片 ---- */
function playSliceClick(selectedOn){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const f = selectedOn ? 880 : 620;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * (selectedOn ? 1.32 : 0.72), now + 0.06);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.020, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.10);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.12);

  /* 加一点"咔"声 */
  if (selectedOn){
    const nl = Math.ceil(ac.sampleRate * 0.02);
    const buf = ac.createBuffer(1, nl, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < nl; i++){
      const t = i / nl;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 4);
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 3600;
    bp.Q.value = 3.0;
    const g2 = ac.createGain();
    g2.gain.value = 0.010;
    src.connect(bp);
    bp.connect(g2);
    g2.connect(master);
    src.start(now);
  }
}

/* ---- 上菜成功 ---- */
function playSuccess(combo){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 基础三音和弦 */
  const base = [523.25, 659.25, 783.99];

  /* 连击提升音高 */
  const comboBoost = Math.min(combo, 5) * 0.08;
  const mult = 1 + comboBoost;

  for (let i = 0; i < base.length; i++){
    const f = base[i] * mult;

    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;

    const g = ac.createGain();
    const t0 = now + i * 0.06;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.042, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.1);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.3);

    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = f * 2;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.02);
    g2.gain.linearRampToValueAtTime(0.014, t0 + 0.04);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.85);
    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.02);
    osc2.stop(t0 + 1.0);
  }

  /* 收银机叮声 */
  const ding = ac.createOscillator();
  ding.type = 'sine';
  ding.frequency.setValueAtTime(1800, now + 0.18);
  ding.frequency.exponentialRampToValueAtTime(2400, now + 0.22);

  const dg = ac.createGain();
  dg.gain.setValueAtTime(0, now + 0.18);
  dg.gain.linearRampToValueAtTime(0.026, now + 0.20);
  dg.gain.exponentialRampToValueAtTime(0.0002, now + 0.55);

  ding.connect(dg);
  dg.connect(master);
  ding.start(now + 0.18);
  ding.stop(now + 0.60);
}

/* ---- 上菜错误 ---- */
function playFail(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  for (let k = 0; k < 2; k++){
    const t0 = now + k * 0.18;

    const osc = ac.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, t0);
    osc.frequency.exponentialRampToValueAtTime(160, t0 + 0.16);

    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.028, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 0.22);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 0.24);
  }
}

/* ---- 新订单提示 ---- */
function playNewOrder(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [659.25, 880.00];
  for (let i = 0; i < notes.length; i++){
    const t0 = now + i * 0.09;
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.024, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 0.35);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 0.40);
  }
}

/* =========================================================
   数学工具
   ========================================================= */
function gcd(a, b){
  a = Math.abs(a);
  b = Math.abs(b);
  while (b){
    const t = b;
    b = a % b;
    a = t;
  }
  return a || 1;
}

/* =========================================================
   订单生成
   ========================================================= */
function generateOrder(){
  /* 根据关卡决定分母范围与倍数 */
  let denChoices;

  if (game.level <= 2){
    denChoices = [2, 3, 4];
  } else if (game.level <= 4){
    denChoices = [2, 3, 4, 5, 6];
  } else if (game.level <= 6){
    denChoices = [3, 4, 5, 6, 8];
  } else {
    denChoices = [4, 5, 6, 8, 9, 10];
  }

  const den = denChoices[Math.floor(Math.random() * denChoices.length)];
  let num = 1 + Math.floor(Math.random() * (den - 1));

  /* 偶尔来整份或半份 */
  if (Math.random() < 0.08) num = den;

  /* 简化分数用于显示 */
  const g = gcd(num, den);
  const sn = num / g;
  const sd = den / g;

  /* 切块数 = 分母 × 倍数 */
  let mult = 1;
  if (game.level >= 3){
    mult = Math.random() < 0.5 ? 1 : 2;
  }
  if (game.level >= 6){
    mult = Math.random() < 0.5 ? 2 : 3;
  }

  let slices = sd * mult;

  /* 避免太多切块 */
  while (slices > 16){
    slices -= sd;
    if (slices < sd) slices = sd;
  }

  const expected = (sn / sd) * slices;

  /* 价格：整份 20 元，按分数比例 */
  const price = Math.round((sn / sd) * 20);

  /* 随机口味 */
  const flavor = FLAVORS[Math.floor(Math.random() * FLAVORS.length)];
  const customer = CUSTOMER_EMOJIS[Math.floor(Math.random() * CUSTOMER_EMOJIS.length)];

  order.num = sn;
  order.den = sd;
  order.rawNum = num;
  order.rawDen = den;
  order.slices = slices;
  order.expectedSlices = expected;
  order.price = price;
  order.flavor = flavor;
  order.customer = customer;
  order.active = true;

  /* 重置选中 */
  selected = [];
  for (let i = 0; i < slices; i++) selected.push(false);

  /* 预计算配料位置 */
  toppings = [];
  const sliceAngle = TAU / slices;
  for (let i = 0; i < slices; i++){
    const mid = -Math.PI / 2 + (i + 0.5) * sliceAngle;
    const sliceTops = [];
    const count = 2 + Math.floor(Math.random() * 2);

    for (let k = 0; k < count; k++){
      const rr = PIZZA_R * (0.36 + Math.random() * 0.42);
      const aa = mid + (Math.random() - 0.5) * sliceAngle * 0.62;
      sliceTops.push({
        x: Math.cos(aa) * rr,
        y: Math.sin(aa) * rr,
        r: PIZZA_R * (0.035 + Math.random() * 0.025)
      });
    }
    toppings.push(sliceTops);
  }

  /* 更新界面 */
  updateOrderUI();
  updateSelectedUI();

  playNewOrder();
}

function updateSelectedUI(){

  for (let i = 0; i < selected.length; i++){

  }

  selN.textContent = count;

  /* 当选中数恰好能约分成订单分数时给出视觉提示 */
  const g = gcd(count, order.slices);
  const sn = count / g;
  const sd = order.slices / g;

  if (count > 0 && sn === order.num && sd === order.den){
    fracEl.classList.remove('pending');
  } else {
    fracEl.classList.add('pending');
  }
}

/* =========================================================
   Toast
   ========================================================= */
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(text, type){
  toastEl.textContent = text;
  toastEl.classList.remove('bad', 'gold');
  if (type === 'bad') toastEl.classList.add('bad');
  else if (type === 'gold') toastEl.classList.add('gold');

  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toastEl.classList.remove('show');

/* =========================================================
   画布
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.52;
  PIZZA_R = Math.min(W * 0.40, H * 0.30);
  PIZZA_R = Math.max(90, Math.min(PIZZA_R, 220));

  /* 重新计算配料位置比例 */
  if (order.active && toppings.length > 0){
    /* 保持比例，只是重新缩放半径 */
    /* toppings 用的是绝对半径，需要按旧比例换算 */
  }
}
window.addEventListener('resize', resize);

/* =========================================================
   绘制
   ========================================================= */
function drawBackground(t){
  /* 暖色木质背景 */
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.42, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  bg.addColorStop(0.00, '#2a1810');
  bg.addColorStop(0.42, '#1c0f08');
  bg.addColorStop(1.00, '#0a0402');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 桌面纹理光线 */
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(CX, CY - PIZZA_R * 0.4, 0, CX, CY, PIZZA_R * 3.4);
  glow.addColorStop(0.00, 'rgba(255, 190, 100, 0.16)');
  glow.addColorStop(0.42, 'rgba(255, 150, 60, 0.06)');
  glow.addColorStop(1.00, 'rgba(255, 120, 40, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}

function drawPizza(t){
  if (!order.active || order.slices === 0) return;

  const slices = order.slices;
  const sliceAngle = TAU / slices;

  /* 盘子/托盘阴影 */
  ctx.save();
  ctx.translate(CX, CY);

  ctx.beginPath();
  ctx.arc(0, PIZZA_R * 0.06, PIZZA_R * 1.14, 0, TAU);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
  ctx.fill();

  /* 木质托盘 */
  ctx.beginPath();
  ctx.arc(0, 0, PIZZA_R * 1.14, 0, TAU);
  const woodGrad = ctx.createRadialGradient(0, 0, PIZZA_R * 0.8, 0, 0, PIZZA_R * 1.15);
  woodGrad.addColorStop(0.00, '#5a3a1c');
  woodGrad.addColorStop(1.00, '#3a2210');
  ctx.fillStyle = woodGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120, 80, 40, 0.68)';
  ctx.lineWidth = 3;
  ctx.stroke();

  /* 饼皮 */
  ctx.beginPath();
  ctx.arc(0, 0, PIZZA_R, 0, TAU);
  const crustGrad = ctx.createRadialGradient(
    -PIZZA_R * 0.2, -PIZZA_R * 0.2, PIZZA_R * 0.4,
    0, 0, PIZZA_R
  );
  crustGrad.addColorStop(0.00, '#e8b878');
  crustGrad.addColorStop(0.85, '#c8914e');
  crustGrad.addColorStop(1.00, '#a06a2e');
  ctx.fillStyle = crustGrad;
  ctx.fill();

  /* 芝士圆 */
  ctx.beginPath();
  ctx.arc(0, 0, PIZZA_R * 0.86, 0, TAU);
  ctx.fillStyle = '#f0c860';
  ctx.fill();

  /* 每块 */
  for (let i = 0; i < slices; i++){
    const a0 = -Math.PI / 2 + i * sliceAngle;
    const a1 = a0 + sliceAngle;

    if (selected[i]){
      /* 高亮：亮金色 */
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, PIZZA_R * 0.86, a0, a1);
      ctx.closePath();

      const hlGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, PIZZA_R * 0.86);
      hlGrad.addColorStop(0.00, '#ffeaa0');
      hlGrad.addColorStop(1.00, '#ffd860');
      ctx.fillStyle = hlGrad;
      ctx.fill();
    }
  }

  /* 配菜 */
  const flavor = order.flavor;
  for (let i = 0; i < slices; i++){
    if (!selected[i]) continue;
    if (!toppings[i]) continue;

    for (let k = 0; k < toppings[i].length; k++){
      const tp = toppings[i][k];

      ctx.beginPath();
      ctx.arc(tp.x, tp.y, tp.r, 0, TAU);

      /* 高亮块的配料稍微亮一些 */
      const fg = ctx.createRadialGradient(
        tp.x - tp.r * 0.3, tp.y - tp.r * 0.3, 0,
        tp.x, tp.y, tp.r
      );
      fg.addColorStop(0.00, lighten(flavor.color, 0.32));
      fg.addColorStop(1.00, flavor.color);
      ctx.fillStyle = fg;
      ctx.fill();

      ctx.strokeStyle = 'rgba(0, 0, 0, 0.26)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }

  /* 未选中块的配料（暗一些） */
  for (let i = 0; i < slices; i++){
    if (selected[i]) continue;
    if (!toppings[i]) continue;

    for (let k = 0; k < toppings[i].length; k++){
      const tp = toppings[i][k];

      ctx.beginPath();
      ctx.arc(tp.x, tp.y, tp.r * 0.85, 0, TAU);
      ctx.fillStyle = 'rgba(120, 80, 40, 0.42)';
      ctx.fill();
    }
  }

  /* 切缝 */
  for (let i = 0; i < slices; i++){
    const a = -Math.PI / 2 + i * sliceAngle;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * PIZZA_R * 0.86, Math.sin(a) * PIZZA_R * 0.86);

    ctx.strokeStyle = 'rgba(120, 70, 30, 0.62)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.stroke();

    /* 内侧的高光 */
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * PIZZA_R * 0.86, Math.sin(a) * PIZZA_R * 0.86);
    ctx.strokeStyle = 'rgba(255, 235, 180, 0.20)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }

  /* 饼皮外圈 */
  ctx.beginPath();
  ctx.arc(0, 0, PIZZA_R * 0.88, 0, TAU);
  ctx.strokeStyle = 'rgba(160, 100, 40, 0.72)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 中心点 */
  ctx.beginPath();
  ctx.arc(0, 0, PIZZA_R * 0.035, 0, TAU);
  ctx.fillStyle = 'rgba(120, 70, 30, 0.72)';
  ctx.fill();

  /* 选中块数量提示环 */
  let count = 0;
  for (let i = 0; i < selected.length; i++){
    if (selected[i]) count++;
  }

  if (count > 0){
    const ratio = count / slices;
    const ringR = PIZZA_R * 1.09;

    /* 底环 */
    ctx.beginPath();
    ctx.arc(0, 0, ringR, 0, TAU);
    ctx.strokeStyle = 'rgba(255, 180, 90, 0.16)';
    ctx.lineWidth = 5;
    ctx.stroke();

    /* 已选进度 */
    ctx.beginPath();
    ctx.arc(0, 0, ringR, -Math.PI / 2, -Math.PI / 2 + TAU * ratio);
    ctx.strokeStyle = 'rgba(255, 210, 120, 0.92)';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.stroke();

    /* 光晕 */
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.arc(0, 0, ringR, -Math.PI / 2, -Math.PI / 2 + TAU * ratio);
    ctx.strokeStyle = 'rgba(255, 190, 90, 0.32)';
    ctx.lineWidth = 12;
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.restore();
}

/* 颜色变亮工具 */
function lighten(hex, amount){
  const c = hex.replace('#', '');
  const r = parseInt(c.substr(0, 2), 16);
  const g = parseInt(c.substr(2, 2), 16);
  const b = parseInt(c.substr(4, 2), 16);

  const nr = Math.min(255, Math.round(r + (255 - r) * amount));
  const ng = Math.min(255, Math.round(g + (255 - g) * amount));
  const nb = Math.min(255, Math.round(b + (255 - b) * amount));

  return 'rgb(' + nr + ',' + ng + ',' + nb + ')';
}

function draw(t){
  drawBackground(t);
  drawPizza(t);
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  draw(t);
}

/* =========================================================
   点击处理
   ========================================================= */
function handleCanvasClick(clientX, clientY){
  if (!order.active) return;

  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  const dx = x - CX;
  const dy = y - CY;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist > PIZZA_R * 0.90) return;
  if (dist < PIZZA_R * 0.05) return;

  let angle = Math.atan2(dy, dx);
  /* 从顶部开始（-π/2） */
  angle = angle + Math.PI / 2;
  while (angle < 0) angle += TAU;
  angle = angle % TAU;

  const sliceAngle = TAU / order.slices;
  const idx = Math.floor(angle / sliceAngle);

  if (idx >= 0 && idx < order.slices){
    selected[idx] = !selected[idx];
    playSliceClick(selected[idx]);
    updateSelectedUI();
  }
}

canvas.addEventListener('pointerdown', function(e){
  initAudio();
  handleCanvasClick(e.clientX, e.clientY);
});

/* 触摸优化 */
canvas.addEventListener('touchstart', function(e){
  initAudio();
  if (e.touches.length === 1){
    e.preventDefault();
    handleCanvasClick(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

/* =========================================================
   上菜逻辑
   ========================================================= */
function serve(){
  if (!order.active) return;

  initAudio();

  /* 统计选中 */
  let count = 0;
  for (let i = 0; i < selected.length; i++){
    if (selected[i]) count++;
  }

  if (count === 0){
    showToast('还没有选披萨哦', 'bad');
    playFail();
    return;
  }

  /* 计算选中分数 */
  const g = gcd(count, order.slices);
  const sn = count / g;
  const sd = order.slices / g;

  const isCorrect = (sn === order.num && sd === order.den);

  if (isCorrect){
    /* 成功 */
    game.combo++;
    game.totalCorrect++;
    game.reputation++;

    /* 连击加成 */
    const comboBonus = Math.min(game.combo - 1, 5) * 2;
    const earned = order.price + comboBonus;

    game.money += earned;

    playSuccess(game.combo);

    let msg = '✓ 正确！+' + '$' + earned;
    if (game.combo >= 2){
      msg += ' · 连击 ×' + game.combo;
    }

    showToast(msg, game.combo >= 3 ? 'gold' : null);

    updateTopbar();

    /* 每 3 个好评升级 */
    if (game.reputation > 0 && game.reputation % 3 === 0){
      game.level++;
      setTimeout(function(){
        showToast('🎉 生意升级！第 ' + game.level + ' 天', 'gold');
      }, 1400);
    }

    /* 进入下一单 */
    order.active = false;
    document.getElementById('orderBox').classList.add('hidden');

    setTimeout(function(){
      generateOrder();
    }, 1700);

  } else {
    /* 失败 */
    game.combo = 0;
    game.totalWrong++;

    if (game.reputation > 0) game.reputation--;

    playFail();

    let hint;
    if (count > order.expectedSlices){
      hint = '选多了 · 需要 ' + order.expectedSlices + ' / ' + order.slices + ' 块';
    } else {
      hint = '选少了 · 需要 ' + order.expectedSlices + ' / ' + order.slices + ' 块';
    }

    showToast('✗ ' + hint, 'bad');

    updateTopbar();
  }
}

/* =========================================================
   提示
   ========================================================= */
function showHint(){
  if (!order.active) return;
  initAudio();

  const need = order.expectedSlices;
  const total = order.slices;

  showToast('提示：' + order.num + '/' + order.den + ' = ' +
    need + '/' + total + '，选 ' + need + ' 块', 'gold');

  /* 额外用界面文字显示一次 */
  document.getElementById('cutInfo').textContent =
    '需要 ' + order.num + '/' + order.den + ' × ' + total + ' = ' + need + ' 块';

  playNewOrder();
}

/* =========================================================
   清空
   ========================================================= */
function clearSelection(){
  if (!order.active) return;
  initAudio();
  for (let i = 0; i < selected.length; i++) selected[i] = false;
  playSliceClick(false);
  updateSelectedUI();

  document.getElementById('cutInfo').textContent =
    '这张披萨切成了 ' + order.slices + ' 等份 · 点击选中需要的块数';
}

/* =========================================================
   按钮绑定

document.getElementById('btnServe').addEventListener('click', function(e){
  e.stopPropagation();
  serve();
});

document.getElementById('btnClear').addEventListener('click', function(e){
  e.stopPropagation();
  clearSelection();
});

document.getElementById('btnHint').addEventListener('click', function(e){
  e.stopPropagation();
  showHint();
});

/* =========================================================
   键盘
   ========================================================= */
window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    serve();
  } else if (e.key === 'c' || e.key === 'C' || e.key === 'Escape'){
    initAudio();
    clearSelection();
  } else if (e.key === 'h' || e.key === 'H'){
    initAudio();
    showHint();
  }
});

   首次交互初始化音频
   ========================================================= */
window.addEventListener('pointerdown', function(){
  initAudio();
}, { once: false });

/* =========================================================
   启动
   ========================================================= */
resize();
updateTopbar();
generateOrder();

requestAnimationFrame(loop);

/* 欢迎语 */
setTimeout(function(){
  showToast('欢迎光临！按订单切披萨', 'gold');
}, 900);

})();
