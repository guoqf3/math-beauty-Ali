<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enneper极小曲面 · 闭合曲线</title>
    <style>
        :root {
            --bg: #04040e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.05rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.11em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(190, 165, 140, 0.5), 0 0 6px rgba(170, 148, 125, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.68rem, 1.25vw, 0.82rem);
            font-weight: 300;
            letter-spacing: 0.07em;
            color: rgba(200, 192, 180, 0.7);
            margin-top: 0.25em;
            text-shadow: 0 0 13px rgba(155, 140, 120, 0.3);
        }
        #formula-overlay {
            bottom: clamp(16px, 4vh, 44px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.64rem, 1.15vw, 0.86rem);
            font-style: italic;
            letter-spacing: 0.04em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(155, 140, 125, 0.42), 0 0 5px rgba(165, 148, 130, 0.28);
            line-height: 1.6;
            background: rgba(10, 9, 16, 0.48);
            padding: 0.42em 1.3em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(145, 125, 105, 0.22);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.32em 0.8em;
                letter-spacing: 0.02em;
                font-size: 0.56rem;
            }
            #title-overlay .title {
                letter-spacing: 0.07em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">Enneper极小曲面 · 闭合曲线</div>
        <div class="subtitle">Closed Curves on the Enneper Minimal Surface</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            r(u,v) = (u − u³/3 + u v² , v − v³/3 + v u² , u² − v²)
            &emsp;|&emsp; (u,v) = (R cos(t+φ), R sin(t+φ)), t∈[0,2π]
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        // 曲线采样点数
        const CURVE_SEGMENTS = 800;
        const TOTAL_VERTICES = CURVE_SEGMENTS + 1;

        // ==================== 三种颜色 ====================
        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');
        const THREE_COLORS = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        // Enneper曲面参数函数
        function enneper(u, v) {
            const u2 = u * u;
            const v2 = v * v;
            const x = u - u2 * u / 3 + u * v2;
            const y = v - v2 * v / 3 + v * u2;
            const z = u2 - v2;
            return [x, y, z];
        }

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x04040e, 0.00006);

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.4, 18);
        camera.position.set(1.2, 1.4, 4.6);
        camera.lookAt(0, 0.08, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 主旋转组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 200;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 3.5 + Math.random() * 4.2;
            starPosArr[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phi) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xb8b2cb,
            size: 0.010,
            transparent: true,
            opacity: 0.28,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const starPts = new THREE.Points(starGeom, starMat);
        starsGroup.add(starPts);

        // 曲面附近漂浮光点
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 80;
        const glowArr = new Float32Array(glowCount * 3);
        for (let i = 0; i < glowCount; i++) {
            const u = (Math.random() - 0.5) * 2.4;
            const v = (Math.random() - 0.5) * 2.4;
            const [x, y, z] = enneper(u, v);
            glowArr[i * 3] = x + (Math.random() - 0.5) * 0.3;
            glowArr[i * 3 + 1] = y + (Math.random() - 0.5) * 0.3;
            glowArr[i * 3 + 2] = z + (Math.random() - 0.5) * 0.3;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e2cc,
            size: 0.022,
            transparent: true,
            opacity: 0.44,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const glowPts = new THREE.Points(glowGeom, glowMat);
        glowGroup.add(glowPts);

        // ==================== Enneper曲面参考线框 ====================
        const surfaceWireGroup = new THREE.Group();
        mainGroup.add(surfaceWireGroup);
        const bgWireMats = [];

        function createEnneperULine(v0, uMin, uMax, steps = 220) {
            const pts = [];
            for (let i = 0; i <= steps; i++) {
                const u = uMin + (i / steps) * (uMax - uMin);
                const [x, y, z] = enneper(u, v0);
                pts.push(new THREE.Vector3(x, y, z));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x3e3a54,
                transparent: true,
                opacity: 0.14,
                depthWrite: false,
            });
            bgWireMats.push(mat);
            return new THREE.Line(geom, mat);
        }

        function createEnneperVLine(u0, vMin, vMax, steps = 220) {
            const pts = [];
            for (let i = 0; i <= steps; i++) {
                const v = vMin + (i / steps) * (vMax - vMin);
                const [x, y, z] = enneper(u0, v);
                pts.push(new THREE.Vector3(x, y, z));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x3e3a54,
                transparent: true,
                opacity: 0.14,
                depthWrite: false,
            });
            bgWireMats.push(mat);
            return new THREE.Line(geom, mat);
        }

        const RANGE = 1.25;
        const STEP = 0.18;
        // 生成曲面网格
        for (let u = -RANGE; u <= RANGE + 0.001; u += STEP) {
            surfaceWireGroup.add(createEnneperVLine(u, -RANGE, RANGE));
        }
        for (let v = -RANGE; v <= RANGE + 0.001; v += STEP) {
            surfaceWireGroup.add(createEnneperULine(v, -RANGE, RANGE));
        }
        // 边界强调
        {
            const boundU1 = createEnneperULine(-RANGE, -RANGE, RANGE);
            const boundU2 = createEnneperULine(RANGE, -RANGE, RANGE);
            const boundV1 = createEnneperVLine(-RANGE, -RANGE, RANGE);
            const boundV2 = createEnneperVLine(RANGE, -RANGE, RANGE);
            [boundU1, boundU2, boundV1, boundV2].forEach(line => {
                line.material.color.setHex(0x5a5478);
                line.material.opacity = 0.20;
                surfaceWireGroup.add(line);
            });
        }

        // ==================== Enneper曲面上的闭合曲线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        function createClosedCurve(Radius, phase, color) {
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            for (let i = 0; i <= CURVE_SEGMENTS; i++) {
                const t = (i / CURVE_SEGMENTS) * Math.PI * 2;
                const u = Radius * Math.cos(t + phase);
                const v = Radius * Math.sin(t + phase);
                const [x, y, z] = enneper(u, v);
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setDrawRange(0, 0);

            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.84,
                depthWrite: false,
            });
            const line = new THREE.Line(geometry, material);
            allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
            return line;
        }

        // 半径序列
        const radii = [0.4, 0.58, 0.76, 0.94, 1.10, 1.25];

        // 金色组 (相位0)
        radii.forEach(r => {
            curvesGroup.add(createClosedCurve(r, 0, COLOR_WARM_GOLD));
        });
        // 玫瑰粉组 (相位 2π/3)
        radii.forEach(r => {
            curvesGroup.add(createClosedCurve(r, 2 * Math.PI / 3, COLOR_ROSE));
        });
        // 青蓝组 (相位 4π/3)
        radii.forEach(r => {
            curvesGroup.add(createClosedCurve(r, 4 * Math.PI / 3, COLOR_CYAN));
        });

        const totalCurves = allCurveData.length; // 18条

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        clock.getDelta(); // 消耗初始累积

        function getCycleTime() {
            const now = performance.now() / 1000;
            return (now - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            // 主旋转
            mainGroup.rotation.y += 0.24 * dt;
            mainGroup.rotation.x += 0.055 * dt;
            mainGroup.rotation.z += 0.014 * Math.sin(cycleTime * 0.57) * dt;

            // 相机微动
            const sway = 0.10 * Math.sin(cycleTime * (Math.PI * 2 / 35));
            camera.position.y = 1.4 + sway;
            camera.lookAt(0, 0.08, 0);

            // 绘制进度
            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            // 更新所有曲线绘制范围
            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            // 背景透明度渐变
            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.28 * bgOp;
            glowMat.opacity = 0.44 * bgOp;
            for (const mat of bgWireMats) {
                mat.opacity = (mat.opacity ?? 0.14) * bgOp;
            }

            // 粒子微动
            glowGroup.rotation.y += dt * 0.09;
            glowGroup.rotation.x += dt * 0.05;
            starsGroup.rotation.y += dt * 0.025;
            starsGroup.rotation.x += dt * 0.018;

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 可选重置键
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        // 预热渲染，防止第一帧空白
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🌐 Enneper极小曲面闭合曲线动画已启动');
        console.log(`   - ${totalCurves} 条闭合曲线，3种颜色各${totalCurves / 3}条`);
        console.log(`   - 半径范围：[${radii[0]}, ${radii[radii.length - 1]}]，相位偏移 0 / 2π/3 / 4π/3`);
        console.log(`   - 采样点：${CURVE_SEGMENTS}，周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
