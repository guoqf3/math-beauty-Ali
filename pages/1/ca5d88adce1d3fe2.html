<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科赫雪花 · 分形雪花水螅</title>
<style>
  :root{ --split: 20%; }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
  }

  /* ================= 左侧：科赫雪花方程 ================= */
  #left{
    position:fixed; left:0; top:0; bottom:0;
    width: var(--split);
    display:flex; align-items:center; justify-content:center;
    padding: 18px 9px;
    background:
      radial-gradient(120% 80% at 18% 22%, rgba(110,220,255,.08), transparent 62%),
      radial-gradient(120% 80% at 82% 84%, rgba(190,80,255,.07), transparent 62%),
      #000;
    border-right:1px solid rgba(130,220,255,.16);
    color:#9fe4ff;
    font-family:"Cambria Math","Latin Modern Math","Times New Roman",serif;
    overflow:hidden;
    z-index:2;
  }
  #left::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(140,225,255,.05) 50%, transparent 100%);
    background-size:100% 220%;
    animation: scan 11s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ from{ background-position: 0 -110%; } to{ background-position: 0 110%; } }

  .stack{ width:100%; text-align:center; position:relative; z-index:1; }

  .kicker{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(7px, .55vw, 10px);
    letter-spacing:.28em;
    color: rgba(150,225,255,.48);
    margin-bottom: 1.7em;
    white-space: nowrap;
  }

  .eq{
    font-size: clamp(8px, .92vw, 16px);
    line-height: 1.92;
    color:#a8e8ff;
    text-shadow:
      0 0 10px rgba(110,215,255,.55),
      0 0 26px rgba(60,170,255,.20);
    animation: pulse 6s ease-in-out infinite;
    word-break: keep-all;
  }
  .eq.big{
    font-size: clamp(9px, 1.02vw, 18px);
    color:#c4f0ff;
  }
  .eq i{ font-style: italic; }
  .eq b{
    font-weight:600; color:#c95cff;
    text-shadow: 0 0 10px rgba(200,90,255,.7), 0 0 24px rgba(160,0,255,.32);
  }
  .eq sup, .eq sub{ font-size:.6em; }

  @keyframes pulse{
    0%,100%{ opacity:.84; }
    50%    { opacity:1; }
  }

  .frac{
    display:inline-flex; flex-direction:column;
    vertical-align:middle; text-align:center;
    font-size:.84em; line-height:1.06;
    margin:0 .18em;
  }
  .frac > span:first-child{
    border-bottom:1px solid rgba(160,230,255,.8);
    padding:0 .22em .05em;
  }
  .frac > span:last-child{ padding-top:.05em; }

  .rule{
    height:1px; width:62%;
    margin: 1.45em auto;
    background:linear-gradient(90deg, transparent, rgba(130,220,255,.42), transparent);
  }

  .meta{
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(7px, .54vw, 10px);
    letter-spacing:.16em;
    color: rgba(180,235,255,.6);
    white-space: nowrap;
  }
  .dot{
    display:inline-block; width:.6em; height:.6em; border-radius:50%;
    vertical-align:middle; margin:0 .3em 0 .1em;
  }
  .dot.ic{ background:#7fdcff; box-shadow:0 0 10px #7fdcff, 0 0 22px rgba(127,220,255,.6); }
  .dot.sv{ background:#e8f6ff; box-shadow:0 0 10px #e8f6ff, 0 0 22px rgba(232,246,255,.6); }
  .dot.pp{ background:#c04cff; box-shadow:0 0 10px #c04cff, 0 0 22px rgba(192,76,255,.6); }

  /* ================= 右侧：分形水螅 ================= */
  #right{
    position:fixed; left: var(--split); top:0; right:0; bottom:0;
    background:#000;
    overflow:hidden;
  }
  #right canvas{ display:block; position:absolute; inset:0; }

  @media (max-width: 900px){
    :root{ --split: 27%; }
    .kicker{ letter-spacing:.16em; }
    .meta{ letter-spacing:.06em; }
  }
</style>
</head>
<body>

<!-- ============ 左：公式 ============ -->
<div id="left">
  <div class="stack">
    <div class="kicker">KOCH SNOWFLAKE</div>

    <div class="eq big">
      <i>D</i> =
      <span class="frac"><span>ln 4</span><span>ln 3</span></span>
      ≈ 1.2619
    </div>

    <div class="rule"></div>

    <div class="eq">
      <i>P</i><sub>n</sub> = <i>P</i><sub>0</sub>
      ( <span class="frac"><span>4</span><span>3</span></span> )<sup>n</sup>
      &nbsp;→&nbsp; <b>∞</b>
    </div>

    <div class="rule"></div>

    <div class="eq">
      <i>A</i> =
      <span class="frac"><span>2√3</span><span>5</span></span>
      <i>a</i><sup>2</sup>
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span class="dot ic"></span>冰蓝
      <span class="dot sv"></span>银白
      <span class="dot pp"></span>霓虹紫
    </div>
  </div>
</div>

<!-- ============ 右：场景 ============ -->
<div id="right"></div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 画布与自适应
   ========================================================= */
const host = document.getElementById('right');
const cv   = document.createElement('canvas');
host.appendChild(cv);
const ctx  = cv.getContext('2d');

const TAU = Math.PI * 2;
let W, H, CX, CY, S, DPR;

/* 世界坐标：口盘在 y = MOUTH_Y，基盘在 y = 0 */
const MOUTH_Y  = 2.60;

/* ★ 关键改动：水螅的垂直包围盒为 y ∈ [0, 2.60]，
     中心在 1.30。把 SCENE_CY 设为 1.30，
     即让世界坐标 y=1.30 落在屏幕垂直中央。 */
const SCENE_CY = 1.30;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = host.clientWidth  || 1;
  H = host.clientHeight || 1;

  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.5;

  /* 世界视口约 5.5 × 6.3 */
  S = Math.min(W / 5.5, H / 6.3);
}
window.addEventListener('resize', resize);

/* =========================================================
   1. 小工具
   ========================================================= */
function hsl(h, s, l, a){
  return 'hsla(' + (((h % 360) + 360) % 360) + ',' + s + '%,' + l + '%,' + a + ')';
}

/* 体轴中心线：轻微摇摆 */
function bodyCenterX(s, t){
  return 0.085 * Math.sin(s * 2.6 + t * 0.85) * s
       + 0.024 * Math.sin(t * 1.25 + s * 6.5);
}

/* 半宽包络：基盘窄 → 体筒鼓 → 颈部收 → 口盘微张 */
function bodyHalfW(s, t){
  let w = 0.055;
  w += 0.395 * Math.sin(Math.PI * Math.pow(s, 0.72));
  w += 0.115 * Math.exp(-Math.pow((s - 0.965) / 0.085, 2));   // 口盘
  w *= 1 - 0.16 * Math.max(0, (s - 0.80) / 0.20);
  w *= 1 + 0.055 * Math.sin(t * 1.7 - s * 4.6);               // 呼吸
  return w;
}

/* =========================================================
   2. 分形雪枝（科赫式 ±60° 侧枝，深度递归）
   ========================================================= */
function addBranch(g, x, y, ang, len, depth, t, seed){
  if (depth < 0 || len < 0.035) return;

  const x2 = x + Math.cos(ang) * len;
  const y2 = y + Math.sin(ang) * len;

  g.moveTo(x, y);
  g.lineTo(x2, y2);

  if (depth > 0){
    const POS = [0.30, 0.58, 0.84];
    for (let k = 0; k < POS.length; k++){
      const f  = POS[k];
      const bx = x + Math.cos(ang) * len * f;
      const by = y + Math.sin(ang) * len * f;

      const jw = 0.13 * Math.sin(t * 2.1 + seed * 3.1 + f * 11 + len * 33);

      for (let sg = -1; sg <= 1; sg += 2){
        addBranch(
          g, bx, by,
          ang + sg * (Math.PI / 3) + jw,
          len * (0.42 - f * 0.14),
          depth - 1, t, seed + f * 7.7
        );
      }
    }
  }
}

/* =========================================================
   3. 单根触手：主轴 + 分形雪枝
   ========================================================= */
function buildTentacle(g, x0, y0, a0, a1, len, t, seed, depth){
  const NP = 26;
  const pts = [];
  let x = x0, y = y0;
  const step = len / NP;

  for (let j = 0; j <= NP; j++){
    const ff = j / NP;
    pts.push({ x: x, y: y });

    let a = a0 + (a1 - a0) * Math.pow(ff, 1.45);
    a += 0.11 * Math.sin(t * 1.9 + seed + ff * 4.6);

    x += Math.cos(a) * step;
    y += Math.sin(a) * step;
  }

  g.moveTo(pts[0].x, pts[0].y);
  for (let j = 1; j <= NP; j++) g.lineTo(pts[j].x, pts[j].y);

  for (let j = 4; j < NP - 1; j += 3){
    const p = pts[j];
    const tang = Math.atan2(pts[j + 1].y - pts[j - 1].y,
                            pts[j + 1].x - pts[j - 1].x);
    const fj = j / NP;
    const bl = len * 0.34 * (1 - fj * 0.72)
             * (0.65 + 0.55 * Math.sin(seed + j * 1.9 + t * 1.4));

    for (let sg = -1; sg <= 1; sg += 2){
      addBranch(g, p.x, p.y, tang + sg * Math.PI / 3,
                bl, depth, t, seed + j * 0.37);
    }
  }
}

/* =========================================================
   4. 全部触手
   ========================================================= */
const NT_OUT = 20;
const NT_IN  = 10;

function drawTentacles(t){
  const mouthX = bodyCenterX(1, t);
  const mouthY = MOUTH_Y;

  const hueRoot = 235 + 60 * Math.sin(t * 0.33);

  /* ---------- 外环 ---------- */
  for (let i = 0; i < NT_OUT; i++){
    const f    = (i + 0.5) / NT_OUT;
    const edge = Math.abs(f - 0.5) * 2;

    const spread = Math.PI * 0.86;
    const a0 = -Math.PI / 2 - spread / 2 + spread * f;
    const a1 = a0
      + (-Math.PI / 2 - a0) * (0.30 + 0.34 * edge)
      + (f - 0.5) * 0.24;

    const len  = (2.25 + 0.55 * edge) * (0.92 + 0.12 * Math.sin(i * 2.1));
    const seed = i * 1.37;

    ctx.beginPath();
    buildTentacle(ctx,
      mouthX + Math.cos(a0) * 0.05,
      mouthY + Math.sin(a0) * 0.05,
      a0, a1, len, t, seed, 2);

    const hue = hueRoot + 42 * edge + 14 * Math.sin(t * 1.1 + i * 0.7);
    const lig = 62 + 16 * Math.sin(t * 1.15 + i * 0.55);

    ctx.strokeStyle = hsl(hue, 100, 58, 0.10);
    ctx.lineWidth   = 0.032;
    ctx.stroke();

    ctx.strokeStyle = hsl(hue, 100, lig, 0.26);
    ctx.lineWidth   = 0.0105;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(238,250,255,0.36)';
    ctx.lineWidth   = 0.0042;
    ctx.stroke();
  }

  /* ---------- 内环 ---------- */
  for (let i = 0; i < NT_IN; i++){
    const f    = (i + 0.5) / NT_IN;
    const edge = Math.abs(f - 0.5) * 2;

    const spread = Math.PI * 0.55;
    const a0 = -Math.PI / 2 - spread / 2 + spread * f;
    const a1 = a0
      + (-Math.PI / 2 - a0) * 0.42
      + (f - 0.5) * 0.18;

    const len  = (1.35 + 0.35 * edge) * (0.9 + 0.1 * Math.sin(i * 3.1));
    const seed = 100 + i * 1.91;

    ctx.beginPath();
    buildTentacle(ctx,
      mouthX + Math.cos(a0) * 0.035,
      mouthY + Math.sin(a0) * 0.035,
      a0, a1, len, t, seed, 1);

    const hue = hueRoot + 30 * edge + 12 * Math.sin(t * 1.3 + i);
    ctx.strokeStyle = hsl(hue, 100, 62, 0.14);
    ctx.lineWidth   = 0.022;
    ctx.stroke();

    ctx.strokeStyle = hsl(hue, 100, 76, 0.28);
    ctx.lineWidth   = 0.009;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(235,250,255,0.42)';
    ctx.lineWidth   = 0.0038;
    ctx.stroke();
  }
}

/* =========================================================
   5. 身体：测地线网格
   ========================================================= */
function drawBody(t){
  const hueRoot = 235 + 60 * Math.sin(t * 0.33);
  const NV = 21, NH = 90, NS = 56;

  /* ---- 5.1 体积填充 ---- */
  ctx.beginPath();
  for (let j = 0; j <= NS; j++){
    const s = j / NS;
    const w = bodyHalfW(s, t), c = bodyCenterX(s, t);
    const y = s * MOUTH_Y;
    if (j === 0) ctx.moveTo(c + w, y); else ctx.lineTo(c + w, y);
  }
  for (let j = NS; j >= 0; j--){
    const s = j / NS;
    const w = bodyHalfW(s, t), c = bodyCenterX(s, t);
    ctx.lineTo(c - w, s * MOUTH_Y);
  }
  ctx.closePath();

  const g = ctx.createLinearGradient(0, 0, 0, MOUTH_Y);
  g.addColorStop(0.00, hsl(hueRoot + 60, 100, 62, 0.11));
  g.addColorStop(0.50, hsl(hueRoot + 20, 100, 66, 0.14));
  g.addColorStop(1.00, hsl(hueRoot - 20, 100, 78, 0.20));
  ctx.fillStyle = g;
  ctx.fill();

  /* ---- 5.2 横向环线 ---- */
  for (let k = 0; k <= NH; k++){
    const s = k / NH;
    const w = bodyHalfW(s, t), c = bodyCenterX(s, t);
    const y = s * MOUTH_Y;
    const bow = 0.015 * (1 - Math.abs(s - 0.5) * 0.6);

    ctx.beginPath();
    ctx.moveTo(c - w, y);
    ctx.quadraticCurveTo(c, y + bow, c + w, y);

    const hue = hueRoot + 55 * (1 - s) + 8 * Math.sin(t * 0.8 + k * 0.1);
    ctx.strokeStyle = hsl(hue, 100, 72,
      0.065 + 0.085 * (1 - Math.abs(s - 0.5)));
    ctx.lineWidth = 0.0055;
    ctx.stroke();
  }

  /* ---- 5.3 纵向测地线 ---- */
  for (let i = 0; i < NV; i++){
    const u = (i / (NV - 1)) * 2 - 1;

    ctx.beginPath();
    for (let j = 0; j <= NS; j++){
      const s = j / NS;
      const w = bodyHalfW(s, t)
              * (1 + 0.055 * Math.sin(s * 8.5 - t * 2.3 + u * 2.5));
      const x = bodyCenterX(s, t) + u * w;
      const y = s * MOUTH_Y;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }

    const hue = hueRoot + 45 * u + 12 * Math.sin(t * 0.8 + i * 0.9);
    ctx.strokeStyle = hsl(hue, 100, 74, 0.085 + 0.14 * (1 - Math.abs(u)));
    ctx.lineWidth = 0.006;
    ctx.stroke();
  }

  /* ---- 5.4 主脊 ---- */
  ctx.beginPath();
  for (let j = 0; j <= 80; j++){
    const s = j / 80;
    const x = bodyCenterX(s, t);
    const y = s * MOUTH_Y;
    if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = hsl(hueRoot - 30, 100, 82, 0.20);
  ctx.lineWidth = 0.011;
  ctx.stroke();

  /* ---- 5.5 基盘光晕 ---- */
  const bx = bodyCenterX(0, t);
  const gb = ctx.createRadialGradient(bx, 0, 0, bx, 0, 0.75);
  gb.addColorStop(0.0, hsl(hueRoot + 40, 100, 58, 0.30));
  gb.addColorStop(0.5, hsl(hueRoot + 10, 100, 70, 0.11));
  gb.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = gb;
  ctx.beginPath();
  ctx.arc(bx, 0, 0.75, 0, TAU);
  ctx.fill();

  /* ---- 5.6 口盘光晕 ---- */
  const mx = bodyCenterX(1, t);
  const gm = ctx.createRadialGradient(mx, MOUTH_Y, 0, mx, MOUTH_Y, 0.55);
  gm.addColorStop(0.0, 'rgba(238,250,255,0.36)');
  gm.addColorStop(0.4, hsl(hueRoot - 20, 100, 78, 0.16));
  gm.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = gm;
  ctx.beginPath();
  ctx.arc(mx, MOUTH_Y, 0.55, 0, TAU);
  ctx.fill();
}

/* =========================================================
   6. 漂浮冰晶微粒
   ========================================================= */
const particles = [];
for (let i = 0; i < 160; i++){
  particles.push({
    x0 : (Math.random() - 0.5) * 6.0,
    y0 : Math.random() * 6.5,
    r  : 0.005 + Math.random() * 0.014,
    sp : 0.04 + Math.random() * 0.13,
    ph : Math.random() * TAU,
    hOff: (Math.random() - 0.5) * 80,
    tw : 0.6 + Math.random() * 1.8
  });
}

function drawParticles(t){
  const hueRoot = 235 + 60 * Math.sin(t * 0.33);
  for (let i = 0; i < particles.length; i++){
    const p  = particles[i];
    const y  = ((p.y0 + t * p.sp) % 6.5) - 0.35;
    const x  = p.x0 + 0.16 * Math.sin(t * 0.45 + p.ph);
    const tw = 0.45 + 0.55 * Math.sin(t * p.tw * 2.1 + p.ph);

    ctx.fillStyle = hsl(hueRoot + p.hOff, 100, 80, 0.10 + 0.34 * tw);
    ctx.beginPath();
    ctx.arc(x, y, p.r * (0.7 + 0.6 * tw), 0, TAU);
    ctx.fill();

    if (p.r > 0.012){
      ctx.strokeStyle = hsl(hueRoot + p.hOff, 100, 90, 0.10 * tw);
      ctx.lineWidth = 0.0028;
      ctx.beginPath();
      ctx.moveTo(x - 0.075, y); ctx.lineTo(x + 0.075, y);
      ctx.moveTo(x, y - 0.075); ctx.lineTo(x, y + 0.075);
      ctx.stroke();
    }
  }
}

/* =========================================================
   7. 主循环
   ========================================================= */
let T = 0;
let last = performance.now();

function frame(now){
  requestAnimationFrame(frame);

  const dt = Math.min(0.05, (now - last) / 1000) || 0.016;
  last = now;
  T += dt;

  /* ---- 拖影 ---- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  ctx.fillRect(0, 0, W, H);

  /* ---- 世界坐标变换：水螅垂直居中 ---- */
  ctx.save();
  ctx.translate(CX, CY);
  ctx.scale(S, S);
  ctx.translate(0, -SCENE_CY);

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap   = 'round';
  ctx.lineJoin  = 'round';

  drawParticles(T);
  drawTentacles(T);
  drawBody(T);

  ctx.restore();
}

resize();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
