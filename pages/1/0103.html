<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维利萨如编织 · 频率谐振之舞</title>
    <style>
        :root {
            --bg: #040410;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        /* 标题 */
        #title-overlay {
            position: fixed;
            top: clamp(20px, 4vh, 44px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #title-overlay h1 {
            color: #e0cfb0;
            font-size: clamp(1.2rem, 2.3vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 28px rgba(210, 175, 130, 0.5), 0 0 70px rgba(180, 140, 100, 0.25);
            margin: 0;
        }
        #title-overlay .subtitle {
            color: #b8a080;
            font-size: clamp(0.7rem, 1.2vw, 0.95rem);
            letter-spacing: 0.06em;
            margin-top: 0.3em;
            text-shadow: 0 0 14px rgba(170, 135, 100, 0.35);
        }
        /* 公式 */
        #formula-overlay {
            position: fixed;
            bottom: clamp(28px, 5vh, 56px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(18, 14, 24, 0.75);
            border: 1px solid rgba(160, 130, 100, 0.3);
            border-radius: 12px;
            padding: clamp(10px, 1.5vh, 16px) clamp(18px, 3vw, 30px);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #formula-overlay .formula-main {
            color: #f0ddc0;
            font-size: clamp(0.85rem, 1.45vw, 1.25rem);
            letter-spacing: 0.05em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a09078;
            font-size: clamp(0.65rem, 1vw, 0.85rem);
            letter-spacing: 0.03em;
            margin-top: 0.25em;
            line-height: 1.5;
        }
        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.05em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <h1>三维利萨如编织</h1>
        <div class="subtitle">3D Lissajous Weaving · Frequency Resonance</div>
    </div>
    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                ℒ<sub>a,b,c</sub> : x = A·sin(a t + α)<br>
                     y = B·sin(b t + β)<br>
                     z = C·sin(c t + γ)
            </div>
            <div class="formula-detail">
                t ∈ [0, 2π] | a, b, c ∈ ℕ | α, β, γ ∈ [0, π]
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#050612');
        scene.fog = new THREE.Fog('#050612', 6, 18);

        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / container.clientHeight,
            0.4,
            26
        );
        camera.position.set(0, 0.5, 7.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // 微弱环境光（对线条无影响，但保留结构）
        scene.add(new THREE.AmbientLight('#303050', 0.4));

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const allLines = [];
        const totalPoints = 1400; // 每条曲线的采样点数

        // ==================== 生成三维利萨如曲线 ====================
        function generateLissajous(freqX, freqY, freqZ, phaseX, phaseY, phaseZ, ampX, ampY, ampZ) {
            const vertices = new Float32Array(totalPoints * 3);
            for (let i = 0; i < totalPoints; i++) {
                const t = (i / (totalPoints - 1)) * Math.PI * 2;
                vertices[i * 3]     = ampX * Math.sin(freqX * t + phaseX);
                vertices[i * 3 + 1] = ampY * Math.sin(freqY * t + phaseY);
                vertices[i * 3 + 2] = ampZ * Math.sin(freqZ * t + phaseZ);
            }
            return vertices;
        }

        function createLine(vertices, colorHSL, opacity = 0.78) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0); // 初始隐藏

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.NormalBlending,
                depthWrite: true,
                depthTest: true,
            });

            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // ==================== 曲线配置：频率、相位、振幅 ====================
        // 使用多组互质频率，产生不同的编织图案
        const curveSpecs = [
            // 低频对称组
            { fx:1, fy:1, fz:1, px:0.0, py:0.5, pz:1.0, ax:1.2, ay:1.2, az:1.2, c:{h:0.08, s:0.88, l:0.62} },
            { fx:1, fy:2, fz:1, px:0.3, py:0.9, pz:1.5, ax:1.1, ay:1.0, az:1.3, c:{h:0.09, s:0.90, l:0.60} },
            { fx:2, fy:1, fz:1, px:0.7, py:0.2, pz:1.8, ax:1.0, ay:1.2, az:1.1, c:{h:0.10, s:0.92, l:0.61} },
            { fx:1, fy:1, fz:2, px:1.1, py:1.4, pz:0.4, ax:1.2, ay:1.1, az:1.0, c:{h:0.11, s:0.88, l:0.63} },
            { fx:2, fy:2, fz:1, px:0.5, py:1.6, pz:0.9, ax:1.1, ay:1.1, az:1.2, c:{h:0.12, s:0.90, l:0.60} },
            { fx:2, fy:1, fz:2, px:0.9, py:0.8, pz:1.2, ax:1.0, ay:1.2, az:1.0, c:{h:0.13, s:0.86, l:0.64} },
            { fx:1, fy:2, fz:2, px:1.3, py:0.3, pz:1.7, ax:1.2, ay:1.0, az:1.1, c:{h:0.14, s:0.92, l:0.59} },
            { fx:2, fy:3, fz:1, px:0.2, py:1.1, pz:0.6, ax:1.1, ay:1.0, az:1.2, c:{h:0.15, s:0.88, l:0.61} },
            { fx:3, fy:2, fz:1, px:0.6, py:0.7, pz:1.4, ax:1.0, ay:1.2, az:1.0, c:{h:0.16, s:0.90, l:0.60} },
            { fx:1, fy:3, fz:2, px:1.0, py:1.3, pz:0.1, ax:1.2, ay:1.0, az:1.1, c:{h:0.17, s:0.85, l:0.63} },
            { fx:3, fy:1, fz:2, px:0.4, py:0.5, pz:1.9, ax:1.1, ay:1.1, az:1.0, c:{h:0.18, s:0.92, l:0.59} },
            { fx:2, fy:2, fz:3, px:0.8, py:1.8, pz:0.3, ax:1.0, ay:1.2, az:1.2, c:{h:0.19, s:0.88, l:0.62} },
            { fx:2, fy:3, fz:2, px:1.2, py:0.4, pz:1.6, ax:1.2, ay:1.0, az:1.0, c:{h:0.20, s:0.86, l:0.61} },
            { fx:3, fy:2, fz:2, px:0.1, py:1.5, pz:0.8, ax:1.1, ay:1.1, az:1.2, c:{h:0.21, s:0.90, l:0.60} },
            { fx:1, fy:3, fz:3, px:0.5, py:0.9, pz:1.3, ax:1.2, ay:1.0, az:1.0, c:{h:0.22, s:0.84, l:0.63} },
            { fx:3, fy:1, fz:3, px:0.9, py:0.2, pz:0.7, ax:1.0, ay:1.2, az:1.1, c:{h:0.23, s:0.88, l:0.59} },
            { fx:3, fy:3, fz:1, px:1.3, py:1.0, pz:1.8, ax:1.1, ay:1.0, az:1.2, c:{h:0.24, s:0.92, l:0.61} },
            { fx:3, fy:4, fz:1, px:0.15, py:0.6, pz:1.1, ax:1.0, ay:1.1, az:1.0, c:{h:0.25, s:0.90, l:0.60} },
            { fx:4, fy:3, fz:1, px:0.55, py:1.2, pz:0.2, ax:1.2, ay:1.0, az:1.2, c:{h:0.26, s:0.86, l:0.62} },
            { fx:1, fy:4, fz:3, px:0.95, py:0.7, pz:1.5, ax:1.1, ay:1.2, az:1.0, c:{h:0.27, s:0.88, l:0.60} },
            { fx:4, fy:1, fz:3, px:0.35, py:1.4, pz:0.9, ax:1.0, ay:1.0, az:1.2, c:{h:0.28, s:0.92, l:0.59} },
            { fx:3, fy:4, fz:3, px:0.75, py:0.1, pz:1.6, ax:1.2, ay:1.1, az:1.0, c:{h:0.29, s:0.84, l:0.63} },
            { fx:4, fy:3, fz:3, px:1.15, py:1.7, pz:0.5, ax:1.0, ay:1.2, az:1.1, c:{h:0.30, s:0.90, l:0.61} },
            // 冷色系高频组
            { fx:4, fy:5, fz:2, px:0.2, py:0.8, pz:1.2, ax:1.1, ay:1.0, az:1.0, c:{h:0.55, s:0.72, l:0.58} },
            { fx:5, fy:4, fz:2, px:0.6, py:1.2, pz:0.4, ax:1.0, ay:1.2, az:1.1, c:{h:0.56, s:0.75, l:0.60} },
            { fx:2, fy:5, fz:4, px:1.0, py:0.3, pz:1.7, ax:1.2, ay:1.0, az:1.0, c:{h:0.57, s:0.70, l:0.59} },
            { fx:5, fy:2, fz:4, px:0.4, py:1.5, pz:0.8, ax:1.1, ay:1.1, az:1.2, c:{h:0.58, s:0.74, l:0.58} },
            { fx:5, fy:5, fz:2, px:0.8, py:0.5, pz:1.4, ax:1.0, ay:1.0, az:1.2, c:{h:0.59, s:0.68, l:0.62} },
            { fx:3, fy:5, fz:4, px:1.2, py:1.1, pz:0.1, ax:1.2, ay:1.1, az:1.0, c:{h:0.60, s:0.72, l:0.60} },
            { fx:5, fy:3, fz:4, px:0.1, py:0.7, pz:1.9, ax:1.0, ay:1.2, az:1.1, c:{h:0.61, s:0.66, l:0.61} },
            { fx:4, fy:5, fz:3, px:0.5, py:1.3, pz:0.6, ax:1.1, ay:1.0, az:1.0, c:{h:0.62, s:0.70, l:0.59} },
            { fx:5, fy:6, fz:1, px:0.9, py:0.4, pz:1.5, ax:1.0, ay:1.2, az:1.2, c:{h:0.63, s:0.68, l:0.60} },
            { fx:6, fy:5, fz:1, px:1.3, py:1.6, pz:0.3, ax:1.2, ay:1.0, az:1.0, c:{h:0.64, s:0.65, l:0.62} },
            // 紫罗兰系
            { fx:1, fy:6, fz:5, px:0.15, py:0.8, pz:1.2, ax:1.1, ay:1.0, az:1.1, c:{h:0.76, s:0.60, l:0.60} },
            { fx:6, fy:1, fz:5, px:0.55, py:1.2, pz:0.5, ax:1.0, ay:1.2, az:1.0, c:{h:0.77, s:0.62, l:0.59} },
            { fx:6, fy:6, fz:1, px:0.95, py:0.2, pz:1.7, ax:1.2, ay:1.0, az:1.2, c:{h:0.78, s:0.58, l:0.62} },
            { fx:5, fy:6, fz:5, px:1.35, py:1.0, pz:0.8, ax:1.0, ay:1.1, az:1.0, c:{h:0.79, s:0.60, l:0.60} },
            { fx:6, fy:5, fz:5, px:0.25, py:1.4, pz:1.6, ax:1.1, ay:1.0, az:1.2, c:{h:0.80, s:0.55, l:0.61} },
        ];

        // 创建所有曲线
        curveSpecs.forEach(spec => {
            const vertices = generateLissajous(
                spec.fx, spec.fy, spec.fz,
                spec.px * Math.PI, spec.py * Math.PI, spec.pz * Math.PI,
                spec.ax, spec.ay, spec.az
            );
            const line = createLine(vertices, spec.c, 0.76);
            mainGroup.add(line);
            allLines.push(line);
        });

        // ==================== 添加极淡的坐标框架（增强空间感） ====================
        function createAxisLine(points, colorHSL, opacity) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(points), 3));
            geometry.setDrawRange(0, 0);
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.NormalBlending,
                depthWrite: true,
            });
            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        const axisLen = 2.8;
        const axisColor = { h: 0.6, s: 0.1, l: 0.5 };
        const axisOpacity = 0.2;
        const axes = [
            createAxisLine([-axisLen,0,0, axisLen,0,0], axisColor, axisOpacity),
            createAxisLine([0,-axisLen,0, 0,axisLen,0], axisColor, axisOpacity),
            createAxisLine([0,0,-axisLen, 0,0,axisLen], axisColor, axisOpacity),
        ];
        axes.forEach(ax => {
            mainGroup.add(ax);
            allLines.push(ax);
        });

        console.log(`✅ 已生成 ${curveSpecs.length} 条利萨如曲线 + 3 条坐标轴`);

        // ==================== 动画状态机 ====================
        const CYCLE_TOTAL = 7.0;    // 出现3s + 停1s + 消失3s
        const APPEAR_TIME = 3.0;
        const PAUSE_TIME = 1.0;
        const DISAPPEAR_TIME = 3.0;

        let animationStartTime = null;
        let firstFrameSettled = false;

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInCubic(t) { return t * t * t; }

        function getProgress(elapsedSeconds) {
            const cycle = elapsedSeconds % CYCLE_TOTAL;
            if (cycle < APPEAR_TIME) {
                const t = cycle / APPEAR_TIME;
                return { progress: easeOutCubic(t), phase: 'appear' };
            } else if (cycle < APPEAR_TIME + PAUSE_TIME) {
                return { progress: 1.0, phase: 'pause' };
            } else {
                const t = (cycle - APPEAR_TIME - PAUSE_TIME) / DISAPPEAR_TIME;
                return { progress: 1.0 - easeInCubic(t), phase: 'disappear' };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            // 处理初始时间与首帧
            if (animationStartTime === null) {
                animationStartTime = timestamp;
                // 强制所有线条不可见，渲染一帧空白
                allLines.forEach(line => {
                    line.visible = false;
                    if (line.geometry) line.geometry.setDrawRange(0, 0);
                });
                renderer.render(scene, camera);
                firstFrameSettled = true;
                return;
            }

            const elapsed = (timestamp - animationStartTime) / 1000;
            const { progress } = getProgress(elapsed);

            const drawCount = Math.floor(progress * totalPoints);
            const shouldBeVisible = drawCount >= 2;

            // 批量更新所有线条
            for (let i = 0; i < allLines.length; i++) {
                const line = allLines[i];
                if (!line || !line.geometry) continue;
                const maxPts = line.geometry.attributes.position.count;
                const lineDraw = Math.min(drawCount, maxPts);
                if (shouldBeVisible && lineDraw >= 2) {
                    line.visible = true;
                    line.geometry.setDrawRange(0, lineDraw);
                } else {
                    line.visible = false;
                    line.geometry.setDrawRange(0, 0);
                }
            }

            // 整体缓慢旋转
            const rotY = elapsed * 0.2;
            const rotX = Math.sin(elapsed * 0.31) * 0.12;
            const rotZ = Math.cos(elapsed * 0.37) * 0.1;
            mainGroup.rotation.set(rotX, rotY, rotZ);

            // 相机微动
            camera.position.x = Math.sin(elapsed * 0.23) * 0.3;
            camera.position.y = 0.5 + Math.cos(elapsed * 0.29) * 0.25;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 三维利萨如编织动画启动');
        console.log(`   - 曲线数量: ${curveSpecs.length}`);
        console.log(`   - 采样点/曲线: ${totalPoints}`);
        console.log(`   - 动画周期: ${CYCLE_TOTAL}s (出现${APPEAR_TIME}s + 停顿${PAUSE_TIME}s + 消失${DISAPPEAR_TIME}s)`);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
