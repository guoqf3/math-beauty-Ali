<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维蝶形曲线 · 混沌与秩序之美</title>
    <style>
        :root {
            --bg: #050513;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.0vw, 1.45rem);
            font-weight: 400;
            letter-spacing: 0.10em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(190, 165, 140, 0.5), 0 0 6px rgba(170, 148, 125, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.60rem, 1.10vw, 0.76rem);
            font-weight: 300;
            letter-spacing: 0.06em;
            color: rgba(200, 192, 180, 0.7);
            margin-top: 0.2em;
            text-shadow: 0 0 13px rgba(155, 140, 120, 0.3);
        }
        #formula-overlay {
            bottom: clamp(14px, 3.5vh, 40px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.44rem, 0.78vw, 0.62rem);
            font-style: italic;
            letter-spacing: 0.03em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(155, 140, 125, 0.42), 0 0 5px rgba(165, 148, 130, 0.28);
            line-height: 1.6;
            background: rgba(10, 9, 16, 0.46);
            padding: 0.30em 1.0em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(145, 125, 105, 0.20);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.16em 0.40em;
                letter-spacing: 0.02em;
                font-size: 0.34rem;
            }
            #title-overlay .title {
                letter-spacing: 0.06em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">三维蝶形曲线 · 混沌与秩序之美</div>
        <div class="subtitle">3D Butterfly Curves — Chaos Meets Symmetry</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            x = A·sin t (exp(cos t) − 2 cos(4t) − sin<sup>5</sup>(t/12))
            &emsp;|&emsp; y = B·cos t (exp(cos t) − 2 cos(4t) − sin<sup>5</sup>(t/12))
            &emsp;|&emsp; z = C·sin 3t (exp(sin t) − 2 sin(4t) + cos<sup>5</sup>(t/12))
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        const CURVE_SEGMENTS = 780;
        const TOTAL_VERTICES = CURVE_SEGMENTS + 1;
        const SPHERE_R = 1.70;

        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');
        const THREE_COLORS = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        // 三维蝶形曲线基础点
        function generateButterflyPoints(A, B, C) {
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            for (let i = 0; i <= CURVE_SEGMENTS; i++) {
                const t = (i / CURVE_SEGMENTS) * Math.PI * 2;
                const r1 = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) - Math.pow(Math.sin(t / 12), 5);
                const r2 = Math.exp(Math.sin(t)) - 2 * Math.sin(4 * t) + Math.pow(Math.cos(t / 12), 5);
                const x = A * Math.sin(t) * r1;
                const y = B * Math.cos(t) * r1;
                const z = C * Math.sin(3 * t) * r2;
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }
            return positions;
        }

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050513, 0.00007);

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.35, 17);
        camera.position.set(0.55, 0.7, 3.8);
        camera.lookAt(0, 0.02, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.16;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 200;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phiA = Math.acos(2 * Math.random() - 1);
            const r = 3.5 + Math.random() * 4.8;
            starPosArr[i * 3] = Math.sin(phiA) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phiA) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phiA) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xb6afc6,
            size: 0.009,
            transparent: true,
            opacity: 0.26,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        starsGroup.add(new THREE.Points(starGeom, starMat));

        // ==================== 漂浮光点 ====================
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 80;
        const glowArr = new Float32Array(glowCount * 3);
        const phiGold = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < glowCount; i++) {
            const y = 1 - (i / (glowCount - 1)) * 2;
            const rAtY = Math.sqrt(1 - y * y);
            const theta = phiGold * i;
            glowArr[i * 3] = Math.cos(theta) * rAtY * SPHERE_R;
            glowArr[i * 3 + 1] = y * SPHERE_R;
            glowArr[i * 3 + 2] = Math.sin(theta) * rAtY * SPHERE_R;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e4cc,
            size: 0.019,
            transparent: true,
            opacity: 0.44,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        glowGroup.add(new THREE.Points(glowGeom, glowMat));

        // ==================== 参考球体线框 ====================
        const sphereWireGroup = new THREE.Group();
        mainGroup.add(sphereWireGroup);
        const sphereWireMats = [];

        function createLatLine(phiVal) {
            const pts = [];
            const r = Math.sin(phiVal) * SPHERE_R;
            const y = Math.cos(phiVal) * SPHERE_R;
            for (let i = 0; i <= 240; i++) {
                const th = (i / 240) * Math.PI * 2;
                pts.push(new THREE.Vector3(r * Math.cos(th), y, r * Math.sin(th)));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({ color: 0x3a3650, transparent: true, opacity: 0.12, depthWrite: false });
            sphereWireMats.push(m);
            return new THREE.Line(g, m);
        }
        function createLongLine(theta) {
            const pts = [];
            for (let i = 0; i <= 200; i++) {
                const phiVal = (i / 200) * Math.PI;
                pts.push(new THREE.Vector3(
                    Math.sin(phiVal) * Math.cos(theta) * SPHERE_R,
                    Math.cos(phiVal) * SPHERE_R,
                    Math.sin(phiVal) * Math.sin(theta) * SPHERE_R
                ));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({ color: 0x3a3650, transparent: true, opacity: 0.12, depthWrite: false });
            sphereWireMats.push(m);
            return new THREE.Line(g, m);
        }
        for (let i = 1; i <= 9; i++) sphereWireGroup.add(createLatLine((i / 10) * Math.PI));
        for (let i = 0; i < 18; i++) sphereWireGroup.add(createLongLine((i / 18) * Math.PI * 2));
        {
            const eqPts = [];
            for (let i = 0; i <= 280; i++) {
                const th = (i / 280) * Math.PI * 2;
                eqPts.push(new THREE.Vector3(Math.cos(th) * SPHERE_R, 0, Math.sin(th) * SPHERE_R));
            }
            const eqG = new THREE.BufferGeometry().setFromPoints(eqPts);
            const eqM = new THREE.LineBasicMaterial({ color: 0x58527a, transparent: true, opacity: 0.17, depthWrite: false });
            sphereWireMats.push(eqM);
            sphereWireGroup.add(new THREE.Line(eqG, eqM));
        }

        // ==================== 三维蝶形曲线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        function createButterflyLine(A, B, C, rotationQuat, color) {
            const rawPositions = generateButterflyPoints(A, B, C);
            const v = new THREE.Vector3();
            for (let i = 0; i < rawPositions.length; i += 3) {
                v.set(rawPositions[i], rawPositions[i + 1], rawPositions[i + 2]);
                v.applyQuaternion(rotationQuat);
                rawPositions[i] = v.x;
                rawPositions[i + 1] = v.y;
                rawPositions[i + 2] = v.z;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(rawPositions, 3));
            geometry.setDrawRange(0, 0);
            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
            });
            const line = new THREE.Line(geometry, material);
            allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
            return line;
        }

        const numCurvesPerColor = 6;
        const totalCurves = numCurvesPerColor * 3;
        const directions = [];
        const phiGolden2 = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < totalCurves; i++) {
            const yNorm = 1 - (i / (totalCurves - 1)) * 2;
            const rAtY = Math.sqrt(1 - yNorm * yNorm);
            const theta = phiGolden2 * i;
            directions.push(new THREE.Vector3(Math.cos(theta) * rAtY, yNorm, Math.sin(theta) * rAtY).normalize());
        }
        const zAxis = new THREE.Vector3(0, 0, 1);

        // 金色蝶：较低振幅，形态柔美
        const goldParams = [
            [0.65, 0.58, 0.72],
            [0.62, 0.70, 0.55],
            [0.68, 0.50, 0.68],
            [0.55, 0.72, 0.60],
            [0.70, 0.55, 0.65],
            [0.60, 0.65, 0.70]
        ];
        // 玫瑰粉蝶：中等振幅，展开更饱满
        const roseParams = [
            [0.72, 0.65, 0.78],
            [0.68, 0.72, 0.62],
            [0.75, 0.58, 0.70],
            [0.60, 0.78, 0.65],
            [0.78, 0.60, 0.72],
            [0.65, 0.75, 0.68]
        ];
        // 青蓝蝶：较高振幅，细节更丰富
        const cyanParams = [
            [0.78, 0.72, 0.85],
            [0.75, 0.80, 0.70],
            [0.82, 0.65, 0.78],
            [0.68, 0.85, 0.72],
            [0.85, 0.68, 0.80],
            [0.72, 0.82, 0.75]
        ];

        const allParams = [goldParams, roseParams, cyanParams];
        const allColors = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        for (let colorIdx = 0; colorIdx < 3; colorIdx++) {
            const paramsArr = allParams[colorIdx];
            const color = allColors[colorIdx];
            for (let i = 0; i < numCurvesPerColor; i++) {
                const [A, B, C] = paramsArr[i];
                const dirIdx = colorIdx * numCurvesPerColor + i;
                const quat = new THREE.Quaternion().setFromUnitVectors(zAxis, directions[dirIdx]);
                curvesGroup.add(createButterflyLine(A, B, C, quat, color));
            }
        }

        const curveCount = allCurveData.length;

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        clock.getDelta(); // 消耗初始累积

        function getCycleTime() {
            return (performance.now() / 1000 - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            mainGroup.rotation.y += 0.24 * dt;
            mainGroup.rotation.x += 0.058 * dt;
            mainGroup.rotation.z += 0.014 * Math.sin(cycleTime * 0.55) * dt;

            const sway = 0.09 * Math.sin(cycleTime * (Math.PI * 2 / 34));
            camera.position.y = 0.7 + sway;
            camera.lookAt(0, 0.02, 0);

            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.26 * bgOp;
            glowMat.opacity = 0.44 * bgOp;
            for (const mat of sphereWireMats) {
                mat.opacity = (mat.opacity ?? 0.12) * bgOp;
            }

            glowGroup.position.y = Math.sin(cycleTime * 1.05) * 0.04;
            starsGroup.rotation.y += dt * 0.015;
            starsGroup.rotation.x += dt * 0.010;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🦋 三维蝶形曲线动画已启动');
        console.log(`   - ${curveCount} 条闭合曲线，3种颜色各${numCurvesPerColor}条`);
        console.log('   - 方程基于 Fay 蝴蝶曲线推广至三维');
        console.log(`   - 周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
