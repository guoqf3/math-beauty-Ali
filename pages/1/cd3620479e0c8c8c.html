<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分形龙 · Fractal Dragon</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#03060d;
    color:#cfe8ff;
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Courier New",monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100vh;height:100dvh;}

  /* ---------- 左侧面板 ---------- */
  .panel{
    width:370px;flex:0 0 370px;
    padding:30px 26px 24px;
    border-right:1px solid rgba(190,140,255,.16);
    background:
      radial-gradient(120% 70% at 0% 0%, rgba(110,60,220,.20), transparent 60%),
      linear-gradient(180deg,#0a0618,#030108);
    display:flex;flex-direction:column;gap:18px;
    overflow-y:auto;
  }
  .panel::-webkit-scrollbar{width:6px;}
  .panel::-webkit-scrollbar-thumb{background:rgba(190,140,255,.30);border-radius:3px;}

  .title{font-size:22px;letter-spacing:.14em;color:#e4d4ff;
    text-shadow:0 0 18px rgba(180,120,255,.85),0 0 42px rgba(180,120,255,.35);}
  .subtitle{font-size:10.5px;letter-spacing:.42em;color:#7d5fb8;margin-top:6px;text-transform:uppercase;}

  .card{
    border:1px solid rgba(190,140,255,.22);
    border-radius:12px;
    padding:16px 16px 14px;
    background:linear-gradient(180deg,rgba(90,50,170,.22),rgba(28,14,58,.15));
    box-shadow:inset 0 1px 0 rgba(230,210,255,.08), 0 0 26px rgba(110,60,220,.14);
  }
  .card h3{
    font-size:10px;letter-spacing:.28em;color:#9a7fd8;font-weight:400;
    text-transform:uppercase;margin-bottom:12px;
  }

  .eq{
    font-size:14px;line-height:2.0;color:#d4c2ff;
    white-space:nowrap;overflow-x:auto;
    text-shadow:0 0 14px rgba(180,120,255,.55);
  }
  .eq + .eq{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(190,140,255,.14);}
  .eq .v{color:#8fe6ff;font-weight:600;}
  .eq .n{color:#ffb3e6;font-weight:600;}
  .eq sub{font-size:10px;color:#ffb3e6;}

  .rows{display:flex;flex-direction:column;gap:8px;font-size:12px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#8f84b8;}
  .row b{color:#ddd2ff;font-weight:500;}

  .legend{display:flex;flex-direction:column;gap:11px;font-size:12px;color:#8f84b8;line-height:1.55;}
  .legend .item{display:flex;gap:9px;align-items:flex-start;}
  .legend .dot{
    width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:4px;
    background:var(--c);box-shadow:0 0 10px var(--c),0 0 20px var(--c);
  }
  .bar{
    height:8px;border-radius:4px;margin-top:12px;
    background:linear-gradient(to right,
      hsl(195,90%,35%),
      hsl(230,95%,55%),
      hsl(270,100%,62%),
      hsl(305,100%,66%),
      hsl(330,100%,72%));
    box-shadow:0 0 14px rgba(180,120,255,.4), inset 0 0 6px rgba(0,0,0,.4);
  }
  .bar-labels{
    display:flex;justify-content:space-between;
    font-size:10px;color:#5f5188;margin-top:6px;letter-spacing:.06em;
  }

  .readout{
    margin-top:auto;
    display:flex;justify-content:space-between;gap:8px;
    font-size:10.5px;letter-spacing:.06em;color:#5f5188;
    padding-top:14px;border-top:1px solid rgba(190,140,255,.14);
  }
  .readout b{color:#c0aaff;font-weight:500;}

  /* 进度条 */
  .progress-wrap{
    width:100%;height:3px;border-radius:2px;
    background:rgba(190,140,255,.12);
    overflow:hidden;margin-top:12px;
  }
  .progress-bar{
    height:100%;width:0%;
    background:linear-gradient(to right,#5a5aff,#c44dff,#ff5ce0);
    box-shadow:0 0 10px rgba(200,120,255,.9);
    transition:width .08s linear;
  }

  /* ---------- 右侧画布 ---------- */
  .stage{flex:1;position:relative;min-width:0;overflow:hidden;}
  canvas{display:block;position:absolute;inset:0;}

  @media (max-width:880px){
    .app{flex-direction:column;}
    .panel{width:100%;flex:0 0 auto;max-height:46vh;border-right:none;
      border-bottom:1px solid rgba(190,140,255,.18);}
    .readout{margin-top:0;}
    .stage{flex:1;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- 左：公式 -->
  <aside class="panel">
    <div>
      <div class="title">分形龙</div>
      <div class="subtitle">Fractal Dragon</div>
    </div>

    <div class="card">
      <h3>Iteration Formula</h3>
      <div class="eq">
        <span class="v">D</span><sub>n+1</sub>
        = <span class="v">D</span><sub>n</sub>
        ∪ <span class="n">R</span><sub>90°</sub>(<span class="v">D</span><sub>n</sub>)
      </div>
      <div class="eq">
        <span class="v">D</span><sub>0</sub> = 一条单位线段
      </div>
      <div class="eq" style="font-size:11.5px;color:#8f84b8;text-shadow:none;line-height:1.9;">
        <span class="n">R</span><sub>90°</sub>(·) → 绕端点逆时针旋转 90°
      </div>
    </div>

    <div class="card">
      <h3>Parameters · 长龙模式</h3>
      <div class="rows">
        <div class="row"><span>最大迭代 n</span><b>16</b></div>
        <div class="row"><span>线段总数 2ⁿ</span><b>65,536</b></div>
        <div class="row"><span>生长周期</span><b>55 s</b></div>
        <div class="row"><span>停留时间</span><b>5 s</b></div>
        <div class="row"><span>单次循环</span><b>60 s</b></div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
    </div>

    <div class="card">
      <h3>Color Logic · 迭代深度</h3>
      <div class="legend">
        <div class="item">
          <span class="dot" style="--c:#1e5c8a"></span>
          <span><b style="color:#ddd2ff">深层</b> 暗蓝 —— 基础骨架，最早迭代产生</span>
        </div>
        <div class="item">
          <span class="dot" style="--c:#9a4dff"></span>
          <span><b style="color:#ddd2ff">中层</b> 紫罗兰 —— 分叉过渡区</span>
        </div>
        <div class="item">
          <span class="dot" style="--c:#ff5ce0"></span>
          <span><b style="color:#ddd2ff">表层</b> 霓虹粉紫 —— 最新迭代的发光尖端</span>
        </div>
      </div>
      <div class="bar"></div>
      <div class="bar-labels"><span>n = 0</span><span>n = 16</span></div>
    </div>

    <div class="readout">
      <span>t = <b id="rt">0.0</b>s</span>
      <span>n = <b id="rn">0.0</b></span>
      <span>seg = <b id="rs">1</b></span>
    </div>
  </aside>

  <!-- 右：Canvas -->
  <main class="stage">
    <canvas id="c"></canvas>
  </main>
</div>

<script>
(() => {
  'use strict';

  /* ============================================================
     参数 —— 60 秒长龙
     ============================================================ */
  const MAX_ORDER = 16;      // 2^16 = 65,536 条线段
  const CYCLE     = 55;      // 生长 55 秒
  const HOLD      = 5;       // 停留 5 秒 → 总周期 60 秒

  /* ============================================================
     Canvas
     ============================================================ */
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');

  // 离屏层：先画曲线，再做辉光 / 合成
  const off    = document.createElement('canvas');
  const octx   = off.getContext('2d');

  let W = 0, H = 0, DPR = 1, OFF_DPR = 1;
  let bgGrad = null;

  /* ============================================================
     龙曲线构建 —— 线段索引天然按层级排序
     ============================================================ */
  function buildDragon(maxOrder) {
    const totalPts = (1 << maxOrder) + 1;
    const xs = new Float32Array(totalPts);
    const ys = new Float32Array(totalPts);

    let n = 2;
    xs[0] = 0; ys[0] = 0;
    xs[1] = 1; ys[1] = 0;

    for (let order = 1; order <= maxOrder; order++) {
      const lx = xs[n - 1];
      const ly = ys[n - 1];
      const m  = n;
      for (let j = m - 2; j >= 0; j--) {
        const dx = xs[j] - lx;
        const dy = ys[j] - ly;
        xs[n] = lx + dy;
        ys[n] = ly - dx;
        n++;
      }
    }

    return { x: xs, y: ys, segCount: n - 1 };
  }

  const DRAGON = buildDragon(MAX_ORDER);
  const N_SEG  = DRAGON.segCount;   // = 65536

  /* ============================================================
     包围盒（增量）
     ============================================================ */
  const bb = {
    revealed: 0,
    minX: 0, maxX: 1,
    minY: 0, maxY: 0
  };

  function updateBB(revealed) {
    if (revealed < bb.revealed) {
      bb.minX = bb.maxX = DRAGON.x[0];
      bb.minY = bb.maxY = DRAGON.y[0];
      bb.revealed = 0;
    }
    const X = DRAGON.x, Y = DRAGON.y;
    for (let i = bb.revealed + 1; i <= revealed; i++) {
      const px = X[i], py = Y[i];
      if (px < bb.minX) bb.minX = px;
      if (px > bb.maxX) bb.maxX = px;
      if (py < bb.minY) bb.minY = py;
      if (py > bb.maxY) bb.maxY = py;
    }
    bb.revealed = revealed;
  }

  /* ============================================================
     动态视角（平滑跟随）
     ============================================================ */
  const view = { minX: 0, maxX: 1, minY: -0.5, maxY: 0.5 };

  function updateView(target, dt) {
    const k = Math.min(1, dt * 5.0);
    view.minX += (target.minX - view.minX) * k;
    view.maxX += (target.maxX - view.maxX) * k;
    view.minY += (target.minY - view.minY) * k;
    view.maxY += (target.maxY - view.maxY) * k;
  }

  /* ============================================================
     尺寸
     ============================================================ */
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = Math.max(rect.width, 1);
    H = Math.max(rect.height, 1);
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // 离屏用略低分辨率，兼顾清晰与性能
    OFF_DPR = Math.min(DPR, 1.5);
    off.width  = Math.round(W * OFF_DPR);
    off.height = Math.round(H * OFF_DPR);

    bgGrad = ctx.createRadialGradient(
      W * 0.5, H * 0.50, 0,
      W * 0.5, H * 0.50, Math.max(W, H) * 0.86
    );
    bgGrad.addColorStop(0.00, '#0d0720');
    bgGrad.addColorStop(0.40, '#05020f');
    bgGrad.addColorStop(1.00, '#010005');
  }

  /* ============================================================
     绘制曲线到离屏层
     ============================================================ */
  function drawCurve(revealed) {
    const g = octx;
    g.setTransform(OFF_DPR, 0, 0, OFF_DPR, 0, 0);
    g.clearRect(0, 0, W, H);

    /* ---- 计算变换 ---- */
    const bw = Math.max(view.maxX - view.minX, 0.35);
    const bh = Math.max(view.maxY - view.minY, 0.35);

    const padX = Math.max(W * 0.10, 46);
    const padY = Math.max(H * 0.10, 46);
    const availW = Math.max(W - padX * 2, 20);
    const availH = Math.max(H - padY * 2, 20);

    const scale = Math.min(availW / bw, availH / bh);
    const ox = padX + (availW - bw * scale) * 0.5 - view.minX * scale;
    const oy = padY + (availH - bh * scale) * 0.5 - view.minY * scale;

    g.save();
    g.translate(ox, oy);
    g.scale(scale, scale);
    g.lineCap  = 'round';
    g.lineJoin = 'round';

    const invScale = 1 / scale;
    const LX = DRAGON.x, LY = DRAGON.y;

    /* ---- 逐层级描线（线段索引天然按层级分段） ---- */
    for (let lv = 0; lv <= MAX_ORDER; lv++) {
      const startIdx = lv === 0 ? 0 : (1 << (lv - 1));
      const endIdx   = 1 << lv;
      const visibleEnd = endIdx < revealed ? endIdx : revealed;

      if (visibleEnd <= startIdx) break;

      const lt = lv / MAX_ORDER;

      /* 色相：195° 青蓝 → 330° 霓虹粉紫 */
      const hue = 195 + 135 * lt;
      /* 亮度：深层暗，表层亮霓虹 */
      const lum = 20 + 66 * Math.pow(lt, 1.30);
      /* 透明度：深层淡，表层实 */
      const alp = 0.26 + 0.74 * lt;
      /* 屏幕线宽：深层粗 → 表层细（避免密集区过曝） */
      const lw  = (0.95 - 0.58 * lt) * invScale;

      g.beginPath();
      for (let s = startIdx; s < visibleEnd; s++) {
        g.moveTo(LX[s],     LY[s]);
        g.lineTo(LX[s + 1], LY[s + 1]);
      }
      g.strokeStyle = 'hsla(' + hue.toFixed(1) + ',100%,' +
                      lum.toFixed(1) + '%,' + alp.toFixed(3) + ')';
      g.lineWidth = lw;
      g.stroke();
    }

    g.restore();
  }

  /* ============================================================
     主循环
     ============================================================ */
  let lastT = performance.now();
  let T = 0;
  let cycleT = 0;
  let frame = 0;

  const $rt = document.getElementById('rt');
  const $rn = document.getElementById('rn');
  const $rs = document.getElementById('rs');
  const $pb = document.getElementById('pbar');

  function loop(now) {
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    T += dt;
    cycleT += dt;

    /* ---------- 1. 生长进度（线性迭代阶数） ---------- */
    let progress;
    if (cycleT < CYCLE) {
      progress = cycleT / CYCLE;
    } else if (cycleT < CYCLE + HOLD) {
      progress = 1;
    } else {
      cycleT = 0;
      progress = 0;
    }

    /* 迭代阶数线性推进，线段数指数增长 → 长龙慢慢苏醒 */
    const revealOrder = progress * MAX_ORDER;
    const revealed = Math.max(1, Math.min(
      Math.ceil(Math.pow(2, revealOrder)),
      N_SEG
    ));

    /* 淡入 */
    let fade = 1;
    if (progress < 0.03) fade = progress / 0.03;

    /* ---------- 2. 更新包围盒 & 视角 ---------- */
    updateBB(revealed);

    const target = {
      minX: bb.minX, maxX: bb.maxX,
      minY: bb.minY, maxY: bb.maxY
    };
    if (revealed <= 2) {
      view.minX = target.minX; view.maxX = target.maxX;
      view.minY = target.minY; view.maxY = target.maxY;
    } else {
      updateView(target, dt);
    }

    /* ---------- 3. 绘制曲线 ---------- */
    drawCurve(revealed);

    /* ---------- 4. 合成到主画布 ---------- */
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    /* 辉光层 */
    try { ctx.filter = 'blur(10px)'; } catch (e) {}
    ctx.globalAlpha = 0.55 * fade;
    ctx.drawImage(off, 0, 0, W, H);
    try { ctx.filter = 'none'; } catch (e) {}

    /* 锐利层 */
    ctx.globalAlpha = 0.94 * fade;
    ctx.drawImage(off, 0, 0, W, H);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    /* ---------- 5. 读数 & 进度条 ---------- */
    if ((frame++ & 7) === 0) {
      const effOrder = revealed > 1
        ? Math.min(MAX_ORDER, Math.log2(revealed)).toFixed(1)
        : '0.0';
      $rt.textContent = T.toFixed(1);
      $rn.textContent = effOrder;
      $rs.textContent = revealed.toLocaleString();
      $pb.style.width = (progress * 100).toFixed(1) + '%';
    }

    requestAnimationFrame(loop);
  }

  /* ============================================================
     启动
     ============================================================ */
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
