<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热力学第二定律 · 崩解与重组</title>
<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:#000; overflow:hidden;
    font-family:"SF Mono","JetBrains Mono","Consolas","Menlo",monospace;
    color:#d8e8ff;
    -webkit-font-smoothing:antialiased;
  }
  #app{ display:flex; width:100vw; height:100vh; }

  /* ================= 左侧 1/5 ================= */
  #panel{
    width:20%; min-width:190px; height:100%;
    position:relative;
    padding:3vh 1.05vw 2vh;
    display:flex; flex-direction:column; gap:1.45vh;
    background:
      radial-gradient(120% 70% at 0% 0%, rgba(255,110,20,.16), transparent 60%),
      radial-gradient(130% 80% at 20% 100%, rgba(0,200,255,.13), transparent 62%),
      linear-gradient(165deg,#0a0704 0%,#05060c 55%,#02070a 100%);
    border-right:1px solid rgba(255,130,40,.20);
    box-shadow: inset -22px 0 48px -34px rgba(255,140,40,.55);
    overflow-y:auto; overflow-x:hidden;
  }
  #panel::-webkit-scrollbar{ width:0; }
  #panel::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,150,60,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,.045) 1px, transparent 1px);
    background-size:26px 26px;
    mask-image:radial-gradient(120% 90% at 40% 30%, #000 25%, transparent 88%);
  }
  #panel > *{ position:relative; z-index:1; }

  .head .title{
    font-size:clamp(14px,1.12vw,21px);
    font-weight:700; letter-spacing:.14em;
    background:linear-gradient(92deg,#ffb347 0%,#ff7a18 40%,#22d3ee 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,140,40,.5));
  }
  .head .sub{
    margin-top:.35em;
    font-size:clamp(7px,.50vw,9.5px);
    letter-spacing:.30em; color:#7a6a55;
  }
  .head .rule{
    margin-top:.7em; height:1px; width:100%;
    background:linear-gradient(90deg, rgba(255,150,60,.9), rgba(0,210,255,.45), transparent);
  }

  .card{
    border:1px solid rgba(255,150,60,.17);
    border-radius:7px;
    background:linear-gradient(150deg, rgba(255,120,20,.09), rgba(0,140,190,.07));
    padding:1.1vh .72vw;
    box-shadow: inset 0 1px 0 rgba(255,190,120,.10), 0 0 22px -14px rgba(255,140,40,.9);
  }
  .card .cap{
    font-size:clamp(7px,.48vw,9px);
    letter-spacing:.22em; color:#a07a4e; margin-bottom:.75em;
  }

  /* ---- 公式排版 ---- */
  .eq{
    display:flex; flex-wrap:wrap; align-items:center;
    gap:.16em; line-height:1.55;
    font-size:clamp(10.5px,.88vw,16px);
    color:#f0e6d8;
  }
  .eq .it{ font-style:italic; color:#ffce8a; }
  .eq .it2{ font-style:italic; color:#8fe9ff; }
  .eq .op{ opacity:.8; }
  .eq sub,.eq sup{ font-size:.6em; opacity:.85; }
  .frac{
    display:inline-flex; flex-direction:column; align-items:center;
    vertical-align:middle; margin:0 .16em; font-size:.88em; line-height:1.05;
  }
  .frac .num{ border-bottom:1px solid rgba(255,200,140,.7); padding:0 .3em .06em; }
  .frac .den{ padding:.06em .3em 0; }
  .intwrap{
    display:inline-flex; flex-direction:column; align-items:center;
    vertical-align:middle; line-height:1; margin:0 .08em;
  }
  .intwrap .lim{ font-size:.48em; color:#c39158; }
  .intwrap .intsym{ font-size:1.45em; margin:-.10em 0; color:#ffab4d; }
  .eq .big{ font-size:1.08em; }
  .geq{
    color:#8fe9ff;
    text-shadow:0 0 12px rgba(0,210,255,.55);
  }

  /* ---- 熵条 ---- */
  .bars{ display:flex; flex-direction:column; gap:.9vh; }
  .bar-row{ display:flex; flex-direction:column; gap:.35em; }
  .bar-head{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:clamp(6.5px,.45vw,8.5px); letter-spacing:.12em; color:#8a7a68;
  }
  .bar-head b{ font-weight:600; letter-spacing:0; }
  .bar-head .v-o{ color:#ff9c3a; }
  .bar-head .v-c{ color:#4fdcff; }
  .bar{
    height:5px; border-radius:3px;
    background:rgba(255,150,60,.10);
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,150,60,.14);
  }
  .bar i{
    display:block; height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,#ff7a18,#ffb347);
    box-shadow:0 0 9px rgba(255,140,40,.95);
    transition:width .08s linear;
  }
  .bar.cyan i{
    background:linear-gradient(90deg,#0891b2,#22d3ee,#a5f3fc);
    box-shadow:0 0 9px rgba(34,211,238,.95);
  }
  .note{
    font-size:clamp(6.5px,.44vw,8.5px);
    letter-spacing:.09em; color:#5f584e; line-height:1.75;
  }
  .note b{ color:#c39158; font-weight:600; }

  /* ================= 右侧 4/5 ================= */
  #stage{ flex:1; position:relative; background:#000; overflow:hidden; }
  #glcanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #stage::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(118% 88% at 50% 50%, transparent 52%, rgba(0,0,0,.7) 100%);
  }

  @media (max-width:760px){
    #app{ flex-direction:column; }
    #panel{ width:100%; height:36%; min-width:0;
      border-right:none; border-bottom:1px solid rgba(255,130,40,.20); }
    #stage{ height:64%; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ================= 左：热力学第二定律 ================= -->
  <aside id="panel">
    <div class="head">
      <div class="title">热力学第二定律</div>
      <div class="sub">SECOND LAW · ENTROPY</div>
      <div class="rule"></div>
    </div>

    <div class="card">
      <div class="cap">熵变 · 克劳修斯定义</div>
      <div class="eq">
        <span class="it big">Δ</span><span class="it big">S</span>
        <span class="op">=</span>
        <span class="intwrap">
          <span class="lim">2</span>
          <span class="intsym">∫</span>
          <span class="lim">1</span>
        </span>
        <span class="frac">
          <span class="num"><span class="it">δQ</span><sub>rev</sub></span>
          <span class="den"><span class="it">T</span></span>
        </span>
      </div>
    </div>

    <div class="card">
      <div class="cap">孤立系统 · 熵增原理</div>
      <div class="eq">
        <span class="it big">Δ</span><span class="it big">S</span><sub>iso</sub>
        <span class="op">≥</span>
        <span class="big">0</span>
      </div>
      <div class="eq" style="margin-top:.85em; font-size:.86em;">
        <span class="op">∮</span>
        <span class="frac">
          <span class="num"><span class="it">δQ</span></span>
          <span class="den"><span class="it">T</span></span>
        </span>
        <span class="op">≤</span><span class="big">0</span>
      </div>
    </div>

    <div class="card">
      <div class="cap">微观 · 玻尔兹曼熵</div>
      <div class="eq">
        <span class="it2 big">S</span>
        <span class="op">=</span>
        <span class="it2">k</span><sub>B</sub>
        <span class="op">ln</span>
        <span class="it2 big">Ω</span>
      </div>
      <div class="note" style="margin-top:.8em">
        秩序 = Ω 小 &nbsp;·&nbsp; 混乱 = Ω 大
      </div>
    </div>

    <div class="card" style="flex:1 1 auto; display:flex; flex-direction:column; min-height:96px;">
      <div class="cap">实时熵产</div>
      <div class="bars">
        <div class="bar-row">
          <div class="bar-head">
            <span>局部结构熵 <b>S<sub>loc</sub></b></span>
            <span class="v-o" id="vLoc">0%</span>
          </div>
          <div class="bar"><i id="barLoc"></i></div>
        </div>
        <div class="bar-row">
          <div class="bar-head">
            <span>宇宙总熵 <b>S<sub>tot</sub></b></span>
            <span class="v-c" id="vTot">0%</span>
          </div>
          <div class="bar cyan"><i id="barTot"></i></div>
        </div>
      </div>
      <div class="note" style="margin-top:1.1em">
        <b>崩解</b> → 局部熵 ↑ &nbsp; 秩序瓦解<br>
        <b>重组</b> → 局部熵 ↓ &nbsp; 代价是总熵 ↑<br>
        <span style="color:#8fe9ff">生命是熵增洪流中的局部逆流</span>
      </div>
    </div>
  </aside>

  <!-- ================= 右：数字生命 ================= -->
  <main id="stage">
    <canvas id="glcanvas"></canvas>
  </main>

</div>

<script>
"use strict";

(function(){

  const cv  = document.getElementById('glcanvas');
  const ctx = cv.getContext('2d');

  const TAU = Math.PI * 2;

  let W = 0, H = 0, CX = 0, CY = 0, R = 200;

  /* =====================================================
     粒子系统
     ===================================================== */
  const PCOUNT = 1500;
  const parts = [];

  /* ---- 发光精灵 ---- */
  function makeSprite(inner, mid){
    const S = 64;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0.00, inner);
    grd.addColorStop(0.22, mid);
    grd.addColorStop(0.55, mid.replace(/[\d.]+\)$/, '0.14)'));
    grd.addColorStop(1.00, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);
    return c;
  }

  const SPR_O = makeSprite('rgba(255,238,200,1)', 'rgba(255,132,18,0.85)');
  const SPR_C = makeSprite('rgba(214,255,255,1)', 'rgba(0,205,255,0.85)');

  /* ---- 尺寸 ---- */
  function resize(){
    const oldCX = CX, oldCY = CY, oldR = R || 1;

    const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    const rect = cv.parentElement.getBoundingClientRect();
    const w = Math.max(1, rect.width);
    const h = Math.max(1, rect.height);

    cv.width  = Math.floor(w * dpr);
    cv.height = Math.floor(h * dpr);
    cv.style.width  = w + 'px';
    cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    W = w; H = h;
    CX = W * 0.5; CY = H * 0.5;
    R  = Math.min(W, H) * 0.27;

    const s = R / oldR;
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      p.x = CX + (p.x - oldCX) * s;
      p.y = CY + (p.y - oldCY) * s;
    }
  }

  /* ---- 初始化粒子 ---- */
  function initParticles(){
    parts.length = 0;
    for (let i = 0; i < PCOUNT; i++){
      const ang = Math.random() * TAU;
      const rad = Math.sqrt(Math.random()) * R * 1.5;
      parts.push({
        u: Math.random(),                       // 沿体轴 0..1
        v: Math.random() * 2 - 1,               // 管截面 -1..1
        x: CX + Math.cos(ang) * rad,
        y: CY + Math.sin(ang) * rad * 0.85,
        vx: 0, vy: 0,
        orange: Math.random() < 0.56,
        size: 0.70 + Math.random() * 1.45,
        ph: Math.random() * TAU,
        sp: 0.55 + Math.random() * 1.25,
        alpha: 0.11 + Math.random() * 0.17
      });
    }
  }

  /* =====================================================
     秩序参数 —— 崩解 / 重组的节律
     ===================================================== */
  const CYCLE = 14;   // 秒

  function orderLevel(t){
    const ph = (t % CYCLE) / CYCLE;
    let o;
    if (ph < 0.14){
      o = 0;                                    // 混沌
    } else if (ph < 0.36){
      const x = (ph - 0.14) / 0.22;             // 重组
      o = x * x * (3 - 2 * x);
    } else if (ph < 0.50){
      o = 1;                                    // 凝聚 · 有序
    } else if (ph < 0.64){
      const x = (ph - 0.50) / 0.14;             // 崩解
      o = 1 - x * x * (3 - 2 * x);
    } else {
      o = 0;                                    // 混沌
    }
    return o;
  }

  /* =====================================================
     物理更新
     ===================================================== */
  let stateO = 0;

  function update(dt, T){
    const f = Math.min(dt, 0.05) * 60;

    const base = orderLevel(T);
    const O = Math.min(1, base * (0.94 + 0.06 * Math.sin(T * 2.15)));
    stateO = O;

    const chaos = 1 - O;
    const k     = 0.0022 + 0.078 * O * O;      // 弹簧刚度
    const damp  = Math.pow(0.934, f);
    const rot   = T * 0.20;

    const wA = 0.070, wB = 0.026, wC = 0.018;

    for (let i = 0; i < parts.length; i++){
      const p = parts[i];

      /* --- 体轴目标点 --- */
      const a  = p.u * TAU + rot;
      const s3 = Math.sin(3 * a + T * 0.9);
      const c3 = Math.cos(3 * a + T * 0.9);
      const s5 = Math.sin(5 * a - T * 1.5);
      const c5 = Math.cos(5 * a - T * 1.5);
      const sa = Math.sin(a), ca = Math.cos(a);

      const m  = 1 + 0.15 * s3 + 0.07 * s5;     // 半径调制
      const mp = 0.45 * c3 + 0.35 * c5;         // dm/da

      const bx = CX + ca * R * m;
      const by = CY + sa * R * m * 0.78;

      /* --- 切向 / 法向 --- */
      const dx = -sa * m + ca * mp;
      const dy = 0.78 * (ca * m + sa * mp);
      const tl = Math.sqrt(dx * dx + dy * dy) || 1;
      const txv = dx / tl, tyv = dy / tl;
      const nx = -tyv, ny = txv;

      /* --- 管截面半宽 --- */
      const wdt = R * (wA
        + wB * Math.sin(2 * TAU * p.u + T * 0.8)
        + wC * Math.sin(3 * TAU * p.u - T * 1.3));

      const targX = bx + nx * p.v * wdt;
      const targY = by + ny * p.v * wdt;

      /* --- 向目标收拢（秩序力） --- */
      p.vx += (targX - p.x) * k * f;
      p.vy += (targY - p.y) * k * f;

      /* --- 混沌驱动力 --- */
      if (chaos > 0.008){
        const rxx = p.x - CX, ryy = p.y - CY;
        const rl  = Math.sqrt(rxx * rxx + ryy * ryy) + 0.001;
        const ux = rxx / rl, uy = ryy / rl;

        // 湍流抖动
        p.vx += Math.sin(T * 1.85 * p.sp + p.ph) * 0.115 * chaos * f;
        p.vy += Math.cos(T * 2.25 * p.sp + p.ph * 1.7) * 0.115 * chaos * f;

        // 向外扩张
        p.vx += ux * 0.058 * chaos * f;
        p.vy += uy * 0.058 * chaos * f;

        // 涡旋
        p.vx += (-uy) * 0.075 * chaos * f;
        p.vy += ( ux) * 0.075 * chaos * f;
      }

      /* --- 阻尼 & 积分 --- */
      p.vx *= damp;
      p.vy *= damp;
      p.x  += p.vx * f;
      p.y  += p.vy * f;

      /* --- 软边界 --- */
      const ex = p.x - CX, ey = p.y - CY;
      const el = Math.sqrt(ex * ex + ey * ey);
      const maxD = R * 1.62;
      if (el > maxD){
        const push = (el - maxD) * 0.014 * f;
        p.x -= (ex / el) * push;
        p.y -= (ey / el) * push;
      }
    }
  }

  /* =====================================================
     渲染
     ===================================================== */
  function render(T){
    /* 拖尾 */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    ctx.fillRect(0, 0, W, H);

    const O = stateO;
    const glow = 0.30 + 0.70 * O;

    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      const sp = p.orange ? SPR_O : SPR_C;

      const sz = p.size * R * 0.039 * (1 + 0.55 * O);
      const tw = 0.72 + 0.28 * Math.sin(T * 3.1 * p.sp + p.ph);

      ctx.globalAlpha = p.alpha * glow * tw;
      ctx.drawImage(sp, p.x - sz, p.y - sz, sz * 2, sz * 2);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* =====================================================
     左侧面板
     ===================================================== */
  const barLoc = document.getElementById('barLoc');
  const barTot = document.getElementById('barTot');
  const vLoc   = document.getElementById('vLoc');
  const vTot   = document.getElementById('vTot');

  function updatePanel(T){
    const O = stateO;
    const local = 0.14 + 0.86 * (1 - O);              // 局部结构熵
    const total = 1 - Math.exp(-T * 0.032);           // 宇宙总熵

    barLoc.style.width = (local * 100).toFixed(1) + '%';
    barTot.style.width = (total * 100).toFixed(1) + '%';
    vLoc.textContent = (local * 100).toFixed(0) + '%';
    vTot.textContent = (total * 100).toFixed(0) + '%';
  }

  /* =====================================================
     主循环
     ===================================================== */
  let last = performance.now();
  let T = 0;

  function frame(now){
    const dt = (now - last) / 1000;
    last = now;
    T += Math.min(dt, 0.06);

    update(dt, T);
    render(T);
    updatePanel(T);

    requestAnimationFrame(frame);
  }

  /* ---- 启动 ---- */
  resize();
  initParticles();
  window.addEventListener('resize', resize);

  requestAnimationFrame(function(t){
    last = t;
    requestAnimationFrame(frame);
  });

})();

</script>
</body>
</html>
