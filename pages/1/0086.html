<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas吸引子 · 对称混沌巢</title>
    <style>
        :root {
            --bg: #02010e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: clamp(16px, 3.5vh, 42px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #title-overlay h1 {
            color: #e0cfb3;
            font-size: clamp(1.15rem, 2.2vw, 1.85rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 28px rgba(210, 175, 130, 0.55), 0 0 72px rgba(185, 145, 100, 0.25);
            margin: 0;
        }
        #title-overlay .subtitle {
            color: #bca689;
            font-size: clamp(0.66rem, 1.1vw, 0.9rem);
            letter-spacing: 0.06em;
            margin-top: 0.28em;
            text-shadow: 0 0 14px rgba(180, 140, 100, 0.4);
        }

        #formula-overlay {
            position: fixed;
            bottom: clamp(24px, 4.5vh, 54px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(14, 10, 20, 0.72);
            border: 1px solid rgba(165, 140, 110, 0.28);
            border-radius: 12px;
            padding: clamp(10px, 1.4vh, 16px) clamp(16px, 3vw, 28px);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        #formula-overlay .formula-main {
            color: #f1ddc3;
            font-size: clamp(0.7rem, 1.18vw, 1.02rem);
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a59279;
            font-size: clamp(0.54rem, 0.78vw, 0.7rem);
            letter-spacing: 0.03em;
            margin-top: 0.22em;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.05em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>Thomas吸引子 · 对称混沌巢</h1>
        <div class="subtitle">Symmetric Chaos Nest · Thomas Attractor</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                ẋ = sin y − b·x<br>
                ẏ = sin z − b·y<br>
                ż = sin x − b·z
            </div>
            <div class="formula-detail">
                b = 0.18 | x₀≈0.1, y₀≈0, z₀≈0 | 10 trajectories
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02010e');
        scene.fog = new THREE.Fog('#02010e', 7.5, 23);

        const camera = new THREE.PerspectiveCamera(
            46,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            30
        );
        camera.position.set(0, 0.25, 8.6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight('#1e1e3a', 0.4));

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const totalPoints = 2400;    // 每条轨迹的采样点数
        const trajectoryCount = 10;
        const allLines = [];

        // Thomas 系统参数
        const b = 0.18;

        const dt = 0.025;
        const preSteps = 600; // 预积分消除瞬态

        // ==================== RK4 积分 ====================
        function thomasDeriv(x, y, z) {
            return [
                Math.sin(y) - b * x,
                Math.sin(z) - b * y,
                Math.sin(x) - b * z,
            ];
        }

        function rk4Step(x, y, z, dt) {
            const [k1x, k1y, k1z] = thomasDeriv(x, y, z);
            const [k2x, k2y, k2z] = thomasDeriv(
                x + 0.5 * dt * k1x, y + 0.5 * dt * k1y, z + 0.5 * dt * k1z
            );
            const [k3x, k3y, k3z] = thomasDeriv(
                x + 0.5 * dt * k2x, y + 0.5 * dt * k2y, z + 0.5 * dt * k2z
            );
            const [k4x, k4y, k4z] = thomasDeriv(
                x + dt * k3x, y + dt * k3y, z + dt * k3z
            );
            return [
                x + (dt / 6) * (k1x + 2 * k2x + 2 * k3x + k4x),
                y + (dt / 6) * (k1y + 2 * k2y + 2 * k3y + k4y),
                z + (dt / 6) * (k1z + 2 * k2z + 2 * k3z + k4z),
            ];
        }

        // ==================== 生成单条轨迹 ====================
        function generateTrajectory(initX, initY, initZ) {
            const rawVerts = new Float32Array(totalPoints * 3);
            let x = initX, y = initY, z = initZ;

            // 预积分
            for (let i = 0; i < preSteps; i++) {
                [x, y, z] = rk4Step(x, y, z, dt);
            }

            // 正式记录
            for (let i = 0; i < totalPoints; i++) {
                rawVerts[i * 3] = x;
                rawVerts[i * 3 + 1] = y;
                rawVerts[i * 3 + 2] = z;
                [x, y, z] = rk4Step(x, y, z, dt);
            }
            return rawVerts;
        }

        // ==================== 生成所有轨迹原始数据 ====================
        const allRawVertices = [];
        // 初始条件围绕 (0.1, 0, 0) 做极微小扰动
        for (let j = 0; j < trajectoryCount; j++) {
            const angle = (j / trajectoryCount) * Math.PI * 2;
            const deltaR = 0.0003 + j * 0.00015;
            const deltaX = deltaR * Math.cos(angle);
            const deltaY = deltaR * Math.sin(angle);
            const deltaZ = (j % 3 - 1) * 0.0004;
            const initX = 0.1 + deltaX;
            const initY = 0.0 + deltaY;
            const initZ = 0.0 + deltaZ;
            const rawVerts = generateTrajectory(initX, initY, initZ);
            allRawVertices.push(rawVerts);
        }

        // ==================== 计算全局包围盒 ====================
        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let minZ = Infinity, maxZ = -Infinity;

        for (const rawVerts of allRawVertices) {
            for (let i = 0; i < rawVerts.length; i += 3) {
                const vx = rawVerts[i];
                const vy = rawVerts[i + 1];
                const vz = rawVerts[i + 2];
                if (vx < minX) minX = vx;
                if (vx > maxX) maxX = vx;
                if (vy < minY) minY = vy;
                if (vy > maxY) maxY = vy;
                if (vz < minZ) minZ = vz;
                if (vz > maxZ) maxZ = vz;
            }
        }

        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        const centerZ = (minZ + maxZ) / 2;
        const rangeX = maxX - minX;
        const rangeY = maxY - minY;
        const rangeZ = maxZ - minZ;
        const maxRange = Math.max(rangeX, rangeY, rangeZ, 1);
        const targetScale = 4.2 / maxRange;

        console.log('📐 包围盒:', { maxRange: maxRange.toFixed(2), targetScale: targetScale.toFixed(4) });

        // ==================== 创建线条 ====================
        function createLine(scaledVerts, hue, opacity = 0.8) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(scaledVerts, 3));
            geometry.setDrawRange(0, 0); // 初始完全不可见

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(hue, 0.90, 0.62),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: true,
                depthTest: true,
            });

            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // 缩放并创建所有线条
        for (let j = 0; j < trajectoryCount; j++) {
            const rawVerts = allRawVertices[j];
            const scaledVerts = new Float32Array(totalPoints * 3);
            for (let i = 0; i < totalPoints; i++) {
                scaledVerts[i * 3] = (rawVerts[i * 3] - centerX) * targetScale;
                scaledVerts[i * 3 + 1] = (rawVerts[i * 3 + 1] - centerY) * targetScale;
                scaledVerts[i * 3 + 2] = (rawVerts[i * 3 + 2] - centerZ) * targetScale;
            }
            // 色相从柔紫到暖金：0.7~0.9 过渡到 0.08~0.15
            const hue = 0.72 + (j / (trajectoryCount - 1)) * 0.25;
            const line = createLine(scaledVerts, hue % 1.0, 0.76);
            mainGroup.add(line);
            allLines.push(line);
        }

        console.log(`✅ 已生成 ${trajectoryCount} 条Thomas轨迹`);

        // ==================== 动画状态机 ====================
        const APPEAR_TIME = 8.0;
        const PAUSE_TIME = 1.5;
        const DISAPPEAR_TIME = 8.0;
        const CYCLE_TOTAL = APPEAR_TIME + PAUSE_TIME + DISAPPEAR_TIME; // 17.5秒

        let animationStartTime = null;
        let firstFrameDone = false;

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }
        function easeInCubic(t) {
            return t * t * t;
        }

        function getProgress(elapsedSeconds) {
            const cycle = elapsedSeconds % CYCLE_TOTAL;
            if (cycle < APPEAR_TIME) {
                const t = cycle / APPEAR_TIME;
                return { progress: easeOutCubic(t), phase: 'appear' };
            } else if (cycle < APPEAR_TIME + PAUSE_TIME) {
                return { progress: 1.0, phase: 'pause' };
            } else {
                const t = (cycle - APPEAR_TIME - PAUSE_TIME) / DISAPPEAR_TIME;
                return { progress: 1.0 - easeInCubic(t), phase: 'disappear' };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            // 第一帧：强制空白
            if (animationStartTime === null) {
                animationStartTime = timestamp;
                allLines.forEach(line => {
                    line.visible = false;
                    if (line.geometry) line.geometry.setDrawRange(0, 0);
                });
                renderer.render(scene, camera);
                firstFrameDone = true;
                return;
            }

            const elapsed = (timestamp - animationStartTime) / 1000;
            const { progress } = getProgress(elapsed);
            const drawCount = Math.floor(progress * totalPoints);
            const shouldBeVisible = drawCount >= 2;

            // 批量更新所有轨迹的绘制范围
            for (let i = 0; i < allLines.length; i++) {
                const line = allLines[i];
                if (!line || !line.geometry) continue;
                const lineDraw = Math.min(drawCount, totalPoints);
                if (shouldBeVisible && lineDraw >= 2) {
                    line.visible = true;
                    line.geometry.setDrawRange(0, lineDraw);
                } else {
                    line.visible = false;
                    line.geometry.setDrawRange(0, 0);
                }
            }

            // 整体缓慢旋转，展现对称混沌结构
            const rotY = elapsed * 0.045;
            const rotX = Math.sin(elapsed * 0.09) * 0.032;
            const rotZ = Math.cos(elapsed * 0.12) * 0.025;
            mainGroup.rotation.set(rotX, rotY, rotZ);

            // 相机轻柔晃动
            camera.position.x = Math.sin(elapsed * 0.08) * 0.22;
            camera.position.y = 0.25 + Math.cos(elapsed * 0.11) * 0.16;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (h <= 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 Thomas吸引子·对称混沌巢动画启动');
        console.log(`   - 轨迹数量: ${trajectoryCount}`);
        console.log(`   - 采样点/轨迹: ${totalPoints}`);
        console.log(`   - 动画周期: ${CYCLE_TOTAL}s (生长${APPEAR_TIME}s + 停顿${PAUSE_TIME}s + 消散${DISAPPEAR_TIME}s)`);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
