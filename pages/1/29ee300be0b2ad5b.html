<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狄拉克方程 · 量子海马</title>
<style>
  :root{ --split: 20%; }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
  }

  /* ================= 左侧：狄拉克方程 ================= */
  #left{
    position:fixed; left:0; top:0; bottom:0;
    width: var(--split);
    display:flex; align-items:center; justify-content:center;
    padding: 20px 10px;
    background:
      radial-gradient(120% 80% at 18% 26%, rgba(0,220,255,.075), transparent 62%),
      radial-gradient(120% 80% at 82% 82%, rgba(255,215,60,.045), transparent 62%),
      #000;
    border-right:1px solid rgba(80,240,255,.16);
    color:#7fe9ff;
    font-family:"Cambria Math","Latin Modern Math","Times New Roman",serif;
    overflow:hidden;
    z-index:2;
  }
  #left::after{ /* 极淡的扫描光 */
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(0,230,255,.05) 50%, transparent 100%);
    background-size:100% 220%;
    animation: scan 9s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ from{ background-position: 0 -110%; } to{ background-position: 0 110%; } }

  .stack{ width:100%; text-align:center; position:relative; z-index:1; }

  .kicker{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(7px, .56vw, 11px);
    letter-spacing:.34em;
    color: rgba(120,240,255,.5);
    margin-bottom: 1.9em;
    white-space: nowrap;
  }

  .eq{
    font-size: clamp(9px, 1.0vw, 18px);
    line-height: 1.95;
    color:#8ff4ff;
    text-shadow:
      0 0 10px rgba(0,230,255,.55),
      0 0 26px rgba(0,170,255,.22);
    animation: pulse 5.5s ease-in-out infinite;
    word-break: keep-all;
  }
  .eq.big{
    font-size: clamp(10px, 1.14vw, 20px);
    color:#a8f8ff;
  }
  .eq i{ font-style: italic; }
  .eq b{
    font-weight:600; color:#ffd84a;
    text-shadow: 0 0 10px rgba(255,210,60,.65), 0 0 24px rgba(255,180,0,.3);
  }
  .eq sup, .eq sub{ font-size:.6em; }

  @keyframes pulse{
    0%,100%{ opacity:.82; }
    50%    { opacity:1; }
  }

  .frac{
    display:inline-flex; flex-direction:column;
    vertical-align:middle; text-align:center;
    font-size:.84em; line-height:1.06;
    margin:0 .18em;
  }
  .frac > span:first-child{
    border-bottom:1px solid rgba(140,245,255,.8);
    padding:0 .2em .05em;
  }
  .frac > span:last-child{ padding-top:.05em; }

  .rule{
    height:1px; width:60%;
    margin: 1.7em auto;
    background:linear-gradient(90deg, transparent, rgba(120,240,255,.45), transparent);
  }

  .meta{
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(7px, .56vw, 10px);
    letter-spacing:.22em;
    color: rgba(150,240,255,.6);
    white-space: nowrap;
  }
  .dot{
    display:inline-block; width:.6em; height:.6em; border-radius:50%;
    vertical-align:middle; margin:0 .35em 0 .1em;
  }
  .dot.cy{ background:#2ffcff; box-shadow:0 0 10px #2ffcff, 0 0 22px rgba(0,255,255,.6); }
  .dot.ye{ background:#ffe23a; box-shadow:0 0 10px #ffe23a, 0 0 22px rgba(255,220,60,.6); }

  /* ================= 右侧：量子海马 ================= */
  #right{
    position:fixed; left: var(--split); top:0; right:0; bottom:0;
    background:#000;
    overflow:hidden;
  }
  #right canvas{ display:block; }

  @media (max-width: 900px){
    :root{ --split: 27%; }
    .kicker{ letter-spacing:.2em; }
    .meta{ letter-spacing:.1em; }
  }
</style>
</head>
<body>

<!-- ============ 左：方程 ============ -->
<div id="left">
  <div class="stack">
    <div class="kicker">DIRAC EQUATION</div>

    <div class="eq big">
      ( <i>i</i> γ<sup>μ</sup> ∂<sub>μ</sub> − <i>m</i> ) ψ = 0
    </div>

    <div class="rule"></div>

    <div class="eq">
      <i>i</i>ℏ
      <span class="frac"><span>∂ψ</span><span>∂t</span></span>
      = ( <i>c</i> <b>α</b>·<b>p</b> + β<i>m</i><i>c</i><sup>2</sup> ) ψ
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span class="dot cy"></span>粒子 &nbsp;·&nbsp;
      <span class="dot ye"></span>反粒子
    </div>
  </div>
</div>

<!-- ============ 右：场景 ============ -->
<div id="right"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  /* =========================================================
     0. 基础环境
     ========================================================= */
  const host = document.getElementById('right');

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 1);
  renderer.domElement.style.display = 'block';
  host.appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  const FOV    = 45;
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);

  const group = new THREE.Group();
  scene.add(group);

  /* =========================================================
     1. 海马中轴曲线（吻 → 头 → 颈 → 躯干 → 卷尾）
     ========================================================= */
  const spineRaw = [
    [-1.00,  0.96],  // 吻端
    [-0.72,  1.02],
    [-0.44,  0.95],  // 头前
    [-0.27,  0.76],
    [-0.21,  0.52],  // 颈
    [-0.19,  0.27],
    [-0.14,  0.00],
    [-0.06, -0.29],
    [ 0.04, -0.56],  // 躯干下
    [ 0.20, -0.79],  // 尾根
    [ 0.42, -0.94],
    [ 0.62, -0.84],
    [ 0.66, -0.60],  // 卷曲
    [ 0.52, -0.43],
    [ 0.31, -0.45],
    [ 0.23, -0.61],
    [ 0.30, -0.74]   // 尾尖
  ].map(p => new THREE.Vector3(p[0], p[1], 0));

  const curve = new THREE.CatmullRomCurve3(spineRaw, false, 'catmullrom', 0.5);

  /* 沿体轴的半宽包络（0=吻，1=尾尖） */
  const wKeys = [
    [0.00, 0.045], [0.05, 0.060], [0.10, 0.095], [0.15, 0.145],
    [0.20, 0.190], [0.26, 0.182], [0.32, 0.126], [0.38, 0.148],
    [0.46, 0.202], [0.55, 0.246], [0.63, 0.214], [0.70, 0.158],
    [0.77, 0.110], [0.84, 0.072], [0.91, 0.042], [0.96, 0.024],
    [1.00, 0.012]
  ];
  function widthAt(s) {
    for (let i = 1; i < wKeys.length; i++) {
      if (s <= wKeys[i][0]) {
        const [s0, w0] = wKeys[i - 1];
        const [s1, w1] = wKeys[i];
        let f = (s - s0) / (s1 - s0 || 1);
        f = f * f * (3 - 2 * f);            // smoothstep，避免折角
        return w0 + (w1 - w0) * f;
      }
    }
    return wKeys[wKeys.length - 1][1];
  }

  /* =========================================================
     2. 粒子对生成：每对 = 正粒子 + 反粒子
     ========================================================= */
  const PAIRS = 2300;
  const COUNT = PAIRS * 2;

  const aPos       = new Float32Array(COUNT * 3);
  const aOrbit     = new Float32Array(COUNT);  // 对偶轨道半径
  const aPhase     = new Float32Array(COUNT);  // 生灭相位
  const aOrbitPh   = new Float32Array(COUNT);  // 轨道角相位
  const aRate      = new Float32Array(COUNT);  // 生灭频率
  const aSpeed     = new Float32Array(COUNT);  // 轨道角速度
  const aSize      = new Float32Array(COUNT);
  const aSpecies   = new Float32Array(COUNT);  // 0 = 正粒子, 1 = 反粒子
  const aGain      = new Float32Array(COUNT);

  const _p = new THREE.Vector3();
  const _t = new THREE.Vector3();
  const _n = new THREE.Vector3();

  let idx = 0;
  for (let k = 0; k < PAIRS; k++) {

    const s = Math.random();                       // 沿体轴位置
    curve.getPointAt(s, _p);
    curve.getTangentAt(s, _t);
    _n.set(-_t.y, _t.x, 0).normalize();            // 法向

    const w = widthAt(s);

    /* 横向分布：向两侧轮廓聚集，形成发光边缘 */
    let u = Math.random() * 2 - 1;
    const sgn = u < 0 ? -1 : 1;
    u = sgn * Math.pow(Math.abs(u), 0.62);

    /* 少量粒子逸出体外 —— 真空涨落 */
    const stray = Math.random() < 0.055 ? (1 + Math.random() * 0.85) : 1;

    const bx = _p.x + _n.x * u * w * stray;
    const by = _p.y + _n.y * u * w * stray;
    const bz = (Math.random() - 0.5) * 0.11 + u * 0.025;

    /* 对偶共享参数 → 同时产生、同时湮灭 */
    const phase  = Math.random();
    const rate   = 0.24 + Math.random() * 0.90;
    const speed  = (1.1 + Math.random() * 2.7) * (Math.random() < 0.5 ? -1 : 1);
    const orbit  = 0.004 + Math.random() * 0.021;
    const baseSz = (0.70 + Math.random() * 1.25) * (1 + 0.55 * Math.abs(u));

    for (let m = 0; m < 2; m++) {
      aPos[idx * 3    ] = bx;
      aPos[idx * 3 + 1] = by;
      aPos[idx * 3 + 2] = bz;

      aOrbit  [idx] = orbit;
      aPhase  [idx] = phase;                       // 同一个生死节拍
      aOrbitPh[idx] = phase * Math.PI * 2 + m * Math.PI; // 反相绕转
      aRate   [idx] = rate;
      aSpeed  [idx] = speed * (m === 0 ? 1 : -1);
      aSize   [idx] = baseSz;
      aSpecies[idx] = m;
      aGain   [idx] = 0.5 + Math.random() * 0.85;
      idx++;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',   new THREE.BufferAttribute(aPos, 3));
  geo.setAttribute('aOrbit',     new THREE.BufferAttribute(aOrbit, 1));
  geo.setAttribute('aPhase',     new THREE.BufferAttribute(aPhase, 1));
  geo.setAttribute('aOrbitPh',   new THREE.BufferAttribute(aOrbitPh, 1));
  geo.setAttribute('aRate',      new THREE.BufferAttribute(aRate, 1));
  geo.setAttribute('aSpeed',     new THREE.BufferAttribute(aSpeed, 1));
  geo.setAttribute('aSize',      new THREE.BufferAttribute(aSize, 1));
  geo.setAttribute('aSpecies',   new THREE.BufferAttribute(aSpecies, 1));
  geo.setAttribute('aGain',      new THREE.BufferAttribute(aGain, 1));

  /* =========================================================
     3. 着色器
     ========================================================= */
  const uniforms = {
    uTime:       { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uSize:       { value: 14.0 },
    uCyan:       { value: new THREE.Color(0x22f6ff) },
    uYellow:     { value: new THREE.Color(0xffe23a) }
  };

  const vertexShader = /* glsl */`
    uniform float uTime;
    uniform float uPixelRatio;
    uniform float uSize;
    uniform vec3  uCyan;
    uniform vec3  uYellow;

    attribute float aOrbit;
    attribute float aPhase;
    attribute float aOrbitPh;
    attribute float aRate;
    attribute float aSpeed;
    attribute float aSize;
    attribute float aSpecies;
    attribute float aGain;

    varying vec3  vColor;
    varying float vAlpha;

    void main() {
      vec3 p = position;

      /* 全息体轻微游动 */
      p.x += sin(uTime * 1.05 + p.y * 2.30) * 0.013;
      p.y += cos(uTime * 0.85 + p.x * 1.90) * 0.009;

      /* 正反粒子对绕共同质心运动 */
      float ang = uTime * aSpeed + aOrbitPh;
      p += vec3(cos(ang), sin(ang * 1.17), cos(ang * 0.73)) * aOrbit;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;

      /* —— 产生 → 存活 → 湮灭 —— */
      float life = fract(uTime * aRate + aPhase);
      float env  = smoothstep(0.0, 0.12, life) * (1.0 - smoothstep(0.50, 0.95, life));

      /* 高频量子抖动 */
      float twinkle = 0.62 + 0.38 * sin(uTime * 17.0 + aOrbitPh * 31.0);

      vAlpha = env * twinkle * aGain;

      /* 霓虹青 ↔ 亮黄 */
      vColor = mix(uCyan, uYellow, aSpecies);

      gl_PointSize = aSize * uSize * uPixelRatio / max(0.001, -mv.z);
      gl_PointSize = clamp(gl_PointSize, 0.6, 22.0 * uPixelRatio);
    }
  `;

  const fragmentShader = /* glsl */`
    varying vec3  vColor;
    varying float vAlpha;

    void main() {
      vec2 d = gl_PointCoord - vec2(0.5);
      float r = length(d);
      if (r > 0.5) discard;

      float core = pow(1.0 - r * 2.0, 1.55);
      vec3  c = vColor * (0.35 + 1.15 * core);

      gl_FragColor = vec4(c, core * vAlpha);
    }
  `;

  const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geo, material);
  group.add(points);

  /* =========================================================
     4. 自适应
     ========================================================= */
  function resize() {
    const w = host.clientWidth  || 1;
    const h = host.clientHeight || 1;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h);

    camera.aspect = w / h;

    /* 依据可视范围自动推拉镜头，保证海马完整入画 */
    const vFov   = FOV * Math.PI / 180;
    const halfH  = 1.32;                 // 半高（世界单位）
    const halfW  = 0.98;                 // 半宽
    const tan    = Math.tan(vFov / 2);
    const distH  = halfH / tan;
    const distW  = halfW / (tan * camera.aspect);
    camera.position.set(0, 0, Math.max(distH, distW) + 0.30);
    camera.updateProjectionMatrix();

    uniforms.uPixelRatio.value = renderer.getPixelRatio();
  }
  window.addEventListener('resize', resize);
  resize();

  /* =========================================================
     5. 主循环
     ========================================================= */
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();
    uniforms.uTime.value = t;

    /* 全息投影式缓慢摆动 */
    group.rotation.y = Math.sin(t * 0.23) * 0.30;
    group.rotation.x = Math.sin(t * 0.16) * 0.10;
    group.position.y = Math.sin(t * 0.62) * 0.045;
    group.position.x = Math.sin(t * 0.41) * 0.025;

    renderer.render(scene, camera);
  }

  animate();

})();
</script>
</body>
</html>
