<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>电磁感应 · 涡旋电场 · Induced Vortex E-Field</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060e;}
  canvas{display:block;position:fixed;inset:0;touch-action:none;}

  .hud{
    position:fixed;pointer-events:none;z-index:5;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
  }

  /* ---------- 左上：标题 + 公式 ---------- */
  .hud-tl{
    top:clamp(16px,3vh,40px);
    left:clamp(16px,3vw,50px);
  }
  .hud-tl h1{
    font-size:clamp(15px,2.0vw,27px);
    font-weight:500;
    letter-spacing:.2em;
    color:#e9fbff;
    white-space:nowrap;
    text-shadow:0 0 10px #3ad2ff,0 0 34px #1a6aff,0 0 72px #8a2cff;
  }
  .hud-tl .en{
    margin-top:.6em;
    font-size:clamp(8px,.82vw,11px);
    letter-spacing:.4em;
    color:#5aa8cc;
    text-shadow:0 0 8px rgba(58,210,255,.55);
    white-space:nowrap;
  }
  .rule{
    margin:1.1em 0 1em;
    width:clamp(130px,17vw,250px);
    height:1px;
    background:linear-gradient(90deg,#3ad2ff,rgba(58,210,255,0));
    box-shadow:0 0 10px #3ad2ff;
  }
  .eq{
    font-size:clamp(10px,1.05vw,14px);
    letter-spacing:.07em;
    line-height:2.0;
    color:#a9e6ff;
    white-space:nowrap;
    text-shadow:0 0 10px rgba(58,210,255,.8);
  }
  .eq .hl{color:#ff9df0;text-shadow:0 0 12px #ff4de0,0 0 30px #a416ff;}
  .eq2{
    margin-top:.35em;
    color:#ffd8fb;
    text-shadow:0 0 12px rgba(255,90,230,.9),0 0 32px rgba(160,40,255,.6);
  }

  /* ---------- 右下：实时读数 ---------- */
  .hud-br{
    right:clamp(16px,3vw,50px);
    bottom:clamp(92px,15vh,132px);
    text-align:right;
    font-size:clamp(9px,.9vw,12px);
    letter-spacing:.18em;
    line-height:2.05;
    color:#6ec4e6;
    text-shadow:0 0 9px rgba(58,210,255,.65);
  }
  .hud-br b{color:#ffb3f4;font-weight:400;text-shadow:0 0 12px #ff4de0;}
  .hud-br .dim{color:#3f7a99;}
  .hud-br .pos{color:#7ff0ff;text-shadow:0 0 12px #3ad2ff;}
  .hud-br .neg{color:#ff9df0;text-shadow:0 0 12px #ff4de0;}

  /* ---------- 左侧竖条装饰 ---------- */
  .hud-line{
    position:fixed;left:clamp(7px,1.3vw,21px);top:50%;
    transform:translateY(-50%);
    width:1px;height:32vh;z-index:5;pointer-events:none;
    background:linear-gradient(180deg,transparent,#3ad2ff,transparent);
    opacity:.45;box-shadow:0 0 12px #3ad2ff;
  }

  /* ---------- 控制面板 ---------- */
  .panel{
    position:fixed;left:50%;bottom:clamp(16px,3.6vh,42px);
    transform:translateX(-50%);
    z-index:10;
    display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);
    padding:clamp(9px,1.2vh,15px) clamp(16px,2.2vw,30px);
    border:1px solid rgba(90,215,255,.28);
    border-radius:44px;
    background:rgba(7,20,42,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(9px,.95vw,12px);
    letter-spacing:.18em;
    color:#8fd8f5;
    box-shadow:0 0 30px rgba(30,120,255,.18),inset 0 0 22px rgba(58,210,255,.06);
    white-space:nowrap;
  }
  .panel .lab{color:#5fa6c8;}
  .panel .val{
    min-width:9.2em;color:#ffb3f4;
    text-shadow:0 0 12px #ff4de0;
    font-variant-numeric:tabular-nums;
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:clamp(140px,20vw,280px);height:2px;
    border-radius:2px;outline:none;
    background:linear-gradient(90deg,#ff4de0,#6a7bff,#3ad2ff,#6a7bff,#ff4de0);
    box-shadow:0 0 10px rgba(58,210,255,.6);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px;height:15px;border-radius:50%;
    background:#fff;cursor:pointer;
    box-shadow:0 0 12px #3ad2ff,0 0 26px #ff4de0;
    transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22);}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border:none;border-radius:50%;
    background:#fff;cursor:pointer;
    box-shadow:0 0 12px #3ad2ff,0 0 26px #ff4de0;
  }

  /* ---------- 启动提示 ---------- */
  #start{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    z-index:30;cursor:pointer;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
    font-size:clamp(10px,1vw,13px);
    letter-spacing:.32em;
    color:#b0ecff;
    padding:13px 30px;
    border:1px solid rgba(90,220,255,.45);
    border-radius:44px;
    background:rgba(8,26,54,.5);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    text-shadow:0 0 10px #3ad2ff;
    animation:breathe 2.6s ease-in-out infinite;
    transition:opacity .8s ease,transform .8s ease;
    white-space:nowrap;
  }
  #start.hide{
    opacity:0;pointer-events:none;
    transform:translate(-50%,-50%) scale(.94);
  }
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 rgba(58,210,255,0);border-color:rgba(90,220,255,.3);}
    50%{box-shadow:0 0 30px rgba(58,210,255,.55),inset 0 0 20px rgba(58,210,255,.12);border-color:rgba(150,240,255,.85);}
  }

  /* ---------- 扫描线 & 暗角 ---------- */
  .scan{
    position:fixed;inset:0;z-index:6;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.5;
  }
  .vig{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 50% 52%,transparent 32%,rgba(0,0,0,.7) 100%);
  }

  @media (max-width:640px){
    .hud-br{display:none;}
    .hud-tl .en{letter-spacing:.26em;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vig"></div>
<div class="scan"></div>
<div class="hud-line"></div>

<div class="hud hud-tl">
  <h1>电磁感应 · 涡旋电场</h1>
  <div class="en">FARADAY'S LAW · INDUCED VORTEX E-FIELD · 3D</div>
  <div class="rule"></div>
  <div class="eq">∮ <b>E</b>·d<b>l</b> = − dΦ<sub>B</sub>/dt &nbsp;·&nbsp; 法拉第定律</div>
  <div class="eq eq2">ε = − dΦ/dt &nbsp;·&nbsp; <b>E</b> ∝ r · |dB/dt|</div>
  <div class="eq">∇ × <b>E</b> = − ∂<b>B</b>/∂t</div>
</div>

<div class="hud hud-br">
  <div class="dim">—— 实时参数 ——</div>
  <div>dB/dt <b id="r-db">+1.50</b> T/s</div>
  <div>环向 <b id="r-dir" class="pos">逆时针 (+)</b></div>
  <div>场强 E ∝ <b id="r-e">0.68</b></div>
  <div>闭合环 <b>20</b> · 粒子 <b>360</b></div>
</div>

<div class="panel">
  <span class="lab">磁场变化率 dB/dt</span>
  <input type="range" id="db" min="-3" max="3" step="0.05" value="1.5">
  <span class="val" id="dbval">+1.50 T/s</span>
</div>

<div id="start">点击任意处 · 启动音效</div>

<script>
(function () {
'use strict';

/* ======================================================================
   0 · 画布与尺寸
   ====================================================================== */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const TAU    = Math.PI * 2;

let W = 0, H = 0, DPR = 1, S = 0, CX = 0, CY = 0, pScale = 340;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);
  CX = W * 0.5;
  CY = H * 0.53;
  pScale = S * 0.40;
}
window.addEventListener('resize', resize, { passive: true });
resize();

/* ======================================================================
   1 · 三维投影（Y 轴向上，即磁场 B 的方向）
   ====================================================================== */
const CAMD  = 4.6;                       // 相机距离
const PITCH = 0.46;                      // 俯仰角
const cosP  = Math.cos(PITCH);
const sinP  = Math.sin(PITCH);

let yaw  = 0.70;                         // 偏航角（缓慢自转）
let cosY = Math.cos(yaw);
let sinY = Math.sin(yaw);

function proj(x, y, z) {
  const x1 =  x * cosY + z * sinY;
  const z1 = -x * sinY + z * cosY;
  const y2 =  y * cosP - z1 * sinP;
  const z2 =  y * sinP + z1 * cosP;
  const d  = CAMD - z2;
  const f  = pScale * 2.6 / (d > 0.6 ? d : 0.6);
  return { x: CX + x1 * f, y: CY - y2 * f, z: z2, f: f };
}

/* ======================================================================
   2 · 预渲染光点精灵（按色相缓存，避免逐帧建渐变）
   ====================================================================== */
const SPR_N = 72;
const sprites = [];

(function buildSprites() {
  const SZ = 64;
  for (let i = 0; i < SPR_N; i++) {
    const hue = i * 360 / SPR_N;
    const cv = document.createElement('canvas');
    cv.width = cv.height = SZ;
    const g2 = cv.getContext('2d');

    const g = g2.createRadialGradient(SZ / 2, SZ / 2, 0, SZ / 2, SZ / 2, SZ / 2);
    g.addColorStop(0.00, 'hsla(' + hue + ',100%,98%,1)');
    g.addColorStop(0.12, 'hsla(' + hue + ',100%,84%,0.90)');
    g.addColorStop(0.32, 'hsla(' + hue + ',100%,66%,0.36)');
    g.addColorStop(0.62, 'hsla(' + hue + ',100%,58%,0.10)');
    g.addColorStop(1.00, 'hsla(' + hue + ',100%,55%,0)');

    g2.fillStyle = g;
    g2.fillRect(0, 0, SZ, SZ);
    sprites.push(cv);
  }
})();

function spriteFor(hue) {
  let h = ((hue % 360) + 360) % 360;
  let i = Math.round(h * SPR_N / 360) % SPR_N;
  return sprites[i];
}

/* ======================================================================
   3 · 背景（深空星尘 + 梦幻光斑）
   ====================================================================== */
const stars = [];
(function seedStars() {
  let s = 97531864;
  const rnd = function () {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  };
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: rnd(), y: rnd(),
      r: rnd() * 1.4 + 0.3,
      p: rnd() * TAU,
      sp: 0.4 + rnd() * 1.6
    });
  }
})();

const BLOBS = [
  { h: 198, x: 0.24, y: 0.30, r: 0.56, sp:  0.10 },
  { h: 292, x: 0.78, y: 0.42, r: 0.50, sp: -0.085 },
  { h: 336, x: 0.52, y: 0.78, r: 0.46, sp:  0.12 },
  { h: 170, x: 0.10, y: 0.66, r: 0.40, sp: -0.07 }
];

let time = 0;

function drawBackground() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#04060e';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  const md = Math.min(W, H);

  for (let i = 0; i < BLOBS.length; i++) {
    const b  = BLOBS[i];
    const px = W * (b.x + 0.06 * Math.sin(time * b.sp * 2.1 + i * 1.7));
    const py = H * (b.y + 0.05 * Math.cos(time * b.sp * 1.7 + i * 2.3));
    const r  = md * b.r * (1 + 0.14 * Math.sin(time * 0.6 + i));
    const hue = b.h + 22 * Math.sin(time * 0.27 + i);

    const g = ctx.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0.00, 'hsla(' + hue + ',95%,58%,0.23)');
    g.addColorStop(0.45, 'hsla(' + (hue + 25) + ',95%,50%,0.08)');
    g.addColorStop(1.00, 'hsla(' + (hue + 50) + ',95%,50%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(px - r, py - r, r * 2, r * 2);
  }

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const a = 0.06 + 0.30 * Math.abs(Math.sin(time * s.sp + s.p));
    ctx.fillStyle = 'rgba(170,228,255,' + a.toFixed(3) + ')';
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
}

/* ======================================================================
   4 · 电场环配置
   —— E = −(r/2)·dB/dt，方向由 dB/dt 符号决定，角速度与 r 无关
   ====================================================================== */
const RADII = [0.30, 0.55, 0.80, 1.05];
const YLEV  = [-1.15, -0.58, 0.00, 0.58, 1.15];
const NPER  = 18;                       // 每个环的粒子数
const SEGR  = 44;                       // 环折线段数
const RMAX  = RADII[RADII.length - 1];

const rings = [];
for (let h = 0; h < YLEV.length; h++) {
  for (let i = 0; i < RADII.length; i++) {
    const r = RADII[i];
    rings.push({
      r: r,
      y: YLEV[h],
      off: (h * RADII.length + i) * 0.55,   // 各环初始相位错开
      lum: 0.18 + 0.82 * (r / RMAX)          // 亮度 ∝ r（E ∝ r）
    });
  }
}

/* ======================================================================
   5 · 状态
   ====================================================================== */
let phase   = 0;        // 环向累积相位
let dBdt    = 1.5;      // 目标磁场变化率（滑块）
let dBdtSm  = 0;        // 平滑后的实际值
let lastDir = 1;

/* ======================================================================
   6 · 磁场区域（轴线 + 流动磁通粒子）
   ====================================================================== */
function drawMagnet() {
  ctx.globalCompositeOperation = 'lighter';

  const inten = Math.min(1, Math.abs(dBdtSm) / 2.2);

  const pB = proj(0, -1.65, 0);
  const pT = proj(0,  1.65, 0);

  /* --- 轴线渐变 --- */
  const g = ctx.createLinearGradient(pB.x, pB.y, pT.x, pT.y);
  g.addColorStop(0.00, 'rgba(90,180,255,0.015)');
  g.addColorStop(0.50, 'rgba(150,225,255,' + (0.10 + 0.45 * inten).toFixed(3) + ')');
  g.addColorStop(1.00, 'rgba(90,180,255,0.015)');

  ctx.lineCap = 'round';

  /* 外层辉光 */
  ctx.strokeStyle = 'rgba(110,200,255,' + (0.04 + 0.15 * inten).toFixed(3) + ')';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.moveTo(pB.x, pB.y);
  ctx.lineTo(pT.x, pT.y);
  ctx.stroke();

  /* 主体 */
  ctx.strokeStyle = g;
  ctx.lineWidth = 1.7;
  ctx.beginPath();
  ctx.moveTo(pB.x, pB.y);
  ctx.lineTo(pT.x, pT.y);
  ctx.stroke();

  /* --- 沿轴流动粒子：表示 B 的大小变化 --- */
  const dir  = dBdtSm >= 0 ? 1 : -1;
  const spr  = spriteFor(198);

  for (let i = 0; i < 14; i++) {
    let t = time * 0.42 * dir + i / 14;
    t = t - Math.floor(t);

    const y = -1.55 + t * 3.10;
    const p = proj(0, y, 0);

    /* 端点淡入淡出 */
    const edge = Math.min(t, 1 - t) * 4;
    const fade = Math.min(1, edge);

    const sz = (8 + 8 * inten) * (0.6 + 0.4 * fade);
    ctx.globalAlpha = (0.18 + 0.62 * inten) * fade;
    ctx.drawImage(spr, p.x - sz * 0.5, p.y - sz * 0.5, sz, sz);
  }
  ctx.globalAlpha = 1;

  /* --- 磁感线（平行于轴的虚线） --- */
  ctx.strokeStyle = 'rgba(90,180,255,0.055)';
  ctx.lineWidth = 0.7;
  ctx.setLineDash([4, 9]);

  for (let k = 0; k < 4; k++) {
    const a  = k / 4 * TAU + yaw * 0.0;
    const rr = 0.20;
    const x3 = rr * Math.cos(a);
    const z3 = rr * Math.sin(a);

    const q0 = proj(x3, -1.45, z3);
    const q1 = proj(x3,  1.45, z3);
    ctx.beginPath();
    ctx.moveTo(q0.x, q0.y);
    ctx.lineTo(q1.x, q1.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

/* ======================================================================
   7 · 涡旋电场环（闭合电场线 + 流动发光粒子）
   ====================================================================== */
function drawVortexRings() {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  const inten = Math.min(1, Math.abs(dBdtSm) / 2.2);
  const sgn   = dBdtSm >= 0 ? 1 : -1;

  /* 正 dB/dt → 青蓝；负 dB/dt → 品紫 */
  const baseHue = sgn > 0 ? 186 : 304;

  for (let k = 0; k < rings.length; k++) {
    const R = rings[k];

    const hue = baseHue + sgn * 20 * (R.r / RMAX);
    const aF  = R.lum * (0.09 + 0.91 * inten);
    if (aF < 0.008) continue;

    /* ---------- 闭合环折线 ---------- */
    ctx.beginPath();
    for (let j = 0; j <= SEGR; j++) {
      const a = j / SEGR * TAU;
      const p = proj(R.r * Math.cos(a), R.y, R.r * Math.sin(a));
      if (j === 0) ctx.moveTo(p.x, p.y);
      else         ctx.lineTo(p.x, p.y);
    }

    /* 外层辉光 */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',100%,60%,' +
                      (0.055 * aF).toFixed(4) + ')';
    ctx.lineWidth = 8;
    ctx.stroke();

    /* 中层 */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',100%,66%,' +
                      (0.16 * aF).toFixed(4) + ')';
    ctx.lineWidth = 2.4;
    ctx.stroke();

    /* 主体亮线 */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',100%,76%,' +
                      (0.42 * aF).toFixed(4) + ')';
    ctx.lineWidth = 1.0;
    ctx.stroke();

    /* ---------- 流动粒子 ---------- */
    const spr    = spriteFor(hue);
    const szBase = 7 + 12 * inten;

    for (let j = 0; j < NPER; j++) {
      const a  = phase + R.off + j / NPER * TAU;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const p  = proj(R.r * ca, R.y, R.r * sa);

      if (p.x < -70 || p.x > W + 70 || p.y < -70 || p.y > H + 70) continue;

      /* 粒子大小随“亮度闪烁”轻微脉动 */
      const flick = 0.86 + 0.28 * Math.sin(j * 2.3 + time * 4.1 + R.off);
      const sz = szBase * flick;

      /* 深度衰减 */
      let dep = (p.z + 1.4) / 2.8;
      if (dep < 0) dep = 0;
      if (dep > 1) dep = 1;
      dep = 0.45 + 0.55 * dep;

      ctx.globalAlpha = (0.30 + 0.65 * inten) * dep;
      ctx.drawImage(spr, p.x - sz * 0.5, p.y - sz * 0.5, sz, sz);
    }
    ctx.globalAlpha = 1;
  }
}

/* ======================================================================
   8 · 参考地面圆环（空间参照，很淡）
   ====================================================================== */
function drawReference() {
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(64,130,200,0.045)';
  ctx.lineWidth = 0.7;

  const yy = -1.55;

  for (let k = 1; k <= 3; k++) {
    const rr = RMAX * k / 3;
    ctx.beginPath();
    for (let j = 0; j <= 56; j++) {
      const a = j / 56 * TAU;
      const p = proj(rr * Math.cos(a), yy, rr * Math.sin(a));
      if (j === 0) ctx.moveTo(p.x, p.y);
      else         ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
}

/* ======================================================================
   9 · 主循环
   ====================================================================== */
let last = 0;

function loop(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0)    dt = 0;

  time += dt;

  /* ---- 相机缓慢自转 ---- */
  yaw += dt * 0.115;
  cosY = Math.cos(yaw);
  sinY = Math.sin(yaw);

  /* ---- 平滑 dB/dt ---- */
  dBdtSm += (dBdt - dBdtSm) * Math.min(1, dt * 3.5);

  /* ---- 方向翻转检测（触发音效） ---- */
  const curDir = dBdtSm >= 0 ? 1 : -1;
  if (curDir !== lastDir && Math.abs(dBdtSm) > 0.05) {
    lastDir = curDir;
    playFlip(curDir);
  }

  /* ---- 环向相位推进：Ω = −(1/2)·dB/dt ---- */
  let omega = -0.5 * dBdtSm * 1.65;
  if (omega >  3.2) omega =  3.2;
  if (omega < -3.2) omega = -3.2;
  phase += omega * dt;

  /* ---- 绘制 ---- */
  drawBackground();
  drawReference();
  drawMagnet();
  drawVortexRings();

  /* ---- HUD ---- */
  frameCount++;
  if (frameCount % 6 === 0) updateHUD();

  requestAnimationFrame(loop);
}

/* ======================================================================
   10 · HUD 更新
   ====================================================================== */
const elDb  = document.getElementById('r-db');
const elDir = document.getElementById('r-dir');
const elE   = document.getElementById('r-e');
const elVal = document.getElementById('dbval');

let frameCount = 0;

function updateHUD() {
  const v = dBdt;
  const s = (v >= 0 ? '+' : '') + v.toFixed(2);
  elDb.textContent  = s;
  elVal.textContent = s + ' T/s';

  const inten = Math.min(1, Math.abs(dBdtSm) / 2.2);
  elE.textContent = inten.toFixed(2);

  if (dBdtSm >= 0) {
    elDir.textContent = '逆时针 (+)';
    elDir.className   = 'pos';
  } else {
    elDir.textContent = '顺时针 (−)';
    elDir.className   = 'neg';
  }
}
updateHUD();

/* ======================================================================
   11 · UI 交互
   ====================================================================== */
const slider = document.getElementById('db');

slider.addEventListener('input', function () {
  dBdt = parseFloat(slider.value);
  updateHUD();
  playWhoosh();
});

/* ======================================================================
   12 · 科技感音效（Web Audio）
   ====================================================================== */
let actx = null;
let masterGain = null;
let echoDelay = null;
let oscA = null, oscB = null, oscC = null;
let toneFilter = null, toneGain = null;
let noiseGainNode = null;

let lastWhoosh = 0;

function initAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  actx = new AC();

  /* ---- 主输出 ---- */
  masterGain = actx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(actx.destination);
  masterGain.gain.exponentialRampToValueAtTime(0.34, actx.currentTime + 3.5);

  /* ---- 太空回声 ---- */
  echoDelay = actx.createDelay(1.0);
  echoDelay.delayTime.value = 0.42;
  const fb   = actx.createGain(); fb.gain.value = 0.44;
  const dOut = actx.createGain(); dOut.gain.value = 0.30;
  echoDelay.connect(fb); fb.connect(echoDelay);
  echoDelay.connect(dOut); dOut.connect(masterGain);

  /* ---- 电磁嗡鸣（频率 ∝ |dB/dt|） ---- */
  toneFilter = actx.createBiquadFilter();
  toneFilter.type = 'lowpass';
  toneFilter.frequency.value = 1300;
  toneFilter.Q.value = 3.6;

  toneGain = actx.createGain();
  toneGain.gain.value = 0.0001;
  toneFilter.connect(toneGain);
  toneGain.connect(masterGain);
  toneGain.connect(echoDelay);

  /* 基频 */
  oscA = actx.createOscillator();
  oscA.type = 'sine';
  oscA.frequency.value = 90;
  const gA = actx.createGain(); gA.gain.value = 0.58;
  oscA.connect(gA); gA.connect(toneFilter);
  oscA.start();

  /* 五度 */
  oscB = actx.createOscillator();
  oscB.type = 'triangle';
  oscB.frequency.value = 135;
  const gB = actx.createGain(); gB.gain.value = 0.20;
  oscB.connect(gB); gB.connect(toneFilter);
  oscB.start();

  /* 低八度 */
  oscC = actx.createOscillator();
  oscC.type = 'sine';
  oscC.frequency.value = 45;
  const gC = actx.createGain(); gC.gain.value = 0.50;
  oscC.connect(gC); gC.connect(toneFilter);
  oscC.start();

  toneGain.gain.exponentialRampToValueAtTime(0.14, actx.currentTime + 4);

  /* 滤波器慢扫 */
  const lfo = actx.createOscillator();
  lfo.frequency.value = 0.052;
  const lfoG = actx.createGain();
  lfoG.gain.value = 400;
  lfo.connect(lfoG); lfoG.connect(toneFilter.frequency);
  lfo.start();

  /* ---- 空气噪声层 ---- */
  const bufLen = Math.floor(actx.sampleRate * 2);
  const nbuf   = actx.createBuffer(1, bufLen, actx.sampleRate);
  const nd     = nbuf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;

  const noise = actx.createBufferSource();
  noise.buffer = nbuf;
  noise.loop = true;

  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 860;
  nf.Q.value = 0.9;

  noiseGainNode = actx.createGain();
  noiseGainNode.gain.value = 0.013;

  noise.connect(nf); nf.connect(noiseGainNode); noiseGainNode.connect(masterGain);
  noise.start();

  const nLfo = actx.createOscillator();
  nLfo.frequency.value = 0.066;
  const nLfoG = actx.createGain();
  nLfoG.gain.value = 500;
  nLfo.connect(nLfoG); nLfoG.connect(nf.frequency);
  nLfo.start();

  /* ---- 周期性感应“冲击”声 ---- */
  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    const t = actx.currentTime;
    const amp = Math.min(1, Math.abs(dBdtSm) / 2.4);
    if (amp < 0.05) return;

    const base = 70 + Math.abs(dBdtSm) * 32;

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(base * 2.6, t);
    o.frequency.exponentialRampToValueAtTime(base * 0.85, t + 1.5);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.055 * amp, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 2.1);
  }, 3400);

  /* ---- 粒子琶音 ---- */
  const scale = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];
  let step = 0;

  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    if (Math.random() > 0.58) return;

    const t = actx.currentTime;
    const deg = scale[(step * 3 + Math.floor(Math.random() * 3)) % scale.length];
    const f = 300 * Math.pow(2, deg / 12);
    step++;

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.040, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 1.8);
  }, 470);

  /* ---- 深空脉冲 ---- */
  setInterval(function () {
    if (!actx || actx.state !== 'running') return;
    const t = actx.currentTime;

    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(118, t);
    o.frequency.exponentialRampToValueAtTime(36, t + 2.2);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.17, t + 0.24);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);

    o.connect(g);
    g.connect(masterGain);
    g.connect(echoDelay);

    o.start(t);
    o.stop(t + 2.5);
  }, 7500);

  updateTone();
}

/* 音高随 |dB/dt| 平滑变化 */
function updateTone() {
  if (!actx || !oscA || !oscB || !oscC) return;

  const t = actx.currentTime;
  const k = Math.min(1.6, Math.abs(dBdtSm) / 2.0);
  const base = 70 + k * 90;

  oscA.frequency.setTargetAtTime(base,       t, 0.22);
  oscB.frequency.setTargetAtTime(base * 1.5, t, 0.22);
  oscC.frequency.setTargetAtTime(base * 0.5, t, 0.22);

  /* 场强越大，滤波截止越高（更明亮） */
  if (toneFilter) {
    toneFilter.frequency.setTargetAtTime(900 + k * 900, t, 0.22);
  }
  if (noiseGainNode) {
    noiseGainNode.gain.setTargetAtTime(0.008 + k * 0.014, t, 0.25);
  }
}

/* 拖动滑块：扫掠音 */
function playWhoosh() {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  if (t - lastWhoosh < 0.09) return;
  lastWhoosh = t;

  const o = actx.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(360, t);
  o.frequency.exponentialRampToValueAtTime(120, t + 0.26);

  const f = actx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 1300;
  f.Q.value = 6;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.042, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);

  o.connect(f); f.connect(g);
  g.connect(masterGain);
  g.connect(echoDelay);

  o.start(t);
  o.stop(t + 0.34);
}

/* dB/dt 过零（方向翻转）：短促过渡音 */
function playFlip(dir) {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;

  const o = actx.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(dir > 0 ? 180 : 520, t);
  o.frequency.exponentialRampToValueAtTime(dir > 0 ? 640 : 150, t + 0.55);

  const f = actx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(700, t);
  f.frequency.exponentialRampToValueAtTime(2200, t + 0.55);
  f.Q.value = 4;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.075, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.70);

  o.connect(f); f.connect(g);
  g.connect(masterGain);
  g.connect(echoDelay);

  o.start(t);
  o.stop(t + 0.75);
}

/* 定时刷新音高 */
setInterval(function () {
  if (actx && actx.state === 'running') updateTone();
}, 260);

/* ======================================================================
   13 · 启动
   ====================================================================== */
const startEl = document.getElementById('start');
let started = false;

function startAll() {
  if (started) return;
  started = true;
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  startEl.classList.add('hide');
}

window.addEventListener('pointerdown', startAll, { passive: true });
window.addEventListener('keydown', startAll);
window.addEventListener('touchstart', startAll, { passive: true });

/* ======================================================================
   14 · 启动主循环
   ====================================================================== */
requestAnimationFrame(loop);

})();
</script>
