<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莫比乌斯变换 · 莫比乌斯章鱼</title>
<style>
  :root{ --split: 20%; }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
  }

  /* ================= 左侧：莫比乌斯变换 ================= */
  #left{
    position:fixed; left:0; top:0; bottom:0;
    width: var(--split);
    display:flex; align-items:center; justify-content:center;
    padding: 18px 9px;
    background:
      radial-gradient(120% 80% at 18% 22%, rgba(0,230,255,.09), transparent 62%),
      radial-gradient(120% 80% at 82% 84%, rgba(255,0,200,.08), transparent 62%),
      #000;
    border-right:1px solid rgba(0,230,255,.16);
    color:#a0f0ff;
    font-family:"Cambria Math","Latin Modern Math","Times New Roman",serif;
    overflow:hidden;
    z-index:2;
  }
  #left::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(0,230,255,.05) 50%, transparent 100%);
    background-size:100% 220%;
    animation: scan 9s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ from{ background-position: 0 -110%; } to{ background-position: 0 110%; } }

  .stack{ width:100%; text-align:center; position:relative; z-index:1; }

  .kicker{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(7px, .55vw, 10px);
    letter-spacing:.24em;
    color: rgba(120,230,255,.5);
    margin-bottom: 1.7em;
    white-space: nowrap;
  }

  .eq{
    font-size: clamp(8px, .88vw, 15px);
    line-height: 1.95;
    color:#a8eeff;
    text-shadow:
      0 0 10px rgba(0,220,255,.55),
      0 0 26px rgba(0,160,220,.22);
    animation: pulse 5.6s ease-in-out infinite;
    word-break: keep-all;
  }
  .eq.big{
    font-size: clamp(9px, 1.02vw, 17px);
    color:#c8f4ff;
  }
  .eq i{ font-style: italic; }
  .eq b{
    font-weight:600; color:#ff3cd0;
    text-shadow: 0 0 10px rgba(255,60,208,.75), 0 0 24px rgba(220,0,170,.35);
  }
  .eq sup, .eq sub{ font-size:.6em; }

  @keyframes pulse{
    0%,100%{ opacity:.84; }
    50%    { opacity:1; }
  }

  .frac{
    display:inline-flex; flex-direction:column;
    vertical-align:middle; text-align:center;
    font-size:.82em; line-height:1.08;
    margin:0 .18em;
  }
  .frac > span:first-child{
    border-bottom:1px solid rgba(150,235,255,.8);
    padding:0 .22em .05em;
  }
  .frac > span:last-child{ padding-top:.05em; }

  .rule{
    height:1px; width:62%;
    margin: 1.35em auto;
    background:linear-gradient(90deg, transparent, rgba(0,220,255,.42), transparent);
  }

  .meta{
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(7px, .54vw, 10px);
    letter-spacing:.16em;
    color: rgba(180,240,255,.62);
    white-space: nowrap;
  }
  .dot{
    display:inline-block; width:.6em; height:.6em; border-radius:50%;
    vertical-align:middle; margin:0 .28em 0 .1em;
  }
  .dot.cy{ background:#00e5ff; box-shadow:0 0 10px #00e5ff, 0 0 22px rgba(0,229,255,.7); }
  .dot.mg{ background:#ff00c8; box-shadow:0 0 10px #ff00c8, 0 0 22px rgba(255,0,200,.7); }

  /* ================= 右侧：莫比乌斯章鱼 ================= */
  #right{
    position:fixed; left: var(--split); top:0; right:0; bottom:0;
    background:#000;
    overflow:hidden;
  }
  #right canvas{ display:block; position:absolute; inset:0; }

  @media (max-width: 900px){
    :root{ --split: 27%; }
    .kicker{ letter-spacing:.14em; }
    .meta{ letter-spacing:.06em; }
  }
</style>
</head>
<body>

<!-- ============ 左：公式 ============ -->
<div id="left">
  <div class="stack">
    <div class="kicker">MÖBIUS TRANSFORM</div>

    <div class="eq big">
      <i>f</i>(<i>z</i>) =
      <span class="frac">
        <span><i>a z</i> + <i>b</i></span>
        <span><i>c z</i> + <i>d</i></span>
      </span>
    </div>

    <div class="rule"></div>

    <div class="eq">
      <i>a</i>, <i>b</i>, <i>c</i>, <i>d</i> ∈ ℂ &nbsp;·&nbsp;
      <i>ad</i> − <i>bc</i> ≠ 0
    </div>

    <div class="rule"></div>

    <div class="eq">
      <b>SL</b>(2,ℂ) / ±<b>I</b> ≅ Aut(ℂ̂)
    </div>

    <div class="rule"></div>

    <div class="eq">
      <i>w</i> ↦
      <span class="frac">
        <span>1</span>
        <span><i>z</i></span>
      </span>
      &nbsp;·&nbsp;
      <i>u</i> ↦ <i>u</i>+1
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span class="dot cy"></span>保角
      <span class="dot mg"></span>非定向
    </div>
  </div>
</div>

<!-- ============ 右：场景 ============ -->
<div id="right"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* =========================================================
   0. 渲染器 / 场景 / 相机
   ========================================================= */
const host = document.getElementById('right');

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 1);
renderer.domElement.style.display = 'block';
host.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

const LOOK_AT = new THREE.Vector3(0, -0.30, 0);
const BOUND_R = 2.55;

function fitCamera(){
  const w = host.clientWidth  || 1;
  const h = host.clientHeight || 1;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);

  camera.aspect = w / h;

  const vFov = camera.fov * Math.PI / 180;
  const tan  = Math.tan(vFov / 2);
  const dV   = BOUND_R / tan;
  const dH   = BOUND_R / (tan * camera.aspect);
  const d    = Math.max(dV, dH) * 1.06;

  const dir = new THREE.Vector3(0.08, 0.42, 1).normalize();
  camera.position.copy(LOOK_AT).addScaledVector(dir, d);
  camera.lookAt(LOOK_AT);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fitCamera);

/* =========================================================
   1. 莫比乌斯曲面参数化
   ========================================================= */
const R0 = 0.10;      // 触手根部基础半径
const AMP = 1.90;     // 触手伸展长度
const WID = 0.235;    // 带子半宽
const DROOP = 0.95;   // 触手垂坠量
const TWIST = 0.5;    // 莫比乌斯半扭转

/* 8 个平滑凸起 */
function lobe(u, t){
  const base = 0.5 + 0.5 * Math.cos(8 * u);
  const breathe = 1 + 0.055 * Math.sin(t * 1.05 + u * 2.0);
  return Math.pow(base, 1.18) * breathe;
}

/* 核心曲线 */
function corePoint(u, t){
  const lb = lobe(u, t);
  const r  = R0 + AMP * lb + 0.10 * Math.sin(3 * u + t * 0.85);

  const x = r * Math.cos(u);
  const z = r * Math.sin(u);
  const y = -DROOP * lb + 0.14 * Math.sin(2 * u - t * 1.05);

  return { x: x, y: y, z: z, r: r, lb: lb };
}

/* 表面点 */
const _sp = { x:0, y:0, z:0 };

function surfacePoint(u, v, t){
  const c = corePoint(u, t);

  /* 数值切线 */
  const du = 0.0006;
  const c2 = corePoint(u + du, t);

  let tx = c2.x - c.x, ty = c2.y - c.y, tz = c2.z - c.z;
  const tl = Math.hypot(tx, ty, tz) || 1;
  tx /= tl; ty /= tl; tz /= tl;

  /* 标架：n1 = T × ref，n2 = T × n1 */
  let refx = 0, refy = 1, refz = 0;
  if (Math.abs(ty) > 0.94){ refx = 1; refy = 0; refz = 0; }

  let n1x = ty * refz - tz * refy;
  let n1y = tz * refx - tx * refz;
  let n1z = tx * refy - ty * refx;
  const n1L = Math.hypot(n1x, n1y, n1z) || 1;
  n1x /= n1L; n1y /= n1L; n1z /= n1L;

  const n2x = ty * n1z - tz * n1y;
  const n2y = tz * n1x - tx * n1z;
  const n2z = tx * n1y - ty * n1x;

  /* 莫比乌斯扭转 + 游动扰动 */
  const phi = u * TWIST + 0.22 * Math.sin(t * 0.9 + u * 1.7);
  const cp = Math.cos(phi), sp = Math.sin(phi);

  /* 触手中段略宽、尖端收窄 */
  const ws = 0.40 + 0.72 * c.lb;
  const vv = v * WID * ws;

  _sp.x = c.x + vv * (cp * n1x + sp * n2x);
  _sp.y = c.y + vv * (cp * n1y + sp * n2y);
  _sp.z = c.z + vv * (cp * n1z + sp * n2z);

  return _sp;
}

/* =========================================================
   2. 颜色：霓虹青 ↔ 品红
   ========================================================= */
const COL_CYAN = new THREE.Color(0x00e5ff);
const COL_MAG  = new THREE.Color(0xff00c8);
const _colOut  = new THREE.Color();

function surfaceColor(u, v, t, out){
  /* 沿 u 方向的色相波动 */
  const f = 0.5 + 0.5 * Math.sin(u * 1.35 - t * 0.75);
  out.copy(COL_CYAN).lerp(COL_MAG, f);

  /* 带缘更亮 */
  const edge = Math.abs(v);
  const gain = 0.45 + 0.75 * edge;

  /* 呼吸亮度 */
  const pulse = 0.72 + 0.28 * Math.sin(t * 2.1 + u * 3.4 + v * 2.0);

  out.multiplyScalar(gain * pulse);
  return out;
}

/* =========================================================
   3. 构建线框几何
   ========================================================= */
const NU_STEPS = 340;    // 沿 u 方向采样
const NV_LINES = 21;     // 恒定 v 的线条数
const NU_LINES = 220;    // 恒定 u 的线条数
const NV_STEPS = 19;     // 沿 v 方向采样

/* ---- 顶点缓冲 ---- */
const segCountV = NV_LINES * (NU_STEPS - 1);
const segCountU = NU_LINES * (NV_STEPS - 1);
const TOTAL_SEGS = segCountV + segCountU;
const TOTAL_VERTS = TOTAL_SEGS * 2;

const posArr = new Float32Array(TOTAL_VERTS * 3);
const colArr = new Float32Array(TOTAL_VERTS * 3);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors : true,
  transparent  : true,
  opacity      : 0.62,
  blending     : THREE.AdditiveBlending,
  depthWrite   : false,
  depthTest    : false
});

const wire = new THREE.LineSegments(geo, lineMat);

const group = new THREE.Group();
group.add(wire);
scene.add(group);

/* ---- 每帧更新 ---- */
const _c = new THREE.Color();

function updateWire(t){
  let vi = 0;   // 顶点写入游标
  let ci = 0;   // 颜色写入游标

  /* ---- 恒定 v 的线条（沿 u 方向，贯穿触手） ---- */
  for (let j = 0; j < NV_LINES; j++){
    const v = (j / (NV_LINES - 1)) * 2 - 1;

    /* 先取第一点 */
    let p0 = surfacePoint(0, v, t);
    let x0 = p0.x, y0 = p0.y, z0 = p0.z;
    surfaceColor(0, v, t, _c);
    let r0 = _c.r, g0 = _c.g, b0 = _c.b;

    for (let i = 1; i < NU_STEPS; i++){
      const u = (i / (NU_STEPS - 1)) * Math.PI * 2;

      const p1 = surfacePoint(u, v, t);
      const x1 = p1.x, y1 = p1.y, z1 = p1.z;
      surfaceColor(u, v, t, _c);
      const r1 = _c.r, g1 = _c.g, b1 = _c.b;

      /* 写两个顶点 */
      posArr[vi++] = x0; posArr[vi++] = y0; posArr[vi++] = z0;
      posArr[vi++] = x1; posArr[vi++] = y1; posArr[vi++] = z1;

      colArr[ci++] = r0; colArr[ci++] = g0; colArr[ci++] = b0;
      colArr[ci++] = r1; colArr[ci++] = g1; colArr[ci++] = b1;

      x0 = x1; y0 = y1; z0 = z1;
      r0 = r1; g0 = g1; b0 = b1;
    }
  }

  /* ---- 恒定 u 的线条（横跨带面） ---- */
  for (let i = 0; i < NU_LINES; i++){
    const u = (i / NU_LINES) * Math.PI * 2;

    let p0 = surfacePoint(u, -1, t);
    let x0 = p0.x, y0 = p0.y, z0 = p0.z;
    surfaceColor(u, -1, t, _c);
    let r0 = _c.r, g0 = _c.g, b0 = _c.b;

    for (let j = 1; j < NV_STEPS; j++){
      const v = (j / (NV_STEPS - 1)) * 2 - 1;

      const p1 = surfacePoint(u, v, t);
      const x1 = p1.x, y1 = p1.y, z1 = p1.z;
      surfaceColor(u, v, t, _c);
      const r1 = _c.r, g1 = _c.g, b1 = _c.b;

      posArr[vi++] = x0; posArr[vi++] = y0; posArr[vi++] = z0;
      posArr[vi++] = x1; posArr[vi++] = y1; posArr[vi++] = z1;

      colArr[ci++] = r0; colArr[ci++] = g0; colArr[ci++] = b0;
      colArr[ci++] = r1; colArr[ci++] = g1; colArr[ci++] = b1;

      x0 = x1; y0 = y1; z0 = z1;
      r0 = r1; g0 = g1; b0 = b1;
    }
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate    = true;
}

/* =========================================================
   4. 头部
   ========================================================= */
const headGroup = new THREE.Group();
headGroup.position.set(0, 0.10, 0);
group.add(headGroup);

/* 头部球壳：线框 */
const headGeo = new THREE.SphereGeometry(0.40, 22, 16);
const headMat = new THREE.MeshBasicMaterial({
  color: 0x00e5ff,
  wireframe: true,
  transparent: true,
  opacity: 0.14,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false
});
const headMesh = new THREE.Mesh(headGeo, headMat);
headGroup.add(headMesh);

/* 头部内层球 */
const headGeo2 = new THREE.SphereGeometry(0.30, 16, 12);
const headMat2 = new THREE.MeshBasicMaterial({
  color: 0xff00c8,
  wireframe: true,
  transparent: true,
  opacity: 0.10,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false
});
const headMesh2 = new THREE.Mesh(headGeo2, headMat2);
headGroup.add(headMesh2);

/* ---- 复眼 ---- */
const eyes = [];
for (const az of [Math.PI * 0.32, -Math.PI * 0.32]){
  const R = 0.40;
  const el = 0.30;

  const ex = R * Math.cos(el) * Math.cos(az);
  const ey = R * Math.sin(el);
  const ez = R * Math.cos(el) * Math.sin(az);

  const eyeGeo = new THREE.SphereGeometry(0.075, 12, 9);
  const eyeMat = new THREE.MeshBasicMaterial({
    color: 0xff00c8,
    wireframe: true,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false
  });
  const eye = new THREE.Mesh(eyeGeo, eyeMat);
  eye.position.set(ex, ey, ez);
  headGroup.add(eye);

  /* 内核 */
  const coreGeo = new THREE.SphereGeometry(0.030, 8, 6);
  const coreMat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  core.position.set(ex, ey, ez);
  headGroup.add(core);

  eyes.push({ mesh: eye, core: core, baseX: ex, baseY: ey, baseZ: ez });
}

/* =========================================================
   5. 发光粒子
   ========================================================= */
const P_N = 700;

const pPos = new Float32Array(P_N * 3);
const pCol = new Float32Array(P_N * 3);

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));

const pMat = new THREE.PointsMaterial({
  size: 0.028,
  vertexColors: true,
  transparent: true,
  opacity: 0.78,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false,
  sizeAttenuation: true
});

const pPoints = new THREE.Points(pGeo, pMat);
scene.add(pPoints);

/* 每个粒子绑定到曲面上的一个 (u, v) */
const pSeed = [];
for (let i = 0; i < P_N; i++){
  pSeed.push({
    u  : Math.random() * Math.PI * 2,
    v  : Math.random() * 2 - 1,
    sp : (Math.random() < 0.5 ? 1 : -1) * (0.08 + Math.random() * 0.22),
    off: Math.random() * Math.PI * 2
  });
}

function updateParticles(t){
  for (let i = 0; i < P_N; i++){
    const p = pSeed[i];

    let u = (p.u + t * p.sp) % (Math.PI * 2);
    if (u < 0) u += Math.PI * 2;

    /* 沿曲面法向外浮 */
    const sp = surfacePoint(u, p.v, t);

    const fl = 0.06 + 0.20 * Math.abs(Math.sin(t * 1.4 + p.off));
    const nx = sp.x * fl, ny = sp.y * fl, nz = sp.z * fl;

    const i3 = i * 3;
    pPos[i3]     = sp.x + nx;
    pPos[i3 + 1] = sp.y + ny;
    pPos[i3 + 2] = sp.z + nz;

    surfaceColor(u, p.v, t, _c);
    const tw = 0.35 + 0.65 * Math.sin(t * 3.6 + p.off);

    pCol[i3]     = _c.r * tw;
    pCol[i3 + 1] = _c.g * tw;
    pCol[i3 + 2] = _c.b * tw;
  }

  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate    = true;
}

/* =========================================================
   6. 主循环
   ========================================================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  /* ---- 曲面更新 ---- */
  updateWire(t);
  updateParticles(t);

  /* ---- 整体翻腾扭动 ---- */
  group.rotation.y = t * 0.13;
  group.rotation.x = Math.sin(t * 0.42) * 0.16;
  group.rotation.z = Math.sin(t * 0.31) * 0.10;
  group.position.y = Math.sin(t * 0.85) * 0.035;

  /* ---- 头部脉动 ---- */
  const hp = 1 + 0.045 * Math.sin(t * 1.9);
  headGroup.scale.set(hp, hp, hp);

  /* ---- 眼睛闪烁 ---- */
  for (let i = 0; i < eyes.length; i++){
    const E = eyes[i];
    const tw = 0.5 + 0.5 * Math.sin(t * 3.4 + i * 2.1);

    E.mesh.material.opacity = 0.42 + 0.48 * tw;
    E.core.material.opacity = 0.55 + 0.42 * tw;

    const s = 0.85 + 0.30 * tw;
    E.core.scale.set(s, s, s);

    /* 跟随头部尺度 */
    E.mesh.position.set(E.baseX * hp, E.baseY * hp, E.baseZ * hp);
    E.core.position.set(E.baseX * hp, E.baseY * hp, E.baseZ * hp);
  }

  renderer.render(scene, camera);
}

/* =========================================================
   7. 启动
   ========================================================= */
fitCamera();
animate();

})();
</script>
</body>
</html>
