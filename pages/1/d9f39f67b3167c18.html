<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弦理论 · 振动弦数字生命</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:#000;overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  #app{display:flex;height:100vh;width:100vw;}

  /* ---------------- 左侧 1/5 方程面板 ---------------- */
  #left{
    flex:0 0 20%;
    min-width:0;
    position:relative;
    padding:5vh 1.5vw;
    display:flex;flex-direction:column;justify-content:center;
    gap:3.4vh;
    background:
      radial-gradient(ellipse 120% 60% at 0% 50%, rgba(20,55,120,0.55), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 90% 40% at 100% 15%, rgba(80,30,140,0.32), rgba(0,0,0,0) 70%),
      #000;
    border-right:1px solid rgba(90,170,255,0.16);
    overflow:hidden;
  }
  #left::before{
    content:"";
    position:absolute;top:0;right:0;width:1px;height:100%;
    background:linear-gradient(180deg,transparent,rgba(90,180,255,0.55),rgba(160,90,255,0.45),transparent);
    opacity:.8;pointer-events:none;
  }
  #left::after{
    content:"";
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(120,190,255,0.030) 0 1px, transparent 1px 4px);
    mix-blend-mode:screen;opacity:.5;
  }

  .title{display:flex;flex-direction:column;gap:.5vh;}
  .title .cn{
    font-size:clamp(13px,1.15vw,20px);
    letter-spacing:.36em;
    color:#dbeaff;
    text-shadow:0 0 18px rgba(70,160,255,.85),0 0 40px rgba(60,120,255,.45);
  }
  .title .en{
    font-size:clamp(7px,.48vw,9.5px);
    letter-spacing:.44em;color:#3d6b96;
  }
  .rule{
    height:1px;width:100%;
    background:linear-gradient(90deg,rgba(90,180,255,.75),rgba(150,90,255,.35),transparent);
    margin-top:.4vh;
  }

  .block{display:flex;flex-direction:column;gap:.75vh;}

  .eq{
    font-family:"Cambria Math",Cambria,"Times New Roman",Georgia,serif;
    font-size:clamp(9px,.82vw,15px);
    line-height:1.55;
    color:#a9dcff;
    text-shadow:0 0 12px rgba(70,170,255,.6),0 0 28px rgba(50,120,255,.32);
    letter-spacing:.01em;
    overflow-wrap:anywhere;
  }
  .eq.p{color:#c9a8ff;text-shadow:0 0 12px rgba(155,95,255,.65),0 0 28px rgba(120,60,255,.35);}
  .eq.big{font-size:clamp(11px,1.05vw,18px);color:#cfeaff;
          text-shadow:0 0 16px rgba(90,190,255,.85),0 0 40px rgba(60,130,255,.5);}

  .lbl{
    font-size:clamp(7px,.5vw,10px);
    letter-spacing:.28em;
    color:#3f648a;
    text-transform:uppercase;
  }

  /* 求和符号 */
  .sum{
    position:relative;display:inline-block;
    vertical-align:-0.28em;
    font-size:1.55em;line-height:.75;
    padding:0 .10em;
    color:#bfe4ff;
  }
  .sum .sup,.sum .sub{
    position:absolute;left:50%;transform:translateX(-50%);
    font-size:.40em;font-style:normal;
  }
  .sum .sup{top:-0.62em;}
  .sum .sub{bottom:-0.72em;}

  #wave{
    width:100%;height:14vh;min-height:70px;display:block;
    opacity:.95;
  }

  /* ---------------- 右侧 4/5 三维画布 ---------------- */
  #right{flex:1 1 80%;position:relative;min-width:0;background:#000;}
  #right canvas{display:block;width:100%;height:100%;}
  #hint{
    position:absolute;left:18px;bottom:14px;
    font-size:10px;letter-spacing:.3em;color:#2f5578;
    pointer-events:none;user-select:none;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">

  <!-- ================= 左侧：波动方程 ================= -->
  <div id="left">
    <div class="title">
      <span class="cn">弦理论</span>
      <span class="en">STRING THEORY</span>
      <div class="rule"></div>
    </div>

    <div class="block">
      <div class="eq big">∂²u/∂t² = v² ∂²u/∂x²</div>
      <div class="lbl">一维波动方程</div>
    </div>

    <canvas id="wave"></canvas>

    <div class="block">
      <div class="eq">
        u(x,t) = <span class="sum">Σ<span class="sup">∞</span><span class="sub">n=1</span></span>
        A<sub>n</sub> sin(nπx/L) cos(ω<sub>n</sub>t+φ<sub>n</sub>)
      </div>
      <div class="lbl">驻波通解 · 两端固定</div>
    </div>

    <div class="block">
      <div class="eq p">ω<sub>n</sub> = nπv / L</div>
      <div class="lbl">本征频率 · 模谱</div>
    </div>

    <div class="block">
      <div class="eq p">v = √( T / μ )</div>
      <div class="lbl">波速 · 张力 / 线密度</div>
    </div>
  </div>

  <!-- ================= 右侧：三维数字生命 ================= -->
  <div id="right">
    <div id="hint">VIBRATING STRINGS · DIGITAL ORGANISM</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ============================================================
   一、波动方程可视化（左侧小画布）
   u(x,t) = Σ (1/n) sin(nπx/L) cos(nωt + φn)
   ============================================================ */
const wcv  = document.getElementById('wave');
const wctx = wcv.getContext('2d');
let WW = 0, WH = 0;

function sizeWave(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = wcv.getBoundingClientRect();
  WW = Math.max(1, r.width);
  WH = Math.max(1, r.height);
  wcv.width  = WW * dpr;
  wcv.height = WH * dpr;
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeWave();

function drawWave(t){
  if (!WW || !WH) return;
  wctx.clearRect(0, 0, WW, WH);

  const mid = WH * 0.5;
  const amp = WH * 0.36;
  const N   = 180;

  // 基线
  wctx.strokeStyle = 'rgba(70,130,200,0.16)';
  wctx.lineWidth = 1;
  wctx.beginPath(); wctx.moveTo(0, mid); wctx.lineTo(WW, mid); wctx.stroke();

  // 波函数：4 阶模态叠加
  const g = wctx.createLinearGradient(0, 0, WW, 0);
  g.addColorStop(0.00, '#3ec8ff');
  g.addColorStop(0.55, '#6fa8ff');
  g.addColorStop(1.00, '#b06bff');

  wctx.strokeStyle = g;
  wctx.lineWidth = 1.6;
  wctx.shadowBlur = 10;
  wctx.shadowColor = '#3f8cff';
  wctx.beginPath();
  for (let i = 0; i <= N; i++){
    const x = i / N;
    let y = 0;
    for (let n = 1; n <= 4; n++){
      y += (1 / n) * Math.sin(n * Math.PI * x) * Math.cos(n * 2.05 * t + n * 0.42);
    }
    const px = x * WW;
    const py = mid - y * amp * 0.62;
    i ? wctx.lineTo(px, py) : wctx.moveTo(px, py);
  }
  wctx.stroke();
  wctx.shadowBlur = 0;

  // 两端固定点
  wctx.fillStyle = 'rgba(160,215,255,0.9)';
  wctx.shadowBlur = 10; wctx.shadowColor = '#66b8ff';
  wctx.beginPath(); wctx.arc(0, mid, 2.4, 0, Math.PI * 2); wctx.fill();
  wctx.beginPath(); wctx.arc(WW, mid, 2.4, 0, Math.PI * 2); wctx.fill();
  wctx.shadowBlur = 0;
}

/* ============================================================
   二、Three.js 场景
   ============================================================ */
const rightEl = document.getElementById('right');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 1);
rightEl.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 4000);
camera.position.set(0, 0, 108);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), 1.18, 0.82, 0.08);
composer.addPass(bloomPass);

/* ---------------- 弦的参数 ---------------- */
const NL      = 9;            // 足 / 触手数量
const PER_LEG = 54;           // 每足琴弦数
const NSTR    = NL * PER_LEG; // 总弦数
const SEG     = 26;           // 每弦分段
const SEGP1   = SEG + 1;

const TOTAL_VERTS = NSTR * SEG * 2;

const positions = new Float32Array(TOTAL_VERTS * 3);
const colorsArr = new Float32Array(TOTAL_VERTS * 3);

const geo = new THREE.BufferGeometry();
const posAttr = new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage);
const colAttr = new THREE.BufferAttribute(colorsArr, 3).setUsage(THREE.DynamicDrawUsage);
geo.setAttribute('position', posAttr);
geo.setAttribute('color', colAttr);

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.92,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const lines = new THREE.LineSegments(geo, lineMat);
lines.frustumCulled = false;

const group = new THREE.Group();
group.add(lines);
scene.add(group);

/* ---------------- 驻波基函数 sin(nπu) ---------------- */
const SIN0 = new Float32Array(SEGP1);
const SIN1 = new Float32Array(SEGP1);
const SIN2 = new Float32Array(SEGP1);
for (let k = 0; k < SEGP1; k++){
  const u = k / SEG;
  SIN0[k] = Math.sin(1 * Math.PI * u);
  SIN1[k] = Math.sin(2 * Math.PI * u);
  SIN2[k] = Math.sin(3 * Math.PI * u);
}

/* ---------------- 每根弦的固有参数 ---------------- */
const str = [];
for (let L = 0; L < NL; L++){
  for (let j = 0; j < PER_LEG; j++){
    const q    = (j + 0.5) / PER_LEG;
    const rnd  = Math.random();
    const base = 1.45 + 1.55 * rnd;          // 基频 ω1

    str.push({
      leg  : L,
      phi  : j * 2.399963 + L * 0.9,          // 截面起始角（黄金角）
      rad  : 1.0 + 5.0 * Math.sqrt(q),        // 截面半径
      twist: (Math.random() * 2 - 1) * 6.0,   // 沿体长扭转（交织感）
      om   : [base, base * 2, base * 3],      // ωn = nω1
      ph   : [Math.random() * 6.283, Math.random() * 6.283, Math.random() * 6.283],
      Am   : [1.7 + 1.9 * rnd, 0.85, 0.42],   // 切向振幅
      Bm   : [1.25 + 1.5 * rnd, 0.70, 0.34],  // 副切向振幅
      rnd  : rnd
    });
  }
}

/* ---------------- 顶点颜色缓存（蓝 → 紫） ---------------- */
const colorCache = new Float32Array(NSTR * SEGP1 * 3);
for (let si = 0; si < NSTR; si++){
  const S  = str[si];
  const nr = S.rnd - 0.5;
  for (let k = 0; k < SEGP1; k++){
    const u = k / SEG;
    let m = 0.10 + 0.80 * u + 0.30 * nr + 0.12 * S.leg / NL;
    m = m < 0 ? 0 : (m > 1 ? 1 : m);
    // 蓝 rgb(0.10,0.74,1.00)  →  紫 rgb(0.62,0.22,1.00)
    const r = 0.10 * (1 - m) + 0.62 * m;
    const g = 0.74 * (1 - m) + 0.22 * m;
    const b = 1.00;
    const bright = 0.42 + 0.58 * u;          // 末端更亮
    const idx = (si * SEGP1 + k) * 3;
    colorCache[idx    ] = r * bright;
    colorCache[idx + 1] = g * bright;
    colorCache[idx + 2] = b * bright;
  }
}

/* ---------------- 足（触手）骨架 ---------------- */
const GA = Math.PI * (3 - Math.sqrt(5));   // 黄金角（球面均匀分布）
const legs = [];
for (let L = 0; L < NL; L++){
  const y  = 1 - (L + 0.5) * 2 / NL;
  const rr = Math.sqrt(Math.max(0, 1 - y * y));
  const th = GA * L;
  legs.push({
    bdir : new THREE.Vector3(Math.cos(th) * rr, y, Math.sin(th) * rr).normalize(),
    dir  : new THREE.Vector3(),
    e1   : new THREE.Vector3(1, 0, 0),
    e2   : new THREE.Vector3(0, 0, 1),
    pts  : new Float32Array(SEGP1 * 3)
  });
}

const _up = new THREE.Vector3();

function updateLegs(t){
  for (let L = 0; L < NL; L++){
    const lg = legs[L];
    const b  = lg.bdir;

    // 方向缓慢摆动
    lg.dir.set(
      b.x + 0.36 * Math.sin(t * 0.70 + L * 1.9),
      b.y + 0.30 * Math.sin(t * 0.93 + L * 2.7),
      b.z + 0.36 * Math.cos(t * 0.81 + L * 1.3)
    ).normalize();

    // 正交切向基
    _up.set(0, 1, 0);
    if (Math.abs(lg.dir.y) > 0.92) _up.set(1, 0, 0);
    lg.e1.crossVectors(lg.dir, _up).normalize();
    lg.e2.crossVectors(lg.dir, lg.e1).normalize();

    // 伸缩与弯曲
    const span  = 30 + 9 * Math.sin(t * 1.05 + L * 1.7) + 4 * Math.sin(t * 2.30 + L * 0.9);
    const curl1 = 8 * Math.sin(t * 0.85 + L * 2.1) + 4 * Math.sin(t * 1.6 + L);
    const curl2 = 8 * Math.cos(t * 1.02 + L * 1.4) + 4 * Math.cos(t * 1.8 + L * 0.6);
    const coreR = 6.5;

    const P = lg.pts;
    for (let k = 0; k < SEGP1; k++){
      const u   = k / SEG;
      const bow = Math.sin(u * Math.PI) * (0.35 + 0.65 * u);
      const d   = coreR + span * u;
      P[k * 3    ] = lg.dir.x * d + lg.e1.x * curl1 * bow + lg.e2.x * curl2 * bow;
      P[k * 3 + 1] = lg.dir.y * d + lg.e1.y * curl1 * bow + lg.e2.y * curl2 * bow;
      P[k * 3 + 2] = lg.dir.z * d + lg.e1.z * curl1 * bow + lg.e2.z * curl2 * bow;
    }
  }
}

/* ---------------- 逐弦求解波动方程并写顶点 ---------------- */
const tmpP = new Float32Array(SEGP1 * 3);

function updateStrings(t){
  const pos = posAttr.array;
  const col = colAttr.array;
  let v = 0;

  for (let si = 0; si < NSTR; si++){
    const S  = str[si];
    const lg = legs[S.leg];
    const P  = lg.pts;
    const e1 = lg.e1, e2 = lg.e2;

    // 时间项 cos(ωn t + φn) —— 每根弦每模态只算一次
    const c0 = Math.cos(S.om[0] * t + S.ph[0]);
    const c1 = Math.cos(S.om[1] * t + S.ph[1]);
    const c2 = Math.cos(S.om[2] * t + S.ph[2]);

    const A0 = S.Am[0], A1 = S.Am[1], A2 = S.Am[2];
    const B0 = S.Bm[0], B1 = S.Bm[1], B2 = S.Bm[2];

    for (let k = 0; k < SEGP1; k++){
      const u   = k / SEG;
      const ang = S.phi + S.twist * u;
      const rho = S.rad * (0.22 + 0.78 * Math.pow(Math.sin(u * Math.PI), 0.62));

      const ca = Math.cos(ang), sa = Math.sin(ang);
      const s0 = SIN0[k], s1 = SIN1[k], s2 = SIN2[k];

      // 波动方程驻波解：Σ An sin(nπu) cos(ωn t + φn)
      const d1 = A0 * c0 * s0 + A1 * c1 * s1 + A2 * c2 * s2;
      const d2 = B0 * c0 * s0 + B1 * c1 * s1 + B2 * c2 * s2;

      const ox = ca * rho + d1;
      const oy = sa * rho + d2;

      tmpP[k * 3    ] = P[k * 3    ] + e1.x * ox + e2.x * oy;
      tmpP[k * 3 + 1] = P[k * 3 + 1] + e1.y * ox + e2.y * oy;
      tmpP[k * 3 + 2] = P[k * 3 + 2] + e1.z * ox + e2.z * oy;
    }

    const cbase = si * SEGP1 * 3;
    for (let k = 0; k < SEG; k++){
      let o = v * 3;
      pos[o] = tmpP[k * 3]; pos[o + 1] = tmpP[k * 3 + 1]; pos[o + 2] = tmpP[k * 3 + 2];
      let ci = cbase + k * 3;
      col[o] = colorCache[ci]; col[o + 1] = colorCache[ci + 1]; col[o + 2] = colorCache[ci + 2];
      v++;

      o = v * 3;
      pos[o] = tmpP[(k + 1) * 3]; pos[o + 1] = tmpP[(k + 1) * 3 + 1]; pos[o + 2] = tmpP[(k + 1) * 3 + 2];
      ci = cbase + (k + 1) * 3;
      col[o] = colorCache[ci]; col[o + 1] = colorCache[ci + 1]; col[o + 2] = colorCache[ci + 2];
      v++;
    }
  }

  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;
}

/* ============================================================
   三、自适应
   ============================================================ */
function resizeAll(){
  const w = rightEl.clientWidth || 1;
  const h = rightEl.clientHeight || 1;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  renderer.domElement.style.width  = '100%';
  renderer.domElement.style.height = '100%';

  composer.setSize(w, h);
  bloomPass.setSize(w, h);

  sizeWave();
}
window.addEventListener('resize', resizeAll);
if (window.ResizeObserver) new ResizeObserver(resizeAll).observe(rightEl);
resizeAll();

/* ============================================================
   四、主循环
   ============================================================ */
let T = 0;
let last = performance.now();

function frame(now){
  requestAnimationFrame(frame);

  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  T += dt;

  // 骨架更新（先）→ 弦求解（后）
  updateLegs(T);
  updateStrings(T);

  // 整体缓慢呼吸旋转
  group.rotation.y = Math.sin(T * 0.11) * 0.26;
  group.rotation.x = Math.sin(T * 0.09) * 0.16;
  group.rotation.z = Math.sin(T * 0.07) * 0.10;

  // 相机微幅游移
  camera.position.x = Math.sin(T * 0.14) * 9;
  camera.position.y = Math.sin(T * 0.19) * 7;
  camera.position.z = 108 + Math.sin(T * 0.23) * 6;
  camera.lookAt(0, 0, 0);

  // 左侧方程面板波形
  drawWave(T);

  composer.render();
}

requestAnimationFrame(frame);
</script>
</body>
</html>
