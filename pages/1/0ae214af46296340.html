<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>泛音复平面 · 古琴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #07090d;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: #c8e2ee;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; cursor: crosshair; }

  #hud {
    position: fixed;
    top: 26px; left: 30px;
    pointer-events: none;
    font-size: 13px;
    line-height: 1.75;
    letter-spacing: 0.03em;
    text-shadow: 0 0 18px rgba(0,0,0,0.9);
  }
  #hud .title {
    font-size: 19px;
    font-weight: 300;
    letter-spacing: 0.32em;
    color: #d9f1fb;
    margin-bottom: 2px;
  }
  #hud .sub {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: rgba(140, 190, 215, 0.55);
    margin-bottom: 18px;
  }
  #hud .row {
    display: flex;
    gap: 10px;
    font-variant-numeric: tabular-nums;
  }
  #hud .k {
    color: rgba(130, 185, 210, 0.5);
    width: 22px;
  }
  #hud .v { color: #9fd8ee; }

  #hud .hands {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(100, 160, 190, 0.13);
  }
  #hud .hand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(150, 195, 215, 0.72);
    margin-bottom: 7px;
  }
  #hud .hand b {
    color: #ffd9a0;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  #hud .hand .dot {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
  }
  #hud .left .dot { background: #7fd8ff; box-shadow: 0 0 9px #7fd8ff; }
  #hud .right .dot { background: #ffb45c; box-shadow: 0 0 9px #ffb45c; }

  #btn-auto {
    position: fixed;
    right: 28px; bottom: 28px;
    padding: 11px 22px;
    background: rgba(16, 26, 36, 0.72);
    border: 1px solid rgba(110, 190, 225, 0.28);
    border-radius: 999px;
    color: #9fd4e8;
    font-size: 13px;
    letter-spacing: 0.14em;
    font-family: inherit;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #btn-auto:hover {
    background: rgba(32, 62, 80, 0.8);
    border-color: rgba(140, 220, 255, 0.6);
    color: #d6f4ff;
  }
  #btn-auto.on {
    background: rgba(52, 108, 138, 0.55);
    border-color: rgba(160, 240, 255, 0.75);
    color: #e2f9ff;
    box-shadow: 0 0 26px rgba(90, 200, 255, 0.22);
  }

  #hint {
    position: fixed;
    bottom: 32px; left: 30px;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    color: rgba(130, 180, 205, 0.42);
    pointer-events: none;
    transition: opacity 0.8s;
  }
  #hint.hide { opacity: 0; }

  @media (max-width: 640px) {
    #hud { top: 18px; left: 18px; font-size: 12px; }
    #hud .title { font-size: 15px; letter-spacing: 0.24em; }
    #btn-auto { right: 16px; bottom: 18px; padding: 9px 16px; font-size: 12px; }
    #hint { left: 18px; bottom: 22px; font-size: 10.5px; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="hud">
  <div class="title">泛音复平面</div>
  <div class="sub">COMPLEX HARMONICS · 古琴</div>
  <div class="row"><span class="k">z</span><span class="v" id="v-z">0.00 + 0.60i</span></div>
  <div class="row"><span class="k">r</span><span class="v" id="v-r">0.600</span></div>
  <div class="row"><span class="k">θ</span><span class="v" id="v-th">90.0°</span></div>
  <div class="hands">
    <div class="hand left"><span class="dot"></span>左手 · 轻触 <b id="v-left">—</b></div>
    <div class="hand right"><span class="dot"></span>右手 · 拨弦 <b id="v-right">—</b></div>
  </div>
</div>

<button id="btn-auto">自动演奏</button>
<div id="hint">拖动光点掠过徽位 · 聆听泛音</div>

<script>
(() => {
  'use strict';

  // ============================================================
  //  画布与坐标
  // ============================================================
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');

  let W, H, DPR, cx, cy, S;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W * 0.5;
    cy = H * 0.5;
    S = Math.max(Math.min(W, H) * 0.355, 110);
  }

  const wx = x => cx + x * S;       // 世界 x → 屏幕 x
  const wy = y => cy - y * S;       // 世界 y → 屏幕 y
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp  = (a, b, t) => a + (b - a) * t;
  const easeInOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

  // ============================================================
  //  徽位数据：弦上 13 个泛音节点
  //  t = 节点位置占弦长比例，n = 该节点对应的最低泛音次数
  // ============================================================
  const NODES = [
    { t: 1/8, n: 8 },
    { t: 1/6, n: 6 },
    { t: 1/5, n: 5 },
    { t: 1/4, n: 4 },
    { t: 1/3, n: 3 },
    { t: 2/5, n: 5 },
    { t: 1/2, n: 2 },
    { t: 3/5, n: 5 },
    { t: 2/3, n: 3 },
    { t: 3/4, n: 4 },
    { t: 4/5, n: 5 },
    { t: 5/6, n: 6 },
    { t: 7/8, n: 8 },
  ];
  NODES.forEach((nd, i) => { nd.x = 2 * nd.t - 1; nd.idx = i; });

  const TOL = 0.032;                 // 徽位判定容差（世界坐标）
  const BASE_FREQ = 130.81;          // 空弦 C3

  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  function noteName(freq) {
    const midi = Math.round(69 + 12 * Math.log2(freq / 440));
    return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
  }

  // ============================================================
  //  状态
  // ============================================================
  const state = {
    z: { x: 0, y: 0.62 },
    dragging: false,
  };

  let lastNode = null;
  let prevZx = state.z.x;

  const waves   = [];   // 弦上的驻波
  const ripples = [];   // 涟漪

  let nowT = 0;         // 当前时间（秒）

  // ============================================================
  //  音频引擎
  // ============================================================
  const audio = { ctx: null, master: null, bus: null, ready: false };

  function makeImpulse(actx, duration, decay) {
    const rate = actx.sampleRate;
    const len = Math.floor(rate * duration);
    const buf = actx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return buf;
  }

  function initAudio() {
    if (audio.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const actx = new AC();
    audio.ctx = actx;

    const master = actx.createGain();
    master.gain.value = 0.72;
    master.connect(actx.destination);
    audio.master = master;

    // 总输入总线
    const bus = actx.createGain();
    bus.gain.value = 1.0;
    audio.bus = bus;

    // 干声
    const dry = actx.createGain();
    dry.gain.value = 0.62;
    bus.connect(dry);
    dry.connect(master);

    // 混响
    const conv = actx.createConvolver();
    conv.buffer = makeImpulse(actx, 3.2, 2.4);
    bus.connect(conv);
    const wet = actx.createGain();
    wet.gain.value = 0.62;
    conv.connect(wet);
    wet.connect(master);

    audio.ready = true;
  }

  function ensureAudio() {
    initAudio();
    if (audio.ctx && audio.ctx.state === 'suspended') {
      audio.ctx.resume();
    }
  }

  /**
   * 播放泛音
   * @param {number} n  泛音次数
   * @param {number} vel 力度 0..1
   */
  function playHarmonic(n, vel) {
    ensureAudio();
    if (!audio.ready) return;

    const actx = audio.ctx;
    const t0 = actx.currentTime;
    const freq = BASE_FREQ * n;
    const vel2 = clamp(vel, 0.05, 1);

    // 钟铃质感的泛音列
    const partials = [
      { m: 1.000, g: 1.00, d: 4.2 },
      { m: 2.001, g: 0.32, d: 2.8 },
      { m: 3.002, g: 0.13, d: 1.9 },
      { m: 4.006, g: 0.062, d: 1.3 },
      { m: 5.011, g: 0.030, d: 0.9 },
      { m: 6.018, g: 0.014, d: 0.6 },
    ];

    // 轻微低通，柔化高频
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = Math.min(freq * 12 + 3000, 16000);
    lp.Q.value = 0.4;
    lp.connect(audio.bus);

    partials.forEach(p => {
      const osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq * p.m;
      osc.detune.value = (Math.random() - 0.5) * 7;

      const g = actx.createGain();
      const peak = 0.30 * vel2 * p.g / (1 + p.m * 0.55);
      const dec = p.d;

      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(peak, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.00005, t0 + dec);

      osc.connect(g);
      g.connect(lp);
      osc.start(t0);
      osc.stop(t0 + dec + 0.08);
    });

    // 拨弦瞬态噪声
    const nlen = Math.floor(actx.sampleRate * 0.07);
    const nbuf = actx.createBuffer(1, nlen, actx.sampleRate);
    const nd = nbuf.getChannelData(0);
    for (let i = 0; i < nlen; i++) {
      nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nlen, 3.5);
    }
    const noise = actx.createBufferSource();
    noise.buffer = nbuf;

    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = clamp(freq * 3, 400, 8000);
    bp.Q.value = 1.2;

    const ng = actx.createGain();
    ng.gain.value = 0.075 * vel2;

    noise.connect(bp);
    bp.connect(ng);
    ng.connect(audio.bus);
    noise.start(t0);
  }

  // ============================================================
  //  触发泛音
  // ============================================================
  function fireNode(node, intensity) {
    playHarmonic(node.n, intensity);
    waves.push({
      n: node.n,
      amp: 0.10 + 0.20 * intensity,
      t0: nowT,
      decay: 1.7,
      freq: 1.6 + node.n * 0.08,
      life: 3.4,
    });
    ripples.push({ x: node.x, t0: nowT });
    if (waves.length > 8) waves.shift();
    if (ripples.length > 10) ripples.shift();
  }

  // ============================================================
  //  自动演奏
  // ============================================================
  const auto = {
    active: false,
    idx: 0,
    phase: 'move',
    timer: 0,
    fromX: 0,
    fromY: 0.6,
  };

  function toggleAuto() {
    auto.active = !auto.active;
    const btn = document.getElementById('btn-auto');
    btn.classList.toggle('on', auto.active);

    if (auto.active) {
      ensureAudio();
      auto.idx = 0;
      auto.phase = 'move';
      auto.timer = 0;
      auto.fromX = state.z.x;
      auto.fromY = state.z.y;
      lastNode = null;
    }
  }

  function updateAuto(dt) {
    if (!auto.active) return;
    auto.timer += dt;

    if (auto.phase === 'move') {
      const target = NODES[auto.idx];
      const dur = 0.62;
      const p = Math.min(auto.timer / dur, 1);
      const e = easeInOutCubic(p);

      state.z.x = lerp(auto.fromX, target.x, e);
      state.z.y = lerp(auto.fromY, 0.62, e);

      if (p >= 1) {
        auto.phase = 'hold';
        auto.timer = 0;
        fireNode(target, 0.82);
      }
    } else {
      if (auto.timer > 0.62) {
        auto.idx = (auto.idx + 1) % NODES.length;
        auto.phase = 'move';
        auto.timer = 0;
        auto.fromX = state.z.x;
        auto.fromY = state.z.y;
      }
    }
  }

  // ============================================================
  //  徽位检测
  // ============================================================
  function checkTrigger() {
    if (auto.active) return;

    const x = state.z.x;
    const y = state.z.y;

    let hit = null;
    for (const nd of NODES) {
      const near = Math.abs(x - nd.x) < TOL;
      const crossed = (prevZx - nd.x) * (x - nd.x) < 0;
      if (near || crossed) { hit = nd; break; }
    }

    if (hit !== lastNode) {
      if (hit && Math.abs(y) > 0.075) {
        fireNode(hit, clamp(Math.abs(y) * 1.5, 0.15, 1));
      }
      lastNode = hit;
    }
    prevZx = x;
  }

  // ============================================================
  //  绘制：背景与网格
  // ============================================================
  function drawBackground() {
    ctx.fillStyle = '#07090d';
    ctx.fillRect(0, 0, W, H);

    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 2.4);
    g.addColorStop(0,   'rgba(34, 58, 78, 0.55)');
    g.addColorStop(0.55,'rgba(18, 30, 42, 0.30)');
    g.addColorStop(1,   'rgba(7, 9, 13, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawGrid() {
    ctx.save();
    ctx.lineWidth = 1;

    // 同心圆
    for (let i = 1; i <= 4; i++) {
      const r = i * 0.25;
      ctx.beginPath();
      ctx.arc(cx, cy, r * S, 0, Math.PI * 2);
      ctx.strokeStyle = i === 4
        ? 'rgba(120, 190, 220, 0.14)'
        : 'rgba(110, 175, 205, 0.065)';
      ctx.stroke();
    }

    // 辐射线
    ctx.strokeStyle = 'rgba(110, 175, 205, 0.055)';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * S, cy - Math.sin(a) * S);
      ctx.stroke();
    }

    // 坐标轴
    ctx.strokeStyle = 'rgba(110, 175, 205, 0.16)';
    ctx.beginPath();
    ctx.moveTo(wx(-1.32), wy(0));
    ctx.lineTo(wx(1.32), wy(0));
    ctx.moveTo(wx(0), wy(-1.32));
    ctx.lineTo(wx(0), wy(1.32));
    ctx.stroke();

    ctx.restore();
  }

  // ============================================================
  //  绘制：琴弦（含驻波）
  // ============================================================
  function drawString(t) {
    const N = 240;

    // 静息弦
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(wx(-1), wy(0));
    ctx.lineTo(wx(1), wy(0));
    ctx.strokeStyle = 'rgba(80, 125, 150, 0.22)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // 岳山 / 龙龈
    ctx.save();
    ctx.strokeStyle = 'rgba(120, 190, 220, 0.35)';
    ctx.lineWidth = 1.5;
    [-1, 1].forEach(x => {
      ctx.beginPath();
      ctx.moveTo(wx(x), wy(-0.05));
      ctx.lineTo(wx(x), wy(0.05));
      ctx.stroke();
    });
    ctx.restore();

    // 动态弦
    const grad = ctx.createLinearGradient(wx(-1), 0, wx(1), 0);
    grad.addColorStop(0,   'rgba(110, 190, 225, 0.35)');
    grad.addColorStop(0.5, 'rgba(205, 242, 255, 0.95)');
    grad.addColorStop(1,   'rgba(110, 190, 225, 0.35)');

    ctx.save();
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const x = -1 + 2 * u;

      let disp = 0;
      for (const w of waves) {
        const age = t - w.t0;
        if (age < 0 || age > w.life) continue;
        const env = Math.exp(-age * w.decay);
        const osc = Math.sin(2 * Math.PI * w.freq * age);
        disp += w.amp * env * Math.sin(w.n * Math.PI * u) * osc;
      }
      disp = clamp(disp, -0.26, 0.26);

      const px = wx(x);
      const py = wy(0) - disp * S;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.7;
    ctx.shadowColor = 'rgba(120, 215, 255, 0.65)';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.restore();
  }

  // ============================================================
  //  绘制：涟漪
  // ============================================================
  function drawRipples(t) {
    ctx.save();
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      const age = t - rp.t0;
      if (age > 1.35) { ripples.splice(i, 1); continue; }
      const p = age / 1.35;
      const rad = p * S * 0.95;
      ctx.beginPath();
      ctx.arc(wx(rp.x), wy(0), rad, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(150, 232, 255, ${(1 - p) * 0.55})`;
      ctx.lineWidth = 2.2 * (1 - p);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ============================================================
  //  绘制：徽位
  // ============================================================
  function drawNodes(t) {
    ctx.save();
    for (const nd of NODES) {
      const px = wx(nd.x);
      const py = wy(0);
      const active = Math.abs(state.z.x - nd.x) < TOL;

      if (active) {
        const pulse = 0.7 + 0.3 * Math.sin(t * 7);
        const glow = ctx.createRadialGradient(px, py, 0, px, py, 26);
        glow.addColorStop(0, `rgba(140, 235, 255, ${0.55 * pulse})`);
        glow.addColorStop(1, 'rgba(140, 235, 255, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(px, py, 26, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(px, py, active ? 4.2 : 2.6, 0, Math.PI * 2);
      ctx.fillStyle = active ? '#a9ecff' : 'rgba(140, 195, 220, 0.42)';
      if (active) {
        ctx.shadowColor = 'rgba(140, 235, 255, 0.9)';
        ctx.shadowBlur = 14;
      }
      ctx.fill();
      ctx.shadowBlur = 0;

      // 泛音次数标注
      ctx.font = '10px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = active
        ? 'rgba(175, 235, 255, 0.95)'
        : 'rgba(120, 170, 195, 0.35)';
      ctx.fillText(String(nd.n), px, py + 12);
    }
    ctx.restore();
  }

  // ============================================================
  //  绘制：复点与投影
  // ============================================================
  function drawComplexPoint(t) {
    const px = wx(state.z.x);
    const py = wy(state.z.y);

    // 半径向量
    ctx.save();
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(255, 190, 110, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(px, py);
    ctx.stroke();
    ctx.restore();

    // 到实轴的投影（左手位置）
    ctx.save();
    ctx.setLineDash([3, 5]);
    ctx.strokeStyle = 'rgba(120, 215, 255, 0.42)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px, wy(0));
    ctx.stroke();
    ctx.restore();

    // 到虚轴的投影（右手分量）
    ctx.save();
    ctx.setLineDash([3, 5]);
    ctx.strokeStyle = 'rgba(255, 175, 95, 0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(cx, py);
    ctx.stroke();
    ctx.restore();

    // 角度弧
    const ang = Math.atan2(state.z.y, state.z.x);
    if (Math.abs(ang) > 0.01) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(S * 0.28, 62), 0, -ang, ang > 0);
      ctx.strokeStyle = 'rgba(255, 200, 130, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }

    // 左手接触点（在弦上）
    ctx.save();
    ctx.beginPath();
    ctx.arc(px, wy(0), 3.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(130, 220, 255, 0.9)';
    ctx.shadowColor = 'rgba(120, 220, 255, 1)';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.restore();

    // 光点
    ctx.save();
    ctx.shadowColor = 'rgba(255, 175, 80, 1)';
    ctx.shadowBlur = 22;
    const grd = ctx.createRadialGradient(px, py, 0, px, py, 7);
    grd.addColorStop(0, '#fff8e6');
    grd.addColorStop(0.55, '#ffc46a');
    grd.addColorStop(1, '#ff8a2a');
    ctx.beginPath();
    ctx.arc(px, py, 7, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.restore();

    // 外环
    ctx.save();
    const ringR = 13 + Math.sin(t * 3) * 1.4;
    ctx.beginPath();
    ctx.arc(px, py, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 185, 90, 0.42)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  // ============================================================
  //  HUD 更新
  // ============================================================
  const elZ    = document.getElementById('v-z');
  const elR    = document.getElementById('v-r');
  const elTh   = document.getElementById('v-th');
  const elLeft = document.getElementById('v-left');
  const elRight= document.getElementById('v-right');

  let hudTimer = 0;

  function updateHUD(dt) {
    hudTimer += dt;
    if (hudTimer < 0.05) return;
    hudTimer = 0;

    const z = state.z;
    const r = Math.hypot(z.x, z.y);
    const th = Math.atan2(z.y, z.x) * 180 / Math.PI;

    elZ.textContent = `${z.x >= 0 ? '' : '-'}${Math.abs(z.x).toFixed(3)} ${z.y >= 0 ? '+' : '-'} ${Math.abs(z.y).toFixed(3)}i`;
    elR.textContent = r.toFixed(3);
    elTh.textContent = `${th.toFixed(1)}°`;

    // 左手：最近徽位
    let best = null, bestD = Infinity;
    for (const nd of NODES) {
      const d = Math.abs(z.x - nd.x);
      if (d < bestD) { bestD = d; best = nd; }
    }
    if (best && bestD < TOL) {
      const frac = best.t === 0.5 ? '1/2'
        : best.t === 1/3 ? '1/3'
        : best.t === 2/3 ? '2/3'
        : best.t === 1/4 ? '1/4'
        : best.t === 3/4 ? '3/4'
        : best.t === 1/5 ? '1/5'
        : best.t === 2/5 ? '2/5'
        : best.t === 3/5 ? '3/5'
        : best.t === 4/5 ? '4/5'
        : best.t === 1/6 ? '1/6'
        : best.t === 5/6 ? '5/6'
        : best.t === 1/8 ? '1/8'
        : '7/8';
      const f = BASE_FREQ * best.n;
      elLeft.textContent = `第${best.idx + 1}徽 ${frac} · 泛音${best.n} · ${noteName(f)}`;
    } else {
      elLeft.textContent = `t = ${((z.x + 1) / 2).toFixed(3)}`;
    }

    const v = Math.abs(z.y);
    elRight.textContent = v < 0.075 ? '极轻' :
      v < 0.3 ? '轻' :
      v < 0.6 ? '中' :
      v < 0.9 ? '强' : '极强';
  }

  // ============================================================
  //  主循环
  // ============================================================
  let lastT = performance.now() / 1000;

  function frame() {
    const t = performance.now() / 1000;
    const dt = Math.min(t - lastT, 0.05);
    lastT = t;
    nowT = t;

    // --- 更新 ---
    updateAuto(dt);
    checkTrigger();

    // 清理驻波
    for (let i = waves.length - 1; i >= 0; i--) {
      if (t - waves[i].t0 > waves[i].life) waves.splice(i, 1);
    }

    updateHUD(dt);

    // --- 绘制 ---
    drawBackground();
    drawGrid();
    drawRipples(t);
    drawString(t);
    drawNodes(t);
    drawComplexPoint(t);

    requestAnimationFrame(frame);
  }

  // ============================================================
  //  交互
  // ============================================================
  function pointerToWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left - cx) / S,
      y: (cy - (clientY - rect.top)) / S,
    };
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    ensureAudio();

    state.dragging = true;
    canvas.setPointerCapture(e.pointerId);

    const p = pointerToWorld(e.clientX, e.clientY);
    state.z.x = clamp(p.x, -1, 1);
    state.z.y = clamp(p.y, -1.18, 1.18);

    document.getElementById('hint').classList.add('hide');
    if (auto.active) toggleAuto();
  });

  canvas.addEventListener('pointermove', e => {
    if (!state.dragging) return;
    e.preventDefault();
    const p = pointerToWorld(e.clientX, e.clientY);
    state.z.x = clamp(p.x, -1, 1);
    state.z.y = clamp(p.y, -1.18, 1.18);
  });

  function endDrag(e) {
    state.dragging = false;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', e => {
    if (e.pointerType === 'mouse' && !state.dragging) return;
    state.dragging = false;
  });

  document.getElementById('btn-auto').addEventListener('click', toggleAuto);

  window.addEventListener('keydown', e => {
    if (e.key === ' ') {
      e.preventDefault();
      toggleAuto();
    }
  });

  window.addEventListener('resize', () => {
    resize();
  });

  // ============================================================
  //  启动
  // ============================================================
  resize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
