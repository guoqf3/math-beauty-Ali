<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面调和节线 · 调和函数之美</title>
    <style>
        :root {
            --bg: #050513;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.0vw, 1.4rem);
            font-weight: 400;
            letter-spacing: 0.10em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(190, 165, 140, 0.5), 0 0 6px rgba(170, 148, 125, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.60rem, 1.10vw, 0.76rem);
            font-weight: 300;
            letter-spacing: 0.06em;
            color: rgba(200, 192, 180, 0.7);
            margin-top: 0.2em;
            text-shadow: 0 0 13px rgba(155, 140, 120, 0.3);
        }
        #formula-overlay {
            bottom: clamp(14px, 3.5vh, 40px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.42rem, 0.75vw, 0.60rem);
            font-style: italic;
            letter-spacing: 0.03em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(155, 140, 125, 0.42), 0 0 5px rgba(165, 148, 130, 0.28);
            line-height: 1.6;
            background: rgba(10, 9, 16, 0.46);
            padding: 0.30em 1.0em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(145, 125, 105, 0.20);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.16em 0.40em;
                letter-spacing: 0.02em;
                font-size: 0.32rem;
            }
            #title-overlay .title {
                letter-spacing: 0.06em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">球面调和节线 · 调和函数之美</div>
        <div class="subtitle">Nodal Lines of Spherical Harmonics</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            Re[Y<sub>l</sub><sup>m</sup>(θ,φ)] = 0
            &emsp;⇔&emsp; P<sub>l</sub><sup>m</sup>(cosθ) · cos(mφ) = 0
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        const SPHERE_R = 1.55;
        const CURVE_POINTS = 720; // 每条曲线采样点数
        const TOTAL_VERTICES = CURVE_POINTS + 1;

        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');
        const THREE_COLORS = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        // ---------- 连带勒让德函数 ----------
        function assocLegendre(l, m, x) {
            if (m < 0 || m > l) return 0;
            let pmm = 1.0;
            if (m > 0) {
                let fact = 1.0;
                for (let i = 1; i <= m; i++) {
                    fact *= (2 * i - 1);
                }
                pmm = fact * Math.pow(1 - x * x, m / 2);
                if (m % 2 === 1) pmm = -pmm; // Condon-Shortley phase
            }
            if (l === m) return pmm;
            let pm1 = pmm;
            let pm2 = 0;
            for (let ll = m + 1; ll <= l; ll++) {
                const a = (2 * ll - 1) * x * pm1;
                const b = (ll + m - 1) * pm2;
                pm2 = pm1;
                pm1 = (a - b) / (ll - m);
            }
            return pm1;
        }

        // 寻找 P_l^m(x) 在 [-1,1] 内的零点（二分法）
        function findRoots(l, m, steps = 200) {
            const roots = [];
            const dx = 2.0 / steps;
            let x0 = -1.0;
            let f0 = assocLegendre(l, m, x0);
            for (let i = 1; i <= steps; i++) {
                const x1 = -1.0 + i * dx;
                const f1 = assocLegendre(l, m, x1);
                if (f0 * f1 < 0) {
                    // 二分法
                    let a = x0, b = x1, fa = f0, fb = f1;
                    for (let k = 0; k < 25; k++) {
                        const mid = (a + b) / 2;
                        const fmid = assocLegendre(l, m, mid);
                        if (fa * fmid <= 0) { b = mid;
                            fb = fmid; } else { a = mid;
                            fa = fmid; }
                    }
                    roots.push((a + b) / 2);
                }
                x0 = x1;
                f0 = f1;
            }
            return roots;
        }

        // 生成纬圆（固定θ）
        function createLatitudeCircle(theta, color) {
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            const sinT = Math.sin(theta);
            const cosT = Math.cos(theta);
            for (let i = 0; i <= CURVE_POINTS; i++) {
                const phi = (i / CURVE_POINTS) * Math.PI * 2;
                positions[i * 3] = SPHERE_R * sinT * Math.cos(phi);
                positions[i * 3 + 1] = SPHERE_R * cosT;
                positions[i * 3 + 2] = SPHERE_R * sinT * Math.sin(phi);
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setDrawRange(0, 0);
            const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.84, depthWrite: false });
            return { line: new THREE.Line(geom, mat), vertices: TOTAL_VERTICES };
        }

        // 生成经线大圆（固定φ平面）
        function createMeridianCircle(phi0, color) {
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            const cosP = Math.cos(phi0);
            const sinP = Math.sin(phi0);
            for (let i = 0; i <= CURVE_POINTS; i++) {
                const alpha = (i / CURVE_POINTS) * Math.PI * 2;
                const x = SPHERE_R * Math.cos(alpha) * cosP;
                const y = SPHERE_R * Math.sin(alpha);
                const z = SPHERE_R * Math.cos(alpha) * sinP;
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setDrawRange(0, 0);
            const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.84, depthWrite: false });
            return { line: new THREE.Line(geom, mat), vertices: TOTAL_VERTICES };
        }

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050513, 0.00007);

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.35, 17);
        camera.position.set(0.55, 0.7, 3.9);
        camera.lookAt(0, 0.05, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.16;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 200;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phiA = Math.acos(2 * Math.random() - 1);
            const r = 3.5 + Math.random() * 4.8;
            starPosArr[i * 3] = Math.sin(phiA) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phiA) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phiA) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xb6afc6, size: 0.009, transparent: true, opacity: 0.26, depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        starsGroup.add(new THREE.Points(starGeom, starMat));

        // ==================== 漂浮光点 ====================
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 80;
        const glowArr = new Float32Array(glowCount * 3);
        const phiGold = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < glowCount; i++) {
            const y = 1 - (i / (glowCount - 1)) * 2;
            const rAtY = Math.sqrt(1 - y * y);
            const theta = phiGold * i;
            glowArr[i * 3] = Math.cos(theta) * rAtY * SPHERE_R;
            glowArr[i * 3 + 1] = y * SPHERE_R;
            glowArr[i * 3 + 2] = Math.sin(theta) * rAtY * SPHERE_R;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e4cc, size: 0.019, transparent: true, opacity: 0.45, depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        glowGroup.add(new THREE.Points(glowGeom, glowMat));

        // ==================== 参考球体线框 ====================
        const sphereWireGroup = new THREE.Group();
        mainGroup.add(sphereWireGroup);
        const sphereWireMats = [];

        function createLatLine(phiVal) {
            const pts = [];
            const r = Math.sin(phiVal) * SPHERE_R;
            const y = Math.cos(phiVal) * SPHERE_R;
            for (let i = 0; i <= 240; i++) {
                const th = (i / 240) * Math.PI * 2;
                pts.push(new THREE.Vector3(r * Math.cos(th), y, r * Math.sin(th)));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({ color: 0x3a3650, transparent: true, opacity: 0.11, depthWrite: false });
            sphereWireMats.push(m);
            return new THREE.Line(g, m);
        }
        function createLongLine(theta) {
            const pts = [];
            for (let i = 0; i <= 200; i++) {
                const phiVal = (i / 200) * Math.PI;
                pts.push(new THREE.Vector3(
                    Math.sin(phiVal) * Math.cos(theta) * SPHERE_R,
                    Math.cos(phiVal) * SPHERE_R,
                    Math.sin(phiVal) * Math.sin(theta) * SPHERE_R
                ));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({ color: 0x3a3650, transparent: true, opacity: 0.11, depthWrite: false });
            sphereWireMats.push(m);
            return new THREE.Line(g, m);
        }
        for (let i = 1; i <= 9; i++) sphereWireGroup.add(createLatLine((i / 10) * Math.PI));
        for (let i = 0; i < 18; i++) sphereWireGroup.add(createLongLine((i / 18) * Math.PI * 2));
        {
            const eqPts = [];
            for (let i = 0; i <= 280; i++) {
                const th = (i / 280) * Math.PI * 2;
                eqPts.push(new THREE.Vector3(Math.cos(th) * SPHERE_R, 0, Math.sin(th) * SPHERE_R));
            }
            const eqG = new THREE.BufferGeometry().setFromPoints(eqPts);
            const eqM = new THREE.LineBasicMaterial({ color: 0x58527a, transparent: true, opacity: 0.16, depthWrite: false });
            sphereWireMats.push(eqM);
            sphereWireGroup.add(new THREE.Line(eqG, eqM));
        }

        // ==================== 球面调和节线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        function addCurvesForMode(l, m, color) {
            // 纬线 (P_l^m(cosθ)=0 的根)
            const roots = findRoots(l, m);
            roots.forEach(r => {
                if (Math.abs(r) > 1.0) return;
                const theta = Math.acos(r);
                const { line, vertices } = createLatitudeCircle(theta, color);
                curvesGroup.add(line);
                allCurveData.push({ geometry: line.geometry, totalVertices: vertices });
            });

            // 经线 (cos(m phi)=0)
            if (m > 0) {
                const delta = Math.PI / m;
                const start = delta / 2;
                for (let k = 0; k < 2 * m; k++) {
                    const phi0 = start + k * delta;
                    const { line, vertices } = createMeridianCircle(phi0, color);
                    curvesGroup.add(line);
                    allCurveData.push({ geometry: line.geometry, totalVertices: vertices });
                }
            }
        }

        // 金色组：l=3, m=1
        addCurvesForMode(3, 1, COLOR_WARM_GOLD);
        // 玫瑰粉组：l=4, m=2
        addCurvesForMode(4, 2, COLOR_ROSE);
        // 青蓝组：l=5, m=2
        addCurvesForMode(5, 2, COLOR_CYAN);

        const curveCount = allCurveData.length;

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        clock.getDelta();

        function getCycleTime() {
            return (performance.now() / 1000 - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            mainGroup.rotation.y += 0.24 * dt;
            mainGroup.rotation.x += 0.058 * dt;
            mainGroup.rotation.z += 0.014 * Math.sin(cycleTime * 0.55) * dt;

            const sway = 0.09 * Math.sin(cycleTime * (Math.PI * 2 / 34));
            camera.position.y = 0.7 + sway;
            camera.lookAt(0, 0.05, 0);

            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.26 * bgOp;
            glowMat.opacity = 0.45 * bgOp;
            for (const mat of sphereWireMats) {
                mat.opacity = (mat.opacity ?? 0.11) * bgOp;
            }

            glowGroup.position.y = Math.sin(cycleTime * 1.05) * 0.04;
            starsGroup.rotation.y += dt * 0.015;
            starsGroup.rotation.x += dt * 0.010;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🌐 球面调和节线动画已启动');
        console.log(`   - ${curveCount} 条完美闭合曲线，3种颜色`);
        console.log('   - 节线方程：P_l^m(cosθ)·cos(mφ)=0');
        console.log('   - 金色 l=3,m=1 | 玫瑰粉 l=4,m=2 | 青蓝 l=5,m=2');
        console.log(`   - 周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
