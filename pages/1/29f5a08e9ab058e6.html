<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分形蕨类森林 · Fractal Fern Forest</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #12303a 0%, #0a1c24 55%, #061218 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #cfe9e2;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding: 22px;
    display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap;
  }
  .stage {
    flex: 1 1 580px; min-width: 300px;
    position: relative;
    aspect-ratio: 760 / 520;
    border-radius: 26px;
    overflow: hidden;
    background: #0a1c24;
    box-shadow: 0 24px 52px -24px rgba(0, 0, 0, .9),
                0 0 0 1px rgba(120, 220, 200, .18) inset;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  .sound-toggle {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    background: rgba(16, 44, 50, .82);
    color: #b8f0e0;
    box-shadow: 0 5px 16px -5px rgba(0, 0, 0, .8),
                0 0 0 1px rgba(120, 230, 200, .35) inset;
    transition: transform .12s;
    z-index: 3;
  }
  .sound-toggle:active { transform: scale(.92); }

  .panel {
    flex: 0 1 348px; min-width: 292px;
    background: rgba(12, 34, 40, .78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 26px;
    padding: 22px 22px 18px;
    box-shadow: 0 24px 52px -26px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(120, 230, 200, .16) inset;
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 {
    font-size: 21px; margin: 0; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
    color: #d9f7ee;
  }
  h1 .emoji { font-size: 24px; }

  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 16.5px; text-align: center;
    padding: 11px 10px; border-radius: 15px;
    background: linear-gradient(135deg, rgba(24, 68, 72, .9), rgba(16, 48, 56, .9));
    color: #8fe8d0;
    letter-spacing: .4px;
    box-shadow: 0 0 0 1px rgba(110, 220, 200, .22) inset;
    line-height: 1.65;
  }
  .formula b { color: #ffd88a; font-weight: 700; }
  .formula .sub { font-size: 12px; color: #6fa89c; }

  .discover {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; border-radius: 15px;
    background: linear-gradient(135deg, rgba(30, 78, 74, .85), rgba(18, 54, 58, .85));
    box-shadow: 0 0 0 1px rgba(120, 230, 200, .22) inset;
  }
  .discover .lbl { font-size: 13px; color: #8fc9bc; letter-spacing: .3px; }
  .discover .cnt {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 16px; font-weight: 700; color: #7fffd4;
    text-shadow: 0 0 12px rgba(120, 255, 210, .7);
  }
  .discover .cnt.done { color: #ffd88a; text-shadow: 0 0 14px rgba(255, 210, 130, .85); }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    color: #93c8bd;
  }
  .field .val {
    color: #7fffd4; font-variant-numeric: tabular-nums; font-size: 13.5px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #2a6f66, #4fd6b0);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: #0d2b30; border: 3.5px solid #4fd6b0;
    box-shadow: 0 0 12px rgba(80, 230, 190, .6);
    transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #0d2b30; border: 3.5px solid #4fd6b0;
    box-shadow: 0 0 12px rgba(80, 230, 190, .6);
  }
  input[type=range]::-moz-range-track {
    height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #2a6f66, #4fd6b0);
  }

  .btns { display: flex; gap: 10px; }
  button.main {
    flex: 1; padding: 11px 8px; border: none; border-radius: 14px;
    font-size: 14.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: .4px;
    background: linear-gradient(180deg, #46c9a4, #229578);
    color: #04201b;
    box-shadow: 0 7px 18px -7px rgba(50, 210, 170, .9);
    transition: transform .12s, filter .12s;
  }
  button.main:hover { filter: brightness(1.08); }
  button.main:active { transform: translateY(2px) scale(.98); }
  button.ghost {
    flex: 0 0 auto; padding: 11px 18px;
    background: rgba(20, 52, 58, .95);
    color: #7fffd4;
    box-shadow: 0 5px 14px -7px rgba(0, 0, 0, .9),
                0 0 0 1.5px rgba(110, 220, 200, .32) inset;
  }

  .hint {
    margin: 0; font-size: 12.5px; line-height: 1.7; color: #6fa89c;
    text-align: center;
  }
  .hint kbd {
    background: rgba(30, 78, 74, .8); border-radius: 5px; padding: 1px 6px;
    font-family: inherit; font-size: 11.5px; color: #7fffd4;
    box-shadow: 0 0 0 1px rgba(110, 220, 200, .3) inset;
  }
  @media (max-width: 740px) {
    .wrap { padding: 14px; gap: 16px; }
    .panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
  </div>

  <div class="panel">
    <h1><span class="emoji">🌿</span> 分形蕨类森林</h1>

    <div class="formula">
      Barnsley Fern <span class="sub">·</span> IFS<br>
      <b>x′ = 0.85x + 0.04y</b><br>
      <b>y′ = −0.04x + 0.85y + 1.6</b>
    </div>

    <div class="discover">
      <span class="lbl">🔍 已发现分形动物</span>
      <span class="cnt" id="foundCount">0 / 3</span>
    </div>

    <div class="field">
      <div class="row"><span>蕨类数量</span><span class="val" id="fernVal">10</span></div>
      <input type="range" id="fernRange" min="5" max="18" step="1" value="10">
    </div>

    <div class="field">
      <div class="row"><span>风力强度</span><span class="val" id="windVal">50%</span></div>
      <input type="range" id="windRange" min="0" max="100" step="1" value="50">
    </div>

    <div class="field">
      <div class="row"><span>分形雪花</span><span class="val" id="snowVal">16</span></div>
      <input type="range" id="snowRange" min="0" max="30" step="1" value="16">
    </div>

    <div class="btns">
      <button class="main" id="btnGrow">重新生长</button>
      <button class="main ghost" id="btnReset">重置</button>
    </div>

    <p class="hint">
      移动鼠标让剪影微微发光 · <kbd>点击剪影</kbd> 将其唤醒<br>
      森林深处藏着 <b>3</b> 只分形小动物
    </p>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     基础
  ============================================================ */
  const SCENE_W = 760, SCENE_H = 520;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resizeCanvas() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.max(1, Math.round(rect.width  * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
  }
  window.addEventListener('resize', resizeCanvas);

  function toLogic(clientX, clientY) {
    const rect = cv.getBoundingClientRect();
    return {
      x: (clientX - rect.left) / rect.width  * SCENE_W,
      y: (clientY - rect.top ) / rect.height * SCENE_H
    };
  }

  /* ============================================================
     音频
  ============================================================ */
  let actx = null, muted = false;

  function ensureAudio() {
    if (muted) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, dur, type, vol, delay, freqEnd) {
    const ac = ensureAudio(); if (!ac) return;
    type = type || 'sine'; vol = vol || 0.06; delay = delay || 0;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.016);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }

  /** 发现动物：风铃般的分解和弦 */
  function playDiscoverSound(n) {
    const base = 523.25 * Math.pow(1.10, n);
    const ratios = [1, 1.5, 2, 2.5, 3];
    ratios.forEach(function (r, i) {
      tone(base * r, 0.7 - i * 0.07, i % 2 ? 'triangle' : 'sine',
           0.055 - i * 0.007, i * 0.075);
    });
  }

  /** 森林窸窣声（噪声） */
  function playRustle() {
    const ac = ensureAudio(); if (!ac) return;
    const dur = 0.32, sr = ac.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = ac.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.0);
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.6;
    const t0 = ac.currentTime;
    bp.frequency.setValueAtTime(1800, t0);
    bp.frequency.exponentialRampToValueAtTime(600, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.075, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(t0);
  }

  /** 悬停提示音 */
  let lastHover = 0;
  function playHoverBlip() {
    const now = performance.now();
    if (now - lastHover < 220) return;
    lastHover = now;
    tone(1320, 0.09, 'sine', 0.028);
  }

  let lastBlip = 0;
  function sndBlip(freq) {
    const now = performance.now();
    if (now - lastBlip < 70) return;
    lastBlip = now;
    tone(freq, 0.055, 'sine', 0.038);
  }

  /* ============================================================
     分形几何工具
     ------------------------------------------------------------
     1. Barnsley 蕨类 IFS
     2. 递归分形树
     3. Koch 雪花
     4. 多边形分形凸起（用于动物剪影）
  ============================================================ */

  /* ---------- 1. Barnsley Fern IFS ---------- */
  function generateFern(nPoints) {
    const pts = [];
    let x = 0, y = 0;
    for (let i = 0; i < nPoints; i++) {
      const r = Math.random();
      let nx, ny;
      if (r < 0.01) {
        nx = 0;            ny = 0.16 * y;
      } else if (r < 0.86) {
        nx = 0.85 * x + 0.04 * y;
        ny = -0.04 * x + 0.85 * y + 1.6;
      } else if (r < 0.93) {
        nx = 0.20 * x - 0.26 * y;
        ny = 0.23 * x + 0.22 * y + 1.6;
      } else {
        nx = -0.15 * x + 0.28 * y;
        ny = 0.26 * x + 0.24 * y + 0.44;
      }
      x = nx; y = ny;
      if (i > 24) pts.push([x, y]);
    }
    return pts;
  }

  function makeFernSprite(w, h, nPoints, hueShift) {
    const dpr = 2;
    const c = document.createElement('canvas');
    c.width  = Math.max(4, Math.round(w * dpr));
    c.height = Math.max(4, Math.round(h * dpr));
    const g = c.getContext('2d');
    g.scale(dpr, dpr);

    const pts = generateFern(nPoints);
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[1] > maxY) maxY = p[1];
    }
    const rw = (maxX - minX) || 1;
    const rh = (maxY - minY) || 1;
    const sc = Math.min(w * 0.94 / rw, h * 0.98 / rh);
    const offX = (w - rw * sc) / 2;
    const offY = h - rh * sc;

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const px = offX + (p[0] - minX) * sc;
      const py = offY + (maxY - p[1]) * sc;
      const t = (p[1] - minY) / rh;
      const hue = 148 - t * 54 + hueShift;
      const light = 24 + t * 48;
      g.fillStyle = 'hsla(' + hue + ',' + (52 + t * 26) + '%,' + light + '%,' +
                    (0.48 + t * 0.46) + ')';
      const s = 0.85 + t * 1.45;
      g.fillRect(px - s * 0.5, py - s * 0.5, s, s);
    }
    return c;
  }

  /* ---------- 2. 递归分形树 ---------- */
  function drawBranch(g, x, y, len, ang, wdt, depth) {
    if (depth <= 0 || len < 1.2) return;
    const x2 = x + Math.cos(ang) * len;
    const y2 = y + Math.sin(ang) * len;

    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x2, y2);
    g.lineWidth = Math.max(0.5, wdt);
    g.lineCap = 'round';
    g.strokeStyle = 'hsla(158, 32%, ' + (24 + depth * 2.2) + '%, 0.85)';
    g.stroke();

    if (depth > 1) {
      const spread = 0.36 + Math.random() * 0.16;
      const shrink = 0.70 + Math.random() * 0.08;
      drawBranch(g, x2, y2, len * shrink, ang - spread, wdt * 0.67, depth - 1);
      drawBranch(g, x2, y2, len * shrink, ang + spread, wdt * 0.67, depth - 1);
      if (depth > 5 && Math.random() < 0.38) {
        drawBranch(g, x2, y2, len * shrink * 0.78,
                   ang + (Math.random() - 0.5) * 0.55, wdt * 0.5, depth - 1);
      }
    }
  }

  function makeTreeSprite(w, h, depth) {
    const dpr = 2;
    const c = document.createElement('canvas');
    c.width  = Math.max(4, Math.round(w * dpr));
    c.height = Math.max(4, Math.round(h * dpr));
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    g.translate(w / 2, h);
    drawBranch(g, 0, 0, h * 0.30, -Math.PI / 2, Math.max(1.6, h * 0.024), depth);
    return c;
  }

  /* ---------- 3. Koch 雪花 ---------- */
  function kochPoints(depth) {
    let pts = [];
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 3;
      pts.push([Math.cos(a), Math.sin(a)]);
    }
    for (let d = 0; d < depth; d++) {
      const out = [];
      const n = pts.length;
      for (let i = 0; i < n; i++) {
        const a = pts[i], b = pts[(i + 1) % n];
        const dx = b[0] - a[0], dy = b[1] - a[1];
        const p1 = [a[0] + dx / 3, a[1] + dy / 3];
        const p3 = [a[0] + dx * 2 / 3, a[1] + dy * 2 / 3];
        const mx = (p1[0] + p3[0]) / 2, my = (p1[1] + p3[1]) / 2;
        let nx = -(p3[1] - p1[1]), ny = p3[0] - p1[0];
        const nl = Math.hypot(nx, ny) || 1;
        nx /= nl; ny /= nl;
        // 朝外
        const bx = (a[0] + b[0]) / 2, by = (a[1] + b[1]) / 2;
        if (nx * bx + ny * by < 0) { nx = -nx; ny = -ny; }
        const hh = Math.sqrt(3) / 6 * Math.hypot(dx, dy);
        const p2 = [mx + nx * hh, my + ny * hh];
        out.push(a, p1, p2, p3);
      }
      pts = out;
    }
    return pts;
  }

  const KOCH_PATH = (function () {
    const pts = kochPoints(3);
    const p = new Path2D();
    p.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
    p.closePath();
    return p;
  })();

  /* ---------- 4. 动物剪影：多边形 + 分形凸起 ---------- */
  function polyArea(pts) {
    let s = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      s += a[0] * b[1] - b[0] * a[1];
    }
    return s / 2;
  }

  function buildFractalOutline(basePts, depth, amp) {
    let poly = basePts.map(function (p) { return [p[0], p[1]]; });
    for (let d = 0; d < depth; d++) {
      const area = polyArea(poly);
      const sgn = area > 0 ? 1 : -1;
      const out = [];
      const n = poly.length;
      for (let i = 0; i < n; i++) {
        const a = poly[i], b = poly[(i + 1) % n];
        const dx = b[0] - a[0], dy = b[1] - a[1];
        const len = Math.hypot(dx, dy) || 1;
        const nx = sgn * dy / len;
        const ny = sgn * (-dx) / len;
        const hh = len * amp;
        out.push(a);
        out.push([a[0] + dx * 0.28 + nx * hh, a[1] + dy * 0.28 + ny * hh]);
        out.push([a[0] + dx * 0.72 + nx * hh, a[1] + dy * 0.72 + ny * hh]);
      }
      poly = out;
    }
    return poly;
  }

  function toPath2D(pts) {
    const p = new Path2D();
    p.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
    p.closePath();
    return p;
  }

  /* ---------- 动物基础轮廓（手工描点） ---------- */
  const RABBIT_PTS = [
    [2, -14], [0, -26], [-4, -44], [-2, -56], [6, -58], [10, -44], [12, -28],
    [16, -30], [20, -48], [28, -52], [30, -40], [26, -24],
    [30, -18], [38, -10], [44, -2], [42, 6], [34, 12],
    [36, 22], [32, 34], [22, 40], [8, 42], [-8, 42], [-22, 40],
    [-34, 34], [-46, 30], [-54, 20], [-48, 10], [-42, 2], [-38, -8],
    [-30, -14], [-20, -20], [-10, -20], [-2, -16]
  ];

  const FOX_PTS = [
    [2, -18], [0, -30], [-6, -46], [2, -48], [10, -34], [14, -30],
    [20, -48], [28, -46], [28, -28], [36, -20], [46, -10], [52, -2],
    [48, 6], [38, 10], [36, 22], [34, 36], [22, 42], [6, 44],
    [-10, 44], [-26, 42], [-38, 36], [-50, 30], [-66, 24], [-74, 10],
    [-66, -2], [-54, -6], [-44, -8], [-36, -14], [-26, -20], [-14, -22], [-4, -22]
  ];

  const BIRD_PTS = [
    [8, -20], [2, -26], [-8, -32], [-24, -42], [-18, -28],
    [-32, -30], [-24, -18], [-38, -12], [-28, -4], [-16, 2],
    [-6, 10], [6, 12], [18, 10], [30, 4], [40, -2],
    [32, -8], [34, -14], [24, -18], [16, -22]
  ];

  /* ============================================================
     状态
  ============================================================ */
  const state = {
    fernCount: 10,
    wind: 0.5,
    snowCount: 16,
    time: 0,
    ferns: [],
    snow: [],
    animals: [],
    trees: [],
    ripples: [],
    discovered: 0
  };

  /* ---------- 构建树木 ---------- */
  function buildTrees() {
    const spots = [
      { x:  76, y: 470, h: 250, d: 9 },
      { x: 706, y: 472, h: 226, d: 9 },
      { x: 306, y: 474, h: 176, d: 8 },
      { x: 500, y: 476, h: 150, d: 8 }
    ];
    state.trees = spots.map(function (s) {
      return {
        x: s.x, y: s.y, h: s.h,
        sprite: makeTreeSprite(Math.round(s.h * 0.9), s.h, s.d),
        phase: Math.random() * Math.PI * 2,
        depth: 0.35
      };
    });
  }

  /* ---------- 构建蕨类 ---------- */
  function buildFerns() {
    const arr = [];
    const n = state.fernCount;
    for (let i = 0; i < n; i++) {
      const depth = Math.random();
      const x = 26 + Math.random() * (SCENE_W - 52);
      const y = 452 + depth * 42;
      const h = 132 + depth * 200 + Math.random() * 42;
      const w = h * 0.50;
      const sprite = makeFernSprite(
        Math.round(w), Math.round(h), 2000,
        (Math.random() - 0.5) * 34
      );
      arr.push({
        x: x, y: y, w: w, h: h, depth: depth,
        sprite: sprite,
        phase: Math.random() * Math.PI * 2,
        speed: 0.7 + Math.random() * 0.75,
        tilt: (Math.random() - 0.5) * 0.24,
        alpha: 0.42 + depth * 0.55
      });
    }
    arr.sort(function (a, b) { return a.y - b.y; });
    state.ferns = arr;
  }

  /* ---------- 构建雪花 ---------- */
  function buildSnow() {
    const arr = [];
    for (let i = 0; i < state.snowCount; i++) {
      arr.push(makeSnowflake(true));
    }
    state.snow = arr;
  }

  function makeSnowflake(anywhere) {
    return {
      x: Math.random() * SCENE_W,
      y: anywhere ? Math.random() * SCENE_H : -30 - Math.random() * 60,
      s: 5 + Math.random() * 11,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.7,
      vy: 12 + Math.random() * 26,
      vx: (Math.random() - 0.5) * 10,
      sway: 0.5 + Math.random() * 1.2,
      phase: Math.random() * Math.PI * 2
    };
  }

  /* ---------- 构建隐藏动物 ---------- */
  function buildAnimals() {
    const defs = [
      { name: '兔子', pts: RABBIT_PTS, x: 150, y: 430, scale: 1.00, rad: 92 },
      { name: '狐狸', pts: FOX_PTS,    x: 600, y: 428, scale: 1.00, rad: 96 },
      { name: '飞鸟', pts: BIRD_PTS,   x: 384, y: 172, scale: 1.15, rad: 92 }
    ];
    state.animals = defs.map(function (d) {
      const outline = buildFractalOutline(d.pts, 2, 0.17);
      return {
        name: d.name,
        x: d.x, y: d.y, scale: d.scale, rad: d.rad,
        path: toPath2D(outline),
        glow: 0, found: false, hover: false
      };
    });
    state.discovered = 0;
  }

  /* ---------- 星空 ---------- */
  const STARS = (function () {
    const a = [];
    for (let i = 0; i < 76; i++) {
      a.push({
        x: Math.random() * SCENE_W,
        y: Math.random() * 330,
        r: 0.5 + Math.random() * 1.2,
        ph: Math.random() * Math.PI * 2
      });
    }
    return a;
  })();

  /* ============================================================
     更新
  ============================================================ */
  function update(dt) {
    state.time += dt;

    // 动物发光过渡
    for (let i = 0; i < state.animals.length; i++) {
      const a = state.animals[i];
      const tgt = a.found ? 1 : (a.hover ? 0.34 : 0);
      a.glow += (tgt - a.glow) * Math.min(1, dt * 7);
    }

    // 雪花
    const windDrift = state.wind * 26;
    for (let i = 0; i < state.snow.length; i++) {
      const s = state.snow[i];
      s.y += s.vy * dt;
      s.x += (s.vx + Math.sin(state.time * s.sway + s.phase) * 14 + windDrift * 0.4) * dt;
      s.rot += s.vr * dt;
      if (s.y > SCENE_H + 34) {
        state.snow[i] = makeSnowflake(false);
      }
      if (s.x < -50) s.x = SCENE_W + 50;
      if (s.x > SCENE_W + 50) s.x = -50;
    }

    // 涟漪
    for (let i = state.ripples.length - 1; i >= 0; i--) {
      const r = state.ripples[i];
      r.r += dt * 190;
      r.life -= dt * 1.5;
      if (r.life <= 0) state.ripples.splice(i, 1);
    }
  }

  /* ============================================================
     绘制
  ============================================================ */
  function render() {
    const kx = cv.width / SCENE_W;
    const ky = cv.height / SCENE_H;
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
    ctx.clearRect(0, 0, SCENE_W, SCENE_H);

    drawSky();
    drawStars();
    drawMoon();
    drawGround();
    drawTrees();
    drawAnimals();
    drawFerns();
    drawRipples();
    drawSnow();
    drawFog();
    drawHud();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
    g.addColorStop(0.00, '#08161f');
    g.addColorStop(0.35, '#0b2430');
    g.addColorStop(0.66, '#0f3336');
    g.addColorStop(1.00, '#0a1f1c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  }

  function drawStars() {
    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      const tw = 0.35 + 0.5 * (0.5 + 0.5 * Math.sin(state.time * 1.4 + s.ph));
      ctx.globalAlpha = tw * 0.8;
      ctx.fillStyle = '#bff5e6';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawMoon() {
    const mx = 628, my = 84;
    const mg = ctx.createRadialGradient(mx, my, 8, mx, my, 210);
    mg.addColorStop(0, 'rgba(170, 240, 220, 0.24)');
    mg.addColorStop(0.4, 'rgba(140, 220, 200, 0.09)');
    mg.addColorStop(1, 'rgba(140, 220, 200, 0)');
    ctx.fillStyle = mg;
    ctx.fillRect(mx - 210, my - 210, 420, 420);

    ctx.beginPath();
    ctx.arc(mx, my, 24, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(206, 250, 238, 0.90)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(mx - 9, my + 6, 20, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(140, 210, 195, 0.35)';
    ctx.fill();
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, 448, 0, SCENE_H);
    g.addColorStop(0, '#0d2b26');
    g.addColorStop(0.5, '#081d1a');
    g.addColorStop(1, '#04100e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 448, SCENE_W, SCENE_H - 448);

    // 地平线微光
    const hg = ctx.createLinearGradient(0, 440, 0, 470);
    hg.addColorStop(0, 'rgba(110, 240, 200, 0)');
    hg.addColorStop(0.5, 'rgba(110, 240, 200, 0.14)');
    hg.addColorStop(1, 'rgba(110, 240, 200, 0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, 440, SCENE_W, 30);
  }

  function drawTrees() {
    for (let i = 0; i < state.trees.length; i++) {
      const t = state.trees[i];
      const sway = Math.sin(state.time * 0.7 + t.phase) * 0.022 * state.wind;
      const w = t.sprite.width / 2;
      const h = t.sprite.height / 2;

      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.rotate(sway);
      ctx.globalAlpha = 0.62;
      ctx.drawImage(t.sprite, -w / 2, -h, w, h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawFerns() {
    const wind = state.wind;
    for (let i = 0; i < state.ferns.length; i++) {
      const f = state.ferns[i];
      const sway = Math.sin(state.time * 1.1 * f.speed + f.phase) * 0.062 * wind;
      const gust = Math.sin(state.time * 0.37 + f.phase * 1.7) * 0.036 * wind;

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.tilt + sway + gust);
      ctx.globalAlpha = f.alpha;
      ctx.drawImage(f.sprite, -f.w / 2, -f.h, f.w, f.h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawAnimals() {
    for (let i = 0; i < state.animals.length; i++) {
      const a = state.animals[i];
      const g = a.glow;

      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.scale(a.scale, a.scale);

      // 基础剪影
      const baseA = 0.055 + g * 0.34;
      ctx.fillStyle = 'rgba(150, 255, 215, ' + baseA + ')';
      ctx.fill(a.path);

      // 发光轮廓
      if (g > 0.015) {
        ctx.save();
        ctx.shadowColor = 'rgba(120, 255, 210, ' + (g * 0.95) + ')';
        ctx.shadowBlur = 26 * g;
        ctx.strokeStyle = 'rgba(190, 255, 235, ' + (g * 0.88) + ')';
        ctx.lineWidth = 1.35;
        ctx.stroke(a.path);
        ctx.restore();

        // 内部自相似纹理（缩小的轮廓）
        if (g > 0.4) {
          ctx.save();
          ctx.globalAlpha = (g - 0.4) / 0.6 * 0.30;
          ctx.strokeStyle = 'rgba(160, 255, 225, 0.7)';
          ctx.lineWidth = 0.7;
          ctx.stroke(a.path);
          const s2 = 0.55;
          ctx.translate(0, 4);
          ctx.scale(s2, s2);
          ctx.stroke(a.path);
          ctx.restore();
        }
      }

      // 已发现标记
      if (a.found) {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = 'rgba(255, 216, 138, 0.95)';
        ctx.beginPath();
        ctx.arc(0, -78, 3.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, -78, 7.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 216, 138, 0.55)';
        ctx.lineWidth = 1.1;
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }
  }

  function drawRipples() {
    for (let i = 0; i < state.ripples.length; i++) {
      const r = state.ripples[i];
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(130, 245, 210, ' + (r.life * 0.42) + ')';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(130, 245, 210, ' + (r.life * 0.22) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawSnow() {
    const useShadow = state.snow.length <= 20;

    for (let i = 0; i < state.snow.length; i++) {
      const s = state.snow[i];
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.scale(s.s, s.s);

      if (useShadow) {
        ctx.shadowColor = 'rgba(140, 235, 255, 0.75)';
        ctx.shadowBlur = 7 / s.s;
      }
      ctx.strokeStyle = 'rgba(190, 245, 255, 0.72)';
      ctx.lineWidth = Math.max(0.035, 1.05 / s.s);
      ctx.lineJoin = 'round';
      ctx.stroke(KOCH_PATH);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawFog() {
    const g = ctx.createLinearGradient(0, 290, 0, SCENE_H);
    g.addColorStop(0.00, 'rgba(18, 62, 60, 0)');
    g.addColorStop(0.62, 'rgba(18, 62, 60, 0.14)');
    g.addColorStop(1.00, 'rgba(6, 26, 24, 0.46)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 290, SCENE_W, SCENE_H - 290);
  }

  function drawHud() {
    ctx.font = '600 12.5px -apple-system, "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(140, 220, 200, 0.42)';
    ctx.fillText('IFS · Barnsley Fern   |   ' + state.fernCount + ' 株蕨类', 22, 32);
  }

  /* ============================================================
     主循环
  ============================================================ */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     交互
  ============================================================ */
  const fernRange = document.getElementById('fernRange');
  const windRange = document.getElementById('windRange');
  const snowRange = document.getElementById('snowRange');
  const fernVal = document.getElementById('fernVal');
  const windVal = document.getElementById('windVal');
  const snowVal = document.getElementById('snowVal');
  const foundCount = document.getElementById('foundCount');

  function updateFoundUI() {
    foundCount.textContent = state.discovered + ' / ' + state.animals.length;
    if (state.discovered >= state.animals.length) {
      foundCount.classList.add('done');
    } else {
      foundCount.classList.remove('done');
    }
  }

  fernRange.addEventListener('input', function () {
    state.fernCount = +this.value;
    fernVal.textContent = state.fernCount;
    buildFerns();
    sndBlip(300 + state.fernCount * 12);
  });

  windRange.addEventListener('input', function () {
    state.wind = +this.value / 100;
    windVal.textContent = this.value + '%';
    sndBlip(420 + state.wind * 260);
  });

  snowRange.addEventListener('input', function () {
    state.snowCount = +this.value;
    snowVal.textContent = state.snowCount;
    buildSnow();
    sndBlip(560 + state.snowCount * 14);
  });

  document.getElementById('btnGrow').addEventListener('click', function () {
    ensureAudio();
    buildFerns();
    playRustle();
    tone(392, 0.5, 'sine', 0.05);
    tone(587.33, 0.55, 'sine', 0.04, 0.09);
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    state.fernCount = 10;
    state.wind = 0.5;
    state.snowCount = 16;
    fernRange.value = 10;
    windRange.value = 50;
    snowRange.value = 16;
    fernVal.textContent = '10';
    windVal.textContent = '50%';
    snowVal.textContent = '16';

    buildTrees();
    buildFerns();
    buildSnow();
    buildAnimals();
    updateFoundUI();

    tone(523.25, 0.3, 'sine', 0.05);
    tone(659.25, 0.35, 'sine', 0.04, 0.09);
    tone(783.99, 0.4, 'sine', 0.03, 0.18);
  });

  /* ---------- 鼠标移动：让附近的剪影微亮 ---------- */
  cv.addEventListener('pointermove', function (e) {
    const p = toLogic(e.clientX, e.clientY);
    let anyHover = false;
    let cursor = 'crosshair';

    for (let i = 0; i < state.animals.length; i++) {
      const a = state.animals[i];
      const d = Math.hypot(p.x - a.x, p.y - a.y);
      const near = d < a.rad;
      if (near) {
        anyHover = true;
        cursor = 'pointer';
        if (!a.hover && !a.found) playHoverBlip();
      }
      a.hover = near;
    }
    cv.style.cursor = cursor;

    if (anyHover) return;
  });

  cv.addEventListener('pointerleave', function () {
    for (let i = 0; i < state.animals.length; i++) {
      state.animals[i].hover = false;
    }
    cv.style.cursor = 'crosshair';
  });

  /* ---------- 点击：唤醒剪影 ---------- */
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    const p = toLogic(e.clientX, e.clientY);

    let hit = null;
    for (let i = 0; i < state.animals.length; i++) {
      const a = state.animals[i];
      if (Math.hypot(p.x - a.x, p.y - a.y) < a.rad) { hit = a; break; }
    }

    if (hit) {
      if (!hit.found) {
        hit.found = true;
        state.discovered++;
        updateFoundUI();
        playDiscoverSound(state.discovered);
        state.ripples.push({ x: hit.x, y: hit.y, r: 6, life: 1 });
      } else {
        tone(880, 0.14, 'sine', 0.045);
        tone(1320, 0.16, 'sine', 0.03, 0.08);
      }
    } else {
      // 空地：柔和的落地声 + 涟漪
      tone(220, 0.16, 'sine', 0.045, 0, 110);
      state.ripples.push({ x: p.x, y: p.y, r: 4, life: 1 });
    }
  });

  /* ---------- 音效开关 ---------- */
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function () {
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    if (!muted) {
      ensureAudio();
      tone(660, 0.1, 'sine', 0.05);
    }
  });

  /* ============================================================
     启动
  ============================================================ */
  resizeCanvas();
  buildTrees();
  buildFerns();
  buildSnow();
  buildAnimals();
  updateFoundUI();
  requestAnimationFrame(loop);

  window.addEventListener('pointerdown', function once() {
    ensureAudio();
    window.removeEventListener('pointerdown', once);
  });

})();
</script>
</body>
</html>
