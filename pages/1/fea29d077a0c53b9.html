<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>傅里叶级数合成 · Fourier Series Synthesis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000206;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #cfefff;
  }
  #scene { position: fixed; inset: 0; z-index: 0; }
  canvas { display: block; }

  .hud { position: fixed; z-index: 10; pointer-events: none; user-select: none; }

  /* ---- 标题 ---- */
  #title-block { top: 42px; left: 46px; }
  #title-block .en {
    font-size: 10px; letter-spacing: 5px; color: #3d7f9a;
    text-transform: uppercase; margin-bottom: 12px;
  }
  #title-block h1 {
    font-size: 26px; font-weight: 300; letter-spacing: 8px;
    color: #d8fbff;
    text-shadow: 0 0 12px rgba(34, 211, 238, .85),
                 0 0 34px rgba(8, 145, 178, .6),
                 0 0 70px rgba(6, 90, 130, .4);
  }
  #title-block .line {
    margin-top: 14px; width: 74px; height: 1px;
    background: linear-gradient(90deg, #22d3ee, rgba(34, 211, 238, 0));
    box-shadow: 0 0 10px #22d3ee;
  }

  /* ---- 方程 ---- */
  #eq-block { bottom: 52px; left: 46px; }
  #eq-block .cap {
    font-size: 10px; letter-spacing: 4px; color: #3d7f9a;
    margin-bottom: 14px; text-transform: uppercase;
  }
  #eq-block .eq {
    font-family: "Cambria Math", "Latin Modern Math", Georgia, serif;
    font-style: italic;
    font-size: 18px; line-height: 1.9; letter-spacing: .5px;
    color: #a8ecff;
    text-shadow: 0 0 10px rgba(34, 211, 238, .45);
  }
  #eq-block .eq .op  { color: #6fb6d0; font-style: normal; }
  #eq-block .eq .sub { font-size: 12px; vertical-align: sub; font-style: normal; color: #7fe8ff; }
  #eq-block .eq .sup { font-size: 12px; vertical-align: super; font-style: normal; color: #7fe8ff; }
  #eq-block .params {
    margin-top: 16px; font-size: 11px; letter-spacing: 2.4px;
    color: #4f8ea8; font-family: "Consolas", monospace;
  }

  /* ---- 参数面板 ---- */
  #param-block { bottom: 54px; right: 46px; text-align: right; }
  #param-block .row {
    font-family: "Consolas", monospace;
    font-size: 11px; letter-spacing: 2.2px;
    color: #3f7a92; margin-bottom: 9px;
  }
  #param-block .row b {
    color: #7fe8ff; font-weight: 400;
    text-shadow: 0 0 8px rgba(34, 211, 238, .7);
  }
  #param-block .row b.big {
    font-size: 14px;
    color: #ffd8a8;
    text-shadow: 0 0 12px rgba(255, 170, 80, .8);
  }

  /* ---- 提示 ---- */
  #hint {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 3px; color: #2c5a70;
    z-index: 10; pointer-events: none;
  }

  /* ---- 开场遮罩 ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 50%, #041018 0%, #000206 70%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; cursor: pointer;
    transition: opacity 1.2s ease;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay .enter {
    font-size: 14px; letter-spacing: 10px; color: #7fe8ff;
    padding: 20px 46px; border: 1px solid rgba(34, 211, 238, .35);
    border-radius: 2px;
    text-shadow: 0 0 16px rgba(34, 211, 238, .85);
    box-shadow: 0 0 30px rgba(34, 211, 238, .1),
                inset 0 0 30px rgba(34, 211, 238, .05);
    transition: all .45s ease;
    animation: breathe 3s ease-in-out infinite;
  }
  #overlay .enter:hover {
    background: rgba(34, 211, 238, .08);
    border-color: rgba(34, 211, 238, .8);
    box-shadow: 0 0 60px rgba(34, 211, 238, .25),
                inset 0 0 40px rgba(34, 211, 238, .1);
  }
  #overlay .tip {
    margin-top: 26px; font-size: 10px; letter-spacing: 4px; color: #2c5a70;
  }
  @keyframes breathe {
    0%, 100% { opacity: .78; }
    50%      { opacity: 1; }
  }

  @media (max-width: 760px) {
    #title-block { top: 26px; left: 22px; }
    #title-block h1 { font-size: 17px; letter-spacing: 4px; }
    #eq-block { bottom: 30px; left: 22px; }
    #eq-block .eq { font-size: 13px; }
    #param-block { bottom: 30px; right: 22px; }
    #param-block .row { font-size: 9px; letter-spacing: 1.4px; }
  }
</style>
</head>
<body>

<div id="scene"></div>

<div class="hud" id="title-block">
  <div class="en">Harmonic Synthesis</div>
  <h1>傅里叶级数合成</h1>
  <div class="line"></div>
</div>

<div class="hud" id="eq-block">
  <div class="cap">Fourier Series</div>
  <div class="eq">
    <div>f(t) <span class="op">=</span> Σ <span class="sub">n</span> a<span class="sub">n</span> · sin( nωt <span class="op">+</span> φ<span class="sub">n</span> )</div>
    <div style="margin-top:6px;">方波：a<span class="sub">n</span> <span class="op">=</span> 4 / (nπ) &nbsp; (n 为奇数)</div>
  </div>
  <div class="params">正交基 · 完备性 · 逐点收敛</div>
</div>

<div class="hud" id="param-block">
  <div class="row">当前谐波数 N <b class="big" id="harm-count">1</b></div>
  <div class="row">基频 ω <b>1.00 rad/s</b></div>
  <div class="row">采样精度 <b>480 pts</b></div>
  <div class="row">目标波形 <b>方波</b></div>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放</div>

<div id="overlay">
  <div class="enter">进 入 谐 波</div>
  <div class="tip">CLICK TO START</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================================
   0. 全局参数
   ========================================================= */
const SAMPLES   = 480;                 // 每条曲线的采样点数
const X_SPAN    = 44;                  // x 轴总宽度
const T_MIN     = -Math.PI * 2;
const T_MAX     =  Math.PI * 2;

const MAX_H     = 10;                  // 最多谐波条数（奇数 1,3,5,...19）
const Y_BASE    = 3.0;                 // 最低一条谐波的基线高度
const Y_STEP    = 1.9;                 // 每条谐波之间的间距
const H_AMP     = 0.78;                // 每条谐波的显示振幅

const SYNTH_Y     = -7.2;              // 合成波形基线
const SYNTH_AMP   = 5.6;               // 合成波形振幅缩放

const TARGET_SAMPLES = 900;            // 目标方波参考线采样数

/* =========================================================
   1. 场景 / 相机 / 渲染器
   ========================================================= */
const container = document.getElementById('scene');

const scene  = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000206, 0.0042);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 4000);
camera.position.set(0, 3, 52);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000206, 1);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping      = true;
controls.dampingFactor      = 0.06;
controls.autoRotate         = false;
controls.minDistance        = 22;
controls.maxDistance        = 130;
controls.enablePan          = false;
controls.target.set(0, 3, 0);
controls.minPolarAngle      = Math.PI * 0.28;
controls.maxPolarAngle      = Math.PI * 0.72;
controls.minAzimuthAngle    = -Math.PI * 0.34;
controls.maxAzimuthAngle    =  Math.PI * 0.34;

/* =========================================================
   2. 采样坐标表
   ========================================================= */
const tArr = new Float32Array(SAMPLES);
const xArr = new Float32Array(SAMPLES);
for (let i = 0; i < SAMPLES; i++) {
  const f = i / (SAMPLES - 1);
  tArr[i] = T_MIN + f * (T_MAX - T_MIN);
  xArr[i] = -X_SPAN / 2 + f * X_SPAN;
}

/* =========================================================
   3. 背景网格
   ========================================================= */
(function buildGrid() {
  const pts = [];
  const z = -34;
  const yLow = -20, yHigh = 26;
  const xLow = -30, xHigh = 30;

  // 横线
  for (let y = yLow; y <= yHigh; y += 2) {
    pts.push(xLow, y, z,  xHigh, y, z);
  }
  // 竖线
  for (let x = xLow; x <= xHigh; x += 2) {
    pts.push(x, yLow, z,  x, yHigh, z);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));

  const mat = new THREE.LineBasicMaterial({
    color      : 0x0b2b3c,
    transparent: true,
    opacity    : 0.55,
    blending   : THREE.AdditiveBlending,
    depthWrite : false,
  });

  const grid = new THREE.LineSegments(geo, mat);
  grid.frustumCulled = false;
  scene.add(grid);
})();

/* =========================================================
   4. 创建各次谐波条（分层）
   ========================================================= */
const harmonics = [];

for (let k = 0; k < MAX_H; k++) {
  const n = 2 * k + 1;                          // 1, 3, 5, 7, ...
  const hue = (0.55 + k * 0.072) % 1.0;         // 青 → 蓝 → 紫 → 品红 → 红 → 橙 → 黄
  const col = new THREE.Color().setHSL(hue, 0.92, 0.56);

  const pos = new Float32Array(SAMPLES * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',
    new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));

  const mat = new THREE.LineBasicMaterial({
    color      : col,
    transparent: true,
    opacity    : 0.82,
    blending   : THREE.AdditiveBlending,
    depthWrite : false,
  });

  const line = new THREE.Line(geo, mat);
  line.frustumCulled = false;
  line.visible = false;
  scene.add(line);

  harmonics.push({
    n,
    hue,
    color    : col,
    yBase    : Y_BASE + k * Y_STEP,
    amp      : H_AMP,
    weight   : 0,
    target   : 0,
    positions: pos,
    geo,
    mat,
    line,
  });
}

/* =========================================================
   5. 合成波形线（主输出）
   ========================================================= */
const synthPos = new Float32Array(SAMPLES * 3);
const synthGeo = new THREE.BufferGeometry();
synthGeo.setAttribute('position',
  new THREE.BufferAttribute(synthPos, 3).setUsage(THREE.DynamicDrawUsage));

const synthMat = new THREE.LineBasicMaterial({
  color      : 0xdffaff,
  transparent: true,
  opacity    : 0.95,
  blending   : THREE.AdditiveBlending,
  depthWrite : false,
});

const synthLine = new THREE.Line(synthGeo, synthMat);
synthLine.frustumCulled = false;
scene.add(synthLine);

/* =========================================================
   6. 目标方波参考线（虚影）
   ========================================================= */
(function buildTargetSquare() {
  const pos = new Float32Array(TARGET_SAMPLES * 3);
  for (let i = 0; i < TARGET_SAMPLES; i++) {
    const f = i / (TARGET_SAMPLES - 1);
    const t = T_MIN + f * (T_MAX - T_MIN);
    const x = -X_SPAN / 2 + f * X_SPAN;
    const sq = Math.sin(t) >= 0 ? 1 : -1;
    pos[i * 3]     = x;
    pos[i * 3 + 1] = SYNTH_Y + SYNTH_AMP * sq;
    pos[i * 3 + 2] = 0;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  const mat = new THREE.LineBasicMaterial({
    color      : 0x2f7fa0,
    transparent: true,
    opacity    : 0.22,
    blending   : THREE.AdditiveBlending,
    depthWrite : false,
  });

  const line = new THREE.Line(geo, mat);
  line.frustumCulled = false;
  scene.add(line);
})();

/* =========================================================
   7. 合成波上流动的亮点
   ========================================================= */
function makeGlowTexture() {
  const size = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(190,250,255,0.85)');
  g.addColorStop(0.48, 'rgba(60,200,255,0.28)');
  g.addColorStop(1.00, 'rgba(0,80,160,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glowTex = makeGlowTexture();

const dot = new THREE.Sprite(new THREE.SpriteMaterial({
  map        : glowTex,
  color      : 0xd8ffff,
  blending   : THREE.AdditiveBlending,
  transparent: true,
  depthWrite : false,
  opacity    : 0.75,
}));
dot.scale.set(3.0, 3.0, 1);
dot.frustumCulled = false;
scene.add(dot);

/* =========================================================
   8. 后期泛光（克制参数，避免糊成一片）
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.62,   // strength
  0.42,   // radius
  0.38    // threshold
);
composer.addPass(bloomPass);

/* =========================================================
   9. 谐波调度：逐步增加 N，然后循环
   ========================================================= */
const STEP_INTERVAL = 2.6;   // 每 2.6 秒增加一个谐波
const END_HOLD      = 5.0;   // 满谐波后保持 5 秒

let activeCount = 1;
let elapsed     = 0;
let phaseMode   = 'grow';    // 'grow' | 'hold'
let holdTimer   = 0;

function applyTargets() {
  for (let k = 0; k < MAX_H; k++) {
    harmonics[k].target = (k < activeCount) ? 1 : 0;
  }
  const el = document.getElementById('harm-count');
  if (el) el.textContent = String(activeCount);
}
applyTargets();

function updateSchedule(dt) {
  if (phaseMode === 'grow') {
    elapsed += dt;
    const want = Math.min(1 + Math.floor(elapsed / STEP_INTERVAL), MAX_H);
    if (want !== activeCount) {
      activeCount = want;
      applyTargets();
    }
    if (activeCount >= MAX_H) {
      phaseMode  = 'hold';
      holdTimer  = 0;
    }
  } else {
    holdTimer += dt;
    if (holdTimer > END_HOLD) {
      phaseMode   = 'grow';
      elapsed     = 0;
      activeCount = 1;
      applyTargets();
    }
  }
}

/* =========================================================
   10. 波形更新
   ========================================================= */
let phase = 0;             // 全局相位 ωt

function updateWaveforms(dt) {
  phase += dt * 0.75;

  // ---- 各次谐波 ----
  for (let k = 0; k < MAX_H; k++) {
    const h = harmonics[k];

    // 权重平滑过渡
    const diff = h.target - h.weight;
    if (Math.abs(diff) > 0.0005) {
      const step = Math.sign(diff) * Math.min(Math.abs(diff), dt / 0.7);
      h.weight += step;
    } else {
      h.weight = h.target;
    }

    const w = h.weight;
    h.line.visible = w > 0.012;

    if (h.line.visible) {
      const arr = h.positions;
      const yB  = h.yBase;
      const amp = h.amp * w;
      const n   = h.n;

      for (let i = 0; i < SAMPLES; i++) {
        const t = tArr[i];
        arr[i * 3]     = xArr[i];
        arr[i * 3 + 1] = yB + amp * Math.sin(n * t + phase);
        arr[i * 3 + 2] = 0;
      }
      h.geo.attributes.position.needsUpdate = true;

      // 透明度随权重淡入
      h.mat.opacity = 0.82 * Math.min(1, w * 1.4);
    }
  }

  // ---- 合成波形 ----
  const sp = synthPos;
  for (let i = 0; i < SAMPLES; i++) {
    const t = tArr[i];
    let sum = 0;

    for (let k = 0; k < MAX_H; k++) {
      const h = harmonics[k];
      if (h.weight > 0.001) {
        sum += h.weight * Math.sin(h.n * t + phase) / h.n;
      }
    }
    sum *= 4 / Math.PI;

    sp[i * 3]     = xArr[i];
    sp[i * 3 + 1] = SYNTH_Y + SYNTH_AMP * sum;
    sp[i * 3 + 2] = 0;
  }
  synthGeo.attributes.position.needsUpdate = true;

  // 合成线亮度：谐波越多越亮
  const frac = (activeCount - 1) / (MAX_H - 1);
  synthMat.opacity = 0.72 + frac * 0.28;

  // ---- 流动亮点：沿合成波缓慢移动 ----
  const dotIdx = Math.floor(
    ((performance.now() * 0.00012) % 1) * (SAMPLES - 1)
  );
  dot.position.set(
    sp[dotIdx * 3],
    sp[dotIdx * 3 + 1],
    sp[dotIdx * 3 + 2] + 0.4
  );
  const pulse = 2.6 + Math.sin(performance.now() * 0.005) * 0.5;
  dot.scale.set(pulse, pulse, 1);
}

/* =========================================================
   11. 动画主循环
   ========================================================= */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  updateSchedule(dt);
  updateWaveforms(dt);

  // 泛光轻微呼吸
  bloomPass.strength = 0.58 + Math.sin(clock.elapsedTime * 1.3) * 0.07;

  controls.update();
  composer.render();
}

/* =========================================================
   12. 窗口自适应
   ========================================================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});

/* =========================================================
   13. 科技感背景音效（Web Audio 实时合成）
   ========================================================= */
let audioStarted = false;

function startAudio() {
  if (audioStarted) return;
  audioStarted = true;

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();

  // ---- 总输出 ----
  const master = ctx.createGain();
  master.gain.value = 0.0001;
  master.connect(ctx.destination);
  master.gain.exponentialRampToValueAtTime(0.26, ctx.currentTime + 4.0);

  // ---- 空间延迟 ----
  const delay = ctx.createDelay(1.2);
  delay.delayTime.value = 0.36;
  const fb = ctx.createGain();
  fb.gain.value = 0.34;
  const wet = ctx.createGain();
  wet.gain.value = 0.28;
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(wet);
  wet.connect(master);

  // ---- 低频 drone ----
  const droneFilter = ctx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = 320;
  droneFilter.Q.value = 6;
  droneFilter.connect(master);

  const droneGain = ctx.createGain();
  droneGain.gain.value = 0.15;
  droneGain.connect(droneFilter);

  const droneFreqs = [55.0, 82.41, 110.0, 164.81, 220.0];
  droneFreqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    osc.type = (i % 2 === 0) ? 'sine' : 'triangle';
    osc.frequency.value = f * (1 + (Math.random() - 0.5) * 0.008);
    const g = ctx.createGain();
    g.gain.value = 0.5 / (i + 1);
    osc.connect(g);
    g.connect(droneGain);
    osc.start();
  });

  // ---- 滤波器缓慢扫频 ----
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.04;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 200;
  lfo.connect(lfoGain);
  lfoGain.connect(droneFilter.frequency);
  lfo.start();

  // ---- 谐波 ping（音高对应谐波次数）----
  function ping(n) {
    const now = ctx.currentTime;
    const freq = 196.0 * n;            // 基频 × 谐波次数
    if (freq > 4200) return;

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.055 / Math.sqrt(n), now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.9);

    osc.connect(g);
    g.connect(master);
    g.connect(delay);

    osc.start(now);
    osc.stop(now + 2.1);
  }

  // ---- 每次谐波数增加时触发一次 ping ----
  let lastCount = activeCount;
  setInterval(() => {
    if (activeCount !== lastCount) {
      lastCount = activeCount;
      ping(activeCount);
    }
  }, 120);

  // ---- 随机高频点缀 ----
  const scale = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];
  setInterval(() => {
    if (Math.random() > 0.6) return;
    const now = ctx.currentTime;
    const semi = scale[Math.floor(Math.random() * scale.length)];
    const oct  = Math.floor(Math.random() * 2);
    const freq = 523.25 * Math.pow(2, (semi + 12 * oct) / 12);

    const osc = ctx.createOscillator();
    osc.type = Math.random() > 0.5 ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(freq, now);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.05, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);

    osc.connect(g);
    g.connect(master);
    g.connect(delay);

    osc.start(now);
    osc.stop(now + 2.2);
  }, 1500);

  // ---- 低频扫频冲击 ----
  setInterval(() => {
    if (Math.random() > 0.5) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 1.6);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.04, now + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 820;

    osc.connect(f);
    f.connect(g);
    g.connect(master);
    g.connect(delay);

    osc.start(now);
    osc.stop(now + 1.9);
  }, 5600);
}

/* =========================================================
   14. 启动
   ========================================================= */
const overlay = document.getElementById('overlay');

function boot() {
  overlay.classList.add('hide');
  startAudio();
}

overlay.addEventListener('click', boot);
overlay.addEventListener('touchstart', boot, { passive: true });

// 立即开始渲染
animate();
</script>
