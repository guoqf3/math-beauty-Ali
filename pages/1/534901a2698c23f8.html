<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>生态平衡 · 捕食者与猎物</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#040a06;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;touch-action:none;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:28px 36px;opacity:0;
    animation:fade 1.6s 0.2s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,220,160,.34);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(20px,3vw,36px);
    font-weight:200;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(96deg,#7af0a0 0%,#5ee0c0 38%,#6ab8ff 72%,#ffb060 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 28px rgba(100,220,160,.42));
  }
  #title .sub{
    font-size:10px;letter-spacing:.22em;line-height:1.9;
    color:rgba(160,215,180,.30);font-weight:300;
  }

  #stats{
    position:absolute;top:0;right:0;
    padding:28px 36px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.12em;line-height:2.0;
    color:rgba(150,215,175,.32);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .k{color:rgba(180,225,200,.52);}
  #stats .v{color:rgba(255,215,150,.82);}
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(120,190,150,.26);margin-bottom:6px;
  }
  #stats .pv{color:rgba(130,240,140,.92);}
  #stats .pd{color:rgba(255,150,90,.92);}
  #audioDot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:rgba(200,180,255,.22);
    margin-left:6px;vertical-align:middle;
    transition:background .4s;
  }
  #audioDot.on{
    background:rgba(150,240,180,.9);
    box-shadow:0 0 8px rgba(150,240,180,.8);
  }

  #meter{
    position:absolute;bottom:0;left:0;
    padding:0 36px 26px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.12em;line-height:2.0;
    color:rgba(150,215,175,.32);
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #meter .big{
    display:block;font-size:clamp(18px,2.2vw,26px);
    font-weight:200;letter-spacing:.22em;
    color:rgba(180,245,200,.88);
    margin-bottom:2px;
    transition:color .6s ease;
  }
  #meter .en{
    font-size:8.5px;letter-spacing:.38em;text-indent:.38em;
    color:rgba(160,220,185,.42);
  }

  #controls{
    position:absolute;bottom:0;right:0;
    padding:0 36px 22px;
    display:flex;flex-direction:column;gap:11px;
    align-items:flex-end;
    max-width:400px;
    opacity:0;animation:fade 1.6s 1.5s ease forwards;
    pointer-events:auto;
  }
  .ctrl-row{
    display:flex;align-items:center;gap:10px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;
  }
  .ctrl-label{
    color:rgba(170,220,190,.60);
    min-width:86px;text-align:right;
  }
  .ctrl-val{
    color:rgba(255,215,150,.94);
    min-width:54px;text-align:right;
    font-weight:500;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:130px;height:3px;
    background:rgba(120,190,150,.18);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:12px;height:12px;border-radius:50%;
    background:rgba(200,250,220,.94);
    border:1px solid rgba(140,220,180,.85);
    box-shadow:0 0 10px rgba(120,220,160,.55);
    cursor:pointer;transition:transform .18s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25);}
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;
    background:rgba(200,250,220,.94);
    border:1px solid rgba(140,220,180,.85);
    box-shadow:0 0 10px rgba(120,220,160,.55);
    cursor:pointer;
  }
  .btn-row{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;
  }
  .btn{
    font-family:inherit;
    font-size:9px;letter-spacing:.18em;text-indent:.18em;
    color:rgba(220,245,230,.86);
    background:rgba(20,45,32,.48);
    border:1px solid rgba(120,200,160,.26);
    border-radius:999px;
    padding:7px 14px;cursor:pointer;
    transition:.3s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .btn:hover{
    border-color:rgba(180,240,210,.88);
    box-shadow:0 0 18px rgba(120,220,160,.38);
    background:rgba(50,120,90,.24);
  }
  .btn.active{
    border-color:rgba(140,250,190,.90);
    background:rgba(50,140,95,.30);
    color:rgba(200,255,225,.98);
    box-shadow:0 0 22px rgba(120,240,170,.48);
  }

  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:16px;white-space:nowrap;
    font-size:9px;letter-spacing:.24em;
    color:rgba(150,215,180,.30);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:820px){
    #title{padding:14px 14px;}
    #title .sub{font-size:8.5px;}
    #stats{padding:14px 14px;font-size:8px;}
    #meter{padding:0 14px 14px;font-size:8px;}
    #controls{padding:0 14px 14px;gap:7px;max-width:100%;left:0;right:0;align-items:center;}
    .ctrl-label{min-width:62px;font-size:8px;}
    .ctrl-val{min-width:42px;font-size:8px;}
    input[type=range]{width:80px;}
    .btn{padding:5px 10px;font-size:7.5px;letter-spacing:.10em;}
    #hint{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">LOTKA-VOLTERRA · PREDATOR &amp; PREY</div>
    <h1>生态平衡</h1>
    <div class="sub">
      捕食者与猎物 · 非线性动力学<br>
      调整参数 · 观察崩溃或恢复
    </div>
  </div>

  <div id="stats">
    <span class="lab">POPULATION</span>
    <div><span class="pv">● 猎物 N </span><span class="v" id="preyVal">0</span></div>
    <div><span class="pd">● 捕食者 P </span><span class="v" id="predVal">0</span></div>
    <div><span class="k">时间 </span><span class="v" id="tVal">0.0</span></div>
    <div><span class="k">状态 </span><span class="v" id="phaseVal">平衡</span></div>
    <div style="margin-top:3px;"><span class="k">音频 </span><span class="v">自然 + 兽鸣</span><span id="audioDot"></span></div>
  </div>

  <div id="meter">
    <span class="big" id="stateBig">生 机</span>
    <div class="en" id="stateEn">EQUILIBRIUM</div>
  </div>

  <div id="controls">
    <div class="ctrl-row">
      <span class="ctrl-label">猎物繁殖 α</span>
      <input type="range" id="alpha" min="0.2" max="1.6" step="0.05" value="0.9">
      <span class="ctrl-val" id="alphaVal">0.90</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">捕食率 β</span>
      <input type="range" id="beta" min="0.01" max="0.10" step="0.005" value="0.045">
      <span class="ctrl-val" id="betaVal">0.045</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">捕食者死亡 γ</span>
      <input type="range" id="gamma" min="0.10" max="1.20" step="0.02" value="0.55">
      <span class="ctrl-val" id="gammaVal">0.55</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">转化效率 δ</span>
      <input type="range" id="delta" min="0.02" max="0.12" step="0.005" value="0.055">
      <span class="ctrl-val" id="deltaVal">0.055</span>
    </div>
    <div class="btn-row">
      <button class="btn active" id="presetBal">平 衡</button>
      <button class="btn" id="presetBoom">繁 盛</button>
      <button class="btn" id="presetCrash">崩 溃</button>
      <button class="btn" id="resetBtn">重 置</button>
    </div>
  </div>

  <div id="hint">拖动滑块 · 调整生态参数 · 观察种群动态</div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   Lotka-Volterra
   dN/dt = αN − βNP
   dP/dt = δNP − γP
   ========================================================= */
const params = {
  alpha: 0.90,   // 猎物繁殖率
  beta:  0.045,  // 捕食率
  gamma: 0.55,   // 捕食者死亡率
  delta: 0.055   // 能量转化效率
};

/* 平衡点（零增长率处的非零解）：N* = γ/δ，P* = α/β */
function equilibrium(){
  return {
    N: params.gamma / params.delta,
    P: params.alpha / params.beta
  };
}

/* =========================================================
   状态
   ========================================================= */
let N = 0, P = 0;         // 归一化种群
let simTime = 0;
let running = true;
let phaseHistory = [];
let timeHistory = [];
let trailPhase = [];
const MAX_HISTORY = 600;

/* 粒子（可视化个体） */
const MAX_PARTICLES = 200;
let particles = [];

/* 震荡检测 */
let lastN = 0, lastP = 0;
let collisionCool = 0;

/* =========================================================
   画布
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

let phaseRect = { x: 0, y: 0, w: 0, h: 0 };
let timeRect  = { x: 0, y: 0, w: 0, h: 0 };
let fieldRect = { x: 0, y: 0, w: 0, h: 0 };

function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const narrow = W < 820;
  const padX = narrow ? 14 : 36;
  const padTop = narrow ? 100 : 116;
  const padBot = narrow ? 190 : 210;

  const availW = W - padX * 2;
  const availH = Math.max(140, H - padTop - padBot);

  if (narrow){
    /* 上：相位图；下：时间序列；粒子层叠在背后 */
    const gap = 10;
    const pw = (availW - gap) * 0.5;
    phaseRect = { x: padX, y: padTop, w: pw, h: availH * 0.8 };
    timeRect  = { x: padX + pw + gap, y: padTop, w: pw, h: availH * 0.8 };
    fieldRect = { x: 0, y: 0, w: W, h: H };
  } else {
    /* 左：相位图（大）；右：时间序列（中）；底部：粒子场 */
    const gap = 22;
    const panelW = (availW - gap) * 0.5;
    phaseRect = { x: padX, y: padTop, w: panelW, h: availH * 0.62 };
    timeRect  = {
      x: padX + panelW + gap,
      y: padTop + availH * 0.30,
      w: panelW,
      h: availH * 0.70
    };
    fieldRect = { x: padX, y: padTop + availH * 0.64 + 8, w: availW, h: availH * 0.36 - 8 };
  }
}
window.addEventListener('resize', layout);

/* =========================================================
   初始化
   ========================================================= */
function initEcosystem(seedN, seedP){
  const eq = equilibrium();

  N = (seedN !== undefined) ? seedN : eq.N * 0.78;
  P = (seedP !== undefined) ? seedP : eq.P * 1.22;

  simTime = 0;
  phaseHistory = [];
  timeHistory = [];
  trailPhase = [];
  lastN = N;
  lastP = P;

  /* 初始化粒子 */
  particles = [];
  syncParticles();
}

function syncParticles(){
  const eq = equilibrium();
  const targetPrey = Math.round(Math.min(140, (N / Math.max(1, eq.N * 2.2)) * 110));
  const targetPred = Math.round(Math.min(50, (P / Math.max(1, eq.P * 2.2)) * 40));

  /* 猎物 */
  while (particles.filter(function(p){ return p.type === 0; }).length < targetPrey){
    particles.push(makeParticle(0));
  }
  /* 移除多余猎物 */
  let preyCount = particles.filter(function(p){ return p.type === 0; }).length;
  for (let i = particles.length - 1; i >= 0 && preyCount > targetPrey; i--){
    if (particles[i].type === 0){ particles.splice(i, 1); preyCount--; }
  }

  /* 捕食者 */
  while (particles.filter(function(p){ return p.type === 1; }).length < targetPred){
    particles.push(makeParticle(1));
  }
  let predCount = particles.filter(function(p){ return p.type === 1; }).length;
  for (let i = particles.length - 1; i >= 0 && predCount > targetPred; i--){
    if (particles[i].type === 1){ particles.splice(i, 1); predCount--; }
  }

  if (particles.length > MAX_PARTICLES) particles.length = MAX_PARTICLES;
}

function makeParticle(type){
  return {
    x: Math.random(),
    y: Math.random(),
    vx: (Math.random() - 0.5) * 0.02,
    vy: (Math.random() - 0.5) * 0.02,
    type: type,          // 0 = 猎物，1 = 捕食者
    phase: Math.random() * Math.PI * 2,
    size: type === 0 ? 0.55 + Math.random() * 0.35 : 0.85 + Math.random() * 0.45,
    speed: type === 0 ? 0.55 + Math.random() * 0.30 : 0.85 + Math.random() * 0.40
  };
}

/* =========================================================
   物理步进
   ========================================================= */
function step(dt){
  const a = params.alpha;
  const b = params.beta;
  const g = params.gamma;
  const d = params.delta;

  /* 4 阶 RK */
  const fN = function(n, p){ return a * n - b * n * p; };
  const fP = function(n, p){ return d * n * p - g * p; };

  const k1n = fN(N, P);
  const k1p = fP(N, P);

  const k2n = fN(N + k1n * dt * 0.5, P + k1p * dt * 0.5);
  const k2p = fP(N + k1n * dt * 0.5, P + k1p * dt * 0.5);

  const k3n = fN(N + k2n * dt * 0.5, P + k2p * dt * 0.5);
  const k3p = fP(N + k2n * dt * 0.5, P + k2p * dt * 0.5);

  const k4n = fN(N + k3n * dt, P + k3p * dt);
  const k4p = fP(N + k3n * dt, P + k3p * dt);

  let newN = N + (k1n + 2 * k2n + 2 * k3n + k4n) * dt / 6;
  let newP = P + (k1p + 2 * k2p + 2 * k3p + k4p) * dt / 6;

  /* 极小的迁移项，避免数值拖到 0 后无法恢复 */
  if (newN < 0.001) newN = 0.001;
  if (newP < 0.001) newP = 0.001;

  N = newN;
  P = newP;
  simTime += dt;

  /* 记录历史 */
  phaseHistory.push({ n: N, p: P });
  if (phaseHistory.length > MAX_HISTORY) phaseHistory.shift();

  timeHistory.push({ t: simTime, n: N, p: P });
  if (timeHistory.length > MAX_HISTORY) timeHistory.shift();

  /* 捕食事件检测：如果 P 明显上升且 N 下降，触发一次“捕食声” */
  if (collisionCool <= 0 && P > lastP * 1.001 && N < lastN * 0.9995){
    if (Math.random() < 0.05){
      playGrowl(Math.min(1, P / Math.max(1, equilibrium().P * 1.5)));
      collisionCool = 0.6;
    }
  }
  if (collisionCool > 0) collisionCool -= dt;

  lastN = N;
  lastP = P;

  /* 同步粒子数量 */
  if ((simTime * 10 | 0) % 6 === 0) syncParticles();
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let masterGain = null;
let audioReady = false;
let birdTimer = null;
let growlTimer = null;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  masterGain = ac.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(ac.destination);
  masterGain.gain.setTargetAtTime(0.62, ac.currentTime, 2.2);

  const kick = function(){
    setAudioDot(true);
    startAmbient();
    scheduleBirds();
    scheduleGrowls();
  };

  if (ac.state === 'suspended'){
    ac.resume().then(kick).catch(function(){ audioReady = false; });
  } else {
    kick();
  }
}

/* ---- 自然环境底噪 ---- */
function startAmbient(){
  const now = ac.currentTime;

  /* 风：噪声 + 低通 */
  const len = ac.sampleRate * 4;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.025 * w) / 1.025;
    d[i] = last * 3.2;
  }

  const windSrc = ac.createBufferSource();
  windSrc.buffer = buf;
  windSrc.loop = true;

  const wl = ac.createBiquadFilter();
  wl.type = 'lowpass';
  wl.frequency.value = 340;
  wl.Q.value = 0.6;

  const wg = ac.createGain();
  wg.gain.value = 0.026;

  windSrc.connect(wl);
  wl.connect(wg);
  wg.connect(masterGain);
  windSrc.start(now);

  const wlfo = ac.createOscillator();
  wlfo.frequency.value = 0.09;
  const wlg = ac.createGain();
  wlg.gain.value = 0.012;
  wlfo.connect(wlg);
  wlg.connect(wg.gain);
  wlfo.start(now);

  /* 溪流：带通噪声 */
  const streamSrc = ac.createBufferSource();
  streamSrc.buffer = buf;
  streamSrc.loop = true;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2200;
  bp.Q.value = 1.0;

  const sg = ac.createGain();
  sg.gain.value = 0.007;

  streamSrc.connect(bp);
  bp.connect(sg);
  sg.connect(masterGain);
  streamSrc.start(now);

  const slfo = ac.createOscillator();
  slfo.frequency.value = 0.13;
  const slg = ac.createGain();
  slg.gain.value = 500;
  slfo.connect(slg);
  slg.connect(bp.frequency);
  slfo.start(now);

  /* 草地虫鸣底噪 */
  const grassSrc = ac.createBufferSource();
  grassSrc.buffer = buf;
  grassSrc.loop = true;

  const gb = ac.createBiquadFilter();
  gb.type = 'bandpass';
  gb.frequency.value = 4600;
  gb.Q.value = 3.5;

  const gg = ac.createGain();
  gg.gain.value = 0.0035;

  grassSrc.connect(gb);
  gb.connect(gg);
  gg.connect(masterGain);
  grassSrc.start(now);
}

/* ---- 鸟鸣 ---- */
function playBird(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = 2 + Math.floor(Math.random() * 3);
  const baseF = 2200 + Math.random() * 1400;

  for (let i = 0; i < notes; i++){
    const t0 = now + i * (0.09 + Math.random() * 0.06);

    const osc = ac.createOscillator();
    osc.type = 'sine';
    const f1 = baseF * (0.86 + Math.random() * 0.28);
    osc.frequency.setValueAtTime(f1, t0);
    osc.frequency.exponentialRampToValueAtTime(f1 * 1.42, t0 + 0.045);
    osc.frequency.exponentialRampToValueAtTime(f1 * 0.92, t0 + 0.10);

    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.014, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0004, t0 + 0.12);

    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + 0.15);
  }
}

function scheduleBirds(){
  const wait = 1400 + Math.random() * 3600;
  birdTimer = setTimeout(function(){
    if (Math.random() < 0.62) playBird();
    scheduleBirds();
  }, wait);
}

/* ---- 捕食者低吼 ---- */
function playGrowl(intensity){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sawtooth';
  const f0 = 58 + Math.random() * 22;
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f0 * 0.62, now + 0.55);

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(520, now);
  lp.frequency.exponentialRampToValueAtTime(220, now + 0.55);
  lp.Q.value = 4.2;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.055 * intensity, now + 0.045);
  g.gain.setValueAtTime(0.055 * intensity, now + 0.32);
  g.gain.exponentialRampToValueAtTime(0.0005, now + 0.68);

  /* 轻微颤音 */
  const vib = ac.createOscillator();
  vib.frequency.value = 9;
  const vg = ac.createGain();
  vg.gain.value = 4;
  vib.connect(vg);
  vg.connect(osc.frequency);
  vib.start(now);
  vib.stop(now + 0.7);

  osc.connect(lp);
  lp.connect(g);
  g.connect(masterGain);

  osc.start(now);
  osc.stop(now + 0.72);
}

function scheduleGrowls(){
  const wait = 6000 + Math.random() * 9000;
  growlTimer = setTimeout(function(){
    /* 只有捕食者数量足够时才偶尔吼 */
    const eq = equilibrium();
    if (P > eq.P * 0.4 && Math.random() < 0.55){
      playGrowl(0.5 + Math.random() * 0.5);
    }
    scheduleGrowls();
  }, wait);
}

/* =========================================================
   绘制工具
   ========================================================= */
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

/* =========================================================
   绘制相位图
   ========================================================= */
function drawPhase(){
  const { x, y, w, h } = phaseRect;

  ctx.fillStyle = 'rgba(6, 14, 10, 0.72)';
  roundRect(ctx, x, y, w, h, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 180, 130, 0.20)';
  ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, h, 12);
  ctx.stroke();

  const pl = 42, pr = 16, pt = 30, pb = 30;
  const gx = x + pl, gy = y + pt;
  const gw = w - pl - pr, gh = h - pt - pb;

  /* 确定范围 */
  const eq = equilibrium();
  const maxN = Math.max(eq.N * 2.4, 10);
  const maxP = Math.max(eq.P * 2.4, 6);

  /* 背景网格 */
  ctx.strokeStyle = 'rgba(90, 180, 130, 0.08)';
  for (let i = 0; i <= 4; i++){
    const yy = gy + gh * i / 4;
    ctx.beginPath();
    ctx.moveTo(gx, yy);
    ctx.lineTo(gx + gw, yy);
    ctx.stroke();
    const xx = gx + gw * i / 4;
    ctx.beginPath();
    ctx.moveTo(xx, gy);
    ctx.lineTo(xx, gy + gh);
    ctx.stroke();
  }

  /* 零增长等值线：猎物零增长 P = α/β，捕食者零增长 N = γ/δ */
  ctx.setLineDash([4, 5]);
  ctx.strokeStyle = 'rgba(130, 220, 160, 0.28)';
  ctx.lineWidth = 1.2;
  const yP = gy + gh - Math.min(1, (params.alpha / params.beta) / maxP) * gh;
  ctx.beginPath();
  ctx.moveTo(gx, yP);
  ctx.lineTo(gx + gw, yP);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255, 150, 90, 0.26)';
  const xN = gx + Math.min(1, (params.gamma / params.delta) / maxN) * gw;
  ctx.beginPath();
  ctx.moveTo(xN, gy);
  ctx.lineTo(xN, gy + gh);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 平衡点 */
  const bx = gx + Math.min(1, eq.N / maxN) * gw;
  const by = gy + gh - Math.min(1, eq.P / maxP) * gh;
  ctx.beginPath();
  ctx.arc(bx, by, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 245, 180, 0.85)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(bx, by, 9 + 2 * Math.sin(simTime * 2.5), 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 245, 180, ' + (0.28 + 0.14 * Math.sin(simTime * 2.5)) + ')';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 轨迹 */
  if (phaseHistory.length > 1){
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < phaseHistory.length; i++){
      const u = i / phaseHistory.length;
      const a = u * u * 0.58;

      const p0 = phaseHistory[i - 1];
      const p1 = phaseHistory[i];

      const x0 = gx + Math.min(1, p0.n / maxN) * gw;
      const y0 = gy + gh - Math.min(1, p0.p / maxP) * gh;
      const x1 = gx + Math.min(1, p1.n / maxN) * gw;
      const y1 = gy + gh - Math.min(1, p1.p / maxP) * gh;

      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.strokeStyle = 'rgba(140, 240, 180, ' + a + ')';
      ctx.lineWidth = u * 1.8 + 0.5;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 当前位置 */
  const cx0 = gx + Math.min(1, N / maxN) * gw;
  const cy0 = gy + gh - Math.min(1, P / maxP) * gh;

  ctx.globalCompositeOperation = 'lighter';
  const hg = ctx.createRadialGradient(cx0, cy0, 0, cx0, cy0, 22);
  hg.addColorStop(0.00, 'rgba(200, 255, 220, 0.85)');
  hg.addColorStop(0.32, 'rgba(130, 240, 180, 0.30)');
  hg.addColorStop(1.00, 'rgba(90, 200, 140, 0)');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(cx0, cy0, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.beginPath();
  ctx.arc(cx0, cy0, 4.2, 0, Math.PI * 2);
  ctx.fillStyle = '#e8fff0';
  ctx.fill();

  /* 标题与轴标签 */
  ctx.font = '8.5px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(150, 220, 180, 0.46)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('相平面 · PHASE PORTRAIT', x + 12, y + 10);

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(130, 230, 160, 0.62)';
  ctx.fillText('猎物 N →', gx + gw * 0.5, gy + gh + 8);

  ctx.save();
  ctx.translate(x + 12, gy + gh * 0.5);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = 'rgba(255, 160, 100, 0.62)';
  ctx.fillText('捕食者 P →', 0, 0);
  ctx.restore();

  /* 轴数值 */
  ctx.font = '7.5px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(140, 200, 170, 0.34)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('0', gx, gy + gh + 8);
  ctx.fillText(Math.round(maxN), gx + gw, gy + gh + 8);

  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.round(maxP), gx - 6, gy);
  ctx.fillText('0', gx - 6, gy + gh);
}

/* =========================================================
   绘制时间序列
   ========================================================= */
function drawTimeSeries(){
  const { x, y, w, h } = timeRect;

  ctx.fillStyle = 'rgba(6, 14, 10, 0.72)';
  roundRect(ctx, x, y, w, h, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 180, 130, 0.20)';
  ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, h, 12);
  ctx.stroke();

  const pl = 34, pr = 14, pt = 26, pb = 22;
  const gx = x + pl, gy = y + pt;
  const gw = w - pl - pr, gh = h - pt - pb;

  ctx.strokeStyle = 'rgba(90, 180, 130, 0.09)';
  for (let i = 0; i <= 3; i++){
    const yy = gy + gh * i / 3;
    ctx.beginPath();
    ctx.moveTo(gx, yy);
    ctx.lineTo(gx + gw, yy);
    ctx.stroke();
  }

  /* 标题 */
  ctx.font = '8.5px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(150, 220, 180, 0.46)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('时间序列 · TIME SERIES', x + 12, y + 9);

  if (timeHistory.length > 1){
    const eq = equilibrium();
    const maxV = Math.max(
      eq.N * 2.4,
      eq.P * 2.4,
      N * 1.5,
      P * 1.5,
      6
    );

    const tMin = timeHistory[0].t;
    const tMax = timeHistory[timeHistory.length - 1].t;
    const tRange = Math.max(1, tMax - tMin);

    /* 猎物曲线 */
    ctx.beginPath();
    for (let i = 0; i < timeHistory.length; i++){
      const hh = timeHistory[i];
      const xx = gx + ((hh.t - tMin) / tRange) * gw;
      const yy = gy + gh - Math.min(1, hh.n / maxV) * gh;
      if (i === 0) ctx.moveTo(xx, yy);
      else ctx.lineTo(xx, yy);
    }
    ctx.strokeStyle = 'rgba(130, 240, 140, 0.92)';
    ctx.lineWidth = 1.9;
    ctx.lineJoin = 'round';
    ctx.stroke();

    /* 猎物填充 */
    ctx.lineTo(gx + gw, gy + gh);
    ctx.lineTo(gx, gy + gh);
    ctx.closePath();
    const gN = ctx.createLinearGradient(0, gy, 0, gy + gh);
    gN.addColorStop(0.00, 'rgba(130, 240, 140, 0.14)');
    gN.addColorStop(1.00, 'rgba(130, 240, 140, 0.01)');
    ctx.fillStyle = gN;
    ctx.fill();

    /* 捕食者曲线 */
    ctx.beginPath();
    for (let i = 0; i < timeHistory.length; i++){
      const hh = timeHistory[i];
      const xx = gx + ((hh.t - tMin) / tRange) * gw;
      const yy = gy + gh - Math.min(1, hh.p / maxV) * gh;
      if (i === 0) ctx.moveTo(xx, yy);
      else ctx.lineTo(xx, yy);
    }
    ctx.strokeStyle = 'rgba(255, 150, 90, 0.92)';
    ctx.lineWidth = 1.9;
    ctx.stroke();

    /* 捕食者填充 */
    ctx.lineTo(gx + gw, gy + gh);
    ctx.lineTo(gx, gy + gh);
    ctx.closePath();
    const gP = ctx.createLinearGradient(0, gy, 0, gy + gh);
    gP.addColorStop(0.00, 'rgba(255, 150, 90, 0.14)');
    gP.addColorStop(1.00, 'rgba(255, 150, 90, 0.01)');
    ctx.fillStyle = gP;
    ctx.fill();

    /* 图例 */
    ctx.font = '8px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    ctx.fillStyle = 'rgba(130, 240, 140, 0.90)';
    ctx.beginPath();
    ctx.arc(gx + 8, gy + 7, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(180, 230, 195, 0.62)';
    ctx.fillText('N', gx + 15, gy + 2);

    ctx.fillStyle = 'rgba(255, 150, 90, 0.90)';
    ctx.beginPath();
    ctx.arc(gx + 40, gy + 7, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(220, 200, 180, 0.62)';
    ctx.fillText('P', gx + 47, gy + 2);
  }
}

/* =========================================================
   绘制粒子场（生态系统可视化）
   ========================================================= */
function drawField(dt){
  const { x, y, w, h } = fieldRect;

  /* 草地背景 */
  const bg = ctx.createLinearGradient(0, y, 0, y + h);
  bg.addColorStop(0.00, 'rgba(8, 26, 14, 0.86)');
  bg.addColorStop(1.00, 'rgba(4, 14, 8, 0.94)');
  ctx.fillStyle = bg;
  roundRect(ctx, x, y, w, h, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 180, 130, 0.16)';
  ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, h, 12);
  ctx.stroke();

  /* 草叶 */
  const eq = equilibrium();
  const preyRatio = Math.min(1.4, N / Math.max(1, eq.N));
  const grassCount = 90;
  ctx.strokeStyle = 'rgba(80, 170, 110, ' + (0.07 + 0.10 * Math.min(1, preyRatio)) + ')';
  ctx.lineWidth = 1;
  for (let i = 0; i < grassCount; i++){
    const gx0 = x + (i / grassCount) * w + Math.sin(i * 1.7) * 6;
    const gy0 = y + h - 4;
    const gh0 = 8 + ((i * 37) % 16);
    const sway = Math.sin(simTime * 1.3 + i * 0.7) * 2.2;
    ctx.beginPath();
    ctx.moveTo(gx0, gy0);
    ctx.quadraticCurveTo(gx0 + sway * 0.5, gy0 - gh0 * 0.6, gx0 + sway, gy0 - gh0);
    ctx.stroke();
  }

  /* 更新与绘制粒子 */
  const eqN = Math.max(1, equilibrium().N);
  const eqP = Math.max(1, equilibrium().P);

  /* 目标数量 */
  const targetPrey = Math.min(140, Math.round((N / (eqN * 2.2)) * 110));
  const targetPred = Math.min(45, Math.round((P / (eqP * 2.2)) * 38));

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];

    /* 活动强度 */
    const actSpeed = p.type === 0
      ? p.speed * (1 + Math.min(1, preyRatio) * 0.35)
      : p.speed * (1 + Math.min(1.4, P / Math.max(1, eqP)) * 0.4);

    /* 猎物避开捕食者，捕食者追逐猎物 */
    let fx = 0, fy = 0;

    if (p.type === 0){
      /* 逃离最近的捕食者 */
      let nearest = null, nd = 1e9;
      for (let j = 0; j < particles.length; j++){
        const q = particles[j];
        if (q.type !== 1) continue;
        const dx = q.x - p.x;
        const dy = q.y - p.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < nd){ nd = d2; nearest = { dx: dx, dy: dy }; }
      }
      if (nearest && nd < 0.08){
        fx -= nearest.dx * 12;
        fy -= nearest.dy * 12;
      }
    } else {
      /* 追向最近的猎物 */
      let nearest = null, nd = 1e9;
      for (let j = 0; j < particles.length; j++){
        const q = particles[j];
        if (q.type !== 0) continue;
        const dx = q.x - p.x;
        const dy = q.y - p.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < nd){ nd = d2; nearest = { dx: dx, dy: dy }; }
      }
      if (nearest && nd < 0.5){
        fx += nearest.dx * 5;
        fy += nearest.dy * 5;
      }
    }

    /* 边界推回 */
    if (p.x < 0.03) fx += 0.9;
    if (p.x > 0.97) fx -= 0.9;
    if (p.y < 0.10) fy += 0.9;
    if (p.y > 0.90) fy -= 0.9;

    p.vx += fx * dt;
    p.vy += fy * dt;

    /* 随机游走 */
    p.vx += (Math.random() - 0.5) * 0.6 * dt;
    p.vy += (Math.random() - 0.5) * 0.6 * dt;

    /* 阻尼 */
    p.vx *= 0.965;
    p.vy *= 0.965;

    /* 限制速度 */
    const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    const maxSp = actSpeed * 0.05;
    if (sp > maxSp){
      p.vx = p.vx / sp * maxSp;
      p.vy = p.vy / sp * maxSp;
    }

    p.x += p.vx * dt * 2.5;
    p.y += p.vy * dt * 2.5;

    /* 边界夹紧 */
    if (p.x < 0.02) p.x = 0.02;
    if (p.x > 0.98) p.x = 0.98;
    if (p.y < 0.10) p.y = 0.10;
    if (p.y > 0.92) p.y = 0.92;

    /* 绘制 */
    const px = x + p.x * w;
    const py = y + p.y * h;
    const size = p.type === 0
      ? Math.max(1.6, Math.min(4.2, (w / 520) * 4 * p.size))
      : Math.max(2.6, Math.min(7.0, (w / 520) * 6.5 * p.size));

    if (p.type === 0){
      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      const gg = ctx.createRadialGradient(px - size * 0.3, py - size * 0.3, 0, px, py, size);
      gg.addColorStop(0.00, 'rgba(220, 255, 200, 0.98)');
      gg.addColorStop(0.55, 'rgba(130, 230, 130, 0.94)');
      gg.addColorStop(1.00, 'rgba(70, 160, 90, 0.80)');
      ctx.fillStyle = gg;
      ctx.fill();
    } else {
      ctx.globalCompositeOperation = 'lighter';
      const hg = ctx.createRadialGradient(px, py, 0, px, py, size * 3.6);
      hg.addColorStop(0.00, 'rgba(255, 210, 150, 0.52)');
      hg.addColorStop(0.42, 'rgba(255, 130, 70, 0.20)');
      hg.addColorStop(1.00, 'rgba(220, 80, 30, 0)');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(px, py, size * 3.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      const pg = ctx.createRadialGradient(px - size * 0.3, py - size * 0.3, 0, px, py, size);
      pg.addColorStop(0.00, 'rgba(255, 240, 210, 0.98)');
      pg.addColorStop(0.45, 'rgba(255, 160, 90, 0.94)');
      pg.addColorStop(1.00, 'rgba(200, 70, 30, 0.86)');
      ctx.fillStyle = pg;
      ctx.fill();

      /* 眼睛 */
      ctx.fillStyle = 'rgba(30, 10, 5, 0.92)';
      ctx.beginPath();
      ctx.arc(px - size * 0.28, py - size * 0.20, size * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px + size * 0.28, py - size * 0.20, size * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* 标签 */
  ctx.font = '8.5px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(150, 220, 180, 0.46)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('生态场 · ECOSYSTEM FIELD', x + 12, y + 9);

  /* 数量标签 */
  ctx.textAlign = 'right';
  ctx.font = '8.5px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(150, 240, 160, 0.72)';
  ctx.fillText('猎物 ' + targetPrey, x + w - 12, y + 9);
  ctx.fillStyle = 'rgba(255, 170, 110, 0.72)';
  ctx.fillText('捕食者 ' + targetPred, x + w - 12, y + 22);
}

/* =========================================================
   主循环
   ========================================================= */
const SIM_DT = 0.004;
let accum = 0;
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let realDt = (now - lastT) / 1000;
  lastT = now;
  if (realDt > 0.05) realDt = 0.05;

  /* 固定步长积分 */
  if (running){
    accum += realDt;
    let steps = 0;
    while (accum >= SIM_DT && steps < 30){
      step(SIM_DT);
      accum -= SIM_DT;
      steps++;
    }
    if (steps >= 30) accum = 0;
  }

  /* ---- 背景 ---- */
  ctx.fillStyle = '#040a06';
  ctx.fillRect(0, 0, W, H);

  const bgG = ctx.createRadialGradient(
    W * 0.5, H * 0.45, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.82
  );
  bgG.addColorStop(0.00, 'rgba(14, 34, 22, 0.34)');
  bgG.addColorStop(0.50, 'rgba(8, 20, 14, 0.14)');
  bgG.addColorStop(1.00, 'rgba(2, 6, 4, 0)');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  drawField(realDt);
  drawPhase();
  drawTimeSeries();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.32,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.76
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 6, 4, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 2, 1, 0.82)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  updateHUD();
}

/* =========================================================
   HUD
   ========================================================= */
let hudTick = 0;

function updateHUD(){
  hudTick++;
  if (hudTick % 5 !== 0) return;

  const pv = document.getElementById('preyVal');
  const pd = document.getElementById('predVal');
  const tv = document.getElementById('tVal');
  if (pv) pv.textContent = N.toFixed(1);
  if (pd) pd.textContent = P.toFixed(1);
  if (tv) tv.textContent = simTime.toFixed(1);

  const phaseEl = document.getElementById('phaseVal');
  const stateBig = document.getElementById('stateBig');
  const stateEn = document.getElementById('stateEn');

  const eq = equilibrium();
  const nRatio = N / Math.max(0.001, eq.N);
  const pRatio = P / Math.max(0.001, eq.P);

  if (phaseEl){
    let ph = '平衡';
    if (N < 0.6 || P < 0.4){
      ph = '濒危';
    } else if (nRatio > 2.4 || pRatio > 2.4){
      ph = '过载';
    } else if (nRatio > 1.55 && pRatio > 1.55){
      ph = '剧增';
    } else if (nRatio < 0.55 && pRatio < 0.55){
      ph = '低谷';
    } else if (Math.abs(nRatio - 1) < 0.20 && Math.abs(pRatio - 1) < 0.20){
      ph = '平衡';
    } else {
      ph = '震荡';
    }
    phaseEl.textContent = ph;
  }

  if (stateBig && stateEn){
    let big = '生 机', en = 'EQUILIBRIUM', col = 'rgba(180,245,200,.88)';

    if (N < 0.6 || P < 0.4){
      big = '崩 溃'; en = 'COLLAPSE'; col = 'rgba(255, 120, 120, 0.92)';
    } else if (nRatio > 2.2 || pRatio > 2.2){
      big = '过 载'; en = 'OVERLOAD'; col = 'rgba(255, 200, 130, 0.92)';
    } else if (Math.abs(nRatio - 1) < 0.20 && Math.abs(pRatio - 1) < 0.20){
      big = '生 机'; en = 'EQUILIBRIUM'; col = 'rgba(180,245,200,.88)';
    } else {
      big = '震 荡'; en = 'OSCILLATING'; col = 'rgba(200, 230, 180, 0.88)';
    }

    if (stateBig.textContent !== big){
      stateBig.textContent = big;
      stateEn.textContent = en;
    }
    stateBig.style.color = col;
  }
}

/* =========================================================
   交互
   ========================================================= */
function bindSlider(id, key, digits){
  const slider = document.getElementById(id);
  const label = document.getElementById(id + 'Val');

  slider.addEventListener('input', function(e){
    params[key] = parseFloat(e.target.value);
    if (label) label.textContent = params[key].toFixed(digits);
    clearPresetActive();
  });
  if (label) label.textContent = params[key].toFixed(digits);
}

bindSlider('alpha', 'alpha', 2);
bindSlider('beta',  'beta', 3);
bindSlider('gamma', 'gamma', 2);
bindSlider('delta', 'delta', 3);

function setSliders(){
  document.getElementById('alpha').value = params.alpha;
  document.getElementById('beta').value  = params.beta;
  document.getElementById('gamma').value = params.gamma;
  document.getElementById('delta').value = params.delta;
  document.getElementById('alphaVal').textContent = params.alpha.toFixed(2);
  document.getElementById('betaVal').textContent  = params.beta.toFixed(3);
  document.getElementById('gammaVal').textContent = params.gamma.toFixed(2);
  document.getElementById('deltaVal').textContent = params.delta.toFixed(3);
}

function clearPresetActive(){
  document.querySelectorAll('[id^="preset"]').forEach(function(b){
    b.classList.remove('active');
  });
}

/* 首次点击启动音频 */
window.addEventListener('pointerdown', initAudio);
window.addEventListener('keydown', function(e){
  if (e.key === ' '){
    e.preventDefault();
    initAudio();
    running = !running;
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    initEcosystem();
  }
});

/* =========================================================
   启动
   ========================================================= */
layout();
initEcosystem();
requestAnimationFrame(loop);

})();
