<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein瓶 · 希尔伯特填充曲线</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Klein瓶 · 希尔伯特填充曲线</h2>
        <div class="sub">Klein bottle immersion · 3D Hilbert space‑filling curve</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">Klein: x=(a+cos(u/2)sin v - sin(u/2)sin2v)cos u ...</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">Hilbert³: 递归分形填充 [0,1]³</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">拓扑浸入 · 空间填充 · 测地交织</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 30);
        camera.position.set(3.8, 2.4, 9.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        clock.start();

        // ---------- 颜色 ----------
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // ---------- 工具函数：生成 Klein 瓶的点 ----------
        function kleinPoint(u, v, a = 2.2) {
            const halfU = u * 0.5;
            const cosHalfU = Math.cos(halfU);
            const sinHalfU = Math.sin(halfU);
            const sinV = Math.sin(v);
            const sin2V = Math.sin(2 * v);
            const cosU = Math.cos(u);
            const sinU = Math.sin(u);

            const fx = a + cosHalfU * sinV - sinHalfU * sin2V;
            return new THREE.Vector3(
                fx * cosU,
                fx * sinU,
                sinHalfU * sinV + cosHalfU * sin2V
            );
        }

        // ---------- 创建 Klein 瓶线框（u线、v线、斜线）----------
        function createKleinWireframe(a, uSteps, vSteps, colors) {
            const group = new THREE.Group();

            // 1. u-曲线（固定 v，变化 u）
            const uRange = 2 * Math.PI;
            const vRange = 2 * Math.PI;
            const uSamples = uSteps + 1;
            const vSamples = vSteps + 1;

            const uValues = [];
            const du = uRange / uSteps;
            for (let i = 0; i <= uSteps; i++) uValues.push(i * du);

            const vValues = [];
            const dv = vRange / vSteps;
            for (let i = 0; i <= vSteps; i++) vValues.push(i * dv);

            // 构建 u-曲线线段（每个固定v）
            function buildULines(color, opacity = 0.7) {
                const totalSegments = vValues.length * (uValues.length - 1);
                const positions = new Float32Array(totalSegments * 2 * 3);
                let idx = 0;
                for (const v of vValues) {
                    for (let i = 0; i < uValues.length - 1; i++) {
                        const u1 = uValues[i];
                        const u2 = uValues[i + 1];
                        const p1 = kleinPoint(u1, v, a);
                        const p2 = kleinPoint(u2, v, a);
                        positions[idx++] = p1.x; positions[idx++] = p1.y; positions[idx++] = p1.z;
                        positions[idx++] = p2.x; positions[idx++] = p2.y; positions[idx++] = p2.z;
                    }
                }
                const geom = new THREE.BufferGeometry();
                geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const mat = new THREE.LineBasicMaterial({
                    color: color,
                    linewidth: 1,
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                    depthTest: true,
                });
                return new THREE.LineSegments(geom, mat);
            }

            // 构建 v-曲线线段（每个固定u）
            function buildVLines(color, opacity = 0.6) {
                const totalSegments = uValues.length * (vValues.length - 1);
                const positions = new Float32Array(totalSegments * 2 * 3);
                let idx = 0;
                for (const u of uValues) {
                    for (let i = 0; i < vValues.length - 1; i++) {
                        const v1 = vValues[i];
                        const v2 = vValues[i + 1];
                        const p1 = kleinPoint(u, v1, a);
                        const p2 = kleinPoint(u, v2, a);
                        positions[idx++] = p1.x; positions[idx++] = p1.y; positions[idx++] = p1.z;
                        positions[idx++] = p2.x; positions[idx++] = p2.y; positions[idx++] = p2.z;
                    }
                }
                const geom = new THREE.BufferGeometry();
                geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const mat = new THREE.LineBasicMaterial({
                    color: color,
                    linewidth: 1,
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                    depthTest: true,
                });
                return new THREE.LineSegments(geom, mat);
            }

            // 构建斜线（u = t, v = k * t + phase）
            function buildSlantedLines(count, color, opacity = 0.55) {
                const pointsPerLine = 600;
                const totalPoints = count * pointsPerLine;
                const allLines = new THREE.Group();
                for (let i = 0; i < count; i++) {
                    const k = 1.2 + i * 0.35;
                    const phase = (i * Math.PI) / 3;
                    const pts = [];
                    const dt = (4 * Math.PI) / pointsPerLine;
                    for (let j = 0; j <= pointsPerLine; j++) {
                        const t = j * dt;
                        const v = k * t + phase;
                        pts.push(kleinPoint(t, v, a));
                    }
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color: color,
                        linewidth: 1,
                        transparent: true,
                        opacity: opacity,
                        depthTest: true,
                        depthWrite: true,
                    });
                    allLines.add(new THREE.Line(geom, mat));
                }
                return allLines;
            }

            // 金色：u-曲线
            group.add(buildULines(colors.gold, 0.72));
            // 青色：v-曲线
            group.add(buildVLines(colors.cyan, 0.65));
            // 品红：斜线
            group.add(buildSlantedLines(12, colors.magenta, 0.5));

            return group;
        }

        // 创建 Klein 瓶实例
        const kleinGroup = new THREE.Group();
        kleinGroup.name = 'klein-bottle';
        const kleinWire = createKleinWireframe(2.2, 110, 70, {
            gold: COLOR_GOLD,
            cyan: COLOR_CYAN,
            magenta: COLOR_MAGENTA
        });
        kleinGroup.add(kleinWire);
        scene.add(kleinGroup);

        // ---------- 3D 希尔伯特曲线 ----------
        function generateHilbert3D(order) {
            // 经典3D希尔伯特曲线算法（迭代生成点序列）
            const points = [];
            const size = Math.pow(2, order);

            // 辅助递归函数
            function walk(dx, dy, dz, s, rx, ry, rz) {
                if (s === 0) {
                    points.push(new THREE.Vector3(
                        (dx / size - 0.5) * 3.8,
                        (dy / size - 0.5) * 3.8,
                        (dz / size - 0.5) * 3.8
                    ));
                    return;
                }
                const half = Math.pow(2, s - 1);
                // 旋转/反射由rx,ry,rz控制，这里采用标准Hilbert3D生成器逻辑
                // 为了简洁，我们使用已包含正确方向传递的简化版本
                // 实际上实现的Hilbert3D需根据方向参数变化
                // 这里采用已知的递归公式（来自Hilbert curve 3D）
                if (rx === 0 && ry === 0 && rz === 0) {
                    walk(dx, dy, dz, s - 1, 1, 0, 0);
                    walk(dx + half, dy, dz, s - 1, 1, 0, 0);
                    walk(dx + half, dy, dz + half, s - 1, 1, 0, 0);
                    walk(dx, dy, dz + half, s - 1, 0, 0, 1);
                    walk(dx, dy + half, dz + half, s - 1, 0, 0, 1);
                    walk(dx + half, dy + half, dz + half, s - 1, 0, 0, 1);
                    walk(dx + half, dy + half, dz, s - 1, 1, 1, 0);
                    walk(dx, dy + half, dz, s - 1, 1, 1, 0);
                } else if (rx === 1 && ry === 0 && rz === 0) {
                    walk(dx, dy, dz, s - 1, 0, 0, 0);
                    walk(dx + half, dy, dz, s - 1, 1, 0, 0);
                    walk(dx + half, dy + half, dz, s - 1, 1, 0, 0);
                    walk(dx, dy + half, dz, s - 1, 1, 0, 1);
                    walk(dx, dy + half, dz + half, s - 1, 1, 0, 1);
                    walk(dx + half, dy + half, dz + half, s - 1, 0, 0, 1);
                    walk(dx + half, dy, dz + half, s - 1, 0, 1, 0);
                    walk(dx, dy, dz + half, s - 1, 0, 1, 0);
                } else if (rx === 0 && ry === 0 && rz === 1) {
                    walk(dx, dy, dz, s - 1, 0, 0, 0);
                    walk(dx, dy + half, dz, s - 1, 0, 0, 0);
                    walk(dx, dy + half, dz + half, s - 1, 0, 0, 0);
                    walk(dx, dy, dz + half, s - 1, 1, 0, 0);
                    walk(dx + half, dy, dz + half, s - 1, 1, 0, 0);
                    walk(dx + half, dy + half, dz + half, s - 1, 1, 0, 0);
                    walk(dx + half, dy + half, dz, s - 1, 1, 1, 0);
                    walk(dx + half, dy, dz, s - 1, 1, 1, 0);
                } else if (rx === 1 && ry === 0 && rz === 1) {
                    walk(dx, dy, dz, s - 1, 0, 0, 0);
                    walk(dx + half, dy, dz, s - 1, 0, 0, 0);
                    walk(dx + half, dy + half, dz, s - 1, 0, 0, 0);
                    walk(dx, dy + half, dz, s - 1, 1, 0, 0);
                    walk(dx, dy + half, dz + half, s - 1, 1, 0, 0);
                    walk(dx + half, dy + half, dz + half, s - 1, 0, 0, 1);
                    walk(dx + half, dy, dz + half, s - 1, 0, 1, 0);
                    walk(dx, dy, dz + half, s - 1, 0, 1, 0);
                } else if (rx === 0 && ry === 1 && rz === 0) {
                    walk(dx, dy, dz, s - 1, 0, 0, 0);
                    walk(dx, dy, dz + half, s - 1, 0, 0, 0);
                    walk(dx, dy + half, dz + half, s - 1, 0, 0, 0);
                    walk(dx, dy + half, dz, s - 1, 0, 1, 0);
                    walk(dx + half, dy + half, dz, s - 1, 0, 1, 0);
                    walk(dx + half, dy + half, dz + half, s - 1, 0, 1, 0);
                    walk(dx + half, dy, dz + half, s - 1, 1, 1, 0);
                    walk(dx + half, dy, dz, s - 1, 1, 1, 0);
                } else if (rx === 1 && ry === 1 && rz === 0) {
                    walk(dx, dy, dz, s - 1, 0, 0, 0);
                    walk(dx + half, dy, dz, s - 1, 0, 0, 0);
                    walk(dx + half, dy, dz + half, s - 1, 0, 0, 0);
                    walk(dx, dy, dz + half, s - 1, 0, 1, 0);
                    walk(dx, dy + half, dz + half, s - 1, 0, 1, 0);
                    walk(dx + half, dy + half, dz + half, s - 1, 1, 1, 0);
                    walk(dx + half, dy + half, dz, s - 1, 1, 1, 0);
                    walk(dx, dy + half, dz, s - 1, 1, 1, 0);
                }
            }

            walk(0, 0, 0, order, 0, 0, 0);
            return points;
        }

        const hilbertOrder = 4;
        const hilbertPoints = generateHilbert3D(hilbertOrder);
        console.log('希尔伯特曲线点数:', hilbertPoints.length);

        // 将希尔伯特曲线分段，用三种颜色交替
        const hilbertGroup = new THREE.Group();
        hilbertGroup.name = 'hilbert-curve';
        const segColors = [COLOR_GOLD, COLOR_CYAN, COLOR_MAGENTA];
        const segLength = 60; // 每段线段数
        for (let start = 0; start < hilbertPoints.length - 1; start += segLength) {
            const end = Math.min(start + segLength, hilbertPoints.length - 1);
            const segmentPts = hilbertPoints.slice(start, end + 1);
            const geom = new THREE.BufferGeometry().setFromPoints(segmentPts);
            const mat = new THREE.LineBasicMaterial({
                color: segColors[(Math.floor(start / segLength)) % 3],
                linewidth: 1,
                transparent: true,
                opacity: 0.7,
                depthTest: true,
                depthWrite: true,
            });
            hilbertGroup.add(new THREE.Line(geom, mat));
        }
        scene.add(hilbertGroup);

        // ---------- 背景星点 ----------
        const starsGroup = new THREE.Group();
        starsGroup.name = 'stars';
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 10;
            starsPositions[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPositions[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPositions[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.5,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---------- 动画循环 ----------
        function animate() {
            const elapsed = clock.getElapsedTime();

            // Klein瓶组旋转
            kleinGroup.rotation.x = elapsed * 0.23;
            kleinGroup.rotation.y = elapsed * 0.35;
            kleinGroup.rotation.z = elapsed * 0.17;

            // 希尔伯特曲线组独立旋转
            hilbertGroup.rotation.x = elapsed * 0.19;
            hilbertGroup.rotation.y = elapsed * 0.28;
            hilbertGroup.rotation.z = elapsed * 0.22;

            // 背景星点
            starsGroup.rotation.y = elapsed * 0.04;
            starsGroup.rotation.x = elapsed * 0.025;

            // 相机动态环绕
            const camRadius = 9.0;
            const camAngle = elapsed * 0.1;
            const camHeight = 2.8 + Math.sin(elapsed * 0.17) * 0.9;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // 使用Three.js内置动画循环，防止卡死
        renderer.setAnimationLoop(animate);

        // ---------- 窗口缩放 ----------
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
        onResize();

        console.log('✨ Klein瓶 + 3D希尔伯特曲线动画已启动');
    </script>
</body>
</html>
