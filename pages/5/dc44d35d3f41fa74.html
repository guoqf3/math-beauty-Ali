<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单叶双曲面 · 直母线交织</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 72px rgba(170,150,130,0.22);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.85vw, 0.64rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 16px rgba(155,145,125,0.32);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.16);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.38rem, 0.7vw, 0.56rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">单叶双曲面 · 直母线交织</div>
        <div class="subtitle">HYPERBOLOID OF ONE SHEET &nbsp;·&nbsp; RULED SURFACE</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">ℓ⁺:</span> x=cosθ−t sinθ, y=sinθ+t cosθ, z=t &nbsp;
            <span class="c2">ℓ⁻:</span> x=cosθ+t sinθ, y=sinθ−t cosθ, z=t
            <br>
            <span class="c3">ε:</span> x²+y²=1+z², z=z₀ &nbsp;|&nbsp; R≈2.8, 缩放裁剪 | 绝对时间驱动
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 20);

        const camera = new THREE.PerspectiveCamera(
            52,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            24
        );
        camera.position.set(1.6, 0.9, 7.0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c'; // 暖金 – 族A直母线
        const C2 = '#5d9ec6'; // 冰蓝 – 族B直母线
        const C3 = '#c77d9f'; // 玫瑰粉 – 椭圆截线
        const C_SPHERE = '#3a4a5c';
        const C_GLINT = '#8898aa';

        const MAX_R = 2.8;
        const SCALE = 0.78; // 缩放系数
        const T_MIN = -3.2;
        const T_MAX = 3.2;
        const NUM_RULINGS = 32; // 每族直线数量
        const SAMPLES_PER_LINE = 100; // 每条直线采样点数

        // ==================== 生成直母线族 ====================
        function generateRulings(sign) {
            const group = new THREE.Group();
            const dTheta = (Math.PI * 2) / NUM_RULINGS;
            for (let k = 0; k < NUM_RULINGS; k++) {
                const theta = k * dTheta;
                const cosT = Math.cos(theta);
                const sinT = Math.sin(theta);
                const pts = [];
                const dt = (T_MAX - T_MIN) / SAMPLES_PER_LINE;
                for (let i = 0; i <= SAMPLES_PER_LINE; i++) {
                    const t = T_MIN + i * dt;
                    let x, y, z;
                    if (sign > 0) {
                        // 族A: x = cosθ - t sinθ, y = sinθ + t cosθ, z = t
                        x = cosT - t * sinT;
                        y = sinT + t * cosT;
                        z = t;
                    } else {
                        // 族B: x = cosθ + t sinθ, y = sinθ - t cosθ, z = t
                        x = cosT + t * sinT;
                        y = sinT - t * cosT;
                        z = t;
                    }
                    pts.push(new THREE.Vector3(x * SCALE, y * SCALE, z * SCALE));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(sign > 0 ? C1 : C2),
                    transparent: true,
                    opacity: 0.6,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // ==================== 生成椭圆截线族 (固定z, 圆) ====================
        function generateEllipseSlices() {
            const group = new THREE.Group();
            const zValues = [];
            const numSlices = 22;
            const zRange = 2.8;
            for (let k = 0; k < numSlices; k++) {
                zValues.push(-zRange + (k / (numSlices - 1)) * 2 * zRange);
            }
            const numCirclePts = 180;
            for (const z of zValues) {
                const radius = Math.sqrt(1 + z * z) * SCALE;
                const cz = z * SCALE;
                const pts = [];
                for (let i = 0; i <= numCirclePts; i++) {
                    const angle = (i / numCirclePts) * Math.PI * 2;
                    pts.push(new THREE.Vector3(
                        radius * Math.cos(angle),
                        radius * Math.sin(angle),
                        cz
                    ));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C3),
                    transparent: true,
                    opacity: 0.5,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        console.log('生成直母线A族...');
        const rulingsA = generateRulings(1);
        console.log('生成直母线B族...');
        const rulingsB = generateRulings(-1);
        console.log('生成椭圆截线族...');
        const ellipses = generateEllipseSlices();

        const mainGroup = new THREE.Group();
        mainGroup.add(rulingsA);
        mainGroup.add(rulingsB);
        mainGroup.add(ellipses);
        scene.add(mainGroup);

        // ==================== 参考球面线框 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 180;
            const circles = [
                (a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0),
                (a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius),
                (a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius),
            ];
            for (const gen of circles) {
                const pts = [];
                for (let i = 0; i <= segs; i++) pts.push(gen((i / segs) * Math.PI * 2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(MAX_R, C_SPHERE, 0.22);
        scene.add(sphereRef);

        // ==================== 顶点光点（椭圆边缘与喉圆处） ====================
        function createGlints() {
            const group = new THREE.Group();
            const sz = 0.07;
            const pos = [
                [0, 0, 0],
                [1.6, 0, 0], [-1.6, 0, 0],
                [0, 1.6, 0], [0, -1.6, 0],
                [0, 0, 1.6], [0, 0, -1.6]
            ];
            for (const [x, y, z] of pos) {
                const pt = new THREE.Vector3(x, y, z);
                const pairs = [
                    [pt.clone().add(new THREE.Vector3(-sz, 0, 0)), pt.clone().add(new THREE.Vector3(sz, 0, 0))],
                    [pt.clone().add(new THREE.Vector3(0, -sz, 0)), pt.clone().add(new THREE.Vector3(0, sz, 0))],
                    [pt.clone().add(new THREE.Vector3(0, 0, -sz)), pt.clone().add(new THREE.Vector3(0, 0, sz))],
                ];
                for (const [a, b] of pairs) {
                    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                    const m = new THREE.LineBasicMaterial({
                        color: new THREE.Color(C_GLINT),
                        transparent: true, opacity: 0.6, depthWrite: true,
                    });
                    group.add(new THREE.Line(g, m));
                }
            }
            return group;
        }
        scene.add(createGlints());

        // ==================== 动画循环 ====================
        let time = 0, lastTime = performance.now(), frameCount = 0, logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s`);
                logTime = now;
            }

            mainGroup.rotation.y = time * 0.32;
            mainGroup.rotation.x = time * 0.18 + Math.sin(time * 0.26) * 0.22;
            mainGroup.rotation.z = Math.cos(time * 0.22) * 0.14;
            sphereRef.rotation.copy(mainGroup.rotation);

            const camX = 1.6 + Math.sin(time * 0.15) * 0.55;
            const camY = 0.9 + Math.cos(time * 0.19) * 0.5;
            camera.position.set(camX, camY, 7.0);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== 单叶双曲面 · 直母线交织 ===');
        console.log('直母线A族:', NUM_RULINGS, 'B族:', NUM_RULINGS);
        console.log('椭圆截线:', 22, '条');
        console.log('总曲线数:', NUM_RULINGS * 2 + 22);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
