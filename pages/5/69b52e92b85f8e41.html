<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartan等参曲线 · 球面代数曲线网</title>
    <style>
        :root { --bg: #02040a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            overflow:hidden;
            font-family:'Georgia','STSong','Songti SC','Noto Serif SC','SimSun','Times New Roman',serif;
            -webkit-font-smoothing:antialiased;
            height:100vh; width:100vw;
            user-select:none; -webkit-user-select:none; cursor:default;
        }
        #canvas-container { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; }
        canvas { display:block; }
        #title-overlay {
            position:fixed; top:22px; left:50%; transform:translateX(-50%);
            z-index:10; pointer-events:none; text-align:center;
        }
        #title-overlay .title {
            font-size:clamp(1.0rem,2.2vw,1.45rem); font-weight:400; letter-spacing:0.08em;
            color:#cfc7b5; text-shadow:0 0 42px rgba(200,180,150,0.5),0 0 70px rgba(170,150,130,0.2);
            line-height:1.4; white-space:nowrap;
        }
        #title-overlay .subtitle {
            font-size:clamp(0.46rem,0.82vw,0.62rem); font-weight:300; letter-spacing:0.12em;
            color:#a09888; text-shadow:0 0 14px rgba(155,145,125,0.3);
            margin-top:2px; white-space:nowrap;
        }
        #formula-overlay {
            position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
            z-index:10; pointer-events:none; text-align:center;
            background:rgba(2,4,10,0.7); padding:10px 22px; border-radius:32px;
            border:1px solid rgba(175,155,135,0.18);
            backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); max-width:95vw;
        }
        #formula-overlay .formula {
            font-size:clamp(0.36rem,0.68vw,0.54rem); font-weight:300; letter-spacing:0.04em;
            color:#c5bdaa; text-shadow:0 0 13px rgba(185,170,145,0.25);
            line-height:1.5; white-space:nowrap;
        }
        #formula-overlay .formula .c1{ color:#d4885c; }
        #formula-overlay .formula .c2{ color:#5d9ec6; }
        #formula-overlay .formula .c3{ color:#c77d9f; }
        @media (max-width:600px){
            #title-overlay{ top:14px; }
            #formula-overlay{ bottom:10px; padding:7px 12px; border-radius:24px; }
            #formula-overlay .formula{ font-size:0.32rem; white-space:normal; line-height:1.3; }
            #title-overlay .title{ font-size:0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">Cartan等参曲线 · 球面代数曲线网</div>
        <div class="subtitle">CARTAN ISOPARAMETRIC CURVES &nbsp;·&nbsp; ALGEBRAIC LEVEL SETS ON S²</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">F₁:</span> P₄²(cosθ)cos(2φ)=c &nbsp;
            <span class="c2">F₂:</span> P₅³(cosθ)cos(3φ)=c &nbsp;
            <span class="c3">F₃:</span> P₆⁴(cosθ)cos(4φ)=c
            <br>
            <span style="color:#9aa8b8;">x²+y²+z²=R² &nbsp; R=2.6 &nbsp;|&nbsp; 每族18等值面 &nbsp;|&nbsp; Marching-Squares提取 &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ------------------------------ 场景初始化 ------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 22);

        const camera = new THREE.PerspectiveCamera(
            48, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 25
        );
        camera.position.set(0.95, 0.5, 7.6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_REF = '#3a4a5c', C_GLINT = '#8898aa';
        const R = 2.6;
        const GRID = 220;          // 网格分辨率
        const LEVELS = 18;        // 等值面数量

        // ------------------------------ 球谐函数值 ------------------------------
        function legendreP(l, x) {
            if (l === 0) return 1;
            if (l === 1) return x;
            let p0 = 1, p1 = x;
            for (let n = 2; n <= l; n++) {
                const p2 = ((2*n-1)*x*p1 - (n-1)*p0) / n;
                p0 = p1;
                p1 = p2;
            }
            return p1;
        }

        function assocLegendre(l, m, x) {
            const factor = Math.pow(1 - x*x, m/2);
            // 使用数值微分计算导数
            const h = 1e-6;
            const fp = legendreP(l, Math.min(0.9999, x+h));
            const fm = legendreP(l, Math.max(-0.9999, x-h));
            let deriv = (fp - fm) / (2*h);
            for (let k = 1; k < m; k++) {
                const fp2 = legendreP(l, Math.min(0.9999, x+2*h));
                const fm2 = legendreP(l, Math.max(-0.9999, x-2*h));
                deriv = (fp2 - 2*legendreP(l, x) + fm2) / (4*h*h);
            }
            const sign = (m % 2 === 0) ? 1 : -1;
            return sign * factor * deriv;
        }

        function sphHarm(l, m, theta, phi) {
            const ct = Math.cos(theta);
            const ylm = assocLegendre(l, m, ct);
            return ylm * Math.cos(m * phi);
        }

        // ------------------------------ 球面等值线提取 ------------------------------
        function extractContours(l, m, numLevels, gridRes) {
            const thetaRes = gridRes;
            const phiRes = Math.floor(gridRes * 2);
            const allSegments = [];

            // 采样函数值
            const values = new Float32Array((thetaRes+1) * (phiRes+1));
            for (let i = 0; i <= thetaRes; i++) {
                const theta = (i / thetaRes) * Math.PI;
                for (let j = 0; j <= phiRes; j++) {
                    const phi = (j / phiRes) * Math.PI * 2;
                    values[i*(phiRes+1)+j] = sphHarm(l, m, theta, phi);
                }
            }

            // 估算值域
            let vMin = Infinity, vMax = -Infinity;
            for (let i = 0; i < values.length; i++) {
                if (values[i] < vMin) vMin = values[i];
                if (values[i] > vMax) vMax = values[i];
            }
            const margin = 0.1 * (vMax - vMin);
            const levMin = vMin + margin;
            const levMax = vMax - margin;

            function spherePoint(theta, phi) {
                const st = Math.sin(theta), ct = Math.cos(theta);
                const sp = Math.sin(phi), cp = Math.cos(phi);
                return new THREE.Vector3(R*st*cp, R*ct, R*st*sp);
            }

            for (let levIdx = 0; levIdx < numLevels; levIdx++) {
                const level = levMin + (levIdx / (numLevels-1)) * (levMax - levMin);
                const segs = []; // 线段端点

                for (let i = 0; i < thetaRes; i++) {
                    for (let j = 0; j < phiRes; j++) {
                        const idx00 = i*(phiRes+1)+j;
                        const idx10 = (i+1)*(phiRes+1)+j;
                        const idx01 = i*(phiRes+1)+j+1;
                        const idx11 = (i+1)*(phiRes+1)+j+1;
                        const f00 = values[idx00]-level;
                        const f10 = values[idx10]-level;
                        const f01 = values[idx01]-level;
                        const f11 = values[idx11]-level;

                        const intersections = [];
                        const theta0 = (i/thetaRes)*Math.PI, theta1 = ((i+1)/thetaRes)*Math.PI;
                        const phi0 = (j/phiRes)*Math.PI*2, phi1 = ((j+1)/phiRes)*Math.PI*2;

                        if (f00 * f10 < 0) {
                            const t = -f00 / (f10-f00);
                            intersections.push( spherePoint(theta0 + t*(theta1-theta0), phi0) );
                        }
                        if (f00 * f01 < 0) {
                            const t = -f00 / (f01-f00);
                            intersections.push( spherePoint(theta0, phi0 + t*(phi1-phi0)) );
                        }
                        if (f10 * f11 < 0) {
                            const t = -f10 / (f11-f10);
                            intersections.push( spherePoint(theta1, phi0 + t*(phi1-phi0)) );
                        }
                        if (f01 * f11 < 0) {
                            const t = -f01 / (f11-f01);
                            intersections.push( spherePoint(theta0 + t*(theta1-theta0), phi1) );
                        }

                        if (intersections.length === 2) {
                            segs.push(intersections[0], intersections[1]);
                        } else if (intersections.length === 4) {
                            const cx = intersections.reduce((s,p)=>s+p.x,0)/4;
                            const cy = intersections.reduce((s,p)=>s+p.y,0)/4;
                            const cz = intersections.reduce((s,p)=>s+p.z,0)/4;
                            intersections.sort((a,b)=>
                                Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx)
                            );
                            segs.push(intersections[0], intersections[1]);
                            segs.push(intersections[2], intersections[3]);
                        }
                    }
                }
                if (segs.length >= 4) allSegments.push(segs);
            }
            return allSegments;
        }

        // ------------------------------ 生成三族曲线 ------------------------------
        console.log('生成族1: (4,2) 球谐等值线...');
        const contours1 = extractContours(4, 2, LEVELS, GRID);
        console.log('生成族2: (5,3) 球谐等值线...');
        const contours2 = extractContours(5, 3, LEVELS, GRID);
        console.log('生成族3: (6,4) 球谐等值线...');
        const contours3 = extractContours(6, 4, LEVELS, GRID);
        console.log(`族1线段集:${contours1.length}, 族2:${contours2.length}, 族3:${contours3.length}`);

        function createCurveGroup(contours, colorHex, opacity) {
            const group = new THREE.Group();
            for (const segs of contours) {
                if (!segs || segs.length < 4) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(segs);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const group1 = createCurveGroup(contours1, C1, 0.6);
        const group2 = createCurveGroup(contours2, C2, 0.57);
        const group3 = createCurveGroup(contours3, C3, 0.58);
        const mainGroup = new THREE.Group();
        mainGroup.add(group1);
        mainGroup.add(group2);
        mainGroup.add(group3);
        scene.add(mainGroup);

        // ------------------------------ 参考球面 ------------------------------
        function createSphereWireframe(radius, colorHex, opacity) {
            const g = new THREE.Group();
            const segs = 180;
            const gen = (f) => {
                const pts = [];
                for (let i=0; i<=segs; i++) pts.push(f(i/segs*Math.PI*2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent:true, opacity:opacity, depthWrite:true
                });
                g.add(new THREE.Line(geom, mat));
            };
            gen((a)=>new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0));
            gen((a)=>new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
            gen((a)=>new THREE.Vector3(0, Math.cos(a)*radius, Math.sin(a)*radius));
            for (const z of [-radius*0.5, radius*0.5]) {
                const r = Math.sqrt(radius*radius - z*z);
                const pts = [];
                for (let i=0; i<=segs; i++) {
                    const a = i/segs*Math.PI*2;
                    pts.push(new THREE.Vector3(Math.cos(a)*r, z, Math.sin(a)*r));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent:true, opacity:opacity*0.6, depthWrite:true
                });
                g.add(new THREE.Line(geom, mat));
            }
            return g;
        }
        const sphereRef = createSphereWireframe(R, C_REF, 0.22);
        scene.add(sphereRef);

        // 原点光点
        (()=>{
            const sz=0.08;
            const g = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-sz,0,0),new THREE.Vector3(sz,0,0),
                new THREE.Vector3(0,-sz,0),new THREE.Vector3(0,sz,0),
                new THREE.Vector3(0,0,-sz),new THREE.Vector3(0,0,sz)
            ]);
            const m = new THREE.LineBasicMaterial({ color:new THREE.Color(C_GLINT), transparent:true, opacity:0.75, depthWrite:true });
            scene.add(new THREE.LineSegments(g,m));
        })();

        // ------------------------------ 动画 (绝对时间) ------------------------------
        const startTime = performance.now();
        let frameCount=0, currentTime=0;

        function animate(now) {
            requestAnimationFrame(animate);
            const elapsed = (now - startTime)/1000;
            if (elapsed <= 0) { renderer.render(scene,camera); return; }
            currentTime = elapsed;
            frameCount++;
            if (frameCount%150===0) console.log(`[运行中] 帧:${frameCount} 时间:${currentTime.toFixed(2)}s`);

            mainGroup.rotation.y = currentTime * 0.28;
            mainGroup.rotation.x = currentTime * 0.15 + Math.sin(currentTime*0.25)*0.2;
            mainGroup.rotation.z = Math.cos(currentTime*0.19)*0.12;
            sphereRef.rotation.copy(mainGroup.rotation);

            const camX = 0.95 + Math.sin(currentTime*0.14)*0.55;
            const camY = 0.5 + Math.cos(currentTime*0.17)*0.5;
            camera.position.set(camX, camY, 7.6);
            camera.lookAt(0,0,0);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', ()=>{
            const w=container.clientWidth, h=Math.max(container.clientHeight,1);
            camera.aspect = w/h;
            camera.updateProjectionMatrix();
            renderer.setSize(w,h);
        });

        console.log('✅ Cartan等参曲线已启动');
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
