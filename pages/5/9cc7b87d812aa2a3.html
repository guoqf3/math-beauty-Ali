<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>傅里叶空间纽结 · 数学之美</title>
    <style>
        :root {
            --bg: #030311;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }

        #title-overlay {
            top: clamp(14px, 3.8vh, 38px);
        }
        #title-overlay .title {
            font-size: clamp(1.1rem, 2.2vw, 1.6rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: rgba(235, 225, 215, 0.92);
            text-shadow: 0 0 26px rgba(180, 160, 200, 0.5), 0 0 6px rgba(160, 140, 180, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.7rem, 1.3vw, 0.85rem);
            font-weight: 300;
            letter-spacing: 0.08em;
            color: rgba(200, 190, 210, 0.7);
            margin-top: 0.3em;
            text-shadow: 0 0 15px rgba(170, 150, 190, 0.3);
        }

        #formula-overlay {
            bottom: clamp(18px, 4.5vh, 46px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.78rem, 1.45vw, 1.05rem);
            font-style: italic;
            letter-spacing: 0.05em;
            color: rgba(225, 215, 205, 0.85);
            text-shadow: 0 0 22px rgba(170, 155, 140, 0.45), 0 0 5px rgba(180, 160, 140, 0.3);
            line-height: 1.6;
            background: rgba(12, 10, 18, 0.5);
            padding: 0.45em 1.4em;
            border-radius: 2em;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(140, 120, 160, 0.25);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.4em 1em;
                letter-spacing: 0.03em;
                font-size: 0.7rem;
            }
            #title-overlay .title {
                letter-spacing: 0.08em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">傅里叶空间纽结</div>
        <div class="subtitle">Fourier Knots in 3‑Space</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            γ(t) = Σ<sub>k=1</sub><sup>K</sup> A<sub>k</sub> cos(k t + φ<sub>k</sub>)
            &emsp;|&emsp; t ∈ [0, 2π]
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间参数 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        // ==================== 曲线数量与采样 ====================
        const NUM_CURVES = 22;
        const SEGMENTS = 480;          // 每条曲线采样点数（+1保证闭合）
        const TOTAL_VERTICES = SEGMENTS + 1;

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030311, 0.00015);

        const camera = new THREE.PerspectiveCamera(44, container.clientWidth / container.clientHeight, 0.3, 14);
        camera.position.set(0.4, 0.7, 3.6);
        camera.lookAt(0, 0.0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 主旋转组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 背景粒子（星空） ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 180;
        const starPositionsArray = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 1.7 + Math.random() * 2.8;
            starPositionsArray[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPositionsArray[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPositionsArray[i * 3 + 2] = Math.cos(phi) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPositionsArray, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xd0c8e0,
            size: 0.012,
            transparent: true,
            opacity: 0.4,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const starPoints = new THREE.Points(starGeom, starMat);
        starsGroup.add(starPoints);

        // 球面附近漂浮光点
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 80;
        const glowPositions = new Float32Array(glowCount * 3);
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < glowCount; i++) {
            const y = 1 - (i / (glowCount - 1)) * 2;
            const radiusAtY = Math.sqrt(1 - y * y);
            const theta = goldenAngle * i;
            glowPositions[i * 3] = Math.cos(theta) * radiusAtY * 1.35;
            glowPositions[i * 3 + 1] = y * 1.35;
            glowPositions[i * 3 + 2] = Math.sin(theta) * radiusAtY * 1.35;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e4d8,
            size: 0.022,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const glowPts = new THREE.Points(glowGeom, glowMat);
        glowGroup.add(glowPts);

        // ==================== 参考球面线框（淡色背景） ====================
        const sphereWireGroup = new THREE.Group();
        mainGroup.add(sphereWireGroup);
        const sphereRadius = 1.4;
        const sphereMaterials = [];

        function createLatLine(phi) {
            const pts = [];
            const r = Math.sin(phi) * sphereRadius;
            const y = Math.cos(phi) * sphereRadius;
            for (let i = 0; i <= 200; i++) {
                const theta = (i / 200) * Math.PI * 2;
                pts.push(new THREE.Vector3(r * Math.cos(theta), y, r * Math.sin(theta)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x3a3550,
                transparent: true,
                opacity: 0.18,
                depthWrite: false,
            });
            sphereMaterials.push(mat);
            return new THREE.Line(geom, mat);
        }
        function createLongLine(theta) {
            const pts = [];
            for (let i = 0; i <= 160; i++) {
                const phi = (i / 160) * Math.PI;
                pts.push(new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * sphereRadius,
                    Math.cos(phi) * sphereRadius,
                    Math.sin(phi) * Math.sin(theta) * sphereRadius
                ));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x3a3550,
                transparent: true,
                opacity: 0.18,
                depthWrite: false,
            });
            sphereMaterials.push(mat);
            return new THREE.Line(geom, mat);
        }
        for (let i = 1; i <= 8; i++) {
            const phi = (i / 9) * Math.PI;
            sphereWireGroup.add(createLatLine(phi));
        }
        for (let i = 0; i < 16; i++) {
            const theta = (i / 16) * Math.PI * 2;
            sphereWireGroup.add(createLongLine(theta));
        }
        // 赤道强调
        {
            const eqPts = [];
            for (let i = 0; i <= 260; i++) {
                const theta = (i / 260) * Math.PI * 2;
                eqPts.push(new THREE.Vector3(Math.cos(theta) * sphereRadius, 0, Math.sin(theta) * sphereRadius));
            }
            const eqGeom = new THREE.BufferGeometry().setFromPoints(eqPts);
            const eqMat = new THREE.LineBasicMaterial({
                color: 0x5a5580,
                transparent: true,
                opacity: 0.24,
                depthWrite: false,
            });
            sphereMaterials.push(eqMat);
            sphereWireGroup.add(new THREE.Line(eqGeom, eqMat));
        }

        // ==================== 傅里叶空间曲线 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        /**
         * 生成一条闭合的傅里叶空间曲线
         * @param {number[]} amplitudesX  各频率振幅
         * @param {number[]} phasesX      各频率相位
         * @param {number[]} amplitudesY
         * @param {number[]} phasesY
         * @param {number[]} amplitudesZ
         * @param {number[]} phasesZ
         * @param {THREE.Color} color
         * @returns {THREE.Line}
         */
        function createFourierCurve(ampsX, phasesX, ampsY, phasesY, ampsZ, phasesZ, color) {
            const K = ampsX.length;
            const positions = new Float32Array(TOTAL_VERTICES * 3);

            for (let i = 0; i <= SEGMENTS; i++) {
                const t = (i / SEGMENTS) * Math.PI * 2;
                let x = 0, y = 0, z = 0;
                for (let k = 0; k < K; k++) {
                    const freq = k + 1;
                    x += ampsX[k] * Math.cos(freq * t + phasesX[k]);
                    y += ampsY[k] * Math.cos(freq * t + phasesY[k]);
                    z += ampsZ[k] * Math.cos(freq * t + phasesZ[k]);
                }
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setDrawRange(0, 0);

            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.82,
                depthWrite: false,
            });
            const line = new THREE.Line(geometry, material);
            allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
            return line;
        }

        // 预定义多组傅里叶系数，确保曲线美观且不超出可视范围
        const seedData = [
            { ampsX: [0.7, 0.35, 0.18], phasesX: [0.2, 1.1, 2.5], ampsY: [0.5, 0.42, 0.25], phasesY: [1.8, 0.3, 0.9], ampsZ: [0.55, 0.38, 0.22], phasesZ: [2.1, 1.6, 0.4] },
            { ampsX: [0.65, 0.3, 0.22], phasesX: [1.4, 0.7, 2.0], ampsY: [0.6, 0.28, 0.3], phasesY: [0.9, 2.0, 1.3], ampsZ: [0.5, 0.45, 0.2], phasesZ: [0.5, 1.1, 2.8] },
            { ampsX: [0.55, 0.4, 0.15], phasesX: [2.0, 1.5, 0.8], ampsY: [0.68, 0.32, 0.2], phasesY: [1.2, 0.6, 2.3], ampsZ: [0.62, 0.34, 0.25], phasesZ: [1.0, 2.2, 0.7] },
            { ampsX: [0.6, 0.36, 0.2], phasesX: [0.7, 1.9, 1.2], ampsY: [0.55, 0.38, 0.28], phasesY: [2.3, 0.5, 1.6], ampsZ: [0.58, 0.4, 0.18], phasesZ: [1.5, 0.9, 2.5] },
            { ampsX: [0.5, 0.45, 0.1], phasesX: [1.0, 0.4, 2.7], ampsY: [0.72, 0.25, 0.22], phasesY: [0.8, 1.7, 0.3], ampsZ: [0.53, 0.42, 0.24], phasesZ: [2.0, 1.3, 0.6] },
            { ampsX: [0.63, 0.33, 0.19], phasesX: [1.6, 0.9, 1.8], ampsY: [0.57, 0.4, 0.26], phasesY: [0.4, 2.1, 1.5], ampsZ: [0.6, 0.35, 0.21], phasesZ: [1.8, 0.3, 2.4] },
            { ampsX: [0.58, 0.37, 0.23], phasesX: [0.9, 1.7, 0.4], ampsY: [0.64, 0.31, 0.19], phasesY: [1.5, 0.2, 2.8], ampsZ: [0.51, 0.43, 0.27], phasesZ: [0.7, 2.3, 1.2] },
            { ampsX: [0.66, 0.28, 0.21], phasesX: [1.2, 2.4, 0.6], ampsY: [0.5, 0.44, 0.24], phasesY: [2.0, 1.0, 1.8], ampsZ: [0.56, 0.39, 0.2], phasesZ: [1.4, 0.8, 2.1] },
        ];

        // 生成曲线，扩展至 NUM_CURVES 条
        for (let i = 0; i < NUM_CURVES; i++) {
            const base = seedData[i % seedData.length];
            // 微调相位，使曲线略有差异
            const jitter = (i * 0.42) % (Math.PI * 2);
            const ampsX = base.ampsX.map(v => v * (0.9 + 0.2 * Math.sin(i * 0.7)));
            const phasesX = base.phasesX.map(p => p + jitter);
            const ampsY = base.ampsY.map(v => v * (0.9 + 0.2 * Math.cos(i * 0.5)));
            const phasesY = base.phasesY.map(p => p + jitter * 0.8);
            const ampsZ = base.ampsZ.map(v => v * (0.9 + 0.2 * Math.sin(i * 0.9)));
            const phasesZ = base.phasesZ.map(p => p + jitter * 1.1);

            const hue = (i / NUM_CURVES) * 0.85 + 0.15;
            const color = new THREE.Color();
            color.setHSL(hue % 1, 0.65, 0.68);
            const curve = createFourierCurve(ampsX, phasesX, ampsY, phasesY, ampsZ, phasesZ, color);
            curvesGroup.add(curve);
        }

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;

        function getCycleTime() {
            const now = performance.now() / 1000;
            return (now - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            // 主旋转
            mainGroup.rotation.y += 0.24 * dt;
            mainGroup.rotation.x += 0.05 * dt;
            mainGroup.rotation.z += 0.025 * Math.sin(cycleTime * 0.65) * dt;

            // 相机微动
            const sway = 0.12 * Math.sin(cycleTime * (Math.PI * 2 / 35));
            camera.position.y = 0.7 + sway;
            camera.lookAt(0, 0.0, 0);

            // 绘制进度
            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            // 更新所有曲线绘制范围
            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            // 背景元素透明度渐变
            let bgOpacity;
            if (cycleTime < FADE_IN_DURATION) {
                bgOpacity = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOpacity = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOpacity = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOpacity = 0;
            }
            bgOpacity = Math.max(0, Math.min(1, bgOpacity));

            starMat.opacity = 0.4 * bgOpacity;
            glowMat.opacity = 0.55 * bgOpacity;
            for (const mat of sphereMaterials) {
                mat.opacity = mat.opacity <= 0.25 ? (0.18 * bgOpacity) : (0.24 * bgOpacity);
            }

            // 粒子微动
            glowGroup.position.y = Math.sin(cycleTime * 1.1) * 0.025;
            starsGroup.rotation.y += dt * 0.05;
            starsGroup.rotation.x += dt * 0.03;

            renderer.render(scene, camera);
        }

        // ==================== 响应式 ====================
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 可选重置键
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        // 预热渲染，防止第一帧空白
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🌀 傅里叶空间纽结动画已启动');
        console.log(`   - ${NUM_CURVES} 条闭合空间曲线`);
        console.log(`   - 周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
