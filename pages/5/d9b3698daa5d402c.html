<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein瓶编织 · 不可定向曲面线网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Klein瓶编织 · 不可定向曲面线网</h2>
        <div class="sub">Klein bottle immersion · u‑curves · v‑curves · Diagonal foliations</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">u‑曲线(v=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">v‑曲线(u=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">对角线u±v=const</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.5, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        const getElapsed = () => clock.getElapsedTime();

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.72;
        const A = 2.2;
        const U_STEPS = 360;
        const V_STEPS = 280;

        // ---- Klein瓶参数方程 ----
        function kleinPoint(u, v) {
            const halfU = u * 0.5;
            const cosHalfU = Math.cos(halfU);
            const sinHalfU = Math.sin(halfU);
            const sinV = Math.sin(v);
            const sin2V = Math.sin(2 * v);
            const cosU = Math.cos(u);
            const sinU = Math.sin(u);

            const fx = A + cosHalfU * sinV - sinHalfU * sin2V;
            return new THREE.Vector3(
                fx * cosU,
                fx * sinU,
                sinHalfU * sinV + cosHalfU * sin2V
            ).multiplyScalar(SCALE);
        }

        // ---- 生成u曲线（固定v, 变化u）----
        function createUCurves(vValues, color, opacity) {
            const group = new THREE.Group();
            const du = 2 * Math.PI / U_STEPS;
            for (const v of vValues) {
                const pts = [];
                for (let i = 0; i <= U_STEPS; i++) {
                    const u = i * du;
                    const p = kleinPoint(u, v);
                    if (p.length() < 9) pts.push(p);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // ---- 生成v曲线（固定u, 变化v）----
        function createVCurves(uValues, color, opacity) {
            const group = new THREE.Group();
            const dv = 2 * Math.PI / V_STEPS;
            for (const u of uValues) {
                const pts = [];
                for (let i = 0; i <= V_STEPS; i++) {
                    const v = i * dv;
                    const p = kleinPoint(u, v);
                    if (p.length() < 9) pts.push(p);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // ---- 生成对角线曲线 u±v = const ----
        function createDiagonalCurves(constValues, sign, color, opacity) {
            const group = new THREE.Group();
            const tRange = 5.5;
            const steps = 420;
            for (const c of constValues) {
                const pts = [];
                const dt = 2 * tRange / steps;
                for (let i = 0; i <= steps; i++) {
                    const t = -tRange + i * dt;
                    const u = t;
                    const v = sign === 1 ? c - t : t - c;
                    const p = kleinPoint(u, v);
                    if (p.length() < 9) pts.push(p);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // ---- 主组 ----
        const rootGroup = new THREE.Group();
        rootGroup.name = 'klein-weave';
        scene.add(rootGroup);

        // 金色族：u曲线 (固定v)
        const vCount = 28;
        const vValues = [];
        for (let i = 0; i < vCount; i++) vValues.push(i * 2 * Math.PI / vCount);
        rootGroup.add(createUCurves(vValues, COLOR_GOLD, 0.62));

        // 青色族：v曲线 (固定u)
        const uCount = 28;
        const uValues = [];
        for (let i = 0; i < uCount; i++) uValues.push(i * 2 * Math.PI / uCount);
        rootGroup.add(createVCurves(uValues, COLOR_CYAN, 0.62));

        // 品红族：对角线 u+v=const 和 u-v=const
        const diagCount = 30;
        const diagMin = -3.5 * Math.PI;
        const diagMax = 3.5 * Math.PI;
        const diagValues = [];
        for (let i = 0; i < diagCount; i++) diagValues.push(diagMin + i * (diagMax - diagMin) / (diagCount - 1));
        rootGroup.add(createDiagonalCurves(diagValues, 1, COLOR_MAGENTA, 0.55));
        rootGroup.add(createDiagonalCurves(diagValues, -1, COLOR_MAGENTA, 0.50));

        // 额外稀疏层
        const extraV = [];
        for (let i = 0; i < 16; i++) extraV.push(i * 2 * Math.PI / 16 + 0.15);
        rootGroup.add(createUCurves(extraV, COLOR_GOLD, 0.38));
        const extraU = [];
        for (let i = 0; i < 16; i++) extraU.push(i * 2 * Math.PI / 16 + 0.25);
        rootGroup.add(createVCurves(extraU, COLOR_CYAN, 0.38));
        const extraDiag = [];
        for (let i = 0; i < 18; i++) extraDiag.push(diagMin + 0.12 + i * (diagMax - diagMin) / 17);
        rootGroup.add(createDiagonalCurves(extraDiag, 1, COLOR_MAGENTA, 0.32));
        rootGroup.add(createDiagonalCurves(extraDiag, -1, COLOR_MAGENTA, 0.30));

        console.log('Klein瓶编织线条总数:', rootGroup.children.length);

        // 辅助球面参考网格
        const refR = 3.5;
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = refR * Math.sin(lat);
            const z = refR * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(refR * st * Math.cos(phi), refR * Math.cos(theta), refR * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const sc = 550;
        const sp = new Float32Array(sc * 3);
        for (let i = 0; i < sc; i++) {
            const th = Math.random() * Math.PI * 2,
                ph = Math.acos(2 * Math.random() - 1),
                d = 6.5 + Math.random() * 10;
            sp[i * 3] = d * Math.sin(ph) * Math.cos(th);
            sp[i * 3 + 1] = d * Math.sin(ph) * Math.sin(th);
            sp[i * 3 + 2] = d * Math.cos(ph);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(sp, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        })));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.18;
            rootGroup.rotation.y = t * 0.29;
            rootGroup.rotation.z = t * 0.13;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const cr = 7.9,
                ca = t * 0.08,
                ch = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        renderer.setAnimationLoop(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Klein瓶不可定向曲面编织动画已稳定运行');
    </script>
</body>
</html>
