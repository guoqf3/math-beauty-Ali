<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clelia编织 · 球面多族曲线网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Clelia编织 · 球面多族曲线网</h2>
        <div class="sub">Clelia curves φ = c·θ on S² · Rational vs irrational braiding</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">R=2.5: c∈{√2,√3,√5,π,e,φ}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">R=2.75: c∈{1/2,2/3,3/4,5/3,7/4}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">R=3.0: c∈{√6,√7,2π,φ²,e/2}</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // Clelia曲线点函数：在半径R的球面上，φ = c·θ
        function cleliaPoint(R, c, theta, phiOffset) {
            const st = Math.sin(theta);
            const phi = c * theta + phiOffset;
            return new THREE.Vector3(
                R * st * Math.cos(phi),
                R * Math.cos(theta),
                R * st * Math.sin(phi)
            );
        }

        // 生成一族Clelia曲线
        function createCleliaFamily(R, cValues, phiOffsets, color, opacity, numPoints) {
            const group = new THREE.Group();
            for (const c of cValues) {
                for (const phiOff of phiOffsets) {
                    const pts = [];
                    const dTheta = (Math.PI - 0.04) / numPoints;
                    for (let i = 0; i <= numPoints; i++) {
                        const theta = 0.02 + i * dTheta;
                        pts.push(cleliaPoint(R, c, theta, phiOff));
                    }
                    if (pts.length >= 2) {
                        const geom = new THREE.BufferGeometry().setFromPoints(pts);
                        const mat = new THREE.LineBasicMaterial({
                            color, transparent: true, opacity, depthWrite: true, depthTest: true,
                        });
                        group.add(new THREE.Line(geom, mat));
                    }
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'clelia-weave';
        scene.add(rootGroup);

        const numPoints = 520;
        const phiOffsets = [0, 2 * Math.PI / 3, 4 * Math.PI / 3];

        // 金色族：R=2.50，无理c值
        const goldC = [
            Math.sqrt(2), Math.sqrt(3), Math.sqrt(5), Math.sqrt(7),
            Math.PI, Math.E, (1 + Math.sqrt(5)) / 2,
            1 / ((1 + Math.sqrt(5)) / 2), Math.sqrt(2) / 2, Math.sqrt(3) / 3,
            2 * Math.sqrt(2), 3 * Math.sqrt(3) / 2
        ];
        rootGroup.add(createCleliaFamily(2.50, goldC, phiOffsets, COLOR_GOLD, 0.58, numPoints));

        // 青色族：R=2.75，有理c值
        const cyanC = [
            1 / 2, 2 / 3, 3 / 4, 5 / 3, 7 / 4, 5 / 2,
            3 / 2, 4 / 3, 7 / 3, 8 / 3, 5 / 4, 7 / 5
        ];
        rootGroup.add(createCleliaFamily(2.75, cyanC, phiOffsets, COLOR_CYAN, 0.58, numPoints));

        // 品红族：R=3.00，混合c值
        const magentaC = [
            Math.sqrt(6), Math.sqrt(8), 2 * Math.PI, 2 * Math.E,
            ((1 + Math.sqrt(5)) / 2) * ((1 + Math.sqrt(5)) / 2),
            1 / Math.sqrt(3), Math.sqrt(10), 2 * (1 + Math.sqrt(5)) / 2,
            Math.E / 2, Math.PI / 2, 3 / Math.sqrt(2), 5 / Math.sqrt(3)
        ];
        rootGroup.add(createCleliaFamily(3.00, magentaC, phiOffsets, COLOR_MAGENTA, 0.58, numPoints));

        // 额外密度：更多phi偏移版本
        const extraPhiOffsets = [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4];
        rootGroup.add(createCleliaFamily(2.50, goldC.slice(0, 6), extraPhiOffsets, COLOR_GOLD, 0.38, numPoints));
        rootGroup.add(createCleliaFamily(2.75, cyanC.slice(0, 6), extraPhiOffsets, COLOR_CYAN, 0.38, numPoints));
        rootGroup.add(createCleliaFamily(3.00, magentaC.slice(0, 6), extraPhiOffsets, COLOR_MAGENTA, 0.38, numPoints));

        // 辅助球面参考网格（极淡）
        const refRadii = [2.50, 2.75, 3.00];
        const refColors = [0x504030, 0x405040, 0x403050];
        refRadii.forEach((R, idx) => {
            for (let i = 0; i < 8; i++) {
                const lat = (i + 0.5) * Math.PI / 8;
                const r = R * Math.sin(lat);
                const z = R * Math.cos(lat);
                const pts = [];
                for (let j = 0; j <= 200; j++) {
                    const phi = j * 2 * Math.PI / 200;
                    pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color: refColors[idx], transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
                })));
            }
            for (let k = 0; k < 6; k++) {
                const phi = k * Math.PI / 3;
                const pts = [];
                for (let j = 0; j <= 200; j++) {
                    const theta = 0.02 + j * Math.PI / 200;
                    const st = Math.sin(theta);
                    pts.push(new THREE.Vector3(R * st * Math.cos(phi), R * Math.cos(theta), R * st * Math.sin(phi)));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color: refColors[idx], transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
                })));
            }
        });

        console.log('Clelia编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.27;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        scheduleFrame();

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Clelia球面多族曲线编织动画已稳定运行');
    </script>
</body>
</html>
