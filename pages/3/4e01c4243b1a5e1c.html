<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>晶格振动 · 倒格矢与布里渊区色散关系</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03040e}
  body{
    font-family:"SF Mono","Consolas","Menlo","Courier New",monospace;
    color:#bfe9ff;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;display:block;z-index:0;touch-action:none}

  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%,transparent 38%,rgba(0,0,0,.78) 100%);
  }

  .quote{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    z-index:3;pointer-events:none;
    font-size:17px;letter-spacing:3px;white-space:nowrap;
    color:#eaf6ff;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    text-shadow:
      0 0 10px rgba(180,235,255,.9),
      0 0 26px rgba(130,150,255,.65),
      0 0 52px rgba(200,120,255,.45);
    animation:qglow 5s ease-in-out infinite;
  }
  @keyframes qglow{
    0%,100%{opacity:.86;text-shadow:0 0 10px rgba(180,235,255,.85),0 0 26px rgba(130,150,255,.6),0 0 52px rgba(200,120,255,.4)}
    50%{opacity:1;text-shadow:0 0 16px rgba(230,250,255,1),0 0 38px rgba(160,180,255,.9),0 0 70px rgba(220,140,255,.6)}
  }

  .panel{
    position:fixed;top:50%;transform:translateY(-50%);
    z-index:3;pointer-events:none;
    font-size:12px;line-height:2.0;letter-spacing:.5px;
    color:rgba(150,225,255,.5);
    text-shadow:0 0 9px rgba(0,180,255,.45);
  }
  .panel .line{white-space:nowrap}
  .panel .hl{color:rgba(230,220,255,.95);text-shadow:0 0 12px rgba(180,150,255,.9)}
  .panel .dim{color:rgba(150,170,230,.4);font-size:11px}
  .panel.left{left:22px;text-align:left}
  .panel.right{right:22px;text-align:right}

  .controls{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    z-index:4;display:flex;align-items:center;gap:16px;
    padding:10px 20px;border-radius:44px;
    background:rgba(8,14,32,.68);
    border:1px solid rgba(90,200,255,.25);
    box-shadow:0 0 26px rgba(0,120,255,.22),inset 0 0 22px rgba(0,100,200,.12);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:11px;letter-spacing:.4px;white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:8px;color:rgba(160,230,255,.85)}
  .tval{color:#dcd0ff;text-shadow:0 0 10px rgba(180,150,255,.9);min-width:56px;display:inline-block;text-align:right}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:118px;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,rgba(60,220,255,.9),rgba(180,120,255,.9));
    box-shadow:0 0 12px rgba(120,180,255,.55);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#a0c8ff 55%,#7a4aff);
    box-shadow:0 0 14px rgba(150,190,255,.95),0 0 26px rgba(140,120,255,.6);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#a0c8ff 55%,#7a4aff);
    box-shadow:0 0 14px rgba(150,190,255,.95);cursor:pointer;
  }
  .toggle{
    cursor:pointer;user-select:none;
    padding:5px 13px;border-radius:20px;
    border:1px solid rgba(90,200,255,.28);
    background:rgba(18,42,82,.32);
    color:rgba(160,225,255,.7);
    transition:all .25s ease;
  }
  .toggle:hover{border-color:rgba(140,235,255,.6);color:#ddf6ff}
  .toggle.on{
    background:rgba(130,120,255,.20);
    border-color:rgba(180,170,255,.85);
    color:#f0ecff;
    box-shadow:0 0 16px rgba(150,140,255,.55),inset 0 0 12px rgba(150,140,255,.22);
  }

  @media (max-width:900px){
    .panel{display:none}
    .quote{font-size:13px;letter-spacing:1.5px;top:12px}
    .controls{gap:9px;padding:8px 12px;font-size:10px;bottom:10px}
    input[type=range]{width:76px}
    .tval{min-width:42px}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="quote">振动在边界折返，生命在约束中谱出最高的频率</div>

<div class="panel left">
  <div class="line">ω(q) = ω_max · sin(qa/2)</div>
  <div class="line">ω_max = 2√(K/m)</div>
  <div class="line">v_s = a · √(K/m)</div>
  <div class="line">q_BZ = π / a</div>
  <div class="line dim" style="margin-top:8px">声学支 / 光支 双支色散</div>
</div>

<div class="panel right">
  <div class="line">a = 2.50×10⁻¹⁰ m</div>
  <div class="line">m = 1.67×10⁻²⁷ kg</div>
  <div class="line">K = 50 N/m</div>
  <div class="line hl">q = <span id="vQ">0.50</span> π/a</div>
  <div class="line hl">ω = <span id="vW">2.45</span>×10¹⁴ rad/s</div>
  <div class="line hl">ω/ω_max = <span id="vR">0.71</span></div>
  <div class="line">v_g = <span id="vG">3.06</span>×10⁴ m/s</div>
  <div class="line dim" style="margin-top:8px">低波数声学支 58% · 高波数 42%</div>
</div>

<div class="controls">
  <label>q
    <input type="range" id="qSlider" min="0" max="1" step="0.001" value="0.5">
  </label>
  <span class="tval" id="qLabel">0.50</span>
  <div class="toggle on" id="btnAuto">自动</div>
  <div class="toggle" id="btnOpt">光支</div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   物理常量
============================================================ */
const A_LAT   = 2.5e-10;                          // 晶格常数 m
const M_ATOM  = 1.67e-27;                         // 原子质量 kg
const K_SPR   = 50;                               // 力常数 N/m
const SQ_KM   = Math.sqrt(K_SPR / M_ATOM);        // √(K/m) = 1.730e14
const OMEGA_MAX = 2 * SQ_KM;                      // ω_max = 3.461e14 rad/s
const V_SOUND   = A_LAT * SQ_KM;                  // v_s = 4.326e4 m/s
const Q_BZ      = Math.PI / A_LAT;                // 布里渊区边界

/* 声学支 ω(q) = ω_max·|sin(qa/2)| */
function omegaAc(q){
  return OMEGA_MAX * Math.abs(Math.sin(q * A_LAT / 2));
}
/* 群速度 dω/dq = ω_max·(a/2)·cos(qa/2) */
function groupVel(q){
  return OMEGA_MAX * (A_LAT / 2) * Math.cos(q * A_LAT / 2);
}
/* 光支（示意，双原子链近似） */
function omegaOpt(q){
  const s = Math.abs(Math.sin(q * A_LAT / 2));
  return OMEGA_MAX * Math.sqrt(1.6 + 0.6 * (1 - s));
}

/* ============================================================
   画布
============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let stars = [];

function buildStars(){
  stars = [];
  const n = Math.round(W * H / 7600);
  for(let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.15 + 0.22,
      ph: Math.random() * Math.PI * 2,
      sp: 0.3 + Math.random() * 1.6,
      hue: 195 + Math.random() * 110
    });
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   状态
============================================================ */
const st = {
  qS: 0.5,            // q 归一化 0..1 → q = qS·π/a
  autoOn: true,
  showOpt: false,
  clock: 0,
  atoms: [],          // 主链原子屏幕坐标
  clickIdx: -1,
  clickTime: 0
};

/* ============================================================
   DOM
============================================================ */
const qSlider = document.getElementById('qSlider');
const qLabel  = document.getElementById('qLabel');
const btnAuto = document.getElementById('btnAuto');
const btnOpt  = document.getElementById('btnOpt');

const elQ = document.getElementById('vQ');
const elW = document.getElementById('vW');
const elR = document.getElementById('vR');
const elG = document.getElementById('vG');

qSlider.addEventListener('input', function(e){
  st.qS = parseFloat(e.target.value);
  st.autoOn = false;
  btnAuto.classList.remove('on');
});
btnAuto.addEventListener('click', function(){
  st.autoOn = !st.autoOn;
  btnAuto.classList.toggle('on', st.autoOn);
});
btnOpt.addEventListener('click', function(){
  st.showOpt = !st.showOpt;
  btnOpt.classList.toggle('on', st.showOpt);
});

canvas.addEventListener('pointerdown', function(e){
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let best = -1, bd = 30;
  for(let i = 0; i < st.atoms.length; i++){
    const d = Math.hypot(mx - st.atoms[i].x, my - st.atoms[i].y);
    if(d < bd){ bd = d; best = i; }
  }
  st.clickIdx = best;
  st.clickTime = st.clock;
});

/* ============================================================
   更新
============================================================ */
function update(dt){
  st.clock += dt;

  if(st.autoOn){
    const ph = st.clock / 30;
    const tri = Math.abs(((ph * 2) % 2) - 1);
    const t = tri * tri * (3 - 2 * tri);
    st.qS = t;
    qSlider.value = st.qS;
  }
}

/* ============================================================
   数值刷新
============================================================ */
function updateUI(){
  const q = st.qS * Q_BZ;
  const w = omegaAc(q);
  const vg = Math.abs(groupVel(q));
  elQ.textContent = st.qS.toFixed(2);
  elW.textContent = (w / 1e14).toFixed(2);
  elR.textContent = (w / OMEGA_MAX).toFixed(3);
  elG.textContent = (vg / 1e4).toFixed(2);
  qLabel.textContent = st.qS.toFixed(2);
}

/* ============================================================
   背景
============================================================ */
function drawBackground(){
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#03040e';
  ctx.fillRect(0, 0, W, H);

  const hShift = 32 * Math.sin(st.clock * Math.PI * 2 / 30);
  const g = ctx.createRadialGradient(
    W / 2, H * 0.30, 0,
    W / 2, H * 0.30, Math.max(W, H) * 0.68
  );
  g.addColorStop(0,   'hsla(' + (235 + hShift) + ',72%,16%,0.60)');
  g.addColorStop(0.46,'hsla(' + (272 + hShift) + ',74%,9%,0.26)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(){
  ctx.globalCompositeOperation = 'lighter';
  for(let i = 0; i < stars.length; i++){
    const s = stars[i];
    const tw = 0.5 + 0.5 * Math.sin(st.clock * s.sp + s.ph);
    ctx.fillStyle = 'hsla(' + s.hue + ',75%,' + (72 + 20 * tw) + '%,' + (0.08 + 0.50 * tw * tw) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   晶格振动
============================================================ */
const N_ATOMS = 23;

function drawLattice(){
  const cy = H * 0.235;
  const totalW = Math.min(W * 0.80, 1040);
  const spacing = totalW / (N_ATOMS - 1);
  const x0 = W / 2 - totalW / 2;
  const amp = spacing * 0.36;

  const s = st.qS;
  const omegaVis = 0.85 + 2.45 * Math.sin(Math.PI * s / 2);
  const t = st.clock;

  st.atoms = [];

  /* 背景光晕带 */
  const halo = ctx.createRadialGradient(W/2, cy, 0, W/2, cy, totalW * 0.62);
  halo.addColorStop(0,   'hsla(' + (225 + 40*s) + ',90%,55%,0.075)');
  halo.addColorStop(0.55,'hsla(' + (265 + 30*s) + ',90%,48%,0.030)');
  halo.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);

  /* 三层链（营造三维晶格感） */
  const rows = [
    { dy: -30, alpha: 0.20, scale: 0.66, phase: -0.75 },
    { dy:   0, alpha: 1.00, scale: 1.00, phase:  0.00 },
    { dy:  30, alpha: 0.20, scale: 0.66, phase:  0.75 }
  ];

  for(let r = 0; r < rows.length; r++){
    const row = rows[r];
    const pos = [];

    for(let n = 0; n < N_ATOMS; n++){
      const eqX = x0 + n * spacing;
      const u = amp * Math.cos(Math.PI * s * n - omegaVis * t + row.phase);
      pos.push({ eq: eqX, x: eqX + u, u: u, n: n });
    }

    /* 键线 */
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = (r === 1 ? 1.3 : 0.8);
    for(let n = 0; n < N_ATOMS - 1; n++){
      const a = pos[n], b = pos[n + 1];
      const stretch = Math.abs((b.x - a.x) - spacing) / spacing;
      const hue = 200 + 90 * Math.min(1, stretch * 4) + 40 * s;
      ctx.strokeStyle = 'hsla(' + hue + ',95%,65%,' + (row.alpha * (0.16 + 0.30 * Math.min(1, stretch * 3))) + ')';
      ctx.beginPath();
      ctx.moveTo(a.x, cy + row.dy);
      ctx.lineTo(b.x, cy + row.dy);
      ctx.stroke();
    }

    /* 原子 */
    for(let n = 0; n < N_ATOMS; n++){
      const p = pos[n];
      const hue = 192 + 88 * s + 40 * (p.u / amp);
      const R = spacing * 0.20 * row.scale;

      ctx.globalCompositeOperation = 'lighter';

      /* 光晕 */
      const gg = ctx.createRadialGradient(p.x, cy + row.dy, 0, p.x, cy + row.dy, R * 4.6);
      gg.addColorStop(0,   'hsla(' + hue + ',100%,82%,' + (0.55 * row.alpha) + ')');
      gg.addColorStop(0.32,'hsla(' + (hue + 30) + ',100%,62%,' + (0.20 * row.alpha) + ')');
      gg.addColorStop(1,   'hsla(' + (hue + 70) + ',100%,55%,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(p.x, cy + row.dy, R * 4.6, 0, Math.PI * 2);
      ctx.fill();

      /* 球体 */
      const sg = ctx.createRadialGradient(
        p.x - R * 0.34, cy + row.dy - R * 0.34, 0,
        p.x, cy + row.dy, R * 1.12
      );
      sg.addColorStop(0,   'hsla(' + hue + ',100%,96%,' + row.alpha + ')');
      sg.addColorStop(0.40,'hsla(' + hue + ',100%,72%,' + (0.92 * row.alpha) + ')');
      sg.addColorStop(1,   'hsla(' + (hue + 45) + ',100%,48%,' + (0.42 * row.alpha) + ')');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(p.x, cy + row.dy, R, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalCompositeOperation = 'source-over';

      if(r === 1){
        st.atoms.push({ x: p.x, y: cy + row.dy, n: n, u: p.u, eq: p.eq });
      }
    }
  }

  /* 平衡位置虚线 */
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.setLineDash([2, 8]);
  ctx.strokeStyle = 'rgba(150,200,255,0.13)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, cy);
  ctx.lineTo(x0 + (N_ATOMS - 1) * spacing, cy);
  ctx.stroke();
  ctx.restore();

  /* 点击标记 */
  if(st.clickIdx >= 0 && st.clickIdx < st.atoms.length){
    const a = st.atoms[st.clickIdx];
    const pulse = 1 + 0.16 * Math.sin((st.clock - st.clickTime) * 6);

    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,238,180,0.85)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(a.x, a.y, spacing * 0.42 * pulse, 0, Math.PI * 2);
    ctx.stroke();

    /* 位移箭头 */
    if(Math.abs(a.u) > 0.6){
      const dir = a.u > 0 ? 1 : -1;
      const L = Math.min(Math.abs(a.u) * 1.6, spacing * 0.85);
      const x1 = a.x + dir * L;
      ctx.strokeStyle = 'rgba(120,240,255,0.92)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(x1, a.y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(120,240,255,0.92)';
      ctx.beginPath();
      ctx.moveTo(x1, a.y);
      ctx.lineTo(x1 - 7 * dir, a.y - 4);
      ctx.lineTo(x1 - 7 * dir, a.y + 4);
      ctx.closePath();
      ctx.fill();

      ctx.font = '10px ui-monospace, Consolas, monospace';
      ctx.fillStyle = 'rgba(180,245,255,0.9)';
      ctx.textAlign = 'center';
      ctx.fillText('u', a.x + dir * L * 0.5, a.y - 11);
    }

    /* 动量方向：v ∝ -sin(qna − ωt) */
    const vSign = Math.sin(Math.PI * st.qS * a.n - (0.85 + 2.45 * Math.sin(Math.PI * st.qS / 2)) * st.clock) > 0 ? -1 : 1;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,150,220,0.75)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y + spacing * 0.55);
    ctx.lineTo(a.x + vSign * spacing * 0.62, a.y + spacing * 0.55);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,150,220,0.75)';
    ctx.beginPath();
    ctx.moveTo(a.x + vSign * spacing * 0.62, a.y + spacing * 0.55);
    ctx.lineTo(a.x + vSign * spacing * 0.46, a.y + spacing * 0.55 - 4);
    ctx.lineTo(a.x + vSign * spacing * 0.46, a.y + spacing * 0.55 + 4);
    ctx.closePath();
    ctx.fill();

    /* 信息文字 */
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = '11px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,240,190,0.92)';
    ctx.fillText('原子 #' + a.n + '  位移相位 ' + (a.u / amp * 3.14).toFixed(2) + ' rad', a.x, cy + 92);
    ctx.textAlign = 'left';
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   色散图
============================================================ */
let plotBox = { xl: 0, xr: 0, yt: 0, yb: 0 };

function drawDispersion(){
  const xl = W * 0.11;
  const xr = W * 0.89;
  const yt = H * 0.485;
  const yb = H * 0.865;
  plotBox = { xl: xl, xr: xr, yt: yt, yb: yb };

  const Q_EXT = 2.0;              // 扩展布里渊区 ±2π/a
  const W_NORM = 1.62;            // 纵轴上限（以 ω_max 为单位）

  const qOfU = function(u){ return (u * 2 - 1) * Q_EXT * Q_BZ; };
  const xOfQ = function(q){ return xl + ((q / Q_BZ / Q_EXT) + 1) * 0.5 * (xr - xl); };
  const yOfW = function(w){ return yb - (w / OMEGA_MAX / W_NORM) * (yb - yt); };

  /* ---- 第一布里渊区底色 ---- */
  const bx0 = xOfQ(-Q_BZ), bx1 = xOfQ(Q_BZ);
  const bgGrad = ctx.createLinearGradient(bx0, 0, bx1, 0);
  bgGrad.addColorStop(0,   'rgba(90,140,255,0.055)');
  bgGrad.addColorStop(0.5, 'rgba(150,100,255,0.085)');
  bgGrad.addColorStop(1,   'rgba(90,140,255,0.055)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(bx0, yt - 6, bx1 - bx0, yb - yt + 12);

  /* ---- 网格 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = 'rgba(120,180,255,0.11)';
  ctx.lineWidth = 1;
  for(let k = -2; k <= 2; k++){
    const x = xOfQ(k * Q_BZ);
    ctx.beginPath();
    ctx.moveTo(x, yt);
    ctx.lineTo(x, yb);
    ctx.stroke();
  }
  for(let k = 0; k <= 1.5; k += 0.5){
    const y = yOfW(k * OMEGA_MAX);
    ctx.beginPath();
    ctx.moveTo(xl, y);
    ctx.lineTo(xr, y);
    ctx.stroke();
  }

  /* ---- 坐标轴 ---- */
  ctx.strokeStyle = 'rgba(140,200,255,0.34)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(xl, yb);
  ctx.lineTo(xr, yb);
  ctx.moveTo(xl, yt - 6);
  ctx.lineTo(xl, yb);
  ctx.stroke();

  /* ---- 坐标刻度 ---- */
  ctx.font = '10px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(160,215,255,0.55)';
  const qTicks = [-2, -1, 0, 1, 2];
  for(let i = 0; i < qTicks.length; i++){
    const x = xOfQ(qTicks[i] * Q_BZ);
    ctx.beginPath();
    ctx.moveTo(x, yb);
    ctx.lineTo(x, yb + 5);
    ctx.strokeStyle = 'rgba(140,200,255,0.34)';
    ctx.stroke();
    ctx.fillText(qTicks[i] + '', x, yb + 17);
  }
  ctx.fillStyle = 'rgba(170,220,255,0.60)';
  ctx.fillText('q  (单位 π/a)', W / 2, yb + 34);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(160,215,255,0.55)';
  const wTicks = [0, 0.5, 1.0, 1.5];
  for(let i = 0; i < wTicks.length; i++){
    const y = yOfW(wTicks[i] * OMEGA_MAX);
    ctx.beginPath();
    ctx.moveTo(xl - 5, y);
    ctx.lineTo(xl, y);
    ctx.strokeStyle = 'rgba(140,200,255,0.34)';
    ctx.stroke();
    ctx.fillText(wTicks[i].toFixed(1), xl - 9, y + 3.5);
  }
  ctx.save();
  ctx.translate(22, (yt + yb) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(170,220,255,0.60)';
  ctx.fillText('ω / ω_max', 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';

  /* ---- 第一布里渊区边界标注 ---- */
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(200,150,255,0.42)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(xOfQ(-Q_BZ), yt);
  ctx.lineTo(xOfQ(-Q_BZ), yb);
  ctx.moveTo(xOfQ(Q_BZ), yt);
  ctx.lineTo(xOfQ(Q_BZ), yb);
  ctx.stroke();
  ctx.restore();

  ctx.font = '10px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(210,165,255,0.72)';
  ctx.textAlign = 'center';
  ctx.fillText('−π/a', xOfQ(-Q_BZ), yt - 8);
  ctx.fillText('+π/a', xOfQ(Q_BZ), yt - 8);
  ctx.textAlign = 'left';

  /* ---- 声学支 ---- */
  const NP = 420;
  const pts = [];
  for(let i = 0; i <= NP; i++){
    const q = qOfU(i / NP);
    pts.push({ x: xOfQ(q), y: yOfW(omegaAc(q)), w: omegaAc(q) });
  }

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  /* 渐变 */
  const grad = ctx.createLinearGradient(xl, 0, xr, 0);
  for(let i = 0; i <= 20; i++){
    const u = i / 20;
    const hue = 196 + 96 * Math.abs(Math.sin(u * Math.PI * 2));
    grad.addColorStop(u, 'hsla(' + hue + ',100%,70%,1)');
  }

  /* 宽光晕 */
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i = 1; i <= NP; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.save();
  ctx.strokeStyle = grad;
  ctx.globalAlpha = 0.16;
  ctx.lineWidth = 13;
  ctx.stroke();
  ctx.globalAlpha = 0.34;
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.restore();

  /* 主线 */
  ctx.save();
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.4;
  ctx.shadowBlur = 18;
  ctx.shadowColor = 'rgba(150,180,255,0.75)';
  ctx.stroke();
  ctx.restore();

  /* ---- 光支 ---- */
  if(st.showOpt){
    const opts = [];
    for(let i = 0; i <= NP; i++){
      const q = qOfU(i / NP);
      opts.push({ x: xOfQ(q), y: yOfW(omegaOpt(q)) });
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.moveTo(opts[0].x, opts[0].y);
    for(let i = 1; i <= NP; i++) ctx.lineTo(opts[i].x, opts[i].y);
    ctx.save();
    ctx.setLineDash([7, 5]);
    ctx.strokeStyle = 'rgba(255,150,235,0.85)';
    ctx.lineWidth = 1.9;
    ctx.shadowBlur = 14;
    ctx.shadowColor = 'rgba(255,130,230,0.9)';
    ctx.stroke();
    ctx.restore();

    /* 光支渐隐填充 */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    for(let i = 0; i <= NP; i++){
      const q = qOfU(i / NP);
      const x = xOfQ(q);
      if(i === 0) ctx.moveTo(x, yOfW(omegaOpt(q)));
      else ctx.lineTo(x, yOfW(omegaOpt(q)));
    }
    for(let i = NP; i >= 0; i--){
      const q = qOfU(i / NP);
      ctx.lineTo(xOfQ(q), yOfW(omegaAc(q)));
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(200,120,255,0.055)';
    ctx.fill();
    ctx.restore();
  }

  /* ---- 当前 q 标记 ---- */
  const qNow = st.qS * Q_BZ;
  const wNow = omegaAc(qNow);
  const mx = xOfQ(qNow);
  const my = yOfW(wNow);

  ctx.globalCompositeOperation = 'lighter';

  /* 竖直虚线 */
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(180,240,255,0.48)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(mx, yb);
  ctx.lineTo(mx, my);
  ctx.stroke();
  ctx.restore();

  /* 标记光点 */
  const pulse = 1 + 0.18 * Math.sin(st.clock * 5);
  const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 26 * pulse);
  mg.addColorStop(0,   'rgba(255,255,255,0.95)');
  mg.addColorStop(0.22,'rgba(160,235,255,0.62)');
  mg.addColorStop(0.55,'rgba(150,140,255,0.22)');
  mg.addColorStop(1,   'rgba(120,80,255,0)');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.arc(mx, my, 26 * pulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(mx, my, 3.6, 0, Math.PI * 2);
  ctx.fill();

  /* 群速度箭头（水平分量 ∝ dω/dq） */
  const vg = groupVel(qNow);
  const vgScale = 82 / OMEGA_MAX / (A_LAT / 2) * 0.62;
  const vgLen = vg * (A_LAT / 2) * vgScale / (OMEGA_MAX * A_LAT / 2) * 70;
  const realVgLen = (Math.abs(vg) / V_SOUND) * 72;
  if(realVgLen > 2){
    const dir = vg >= 0 ? 1 : -1;
    ctx.strokeStyle = 'rgba(120,255,210,0.85)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.lineTo(mx + dir * realVgLen, my);
    ctx.stroke();
    ctx.fillStyle = 'rgba(120,255,210,0.85)';
    ctx.beginPath();
    ctx.moveTo(mx + dir * realVgLen, my);
    ctx.lineTo(mx + dir * realVgLen - 8 * dir, my - 4);
    ctx.lineTo(mx + dir * realVgLen - 8 * dir, my + 4);
    ctx.closePath();
    ctx.fill();

    ctx.font = '10px ui-monospace, Consolas, monospace';
    ctx.fillStyle = 'rgba(150,255,220,0.85)';
    ctx.textAlign = 'center';
    ctx.fillText('v_g', mx + dir * realVgLen * 0.5, my - 9);
    ctx.textAlign = 'left';
  }

  /* ---- 文字标注 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.font = '11px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(190,230,255,0.55)';
  ctx.fillText('声学支  ω(q) = ω_max·sin(qa/2)', xl + 8, yt - 26);

  if(st.showOpt){
    ctx.fillStyle = 'rgba(255,160,235,0.72)';
    ctx.fillText('光支（示意）', xl + 8, yt - 10);
  }
}

/* ============================================================
   主循环
============================================================ */
let prevT = performance.now();
let uiTick = 0;

function frame(now){
  let dt = (now - prevT) / 1000;
  prevT = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);

  drawBackground();
  drawStars();
  drawLattice();
  drawDispersion();

  uiTick++;
  if(uiTick % 5 === 0) updateUI();

  requestAnimationFrame(frame);
}

updateUI();
requestAnimationFrame(frame);

})();
</script>
