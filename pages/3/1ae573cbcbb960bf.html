<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boy曲面浸入 · 射影平面线网</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.08em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 72px rgba(170,150,130,0.22);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.85vw, 0.64rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 16px rgba(155,145,125,0.32);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.16);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.38rem, 0.7vw, 0.56rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">Boy曲面浸入 · 射影平面线网</div>
        <div class="subtitle">BOY'S SURFACE &nbsp;·&nbsp; IMMERSION OF ℝℙ²</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">u‑线:</span> u∈[0,π] 固定 v &nbsp;
            <span class="c2">v‑线:</span> v∈[0,π] 固定 u &nbsp;
            <span class="c3">斜线:</span> u+v=const
            <br>
            <span style="color:#9aa8b8;">x=(cos u·sin 2v+cos 2u·sin v)·R &nbsp;|&nbsp; 3重对称 &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 20);

        const camera = new THREE.PerspectiveCamera(
            50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 22
        );
        camera.position.set(1.1, 0.6, 6.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_SPHERE = '#3a4a5c', C_GLINT = '#8898aa';
        const VIEW_R = 2.55;

        // ==================== Boy曲面参数方程 (Apéry模型) ====================
        function boySurface(u, v) {
            const cosU = Math.cos(u), sinU = Math.sin(u);
            const cosV = Math.cos(v), sinV = Math.sin(v);
            const cos2U = Math.cos(2*u), sin2U = Math.sin(2*u);
            const x = (cosU * sinV + cos2U * sinU * Math.cos(v)) / 2;
            const y = (sinU * sinV + sin2U * Math.cos(v)) / 2;
            const z = (cosU * Math.cos(v) + sinU * Math.cos(2*v)) / 2;
            return new THREE.Vector3(x, y, z).multiplyScalar(VIEW_R / 0.8);
        }

        // ==================== 生成曲线簇 ====================
        function generateCurves(type, numCurves, pointsPerCurve) {
            const curves = [];
            if (type === 'u') {
                const vValues = [];
                for (let k = 0; k <= numCurves; k++) {
                    vValues.push((k / numCurves) * Math.PI);
                }
                for (const v of vValues) {
                    const pts = [];
                    for (let i = 0; i <= pointsPerCurve; i++) {
                        const u = (i / pointsPerCurve) * Math.PI;
                        pts.push(boySurface(u, v));
                    }
                    curves.push(pts);
                }
            } else if (type === 'v') {
                const uValues = [];
                for (let k = 0; k <= numCurves; k++) {
                    uValues.push((k / numCurves) * Math.PI);
                }
                for (const u of uValues) {
                    const pts = [];
                    for (let i = 0; i <= pointsPerCurve; i++) {
                        const v = (i / pointsPerCurve) * Math.PI;
                        pts.push(boySurface(u, v));
                    }
                    curves.push(pts);
                }
            } else if (type === 'diag') {
                const offsets = [];
                for (let k = 0; k <= numCurves; k++) {
                    offsets.push((k / numCurves) * Math.PI);
                }
                for (const c of offsets) {
                    const pts = [];
                    for (let i = 0; i <= pointsPerCurve; i++) {
                        const t = (i / pointsPerCurve) * Math.PI;
                        const u = t;
                        const v = (c - t + Math.PI) % Math.PI;
                        pts.push(boySurface(u, v));
                    }
                    curves.push(pts);
                }
            }
            return curves;
        }

        const numCurves = 30;
        const samples = 180;

        console.log('生成u-线...');
        const uCurves = generateCurves('u', numCurves, samples);
        console.log('生成v-线...');
        const vCurves = generateCurves('v', numCurves, samples);
        console.log('生成斜线...');
        const dCurves = generateCurves('diag', numCurves, samples);

        function createLineGroup(curvesArr, colorHex, opacity) {
            const group = new THREE.Group();
            for (const pts of curvesArr) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const groupU = createLineGroup(uCurves, C1, 0.48);
        const groupV = createLineGroup(vCurves, C2, 0.45);
        const groupD = createLineGroup(dCurves, C3, 0.42);

        const mainGroup = new THREE.Group();
        mainGroup.add(groupU);
        mainGroup.add(groupV);
        mainGroup.add(groupD);
        scene.add(mainGroup);

        // 参考球面线框
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 160;
            const circles = [
                (a) => new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0),
                (a) => new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius),
                (a) => new THREE.Vector3(0, Math.cos(a)*radius, Math.sin(a)*radius),
            ];
            for (const gen of circles) {
                const pts = [];
                for (let i=0; i<=segs; i++) pts.push(gen((i/segs)*Math.PI*2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(VIEW_R, C_SPHERE, 0.2);
        scene.add(sphereRef);

        function originGlint() {
            const group = new THREE.Group();
            const sz = 0.07;
            const pairs = [
                [new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0)],
                [new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0)],
                [new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)],
            ];
            for (const [a,b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true, opacity: 0.7, depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(originGlint());

        // 动画循环
        let time = 0, lastTime = performance.now(), frameCount = 0, logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s`);
                logTime = now;
            }

            mainGroup.rotation.y = time * 0.3;
            mainGroup.rotation.x = time * 0.17 + Math.sin(time * 0.26) * 0.22;
            mainGroup.rotation.z = Math.cos(time * 0.22) * 0.16;
            sphereRef.rotation.copy(mainGroup.rotation);

            const camX = 1.1 + Math.sin(time * 0.14) * 0.55;
            const camY = 0.6 + Math.cos(time * 0.18) * 0.5;
            camera.position.set(camX, camY, 6.8);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== Boy曲面浸入 · 射影平面线网 ===');
        console.log('u-线:', uCurves.length, 'v-线:', vCurves.length, '斜线:', dCurves.length);
        console.log('总曲线数:', uCurves.length + vCurves.length + dCurves.length);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
