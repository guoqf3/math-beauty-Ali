<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每次都不一样 · 脉动生物</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    cursor:crosshair;
  }
  canvas{display:block;position:fixed;inset:0;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  /* ---------- 左上标题 ---------- */
  #title{
    position:absolute;top:0;left:0;
    padding:42px 48px;opacity:0;
    animation:fade 1.8s 0.3s ease forwards;
  }
  #title h1{
    font-size:clamp(22px,3.4vw,46px);
    font-weight:200;
    letter-spacing:.36em;text-indent:.36em;
    background:linear-gradient(96deg,#80a0ff 0%,#c09eff 38%,#ffb8d0 72%,#ffeecc 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:16px;
    filter:drop-shadow(0 0 32px rgba(160,120,240,.42));
  }
  #title .en{
    font-size:10px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(170,180,240,.38);font-weight:300;margin-bottom:18px;
  }
  #title .sub{
    font-size:11px;letter-spacing:.22em;
    color:rgba(180,170,230,.30);line-height:2.0;font-weight:300;
  }

  /* ---------- 左下参数 ---------- */
  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 48px 42px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(150,165,230,.26);opacity:0;
    animation:fade 1.8s 1.2s ease forwards;
  }
  #stats .k{color:rgba(200,170,255,.52);}
  #stats .v{color:rgba(255,215,150,.62);}
  #stats .lab{
    display:block;font-size:8.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(130,145,210,.22);margin-bottom:8px;
  }

  /* ---------- 右下按钮 ---------- */
  #btnWrap{
    position:absolute;bottom:0;right:0;
    padding:0 48px 42px;opacity:0;
    animation:fade 1.8s 1.6s ease forwards;
    pointer-events:auto;
  }
  #regen{
    font-family:inherit;
    font-size:11px;letter-spacing:.34em;text-indent:.34em;
    color:rgba(230,220,255,.88);
    background:rgba(20,14,50,.28);cursor:pointer;
    border:1px solid rgba(160,140,255,.34);
    border-radius:999px;padding:15px 34px;
    transition:.42s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  #regen:hover{
    border-color:rgba(230,200,255,.92);
    box-shadow:0 0 36px rgba(160,140,255,.48);
    background:rgba(100,80,200,.16);
    transform:translateY(-1px);
  }
  #regen:active{transform:translateY(0);}

  /* ---------- 右上角小标 ---------- */
  #sig{
    position:absolute;top:0;right:0;
    padding:42px 48px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.32em;
    color:rgba(130,150,210,.20);opacity:0;
    animation:fade 1.8s 1.4s ease forwards;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:22px 22px;}
    #title .sub{font-size:9.5px;}
    #stats{padding:0 22px 22px;font-size:8.5px;}
    #btnWrap{padding:0 22px 22px;}
    #regen{padding:12px 22px;font-size:9.5px;}
    #sig{padding:22px 22px;font-size:8px;letter-spacing:.22em;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <h1>每次都不一样</h1>
    <div class="en">EVERY CLICK IS A NEW ORGANISM</div>
    <div class="sub">
      极坐标谐波叠加 · 脉动生物生成<br>
      这只生物，只属于此刻
    </div>
  </div>

  <div id="sig">
    PULSE · ORGANISM<br>
    POLAR HARMONIC FIELD
  </div>

  <div id="stats">
    <span class="lab">ORGANISM PARAMS</span>
    <div><span class="k">species  </span><span class="v" id="sp">–</span></div>
    <div><span class="k">petals   </span><span class="v" id="pt">–</span></div>
    <div><span class="k">harmonics</span><span class="v" id="hm">–</span></div>
    <div><span class="k">hue      </span><span class="v" id="hu">–</span></div>
    <div style="margin-top:6px;"><span class="k">seed     </span><span class="v" id="sd">–</span></div>
  </div>

  <div id="btnWrap">
    <button id="regen">再 来 一 只</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                 window.innerWidth < 720;

let W = 0, H = 0, DPR = 1, S = 0, bg = null;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.min(W, H);

  bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, S * 0.95);
  bg.addColorStop(0.00, '#0c0822');
  bg.addColorStop(0.35, '#060315');
  bg.addColorStop(0.72, '#020109');
  bg.addColorStop(1.00, '#000002');
}

/* =========================================================
   1. 配色方案
   ========================================================= */
const PALETTES = [
  { h: 320, spread: 55 },   // 品红
  { h: 180, spread: 65 },   // 青色
  { h: 270, spread: 50 },   // 紫色
  { h:  40, spread: 55 },   // 橙色
  { h: 145, spread: 60 },   // 绿色
  { h: 355, spread: 70 },   // 红色
  { h: 210, spread: 55 },   // 蓝色
  { h:  90, spread: 55 },   // 黄绿
  { h: 295, spread: 70 },   // 紫品
  { h:  55, spread: 60 }    // 黄色
];

/* =========================================================
   2. 物种定义 —— 决定形态大类
   ========================================================= */
const SPECIES = [
  { name: '花瓣型', en: 'FLOWER',
    petals: [3, 10],  pow: [0.9, 3.0], amp: [0.28, 0.62],
    spike: false, drift: [0.02, 0.10],
    pool: [3, 4, 5, 6, 7, 8, 10, 12] },
  { name: '星芒型', en: 'STAR',
    petals: [4, 12],  pow: [3.0, 9.0], amp: [0.35, 0.72],
    spike: true,  drift: [0.02, 0.08],
    pool: [5, 6, 7, 8, 9, 11, 13] },
  { name: '珊瑚型', en: 'POLYP',
    petals: [8, 18],  pow: [1.0, 2.5], amp: [0.20, 0.48],
    spike: false, drift: [0.04, 0.14],
    pool: [9, 11, 13, 17, 21, 26] },
  { name: '团块型', en: 'BLOB',
    petals: [2, 5],   pow: [0.8, 2.0], amp: [0.14, 0.38],
    spike: false, drift: [0.06, 0.18],
    pool: [2, 3, 4, 5, 6, 7] },
  { name: '变形虫', en: 'AMOEBA',
    petals: [3, 8],   pow: [1.0, 4.0], amp: [0.18, 0.50],
    spike: false, drift: [0.06, 0.20],
    pool: [2, 3, 5, 7, 8, 11, 13] },
  { name: '球状型', en: 'ORB',
    petals: [2, 4],   pow: [0.5, 1.6], amp: [0.06, 0.20],
    spike: false, drift: [0.03, 0.12],
    pool: [2, 3, 4, 6, 8] },
  { name: '海胆型', en: 'URCHIN',
    petals: [6, 16],  pow: [2.5, 7.0], amp: [0.40, 0.78],
    spike: true,  drift: [0.02, 0.10],
    pool: [4, 5, 6, 7, 9, 11, 13] }
];

/* =========================================================
   3. 随机工具
   ========================================================= */
const rnd = Math.random;
const rand = (a, b) => a + rnd() * (b - a);
const randInt = (a, b) => a + ((rnd() * (b - a + 1)) | 0);

/* =========================================================
   4. 生成一个新的生物形态
   ========================================================= */
const NH_MAX = 6;

function makeMorphology(){
  const sp = SPECIES[(rnd() * SPECIES.length) | 0];

  /* ---- 主花瓣/尖刺波 ---- */
  const petalCount = randInt(sp.petals[0], sp.petals[1]);
  const petalPow   = rand(sp.pow[0], sp.pow[1]);
  const petalAmp   = rand(sp.amp[0], sp.amp[1]);
  const petalPhase = rnd() * TAU;
  const petalRotSpd = (rnd() - 0.5) * 0.9;

  /* ---- 谐波组 ---- */
  const nH = randInt(3, NH_MAX);
  const freqs = new Float32Array(NH_MAX);
  const amps  = new Float32Array(NH_MAX);
  const spds  = new Float32Array(NH_MAX);
  const phs   = new Float32Array(NH_MAX);

  const ampBase  = rand(0.05, 0.20);
  const ampRatio = rand(0.42, 0.78);
  const usedFreq = new Set();

  for (let k = 0; k < nH; k++){
    let f, tries = 0;
    do {
      f = sp.pool[(rnd() * sp.pool.length) | 0];
      tries++;
    } while (usedFreq.has(f) && tries < 20 && usedFreq.size < sp.pool.length);
    usedFreq.add(f);

    freqs[k] = f;
    amps[k]  = ampBase * Math.pow(ampRatio, k);
    spds[k]  = (rnd() - 0.5) * 2.4;
    phs[k]   = rnd() * TAU;
  }

  /* ---- 不对称漂移 ---- */
  const driftAmp  = rand(sp.drift[0], sp.drift[1]);
  const driftFreq = rand(0.8, 2.4);
  const driftSpd  = rand(0.3, 1.4);

  /* ---- 整体 ---- */
  const stretchX  = rand(0.72, 1.28);
  const stretchY  = rand(0.72, 1.28);
  const baseScale = rand(0.80, 1.25);
  const rotSpd    = (rnd() - 0.5) * 0.42;

  /* ---- 呼吸 ---- */
  const breatheSpeed = rand(0.55, 1.55);
  const breatheAmp   = rand(0.045, 0.125);

  /* ---- 层数 ---- */
  const layers = randInt(5, 9);

  /* ---- 配色 ---- */
  const palette = PALETTES[(rnd() * PALETTES.length) | 0];

  const m = {
    species: sp, name: sp.name, en: sp.en,
    petalCount, petalPow, petalAmp, petalPhase, petalRotSpd,
    spike: sp.spike,
    nH, freqs, amps, spds, phs,
    driftAmp, driftFreq, driftSpd,
    stretchX, stretchY, baseScale, rotSpd,
    breatheSpeed, breatheAmp,
    layers, palette,
    seed: (rnd() * 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0')
  };

  /* ---- 归一化：让最大半径 ≈ 1 ---- */
  let maxR = 1e-6;
  for (let i = 0; i < 480; i++){
    const th = (i / 480) * TAU;
    const r = radiusAt(th, 0, m);
    if (r > maxR) maxR = r;
  }
  m.normR = 1 / maxR;

  return m;
}

/* =========================================================
   5. 核心：半径函数
      r(θ,t) = 1
             + petalAmp · |cos/sin(petalCount·θ/2 + φ + ωt)|^petalPow
             + Σ aₖ · sin(nₖ·θ + ωₖ·t + φₖ)
             + driftAmp · sin(driftFreq·θ + driftSpd·t)
   ========================================================= */
function radiusAt(th, t, m){
  let r = 1.0;

  // 1. 主花瓣 / 尖刺包络
  if (m.petalAmp > 0.001){
    const phase = m.petalCount * th * 0.5 + m.petalPhase + t * m.petalRotSpd;
    const u = m.spike ? Math.abs(Math.sin(phase)) : Math.abs(Math.cos(phase));
    r += m.petalAmp * Math.pow(u, m.petalPow);
  }

  // 2. 谐波叠加
  const nH = m.nH;
  const freqs = m.freqs, amps = m.amps, spds = m.spds, phs = m.phs;
  for (let k = 0; k < nH; k++){
    r += amps[k] * Math.sin(freqs[k] * th + spds[k] * t + phs[k]);
  }

  // 3. 不对称漂移
  r += m.driftAmp * Math.sin(m.driftFreq * th + m.driftSpd * t);

  return r > 0.05 ? r : 0.05;
}

/* =========================================================
   6. 采样缓存
   ========================================================= */
const N = isMobile ? 420 : 720;
const pxArr = new Float32Array(N);
const pyArr = new Float32Array(N);

/* =========================================================
   7. 发光精灵
   ========================================================= */
const sprite = document.createElement('canvas');
(function(){
  const gs = 64;
  sprite.width = sprite.height = gs;
  const g = sprite.getContext('2d');
  const rg = g.createRadialGradient(gs/2, gs/2, 0, gs/2, gs/2, gs/2);
  rg.addColorStop(0.00, 'rgba(255,250,238,1.0)');
  rg.addColorStop(0.18, 'rgba(255,228,175,0.72)');
  rg.addColorStop(0.44, 'rgba(255,185,115,0.18)');
  rg.addColorStop(0.75, 'rgba(255,155,90,0.04)');
  rg.addColorStop(1.00, 'rgba(255,140,80,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, gs, gs);
})();

/* =========================================================
   8. 环境尘埃
   ========================================================= */
const DUST_N = isMobile ? 70 : 110;
const dust = [];
for (let i = 0; i < DUST_N; i++){
  dust.push({
    x: rnd(), y: rnd(),
    r: rnd() * 1.4 + 0.28,
    ph: rnd() * TAU,
    sp: 0.08 + rnd() * 0.32,
    hue: 250 + rnd() * 110
  });
}

/* =========================================================
   9. 运行时状态
   ========================================================= */
let morph = null;
let energy = 0;          // 点击脉冲能量
let rot = 0;             // 累计旋转
let lastNow = performance.now();

/* =========================================================
   10. 渲染
   ========================================================= */
function render(t, dt){
  const m = morph;
  const cx = W * 0.5;
  const cy = H * 0.5;

  /* ---- 背景 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* ---- 环境尘埃 ---- */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < dust.length; i++){
    const p = dust[i];
    const x = p.x * W + Math.sin(t * p.sp + p.ph) * 22;
    const y = p.y * H + Math.cos(t * p.sp * 0.66 + p.ph * 1.4) * 26;
    const a = 0.04 + 0.14 * (0.5 + 0.5 * Math.sin(t * 0.70 + p.ph * 2.0));
    ctx.fillStyle = `hsla(${p.hue}, 85%, 76%, ${a})`;
    ctx.beginPath();
    ctx.arc(x, y, p.r, 0, TAU);
    ctx.fill();
  }

  if (!m) return;

  /* ---- 呼吸 / 脉动 ---- */
  const breathe = 1
    + m.breatheAmp * Math.sin(t * m.breatheSpeed)
    + m.breatheAmp * 0.42 * Math.sin(t * m.breatheSpeed * 1.73 + 1.2)
    + energy * 0.14 * Math.sin(t * 7.0);

  const Rbase = S * 0.24 * m.baseScale * m.normR * breathe;

  rot += m.rotSpd * dt;

  /* ---- 采样轮廓 ---- */
  for (let i = 0; i < N; i++){
    const thP = (i / N) * TAU;
    const r   = radiusAt(thP, t, m) * Rbase;
    const thS = thP + rot;
    const cs = Math.cos(thS), sn = Math.sin(thS);
    pxArr[i] = cx + cs * r * m.stretchX;
    pyArr[i] = cy + sn * r * m.stretchY;
  }

  const hb = m.palette;

  /* ---- 外层柔光晕 ---- */
  {
    const haloR = Rbase * 1.95;
    const g = ctx.createRadialGradient(cx, cy, Rbase * 0.35, cx, cy, haloR);
    const ha = 0.05 + energy * 0.12;
    g.addColorStop(0.00, `hsla(${hb.h}, ${hb.spread+40}%, 62%, 0)`);
    g.addColorStop(0.62, `hsla(${hb.h}, 100%, 62%, ${ha})`);
    g.addColorStop(0.88, `hsla(${hb.h}, 100%, 62%, ${ha * 1.6})`);
    g.addColorStop(1.00, `hsla(${hb.h}, 100%, 60%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, haloR, 0, TAU);
    ctx.fill();
  }

  /* ---- 中心细胞核 ---- */
  {
    const coreR = Rbase * 0.34 * (1 + 0.22 * Math.sin(t * 1.55) + energy * 0.55);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    g.addColorStop(0.00, `hsla(48, 100%, 94%, ${0.62 + energy * 0.30})`);
    g.addColorStop(0.20, 'hsla(38, 100%, 82%, 0.38)');
    g.addColorStop(0.55, `hsla(${hb.h}, 100%, 70%, 0.14)`);
    g.addColorStop(1.00, `hsla(${hb.h}, 100%, 62%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, TAU);
    ctx.fill();
  }

  /* ---- 多层轮廓 ---- */
  const LAYERS = m.layers;
  const hueSwing = 12 * Math.sin(t * 0.23);
  const lwBase = Math.max(1.2, S * 0.0014);

  for (let L = LAYERS; L >= 1; L--){
    const ratio = L / LAYERS;

    ctx.beginPath();
    for (let i = 0; i <= N; i++){
      const idx = i % N;
      const x = cx + (pxArr[idx] - cx) * ratio;
      const y = cy + (pyArr[idx] - cy) * ratio;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const hue   = ((hb.h - ratio * hb.spread + hueSwing
                  + 14 * Math.sin(t * 0.4 + ratio * 3.2)) % 360 + 360) % 360;
    const sat   = 72 + (1 - ratio) * 26;
    const lig   = 28 + (1 - ratio) * 48;
    const alpha = 0.06 + Math.pow(1 - ratio, 1.8) * 0.62;

    // 光晕层
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${Math.min(94, lig + 28)}%, ${alpha * 0.22})`;
    ctx.lineWidth = (1 - ratio) * lwBase * 4.5 + lwBase * 5;
    ctx.stroke();

    // 本体
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${lig}%, ${alpha})`;
    ctx.lineWidth = (1 - ratio) * lwBase * 2.6 + lwBase * 0.8;
    ctx.stroke();
  }

  /* ---- 径向脉络 ---- */
  const VEINS = isMobile ? 50 : 76;
  for (let v = 0; v < VEINS; v++){
    const thP = (v / VEINS) * TAU;
    const thS = thP + rot * 0.6;
    const rOut = radiusAt(thP, t, m) * Rbase;
    const rIn  = rOut * 0.13;

    const a   = 0.035 + 0.055 * (0.5 + 0.5 * Math.sin(thS * 9 + t * 2.3));
    const hue = ((hb.h - 30 + 50 * Math.sin(thS * 3 + t * 0.55)) % 360 + 360) % 360;

    ctx.strokeStyle = `hsla(${hue}, 90%, 74%, ${a})`;
    ctx.lineWidth = 0.55;

    const cI = Math.cos(thS), sI = Math.sin(thS);
    ctx.beginPath();
    ctx.moveTo(cx + cI * rIn * m.stretchX, cy + sI * rIn * m.stretchY);
    ctx.lineTo(cx + cI * rOut * 0.94 * m.stretchX,
               cy + sI * rOut * 0.94 * m.stretchY);
    ctx.stroke();
  }

  /* ---- 流动光点 ---- */
  const DOTS = isMobile ? 32 : 48;
  for (let d = 0; d < DOTS; d++){
    const thP = (d / DOTS) * TAU + t * 0.28 + 0.4 * Math.sin(d * 2.4);
    const thS = thP + rot;

    const base = radiusAt(thP, t, m) * Rbase;
    const rr   = base * (0.62 + 0.30 * Math.sin(d * 1.7 + t * 1.3));

    const x = cx + Math.cos(thS) * rr * m.stretchX;
    const y = cy + Math.sin(thS) * rr * m.stretchY;

    const tw = 0.5 + 0.5 * Math.sin(t * 3.1 + d * 1.9);
    const sz = S * 0.012 * (0.55 + 0.75 * tw);

    ctx.globalAlpha = (0.28 + 0.55 * tw) * (0.6 + 0.4 * energy);
    ctx.drawImage(sprite, x - sz * 0.5, y - sz * 0.5, sz, sz);
  }
  ctx.globalAlpha = 1;

  /* ---- 点击闪光 ---- */
  if (energy > 0.01){
    ctx.fillStyle = `rgba(255, 244, 228, ${energy * 0.16})`;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   11. 主循环
   ========================================================= */
let running = false;
let tickGen = 0;

function tick(now, myGen){
  if (myGen !== tickGen || !running) return;

  const t = now * 0.001;
  const dt = Math.min((now - lastNow) * 0.001, 0.05);
  lastNow = now;

  energy *= Math.exp(-3.2 * dt);

  render(t, dt);

  requestAnimationFrame(n => tick(n, myGen));
}

/* =========================================================
   12. 启动 / 重新生成
   ========================================================= */
function updateHUD(){
  const m = morph;
  if (!m) return;
  document.getElementById('sp').textContent = m.name + ' (' + m.en + ')';
  document.getElementById('pt').textContent =
    m.petalCount + (m.spike ? ' 尖刺' : ' 花瓣');
  document.getElementById('hm').textContent = m.nH + ' 组';
  document.getElementById('hu').textContent = m.palette.h + '°';
  document.getElementById('sd').textContent = m.seed;
}

function start(){
  running = false;
  tickGen++;
  const myGen = tickGen;

  resize();

  morph = makeMorphology();
  energy = 1.6;
  rot = 0;
  lastNow = performance.now();

  updateHUD();

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  running = true;
  requestAnimationFrame(n => tick(n, myGen));
}

/* ---------- 重新生成 ---------- */
let regenTimer = null;

function regen(){
  if (regenTimer){ clearTimeout(regenTimer); regenTimer = null; }
  running = false;
  tickGen++;

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  regenTimer = setTimeout(() => {
    regenTimer = null;
    start();
  }, 110);
}

document.getElementById('regen').addEventListener('click', e => {
  e.stopPropagation();
  regen();
});

/* ---------- 点击画布任意位置也可生成 ---------- */
canvas.addEventListener('pointerdown', regen);

/* ---------- 尺寸变化 ---------- */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (regenTimer){ clearTimeout(regenTimer); regenTimer = null; }
    start();
  }, 300);
});

/* =========================================================
   13. 启动
   ========================================================= */
start();

})();
</script>
</body>
