<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一行代码的炫彩螺旋 · One-Line Spiral</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#04050a;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;}

  /* ---------- 左上标题 ---------- */
  #brand{
    position:fixed;top:0;left:0;z-index:5;
    padding:30px 36px;pointer-events:none;
    opacity:0;transition:opacity 1.6s .4s;
  }
  #brand.on{opacity:1;}
  #brand h1{
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:clamp(13px,1.5vw,17px);
    font-weight:300;letter-spacing:.46em;text-indent:.46em;
    color:rgba(200,214,255,.70);
    margin-bottom:11px;
  }
  #brand .en{
    font-size:9px;letter-spacing:.40em;text-indent:.40em;
    color:rgba(140,160,215,.30);
  }

  /* ---------- 右上：动态计数 + 镜头倍率 ---------- */
  #counter{
    position:fixed;top:0;right:0;z-index:5;
    padding:30px 36px;text-align:right;pointer-events:none;
    opacity:0;transition:opacity 1.6s .7s;
  }
  #counter.on{opacity:1;}
  #counter .lbl{
    display:block;font-size:9px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(140,160,215,.28);margin-bottom:8px;
  }
  #counter .num{
    display:block;
    font-size:clamp(19px,2.5vw,32px);
    font-weight:200;letter-spacing:.08em;
    color:rgba(255,205,130,.58);
    font-variant-numeric:tabular-nums;
    transition:color .5s;
  }
  #counter .zoom{
    display:block;margin-top:10px;
    font-size:10px;letter-spacing:.26em;
    color:rgba(140,205,255,.42);
    font-variant-numeric:tabular-nums;
  }
  #counter .zoom b{
    font-weight:400;color:rgba(188,150,255,.62);
  }

  /* ---------- 左下：核心循环 ---------- */
  #code{
    position:fixed;left:0;bottom:0;z-index:5;
    padding:0 36px 30px;pointer-events:none;
    opacity:0;transition:opacity 1.6s 1.0s;
    font-size:clamp(9px,1.0vw,11.5px);
    line-height:2.05;
    letter-spacing:.02em;
  }
  #code.on{opacity:1;}
  #code .ln{
    display:block;
    color:rgba(150,172,225,.28);
    white-space:pre;
  }
  #code .kw{color:rgba(188,150,255,.58);}
  #code .fn{color:rgba(140,205,255,.56);}
  #code .nm{color:rgba(255,205,130,.62);}
  #code .cm{color:rgba(110,128,170,.22);font-style:italic;}

  /* ---------- 右下 ---------- */
  #hint{
    position:fixed;right:0;bottom:0;z-index:5;
    padding:0 36px 30px;pointer-events:none;
    text-align:right;
    opacity:0;transition:opacity 1.6s 1.4s;
  }
  #hint.on{opacity:1;}
  #hint .big{
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:clamp(10px,1.1vw,12.5px);
    letter-spacing:.34em;text-indent:.34em;
    color:rgba(255,205,130,.46);
    margin-bottom:10px;font-weight:300;
  }
  #hint .small{
    font-size:9px;letter-spacing:.22em;
    color:rgba(140,160,215,.26);
    line-height:1.9;
  }

  @media (max-width:640px){
    #brand{padding:18px 20px;}
    #counter{padding:18px 20px;}
    #counter .zoom{font-size:8.5px;}
    #code{padding:0 20px 18px;}
    #hint{padding:0 20px 18px;}
    #hint .small{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="brand">
  <h1>炫彩螺旋</h1>
  <div class="en">ONE-LINE SPIRAL · GROW &amp; FADE</div>
</div>

<div id="counter">
  <span class="lbl">TRIANGLES</span>
  <span class="num" id="numTri">000</span>
  <span class="zoom">CAM <b id="numZoom">×1.42</b></span>
</div>

<div id="code">
  <span class="ln"><span class="kw">for</span>(<span class="kw">let</span> i=<span class="nm">0</span>; i&lt;<span class="nm">count</span>(t); i++){</span>
  <span class="ln">  <span class="fn">drawTri</span>( <span class="nm">r</span>ᵢ, <span class="nm">θ</span>ᵢ, <span class="nm">hue</span>ᵢ );</span>
  <span class="ln">}</span>
  <span class="ln cm">// count(t): 0 → N → 0 往复</span>
  <span class="ln cm">// camZ(t): 1.42 → 0.80 随数量推拉镜头</span>
</div>

<div id="hint">
  <div class="big">循环即是生长</div>
  <div class="small">
    边长递增 · 角度旋转 · 色相流动<br>
    EACH ITERATION, A LARGER TRIANGLE
  </div>
</div>

<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const numEl  = document.getElementById('numTri');
const zoomEl = document.getElementById('numZoom');

const TAU   = Math.PI * 2;
const THIRD = TAU / 3;

let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   核心参数
   ========================================================= */
const MAX_N = 196;      // 三角形数量的上限
const TURNS = 2.85;     // 螺旋总圈数
const HUE_A = 285;      // 内圈：紫罗兰
const HUE_B = 45;       // 外圈：金色
const CYCLE = 14.0;     // 生长—消退的完整周期（秒）

/* ---- 镜头推拉范围 ---- */
const CAM_NEAR = 1.42;  // 数量极少时：拉近（放大）
const CAM_FAR  = 0.76;  // 数量极多时：拉远（缩小）

/* ---- 三角形相对尺寸 ---- */
const TRI_SCALE = 0.30; // ★ 相对半径的边长比例（原 0.33，更小巧疏朗）

/* =========================================================
   数量曲线：0 → MAX_N → 0，往复循环
   ========================================================= */
function countAt(t){
  const p = (t % CYCLE) / CYCLE;
  let v;

  if (p < 0.36){                    // 增长
    v = p / 0.36;
  } else if (p < 0.46){             // 盛满停留
    v = 1;
  } else if (p < 0.84){             // 消退
    v = 1 - (p - 0.46) / 0.38;
  } else {                          // 空停
    v = 0;
  }

  /* smootherstep：两头缓、中间快 */
  v = v * v * v * (v * (v * 6 - 15) + 10);
  return v * MAX_N;
}

/* =========================================================
   背景
   ========================================================= */
function drawBackground(fillRatio){
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#04050a';
  ctx.fillRect(0, 0, W, H);

  const cx = W * 0.5, cy = H * 0.5;

  const boost = 0.26 + (1 - fillRatio) * 0.16;

  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.58);
  g.addColorStop(0.00, 'rgba(62, 46, 128, ' + boost.toFixed(3) + ')');
  g.addColorStop(0.38, 'rgba(30, 24, 68, 0.13)');
  g.addColorStop(0.72, 'rgba(12, 12, 30, 0.04)');
  g.addColorStop(1.00, 'rgba(4, 5, 10, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawVignette(strength){
  const v = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.26,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.82
  );
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,' + strength.toFixed(3) + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   主循环
   ========================================================= */
let startTS = 0;
let lastShown = -1;
let lastZoomShown = '';

function frame(now){
  requestAnimationFrame(frame);
  if (!startTS) startTS = now;
  const t = (now - startTS) / 1000;

  /* ---------- 数量 ---------- */
  const count     = countAt(t);
  const full      = Math.floor(count);
  const frac      = count - full;
  const fillRatio = count / MAX_N;

  drawBackground(fillRatio);

  /* =======================================================
     ★ 镜头推拉：数量少 → 拉近，数量多 → 拉远 ★
     ======================================================= */
  const easeFill = fillRatio * fillRatio * (3 - 2 * fillRatio);
  const camBase  = CAM_NEAR + (CAM_FAR - CAM_NEAR) * easeFill;
  const camScale = camBase * (1 + 0.012 * Math.sin(t * 1.1));

  /* ---------- 绘制参数 ---------- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  const cx    = W * 0.5;
  const cy    = H * 0.5;
  const pulse = 1 + 0.028 * Math.sin(t * 0.68);

  const bRMin = Math.max(7, Math.min(W, H) * 0.018);
  const bRMax = Math.min(W, H) * 0.465 * pulse;

  const rMin  = bRMin * camScale;
  const rMax  = bRMax * camScale;
  const ratio = rMax / rMin;

  const spin   = t * 0.13;
  const hueRun = t * 12;

  /* ---------- HUD ---------- */
  if (full !== lastShown){
    lastShown = full;
    numEl.textContent = String(full).padStart(3, '0');
  }
  const zStr = '×' + camBase.toFixed(2);
  if (zStr !== lastZoomShown){
    lastZoomShown = zStr;
    zoomEl.textContent = zStr;
  }

  /* =======================================================
     ★ 循环：196 个三角形依次生长 ★
     ======================================================= */
  for (let i = 0; i < MAX_N; i++){
    /* ---- 生长因子 g ---- */
    let g;
    if (i < full)        g = 1;
    else if (i === full) g = frac;
    else                 break;
    if (g <= 0.004) continue;

    const k = i / (MAX_N - 1);

    /* --- 半径指数递增（含镜头缩放） --- */
    const r = rMin * Math.pow(ratio, k);

    /* --- 沿对数螺旋旋转 --- */
    const ang = k * TAU * TURNS + spin;
    const x = cx + r * Math.cos(ang);
    const y = cy + r * Math.sin(ang);

    /* --- 色相从紫罗兰流向金色 --- */
    const hue   = (HUE_A + (HUE_B - HUE_A) * k + hueRun) % 360;
    const alpha = (0.11 + 0.58 * k) * g;
    const light = 56 + k * 14;

    /* --- 三角形几何（TRI_SCALE 已下调至 0.30） --- */
    const s  = r * TRI_SCALE;
    const a0 = ang + k * 1.55;

    const x1 = x + s * Math.cos(a0);
    const y1 = y + s * Math.sin(a0);
    const x2 = x + s * Math.cos(a0 + THIRD);
    const y2 = y + s * Math.sin(a0 + THIRD);
    const x3 = x + s * Math.cos(a0 + THIRD * 2);
    const y3 = y + s * Math.sin(a0 + THIRD * 2);

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.closePath();

    /* 外层柔光 */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',92%,64%,' +
                      (alpha * 0.13).toFixed(3) + ')';
    ctx.lineWidth = (2.6 + k * 5.6) * camScale;
    ctx.stroke();

    /* 内层主线 */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',88%,' +
                      light.toFixed(1) + '%,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = (0.55 + k * 1.45) * camScale;
    ctx.stroke();
  }

  /* =======================================================
     生长尖端的光点
     ======================================================= */
  if (count > 0.6){
    const tipIdx = Math.min(MAX_N - 1, count - 1);
    const tipK   = tipIdx / (MAX_N - 1);
    const tipR   = rMin * Math.pow(ratio, tipK);
    const tipAng = tipK * TAU * TURNS + spin;
    const tx = cx + tipR * Math.cos(tipAng);
    const ty = cy + tipR * Math.sin(tipAng);

    const tipHue = (HUE_A + (HUE_B - HUE_A) * tipK + hueRun) % 360;
    const glowR  = rMin * (1.6 + 0.5 * Math.sin(t * 3.2)) * 4;

    const tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, glowR);
    tg.addColorStop(0.00, 'hsla(' + tipHue.toFixed(1) + ',96%,86%,0.82)');
    tg.addColorStop(0.30, 'hsla(' + tipHue.toFixed(1) + ',92%,64%,0.28)');
    tg.addColorStop(1.00, 'hsla(' + tipHue.toFixed(1) + ',92%,64%,0)');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.arc(tx, ty, glowR, 0, TAU);
    ctx.fill();
  }

  /* ---------- 中心微光 ---------- */
  const cr = rMin * (3.6 + 0.9 * Math.sin(t * 1.4)) * (1 + (1 - fillRatio) * 1.5);
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
  cg.addColorStop(0.00, 'rgba(215,190,255,0.42)');
  cg.addColorStop(0.32, 'rgba(150,120,240,0.14)');
  cg.addColorStop(1.00, 'rgba(120,90,220,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(cx, cy, cr, 0, TAU);
  ctx.fill();

  /* ---------- 暗角 ---------- */
  ctx.globalCompositeOperation = 'source-over';
  const vigStrength = 0.72 - 0.14 * (1 - easeFill);
  drawVignette(vigStrength);
}

/* =========================================================
   启动
   ========================================================= */
requestAnimationFrame(function(){
  document.getElementById('brand').classList.add('on');
  document.getElementById('counter').classList.add('on');
  document.getElementById('code').classList.add('on');
  document.getElementById('hint').classList.add('on');
});

requestAnimationFrame(frame);

})();
</script>
</body>
</html>
