<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>圆周率无限展开 · π = 3.14159...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#000208;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  /* ---- 左上标题 ---- */
  #title{
    position:absolute;top:0;left:0;
    padding:30px 38px;opacity:0;
    animation:fade 1.8s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(140,190,255,.34);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(18px,2.6vw,32px);
    font-weight:200;letter-spacing:.30em;text-indent:.30em;
    background:linear-gradient(96deg,#5ee0ff 0%,#6ab8ff 34%,#b090ff 68%,#e090d0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 26px rgba(110,170,255,.48));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:11px;letter-spacing:.18em;
    color:rgba(170,200,250,.42);font-weight:300;
  }

  /* ---- 右上统计 ---- */
  #stats{
    position:absolute;top:0;right:0;
    padding:30px 38px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.12em;line-height:2.0;
    color:rgba(170,195,245,.34);
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
  }
  #stats .k{color:rgba(200,190,255,.54);}
  #stats .v{color:rgba(255,215,150,.88);}
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(150,180,240,.26);margin-bottom:6px;
  }
  #stats .bigv{
    font-size:clamp(20px,2.4vw,28px);
    font-weight:300;letter-spacing:.06em;
    color:rgba(200,230,255,.92);
    display:block;line-height:1;
    margin-bottom:8px;
  }

  /* ---- 底部音频指示 ---- */
  #audioDot{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:20px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,190,240,.32);
    opacity:0;animation:fade 1.8s 1.5s ease forwards;
    display:flex;align-items:center;gap:8px;
    white-space:nowrap;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.26);
    transition:background .4s, box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:14px 16px;}
    #title .sub{font-size:9.5px;}
    #stats{padding:14px 16px;font-size:8px;}
    #stats .bigv{font-size:18px;}
    #audioDot{font-size:8px;padding-bottom:14px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">PI · INFINITE SPIRAL</div>
    <h1>圆周率无限展开</h1>
    <div class="sub">π = 3.14159265358979323846…</div>
  </div>

  <div id="stats">
    <span class="lab">DIGITS EXPANDED</span>
    <span class="bigv" id="totalVal">0</span>
    <div><span class="k">当前数字 </span><span class="v" id="currVal">—</span></div>
    <div><span class="k">速率 </span><span class="v" id="rateVal">0.0 /s</span></div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>流水声 · 数字滴答</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));   // ≈ 2.399963 rad

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, DPR = 1, S = 0;
let cx = 0, cy = 0;

/* 圆周率数字（约 200 位，循环使用） */
const PI_DIGITS =
  '3141592653589793238462643383279502884197169399375105820974944592' +
  '3078164062862089986280348253421170679821480865132823066470938446' +
  '0955058223172535940812848111745028410270193852110555964462294895' +
  '493038196';

/* 数字配色：0→9 从冷灰到暖紫 */
const DIGIT_COLORS = [
  { h: 215, s: 22, l: 76 },   // 0 冷灰
  { h: 205, s: 82, l: 68 },   // 1 天蓝
  { h: 186, s: 88, l: 62 },   // 2 青
  { h: 165, s: 82, l: 60 },   // 3 薄荷
  { h: 128, s: 78, l: 62 },   // 4 绿
  { h: 76,  s: 86, l: 64 },   // 5 黄绿
  { h: 46,  s: 95, l: 66 },   // 6 黄
  { h: 26,  s: 95, l: 66 },   // 7 橙
  { h: 342, s: 86, l: 70 },   // 8 粉
  { h: 288, s: 86, l: 70 }    // 9 紫
];

/* =========================================================
   螺旋参数
   ========================================================= */
const MAX_DIGITS = 180;
let R0 = 0, R_STEP = 0, MAX_R = 0;

function computeSpiral(){
  R0 = S * 0.048;
  MAX_R = S * 0.42;
  R_STEP = (MAX_R - R0) / Math.sqrt(MAX_DIGITS);
}

/* 槽位 → 屏幕坐标 */
function spiralPos(slot){
  const angle = slot * GOLDEN_ANGLE - Math.PI * 0.5;
  const r = R0 + Math.sqrt(slot) * R_STEP;
  return {
    x: cx + Math.cos(angle) * r,
    y: cy + Math.sin(angle) * r,
    angle: angle,
    r: r
  };
}

/* =========================================================
   状态
   ========================================================= */
const particles = [];
const slotMap = new Map();
let nextSlot = 0;
let totalSpawned = 0;

let spawnTimer = 0;
const SPAWN_INTERVAL = 0.135;   // 秒/数字

/* 速率统计 */
let rateWindow = 0;
let rateCount = 0;
let displayRate = 0;

/* 火花 */
const sparks = [];

/* 星星 */
const stars = [];

/* =========================================================
   画布尺寸
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  cx = W * 0.5;
  cy = H * 0.5;
  S = Math.min(W, H);

  computeSpiral();
  buildStars();

  /* 重新开始 */
  particles.length = 0;
  slotMap.clear();
  nextSlot = 0;
  totalSpawned = 0;
  spawnTimer = 0;
}
window.addEventListener('resize', resize);

/* =========================================================
   星星
   ========================================================= */
function buildStars(){
  stars.length = 0;
  const n = Math.min(300, Math.round(S * 0.42));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.1 + 0.15,
      ph: Math.random() * TAU,
      sp: 0.22 + Math.random() * 0.9,
      hue: 210 + Math.random() * 80,
      base: 0.08 + Math.random() * 0.30
    });
  }
}

/* =========================================================
   缓动
   ========================================================= */
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }

/* =========================================================
   光晕精灵（预渲染，避免每帧创建渐变）
   ========================================================= */
const glowSprites = {};

function buildGlowSprites(){
  for (let d = 0; d <= 9; d++){
    const c = DIGIT_COLORS[d];
    const sz = 96;
    const off = document.createElement('canvas');
    off.width = off.height = sz;
    const oc = off.getContext('2d');
    const half = sz / 2;

    const g = oc.createRadialGradient(half, half, 0, half, half, half);
    g.addColorStop(0.00, 'hsla(' + c.h + ',' + c.s + '%,' + Math.min(96, c.l + 12) + '%,1)');
    g.addColorStop(0.22, 'hsla(' + c.h + ',' + c.s + '%,' + c.l + '%,0.62)');
    g.addColorStop(0.52, 'hsla(' + c.h + ',' + c.s + '%,' + c.l + '%,0.18)');
    g.addColorStop(1.00, 'hsla(' + c.h + ',' + c.s + '%,' + c.l + '%,0)');

    oc.fillStyle = g;
    oc.fillRect(0, 0, sz, sz);
    glowSprites[d] = off;
  }
}

/* =========================================================
   粒子创建
   ========================================================= */
function createParticle(slot, digitIndex){
  const digit = parseInt(PI_DIGITS[digitIndex % PI_DIGITS.length], 10);
  const color = DIGIT_COLORS[digit];
  const target = spiralPos(slot);

  /* 起始位置：顶部，x 向中心收拢 */
  const startX = target.x * 0.55 + cx * 0.45 + (Math.random() - 0.5) * S * 0.10;
  const startY = -40 - Math.random() * S * 0.20;

  return {
    slot: slot,
    digitIndex: digitIndex,
    digit: digit,
    color: color,

    x: startX,
    y: startY,
    startX: startX,
    startY: startY,
    targetX: target.x,
    targetY: target.y,

    /* 状态 */
    state: 'falling',
    fallT: 0,
    fallDuration: 0.85 + Math.random() * 0.55 + Math.sqrt(slot) * 0.008,
    life: 0,

    /* 外观 */
    alpha: 0,
    scale: 0.55,
    rotation: (Math.random() - 0.5) * 0.9,
    glow: 0,
    phase: Math.random() * TAU,

    /* 死亡 */
    dying: false,
    deathT: 0,
    dead: false
  };
}

/* =========================================================
   粒子更新
   ========================================================= */
function updateParticle(p, dt){
  p.life += dt;

  if (p.dying){
    p.deathT += dt;
    if (p.deathT > 0.65){
      p.dead = true;
    }
    return;
  }

  if (p.state === 'falling'){
    p.fallT += dt;
    const prog = Math.min(1, p.fallT / p.fallDuration);
    const e = easeOutCubic(prog);

    /* 下落时的水平摆动 */
    const wobble = Math.sin(prog * 7 + p.phase) * S * 0.014 * (1 - prog);

    p.x = p.startX + (p.targetX - p.startX) * e + wobble * (1 - e);
    p.y = p.startY + (p.targetY - p.startY) * e;

    p.alpha = Math.min(1, prog * 2.4);
    p.scale = 0.55 + e * 0.45;
    p.rotation = (1 - e) * p.rotation;

    if (prog >= 1){
      p.state = 'idle';
      p.x = p.targetX;
      p.y = p.targetY;
      p.glow = 1;
      onLanded(p);
    }
  } else {
    /* 静止后的呼吸脉动 */
    p.glow *= Math.exp(-1.7 * dt);
    const base = 0.26 + 0.16 * Math.sin(p.life * 1.7 + p.phase);
    if (p.glow < base) p.glow = base;

    p.scale = 1 + 0.05 * Math.sin(p.life * 1.4 + p.phase);
  }
}

/* =========================================================
   着陆回调
   ========================================================= */
function onLanded(p){
  /* 播放数字滴答 */
  playTick(p.digit);

  /* 小火花爆发 */
  for (let i = 0; i < 3; i++){
    const a = Math.random() * TAU;
    const sp = 15 + Math.random() * 55;
    sparks.push({
      x: p.x, y: p.y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 2.4 + Math.random() * 2,
      size: 0.9 + Math.random() * 1.6,
      color: p.color
    });
  }

  /* 更新统计 */
  rateCount++;
}

/* =========================================================
   绘制
   ========================================================= */
function drawGlowSprite(digit, x, y, size, alpha){
  const spr = glowSprites[digit];
  if (!spr) return;
  ctx.globalAlpha = alpha;
  ctx.drawImage(spr, x - size, y - size, size * 2, size * 2);
  ctx.globalAlpha = 1;
}

function drawParticle(p){
  let alpha = p.alpha;
  if (p.dying){
    alpha *= Math.exp(-7 * p.deathT);
  }
  if (alpha < 0.02) return;

  const baseSize = S * 0.021;
  const size = baseSize * p.scale;
  const c = p.color;

  /* 光晕层 */
  if (p.glow > 0.05){
    const glowSize = size * (2.4 + p.glow * 2.8);
    ctx.globalCompositeOperation = 'lighter';
    drawGlowSprite(p.digit, p.x, p.y, glowSize, alpha * p.glow * 0.62);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 数字本体 */
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation);

  ctx.font = '600 ' + size.toFixed(1) + 'px "SF Mono",Consolas,Monaco,monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /* 描边 */
  ctx.strokeStyle = 'rgba(2,6,18,' + (alpha * 0.88) + ')';
  ctx.lineWidth = Math.max(2, size * 0.17);
  ctx.lineJoin = 'round';
  ctx.strokeText(p.digit, 0, 0);

  /* 填充 */
  ctx.fillStyle = 'hsla(' + c.h + ',' + c.s + '%,' + c.l + '%,' + alpha + ')';
  ctx.fillText(p.digit, 0, 0);

  /* 高光 */
  if (p.glow > 0.25){
    ctx.fillStyle = 'hsla(' + c.h + ',' + c.s + '%,' +
                    Math.min(97, c.l + 18) + '%,' + (alpha * p.glow * 0.55) + ')';
    ctx.fillText(p.digit, 0, 0);
  }

  ctx.restore();
}

/* 螺旋引导线 */
function drawSpiralGuide(){
  ctx.beginPath();
  const steps = 320;
  for (let i = 0; i <= steps; i++){
    const slot = (i / steps) * (MAX_DIGITS - 1);
    const pos = spiralPos(slot);
    if (i === 0) ctx.moveTo(pos.x, pos.y);
    else ctx.lineTo(pos.x, pos.y);
  }
  ctx.strokeStyle = 'rgba(70,120,220,0.055)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* 火花 */
function updateSparks(dt){
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= s.decay * dt;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.94;
    s.vy *= 0.94;
  }
}

function drawSparks(){
  if (sparks.length === 0) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < sparks.length; i++){
    const s = sparks[i];
    const a = s.life * s.life * 0.85;
    const r = s.size * s.life;
    const c = s.color;

    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4.5);
    g.addColorStop(0.00, 'hsla(' + c.h + ',' + c.s + '%,' + Math.min(96, c.l + 16) + '%,' + a + ')');
    g.addColorStop(0.42, 'hsla(' + c.h + ',' + c.s + '%,' + c.l + '%,' + (a * 0.30) + ')');
    g.addColorStop(1.00, 'hsla(' + c.h + ',' + c.s + '%,' + c.l + '%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   主渲染
   ========================================================= */
function render(t){
  /* 背景 */
  ctx.fillStyle = '#000208';
  ctx.fillRect(0, 0, W, H);

  /* 中心辉光 */
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 0.85);
  bg.addColorStop(0.00, 'rgba(18,32,72,0.36)');
  bg.addColorStop(0.38, 'rgba(10,18,48,0.16)');
  bg.addColorStop(1.00, 'rgba(2,4,12,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星星 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.02) continue;
    ctx.fillStyle = 'hsla(' + s.hue + ',78%,86%,' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* 螺旋引导线 */
  drawSpiralGuide();

  /* 数字粒子 */
  for (let i = 0; i < particles.length; i++){
    drawParticle(particles[i]);
  }

  /* 火花 */
  drawSparks();

  /* 中心微光点 */
  ctx.globalCompositeOperation = 'lighter';
  const corePulse = 1 + 0.22 * Math.sin(t * 1.6);
  const coreR = S * 0.018 * corePulse;
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 4.5);
  cg.addColorStop(0.00, 'rgba(200,230,255,0.62)');
  cg.addColorStop(0.32, 'rgba(150,190,255,0.22)');
  cg.addColorStop(1.00, 'rgba(110,150,255,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(cx, cy, coreR * 4.5, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 暗角 */
  const vg = ctx.createRadialGradient(cx, cy, S * 0.30, cx, cy, Math.max(W, H) * 0.82);
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2,4,12,0.26)');
  vg.addColorStop(1.00, 'rgba(0,1,4,0.90)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   音频系统
   ========================================================= */
let ac = null;
let master = null;
let waterGain = null;
let audioReady = false;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.52, ac.currentTime, 1.8);

  const kick = function(){
    setAudioOn(true);
    startWater();
  };

  if (ac.state === 'suspended'){
    ac.resume().then(kick).catch(function(){ audioReady = false; });
  } else {
    kick();
  }
}

/* ---- 流水声：棕噪声 + 低通 ---- */
function startWater(){
  const now = ac.currentTime;
  const bufLen = Math.floor(ac.sampleRate * 3);
  const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
  const data = buf.getChannelData(0);

  let last = 0;
  for (let i = 0; i < bufLen; i++){
    const white = Math.random() * 2 - 1;
    last = (last + 0.024 * white) / 1.024;
    data[i] = last * 3.4;
  }

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 780;
  lp.Q.value = 0.65;

  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 70;

  waterGain = ac.createGain();
  waterGain.gain.value = 0;

  src.connect(lp);
  lp.connect(hp);
  hp.connect(waterGain);
  waterGain.connect(master);
  src.start(now);

  waterGain.gain.setTargetAtTime(0.040, now, 3.0);

  /* 缓慢起伏 */
  const lfo1 = ac.createOscillator();
  lfo1.frequency.value = 0.095;
  const lg1 = ac.createGain();
  lg1.gain.value = 0.015;
  lfo1.connect(lg1);
  lg1.connect(waterGain.gain);
  lfo1.start(now);

  /* 滤波扫动 */
  const lfo2 = ac.createOscillator();
  lfo2.frequency.value = 0.065;
  const lg2 = ac.createGain();
  lg2.gain.value = 320;
  lfo2.connect(lg2);
  lg2.connect(lp.frequency);
  lfo2.start(now);
}

/* ---- 数字滴答 ---- */
let lastTickTime = 0;

function playTick(digit){
  if (!ac || ac.state !== 'running') return;

  const now = ac.currentTime;
  /* 节流：最多每 60ms 一次滴答 */
  if (now - lastTickTime < 0.06) return;
  lastTickTime = now;

  /* 主音 */
  const freq = 520 + digit * 175 + Math.random() * 70;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.62, now + 0.075);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.030, now + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.085);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.10);

  /* 高频泛音，水珠感 */
  const osc2 = ac.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2.02;

  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0, now);
  g2.gain.linearRampToValueAtTime(0.008, now + 0.002);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);

  osc2.connect(g2);
  g2.connect(master);
  osc2.start(now);
  osc2.stop(now + 0.08);

  /* 极短噪声击打，模拟“滴” */
  const nl = Math.max(1, Math.ceil(ac.sampleRate * 0.025));
  const nbuf = ac.createBuffer(1, nl, ac.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const tt = i / nl;
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - tt, 3.5);
  }
  const nsrc = ac.createBufferSource();
  nsrc.buffer = nbuf;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2400 + Math.random() * 800;
  bp.Q.value = 2.2;

  const ng = ac.createGain();
  ng.gain.value = 0.007;

  nsrc.connect(bp);
  bp.connect(ng);
  ng.connect(master);
  nsrc.start(now);
}

/* =========================================================
   生成 / 移除
   ========================================================= */
function spawnDigit(){
  const slot = nextSlot;
  nextSlot = (nextSlot + 1) % MAX_DIGITS;

  /* 替换旧数字 */
  if (slotMap.has(slot)){
    const old = slotMap.get(slot);
    if (!old.dying){
      old.dying = true;
      old.deathT = 0;
    }
  }

  const p = createParticle(slot, totalSpawned);
  particles.push(p);
  slotMap.set(slot, p);
  totalSpawned++;
}

/* =========================================================
   HUD 更新
   ========================================================= */
let hudTick = 0;

function updateHUD(dt){
  /* 速率统计 */
  rateWindow += dt;
  if (rateWindow >= 0.5){
    displayRate = rateCount / rateWindow;
    rateWindow = 0;
    rateCount = 0;
  }

  hudTick++;
  if (hudTick % 8 !== 0) return;

  const tv = document.getElementById('totalVal');
  const cv = document.getElementById('currVal');
  const rv = document.getElementById('rateVal');

  if (tv) tv.textContent = totalSpawned;
  if (cv){
    const d = PI_DIGITS[(totalSpawned - 1 + PI_DIGITS.length) % PI_DIGITS.length];
    cv.textContent = d !== undefined ? d : '—';
  }
  if (rv) rv.textContent = displayRate.toFixed(1) + ' /s';
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  /* 生成 */
  spawnTimer += dt;
  while (spawnTimer >= SPAWN_INTERVAL){
    spawnTimer -= SPAWN_INTERVAL;
    spawnDigit();
  }

  /* 更新粒子 */
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    updateParticle(p, dt);
    if (p.dead){
      if (slotMap.get(p.slot) === p) slotMap.delete(p.slot);
      particles.splice(i, 1);
    }
  }

  /* 更新火花 */
  updateSparks(dt);

  /* 渲染 */
  render(t);

  /* HUD */
  updateHUD(dt);
}

/* =========================================================
   启动
   ========================================================= */
buildGlowSprites();
resize();
requestAnimationFrame(loop);

/* 首次交互启动音频 */
window.addEventListener('pointerdown', function(){
  initAudio();
}, { once: false });

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
  }
});

})();
</script>
