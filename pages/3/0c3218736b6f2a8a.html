<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>洛伦兹-洛伦茨折射率色散 · 斯涅尔定律</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#010006;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;}
  canvas{position:fixed;inset:0;display:block;}
  .hud{position:fixed;inset:0;pointer-events:none;}

  .epigraph{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    font-family:"Songti SC","STSong",serif;
    font-size:clamp(12px,1.35vw,19px);
    letter-spacing:.16em;white-space:nowrap;
    color:#f2f0ff;
    text-shadow:0 0 12px rgba(180,140,255,.9),0 0 34px rgba(90,200,255,.5);
    animation:breathe 4.3s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}

  .formula{
    position:absolute;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
    font-size:clamp(9px,.76vw,12px);
    line-height:1.75;letter-spacing:.02em;
    color:rgba(160,190,255,.42);
    text-shadow:0 0 9px rgba(100,140,255,.25);
    white-space:nowrap;
  }
  .formula b{color:rgba(200,225,255,.68);font-weight:500;}
  .tl{top:56px;left:22px;}
  .tr{top:56px;right:22px;text-align:right;}
  .bl{bottom:16px;left:22px;}
  .br{bottom:16px;right:22px;text-align:right;}

  .controls{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:16px;
    pointer-events:auto;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;color:rgba(170,205,255,.85);
    background:rgba(8,8,26,.72);
    border:1px solid rgba(120,110,255,.24);
    border-radius:30px;padding:8px 22px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 0 28px rgba(100,80,255,.18);
    white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .controls input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:130px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,#7b2fff,#2ea8ff,#2effc8,#ffd24a,#ff4a2e);
    outline:none;cursor:pointer;
  }
  .controls input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#f2ecff;
    box-shadow:0 0 10px rgba(180,140,255,.95),0 0 20px rgba(100,200,255,.75);
    cursor:pointer;
  }
  .controls input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border:none;border-radius:50%;
    background:#f2ecff;
    box-shadow:0 0 10px rgba(180,140,255,.95);
    cursor:pointer;
  }
  .val{color:#c4a4ff;font-weight:600;min-width:56px;text-align:center;
    text-shadow:0 0 10px rgba(180,120,255,.7);}
  .nval{color:#7de0ff;font-weight:600;min-width:96px;text-align:center;
    text-shadow:0 0 10px rgba(80,220,255,.7);}
  .controls input[type=checkbox]{
    -webkit-appearance:none;appearance:none;
    width:32px;height:16px;border-radius:9px;
    background:rgba(100,110,200,.28);
    position:relative;cursor:pointer;transition:background .25s;
  }
  .controls input[type=checkbox]::after{
    content:"";position:absolute;top:2px;left:2px;
    width:12px;height:12px;border-radius:50%;
    background:#a8b6e0;transition:transform .25s,background .25s;
  }
  .controls input[type=checkbox]:checked{background:rgba(120,60,255,.72);}
  .controls input[type=checkbox]:checked::after{transform:translateX(16px);background:#f2ecff;}

  @media (max-width:980px){
    .bl,.br{display:none;}
    .controls{gap:8px;padding:7px 14px;font-size:10px;}
    .controls input[type=range]{width:80px;}
    .val{min-width:44px;}
    .nval{min-width:76px;}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="epigraph">白本无色，穿过棱镜方见七彩真容</div>

  <div class="formula tl">
    <b>斯涅尔折射定律</b><br>
    n₁ · sinθ₁ = n₂ · sinθ₂
  </div>
  <div class="formula tr">
    <b>折射率定义</b><br>
    n = c / v
  </div>
  <div class="formula bl">
    <b>洛伦兹-洛伦茨方程</b><br>
    (n²−1)/(n²+2) = Nα / 3ε₀
  </div>
  <div class="formula br">
    <b>临界角 · 参考值</b><br>
    θ_c = arcsin(1/n) = 41.2°　n = 1.517
  </div>

  <div class="controls">
    <label>入射角 θ₁
      <input type="range" id="thetaRange" min="0" max="55" value="40" step="0.5">
    </label>
    <span class="val" id="thetaLabel">40.0°</span>
    <label>波长 λ
      <input type="range" id="lambdaRange" min="400" max="700" value="550" step="1">
    </label>
    <span class="val" id="lambdaLabel">550 nm</span>
    <label>
      <input type="checkbox" id="monoToggle">
      单色光
    </label>
  </div>
</div>

<script>
(() => {
'use strict';

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;

/* ============================================================
   物理常量
============================================================ */
const N_COEFF_A = 1.4758;      // n(λ) = A + B/λ²
const N_COEFF_B = 11880;       // λ 以 nm 为单位

function refractiveIndex(wl){
  return N_COEFF_A + N_COEFF_B / (wl * wl);
}

/* ============================================================
   状态
============================================================ */
let W = 0, H = 0, DPR = 1;
let bgGrad = null;

/* 几何 */
let cx = 0, cy = 0;
let s = 320, h = 277;
let A, B, C;                    // 三角顶点
let P1;                         // 入射点（AB 中点）

/* 参数 */
let theta1 = 40;                // 入射角（度）
let lambdaSelected = 550;       // 单色光波长 nm
let targetTheta = 40;
let autoPlay = true;
let monoMode = false;

let probe = null;
let lastPaths = [];             // 缓存各波长路径

/* ============================================================
   波长 → RGB
============================================================ */
function wavelengthToRGB(wl){
  let R, G, B;
  if (wl >= 380 && wl < 440){
    R = -(wl - 440) / 60; G = 0; B = 1;
  } else if (wl < 490){
    R = 0; G = (wl - 440) / 50; B = 1;
  } else if (wl < 510){
    R = 0; G = 1; B = -(wl - 510) / 20;
  } else if (wl < 580){
    R = (wl - 510) / 70; G = 1; B = 0;
  } else if (wl < 645){
    R = 1; G = -(wl - 645) / 65; B = 0;
  } else {
    R = 1; G = 0; B = 0;
  }
  let f;
  if (wl < 420)      f = 0.3 + 0.7 * (wl - 380) / 40;
  else if (wl < 701) f = 1;
  else               f = 0.3 + 0.7 * (780 - wl) / 80;

  const gamma = 0.85;
  return [
    Math.round(255 * Math.pow(R * f, gamma)),
    Math.round(255 * Math.pow(G * f, gamma)),
    Math.round(255 * Math.pow(B * f, gamma))
  ];
}

/* ============================================================
   向量工具
============================================================ */
function len(v){ return Math.sqrt(v.x * v.x + v.y * v.y); }
function norm(v){
  const l = len(v) || 1;
  return { x: v.x / l, y: v.y / l };
}

/* 折射：N 指向入射介质一侧 */
function refract(d, N, n1, n2){
  const cosI = -(d.x * N.x + d.y * N.y);
  if (cosI < 0) return null;
  const eta = n1 / n2;
  const sin2T = eta * eta * (1 - cosI * cosI);
  if (sin2T > 1) return { tir: true };
  const cosT = Math.sqrt(1 - sin2T);
  const k = eta * cosI - cosT;
  return {
    x: eta * d.x + k * N.x,
    y: eta * d.y + k * N.y,
    tir: false
  };
}

/* 反射：N 为外法线 */
function reflect(d, N){
  const dot = d.x * N.x + d.y * N.y;
  return { x: d.x - 2 * dot * N.x, y: d.y - 2 * dot * N.y };
}

/* 直线交点参数：p1 + t·d1 = p2 + u·d2 */
function lineIntersectT(p1, d1, p2, d2){
  const denom = d1.x * d2.y - d1.y * d2.x;
  if (Math.abs(denom) < 1e-9) return null;
  return ((p2.x - p1.x) * d2.y - (p2.y - p1.y) * d2.x) / denom;
}

/* 求与棱镜三面最近的有效交点 */
function findNextHit(P, d){
  let bestT = Infinity, bestN = null, bestName = '';

  const faces = [
    { name: 'AC', origin: A, dir: { x: 0.5, y: Math.sqrt(3)/2 }, nOut: { x: Math.sqrt(3)/2, y: -0.5 } },
    { name: 'BC', origin: B, dir: { x: 1, y: 0 },                nOut: { x: 0, y: 1 } },
    { name: 'AB', origin: A, dir: { x: -0.5, y: Math.sqrt(3)/2 }, nOut: { x: -Math.sqrt(3)/2, y: -0.5 } }
  ];

  for (const f of faces){
    const t = lineIntersectT(P, d, f.origin, f.dir);
    if (t === null || t < 0.5) continue;
    const hitX = P.x + t * d.x, hitY = P.y + t * d.y;
    const u = Math.hypot(hitX - f.origin.x, hitY - f.origin.y);
    if (u > s || u < 0.5) continue;
    if (t < bestT){ bestT = t; bestN = f.nOut; bestName = f.name; }
  }

  if (!bestN) return null;
  return {
    t: bestT,
    point: { x: P.x + bestT * d.x, y: P.y + bestT * d.y },
    nOut: bestN,
    name: bestName
  };
}

/* ============================================================
   光线追踪
============================================================ */
function traceRay(wl){
  const n = refractiveIndex(wl);
  const N1 = { x: -Math.sqrt(3)/2, y: -0.5 };   // AB 外法线

  const inAngle = (30 - theta1) * Math.PI / 180;
  const dIn = { x: Math.cos(inAngle), y: Math.sin(inAngle) };

  const r1 = refract(dIn, N1, 1, n);
  if (!r1 || r1.tir) return null;

  const path = [{ x: P1.x, y: P1.y, kind: 'enter' }];
  let P = { x: P1.x, y: P1.y };
  let d = { x: r1.x, y: r1.y };
  let exited = false;
  let exitAngle = 0;
  let internalHits = 0;
  let tirCount = 0;

  for (let iter = 0; iter < 5; iter++){
    const hit = findNextHit(P, d);
    if (!hit) break;

    internalHits++;
    path.push({ x: hit.point.x, y: hit.point.y, kind: 'hit' });

    const N_in = { x: -hit.nOut.x, y: -hit.nOut.y };
    const res = refract(d, N_in, n, 1);

    if (res && res.tir){
      /* 全内反射 */
      tirCount++;
      d = reflect(d, hit.nOut);
      P = { x: hit.point.x, y: hit.point.y };
      path.push({ x: P.x, y: P.y, kind: 'tir' });
    } else if (res){
      /* 折射出射 */
      d = { x: res.x, y: res.y };
      P = { x: hit.point.x, y: hit.point.y };
      exited = true;
      exitAngle = Math.atan2(d.y, d.x);
      break;
    } else {
      break;
    }
  }

  if (!exited) return null;

  /* 延伸出射光线 */
  const far = 1400;
  path.push({ x: P.x + d.x * far, y: P.y + d.y * far, kind: 'exit' });

  return {
    wl, n,
    path,
    exitAngle,
    tirCount,
    internalHits
  };
}

/* ============================================================
   尺寸
============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  cx = W * 0.52;
  cy = H * 0.48;
  s = Math.min(W * 0.28, H * 0.42);
  h = s * Math.sqrt(3) / 2;

  A = { x: cx,             y: cy - h/2 };
  B = { x: cx - s/2,       y: cy + h/2 };
  C = { x: cx + s/2,       y: cy + h/2 };
  P1 = { x: cx - s/4,      y: cy };

  bgGrad = ctx.createRadialGradient(
    W * 0.45, H * 0.45, 0,
    W * 0.45, H * 0.45, Math.max(W, H) * 0.85
  );
  bgGrad.addColorStop(0,    '#07051a');
  bgGrad.addColorStop(0.45, '#030212');
  bgGrad.addColorStop(1,    '#010006');
}

/* ============================================================
   30 秒剧本
============================================================ */
function autoTheta(t){
  const period = 30;
  const u = (t % period) / period;
  return 40 + 10 * Math.sin(u * TAU - Math.PI / 2);
}

/* ============================================================
   更新
============================================================ */
function update(dt){
  if (autoPlay){
    targetTheta = autoTheta(simTime);
    thetaRange.value = targetTheta.toFixed(1);
  }

  theta1 += (targetTheta - theta1) * Math.min(1, dt * 5);
  theta1 = Math.max(0, Math.min(55, theta1));

  thetaLabel.textContent = theta1.toFixed(1) + '°';
  lambdaLabel.textContent = lambdaSelected + ' nm';

  const n = refractiveIndex(lambdaSelected);
  nLabel.textContent = 'n = ' + n.toFixed(4);

  if (probe){
    probe.t += dt;
    if (probe.t > 4.0) probe = null;
  }
}

/* ============================================================
   渲染 · 棱镜
============================================================ */
function drawPrism(){
  /* 玻璃体渐变 */
  const g = ctx.createLinearGradient(B.x, B.y, C.x, A.y);
  g.addColorStop(0,    'rgba(60, 140, 220, 0.10)');
  g.addColorStop(0.42, 'rgba(120, 110, 255, 0.08)');
  g.addColorStop(1,    'rgba(180, 120, 255, 0.11)');

  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();

  /* 内部微光 */
  const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, s * 0.85);
  rg.addColorStop(0, 'rgba(140, 180, 255, 0.075)');
  rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rg;
  ctx.fill();

  /* 边缘发光 */
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(160, 210, 255, 0.72)';
  ctx.lineWidth = 2.2;
  ctx.shadowColor = 'rgba(90, 180, 255, 0.95)';
  ctx.shadowBlur = 22;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 内层描边 */
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(220, 240, 255, 0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 顶点小光点 */
  for (const V of [A, B, C]){
    const gg = ctx.createRadialGradient(V.x, V.y, 0, V.x, V.y, 14);
    gg.addColorStop(0,   'rgba(200, 230, 255, 0.55)');
    gg.addColorStop(1,   'rgba(100, 160, 255, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(V.x, V.y, 14, 0, TAU);
    ctx.fill();
  }
}

/* ============================================================
   渲染 · 入射光线
============================================================ */
function drawIncidentRay(){
  const inAngle = (30 - theta1) * Math.PI / 180;
  const d = { x: Math.cos(inAngle), y: Math.sin(inAngle) };

  const back = 420;
  const sx = P1.x - d.x * back;
  const sy = P1.y - d.y * back;

  /* 光束主体 */
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(P1.x, P1.y);

  if (monoMode){
    const c = wavelengthToRGB(lambdaSelected);
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},0.95)`;
    ctx.lineWidth = 3;
    ctx.shadowColor = `rgba(${c[0]},${c[1]},${c[2]},0.95)`;
    ctx.shadowBlur = 18;
  } else {
    ctx.strokeStyle = 'rgba(245, 250, 255, 0.95)';
    ctx.lineWidth = 3.2;
    ctx.shadowColor = 'rgba(220, 235, 255, 0.95)';
    ctx.shadowBlur = 20;
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 白光微彩虹边 */
  if (!monoMode){
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 8; i++){
      const wl = 400 + i * 40;
      const c = wavelengthToRGB(wl);
      const off = (i - 3.5) * 1.15;
      ctx.beginPath();
      ctx.moveTo(sx + off * 0.6, sy + off);
      ctx.lineTo(P1.x + off * 0.6, P1.y + off);
      ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},0.16)`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 入射点光斑 */
  const g = ctx.createRadialGradient(P1.x, P1.y, 0, P1.x, P1.y, 13);
  g.addColorStop(0, 'rgba(255,255,255,0.85)');
  g.addColorStop(1, 'rgba(160,200,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(P1.x, P1.y, 13, 0, TAU);
  ctx.fill();
}

/* ============================================================
   渲染 · 色散光线
============================================================ */
function drawRays(){
  const wls = monoMode
    ? [lambdaSelected]
    : [400, 425, 450, 475, 500, 525, 550, 575, 600, 625, 650, 675, 700];

  lastPaths = [];

  for (const wl of wls){
    const trace = traceRay(wl);
    if (!trace) continue;
    lastPaths.push(trace);

    const c = wavelengthToRGB(wl);
    const cs = `${c[0]},${c[1]},${c[2]}`;
    const pts = trace.path;

    /* 内部路径（第一段） */
    ctx.globalCompositeOperation = 'lighter';

    /* 内部段：从入射点到第一个内部命中点 */
    if (pts.length >= 2){
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++){
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.strokeStyle = `rgba(${cs},0.72)`;
      ctx.lineWidth = monoMode ? 2.6 : 1.8;
      ctx.shadowColor = `rgba(${cs},0.9)`;
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    /* 出射光线（最后一段延伸到远处） */
    if (pts.length >= 3 && trace.tirCount === 0){
      const pEnd = pts[pts.length - 1];
      const pBefore = pts[pts.length - 2];
      ctx.beginPath();
      ctx.moveTo(pBefore.x, pBefore.y);
      ctx.lineTo(pEnd.x, pEnd.y);
      ctx.strokeStyle = `rgba(${cs},0.90)`;
      ctx.lineWidth = monoMode ? 3 : 2.2;
      ctx.shadowColor = `rgba(${cs},0.95)`;
      ctx.shadowBlur = 20;
      ctx.stroke();
      ctx.shadowBlur = 0;

      /* 外发光层 */
      ctx.beginPath();
      ctx.moveTo(pBefore.x, pBefore.y);
      ctx.lineTo(pEnd.x, pEnd.y);
      ctx.strokeStyle = `rgba(${cs},0.20)`;
      ctx.lineWidth = 7;
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ============================================================
   渲染 · 出射光屏
============================================================ */
function drawExitScreen(){
  /* 找出所有出射点 */
  const exits = lastPaths.filter(p => p.tirCount === 0 && p.path.length >= 3);
  if (exits.length < 2) return;

  /* 在出射方向上画一段弧形色带 */
  const screenR = Math.min(W, H) * 0.42;
  const pC = { x: cx, y: cy };

  ctx.globalCompositeOperation = 'lighter';

  for (const tr of exits){
    const c = wavelengthToRGB(tr.wl);
    const cs = `${c[0]},${c[1]},${c[2]}`;
    const last = tr.path[tr.path.length - 1];
    const d = norm({
      x: last.x - tr.path[tr.path.length - 2].x,
      y: last.y - tr.path[tr.path.length - 2].y
    });

    /* 在出射方向远端画短色带 */
    for (let k = 0; k < 3; k++){
      const r = screenR + k * 12;
      const px = pC.x + d.x * r;
      const py = pC.y + d.y * r;
      if (px < -50 || px > W + 50 || py < -50 || py > H + 50) continue;
      ctx.beginPath();
      ctx.arc(px, py, 5 - k * 1.2, 0, TAU);
      ctx.fillStyle = `rgba(${cs},${0.55 - k * 0.15})`;
      ctx.fill();
    }
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   渲染 · 角度标注
============================================================ */
function drawAngleMarks(){
  /* 左面法线 */
  const N1 = { x: -Math.sqrt(3)/2, y: -0.5 };
  const nLen = 90;
  ctx.setLineDash([4, 5]);
  ctx.strokeStyle = 'rgba(160, 200, 255, 0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(P1.x, P1.y);
  ctx.lineTo(P1.x + N1.x * nLen, P1.y + N1.y * nLen);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 法线标签 */
  ctx.font = '500 10px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(160, 200, 255, 0.52)';
  ctx.fillText('法线', P1.x + N1.x * nLen + 4, P1.y + N1.y * nLen + 4);

  /* 入射角弧 */
  const inAngle = (30 - theta1) * Math.PI / 180;
  const dIn = { x: Math.cos(inAngle), y: Math.sin(inAngle) };
  const a1 = Math.atan2(-dIn.y, -dIn.x);
  const a2 = Math.atan2(N1.y, N1.x);

  ctx.beginPath();
  ctx.arc(P1.x, P1.y, 42, Math.min(a1, a2), Math.max(a1, a2));
  ctx.strokeStyle = 'rgba(255, 200, 120, 0.55)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  /* θ₁ 标签 */
  const midA = (a1 + a2) / 2;
  ctx.font = '600 11px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 210, 140, 0.85)';
  ctx.fillText('θ₁=' + theta1.toFixed(1) + '°',
    P1.x + Math.cos(midA) * 58,
    P1.y + Math.sin(midA) * 58 + 4);

  /* 出射角标注 */
  const tr = lastPaths.find(p => p.tirCount === 0);
  if (tr && tr.path.length >= 3){
    const pEnd = tr.path[tr.path.length - 1];
    const pBef = tr.path[tr.path.length - 2];
    const N2 = { x: Math.sqrt(3)/2, y: -0.5 };

    const dOut = norm({ x: pEnd.x - pBef.x, y: pEnd.y - pBef.y });
    const relAngle = Math.acos(Math.abs(dOut.x * N2.x + dOut.y * N2.y)) * 180 / Math.PI;

    ctx.font = '600 10.5px ui-monospace,Menlo,Consolas,monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(140, 240, 200, 0.82)';
    ctx.fillText('θ₂≈' + relAngle.toFixed(1) + '°',
      pBef.x + 16, pBef.y - 12);
  }
}

/* ============================================================
   渲染 · 点击探测
============================================================ */
function drawProbe(){
  if (!probe) return;
  const a = Math.max(0, 1 - probe.t / 4.0);
  if (a <= 0){ probe = null; return; }

  const x = probe.x, y = probe.y;

  ctx.beginPath();
  ctx.arc(x, y, 14 + (1 - a) * 24, 0, TAU);
  ctx.strokeStyle = `rgba(255, 225, 150, ${a * 0.70})`;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x, y, 5, 0, TAU);
  ctx.fillStyle = `rgba(255, 240, 180, ${a})`;
  ctx.shadowColor = 'rgba(255, 210, 120, 0.95)';
  ctx.shadowBlur = 16;
  ctx.fill();
  ctx.shadowBlur = 0;

  const lines = [
    `入射角 θ₁ = ${theta1.toFixed(1)}°`,
    `当前 λ = ${lambdaSelected} nm`,
    `玻璃折射率 n = ${refractiveIndex(lambdaSelected).toFixed(4)}`,
    `临界角 θ_c = ${(Math.asin(1/refractiveIndex(lambdaSelected)) * 180/Math.PI).toFixed(1)}°`
  ];

  ctx.font = '600 10.5px ui-monospace,Menlo,Consolas,monospace';
  let mw = 0;
  for (const l of lines) mw = Math.max(mw, ctx.measureText(l).width);

  const bw = mw + 22, bh = lines.length * 16 + 14;
  let bx = x + 18, by = y - bh / 2;
  if (bx + bw > W - 12) bx = x - bw - 18;
  if (by < 10) by = 10;
  if (by + bh > H - 80) by = H - 80 - bh;

  ctx.fillStyle = `rgba(18, 14, 40, ${a * 0.94})`;
  ctx.strokeStyle = `rgba(255, 215, 140, ${a * 0.58})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(bx, by, bw, bh);
  ctx.fill(); ctx.stroke();

  ctx.textAlign = 'left';
  for (let i = 0; i < lines.length; i++){
    ctx.fillStyle = i === 0
      ? `rgba(255, 235, 170, ${a})`
      : `rgba(210, 228, 255, ${a * 0.88})`;
    ctx.fillText(lines[i], bx + 11, by + 20 + i * 16);
  }
}

/* ============================================================
   渲染 · 读数
============================================================ */
function drawReadout(){
  const n = refractiveIndex(lambdaSelected);
  const thetaC = Math.asin(1 / n) * 180 / Math.PI;

  /* 出射角范围 */
  let minA = Infinity, maxA = -Infinity;
  for (const tr of lastPaths){
    if (tr.tirCount === 0){
      const deg = tr.exitAngle * 180 / Math.PI;
      if (deg < minA) minA = deg;
      if (deg > maxA) maxA = deg;
    }
  }
  const spread = (maxA > minA) ? (maxA - minA).toFixed(1) : '—';

  const txt =
    `n(550nm) = ${refractiveIndex(550).toFixed(4)}    ` +
    `θ_c = ${thetaC.toFixed(1)}°    ` +
    `色散张角 ≈ ${spread}°    ` +
    (lastPaths.some(p => p.tirCount > 0) ? '⚠ 发生全反射' : '✓ 正常折射');

  ctx.font = '600 12px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(205, 235, 255, 0.86)';
  ctx.shadowColor = 'rgba(120, 180, 255, 0.85)';
  ctx.shadowBlur = 14;
  ctx.fillText(txt, W / 2, H - 66);
  ctx.shadowBlur = 0;
}

/* ============================================================
   主渲染
============================================================ */
function render(){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  drawPrism();
  drawRays();
  drawExitScreen();
  drawIncidentRay();
  drawAngleMarks();
  drawProbe();
  drawReadout();
}

/* ============================================================
   主循环
============================================================ */
let simTime = 0, lastTime = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  simTime += dt;
  if (simTime >= 30) simTime -= 30;

  update(dt);
  render();
}

/* ============================================================
   交互
============================================================ */
const thetaRange  = document.getElementById('thetaRange');
const thetaLabel  = document.getElementById('thetaLabel');
const lambdaRange = document.getElementById('lambdaRange');
const lambdaLabel = document.getElementById('lambdaLabel');
const monoToggle  = document.getElementById('monoToggle');

/* 动态创建 n 标签 */
const nLabel = document.createElement('span');
nLabel.className = 'nval';
nLabel.id = 'nLabel';
nLabel.textContent = 'n = 1.5150';
document.querySelector('.controls').insertBefore(
  nLabel,
  monoToggle.parentElement
);

thetaRange.addEventListener('input', () => {
  autoPlay = false;
  targetTheta = parseFloat(thetaRange.value);
});

lambdaRange.addEventListener('input', () => {
  lambdaSelected = parseFloat(lambdaRange.value);
});

monoToggle.addEventListener('change', () => {
  monoMode = monoToggle.checked;
});

cv.addEventListener('pointerdown', (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  probe = { x: mx, y: my, t: 0 };
});

window.addEventListener('resize', resize);

/* ============================================================
   启动
============================================================ */
resize();
requestAnimationFrame(loop);

})();
</script>
