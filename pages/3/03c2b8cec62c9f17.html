<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调制螺线管 · 三维编织网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>调制螺线管 · 三维编织网</h2>
        <div class="sub">Modulated solenoids · Variable radius & pitch · Spiral braids</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">r(t)=R₀+ΔR·sin(ω₁t), θ=ω₂t, z=vt+Δz·cos(ω₃t)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">ω₁:ω₂:ω₃ ∈ ℚ³ ∪ {√2,√3,π}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">φₖ = k·2π/N ,  N=28</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.4, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // 调制螺线管点函数
        function solenoidPoint(t, R0, dR, w1, w2, v, dZ, w3, phi0) {
            const r = R0 + dR * Math.sin(w1 * t + phi0);
            const theta = w2 * t;
            const z = v * t + dZ * Math.cos(w3 * t + phi0 * 0.7);
            return new THREE.Vector3(r * Math.cos(theta), z, r * Math.sin(theta));
        }

        // 生成一族螺线管
        function createSolenoidFamily(R0, dR, w1, w2, v, dZ, w3, numCurves, color, opacity, tMax, steps) {
            const group = new THREE.Group();
            for (let k = 0; k < numCurves; k++) {
                const phi0 = k * 2 * Math.PI / numCurves;
                const pts = [];
                const dt = tMax / steps;
                for (let i = 0; i <= steps; i++) {
                    const t = -tMax / 2 + i * dt;
                    const p = solenoidPoint(t, R0, dR, w1, w2, v, dZ, w3, phi0);
                    if (Math.abs(p.x) < 5 && Math.abs(p.y) < 5 && Math.abs(p.z) < 5) {
                        pts.push(p);
                    }
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity,
                        depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'solenoid-weave';
        scene.add(rootGroup);

        const tMax = 10.0;
        const steps = 520;
        const numCurves = 28;

        // 金色族：较大的平均半径，中等调制
        rootGroup.add(createSolenoidFamily(2.0, 0.45, 2.7, 1.6, 0.35, 0.55, 1.9, numCurves, COLOR_GOLD, 0.62, tMax, steps));
        rootGroup.add(createSolenoidFamily(2.3, 0.35, 2.2, 1.9, 0.30, 0.45, 2.4, Math.floor(numCurves * 0.7), COLOR_GOLD, 0.52, tMax * 0.8, steps));
        rootGroup.add(createSolenoidFamily(1.7, 0.50, 3.1, 1.3, 0.40, 0.60, 1.6, Math.floor(numCurves * 0.6), COLOR_GOLD, 0.45, tMax * 0.9, steps));

        // 青色族：较小的平均半径，快速缠绕
        rootGroup.add(createSolenoidFamily(1.5, 0.40, 3.5, 2.3, 0.28, 0.50, 2.8, numCurves, COLOR_CYAN, 0.62, tMax, steps));
        rootGroup.add(createSolenoidFamily(1.8, 0.30, 2.9, 2.6, 0.33, 0.42, 3.2, Math.floor(numCurves * 0.7), COLOR_CYAN, 0.52, tMax * 0.8, steps));
        rootGroup.add(createSolenoidFamily(1.2, 0.48, 4.0, 1.8, 0.22, 0.58, 2.1, Math.floor(numCurves * 0.6), COLOR_CYAN, 0.45, tMax * 0.9, steps));

        // 品红族：大调制幅度，不规则感
        rootGroup.add(createSolenoidFamily(2.1, 0.60, 1.8, 2.0, 0.38, 0.70, 1.5, numCurves, COLOR_MAGENTA, 0.62, tMax, steps));
        rootGroup.add(createSolenoidFamily(1.9, 0.55, 2.4, 1.5, 0.25, 0.65, 2.0, Math.floor(numCurves * 0.7), COLOR_MAGENTA, 0.52, tMax * 0.8, steps));
        rootGroup.add(createSolenoidFamily(2.5, 0.42, 1.5, 2.8, 0.42, 0.52, 2.5, Math.floor(numCurves * 0.6), COLOR_MAGENTA, 0.45, tMax * 0.9, steps));

        // 额外：反向缠绕的螺线管（品红色调）
        rootGroup.add(createSolenoidFamily(1.6, 0.38, 2.5, -2.1, -0.32, 0.48, 2.3, Math.floor(numCurves * 0.5), COLOR_MAGENTA, 0.48, tMax * 0.7, steps));
        rootGroup.add(createSolenoidFamily(2.2, 0.44, -1.9, 2.4, 0.36, 0.56, -1.8, Math.floor(numCurves * 0.5), COLOR_CYAN, 0.48, tMax * 0.7, steps));

        // 辅助：中心轴线（极淡）
        const axisPts = [];
        for (let i = 0; i <= 200; i++) {
            const y = -4.0 + i * 8.0 / 200;
            axisPts.push(new THREE.Vector3(0, y, 0));
        }
        const axisGeom = new THREE.BufferGeometry().setFromPoints(axisPts);
        rootGroup.add(new THREE.Line(axisGeom, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.15, depthWrite: true, depthTest: true
        })));

        // 辅助：几个透明圆柱环
        for (let r = 1.0; r <= 3.0; r += 0.5) {
            const ringPts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = j * 2 * Math.PI / 200;
                ringPts.push(new THREE.Vector3(r * Math.cos(theta), -3.5, r * Math.sin(theta)));
                ringPts.push(new THREE.Vector3(r * Math.cos(theta), 3.5, r * Math.sin(theta)));
            }
            // 这里用LineSegments绘制两个环
            const ringGeom1 = new THREE.BufferGeometry().setFromPoints(ringPts.slice(0, 201));
            const ringGeom2 = new THREE.BufferGeometry().setFromPoints(ringPts.slice(201));
            const ringMat = new THREE.LineBasicMaterial({
                color: 0x504030, transparent: true, opacity: 0.12, depthWrite: true, depthTest: true
            });
            rootGroup.add(new THREE.Line(ringGeom1, ringMat));
            rootGroup.add(new THREE.Line(ringGeom2, ringMat));
        }

        console.log('调制螺线管编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.5, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.8;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 调制螺线管三维编织网动画已稳定运行');
    </script>
</body>
</html>
