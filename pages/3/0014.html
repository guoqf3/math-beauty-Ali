<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>曲面动物园 · Surface Zoo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;cursor:grab;}
  canvas:active{cursor:grabbing;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  /* ---------- 左上：标题 ---------- */
  #title{
    position:absolute;top:0;left:0;
    padding:42px 48px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:10px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(160,180,240,.38);font-weight:300;margin-bottom:16px;
  }
  #title h1{
    font-size:clamp(22px,3.2vw,42px);
    font-weight:200;letter-spacing:.30em;text-indent:.30em;
    background:linear-gradient(96deg,#80b0ff 0%,#c09eff 40%,#ffc8a0 76%,#ffeecc 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 32px rgba(150,130,240,.42));
  }
  #title .name{
    font-size:11px;letter-spacing:.30em;
    color:rgba(200,180,255,.50);font-weight:300;
  }

  /* ---------- 左下：公式与故事 ---------- */
  #info{
    position:absolute;bottom:0;left:0;
    padding:0 48px 42px;max-width:520px;
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #formula{
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10.5px;letter-spacing:.06em;line-height:1.9;
    color:rgba(255,215,150,.78);
    margin-bottom:16px;padding-left:2px;
  }
  #formula .lbl{
    display:block;font-size:8px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(140,155,220,.40);margin-bottom:6px;
  }
  #story{
    font-size:12px;line-height:2.0;letter-spacing:.06em;
    color:rgba(190,185,235,.55);font-weight:300;
  }

  /* ---------- 右下：切换按钮 ---------- */
  #nav{
    position:absolute;bottom:0;right:0;
    padding:0 48px 42px;display:flex;gap:12px;
    opacity:0;animation:fade 1.6s 1.4s ease forwards;
    pointer-events:auto;
  }
  .navbtn{
    font-family:inherit;
    font-size:11px;letter-spacing:.30em;text-indent:.30em;
    color:rgba(230,220,255,.86);
    background:rgba(20,14,50,.28);cursor:pointer;
    border:1px solid rgba(160,140,255,.30);
    border-radius:999px;padding:13px 28px;
    transition:.42s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    white-space:nowrap;
  }
  .navbtn:hover{
    border-color:rgba(230,200,255,.90);
    box-shadow:0 0 32px rgba(160,140,255,.44);
    background:rgba(100,80,200,.16);
    transform:translateY(-1px);
  }
  .navbtn:active{transform:translateY(0);}

  /* ---------- 底部中间：指示点 ---------- */
  #dots{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:50px;display:flex;gap:18px;
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
  }
  .dot{
    width:26px;height:2px;border-radius:2px;
    background:rgba(160,140,255,.22);
    transition:.5s cubic-bezier(.4,0,.2,1);
    cursor:pointer;pointer-events:auto;
  }
  .dot.active{
    background:rgba(230,205,255,.95);
    box-shadow:0 0 16px rgba(200,170,255,.70);
  }

  /* ---------- 右上角小标 ---------- */
  #sig{
    position:absolute;top:0;right:0;
    padding:42px 48px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.30em;line-height:1.9;
    color:rgba(130,150,210,.22);
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:22px 22px;}
    #info{padding:0 22px 30px;max-width:100%;}
    #info #story{font-size:10.5px;}
    #nav{padding:0 22px 30px;gap:8px;}
    .navbtn{padding:10px 16px;font-size:9.5px;letter-spacing:.20em;}
    #dots{padding-bottom:34px;gap:12px;}
    #sig{padding:22px 22px;font-size:8px;letter-spacing:.20em;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">SURFACE ZOO</div>
    <h1>曲面动物园</h1>
    <div class="name" id="surfName">猫耳曲面</div>
  </div>

  <div id="sig">
    PARAMETRIC SURFACES<br>
    THREE.JS · MATH GALLERY
  </div>

  <div id="info">
    <div id="formula">
      <span class="lbl">PARAMETRIC EQUATION</span>
      <span id="formulaText">y(u,v) = ...</span>
    </div>
    <div id="story">每个曲面都藏着一个数学故事……</div>
  </div>

  <div id="nav">
    <button class="navbtn" id="prev">◀ 上 一 只</button>
    <button class="navbtn" id="next">下 一 只 ▶</button>
  </div>

  <div id="dots"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* =========================================================
     基础
     ========================================================= */
  const canvas = document.getElementById('c');
  const clock = new THREE.Clock();
  const tmpColor = new THREE.Color();

  let renderer, scene, camera;
  let currentMesh = null;
  let currentIdx = 0;
  let transitioning = false;

  /* 交互旋转 */
  let targetRotY = 0, targetRotX = 0;
  let curRotY = 0, curRotX = 0;
  let dragging = false, lastPX = 0, lastPY = 0;
  let autoSpin = true;

  /* =========================================================
     颜色工具（HSL → RGB）
     ========================================================= */
  function hsl(h, s, l) {
    tmpColor.setHSL(((h % 1) + 1) % 1, s, l);
    return [tmpColor.r, tmpColor.g, tmpColor.b];
  }

  /* =========================================================
     猫耳曲面
     y(u,v) = 两个高斯凸起 + 椭圆基座
     ========================================================= */
  function catSurface(u, v) {
    const e1 = 1.55 * Math.exp(
      -(Math.pow((u - 0.50) / 0.25, 2) + Math.pow((v - 0.45) / 0.30, 2)));
    const e2 = 1.55 * Math.exp(
      -(Math.pow((u + 0.50) / 0.25, 2) + Math.pow((v - 0.45) / 0.30, 2)));
    const head = 0.85 * Math.exp(
      -(Math.pow(u / 0.90, 2) + Math.pow((v + 0.20) / 1.10, 2)));
    return [u, e1 + e2 + head, v];
  }

  function catColor(x, y, z) {
    const t = Math.min(1, Math.max(0, y / 2.1));
    const hue = (0.74 + t * 0.40) % 1;          // 紫 → 粉 → 金
    const sat = 0.68 + t * 0.22;
    const lig = 0.22 + t * 0.46;
    return hsl(hue, sat, lig);
  }

  /* =========================================================
     心形曲面
     t 参数取经典心脏线：
       x = sin³t
       y = (13cos t − 5cos 2t − 2cos 3t − cos 4t) / 16
     沿法向膨胀出立体感
     ========================================================= */
  function heartSurface(u, v) {
    const su = Math.sin(u);
    const cu = Math.cos(u);

    const px = su * su * su;
    const py = (13 * cu - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u)
                - Math.cos(4 * u)) / 16;

    const pyc = py + 0.16;                       // 居中
    const scale = Math.cos(v);                   // v ∈ [-π/2, π/2]
    const z = Math.sin(v) * 0.72;

    return [px * scale, pyc * scale, z];
  }

  function heartColor(x, y, z) {
    const d = Math.min(1, Math.max(0, (z + 0.72) / 1.44));
    const hue = (0.955 + d * 0.055) % 1;        // 玫红 → 暖红
    const sat = 0.72 + d * 0.26;
    const lig = 0.26 + d * 0.34;
    return hsl(hue, sat, lig);
  }

  /* =========================================================
     贝壳曲面
     对数螺线 + 指数增长的管半径
       R(u)  = R₀·e^(b·u)      —— 螺旋中心线半径
       tr(u) = T₀·e^(b·u)      —— 管半径
     ========================================================= */
  function shellSurface(u, v) {
    const b = 0.21;
    const growth = Math.exp(b * u);
    const R  = 0.22 * growth;
    const tr = 0.10 * growth;

    const r = R + tr * Math.cos(v);

    const x = r * Math.cos(u);
    const z = r * Math.sin(u);
    const y = tr * Math.sin(v) * 1.55 - u * 0.058;

    return [x, y, z];
  }

  function shellColor(x, y, z, u, v) {
    const t = Math.min(1, Math.max(0, u / (Math.PI * 3.5)));
    const hue = (0.055 + t * 0.50 + 0.035 * Math.sin(v * 3.0)) % 1;
    const sat = 0.52 + 0.28 * Math.sin(t * Math.PI);
    const lig = 0.26 + 0.38 * t;
    return hsl(hue, sat, lig);
  }

  /* =========================================================
     曲面定义表
     ========================================================= */
  const SURFACES = [
    {
      name: '猫耳曲面',
      en: 'CAT EAR SURFACE',
      formula: 'y(u,v) = 1.55·e<sup>−((u∓0.5)²/0.25² + (v−0.45)²/0.30²)</sup> + 0.85·e<sup>−(u²/0.9² + (v+0.2)²/1.1²)</sup>',
      story: '两个高斯凸起叠在椭圆基座上。高斯函数 e^(−x²) 是自然界最柔软的钟形曲线——它让猫耳有立体感却不生硬。把 σ 调小，耳朵变尖；调大，耳朵就圆润得像幼猫。',
      uRange: [-1.6, 1.6], vRange: [-1.6, 1.6],
      uSegs: 120, vSegs: 120,
      fn: catSurface, color: catColor,
      cameraY: 1.2, autoSpin: true
    },
    {
      name: '心形曲面',
      en: 'HEART SURFACE',
      formula: 'x = sin³u · cos v &nbsp;&nbsp; y = (13cos u − 5cos 2u − 2cos 3u − cos 4u)·cos v / 16 &nbsp;&nbsp; z = 0.72 sin v',
      story: '心脏线的参数方程背后，是一段关于笛卡尔与瑞典公主的传说。当 u 扫过一周，sin³u 与那串余弦组合描出心的轮廓，再沿 v 方向膨胀——数学可以非常浪漫。',
      uRange: [0, Math.PI * 2], vRange: [-Math.PI / 2, Math.PI / 2],
      uSegs: 160, vSegs: 48,
      fn: heartSurface, color: heartColor,
      cameraY: 0.3, autoSpin: true
    },
    {
      name: '贝壳曲面',
      en: 'SHELL SURFACE',
      formula: 'R(u) = 0.22·e<sup>0.21u</sup> &nbsp;&nbsp; r(u,v) = R + 0.10·e<sup>0.21u</sup>·cos v &nbsp;&nbsp; x = r·cos u, z = r·sin u',
      story: '对数螺线 r = a·e^(bθ) 是鹦鹉螺的建造密码。每绕一圈半径增长 e^(2πb) 倍，当 b ≈ 0.17 时约增长 2.9 倍——这个比例让贝壳在生长中始终保持形状不变。',
      uRange: [0, Math.PI * 3.5], vRange: [0, Math.PI * 2],
      uSegs: 200, vSegs: 40,
      fn: shellSurface, color: shellColor,
      cameraY: 0.6, autoSpin: true
    }
  ];

  /* =========================================================
     几何体生成
     ========================================================= */
  function buildGeometry(surf) {
    const { fn, color, uRange, vRange, uSegs, vSegs } = surf;

    const positions = [];
    const colors = [];
    const indices = [];

    for (let i = 0; i <= uSegs; i++) {
      const u = uRange[0] + (uRange[1] - uRange[0]) * (i / uSegs);
      for (let j = 0; j <= vSegs; j++) {
        const v = vRange[0] + (vRange[1] - vRange[0]) * (j / vSegs);
        const p = fn(u, v);
        positions.push(p[0], p[1], p[2]);
        const c = color(p[0], p[1], p[2], u, v);
        colors.push(c[0], c[1], c[2]);
      }
    }

    for (let i = 0; i < uSegs; i++) {
      for (let j = 0; j < vSegs; j++) {
        const a = i * (vSegs + 1) + j;
        const b = a + 1;
        const c = a + (vSegs + 1);
        const d = c + 1;
        indices.push(a, b, d, a, d, c);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color',    new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    geo.center();
    geo.computeBoundingSphere();

    return geo;
  }

  /* =========================================================
     材质
     ========================================================= */
  function makeMaterial() {
    return new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.38,
      metalness: 0.22,
      side: THREE.DoubleSide,
      flatShading: false
    });
  }

  /* =========================================================
     初始化 Three.js
     ========================================================= */
  function initThree() {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
      42, window.innerWidth / window.innerHeight, 0.1, 200
    );
    camera.position.set(0, 1.4, 6.2);
    camera.lookAt(0, 0, 0);

    /* ---- 光照 ---- */
    scene.add(new THREE.AmbientLight(0xffffff, 0.36));

    const key = new THREE.DirectionalLight(0xffffff, 1.45);
    key.position.set(6, 9, 7);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x6699ff, 0.85);
    fill.position.set(-7, -2, -3);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xff8899, 0.55);
    rim.position.set(-2, -6, 6);
    scene.add(rim);

    const top = new THREE.DirectionalLight(0xddccff, 0.40);
    top.position.set(0, 10, 0);
    scene.add(top);
  }

  /* =========================================================
     切换曲面
     ========================================================= */
  function showSurface(index) {
    if (transitioning) return;
    if (index === currentIdx && currentMesh) return;

    transitioning = true;
    const surf = SURFACES[index];

    /* 移除旧曲面 */
    if (currentMesh) {
      scene.remove(currentMesh);
      currentMesh.geometry.dispose();
      currentMesh.material.dispose();
      currentMesh = null;
    }

    /* 构建新曲面 */
    const geo = buildGeometry(surf);
    const mat = makeMaterial();
    const mesh = new THREE.Mesh(geo, mat);

    /* 归一化尺寸，让不同曲面视觉大小一致 */
    const radius = geo.boundingSphere.radius;
    const fit = 2.7 / radius;
    mesh.scale.setScalar(fit * 0.01);   // 从极小开始 —— 生长动画

    scene.add(mesh);
    currentMesh = mesh;

    /* 重置旋转 */
    targetRotY = 0;
    targetRotX = 0;
    curRotY = 0;
    curRotX = 0;

    /* 相机高度 */
    camera.position.y = surf.cameraY;
    camera.lookAt(0, 0, 0);

    /* HUD */
    document.getElementById('surfName').textContent = surf.name;
    document.getElementById('formulaText').innerHTML = surf.formula;
    document.getElementById('story').textContent = surf.story;

    /* 指示点 */
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === index);
    });

    currentIdx = index;

    /* 生长动画 */
    const start = performance.now();
    const DUR = 780;
    const targetScale = fit;
    const startTime = start;

    function grow(now) {
      const p = Math.min(1, (now - startTime) / DUR);
      const e = 1 - Math.pow(1 - p, 3);
      const s = targetScale * e;
      mesh.scale.setScalar(s);

      if (p < 1) {
        requestAnimationFrame(grow);
      } else {
        transitioning = false;
      }
    }
    requestAnimationFrame(grow);
  }

  /* =========================================================
     构建指示点
     ========================================================= */
  function buildDots() {
    const wrap = document.getElementById('dots');
    SURFACES.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'dot';
      d.title = s.name;
      d.addEventListener('click', () => showSurface(i));
      wrap.appendChild(d);
    });
  }

  /* =========================================================
     交互：拖拽旋转
     ========================================================= */
  function bindDrag() {
    canvas.addEventListener('pointerdown', e => {
      dragging = true;
      autoSpin = false;
      lastPX = e.clientX;
      lastPY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - lastPX;
      const dy = e.clientY - lastPY;
      targetRotY += dx * 0.006;
      targetRotX += dy * 0.005;
      if (targetRotX >  1.10) targetRotX =  1.10;
      if (targetRotX < -1.10) targetRotX = -1.10;
      lastPX = e.clientX;
      lastPY = e.clientY;
    });

    function endDrag(e) {
      dragging = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      /* 2 秒后恢复自动旋转 */
      setTimeout(() => { autoSpin = true; }, 2200);
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  }

  /* =========================================================
     主循环
     ========================================================= */
  function animate() {
    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();
    const dt = Math.min(clock.getDelta(), 0.05);

    /* 自动旋转 */
    if (autoSpin && currentMesh) {
      targetRotY += dt * 0.30;
    }

    /* 平滑跟随 */
    curRotY += (targetRotY - curRotY) * 0.08;
    curRotX += (targetRotX - curRotX) * 0.08;

    if (currentMesh) {
      currentMesh.rotation.y = curRotY;
      currentMesh.rotation.x = curRotX;
      /* 轻微呼吸 */
      const b = 1 + 0.008 * Math.sin(t * 1.1);
      const s = currentMesh.scale.x;
      /* 保留生长动画的缩放，只加呼吸不影响基础值 —— 用矩阵乘一个微小系数 */
      /* 简单方式：直接对 mesh 的 scale 做微调，但生长动画也在写 scale， */
      /* 所以仅在非生长时做呼吸 */
      if (!transitioning) {
        currentMesh.scale.setScalar(2.7 * b / currentMesh.geometry.boundingSphere.radius * 1.0);
      }
    }

    renderer.render(scene, camera);
  }

  /* =========================================================
     窗口尺寸
     ========================================================= */
  function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }

  /* =========================================================
     按钮绑定
     ========================================================= */
  document.getElementById('prev').addEventListener('click', () => {
    showSurface((currentIdx - 1 + SURFACES.length) % SURFACES.length);
  });
  document.getElementById('next').addEventListener('click', () => {
    showSurface((currentIdx + 1) % SURFACES.length);
  });

  window.addEventListener('resize', onResize);

  /* =========================================================
     启动
     ========================================================= */
  initThree();
  buildDots();
  bindDrag();
  showSurface(0);
  animate();

})();
</script>
</body>
</html>
