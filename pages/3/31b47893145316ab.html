<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲抛物面 · 马鞍面闭合曲线</title>
    <style>
        :root {
            --bg: #04040e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.05rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.11em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(190, 165, 140, 0.5), 0 0 6px rgba(170, 148, 125, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.68rem, 1.25vw, 0.82rem);
            font-weight: 300;
            letter-spacing: 0.07em;
            color: rgba(200, 192, 180, 0.7);
            margin-top: 0.25em;
            text-shadow: 0 0 13px rgba(155, 140, 120, 0.3);
        }
        #formula-overlay {
            bottom: clamp(16px, 4vh, 44px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.64rem, 1.15vw, 0.86rem);
            font-style: italic;
            letter-spacing: 0.04em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(155, 140, 125, 0.42), 0 0 5px rgba(165, 148, 130, 0.28);
            line-height: 1.6;
            background: rgba(10, 9, 16, 0.48);
            padding: 0.42em 1.3em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(145, 125, 105, 0.22);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.32em 0.8em;
                letter-spacing: 0.02em;
                font-size: 0.56rem;
            }
            #title-overlay .title {
                letter-spacing: 0.07em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">双曲抛物面 · 马鞍面闭合曲线</div>
        <div class="subtitle">Closed Curves on the Hyperbolic Paraboloid</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            γ<sub>a,b</sub>(t) = (a cos t , b sin t , (a² cos²t − b² sin²t)/3)
            &emsp;|&emsp; t ∈ [0, 2π] , z = (x²−y²)/3
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        // 双曲抛物面参数
        const SURFACE_SCALE = 3.0; // z = (x² - y²) / SURFACE_SCALE
        const GRID_HALF = 3.0; // xy范围[-GRID_HALF, GRID_HALF]
        const GRID_STEP = 0.45; // 网格步长
        const CURVE_SEGMENTS = 720;
        const TOTAL_VERTICES = CURVE_SEGMENTS + 1;

        // ==================== 三种颜色 ====================
        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');
        const THREE_COLORS = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x04040e, 0.00006);

        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.4, 22);
        camera.position.set(1.6, 2.4, 5.8);
        camera.lookAt(0, -0.05, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 主旋转组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 180;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 3.8 + Math.random() * 4.5;
            starPosArr[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phi) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xbab4cd,
            size: 0.009,
            transparent: true,
            opacity: 0.30,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const starPts = new THREE.Points(starGeom, starMat);
        starsGroup.add(starPts);

        // 马鞍面附近漂浮光点
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 70;
        const glowArr = new Float32Array(glowCount * 3);
        for (let i = 0; i < glowCount; i++) {
            const x = (Math.random() - 0.5) * 2 * GRID_HALF;
            const y = (Math.random() - 0.5) * 2 * GRID_HALF;
            const z = (x * x - y * y) / SURFACE_SCALE + (Math.random() - 0.5) * 0.5;
            glowArr[i * 3] = x;
            glowArr[i * 3 + 1] = y;
            glowArr[i * 3 + 2] = z;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e2cc,
            size: 0.024,
            transparent: true,
            opacity: 0.44,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const glowPts = new THREE.Points(glowGeom, glowMat);
        glowGroup.add(glowPts);

        // ==================== 双曲抛物面参考线框 ====================
        const surfaceWireGroup = new THREE.Group();
        mainGroup.add(surfaceWireGroup);
        const bgWireMats = [];

        // 抛物线：固定x，y变化
        function createParabolaX(xFixed, numPts = 260) {
            const pts = [];
            for (let i = 0; i <= numPts; i++) {
                const y = -GRID_HALF + (i / numPts) * 2 * GRID_HALF;
                const z = (xFixed * xFixed - y * y) / SURFACE_SCALE;
                pts.push(new THREE.Vector3(xFixed, y, z));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x423e5a,
                transparent: true,
                opacity: 0.16,
                depthWrite: false,
            });
            bgWireMats.push(mat);
            return new THREE.Line(geom, mat);
        }

        // 抛物线：固定y，x变化
        function createParabolaY(yFixed, numPts = 260) {
            const pts = [];
            for (let i = 0; i <= numPts; i++) {
                const x = -GRID_HALF + (i / numPts) * 2 * GRID_HALF;
                const z = (x * x - yFixed * yFixed) / SURFACE_SCALE;
                pts.push(new THREE.Vector3(x, yFixed, z));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x423e5a,
                transparent: true,
                opacity: 0.16,
                depthWrite: false,
            });
            bgWireMats.push(mat);
            return new THREE.Line(geom, mat);
        }

        // 生成网格线
        const gridHalfCeil = Math.ceil(GRID_HALF / GRID_STEP);
        for (let i = -gridHalfCeil; i <= gridHalfCeil; i++) {
            const val = i * GRID_STEP;
            if (Math.abs(val) <= GRID_HALF + 0.001) {
                surfaceWireGroup.add(createParabolaX(val));
                surfaceWireGroup.add(createParabolaY(val));
            }
        }

        // 渐近线方向参考线（在z=0平面上沿y=x和y=-x）
        function createAsymptoticLine(sign, numPts = 200) {
            const pts = [];
            const limit = GRID_HALF * 1.02;
            for (let i = 0; i <= numPts; i++) {
                const t = -limit + (i / numPts) * 2 * limit;
                const x = t;
                const y = sign * t;
                const z = (x * x - y * y) / SURFACE_SCALE; // = 0
                pts.push(new THREE.Vector3(x, y, z));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x5a5580,
                transparent: true,
                opacity: 0.22,
                depthWrite: false,
            });
            bgWireMats.push(mat);
            return new THREE.Line(geom, mat);
        }
        surfaceWireGroup.add(createAsymptoticLine(1)); // y=x
        surfaceWireGroup.add(createAsymptoticLine(-1)); // y=-x

        // ==================== 双曲抛物面上的闭合曲线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        // 金色组：近似圆形投影，不同半径
        const goldRadii = [0.55, 0.85, 1.15, 1.45, 1.75, 2.05];
        // 玫瑰粉组：椭圆投影，a > b（长轴在x方向）
        const roseParams = [
            [1.05, 0.48],
            [1.40, 0.62],
            [1.75, 0.76],
            [2.10, 0.90],
            [2.45, 1.05],
            [2.80, 1.18],
        ];
        // 青蓝组：椭圆投影，a < b（长轴在y方向）
        const cyanParams = [
            [0.48, 1.05],
            [0.62, 1.40],
            [0.76, 1.75],
            [0.90, 2.10],
            [1.05, 2.45],
            [1.18, 2.80],
        ];

        function createClosedCurveOnSaddle(a, b, color) {
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            for (let i = 0; i <= CURVE_SEGMENTS; i++) {
                const t = (i / CURVE_SEGMENTS) * Math.PI * 2;
                const cosT = Math.cos(t);
                const sinT = Math.sin(t);
                const x = a * cosT;
                const y = b * sinT;
                const z = (x * x - y * y) / SURFACE_SCALE;
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setDrawRange(0, 0);

            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.84,
                depthWrite: false,
            });
            const line = new THREE.Line(geometry, material);
            allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
            return line;
        }

        // 金色组（圆形投影）
        goldRadii.forEach(r => {
            const curve = createClosedCurveOnSaddle(r, r, COLOR_WARM_GOLD);
            curvesGroup.add(curve);
        });

        // 玫瑰粉组（a > b）
        roseParams.forEach(([a, b]) => {
            const curve = createClosedCurveOnSaddle(a, b, COLOR_ROSE);
            curvesGroup.add(curve);
        });

        // 青蓝组（a < b）
        cyanParams.forEach(([a, b]) => {
            const curve = createClosedCurveOnSaddle(a, b, COLOR_CYAN);
            curvesGroup.add(curve);
        });

        const totalCurves = allCurveData.length; // 18条

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        clock.getDelta(); // 消耗初始累积时间

        function getCycleTime() {
            const now = performance.now() / 1000;
            return (now - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            // 主旋转
            mainGroup.rotation.y += 0.26 * dt;
            mainGroup.rotation.x += 0.06 * dt;
            mainGroup.rotation.z += 0.013 * Math.sin(cycleTime * 0.55) * dt;

            // 相机微动
            const sway = 0.10 * Math.sin(cycleTime * (Math.PI * 2 / 36));
            camera.position.y = 2.4 + sway;
            camera.lookAt(0, -0.05, 0);

            // 绘制进度
            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            // 更新所有闭合曲线的绘制范围
            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            // 背景透明度渐变
            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.30 * bgOp;
            glowMat.opacity = 0.44 * bgOp;
            for (const mat of bgWireMats) {
                mat.opacity = (mat.opacity <= 0.17 ? 0.16 : 0.22) * bgOp;
            }

            // 粒子微动
            glowGroup.position.z = Math.sin(cycleTime * 1.08) * 0.25;
            starsGroup.rotation.y += dt * 0.028;
            starsGroup.rotation.x += dt * 0.018;

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 可选重置键
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        // 预热渲染，防止第一帧空白
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🐎 双曲抛物面闭合曲线动画已启动');
        console.log(`   - ${totalCurves} 条闭合曲线，3种颜色各${totalCurves / 3}条`);
        console.log(`   - 双曲抛物面：z = (x²−y²)/${SURFACE_SCALE}`);
        console.log(`   - 采样点：${CURVE_SEGMENTS}，周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 马鞍面网格 + 渐近线 + 星空粒子');
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
