<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黎曼 ζ 函数 · 素数分布</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#01040c;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* 顶部启迪文字 */
  #topText{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    width:min(1120px,82vw);
    text-align:center;
    font-size:clamp(13px,1.72vw,22px);
    line-height:1.8;
    letter-spacing:.055em;
    font-weight:500;
    color:#f4e4bd;
    text-shadow:0 0 14px rgba(255,200,90,.9),0 0 40px rgba(255,140,40,.5),0 0 80px rgba(120,60,220,.35);
    pointer-events:none;z-index:12;
  }
  #topText span{display:inline-block;will-change:opacity}

  /* 边缘公式 */
  .formula{
    position:fixed;z-index:12;pointer-events:none;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    font-size:clamp(10px,0.98vw,15px);
    color:#8fd4f5;opacity:.74;letter-spacing:.04em;line-height:2.0;
    text-shadow:0 0 10px rgba(80,190,255,.85),0 0 26px rgba(40,110,255,.5);
  }
  .tl{top:16px;left:20px}
  .bl{bottom:82px;left:20px}
  .tr{top:16px;right:20px;text-align:right}
  .br{bottom:82px;right:20px;text-align:right}
  .formula .dim{opacity:.55;font-size:.9em}
  .formula .gold{color:#ffd479;text-shadow:0 0 12px rgba(255,190,70,.95)}
  .formula .red{color:#ff7a96;text-shadow:0 0 12px rgba(255,80,120,.95)}

  /* 控制面板 */
  #ui{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;
    padding:12px 24px;border-radius:16px;
    background:rgba(8,14,34,.62);
    border:1px solid rgba(220,170,80,.22);
    backdrop-filter:blur(10px);
    box-shadow:0 0 40px rgba(60,40,140,.35),inset 0 0 26px rgba(255,190,80,.06);
  }
  #ui .row{display:flex;gap:11px;align-items:center}
  #ui label{font-size:12.5px;color:#c9b48a;letter-spacing:.06em;white-space:nowrap}
  #ui .val{color:#ffd479;font-weight:700;min-width:52px;text-align:center;
    text-shadow:0 0 12px rgba(255,200,90,.95);font-variant-numeric:tabular-nums}
  #ui .hint{font-size:11px;color:#7f9dc0;letter-spacing:.04em}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:230px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,#3a2a6a,#d4a83c,#ffd479);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff3d0;border:1px solid #ffd479;
    box-shadow:0 0 16px rgba(255,210,110,.95);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;

</style>
</head>
<body>

<div id="app"></div>
<div id="vignette"></div>
<div id="topText"></div>

<!-- 边缘公式 -->
<div class="formula tl">
  ζ(s) = Σ<sub>n=1</sub><sup>∞</sup> n<sup>−s</sup> = Π<sub>p</sub> (1 − p<sup>−s</sup>)<sup>−1</sup><br>
  <span class="dim">s = σ + it &nbsp;·&nbsp; 素数 p</span>
</div>
<div class="formula tr">
  <span class="gold">非平凡零点 ρ : ζ(ρ) = 0</span><br>
  <span class="dim">临界线 &nbsp; σ = 1/2</span>
</div>
<div class="formula bl">
  π(x) ~ Li(x) &nbsp;·&nbsp; 显式公式<br>
  <span class="dim">ψ(x) = x − Σ<sub>ρ</sub> x<sup>ρ</sup>/ρ − …</span>
</div>
<div class="formula br">
  <span class="red">黎曼猜想</span>：Re(ρ) = 1/2<br>
  <span class="dim">随机表象 · 精密秩序</span>
</div>

<!-- 控制面板 -->
<div id="ui">
  <div class="row">
    <label>t 沿临界线</label>
    <input id="tRange" type="range" min="-28" max="28" value="14.13" step="0.01">
    <span class="val" id="tVal">14.13</span>
  </div>
  <div class="row">
    <span class="hint">拖动旋转 · 滚轮缩放 · 观察零点处漩涡深坑</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   全局常量
============================================================ */
const CYCLE   = 30;              // 循环时长（秒）
const SIG0 = 0.02, SIG1 = 2.00;  // σ 范围
const T0  = -28,  T1  = 28;      // t 范围
const NX = 150, NZ = 200;        // 网格分辨率
const XC  = 1.01;                // σ 映射中心
const XSC = 3.00;                // σ → x 比例
const ZSC = 0.190;               // t → z 比例
const HMAX = 7.0;                // 曲面最大高度

/* ============================================================
   渲染器 / 场景 / 相机
============================================================ */
const host = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x01040c);
scene.fog = new THREE.FogExp2(0x01040c, 0.0125);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 4000);
const camTarget = new THREE.Vector3(0, 1.9, 0);
let camPhi  = 1.02;
let camDist = 17.5;
let dragTheta = 0;

/* ============================================================
   光斑贴图
============================================================ */
function makeGlow(){
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0,    'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,255,255,0.68)');
  g.addColorStop(0.50, 'rgba(255,255,255,0.18)');
  g.addColorStop(1,    'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const GLOW = makeGlow();

/* ============================================================
   灯光
============================================================ */
scene.add(new THREE.AmbientLight(0x1a2c55, 0.9));

const key = new THREE.DirectionalLight(0xa9d8ff, 1.5);
key.position.set(-9, 20, 13);
scene.add(key);

const p1 = new THREE.PointLight(0xffc860, 420, 80); p1.position.set( 8, 12, 10); scene.add(p1);
const p2 = new THREE.PointLight(0x3f7bff, 340, 80); p2.position.set(-12, 9,-10); scene.add(p2);
const p3 = new THREE.PointLight(0x00e0d0, 200, 70); p3.position.set(  0, 16,  0); scene.add(p3);

/* ============================================================
   黎曼 ζ 函数（Euler–Maclaurin 解析延拓）
============================================================ */
const LN = new Float64Array(32);
for (let n = 1; n < 32; n++) LN[n] = Math.log(n);

// B_{2k}/(2k)!  系数
const BERN = [
   1/12, -1/720, 1/30240, -1/1209600,
   1/47900160, -691/1307674368000, 7/523069747200
];

function zetaAbs(sigma, t){
  const N = 18;
  let sr = 0, si = 0;

  /* 直接求和 Σ_{n=1}^{N-1} n^{-s} */
  for (let n = 1; n < N; n++){
    const ln = LN[n];
    const m  = Math.exp(-sigma * ln);
    const th = -t * ln;
    sr += m * Math.cos(th);
    si += m * Math.sin(th);
  }

  const lnN  = LN[N];
  const base = Math.exp(-sigma * lnN);
  const ph   = -t * lnN;
  const cp = Math.cos(ph), sp = Math.sin(ph);

  /* + N^{-s}/2 */
  sr += 0.5 * base * cp;
  si += 0.5 * base * sp;

  /* + N^{1-s}/(s-1) */
  const mN1 = Math.exp((1 - sigma) * lnN);
  const ar = mN1 * cp, ai = mN1 * sp;
  const br = sigma - 1, bi = t;
  const dd = br*br + bi*bi + 1e-14;
  sr += (ar*br + ai*bi) / dd;
  si += (ai*br - ar*bi) / dd;

  /* Euler–Maclaurin 修正项 */
  let pr = 1, pi = 0;
  let nmod = base * Math.exp(-lnN);        // N^{-σ-1}

  for (let k = 1; k <= 7; k++){
    if (k === 1){
      pr = sigma; pi = t;                  // (s)_1 = s
    } else {
      const a1r = sigma + 2*k - 3, a1i = t;  // s + 2k-3
      const a2r = sigma + 2*k - 2, a2i = t;  // s + 2k-2
      const nr = pr*a1r - pi*a1i;
      const ni = pr*a1i + pi*a1r;
      pr = nr*a2r - ni*a2i;
      pi = nr*a2i + ni*a2r;
    }
    const c  = BERN[k-1];
    const tr = c * nmod * (pr*cp - pi*sp);
    const ti = c * nmod * (pr*sp + pi*cp);
    sr += tr; si += ti;
    nmod /= (N*N);
  }

  return Math.sqrt(sr*sr + si*si);
}

/* ============================================================
   高度映射
============================================================ */
function hOf(z){
  if (!(z > 0)) return 0;
  return HMAX * (1 - Math.exp(-z / 8));
}

/* ============================================================
   颜色梯度（金色地形）
============================================================ */
const STOPS = [
  { p:0.00, c:new THREE.Color(0x061024) },
  { p:0.18, c:new THREE.Color(0x0d3b7a) },
  { p:0.40, c:new THREE.Color(0x1580b8) },
  { p:0.60, c:new THREE.Color(0x3fc8d0) },
  { p:0.76, c:new THREE.Color(0xd4a83c) },
  { p:0.89, c:new THREE.Color(0xf5d97a) },
  { p:1.00, c:new THREE.Color(0xfff4d0) }
];
function rampColor(v, out){
  v = Math.min(1, Math.max(0, v));
  for (let i = 0; i < STOPS.length - 1; i++){
    const a = STOPS[i], b = STOPS[i+1];
    if (v <= b.p){
      const k = (v - a.p) / (b.p - a.p + 1e-9);
      out.copy(a.c).lerp(b.c, k);
      return out;
    }
  }
  out.copy(STOPS[STOPS.length - 1].c);
  return out;
}

/* ============================================================
   构建 |ζ(s)| 曲面
============================================================ */
const VCOUNT = NX * NZ;
const zVals  = new Float32Array(VCOUNT);
const posArr = new Float32Array(VCOUNT * 3);
const colArr = new Float32Array(VCOUNT * 3);
const hArr   = new Float32Array(VCOUNT);

const tmpC = new THREE.Color();

for (let j = 0; j < NZ; j++){
  const t = T0 + (T1 - T0) * j / (NZ - 1);
  for (let i = 0; i < NX; i++){
    const sg = SIG0 + (SIG1 - SIG0) * i / (NX - 1);
    const idx = j * NX + i;

    const z = zetaAbs(sg, t);
    zVals[idx] = z;

    const h = hOf(z);
    hArr[idx] = h;

    posArr[idx*3]     = (sg - XC) * XSC;
    posArr[idx*3 + 1] = h;
    posArr[idx*3 + 2] = t * ZSC;

    rampColor(h / HMAX, tmpC);
    colArr[idx*3]     = tmpC.r;
    colArr[idx*3 + 1] = tmpC.g;
    colArr[idx*3 + 2] = tmpC.b;
  }
}

/* ---- 索引（按到中心的距离排序 → 由中间向两侧生长） ---- */
const centerJ = Math.floor(NZ / 2);
const rowOrder = [];
for (let j = 0; j < NZ - 1; j++) rowOrder.push(j);
rowOrder.sort((a, b) => Math.abs(a - centerJ) - Math.abs(b - centerJ));

const idxArr = new Uint32Array((NZ - 1) * (NX - 1) * 6);
let ip = 0;
for (const j of rowOrder){
  for (let i = 0; i < NX - 1; i++){
    const a = j*NX + i, b = a + 1, c = a + NX, d = c + 1;
    idxArr[ip++] = a; idxArr[ip++] = c; idxArr[ip++] = b;
    idxArr[ip++] = b; idxArr[ip++] = c; idxArr[ip++] = d;
  }
}

const surfGeo = new THREE.BufferGeometry();
const posAttr = new THREE.BufferAttribute(posArr, 3);
surfGeo.setAttribute('position', posAttr);
surfGeo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));
surfGeo.setIndex(new THREE.BufferAttribute(idxArr, 1));
surfGeo.computeVertexNormals();

const surfMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.90,
  metalness: 0.55,
  roughness: 0.34,
  side: THREE.DoubleSide,
  emissive: new THREE.Color(0x0a1e40),
  emissiveIntensity: 0.75
});
const surface = new THREE.Mesh(surfGeo, surfMat);
surface.frustumCulled = false;
scene.add(surface);

/* ---- 金色等高线框 ---- */
const lineIdx = [];
for (let j = 0; j < NZ; j += 6){
  for (let i = 0; i < NX - 1; i++) lineIdx.push(j*NX + i, j*NX + i + 1);
}
for (let i = 0; i < NX; i += 6){
  for (let j = 0; j < NZ - 1; j++) lineIdx.push(j*NX + i, (j+1)*NX + i);
}
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', posAttr);   // 共享位置
lineGeo.setIndex(lineIdx);
const lineMat = new THREE.LineBasicMaterial({
  color: 0xffd27a, transparent: true, opacity: 0.13,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const wireLines = new THREE.LineSegments(lineGeo, lineMat);
wireLines.frustumCulled = false;
scene.add(wireLines);

/* ============================================================
   临界线 σ = 1/2
============================================================ */
const X_CRIT = (0.5 - XC) * XSC;    // ≈ -1.53

const critGeo = new THREE.BufferGeometry();
critGeo.setAttribute('position', new THREE.Float32BufferAttribute([
  X_CRIT, 0.02, T0 * ZSC,
  X_CRIT, 0.02, T1 * ZSC
], 3));
const critLine = new THREE.Line(critGeo, new THREE.LineBasicMaterial({
  color: 0xff4d6d, transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(critLine);

/* ============================================================
   非平凡零点标记（红金发光柱 + 漩涡）
============================================================ */
const ZEROS = [14.134725, 21.022040, 25.010858];

const zeroGroup = new THREE.Group();
scene.add(zeroGroup);
const zeroItems = [];

for (const zt of ZEROS){
  for (const sgn of [1, -1]){
    const tval = zt * sgn;
    const g = new THREE.Group();
    g.position.set(X_CRIT, 0, tval * ZSC);

    // 光柱
    const bh = 4.2;
    const bg = new THREE.CylinderGeometry(0.055, 0.16, bh, 12, 1, true);
    bg.translate(0, bh/2, 0);
    const bm = new THREE.MeshBasicMaterial({
      color: 0xff2d55, transparent: true, opacity: 0.42,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    });
    const beam = new THREE.Mesh(bg, bm);
    g.add(beam);

    // 柱顶光晕
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW, color: 0xff5577, transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    spr.scale.set(1.9, 1.9, 1);
    spr.position.y = bh * 0.98;
    g.add(spr);

    // 底部漩涡环
    const rg = new THREE.TorusGeometry(0.34, 0.022, 6, 32);
    const rm = new THREE.MeshBasicMaterial({
      color: 0xff8fa8, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const ring = new THREE.Mesh(rg, rm);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.06;
    g.add(ring);

    const ring2 = new THREE.Mesh(
      new THREE.TorusGeometry(0.58, 0.014, 6, 32),
      new THREE.MeshBasicMaterial({
        color: 0xffb0c4, transparent: true, opacity: 0.5,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    ring2.rotation.x = Math.PI / 2;
    ring2.position.y = 0.06;
    g.add(ring2);

    zeroGroup.add(g);
    zeroItems.push({ g, beam, spr, ring, ring2, phase: Math.random() * 6.28 });
  }
}

/* ============================================================
   素数光点 · 数轴
============================================================ */
const primes = [];
for (let n = 2; n <= 200; n++){
  let isP = true;
  for (let d = 2; d * d <= n; d++) if (n % d === 0){ isP = false; break; }
  if (isP) primes.push(n);
}

const AXIS_Z = 6.35;
const SQMAX = Math.sqrt(200);

// 数轴细线
const axisGeo = new THREE.BufferGeometry();
axisGeo.setAttribute('position', new THREE.Float32BufferAttribute([
  -6.1, 0.05, AXIS_Z,  6.1, 0.05, AXIS_Z
], 3));
scene.add(new THREE.Line(axisGeo, new THREE.LineBasicMaterial({
  color: 0x4a7fb5, transparent: true, opacity: 0.4,
  blending: THREE.AdditiveBlending, depthWrite: false
})));

// 素数光点
const primPos = new Float32Array(primes.length * 3);
const primCol = new Float32Array(primes.length * 3);
const primPhase = [];
for (let i = 0; i < primes.length; i++){
  const p = primes[i];
  const x = -6.0 + 12.0 * (Math.sqrt(p) / SQMAX);
  primPos[i*3]     = x;
  primPos[i*3 + 1] = 0.05;
  primPos[i*3 + 2] = AXIS_Z;

  tmpC.setHSL(0.115 + 0.06 * Math.random(), 0.95, 0.62);
  primCol[i*3]     = tmpC.r;
  primCol[i*3 + 1] = tmpC.g;
  primCol[i*3 + 2] = tmpC.b;
  primPhase.push(Math.random() * 6.28);
}
const primGeo = new THREE.BufferGeometry();
primGeo.setAttribute('position', new THREE.BufferAttribute(primPos, 3));
primGeo.setAttribute('color',    new THREE.BufferAttribute(primCol, 3));
const primPts = new THREE.Points(primGeo, new THREE.PointsMaterial({
  size: 0.36, map: GLOW, vertexColors: true, transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
scene.add(primPts);

// 素数竖向流光（体现稀疏度）
const spikeGeo = new THREE.BufferGeometry();
const spikePos = new Float32Array(primes.length * 2 * 3);
for (let i = 0; i < primes.length; i++){
  const x = primPos[i*3];
  spikePos[i*6]     = x; spikePos[i*6 + 1] = 0.05;  spikePos[i*6 + 2] = AXIS_Z;
  spikePos[i*6 + 3] = x; spikePos[i*6 + 4] = 0.05 + 0.55 * (1 - Math.sqrt(primes[i]) / SQMAX) + 0.1;
  spikePos[i*6 + 5] = AXIS_Z;
}
spikeGeo.setAttribute('position', new THREE.BufferAttribute(spikePos, 3));
const spikeLines = new THREE.LineSegments(spikeGeo, new THREE.LineBasicMaterial({
  color: 0xffcf7a, transparent: true, opacity: 0.3,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(spikeLines);

/* ============================================================
   沿临界线移动的探针
============================================================ */
const probe = new THREE.Group();
scene.add(probe);

const probeBall = new THREE.Mesh(
  new THREE.SphereGeometry(0.17, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 })
);
probe.add(probeBall);

const probeHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: GLOW, color: 0xfff0b0, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
probeHalo.scale.set(1.7, 1.7, 1);
probe.add(probeHalo);

const probeRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.42, 0.016, 6, 30),
  new THREE.MeshBasicMaterial({
    color: 0xffe9a0, transparent: true, opacity: 0.75,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
probeRing.rotation.x = Math.PI / 2;
probe.add(probeRing);

/* ============================================================
   背景星尘
============================================================ */
const PCOUNT = 620;
const pPos = new Float32Array(PCOUNT * 3);
const pCol = new Float32Array(PCOUNT * 3);
for (let i = 0; i < PCOUNT; i++){
  pPos[i*3]     = (Math.random() - 0.5) * 110;
  pPos[i*3 + 1] = Math.random() * 55 - 12;
  pPos[i*3 + 2] = (Math.random() - 0.5) * 110;

  tmpC.setHSL(0.58 + Math.random() * 0.12, 0.75, 0.62);
  if (Math.random() < 0.28) tmpC.setHSL(0.11, 0.9, 0.68);
  pCol[i*3]     = tmpC.r;
  pCol[i*3 + 1] = tmpC.g;
  pCol[i*3 + 2] = tmpC.b;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
const stars = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.36, map: GLOW, vertexColors: true, transparent: true, opacity: 0.7,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
scene.add(stars);

/* ============================================================
   后处理
============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.70, 0.06
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   顶部文字
============================================================ */
const TEXT = '黎曼猜想断言所有非平凡零点都在临界线上——素数看似随机却遵循深层规律，启示我们随机表象下往往隐藏着精密的秩序。';
const topEl = document.getElementById('topText');
const spans = [...TEXT].map(ch => {
  const s = document.createElement('span');
  s.textContent = ch;
  s.style.opacity = '0';
  topEl.appendChild(s);
  return s;
});
const CPS = 2.65;    // 每秒浮现字数（整段约 20 秒铺满）

/* ============================================================
   交互
============================================================ */
let dragging = false, lastX = 0, lastY = 0;
const el = renderer.domElement;

el.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  dragTheta -= dx * 0.0052;
  camPhi = Math.min(1.50, Math.max(0.18, camPhi - dy * 0.0042));
});
const endDrag = e => {
  dragging = false;
  try { el.releasePointerCapture(e.pointerId); } catch(_){}
};
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);
el.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.min(52, Math.max(8, camDist * (1 + Math.sign(e.deltaY) * 0.085)));
}, { passive: false });

/* 滑块 */
const tRange = document.getElementById('tRange');
const tValEl = document.getElementById('tVal');
let probeT = parseFloat(tRange.value);
tRange.addEventListener('input', () => {
  probeT = parseFloat(tRange.value);
  tValEl.textContent = probeT.toFixed(2);
});

/* ============================================================
   主循环
============================================================ */
const clock = new THREE.Clock();
let prevCycleT = 0;
const IDX_TOTAL = idxArr.length;

function smoothstep(a, b, x){
  const k = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return k * k * (3 - 2 * k);
}

function tick(){
  requestAnimationFrame(tick);

  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;
  const t = elapsed % CYCLE;

  /* ---- 循环重置 ---- */
  if (t < prevCycleT){
    for (const s of spans){ s.style.opacity = '0'; s._last = -1; }
  }
  prevCycleT = t;

  /* ---- 生长参数 ---- */
  const growRaw = smoothstep(0, 2.6, t);
  const growEase = growRaw * growRaw * (3 - 2 * growRaw);

  const drawCount = Math.floor(growEase * IDX_TOTAL / 6) * 6;
  surfGeo.setDrawRange(0, drawCount);

  /* ---- 淡入淡出 ---- */
  let op = 1;
  if (t < 2.6) op = t / 2.6;
  else if (t > CYCLE - 2.2) op = Math.max(0, (CYCLE - t) / 2.2);
  op = op * op * (3 - 2 * op);

  surfMat.opacity = 0.90 * op;
  lineMat.opacity = 0.13 * op;
  critLine.material.opacity = 0.55 * op;

  /* ---- 曲面呼吸 ---- */
  surfMat.emissiveIntensity = 0.55 + 0.35 * Math.sin(elapsed * 1.25);

  /* ---- 零点柱脉动 ---- */
  for (let i = 0; i < zeroItems.length; i++){
    const z = zeroItems[i];
    const ph = z.phase;
    const pulse = 0.82 + 0.18 * Math.sin(elapsed * 2.4 + ph);
    z.beam.scale.set(pulse, 0.9 + 0.22 * Math.sin(elapsed * 1.9 + ph), pulse);
    z.beam.material.opacity = (0.30 + 0.22 * Math.sin(elapsed * 2.1 + ph)) * op;

    const ss = 1.6 + 0.5 * Math.sin(elapsed * 2.8 + ph);
    z.spr.scale.set(ss, ss, 1);
    z.spr.material.opacity = (0.75 + 0.22 * Math.sin(elapsed * 3.1 + ph)) * op;

    z.ring.rotation.z = elapsed * 1.6 + ph;
    z.ring2.rotation.z = -elapsed * 1.1 + ph;
    z.ring.material.opacity = (0.55 + 0.3 * Math.sin(elapsed * 2.6 + ph)) * op;
    z.ring2.material.opacity = (0.30 + 0.2 * Math.sin(elapsed * 2.0 + ph)) * op;
  }
  zeroGroup.visible = op > 0.02;

  /* ---- 素数光点闪烁 ---- */
  const pa = primGeo.attributes.position.array;
  for (let i = 0; i < primes.length; i++){
    const s = 1 + 0.16 * Math.sin(elapsed * 2.0 + primPhase[i]);
    pa[i*3 + 1] = 0.05 + 0.10 * (s - 1) * 4;
  }
  primGeo.attributes.position.needsUpdate = true;
  primPts.material.opacity = 0.92 * op;
  spikeLines.material.opacity = 0.28 * op;

  /* ---- 探针 ---- */
  {
    const zval = zetaAbs(0.5, probeT);
    const hh = hOf(zval);
    probe.position.set(X_CRIT, hh + 0.55, probeT * ZSC);
    probeRing.rotation.z = elapsed * 2.2;
    const ps = 1.5 + 0.35 * Math.sin(elapsed * 3.6);
    probeHalo.scale.set(ps, ps, 1);
    probe.visible = op > 0.05;
  }

  /* ---- 相机 ---- */
  const autoTheta = Math.sin(elapsed * 0.115) * 0.62;
  const th = autoTheta + dragTheta;
  const sp = Math.sin(camPhi), cp = Math.cos(camPhi);
  camera.position.set(
    camTarget.x + camDist * sp * Math.sin(th),
    camTarget.y + camDist * cp,
    camTarget.z + camDist * sp * Math.cos(th)
  );
  camera.lookAt(camTarget);

  /* ---- 背景星尘 ---- */
  stars.rotation.y += 0.00022;
  stars.rotation.x  = Math.sin(elapsed * 0.045) * 0.05;

  /* ---- 顶部文字逐字浮现 ---- */
  const shown = t * CPS;
  for (let i = 0; i < spans.length; i++){
    const o = Math.min(1, Math.max(0, shown - i));
    const s = spans[i];
    if (s._last !== o){
      s._last = o;
      s.style.opacity = o.toFixed(3);
    }
  }

  /* ---- 渲染 ---- */
  composer.render();
}

/* ============================================================
   自适应
============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

/* 启动 */
tValEl.textContent = probeT.toFixed(2);
tick();
</script>
</body>
</html>
