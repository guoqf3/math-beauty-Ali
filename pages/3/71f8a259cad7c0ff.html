<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>等离子体振荡 · 朗缪尔频率与德拜屏蔽</title>
<style>
  :root{
    --cy:#5ff0ff;
    --mg:#ff5ff0;
    --vi:#a06bff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#03000a;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#cfeaff;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;display:block;z-index:0;}

  /* 暗角 */
  .vig{
    position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(0,0,0,0) 38%,
      rgba(0,0,0,.45) 74%,
      rgba(0,0,0,.86) 100%);
  }

  /* 顶部中央：人生启迪 */
  #title{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    z-index:7;pointer-events:none;
    font-size:clamp(13px,2.05vw,21px);
    letter-spacing:.14em;
    font-weight:500;
    color:#eaf8ff;
    white-space:nowrap;
    animation:titleGlow 5s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{text-shadow:0 0 6px rgba(95,240,255,.85),0 0 20px rgba(160,107,255,.65),0 0 42px rgba(255,95,240,.38);opacity:.93;}
    50%    {text-shadow:0 0 12px rgba(95,240,255,1),0 0 34px rgba(160,107,255,.95),0 0 72px rgba(255,95,240,.65);opacity:1;}
  }

  /* 边缘公式 */
  .eq{
    position:fixed;z-index:5;pointer-events:none;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:clamp(9.5px,1.05vw,13px);
    line-height:1.85;
    color:#8fd8ff;
    opacity:.78;
    text-shadow:0 0 9px rgba(80,200,255,.75),0 0 24px rgba(150,90,255,.35);
    letter-spacing:.02em;
  }
  .eq b{color:#ffd9ff;font-weight:600;text-shadow:0 0 10px rgba(255,120,240,.9);}
  .eq .dim{opacity:.55;font-size:.92em;}
  .tl{top:58px;left:18px;}
  .tr{top:58px;right:18px;text-align:right;}
  .bl{bottom:132px;left:18px;}
  .br{bottom:132px;right:18px;text-align:right;}

  /* 控制面板 */
  #panel{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    z-index:6;
    width:min(600px,92vw);
    padding:11px 16px 12px;
    border-radius:14px;
    background:rgba(10,4,26,.58);
    border:1px solid rgba(110,200,255,.22);
    box-shadow:0 0 26px rgba(80,160,255,.16),inset 0 0 34px rgba(120,60,255,.08);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    font-size:11.5px;
    display:flex;flex-direction:column;gap:7px;
  }
  .row{display:grid;grid-template-columns:52px 1fr 128px;align-items:center;gap:10px;}
  .tag{color:#7fe6ff;font-family:ui-monospace,Consolas,monospace;letter-spacing:.03em;}
  .val{text-align:right;color:#ffd9ff;font-family:ui-monospace,Consolas,monospace;
       font-size:11px;text-shadow:0 0 8px rgba(255,110,240,.7);}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#1de9ff,#a06bff,#ff5ff0);
    box-shadow:0 0 10px rgba(110,180,255,.45);
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 0 9px #7cf,0 0 20px #a6f;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:#fff;box-shadow:0 0 9px #7cf,0 0 20px #a6f;
  }
  #out{
    margin-top:2px;padding-top:8px;
    border-top:1px solid rgba(110,200,255,.16);
    font-family:ui-monospace,Consolas,monospace;
    font-size:11.5px;color:#a9e6ff;
    display:flex;flex-wrap:wrap;gap:4px 16px;
    letter-spacing:.01em;
  }
  #out b{color:#8cffd8;text-shadow:0 0 10px rgba(90,255,200,.8);font-weight:600;}
  #out .hi{color:#ffb0f0;text-shadow:0 0 10px rgba(255,110,240,.8);}

  /* 点击探针标签 */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:8;}
  .probe{
    position:absolute;
    transform:translate(-50%,-50%);
    padding:7px 10px;border-radius:9px;
    font-family:ui-monospace,Consolas,monospace;
    font-size:10.5px;line-height:1.6;color:#e2f6ff;
    background:rgba(8,4,22,.84);
    border:1px solid rgba(120,220,255,.5);
    box-shadow:0 0 18px rgba(90,200,255,.45),inset 0 0 14px rgba(140,80,255,.22);
    white-space:nowrap;pointer-events:none;
    transition:opacity .15s linear;
  }
  .probe i{font-style:normal;color:#7fe6ff;}
  .probe em{font-style:normal;color:#ffb0f0;}

  @media (max-width:820px){
    .bl,.br{bottom:150px;}
    .eq{font-size:9.5px;}
    .row{grid-template-columns:44px 1fr 104px;gap:7px;}
  }
  @media (max-width:560px){
    #title{letter-spacing:.06em;}
    .br{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vig"></div>

<!-- 顶部中央：人生启迪（约25字） -->
<div id="title">每一次微小振荡，都在守护等离子体的集体辉光</div>

<!-- 边缘公式 -->
<div class="eq tl">
  <div>ω<sub>p</sub> = √( n·e² / (ε₀·m<sub>e</sub>) )</div>
  <div class="dim">n = 电子数密度 · m<sub>e</sub> = 电子质量</div>
</div>

<div class="eq tr">
  <div>λ<sub>D</sub> = √( ε₀·k<sub>B</sub>·T<sub>e</sub> / (n·e²) )</div>
  <div class="dim">德拜屏蔽长度 · 电荷屏蔽半径</div>
</div>

<div class="eq bl">
  <div>Λ = n·λ<sub>D</sub>³ &nbsp;<b>≫ 1</b>&nbsp;（理想等离子体判据）</div>
  <div class="dim">托卡马克：n = 2×10¹⁹ m⁻³ · T<sub>e</sub> = 1 keV</div>
</div>

<div class="eq br">
  <div>ω<sub>in</sub> &lt; ω<sub>p</sub> → <b>反射 / 倏逝波</b></div>
  <div>ω<sub>in</sub> &gt; ω<sub>p</sub> → <b>透射</b></div>
</div>

<!-- 控制面板 -->
<div id="panel">
  <div class="row">
    <span class="tag">n</span>
    <input id="ns" type="range" min="18" max="21" step="0.005" value="19.301">
    <span class="val" id="nv">—</span>
  </div>
  <div class="row">
    <span class="tag">T<sub>e</sub></span>
    <input id="ts" type="range" min="-1" max="1" step="0.005" value="0">
    <span class="val" id="tv">—</span>
  </div>
  <div id="out">
    <span>ω<sub>p</sub> = <b id="wpv">—</b></span>
    <span>λ<sub>D</sub> = <b id="ldv">—</b></span>
    <span>Λ = <b id="lamv">—</b></span>
    <span class="hi" id="cmp">—</span>
  </div>
</div>

<div id="labels"></div>

<script>
(function(){
'use strict';

/* ================= 物理常量与状态 ================= */
const E_CH = 1.602176634e-19;
const EPS0 = 8.8541878128e-12;
const ME   = 9.1093837015e-31;
const KB   = 1.380649e-23;
const EV_K = 11604.51812;

let nDens = 2e19;   // m^-3
let TeeV   = 1000;  // eV
let wp = 0, lamD = 0, Lam = 0;

function computePhysics(){
  wp   = Math.sqrt(nDens*E_CH*E_CH/(EPS0*ME));
  lamD = Math.sqrt(EPS0*KB*TeeV*EV_K/(nDens*E_CH*E_CH));
  Lam  = nDens*Math.pow(lamD,3);
}

/* 入射电磁波参考频率（用于截止判据对比） */
const W_IN = 1.8e11; // rad/s

/* ================= 工具函数 ================= */
const SUPS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':''};
function sup(s){ return String(s).split('').map(c => SUPS[c]!==undefined ? SUPS[c] : c).join(''); }
function sci(x, d){
  d = d===undefined ? 2 : d;
  if(!isFinite(x) || x===0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  const m = x/Math.pow(10,e);
  return m.toFixed(d) + '×10' + sup(e);
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a + Math.random()*(b-a); }

/* ================= 画布 ================= */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha:false });
let W=0,H=0,cx=0,cy=0,DPR=1,Rmax=1000;

let parts = [];
let clouds = [];
const rings = [];
let ringAcc = 0;

/* 可视化映射量 */
const vis = { k:0.07, omega:8, lambda:90, v:120 };

function updateVis(){
  const ratio = clamp(wp/2.5231e11, 1e-3, 1e4);
  vis.v      = 120 * Math.pow(ratio, 0.35);
  vis.lambda = clamp(90 * Math.sqrt(lamD/5.25e-5), 40, 200);
  vis.k      = 2*Math.PI/vis.lambda;
  vis.omega  = vis.k * vis.v;
}

/* ================= 构建粒子与星云 ================= */
function buildParticles(){
  parts = [];
  const N = clamp(Math.round(W*H/1500), 420, 1250);
  for(let i=0;i<N;i++){
    parts.push({
      r0: Math.pow(Math.random(), 0.62) * Rmax,
      a0: Math.random()*Math.PI*2,
      ph: Math.random()*Math.PI*2,
      h : Math.random(),
      sz: rnd(0.55, 1.9),
      tw: rnd(0.6, 2.4)
    });
  }
}

function buildClouds(){
  clouds = [];
  const N = 10;
  for(let i=0;i<N;i++){
    clouds.push({
      hue  : rnd(180, 330),
      rx   : rnd(0.08, 0.42)*W,
      ry   : rnd(0.08, 0.36)*H,
      sx   : rnd(0.03, 0.11) * (Math.random()<0.5?-1:1),
      sy   : rnd(0.03, 0.11) * (Math.random()<0.5?-1:1),
      ph   : Math.random()*Math.PI*2,
      rad  : rnd(0.18, 0.44)*Math.max(W,H),
      inten: rnd(0.35, 0.95),
      pulse: rnd(0.25, 0.7)
    });
  }
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.round(W*DPR);
  cvs.height = Math.round(H*DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W/2; cy = H/2;
  Rmax = Math.hypot(W,H)*0.5;
  buildParticles();
  buildClouds();
}

/* ================= 涟漪环 ================= */
function updateRings(dt){
  ringAcc += dt;
  const period = 2*Math.PI / Math.max(vis.omega, 0.6);
  let guard = 0;
  while(ringAcc >= period && guard++ < 6){
    ringAcc -= period;
    rings.push({
      r  : 0,
      hue: rnd(170, 340),
      w  : rnd(1.0, 2.2),
      ph : Math.random()*Math.PI*2
    });
  }
  for(let i=rings.length-1;i>=0;i--){
    const g = rings[i];
    g.r += vis.v * dt;
    if(g.r > Rmax*1.06) rings.splice(i,1);
  }
}

/* ================= 渲染 ================= */
let tNow = 0;
let lastT = performance.now()/1000;

function drawClouds(t, hueBase, env){
  for(let i=0;i<clouds.length;i++){
    const c = clouds[i];
    const x = cx + Math.cos(t*c.sx + c.ph)*c.rx;
    const y = cy + Math.sin(t*c.sy + c.ph*1.3)*c.ry;
    const rr = c.rad * (1 + 0.14*Math.sin(t*c.pulse + c.ph));
    const h = (c.hue + hueBase*0.5) % 360;
    const g = ctx.createRadialGradient(x,y,0,x,y,rr);
    g.addColorStop(0.00, 'hsla('+(h|0)+',100%,62%,'+(0.105*c.inten*env).toFixed(4)+')');
    g.addColorStop(0.35, 'hsla('+((h+40)%360|0)+',100%,56%,'+(0.055*c.inten*env).toFixed(4)+')');
    g.addColorStop(0.70, 'hsla('+((h+95)%360|0)+',100%,50%,'+(0.020*c.inten*env).toFixed(4)+')');
    g.addColorStop(1.00, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x,y,rr,0,6.2832);
    ctx.fill();
  }
}

function drawCore(t, hueBase, env){
  const pulse = 0.5 + 0.5*Math.sin(t*vis.omega*0.9);
  const rr = Math.min(W,H) * (0.09 + 0.055*pulse);
  const h1 = (hueBase + 180) % 360;
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,rr);
  g.addColorStop(0.00,'hsla('+(h1|0)+',100%,88%,'+(0.30*env).toFixed(3)+')');
  g.addColorStop(0.22,'hsla('+((h1+45)%360|0)+',100%,66%,'+(0.15*env).toFixed(3)+')');
  g.addColorStop(0.55,'hsla('+((h1+90)%360|0)+',100%,55%,'+(0.06*env).toFixed(3)+')');
  g.addColorStop(1.00,'hsla(0,0%,0%,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx,cy,rr,0,6.2832); ctx.fill();
}

function drawRings(t, hueBase){
  for(let i=0;i<rings.length;i++){
    const g = rings[i];
    const rr = g.r;
    if(rr < 6) continue;
    const fade = Math.pow(1 - clamp(rr/(Rmax*1.06), 0, 1), 1.3);
    const a = fade * 0.55;
    if(a < 0.008) continue;
    const h = ((g.hue + hueBase*0.6) % 360) | 0;
    // 辉光晕
    ctx.beginPath();
    ctx.arc(cx,cy,rr,0,6.2832);
    ctx.strokeStyle = 'hsla('+h+',100%,62%,'+(a*0.16).toFixed(3)+')';
    ctx.lineWidth = g.w*7;
    ctx.stroke();
    // 细亮环
    ctx.beginPath();
    ctx.arc(cx,cy,rr,0,6.2832);
    ctx.strokeStyle = 'hsla('+h+',100%,76%,'+(a*0.9).toFixed(3)+')';
    ctx.lineWidth = g.w;
    ctx.stroke();
  }
}

function drawParticles(t, hueBase, env){
  const amp = 5 + 9*Math.min(1, vis.lambda/120);
  const k = vis.k;
  const om = vis.omega;
  const rot = t*0.028;

  for(let i=0;i<parts.length;i++){
    const p = parts[i];
    // 朗缪尔纵向集体振荡：以波的形式向外传播
    const phase = k*p.r0 - om*t + p.ph;
    const dr = amp * Math.sin(phase);
    const r  = p.r0 + dr;
    const a  = p.a0 + rot + 0.06*Math.sin(t*0.6 + p.ph);
    const x  = cx + Math.cos(a)*r;
    const y  = cy + Math.sin(a)*r;
    if(x < -24 || x > W+24 || y < -24 || y > H+24) continue;

    const tw = 0.5 + 0.5*Math.sin(t*p.tw*2.4 + p.ph*3);
    const alpha = (0.14 + 0.55*tw) * env * (0.55 + 0.45*(1 - p.r0/Rmax));
    const hue = (200 + p.h*130 + hueBase) % 360;

    ctx.fillStyle = 'hsla('+(hue|0)+',100%,'+((58 + 22*p.h)|0)+'%,'+alpha.toFixed(3)+')';
    ctx.beginPath();
    ctx.arc(x, y, p.sz*(0.8 + 0.55*tw), 0, 6.2832);
    ctx.fill();
  }
}

function render(t){
  // 拖尾衰减
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(3,0,12,0.22)';
  ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation = 'lighter';

  const hueBase = (t*11) % 360;
  const env = 0.78 + 0.22*Math.sin(t*2*Math.PI/30); // 30 秒呼吸包络

  drawClouds(t, hueBase, env);
  drawParticles(t, hueBase, env);
  drawRings(t, hueBase);
  drawCore(t, hueBase, env);
}

/* ================= 主循环 ================= */
function loop(nowMs){
  const now = nowMs/1000;
  let dt = now - lastT;
  if(!(dt > 0)) dt = 0.016;
  if(dt > 0.08) dt = 0.08;
  lastT = now;
  tNow += dt;

  updateVis();
  updateRings(dt);
  render(tNow);
  updateLabels();

  requestAnimationFrame(loop);
}

/* ================= 点击探针标签 ================= */
const labelHost = document.getElementById('labels');
const labels = [];

function addLabel(x, y){
  const el = document.createElement('div');
  el.className = 'probe';
  el.style.opacity = '0';
  labelHost.appendChild(el);
  labels.push({ x:x, y:y, el:el, born:tNow });
  while(labels.length > 6){
    const old = labels.shift();
    if(old.el.parentNode) old.el.parentNode.removeChild(old.el);
  }
}

function updateLabels(){
  for(let i=labels.length-1;i>=0;i--){
    const L = labels[i];
    const age = tNow - L.born;
    if(age > 7){
      if(L.el.parentNode) L.el.parentNode.removeChild(L.el);
      labels.splice(i,1);
      continue;
    }
    const dx = L.x - cx, dy = L.y - cy;
    const rr = Math.hypot(dx,dy);
    const p  = clamp(rr/Rmax, 0, 1);

    // 局部密度涨落（与屏幕上的朗缪尔波同相）
    const phase = vis.k*rr - vis.omega*tNow;
    const dens  = Math.max(0.08, 1 + 0.42*Math.sin(phase)) * (0.40 + 0.60*Math.exp(-p*p*2.4));
    const nLoc  = nDens * dens;
    const tLoc  = TeeV  * (0.55 + 0.80*Math.exp(-p*p*1.6));

    const wpL = Math.sqrt(nLoc*E_CH*E_CH/(EPS0*ME));
    const ldL = Math.sqrt(EPS0*KB*tLoc*EV_K/(nLoc*E_CH*E_CH));

    const ratio = wpL / W_IN;
    const verdict = ratio > 1
      ? '<em>ω_p&gt;ω_in → 反射（倏逝）</em>'
      : '<em>ω_p&lt;ω_in → 可透射</em>';

    let opa = 1;
    if(age < 0.3) opa = age/0.3;
    else if(age > 6) opa = (7-age);

    L.el.style.opacity = opa.toFixed(2);
    L.el.style.left = L.x + 'px';
    L.el.style.top  = L.y + 'px';
    L.el.innerHTML =
      '<i>n</i> = ' + sci(nLoc,2) + ' m⁻³<br>' +
      '<i>T</i><sub>e</sub> = ' + (tLoc/1000).toFixed(2) + ' keV<br>' +
      '<i>ω</i><sub>p</sub> = ' + sci(wpL,2) + ' rad/s<br>' +
      '<i>λ</i><sub>D</sub> = ' + (ldL*1e6).toFixed(1) + ' μm<br>' +
      'ω_p/ω_in = ' + ratio.toFixed(2) + '　' + verdict;
  }
}

cvs.addEventListener('pointerdown', function(ev){
  const rect = cvs.getBoundingClientRect();
  addLabel(ev.clientX - rect.left, ev.clientY - rect.top);
});

/* ================= UI 绑定 ================= */
const ns = document.getElementById('ns');
const ts = document.getElementById('ts');
const nvEl = document.getElementById('nv');
const tvEl = document.getElementById('tv');
const wpEl = document.getElementById('wpv');
const ldEl = document.getElementById('ldv');
const lamEl= document.getElementById('lamv');
const cmpEl= document.getElementById('cmp');

function updateReadout(){
  nvEl.textContent = sci(nDens,2) + ' m⁻³';
  tvEl.textContent = (TeeV/1000).toFixed(2) + ' keV';
  wpEl.textContent = sci(wp,2) + ' rad/s';
  ldEl.textContent = (lamD*1e6).toFixed(1) + ' μm';
  lamEl.textContent= sci(Lam,2);

  const ratio = wp / W_IN;
  cmpEl.textContent = ratio > 1
    ? 'ω_p/ω_in=' + ratio.toFixed(2) + ' → 反射'
    : 'ω_p/ω_in=' + ratio.toFixed(2) + ' → 透射';
  cmpEl.style.color = ratio > 1 ? '#ff9be8' : '#8cffd8';
}

function onSlider(){
  nDens = Math.pow(10, parseFloat(ns.value));        // 1e18 ~ 1e21
  TeeV  = 1000 * Math.pow(10, parseFloat(ts.value)); // 0.1 ~ 10 keV
  computePhysics();
  updateVis();
  updateReadout();
}

ns.addEventListener('input', onSlider);
ts.addEventListener('input', onSlider);

window.addEventListener('resize', function(){
  resize();
  updateVis();
});
window.addEventListener('orientationchange', function(){
  setTimeout(function(){ resize(); updateVis(); }, 220);
});

/* ================= 启动 ================= */
computePhysics();
resize();
updateVis();
onSlider();

requestAnimationFrame(function(ts0){
  lastT = ts0/1000;
  requestAnimationFrame(loop);
});

})();
</script>
</body>
</html>
