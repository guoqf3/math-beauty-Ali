<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>渗流阈值 · 临界点 | Percolation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#03060d}
  body{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    color:#7fe3ff;-webkit-font-smoothing:antialiased;
  }
  #c{position:fixed;inset:0;display:block}

  .hud{
    position:fixed;pointer-events:none;
    font-size:11px;line-height:1.9;letter-spacing:.4px;
    color:#5fc8e8;
    text-shadow:0 0 10px rgba(0,190,255,.5);
    white-space:nowrap;
  }
  .hud b{color:#c8fff2;font-weight:500}
  .hud .hl{color:#9fffe6}
  .hud .dim{color:#2f6f8c}

  #tl{left:26px;top:22px}
  #tl .title{
    font-size:15px;letter-spacing:3px;color:#b8fff4;
    text-shadow:0 0 16px rgba(0,255,220,.7),0 0 40px rgba(0,180,255,.45);
    margin-bottom:6px;
  }
  #tl .sub{font-size:10px;letter-spacing:2px;color:#2f7f9e;margin-bottom:10px}

  #tr{right:26px;top:22px;text-align:right}
  #tr .big{
    font-size:30px;line-height:1.1;color:#d6fff8;
    text-shadow:0 0 18px rgba(0,255,220,.75),0 0 48px rgba(0,160,255,.5);
    letter-spacing:1px;
  }
  #tr .st{font-size:11px;letter-spacing:2px;margin-top:6px;color:#3d8fae}
  #tr .st.on{color:#ffd9a0;text-shadow:0 0 14px rgba(255,190,90,.8)}

  #bl{left:26px;bottom:22px}
  #bl .row{margin-bottom:2px}

  #hist{position:fixed;right:26px;bottom:22px;pointer-events:none}

  #ctrl{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;
    padding:10px 18px;border-radius:30px;
    background:rgba(5,18,32,.72);
    border:1px solid rgba(0,190,255,.28);
    box-shadow:0 0 30px rgba(0,150,255,.22),inset 0 0 24px rgba(0,120,200,.14);
    backdrop-filter:blur(6px);
    font-size:11px;letter-spacing:1px;color:#66c9e6;
  }
  #ctrl .lab{color:#39a2c4}
  #ctrl .val{color:#c9fff4;min-width:64px;display:inline-block}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:230px;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#0a3048,#28cdf5);
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#e6fff9;border:none;
    box-shadow:0 0 12px #35e6ff,0 0 26px #35e6ff,0 0 4px #fff;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:#e6fff9;
    box-shadow:0 0 12px #35e6ff,0 0 26px #35e6ff;
  }
  #btn{
    pointer-events:auto;cursor:pointer;user-select:none;
    padding:5px 14px;border-radius:16px;
    border:1px solid rgba(0,200,255,.45);
    background:rgba(0,60,90,.35);
    color:#7fe3ff;transition:transform .12s,box-shadow .22s,background .22s,color .22s;
    font-size:10px;letter-spacing:2px;
    box-shadow:0 0 12px rgba(0,180,255,.25);
    white-space:nowrap;
  }
  #btn:hover{
    background:rgba(0,110,160,.5);
    color:#d6fff8;
    box-shadow:0 0 20px rgba(60,220,255,.55);
  }
  #btn:active{transform:scale(.94)}
  #btn.flash{
    color:#031a17;background:#7dffe0;border-color:#7dffe0;
    box-shadow:0 0 26px rgba(120,255,225,.95),0 0 60px rgba(0,200,255,.55);
    transform:scale(.96);
  }
  @media (max-width:900px){
    #hist{display:none}
    #bl{display:none}
    input[type=range]{width:130px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="tl">
  <div class="title">渗 流 阈 值 · 临 界 点</div>
  <div class="sub">PERCOLATION · CRITICAL PHENOMENA</div>
  <div>p<sub>c</sub> = <b>0.592746</b> &nbsp;<span class="dim">正方格子</span></div>
  <div>P<sub>∞</sub>(p) ∝ (p − p<sub>c</sub>)<sup>5/36</sup></div>
  <div>ξ ∝ |p − p<sub>c</sub>|<sup>−4/3</sup></div>
</div>

<div class="hud" id="tr">
  <div class="big" id="pval">0.4500</div>
  <div class="st" id="pstate">— 未贯穿 —</div>
  <div style="margin-top:6px" class="dim">s ∝ s<sup>−187/91</sup></div>
</div>

<div class="hud" id="bl">
  <div class="row dim">64 × 64 格点 · 蒙特卡洛</div>
  <div class="row">最大集团 <span class="hl" id="maxs">0</span> 格</div>
  <div class="row">集团总数 <span class="hl" id="nc">0</span></div>
  <div class="row dim" id="ratio">占据率 0.0%</div>
</div>

<canvas id="hist"></canvas>

<div id="ctrl">
  <span class="lab">p</span>
  <input type="range" id="slider" min="0.45" max="0.75" step="0.0005" value="0.45">
  <span class="val" id="slabel">0.4500</span>
  <div id="btn">⟳ 重新渗流</div>
</div>

<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════
   常量 / 状态
   ══════════════════════════════════════════════ */
const N = 64;                     // ★ 64 × 64 格点
const TOTAL = N * N;
const PC = 0.592746;

const field  = new Float32Array(TOTAL);
const occ    = new Uint8Array(TOTAL);
const par    = new Int32Array(TOTAL);
const sz     = new Int32Array(TOTAL);
const birth  = new Float32Array(TOTAL);
const order  = new Uint32Array(TOTAL);

for (let i = 0; i < TOTAL; i++) {
  field[i] = Math.random();
  par[i] = i;
  order[i] = i;
}
for (let i = TOTAL - 1; i > 0; i--) {
  const j = (Math.random() * (i + 1)) | 0;
  const t = order[i]; order[i] = order[j]; order[j] = t;
}

let maxRoot = -1, maxSize = 0;
let percolates = false;
let path = [];
let clusterCount = 0;

const prevBuf = new Int32Array(TOTAL);
const stampBuf = new Int32Array(TOTAL);
const queueBuf = new Int32Array(TOTAL);
let stamp = 0;

/* ══════════════════════════════════════════════
   并查集
   ══════════════════════════════════════════════ */
function find(x) {
  while (par[x] !== x) {
    par[x] = par[par[x]];
    x = par[x];
  }
  return x;
}

function union(a, b) {
  let ra = find(a), rb = find(b);
  if (ra === rb) return;
  if (sz[ra] < sz[rb]) { const t = ra; ra = rb; rb = t; }
  par[rb] = ra;
  sz[ra] += sz[rb];
  sz[rb] = 0;
}

function occupy(i, t) {
  if (occ[i]) return;
  occ[i] = 1;
  par[i] = i;
  sz[i] = 1;
  birth[i] = t;

  const x = i % N;
  const y = (i / N) | 0;
  if (y > 0)     { const j = i - N; if (occ[j]) union(i, j); }
  if (y < N - 1) { const j = i + N; if (occ[j]) union(i, j); }
  if (x > 0)     { const j = i - 1; if (occ[j]) union(i, j); }
  if (x < N - 1) { const j = i + 1; if (occ[j]) union(i, j); }
}

/* ══════════════════════════════════════════════
   逐帧生长（自动模式下使用）
   ══════════════════════════════════════════════ */
function updateOcc(p, et) {
  let added = 0;
  const MAXADD = 80;               // 64×64 适配
  for (let k = 0; k < TOTAL; k++) {
    const i = order[k];
    if (occ[i]) continue;
    if (field[i] < p) {
      occupy(i, et);
      if (++added >= MAXADD) break;
    }
  }
}

/* ══════════════════════════════════════════════
   分析：最大集团 / 贯穿路径
   ══════════════════════════════════════════════ */
function analyze() {
  maxRoot = -1; maxSize = 0; clusterCount = 0;
  for (let i = 0; i < TOTAL; i++) {
    if (occ[i] && par[i] === i && sz[i] > 0) {
      clusterCount++;
      if (sz[i] > maxSize) { maxSize = sz[i]; maxRoot = i; }
    }
  }

  if (maxSize < 4 || maxRoot < 0) { percolates = false; path = []; return; }

  let hasTop = false, hasBot = false;
  for (let x = 0; x < N; x++) {
    if (!hasTop && occ[x]) { if (find(x) === maxRoot) hasTop = true; }
    const b = (N - 1) * N + x;
    if (!hasBot && occ[b]) { if (find(b) === maxRoot) hasBot = true; }
    if (hasTop && hasBot) break;
  }
  if (!hasTop || !hasBot) { percolates = false; path = []; return; }

  percolates = true;

  stamp++;
  let qh = 0, qt = 0;

  for (let x = 0; x < N; x++) {
    const i = x;
    if (occ[i] && find(i) === maxRoot) {
      stampBuf[i] = stamp;
      prevBuf[i] = -1;
      queueBuf[qt++] = i;
    }
  }

  let end = -1;
  while (qh < qt) {
    const i = queueBuf[qh++];
    const y = (i / N) | 0;
    if (y === N - 1) { end = i; break; }

    const x = i % N;
    if (y > 0)     { const j = i - N; if (occ[j] && stampBuf[j] !== stamp && find(j) === maxRoot) { stampBuf[j] = stamp; prevBuf[j] = i; queueBuf[qt++] = j; } }
    if (y < N - 1) { const j = i + N; if (occ[j] && stampBuf[j] !== stamp && find(j) === maxRoot) { stampBuf[j] = stamp; prevBuf[j] = i; queueBuf[qt++] = j; } }
    if (x > 0)     { const j = i - 1; if (occ[j] && stampBuf[j] !== stamp && find(j) === maxRoot) { stampBuf[j] = stamp; prevBuf[j] = i; queueBuf[qt++] = j; } }
    if (x < N - 1) { const j = i + 1; if (occ[j] && stampBuf[j] !== stamp && find(j) === maxRoot) { stampBuf[j] = stamp; prevBuf[j] = i; queueBuf[qt++] = j; } }
  }

  if (end < 0) { path = []; return; }

  const p = [];
  let c = end;
  let guard = 0;
  while (c !== -1 && guard++ < TOTAL) {
    p.push(c);
    c = prevBuf[c];
  }
  p.reverse();
  path = p;
}

/* ══════════════════════════════════════════════
   拖动滑块：按新 p 立即全量重建
   ══════════════════════════════════════════════ */
function rebuild(p) {
  occ.fill(0);
  par.fill(0);
  sz.fill(0);
  birth.fill(0);
  maxRoot = -1;
  maxSize = 0;
  clusterCount = 0;
  percolates = false;
  path = [];

  if (p < PC) critDone = false;

  for (let i = 0; i < TOTAL; i++) {
    if (field[i] < p) occupy(i, -9999);
  }

  analyze();
  updateBins();
}

/* ══════════════════════════════════════════════
   ★ 重新渗流：重掷随机场 + 时间线归零
   → p 将从 0.45 自动增长到 0.75 附近
   ══════════════════════════════════════════════ */
function reseed() {
  // 1. 重掷随机阈值
  for (let i = 0; i < TOTAL; i++) field[i] = Math.random();

  // 2. 重打乱遍历顺序
  for (let i = TOTAL - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }

  // 3. 清空全部状态
  occ.fill(0);
  par.fill(0);
  sz.fill(0);
  birth.fill(0);
  maxRoot = -1;
  maxSize = 0;
  clusterCount = 0;
  percolates = false;
  path = [];
  critDone = false;

  // 4. 切回自动模式，时间线归零 → p 自动重新增长
  manual = false;
  startTime = null;

  // 5. 滑块回位
  slider.value = P0.toFixed(4);
  slabel.textContent = P0.toFixed(4);
  pvalEl.textContent = P0.toFixed(4);

  analyze();
  updateBins();
}

/* ══════════════════════════════════════════════
   颜色缓存
   ══════════════════════════════════════════════ */
const colorCache = new Map();
function getColor(r, s) {
  const e = colorCache.get(r);
  if (e !== undefined && e.s === s) return e.c;
  const h = 148 + ((r * 2654435761 >>> 0) % 1000) / 1000 * 44;
  const tt = Math.min(1, Math.log10(s + 1) / 3.0);
  const L = 15 + 54 * tt;
  const S = 68 + 32 * tt;
  const c = `hsl(${h.toFixed(0)},${S.toFixed(0)}%,${L.toFixed(0)}%)`;
  if (colorCache.size > 6000) colorCache.clear();
  colorCache.set(r, { s, c });
  return c;
}

/* ══════════════════════════════════════════════
   画布 & 布局
   ══════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W, H, DPR;
let gx, gy, gsize, cs;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  gsize = Math.min(W * 0.58, H * 0.74, 760);
  gx = (W - gsize) / 2;
  gy = (H - gsize) / 2;
  cs = gsize / N;
}
window.addEventListener('resize', resize);

/* ══════════════════════════════════════════════
   直方图
   ══════════════════════════════════════════════ */
const histCanvas = document.getElementById('hist');
const hctx = histCanvas.getContext('2d');
const HW = 262, HH = 148;
let HD = 1;

function sizeHist() {
  HD = Math.min(window.devicePixelRatio || 1, 2);
  histCanvas.width = HW * HD;
  histCanvas.height = HH * HD;
  histCanvas.style.width = HW + 'px';
  histCanvas.style.height = HH + 'px';
  hctx.setTransform(HD, 0, 0, HD, 0, 0);
}

const NB = 22;
const bins = new Float32Array(NB);
let binMax = 1;

function updateBins() {
  bins.fill(0);
  const logMax = 3.4;
  for (let i = 0; i < TOTAL; i++) {
    if (occ[i] && par[i] === i && sz[i] > 0) {
      const b = Math.min(NB - 1, Math.floor(Math.log10(sz[i]) / logMax * NB));
      if (b >= 0) bins[b]++;
    }
  }
  binMax = 1;
  for (let i = 0; i < NB; i++) if (bins[i] > binMax) binMax = bins[i];
}

function drawHist() {
  hctx.clearRect(0, 0, HW, HH);
  hctx.fillStyle = 'rgba(4,13,24,0.82)';
  hctx.fillRect(0, 0, HW, HH);
  hctx.strokeStyle = 'rgba(0,200,255,0.30)';
  hctx.lineWidth = 1;
  hctx.strokeRect(0.5, 0.5, HW - 1, HH - 1);

  const padL = 26, padB = 18, padT = 20, padR = 10;
  const pw = HW - padL - padR;
  const ph = HH - padB - padT;

  hctx.strokeStyle = 'rgba(0,150,220,0.12)';
  hctx.beginPath();
  for (let i = 1; i <= 4; i++) {
    const y = padT + ph * i / 5;
    hctx.moveTo(padL, y); hctx.lineTo(padL + pw, y);
  }
  hctx.stroke();

  hctx.strokeStyle = 'rgba(0,190,255,0.40)';
  hctx.beginPath();
  hctx.moveTo(padL, padT);
  hctx.lineTo(padL, padT + ph);
  hctx.lineTo(padL + pw, padT + ph);
  hctx.stroke();

  const bw = pw / NB;
  for (let i = 0; i < NB; i++) {
    if (bins[i] <= 0) continue;
    const hh = Math.log10(bins[i] + 1) / Math.log10(binMax + 1) * ph;
    const g = hctx.createLinearGradient(0, padT + ph - hh, 0, padT + ph);
    g.addColorStop(0, 'rgba(130,255,225,0.95)');
    g.addColorStop(0.55, 'rgba(40,200,235,0.65)');
    g.addColorStop(1, 'rgba(0,90,150,0.25)');
    hctx.fillStyle = g;
    hctx.fillRect(padL + i * bw + 0.6, padT + ph - hh, bw - 1.2, hh);
  }

  hctx.fillStyle = 'rgba(130,225,255,0.85)';
  hctx.font = '9px ui-monospace,monospace';
  hctx.fillText('log N(s)', 3, 11);
  hctx.textAlign = 'right';
  hctx.fillText('log s', HW - 8, HH - 5);
  hctx.textAlign = 'left';
}

/* ══════════════════════════════════════════════
   时间线（p 自动增长）
   ══════════════════════════════════════════════ */
const T_START = 0.5;
const T_END = 19.0;
const P0 = 0.45;
const P1 = 0.645;

function autoP(t) {
  if (t < T_START) return P0;
  if (t > T_END) return P1;
  const u = (t - T_START) / (T_END - T_START);
  const e = u * u * (3 - 2 * u);
  return P0 + (P1 - P0) * e;
}

/* ══════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════ */
const slider = document.getElementById('slider');
const slabel = document.getElementById('slabel');
const pvalEl = document.getElementById('pval');
const pstateEl = document.getElementById('pstate');
const maxsEl = document.getElementById('maxs');
const ncEl = document.getElementById('nc');
const ratioEl = document.getElementById('ratio');
const btn = document.getElementById('btn');

let manual = false;
let critTime = -999;
let critDone = false;

function onSliderInput() {
  manual = true;
  const p = parseFloat(slider.value);
  slabel.textContent = p.toFixed(4);
  rebuild(p);
}

slider.addEventListener('input', onSliderInput);
slider.addEventListener('change', onSliderInput);

btn.addEventListener('click', () => {
  reseed();
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 240);
});

let hoverIdx = -1;
let mouseX = 0, mouseY = 0;

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  const x = e.clientX - gx;
  const y = e.clientY - gy;
  if (x < 0 || y < 0 || x >= gsize || y >= gsize) { hoverIdx = -1; return; }
  const cx = Math.min(N - 1, Math.floor(x / cs));
  const cy = Math.min(N - 1, Math.floor(y / cs));
  hoverIdx = cy * N + cx;
});
canvas.addEventListener('mouseleave', () => { hoverIdx = -1; });

/* ══════════════════════════════════════════════
   主循环
   ══════════════════════════════════════════════ */
let startTime = null;
let lastT = 0;
let frame = 0;
let curP = P0;

function loop(ts) {
  requestAnimationFrame(loop);

  const t = ts / 1000;
  if (startTime === null) { startTime = t; lastT = t; }
  const dt = Math.min(0.06, t - lastT);
  lastT = t;
  const et = t - startTime;
  frame++;

  /* ---- 更新 p ---- */
  if (!manual) {
    curP = autoP(et);
    slider.value = curP.toFixed(4);
    slabel.textContent = curP.toFixed(4);
    updateOcc(curP, et);
  } else {
    curP = parseFloat(slider.value);
  }

  /* ---- 临界点触发 ---- */
  if (!critDone && curP >= PC) {
    critDone = true;
    critTime = et;
  }

  /* ---- 分析 ---- */
  if (frame % 6 === 0) analyze();
  if (frame % 10 === 0) updateBins();

  /* ---- 渲染 ---- */
  render(t, et, dt);

  /* ---- HUD ---- */
  if (frame % 6 === 0) {
    pvalEl.textContent = curP.toFixed(4);
    if (percolates) {
      pstateEl.textContent = '◈ 已 贯 穿 ◈';
      pstateEl.classList.add('on');
    } else {
      pstateEl.textContent = curP < PC ? '— 未 贯 穿 —' : '— 集 团 生 长 —';
      pstateEl.classList.remove('on');
    }
    maxsEl.textContent = maxSize;
    ncEl.textContent = clusterCount;
    ratioEl.textContent = '占据率 ' + (curP * 100).toFixed(1) + '%';
    drawHist();
  }
}

/* ══════════════════════════════════════════════
   渲染
   ══════════════════════════════════════════════ */
function render(t, et, dt) {
  const cxp = gx + gsize / 2;
  const cyp = gy + gsize / 2;

  ctx.fillStyle = '#03060d';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#061423';
  ctx.fillRect(gx, gy, gsize, gsize);

  const g1 = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, gsize * 0.82);
  g1.addColorStop(0, 'rgba(0,180,255,0.065)');
  g1.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g1;
  ctx.fillRect(gx, gy, gsize, gsize);

  const gap = Math.max(0.8, cs * 0.16);
  const inner = Math.max(1, cs - gap);
  const hg = gap / 2;

  for (let i = 0; i < TOTAL; i++) {
    if (!occ[i]) continue;

    const r = find(i);
    const s = sz[r];
    const col = getColor(r, s);

    const x = i % N;
    const y = (i / N) | 0;
    const px = gx + x * cs + hg;
    const py = gy + y * cs + hg;

    ctx.fillStyle = col;
    ctx.fillRect(px, py, inner, inner);

    const age = et - birth[i];
    if (age >= 0 && age < 0.6) {
      const a = 1 - age / 0.6;
      ctx.globalAlpha = a * a * 0.95;
      ctx.fillStyle = '#eafffb';
      ctx.fillRect(px, py, inner, inner);
      ctx.globalAlpha = 1;
    }
  }

  if (maxSize > 100 && cs > 3) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#7dffe0';
    for (let i = 0; i < TOTAL; i++) {
      if (!occ[i]) continue;
      if (find(i) !== maxRoot) continue;
      const x = i % N, y = (i / N) | 0;
      const up    = y > 0     ? occ[i - N] : 0;
      const down  = y < N - 1 ? occ[i + N] : 0;
      const left  = x > 0     ? occ[i - 1] : 0;
      const right = x < N - 1 ? occ[i + 1] : 0;
      if (up && down && left && right) continue;
      ctx.fillRect(gx + x * cs - hg, gy + y * cs - hg, cs + gap, cs + gap);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.strokeStyle = 'rgba(0,190,255,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(gx + 0.5, gy + 0.5, gsize - 1, gsize - 1);

  if (critDone) {
    const dtc = et - critTime;
    if (dtc < 3.2) {
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 4; k++) {
        const rr = (dtc - k * 0.22) * gsize * 0.52;
        if (rr <= 0) continue;
        const a = Math.max(0, 1 - rr / (gsize * 0.78));
        if (a <= 0) continue;
        ctx.beginPath();
        ctx.arc(cxp, cyp, rr, 0, 6.28318);
        ctx.strokeStyle = `rgba(150,255,240,${(a * a * 0.85).toFixed(3)})`;
        ctx.lineWidth = 1.5 + 7 * a;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cxp, cyp, rr * 0.985, 0, 6.28318);
        ctx.strokeStyle = `rgba(255,255,255,${(a * a * 0.35).toFixed(3)})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    const fl = Math.max(0, 1 - (et - critTime) / 0.55);
    if (fl > 0) {
      ctx.fillStyle = `rgba(180,255,245,${(fl * fl * 0.28).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  if (percolates && path.length > 2) {
    const L = path.length;

    const pt = i => {
      const x = path[i] % N;
      const y = (path[i] / N) | 0;
      return [gx + x * cs + cs * 0.5, gy + y * cs + cs * 0.5];
    };

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    ctx.beginPath();
    let [sx0, sy0] = pt(0);
    ctx.moveTo(sx0, sy0);
    for (let i = 1; i < L; i++) { const [px, py] = pt(i); ctx.lineTo(px, py); }

    ctx.strokeStyle = 'rgba(0,255,210,0.13)';
    ctx.lineWidth = Math.max(5, cs * 1.4);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(120,255,235,0.42)';
    ctx.lineWidth = Math.max(2, cs * 0.5);
    ctx.stroke();

    const cycle = 2.8;
    const phase = ((et - critTime) % cycle + cycle) % cycle / cycle;
    const head = Math.min(1, phase * 1.45);
    const hi = Math.max(1, Math.floor(head * (L - 1)));

    ctx.beginPath();
    ctx.moveTo(sx0, sy0);
    for (let i = 1; i <= hi; i++) { const [px, py] = pt(i); ctx.lineTo(px, py); }
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.lineWidth = Math.max(1.2, cs * 0.30);
    ctx.stroke();

    const [hx, hy] = pt(hi);
    const hg2 = ctx.createRadialGradient(hx, hy, 0, hx, hy, Math.max(10, cs * 4));
    hg2.addColorStop(0, 'rgba(255,255,255,0.95)');
    hg2.addColorStop(0.25, 'rgba(160,255,240,0.55)');
    hg2.addColorStop(1, 'rgba(0,220,255,0)');
    ctx.fillStyle = hg2;
    ctx.beginPath();
    ctx.arc(hx, hy, Math.max(10, cs * 4), 0, 6.28318);
    ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
  }

  if (hoverIdx >= 0) {
    const hx = hoverIdx % N;
    const hy = (hoverIdx / N) | 0;
    const px = gx + hx * cs;
    const py = gy + hy * cs;

    ctx.strokeStyle = occ[hoverIdx] ? 'rgba(255,255,255,0.95)' : 'rgba(90,180,220,0.55)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 0.5, py + 0.5, cs - 1, cs - 1);

    if (occ[hoverIdx]) {
      const s = sz[find(hoverIdx)];
      const txt = '集团尺寸 ' + s;
      ctx.font = '11px ui-monospace,monospace';
      const tw = ctx.measureText(txt).width;
      let tx = mouseX + 14;
      let ty = mouseY - 12;
      if (tx + tw + 16 > W) tx = mouseX - tw - 22;
      if (ty < 20) ty = 20;

      ctx.fillStyle = 'rgba(3,16,28,0.9)';
      ctx.fillRect(tx - 6, ty - 13, tw + 14, 20);
      ctx.strokeStyle = 'rgba(0,220,255,0.55)';
      ctx.lineWidth = 1;
      ctx.strokeRect(tx - 6.5, ty - 13.5, tw + 15, 21);
      ctx.fillStyle = '#b9fff0';
      ctx.fillText(txt, tx, ty + 1);
    }
  }

  drawCorners();
}

function drawCorners() {
  ctx.strokeStyle = 'rgba(0,190,255,0.30)';
  ctx.lineWidth = 1;
  const L = 26, M = 14;
  const pts = [
    [M, M, 1, 1],
    [W - M, M, -1, 1],
    [M, H - M, 1, -1],
    [W - M, H - M, -1, -1]
  ];
  ctx.beginPath();
  for (const [x, y, sx, sy] of pts) {
    ctx.moveTo(x, y + sy * L);
    ctx.lineTo(x, y);
    ctx.lineTo(x + sx * L, y);
  }
  ctx.stroke();
}

/* ══════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════ */
resize();
sizeHist();
updateBins();
drawHist();

requestAnimationFrame(loop);

})();
</script>
