<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>孔隙度 · 体视显微镜三维孔隙率测定</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#02060c}
  body{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    color:#8fe8ff;-webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #c{position:fixed;inset:0;display:block;cursor:grab}
  #c:active{cursor:grabbing}

  .hud{
    position:fixed;pointer-events:none;
    font-size:11px;line-height:1.85;letter-spacing:.4px;

  #tl{left:26px;top:22px}
  #tl .title{
    font-size:15px;letter-spacing:3px;color:#b8fff4;

  #tr{right:26px;top:22px;text-align:right}
  #tr .big{
    font-size:32px;line-height:1.05;color:#d6fff8;
    text-shadow:0 0 18px rgba(0,255,220,.75),0 0 48px rgba(0,160,255,.5);
    letter-spacing:1px;
  }
  #tr .st{font-size:11px;letter-spacing:2px;margin-top:6px;color:#3d8fae}
  #tr .st.on{color:#ffd9a0;text-shadow:0 0 14px rgba(255,190,90,.8)}

  #bl{left:26px;bottom:26px}
  #bl .row{margin-bottom:2px}

  #br{right:26px;bottom:26px;text-align:right}
  #br .lg{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:3px}
  #br .bar{
    width:120px;height:7px;border-radius:4px;

  #ctrl{

  #ctrl .lab{color:#39a2c4}

  input[type=range]{
    -webkit-appearance:none;appearance:none;

  input[type=range]::-webkit-slider-thumb{

  /* 孔隙信息浮层 */

<body>
<canvas id="c"></canvas>

<!-- ── 左上：公式 ── -->
<div class="hud" id="tl">
  <div class="title">孔 隙 度 · 三 维 孔 隙 率 测 定</div>
  <div class="sub">POROSITY · STEREOMICROSCOPY</div>
  <div class="eq">φ = V<sub>pore</sub>/V<sub>bulk</sub> = 1 − ρ<sub>bulk</sub>/ρ<sub>grain</sub></div>
  <div class="eq">λ = (m<sub>wet</sub>−m<sub>dry</sub>)/m<sub>dry</sub> × 100%</div>
  <div class="eq">φ<sub>NMR</sub> = 磁共振强度比</div>
</div>

<!-- ── 右上：φ 值 ── -->
<div class="hud" id="tr">
  <div class="big" id="phiVal">—</div>
  <div class="st" id="phiState">体孔隙度 φ</div>
  <div style="margin-top:8px" class="dim">ρ<sub>dry</sub>=1.62 g/cm³</div>
  <div class="dim">ρ<sub>grain</sub>=2.65 g/cm³</div>
</div>

<!-- ── 左下：统计 ── -->
<div class="hud" id="bl">
  <div class="row dim" id="gridInfo">64 × 64 × 64 体素 · X射线层析</div>
  <div class="row">孔隙体素 <span class="hl" id="poreCnt">0</span></div>
  <div class="row">骨架体素 <span class="hl" id="skelCnt">0</span></div>
  <div class="row">切片进度 <span class="hl" id="scanPct">0%</span></div>
</div>

<!-- ── 右下：热力图例 ── -->
<div class="hud" id="br">
  <div class="dim">局部孔隙率热力图</div>
  <div class="lg">
    <span class="grn">低</span>
    <span class="bar"></span>
    <span class="red">高</span>
  </div>
</div>

<!-- ── 底部控制 ── -->
<div id="ctrl">
  <span class="lab">分辨率</span>
  <input type="range" id="slider" min="14" max="26" step="1" value="20">
  <span class="val" id="slabel">20³</span>
</div>

<!-- ── 孔隙信息 ── -->
<div id="info">
  <div class="ttl">孔 隙 腔 体 信 息</div>
  <div class="row">等效孔径 <b id="iD">—</b></div>
  <div class="row">连通度 <b id="iC">—</b></div>
  <div class="row">局部孔隙率 <b id="iP">—</b></div>
  <div class="row dim" id="iPos">—</div>
</div>

<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════════
   常量
   ══════════════════════════════════════════════════ */
let G = 20;              // 体素网格边长（滑块可调 14–26）
let G2 = G * G;
let V  = G * G * G;

const SPACING = 1.0;     // 网格间距（世界单位）

/* 时间线（秒） */
const T_FADEIN  = 0.8;
const T_SCAN0   = 1.6;
const T_SCAN1   = 15.5;
const T_LOOP    = 32.0;

/* ══════════════════════════════════════════════════
   体积数据
   ══════════════════════════════════════════════════ */
let isPore;        // Uint8Array  1=孔隙
let localPor;      // Float32Array 局部孔隙率 0..1
let voxCol;        // Array<string> 每体素颜色
let voxAlpha;      // Float32Array 每体素基础透明度
let poreList;      // Array<number> 孔隙体素索引（点击检测）
let phiActual = 0;
let poreCount = 0;

/* 投影缓存（点击检测用） */
let projX, projY, projVisible;

/* ══════════════════════════════════════════════════
   相机
   ══════════════════════════════════════════════════ */
let rotY = 0.62;
let rotX = -0.32;
let zoom = 1.0;
let autoYaw = 0;
let idleTimer = 0;
let userTouched = false;

let dragging = false;
let dragMoved = 0;
let lastMX = 0, lastMY = 0;

/* ══════════════════════════════════════════════════
   画布
   ══════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let CW = 0, CH = 0;

function resize() {
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  // 限制总像素量，保证帧率
  if (w * h * dpr * dpr > 2.4e6) dpr = Math.sqrt(2.4e6 / (w * h));
  dpr = Math.max(1, dpr);

  CW = w; CH = h;
  canvas.width  = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

/* ══════════════════════════════════════════════════
   生成多孔体
   ══════════════════════════════════════════════════ */
function boxBlur3(src, g, R) {
  const g2 = g * g, v = g * g * g;
  const a = new Float32Array(v);
  const b = new Float32Array(v);
  const c = new Float32Array(v);

  /* X 方向 */
  for (let z = 0; z < g; z++)
    for (let y = 0; y < g; y++) {
      const base = y * g + z * g2;
      for (let x = 0; x < g; x++) {
        let s = 0, n = 0;
        const lo = Math.max(0, x - R), hi = Math.min(g - 1, x + R);
        for (let xx = lo; xx <= hi; xx++) { s += src[xx + base]; n++; }
        a[x + base] = s / n;
      }
    }
  /* Y 方向 */
  for (let z = 0; z < g; z++)
    for (let y = 0; y < g; y++) {
      const base = y * g + z * g2;
      const lo = Math.max(0, y - R), hi = Math.min(g - 1, y + R);
      for (let x = 0; x < g; x++) {
        let s = 0, n = 0;
        for (let yy = lo; yy <= hi; yy++) { s += a[x + yy * g + z * g2]; n++; }
        b[x + base] = s / n;
      }
    }
  /* Z 方向 */
  for (let z = 0; z < g; z++) {
    const lo = Math.max(0, z - R), hi = Math.min(g - 1, z + R);
    for (let y = 0; y < g; y++) {
      const base = y * g + z * g2;
      for (let x = 0; x < g; x++) {
        let s = 0, n = 0;
        for (let zz = lo; zz <= hi; zz++) { s += b[x + y * g + zz * g2]; n++; }
        c[x + base] = s / n;
      }
    }
  }
  return c;
}

function regenerate(g) {
  G  = g;
  G2 = G * G;
  V  = G * G * G;

  /* ---- 1. 随机噪声 ---- */
  const f = new Float32Array(V);
  for (let i = 0; i < V; i++) f[i] = Math.random();

  /* ---- 2. 平滑（形成团簇状结构） ---- */
  const tmp = new Float32Array(V);
  for (let pass = 0; pass < 2; pass++) {
    for (let z = 0; z < G; z++) {
      for (let y = 0; y < G; y++) {
        const rowBase = y * G + z * G2;
        for (let x = 0; x < G; x++) {
          const i = x + rowBase;
          let s = f[i], n = 1;
          if (x > 0)     { s += f[i - 1];  n++; }
          if (x < G - 1) { s += f[i + 1];  n++; }
          if (y > 0)     { s += f[i - G];  n++; }
          if (y < G - 1) { s += f[i + G];  n++; }
          if (z > 0)     { s += f[i - G2]; n++; }
          if (z < G - 1) { s += f[i + G2]; n++; }
          tmp[i] = s / n;
        }
      }
    }
    f.set(tmp);
  }

  /* ---- 3. 按目标孔隙度取阈值 ---- */
  const phiTarget = 0.350 + Math.random() * 0.045;   // 35.0% ~ 39.5%
  const sorted = Float32Array.from(f).sort();
  const thr = sorted[Math.min(V - 1, Math.floor(V * phiTarget))];

  isPore = new Uint8Array(V);
  poreCount = 0;
  for (let i = 0; i < V; i++) {
    if (f[i] < thr) { isPore[i] = 1; poreCount++; }
  }
  phiActual = poreCount / V;

  /* ---- 4. 局部孔隙率（半径 3 的盒式模糊） ---- */
  const pf = new Float32Array(V);
  for (let i = 0; i < V; i++) pf[i] = isPore[i];
  localPor = boxBlur3(pf, G, 3);

  /* ---- 5. 上色 ---- */
  voxCol   = new Array(V);
  voxAlpha = new Float32Array(V);
  poreList = [];

  for (let z = 0; z < G; z++) {
    for (let y = 0; y < G; y++) {
      const rowBase = y * G + z * G2;
      for (let x = 0; x < G; x++) {
        const i = x + rowBase;

        if (isPore[i]) {
          poreList.push(i);
          /* 热力图：绿 → 黄 → 红 */
          let t = (localPor[i] - 0.24) / 0.34;
          if (t < 0) t = 0; else if (t > 1) t = 1;
          const hue = 120 * (1 - t);
          const sat = 100;
          const lig = 54 + 16 * t;
          voxCol[i] = `hsl(${hue.toFixed(0)},${sat}%,${lig.toFixed(0)}%)`;
          voxAlpha[i] = 0.115 + 0.215 * t;
        } else {
          /* 全息霓虹骨架 */
          const hue = 190 + ((x * 17 + y * 31 + z * 13) % 120);
          const sat = 88;
          const lig = 58;
          voxCol[i] = `hsl(${hue},${sat}%,${lig}%)`;
          voxAlpha[i] = 0.055;
        }
      }
    }
  }

  /* ---- 6. 投影缓存 ---- */
  projX = new Float32Array(V);
  projY = new Float32Array(V);
  projVisible = new Uint8Array(V);

  /* ---- HUD ---- */
  document.getElementById('phiVal').textContent = (phiActual * 100).toFixed(1) + '%';
  document.getElementById('gridInfo').textContent = `${G} × ${G} × ${G} 体素 · X射线层析`;
  document.getElementById('poreCnt').textContent = poreCount;
  document.getElementById('skelCnt').textContent = V - poreCount;
}

/* ══════════════════════════════════════════════════
   渲染
   ══════════════════════════════════════════════════ */
let scanZ = G + 2;

function renderVolume(et) {
  /* 背景 */
  ctx.fillStyle = '#02060c';
  ctx.fillRect(0, 0, CW, CH);

  /* 径向底光 */
  const bg = ctx.createRadialGradient(CW * .5, CH * .5, 0, CW * .5, CH * .5, Math.max(CW, CH) * .62);
  bg.addColorStop(0, 'rgba(0,80,160,0.14)');
  bg.addColorStop(0.5, 'rgba(0,40,90,0.06)');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, CW, CH);

  /* 相机参数 */
  const cy = Math.cos(rotY + autoYaw), sy = Math.sin(rotY + autoYaw);
  const cx = Math.cos(rotX), sx = Math.sin(rotX);

  const halfG   = G * 0.5;
  const camDist = G * 2.9;
  const fov     = G * 2.1;
  const K       = Math.min(CW, CH) * 0.72 * zoom / G;
  const cxp     = CW * 0.5;
  const cyp     = CH * 0.5;
  const dMin    = camDist - G * 0.90;
  const dRange  = G * 1.80;

  ctx.globalCompositeOperation = 'lighter';

  for (let z = 0; z < G; z++) {
    if (z > scanZ) continue;

    const wz = (z - halfG + 0.5);
    /* 扫描边缘辉光 */
    const edgeGlow = Math.max(0, 1 - (scanZ - z) * 0.45);
    const edgeBoost = 1 + edgeGlow * 2.6;

    for (let y = 0; y < G; y++) {
      const wy = (y - halfG + 0.5);
      const rowBase = y * G + z * G2;

      for (let x = 0; x < G; x++) {
        const i = x + rowBase;
        const wx = (x - halfG + 0.5);

        /* 绕 Y 轴 */
        const x1 = wx * cy + wz * sy;
        const z1 = -wx * sy + wz * cy;
        /* 绕 X 轴 */
        const y1 = wy * cx - z1 * sx;
        const z2 = wy * sx + z1 * cx;

        const d = camDist + z2;
        if (d < 0.4) continue;

        const persp = fov / d;
        const px = cxp + x1 * persp * K;
        const py = cyp - y1 * persp * K;
        const ps = persp * K * 0.86;

        /* 视口裁剪 */
        if (px + ps < -4 || px - ps > CW + 4 || py + ps < -4 || py - ps > CH + 4) {
          projVisible[i] = 0;
          continue;
        }

        projX[i] = px;
        projY[i] = py;
        projVisible[i] = 1;

        /* 深度衰减 */
        let dT = (d - dMin) / dRange;
        if (dT < 0) dT = 0; else if (dT > 1) dT = 1;
        const fade = 1 - 0.58 * dT;

        let al = voxAlpha[i] * fade * edgeBoost;
        if (al > 1) al = 1;

        ctx.globalAlpha = al;
        ctx.fillStyle = voxCol[i];
        ctx.fillRect(px - ps * 0.5, py - ps * 0.5, ps, ps);
      }
    }
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ══════════════════════════════════════════════════
   扫描平面高亮
   ══════════════════════════════════════════════════ */
function drawScanPlane(et) {
  if (et < T_SCAN0 || et > T_SCAN1 + 0.6) return;
  const p = (et - T_SCAN0) / (T_SCAN1 - T_SCAN0);
  if (p < 0 || p > 1) return;

  const fade = Math.min(1, Math.min(p * 8, (1 - p) * 8));
  if (fade <= 0) return;

  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, `rgba(140,255,235,${(0.055 * fade).toFixed(3)})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);
}

/* ══════════════════════════════════════════════════
   四角装饰
   ══════════════════════════════════════════════════ */
function drawCorners() {
  ctx.strokeStyle = 'rgba(0,190,255,0.30)';
  ctx.lineWidth = 1;
  const L = 26, M = 14;
  const pts = [
    [M, M, 1, 1],
    [CW - M, M, -1, 1],
    [M, CH - M, 1, -1],
    [CW - M, CH - M, -1, -1]
  ];
  ctx.beginPath();
  for (const [x, y, dx, dy] of pts) {
    ctx.moveTo(x, y + dy * L);
    ctx.lineTo(x, y);
    ctx.lineTo(x + dx * L, y);
  }
  ctx.stroke();
}

/* ══════════════════════════════════════════════════
   交互：拖拽旋转
   ══════════════════════════════════════════════════ */
function onDown(x, y) {
  dragging = true;
  dragMoved = 0;
  lastMX = x; lastMY = y;
  idleTimer = 0;
}
function onMove(x, y) {
  if (!dragging) return;
  const dx = x - lastMX;
  const dy = y - lastMY;
  lastMX = x; lastMY = y;
  dragMoved += Math.abs(dx) + Math.abs(dy);

  rotY += dx * 0.0085;
  rotX += dy * 0.0085;
  if (rotX >  1.45) rotX =  1.45;
  if (rotX < -1.45) rotX = -1.45;

  userTouched = true;
  idleTimer = 0;
}
function onUp() { dragging = false; }

canvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
window.addEventListener('mouseup', onUp);

/* 触摸 */
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) onDown(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    onMove(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }
}, { passive: false });
canvas.addEventListener('touchend', onUp);

/* 滚轮缩放 */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= Math.exp(-e.deltaY * 0.0011);
  if (zoom < 0.45) zoom = 0.45;
  if (zoom > 3.2) zoom = 3.2;
}, { passive: false });

/* ══════════════════════════════════════════════════
   交互：点击孔隙
   ══════════════════════════════════════════════════ */
const infoEl = document.getElementById('info');
const iD = document.getElementById('iD');
const iC = document.getElementById('iC');
const iP = document.getElementById('iP');
const iPos = document.getElementById('iPos');

canvas.addEventListener('click', e => {
  if (dragMoved > 6) return;      // 拖拽后不触发

  const mx = e.clientX, my = e.clientY;
  let best = -1, bestD2 = 46 * 46;

  for (let k = 0; k < poreList.length; k++) {
    const i = poreList[k];
    if (!projVisible[i]) continue;
    const dx = projX[i] - mx;
    const dy = projY[i] - my;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD2) { bestD2 = d2; best = i; }
  }

  if (best < 0) { infoEl.classList.remove('show'); return; }

  const bx = best % G;
  const by = ((best / G) | 0) % G;
  const bz = (best / G2) | 0;

  /* 局部孔隙计数（半径 4 球内） */
  let cnt = 0;
  const R = 4;
  for (let dz = -R; dz <= R; dz++) {
    const zz = bz + dz;
    if (zz < 0 || zz >= G) continue;
    for (let dy = -R; dy <= R; dy++) {
      const yy = by + dy;
      if (yy < 0 || yy >= G) continue;
      for (let dx = -R; dx <= R; dx++) {
        const xx = bx + dx;
        if (xx < 0 || xx >= G) continue;
        if (dx * dx + dy * dy + dz * dz > R * R) continue;
        if (isPore[xx + yy * G + zz * G2]) cnt++;
      }
    }
  }
  const eqR = Math.cbrt(cnt * 3 / (4 * Math.PI));

  /* 6 邻域连通度 */
  let nb = 0;
  if (bx > 0     && isPore[best - 1])  nb++;
  if (bx < G - 1 && isPore[best + 1])  nb++;
  if (by > 0     && isPore[best - G])  nb++;
  if (by < G - 1 && isPore[best + G])  nb++;
  if (bz > 0     && isPore[best - G2]) nb++;
  if (bz < G - 1 && isPore[best + G2]) nb++;

  iD.textContent = (eqR * 2).toFixed(1) + ' 格';
  iC.textContent = nb + ' / 6';
  iP.textContent = (localPor[best] * 100).toFixed(1) + '%';
  iPos.textContent = `坐标 (${bx}, ${by}, ${bz})`;

  let px = mx + 20, py = my - 16;
  if (px + 210 > CW) px = mx - 200;
  if (py < 20) py = 20;
  if (py + 140 > CH) py = CH - 150;

  infoEl.style.left = px + 'px';
  infoEl.style.top  = py + 'px';
  infoEl.classList.add('show');
});

/* ══════════════════════════════════════════════════
   分辨率滑块
   ══════════════════════════════════════════════════ */
const slider = document.getElementById('slider');
const slabel = document.getElementById('slabel');
let pendingG = -1;
let needReset = false;

slider.addEventListener('input', () => {
  pendingG = parseInt(slider.value, 10);
});

/* ══════════════════════════════════════════════════
   主循环
   ══════════════════════════════════════════════════ */
let t0 = performance.now();
let animT = 0;
let lastTs = 0;
let frame = 0;

function loop(ts) {
  requestAnimationFrame(loop);

  if (lastTs === 0) lastTs = ts;
  const dt = Math.min(0.06, (ts - lastTs) / 1000);
  lastTs = ts;

  animT = (ts - t0) / 1000;
  frame++;

  /* ---- 分辨率变更 ---- */
  if (pendingG > 0 && pendingG !== G) {
    regenerate(pendingG);
    slabel.textContent = pendingG + '³';
    pendingG = -1;
    t0 = ts;
    animT = 0;
    infoEl.classList.remove('show');
  }

  /* ---- 32 秒自动重生成 ---- */
  if (animT > T_LOOP) {
    regenerate(G);
    t0 = ts;
    animT = 0;
    infoEl.classList.remove('show');
  }

  /* ---- 扫描进度 ---- */
  if (animT < T_SCAN0) {
    scanZ = -1;
  } else if (animT < T_SCAN1) {
    const p = (animT - T_SCAN0) / (T_SCAN1 - T_SCAN0);
    scanZ = p * (G + 6) - 3;
  } else {
    scanZ = G + 2;
  }

  /* ---- 自动旋转（空闲 3 秒后恢复） ---- */
  if (dragging) {
    idleTimer = 0;
  } else {
    idleTimer += dt;
    if (idleTimer > 3.0) {
      autoYaw += dt * 0.22;
    }
  }

  /* ---- 渲染 ---- */
  renderVolume(animT);
  drawScanPlane(animT);
  drawCorners();

  /* ---- HUD 更新 ---- */
  if (frame % 8 === 0) {
    let pct = 0;
    if (animT >= T_SCAN1) pct = 100;
    else if (animT > T_SCAN0) pct = Math.round((animT - T_SCAN0) / (T_SCAN1 - T_SCAN0) * 100);
    document.getElementById('scanPct').textContent = pct + '%';

    const st = document.getElementById('phiState');
    if (animT >= T_SCAN1) {
      st.textContent = '◈ 三维重建完成 ◈';
      st.classList.add('on');
    } else if (animT >= T_SCAN0) {
      st.textContent = 'X射线层析扫描中…';
      st.classList.remove('on');
    } else {
      st.textContent = '体孔隙度 φ';
      st.classList.remove('on');
    }
  }
}

/* ══════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════ */
regenerate(G);
slabel.textContent = G + '³';
requestAnimationFrame(loop);

})();
</script>
