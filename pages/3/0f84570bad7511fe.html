<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euler弹性线 · 球极编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Euler弹性线 · 球极编织</h2>
        <div class="sub">Elastica · d²θ/ds² + P sinθ = 0 · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">P=3.0, κ₀∈[0.4,2.2]</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">P=5.5, κ₀∈[0.6,3.0]</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">P=1.6, κ₀∈[0.25,1.6]</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.4, 2.3, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.2;

        // 球极投影（平面→球面）
        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // Euler弹性线ODE: dθ/ds=κ, dκ/ds=-P*sinθ
        function elasticaODE(theta, kappa, P) {
            return { dTheta: kappa, dKappa: -P * Math.sin(theta) };
        }

        // RK4积分弹性线
        function integrateElastica(P, kappa0, theta0, sMax, steps) {
            const ds = sMax / steps;
            let theta = theta0;
            let kappa = kappa0;
            let x = 0, y = 0;
            const pts = [{ x, y }];

            for (let i = 0; i < steps; i++) {
                // RK4
                const k1 = elasticaODE(theta, kappa, P);
                const t2 = theta + k1.dTheta * ds * 0.5;
                const k2t = kappa + k1.dKappa * ds * 0.5;
                const k2 = elasticaODE(t2, k2t, P);
                const t3 = theta + k2.dTheta * ds * 0.5;
                const k3t = kappa + k2.dKappa * ds * 0.5;
                const k3 = elasticaODE(t3, k3t, P);
                const t4 = theta + k3.dTheta * ds;
                const k4t = kappa + k3.dKappa * ds;
                const k4 = elasticaODE(t4, k4t, P);

                const dTheta = (k1.dTheta + 2*k2.dTheta + 2*k3.dTheta + k4.dTheta) * ds / 6;
                const dKappa = (k1.dKappa + 2*k2.dKappa + 2*k3.dKappa + k4.dKappa) * ds / 6;

                theta += dTheta;
                kappa += dKappa;
                x += Math.cos(theta) * ds;
                y += Math.sin(theta) * ds;

                if (Math.abs(x) < 8 && Math.abs(y) < 8) {
                    pts.push({ x, y });
                }
            }
            return pts;
        }

        // 创建一族弹性线
        function createElasticaFamily(P, kappaValues, thetaValues, color, opacity, sMax, steps) {
            const group = new THREE.Group();
            for (const k0 of kappaValues) {
                for (const th0 of thetaValues) {
                    const rawPts = integrateElastica(P, k0, th0, sMax, steps);
                    if (rawPts.length < 2) continue;
                    const pts3D = rawPts.map(p => stereographic(p.x, p.y));
                    const valid = pts3D.filter(p => p && p.length() < 9.5);
                    if (valid.length < 2) continue;
                    const geom = new THREE.BufferGeometry().setFromPoints(valid);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 生成旋转后的弹性线族（在投影前旋转平面）
        function createRotatedElasticaFamily(P, kappaValues, thetaValues, rotAngle, color, opacity, sMax, steps) {
            const group = new THREE.Group();
            const cosR = Math.cos(rotAngle);
            const sinR = Math.sin(rotAngle);
            for (const k0 of kappaValues) {
                for (const th0 of thetaValues) {
                    const rawPts = integrateElastica(P, k0, th0, sMax, steps);
                    if (rawPts.length < 2) continue;
                    const pts3D = rawPts.map(p => {
                        const rx = p.x * cosR - p.y * sinR;
                        const ry = p.x * sinR + p.y * cosR;
                        return stereographic(rx, ry);
                    });
                    const valid = pts3D.filter(p => p && p.length() < 9.5);
                    if (valid.length < 2) continue;
                    const geom = new THREE.BufferGeometry().setFromPoints(valid);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'elastica-weave';
        scene.add(rootGroup);

        const sMax = 9.5;
        const steps = 520;
        const thetaBase = [0.0];

        // 金色族：P=3.0，κ₀小到大，振动模式为主
        const goldKappas = [];
        for (let i = 0; i < 18; i++) goldKappas.push(0.35 + i * 1.85 / 17);
        rootGroup.add(createElasticaFamily(3.0, goldKappas, thetaBase, COLOR_GOLD, 0.62, sMax, steps));
        // 旋转副本
        rootGroup.add(createRotatedElasticaFamily(3.0, goldKappas.slice(0,10), thetaBase, Math.PI/3, COLOR_GOLD, 0.42, sMax*0.8, Math.floor(steps*0.8)));
        rootGroup.add(createRotatedElasticaFamily(3.0, goldKappas.slice(0,10), thetaBase, -Math.PI/3, COLOR_GOLD, 0.42, sMax*0.8, Math.floor(steps*0.8)));

        // 青色族：P=5.5，较高频率
        const cyanKappas = [];
        for (let i = 0; i < 18; i++) cyanKappas.push(0.55 + i * 2.5 / 17);
        rootGroup.add(createElasticaFamily(5.5, cyanKappas, thetaBase, COLOR_CYAN, 0.62, sMax, steps));
        rootGroup.add(createRotatedElasticaFamily(5.5, cyanKappas.slice(0,10), thetaBase, 2*Math.PI/3, COLOR_CYAN, 0.42, sMax*0.8, Math.floor(steps*0.8)));
        rootGroup.add(createRotatedElasticaFamily(5.5, cyanKappas.slice(0,10), thetaBase, -2*Math.PI/3, COLOR_CYAN, 0.42, sMax*0.8, Math.floor(steps*0.8)));

        // 品红族：P=1.6，低频率，柔和波浪
        const magentaKappas = [];
        for (let i = 0; i < 16; i++) magentaKappas.push(0.22 + i * 1.4 / 15);
        rootGroup.add(createElasticaFamily(1.6, magentaKappas, thetaBase, COLOR_MAGENTA, 0.62, sMax, steps));
        rootGroup.add(createRotatedElasticaFamily(1.6, magentaKappas.slice(0,9), thetaBase, Math.PI/2, COLOR_MAGENTA, 0.42, sMax*0.8, Math.floor(steps*0.8)));
        rootGroup.add(createRotatedElasticaFamily(1.6, magentaKappas.slice(0,9), thetaBase, -Math.PI/2, COLOR_MAGENTA, 0.42, sMax*0.8, Math.floor(steps*0.8)));

        // 额外：接近分离线的弹性线（κ₀≈√(2P)），产生更复杂的形状
        const goldNearCrit = [2.35, 2.40, 2.42, 2.44, 2.46];
        rootGroup.add(createElasticaFamily(3.0, goldNearCrit, thetaBase, COLOR_GOLD, 0.48, sMax*0.7, Math.floor(steps*0.7)));
        const cyanNearCrit = [3.2, 3.25, 3.28, 3.30, 3.32];
        rootGroup.add(createElasticaFamily(5.5, cyanNearCrit, thetaBase, COLOR_CYAN, 0.48, sMax*0.7, Math.floor(steps*0.7)));
        const magentaNearCrit = [1.72, 1.75, 1.77, 1.78, 1.79];
        rootGroup.add(createElasticaFamily(1.6, magentaNearCrit, thetaBase, COLOR_MAGENTA, 0.48, sMax*0.7, Math.floor(steps*0.7)));

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const phi = j * 2 * Math.PI / 240;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const theta = 0.02 + j * Math.PI / 240;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        console.log('Euler弹性线编织总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.4 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Euler弹性线球极编织动画已稳定运行');
    </script>
</body>
</html>
