<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kleinian极限集编织 · Schottky群Möbius映射 · 球极投影</title>
    <style>
        :root {
            --bg: #04040e;
            --gold: #d6a745;
            --cyan: #3dbca5;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.4vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.42rem, 0.86vw, 0.58rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.25vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 14, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.55rem, 1.18vw, 0.8rem);
            color: #cdb886;
            letter-spacing: 0.05em;
            line-height: 1.6;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.35rem, 0.7vw, 0.5rem);
            color: #8a7a58;
            letter-spacing: 0.08em;
            margin-top: 0.2vh;
            opacity: 0.7;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3dbca5;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.2s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <h1>Kleinian极限集编织 · Schottky群Möbius映射 · 球极投影</h1>
        <div class="subtitle">四点Schottky群 · Möbius迭代圆网 · Riemann球面编织</div>
    </div>
    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">g₁(C₁→C₂)</span>
            ⊗ <span class="accent-cyan">g₂(C₃→C₄)</span>
            ⊗ <span class="accent-rose">γ∈⟨g₁,g₂⟩自由群轨道</span>
        </div>
        <div class="formula-detail">
            Schottky反射群 &nbsp;·&nbsp; Möbius变换圆填充 &nbsp;·&nbsp; 极限集边界球极投影
        </div>
    </div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.3, 1.4, 7.8);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3dbca5');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // ---------- 背景星点 ----------
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 110;
        const starPos = new Float32Array(starCount * 3);
        const starSz = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.4 + Math.random() * 8;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSz[i] = Math.random() * 1.3 + 0.16;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSz, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.015,
            transparent: true,
            opacity: 0.42,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 44, 28);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.05, depthWrite: false })
        );
        scene.add(refSphereWire);
        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.5, 10, 22);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.04, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- 复数与Möbius工具 ----------
        function cpx(r, i) { return { re: r, im: i }; }
        function cpxAdd(u, v) { return cpx(u.re + v.re, u.im + v.im); }
        function cpxSub(u, v) { return cpx(u.re - v.re, u.im - v.im); }
        function cpxMul(u, v) { return cpx(u.re * v.re - u.im * v.im, u.re * v.im + u.im * v.re); }
        function cpxDiv(u, v) { const d = v.re * v.re + v.im * v.im; return cpx((u.re * v.re + u.im * v.im) / d, (u.im * v.re - u.re * v.im) / d); }
        function cpxConj(u) { return cpx(u.re, -u.im); }
        function cpxAbs2(u) { return u.re * u.re + u.im * u.im; }
        function cpxSqrt(u) { const r = Math.sqrt(Math.sqrt(u.re * u.re + u.im * u.im)); const phi = Math.atan2(u.im, u.re) / 2; return cpx(r * Math.cos(phi), r * Math.sin(phi)); }

        function mobius(z, a, b, c, d) {
            const num = cpxAdd(cpxMul(a, z), b);
            const den = cpxAdd(cpxMul(c, z), d);
            return cpxDiv(num, den);
        }

        // Schottky群生成元参数 (随时间微调增加变化)
        function buildGenerators(t) {
            const b1 = 3.2 + 0.2 * Math.sin(t * 0.3);
            const b2 = 3.4 + 0.2 * Math.cos(t * 0.28);
            const g1 = {
                a: cpx(b1, 0),
                b: cpx(0.6 * Math.cos(t * 0.2), 0.4 * Math.sin(t * 0.22)),
                c: cpx(0.3 * Math.sin(t * 0.25), 0.2 * Math.cos(t * 0.3)),
                d: cpxDiv(cpx(1, 0), cpx(b1, 0)),
            };
            const g2 = {
                a: cpx(b2, 0),
                b: cpx(-0.5 * Math.sin(t * 0.23), 0.35 * Math.cos(t * 0.27)),
                c: cpx(0.25 * Math.cos(t * 0.34), -0.3 * Math.sin(t * 0.31)),
                d: cpxDiv(cpx(1, 0), cpx(b2, 0)),
            };
            return { g1, g2 };
        }

        // 初始四个圆 (圆心,半径)
        const SAMPLE_PER_CIRCLE = 100;
        const baseCircles = [
            { c: cpx(1.5, 0.5), r: 0.45 },
            { c: cpx(-1.5, -0.5), r: 0.45 },
            { c: cpx(0.5, 1.6), r: 0.42 },
            { c: cpx(-0.5, -1.6), r: 0.42 },
        ];

        function sampleCircle(center, radius, n) {
            const pts = [];
            for (let i = 0; i < n; i++) {
                const a = (i / n) * Math.PI * 2;
                pts.push(cpxAdd(center, cpx(radius * Math.cos(a), radius * Math.sin(a))));
            }
            return pts;
        }

        // 递归生成圆
        function generateCircles(t, maxDepth) {
            const { g1, g2 } = buildGenerators(t);
            const allCircles = [];
            // 初始四个圆
            for (const bc of baseCircles) {
                allCircles.push({ pts: sampleCircle(bc.c, bc.r, SAMPLE_PER_CIRCLE), depth: 0, colorId: 0 });
            }

            // 队列进行迭代
            const queue = [];
            for (let i = 0; i < baseCircles.length; i++) {
                queue.push({ pts: allCircles[i].pts, depth: 0, colorId: i % 3 });
            }

            while (queue.length > 0 && allCircles.length < 400) {
                const current = queue.shift();
                if (current.depth >= maxDepth) continue;
                // 对每个圆应用g1和g2变换
                const gens = [g1, g2];
                for (let gi = 0; gi < 2; gi++) {
                    const g = gens[gi];
                    const newPts = current.pts.map(z => mobius(z, g.a, g.b, g.c, g.d));
                    const newColorId = (current.colorId + gi + 1) % 3;
                    const newCircle = { pts: newPts, depth: current.depth + 1, colorId: newColorId };
                    allCircles.push(newCircle);
                    if (current.depth + 1 < maxDepth) {
                        queue.push(newCircle);
                    }
                }
            }
            return allCircles;
        }

        // ---------- 球极逆投影与钳制 ----------
        function invStereo(x, y) {
            const r2 = x * x + y * y;
            const denom = 1 + r2 / (2.5 * 2.5);
            const inv = 1 / Math.max(denom, 1e-12);
            return [(2 * x) * inv, (2 * y) * inv, ((1 - r2 / (2.5 * 2.5)) * 2.5) * inv];
        }

        function clampPt(p) {
            let [x, y, z] = p;
            if (!Number.isFinite(x)) x = 0;
            if (!Number.isFinite(y)) y = 0;
            if (!Number.isFinite(z)) z = 0;
            const r = Math.sqrt(x * x + y * y + z * z);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const s = CLAMP_RADIUS / r;
                return [x * s, y * s, z * s];
            }
            return [x, y, z];
        }

        function so3Matrix(t) {
            const angle = t * 0.24;
            const ax = Math.cos(t * 0.16) * 0.5;
            const ay = Math.sin(t * 0.12) * 0.45;
            const az = Math.cos(t * 0.18 + 1.15) * 0.48;
            const n = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
            const ux = ax / n,
                uy = ay / n,
                uz = az / n;
            const c = Math.cos(angle),
                s = Math.sin(angle),
                t1 = 1 - c;
            return [
                c + ux * ux * t1,
                ux * uy * t1 - uz * s,
                ux * uz * t1 + uy * s,
                uy * ux * t1 + uz * s,
                c + uy * uy * t1,
                uy * uz * t1 - ux * s,
                uz * ux * t1 - uy * s,
                uz * uy * t1 + ux * s,
                c + uz * uz * t1,
            ];
        }

        function applyRot(pt, R) {
            return [
                R[0] * pt[0] + R[1] * pt[1] + R[2] * pt[2],
                R[3] * pt[0] + R[4] * pt[1] + R[5] * pt[2],
                R[6] * pt[0] + R[7] * pt[1] + R[8] * pt[2],
            ];
        }

        // ---------- 预分配绘制（三色图层）----------
        const MAX_CIRCLE_SEGMENTS = 50000;
        function createLayer(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(MAX_CIRCLE_SEGMENTS * 2 * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.8,
                depthTest: true,
                depthWrite: true,
            });
            const lines = new THREE.LineSegments(geom, mat);
            scene.add(lines);
            return { geom, positions, lines, count: 0 };
        }
        const goldLayer = createLayer(colorGold);
        const cyanLayer = createLayer(colorCyan);
        const roseLayer = createLayer(colorRose);

        function clearLayer(layer) {
            for (let i = 0; i < MAX_CIRCLE_SEGMENTS * 2 * 3; i++) layer.positions[i] = 0;
        }

        function writeArcToLayer(layer, arcPts3D, startSegIdx) {
            const positions = layer.positions;
            const base = startSegIdx * 6;
            for (let i = 0; i < arcPts3D.length - 1; i++) {
                const p1 = arcPts3D[i];
                const p2 = arcPts3D[i + 1];
                const off = base + i * 6;
                positions[off] = p1[0];
                positions[off + 1] = p1[1];
                positions[off + 2] = p1[2];
                positions[off + 3] = p2[0];
                positions[off + 4] = p2[1];
                positions[off + 5] = p2[2];
            }
        }

        function updateAll(elapsed) {
            const circles = generateCircles(elapsed, 3);
            const R3 = so3Matrix(elapsed);

            clearLayer(goldLayer);
            clearLayer(cyanLayer);
            clearLayer(roseLayer);
            let goldSeg = 0,
                cyanSeg = 0,
                roseSeg = 0;

            for (const circ of circles) {
                const arc3D = circ.pts.map(z => {
                    let p = invStereo(z.re, z.im);
                    p = applyRot(p, R3);
                    return clampPt(p);
                });
                const segCount = arc3D.length - 1;
                if (circ.colorId === 0 && goldSeg + segCount < MAX_CIRCLE_SEGMENTS) {
                    writeArcToLayer(goldLayer, arc3D, goldSeg);
                    goldSeg += segCount;
                } else if (circ.colorId === 1 && cyanSeg + segCount < MAX_CIRCLE_SEGMENTS) {
                    writeArcToLayer(cyanLayer, arc3D, cyanSeg);
                    cyanSeg += segCount;
                } else if (circ.colorId === 2 && roseSeg + segCount < MAX_CIRCLE_SEGMENTS) {
                    writeArcToLayer(roseLayer, arc3D, roseSeg);
                    roseSeg += segCount;
                }
            }
            goldLayer.geom.setDrawRange(0, goldSeg * 2);
            goldLayer.geom.attributes.position.needsUpdate = true;
            cyanLayer.geom.setDrawRange(0, cyanSeg * 2);
            cyanLayer.geom.attributes.position.needsUpdate = true;
            roseLayer.geom.setDrawRange(0, roseSeg * 2);
            roseLayer.geom.attributes.position.needsUpdate = true;
        }

        // ---------- 流动粒子 ----------
        const particleCount = 24;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                progress: Math.random(),
                speed: 0.0006 + Math.random() * 0.0022,
                phase: Math.random() * Math.PI * 2,
            });
            const col = i < 8 ? colorGold : i < 16 ? colorCyan : colorRose;
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.042,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles(elapsed) {
            const { g1 } = buildGenerators(elapsed);
            const R3 = so3Matrix(elapsed);
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const angle = pd.progress * Math.PI * 2;
                const z0 = cpx(1.2 * Math.cos(angle + pd.phase), 0.9 * Math.sin(angle + pd.phase));
                const z = mobius(z0, g1.a, g1.b, g1.c, g1.d);
                let pt = invStereo(z.re, z.im);
                pt = applyRot(pt, R3);
                pt = clampPt(pt);
                particlePosArr[p * 3] = pt[0];
                particlePosArr[p * 3 + 1] = pt[1];
                particlePosArr[p * 3 + 2] = pt[2];
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // ---------- 绝对时间动画循环 ----------
        const startTime = performance.now();
        let frameCount = 0,
            lastLogTime = startTime;

        function animate(nowTS) {
            requestAnimationFrame(animate);
            try {
                const now = nowTS || performance.now();
                const elapsed = (now - startTime) / 1000;
                frameCount++;
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${elapsed.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }
                updateAll(elapsed);
                updateParticles(elapsed);

                const breathe = 1 + 0.04 * Math.sin(elapsed * 0.33);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += 0.0007;
                refSphereWire.rotation.y += 0.0006;
                refTorusWire.rotation.z += 0.0007;
                refTorusWire.scale.setScalar(1 + 0.05 * Math.sin(elapsed * 0.39));

                const camH = elapsed * 0.07;
                const camV = 0.32 + 0.18 * Math.sin(elapsed * 0.14);
                const camD = 7.5 + 0.6 * Math.sin(elapsed * 0.17);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0, 0, 0);
                stars.rotation.y += 0.00016;
                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环错误（已恢复）:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });

        // 启动
        console.log('🚀 Kleinian极限集编织动画初始化...');
        updateAll(0);
        updateParticles(0);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动（Schottky群Möbius圆网，永不停止）');
    </script>
</body>
</html>
