<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生命游戏 · Conway's Game of Life</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#05060d;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;cursor:crosshair;}

  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 50%,
      transparent 32%,
      rgba(5,6,13,.28) 62%,
      rgba(2,2,6,.82) 100%);
  }

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  /* ---------- 标题 ---------- */
  #title{
    position:absolute;top:0;left:0;
    padding:34px 44px;
    opacity:0;animation:fade 2.0s .4s ease forwards;
  }
  #title h1{
    font-size:clamp(17px,2.2vw,28px);
    font-weight:200;
    letter-spacing:.44em;text-indent:.44em;
    background:linear-gradient(96deg,#5ee8ff 0%,#8ea8ff 34%,#c490ff 64%,#ff9ad4 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:12px;
    filter:drop-shadow(0 0 26px rgba(120,180,255,.42));
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(150,200,255,.30);
  }

  /* ---------- 规则说明 ---------- */
  #rules{
    position:absolute;top:0;left:50%;
    transform:translateX(-50%);
    padding:34px 20px;
    text-align:center;
    opacity:0;animation:fade 2.0s 1.1s ease forwards;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:clamp(8.5px,0.95vw,10.5px);
    letter-spacing:.16em;line-height:2.0;
    color:rgba(150,190,240,.26);
  }
  #rules .t{
    font-size:8px;letter-spacing:.44em;text-indent:.44em;
    color:rgba(120,165,225,.20);
    display:block;margin-bottom:8px;
  }
  #rules .b{color:rgba(95,230,255,.60);}
  #rules .d{color:rgba(255,150,190,.60);}

  /* ---------- 右上统计 ---------- */
  #stats{
    position:absolute;top:0;right:0;
    padding:34px 44px;
    text-align:right;
    opacity:0;animation:fade 2.0s 1.0s ease forwards;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.20em;line-height:2.0;
    color:rgba(180,160,235,.24);
  }
  #stats .lab{
    display:block;font-size:8px;
    letter-spacing:.44em;text-indent:.44em;
    color:rgba(150,130,220,.20);
    margin-bottom:10px;
  }
  #stats .row{display:flex;justify-content:flex-end;gap:14px;}
  #stats .k{color:rgba(140,180,235,.34);}
  #stats .v{
    color:rgba(200,225,255,.62);
    min-width:64px;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  #stats .g{color:rgba(255,205,150,.62);}

  /* ---------- 底部控制栏 ---------- */
  #controls{
    position:absolute;bottom:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    gap:18px;flex-wrap:wrap;
    padding:0 44px 30px;
    pointer-events:auto;
    opacity:0;animation:fade 2.0s 1.4s ease forwards;
  }

  .btn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.24em;text-indent:.24em;
    color:rgba(190,220,255,.62);
    background:rgba(20,30,60,.30);
    border:1px solid rgba(120,180,255,.22);
    border-radius:999px;
    padding:10px 20px;
    cursor:pointer;
    transition:.35s cubic-bezier(.4,0,.2,1);
    white-space:nowrap;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .btn:hover{
    border-color:rgba(180,225,255,.72);
    background:rgba(60,100,180,.18);
    color:rgba(225,240,255,.92);
    box-shadow:0 0 22px rgba(120,180,255,.24);
  }
  .btn:active{transform:scale(.97);}

  .btn.primary{
    color:rgba(200,255,240,.72);
    border-color:rgba(100,255,210,.24);
    background:rgba(16,50,44,.30);
  }
  .btn.primary:hover{
    border-color:rgba(150,255,225,.80);
    box-shadow:0 0 24px rgba(100,255,210,.28);
  }

  .btnGroup{display:flex;gap:10px;flex-wrap:wrap;}

  /* ---------- 速度滑块 ---------- */
  #speedWrap{
    display:flex;align-items:center;gap:12px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.22em;
    color:rgba(150,190,240,.32);
  }
  #speedWrap .val{
    color:rgba(200,225,255,.60);
    min-width:44px;text-align:right;
    font-variant-numeric:tabular-nums;
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:110px;height:2px;
    background:rgba(120,180,255,.16);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:12px;height:12px;border-radius:50%;
    background:linear-gradient(135deg,#7ee8ff,#c490ff);
    box-shadow:0 0 12px rgba(140,200,255,.62);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border:none;border-radius:50%;
    background:linear-gradient(135deg,#7ee8ff,#c490ff);
    box-shadow:0 0 12px rgba(140,200,255,.62);
    cursor:pointer;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:820px){
    #rules{display:none;}
    #stats{padding:20px 20px;font-size:8px;}
    #title{padding:20px 20px;}
    #controls{padding:0 20px 18px;gap:10px;}
    .btn{padding:8px 14px;font-size:8.5px;letter-spacing:.16em;}
    #speedWrap{width:100%;justify-content:flex-end;}
    input[type=range]{width:80px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="ui">
  <div id="title">
    <h1>生命游戏</h1>
    <div class="en">CONWAY'S GAME OF LIFE</div>
  </div>

  <div id="rules">
    <span class="t">4 SIMPLE RULES</span>
    <span class="b">存活</span> · 邻居 2 或 3 → 继续存活<br>
    <span class="d">死亡</span> · 邻居 &lt;2 或 &gt;3 → 消亡<br>
    <span class="b">诞生</span> · 空格 + 邻居 = 3 → 新生
  </div>

  <div id="stats">
    <span class="lab">LIVE STATE</span>
    <div class="row"><span class="k">代数</span><span class="v" id="stGen">0</span></div>
    <div class="row"><span class="k">存活</span><span class="v" id="stPop">0</span></div>
    <div class="row"><span class="k">出生</span><span class="v" id="stBorn">0</span></div>
    <div class="row"><span class="k">死亡</span><span class="v" id="stDied">0</span></div>
    <div class="row" style="margin-top:6px;">
      <span class="k">密度</span><span class="g" id="stDen">0%</span>
    </div>
  </div>

  <div id="controls">
    <div class="btnGroup">
      <button class="btn primary" id="btnPlay">暂停</button>
      <button class="btn" id="btnStep">单步</button>
      <button class="btn" id="btnRandom">随机</button>
      <button class="btn" id="btnGun">滑翔机枪</button>
      <button class="btn" id="btnPulsar">脉冲星</button>
      <button class="btn" id="btnClear">清空</button>
    </div>

    <div id="speedWrap">
      <span>速度</span>
      <input type="range" id="speed" min="1" max="60" value="8" step="1">
      <span class="val" id="speedVal">8 /s</span>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 基础
   ========================================================= */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha:false });

/* 辉光层 —— 以网格分辨率渲染，放大时自然模糊 */
const glowCanvas = document.createElement('canvas');
const glowCtx    = glowCanvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

/* 网格 */
let cols = 0, rows = 0;
let cellSize = 8;
let offsetX = 0, offsetY = 0;

/* 三个网格：当前状态 / 下一代 / 年龄 */
let grid, nextGrid, ageGrid;

/* 统计 */
let generation = 0;
let population = 0;
let bornLast   = 0;
let diedLast   = 0;

/* 运行状态 */
let running      = true;
let stepInterval = 125;      // 毫秒 / 代
let acc          = 0;
let lastTime     = 0;

/* 缓存背景渐变 */
let bgGrad = null;

/* 最大年龄（颜色映射上限） */
const MAX_AGE = 40;

/* =========================================================
   1. 尺寸与网格重建
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* ---- 网格尺寸 ---- */
  const minDim = Math.min(W, H);
  cellSize = Math.max(4, Math.round(minDim / 145));

  cols = Math.floor(W / cellSize);
  rows = Math.floor(H / cellSize);

  /* 居中偏移，让网格在屏幕上对称 */
  offsetX = Math.round((W - cols * cellSize) / 2);
  offsetY = Math.round((H - rows * cellSize) / 2);

  /* ---- 分配数组 ---- */
  const n = cols * rows;
  grid     = new Uint8Array(n);
  nextGrid = new Uint8Array(n);
  ageGrid  = new Uint8Array(n);

  /* ---- 辉光画布 ---- */
  glowCanvas.width  = cols;
  glowCanvas.height = rows;

  /* ---- 背景渐变 ---- */
  bgGrad = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.72
  );
  bgGrad.addColorStop(0.00, 'rgba(24, 34, 74, 0.42)');
  bgGrad.addColorStop(0.42, 'rgba(14, 20, 46, 0.18)');
  bgGrad.addColorStop(0.78, 'rgba(6, 8, 22, 0.04)');
  bgGrad.addColorStop(1.00, 'rgba(5, 6, 13, 0)');

  /* 首次初始化时给一个随机种子 */
  if (generation === 0 && population === 0){
    randomFill(0.22);
  }
}
window.addEventListener('resize', resize);

/* =========================================================
   2. 初始化与图案
   ========================================================= */
function clearAll(){
  grid.fill(0);
  nextGrid.fill(0);
  ageGrid.fill(0);
  generation = 0;
  population = 0;
  bornLast = 0;
  diedLast = 0;
  updateStats();
}

function randomFill(density){
  density = density || 0.22;
  for (let i = 0; i < grid.length; i++){
    const alive = Math.random() < density ? 1 : 0;
    grid[i] = alive;
    ageGrid[i] = alive;
  }
  nextGrid.fill(0);
  generation = 0;
  countPopulation();
  updateStats();
}

/* ---------- 图案戳印 ---------- */
function stamp(pattern){
  const lines = pattern
    .replace(/^\n/, '')
    .replace(/\n$/, '')
    .split('\n');

  const h = lines.length;
  const w = Math.max.apply(null, lines.map(l => l.length));

  const ox = Math.floor((cols - w) / 2);
  const oy = Math.floor((rows - h) / 2);

  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const ch = lines[y][x] || '.';
      if (ch === 'O' || ch === 'o' || ch === '#' || ch === '1'){
        const gx = ((ox + x) % cols + cols) % cols;
        const gy = ((oy + y) % rows + rows) % rows;
        const i = gy * cols + gx;
        grid[i] = 1;
        ageGrid[i] = 1;
      }
    }
  }
  nextGrid.fill(0);
  generation = 0;
  countPopulation();
  updateStats();
}

/* 高斯帕滑翔机枪（36 × 9） */
const GUN_PATTERN = [
  '........................O...........',
  '......................O.O...........',
  '............OO......OO............OO',
  '...........O...O....OO............OO',
  'OO........O.....O...OO..............',
  'OO........O...O.OO....O.O...........',
  '..........O.....O.......O...........',
  '...........O...O....................',
  '............OO......................'
].join('\n');

/* 脉冲星（13 × 13，周期 3） */
const PULSAR_PATTERN = [
  '..OOO...OOO..',
  '.............',
  '.O..O...O..O.',
  '.O..O...O..O.',
  '.O..O...O..O.',
  '.............',
  '..OOO...OOO..',
  '.............',
  '..OOO...OOO..',
  '.............',
  '.O..O...O..O.',
  '.O..O...O..O.',
  '.O..O...O..O.'
].join('\n');

/* =========================================================
   3. 核心 —— 生命游戏演化
   ========================================================= */
function step(){
  let pop = 0, born = 0, died = 0;

  for (let y = 0; y < rows; y++){
    const yUp = (y - 1 + rows) % rows;
    const yDn = (y + 1) % rows;

    const rowU = yUp * cols;
    const rowC = y   * cols;
    const rowD = yDn * cols;

    for (let x = 0; x < cols; x++){
      const xL = (x - 1 + cols) % cols;
      const xR = (x + 1) % cols;

      /* 8 邻域存活数 */
      const n =
        grid[rowU + xL] + grid[rowU + x] + grid[rowU + xR] +
        grid[rowC + xL]                  + grid[rowC + xR] +
        grid[rowD + xL] + grid[rowD + x] + grid[rowD + xR];

      const i = rowC + x;
      const alive = grid[i];
      let nv;

      if (alive){
        if (n === 2 || n === 3){
          nv = 1;
          if (ageGrid[i] < 255) ageGrid[i]++;
        } else {
          nv = 0;
          died++;
          ageGrid[i] = 0;
        }
      } else {
        if (n === 3){
          nv = 1;
          born++;
          ageGrid[i] = 1;
        } else {
          nv = 0;
          ageGrid[i] = 0;
        }
      }

      nextGrid[i] = nv;
      pop += nv;
    }
  }

  /* 交换缓冲 */
  const tmp = grid;
  grid     = nextGrid;
  nextGrid = tmp;

  generation++;
  population = pop;
  bornLast   = born;
  diedLast   = died;
}

function countPopulation(){
  let p = 0;
  for (let i = 0; i < grid.length; i++) p += grid[i];
  population = p;
}

/* =========================================================
   4. 渲染
   ========================================================= */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  /* ---------- 背景 ---------- */
  ctx.fillStyle = '#05060d';
  ctx.fillRect(0, 0, W, H);

  if (bgGrad){
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
  }

  /* ---------- 清空辉光层 ---------- */
  glowCtx.clearRect(0, 0, cols, rows);

  /* ---------- 绘制细胞 ---------- */
  const gap = cellSize >= 8 ? 1 : 0;
  const sz  = cellSize - gap * 2;

  for (let y = 0; y < rows; y++){
    const py = offsetY + y * cellSize + gap;

    for (let x = 0; x < cols; x++){
      const i = y * cols + x;
      if (!grid[i]) continue;

      /* 年龄 → 颜色：青 → 蓝 → 紫 → 品红 */
      const age = ageGrid[i];
      const t   = (age > MAX_AGE ? MAX_AGE : age) / MAX_AGE;

      const hue = 185 + t * 135;      // 185 → 320
      const sat = 95  - t * 12;
      const lit = 72  - t * 18;

      const col = 'hsl(' + (hue | 0) + ',' + (sat | 0) + '%,' + (lit | 0) + '%)';

      ctx.fillStyle = col;
      ctx.fillRect(offsetX + x * cellSize + gap, py, sz, sz);

      /* 同步写入辉光层（1 像素对应 1 细胞） */
      glowCtx.fillStyle = col;
      glowCtx.fillRect(x, y, 1, 1);
    }
  }

  /* ---------- 辉光放大叠加 ---------- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.62;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  ctx.drawImage(
    glowCanvas,
    0, 0, cols, rows,
    offsetX, offsetY, cols * cellSize, rows * cellSize
  );

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   5. 主循环
   ========================================================= */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastTime){ lastTime = now; return; }

  let dt = now - lastTime;
  lastTime = now;
  if (dt > 100) dt = 100;
  if (dt < 0)   dt = 0;

  if (running){
    acc += dt;

    let steps = 0;
    while (acc >= stepInterval && steps < 4){
      step();
      acc -= stepInterval;
      steps++;
    }
    if (steps === 4) acc = 0;

    if (steps > 0) updateStats();
  }

  render();
}

/* =========================================================
   6. HUD 更新
   ========================================================= */
const stGen  = document.getElementById('stGen');
const stPop  = document.getElementById('stPop');
const stBorn = document.getElementById('stBorn');
const stDied = document.getElementById('stDied');
const stDen  = document.getElementById('stDen');

let lastStatsStr = '';

function updateStats(){
  const total = cols * rows;
  const den   = total > 0 ? (population / total * 100) : 0;

  stGen.textContent  = generation.toLocaleString();
  stPop.textContent  = population.toLocaleString();
  stBorn.textContent = bornLast.toLocaleString();
  stDied.textContent = diedLast.toLocaleString();
  stDen.textContent  = den.toFixed(1) + '%';
}

/* =========================================================
   7. 交互 —— 绘制细胞
   ========================================================= */
let drawing = false;

function paintAt(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  const gx = Math.floor((x - offsetX) / cellSize);
  const gy = Math.floor((y - offsetY) / cellSize);

  if (gx < 0 || gx >= cols || gy < 0 || gy >= rows) return;

  const i = gy * cols + gx;
  grid[i] = 1;
  ageGrid[i] = 1;
  countPopulation();
  updateStats();
}

canvas.addEventListener('pointerdown', (e) => {
  drawing = true;
  paintAt(e.clientX, e.clientY);
});

canvas.addEventListener('pointermove', (e) => {
  if (drawing) paintAt(e.clientX, e.clientY);
});

window.addEventListener('pointerup', () => { drawing = false; });
canvas.addEventListener('pointerleave', () => { drawing = false; });

/* =========================================================
   8. 控件
   ========================================================= */
const btnPlay   = document.getElementById('btnPlay');
const btnStep   = document.getElementById('btnStep');
const btnRandom = document.getElementById('btnRandom');
const btnGun    = document.getElementById('btnGun');
const btnPulsar = document.getElementById('btnPulsar');
const btnClear  = document.getElementById('btnClear');
const speedEl   = document.getElementById('speed');
const speedVal  = document.getElementById('speedVal');

btnPlay.addEventListener('click', () => {
  running = !running;
  btnPlay.textContent = running ? '暂停' : '播放';
  acc = 0;
  lastTime = 0;
});

btnStep.addEventListener('click', () => {
  running = false;
  btnPlay.textContent = '播放';
  step();
  updateStats();
});

btnRandom.addEventListener('click', () => {
  clearAll();
  randomFill(0.22);
});

btnGun.addEventListener('click', () => {
  clearAll();
  stamp(GUN_PATTERN);
});

btnPulsar.addEventListener('click', () => {
  clearAll();
  stamp(PULSAR_PATTERN);
});

btnClear.addEventListener('click', () => {
  clearAll();
});

speedEl.addEventListener('input', () => {
  const v = parseInt(speedEl.value, 10);
  stepInterval = 1000 / v;
  speedVal.textContent = v + ' /s';
});

/* ---------- 键盘快捷键 ---------- */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){
    e.preventDefault();
    btnPlay.click();
  } else if (e.code === 'KeyR'){
    btnRandom.click();
  } else if (e.code === 'KeyC'){
    btnClear.click();
  } else if (e.code === 'KeyS'){
    btnStep.click();
  }
});

/* =========================================================
   9. 启动
   ========================================================= */
resize();
countPopulation();
updateStats();

/* 让初始状态好看一点：撒几个滑翔机 + 随机 */
(function seedInitial(){
  /* 随机底噪 */
  randomFill(0.18);

  /* 撒 3 个滑翔机 */
  const glider = [
    '.O.',
    '..O',
    'OOO'
  ].join('\n');

  function stampAt(pattern, cx, cy){
    const lines = pattern.split('\n');
    const h = lines.length;
    const w = lines[0].length;
    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        if (lines[y][x] === 'O' || lines[y][x] === '#'){
          const gx = ((cx + x) % cols + cols) % cols;
          const gy = ((cy + y) % rows + rows) % rows;
          const i = gy * cols + gx;
          grid[i] = 1;
          ageGrid[i] = 1;
        }
      }
    }
  }

  stampAt(glider, Math.floor(cols * 0.22), Math.floor(rows * 0.30));
  stampAt(glider, Math.floor(cols * 0.70), Math.floor(rows * 0.60));
  stampAt(glider, Math.floor(cols * 0.45), Math.floor(rows * 0.75));

  countPopulation();
  updateStats();
})();

speedIntervalInit();
function speedIntervalInit(){
  const v = parseInt(speedEl.value, 10);
  stepInterval = 1000 / v;
  speedVal.textContent = v + ' /s';
}

lastTime = 0;
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
