<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>洛伦兹力 · 带电粒子回旋半径轨迹</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03050c}
  body{
    font-family:"SF Mono","Consolas","Menlo","Courier New",monospace;
    color:#9fe8ff;
    -webkit-font-smoothing:antialiased;
  }
  #c{position:fixed;inset:0;display:block;z-index:0}

  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(0,0,0,.72) 100%);
  }

  /* 顶部人生启迪 */
  .quote{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    z-index:3;pointer-events:none;
    font-size:17px;letter-spacing:3px;white-space:nowrap;
    color:#d9f6ff;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    text-shadow:
      0 0 10px rgba(90,225,255,.95),
      0 0 26px rgba(70,150,255,.75),
      0 0 50px rgba(120,80,255,.45);
    animation:qglow 4s ease-in-out infinite;
  }
  @keyframes qglow{
    0%,100%{opacity:.82;text-shadow:0 0 10px rgba(90,225,255,.9),0 0 26px rgba(70,150,255,.7),0 0 50px rgba(120,80,255,.4)}
    50%{opacity:1;text-shadow:0 0 16px rgba(140,245,255,1),0 0 36px rgba(90,180,255,.9),0 0 66px rgba(160,110,255,.6)}
  }

  /* 边缘公式面板 */
  .panel{
    position:fixed;top:50%;transform:translateY(-50%);
    z-index:3;pointer-events:none;
    font-size:12px;line-height:2.05;letter-spacing:.6px;
    color:rgba(120,222,255,.55);
    text-shadow:0 0 9px rgba(0,180,255,.55);
  }
  .panel .line{white-space:nowrap}
  .panel .hl{color:rgba(190,245,255,.92);text-shadow:0 0 12px rgba(90,225,255,.95)}
  .panel .dim{color:rgba(140,160,220,.45);font-size:11px}
  .panel.left{left:24px;text-align:left}
  .panel.right{right:24px;text-align:right}

  /* 底部控制 */
  .controls{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    z-index:4;display:flex;align-items:center;gap:20px;
    padding:11px 24px;border-radius:44px;
    background:rgba(8,18,36,.62);
    border:1px solid rgba(80,220,255,.28);
    box-shadow:0 0 26px rgba(0,140,255,.28),inset 0 0 22px rgba(0,120,220,.14);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:12px;letter-spacing:.5px;white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:9px;color:rgba(150,235,255,.85)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:150px;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,rgba(60,230,255,.85),rgba(150,90,255,.85));
    box-shadow:0 0 12px rgba(60,220,255,.55);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#39d9ff 55%,#1a6cff);
    box-shadow:0 0 14px rgba(80,230,255,.95),0 0 26px rgba(80,180,255,.6);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#39d9ff 55%,#1a6cff);
    box-shadow:0 0 14px rgba(80,230,255,.95);cursor:pointer;
  }
  .toggle{
    cursor:pointer;user-select:none;
    padding:5px 15px;border-radius:20px;
    border:1px solid rgba(80,220,255,.32);
    background:rgba(18,52,92,.35);
    color:rgba(150,230,255,.75);
    transition:all .28s ease;
  }
  .toggle:hover{border-color:rgba(120,240,255,.6);color:#cdf4ff}
  .toggle.on{
    background:rgba(60,220,255,.2);
    border-color:rgba(140,255,255,.85);
    color:#e8fdff;
    box-shadow:0 0 18px rgba(60,220,255,.6),inset 0 0 14px rgba(60,220,255,.28);
  }

  @media (max-width:860px){
    .panel{display:none}
    .quote{font-size:13px;letter-spacing:1.5px;top:14px}
    .controls{gap:12px;padding:9px 16px;font-size:11px;bottom:14px}
    input[type=range]{width:96px}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="quote">再强的磁场，也只弯方向，不夺你的能量</div>

<div class="panel left">
  <div class="line">F = q · v × B</div>
  <div class="line">r_L = m·v⊥ / (q·B)</div>
  <div class="line">ω_c = q·B / m</div>
  <div class="line">F_c = m·v² / r</div>
  <div class="line dim" style="margin-top:8px">洛伦兹力 ⊥ v ⇒ 不做功</div>
</div>

<div class="panel right">
  <div class="line">q = 1.60×10⁻¹⁹ C</div>
  <div class="line">m = 9.11×10⁻³¹ kg</div>
  <div class="line">v⊥ = 1.50×10⁵ m/s</div>
  <div class="line">B = <span id="vB">0.85</span> T</div>
  <div class="line hl">r_L = <span id="vR">1.00</span> μm</div>
  <div class="line hl">ω_c = <span id="vW">1.493</span>×10¹¹ rad/s</div>
  <div class="line hl">T_c = <span id="vT">4.21</span>×10⁻¹¹ s</div>
  <div class="line dim" style="margin-top:8px">径向动能 58% · 轨道 42%</div>
</div>

<div class="controls">
  <label>B
    <input type="range" id="bSlider" min="0.35" max="2.0" step="0.01" value="0.85">
  </label>
  <div class="toggle" id="btnVec">矢量标注</div>
  <div class="toggle" id="btnHelix">螺旋投影</div>
</div>

<script>
(function(){
  'use strict';

  /* ============================================================
     画布初始化
  ============================================================ */
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  let fieldLines = [];

  function buildField(){
    fieldLines = [];
    const n = Math.max(5, Math.round(W / 70));
    for(let i = 0; i < n; i++){
      const x = (i + 0.5) * (W / n);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0,    'rgba(0,255,225,0)');
      g.addColorStop(0.18, 'rgba(0,255,225,0.50)');
      g.addColorStop(0.50, 'rgba(120,205,255,1)');
      g.addColorStop(0.82, 'rgba(0,255,225,0.50)');
      g.addColorStop(1,    'rgba(0,255,225,0)');
      fieldLines.push({ x: x, grad: g, ph: Math.random() * Math.PI * 2 });
    }
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildField();
  }

  window.addEventListener('resize', resize);
  resize();

  /* ============================================================
     物理 / 状态
  ============================================================ */
  const B0 = 0.85;          // T  基准磁感应强度
  const OMEGA0 = 2.20;      // rad/s 演示角速度（真实为 1.49e11，视觉缩放）

  let B = 0.85;
  let theta = 0;            // 回旋相位
  let clock = 0;            // 全局时间
  let hueBase = 230;        // 主色调（30s 循环漂移）

  let helix = false;        // 螺旋投影开关
  let vectors = false;      // 矢量标注开关

  let helixY = 0;
  let trail = [];           // 主粒子尾迹点
  let pushAcc = 0;
  let rings = [];           // 每完成一圈留下的环形光圈
  let lastLap = 0;

  /* 同心回旋环（幽灵粒子） */
  const ghosts = [
    { rf: 0.86, ph: 0.90, hue: 285, a: 0.55 },
    { rf: 0.70, ph: 2.10, hue: 250, a: 0.46 },
    { rf: 0.56, ph: 3.40, hue: 305, a: 0.38 },
    { rf: 0.43, ph: 4.60, hue: 205, a: 0.32 },
    { rf: 0.31, ph: 5.50, hue: 325, a: 0.26 },
    { rf: 0.20, ph: 0.30, hue: 265, a: 0.20 }
  ];

  function geom(){
    const dim = Math.min(W, H);
    let R = dim * 0.135 * (B0 / B);           // r_L ∝ 1/B
    R = Math.max(22, Math.min(R, dim * 0.36));
    const omega = OMEGA0 * (B / B0);          // ω_c ∝ B
    const rL = 1.0047 * (B0 / B);             // μm
    const wc = 1.4929e11 * (B / B0);          // rad/s
    const Tc = 2 * Math.PI * 9.11e-31 / (1.6e-19 * B); // s
    return { R: R, omega: omega, rL: rL, wc: wc, Tc: Tc };
  }

  /* ============================================================
     交互
  ============================================================ */
  const bSlider = document.getElementById('bSlider');
  const btnVec  = document.getElementById('btnVec');
  const btnHelix= document.getElementById('btnHelix');

  bSlider.addEventListener('input', function(e){
    B = parseFloat(e.target.value);
    updateUI();
  });

  btnVec.addEventListener('click', function(){
    vectors = !vectors;
    btnVec.classList.toggle('on', vectors);
  });

  btnHelix.addEventListener('click', function(){
    helix = !helix;
    btnHelix.classList.toggle('on', helix);
    trail.length = 0;
    helixY = 0;
  });

  const elB = document.getElementById('vB');
  const elR = document.getElementById('vR');
  const elW = document.getElementById('vW');
  const elT = document.getElementById('vT');

  function updateUI(){
    const G = geom();
    elB.textContent = B.toFixed(2);
    elR.textContent = G.rL.toFixed(2);
    elW.textContent = (G.wc / 1e11).toFixed(3);
    elT.textContent = (G.Tc * 1e11).toFixed(2);
  }

  /* ============================================================
     更新
  ============================================================ */
  function update(dt){
    const G = geom();

    theta += G.omega * dt;

    /* 30 秒一轮的色相循环 —— 炫彩核心 */
    hueBase = 230 + 62 * Math.sin(clock * Math.PI * 2 / 30);

    /* 螺旋投影：中心沿磁场方向（竖直）缓慢漂移 */
    if(helix){
      helixY += dt * 50;
      if(helixY > H * 1.9){
        helixY = 0;
        trail.length = 0;
      }
    } else {
      helixY = 0;
    }

    const cx = W / 2;
    const cy = helix ? (H * 0.20 + helixY - H * 0.90) : H / 2;
    const sy = helix ? 0.60 : 1.0;

    const px = cx + G.R * Math.cos(theta);
    const py = cy + G.R * sy * Math.sin(theta);

    /* 尾迹采样 */
    pushAcc += dt;
    if(pushAcc > 1 / 45 || trail.length === 0){
      pushAcc = 0;
      trail.push({ x: px, y: py, t: clock });
    }

    const life = helix ? 3.0 : Math.min(1.9, 3.2 / G.omega);
    while(trail.length && clock - trail[0].t > life) trail.shift();
    if(trail.length > 220) trail.splice(0, trail.length - 220);

    /* 每完成一整圈 → 生成一个环形光圈 */
    const laps = Math.floor(theta / (Math.PI * 2));
    if(laps > lastLap){
      lastLap = laps;
      rings.push({ r: G.R, cx: cx, cy: cy, sy: sy, life: 1, hue: hueBase });
      if(rings.length > 14) rings.shift();
    }

    /* 光圈淡出 */
    for(let i = rings.length - 1; i >= 0; i--){
      rings[i].life -= dt / 1.6;
      if(rings[i].life <= 0) rings.splice(i, 1);
    }
  }

  /* ============================================================
     绘制工具
  ============================================================ */
  function glowDot(x, y, r, hue, alpha){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0,   'hsla(' + hue + ',100%,95%,' + (alpha * 0.95) + ')');
    g.addColorStop(0.25,'hsla(' + hue + ',100%,68%,' + (alpha * 0.70) + ')');
    g.addColorStop(0.6, 'hsla(' + (hue + 30) + ',100%,55%,' + (alpha * 0.22) + ')');
    g.addColorStop(1,   'hsla(' + hue + ',100%,50%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function arrow(x0, y0, x1, y1, color, label){
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();

    const ang = Math.atan2(y1 - y0, x1 - x0);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - 12 * Math.cos(ang - 0.42), y1 - 12 * Math.sin(ang - 0.42));
    ctx.lineTo(x1 - 12 * Math.cos(ang + 0.42), y1 - 12 * Math.sin(ang + 0.42));
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.font = '12px ui-monospace, Consolas, monospace';
    ctx.fillStyle = color;
    ctx.fillText(label, x1 + 9, y1 + 4);
    ctx.restore();
  }

  /* ============================================================
     背景
  ============================================================ */
  function drawBackground(hue){
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#03050c';
    ctx.fillRect(0, 0, W, H);

    const g = ctx.createRadialGradient(
      W / 2, H / 2, 0,
      W / 2, H / 2, Math.max(W, H) * 0.72
    );
    g.addColorStop(0,   'hsla(' + hue + ',80%,32%,0.30)');
    g.addColorStop(0.42,'hsla(' + (hue + 40) + ',80%,22%,0.14)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawField(t){
    ctx.globalCompositeOperation = 'lighter';
    for(let i = 0; i < fieldLines.length; i++){
      const f = fieldLines[i];
      const s = 0.5 + 0.5 * Math.sin(t * 0.9 + f.ph);
      ctx.globalAlpha = 0.05 + 0.13 * s * s;
      ctx.strokeStyle = f.grad;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(f.x, 0);
      ctx.lineTo(f.x, H);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     尾迹
  ============================================================ */
  function drawTrail(hue){
    const n = trail.length;
    if(n < 3) return;

    const step = 3;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for(let pass = 0; pass < 2; pass++){
      for(let i = 1; i < n; i += step){
        const j = Math.min(i + step - 1, n - 1);
        if(j <= i - 1) continue;

        const f = j / (n - 1);                       // 1 = 最新
        const alpha = Math.pow(f, 2.0) * (pass === 0 ? 0.13 : 0.95);
        if(alpha < 0.012) continue;

        const h = hue - 72 * (1 - f);                // 尾部偏青，头部偏紫
        ctx.strokeStyle = 'hsla(' + h + ',100%,' + (58 + 32 * f) + '%,' + alpha + ')';
        ctx.lineWidth = (pass === 0 ? 7.5 : 2.3) * (0.30 + 0.70 * f);

        ctx.beginPath();
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
        for(let k = i; k <= j; k++) ctx.lineTo(trail[k].x, trail[k].y);
        ctx.stroke();
      }
    }
  }

  /* ============================================================
     同心回旋环（幽灵粒子）
  ============================================================ */
  function drawGhosts(G, cx, cy, sy){
    const segs = 15;
    const span = 1.95;

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    for(let gi = 0; gi < ghosts.length; gi++){
      const gh = ghosts[gi];
      const r  = G.R * gh.rf;
      const th = theta + gh.ph;

      for(let i = 0; i < segs; i++){
        const f  = 1 - i / segs;
        const a0 = th - span * (i + 1) / segs;
        const a1 = th - span * i / segs;
        const alpha = f * f * gh.a * 0.85;
        if(alpha < 0.01) continue;

        ctx.strokeStyle = 'hsla(' + (gh.hue + 28 * (1 - f)) + ',100%,'
                        + (55 + 30 * f) + '%,' + alpha + ')';
        ctx.lineWidth = 1 + 3.2 * f;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, sy);
        ctx.beginPath();
        ctx.arc(0, 0, r, a0, a1);
        ctx.stroke();
        ctx.restore();
      }

      const gx = cx + r * Math.cos(th);
      const gy = cy + r * sy * Math.sin(th);
      glowDot(gx, gy, 12, gh.hue, 0.75);
    }
  }

  /* ============================================================
     主渲染
  ============================================================ */
  function render(){
    const G = geom();
    const hue = hueBase;

    const cx = W / 2;
    const cy = helix ? (H * 0.20 + helixY - H * 0.90) : H / 2;
    const sy = helix ? 0.60 : 1.0;

    drawBackground(hue);
    drawField(clock);

    ctx.globalCompositeOperation = 'lighter';

    /* 中心氛围光 */
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, G.R * 2.4);
    bg.addColorStop(0,   'hsla(' + hue + ',100%,62%,0.11)');
    bg.addColorStop(0.45,'hsla(' + (hue + 45) + ',100%,55%,0.05)');
    bg.addColorStop(1,   'hsla(' + (hue + 90) + ',100%,50%,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(cx - G.R * 2.4, cy - G.R * 2.4, G.R * 4.8, G.R * 4.8);

    /* 主回旋圆轨道（极淡的引导线） */
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, sy);
    ctx.strokeStyle = 'hsla(' + hue + ',100%,66%,0.10)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 0, G.R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    /* 历史环形光圈 */
    for(let i = 0; i < rings.length; i++){
      const r = rings[i];
      ctx.strokeStyle = 'hsla(' + r.hue + ',100%,68%,' + (r.life * 0.30) + ')';
      ctx.lineWidth = 1.6;
      ctx.save();
      ctx.translate(r.cx, r.cy);
      ctx.scale(1, r.sy);
      ctx.beginPath();
      ctx.arc(0, 0, r.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    /* 同心回旋环 */
    if(!helix) drawGhosts(G, cx, cy, sy);

    /* 主粒子尾迹 */
    drawTrail(hue);

    /* 主粒子 */
    let px = cx + G.R * Math.cos(theta);
    let py = cy + G.R * sy * Math.sin(theta);
    if(trail.length){
      px = trail[trail.length - 1].x;
      py = trail[trail.length - 1].y;
    }

    glowDot(px, py, 30, hue, 1.0);
    glowDot(px, py, 12, hue + 25, 1.0);

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px, py, 3.2, 0, Math.PI * 2);
    ctx.fill();

    /* 矢量标注 */
    if(vectors){
      const vx = -Math.sin(theta);
      const vy =  Math.cos(theta) * sy;
      const len = Math.hypot(vx, vy) || 1;
      const ux = vx / len, uy = vy / len;

      const fx = -Math.cos(theta);
      const fy = -Math.sin(theta) * sy;
      const fl = Math.hypot(fx, fy) || 1;
      const cxu = fx / fl, cyu = fy / fl;

      arrow(px, py, px + ux * 82, py + uy * 82, 'rgba(90,255,255,0.95)', 'v⊥');
      arrow(px, py, px + cxu * 62, py + cyu * 62, 'rgba(255,90,215,0.95)', 'F = qv×B');

      /* 回旋中心标记 */
      ctx.save();
      ctx.strokeStyle = 'hsla(' + hue + ',100%,75%,0.55)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(cx, cy);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = 'hsla(' + hue + ',100%,80%,0.8)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============================================================
     主循环
  ============================================================ */
  let prev = performance.now();
  let uiTick = 0;

  function loop(now){
    let dt = (now - prev) / 1000;
    prev = now;
    if(dt > 0.05) dt = 0.05;
    if(dt < 0) dt = 0;

    clock += dt;

    update(dt);
    render();

    uiTick++;
    if(uiTick % 6 === 0) updateUI();

    requestAnimationFrame(loop);
  }

  updateUI();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
