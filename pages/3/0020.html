<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重力弹球交响曲 · Gravity Ball Symphony</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#04050c;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;}

  /* ---------- 暗角 ---------- */
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 50%,
      transparent 22%,
      rgba(0,0,0,.42) 62%,
      rgba(0,0,0,.86) 100%);
  }

  /* ---------- 界面 ---------- */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;padding:36px 44px;
    opacity:0;animation:fade 1.8s .5s ease forwards;
  }
  #title h1{
    font-size:clamp(16px,2.0vw,25px);
    font-weight:200;letter-spacing:.42em;text-indent:.42em;
    background:linear-gradient(96deg,#7ee8ff 0%,#b09eff 45%,#ff9ad4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:12px;
    filter:drop-shadow(0 0 22px rgba(120,200,255,.42));
  }
  #title .en{
    font-size:9px;letter-spacing:.48em;text-indent:.48em;
    color:rgba(140,210,255,.30);
  }

  /* ---------- 右上按钮组 ---------- */
  #topBtns{
    position:absolute;top:36px;right:44px;
    display:flex;gap:12px;
    pointer-events:auto;
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  .btn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.28em;text-indent:.28em;
    color:rgba(180,210,255,.55);
    background:rgba(20,30,60,.24);
    border:1px solid rgba(120,180,255,.22);
    border-radius:999px;
    padding:9px 20px;
    cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:.4s cubic-bezier(.4,0,.2,1);
    white-space:nowrap;
  }
  .btn:hover{
    border-color:rgba(180,220,255,.70);
    background:rgba(60,100,180,.18);
    color:rgba(220,240,255,.90);
  }
  .btn:active{transform:scale(.97);}

  #muteBtn.off{
    color:rgba(255,160,180,.55);
    border-color:rgba(255,140,170,.26);
  }

  #dropBtn{
    color:rgba(200,255,230,.62);
    border-color:rgba(120,255,200,.26);
    background:rgba(20,60,50,.24);
  }
  #dropBtn:hover{
    border-color:rgba(160,255,220,.78);
    background:rgba(40,120,100,.22);
    color:rgba(220,255,240,.95);
    box-shadow:0 0 22px rgba(120,255,200,.28);
  }

  /* ---------- 左下统计 ---------- */
  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 44px 32px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.20em;line-height:2.0;
    color:rgba(140,190,255,.26);
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
  }
  #stats .k{color:rgba(150,220,255,.48);}
  #stats .v{color:rgba(255,190,230,.55);}
  #stats .lab{
    display:block;font-size:8px;
    letter-spacing:.44em;text-indent:.44em;
    color:rgba(110,170,220,.20);
    margin-bottom:9px;
  }

  /* ---------- 右下乐谱 ---------- */
  #score{
    position:absolute;bottom:0;right:0;
    padding:0 44px 32px;
    text-align:right;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.18em;line-height:2.0;
    color:rgba(140,190,255,.24);
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  #score .lab{
    display:block;font-size:8px;
    letter-spacing:.44em;text-indent:.44em;
    color:rgba(110,170,220,.20);
    margin-bottom:9px;
  }
  #score .row{
    display:flex;align-items:center;justify-content:flex-end;gap:8px;
  }
  #score .dot{
    width:6px;height:6px;border-radius:50%;
    display:inline-block;
  }

  /* ---------- 开场遮罩 ---------- */
  #overlay{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:28px;padding:28px;text-align:center;
    background:radial-gradient(ellipse at 50% 42%,
      rgba(18,26,58,.88), rgba(4,5,12,.98) 72%);
    transition:opacity 1.0s ease, visibility 1.0s;
  }
  #overlay.hide{opacity:0;visibility:hidden;pointer-events:none;}

  #overlay h1{
    font-size:clamp(22px,3.2vw,42px);
    font-weight:200;letter-spacing:.34em;text-indent:.34em;
    background:linear-gradient(96deg,#7ee8ff 0%,#b09eff 45%,#ff9ad4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 34px rgba(120,200,255,.42));
  }
  #overlay p{
    max-width:520px;line-height:2.1;
    font-size:clamp(10.5px,1.25vw,13px);font-weight:300;
    letter-spacing:.14em;
    color:rgba(170,200,240,.52);
  }
  #overlay p em{font-style:normal;color:rgba(255,190,230,.75);}

  #startBtn{
    font-family:inherit;
    font-size:12px;letter-spacing:.32em;text-indent:.32em;
    color:rgba(230,240,255,.90);
    background:rgba(30,50,100,.28);
    border:1px solid rgba(140,190,255,.38);
    border-radius:999px;
    padding:15px 44px;
    cursor:pointer;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:.45s cubic-bezier(.4,0,.2,1);
  }
  #startBtn:hover{
    border-color:rgba(200,225,255,.95);
    box-shadow:0 0 40px rgba(120,190,255,.42);
    background:rgba(70,120,220,.20);
    transform:translateY(-1px);
  }
  #startBtn:active{transform:translateY(0);}

  @keyframes fade{to{opacity:1;}}

  @media (max-width:680px){
    #title{padding:20px 20px;}
    #topBtns{top:20px;right:20px;gap:8px;}
    .btn{padding:7px 13px;font-size:8.5px;letter-spacing:.18em;}
    #stats{padding:0 20px 18px;font-size:8px;}
    #score{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="ui">
  <div id="title">
    <h1>重力弹球交响曲</h1>
    <div class="en">GRAVITY BALL SYMPHONY</div>
  </div>

  <div id="topBtns">
    <button class="btn" id="dropBtn">↓ 重新下落</button>
    <button class="btn" id="muteBtn">静音</button>
  </div>

  <div id="stats">
    <span class="lab">SYSTEM STATE</span>
    <div><span class="k">碰撞 </span><span class="v" id="hits">0</span></div>
    <div><span class="k">重力 </span><span class="v">1400 px/s²</span></div>
    <div><span class="k">恢复 </span><span class="v">0.90 / 0.96</span></div>
    <div><span class="k">积分 </span><span class="v">1/120 s</span></div>
  </div>

  <div id="score">
    <span class="lab">PITCH MAP · A MINOR PENTATONIC</span>
    <div class="row"><span class="dot" style="background:hsl(195,100%,65%)"></span><span>A3 · 220.00</span></div>
    <div class="row"><span class="dot" style="background:hsl(265,100%,68%)"></span><span>C4 · 261.63</span></div>
    <div class="row"><span class="dot" style="background:hsl(325,100%,68%)"></span><span>D4 · 293.66</span></div>
    <div class="row"><span class="dot" style="background:hsl(45,100%,65%)"></span><span>G4 · 392.00</span></div>
    <div class="row"><span class="dot" style="background:hsl(155,100%,62%)"></span><span>C5 · 523.25</span></div>
    <div class="row"><span class="dot" style="background:hsl(15,100%,65%)"></span><span>E5 · 659.25</span></div>
  </div>
</div>

<div id="overlay">
  <h1>重力弹球交响曲</h1>
  <p>
    六个弹球在重力场中自由落体、碰撞、弹跳。<br>
    每一次撞击都触发一个<em>五声音阶</em>的音符，<br>
    速度决定力度，质量决定音色 —— 数学即音乐。
  </p>
  <button id="startBtn">开 始 演 奏</button>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   0. 基础
   ============================================================ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const TAU    = Math.PI * 2;

const overlay   = document.getElementById('overlay');
const startBtn  = document.getElementById('startBtn');
const muteBtn   = document.getElementById('muteBtn');
const dropBtn   = document.getElementById('dropBtn');
const hitsEl    = document.getElementById('hits');

let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   1. 物理常量
   ============================================================ */
const GRAVITY    = 1400;     // px/s²
const WALL_REST  = 0.90;     // 撞墙恢复系数
const BALL_REST  = 0.96;     // 球球恢复系数
const AIR_DRAG   = 0.9996;   // 空气阻力
const FIXED_DT   = 1 / 120;  // 固定物理步长
const MIN_HIT_V  = 90;       // 触发音符的最低撞击速度

/* ============================================================
   2. 音阶 —— A 小调五声
   ============================================================ */
const SCALE = [
  220.00,  // A3
  261.63,  // C4
  293.66,  // D4
  329.63,  // E4
  392.00,  // G4
  440.00,  // A4
  523.25,  // C5
  587.33,  // D5
  659.25,  // E5
  783.99   // G5
];

/* ============================================================
   3. 音频引擎
   ============================================================ */
let audioCtx    = null;
let masterGain  = null;
let delayNode   = null;
let delayFb     = null;
let delayFilter = null;

let muted = false;
let audioReady = false;

function initAudio(){
  if (audioReady) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.42;
  masterGain.connect(audioCtx.destination);

  delayNode = audioCtx.createDelay(1.0);
  delayNode.delayTime.value = 0.30;

  delayFilter = audioCtx.createBiquadFilter();
  delayFilter.type = 'lowpass';
  delayFilter.frequency.value = 1800;
  delayFilter.Q.value = 0.5;

  delayFb = audioCtx.createGain();
  delayFb.gain.value = 0.42;

  delayNode.connect(delayFilter);
  delayFilter.connect(delayFb);
  delayFb.connect(delayNode);
  delayNode.connect(masterGain);

  audioReady = true;
}

function playNote(freq, vel){
  if (!audioCtx || muted) return;
  if (vel < 0.02) return;

  const t   = audioCtx.currentTime;
  const vol = Math.min(0.44, vel * 0.52);

  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filt = audioCtx.createBiquadFilter();

  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.linearRampToValueAtTime(freq * 0.998, t + 1.6);

  filt.type = 'lowpass';
  filt.frequency.value = Math.min(9000, freq * 8);
  filt.Q.value = 0.6;

  const dur = 1.5 + Math.random() * 0.7;

  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  osc.connect(filt);
  filt.connect(gain);
  gain.connect(masterGain);
  gain.connect(delayNode);

  osc.start(t);
  osc.stop(t + dur + 0.08);

  const osc2  = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();

  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;

  gain2.gain.setValueAtTime(0.0001, t);
  gain2.gain.exponentialRampToValueAtTime(vol * 0.22, t + 0.010);
  gain2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.55);

  osc2.connect(gain2);
  gain2.connect(masterGain);
  gain2.connect(delayNode);

  osc2.start(t);
  osc2.stop(t + dur);

  const noiseBuf = audioCtx.createBuffer(1, 512, audioCtx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < 512; i++){
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / 512, 5);
  }
  const noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = noiseBuf;

  const noiseFilt = audioCtx.createBiquadFilter();
  noiseFilt.type = 'bandpass';
  noiseFilt.frequency.value = freq * 2.4;
  noiseFilt.Q.value = 1.2;

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(vol * 0.20, t);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);

  noiseSrc.connect(noiseFilt);
  noiseFilt.connect(noiseGain);
  noiseGain.connect(masterGain);

  noiseSrc.start(t);
  noiseSrc.stop(t + 0.06);
}

/* ============================================================
   4. 弹球与状态
   ============================================================ */
const BALL_DEFS = [
  { r: 0.038, hue: 195, pitch: 0 },
  { r: 0.030, hue: 265, pitch: 1 },
  { r: 0.045, hue: 325, pitch: 2 },
  { r: 0.026, hue:  45, pitch: 4 },
  { r: 0.034, hue: 155, pitch: 6 },
  { r: 0.028, hue:  15, pitch: 8 }
];

let balls   = [];
let ripples = [];
let hitCount = 0;

const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- 生成球（散落在上半屏，带初速） ---------- */
function initBalls(){
  balls   = [];
  ripples = [];

  const minDim = Math.min(W, H);

  for (let i = 0; i < BALL_DEFS.length; i++){
    const d = BALL_DEFS[i];
    const r = minDim * d.r;

    balls.push({
      x:  W * rand(0.16, 0.84),
      y:  H * rand(0.14, 0.54),
      vx: rand(-520, 520),
      vy: rand(-260, 260),
      r,
      mass: r * r * 0.0012,
      hue: d.hue,
      pitch: SCALE[d.pitch],
      cool: 0,
      flash: 0
    });
  }
}

/* ---------- 重新下落：把球排到顶部，几乎静止开始落体 ---------- */
function dropBalls(){
  ripples = [];
  hitCount = 0;
  hitsEl.textContent = '0';

  const minDim = Math.min(W, H);
  const n = balls.length;

  for (let i = 0; i < n; i++){
    const b = balls[i];

    /* 沿水平方向均匀分布（轻微随机抖动），从顶部上方落下 */
    const u = (i + 0.5) / n;
    b.x = W * (0.12 + u * 0.76) + rand(-W * 0.02, W * 0.02);
    b.y = -b.r - rand(0, H * 0.10) - i * (minDim * 0.055);

    /* 近乎垂直下落，仅带极小的水平漂移 */
    b.vx = rand(-40, 40);
    b.vy = rand(0, 60);

    b.cool  = 0;
    b.flash = 0;
  }

  /* 屏幕轻微闪一下，给一个视觉反馈 */
  flashScreen();
}

let screenFlash = 0;

function flashScreen(){
  screenFlash = 0.35;
}

/* ============================================================
   5. 物理步进
   ============================================================ */
function physicsStep(dt){
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];

    b.vy += GRAVITY * dt;
    b.vx *= AIR_DRAG;
    b.vy *= AIR_DRAG;

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if (b.cool  > 0) b.cool  -= dt;
    if (b.flash > 0) b.flash -= dt;
  }

  /* ---------- 墙壁碰撞 ---------- */
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];

    if (b.x - b.r < 0){
      b.x = b.r;
      const sp = Math.abs(b.vx);
      b.vx = -b.vx * WALL_REST;
      onImpact(b, sp, 0, b.y);
    }
    if (b.x + b.r > W){
      b.x = W - b.r;
      const sp = Math.abs(b.vx);
      b.vx = -b.vx * WALL_REST;
      onImpact(b, sp, W, b.y);
    }
    if (b.y - b.r < 0){
      b.y = b.r;
      const sp = Math.abs(b.vy);
      b.vy = -b.vy * WALL_REST;
      onImpact(b, sp, b.x, 0);
    }
    if (b.y + b.r > H){
      b.y = H - b.r;
      const sp = Math.abs(b.vy);
      b.vy = -b.vy * WALL_REST;
      onImpact(b, sp, b.x, H);
    }
  }

  /* ---------- 球与球：弹性碰撞 ---------- */
  for (let i = 0; i < balls.length; i++){
    for (let j = i + 1; j < balls.length; j++){
      const a = balls[i];
      const b = balls[j];

      let dx = b.x - a.x;
      let dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;

      const rSum = a.r + b.r;
      if (d2 >= rSum * rSum) continue;
      if (d2 < 1e-8){ dx = 0.01; dy = 0.01; d2 = 0.0002; }

      const dist = Math.sqrt(d2);
      const nx = dx / dist;
      const ny = dy / dist;

      const dvx = b.vx - a.vx;
      const dvy = b.vy - a.vy;
      const vn  = dvx * nx + dvy * ny;

      const overlap = rSum - dist;
      const totalM  = a.mass + b.mass;

      a.x -= nx * overlap * (b.mass / totalM);
      a.y -= ny * overlap * (b.mass / totalM);
      b.x += nx * overlap * (a.mass / totalM);
      b.y += ny * overlap * (a.mass / totalM);

      if (vn >= 0) continue;

      const jImp = -(1 + BALL_REST) * vn / (1 / a.mass + 1 / b.mass);

      a.vx -= jImp * nx / a.mass;
      a.vy -= jImp * ny / a.mass;
      b.vx += jImp * nx / b.mass;
      b.vy += jImp * ny / b.mass;

      const speed = Math.abs(vn);
      if (speed > MIN_HIT_V){
        const cx = (a.x + b.x) * 0.5;
        const cy = (a.y + b.y) * 0.5;

        if (a.cool <= 0){
          playNote(a.pitch, Math.min(1, speed / 1100));
          a.cool  = 0.07;
          a.flash = 0.16;
        }
        if (b.cool <= 0){
          playNote(b.pitch, Math.min(1, speed / 1100));
          b.cool  = 0.07;
          b.flash = 0.16;
        }

        addRipple(cx, cy, speed, (a.hue + b.hue) * 0.5);
        hitCount++;
      }
    }
  }
}

function onImpact(b, speed, x, y){
  if (speed < MIN_HIT_V) return;

  const vel = Math.min(1, speed / 1100);

  if (b.cool <= 0){
    playNote(b.pitch, vel);
    b.cool  = 0.07;
    b.flash = 0.16;
  }

  addRipple(x, y, speed, b.hue);
  hitCount++;
}

function addRipple(x, y, speed, hue){
  ripples.push({
    x, y,
    r:   Math.max(4, speed * 0.014),
    max: 34 + Math.min(120, speed * 0.075),
    life: 1,
    hue
  });
  if (ripples.length > 90) ripples.shift();
}

/* ============================================================
   6. 渲染
   ============================================================ */
function render(dt){
  /* ---------- 拖尾式淡出 ---------- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(4, 5, 12, 0.30)';
  ctx.fillRect(0, 0, W, H);

  /* ---------- 加法混合 ---------- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  /* ---------- 波纹 ---------- */
  for (let i = ripples.length - 1; i >= 0; i--){
    const rp = ripples[i];

    rp.r    += (rp.max - rp.r) * 0.16 + 1.6;
    rp.life -= dt * 2.1;

    if (rp.life <= 0){
      ripples.splice(i, 1);
      continue;
    }

    const a = rp.life * rp.life * 0.42;

    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rp.r, 0, TAU);
    ctx.strokeStyle = 'hsla(' + rp.hue + ',100%,72%,' + a.toFixed(3) + ')';
    ctx.lineWidth = 1.4 * rp.life + 0.4;
    ctx.stroke();

    if (rp.life > 0.45){
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r * 0.55, 0, TAU);
      ctx.strokeStyle = 'hsla(' + rp.hue + ',100%,84%,' +
                        (a * 0.45).toFixed(3) + ')';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }

  /* ---------- 弹球 ---------- */
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];
    const flash = Math.max(0, b.flash / 0.16);

    const glowR = b.r * (3.4 + flash * 2.4);

    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, glowR);
    g.addColorStop(0.00, 'hsla(' + b.hue + ',100%,' +
                      (74 + flash * 20) + '%,' + (0.85 + flash * 0.15) + ')');
    g.addColorStop(0.22, 'hsla(' + b.hue + ',100%,62%,' +
                      (0.38 + flash * 0.30) + ')');
    g.addColorStop(0.58, 'hsla(' + b.hue + ',100%,52%,0.11)');
    g.addColorStop(1.00, 'hsla(' + b.hue + ',100%,50%,0)');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, glowR, 0, TAU);
    ctx.fill();

    const core = ctx.createRadialGradient(
      b.x - b.r * 0.28, b.y - b.r * 0.30, 0,
      b.x, b.y, b.r
    );
    core.addColorStop(0.00, 'rgba(255,255,255,' + (0.90 + flash * 0.10) + ')');
    core.addColorStop(0.30, 'hsla(' + b.hue + ',100%,82%,0.82)');
    core.addColorStop(0.78, 'hsla(' + b.hue + ',100%,58%,0.58)');
    core.addColorStop(1.00, 'hsla(' + b.hue + ',100%,46%,0.22)');

    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.strokeStyle = 'hsla(' + b.hue + ',100%,88%,' +
                      (0.34 + flash * 0.55) + ')';
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }

  /* ---------- 屏幕闪光（重新下落时的反馈） ---------- */
  if (screenFlash > 0){
    screenFlash -= dt * 1.6;
    if (screenFlash < 0) screenFlash = 0;

    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(120, 200, 255, ' +
                    (screenFlash * 0.14).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   7. 主循环
   ============================================================ */
let running      = false;
let lastTS       = 0;
let accumulator  = 0;

function loop(now){
  if (!running) return;
  requestAnimationFrame(loop);

  let dt = (now - lastTS) / 1000;
  lastTS = now;

  if (dt > 0.08) dt = 0.08;
  if (dt < 0)    dt = 0;

  accumulator += dt;
  let steps = 0;
  while (accumulator >= FIXED_DT && steps < 8){
    physicsStep(FIXED_DT);
    accumulator -= FIXED_DT;
    steps++;
  }
  if (steps === 8) accumulator = 0;

  render(dt);

  hitsEl.textContent = hitCount;
}

/* ============================================================
   8. 启动
   ============================================================ */
function start(){
  resize();
  initBalls();

  hitCount = 0;
  hitsEl.textContent = '0';

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#04050c';
  ctx.fillRect(0, 0, W, H);

  lastTS = performance.now();
  accumulator = 0;
  running = true;
  requestAnimationFrame(loop);
}

/* ---------- 开始按钮 ---------- */
startBtn.addEventListener('click', () => {
  overlay.classList.add('hide');
  initAudio();
  start();
}, { once: true });

/* ---------- 重新下落 ---------- */
dropBtn.addEventListener('click', () => {
  /* 若尚未开始，则直接进入演奏状态 */
  if (!running){
    overlay.classList.add('hide');
    initAudio();
    start();
    return;
  }
  dropBalls();
});

/* ---------- 静音切换 ---------- */
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.classList.toggle('off', muted);
  muteBtn.textContent = muted ? '已静音' : '静音';

  if (audioReady && masterGain){
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(muted ? 0 : 0.42, now + 0.25);
  }
});

/* ---------- 键盘快捷键 ---------- */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){
    e.preventDefault();
    if (running) dropBalls();
  } else if (e.code === 'KeyM'){
    muteBtn.click();
  }
});

/* ---------- 窗口变化 ---------- */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!running) return;
    running = false;
    start();
  }, 300);
});

/* ---------- 首屏静态展示 ---------- */
resize();
initBalls();
ctx.fillStyle = '#04050c';
ctx.fillRect(0, 0, W, H);

})();
</script>
