<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>遗传算法 · Genetic Algorithm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #02030a;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  canvas { display: block; }
  #scene { position: fixed; inset: 0; }

  /* ---------- 顶部启迪文字 ---------- */
  #ga-text {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 64vw;
    max-width: 1020px;
    text-align: center;
    z-index: 30;
    pointer-events: none;
    font-size: clamp(13px, 1.12vw, 18px);
    line-height: 1.72;
    letter-spacing: 1.2px;
    color: #d2ecff;
    text-shadow:
      0 0 10px rgba(90, 200, 255, 0.85),
      0 0 26px rgba(150, 90, 255, 0.5),
      0 0 46px rgba(60, 140, 255, 0.32);
  }
  #ga-text span { transition: none; }

  /* ---------- 边缘公式 ---------- */
  .hud {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    font-family: "Consolas", "SF Mono", "Courier New", monospace;
    font-size: clamp(9px, 0.82vw, 13px);
    letter-spacing: 0.6px;
    color: rgba(150, 220, 255, 0.72);
    text-shadow:
      0 0 8px rgba(60, 170, 255, 0.75),
      0 0 20px rgba(120, 60, 255, 0.4);
    white-space: nowrap;
  }
  .hud .k { color: rgba(255, 200, 110, 0.92); }
  .hud .v { color: rgba(255, 130, 210, 0.92); }
  .f-tl { top: 16px; left: 20px; }
  .f-tr { top: 16px; right: 20px; text-align: right; }
  .f-bl { bottom: 20px; left: 20px; }
  .f-br { bottom: 20px; right: 20px; text-align: right; }

  /* ---------- 左下角进化曲线仪表盘 ---------- */
  #chart-box {
    position: fixed;
    left: 20px;
    bottom: 42px;
    z-index: 30;
    padding: 8px 10px 6px;
    background: rgba(8, 16, 40, 0.45);
    border: 1px solid rgba(90, 170, 255, 0.22);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 0 26px rgba(60, 140, 255, 0.16);
    pointer-events: none;
  }
  #chart { display: block; }

  /* ---------- 右下角状态 ---------- */
  #stats {
    position: fixed;
    right: 22px;
    bottom: 44px;
    z-index: 30;
    text-align: right;
    pointer-events: none;
    font-family: "Consolas", "Courier New", monospace;
    font-size: clamp(10px, 0.9vw, 14px);
    letter-spacing: 1px;
    color: rgba(170, 225, 255, 0.85);
    text-shadow: 0 0 10px rgba(70, 180, 255, 0.8);
  }
  #stats .big {
    font-size: clamp(18px, 1.8vw, 28px);
    font-weight: 700;
    color: #ffd24a;
    text-shadow: 0 0 14px rgba(255, 200, 70, 0.95), 0 0 34px rgba(255, 150, 40, 0.55);
    letter-spacing: 1px;
  }
  #stats .lbl { color: rgba(140, 190, 255, 0.55); font-size: 0.85em; }

  /* ---------- 控制条 ---------- */
  #controls {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 16px;
    border-radius: 30px;
    background: rgba(10, 20, 46, 0.55);
    border: 1px solid rgba(90, 170, 255, 0.24);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 30px rgba(60, 140, 255, 0.18);
    font-family: "Consolas", "Courier New", monospace;
    font-size: 11px;
    color: rgba(170, 220, 255, 0.85);
    letter-spacing: 0.5px;
  }
  #controls button {
    background: linear-gradient(180deg, rgba(40, 110, 220, 0.55), rgba(20, 50, 130, 0.65));
    border: 1px solid rgba(110, 200, 255, 0.45);
    color: #cfeaff;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 14px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 8px rgba(100, 200, 255, 0.8);
  }
  #controls button:hover {
    background: linear-gradient(180deg, rgba(60, 150, 255, 0.75), rgba(30, 70, 170, 0.85));
    box-shadow: 0 0 18px rgba(90, 190, 255, 0.6);
  }
  #controls label {
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  #controls input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 84px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #22e6ff, #7a5cff, #ff58c8);
    outline: none;
    cursor: pointer;
  }
  #controls input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #eaf8ff;
    box-shadow: 0 0 10px rgba(120, 220, 255, 0.95);
    cursor: pointer;
  }
  #controls input[type=range]::-moz-range-thumb {
    width: 11px; height: 11px;
    border: none;
    border-radius: 50%;
    background: #eaf8ff;
    box-shadow: 0 0 10px rgba(120, 220, 255, 0.95);
    cursor: pointer;
  }
  .val { color: #ffd24a; min-width: 34px; display: inline-block; }

  /* ---------- 暗角 ---------- */
  #vignette {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background: radial-gradient(
      ellipse at 50% 50%,
      rgba(0, 0, 0, 0) 40%,
      rgba(0, 0, 0, 0.42) 76%,
      rgba(0, 0, 0, 0.8) 100%
    );
  }

  /* ---------- 进度条 ---------- */
  #progress {
    position: fixed; bottom: 0; left: 0; height: 2px; width: 0%;
    z-index: 45;
    background: linear-gradient(90deg, #22e6ff, #7a5cff, #ff58c8, #ffc65a);
    box-shadow: 0 0 14px rgba(120, 190, 255, 0.9);
    pointer-events: none;
  }

  @media (max-width: 900px) {
    .f-tr, .f-br { display: none; }
    #ga-text { width: 88vw; }
    #controls { gap: 8px; padding: 6px 10px; font-size: 10px; }
    #controls input[type=range] { width: 56px; }
    #chart-box { transform: scale(0.78); transform-origin: left bottom; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="progress"></div>

<div id="ga-text"></div>

<div class="hud f-tl">
  选择概率&nbsp;P<sub>i</sub> = f<sub>i</sub> / Σ f<sub>j</sub><br>
  进化目标&nbsp;F = max f(x)
</div>
<div class="hud f-tr">
  交叉算子&nbsp;Crossover&nbsp;&nbsp;·&nbsp;&nbsp;变异算子&nbsp;Mutation<br>
  v ← v + c₁r₁(p−x) + c₂r₂(g−x)
</div>
<div class="hud f-bl">
  <span class="k">N</span> ∈ [50, 200] &nbsp;
  <span class="k">Pc</span> ∈ [0.6, 0.9] &nbsp;
  <span class="k">Pm</span> ∈ [0.001, 0.1]
</div>
<div class="hud f-br">
  GENETIC&nbsp;ALGORITHM&nbsp;/&nbsp;ADAPTIVE&nbsp;LANDSCAPE
</div>

<div id="chart-box"><canvas id="chart"></canvas></div>

<div id="stats">
  <div class="lbl">GENERATION 进化代数</div>
  <div class="big" id="gen-val">0</div>
  <div class="lbl" style="margin-top:4px;">BEST FITNESS 最佳适应度</div>
  <div id="fit-val">0.0000</div>
</div>

<div id="controls">
  <button id="btn-play">暂停</button>
  <button id="btn-reset">重播</button>
  <label>变异率 Pm
    <input id="sl-pm" type="range" min="1" max="100" value="50" />
    <span class="val" id="val-pm">0.050</span>
  </label>
  <label>种群 N
    <input id="sl-n" type="range" min="30" max="260" value="120" />
    <span class="val" id="val-n">120</span>
  </label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   遗传算法 · Genetic Algorithm
   3D 适应度景观 + 种群进化可视化
   ========================================================= */

/* ---------------- 常量 ---------------- */
const LOOP_TIME   = 30;      // 动画循环周期（秒）
const TEXT_FULL   = 26;      // 文字显示完整所需时间
const GEN_TIME    = 1.12;    // 每一代持续时间
const MAXN        = 300;     // 最大个体数
const HEIGHT      = 46;      // 地形最大高度
const TERRAIN_SIZE= 132;     // 地形边长
const HALF        = TERRAIN_SIZE / 2;
const GRIDSEG     = 150;     // 地形网格分段

/* ---------------- 适应度函数 ---------------- */
const PEAKS = [
  { x: -0.58, z: -0.48, h: 0.70, s: 0.30 },
  { x:  0.52, z:  0.38, h: 1.00, s: 0.24 },   // 全局最优峰
  { x:  0.18, z: -0.72, h: 0.52, s: 0.22 },
  { x: -0.62, z:  0.58, h: 0.60, s: 0.28 },
  { x:  0.78, z: -0.18, h: 0.40, s: 0.19 },
  { x: -0.10, z:  0.08, h: 0.34, s: 0.50 }
];

function rawFit(u, v) {
  let s = 0;
  for (let i = 0; i < PEAKS.length; i++) {
    const p = PEAKS[i];
    const dx = u - p.x, dz = v - p.z;
    s += p.h * Math.exp(-(dx * dx + dz * dz) / (2 * p.s * p.s));
  }
  s += 0.045 * Math.sin(u * 3.3 + 1.1) * Math.cos(v * 2.9 - 0.6);
  return s;
}

let RAW_MAX = 1;
(function computeRawMax() {
  let m = 0;
  const S = 160;
  for (let i = 0; i <= S; i++) {
    for (let j = 0; j <= S; j++) {
      const u = -1 + 2 * i / S;
      const v = -1 + 2 * j / S;
      const f = rawFit(u, v);
      if (f > m) m = f;
    }
  }
  RAW_MAX = m;
})();

function fitness(u, v) {
  const f = rawFit(u, v) / RAW_MAX;
  return f < 0 ? 0 : f;
}

/* ---------------- 颜色映射（热力渐变） ---------------- */
const RAMP = [
  [0.00, [0.030, 0.045, 0.200]],
  [0.14, [0.115, 0.100, 0.480]],
  [0.30, [0.160, 0.320, 0.860]],
  [0.48, [0.090, 0.780, 0.620]],
  [0.64, [0.620, 0.900, 0.180]],
  [0.80, [1.000, 0.760, 0.120]],
  [1.00, [1.000, 0.220, 0.180]]
];
function rampColor(t) {
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  for (let i = 0; i < RAMP.length - 1; i++) {
    const a = RAMP[i], b = RAMP[i + 1];
    if (t <= b[0]) {
      const k = (t - a[0]) / (b[0] - a[0]);
      return [
        a[1][0] + (b[1][0] - a[1][0]) * k,
        a[1][1] + (b[1][1] - a[1][1]) * k,
        a[1][2] + (b[1][2] - a[1][2]) * k
      ];
    }
  }
  return RAMP[RAMP.length - 1][1].slice();
}

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x02030a, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02030a, 0.0018);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 4000);
const camTarget = new THREE.Vector3(0, 15, 0);

/* ---------------- 光点贴图 ---------------- */
function makeGlowTexture() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.20, 'rgba(255,255,255,0.92)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.34)');
  g.addColorStop(0.72, 'rgba(255,255,255,0.08)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const GLOW_TEX = makeGlowTexture();

/* ---------------- 星空 ---------------- */
(function buildStars() {
  const COUNT = 1200;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const u = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const r = 620 + Math.random() * 1400;
    const s = Math.sqrt(1 - u * u);
    pos[i * 3]     = r * s * Math.cos(th);
    pos[i * 3 + 1] = r * u;
    pos[i * 3 + 2] = r * s * Math.sin(th);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x8fb8ff, size: 1.7, map: GLOW_TEX,
    transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* ---------------- 构建适应度地形 ---------------- */
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, GRIDSEG, GRIDSEG);
terrainGeo.rotateX(-Math.PI / 2);

(function buildTerrain() {
  const pos = terrainGeo.attributes.position;
  const count = pos.count;
  const colArr = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const u = x / HALF;
    const v = z / HALF;
    const t = fitness(u, v);
    pos.setY(i, Math.pow(t, 1.05) * HEIGHT);
    const c = rampColor(Math.pow(t, 0.82));
    colArr[i * 3]     = c[0];
    colArr[i * 3 + 1] = c[1];
    colArr[i * 3 + 2] = c[2];
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
  terrainGeo.computeVertexNormals();
})();

const terrainMat = new THREE.MeshLambertMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  emissive: 0x0a1230,
  emissiveIntensity: 0.55
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrain);

/* 地形外侧微弱光晕底座 */
(function buildBase() {
  const g = new THREE.RingGeometry(TERRAIN_SIZE * 0.70, TERRAIN_SIZE * 0.95, 96, 1);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.MeshBasicMaterial({
    color: 0x1a5cff, transparent: true, opacity: 0.055,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring = new THREE.Mesh(g, m);
  ring.position.y = -0.5;
  scene.add(ring);
})();

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.AmbientLight(0x2c3e6e, 1.6));

const dirLight = new THREE.DirectionalLight(0xbcd8ff, 1.15);
dirLight.position.set(70, 130, 50);
scene.add(dirLight);

const dirLight2 = new THREE.DirectionalLight(0xff5588, 0.42);
dirLight2.position.set(-90, 45, -70);
scene.add(dirLight2);

const hemi = new THREE.HemisphereLight(0x5588ff, 0x120820, 0.5);
scene.add(hemi);

/* ---------------- 种群粒子系统（自定义着色器） ---------------- */
const ptsGeo = new THREE.BufferGeometry();
ptsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAXN * 3), 3));
ptsGeo.setAttribute('aColor',   new THREE.BufferAttribute(new Float32Array(MAXN * 3), 3));
ptsGeo.setAttribute('aSize',    new THREE.BufferAttribute(new Float32Array(MAXN), 1));

const ptsMat = new THREE.ShaderMaterial({
  uniforms: {
    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
    uTex: { value: GLOW_TEX }
  },
  vertexShader: `
    attribute vec3 aColor;
    attribute float aSize;
    uniform float uPixelRatio;
    varying vec3 vColor;
    void main() {
      vColor = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uPixelRatio * (420.0 / max(1.0, -mv.z));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying vec3 vColor;
    void main() {
      vec4 t = texture2D(uTex, gl_PointCoord);
      gl_FragColor = vec4(vColor, t.a);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true
});

const points = new THREE.Points(ptsGeo, ptsMat);
points.frustumCulled = false;
scene.add(points);

/* ---------------- 最优个体金色光晕 ---------------- */
const bestGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: GLOW_TEX,
  color: 0xffd24a,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false
}));
bestGlow.scale.set(18, 18, 1);
scene.add(bestGlow);

/* 第二层更小的核心星芒 */
const bestCore = new THREE.Sprite(new THREE.SpriteMaterial({
  map: GLOW_TEX,
  color: 0xfff6c0,
  transparent: true,
  opacity: 1,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false
}));
bestCore.scale.set(6, 6, 1);
scene.add(bestCore);

/* ---------------- 遗传算法核心 ---------------- */
let popSize  = 120;
let Pc       = 0.85;
let Pm       = 0.050;
let pop      = [];
let gen      = 0;
let hist     = [];
let bestEver = { fit: -1, u: 0, v: 0 };

function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

function initPop() {
  pop = [];
  for (let i = 0; i < popSize; i++) {
    const u = (Math.random() * 2 - 1) * 0.94;
    const v = (Math.random() * 2 - 1) * 0.94;
    const fit = fitness(u, v);
    pop.push({ u, v, cu: u, cv: v, fit });
  }
  gen = 0;
  hist = [];
  bestEver = { fit: -1, u: 0, v: 0 };
  updateStats(0, 0);
}

function evolve() {
  gen++;

  /* 评估 */
  for (let i = 0; i < pop.length; i++) {
    pop[i].fit = fitness(pop[i].u, pop[i].v);
  }

  /* 排序 */
  const sorted = pop.slice().sort((a, b) => b.fit - a.fit);
  const genBest = sorted[0];

  if (genBest.fit > bestEver.fit) {
    bestEver = { fit: genBest.fit, u: genBest.u, v: genBest.v };
  }

  let sum = 0;
  for (let i = 0; i < pop.length; i++) sum += pop[i].fit;
  const avg = sum / pop.length;

  hist.push({ best: genBest.fit, avg: avg });

  /* ---- 精英保留 ---- */
  const ELITE = Math.min(4, Math.max(1, Math.floor(popSize * 0.04)));
  const newPop = [];
  for (let i = 0; i < ELITE && i < sorted.length; i++) {
    newPop.push({
      u: sorted[i].u, v: sorted[i].v, fit: sorted[i].fit
    });
  }

  /* ---- 锦标赛选择 ---- */
  function tournament() {
    let best = null;
    for (let k = 0; k < 3; k++) {
      const c = pop[(Math.random() * pop.length) | 0];
      if (!best || c.fit > best.fit) best = c;
    }
    return best;
  }

  /* ---- 交叉 + 变异 ---- */
  let guard = 0;
  while (newPop.length < popSize && guard < 20000) {
    guard++;
    const p1 = tournament();
    const p2 = tournament();

    let u1 = p1.u, v1 = p1.v, u2 = p2.u, v2 = p2.v;

    if (Math.random() < Pc) {
      const a = Math.random() * 1.3 - 0.15;   // BLX 混合系数
      const nu1 = u1 * a + u2 * (1 - a);
      const nv1 = v1 * a + v2 * (1 - a);
      const nu2 = u2 * a + u1 * (1 - a);
      const nv2 = v2 * a + v1 * (1 - a);
      u1 = nu1; v1 = nv1; u2 = nu2; v2 = nv2;
    }

    if (Math.random() < Pm) { u1 += gauss() * 0.15; v1 += gauss() * 0.15; }
    if (Math.random() < Pm) { u2 += gauss() * 0.15; v2 += gauss() * 0.15; }

    u1 = clamp(u1, -0.985, 0.985); v1 = clamp(v1, -0.985, 0.985);
    u2 = clamp(u2, -0.985, 0.985); v2 = clamp(v2, -0.985, 0.985);

    newPop.push({ u: u1, v: v1, fit: fitness(u1, v1) });
    if (newPop.length < popSize) {
      newPop.push({ u: u2, v: v2, fit: fitness(u2, v2) });
    }
  }

  if (newPop.length > popSize) newPop.length = popSize;

  /* ---- 继承当前显示位置，实现平滑滑动 ---- */
  for (let i = 0; i < newPop.length; i++) {
    const old = pop[i % pop.length];
    newPop[i].cu = old.cu;
    newPop[i].cv = old.cv;
  }

  pop = newPop;

  updateStats(gen, bestEver.fit);
}

/* ---------------- 统计面板 ---------------- */
const genValEl = document.getElementById('gen-val');
const fitValEl = document.getElementById('fit-val');

function updateStats(g, bestFit) {
  genValEl.textContent = g;
  fitValEl.textContent = bestFit < 0 ? '0.0000' : bestFit.toFixed(4);
}

/* ---------------- 粒子更新 ---------------- */
let sceneTime = 0;

function updateParticles(dt) {
  const posArr  = ptsGeo.attributes.position.array;
  const colArr  = ptsGeo.attributes.aColor.array;
  const sizeArr = ptsGeo.attributes.aSize.array;

  let bestIdx = 0;
  let bestFit = -1;
  for (let i = 0; i < pop.length; i++) {
    if (pop[i].fit > bestFit) { bestFit = pop[i].fit; bestIdx = i; }
  }

  const lerpK = Math.min(1, dt * 7.5);

  for (let i = 0; i < pop.length; i++) {
    const p = pop[i];

    p.cu += (p.u - p.cu) * lerpK;
    p.cv += (p.v - p.cv) * lerpK;

    const fitNow = fitness(p.cu, p.cv);
    const nf = Math.min(1, Math.pow(fitNow, 0.72));

    posArr[i * 3]     = p.cu * HALF;
    posArr[i * 3 + 1] = fitNow * HEIGHT + 2.4;
    posArr[i * 3 + 2] = p.cv * HALF;

    let r, g, b;
    const isBest = (i === bestIdx);

    if (isBest) {
      r = 1.00; g = 0.88; b = 0.34;
    } else {
      r = 0.10 + 0.90 * nf;
      g = 0.85 - 0.30 * nf;
      b = 1.00 - 0.90 * nf;
    }

    const glow  = 0.34 + 0.66 * nf;
    const flick = 0.88 + 0.12 * Math.sin(sceneTime * 5.2 + i * 0.73);

    colArr[i * 3]     = r * glow * flick;
    colArr[i * 3 + 1] = g * glow * flick;
    colArr[i * 3 + 2] = b * glow * flick;

    sizeArr[i] = isBest ? 9.0 : (1.7 + 3.4 * nf);
  }

  /* 最优个体光晕 */
  const bp = pop[bestIdx];
  if (bp) {
    const bx = bp.cu * HALF;
    const by = fitness(bp.cu, bp.cv) * HEIGHT + 4.5;
    const bz = bp.cv * HALF;

    bestGlow.position.set(bx, by, bz);
    bestCore.position.set(bx, by, bz);

    const pulse = 1 + 0.26 * Math.sin(sceneTime * 6.5);
    const pulse2 = 1 + 0.45 * Math.sin(sceneTime * 6.5 + 1.1);

    bestGlow.scale.set(20 * pulse, 20 * pulse, 1);
    bestGlow.material.opacity = 0.52 + 0.34 * Math.sin(sceneTime * 6.5);

    bestCore.scale.set(7 * pulse2, 7 * pulse2, 1);
    bestCore.material.opacity = 0.75 + 0.25 * Math.sin(sceneTime * 8.2);
  }

  ptsGeo.setDrawRange(0, pop.length);
  ptsGeo.attributes.position.needsUpdate = true;
  ptsGeo.attributes.aColor.needsUpdate = true;
  ptsGeo.attributes.aSize.needsUpdate = true;
}

/* ---------------- 进化曲线图表 ---------------- */
const chartCanvas = document.getElementById('chart');
const chartCtx = chartCanvas.getContext('2d');
const CH_W = 268, CH_H = 126;

function resizeChart() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  chartCanvas.width  = CH_W * dpr;
  chartCanvas.height = CH_H * dpr;
  chartCanvas.style.width  = CH_W + 'px';
  chartCanvas.style.height = CH_H + 'px';
  chartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeChart();

function drawChart() {
  const ctx = chartCtx;
  const padL = 28, padR = 10, padT = 20, padB = 18;
  const pw = CH_W - padL - padR;
  const ph = CH_H - padT - padB;

  ctx.clearRect(0, 0, CH_W, CH_H);

  /* 标题 */
  ctx.font = '10px Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(160,220,255,0.75)';
  ctx.fillText('适应度进化曲线', 10, 13);

  /* 网格 */
  ctx.strokeStyle = 'rgba(90,160,255,0.14)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + ph * i / 4;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + pw, y);
    ctx.stroke();
  }
  for (let i = 0; i <= 5; i++) {
    const x = padL + pw * i / 5;
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + ph);
    ctx.stroke();
  }

  /* y 轴刻度 */
  ctx.font = '8.5px Consolas, monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(150,200,255,0.5)';
  for (let i = 0; i <= 4; i++) {
    const y = padT + ph * i / 4;
    ctx.fillText((1 - i / 4).toFixed(2), padL - 5, y + 3);
  }

  /* x 轴刻度 */
  ctx.textAlign = 'center';
  for (let i = 0; i <= 5; i++) {
    const x = padL + pw * i / 5;
    ctx.fillText(String(Math.round(i * 6)), x, padT + ph + 12);
  }

  if (hist.length < 1) return;

  const maxGen = 30;

  /* 平均适应度曲线 */
  ctx.beginPath();
  for (let i = 0; i < hist.length; i++) {
    const x = padL + pw * Math.min(1, i / maxGen);
    const y = padT + ph * (1 - hist[i].avg);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(80,200,255,0.55)';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  /* 最佳适应度曲线 */
  ctx.beginPath();
  for (let i = 0; i < hist.length; i++) {
    const x = padL + pw * Math.min(1, i / maxGen);
    const y = padT + ph * (1 - hist[i].best);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(255,214,80,0.95)';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(255,205,70,0.9)';
  ctx.shadowBlur = 9;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 终点高亮 */
  const last = hist[hist.length - 1];
  const lx = padL + pw * Math.min(1, (hist.length - 1) / maxGen);
  const ly = padT + ph * (1 - last.best);
  ctx.beginPath();
  ctx.arc(lx, ly, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe27a';
  ctx.shadowColor = 'rgba(255,220,90,1)';
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;

  /* 图例 */
  ctx.font = '8.5px Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,214,80,0.9)';
  ctx.fillText('— best', padL + 4, padT + 9);
  ctx.fillStyle = 'rgba(90,200,255,0.75)';
  ctx.fillText('— avg', padL + 50, padT + 9);
}

/* ---------------- 顶部文字 ---------------- */
const FULL_TEXT =
  '启示：遗传算法通过模仿自然进化“优胜劣汰、适者生存、遗传变异”机制搜索最优解的过程启示我们：进步源于选择压力下的持续变异与淘汰——坚持“适应性改进”、勇于尝试变异创新，方能在复杂环境中找到最优解。';

const textEl = document.getElementById('ga-text');
const CHARS = Array.from(FULL_TEXT);
const SPANS = [];

(function buildText() {
  for (let i = 0; i < CHARS.length; i++) {
    const s = document.createElement('span');
    s.textContent = CHARS[i];
    s.style.opacity = '0';
    s._o = -1;
    textEl.appendChild(s);
    SPANS.push(s);
  }
})();

function updateText(t) {
  const total = CHARS.length;
  const reveal = Math.min(total, (t / TEXT_FULL) * total);
  for (let i = 0; i < total; i++) {
    let o = reveal - i;
    if (o < 0) o = 0; else if (o > 1) o = 1;
    o = Math.round(o * 10) / 10;
    if (SPANS[i]._o !== o) {
      SPANS[i].style.opacity = o;
      SPANS[i]._o = o;
    }
  }
}

/* ---------------- 相机交互 ---------------- */
const cam = {
  theta: 0.95,
  phi: 1.02,
  dist: 215,
  targetDist: 215
};

let dragging = false;
let lastX = 0, lastY = 0;
let downX = 0, downY = 0;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = downX = e.clientX;
  lastY = downY = e.clientY;
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
});

window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  cam.theta -= dx * 0.0055;
  cam.phi   -= dy * 0.0055;
  cam.phi = Math.max(0.16, Math.min(Math.PI * 0.52, cam.phi));
});

window.addEventListener('pointerup', () => { dragging = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 0.89;
  cam.targetDist = Math.max(45, Math.min(520, cam.targetDist * k));
}, { passive: false });

/* 双指缩放 */
let pinchDist = 0;
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      cam.targetDist = Math.max(45, Math.min(520, cam.targetDist * (pinchDist / d)));
    }
    pinchDist = d;
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { pinchDist = 0; });

/* ---------------- 控制条 ---------------- */
const btnPlay  = document.getElementById('btn-play');
const btnReset = document.getElementById('btn-reset');
const slPm     = document.getElementById('sl-pm');
const slN      = document.getElementById('sl-n');
const valPm    = document.getElementById('val-pm');
const valN     = document.getElementById('val-n');

let running = true;

btnPlay.addEventListener('click', () => {
  running = !running;
  btnPlay.textContent = running ? '暂停' : '继续';
});

btnReset.addEventListener('click', () => {
  sceneTime = 0;
  initPop();
  updateText(0);
  if (!running) { running = true; btnPlay.textContent = '暂停'; }
});

slPm.addEventListener('input', () => {
  Pm = parseInt(slPm.value, 10) / 1000;
  valPm.textContent = Pm.toFixed(3);
});

slN.addEventListener('input', () => {
  popSize = parseInt(slN.value, 10);
  valN.textContent = popSize;
  /* 实时调整种群数量 */
  if (pop.length > 0) {
    while (pop.length < popSize) {
      const base = pop[(Math.random() * pop.length) | 0];
      const u = clamp(base.u + gauss() * 0.12, -0.985, 0.985);
      const v = clamp(base.v + gauss() * 0.12, -0.985, 0.985);
      pop.push({ u, v, cu: base.cu, cv: base.cv, fit: fitness(u, v) });
    }
    if (pop.length > popSize) {
      pop.sort((a, b) => b.fit - a.fit);
      pop.length = popSize;
    }
  }
});

/* ---------------- 场景重置 ---------------- */
function resetScene() {
  sceneTime = 0;
  initPop();
  updateText(0);
}

/* ---------------- 主循环 ---------------- */
let lastTime = performance.now();
let genTimer = 0;
const progressEl = document.getElementById('progress');

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  if (running) {
    sceneTime += dt;

    if (sceneTime >= LOOP_TIME) {
      sceneTime -= LOOP_TIME;
      resetScene();
    }

    /* 进化节奏 */
    genTimer += dt;
    if (genTimer >= GEN_TIME) {
      genTimer -= GEN_TIME;
      evolve();
    }

    updateParticles(dt);
  }

  /* 相机 */
  if (!dragging) cam.theta += dt * 0.052;
  cam.dist += (cam.targetDist - cam.dist) * 0.085;

  camera.position.set(
    camTarget.x + cam.dist * Math.sin(cam.phi) * Math.cos(cam.theta),
    camTarget.y + cam.dist * Math.cos(cam.phi),
    camTarget.z + cam.dist * Math.sin(cam.phi) * Math.sin(cam.theta)
  );
  camera.lookAt(camTarget);

  /* 文字与图表 */
  updateText(sceneTime);
  drawChart();

  /* 进度条 */
  progressEl.style.width = ((sceneTime / LOOP_TIME) * 100).toFixed(2) + '%';

  renderer.render(scene, camera);
}

/* ---------------- 启动 ---------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  ptsMat.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
  resizeChart();
});

initPop();
updateText(0);
drawChart();
animate();
</script>
