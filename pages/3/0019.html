<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电磁场之舞 · Electromagnetic Dance</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02030a;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;}

  /* ---------- 暗角 ---------- */
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 48%,
      transparent 24%,
      rgba(2,3,10,.36) 60%,
      rgba(1,1,5,.88) 100%);
  }

  /* ---------- 界面 ---------- */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:38px 46px;
    opacity:0;animation:fade 2.0s .5s ease forwards;
  }
  #title h1{
    font-size:clamp(18px,2.4vw,30px);
    font-weight:200;
    letter-spacing:.44em;text-indent:.44em;
    background:linear-gradient(96deg,#ffd27a 0%,#ff9a6a 32%,#6ee7ff 68%,#a080ff 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 28px rgba(255,170,100,.36));
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(200,170,120,.32);
    margin-bottom:14px;
  }
  #title .sub{
    font-size:10.5px;letter-spacing:.20em;line-height:1.9;
    color:rgba(160,180,230,.26);font-weight:300;
  }

  /* ---------- 左下：麦克斯韦方程组 ---------- */
  #formula{
    position:absolute;bottom:0;left:0;
    padding:0 46px 34px;
    opacity:0;animation:fade 2.0s 1.2s ease forwards;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:clamp(9px,1.0vw,11.5px);
    line-height:2.05;
    letter-spacing:.02em;
    color:rgba(160,175,220,.28);
    max-width:min(700px,84vw);
  }
  #formula .lab{
    display:block;font-size:8px;
    letter-spacing:.44em;text-indent:.44em;
    color:rgba(140,150,200,.20);
    margin-bottom:10px;
  }
  #formula .kw{color:rgba(255,210,130,.55);}
  #formula .fn{color:rgba(110,230,255,.52);}
  #formula .nm{color:rgba(200,170,255,.58);}
  #formula .op{color:rgba(150,180,220,.26);}
  #formula .cm{color:rgba(120,140,190,.20);font-style:italic;}

  /* ---------- 右下 ---------- */
  #hint{
    position:absolute;bottom:0;right:0;
    padding:0 46px 34px;
    text-align:right;
    opacity:0;animation:fade 2.0s 1.5s ease forwards;
  }
  #hint .big{
    font-size:clamp(9.5px,1.0vw,12px);
    letter-spacing:.32em;text-indent:.32em;
    color:rgba(255,200,140,.40);
    margin-bottom:10px;font-weight:300;
  }
  #hint .small{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.20em;
    color:rgba(140,165,215,.22);
    line-height:1.9;
  }
  #hint .key{
    display:inline-block;
    padding:1px 6px;margin:0 2px;
    border:1px solid rgba(140,165,215,.18);
    border-radius:3px;
    color:rgba(200,220,255,.42);
  }
  #hint .pos{color:rgba(255,190,110,.60);}
  #hint .neg{color:rgba(110,220,255,.60);}

  @keyframes fade{to{opacity:1;}}

  @media (max-width:680px){
    #title{padding:20px 20px;}
    #formula{padding:0 20px 18px;font-size:8px;}
    #hint{padding:0 20px 18px;}
    #hint .small{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="ui">
  <div id="title">
    <h1>电磁场之舞</h1>
    <div class="en">ELECTROMAGNETIC DANCE</div>
    <div class="sub">库仑场线追踪 · 洛伦兹力驱动 · 磁场环成像</div>
  </div>

  <div id="formula">
    <span class="lab">MAXWELL'S EQUATIONS</span>
    <span class="fn">∇·E</span> <span class="op">=</span> <span class="nm">ρ/ε₀</span>
    &nbsp;&nbsp;<span class="cm">// 高斯定律</span><br>
    <span class="fn">∇×B</span> <span class="op">=</span> <span class="nm">μ₀J</span> <span class="op">+</span> <span class="nm">μ₀ε₀ ∂E/∂t</span>
    &nbsp;&nbsp;<span class="cm">// 安培-麦克斯韦</span><br>
    <span class="fn">E</span> <span class="op">=</span> <span class="nm">k·q·r̂/r²</span>
    &nbsp;&nbsp;<span class="cm">// 库仑场</span><br>
    <span class="fn">B</span> <span class="op">∝</span> <span class="nm">q(v×r̂)/r²</span>
    &nbsp;&nbsp;<span class="cm">// 运动电荷磁场</span>
  </div>

  <div id="hint">
    <div class="big">触碰电荷 感受场力</div>
    <div class="small">
      <span class="pos">+ 正电荷</span> &nbsp; <span class="neg">− 负电荷</span><br>
      <span class="key">点击</span> 注入新电荷<br>
      <span class="key">空格</span> 重置系统
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 基础
   ========================================================= */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha:false });
const TAU    = Math.PI * 2;

let W = 0, H = 0, DPR = 1;

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                 window.innerWidth < 720;

/* =========================================================
   1. 参数
   ========================================================= */
const N_CHARGE  = isMobile ? 4 : 6;
const LINES_PER = isMobile ? 10 : 14;
const MAX_STEPS = isMobile ? 110 : 150;
const STEP      = isMobile ? 6 : 5;

const K_FORCE   = 1.8e7;    // 电荷间库仑力常数
const SOFT_R2   = 10000;    // 力的软化半径²
const DAMPING   = 0.9995;   // 速度阻尼

const K_FIELD   = 50000;    // 场线追踪的场强常数
const FIELD_SOFT = 80;      // 场线追踪的软化

/* 电荷半径 */
const CORE_R = isMobile ? 9 : 11;

/* =========================================================
   2. 状态
   ========================================================= */
let charges = [];
let mouse   = { x: -999, y: -999, down: false };

const rand = (a, b) => a + Math.random() * (b - a);

/* =========================================================
   3. 尺寸
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   4. 初始化电荷
   ========================================================= */
function initCharges(){
  charges = [];

  for (let i = 0; i < N_CHARGE; i++){
    /* 交替正负 */
    const q = (i % 2 === 0) ? 1 : -1;

    /* 拒绝采样：避免初始重叠 */
    let x, y, ok = false;
    for (let att = 0; att < 60 && !ok; att++){
      x = W * rand(0.16, 0.84);
      y = H * rand(0.14, 0.86);

      ok = true;
      for (const c of charges){
        const dx = x - c.x, dy = y - c.y;
        if (dx * dx + dy * dy < 150 * 150){ ok = false; break; }
      }
    }

    charges.push({
      x, y,
      vx: rand(-90, 90),
      vy: rand(-90, 90),
      q,
      hue: q > 0 ? 35 : 200,
      phase: Math.random() * TAU,
      flash: 0
    });
  }
}

/* =========================================================
   5. 物理步进 —— 库仑力
   ========================================================= */
function stepPhysics(dt){
  const n = charges.length;

  /* ---------- 计算加速度 ---------- */
  for (let i = 0; i < n; i++){
    const a = charges[i];
    let ax = 0, ay = 0;

    for (let j = 0; j < n; j++){
      if (i === j) continue;
      const b = charges[j];

      const dx = a.x - b.x;
      const dy = a.y - b.y;

      const d2 = dx * dx + dy * dy + SOFT_R2;
      const d  = Math.sqrt(d2);

      /* F = k·q₁q₂·r̂/r²  →  a = k·q₁q₂·dx/(d²·d) */
      const f = K_FORCE * a.q * b.q / (d2 * d);

      ax += dx * f;
      ay += dy * f;
    }

    /* 轻微随机扰动，保持运动 */
    ax += (Math.random() - 0.5) * 30;
    ay += (Math.random() - 0.5) * 30;

    a.vx += ax * dt;
    a.vy += ay * dt;
  }

  /* ---------- 更新位置 ---------- */
  for (let i = 0; i < n; i++){
    const c = charges[i];

    c.vx *= DAMPING;
    c.vy *= DAMPING;

    /* 限制极速 */
    const sp = Math.hypot(c.vx, c.vy);
    if (sp > 420){
      c.vx = c.vx / sp * 420;
      c.vy = c.vy / sp * 420;
    }

    c.x += c.vx * dt;
    c.y += c.vy * dt;

    /* ---------- 边界反弹 ---------- */
    const M = CORE_R + 6;

    if (c.x < M){ c.x = M; c.vx = Math.abs(c.vx) * 0.88; }
    if (c.x > W - M){ c.x = W - M; c.vx = -Math.abs(c.vx) * 0.88; }
    if (c.y < M){ c.y = M; c.vy = Math.abs(c.vy) * 0.88; }
    if (c.y > H - M){ c.y = H - M; c.vy = -Math.abs(c.vy) * 0.88; }

    /* ---------- 鼠标吸引 ---------- */
    if (mouse.down){
      const dx = mouse.x - c.x;
      const dy = mouse.y - c.y;
      const d2 = dx * dx + dy * dy + 3000;
      const d  = Math.sqrt(d2);
      const f  = 260000 / (d2 * d);

      c.vx += dx * f * dt;
      c.vy += dy * f * dt;
    }

    /* ---------- 闪光衰减 ---------- */
    if (c.flash > 0) c.flash -= dt;

    /* ---------- 相位推进 ---------- */
    c.phase += dt * 0.25;
  }
}

/* =========================================================
   6. 场线追踪
   ========================================================= */
function traceLine(sx, sy){
  const pts = [];
  let x = sx, y = sy;

  const n = charges.length;

  for (let i = 0; i < MAX_STEPS; i++){
    pts.push(x, y);

    /* ---------- 叠加所有电荷的库仑场 ---------- */
    let ex = 0, ey = 0;
    for (let k = 0; k < n; k++){
      const c = charges[k];
      const dx = x - c.x;
      const dy = y - c.y;

      const d2 = dx * dx + dy * dy + FIELD_SOFT;
      const d  = Math.sqrt(d2);

      const f = c.q * K_FIELD / (d2 * d);

      ex += dx * f;
      ey += dy * f;
    }

    const mag = Math.sqrt(ex * ex + ey * ey);
    if (mag < 1e-12) break;

    /* ---------- 沿场方向前进 ---------- */
    x += ex / mag * STEP;
    y += ey / mag * STEP;

    /* ---------- 超出边界 ---------- */
    if (x < -50 || x > W + 50 || y < -50 || y > H + 50) break;

    /* ---------- 落入负电荷 ---------- */
    let hit = false;
    for (let k = 0; k < n; k++){
      const c = charges[k];
      if (c.q >= 0) continue;

      const dx = x - c.x;
      const dy = y - c.y;
      if (dx * dx + dy * dy < (CORE_R + 3) * (CORE_R + 3)){
        hit = true;
        break;
      }
    }
    if (hit){ pts.push(x, y); break; }
  }

  return pts;
}

/* =========================================================
   7. 渲染 —— 磁场环
   ========================================================= */
function drawMagneticRings(){
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < charges.length; i++){
    const c = charges[i];
    const speed = Math.hypot(c.vx, c.vy);
    if (speed < 30) continue;

    const sf = Math.min(1, speed / 380);
    const ang = Math.atan2(c.vy, c.vx);

    const rings = 3;
    for (let k = 0; k < rings; k++){
      const r = CORE_R + 16 + k * 16;
      const a = sf * 0.30 * (1 - k / (rings + 0.5));

      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(ang);

      /* 垂直于速度方向压扁 —— 伪 3D 磁场环 */
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.42, r, 0, 0, TAU);
      ctx.strokeStyle = 'hsla(' + c.hue + ',100%,72%,' + a.toFixed(3) + ')';
      ctx.lineWidth = 1.1;
      ctx.stroke();

      ctx.restore();
    }
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   8. 渲染 —— 电场线
   ========================================================= */
function drawFieldLines(){
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  for (let ci = 0; ci < charges.length; ci++){
    const c = charges[ci];
    if (c.q <= 0) continue;      // 只从正电荷发出

    const hue = c.hue;

    /* ---------- 收集所有线的路径 ---------- */
    const paths = [];

    for (let i = 0; i < LINES_PER; i++){
      const a  = (i / LINES_PER) * TAU + c.phase;
      const sx = c.x + Math.cos(a) * (CORE_R + 3);
      const sy = c.y + Math.sin(a) * (CORE_R + 3);

      const pts = traceLine(sx, sy);
      if (pts.length >= 6) paths.push(pts);
    }

    /* ---------- 第一遍：柔光 ---------- */
    ctx.beginPath();
    for (const pts of paths){
      ctx.moveTo(pts[0], pts[1]);
      for (let k = 2; k < pts.length; k += 2){
        ctx.lineTo(pts[k], pts[k + 1]);
      }
    }
    ctx.strokeStyle = 'hsla(' + hue + ',100%,60%,0.045)';
    ctx.lineWidth = 5.5;
    ctx.stroke();

    /* ---------- 第二遍：主线 ---------- */
    ctx.beginPath();
    for (const pts of paths){
      ctx.moveTo(pts[0], pts[1]);
      for (let k = 2; k < pts.length; k += 2){
        ctx.lineTo(pts[k], pts[k + 1]);
      }
    }
    ctx.strokeStyle = 'hsla(' + hue + ',100%,72%,0.34)';
    ctx.lineWidth = 1.0;
    ctx.stroke();

    /* ---------- 第三遍：高光芯 ---------- */
    ctx.beginPath();
    for (const pts of paths){
      ctx.moveTo(pts[0], pts[1]);
      for (let k = 2; k < pts.length; k += 2){
        ctx.lineTo(pts[k], pts[k + 1]);
      }
    }
    ctx.strokeStyle = 'hsla(' + hue + ',100%,92%,0.14)';
    ctx.lineWidth = 0.35;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   9. 渲染 —— 电荷本体
   ========================================================= */
function drawCharges(){
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < charges.length; i++){
    const c = charges[i];
    const flash = Math.max(0, c.flash);

    /* ---------- 外层辉光 ---------- */
    const glowR = CORE_R * (5.0 + flash * 2.5);

    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, glowR);
    g.addColorStop(0.00, 'hsla(' + c.hue + ',100%,' +
                     (74 + flash * 22) + '%,' + (0.62 + flash * 0.32) + ')');
    g.addColorStop(0.18, 'hsla(' + c.hue + ',100%,62%,' +
                     (0.28 + flash * 0.28) + ')');
    g.addColorStop(0.48, 'hsla(' + c.hue + ',100%,52%,0.09)');
    g.addColorStop(1.00, 'hsla(' + c.hue + ',100%,50%,0)');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(c.x, c.y, glowR, 0, TAU);
    ctx.fill();

    /* ---------- 实体核心 ---------- */
    const core = ctx.createRadialGradient(
      c.x - CORE_R * 0.32, c.y - CORE_R * 0.34, 0,
      c.x, c.y, CORE_R
    );
    core.addColorStop(0.00, 'rgba(255,255,255,' + (0.92 + flash * 0.08) + ')');
    core.addColorStop(0.34, 'hsla(' + c.hue + ',100%,84%,0.88)');
    core.addColorStop(0.80, 'hsla(' + c.hue + ',100%,56%,0.62)');
    core.addColorStop(1.00, 'hsla(' + c.hue + ',100%,44%,0.24)');

    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(c.x, c.y, CORE_R, 0, TAU);
    ctx.fill();

    /* ---------- 边缘高光 ---------- */
    ctx.beginPath();
    ctx.arc(c.x, c.y, CORE_R, 0, TAU);
    ctx.strokeStyle = 'hsla(' + c.hue + ',100%,90%,' +
                      (0.42 + flash * 0.50) + ')';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    /* ---------- 符号 ---------- */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(10, 8, 20, 0.82)';
    ctx.font = 'bold ' + Math.round(CORE_R * 1.42) +
               'px "Helvetica Neue", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.q > 0 ? '+' : '−', c.x, c.y + CORE_R * 0.06);
    ctx.globalCompositeOperation = 'lighter';
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   10. 渲染 —— 主帧
   ========================================================= */
function render(){
  /* ---------- 清屏：极浅拖尾 ---------- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(2, 3, 10, 0.36)';
  ctx.fillRect(0, 0, W, H);

  /* ---------- 磁场环 ---------- */
  drawMagneticRings();

  /* ---------- 电场线 ---------- */
  drawFieldLines();

  /* ---------- 电荷 ---------- */
  drawCharges();
}

/* =========================================================
   11. 主循环
   ========================================================= */
let lastTS = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastTS){ lastTS = now; return; }

  let dt = (now - lastTS) / 1000;
  lastTS = now;

  if (dt > 0.06) dt = 0.06;
  if (dt < 0)    dt = 0;

  stepPhysics(dt);
  render();
}

/* =========================================================
   12. 交互
   ========================================================= */
canvas.addEventListener('pointerdown', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.down = true;

  /* 点击附近电荷 → 闪一下并踢它一脚 */
  let hit = false;
  for (const c of charges){
    const dx = e.clientX - c.x;
    const dy = e.clientY - c.y;
    if (dx * dx + dy * dy < 40 * 40){
      c.flash = 0.42;
      c.vx += dx * 2.4;
      c.vy += dy * 2.4;
      hit = true;
      break;
    }
  }

  /* 空白处点击 → 注入新电荷 */
  if (!hit){
    const sign = charges.filter(c => c.q > 0).length <=
                 charges.filter(c => c.q < 0).length ? 1 : -1;
    charges.push({
      x: e.clientX,
      y: e.clientY,
      vx: rand(-60, 60),
      vy: rand(-60, 60),
      q: sign,
      hue: sign > 0 ? 35 : 200,
      phase: Math.random() * TAU,
      flash: 0.5
    });

    /* 上限保护 */
    if (charges.length > 12) charges.shift();
  }
});

canvas.addEventListener('pointermove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('pointerup', () => { mouse.down = false; });
canvas.addEventListener('pointerleave', () => { mouse.down = false; });

/* 空格重置 */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){
    e.preventDefault();
    initCharges();
  }
});

/* =========================================================
   13. 启动
   ========================================================= */
resize();
initCharges();

ctx.fillStyle = '#02030a';
ctx.fillRect(0, 0, W, H);

requestAnimationFrame(loop);

})();
</script>
</body>
</html>
