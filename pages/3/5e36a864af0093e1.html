<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四元数编织空间 · 代数与几何的交响</title>
    <style>
        :root {
            --bg: #050513;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }
        #title-overlay {
            top: clamp(12px, 3.5vh, 36px);
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.0vw, 1.45rem);
            font-weight: 400;
            letter-spacing: 0.10em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(190, 165, 140, 0.5), 0 0 6px rgba(170, 148, 125, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.60rem, 1.10vw, 0.76rem);
            font-weight: 300;
            letter-spacing: 0.06em;
            color: rgba(200, 192, 180, 0.7);
            margin-top: 0.2em;
            text-shadow: 0 0 13px rgba(155, 140, 120, 0.3);
        }
        #formula-overlay {
            bottom: clamp(14px, 3.5vh, 40px);
        }
        #formula-overlay .formula {
            font-size: clamp(0.42rem, 0.75vw, 0.60rem);
            font-style: italic;
            letter-spacing: 0.03em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(155, 140, 125, 0.42), 0 0 5px rgba(165, 148, 130, 0.28);
            line-height: 1.6;
            background: rgba(10, 9, 16, 0.46);
            padding: 0.30em 1.0em;
            border-radius: 2em;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(145, 125, 105, 0.20);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula {
                padding: 0.16em 0.40em;
                letter-spacing: 0.02em;
                font-size: 0.32rem;
            }
            #title-overlay .title {
                letter-spacing: 0.06em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <div class="title">四元数编织空间 · 代数与几何的交响</div>
        <div class="subtitle">Quaternion Woven Curves — Algebraic Fiber Art</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula">
            q(t) = e^{i a t} e^{j b t} e^{k c t}
            &emsp;|&emsp; Im(q) = (x,y,z) , t ∈ [0, 2π]
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        const CURVE_SEGMENTS = 720;
        const TOTAL_VERTICES = CURVE_SEGMENTS + 1;
        const SPHERE_R = 1.65;

        // ==================== 三种颜色 ====================
        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');
        const THREE_COLORS = [COLOR_WARM_GOLD, COLOR_ROSE, COLOR_CYAN];

        // 四元数指数映射 exp(axis * angle) = cos(angle) + sin(angle) * axis
        function quatExp(axisVec, angle) {
            const half = angle; // 我们的参数角度就是全角，用 setFromAxisAngle(axis, 2*angle) 得到 exp(angle * axis)
            const q = new THREE.Quaternion();
            q.setFromAxisAngle(axisVec, 2 * half);
            return q;
        }

        // 根据 (a,b,c) 生成闭合曲线点，以四元数乘积的虚部作为坐标
        function generateQuaternionCurve(a, b, c, scale = 1.4) {
            const i = new THREE.Vector3(1, 0, 0);
            const j = new THREE.Vector3(0, 1, 0);
            const k = new THREE.Vector3(0, 0, 1);
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            for (let idx = 0; idx <= CURVE_SEGMENTS; idx++) {
                const t = (idx / CURVE_SEGMENTS) * Math.PI * 2;
                const qa = quatExp(i, a * t);
                const qb = quatExp(j, b * t);
                const qc = quatExp(k, c * t);
                const q = qa.multiply(qb).multiply(qc);
                positions[idx * 3] = q.x * scale;
                positions[idx * 3 + 1] = q.y * scale;
                positions[idx * 3 + 2] = q.z * scale;
            }
            return positions;
        }

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050513, 0.00007);

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.35, 17);
        camera.position.set(0.6, 0.75, 3.9);
        camera.lookAt(0, 0.02, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 200;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 3.6 + Math.random() * 4.8;
            starPosArr[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phi) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xb6afc6, size: 0.009, transparent: true, opacity: 0.26, depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        starsGroup.add(new THREE.Points(starGeom, starMat));

        // ==================== 漂浮光点 ====================
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 80;
        const glowArr = new Float32Array(glowCount * 3);
        const phiGold = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < glowCount; i++) {
            const y = 1 - (i / (glowCount - 1)) * 2;
            const rAtY = Math.sqrt(1 - y * y);
            const theta = phiGold * i;
            glowArr[i * 3] = Math.cos(theta) * rAtY * SPHERE_R;
            glowArr[i * 3 + 1] = y * SPHERE_R;
            glowArr[i * 3 + 2] = Math.sin(theta) * rAtY * SPHERE_R;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e4cc, size: 0.019, transparent: true, opacity: 0.44, depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        glowGroup.add(new THREE.Points(glowGeom, glowMat));

        // ==================== 参考球体线框 ====================
        const sphereWireGroup = new THREE.Group();
        mainGroup.add(sphereWireGroup);
        const sphereWireMats = [];

        function createLatLine(phi) {
            const pts = [];
            const r = Math.sin(phi) * SPHERE_R;
            const y = Math.cos(phi) * SPHERE_R;
            for (let i = 0; i <= 240; i++) {
                const th = (i / 240) * Math.PI * 2;
                pts.push(new THREE.Vector3(r * Math.cos(th), y, r * Math.sin(th)));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({ color: 0x3a3650, transparent: true, opacity: 0.12, depthWrite: false });
            sphereWireMats.push(m);
            return new THREE.Line(g, m);
        }
        function createLongLine(theta) {
            const pts = [];
            for (let i = 0; i <= 200; i++) {
                const phi = (i / 200) * Math.PI;
                pts.push(new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * SPHERE_R,
                    Math.cos(phi) * SPHERE_R,
                    Math.sin(phi) * Math.sin(theta) * SPHERE_R
                ));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({ color: 0x3a3650, transparent: true, opacity: 0.12, depthWrite: false });
            sphereWireMats.push(m);
            return new THREE.Line(g, m);
        }
        for (let i = 1; i <= 9; i++) sphereWireGroup.add(createLatLine((i / 10) * Math.PI));
        for (let i = 0; i < 18; i++) sphereWireGroup.add(createLongLine((i / 18) * Math.PI * 2));
        {
            const eqPts = [];
            for (let i = 0; i <= 280; i++) {
                const th = (i / 280) * Math.PI * 2;
                eqPts.push(new THREE.Vector3(Math.cos(th) * SPHERE_R, 0, Math.sin(th) * SPHERE_R));
            }
            const eqG = new THREE.BufferGeometry().setFromPoints(eqPts);
            const eqM = new THREE.LineBasicMaterial({ color: 0x58527a, transparent: true, opacity: 0.17, depthWrite: false });
            sphereWireMats.push(eqM);
            sphereWireGroup.add(new THREE.Line(eqG, eqM));
        }

        // ==================== 四元数曲线生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        function createQuaternionLine(a, b, c, rotationQuat, color) {
            const rawPositions = generateQuaternionCurve(a, b, c);
            const v = new THREE.Vector3();
            for (let i = 0; i < rawPositions.length; i += 3) {
                v.set(rawPositions[i], rawPositions[i + 1], rawPositions[i + 2]);
                v.applyQuaternion(rotationQuat);
                rawPositions[i] = v.x;
                rawPositions[i + 1] = v.y;
                rawPositions[i + 2] = v.z;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(rawPositions, 3));
            geometry.setDrawRange(0, 0);
            const material = new THREE.LineBasicMaterial({
                color: color, transparent: true, opacity: 0.85, depthWrite: false,
            });
            const line = new THREE.Line(geometry, material);
            allCurveData.push({ geometry, totalVertices: TOTAL_VERTICES });
            return line;
        }

        const numCurvesPerColor = 6;
        const totalCurves = numCurvesPerColor * 3;

        // 斐波那契球面分布18个方向
        const directions = [];
        const phiGolden2 = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < totalCurves; i++) {
            const yNorm = 1 - (i / (totalCurves - 1)) * 2;
            const rAtY = Math.sqrt(1 - yNorm * yNorm);
            const theta = phiGolden2 * i;
            directions.push(new THREE.Vector3(Math.cos(theta) * rAtY, yNorm, Math.sin(theta) * rAtY).normalize());
        }

        const zAxis = new THREE.Vector3(0, 0, 1);

        // 三组频率 (a,b,c)
        const goldFreq = [
            [1, 1, 2],
            [1, 2, 3],
            [2, 3, 4],
            [1, 3, 5],
            [3, 4, 5],
            [2, 5, 7]
        ];
        const roseFreq = [
            [1, 2, 5],
            [2, 4, 5],
            [3, 5, 7],
            [1, 4, 7],
            [2, 3, 8],
            [5, 6, 7]
        ];
        const cyanFreq = [
            [1, 5, 7],
            [2, 7, 9],
            [4, 5, 9],
            [5, 7, 8],
            [3, 7, 10],
            [7, 8, 13]
        ];

        // 金色曲线
        for (let i = 0; i < numCurvesPerColor; i++) {
            const [a, b, c] = goldFreq[i];
            const quat = new THREE.Quaternion().setFromUnitVectors(zAxis, directions[i]);
            curvesGroup.add(createQuaternionLine(a, b, c, quat, COLOR_WARM_GOLD));
        }
        // 玫瑰粉曲线
        for (let i = 0; i < numCurvesPerColor; i++) {
            const [a, b, c] = roseFreq[i];
            const quat = new THREE.Quaternion().setFromUnitVectors(zAxis, directions[numCurvesPerColor + i]);
            curvesGroup.add(createQuaternionLine(a, b, c, quat, COLOR_ROSE));
        }
        // 青蓝曲线
        for (let i = 0; i < numCurvesPerColor; i++) {
            const [a, b, c] = cyanFreq[i];
            const quat = new THREE.Quaternion().setFromUnitVectors(zAxis, directions[2 * numCurvesPerColor + i]);
            curvesGroup.add(createQuaternionLine(a, b, c, quat, COLOR_CYAN));
        }

        const curveCount = allCurveData.length;

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        clock.getDelta(); // 消耗初始累积

        function getCycleTime() {
            return (performance.now() / 1000 - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(clock.getDelta(), 0.1);

            mainGroup.rotation.y += 0.24 * dt;
            mainGroup.rotation.x += 0.058 * dt;
            mainGroup.rotation.z += 0.014 * Math.sin(cycleTime * 0.56) * dt;

            const sway = 0.09 * Math.sin(cycleTime * (Math.PI * 2 / 34));
            camera.position.y = 0.75 + sway;
            camera.lookAt(0, 0.02, 0);

            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.26 * bgOp;
            glowMat.opacity = 0.44 * bgOp;
            for (const mat of sphereWireMats) {
                mat.opacity = (mat.opacity ?? 0.12) * bgOp;
            }

            glowGroup.position.y = Math.sin(cycleTime * 1.05) * 0.04;
            starsGroup.rotation.y += dt * 0.015;
            starsGroup.rotation.x += dt * 0.010;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🧬 四元数编织空间动画已启动');
        console.log(`   - ${curveCount} 条闭合曲线，3种颜色各${numCurvesPerColor}条`);
        console.log('   - 公式：q(t) = e^{i a t} e^{j b t} e^{k c t}，取虚部');
        console.log(`   - 周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
