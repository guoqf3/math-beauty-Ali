<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>材料疲劳 · Material Fatigue</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #06080f;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  canvas { display: block; }
  #scene { position: fixed; inset: 0; }

  /* ---------- 顶部启迪文字 ---------- */
  #fatigue-text {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 64vw;
    max-width: 1020px;
    text-align: center;
    z-index: 30;
    pointer-events: none;
    font-size: clamp(13px, 1.12vw, 18px);
    line-height: 1.72;
    letter-spacing: 1.2px;
    color: #ffe0d6;
    text-shadow:
      0 0 10px rgba(255, 120, 60, 0.75),
      0 0 24px rgba(90, 180, 255, 0.5),
      0 0 46px rgba(255, 60, 30, 0.3);
  }
  #fatigue-text span { transition: none; }

  /* ---------- 边缘公式 ---------- */
  .hud {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    font-family: "Consolas", "SF Mono", "Courier New", monospace;
    font-size: clamp(9px, 0.82vw, 13px);
    letter-spacing: 0.6px;
    color: rgba(255, 190, 160, 0.75);
    text-shadow:
      0 0 8px rgba(255, 120, 60, 0.7),
      0 0 20px rgba(120, 60, 255, 0.3);
    white-space: nowrap;
  }
  .hud .k { color: rgba(255, 220, 120, 0.92); }
  .hud .c { color: rgba(120, 220, 255, 0.92); }
  .f-tl { top: 16px; left: 20px; }
  .f-tr { top: 16px; right: 20px; text-align: right; }
  .f-bl { bottom: 22px; left: 20px; }
  .f-br { bottom: 22px; right: 20px; text-align: right; }

  /* ---------- 损伤仪表盘 ---------- */
  #meters {
    position: fixed;
    right: 20px;
    bottom: 60px;
    z-index: 30;
    pointer-events: none;
    padding: 12px 16px 10px;
    border-radius: 12px;
    background: rgba(10, 14, 26, 0.62);
    border: 1px solid rgba(255, 120, 60, 0.22);
    box-shadow: 0 0 30px rgba(255, 80, 30, 0.14), inset 0 0 30px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-family: "Consolas", "Courier New", monospace;
    font-size: 10px;
    letter-spacing: 0.8px;
    color: rgba(255, 200, 170, 0.8);
    min-width: 230px;
  }
  .m-title {
    font-size: 10px;
    color: rgba(255, 140, 90, 0.95);
    letter-spacing: 2px;
    margin-bottom: 9px;
    text-shadow: 0 0 10px rgba(255, 100, 40, 0.8);
  }
  .m-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
  }
  .m-label {
    width: 108px;
    color: rgba(255, 190, 150, 0.62);
    font-size: 9.5px;
  }
  .m-bar {
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: rgba(255, 120, 60, 0.13);
    overflow: hidden;
    position: relative;
  }
  #dmg-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, #ffaa22, #ff5522, #ff2266);
    box-shadow: 0 0 10px rgba(255, 90, 40, 0.9);
    transition: width 0.1s linear;
  }
  .m-val {
    width: 68px;
    text-align: right;
    color: #ffd24a;
    font-size: 10.5px;
    text-shadow: 0 0 8px rgba(255, 200, 80, 0.85);
  }
  .m-val.danger { color: #ff3a4a; text-shadow: 0 0 12px rgba(255, 40, 60, 1); }

  /* ---------- 状态标签 ---------- */
  #phase-lbl {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 30;
    pointer-events: none;
    font-family: "Consolas", "Courier New", monospace;
    font-size: clamp(11px, 1vw, 15px);
    letter-spacing: 3px;
    color: #7fe9ff;
    text-shadow: 0 0 12px rgba(80, 230, 255, 0.9), 0 0 30px rgba(120, 80, 255, 0.5);
  }

  /* ---------- 控制条 ---------- */
  #controls {
    position: fixed;
    left: 50%;
    bottom: 52px;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 16px;
    border-radius: 30px;
    background: rgba(16, 12, 24, 0.6);
    border: 1px solid rgba(255, 130, 70, 0.26);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 30px rgba(255, 80, 30, 0.16);
    font-family: "Consolas", "Courier New", monospace;
    font-size: 11px;
    color: rgba(255, 200, 170, 0.85);
    letter-spacing: 0.5px;
  }
  #controls button {
    background: linear-gradient(180deg, rgba(220, 80, 40, 0.55), rgba(120, 30, 20, 0.65));
    border: 1px solid rgba(255, 150, 90, 0.45);
    color: #ffded0;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 15px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 8px rgba(255, 150, 90, 0.8);
  }
  #controls button:hover {
    background: linear-gradient(180deg, rgba(255, 110, 50, 0.75), rgba(170, 45, 25, 0.85));
    box-shadow: 0 0 18px rgba(255, 120, 60, 0.6);
  }

  /* ---------- 暗角 ---------- */
  #vignette {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background: radial-gradient(
      ellipse at 50% 48%,
      rgba(0, 0, 0, 0) 36%,
      rgba(0, 0, 0, 0.44) 74%,
      rgba(0, 0, 0, 0.86) 100%
    );
  }

  /* ---------- 进度条 ---------- */
  #progress {
    position: fixed; bottom: 0; left: 0; height: 2px; width: 0%;
    z-index: 45;
    background: linear-gradient(90deg, #ffaa22, #ff5522, #ff2266, #ffd24a);
    box-shadow: 0 0 14px rgba(255, 120, 60, 0.9);
    pointer-events: none;
  }

  /* ---------- 断裂闪屏 ---------- */
  #flash {
    position: fixed; inset: 0; z-index: 35; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(255,220,180,0.95), rgba(255,80,20,0.5) 40%, rgba(255,0,0,0) 72%);
    opacity: 0;
  }

  @media (max-width: 950px) {
    .f-tr, .f-br { display: none; }
    #fatigue-text { width: 88vw; }
    #meters { transform: scale(0.8); transform-origin: bottom right; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div id="progress"></div>

<div id="fatigue-text"></div>

<div class="hud f-tl">
  S-N 曲线&nbsp;&nbsp;σ<sub>a</sub> = C · N<sup>−b</sup><br>
  log σ<sub>a</sub> ∝ −b · log N
</div>
<div class="hud f-tr">
  Miner 线性累积损伤<br>
  Σ ( n<sub>i</sub> / N<sub>i</sub> ) = 1
</div>
<div class="hud f-bl">
  <span class="k">σ<sub>e</sub></span> ≈ 0.3~0.5 σ<sub>b</sub> &nbsp;
  <span class="k">Q235</span> ≈ 117 MPa<br>
  高周疲劳&nbsp;N<sub>f</sub> &gt; 10<sup>7</sup>
</div>
<div class="hud f-br">
  MATERIAL&nbsp;FATIGUE&nbsp;/&nbsp;CUMULATIVE&nbsp;DAMAGE
</div>

<div id="meters">
  <div class="m-title">损伤累积监测 · DAMAGE MONITOR</div>
  <div class="m-row">
    <span class="m-label">Σ(nᵢ/Nᵢ)</span>
    <div class="m-bar"><div id="dmg-fill"></div></div>
    <span class="m-val" id="dmg-val">0.00</span>
  </div>
  <div class="m-row">
    <span class="m-label">循环次数 N</span>
    <span class="m-val" id="cyc-val">0</span>
  </div>
  <div class="m-row">
    <span class="m-label">裂纹 a/W</span>
    <span class="m-val" id="crk-val">0.00</span>
  </div>
</div>

<div id="phase-lbl">循环加载中 · CYCLIC LOADING</div>

<div id="controls">
  <button id="btn-play">暂停</button>
  <button id="btn-reset">重播</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   材料疲劳 · Material Fatigue
   疲劳裂纹萌生—扩展—断裂全过程可视化
   ========================================================= */

/* ---------------- 常量 ---------------- */
const LOOP_TIME = 30;
const TEXT_FULL = 26;

const T_BREAK   = 25.5;      // 断裂时刻
const T_END     = 30;

/* ---------------- 圆点贴图 ---------------- */
function makeGlowTexture() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.20, 'rgba(255,255,255,0.92)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.34)');
  g.addColorStop(0.72, 'rgba(255,255,255,0.08)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const GLOW_TEX = makeGlowTexture();

/* ---------------- 渲染器 / 场景 ---------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x06080f, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06080f, 0.0012);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 5000);
const camTarget = new THREE.Vector3(0, 0, 0);

/* ---------------- 环境光 / 灯光 ---------------- */
scene.add(new THREE.AmbientLight(0x223344, 1.5));

const keyLight = new THREE.DirectionalLight(0xccddee, 1.25);
keyLight.position.set(90, 140, 110);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xff6633, 0.55);
fillLight.position.set(-120, -40, -80);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x3388ff, 0.45);
rimLight.position.set(-90, 60, 130);
scene.add(rimLight);

const notchLight1 = new THREE.PointLight(0xff5522, 1.6, 260);
notchLight1.position.set(0, -8, 0);
scene.add(notchLight1);

const notchLight2 = new THREE.PointLight(0xff5522, 1.6, 260);
notchLight2.position.set(0, 8, 0);
scene.add(notchLight2);

/* ---------------- 星空背景 ---------------- */
(function buildStars() {
  const COUNT = 1000;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const u = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const r = 800 + Math.random() * 1400;
    const s = Math.sqrt(1 - u * u);
    pos[i * 3]     = r * s * Math.cos(th);
    pos[i * 3 + 1] = r * u;
    pos[i * 3 + 2] = r * s * Math.sin(th);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x8fb0dd, size: 2.0, map: GLOW_TEX,
    transparent: true, opacity: 0.45,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* ---------------- 地面反射 ---------------- */
(function buildFloor() {
  const g = new THREE.GridHelper(700, 36, 0x1a2a44, 0x0e1626);
  g.position.y = -110;
  g.material.transparent = true;
  g.material.opacity = 0.42;
  scene.add(g);

  const pg = new THREE.PlaneGeometry(700, 700);
  const pm = new THREE.MeshBasicMaterial({
    color: 0x050810, transparent: true, opacity: 0.9,
    side: THREE.DoubleSide, depthWrite: false
  });
  const plane = new THREE.Mesh(pg, pm);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -110.5;
  scene.add(plane);
})();

/* ---------------- 试件形状（带缺口板件） ---------------- */
const W_HALF = 55;
const H_HALF = 20;

const specimenShape = new THREE.Shape();
specimenShape.moveTo(-W_HALF, -H_HALF);
specimenShape.lineTo(-8, -H_HALF);
specimenShape.quadraticCurveTo(0, 4, 8, -H_HALF);     // 下缺口（向内凹至 y=-8）
specimenShape.lineTo(W_HALF, -H_HALF);
specimenShape.lineTo(W_HALF, H_HALF);
specimenShape.lineTo(8, H_HALF);
specimenShape.quadraticCurveTo(0, -4, -8, H_HALF);    // 上缺口（向内凹至 y=8）
specimenShape.lineTo(-W_HALF, H_HALF);
specimenShape.closePath();

const extrudeOpt = {
  depth: 10,
  bevelEnabled: true,
  bevelThickness: 1.0,
  bevelSize: 1.0,
  bevelSegments: 3,
  curveSegments: 40
};

const specGeo = new THREE.ExtrudeGeometry(specimenShape, extrudeOpt);
specGeo.translate(0, 0, -5);
specGeo.computeVertexNormals();

const steelMat = new THREE.MeshStandardMaterial({
  color: 0x76828f,
  metalness: 0.94,
  roughness: 0.36,
  emissive: 0x0a1220,
  emissiveIntensity: 0.6,
  transparent: true,
  opacity: 1.0,
  side: THREE.DoubleSide
});

const specimen = new THREE.Mesh(specGeo, steelMat);
scene.add(specimen);

/* 试件边缘发光轮廓 */
const edgesGeo = new THREE.EdgesGeometry(specGeo, 20);
const edgesMat = new THREE.LineBasicMaterial({
  color: 0x66aaff,
  transparent: true,
  opacity: 0.18,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const edges = new THREE.LineSegments(edgesGeo, edgesMat);
scene.add(edges);

/* ---------------- 缺口应力集中光晕 ---------------- */
const notchGlowMat1 = new THREE.SpriteMaterial({
  map: GLOW_TEX, color: 0xff6622, transparent: true,
  opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false
});
const notchGlow1 = new THREE.Sprite(notchGlowMat1);
notchGlow1.scale.set(34, 26, 1);
notchGlow1.position.set(0, -8, 0);
scene.add(notchGlow1);

const notchGlowMat2 = new THREE.SpriteMaterial({
  map: GLOW_TEX, color: 0xff6622, transparent: true,
  opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false
});
const notchGlow2 = new THREE.Sprite(notchGlowMat2);
notchGlow2.scale.set(34, 26, 1);
notchGlow2.position.set(0, 8, 0);
scene.add(notchGlow2);

/* ---------------- 加载箭头 ---------------- */
function makeArrow(color) {
  const grp = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.78,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 22, 10), mat);
  shaft.rotation.z = Math.PI / 2;
  shaft.position.x = -6;
  grp.add(shaft);

  const head = new THREE.Mesh(new THREE.ConeGeometry(4.2, 10, 14), mat);
  head.rotation.z = -Math.PI / 2;
  head.position.x = 10;
  grp.add(head);

  return grp;
}

const arrowL = makeArrow(0x55ddff);
arrowL.position.set(-88, 0, 0);
arrowL.rotation.y = Math.PI;
scene.add(arrowL);

const arrowR = makeArrow(0x55ddff);
arrowR.position.set(88, 0, 0);
scene.add(arrowR);

/* ---------------- 裂纹系统 ---------------- */
const N_CRACK = 160;

const crackPos   = new Float32Array(N_CRACK * 3);
const crackCol   = new Float32Array(N_CRACK * 3);
const crackSize  = new Float32Array(N_CRACK);

const crackGeo = new THREE.BufferGeometry();
crackGeo.setAttribute('position', new THREE.BufferAttribute(crackPos, 3));
crackGeo.setAttribute('aColor',   new THREE.BufferAttribute(crackCol, 3));
crackGeo.setAttribute('aSize',    new THREE.BufferAttribute(crackSize, 1));

const crackMat = new THREE.ShaderMaterial({
  uniforms: {
    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
    uTex: { value: GLOW_TEX }
  },
  vertexShader: `
    attribute float aSize;
    attribute vec3 aColor;
    uniform float uPixelRatio;
    varying vec3 vColor;
    void main() {
      vColor = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uPixelRatio * (240.0 / max(1.0, -mv.z));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying vec3 vColor;
    void main() {
      vec4 t = texture2D(uTex, gl_PointCoord);
      gl_FragColor = vec4(vColor, t.a);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const crackPoints = new THREE.Points(crackGeo, crackMat);
crackPoints.frustumCulled = false;
scene.add(crackPoints);

/* 裂纹路径函数：从 (0,-8) 曲折向上到 (0,8) */
function crackPath(t) {
  const y = -8 + t * 16.4;
  const x = Math.sin(t * 6.28) * 2.2
          + Math.sin(t * 15.7) * 0.9
          + Math.sin(t * 31.0) * 0.35;
  return { x, y };
}

/* 裂纹尖端光点 */
const tipSpriteMat = new THREE.SpriteMaterial({
  map: GLOW_TEX, color: 0xffffee, transparent: true,
  opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
});
const tipSprite = new THREE.Sprite(tipSpriteMat);
tipSprite.scale.set(14, 14, 1);
scene.add(tipSprite);

/* 裂纹尖端辉光 */
const tipHaloMat = new THREE.SpriteMaterial({
  map: GLOW_TEX, color: 0xff3300, transparent: true,
  opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
});
const tipHalo = new THREE.Sprite(tipHaloMat);
tipHalo.scale.set(46, 46, 1);
scene.add(tipHalo);

/* ---------------- 断裂碎片 ---------------- */
const shards = [];
(function buildShards() {
  for (let i = 0; i < 70; i++) {
    const sx = 1.5 + Math.random() * 5;
    const sy = 1.5 + Math.random() * 5;
    const sz = 1.5 + Math.random() * 3.5;
    const g = new THREE.BoxGeometry(sx, sy, sz);
    const m = new THREE.MeshStandardMaterial({
      color: 0x8a96a3,
      metalness: 0.92,
      roughness: 0.42,
      emissive: 0x1a0e08,
      emissiveIntensity: 0.5,
      transparent: true,
      opacity: 1
    });
    const mesh = new THREE.Mesh(g, m);
    mesh.visible = false;
    scene.add(mesh);
    shards.push({
      mesh,
      vx: 0, vy: 0, vz: 0,
      rx: 0, ry: 0, rz: 0,
      active: false,
      life: 1
    });
  }
})();

/* ---------------- 断裂闪光 ---------- */
const flashSpriteMat = new THREE.SpriteMaterial({
  map: GLOW_TEX, color: 0xfff0d0, transparent: true,
  opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
});
const flashSprite = new THREE.Sprite(flashSpriteMat);
flashSprite.scale.set(160, 160, 1);
flashSprite.position.set(0, 0, 0);
scene.add(flashSprite);

const flashLight = new THREE.PointLight(0xffcc88, 0, 600);
flashLight.position.set(0, 0, 0);
scene.add(flashLight);

/* ---------------- 断口贝纹线纹理（断裂后显示） ---------------- */
function makeFractureTexture() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');

  ctx.fillStyle = 'rgba(20, 22, 28, 1)';
  ctx.fillRect(0, 0, s, s);

  /* 贝壳状疲劳辉纹 */
  const cx = s * 0.5, cy = s * 0.92;
  for (let i = 0; i < 34; i++) {
    const r = 10 + i * 7.2 + Math.sin(i * 1.7) * 2.5;
    ctx.beginPath();
    for (let a = 0; a <= 60; a++) {
      const ang = -Math.PI * 0.5 + (a / 60) * Math.PI;
      const rr = r + Math.sin(ang * 5 + i) * 1.6;
      const px = cx + Math.cos(ang - Math.PI * 0.5) * rr * 0.9;
      const py = cy - Math.sin(ang) * rr * 0.92;
      if (a === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = `rgba(200, 215, 235, ${0.10 + (i % 3) * 0.05})`;
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }

  /* 放射状棱线 */
  for (let i = 0; i < 16; i++) {
    const ang = -Math.PI * 0.5 + (i / 15) * Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang - Math.PI * 0.5) * s * 0.6,
               cy - Math.sin(ang) * s * 0.62);
    ctx.strokeStyle = 'rgba(120, 140, 165, 0.14)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

const fractureTex = makeFractureTexture();
const fractureMat = new THREE.MeshBasicMaterial({
  map: fractureTex,
  transparent: true,
  opacity: 0,
  side: THREE.DoubleSide,
  depthWrite: false,
  blending: THREE.NormalBlending
});
const fracturePlane = new THREE.Mesh(new THREE.PlaneGeometry(26, 20), fractureMat);
fracturePlane.position.set(0, 0, 0);
fracturePlane.visible = false;
scene.add(fracturePlane);

/* ---------------- 相机控制 ---------------- */
const orbit = {
  theta: 0.62,
  phi: 1.24,
  dist: 235,
  targetDist: 235
};

let dragging = false;
let lastX = 0, lastY = 0;
let autoRotate = true;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  autoRotate = false;
  lastX = e.clientX;
  lastY = e.clientY;
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
});

window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  orbit.theta -= dx * 0.006;
  orbit.phi   -= dy * 0.006;
  orbit.phi = Math.max(0.22, Math.min(Math.PI * 0.86, orbit.phi));
});

window.addEventListener('pointerup', () => {
  dragging = false;
  setTimeout(() => { autoRotate = true; }, 2800);
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 0.89;
  orbit.targetDist = Math.max(50, Math.min(700, orbit.targetDist * k));
}, { passive: false });

let pinchDist = 0;
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      orbit.targetDist = Math.max(50, Math.min(700, orbit.targetDist * (pinchDist / d)));
    }
    pinchDist = d;
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { pinchDist = 0; });

/* ---------------- 顶部启迪文字 ---------------- */
const FULL_TEXT =
  '启示：材料疲劳揭示“千里之堤溃于蚁穴”的累积损伤原理——看似微小的反复循环应力经数百万次累积最终导致突然断裂失效——启示我们在工程设计与风险管理中必须重视看似微不足道的长期反复累积效应与安全冗余设计。';

const textEl = document.getElementById('fatigue-text');
const CHARS = Array.from(FULL_TEXT);
const SPANS = [];

(function buildText() {
  for (let i = 0; i < CHARS.length; i++) {
    const s = document.createElement('span');
    s.textContent = CHARS[i];
    s.style.opacity = '0';
    s._o = -1;
    textEl.appendChild(s);
    SPANS.push(s);
  }
})();

function updateText(t) {
  const total = CHARS.length;
  const reveal = Math.min(total, (t / TEXT_FULL) * total);
  for (let i = 0; i < total; i++) {
    let o = reveal - i;
    if (o < 0) o = 0; else if (o > 1) o = 1;
    o = Math.round(o * 10) / 10;
    if (SPANS[i]._o !== o) {
      SPANS[i].style.opacity = o;
      SPANS[i]._o = o;
    }
  }
}

function resetText() {
  for (let i = 0; i < SPANS.length; i++) {
    SPANS[i].style.opacity = '0';
    SPANS[i]._o = -1;
  }
}

/* ---------------- 状态 ---------------- */
let sceneTime = 0;
let broken = false;
let breakTriggered = false;
let crackProgress = 0;
let fractureOpacity = 0;
let flashTimer = 0;

const dmgFillEl = document.getElementById('dmg-fill');
const dmgValEl  = document.getElementById('dmg-val');
const cycValEl  = document.getElementById('cyc-val');
const crkValEl  = document.getElementById('crk-val');
const phaseLblEl= document.getElementById('phase-lbl');
const flashEl   = document.getElementById('flash');

/* ---------------- 重置 ---------------- */
function resetAll() {
  sceneTime = 0;
  broken = false;
  breakTriggered = false;
  crackProgress = 0;
  fractureOpacity = 0;
  flashTimer = 0;

  steelMat.opacity = 1.0;
  specimen.visible = true;
  edgesMat.opacity = 0.18;

  tipSpriteMat.opacity = 0;
  tipHaloMat.opacity = 0;
  flashSpriteMat.opacity = 0;
  flashLight.intensity = 0;

  fractureMat.opacity = 0;
  fracturePlane.visible = false;

  for (let i = 0; i < shards.length; i++) {
    shards[i].mesh.visible = false;
    shards[i].active = false;
    shards[i].life = 1;
    shards[i].mesh.material.opacity = 1;
  }

  /* 清空裂纹点 */
  for (let i = 0; i < N_CRACK; i++) {
    crackSize[i] = 0;
    crackCol[i * 3] = 0;
    crackCol[i * 3 + 1] = 0;
    crackCol[i * 3 + 2] = 0;
    crackPos[i * 3 + 1] = -9999;
  }
  crackGeo.attributes.position.needsUpdate = true;
  crackGeo.attributes.aColor.needsUpdate = true;
  crackGeo.attributes.aSize.needsUpdate = true;

  flashEl.style.opacity = '0';

  resetText();
}

/* ---------------- 触发断裂 ---------------- */
function triggerBreak() {
  broken = true;
  breakTriggered = true;

  /* 闪光 */
  flashTimer = 1.0;
  flashSpriteMat.opacity = 1.0;
  flashLight.intensity = 6.0;
  flashEl.style.opacity = '1';

  /* 生成碎片 */
  for (let i = 0; i < shards.length; i++) {
    const s = shards[i];
    const x = (Math.random() - 0.5) * 95;
    const y = (Math.random() - 0.5) * 32;
    const z = (Math.random() - 0.5) * 9;

    s.mesh.position.set(x, y, z);
    s.mesh.rotation.set(
      Math.random() * Math.PI,
      Math.random() * Math.PI,
      Math.random() * Math.PI
    );
    s.mesh.visible = true;
    s.mesh.material.opacity = 1;
    s.active = true;
    s.life = 1;

    /* 向左右两侧飞散 + 随机扰动 */
    const dir = x >= 0 ? 1 : -1;
    const spd = 18 + Math.random() * 42;
    s.vx = dir * spd * (0.55 + Math.random() * 0.6) + (Math.random() - 0.5) * 12;
    s.vy = (Math.random() - 0.5) * 34;
    s.vz = (Math.random() - 0.5) * 22;

    s.rx = (Math.random() - 0.5) * 7;
    s.ry = (Math.random() - 0.5) * 7;
    s.rz = (Math.random() - 0.5) * 7;
  }

  /* 断口平面显示 */
  fracturePlane.position.set(0, 0, 0);
  fracturePlane.visible = true;
  fractureMat.opacity = 0;
}

/* ---------------- 裂纹进度 ---------------- */
function computeCrackProgress(t) {
  if (t < 4) return 0;
  if (t < 10) {
    /* 萌生 + 缓慢扩展 */
    const s = (t - 4) / 6;
    return 0.15 * Math.pow(s, 0.65);
  }
  if (t < 22) {
    /* 稳定扩展 */
    const s = (t - 10) / 12;
    return 0.15 + 0.50 * s;
  }
  if (t < T_BREAK) {
    /* 加速扩展 */
    const s = (t - 22) / (T_BREAK - 22);
    return 0.65 + 0.35 * Math.pow(s, 2.1);
  }
  return 1.0;
}

/* ---------------- 相位文字 ---------------- */
function phaseText(t) {
  if (t < 4)      return '循环加载 · CYCLIC LOADING';
  if (t < 10)     return '裂纹萌生 · CRACK INITIATION';
  if (t < 22)     return '稳定扩展 · STABLE PROPAGATION';
  if (t < T_BREAK)return '加速扩展 · ACCELERATED GROWTH';
  return '瞬间断裂 · FINAL FRACTURE';
}

/* ---------------- 更新裂纹可视化 ---------------- */
function updateCrack() {
  const prog = crackProgress;

  for (let i = 0; i < N_CRACK; i++) {
    const tPath = i / (N_CRACK - 1);

    if (tPath > prog) {
      crackSize[i] = 0;
      crackPos[i * 3 + 1] = -9999;
      crackCol[i * 3] = 0;
      crackCol[i * 3 + 1] = 0;
      crackCol[i * 3 + 2] = 0;
      continue;
    }

    const p = crackPath(tPath);
    const jitterZ = (Math.sin(i * 12.9898) * 43758.5453 % 1) * 3.2 - 1.6;

    crackPos[i * 3]     = p.x;
    crackPos[i * 3 + 1] = p.y;
    crackPos[i * 3 + 2] = jitterZ;

    /* 越接近尖端越亮越大 */
    const dFromTip = prog - tPath;
    const nearTip = Math.max(0, 1 - dFromTip * 6.5);
    const nearTip2 = nearTip * nearTip;

    crackSize[i] = 1.4 + nearTip2 * 7.5;

    crackCol[i * 3]     = 0.95 + nearTip2 * 0.05;
    crackCol[i * 3 + 1] = 0.16 + nearTip * 0.72;
    crackCol[i * 3 + 2] = 0.06 + nearTip * 0.55;
  }

  crackGeo.attributes.position.needsUpdate = true;
  crackGeo.attributes.aColor.needsUpdate = true;
  crackGeo.attributes.aSize.needsUpdate = true;

  /* 尖端位置 */
  if (prog > 0.001 && !broken) {
    const tip = crackPath(prog);
    tipSprite.position.set(tip.x, tip.y, 0);
    tipHalo.position.set(tip.x, tip.y, 0);

    const pulse = 0.7 + 0.3 * Math.sin(sceneTime * 22);
    tipSpriteMat.opacity = pulse;
    tipHaloMat.opacity = 0.42 + 0.28 * Math.sin(sceneTime * 18);

    const ts = 10 + 5 * pulse;
    tipSprite.scale.set(ts, ts, 1);
    tipHalo.scale.set(38 + 12 * pulse, 38 + 12 * pulse, 1);
  } else {
    tipSpriteMat.opacity = 0;
    tipHaloMat.opacity = 0;
  }
}

/* ---------------- 控制条 ---------------- */
const btnPlay = document.getElementById('btn-play');
const btnReset = document.getElementById('btn-reset');
let running = true;

btnPlay.addEventListener('click', () => {
  running = !running;
  btnPlay.textContent = running ? '暂停' : '继续';
});

btnReset.addEventListener('click', () => {
  resetAll();
  if (!running) { running = true; btnPlay.textContent = '暂停'; }
});

/* ---------------- 主循环 ---------------- */
let lastTime = performance.now();
const progressEl = document.getElementById('progress');

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  /* 时间推进 */
  if (running) {
    sceneTime += dt;
    if (sceneTime >= LOOP_TIME) {
      sceneTime -= LOOP_TIME;
      resetAll();
    }
  }

  const t = sceneTime;

  /* ---------- 加载脉冲 ---------- */
  const loadPulse = (Math.sin(t * 10.0) + 1) * 0.5;

  const arrowOffset = 6 + loadPulse * 13;
  arrowL.position.x = -88 - arrowOffset;
  arrowR.position.x =  88 + arrowOffset;

  const arrowScale = 0.85 + loadPulse * 0.35;
  arrowL.scale.set(arrowScale, arrowScale, arrowScale);
  arrowR.scale.set(arrowScale, arrowScale, arrowScale);

  arrowL.children.forEach(c => c.material.opacity = 0.42 + loadPulse * 0.52);
  arrowR.children.forEach(c => c.material.opacity = 0.42 + loadPulse * 0.52);

  /* ---------- 缺口应力集中脉动 ---------- */
  const stressGlow = 0.28 + loadPulse * 0.55;
  const stressScale = 1.0 + loadPulse * 0.28;

  notchGlowMat1.opacity = stressGlow * (crackProgress < 1 ? 1 : 0.3);
  notchGlowMat2.opacity = stressGlow * (crackProgress < 1 ? 1 : 0.3);

  notchGlow1.scale.set(34 * stressScale, 26 * stressScale, 1);
  notchGlow2.scale.set(34 * stressScale, 26 * stressScale, 1);

  notchLight1.intensity = 1.0 + loadPulse * 2.2;
  notchLight2.intensity = 1.0 + loadPulse * 2.2;

  /* ---------- 裂纹进度 ---------- */
  if (t < T_BREAK) {
    crackProgress = computeCrackProgress(t);
    updateCrack();
  } else if (!breakTriggered) {
    crackProgress = 1.0;
    updateCrack();
    triggerBreak();
  }

  /* ---------- 断裂后处理 ---------- */
  if (breakTriggered) {
    /* 闪光衰减 */
    if (flashTimer > 0) {
      flashTimer -= dt * 2.2;
      if (flashTimer < 0) flashTimer = 0;
      const f = flashTimer;
      flashSpriteMat.opacity = f * f;
      flashLight.intensity = f * 7.0;
      flashEl.style.opacity = String(Math.min(1, f * 1.3) * 0.92);
    } else {
      flashSpriteMat.opacity = 0;
      flashLight.intensity = 0;
      flashEl.style.opacity = '0';
    }

    /* 试件淡出 */
    steelMat.opacity -= dt * 2.4;
    if (steelMat.opacity < 0) steelMat.opacity = 0;
    edgesMat.opacity = steelMat.opacity * 0.18;

    if (steelMat.opacity <= 0) specimen.visible = false;

    /* 断口淡入后淡出 */
    fractureOpacity += dt * 1.6;
    if (fractureOpacity > 1) fractureOpacity = 1;
    /* 后期慢慢消失 */
    if (t > T_BREAK + 2.5) {
      fractureOpacity -= dt * 0.9;
      if (fractureOpacity < 0) fractureOpacity = 0;
    }
    fractureMat.opacity = fractureOpacity * 0.72;

    /* 碎片运动 */
    for (let i = 0; i < shards.length; i++) {
      const s = shards[i];
      if (!s.active) continue;

      s.mesh.position.x += s.vx * dt;
      s.mesh.position.y += s.vy * dt;
      s.mesh.position.z += s.vz * dt;

      s.mesh.rotation.x += s.rx * dt;
      s.mesh.rotation.y += s.ry * dt;
      s.mesh.rotation.z += s.rz * dt;

      /* 阻尼 + 重力 */
      s.vx *= 0.985;
      s.vy = s.vy * 0.985 - 14 * dt;
      s.vz *= 0.985;

      s.rx *= 0.99;
      s.ry *= 0.99;
      s.rz *= 0.99;

      /* 渐渐淡出 */
      if (t > T_BREAK + 2.2) {
        s.life -= dt * 0.7;
        if (s.life < 0) s.life = 0;
        s.mesh.material.opacity = s.life;
        if (s.life <= 0) {
          s.active = false;
          s.mesh.visible = false;
        }
      }
    }
  }

  /* ---------- 相机 ---------- */
  if (autoRotate && !dragging) orbit.theta += dt * 0.085;
  orbit.dist += (orbit.targetDist - orbit.dist) * 0.075;

  const sp = Math.sin(orbit.phi);
  camera.position.set(
    camTarget.x + orbit.dist * sp * Math.sin(orbit.theta),
    camTarget.y + orbit.dist * Math.cos(orbit.phi),
    camTarget.z + orbit.dist * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(camTarget);

  /* ---------- 仪表盘 ---------- */
  const dmg = Math.min(1, crackProgress * crackProgress * 1.0 + crackProgress * 0.15);
  const dmgShown = breakTriggered ? 1 : Math.min(1, crackProgress * 1.06);

  dmgFillEl.style.width = (dmgShown * 100).toFixed(1) + '%';
  dmgValEl.textContent = dmgShown.toFixed(3);
  if (dmgShown > 0.85) dmgValEl.classList.add('danger');
  else dmgValEl.classList.remove('danger');

  /* 循环次数：映射到 1e7 */
  const cycles = crackProgress * 1e7;
  if (cycles >= 1e6) {
    cycValEl.textContent = (cycles / 1e6).toFixed(2) + '×10⁶';
  } else if (cycles >= 1e3) {
    cycValEl.textContent = (cycles / 1e3).toFixed(1) + '×10³';
  } else {
    cycValEl.textContent = cycles.toFixed(0);
  }

  crkValEl.textContent = crackProgress.toFixed(3);

  /* ---------- 相位文字 ---------- */
  const pt = breakTriggered ? '瞬间断裂 · FINAL FRACTURE' : phaseText(t);
  if (phaseLblEl.textContent !== pt) phaseLblEl.textContent = pt;

  /* ---------- 顶部文字 ---------- */
  updateText(t);

  /* ---------- 进度条 ---------- */
  progressEl.style.width = ((t / LOOP_TIME) * 100).toFixed(2) + '%';

  renderer.render(scene, camera);
}

/* ---------------- 窗口缩放 ---------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  crackMat.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
});

/* ---------------- 启动 ---------------- */
resetAll();
animate();
</script>
