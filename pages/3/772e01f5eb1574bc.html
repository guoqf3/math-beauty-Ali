<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>克莱因四角方块体 · 无边界拓扑 · 科技音景</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#02090e;
    -webkit-tap-highlight-color:transparent;
  }
  #gl{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
  }

  /* ---------- 数学公式 HUD ---------- */
  .hud{
    position:fixed;
    left:clamp(16px,4.2vw,58px);
    bottom:clamp(16px,4.4vh,56px);
    z-index:10;
    pointer-events:none;
    user-select:none;
    max-width:min(94vw,940px);
    color:#a8fff0;
    font-family:"Times New Roman","Songti SC","STSong",Georgia,serif;
    text-shadow:
      0 0 24px rgba(0,255,225,.42),
      0 0 62px rgba(160,70,255,.28),
      0 2px 9px rgba(0,0,0,.85);
    animation:hudIn 1.8s cubic-bezier(.2,.8,.25,1) both;
  }
  @keyframes hudIn{
    from{opacity:0;transform:translateY(22px);filter:blur(7px);}
    to{opacity:1;transform:none;filter:blur(0);}
  }
  .hud .tag{
    font-size:clamp(9px,1.3vw,13px);
    letter-spacing:.44em;
    text-transform:uppercase;
    opacity:.75;
    margin-bottom:.95em;
    font-style:normal;
    white-space:nowrap;
    color:#b9fff4;
  }
  .hud .tag .dot{
    display:inline-block;width:.46em;height:.46em;border-radius:50%;
    background:#3dffe4;
    box-shadow:0 0 16px 5px rgba(60,255,220,.85);
    vertical-align:.02em;margin-right:.7em;
    animation:pulse 2.3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.35;transform:scale(.68);}
    50%    {opacity:1;  transform:scale(1.2);}
  }
  .hud .eq{
    font-size:clamp(12px,1.85vw,21px);
    line-height:1.95;
    font-style:italic;
    letter-spacing:.01em;
    opacity:.96;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hud .eq.sm{
    font-size:clamp(10px,1.36vw,14.5px);
    opacity:.66;
    margin-top:.55em;
    color:#c2b6ff;
    text-shadow:0 0 22px rgba(170,90,255,.5),0 2px 8px rgba(0,0,0,.85);
  }
  .hud sub{font-size:.62em;font-style:normal;vertical-align:-.22em;letter-spacing:0;}
  .hud sup{font-size:.6em;font-style:normal;vertical-align:.42em;}

  /* ---------- 右上角角标 ---------- */
  .corner{
    position:fixed;
    right:clamp(16px,4.2vw,58px);
    top:clamp(16px,4.2vh,52px);
    z-index:10;
    pointer-events:none;
    user-select:none;
    text-align:right;
    color:#8ff5e2;
    font-family:"Times New Roman","Songti SC",serif;
    font-size:clamp(9px,1.2vw,12.5px);
    letter-spacing:.32em;
    line-height:2.1;
    opacity:.56;
    text-shadow:0 0 20px rgba(0,255,220,.5),0 2px 7px rgba(0,0,0,.8);
  }

  /* ---------- 音频控制面板 ---------- */
  .audiobar{
    position:fixed;
    right:clamp(16px,4.2vw,58px);
    bottom:clamp(16px,4.4vh,56px);
    z-index:20;
    display:flex;
    align-items:center;
    gap:clamp(8px,1.1vw,14px);
    padding:clamp(8px,1.1vw,13px) clamp(12px,1.6vw,19px);
    border-radius:999px;
    background:linear-gradient(150deg,
        rgba(6,32,38,.72) 0%,
        rgba(10,18,42,.62) 60%,
        rgba(34,10,58,.62) 100%);
    border:1px solid rgba(80,255,225,.30);
    box-shadow:
      0 0 26px rgba(0,255,215,.20),
      0 0 62px rgba(150,60,255,.14),
      inset 0 0 26px rgba(0,255,215,.06);
    backdrop-filter:blur(9px) saturate(1.4);
    -webkit-backdrop-filter:blur(9px) saturate(1.4);
    user-select:none;
    animation:barIn 2.1s cubic-bezier(.2,.8,.25,1) both .35s;
  }
  @keyframes barIn{
    from{opacity:0;transform:translateY(16px) scale(.94);filter:blur(5px);}
    to{opacity:1;transform:none;filter:blur(0);}
  }

  .audiobar button{
    appearance:none;border:none;outline:none;
    cursor:pointer;
    display:grid;place-items:center;
    width:clamp(34px,3.6vw,44px);
    height:clamp(34px,3.6vw,44px);
    border-radius:50%;
    color:#c9fff4;
    background:radial-gradient(circle at 34% 28%,
        rgba(60,255,225,.30),
        rgba(20,60,80,.30) 70%);
    border:1px solid rgba(90,255,230,.45);
    box-shadow:
      0 0 18px rgba(0,255,215,.35),
      inset 0 0 14px rgba(0,255,215,.12);
    transition:transform .2s ease, box-shadow .25s ease, background .25s ease;
  }
  .audiobar button:hover{
    transform:scale(1.09);
    box-shadow:
      0 0 30px rgba(0,255,215,.62),
      inset 0 0 20px rgba(0,255,215,.22);
  }
  .audiobar button:active{transform:scale(.94);}
  .audiobar button svg{width:52%;height:52%;display:block;fill:currentColor;}

  .audiobar .meta{
    display:flex;flex-direction:column;gap:3px;
    font-family:"Times New Roman","Songti SC",serif;
    line-height:1.32;
    white-space:nowrap;
  }
  .audiobar .meta .ttl{
    font-size:clamp(9px,1.05vw,11.5px);
    letter-spacing:.30em;
    text-transform:uppercase;
    color:#8ffff0;
    text-shadow:0 0 16px rgba(0,255,215,.6);
  }
  .audiobar .meta .sub{
    font-size:clamp(8px,.92vw,10px);
    letter-spacing:.18em;
    color:#b39bff;
    opacity:.72;
    text-shadow:0 0 14px rgba(160,90,255,.5);
  }

  /* LED 电平指示灯 */
  .leds{
    display:flex;align-items:flex-end;gap:3px;height:clamp(16px,2vw,22px);
  }
  .leds i{
    display:block;width:3px;border-radius:2px;
    background:linear-gradient(180deg,#6dfff0,#28c8ff);
    box-shadow:0 0 9px rgba(70,255,235,.85);
    transform-origin:bottom;
    opacity:.32;
    height:100%;
    transition:opacity .18s linear;
  }
  .audiobar.on .leds i{opacity:.95;animation:eq .78s ease-in-out infinite alternate;}
  .audiobar.on .leds i:nth-child(1){animation-delay:0s;   --h:.42;}
  .audiobar.on .leds i:nth-child(2){animation-delay:.11s; --h:.86;}
  .audiobar.on .leds i:nth-child(3){animation-delay:.23s; --h:.58;}
  .audiobar.on .leds i:nth-child(4){animation-delay:.07s; --h:.96;}
  .audiobar.on .leds i:nth-child(5){animation-delay:.31s; --h:.50;}
  @keyframes eq{
    from{transform:scaleY(.22);}
    to  {transform:scaleY(var(--h,1));}
  }

  .nogl::after{
    content:"当前环境不支持 WebGL";
    position:fixed;inset:0;display:grid;place-items:center;
    color:#8ff5e2;font:16px/1.6 sans-serif;letter-spacing:.2em;
  }

  @media (max-width:560px){
    .audiobar .meta .sub{display:none;}
    .leds{display:none;}
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div class="corner">
  KLEIN BOTTLE &nbsp;/&nbsp; ∂M = ∅<br>
  ORIENTABILITY &nbsp;=&nbsp; 0
</div>

<div class="hud">
  <div class="tag"><span class="dot"></span>KLEIN QUAD-CUBE · NON-ORIENTABLE IMMERSION</div>
  <div class="eq">
    (x²+y²+z²+2y−1)&#8202;[&#8202;(x²+y²+z²−2y−1)² − 8z²&#8202;] + 16&#8239;x&#8239;z&#8239;(x²+y²+z²−2y−1) = 0
  </div>
  <div class="eq sm">
    x = (a + cos&#8239;<sup>u</sup>&#8260;<sub>2</sub>&#8239;sin&#8239;v − sin&#8239;<sup>u</sup>&#8260;<sub>2</sub>&#8239;sin&#8239;2v)&#8239;cos&#8239;u
    &nbsp;,&nbsp; z = sin&#8239;<sup>u</sup>&#8260;<sub>2</sub>&#8239;sin&#8239;v + cos&#8239;<sup>u</sup>&#8260;<sub>2</sub>&#8239;sin&#8239;2v
  </div>
</div>

<!-- ============ 音频控制条 ============ -->
<div class="audiobar" id="audiobar">
  <button id="playBtn" title="播放 / 暂停 科技音景" aria-label="播放或暂停背景音乐">
    <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z"/></svg>
    <svg id="iconPause" viewBox="0 0 24 24" style="display:none">
      <path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/>
    </svg>
  </button>
  <div class="leds">
    <i></i><i></i><i></i><i></i><i></i>
  </div>
  <div class="meta">
    <div class="ttl">SYNTH&nbsp;·&nbsp;TECH&nbsp;AMBIENT</div>
    <div class="sub" id="subText">点击播放 · 科技音景</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     一、WebGL 视觉部分（克莱因四角方块体）
     ============================================================ */
  var canvas = document.getElementById('gl');
  var gl = canvas.getContext('webgl', {
        alpha: false, antialias: false, depth: false, stencil: false,
        premultipliedAlpha: false, preserveDrawingBuffer: false,
        powerPreference: 'high-performance'
      }) || canvas.getContext('experimental-webgl');

  var VS = [
    'attribute vec2 aPos;',
    'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
  ].join('\n');

  var FS = [
    'precision highp float;',
    '',
    'uniform vec2  uRes;',
    'uniform float uTime;',
    '',
    '#define PI  3.14159265359',
    '#define TAU 6.28318530718',
    '#define MAX_STEPS 76',
    '#define MAX_DIST  24.0',
    '#define SURF      0.0016',
    '',
    'float hash21(vec2 p){',
    '    p = fract(p * vec2(123.34, 345.45));',
    '    p += dot(p, p + 34.345);',
    '    return fract(p.x * p.y);',
    '}',
    '',
    'mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1.,0.,0., 0.,c,s, 0.,-s,c); }',
    'mat3 rotY(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }',
    'mat3 rotZ(float a){ float c=cos(a), s=sin(a); return mat3(c,s,0., -s,c,0., 0.,0.,1.); }',
    '',
    'float smin(float a, float b, float k){',
    '    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);',
    '    return mix(b, a, h) - k * h * (1.0 - h);',
    '}',
    '',
    'float sdSquareRing(vec3 p, float R, float r){',
    '    vec2 q = vec2(length(p.xz) - R, p.y);',
    '    vec2 d = abs(q) - r;',
    '    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);',
    '}',
    '',
    'float map(vec3 p){',
    '    float t = uTime;',
    '    vec3 q = p;',
    '    q += 0.050 * sin(q.yzx * 2.7 + t * 0.85);',
    '    q += 0.030 * cos(q.zxy * 4.9 - t * 1.15);',
    '    q += 0.014 * sin(q.xyz * 9.3 + t * 1.9);',
    '',
    '    float shrink = 0.74 + 0.26 * (0.5 + 0.5 * cos(t * 0.62));',
    '    float R = (0.98 + 0.10 * sin(t * 0.40)) * shrink;',
    '    float r = (0.168 + 0.026 * sin(t * 0.71 + 1.0)) * shrink;',
    '',
    '    float a1 = t * 0.36;',
    '    float a2 = t * 0.29 + 1.15;',
    '    float a3 = t * 0.24 + 2.35;',
    '    float a4 = t * 0.20 + 3.55;',
    '',
    '    float d1 = sdSquareRing(rotY(a1) * q,                        R,        r);',
    '    float d2 = sdSquareRing(rotX(a2) * q,                        R * 0.93, r * 0.95);',
    '    float d3 = sdSquareRing(rotZ(a3) * q,                        R * 1.07, r * 1.05);',
    '    float d4 = sdSquareRing(rotX(a4*0.9) * rotY(a4*1.3) * q,     R * 0.86, r * 0.88);',
    '',
    '    float k = 0.13;',
    '    float d = smin(d1, d2, k);',
    '    d = smin(d, d3, k);',
    '    d = smin(d, d4, k);',
    '    return d;',
    '}',
    '',
    'vec3 calcNormal(vec3 p){',
    '    vec2 e = vec2(0.0016, -0.0016);',
    '    return normalize(',
    '        e.xyy * map(p + e.xyy) +',
    '        e.yyx * map(p + e.yyx) +',
    '        e.yxy * map(p + e.yxy) +',
    '        e.xxx * map(p + e.xxx)',
    '    );',
    '}',
    '',
    'vec3 background(vec3 rd, vec2 uv){',
    '    float t = uTime;',
    '    vec3 top = vec3(0.006, 0.040, 0.070);',
    '    vec3 bot = vec3(0.012, 0.108, 0.112);',
    '    vec3 c   = mix(bot, top, smoothstep(-0.85, 0.95, rd.y));',
    '',
    '    vec2 gv = vec2(atan(rd.z, rd.x) * 2.2,',
    '                   asin(clamp(rd.y, -1.0, 1.0)) * 2.2);',
    '    vec2 gg = abs(fract(gv * 3.0) - 0.5);',
    '    float g = smoothstep(0.035, 0.0, min(gg.x, gg.y));',
    '    c += vec3(0.04, 0.44, 0.42) * g * 0.20;',
    '',
    '    c += vec3(0.05, 0.30, 0.34) * 0.35 *',
    '         (0.5 + 0.5 * sin(uv.x * 3.4 + t * 0.30)) *',
    '         (0.5 + 0.5 * cos(uv.y * 2.8 - t * 0.24));',
    '',
    '    c *= 1.0 - 0.55 * length(uv) * 0.55;',
    '    return c;',
    '}',
    '',
    'void main(){',
    '    vec2  uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;',
    '    float t  = uTime;',
    '',
    '    float ca  = t * 0.21;',
    '    vec3  ro  = vec3(sin(ca) * 3.45, 0.85 * sin(t * 0.29), cos(ca) * 3.45);',
    '    vec3  ta  = vec3(0.0, 0.05 * sin(t * 0.37), 0.0);',
    '    vec3  fwd = normalize(ta - ro);',
    '    vec3  rgt = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));',
    '    vec3  upv = cross(rgt, fwd);',
    '    vec3  rd  = normalize(fwd + uv.x * 1.45 * rgt + uv.y * 1.45 * upv);',
    '',
    '    vec3 col = background(rd, uv);',
    '',
    '    float dTot = 0.0;',
    '    float glow = 0.0;',
    '    bool  hit  = false;',
    '    vec3  p    = ro;',
    '',
    '    for (int i = 0; i < MAX_STEPS; i++){',
    '        p = ro + rd * dTot;',
    '        float d = map(p);',
    '        glow += exp(-d * 15.0) * 0.0135;',
    '        if (d < SURF) { hit = true; break; }',
    '        dTot += d * 0.86;',
    '        if (dTot > MAX_DIST) break;',
    '    }',
    '',
    '    if (hit) {',
    '        vec3  n   = calcNormal(p);',
    '        vec3  v   = -rd;',
    '        float ndv = max(dot(n, v), 0.0);',
    '        float fres = pow(1.0 - ndv, 2.7);',
    '',
    '        vec3 neonC = vec3(0.05, 1.00, 0.92);',
    '        vec3 neonP = vec3(0.76, 0.30, 1.00);',
    '',
    '        vec3 surf = vec3(0.014, 0.062, 0.072);',
    '',
    '        vec3  Ld  = normalize(vec3(0.62, 0.78, 0.52));',
    '        float dif = max(dot(n, Ld), 0.0);',
    '        surf += vec3(0.045, 0.175, 0.190) * dif;',
    '',
    '        float tint = 0.5 + 0.5 * sin(p.y * 2.3 + t * 0.75);',
    '        surf += mix(neonC, neonP, tint) * fres * 2.35;',
    '',
    '        float sp = 0.0;',
    '        sp += pow(0.5 + 0.5 * sin(p.x * 8.5 + t * 2.60), 18.0);',
    '        sp += pow(0.5 + 0.5 * sin(p.y * 8.5 - t * 3.05), 18.0);',
    '        sp += pow(0.5 + 0.5 * sin(p.z * 8.5 + t * 2.20), 18.0);',
    '        sp += pow(0.5 + 0.5 * sin(length(p) * 11.0 - t * 3.6), 22.0) * 0.8;',
    '        surf += neonC * sp * (0.45 + 1.65 * fres) * 1.75;',
    '',
    '        float spP = pow(0.5 + 0.5 * sin(p.x * 6.2 - p.y * 5.1 + t * 2.9), 24.0);',
    '        surf += neonP * spP * (0.35 + 1.3 * fres) * 1.25;',
    '',
    '        float lines = 0.5 + 0.5 * sin(p.x * 42.0) * sin(p.y * 42.0) * sin(p.z * 42.0);',
    '        surf += neonP * lines * 0.055 * (0.3 + fres);',
    '',
    '        surf += neonC * pow(fres, 5.0) * 1.6;',
    '',
    '        col = surf;',
    '    }',
    '',
    '    col += vec3(0.08, 0.52, 0.60) * glow * 0.95;',
    '    col += vec3(0.32, 0.10, 0.55) * glow * 0.30;',
    '',
    '    float vig = smoothstep(1.48, 0.10, length(uv));',
    '    col *= 0.44 + 0.66 * vig;',
    '',
    '    col = col / (1.0 + col * 0.52);',
    '    col = pow(max(col, 0.0), vec3(0.88));',
    '    col += (hash21(gl_FragCoord.xy + fract(t)) - 0.5) * 0.012;',
    '',
    '    gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('Shader error:\n' + gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  var prog = null, vs, fs;

  if (gl) {
    vs = compile(gl.VERTEX_SHADER, VS);
    fs = compile(gl.FRAGMENT_SHADER, FS);
    if (vs && fs) {
      prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.error('Link error:\n' + gl.getProgramInfoLog(prog));
        prog = null;
      }
    }
  }

  var uRes = null, uTime = null;

  if (prog) {
    gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER,
      new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

    var aPos = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    uRes  = gl.getUniformLocation(prog, 'uRes');
    uTime = gl.getUniformLocation(prog, 'uTime');
  } else {
    document.body.classList.add('nogl');
  }

  /* ---------------- 自适应尺寸 ---------------- */
  var DPR_CAP = 1.45;
  if (window.innerWidth * window.innerHeight > 1900000) DPR_CAP = 1.0;
  if (window.innerWidth < 620) DPR_CAP = 1.5;

  function resize() {
    if (!gl) return;
    var dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    var w = Math.max(1, Math.floor(window.innerWidth  * dpr));
    var h = Math.max(1, Math.floor(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', resize, { passive: true });
  resize();

  /* ---------------- 视觉渲染循环 ---------------- */
  var t0 = performance.now();
  var elapsed = 0;
  var pageHidden = false;

  document.addEventListener('visibilitychange', function () {
    pageHidden = document.hidden;
    if (!pageHidden) {
      t0 = performance.now() - elapsed * 1000;
      requestAnimationFrame(frame);
    }
  });

  function frame(now) {
    if (pageHidden) return;
    resize();
    elapsed = (now - t0) / 1000;

    if (gl && prog) {
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, elapsed);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ============================================================
     二、科技感背景音乐（Web Audio 实时合成）
     ------------------------------------------------------------
     · 调性：D 小调，BPM 104
     · 层次：低频脉冲 Bass / 持续 Pad 和弦 / 16 分琶音 /
             高通噪声 Hi-Hat / 高音闪烁 Blip
     · 效果：程序化混响 + 附点延迟 + 立体声摆动
     ============================================================ */
  var AC = window.AudioContext || window.webkitAudioContext;

  var audioCtx = null;
  var masterGain = null;
  var delayNode = null, delayFeedback = null, delayWet = null;
  var convolver = null, reverbWet = null;

  var isPlaying = false;
  var schedulerId = null;
  var nextNoteTime = 0;
  var step16 = 0;
  var elapsedAudio = 0;

  /* --- MIDI -> 频率 --- */
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  var BPM = 104;
  var SPB = 60 / BPM;            // 每拍秒数
  var S16 = SPB / 4;             // 每 16 分音符秒数

  /* --- 和弦进行：Dm -> Bb -> F -> C（各一小节） --- */
  var CHORDS = [
    { root: 38, pad: [50, 53, 57, 62], arp: [62, 65, 69, 74, 77, 81] },  // Dm
    { root: 34, pad: [46, 50, 53, 58], arp: [58, 62, 65, 70, 74, 77] },  // Bb
    { root: 29, pad: [41, 45, 48, 53], arp: [53, 57, 60, 65, 69, 72] },  // F
    { root: 36, pad: [48, 52, 55, 60], arp: [60, 64, 67, 72, 76, 79] }   // C
  ];

  /* --- 程序化混响脉冲响应 --- */
  function buildImpulse(duration, decay) {
    var rate = audioCtx.sampleRate;
    var len  = Math.max(1, Math.floor(rate * duration));
    var buf  = audioCtx.createBuffer(2, len, rate);
    for (var ch = 0; ch < 2; ch++) {
      var data = buf.getChannelData(ch);
      for (var i = 0; i < len; i++) {
        var n = i / len;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - n, decay);
      }
    }
    return buf;
  }

  /* --- 初始化音频链路（延迟创建） --- */
  function initAudio() {
    if (audioCtx) return;

    audioCtx = new AC();

    /* 总线 */
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.0001;
    masterGain.connect(audioCtx.destination);

    /* 附点八分延迟 */
    delayNode = audioCtx.createDelay(2.0);
    delayNode.delayTime.value = S16 * 6;      // 附点八分 = 3/4 拍

    delayFeedback = audioCtx.createGain();
    delayFeedback.gain.value = 0.36;

    var delayLP = audioCtx.createBiquadFilter();
    delayLP.type = 'lowpass';
    delayLP.frequency.value = 2400;
    delayLP.Q.value = 0.9;

    delayWet = audioCtx.createGain();
    delayWet.gain.value = 0.30;

    delayNode.connect(delayLP);
    delayLP.connect(delayFeedback);
    delayFeedback.connect(delayNode);
    delayNode.connect(delayWet);
    delayWet.connect(masterGain);

    /* 混响 */
    convolver = audioCtx.createConvolver();
    convolver.buffer = buildImpulse(3.1, 2.6);

    reverbWet = audioCtx.createGain();
    reverbWet.gain.value = 0.42;

    convolver.connect(reverbWet);
    reverbWet.connect(masterGain);
  }

  /* ---------------- 乐器音色 ---------------- */

  /* 低频脉冲 Bass */
  function playBass(time, midi, dur) {
    var f0 = mtof(midi);

    var osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f0, time);

    var sub = audioCtx.createOscillator();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(f0 * 0.5, time);

    var lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 9;
    lp.frequency.setValueAtTime(1100, time);
    lp.frequency.exponentialRampToValueAtTime(110, time + dur * 0.9);

    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.58, time + 0.010);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);

    osc.connect(lp);
    sub.connect(lp);
    lp.connect(g);
    g.connect(masterGain);

    osc.start(time); osc.stop(time + dur + 0.05);
    sub.start(time); sub.stop(time + dur + 0.05);
  }

  /* 16 分琶音 */
  function playArp(time, midi, dur, pan) {
    var f0 = mtof(midi);

    var osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(f0, time);

    var lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 7;
    lp.frequency.setValueAtTime(6200, time);
    lp.frequency.exponentialRampToValueAtTime(1300, time + dur);

    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.095, time + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);

    var p = audioCtx.createStereoPanner();
    p.pan.value = pan;

    osc.connect(lp);
    lp.connect(g);
    g.connect(p);
    p.connect(masterGain);
    p.connect(delayNode);

    osc.start(time); osc.stop(time + dur + 0.06);
  }

  /* 持续 Pad 和弦 */
  function playPad(time, midis, dur) {
    var lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 1.6;
    lp.frequency.setValueAtTime(420, time);
    lp.frequency.linearRampToValueAtTime(1750, time + dur * 0.45);
    lp.frequency.linearRampToValueAtTime(560, time + dur);

    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(0.085, time + dur * 0.32);
    g.gain.linearRampToValueAtTime(0.0001, time + dur);

    lp.connect(g);
    g.connect(masterGain);
    g.connect(convolver);

    for (var i = 0; i < midis.length; i++) {
      var f0 = mtof(midis[i]);
      for (var d = 0; d < 2; d++) {
        var osc = audioCtx.createOscillator();
        osc.type = (d === 0) ? 'sawtooth' : 'triangle';
        osc.frequency.value = f0;
        osc.detune.value = (d === 0) ? -7 : 8;
        osc.connect(lp);
        osc.start(time);
        osc.stop(time + dur + 0.1);
      }
    }
  }

  /* 高通噪声 Hi-Hat */
  function playHat(time, vol) {
    var rate = audioCtx.sampleRate;
    var len  = Math.max(1, Math.floor(rate * 0.055));
    var buf  = audioCtx.createBuffer(1, len, rate);
    var d    = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    var src = audioCtx.createBufferSource();
    src.buffer = buf;

    var hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 7600;

    var g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.048);

    src.connect(hp);
    hp.connect(g);
    g.connect(masterGain);

    src.start(time);
    src.stop(time + 0.07);
  }

  /* 高音闪烁 Blip */
  function playBlip(time, midi) {
    var f0 = mtof(midi);

    var osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f0, time);
    osc.frequency.exponentialRampToValueAtTime(f0 * 2.0, time + 0.085);

    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.062, time + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.20);

    var p = audioCtx.createStereoPanner();
    p.pan.value = Math.random() * 2 - 1;

    osc.connect(g);
    g.connect(p);
    p.connect(masterGain);
    p.connect(delayNode);

    osc.start(time);
    osc.stop(time + 0.26);
  }

  /* 低频扫描音（每 8 小节一次，营造科技转场） */
  function playSweep(time) {
    var osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(70, time);
    osc.frequency.exponentialRampToValueAtTime(1400, time + 1.6);

    var bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 12;
    bp.frequency.setValueAtTime(160, time);
    bp.frequency.exponentialRampToValueAtTime(4200, time + 1.6);

    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(0.075, time + 0.35);
    g.gain.linearRampToValueAtTime(0.0001, time + 1.6);

    osc.connect(bp);
    bp.connect(g);
    g.connect(masterGain);
    g.connect(convolver);
    g.connect(delayNode);

    osc.start(time);
    osc.stop(time + 1.7);
  }

  /* ---------------- 步进调度 ---------------- */

  function scheduleStep(step, time) {
    var barIdx = Math.floor(step / 16) % 4;
    var chord  = CHORDS[barIdx];

    /* --- Bass：每拍一次，第 1、3 拍加八度跳进 --- */
    if (step % 4 === 0) {
      var beat = Math.floor(step / 4) % 4;
      var bassMidi = (beat === 1 || beat === 3)
        ? chord.root + 12
        : chord.root;
      playBass(time, bassMidi, SPB * 0.92);
    }

    /* --- Pad：每小节铺一次 --- */
    if (step % 16 === 0) {
      playPad(time, chord.pad, SPB * 4.05);
    }

    /* --- 琶音：8 分音符为主，偶尔 16 分密织 --- */
    if (step % 2 === 0) {
      var ai  = (step * 3 + barIdx * 2) % chord.arp.length;
      var mid = chord.arp[ai] + 12;
      var pan = Math.sin(step * 0.62) * 0.62;
      playArp(time, mid, S16 * 1.9, pan);
    }
    /* 每 4 步补一个高八度细碎音 */
    if (step % 8 === 3) {
      var mid2 = chord.arp[(step * 5) % chord.arp.length] + 24;
      playArp(time, mid2, S16 * 1.1, -pan2(step));
    }

    /* --- Hi-Hat：反拍律动 --- */
    if (step % 2 === 1) {
      playHat(time, (step % 4 === 3) ? 0.055 : 0.030);
    }

    /* --- Blip：随机高音闪烁 --- */
    if (Math.random() < 0.13) {
      var scale = chord.arp;
      var m = scale[Math.floor(Math.random() * scale.length)] + 12;
      playBlip(time, m);
    }

    /* --- 每 8 小节一次的扫描转场 --- */
    if (step === 0 && Math.floor(elapsedAudio / (SPB * 32)) % 2 === 1) {
      playSweep(time);
    }
  }

  function pan2(step) {
    return (Math.sin(step * 0.31) * 0.6) - 0.2;
  }

  /* ---------------- 调度器 ---------------- */
  function scheduler() {
    if (!audioCtx || !isPlaying) return;
    var now = audioCtx.currentTime;

    while (nextNoteTime < now + 0.14) {
      scheduleStep(step16, nextNoteTime);
      nextNoteTime += S16;
      step16 = (step16 + 1) % 64;
    }
  }

  /* ---------------- 播放 / 暂停 ---------------- */
  var playBtn  = document.getElementById('playBtn');
  var iconPlay = document.getElementById('iconPlay');
  var iconPause= document.getElementById('iconPause');
  var bar      = document.getElementById('audiobar');
  var subText  = document.getElementById('subText');

  function startAudio() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    isPlaying = true;
    step16 = 0;
    nextNoteTime = audioCtx.currentTime + 0.08;
    elapsedAudio = 0;

    /* 主增益淡入 */
    var g = masterGain.gain;
    g.cancelScheduledValues(audioCtx.currentTime);
    g.setValueAtTime(Math.max(g.value, 0.0001), audioCtx.currentTime);
    g.exponentialRampToValueAtTime(0.85, audioCtx.currentTime + 2.2);

    if (schedulerId) clearInterval(schedulerId);
    schedulerId = setInterval(scheduler, 25);

    iconPlay.style.display  = 'none';
    iconPause.style.display = 'block';
    bar.classList.add('on');
    subText.textContent = '正在播放 · 点击暂停';
  }

  function stopAudio() {
    if (!audioCtx) return;
    isPlaying = false;

    var g = masterGain.gain;
    g.cancelScheduledValues(audioCtx.currentTime);
    g.setValueAtTime(g.value, audioCtx.currentTime);
    g.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.65);

    if (schedulerId) { clearInterval(schedulerId); schedulerId = null; }

    iconPlay.style.display  = 'block';
    iconPause.style.display = 'none';
    bar.classList.remove('on');
    subText.textContent = '点击播放 · 科技音景';
  }

  playBtn.addEventListener('click', function () {
    if (!audioCtx) {
      startAudio();
    } else if (isPlaying) {
      stopAudio();
    } else {
      startAudio();
    }
  });

  /* 页面隐藏时暂停音频调度，回来恢复 */
  document.addEventListener('visibilitychange', function () {
    if (!audioCtx || !isPlaying) return;
    if (document.hidden) {
      if (schedulerId) { clearInterval(schedulerId); schedulerId = null; }
    } else {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      nextNoteTime = audioCtx.currentTime + 0.08;
      if (!schedulerId) schedulerId = setInterval(scheduler, 25);
    }
  });

  /* 自动尝试播放：多数浏览器仍需一次用户手势 */
  window.addEventListener('pointerdown', function once() {
    window.removeEventListener('pointerdown', once);
    if (!audioCtx && !isPlaying) {
      /* 首次点击页面任意位置即启动音景（若想默认静音可删除此段） */
      startAudio();
    }
  }, { once: true });

})();
</script>
</body>
</html>
