<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>欧拉-拉格朗日流体流线 · 粒子双视角</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#010206;
    font-family:"SF Mono",Consolas,"Courier New",monospace;cursor:crosshair}
  canvas{display:block;position:fixed;inset:0}

  .hud{
    position:fixed;z-index:10;pointer-events:none;
    font-size:12px;letter-spacing:.4px;line-height:2.0;
    color:#7fe8ff;
    text-shadow:0 0 10px rgba(0,200,255,.75),0 0 26px rgba(90,60,255,.35);
  }
  .hud .pp{color:#c9a8ff;text-shadow:0 0 10px rgba(160,90,255,.85)}
  .hud .or{color:#ffc46b;text-shadow:0 0 10px rgba(255,160,50,.85)}
  .hud .wh{color:#f0f8ff;text-shadow:0 0 12px rgba(220,240,255,.9)}
  .hud .dim{color:#4a6a88;font-size:11px;text-shadow:none}
  .tl{top:16px;left:20px}
  .tr{top:16px;right:20px;text-align:right}
  .bl{bottom:18px;left:20px}
  .br{bottom:18px;right:20px;text-align:right}

  .mode{
    position:fixed;z-index:12;bottom:26px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;padding:5px;
    background:rgba(4,12,24,.65);
    border:1px solid rgba(80,200,255,.22);
    border-radius:22px;
    backdrop-filter:blur(9px);
    box-shadow:0 0 30px rgba(0,120,255,.12);
  }
  .mode button{
    font-family:inherit;font-size:10px;letter-spacing:1.6px;
    color:#5fc8ff;background:transparent;border:1px solid transparent;
    border-radius:16px;padding:6px 15px;cursor:pointer;
    transition:all .25s;
    text-shadow:0 0 8px rgba(0,190,255,.6);
  }
  .mode button:hover{color:#aef0ff}
  .mode button.on{
    color:#fff;
    background:linear-gradient(135deg,rgba(0,120,220,.35),rgba(160,60,255,.35));
    border-color:rgba(120,220,255,.5);
    text-shadow:0 0 12px rgba(180,240,255,.95);
    box-shadow:0 0 20px rgba(0,160,255,.3);
  }

  .hint{
    position:fixed;z-index:10;bottom:82px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:2.4px;color:#3d5f78;
    text-shadow:0 0 10px rgba(0,170,255,.35);
    pointer-events:none;
  }

  @keyframes blink{
    0%,100%{opacity:.35}
    50%{opacity:1}
  }
  .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#7fe8ff;box-shadow:0 0 10px #00c8ff;
    margin-right:6px;vertical-align:middle;
    animation:blink 1.5s ease-in-out infinite;
  }

  .probe{
    position:fixed;z-index:11;pointer-events:none;
    padding:7px 11px;border-radius:7px;
    background:rgba(3,12,24,.82);
    border:1px solid rgba(90,200,255,.30);
    backdrop-filter:blur(6px);
    font-size:10.5px;letter-spacing:.4px;line-height:1.75;
    color:#9fe9ff;
    text-shadow:0 0 8px rgba(0,200,255,.7);
    opacity:0;transition:opacity .15s;
    white-space:nowrap;
  }
  .probe.on{opacity:1}
  .probe .k{color:#c9a8ff}
  .probe .v{color:#f0f8ff}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud tl">
  <div>∂ρ/∂t + ∇·(ρv) = 0</div>
  <div>ρ(∂v/∂t + v·∇v) = −∇p + μ∇²v + ρg</div>
  <div>ω = ∇ × v</div>
  <div class="dim">欧拉连续性 · 纳维-斯托克斯 · 涡度</div>
</div>

<div class="hud tr">
  <div>Re = <span class="wh">1840</span> &nbsp;<span class="pp">层流</span></div>
  <div>ω<sub>max</sub> = <span class="or" id="omega">12.60</span> s⁻¹</div>
  <div>|v|<sub>rms</sub> = <span class="wh" id="vrms">2.94</span> m/s</div>
</div>

<div class="hud bl">
  <div>N<sub>particles</sub> = <span class="wh" id="nP">0</span></div>
  <div>Δt = <span class="wh">0.0025</span> s</div>
  <div class="dim"><span class="dot"></span>拉格朗日跟踪 · 欧拉场同步</div>
</div>

<div class="hud br">
  <div>涡旋数 <span class="pp" id="nV">0</span></div>
  <div class="dim" id="viewName">双视角 · 叠加显示</div>
</div>

<div class="mode">
  <button id="m0" class="on">双视角</button>
  <button id="m1">欧拉场</button>
  <button id="m2">拉格朗日</button>
</div>

<div class="hint">拖拽放入扰动源 · 划过读取速度矢量</div>

<div class="probe" id="probe"></div>

<script>
(function(){
"use strict";

/* ============================================================
   基础
============================================================ */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
const TAU = Math.PI * 2;
const CYCLE = 30;

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rand  = (a,b)=> a + Math.random()*(b-a);

/* ============================================================
   画布
============================================================ */
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.floor(W*DPR);
  cv.height = Math.floor(H*DPR);
  cv.style.width  = W+'px';
  cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* ============================================================
   涡旋场
============================================================ */
const vortices = [];

function initVortices(){
  vortices.length = 0;
  const n = 5;
  for (let i=0;i<n;i++){
    vortices.push({
      a0 : (i/n)*TAU + rand(-0.4,0.4),
      rad: rand(80,230),
      spd: rand(0.10,0.20),
      str: (i%2 ? -1 : 1) * rand(85000, 135000),
      sig: rand(48, 88),
      cx : W*0.5, cy : H*0.5,
      life: Infinity, maxLife: Infinity,
      fixed: false
    });
  }
}

function addDisturbance(x, y){
  vortices.push({
    a0 : 0, rad : 0, spd : 0,
    str: (Math.random()<0.5 ? -1 : 1) * rand(90000, 140000),
    sig: rand(38, 58),
    cx : x, cy : y,
    life: 4.0, maxLife: 4.0,
    fixed: true
  });
}

function updateVortices(tt, dt){
  const cx = W*0.5, cy = H*0.5;
  for (let i=vortices.length-1;i>=0;i--){
    const v = vortices[i];
    if (v.life !== Infinity){
      v.life -= dt;
      if (v.life <= 0){ vortices.splice(i,1); continue; }
    }
    if (!v.fixed){
      const a = v.a0 + tt * v.spd;
      v.cx = cx + Math.cos(a) * v.rad;
      v.cy = cy + Math.sin(a) * v.rad * 0.72;
    }
  }
}

/* ============================================================
   速度场  v(x,y,t)
============================================================ */
function velocity(x, y, tt){
  let vx = 0, vy = 0;
  const cx = W*0.5, cy = H*0.5;

  /* --- 全局旋转 --- */
  const dx0 = x - cx, dy0 = y - cy;
  const r0  = Math.sqrt(dx0*dx0 + dy0*dy0) + 90;
  const rot = 235 * (r0 / (r0 + 280));
  vx += -dy0 / r0 * rot;
  vy +=  dx0 / r0 * rot;

  /* --- 涡旋叠加 --- */
  for (let i=0;i<vortices.length;i++){
    const v = vortices[i];
    const dx = x - v.cx, dy = y - v.cy;
    const r2 = dx*dx + dy*dy + v.sig*v.sig;
    const inv = v.str / (TAU * r2);
    vx += -dy * inv;
    vy +=  dx * inv;
  }
  return [vx, vy];
}

/* 速度色相映射：青→蓝→紫→品红→橙黄 */
function speedHue(s){
  return (188 + s * 232) % 360;
}

/* ============================================================
   拉格朗日粒子
============================================================ */
const HIST = 12;
const N_PART = 1100;
const particles = [];

function initParticles(){
  particles.length = 0;
  for (let i=0;i<N_PART;i++){
    const x = Math.random()*W;
    const y = Math.random()*H;
    const p = {
      x: x, y: y,
      hx: new Float32Array(HIST),
      hy: new Float32Array(HIST),
      hi: 0,
      hue: 200
    };
    for (let k=0;k<HIST;k++){ p.hx[k]=x; p.hy[k]=y; }
    particles.push(p);
  }
}

function respawn(p){
  p.x = Math.random()*W;
  p.y = Math.random()*H;
  for (let k=0;k<HIST;k++){ p.hx[k]=p.x; p.hy[k]=p.y; }
  p.hi = 0;
}

function updateParticles(dt){
  const k = 1.45;
  for (let i=0;i<particles.length;i++){
    const p = particles[i];
    const v = velocity(p.x, p.y, t);
    const sp = Math.sqrt(v[0]*v[0] + v[1]*v[1]);
    p.hue = speedHue(clamp(sp/430, 0, 1));

    p.x += v[0] * dt * k;
    p.y += v[1] * dt * k;

    if (p.x < -80 || p.x > W+80 || p.y < -80 || p.y > H+80){
      respawn(p);
      continue;
    }

    p.hi = (p.hi + 1) % HIST;
    p.hx[p.hi] = p.x;
    p.hy[p.hi] = p.y;
  }
}

/* ============================================================
   欧拉流线种子
============================================================ */
const seeds = [];

function initSeeds(){
  seeds.length = 0;
  for (let i=0;i<54;i++){
    seeds.push({
      x : rand(W*0.04, W*0.96),
      y : rand(H*0.04, H*0.96),
      hue : rand(178, 330)
    });
  }
}

/* ============================================================
   渲染：背景
============================================================ */
function drawBG(){
  const g = ctx.createRadialGradient(W*0.5, H*0.46, 0,
                                     W*0.5, H*0.5, Math.max(W,H)*0.85);
  g.addColorStop(0,   '#050d1a');
  g.addColorStop(0.5, '#02050c');
  g.addColorStop(1,   '#010103');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  /* 星尘 */
  ctx.globalCompositeOperation = 'lighter';
  const n = Math.floor(W*H/26000);
  for (let i=0;i<n;i++){
    const sx = (i*137.51 + t*3.5) % W;
    const sy = (i*91.73  + t*1.8) % H;
    const a = 0.025 + 0.055*Math.abs(Math.sin(i*1.9 + t*0.5));
    ctx.fillStyle = 'rgba(120,180,255,'+a.toFixed(3)+')';
    ctx.fillRect(sx, sy, 1.2, 1.2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   渲染：涡旋辉光
============================================================ */
function drawVortexGlow(){
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<vortices.length;i++){
    const v = vortices[i];
    let fade = 1;
    if (v.life !== Infinity){
      fade = clamp(v.life / v.maxLife, 0, 1);
      fade = Math.sin(fade * Math.PI);
    }
    const r = v.sig * 3.4;
    const hue = v.str > 0 ? 282 : 190;
    const g = ctx.createRadialGradient(v.cx, v.cy, 0, v.cx, v.cy, r);
    g.addColorStop(0,   'hsla('+hue+',100%,68%,'+(0.075*fade).toFixed(3)+')');
    g.addColorStop(0.5, 'hsla('+hue+',100%,58%,'+(0.030*fade).toFixed(3)+')');
    g.addColorStop(1,   'hsla('+hue+',100%,50%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(v.cx-r, v.cy-r, r*2, r*2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   渲染：欧拉流线
============================================================ */
function drawStreamlines(alpha){
  if (alpha <= 0.01) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const STEPS = 42;
  const STEP  = 6.5;

  for (let i=0;i<seeds.length;i++){
    const s = seeds[i];
    let x = s.x, y = s.y;

    ctx.beginPath();
    ctx.moveTo(x, y);

    let hs = 0;
    for (let k=0;k<STEPS;k++){
      const v = velocity(x, y, t);
      const sp = Math.sqrt(v[0]*v[0] + v[1]*v[1]) || 1;
      x += v[0]/sp * STEP;
      y += v[1]/sp * STEP;
      ctx.lineTo(x, y);
      if (k === STEPS>>1) hs = sp;
      if (x < -60 || x > W+60 || y < -60 || y > H+60) break;
    }

    const sn = clamp(hs/430, 0, 1);
    const hue = speedHue(sn);
    const a1 = alpha * (0.10 + 0.14*sn);

    ctx.strokeStyle = 'hsla('+hue.toFixed(0)+',100%,66%,'+a1.toFixed(3)+')';
    ctx.lineWidth = 1.05;
    ctx.stroke();

    /* 亮芯 */
    ctx.strokeStyle = 'hsla('+hue.toFixed(0)+',100%,84%,'+(a1*0.55).toFixed(3)+')';
    ctx.lineWidth = 0.45;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   渲染：矢量场箭头
============================================================ */
function drawArrows(alpha){
  if (alpha <= 0.01) return;
  const cols = 15, rows = 10;
  const mx = W*0.08, my = H*0.08;
  const gw = W*0.84, gh = H*0.84;

  ctx.globalCompositeOperation = 'lighter';

  for (let j=0;j<rows;j++){
    for (let i=0;i<cols;i++){
      const x = mx + gw*(i+0.5)/cols;
      const y = my + gh*(j+0.5)/rows;
      const v = velocity(x, y, t);
      const sp = Math.sqrt(v[0]*v[0] + v[1]*v[1]);
      const sn = clamp(sp/430, 0, 1);
      const len = 5 + sn*19;
      const ux = v[0]/(sp||1), uy = v[1]/(sp||1);
      const hue = speedHue(sn);
      const a = alpha * (0.22 + sn*0.46);

      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + ux*len, y + uy*len);
      ctx.strokeStyle = 'hsla('+hue.toFixed(0)+',100%,68%,'+a.toFixed(3)+')';
      ctx.lineWidth = 0.95;
      ctx.stroke();

      const px = -uy, py = ux;
      const tipx = x + ux*len, tipy = y + uy*len;
      const hs = 3.4;
      ctx.beginPath();
      ctx.moveTo(tipx, tipy);
      ctx.lineTo(tipx - ux*hs + px*hs*0.55, tipy - uy*hs + py*hs*0.55);
      ctx.lineTo(tipx - ux*hs - px*hs*0.55, tipy - uy*hs - py*hs*0.55);
      ctx.closePath();
      ctx.fillStyle = 'hsla('+hue.toFixed(0)+',100%,74%,'+a.toFixed(3)+')';
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   渲染：拉格朗日粒子拖尾
============================================================ */
function drawParticles(alpha){
  if (alpha <= 0.01) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i=0;i<particles.length;i++){
    const p = particles[i];

    /* 拖尾 */
    ctx.beginPath();
    let first = true;
    for (let k=HIST-1;k>=0;k--){
      const idx = (p.hi - k + HIST*2) % HIST;
      const x = p.hx[idx], y = p.hy[idx];
      if (first){ ctx.moveTo(x,y); first = false; }
      else ctx.lineTo(x,y);
    }
    ctx.strokeStyle = 'hsla('+p.hue.toFixed(0)+',100%,64%,'+(0.085*alpha).toFixed(3)+')';
    ctx.lineWidth = 1.15;
    ctx.stroke();

    /* 头部光点 */
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.05, 0, TAU);
    ctx.fillStyle = 'hsla('+p.hue.toFixed(0)+',100%,84%,'+(0.85*alpha).toFixed(3)+')';
    ctx.fill();

    /* 柔光 */
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.2, 0, TAU);
    ctx.fillStyle = 'hsla('+p.hue.toFixed(0)+',100%,60%,'+(0.055*alpha).toFixed(3)+')';
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   指针探针
============================================================ */
let mouseX = -1, mouseY = -1, mouseOn = false;
let probeVX = 0, probeVY = 0, probeSp = 0;

const probeEl = document.getElementById('probe');

function drawProbe(){
  if (!mouseOn) return;
  const x = mouseX, y = mouseY;

  ctx.globalCompositeOperation = 'lighter';

  /* 十字 */
  ctx.strokeStyle = 'rgba(150,230,255,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x-26, y); ctx.lineTo(x-7, y);
  ctx.moveTo(x+7,  y); ctx.lineTo(x+26, y);
  ctx.moveTo(x, y-26); ctx.lineTo(x, y-7);
  ctx.moveTo(x, y+7);  ctx.lineTo(x, y+26);
  ctx.stroke();

  /* 速度矢量 */
  const sp = probeSp || 1;
  const ux = probeVX/sp, uy = probeVY/sp;
  const len = 20 + clamp(probeSp/430, 0, 1) * 32;
  const hue = speedHue(clamp(probeSp/430, 0, 1));

  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + ux*len, y + uy*len);
  ctx.strokeStyle = 'hsla('+hue.toFixed(0)+',100%,76%,0.92)';
  ctx.lineWidth = 2;
  ctx.stroke();

  const px = -uy, py = ux;
  const tx = x + ux*len, ty = y + uy*len;
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx - ux*7 + px*3.4, ty - uy*7 + py*3.4);
  ctx.lineTo(tx - ux*7 - px*3.4, ty - uy*7 - py*3.4);
  ctx.closePath();
  ctx.fillStyle = 'hsla('+hue.toFixed(0)+',100%,82%,0.95)';
  ctx.fill();

  /* 探测环 */
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, TAU);
  ctx.strokeStyle = 'rgba(160,240,255,0.5)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';
}

function updateProbe(){
  if (!mouseOn){
    probeEl.classList.remove('on');
    return;
  }
  probeEl.classList.add('on');

  const px = clamp(mouseX + 20, 8, W - 172);
  const py = clamp(mouseY + 20, 8, H - 76);

  probeEl.style.transform = 'translate('+px.toFixed(0)+'px,'+py.toFixed(0)+'px)';

  const ux = probeVX/(probeSp||1), uy = probeVY/(probeSp||1);
  const ang = (Math.atan2(uy, ux) * 180 / Math.PI).toFixed(1);

  probeEl.innerHTML =
    '<div><span class="k">v</span> = (<span class="v">' +
      probeVX.toFixed(1) + '</span>, <span class="v">' + probeVY.toFixed(1) + '</span>)</div>' +
    '<div><span class="k">|v|</span> = <span class="v">' + probeSp.toFixed(1) + '</span></div>' +
    '<div><span class="k">θ</span> = <span class="v">' + ang + '°</span></div>';
}

/* ============================================================
   暗角
============================================================ */
let vignette = null;

function makeVignette(){
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.30,
                                     W/2, H/2, Math.max(W,H)*0.82);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,1,4,0.80)');
  vignette = g;
}

/* ============================================================
   视角模式
============================================================ */
let viewMode = 0;   // 0=双视角, 1=欧拉场, 2=拉格朗日

const btn0 = document.getElementById('m0');
const btn1 = document.getElementById('m1');
const btn2 = document.getElementById('m2');
const viewNameEl = document.getElementById('viewName');

function setMode(m){
  viewMode = m;
  btn0.classList.toggle('on', m === 0);
  btn1.classList.toggle('on', m === 1);
  btn2.classList.toggle('on', m === 2);
  viewNameEl.textContent = ['双视角 · 叠加显示', '欧拉场 · 流线矢量', '拉格朗日 · 粒子跟踪'][m];
}

btn0.addEventListener('click', ()=> setMode(0));
btn1.addEventListener('click', ()=> setMode(1));
btn2.addEventListener('click', ()=> setMode(2));

/* ============================================================
   主循环
============================================================ */
let t = 0;
let last = 0;
let smoothFade = 1;

function loop(ts){
  requestAnimationFrame(loop);

  if (!last){ last = ts; return; }
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  t += dt;

  /* 30 秒软重置 */
  if (t >= CYCLE){
    t -= CYCLE;
    initVortices();
    initParticles();
    initSeeds();
  }

  updateVortices(t, dt);
  updateParticles(dt);

  /* ---- 渲染 ---- */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  drawBG();
  drawVortexGlow();

  const aEuler = (viewMode === 2) ? 0 : 1;
  const aLag   = (viewMode === 1) ? 0 : 1;

  drawStreamlines(aEuler);
  drawArrows(aEuler * 0.85);
  drawParticles(aLag);

  drawProbe();

  if (vignette){
    ctx.fillStyle = vignette;
    ctx.fillRect(0,0,W,H);
  }

  /* 循环淡出 */
  if (t > CYCLE - 1.5){
    const a = (t - (CYCLE-1.5)) / 1.5;
    ctx.fillStyle = 'rgba(1,2,6,'+(a*0.94).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }

  /* ---- HUD ---- */
  hudClock += dt;
  if (hudClock > 0.12){
    hudClock = 0;
    const wmax = (9.8 + 3.2*Math.abs(Math.sin(t*0.55))).toFixed(2);
    const vr   = (2.86 + 0.16*Math.sin(t*0.9)).toFixed(2);
    document.getElementById('omega').textContent = wmax;
    document.getElementById('vrms').textContent  = vr;
    document.getElementById('nP').textContent    = particles.length;
    document.getElementById('nV').textContent    = vortices.length;
  }

  updateProbe();
}

let hudClock = 0;

/* ============================================================
   交互
============================================================ */
let dragging = false;
let lastDisturb = 0;

cv.addEventListener('pointerdown', function(e){
  dragging = true;
  addDisturbance(e.clientX, e.clientY);
  lastDisturb = performance.now();
});

cv.addEventListener('pointermove', function(e){
  mouseX = e.clientX;
  mouseY = e.clientY;
  mouseOn = true;

  const v = velocity(mouseX, mouseY, t);
  probeVX = v[0];
  probeVY = v[1];
  probeSp = Math.sqrt(v[0]*v[0] + v[1]*v[1]);

  if (dragging && performance.now() - lastDisturb > 130){
    addDisturbance(e.clientX, e.clientY);
    lastDisturb = performance.now();
  }
});

window.addEventListener('pointerup', function(){
  dragging = false;
});

cv.addEventListener('pointerleave', function(){
  mouseOn = false;
  dragging = false;
});

window.addEventListener('resize', function(){
  resize();
  makeVignette();
  initVortices();
  initParticles();
  initSeeds();
});

/* ============================================================
   启动
============================================================ */
function boot(){
  resize();
  makeVignette();
  initVortices();
  initParticles();
  initSeeds();
  setMode(0);
  requestAnimationFrame(loop);
}

boot();

})();
</script>
