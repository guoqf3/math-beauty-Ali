<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>居里-外斯磁性 · 铁磁相变与磁滞回线</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03040e}
  body{
    font-family:"SF Mono","Consolas","Menlo","Courier New",monospace;
    color:#bfe9ff;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;display:block;z-index:0;touch-action:none}
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,transparent 38%,rgba(0,0,0,.78) 100%);
  }
  .quote{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    z-index:3;pointer-events:none;
    font-size:17px;letter-spacing:3px;white-space:nowrap;
    color:#eaf6ff;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    text-shadow:
      0 0 10px rgba(255,180,220,.9),
      0 0 26px rgba(180,120,255,.6),
      0 0 52px rgba(100,180,255,.45);
    animation:qglow 5s ease-in-out infinite;
  }
  @keyframes qglow{
    0%,100%{opacity:.86;text-shadow:0 0 10px rgba(255,180,220,.85),0 0 26px rgba(180,120,255,.55),0 0 52px rgba(100,180,255,.4)}
    50%{opacity:1;text-shadow:0 0 16px rgba(255,240,250,1),0 0 38px rgba(210,150,255,.9),0 0 70px rgba(130,200,255,.6)}
  }
  .panel{
    position:fixed;top:50%;transform:translateY(-50%);
    z-index:3;pointer-events:none;
    font-size:12px;line-height:2.0;letter-spacing:.5px;
    color:rgba(150,225,255,.5);
    text-shadow:0 0 9px rgba(0,180,255,.45);
  }
  .panel .line{white-space:nowrap}
  .panel .hl{color:rgba(255,220,255,.95);text-shadow:0 0 12px rgba(230,140,255,.9)}
  .panel .dim{color:rgba(150,170,230,.4);font-size:11px}
  .panel.left{left:20px;text-align:left}
  .panel.right{right:20px;text-align:right}
  .controls{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    z-index:4;display:flex;align-items:center;gap:13px;
    padding:9px 18px;border-radius:44px;
    background:rgba(8,14,32,.70);
    border:1px solid rgba(190,120,255,.28);
    box-shadow:0 0 26px rgba(140,80,255,.25),inset 0 0 22px rgba(100,60,200,.14);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:11px;letter-spacing:.4px;white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:6px;color:rgba(210,180,255,.85)}
  .tval{color:#ffd8f0;text-shadow:0 0 10px rgba(255,140,220,.9);min-width:54px;display:inline-block;text-align:right}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:98px;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,rgba(80,220,255,.9),rgba(255,130,220,.9));
    box-shadow:0 0 12px rgba(200,130,255,.55);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#ffb0e8 55%,#7a3aff);
    box-shadow:0 0 14px rgba(255,170,240,.95),0 0 26px rgba(160,100,255,.6);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#ffb0e8 55%,#7a3aff);
    box-shadow:0 0 14px rgba(255,170,240,.95);cursor:pointer;
  }
  .toggle{
    cursor:pointer;user-select:none;
    padding:5px 13px;border-radius:20px;
    border:1px solid rgba(190,120,255,.32);
    background:rgba(50,28,90,.32);
    color:rgba(215,180,255,.72);
    transition:all .25s ease;
  }
  .toggle:hover{border-color:rgba(230,170,255,.65);color:#f6ecff}
  .toggle.on{
    background:rgba(190,110,255,.22);
    border-color:rgba(240,190,255,.88);
    color:#fdf7ff;
    box-shadow:0 0 16px rgba(200,130,255,.60),inset 0 0 12px rgba(200,130,255,.25);
  }
  @media (max-width:940px){
    .panel{display:none}
    .quote{font-size:13px;letter-spacing:1.5px;top:10px}
    .controls{gap:7px;padding:7px 10px;font-size:10px;bottom:8px}
    input[type=range]{width:58px}
    .tval{min-width:36px}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="quote">越过相变的门槛，秩序归于混沌，又在冷却中重生</div>

<div class="panel left">
  <div class="line">χ = C / (T − T_C)  （T &gt; T_C）</div>
  <div class="line">M_s(T) ∝ (T_C − T)^β</div>
  <div class="line">β ≈ 0.326  （海森堡）</div>
  <div class="line">M_r = 0.58·M_s</div>
  <div class="line">H_c：矫顽力 · 磁滞损耗</div>
  <div class="line dim" style="margin-top:7px">剩磁不可逆 58% · 可逆 42%</div>
</div>

<div class="panel right">
  <div class="line">Fe   T_C = 1043 K</div>
  <div class="line">T = <span class="hl" id="vT">300</span> K</div>
  <div class="line hl">M_s = <span id="vMs">1.71</span>×10⁶ A/m</div>
  <div class="line hl">M_r = <span id="vMr">0.99</span>×10⁶ A/m</div>
  <div class="line">H_c = 8.0×10³ A/m</div>
  <div class="line" style="margin-top:7px">H = <span class="hl" id="vH">0</span> A/m</div>
  <div class="line">M = <span class="hl" id="vM">0.00</span>×10⁶ A/m</div>
  <div class="line">M/M_s = <span id="vR">0.00</span></div>
  <div class="line dim" style="margin-top:5px">点击回线查看坐标</div>
</div>

<div class="controls">
  <label>H
    <input type="range" id="hSlider" min="-40000" max="40000" step="100" value="0">
  </label>
  <label>T
    <input type="range" id="tSlider" min="200" max="1200" step="10" value="300">
  </label>
  <span class="tval" id="tLabel">300 K</span>
  <div class="toggle on" id="btnAuto">自动</div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   物理常量
============================================================ */
var H_C0   = 8.0e3;            // 矫顽力 A/m
var M_S0   = 1.910e6;          // T=0 外推饱和磁化 A/m
var T_C    = 1043;             // 居里温度 K
var BETA   = 0.326;            // 临界指数
var H_MAX  = 4.0e4;            // 磁场显示范围 A/m
var MR_RATIO = 0.58;           // 剩磁比

function atanh(x){ return 0.5 * Math.log((1+x)/(1-x)); }
var H_W = H_C0 / atanh(MR_RATIO);   // ≈ 12075 A/m

function msAt(T){
  if(T >= T_C) return 0;
  return M_S0 * Math.pow(1 - T/T_C, BETA);
}
function hcAt(T){
  if(T >= T_C) return 0;
  return H_C0;
}

/* 磁滞：上升支 / 下降支 */
function computeM(h, branch, T){
  var ms = msAt(T);
  if(ms <= 0) return 0;
  var hc = hcAt(T);
  var hw = hc / atanh(MR_RATIO);
  var arg = (branch === 'up') ? (h - hc)/hw : (h + hc)/hw;
  if(arg > 30) arg = 30;
  if(arg < -30) arg = -30;
  return ms * Math.tanh(arg);
}

/* ============================================================
   画布
============================================================ */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;
var stars = [];

function buildStars(){
  stars = [];
  var n = Math.round(W*H/8200);
  for(var i = 0; i < n; i++){
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.1+0.22,
      ph: Math.random()*Math.PI*2,
      sp: 0.4 + Math.random()*1.8,
      hue: 210 + Math.random()*120
    });
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  if(W < 10) W = 800;
  if(H < 10) H = 600;
  canvas.width  = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildStars();
  layout();
}
window.addEventListener('resize', resize);

/* ============================================================
   Voronoi 磁畴
============================================================ */
var domainPoints = [];
var domainCells  = [];
var domainD      = [];
var domainW      = [];
var N_DOMAINS    = 32;

function clipCell(poly, A, B){
  var dx = B.x - A.x, dy = B.y - A.y;
  var c  = (A.x*A.x + A.y*A.y) - (B.x*B.x + B.y*B.y);
  var out = [];
  var n = poly.length;
  for(var i = 0; i < n; i++){
    var P = poly[i];
    var Q = poly[(i+1) % n];
    var fp = 2*(P.x*dx + P.y*dy) + c;
    var fq = 2*(Q.x*dx + Q.y*dy) + c;
    if(fp <= 0) out.push(P);
    if((fp <= 0) !== (fq <= 0)){
      var t = fp / (fp - fq);
      out.push({ x: P.x + t*(Q.x - P.x), y: P.y + t*(Q.y - P.y) });
    }
  }
  return out;
}

function initDomains(){
  var n = N_DOMAINS;
  var cols = Math.ceil(Math.sqrt(n * 1.35));
  var rows = Math.ceil(n / cols);
  domainPoints = [];
  for(var i = 0; i < n; i++){
    var gx = (i % cols + 0.5) / cols;
    var gy = (Math.floor(i / cols) + 0.5) / rows;
    var px = gx + (Math.random()-0.5) * 0.72 / cols;
    var py = gy + (Math.random()-0.5) * 0.72 / rows;
    domainPoints.push({
      x: Math.max(0.01, Math.min(0.99, px)),
      y: Math.max(0.01, Math.min(0.99, py))
    });
  }
  computeCells();
  domainD = domainPoints.map(function(){ return 0; });
  domainW = domainPoints.map(function(){ return 0.20 + Math.random()*0.80; });
}

function computeCells(){
  domainCells = [];
  var bounds = { x0:0, y0:0, x1:1, y1:1 };
  for(var i = 0; i < domainPoints.length; i++){
    var poly = [
      {x:bounds.x0, y:bounds.y0},
      {x:bounds.x1, y:bounds.y0},
      {x:bounds.x1, y:bounds.y1},
      {x:bounds.x0, y:bounds.y1}
    ];
    var A = domainPoints[i];
    for(var j = 0; j < domainPoints.length && poly.length > 2; j++){
      if(i === j) continue;
      poly = clipCell(poly, A, domainPoints[j]);
    }
    domainCells.push({ poly: poly, cx: A.x, cy: A.y });
  }
}

initDomains();

/* ============================================================
   状态
============================================================ */
var st = {
  clock: 0,
  H: H_MAX,
  M: M_S0,
  branch: 'down',
  T: 300,
  auto: true,
  phase: 0,
  trace: [],
  lastTraceH: null,
  lastTraceM: null,
  clickMark: null,
  clickTime: -10
};

/* ============================================================
   DOM
============================================================ */
var hSlider = document.getElementById('hSlider');
var tSlider = document.getElementById('tSlider');
var tLabel  = document.getElementById('tLabel');
var btnAuto = document.getElementById('btnAuto');

var elT  = document.getElementById('vT');
var elMs = document.getElementById('vMs');
var elMr = document.getElementById('vMr');
var elH  = document.getElementById('vH');
var elM  = document.getElementById('vM');
var elR  = document.getElementById('vR');

hSlider.addEventListener('input', function(e){
  st.H = parseFloat(e.target.value);
  st.auto = false;
  btnAuto.classList.remove('on');
  st.phase = Math.acos(Math.max(-1, Math.min(1, st.H / H_MAX)));
});
tSlider.addEventListener('input', function(e){
  st.T = parseFloat(e.target.value);
  tLabel.textContent = Math.round(st.T) + ' K';
});
btnAuto.addEventListener('click', function(){
  st.auto = !st.auto;
  btnAuto.classList.toggle('on', st.auto);
  if(st.auto){
    st.phase = Math.acos(Math.max(-1, Math.min(1, st.H / H_MAX)));
  }
});

/* ============================================================
   布局
============================================================ */
var domainBox = {x:0,y:0,w:0,h:0};
var hystBox   = {x:0,y:0,w:0,h:0};

function layout(){
  var narrow = W < 860;
  if(narrow){
    domainBox = { x: W*0.055, y: H*0.115, w: W*0.89,  h: H*0.36 };
    hystBox   = { x: W*0.055, y: H*0.515, w: W*0.89,  h: H*0.36 };
  } else {
    domainBox = { x: W*0.085, y: H*0.135, w: W*0.455, h: H*0.735 };
    hystBox   = { x: W*0.595, y: H*0.135, w: W*0.345, h: H*0.735 };
  }
}

/* ============================================================
   更新
============================================================ */
function update(dt){
  st.clock += dt;

  /* --- 磁场扫掠 --- */
  var prevH = st.H;
  if(st.auto){
    st.phase += dt * 2 * Math.PI / 30;
    if(st.phase > 1e6) st.phase -= 1e6;
    st.H = H_MAX * Math.cos(st.phase);
  }
  var dH = st.H - prevH;
  if(dH > 0.5) st.branch = 'up';
  else if(dH < -0.5) st.branch = 'down';

  /* --- 磁化强度 --- */
  st.M = computeM(st.H, st.branch, st.T);

  /* --- 磁畴方向松弛 --- */
  var ms = msAt(st.T);
  var mNorm = (ms > 0) ? Math.max(-1, Math.min(1, st.M / ms)) : 0;

  for(var i = 0; i < domainD.length; i++){
    var resist = domainW[i];
    var speed = (0.7 + 3.2 * Math.abs(mNorm)) * (1.12 - 0.72 * resist);
    var k = Math.min(1, speed * dt);
    domainD[i] += (mNorm - domainD[i]) * k;
  }

  /* --- 轨迹采样 --- */
  var th = 0.008;
  if(st.lastTraceH === null){
    st.trace.push({ h: st.H, m: st.M });
    st.lastTraceH = st.H;
    st.lastTraceM = st.M;
  } else {
    var dh = (st.H - st.lastTraceH) / (2*H_MAX);
    var dm = (st.M - st.lastTraceM) / (2*M_S0);
    if(Math.hypot(dh, dm) > th){
      st.trace.push({ h: st.H, m: st.M });
      st.lastTraceH = st.H;
      st.lastTraceM = st.M;
      if(st.trace.length > 2600) st.trace.shift();
    }
  }
}

/* ============================================================
   数值面板
============================================================ */
function updateUI(){
  var ms = msAt(st.T);
  var mr = MR_RATIO * ms;
  elT.textContent  = Math.round(st.T);
  elMs.textContent = (ms/1e6).toFixed(2);
  elMr.textContent = (mr/1e6).toFixed(2);
  elH.textContent  = Math.round(st.H);
  elM.textContent  = (st.M/1e6).toFixed(2);
  elR.textContent  = (ms > 0 ? (st.M/ms) : 0).toFixed(3);
  tLabel.textContent = Math.round(st.T) + ' K';
}

/* ============================================================
   工具
============================================================ */
function rr(c, x, y, w, h, r){
  if(c.roundRect){ c.beginPath(); c.roundRect(x,y,w,h,r); return; }
  c.beginPath();
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y); c.quadraticCurveTo(x+w, y, x+w, y+r);
  c.lineTo(x+w, y+h-r); c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  c.lineTo(x+r, y+h); c.quadraticCurveTo(x, y+h, x, y+h-r);
  c.lineTo(x, y+r); c.quadraticCurveTo(x, y, x+r, y);
  c.closePath();
}

/* ============================================================
   背景
============================================================ */
function drawBackground(){
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#03040e';
  ctx.fillRect(0,0,W,H);

  var hueShift = 34 * Math.sin(st.clock * Math.PI * 2 / 30);
  var g = ctx.createRadialGradient(
    W*0.34, H*0.42, 0,
    W*0.34, H*0.42, Math.max(W,H)*0.78
  );
  g.addColorStop(0,   'hsla(' + (250 + hueShift) + ',80%,13%,0.62)');
  g.addColorStop(0.44,'hsla(' + (290 + hueShift) + ',76%,8%,0.26)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

function drawStars(){
  ctx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < stars.length; i++){
    var s = stars[i];
    var tw = 0.5 + 0.5*Math.sin(st.clock*s.sp + s.ph);
    ctx.fillStyle = 'hsla(' + s.hue + ',72%,' + (72+20*tw) + '%,' + (0.07+0.48*tw*tw) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   磁畴视图
============================================================ */
function drawDomainView(){
  var B = domainBox;
  var ms = msAt(st.T);
  var para = ms <= 0;

  /* 面板底 */
  ctx.save();
  rr(ctx, B.x, B.y, B.w, B.h, 16);
  var bgG = ctx.createLinearGradient(B.x, B.y, B.x, B.y+B.h);
  bgG.addColorStop(0, 'rgba(8,12,28,0.78)');
  bgG.addColorStop(1, 'rgba(4,6,18,0.78)');
  ctx.fillStyle = bgG;
  ctx.fill();
  ctx.restore();

  /* 裁剪 */
  ctx.save();
  rr(ctx, B.x, B.y, B.w, B.h, 16);
  ctx.clip();

  /* --- 磁畴 --- */
  for(var i = 0; i < domainCells.length; i++){
    var cell = domainCells[i];
    if(cell.poly.length < 3) continue;
    var d = domainD[i];

    /* 顺磁态：灰暗随机抖动 */
    var hue, sat, lit, alp;
    if(para){
      hue = 200 + 40*Math.sin(st.clock*2 + i);
      sat = 25;
      lit = 22;
      alp = 0.35;
    } else {
      hue = 220 + 70 * (d + 1);
      sat = 78 + 18*Math.abs(d);
      lit = 38 + 24*Math.abs(d);
      alp = 0.52;
    }

    ctx.beginPath();
    for(var k = 0; k < cell.poly.length; k++){
      var p = cell.poly[k];
      var sx = B.x + p.x * B.w;
      var sy = B.y + p.y * B.h;
      if(k === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.closePath();

    ctx.fillStyle = 'hsla(' + hue + ',' + sat + '%,' + lit + '%,' + alp + ')';
    ctx.fill();

    ctx.strokeStyle = 'hsla(' + hue + ',100%,74%,' + (0.16 + 0.48*Math.abs(d)) + ')';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  /* --- 磁畴内箭头 --- */
  ctx.globalCompositeOperation = 'lighter';
  var minD = Math.min(B.w, B.h);
  for(var m = 0; m < domainCells.length; m++){
    var cl = domainCells[m];
    if(cl.poly.length < 3) continue;
    var dd = domainD[m];
    if(Math.abs(dd) < 0.13) continue;

    var ax = B.x + cl.cx * B.w;
    var ay = B.y + cl.cy * B.h;
    var dir = dd > 0 ? 1 : -1;
    var len = Math.abs(dd) * minD * 0.115;
    if(len < 3) continue;

    var hh = para ? 200 : 220 + 70*(dd + 1);
    var aaa = 0.30 + 0.55*Math.abs(dd);

    ctx.strokeStyle = 'hsla(' + hh + ',100%,84%,' + aaa + ')';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    var x0 = ax - dir*len*0.34;
    var x1 = ax + dir*len*0.66;
    ctx.beginPath();
    ctx.moveTo(x0, ay);
    ctx.lineTo(x1, ay);
    ctx.stroke();

    var ah = Math.min(len*0.34, 7.5);
    ctx.fillStyle = 'hsla(' + hh + ',100%,84%,' + aaa + ')';
    ctx.beginPath();
    ctx.moveTo(x1, ay);
    ctx.lineTo(x1 - dir*ah, ay - ah*0.62);
    ctx.lineTo(x1 - dir*ah, ay + ah*0.62);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* --- 顺磁提示 --- */
  if(para){
    ctx.save();
    ctx.font = '13px ui-monospace, Consolas, monospace';
    ctx.fillStyle = 'rgba(180,210,255,0.55)';
    ctx.textAlign = 'center';
    ctx.fillText('T ≥ T_C  顺磁态 · 磁畴瓦解', B.x + B.w/2, B.y + B.h/2);
    ctx.restore();
  }

  ctx.restore();

  /* 边框 */
  ctx.save();
  rr(ctx, B.x, B.y, B.w, B.h, 16);
  ctx.strokeStyle = para
    ? 'rgba(150,170,220,0.35)'
    : 'rgba(200,140,255,0.45)';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.restore();

  /* --- H 方向指示条 --- */
  var iy = B.y + B.h + 16;
  var iw = B.w * 0.62;
  var ix = B.x + (B.w - iw)/2;
  var frac = st.H / H_MAX;

  ctx.save();
  ctx.strokeStyle = 'rgba(120,200,255,0.20)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ix, iy);
  ctx.lineTo(ix + iw, iy);
  ctx.stroke();

  var cx0 = ix + iw/2;
  var reach = Math.abs(frac) * iw/2;
  if(reach > 1.5){
    var dirH = frac > 0 ? 1 : -1;
    var hueH = frac > 0 ? 320 : 200;
    ctx.strokeStyle = 'hsla(' + hueH + ',100%,70%,0.85)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx0, iy);
    ctx.lineTo(cx0 + dirH*reach, iy);
    ctx.stroke();

    ctx.fillStyle = 'hsla(' + hueH + ',100%,70%,0.85)';
    ctx.beginPath();
    ctx.moveTo(cx0 + dirH*reach, iy);
    ctx.lineTo(cx0 + dirH*(reach-7), iy - 4.5);
    ctx.lineTo(cx0 + dirH*(reach-7), iy + 4.5);
    ctx.closePath();
    ctx.fill();
  }

  ctx.font = '10px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(180,220,255,0.55)';
  ctx.textAlign = 'center';
  ctx.fillText('H = ' + Math.round(st.H) + ' A/m', cx0, iy - 9);
  ctx.restore();

  /* 标题 */
  ctx.font = '11px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(200,180,255,0.60)';
  ctx.textAlign = 'left';
  ctx.fillText('磁畴结构 · 多畴模型', B.x + 4, B.y - 8);
}

/* ============================================================
   磁滞回线
============================================================ */
function drawHysteresis(){
  var B = hystBox;
  var pad = 30;
  var px0 = B.x + pad, px1 = B.x + B.w - pad;
  var py0 = B.y + pad + 14, py1 = B.y + B.h - pad;

  /* 面板底 */
  ctx.save();
  rr(ctx, B.x, B.y, B.w, B.h, 16);
  var bgG = ctx.createLinearGradient(B.x, B.y, B.x, B.y+B.h);
  bgG.addColorStop(0, 'rgba(8,12,28,0.78)');
  bgG.addColorStop(1, 'rgba(4,6,18,0.78)');
  ctx.fillStyle = bgG;
  ctx.fill();
  ctx.strokeStyle = 'rgba(190,130,255,0.40)';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.restore();

  /* 映射 */
  var mapX = function(h){ return px0 + (h + H_MAX)/(2*H_MAX) * (px1 - px0); };
  var mapY = function(m){ return py1 - (m + M_S0)/(2*M_S0) * (py1 - py0); };

  /* --- 网格 --- */
  ctx.save();
  ctx.strokeStyle = 'rgba(110,160,255,0.09)';
  ctx.lineWidth = 1;
  for(var g = -3; g <= 3; g++){
    var gx = mapX(g * H_MAX / 3);
    ctx.beginPath(); ctx.moveTo(gx, py0); ctx.lineTo(gx, py1); ctx.stroke();
  }
  for(var g2 = -3; g2 <= 3; g2++){
    var gy = mapY(g2 * M_S0 / 3);
    ctx.beginPath(); ctx.moveTo(px0, gy); ctx.lineTo(px1, gy); ctx.stroke();
  }
  ctx.restore();

  /* --- 坐标轴 --- */
  ctx.save();
  ctx.strokeStyle = 'rgba(140,190,255,0.34)';
  ctx.lineWidth = 1.3;
  var cxAxis = mapX(0), cyAxis = mapY(0);
  ctx.beginPath();
  ctx.moveTo(px0, cyAxis); ctx.lineTo(px1, cyAxis);
  ctx.moveTo(cxAxis, py0); ctx.lineTo(cxAxis, py1);
  ctx.stroke();
  ctx.restore();

  /* --- 刻度 --- */
  ctx.save();
  ctx.font = '9px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(160,205,255,0.45)';
  ctx.textAlign = 'center';
  var hTicks = [-4, -2, 0, 2, 4];
  for(var ti = 0; ti < hTicks.length; ti++){
    var tx = mapX(hTicks[ti]*1e4);
    ctx.fillText(hTicks[ti], tx, py1 + 13);
  }
  ctx.fillStyle = 'rgba(170,215,255,0.55)';
  ctx.fillText('H  (×10⁴ A/m)', (px0+px1)/2, py1 + 27);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(160,205,255,0.45)';
  var mTicks = [-1.5, -1, -0.5, 0, 0.5, 1, 1.5];
  for(var mi = 0; mi < mTicks.length; mi++){
    var ty = mapY(mTicks[mi]*1e6);
    ctx.fillText(mTicks[mi].toFixed(1), px0 - 6, ty + 3);
  }
  ctx.save();
  ctx.translate(B.x + 12, (py0+py1)/2);
  ctx.rotate(-Math.PI/2);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(170,215,255,0.55)';
  ctx.fillText('M  (×10⁶ A/m)', 0, 0);
  ctx.restore();
  ctx.restore();

  /* --- 轨迹 --- */
  var tr = st.trace;
  if(tr.length > 1){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var step = 1;
    for(var i = 1; i < tr.length; i += step){
      var p0 = tr[i-1], p1 = tr[i];
      var x0 = mapX(p0.h), y0 = mapY(p0.m);
      var x1 = mapX(p1.h), y1 = mapY(p1.m);

      var mag = Math.min(1, Math.abs((p1.h + H_MAX)/(2*H_MAX)));
      var hue = 200 + 150 * mag;

      ctx.strokeStyle = 'hsla(' + hue + ',100%,72%,0.16)';
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

      ctx.strokeStyle = 'hsla(' + hue + ',100%,' + (68 + 20*mag) + '%,0.92)';
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    ctx.restore();
  }

  /* --- 关键点标记 --- */
  var ms = msAt(st.T);
  if(ms > 0){
    var mr = MR_RATIO * ms;
    var hc = hcAt(st.T);
    var kpts = [
      { h: 0,   m:  mr,  lab: 'M_r' },
      { h: 0,   m: -mr,  lab: '−M_r' },
      { h: hc,  m: 0,    lab: 'H_c' },
      { h: -hc, m: 0,    lab: '−H_c' }
    ];
    ctx.save();
    for(var kp = 0; kp < kpts.length; kp++){
      var q = kpts[kp];
      var qx = mapX(q.h), qy = mapY(q.m);
      var hb = msAt(st.T);
      ctx.fillStyle = 'rgba(255,238,190,0.78)';
      ctx.beginPath();
      ctx.arc(qx, qy, 3.4, 0, Math.PI*2);
      ctx.fill();
      ctx.font = '9px ui-monospace, Consolas, monospace';
      ctx.fillStyle = 'rgba(255,240,200,0.72)';
      ctx.textAlign = 'center';
      ctx.fillText(q.lab, qx, qy - 8);
    }
    ctx.restore();
  }

  /* --- 当前工作点 --- */
  var nowX = mapX(st.H);
  var nowY = mapY(st.M);
  var puls = 1 + 0.22*Math.sin(st.clock*6);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var ngr = ctx.createRadialGradient(nowX, nowY, 0, nowX, nowY, 24*puls);
  ngr.addColorStop(0,   'rgba(255,255,255,0.95)');
  ngr.addColorStop(0.22,'rgba(255,180,250,0.58)');
  ngr.addColorStop(0.58,'rgba(180,120,255,0.20)');
  ngr.addColorStop(1,   'rgba(140,60,255,0)');
  ctx.fillStyle = ngr;
  ctx.beginPath();
  ctx.arc(nowX, nowY, 24*puls, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(nowX, nowY, 3.6, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* --- 点击标记 --- */
  if(st.clickMark){
    var cm = st.clickMark;
    var mx = mapX(cm.h), my = mapY(cm.m);
    var age = st.clock - st.clickTime;
    if(age < 6){
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - age/6);
      ctx.strokeStyle = 'rgba(255,240,180,0.9)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(mx, my, 8, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mx, my, 14, 0, Math.PI*2);
      ctx.globalAlpha *= 0.4;
      ctx.stroke();
      ctx.restore();

      /* 数值卡 */
      var lines = [
        'H = ' + Math.round(cm.h) + ' A/m',
        'M = ' + (cm.m/1e6).toFixed(3) + '×10⁶',
        'M/M_s = ' + (ms > 0 ? (cm.m/ms).toFixed(3) : '—')
      ];
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - age/6);
      ctx.font = '10px ui-monospace, Consolas, monospace';
      var tw = 0;
      for(var li = 0; li < lines.length; li++){
        tw = Math.max(tw, ctx.measureText(lines[li]).width);
      }
      var bw = tw + 18, bh = lines.length*15 + 14;
      var bx = mx + 16, by = my - bh - 10;
      if(bx + bw > W - 8) bx = mx - bw - 16;
      if(by < 8) by = my + 14;
      if(by + bh > H - 8) by = H - bh - 8;

      ctx.fillStyle = 'rgba(10,16,36,0.92)';
      ctx.strokeStyle = 'rgba(255,220,150,0.55)';
      ctx.lineWidth = 1;
      rr(ctx, bx, by, bw, bh, 7);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'left';
      for(var li2 = 0; li2 < lines.length; li2++){
        ctx.fillStyle = (li2 === 0) ? 'rgba(255,236,190,0.95)' : 'rgba(200,235,255,0.88)';
        ctx.fillText(lines[li2], bx + 9, by + 13 + li2*15);
      }
      ctx.restore();
    } else {
      st.clickMark = null;
    }
  }

  /* 标题 */
  ctx.save();
  ctx.font = '11px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(220,190,255,0.62)';
  ctx.textAlign = 'left';
  ctx.fillText('磁滞回线 · M–H', B.x + 6, B.y + 18);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,200,240,0.72)';
  var qms = msAt(st.T);
  ctx.fillText(qms > 0 ? ('T = ' + Math.round(st.T) + ' K') : ('T = ' + Math.round(st.T) + ' K  顺磁'), B.x + B.w - 6, B.y + 18);
  ctx.restore();
}

/* ============================================================
   点击交互
============================================================ */
canvas.addEventListener('pointerdown', function(e){
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;

  var B = hystBox;
  if(mx < B.x || mx > B.x + B.w || my < B.y || my > B.y + B.h) return;

  var pad = 30;
  var px0 = B.x + pad, px1 = B.x + B.w - pad;
  var py0 = B.y + pad + 14, py1 = B.y + B.h - pad;
  var mapX = function(h){ return px0 + (h + H_MAX)/(2*H_MAX) * (px1 - px0); };
  var mapY = function(m){ return py1 - (m + M_S0)/(2*M_S0) * (py1 - py0); };

  var best = null, bestD = 32;
  for(var i = 0; i < st.trace.length; i++){
    var p = st.trace[i];
    var d = Math.hypot(mapX(p.h) - mx, mapY(p.m) - my);
    if(d < bestD){ bestD = d; best = p; }
  }

  if(best){
    st.clickMark = { h: best.h, m: best.m };
    st.clickTime = st.clock;
  } else {
    st.clickMark = null;
  }
});

/* ============================================================
   主循环
============================================================ */
var prevT = 0, uiTick = 0, started = false;

function frame(now){
  if(!started){ prevT = now; started = true; }
  var dt = (now - prevT) / 1000;
  prevT = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);

  drawBackground();
  drawStars();
  drawDomainView();
  drawHysteresis();

  uiTick++;
  if(uiTick % 5 === 0) updateUI();

  requestAnimationFrame(frame);
}

resize();
updateUI();
requestAnimationFrame(frame);

})();
</script>
