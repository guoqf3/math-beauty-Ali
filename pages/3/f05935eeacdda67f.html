<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>螺旋面直母线 · 极小曲面几何</title>
    <style>
        :root {
            --bg: #020408;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 42px rgba(200, 180, 150, 0.5), 0 0 72px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 0.9vw, 0.66rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }
        #formula-overlay {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(2, 4, 8, 0.7);
            padding: 11px 23px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.42rem, 0.78vw, 0.62rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.27);
            line-height: 1.5;
            white-space: nowrap;
        }
        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }
        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 10px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.35rem;
                white-space: normal;
                line-height: 1.3;
            }
            #title-overlay .title {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">螺旋面直母线 · 极小曲面几何</div>
        <div class="subtitle">HELICOID RULINGS &nbsp;·&nbsp; MINIMAL SURFACE GEOMETRY</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">ℓᵥ: u∈[0,2.4]</span> x=u·cos(v) y=u·sin(v) z=c·v &nbsp;
            <span class="c2">hᵤ: v∈[−3π,3π]</span> x=u·cos(v) y=u·sin(v) z=c·v
            <br>
            <span class="c3">∂Ω:</span> 圆柱面x²+y²=R² |z|≤c·3π &nbsp; R=2.4 c=0.32 &nbsp; 直纹极小曲面
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#020408');
        scene.fog = new THREE.Fog('#020408', 9, 24);

        const camera = new THREE.PerspectiveCamera(
            48,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.25,
            28
        );
        camera.position.set(2.4, 1.2, 8.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c'; // 暖金 – 直母线族
        const C2 = '#5d9ec6'; // 冰蓝 – 螺旋线族
        const C3 = '#c77d9f'; // 玫瑰粉 – 边界圆柱框架
        const C_GLINT = '#8898aa'; // 原点光点
        const C_DOT1 = '#e8c098'; // 暖金光点
        const C_DOT2 = '#88c0d8'; // 冰蓝光点

        // ==================== 螺旋面参数 ====================
        const C = 0.32; // 螺距参数
        const U_MIN = 0.04; // 直母线起点（接近z轴）
        const U_MAX = 2.4; // 圆柱面半径
        const V_MIN = -3 * Math.PI;
        const V_MAX = 3 * Math.PI;
        const Z_MIN = C * V_MIN;
        const Z_MAX = C * V_MAX;
        const NUM_RULINGS = 26; // 直母线数量
        const NUM_HELICES = 18; // 螺旋线数量
        const SAMPLES_RULING = 120; // 每条直母线采样点
        const SAMPLES_HELIX = 400; // 每条螺旋线采样点
        const SAMPLES_CIRCLE = 200; // 圆环采样点

        // ==================== 生成直母线族（暖金） ====================
        function createRulingLines() {
            const group = new THREE.Group();
            for (let k = 0; k < NUM_RULINGS; k++) {
                const v = V_MIN + (k / (NUM_RULINGS - 1)) * (V_MAX - V_MIN);
                const pts = [];
                const du = (U_MAX - U_MIN) / SAMPLES_RULING;
                for (let i = 0; i <= SAMPLES_RULING; i++) {
                    const u = U_MIN + i * du;
                    pts.push(new THREE.Vector3(u * Math.cos(v), u * Math.sin(v), C * v));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C1),
                    transparent: true,
                    opacity: 0.6,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // ==================== 生成螺旋线族（冰蓝） ====================
        function createHelixLines() {
            const group = new THREE.Group();
            const uValues = [];
            for (let k = 1; k <= NUM_HELICES; k++) {
                uValues.push(U_MIN + (k / (NUM_HELICES + 1)) * (U_MAX - U_MIN));
            }
            for (const u of uValues) {
                const pts = [];
                const dv = (V_MAX - V_MIN) / SAMPLES_HELIX;
                for (let i = 0; i <= SAMPLES_HELIX; i++) {
                    const v = V_MIN + i * dv;
                    pts.push(new THREE.Vector3(u * Math.cos(v), u * Math.sin(v), C * v));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C2),
                    transparent: true,
                    opacity: 0.55,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // ==================== 生成边界圆柱框架（玫瑰粉） ====================
        function createCylinderFrame() {
            const group = new THREE.Group();

            // 顶部圆环 (z = Z_MAX)
            const topPts = [];
            for (let i = 0; i <= SAMPLES_CIRCLE; i++) {
                const phi = (i / SAMPLES_CIRCLE) * Math.PI * 2;
                topPts.push(new THREE.Vector3(U_MAX * Math.cos(phi), U_MAX * Math.sin(phi), Z_MAX));
            }
            const topGeom = new THREE.BufferGeometry().setFromPoints(topPts);
            const topMat = new THREE.LineBasicMaterial({
                color: new THREE.Color(C3),
                transparent: true,
                opacity: 0.5,
                depthWrite: true,
            });
            group.add(new THREE.Line(topGeom, topMat));

            // 底部圆环 (z = Z_MIN)
            const botPts = [];
            for (let i = 0; i <= SAMPLES_CIRCLE; i++) {
                const phi = (i / SAMPLES_CIRCLE) * Math.PI * 2;
                botPts.push(new THREE.Vector3(U_MAX * Math.cos(phi), U_MAX * Math.sin(phi), Z_MIN));
            }
            const botGeom = new THREE.BufferGeometry().setFromPoints(botPts);
            const botMat = new THREE.LineBasicMaterial({
                color: new THREE.Color(C3),
                transparent: true,
                opacity: 0.5,
                depthWrite: true,
            });
            group.add(new THREE.Line(botGeom, botMat));

            // 中间圆环 (z = 0)
            const midPts = [];
            for (let i = 0; i <= SAMPLES_CIRCLE; i++) {
                const phi = (i / SAMPLES_CIRCLE) * Math.PI * 2;
                midPts.push(new THREE.Vector3(U_MAX * Math.cos(phi), U_MAX * Math.sin(phi), 0));
            }
            const midGeom = new THREE.BufferGeometry().setFromPoints(midPts);
            const midMat = new THREE.LineBasicMaterial({
                color: new THREE.Color(C3),
                transparent: true,
                opacity: 0.38,
                depthWrite: true,
            });
            group.add(new THREE.Line(midGeom, midMat));

            // 竖直母线（圆柱面上8条等距线）
            const numVerticals = 10;
            for (let k = 0; k < numVerticals; k++) {
                const phi = (k / numVerticals) * Math.PI * 2;
                const x = U_MAX * Math.cos(phi);
                const y = U_MAX * Math.sin(phi);
                const vGeom = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(x, y, Z_MIN),
                    new THREE.Vector3(x, y, Z_MAX),
                ]);
                const vMat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C3),
                    transparent: true,
                    opacity: 0.42,
                    depthWrite: true,
                });
                group.add(new THREE.Line(vGeom, vMat));
            }

            // z轴中心线
            const axisGeom = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, Z_MIN - 0.3),
                new THREE.Vector3(0, 0, Z_MAX + 0.3),
            ]);
            const axisMat = new THREE.LineBasicMaterial({
                color: new THREE.Color(C3),
                transparent: true,
                opacity: 0.55,
                depthWrite: true,
            });
            group.add(new THREE.Line(axisGeom, axisMat));

            // 左旋螺旋线（圆柱面上，与冰蓝螺旋线旋向相反）
            const numLeftHelices = 8;
            for (let k = 0; k < numLeftHelices; k++) {
                const phi0 = (k / numLeftHelices) * Math.PI * 2;
                const pts = [];
                const dv = (V_MAX - V_MIN) / 380;
                for (let i = 0; i <= 380; i++) {
                    const v = V_MIN + i * dv;
                    const phi = phi0 - v; // 左旋（与冰蓝的+v相反）
                    pts.push(new THREE.Vector3(U_MAX * Math.cos(phi), U_MAX * Math.sin(phi), C * v));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C3),
                    transparent: true,
                    opacity: 0.36,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }

            return group;
        }

        // ==================== 生成光点标记 ====================
        function createGlintDots(colorHex, opacity, dotSize) {
            const group = new THREE.Group();
            // 在直母线与圆柱面交点处（u=U_MAX）放置光点
            const numDots = NUM_RULINGS;
            for (let k = 0; k < numDots; k++) {
                const v = V_MIN + (k / (numDots - 1)) * (V_MAX - V_MIN);
                const cx = U_MAX * Math.cos(v);
                const cy = U_MAX * Math.sin(v);
                const cz = C * v;
                const center = new THREE.Vector3(cx, cy, cz);
                const sz = dotSize;
                const pairs = [
                    [center.clone().add(new THREE.Vector3(-sz, 0, 0)), center.clone().add(new THREE.Vector3(sz, 0, 0))],
                    [center.clone().add(new THREE.Vector3(0, -sz, 0)), center.clone().add(new THREE.Vector3(0, sz, 0))],
                    [center.clone().add(new THREE.Vector3(0, 0, -sz)), center.clone().add(new THREE.Vector3(0, 0, sz))],
                ];
                for (const [a, b] of pairs) {
                    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                    const m = new THREE.LineBasicMaterial({
                        color: new THREE.Color(colorHex),
                        transparent: true,
                        opacity: opacity,
                        depthWrite: true,
                    });
                    group.add(new THREE.Line(g, m));
                }
            }
            return group;
        }

        // ==================== 组装场景 ====================
        console.log('生成螺旋面直母线...');
        const rulingGroup = createRulingLines();
        console.log('生成螺旋线族...');
        const helixGroup = createHelixLines();
        console.log('生成边界圆柱框架...');
        const cylinderGroup = createCylinderFrame();
        console.log('生成光点标记...');
        const glintsRuling = createGlintDots(C_DOT1, 0.55, 0.07);

        // 螺旋线端点光点（顶部和底部）
        function createHelixEndpointGlints() {
            const group = new THREE.Group();
            const uValues = [];
            for (let k = 1; k <= NUM_HELICES; k++) {
                uValues.push(U_MIN + (k / (NUM_HELICES + 1)) * (U_MAX - U_MIN));
            }
            const sz = 0.05;
            for (const u of uValues) {
                for (const v of [V_MIN, V_MAX]) {
                    const cx = u * Math.cos(v);
                    const cy = u * Math.sin(v);
                    const cz = C * v;
                    const center = new THREE.Vector3(cx, cy, cz);
                    const pairs = [
                        [center.clone().add(new THREE.Vector3(-sz, 0, 0)), center.clone().add(new THREE.Vector3(sz,
                            0, 0))],
                        [center.clone().add(new THREE.Vector3(0, -sz, 0)), center.clone().add(new THREE.Vector3(0,
                            sz, 0))],
                    ];
                    for (const [a, b] of pairs) {
                        const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                        const m = new THREE.LineBasicMaterial({
                            color: new THREE.Color(C_DOT2),
                            transparent: true,
                            opacity: 0.5,
                            depthWrite: true,
                        });
                        group.add(new THREE.Line(g, m));
                    }
                }
            }
            return group;
        }
        const glintsHelix = createHelixEndpointGlints();

        const mainGroup = new THREE.Group();
        mainGroup.add(rulingGroup);
        mainGroup.add(helixGroup);
        mainGroup.add(cylinderGroup);
        mainGroup.add(glintsRuling);
        mainGroup.add(glintsHelix);
        scene.add(mainGroup);

        // ==================== 原点光点 ====================
        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.12;
            const pairs = [
                [new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0)],
                [new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0)],
                [new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)],
            ];
            for (const [a, b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true,
                    opacity: 0.72,
                    depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(createOriginGlint());

        // ==================== 动画循环 ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s 线条:${NUM_RULINGS + NUM_HELICES + 21}+`);
                logTime = now;
            }

            // 整体绕对角线旋转
            mainGroup.rotation.y = time * 0.26;
            mainGroup.rotation.x = time * 0.14 + Math.sin(time * 0.24) * 0.22;
            mainGroup.rotation.z = Math.cos(time * 0.2) * 0.15;

            // 相机轻柔游走
            const camX = 2.4 + Math.sin(time * 0.15) * 0.6;
            const camY = 1.2 + Math.cos(time * 0.19) * 0.55;
            const camZ = 8.5 + Math.sin(time * 0.11) * 0.55;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        // ==================== 启动 ====================
        console.log('=== 螺旋面直母线 · 极小曲面几何 ===');
        console.log('直母线(暖金):', NUM_RULINGS, '条');
        console.log('螺旋线(冰蓝):', NUM_HELICES, '条');
        console.log('边界框架(玫瑰粉): 圆柱面线框 + 左旋螺旋线');
        console.log('总线条数:', NUM_RULINGS + NUM_HELICES + 8 + 3 + 1 + 10, '+');
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
