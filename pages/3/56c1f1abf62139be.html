<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>普朗克黑体辐射 · 能量量子化谱分布</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03040c}
  body{
    font-family:"SF Mono","Consolas","Menlo","Courier New",monospace;
    color:#bfe9ff;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;display:block;z-index:0;touch-action:none}

  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.75) 100%);
  }

  /* 顶部人生启迪 */
  .quote{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    z-index:3;pointer-events:none;
    font-size:17px;letter-spacing:3px;white-space:nowrap;
    color:#e6f7ff;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    text-shadow:
      0 0 10px rgba(255,220,160,.9),
      0 0 26px rgba(255,160,80,.65),
      0 0 52px rgba(120,160,255,.45);
    animation:qglow 5s ease-in-out infinite;
  }
  @keyframes qglow{
    0%,100%{opacity:.85;text-shadow:0 0 10px rgba(255,220,160,.85),0 0 26px rgba(255,160,80,.6),0 0 52px rgba(120,160,255,.4)}
    50%{opacity:1;text-shadow:0 0 16px rgba(255,245,220,1),0 0 38px rgba(255,190,110,.9),0 0 70px rgba(150,180,255,.6)}
  }

  /* 边缘公式面板 */
  .panel{
    position:fixed;top:50%;transform:translateY(-50%);
    z-index:3;pointer-events:none;
    font-size:12px;line-height:2.0;letter-spacing:.5px;
    color:rgba(150,225,255,.5);
    text-shadow:0 0 9px rgba(0,180,255,.45);
  }
  .panel .line{white-space:nowrap}
  .panel .hl{color:rgba(255,238,200,.95);text-shadow:0 0 12px rgba(255,200,110,.9)}
  .panel .dim{color:rgba(150,170,230,.4);font-size:11px}
  .panel.left{left:22px;text-align:left}
  .panel.right{right:22px;text-align:right}

  /* 底部控制 */
  .controls{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    z-index:4;display:flex;align-items:center;gap:14px;
    padding:10px 20px;border-radius:44px;
    background:rgba(8,14,32,.68);
    border:1px solid rgba(90,200,255,.25);
    box-shadow:0 0 26px rgba(0,120,255,.22),inset 0 0 22px rgba(0,100,200,.12);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:11px;letter-spacing:.5px;white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:8px;color:rgba(160,230,255,.85)}
  .tval{color:#ffe9b8;text-shadow:0 0 10px rgba(255,200,110,.9);min-width:58px;display:inline-block;text-align:right}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:132px;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#ff5a2a,#ffb020,#fff3d0,#bfd8ff,#7aa8ff);
    box-shadow:0 0 12px rgba(255,170,80,.55);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,#ffd080 55%,#ff7a20);
    box-shadow:0 0 14px rgba(255,190,90,.95),0 0 26px rgba(255,140,60,.6);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,#ffd080 55%,#ff7a20);
    box-shadow:0 0 14px rgba(255,190,90,.95);cursor:pointer;
  }
  .toggle{
    cursor:pointer;user-select:none;
    padding:5px 12px;border-radius:20px;
    border:1px solid rgba(90,200,255,.28);
    background:rgba(18,42,82,.32);
    color:rgba(160,225,255,.7);
    transition:all .25s ease;
  }
  .toggle:hover{border-color:rgba(140,235,255,.6);color:#ddf6ff}
  .toggle.on{
    background:rgba(90,200,255,.18);
    border-color:rgba(150,240,255,.85);
    color:#eafdff;
    box-shadow:0 0 16px rgba(90,210,255,.55),inset 0 0 12px rgba(90,210,255,.22);
  }

  @media (max-width:900px){
    .panel{display:none}
    .quote{font-size:13px;letter-spacing:1.5px;top:12px}
    .controls{gap:8px;padding:8px 12px;font-size:10px;bottom:10px}
    input[type=range]{width:80px}
    .tval{min-width:44px}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="quote">温度决定光谱，你只需在自己的频率上发光</div>

<div class="panel left">
  <div class="line">B_ν(T) = (2hν³/c²)·1/[e^(hν/k_BT) − 1]</div>
  <div class="line">E = hν = hc/λ</div>
  <div class="line">λ_max = 2.898×10⁻³ / T</div>
  <div class="line">E = σT⁴</div>
  <div class="line dim" style="margin-top:8px">维恩近似 / 瑞利-金斯极限</div>
</div>

<div class="panel right">
  <div class="line">h = 6.626×10⁻³⁴ J·s</div>
  <div class="line">c = 3.00×10⁸ m/s</div>
  <div class="line">k_B = 1.381×10⁻²³ J/K</div>
  <div class="line hl">T = <span id="vT">5800</span> K</div>
  <div class="line hl">λ_max = <span id="vL">0.50</span> μm</div>
  <div class="line hl">E = <span id="vE">6.42</span>×10⁷ W/m²</div>
  <div class="line hl">hν ≈ <span id="vP">0.50</span> eV</div>
  <div class="line dim" style="margin-top:8px">可见+紫外 58% · 红外 42%</div>
</div>

<div class="controls">
  <label>T
    <input type="range" id="tSlider" min="2000" max="8000" step="10" value="5800">
  </label>
  <span class="tval" id="tLabel">5800 K</span>
  <div class="toggle on" id="btnAuto">自动</div>
  <div class="toggle" id="btnWien">维恩近似</div>
  <div class="toggle" id="btnRJ">瑞利-金斯</div>
</div>

<script>
(function(){
  'use strict';

  /* ============================================================
     物理常量
  ============================================================ */
  const H_P  = 6.62607015e-34;
  const C_L  = 2.99792458e8;
  const K_B  = 1.380649e-23;
  const SIGMA= 5.670374419e-8;
  const EV   = 1.602176634e-19;

  /* 普朗克黑体辐射 B_λ (W·m⁻³·sr⁻¹)，λ 单位米 */
  function planckL(lam, T){
    const x = H_P * C_L / (lam * K_B * T);
    if(x > 700) return 0;
    const d = Math.expm1(x);
    if(d <= 0) return 0;
    return (2 * H_P * C_L * C_L) / (Math.pow(lam, 5) * d);
  }
  /* 维恩近似 */
  function wienL(lam, T){
    const x = H_P * C_L / (lam * K_B * T);
    if(x > 700) return 0;
    return (2 * H_P * C_L * C_L) / (Math.pow(lam, 5) * Math.exp(x));
  }
  /* 瑞利-金斯极限 */
  function rjL(lam, T){
    return 2 * C_L * K_B * T / Math.pow(lam, 4);
  }

  /* ============================================================
     色彩工具
  ============================================================ */
  function wlToRGB255(wl){
    let R=0,G=0,B=0;
    if(wl>=380 && wl<440){ R=-(wl-440)/60; G=0; B=1; }
    else if(wl>=440 && wl<490){ R=0; G=(wl-440)/50; B=1; }
    else if(wl>=490 && wl<510){ R=0; G=1; B=-(wl-510)/20; }
    else if(wl>=510 && wl<580){ R=(wl-510)/70; G=1; B=0; }
    else if(wl>=580 && wl<645){ R=1; G=-(wl-645)/65; B=0; }
    else if(wl>=645 && wl<=780){ R=1; G=0; B=0; }
    else return null;
    let f=1;
    if(wl>=380 && wl<420) f = 0.3 + 0.7*(wl-380)/40;
    else if(wl>700 && wl<=780) f = 0.3 + 0.7*(780-wl)/80;
    return [Math.round(R*f*255), Math.round(G*f*255), Math.round(B*f*255)];
  }

  function spectrumColor(lamUm){
    const wl = lamUm * 1000;
    const c = wlToRGB255(wl);
    if(c) return c;
    if(wl < 380){
      const t = Math.max(0, Math.min(1, (wl-80)/300));
      return [Math.round(40+90*t), Math.round(10+55*t), Math.round(150+105*t)];
    }
    const t = Math.min(1, (wl-780)/1800);
    return [Math.round(200-120*t), Math.round(32-24*t), Math.round(42-34*t)];
  }

  /* 黑体色温 → RGB（近似关键点插值） */
  const BB_STOPS = [
    [2000, 255, 118,  28],
    [3000, 255, 172,  88],
    [4000, 255, 208, 146],
    [5000, 255, 232, 196],
    [5800, 255, 246, 224],
    [6500, 248, 246, 255],
    [8000, 208, 226, 255]
  ];
  function tempColor(T){
    let i = 0;
    while(i < BB_STOPS.length-1 && T > BB_STOPS[i+1][0]) i++;
    const a = BB_STOPS[i], b = BB_STOPS[Math.min(i+1, BB_STOPS.length-1)];
    if(a === b) return [a[1],a[2],a[3]];
    const t = (T - a[0]) / (b[0] - a[0]);
    return [
      Math.round(a[1] + (b[1]-a[1])*t),
      Math.round(a[2] + (b[2]-a[2])*t),
      Math.round(a[3] + (b[3]-a[3])*t)
    ];
  }

  /* ============================================================
     画布 / 布局
  ============================================================ */
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W=0, H=0, DPR=1;
  let XL=0, XR=0, YB=0, YT=0, CH=0;
  let stars = [], curveGrad = null;

  const LAM_LOG_MIN = -1;
  const LAM_LOG_SPAN = 1.4771;

  function lamAtU(u){ return Math.pow(10, LAM_LOG_MIN + u*LAM_LOG_SPAN); }  // μm
  function uAtLam(um){ return (Math.log10(um) - LAM_LOG_MIN) / LAM_LOG_SPAN; }

  function buildStars(){
    stars = [];
    const n = Math.round(W*H/9000);
    for(let i=0;i<n;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: Math.random()*1.3 + 0.2,
        ph: Math.random()*Math.PI*2,
        sp: 0.4 + Math.random()*1.6
      });
    }
  }

  function buildCurveGradient(){
    curveGrad = ctx.createLinearGradient(XL, 0, XR, 0);
    const stops = 28;
    for(let i=0;i<=stops;i++){
      const u = i/stops;
      const c = spectrumColor(lamAtU(u));
      curveGrad.addColorStop(u, 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')');
    }
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W*DPR);
    canvas.height = Math.round(H*DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    const M = Math.max(38, W*0.055);
    XL = M;
    XR = W - M;
    YB = H - Math.max(72, H*0.105);
    CH = Math.min(H*0.36, 250);
    YT = YB - CH;

    buildStars();
    buildCurveGradient();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ============================================================
     状态
  ============================================================ */
  let clock = 0;
  let T = 5800;
  let autoOn = true;
  let showWien = false;
  let showRJ = false;
  let probe = null;      // { lamUm }
  let pulse = 0;

  const tSlider = document.getElementById('tSlider');
  const tLabel  = document.getElementById('tLabel');
  const btnAuto = document.getElementById('btnAuto');
  const btnWien = document.getElementById('btnWien');
  const btnRJ   = document.getElementById('btnRJ');

  const elT = document.getElementById('vT');
  const elL = document.getElementById('vL');
  const elE = document.getElementById('vE');
  const elP = document.getElementById('vP');

  tSlider.addEventListener('input', function(e){
    T = parseFloat(e.target.value);
    autoOn = false;
    btnAuto.classList.remove('on');
    updateUI();
  });
  btnAuto.addEventListener('click', function(){
    autoOn = !autoOn;
    btnAuto.classList.toggle('on', autoOn);
  });
  btnWien.addEventListener('click', function(){
    showWien = !showWien;
    btnWien.classList.toggle('on', showWien);
  });
  btnRJ.addEventListener('click', function(){
    showRJ = !showRJ;
    btnRJ.classList.toggle('on', showRJ);
  });

  function updateUI(){
    const lamMaxUm = 2898 / T;              // 维恩位移 (μm)
    const Eout = SIGMA * Math.pow(T,4);
    const peakEv = 2.821 * K_B * T / EV;    // hν_peak = 2.821 kT
    tLabel.textContent = Math.round(T) + ' K';
    elT.textContent = Math.round(T);
    elL.textContent = lamMaxUm.toFixed(2);
    elE.textContent = (Eout/1e7).toFixed(2);
    elP.textContent = peakEv.toFixed(2);
  }

  /* ============================================================
     交互：点击曲线取值
  ============================================================ */
  canvas.addEventListener('pointerdown', function(e){
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    if(x >= XL-6 && x <= XR+6 && y >= YT-60 && y <= YB+30){
      const u = Math.max(0, Math.min(1, (x - XL)/(XR - XL)));
      probe = { lamUm: lamAtU(u) };
    } else {
      probe = null;
    }
  });

  /* ============================================================
     绘制：背景星云 + 星空
  ============================================================ */
  function drawBackground(){
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#03040c';
    ctx.fillRect(0,0,W,H);

    const t01 = (T-2000)/6000;
    const nx = W/2, ny = H*0.26;
    const g = ctx.createRadialGradient(nx,ny,0, nx,ny, Math.max(W,H)*0.62);
    g.addColorStop(0,   'hsla(' + (36 - t01*36) + ',100%,52%,' + (0.055 + t01*0.055) + ')');
    g.addColorStop(0.42,'hsla(' + (22 + t01*48) + ',92%,38%,0.032)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function drawStars(){
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<stars.length;i++){
      const s = stars[i];
      const tw = 0.5 + 0.5*Math.sin(clock*s.sp + s.ph);
      ctx.fillStyle = 'rgba(180,220,255,' + (0.10 + 0.48*tw*tw) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  /* ============================================================
     绘制：黑体辐射火球
  ============================================================ */
  function drawBlackbody(){
    const cx = W/2;
    const cy = H*0.245;
    const t01 = (T-2000)/6000;
    const col = tempColor(T);
    const R = Math.min(W,H) * 0.052 * (0.82 + 0.35*t01);

    pulse += 0.03;
    const puls = 1 + 0.035*Math.sin(clock*2.1);

    ctx.globalCompositeOperation = 'lighter';

    /* 外围弥漫光晕 */
    const rOuter = R * (4.4 + 4.6*t01) * puls;
    let g = ctx.createRadialGradient(cx,cy,0, cx,cy,rOuter);
    g.addColorStop(0,    'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (0.34 + 0.30*t01) + ')');
    g.addColorStop(0.16, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (0.15 + 0.13*t01) + ')');
    g.addColorStop(0.42, 'rgba(' + Math.round(col[0]*0.72) + ',' + Math.round(col[1]*0.55) + ',' + Math.round(col[2]*0.85) + ',0.055)');
    g.addColorStop(0.72, 'rgba(' + Math.round(col[0]*0.4) + ',' + Math.round(col[1]*0.3) + ',' + Math.round(col[2]*0.7) + ',0.018)');
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, rOuter, 0, Math.PI*2);
    ctx.fill();

    /* 中层辉光 */
    const rMid = R * 2.3 * puls;
    g = ctx.createRadialGradient(cx,cy,0, cx,cy,rMid);
    g.addColorStop(0,   'rgba(255,255,255,0.95)');
    g.addColorStop(0.30,'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.62)');
    g.addColorStop(0.68,'rgba(' + col[0] + ',' + Math.round(col[1]*0.7) + ',' + Math.round(col[2]*0.6) + ',0.18)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, rMid, 0, Math.PI*2);
    ctx.fill();

    /* 炽白核心 */
    g = ctx.createRadialGradient(cx - R*0.12, cy - R*0.12, 0, cx, cy, R*1.05);
    g.addColorStop(0,   'rgba(255,255,255,1)');
    g.addColorStop(0.42,'rgba(' + Math.min(255,col[0]+70) + ',' + Math.min(255,col[1]+55) + ',' + Math.min(255,col[2]+35) + ',1)');
    g.addColorStop(0.78,'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.88)');
    g.addColorStop(1,   'rgba(' + Math.round(col[0]*0.85) + ',' + Math.round(col[1]*0.45) + ',' + Math.round(col[2]*0.35) + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, R*1.12, 0, Math.PI*2);
    ctx.fill();

    /* 核心高光点 */
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.arc(cx, cy, R*0.30*puls, 0, Math.PI*2);
    ctx.fill();

    /* 外圈脉动环 */
    const ringR = R * (2.6 + 0.55*Math.sin(clock*1.5));
    ctx.strokeStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (0.12 + 0.10*t01) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI*2);
    ctx.stroke();
  }

  /* ============================================================
     绘制：普朗克谱曲线
  ============================================================ */
  function drawPlot(){
    const N = 260;
    const hf = Math.pow(T/8000, 0.5);

    /* 采样 */
    const xs = new Float32Array(N+1);
    const ys = new Float32Array(N+1);
    let Bmax = 0;
    const Bs = new Float64Array(N+1);

    for(let i=0;i<=N;i++){
      const u = i/N;
      const lamUm = lamAtU(u);
      const lam = lamUm*1e-6;
      const B = planckL(lam, T);
      Bs[i] = B;
      if(B > Bmax) Bmax = B;
      xs[i] = XL + u*(XR-XL);
    }
    if(Bmax <= 0) Bmax = 1;

    for(let i=0;i<=N;i++){
      ys[i] = YB - (Bs[i]/Bmax) * CH * hf;
    }

    ctx.globalCompositeOperation = 'lighter';

    /* --- 曲线下方的光谱竖纹 --- */
    const wStep = (XR-XL)/N + 1;
    for(let i=0;i<=N;i++){
      const c = spectrumColor(lamAtU(i/N));
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.085)';
      ctx.fillRect(xs[i], ys[i], wStep, YB - ys[i]);
    }

    /* --- 曲线本体 --- */
    ctx.beginPath();
    ctx.moveTo(xs[0], ys[0]);
    for(let i=1;i<=N;i++){
      /* 轻度平滑 */
      const xc = (xs[i-1] + xs[i])/2;
      const yc = (ys[i-1] + ys[i])/2;
      ctx.quadraticCurveTo(xs[i-1], ys[i-1], xc, yc);
    }
    ctx.lineTo(xs[N], ys[N]);

    /* 宽光晕 */
    ctx.save();
    ctx.strokeStyle = curveGrad;
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = 13;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.restore();

    /* 锐利主线 */
    ctx.save();
    ctx.strokeStyle = curveGrad;
    ctx.lineWidth = 2.3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowBlur = 16;
    ctx.shadowColor = 'rgba(180,220,255,0.6)';
    ctx.stroke();
    ctx.restore();

    /* --- 维恩近似 --- */
    if(showWien){
      ctx.beginPath();
      let started = false;
      for(let i=0;i<=N;i++){
        const lam = lamAtU(i/N)*1e-6;
        const B = wienL(lam, T);
        const y = YB - Math.min((B/Bmax)*CH*hf, CH*1.9);
        if(!started){ ctx.moveTo(xs[i], y); started = true; }
        else ctx.lineTo(xs[i], y);
      }
      ctx.save();
      ctx.strokeStyle = 'rgba(255,180,80,0.85)';
      ctx.lineWidth = 1.7;
      ctx.setLineDash([7,5]);
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(255,170,60,0.9)';
      ctx.stroke();
      ctx.restore();
    }

    /* --- 瑞利-金斯极限 --- */
    if(showRJ){
      ctx.beginPath();
      let started = false;
      for(let i=0;i<=N;i++){
        const lam = lamAtU(i/N)*1e-6;
        const B = rjL(lam, T);
        const y = YB - Math.min((B/Bmax)*CH*hf, CH*1.9);
        if(!started){ ctx.moveTo(xs[i], y); started = true; }
        else ctx.lineTo(xs[i], y);
      }
      ctx.save();
      ctx.strokeStyle = 'rgba(120,255,180,0.80)';
      ctx.lineWidth = 1.7;
      ctx.setLineDash([3,4]);
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(90,255,170,0.9)';
      ctx.stroke();
      ctx.restore();
    }

    /* --- 峰值标记 --- */
    const lamPeakUm = 2898 / T;
    const uPeak = uAtLam(lamPeakUm);
    if(uPeak >= 0 && uPeak <= 1){
      const xp = XL + uPeak*(XR-XL);
      const lamPk = lamPeakUm*1e-6;
      const Bpk = planckL(lamPk, T);
      const yp = YB - (Bpk/Bmax)*CH*hf;

      ctx.save();
      ctx.setLineDash([4,6]);
      ctx.strokeStyle = 'rgba(255,240,190,0.42)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(xp, yp);
      ctx.lineTo(xp, YB + 6);
      ctx.stroke();
      ctx.restore();

      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,246,215,0.98)';
      ctx.beginPath();
      ctx.arc(xp, yp, 3.6, 0, Math.PI*2);
      ctx.fill();

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = '11px ui-monospace, Consolas, monospace';
      ctx.fillStyle = 'rgba(255,240,200,0.9)';
      ctx.textAlign = 'center';
      ctx.fillText('λmax ' + lamPeakUm.toFixed(2) + 'μm', xp, YT - 12);
      ctx.restore();
    }

    /* --- 基线 --- */
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(120,190,255,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(XL, YB);
    ctx.lineTo(XR, YB);
    ctx.stroke();

    /* --- 可见光谱带 --- */
    const bandY = YB + 9;
    const bandH = 13;
    const u0 = uAtLam(0.38), u1 = uAtLam(0.75);
    const bx0 = XL + u0*(XR-XL);
    const bx1 = XL + u1*(XR-XL);
    for(let px = Math.round(bx0); px < bx1; px += 1){
      const u = (px - XL)/(XR - XL);
      const wl = lamAtU(u)*1000;
      const c = wlToRGB255(wl) || [0,0,0];
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.92)';
      ctx.fillRect(px, bandY, 1, bandH);
    }
    /* 带外暗底 */
    ctx.fillStyle = 'rgba(40,50,80,0.35)';
    ctx.fillRect(XL, bandY, bx0-XL, bandH);
    ctx.fillRect(bx1, bandY, XR-bx1, bandH);

    /* 带边框 */
    ctx.strokeStyle = 'rgba(120,190,255,0.22)';
    ctx.strokeRect(XL, bandY, XR-XL, bandH);

    /* --- 刻度 --- */
    const ticks = [0.1, 0.2, 0.5, 1, 2, 3];
    ctx.font = '10px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'center';
    for(let i=0;i<ticks.length;i++){
      const u = uAtLam(ticks[i]);
      const x = XL + u*(XR-XL);
      ctx.strokeStyle = 'rgba(120,190,255,0.20)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, YB);
      ctx.lineTo(x, YB + 5);
      ctx.stroke();

      ctx.fillStyle = 'rgba(150,205,255,0.52)';
      const lbl = ticks[i] < 1 ? (ticks[i]*1000) + 'nm' : ticks[i] + 'μm';
      ctx.fillText(lbl, x, bandY + bandH + 15);
    }

    /* 峰值区提示 */
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,235,190,0.55)';
    ctx.font = '11px ui-monospace, Consolas, monospace';
    ctx.fillText('B_λ (T = ' + Math.round(T) + ' K)', XL + 2, YT - 30);

    /* 自适应高度提示 */
    ctx.fillStyle = 'rgba(140,200,255,0.35)';
    ctx.font = '10px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'right';
    ctx.fillText('归一化谱分布 · 纵轴相对强度', XR, YT - 12);
    ctx.textAlign = 'left';
  }

  /* ============================================================
     绘制：取值探针
  ============================================================ */
  function drawProbe(){
    if(!probe) return;

    const lamUm = probe.lamUm;
    const lam = lamUm*1e-6;
    const u = uAtLam(lamUm);
    if(u < 0 || u > 1) return;

    const N = 260;
    let Bmax = 0;
    for(let i=0;i<=N;i++){
      const b = planckL(lamAtU(i/N)*1e-6, T);
      if(b > Bmax) Bmax = b;
    }
    if(Bmax <= 0) Bmax = 1;

    const hf = Math.pow(T/8000, 0.5);
    const Bval = planckL(lam, T);
    const x = XL + u*(XR-XL);
    const y = YB - (Bval/Bmax)*CH*hf;

    const nu = C_L / lam;
    const Eph = H_P * nu / EV;
    const c = spectrumColor(lamUm);

    ctx.globalCompositeOperation = 'lighter';

    /* 垂直指示线 */
    ctx.save();
    ctx.setLineDash([3,5]);
    ctx.strokeStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.65)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, YB + 4);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.restore();

    /* 光点 */
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    ctx.beginPath();
    ctx.arc(x, y, 4.4, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.5)';
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI*2);
    ctx.fill();

    /* 信息卡 */
    const lines = [
      'λ  = ' + (lamUm*1000).toFixed(1) + ' nm',
      'ν  = ' + (nu/1e12).toFixed(1) + ' THz',
      'B_λ = ' + Bval.toExponential(2),
      'hν = ' + Eph.toFixed(2) + ' eV'
    ];
    ctx.globalCompositeOperation = 'source-over';

    const pad = 10;
    const lh = 16;
    ctx.font = '11px ui-monospace, Consolas, monospace';
    let tw = 0;
    for(let i=0;i<lines.length;i++){
      tw = Math.max(tw, ctx.measureText(lines[i]).width);
    }
    const bw = tw + pad*2;
    const bh = lines.length*lh + pad*2 - 4;

    let bx = x + 18;
    let by = y - bh - 14;
    if(bx + bw > W - 12) bx = x - bw - 18;
    if(bx < 12) bx = 12;
    if(by < 12) by = y + 20;
    if(by + bh > H - 12) by = H - bh - 12;

    ctx.fillStyle = 'rgba(6,14,30,0.86)';
    ctx.strokeStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 8);
    else ctx.rect(bx, by, bw, bh);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'left';
    for(let i=0;i<lines.length;i++){
      ctx.fillStyle = i === 3 ? 'rgba(255,238,190,0.95)' : 'rgba(180,230,255,0.88)';
      ctx.fillText(lines[i], bx + pad, by + pad + (i+1)*lh - 5);
    }
  }

  /* ============================================================
     主循环
  ============================================================ */
  let prev = performance.now();
  let uiTick = 0;

  function loop(now){
    let dt = (now - prev)/1000;
    prev = now;
    if(dt > 0.05) dt = 0.05;
    if(dt < 0) dt = 0;

    clock += dt;

    /* 自动温度扫描：30 秒一个完整循环 2000K ↔ 8000K */
    if(autoOn){
      const ph = (clock % 30) / 30;
      T = 5000 + 3000 * Math.sin(ph * Math.PI * 2);
      tSlider.value = Math.round(T);
    }

    drawBackground();
    drawStars();
    drawBlackbody();
    drawPlot();
    drawProbe();

    uiTick++;
    if(uiTick % 5 === 0) updateUI();

    requestAnimationFrame(loop);
  }

  updateUI();
  requestAnimationFrame(loop);

})();
</script>
