<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拓扑环面结 · 几何空间交响</title>
    <style>
        :root {
            --bg: #080a10;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay .title {
            font-size: clamp(1.2rem, 2.4vw, 1.7rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            color: #d0c8b8;
            text-shadow: 0 0 40px rgba(200, 180, 150, 0.5),
                0 0 80px rgba(180, 160, 140, 0.25);
            line-height: 1.4;
            white-space: nowrap;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.65rem, 1.2vw, 0.8rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            color: #a09888;
            text-shadow: 0 0 20px rgba(160, 150, 130, 0.4);
            margin-top: 2px;
            white-space: nowrap;
        }

        #formula-overlay {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(8, 10, 16, 0.7);
            padding: 14px 28px;
            border-radius: 40px;
            border: 1px solid rgba(180, 160, 140, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        #formula-overlay .formula {
            font-size: clamp(0.7rem, 1.3vw, 0.9rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c8bfae;
            text-shadow: 0 0 18px rgba(190, 175, 150, 0.35);
            line-height: 1.6;
            white-space: nowrap;
        }

        #formula-overlay .formula .param {
            color: #d4885c;
        }
        #formula-overlay .formula .param2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .param3 {
            color: #c77d9f;
        }

        @media (max-width: 600px) {
            #title-overlay {
                top: 18px;
            }
            #formula-overlay {
                bottom: 18px;
                padding: 10px 18px;
                border-radius: 30px;
            }
            #formula-overlay .formula {
                font-size: 0.65rem;
            }
            #title-overlay .title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="title-overlay">
        <div class="title">拓扑环面结 · 几何空间交响</div>
        <div class="subtitle">TORUS KNOTS &nbsp;·&nbsp; GEOMETRIC SYMPHONY</div>
    </div>

    <div id="formula-overlay">
        <div class="formula">
            <span class="param">𝒯(p,q):</span>&nbsp;
            x(t) = (R + r·cos(p·t))·cos(q·t)&nbsp;&nbsp;
            y(t) = (R + r·cos(p·t))·sin(q·t)&nbsp;&nbsp;
            z(t) = r·sin(p·t)&nbsp;&nbsp;
            <span style="color:#9aa8b8;">t∈[0,2π]</span>
            <br>
            <span class="param">(3,2)</span>&nbsp;
            <span class="param2">(5,3)</span>&nbsp;
            <span class="param3">(7,4)</span>&nbsp;
            <span style="color:#9aa8b8;">| 正二十面体骨架 · 黄金矩形对径线</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // 深色背景
        scene.background = new THREE.Color('#080a10');
        scene.fog = new THREE.Fog('#080a10', 6, 22);

        // 相机
        const camera = new THREE.PerspectiveCamera(
            56,
            container.clientWidth / container.clientHeight,
            0.5,
            40
        );
        camera.position.set(1.2, 1.8, 8.5);
        camera.lookAt(0, 0, 0);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 辅助函数 ====================
        /**
         * 生成环面结(torus knot)的参数方程采样点
         * @param {number} p - 小圈绕数
         * @param {number} q - 大圈绕数
         * @param {number} R - 大环半径
         * @param {number} r - 小环半径（管半径）
         * @param {number} numPoints - 采样点数
         * @returns {THREE.Vector3[]}
         */
        function torusKnotPoints(p, q, R, r, numPoints) {
            const points = [];
            const dt = (Math.PI * 2) / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const t = i * dt;
                const cosPt = Math.cos(p * t);
                const sinPt = Math.sin(p * t);
                const cosQt = Math.cos(q * t);
                const sinQt = Math.sin(q * t);
                const radius = R + r * cosPt;
                const x = radius * cosQt;
                const y = radius * sinQt;
                const z = r * sinPt;
                points.push(new THREE.Vector3(x, y, z));
            }
            return points;
        }

        /**
         * 创建Line对象
         */
        function createLineFromPoints(points, colorHex, lineWidth = 0.5) {
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                linewidth: lineWidth,
                transparent: true,
                opacity: 0.88,
                depthWrite: true,
            });
            return new THREE.Line(geometry, material);
        }

        /**
         * 创建LineSegments（用于不连续的线段）
         */
        function createLineSegmentsFromPairs(pointPairs, colorHex, opacity = 0.7) {
            const vertices = [];
            for (const pair of pointPairs) {
                vertices.push(pair[0].x, pair[0].y, pair[0].z);
                vertices.push(pair[1].x, pair[1].y, pair[1].z);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            return new THREE.LineSegments(geometry, material);
        }

        // ==================== 正二十面体结构 ====================
        const icoGroup = new THREE.Group();
        const icoRadius = 1.55;

        // 正二十面体线框
        const icoGeometry = new THREE.IcosahedronGeometry(icoRadius, 0);
        const edgesGeometry = new THREE.EdgesGeometry(icoGeometry);
        const icoEdgesMaterial = new THREE.LineBasicMaterial({
            color: new THREE.Color('#8a98a8'),
            transparent: true,
            opacity: 0.55,
            depthWrite: true,
        });
        const icoWireframe = new THREE.LineSegments(edgesGeometry, icoEdgesMaterial);
        icoGroup.add(icoWireframe);

        // 提取正二十面体顶点，创建对径线（穿过球心的直径线）
        const icoPositions = Array.from(icoGeometry.attributes.position.array);
        const icoVertices = [];
        for (let i = 0; i < icoPositions.length; i += 3) {
            icoVertices.push(new THREE.Vector3(icoPositions[i], icoPositions[i + 1], icoPositions[i + 2]));
        }

        // 找到对映顶点对（位置互为相反数）
        const antipodalPairs = [];
        const usedIndices = new Set();
        const epsilon = 0.01;
        for (let i = 0; i < icoVertices.length; i++) {
            if (usedIndices.has(i)) continue;
            const vi = icoVertices[i];
            for (let j = i + 1; j < icoVertices.length; j++) {
                if (usedIndices.has(j)) continue;
                const vj = icoVertices[j];
                const sum = vi.clone().add(vj).length();
                if (sum < epsilon) {
                    antipodalPairs.push([vi.clone(), vj.clone()]);
                    usedIndices.add(i);
                    usedIndices.add(j);
                    break;
                }
            }
        }

        // 创建对径线
        if (antipodalPairs.length > 0) {
            const antipodalLine = createLineSegmentsFromPairs(antipodalPairs, '#b0a890', 0.5);
            antipodalLine.name = 'antipodalLines';
            icoGroup.add(antipodalLine);
        }

        // 另外创建3个互相垂直的黄金矩形（正二十面体标志性结构）
        const phi = (1 + Math.sqrt(5)) / 2;
        const goldenScale = icoRadius / Math.sqrt(1 + phi * phi);
        const a = goldenScale;
        const b = goldenScale * phi;

        // 3个黄金矩形的顶点（在正二十面体外接球上）
        const goldenRectangles = [
            // 矩形1：YZ平面附近 (x≈0)
            [
                new THREE.Vector3(0, b, a),
                new THREE.Vector3(0, -b, a),
                new THREE.Vector3(0, -b, -a),
                new THREE.Vector3(0, b, -a),
            ],
            // 矩形2：XZ平面附近 (y≈0)
            [
                new THREE.Vector3(a, 0, b),
                new THREE.Vector3(-a, 0, b),
                new THREE.Vector3(-a, 0, -b),
                new THREE.Vector3(a, 0, -b),
            ],
            // 矩形3：XY平面附近 (z≈0)
            [
                new THREE.Vector3(b, a, 0),
                new THREE.Vector3(-b, a, 0),
                new THREE.Vector3(-b, -a, 0),
                new THREE.Vector3(b, -a, 0),
            ],
        ];

        for (const rect of goldenRectangles) {
            const rectPairs = [
                [rect[0], rect[1]],
                [rect[1], rect[2]],
                [rect[2], rect[3]],
                [rect[3], rect[0]],
            ];
            const rectLine = createLineSegmentsFromPairs(rectPairs, '#c0b898', 0.45);
            rectLine.name = 'goldenRect';
            icoGroup.add(rectLine);
        }

        scene.add(icoGroup);

        // ==================== 环面结组 ====================
        // 颜色定义
        const COLOR_WARM_GOLD = '#d4885c'; // 组1 - 暖金色
        const COLOR_BLUE = '#5d9ec6'; // 组2 - 蓝色
        const COLOR_ROSE = '#c77d9f'; // 组3 - 玫瑰色

        // 环面结配置
        const knotConfigs = [{
            p: 3,
            q: 2,
            R: 2.35,
            r: 0.62,
            color: COLOR_WARM_GOLD,
            numPoints: 360,
            scales: [0.82, 0.91, 1.0, 1.09, 1.18],
            worldAxis: new THREE.Vector3(0, 1, 0).normalize(),
            angularSpeed: 0.38,
            initRotation: new THREE.Euler(0, 0, 0),
        }, {
            p: 5,
            q: 3,
            R: 2.1,
            r: 0.5,
            color: COLOR_BLUE,
            numPoints: 480,
            scales: [0.83, 0.915, 1.0, 1.085, 1.17],
            worldAxis: new THREE.Vector3(0.38, 0.88, 0.28).normalize(),
            angularSpeed: 0.32,
            initRotation: new THREE.Euler(0.55, 0.2, 0.15),
        }, {
            p: 7,
            q: 4,
            R: 1.95,
            r: 0.42,
            color: COLOR_ROSE,
            numPoints: 600,
            scales: [0.84, 0.92, 1.0, 1.08, 1.16],
            worldAxis: new THREE.Vector3(-0.32, 0.85, 0.42).normalize(),
            angularSpeed: 0.28,
            initRotation: new THREE.Euler(-0.45, -0.25, 0.3),
        }];

        const knotGroups = [];

        for (const config of knotConfigs) {
            const group = new THREE.Group();
            group.rotation.copy(config.initRotation);
            group.userData = {
                worldAxis: config.worldAxis.clone(),
                angularSpeed: config.angularSpeed,
            };

            for (const scale of config.scales) {
                const R_scaled = config.R * scale;
                const r_scaled = config.r * scale;
                const points = torusKnotPoints(config.p, config.q, R_scaled, r_scaled, config.numPoints);
                const line = createLineFromPoints(points, config.color);
                line.name = `knot-${config.p}-${config.q}-scale${scale.toFixed(2)}`;
                group.add(line);
            }

            scene.add(group);
            knotGroups.push(group);
        }

        // ==================== 额外装饰：离散顶点光环 ====================
        // 在正二十面体顶点处添加微小光点（使用sprite模拟，或使用极小的线段交叉）
        // 这里使用小的星形线段在顶点位置
        const starGroup = new THREE.Group();
        const starSize = 0.06;
        for (const v of icoVertices) {
            const crossH = [
                [v.clone().add(new THREE.Vector3(-starSize, 0, 0)), v.clone().add(new THREE.Vector3(starSize, 0, 0))],
                [v.clone().add(new THREE.Vector3(0, -starSize, 0)), v.clone().add(new THREE.Vector3(0, starSize, 0))],
                [v.clone().add(new THREE.Vector3(0, 0, -starSize)), v.clone().add(new THREE.Vector3(0, 0, starSize))],
            ];
            for (const pair of crossH) {
                const seg = createLineSegmentsFromPairs([pair], '#d8d0c0', 0.65);
                starGroup.add(seg);
            }
        }
        icoGroup.add(starGroup);

        // ==================== 粒子光点沿环面结轨迹 ====================
        // 在部分环面结上放置少量光点（用微小的十字线段表示），增加灵动感
        const tracerGroup = new THREE.Group();
        const tracerConfigs = [
            { p: 3, q: 2, R: 2.35, r: 0.62, color: COLOR_WARM_GOLD, count: 12, speed: 0.6, phase: 0 },
            { p: 5, q: 3, R: 2.1, r: 0.5, color: COLOR_BLUE, count: 16, speed: 0.45, phase: Math.PI / 3 },
            { p: 7, q: 4, R: 1.95, r: 0.42, color: COLOR_ROSE, count: 20, speed: 0.35, phase: Math.PI / 5 },
        ];

        const tracerData = [];
        for (const tc of tracerConfigs) {
            const fullPoints = torusKnotPoints(tc.p, tc.q, tc.R, tc.r, 800);
            const data = {
                fullPoints,
                count: tc.count,
                speed: tc.speed,
                phase: tc.phase,
                color: tc.color,
                indices: [],
            };
            for (let i = 0; i < tc.count; i++) {
                data.indices.push(Math.floor((i / tc.count) * 800));
            }
            tracerData.push(data);

            // 为每个光点创建微小十字
            for (let i = 0; i < tc.count; i++) {
                const tcrGroup = new THREE.Group();
                const sz = 0.04;
                const crossH = [
                    [new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0)],
                    [new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0)],
                    [new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)],
                ];
                for (const pair of crossH) {
                    const seg = createLineSegmentsFromPairs([pair], tc.color, 0.8);
                    tcrGroup.add(seg);
                }
                tcrGroup.userData = { dataRef: data, index: i };
                tracerGroup.add(tcrGroup);
            }
        }
        scene.add(tracerGroup);

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animationTime = 0;
        let frameCount = 0;
        let lastLogTime = 0;

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1); // 防止大帧跳跃
            animationTime += dt;
            frameCount++;

            // 调试：每3秒输出一次确认动画运行
            if (timestamp - lastLogTime > 3000) {
                console.log(`[动画运行中] 帧数: ${frameCount}, 时间: ${animationTime.toFixed(2)}s, dt: ${dt.toFixed(4)}s`);
                lastLogTime = timestamp;
            }

            // --- 正二十面体旋转 ---
            const icoSpeedY = 0.22;
            const icoSpeedX = 0.08;
            icoGroup.rotation.y += icoSpeedY * dt;
            icoGroup.rotation.x += icoSpeedX * dt;
            // 微小的Z轴摆动
            icoGroup.rotation.z += Math.sin(animationTime * 0.4) * 0.015 * dt;

            // --- 环面结组旋转 ---
            for (const group of knotGroups) {
                const axis = group.userData.worldAxis;
                const speed = group.userData.angularSpeed;
                const angle = speed * dt;
                group.rotateOnWorldAxis(axis, angle);
            }

            // --- 更新光点位置 ---
            for (const child of tracerGroup.children) {
                const data = child.userData.dataRef;
                const idx = child.userData.index;
                if (!data || idx === undefined) continue;
                const baseIndex = data.indices[idx];
                const offset = (animationTime * data.speed * 800 / (Math.PI * 2) + data.phase * 800 / (Math.PI * 2)) % 800;
                const newIndex = Math.floor((baseIndex + offset) % 800);
                const pt = data.fullPoints[Math.abs(newIndex) % 800];
                child.position.copy(pt);
            }

            // --- 微小相机摆动 ---
            const camSwingX = Math.sin(animationTime * 0.18) * 0.35;
            const camSwingY = Math.cos(animationTime * 0.22) * 0.3;
            const camSwingZ = Math.sin(animationTime * 0.13) * 0.25;
            camera.position.x = 1.2 + camSwingX;
            camera.position.y = 1.8 + camSwingY;
            camera.position.z = 8.5 + camSwingZ;
            camera.lookAt(0, 0.05, 0);

            // --- 渲染 ---
            renderer.render(scene, camera);
        }

        // ==================== 窗口大小调整 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            console.log(`[窗口调整] ${w}x${h}`);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(onResize, 100);
        });

        // ==================== 启动 ====================
        console.log('=== 拓扑环面结 · 几何空间交响 ===');
        console.log('环面结组数:', knotGroups.length);
        console.log('正二十面体顶点数:', icoVertices.length);
        console.log('对径线对数:', antipodalPairs.length);
        console.log('黄金矩形数:', goldenRectangles.length);
        console.log('光点追踪器数:', tracerGroup.children.length);
        console.log('启动动画循环...');

        // 预热渲染一帧
        renderer.render(scene, camera);

        // 启动动画循环
        requestAnimationFrame(animate);

        console.log('✅ 动画已启动，所有结构将在每一帧持续更新。');
    </script>
</body>
</html>
