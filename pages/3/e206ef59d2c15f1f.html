<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>伯努利渗流 · 狭管涌流速程</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#03060f}
  body{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    color:#8fe8ff;-webkit-font-smoothing:antialiased;user-select:none;
  }
  #c{position:fixed;inset:0;display:block;cursor:crosshair}

  .hud{
    position:fixed;pointer-events:none;z-index:5;
    font-size:11px;line-height:1.85;letter-spacing:.4px;
    color:#5fc8e8;text-shadow:0 0 10px rgba(0,190,255,.45);
    white-space:nowrap;
  }
  .hud b{color:#d6fff8;font-weight:500}
  .hud .hl{color:#9fffe6}
  .hud .dim{color:#2f6f8c}
  .hud .warm{color:#ffb07a}
  .hud .cold{color:#7fd0ff}

  #tl{left:26px;top:22px}
  #tl .title{
    font-size:15px;letter-spacing:3px;color:#b8fff4;
    text-shadow:0 0 16px rgba(0,255,220,.7),0 0 40px rgba(0,180,255,.45);
    margin-bottom:5px;
  }
  #tl .sub{font-size:10px;letter-spacing:2px;color:#2f7f9e;margin-bottom:11px}
  #tl .eq{color:#4fb6d8}
  #tl .eq b{color:#a8f5e6}

  #tr{right:26px;top:22px;text-align:right}
  #tr .big{
    font-size:34px;line-height:1.05;color:#d6fff8;
    text-shadow:0 0 18px rgba(0,255,220,.75),0 0 48px rgba(0,160,255,.5);
    letter-spacing:1px;
  }
  #tr .st{font-size:11px;letter-spacing:2px;margin-top:6px;color:#3d8fae}
  #tr .st.on{color:#ffd9a0;text-shadow:0 0 14px rgba(255,190,90,.85)}

  #bl{left:26px;bottom:28px}
  #bl .row{margin-bottom:2px}

  #br{right:26px;bottom:28px;text-align:right}
  #br .lg{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:4px}
  #br .bar{
    width:130px;height:7px;border-radius:4px;
    background:linear-gradient(90deg,#2b8cff,#3ce0ff,#7fffdf,#ffffff);
    box-shadow:0 0 12px rgba(80,220,255,.55);
  }

  #ctrl{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    display:flex;align-items:center;gap:15px;z-index:6;
    padding:10px 20px;border-radius:30px;
    background:rgba(5,18,32,.74);
    border:1px solid rgba(0,190,255,.28);
    box-shadow:0 0 30px rgba(0,150,255,.22),inset 0 0 24px rgba(0,120,200,.14);
    backdrop-filter:blur(7px);
    font-size:11px;letter-spacing:1px;color:#66c9e6;
  }
  #ctrl .lab{color:#39a2c4}
  #ctrl .val{color:#c9fff4;min-width:56px;display:inline-block;text-align:center}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:180px;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#0a3048,#28cdf5);cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#e6fff9;border:none;
    box-shadow:0 0 12px #35e6ff,0 0 26px #35e6ff,0 0 4px #fff;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:#e6fff9;box-shadow:0 0 12px #35e6ff,0 0 26px #35e6ff;
  }
  #vecBtn{
    cursor:pointer;padding:5px 13px;border-radius:16px;
    border:1px solid rgba(0,200,255,.35);
    color:#5fc8e8;transition:.2s;font-size:10px;letter-spacing:1.5px;
  }
  #vecBtn.on{
    color:#031a17;background:#7dffe0;border-color:#7dffe0;
    box-shadow:0 0 18px rgba(90,255,220,.7);
  }
  @media (max-width:900px){
    #br,#bl{display:none}
    input[type=range]{width:100px}
    #tr .big{font-size:22px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="tl">
  <div class="title">伯 努 利 渗 流 · 狭 管 涌 流 速 程</div>
  <div class="sub">BERNOULLI · VENTURI FLOW</div>
  <div class="eq">Q = A·v = <b>常数</b></div>
  <div class="eq">p + ½ρv² + ρgh = <b>常数</b></div>
  <div class="eq">v₂ = v₁ · A₁/A₂ = v₁ · (D₁/D₂)²</div>
</div>

<div class="hud" id="tr">
  <div class="big" id="vRatio">×6.25</div>
  <div class="st" id="stLabel">喉部速度放大</div>
  <div style="margin-top:8px" class="dim">Δp = <span class="warm" id="dpOut">4.75</span> kPa</div>
  <div class="dim">Q = 157 cm³/s &nbsp;恒定</div>
</div>

<div class="hud" id="bl">
  <div class="row dim">入口 D₁ = 20 mm &nbsp;·&nbsp; 喉部 D₂ = <span class="hl" id="d2Out">8.0</span> mm</div>
  <div class="row">v₁ = <span class="cold" id="v1Out">0.50</span> m/s &nbsp;→&nbsp; v₂ = <span class="warm" id="v2Out">3.12</span> m/s</div>
  <div class="row dim">Re ≈ <span class="hl" id="reOut">—</span></div>
</div>

<div class="hud" id="br">
  <div class="dim">流速 → 色温</div>
  <div class="lg">
    <span class="cold">慢</span>
    <span class="bar"></span>
    <span class="warm">快</span>
  </div>
</div>

<div id="ctrl">
  <span class="lab">喉部直径 D₂</span>
  <input type="range" id="slider" min="4" max="16" step="0.5" value="8">
  <span class="val" id="slabel">8.0 mm</span>
  <div id="vecBtn">矢量箭头</div>
</div>

<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════════
   物理常量 / 几何
   ══════════════════════════════════════════════════ */
const L    = 260;          // 管道长度 mm
const D1   = 20;           // 入口直径 mm
const R1   = D1 / 2;       // 10 mm
let   D2   = 8;            // 喉部直径 mm（滑块）
let   R2   = D2 / 2;
const XC   = L / 2;        // 喉部中心 x
const TW   = 42;           // 收窄宽度参数
const Q    = 157000;       // 流量 mm³/s = 157 cm³/s
const RHO  = 1000;         // kg/m³
const V1   = Q / (Math.PI * R1 * R1);   // 入口速度 mm/s ≈ 499.8

const TIME_SCALE = 0.058;  // 物理 → 视觉时间缩放

/* 管半径剖面：喉部为高斯型收窄 */
function tubeR(x) {
  const t = (x - XC) / TW;
  const g = Math.exp(-t * t);
  return R2 + (R1 - R2) * (1 - g);
}
function tubeV(x) {
  const R = tubeR(x);
  return Q / (Math.PI * R * R);       // mm/s
}

/* ══════════════════════════════════════════════════
   画布
   ══════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

const trailCanvas = document.createElement('canvas');
const trailCtx = trailCanvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let scaleX = 1, scaleY = 1, originX = 0, centerY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth;
  H = window.innerHeight;

  const w = Math.floor(W * DPR), h = Math.floor(H * DPR);

  canvas.width = w; canvas.height = h;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;

  trailCanvas.width = w; trailCanvas.height = h;
  trailCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

  computeLayout();
}
window.addEventListener('resize', resize);

function computeLayout() {
  const mx = Math.max(40, W * 0.075);
  originX = mx;
  scaleX = (W - mx * 2) / L;
  centerY = H * 0.5;
  scaleY = (H * 0.40) / (2 * R1);
}

/* ══════════════════════════════════════════════════
   粒子
   ══════════════════════════════════════════════════ */
const particles = [];
let NP = 900;

function spawnU() {
  const r = Math.random() * 2 - 1;
  return Math.sign(r) * Math.sqrt(Math.abs(r)) * 0.90;
}

function initParticles() {
  NP = W < 900 ? 620 : 900;
  particles.length = 0;
  for (let i = 0; i < NP; i++) {
    const ub = spawnU();
    particles.push({
      x: Math.random() * L,
      uBase: ub,
      u: ub,
      seed: Math.random() * 6.2832,
      v: V1,
      px: 0, py: 0
    });
  }
}

function stepParticles(dt) {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const v = tubeV(p.x);
    p.v = v;
    p.x += v * TIME_SCALE * dt;

    if (p.x > L) {
      p.x -= L;
      p.uBase = spawnU();
      p.seed = Math.random() * 6.2832;
    }
    if (p.x < 0) p.x += L;

    /* 喉部下游湍流涡度增强 */
    const turb = Math.min(1, v / 2600);
    p.u = p.uBase + Math.sin(p.x * 0.09 + p.seed) * 0.045 * (0.35 + turb);
    if (p.u > 0.97)  p.u = 0.97;
    if (p.u < -0.97) p.u = -0.97;
  }
}

/* ══════════════════════════════════════════════════
   粒子绘制（写入拖尾画布）
   ══════════════════════════════════════════════════ */
function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const R = tubeR(p.x);
    const px = originX + p.x * scaleX;
    const py = centerY + p.u * R * scaleY;
    p.px = px; p.py = py;

    const vr = p.v / V1;
    let t = (vr - 1) / 4;
    if (t < 0) t = 0; else if (t > 1) t = 1;

    const hue = 205 - 20 * t;
    const sat = 100 - 92 * t;
    const lig = 56 + 42 * t;
    const alpha = 0.55 + 0.40 * t;
    const sz = 1.1 + 2.4 * t;

    trailCtx.fillStyle = `hsla(${hue.toFixed(0)},${sat.toFixed(0)}%,${lig.toFixed(0)}%,${alpha.toFixed(3)})`;
    trailCtx.fillRect(px - sz * 0.5, py - sz * 0.5, sz, sz);
  }
}

/* ══════════════════════════════════════════════════
   管道路径
   ══════════════════════════════════════════════════ */
function tubePath(c) {
  const step = 3;
  c.beginPath();
  c.moveTo(originX, centerY - tubeR(0) * scaleY);
  for (let x = 0; x <= L; x += step) {
    c.lineTo(originX + x * scaleX, centerY - tubeR(x) * scaleY);
  }
  for (let x = L; x >= 0; x -= step) {
    c.lineTo(originX + x * scaleX, centerY + tubeR(x) * scaleY);
  }
  c.closePath();
}

/* ══════════════════════════════════════════════════
   压力场背景
   ══════════════════════════════════════════════════ */
function pressureColor(xw, alpha) {
  const v = tubeV(xw) / 1000;          // m/s
  const v1m = V1 / 1000;
  const dp = 0.5 * RHO * (v * v - v1m * v1m);   // 相对入口的压降（Pa）
  let t = dp / 14000;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  const hue = 210 - 210 * t;
  return `hsla(${hue.toFixed(0)},92%,52%,${alpha})`;
}

function drawPressureField() {
  const N = 56;
  const g = ctx.createLinearGradient(originX, 0, originX + L * scaleX, 0);
  for (let i = 0; i <= N; i++) {
    const xw = (i / N) * L;
    g.addColorStop(i / N, pressureColor(xw, 0.32));
  }

  ctx.save();
  tubePath(ctx);
  ctx.clip();
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  /* 管外环境光 */
  const og = ctx.createLinearGradient(originX, 0, originX + L * scaleX, 0);
  for (let i = 0; i <= N; i += 4) {
    const xw = (i / N) * L;
    og.addColorStop(i / N, pressureColor(xw, 0.055));
  }
  ctx.fillStyle = og;
  ctx.fillRect(0, 0, W, H);
}

/* ══════════════════════════════════════════════════
   管体
   ══════════════════════════════════════════════════ */
function drawTubeBody() {
  tubePath(ctx);
  const g = ctx.createLinearGradient(0, centerY - R1 * scaleY, 0, centerY + R1 * scaleY);
  g.addColorStop(0,   'rgba(6,20,38,0.72)');
  g.addColorStop(0.5, 'rgba(3,10,22,0.42)');
  g.addColorStop(1,   'rgba(6,20,38,0.72)');
  ctx.fillStyle = g;
  ctx.fill();
}

function drawTubeWalls() {
  tubePath(ctx);

  ctx.strokeStyle = 'rgba(50,190,255,0.10)';
  ctx.lineWidth = 9;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(110,235,255,0.45)';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(225,255,255,0.92)';
  ctx.lineWidth = 1.1;
  ctx.stroke();
}

/* ══════════════════════════════════════════════════
   喉部炽白喷射
   ══════════════════════════════════════════════════ */
function drawThroatGlow() {
  const xc = originX + XC * scaleX;
  const yc = centerY;
  const ratio = (V1 / tubeV(XC));
  const inten = Math.min(1, (1 / ratio - 0.05) / 0.7);
  if (inten <= 0.02) return;

  const rad = Math.max(70, R1 * scaleY * 2.4);

  ctx.globalCompositeOperation = 'lighter';

  const g = ctx.createRadialGradient(xc, yc, 0, xc, yc, rad);
  g.addColorStop(0,    `rgba(255,255,255,${(0.26 * inten).toFixed(3)})`);
  g.addColorStop(0.22, `rgba(180,250,255,${(0.16 * inten).toFixed(3)})`);
  g.addColorStop(0.55, `rgba(60,200,255,${(0.07 * inten).toFixed(3)})`);
  g.addColorStop(1,    'rgba(0,150,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(xc - rad, yc - rad, rad * 2, rad * 2);

  /* 喉部环纹 */
  const Rth = tubeR(XC) * scaleY;
  for (let k = 0; k < 3; k++) {
    const a = inten * (0.30 - k * 0.08);
    if (a <= 0) continue;
    ctx.beginPath();
    ctx.ellipse(xc, yc, Rth * (1 + k * 0.35) + 6, (Rth * (1 + k * 0.35) + 6) * 0.32, 0, 0, 6.2832);
    ctx.strokeStyle = `rgba(200,255,250,${a.toFixed(3)})`;
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ══════════════════════════════════════════════════
   矢量箭头
   ══════════════════════════════════════════════════ */
let showVectors = false;

function drawVectors() {
  if (!showVectors) return;

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  const stepX = 16;
  const nu = 5;

  for (let x = 10; x < L - 4; x += stepX) {
    const R = tubeR(x);
    const v = tubeV(x);
    const vr = v / V1;
    let t = (vr - 1) / 6;
    if (t < 0) t = 0; else if (t > 1) t = 1;

    const len = 9 + 30 * t;
    const px = originX + x * scaleX;

    for (let j = 0; j < nu; j++) {
      const u = (j - (nu - 1) / 2) / ((nu - 1) / 2) * 0.68;
      const py = centerY + u * R * scaleY;

      ctx.strokeStyle = `hsla(${(200 - 22 * t).toFixed(0)},100%,${(64 + 28 * t).toFixed(0)}%,${(0.20 + 0.34 * t).toFixed(3)})`;
      ctx.lineWidth = 1.15;

      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + len, py);
      ctx.moveTo(px + len, py);
      ctx.lineTo(px + len - 4, py - 3.2);
      ctx.moveTo(px + len, py);
      ctx.lineTo(px + len - 4, py + 3.2);
      ctx.stroke();
    }
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ══════════════════════════════════════════════════
   追踪
   ══════════════════════════════════════════════════ */
let traced = null;
let tracePath = [];

function clearTrace() {
  traced = null;
  tracePath.length = 0;
}

function updateTrace() {
  if (!traced) return;
  const p = traced;
  const last = tracePath[tracePath.length - 1];
  if (!last || Math.abs(last.x - p.px) > 1.5 || Math.abs(last.y - p.py) > 1.5) {
    tracePath.push({ x: p.px, y: p.py });
    if (tracePath.length > 260) tracePath.shift();
  }
}

function drawTrace() {
  if (!traced || tracePath.length < 2) return;

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(tracePath[0].x, tracePath[0].y);
  for (let i = 1; i < tracePath.length; i++) {
    ctx.lineTo(tracePath[i].x, tracePath[i].y);
  }

  ctx.strokeStyle = 'rgba(255,120,60,0.16)';
  ctx.lineWidth = 7;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,190,110,0.72)';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  /* 端点标记 */
  const p = traced;
  const vr = p.v / V1;

  ctx.beginPath();
  ctx.arc(p.px, p.py, 5.5, 0, 6.2832);
  ctx.strokeStyle = 'rgba(255,200,120,0.9)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(p.px, p.py, 2.2, 0, 6.2832);
  ctx.fillStyle = '#fff2d0';
  ctx.fill();

  /* 标签 */
  const txt = `${(p.v / 1000).toFixed(2)} m/s  ·  ×${vr.toFixed(2)}`;
  ctx.font = '11px ui-monospace,monospace';
  const tw = ctx.measureText(txt).width;
  let tx = p.px + 14, ty = p.py - 14;
  if (tx + tw + 18 > W) tx = p.px - tw - 22;
  if (ty < 24) ty = 24;

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(4,14,26,0.88)';
  ctx.fillRect(tx - 7, ty - 13, tw + 16, 20);
  ctx.strokeStyle = 'rgba(255,180,100,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(tx - 7.5, ty - 13.5, tw + 17, 21);
  ctx.fillStyle = '#ffe0b0';
  ctx.fillText(txt, tx, ty + 1);
}

/* ══════════════════════════════════════════════════
   30 秒周期扫描高光
   ══════════════════════════════════════════════════ */
const CYCLE = 30;
let cycleT = 0;
let sweepX = -1;

function updateCycle(dt) {
  cycleT += dt;
  if (cycleT >= CYCLE) {
    cycleT -= CYCLE;
    sweepX = -10;
  }
  if (sweepX >= 0) {
    sweepX += 190 * dt;
    if (sweepX > L + 24) sweepX = -1;
  }
}

function drawSweep() {
  if (sweepX < 0) return;
  const x = originX + sweepX * scaleX;
  const R = tubeR(Math.max(0, Math.min(L, sweepX))) * scaleY;

  ctx.globalCompositeOperation = 'lighter';

  const g = ctx.createLinearGradient(x - 34, 0, x + 34, 0);
  g.addColorStop(0,   'rgba(140,255,240,0)');
  g.addColorStop(0.5, 'rgba(200,255,250,0.16)');
  g.addColorStop(1,   'rgba(140,255,240,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - 34, centerY - R * 1.35, 68, R * 2.7);

  ctx.beginPath();
  ctx.moveTo(x, centerY - R * 1.15);
  ctx.lineTo(x, centerY + R * 1.15);
  ctx.strokeStyle = 'rgba(220,255,255,0.75)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';
}

/* ══════════════════════════════════════════════════
   四角装饰
   ══════════════════════════════════════════════════ */
function drawCorners() {
  ctx.strokeStyle = 'rgba(0,190,255,0.28)';
  ctx.lineWidth = 1;
  const M = 14, S = 26;
  const pts = [
    [M, M, 1, 1], [W - M, M, -1, 1],
    [M, H - M, 1, -1], [W - M, H - M, -1, -1]
  ];
  ctx.beginPath();
  for (const [x, y, dx, dy] of pts) {
    ctx.moveTo(x, y + dy * S);
    ctx.lineTo(x, y);
    ctx.lineTo(x + dx * S, y);
  }
  ctx.stroke();
}

/* ══════════════════════════════════════════════════
   HUD 数值更新
   ══════════════════════════════════════════════════ */
const elRatio  = document.getElementById('vRatio');
const elSt     = document.getElementById('stLabel');
const elDp     = document.getElementById('dpOut');
const elD2     = document.getElementById('d2Out');
const elV1     = document.getElementById('v1Out');
const elV2     = document.getElementById('v2Out');
const elRe     = document.getElementById('reOut');

function updateHUD() {
  const v1 = V1 / 1000;
  const v2 = tubeV(XC) / 1000;
  const ratio = v2 / v1;
  const dp = 0.5 * RHO * (v2 * v2 - v1 * v1);

  elRatio.textContent = '×' + ratio.toFixed(2);
  elD2.textContent = D2.toFixed(1);
  elV1.textContent = v1.toFixed(2);
  elV2.textContent = v2.toFixed(2);
  elDp.textContent = (dp / 1000).toFixed(2);

  /* Re = ρvD/μ，取 μ = 1.0 mPa·s */
  const Re = RHO * v2 * (D2 / 1000) / 0.001;
  elRe.textContent = Re > 10000 ? (Re / 1000).toFixed(1) + 'k' : Re.toFixed(0);

  if (ratio > 4.5) {
    elSt.textContent = '◈ 强 喷 射 流 ◈';
    elSt.classList.add('on');
  } else if (ratio > 2.2) {
    elSt.textContent = '喉部速度放大';
    elSt.classList.remove('on');
  } else {
    elSt.textContent = '缓 变 收 缩';
    elSt.classList.remove('on');
  }
}

/* ══════════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════════ */
const slider = document.getElementById('slider');
const slabel = document.getElementById('slabel');

slider.addEventListener('input', () => {
  D2 = parseFloat(slider.value);
  R2 = D2 / 2;
  slabel.textContent = D2.toFixed(1) + ' mm';
  updateHUD();
});

const vecBtn = document.getElementById('vecBtn');
vecBtn.addEventListener('click', () => {
  showVectors = !showVectors;
  vecBtn.classList.toggle('on', showVectors);
});

canvas.addEventListener('click', e => {
  const mx = e.clientX, my = e.clientY;
  let best = null, bd = 42 * 42;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const dx = p.px - mx, dy = p.py - my;
    const d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; best = p; }
  }

  if (best) {
    traced = best;
    tracePath.length = 0;
  } else {
    clearTrace();
  }
});

/* ══════════════════════════════════════════════════
   主循环
   ══════════════════════════════════════════════════ */
let lastTs = 0;

function loop(ts) {
  requestAnimationFrame(loop);

  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 0.016;

  /* ---- 物理 ---- */
  stepParticles(dt);
  updateCycle(dt);

  /* ---- 拖尾淡出 ---- */
  trailCtx.globalCompositeOperation = 'destination-out';
  trailCtx.fillStyle = 'rgba(0,0,0,0.058)';
  trailCtx.fillRect(0, 0, W, H);

  /* ---- 粒子写入拖尾 ---- */
  trailCtx.globalCompositeOperation = 'lighter';
  drawParticles();

  updateTrace();

  /* ══════ 主画布 ══════ */
  ctx.fillStyle = '#03060f';
  ctx.fillRect(0, 0, W, H);

  drawPressureField();
  drawTubeBody();
  drawVectors();

  /* 拖尾合成 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(trailCanvas, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  drawTubeWalls();
  drawThroatGlow();
  drawTrace();
  drawSweep();

  /* 暗角 */
  const vg = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.22,
                                      W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(2,4,10,0.86)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  drawCorners();
}

/* ══════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════ */
resize();
initParticles();
updateHUD();
requestAnimationFrame(loop);

})();
</script>
