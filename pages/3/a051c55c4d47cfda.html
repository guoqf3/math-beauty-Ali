<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>复变函数映射 · w = f(z)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:24px 32px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,255,.36);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 40%,#c090ff 72%,#ffb060 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(10px,1.3vw,13px);
    letter-spacing:.12em;
    color:rgba(200,220,255,.58);
  }
  #title .formula .hl1{color:#5ee0ff;}
  #title .formula .hl2{color:#c090ff;}

  #stats{
    position:absolute;top:0;right:0;
    padding:24px 32px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.10em;line-height:2.0;
    color:rgba(170,200,250,.34);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:6px;
  }
  #stats .k{color:rgba(190,205,255,.52);}
  #stats .v{color:rgba(255,215,150,.92);font-weight:600;}

  #funcs{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:26px;
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    max-width:92vw;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
    pointer-events:auto;
  }
  .fbtn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.10em;
    color:rgba(200,215,250,.60);
    background:rgba(22,30,58,.52);
    border:1px solid rgba(120,155,230,.24);
    border-radius:8px;
    padding:8px 14px;cursor:pointer;
    transition:.28s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    white-space:nowrap;
  }
  .fbtn:hover{
    border-color:rgba(180,220,255,.80);
    color:rgba(230,240,255,.95);
    background:rgba(60,95,165,.26);
  }
  .fbtn.on{
    border-color:rgba(255,210,140,.88);
    color:rgba(255,235,200,.98);
    background:rgba(150,100,60,.28);
    box-shadow:0 0 16px rgba(255,170,110,.32);
  }

  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 32px 26px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:14px 16px;}
    #title .formula{font-size:10px;}
    #stats{padding:14px 16px;font-size:8.5px;}
    #funcs{padding-bottom:14px;gap:5px;}
    .fbtn{font-size:8.5px;padding:6px 10px;border-radius:6px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">COMPLEX MAPPING · CONFORMAL</div>
    <h1>复变函数映射</h1>
    <div class="formula">
      w = <span class="hl1">f(z)</span>
      &nbsp;·&nbsp; z = x + i<span class="hl2">y</span>
    </div>
  </div>

  <div id="stats">
    <span class="lab">LIVE MAPPING</span>
    <div><span class="k">函数 </span><span class="v" id="fName">z²</span></div>
    <div><span class="k">映射进度 </span><span class="v" id="progVal">0%</span></div>
    <div><span class="k">网格 </span><span class="v" id="gridVal">27 × 27</span></div>
    <div><span class="k">状态 </span><span class="v" id="stateVal">等待</span></div>
  </div>

  <div id="funcs"></div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>镜面反射 · 变形</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

/* =========================================================
   复变函数库
   ========================================================= */
const FUNCS = [
  {
    id: 'sq',
    name: 'z²',
    label: 'f(z) = z²',
    hue: 195,
    fn: function(z){
      return {
        re: z.re * z.re - z.im * z.im,
        im: 2 * z.re * z.im
      };
    }
  },
  {
    id: 'exp',
    name: 'e^z',
    label: 'f(z) = e^z',
    hue: 155,
    fn: function(z){
      const r = Math.exp(z.re);
      if (r > 60) return { re: NaN, im: NaN };
      return {
        re: r * Math.cos(z.im),
        im: r * Math.sin(z.im)
      };
    }
  },
  {
    id: 'inv',
    name: '1/z',
    label: 'f(z) = 1/z',
    hue: 32,
    fn: function(z){
      const d = z.re * z.re + z.im * z.im;
      if (d < 1e-5) return { re: NaN, im: NaN };
      return {
        re: z.re / d,
        im: -z.im / d
      };
    }
  },
  {
    id: 'sin',
    name: 'sin(z)',
    label: 'f(z) = sin(z)',
    hue: 270,
    fn: function(z){
      return {
        re: Math.sin(z.re) * Math.cosh(z.im),
        im: Math.cos(z.re) * Math.sinh(z.im)
      };
    }
  },
  {
    id: 'mobius',
    name: 'Möbius',
    label: 'f(z) = (z−1)/(z+1)',
    hue: 340,
    fn: function(z){
      const nr = z.re - 1, ni = z.im;
      const dr = z.re + 1, di = z.im;
      const d = dr * dr + di * di;
      if (d < 1e-5) return { re: NaN, im: NaN };
      return {
        re: (nr * dr + ni * di) / d,
        im: (ni * dr - nr * di) / d
      };
    }
  }
];

let funcIdx = 0;
let curFunc = FUNCS[0];

/* =========================================================
   布局
   ========================================================= */
let panelA = { x: 0, y: 0, w: 0, h: 0 };
let panelB = { x: 0, y: 0, w: 0, h: 0 };
let zScale = 1;
let wScale = 1;

const Z_RANGE = 2.6;
let W_RANGE = 2.6;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const padX = Math.max(20, W * 0.035);
  const padTop = 96;
  const padBot = 88;
  const availW = W - padX * 2;
  const availH = H - padTop - padBot;

  const isWide = W > H * 1.15;

  if (isWide){
    const gap = Math.max(24, W * 0.025);
    const pw = (availW - gap) / 2;
    const ph = Math.min(availH, pw * 0.92);
    panelA = { x: padX, y: padTop + (availH - ph) * 0.5, w: pw, h: ph };
    panelB = { x: padX + pw + gap, y: padTop + (availH - ph) * 0.5, w: pw, h: ph };
  } else {
    const gap = Math.max(16, H * 0.02);
    const ph = (availH - gap) / 2;
    const pw = Math.min(availW, ph * 1.05);
    const offX = (W - pw) * 0.5;
    panelA = { x: offX, y: padTop, w: pw, h: ph };
    panelB = { x: offX, y: padTop + ph + gap, w: pw, h: ph };
  }

  zScale = Math.min(panelA.w, panelA.h) / (2 * Z_RANGE);
  wScale = Math.min(panelB.w, panelB.h) / (2 * W_RANGE);
}
window.addEventListener('resize', resize);

/* =========================================================
   w 平面范围自适应
   ========================================================= */
function computeWRange(fn){
  const SAMPLE = 32;
  const vals = [];

  for (let i = 0; i <= SAMPLE; i++){
    for (let j = 0; j <= SAMPLE; j++){
      const re = -Z_RANGE + 2 * Z_RANGE * i / SAMPLE;
      const im = -Z_RANGE + 2 * Z_RANGE * j / SAMPLE;
      const w = fn({ re: re, im: im });
      if (!isFinite(w.re) || !isFinite(w.im)) continue;
      const m = Math.max(Math.abs(w.re), Math.abs(w.im));
      if (m > 50) continue;
      vals.push(m);
    }
  }

  if (vals.length === 0) return 3;

  vals.sort(function(a, b){ return a - b; });
  const p = vals[Math.floor(vals.length * 0.86)];

  return Math.max(1.0, Math.min(5.5, p * 1.22));
}

/* =========================================================
   坐标投影
   ========================================================= */
function zProj(re, im){
  return {
    x: panelA.x + panelA.w * 0.5 + re * zScale,
    y: panelA.y + panelA.h * 0.5 - im * zScale
  };
}

function wProj(re, im){
  return {
    x: panelB.x + panelB.w * 0.5 + re * wScale,
    y: panelB.y + panelB.h * 0.5 - im * wScale
  };
}

/* =========================================================
   时间轴
   ========================================================= */
const T_DEFORM = 1.0;
const T_HOLD = 2.6;
const T_RETURN = 1.0;
const T_REST = 1.0;
const CYCLE = T_DEFORM + T_HOLD + T_RETURN + T_REST;

let cycleT = 0;
let lastT = 0;
let morphPinged = false;
let mirrorPinged = false;

function easeInOut(x){
  return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) * 0.5;
}

function getMapT(){
  if (cycleT < T_DEFORM){
    return easeInOut(cycleT / T_DEFORM);
  } else if (cycleT < T_DEFORM + T_HOLD){
    return 1;
  } else if (cycleT < T_DEFORM + T_HOLD + T_RETURN){
    return 1 - easeInOut((cycleT - T_DEFORM - T_HOLD) / T_RETURN);
  } else {
    return 0;
  }
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let morphOsc = null, morphFilter = null, morphGain = null;
let mirrorOsc1 = null, mirrorOsc2 = null, mirrorGain = null;
let lastMorphPulse = 0;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.42, ac.currentTime, 1.8);

  /* 背景：两个近频正弦 */
  const o1 = ac.createOscillator();
  o1.type = 'sine';
  o1.frequency.value = 55;
  const o2 = ac.createOscillator();
  o2.type = 'sine';
  o2.frequency.value = 55.5;

  const bgG = ac.createGain();
  bgG.gain.value = 0.016;

  o1.connect(bgG);
  o2.connect(bgG);
  bgG.connect(master);
  o1.start();
  o2.start();

  /* 变形音：锯齿波 + 低通 */
  morphOsc = ac.createOscillator();
  morphOsc.type = 'sawtooth';
  morphOsc.frequency.value = 180;

  morphFilter = ac.createBiquadFilter();
  morphFilter.type = 'lowpass';
  morphFilter.frequency.value = 520;
  morphFilter.Q.value = 5.2;

  morphGain = ac.createGain();
  morphGain.gain.value = 0;

  morphOsc.connect(morphFilter);
  morphFilter.connect(morphGain);
  morphGain.connect(master);
  morphOsc.start();

  /* 镜像音：两个高音正弦 */
  mirrorOsc1 = ac.createOscillator();
  mirrorOsc1.type = 'sine';
  mirrorOsc1.frequency.value = 880;

  mirrorOsc2 = ac.createOscillator();
  mirrorOsc2.type = 'sine';
  mirrorOsc2.frequency.value = 1320;

  mirrorGain = ac.createGain();
  mirrorGain.gain.value = 0;

  mirrorOsc1.connect(mirrorGain);
  mirrorOsc2.connect(mirrorGain);
  mirrorGain.connect(master);
  mirrorOsc1.start();
  mirrorOsc2.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

function updateMorphAudio(t){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  if (morphOsc){
    const freq = 160 + t * 780;
    morphOsc.frequency.setTargetAtTime(freq, now, 0.06);
    morphFilter.frequency.setTargetAtTime(420 + t * 3200, now, 0.08);

    /* 只在 0.1~0.9 之间有声 */
    let vol = 0;
    if (t > 0.08 && t < 0.92){
      const u = (t - 0.08) / 0.84;
      vol = Math.sin(u * Math.PI) * 0.018;
    }
    morphGain.gain.setTargetAtTime(vol, now, 0.08);
  }

  if (mirrorGain){
    const vol = mirrorPinged ? 0.028 : 0;
    mirrorGain.gain.setTargetAtTime(vol, now, 0.18);
  }
}

/* 镜像反射音：上行铃 */
function playMirrorChime(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.07;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.036, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.5);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.6);
  }
}

/* 变形脉冲音 */
function playMorphPulse(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  const freq = 220 + Math.random() * 160;

  const osc = ac.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(freq * 1.9, now + 0.16);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.020, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.24);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.28);
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(){
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  bg.addColorStop(0.00, '#0a1226');
  bg.addColorStop(0.42, '#060c1a');
  bg.addColorStop(1.00, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   绘制：面板框
   ========================================================= */
function drawPanelFrame(panel, title, subtitle, hue){
  /* 背景 */
  ctx.fillStyle = 'rgba(5, 10, 22, 0.58)';
  ctx.fillRect(panel.x, panel.y, panel.w, panel.h);

  /* 内部微光 */
  const g = ctx.createRadialGradient(
    panel.x + panel.w * 0.5,
    panel.y + panel.h * 0.5,
    0,
    panel.x + panel.w * 0.5,
    panel.y + panel.h * 0.5,
    Math.max(panel.w, panel.h) * 0.75
  );
  g.addColorStop(0.00, 'hsla(' + hue + ',90%,62%,0.06)');
  g.addColorStop(1.00, 'hsla(' + hue + ',90%,52%,0)');
  ctx.fillStyle = g;
  ctx.fillRect(panel.x, panel.y, panel.w, panel.h);

  /* 边框 */
  ctx.strokeStyle = 'hsla(' + hue + ',70%,68%,0.20)';
  ctx.lineWidth = 1;
  ctx.strokeRect(panel.x, panel.y, panel.w, panel.h);

  /* 角落装饰 */
  const cs = 10;
  ctx.strokeStyle = 'hsla(' + hue + ',92%,72%,0.58)';
  ctx.lineWidth = 1.4;
  const corners = [
    [panel.x, panel.y, 1, 1],
    [panel.x + panel.w, panel.y, -1, 1],
    [panel.x, panel.y + panel.h, 1, -1],
    [panel.x + panel.w, panel.y + panel.h, -1, -1]
  ];
  for (let i = 0; i < corners.length; i++){
    const c = corners[i];
    ctx.beginPath();
    ctx.moveTo(c[0] + c[2] * cs, c[1]);
    ctx.lineTo(c[0], c[1]);
    ctx.lineTo(c[0], c[1] + c[3] * cs);
    ctx.stroke();
  }

  /* 标题 */
  ctx.font = '500 10.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'hsla(' + hue + ',92%,78%,0.72)';
  ctx.fillText(title, panel.x + 14, panel.y + 11);

  ctx.font = '400 9.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'hsla(' + hue + ',70%,74%,0.50)';
  ctx.fillText(subtitle, panel.x + panel.w - 14, panel.y + 11);
}

/* =========================================================
   绘制：网格
   ========================================================= */
const GRID_N = 13;
const SEGS = 52;

function drawGrid(panel, proj, t, isW){
  ctx.save();
  ctx.beginPath();
  ctx.rect(panel.x + 1, panel.y + 1, panel.w - 2, panel.h - 2);
  ctx.clip();

  const fn = curFunc.fn;
  const hue = curFunc.hue;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  /* 水平线（im = const）*/
  for (let k = -GRID_N; k <= GRID_N; k++){
    const imVal = k * Z_RANGE / GRID_N;
    drawGridLine(proj, t, fn, hue, imVal, 'h', k);
  }

  /* 垂直线（re = const）*/
  for (let k = -GRID_N; k <= GRID_N; k++){
    const reVal = k * Z_RANGE / GRID_N;
    drawGridLine(proj, t, fn, hue, reVal, 'v', k);
  }

  ctx.restore();
}

function drawGridLine(proj, t, fn, hue, val, dir, k){
  let started = false;

  ctx.beginPath();

  for (let i = 0; i <= SEGS; i++){
    const s = -Z_RANGE + 2 * Z_RANGE * i / SEGS;

    /* 原像 z */
    const zRe = dir === 'h' ? s : val;
    const zIm = dir === 'h' ? val : s;

    /* 像 w = f(z) */
    const w = fn({ re: zRe, im: zIm });

    let pRe, pIm;

    if (!isFinite(w.re) || !isFinite(w.im) ||
        Math.abs(w.re) > 50 || Math.abs(w.im) > 50){
      /* 无效点：断开路径，退回插值 */
      pRe = zRe + (zRe - zRe) * t;
      pIm = zIm;
      started = false;
      continue;
    }

    /* 线性插值：t=0 → z, t=1 → w */
    pRe = zRe + (w.re - zRe) * t;
    pIm = zIm + (w.im - zIm) * t;

    const p = proj(pRe, pIm);
    if (!isFinite(p.x) || !isFinite(p.y)){
      started = false;
      continue;
    }

    if (!started){
      ctx.moveTo(p.x, p.y);
      started = true;
    } else {
      ctx.lineTo(p.x, p.y);
    }
  }

  /* 颜色：中心亮，边缘暗 */
  const u = Math.abs(k) / GRID_N;
  const alpha = 0.055 + (1 - u) * 0.32;
  const lineHue = hue + (1 - u) * 22;
  const lineLight = 58 + (1 - u) * 22;

  ctx.strokeStyle = 'hsla(' + lineHue.toFixed(0) + ',92%,' + lineLight.toFixed(0) + '%,' + alpha.toFixed(3) + ')';
  ctx.lineWidth = 0.6 + (1 - u) * 1.2;

  ctx.stroke();
}

/* =========================================================
   绘制：坐标轴与参考标记
   ========================================================= */
function drawAxes(panel, proj, hue){
  ctx.save();
  ctx.beginPath();
  ctx.rect(panel.x + 1, panel.y + 1, panel.w - 2, panel.h - 2);
  ctx.clip();

  const cx = panel.x + panel.w * 0.5;
  const cy = panel.y + panel.h * 0.5;

  /* 实轴 */
  ctx.beginPath();
  ctx.moveTo(panel.x + 8, cy);
  ctx.lineTo(panel.x + panel.w - 8, cy);
  ctx.strokeStyle = 'hsla(' + hue + ',80%,72%,0.28)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 虚轴 */
  ctx.beginPath();
  ctx.moveTo(cx, panel.y + 8);
  ctx.lineTo(cx, panel.y + panel.h - 8);
  ctx.strokeStyle = 'hsla(' + hue + ',80%,72%,0.28)';
  ctx.stroke();

  ctx.restore();

  /* 轴标签 */
  ctx.font = '400 9px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'hsla(' + hue + ',70%,78%,0.48)';
  ctx.fillText('Re', panel.x + panel.w - 12, cy + 5);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('Im', cx + 6, panel.y + 12);
}

/* =========================================================
   绘制：保角标记（小十字）
   ========================================================= */
function drawConformalMarkers(t){
  /* 在 z 平面的几个参考点上画小十字，w 平面同步 */
  const marks = [
    { re: 1.0, im: 0.6 },
    { re: -0.8, im: 1.2 },
    { re: 1.4, im: -0.9 }
  ];

  const sizeZ = zScale * 0.14;
  const sizeW = wScale * 0.14;

  for (let m = 0; m < marks.length; m++){
    const z = marks[m];
    const w = curFunc.fn(z);

    if (!isFinite(w.re) || !isFinite(w.im)) continue;
    if (Math.abs(w.re) > 30 || Math.abs(w.im) > 30) continue;

    /* z 平面标记 */
    const pz = zProj(z.re, z.im);
    drawCross(pz.x, pz.y, sizeZ, curFunc.hue + 20, 0.85, 0);

    /* w 平面标记（按 t 淡入） */
    if (t > 0.2){
      const a = Math.min(1, (t - 0.2) / 0.6);
      const pRe = z.re + (w.re - z.re) * t;
      const pIm = z.im + (w.im - z.im) * t;
      const pw = wProj(pRe, pIm);

      drawCross(pw.x, pw.y, sizeW, curFunc.hue + 20, 0.85 * a, 0);
    }
  }
}

function drawCross(x, y, r, hue, alpha, rot){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  ctx.globalCompositeOperation = 'lighter';

  ctx.strokeStyle = 'hsla(' + hue + ',96%,78%,' + alpha + ')';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(-r, 0);
  ctx.lineTo(r, 0);
  ctx.moveTo(0, -r);
  ctx.lineTo(0, r);
  ctx.stroke();

  /* 中心光点 */
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.6);
  g.addColorStop(0.00, 'hsla(' + hue + ',100%,90%,' + (alpha * 0.85) + ')');
  g.addColorStop(0.42, 'hsla(' + hue + ',100%,70%,' + (alpha * 0.28) + ')');
  g.addColorStop(1.00, 'hsla(' + hue + ',100%,60%,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.6, 0, TAU);
  ctx.fill();

  ctx.restore();
}

/* =========================================================
   绘制：扫描脉冲
   ========================================================= */
const pulses = [];

function spawnPulse(){
  pulses.push({
    t: 0,
    life: 1
  });
}

function updatePulses(dt){
  for (let i = pulses.length - 1; i >= 0; i--){
    const p = pulses[i];
    p.t += dt * 0.9;
    p.life -= dt * 0.85;
    if (p.life <= 0){ pulses.splice(i, 1); continue; }
  }
}

function drawPulses(){
  if (pulses.length === 0) return;

  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < pulses.length; i++){
    const p = pulses[i];
    const u = p.t;

    /* 在 w 平面以原点为中心扩散 */
    const cx = panelB.x + panelB.w * 0.5;
    const cy = panelB.y + panelB.h * 0.5;
    const r = u * Math.min(panelB.w, panelB.h) * 0.55;

    const alpha = p.life * p.life * 0.32;

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.strokeStyle = 'hsla(' + curFunc.hue + ',100%,74%,' + alpha + ')';
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   UI
   ========================================================= */
function buildFuncBtns(){
  const wrap = document.getElementById('funcs');
  if (!wrap) return;
  wrap.innerHTML = '';

  for (let i = 0; i < FUNCS.length; i++){
    const f = FUNCS[i];
    const btn = document.createElement('button');
    btn.className = 'fbtn' + (i === funcIdx ? ' on' : '');
    btn.textContent = f.label;
    btn.dataset.idx = i;

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      initAudio();
      switchFunc(parseInt(this.dataset.idx, 10));
    });

    wrap.appendChild(btn);
  }
}

function switchFunc(idx){
  if (idx === funcIdx) return;
  funcIdx = idx;
  curFunc = FUNCS[idx];

  W_RANGE = computeWRange(curFunc.fn);
  wScale = Math.min(panelB.w, panelB.h) / (2 * W_RANGE);

  /* 重启动画 */
  cycleT = 0;
  lastT = 0;
  morphPinged = false;
  mirrorPinged = false;
  pulses.length = 0;

  /* 更新按钮 */
  document.querySelectorAll('.fbtn').forEach(function(b, i){
    b.classList.toggle('on', i === idx);
  });

  /* 更新 HUD */
  const fnEl = document.getElementById('fName');
  if (fnEl) fnEl.textContent = curFunc.name;
}

/* =========================================================
   主循环
   ========================================================= */
let lastNow = 0;
let uiTick = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastNow) lastNow = now;
  let dt = (now - lastNow) / 1000;
  lastNow = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  /* 时间推进 */
  cycleT += dt;
  if (cycleT >= CYCLE){
    cycleT -= CYCLE;
    morphPinged = false;
    mirrorPinged = false;
  }

  const t = getMapT();

  /* 变形脉冲音触发 */
  if (!morphPinged && t > 0.35 && t < 0.95){
    morphPinged = true;
    playMorphPulse();
    spawnPulse();
  }

  /* 镜像反射音触发 */
  if (!mirrorPinged && t > 0.98){
    mirrorPinged = true;
    playMirrorChime();
    spawnPulse();
  }

  /* 变形音声 */
  updateMorphAudio(t);
  updatePulses(dt);

  /* ===== 渲染 ===== */
  drawBackground();

  /* --- z 平面 --- */
  drawPanelFrame(panelA, 'z 平面 · 原像', 'RE · IM', 195);
  drawAxes(panelA, zProj, 195);

  ctx.save();
  ctx.beginPath();
  ctx.rect(panelA.x + 1, panelA.y + 1, panelA.w - 2, panelA.h - 2);
  ctx.clip();
  /* z 平面始终显示原始网格 */
  drawGridStatic(panelA, zProj, 195);
  ctx.restore();

  /* --- w 平面 --- */
  drawPanelFrame(panelB, 'w 平面 · 像', 'RE · IM', curFunc.hue);
  drawAxes(panelB, wProj, curFunc.hue);

  /* w 平面变形网格 */
  drawGrid(panelB, wProj, t, true);

  /* 保角标记 */
  drawConformalMarkers(t);

  /* 扫描脉冲 */
  drawPulses();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* HUD */
  uiTick++;
  if (uiTick % 4 === 0) updateHUD(t);
}

/* z 平面的静态网格（不做变换） */
function drawGridStatic(panel, proj, hue){
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let k = -GRID_N; k <= GRID_N; k++){
    const v = k * Z_RANGE / GRID_N;
    const u = Math.abs(k) / GRID_N;
    const alpha = 0.055 + (1 - u) * 0.34;
    const lineHue = hue + (1 - u) * 20;
    const lineLight = 58 + (1 - u) * 22;

    /* 水平线 */
    const p1 = proj(-Z_RANGE, v);
    const p2 = proj(Z_RANGE, v);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = 'hsla(' + lineHue.toFixed(0) + ',92%,' + lineLight.toFixed(0) + '%,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 0.6 + (1 - u) * 1.2;
    ctx.stroke();

    /* 垂直线 */
    const p3 = proj(v, -Z_RANGE);
    const p4 = proj(v, Z_RANGE);
    ctx.beginPath();
    ctx.moveTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.strokeStyle = 'hsla(' + lineHue.toFixed(0) + ',92%,' + lineLight.toFixed(0) + '%,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 0.6 + (1 - u) * 1.2;
    ctx.stroke();
  }

  /* 单位圆参考 */
  ctx.beginPath();
  ctx.arc(
    panel.x + panel.w * 0.5,
    panel.y + panel.h * 0.5,
    zScale,
    0, TAU
  );
  ctx.strokeStyle = 'hsla(' + hue + ',80%,70%,0.16)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function updateHUD(t){
  const pv = document.getElementById('progVal');
  const gv = document.getElementById('gridVal');
  const sv = document.getElementById('stateVal');

  if (pv) pv.textContent = Math.round(t * 100) + '%';
  if (gv) gv.textContent = (GRID_N * 2 + 1) + ' × ' + (GRID_N * 2 + 1);

  if (sv){
    if (t < 0.05) sv.textContent = '原始';
    else if (t < 0.98) sv.textContent = '变形中';
    else sv.textContent = '完全映射';
  }
}

/* =========================================================
   交互
   ========================================================= */
window.addEventListener('pointerdown', function(){
  initAudio();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    cycleT = 0;
    morphPinged = false;
    mirrorPinged = false;
  } else if (e.key >= '1' && e.key <= '5'){
    initAudio();
    const idx = parseInt(e.key, 10) - 1;
    if (idx >= 0 && idx < FUNCS.length) switchFunc(idx);
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    cycleT = 0;
    morphPinged = false;
    mirrorPinged = false;
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
W_RANGE = computeWRange(curFunc.fn);
wScale = Math.min(panelB.w, panelB.h) / (2 * W_RANGE);
buildFuncBtns();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
