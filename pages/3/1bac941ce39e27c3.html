<style>

<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">SUPERELLIPSE · CURLED CAT</div>
    <h1>蜷缩的猫咪</h1>
    <div class="sub">
      超椭圆方程 · |x/a|ⁿ + |y/b|ⁿ = 1<br>
      点击猫咪 · 更换睡姿
    </div>
  </div>

  <div id="stats">
    <span class="lab">SUPERELLIPSE PARAMS</span>
    <div><span class="k">|x/a|ⁿ + |y/b|ⁿ = 1</span></div>
    <div><span class="k">指数 n</span> <span class="v" id="nVal">2.75</span></div>
    <div><span class="k">呼吸周期</span> <span class="v">2.4 s</span></div>

    <span class="dot"></span>点击猫咪 · 换个睡姿<span class="dot"></span>
  </div>

<script>
(function(){
'use strict';

/* =========================================================
   画布
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, S = 0, DPR = 1;
let cx = 0, cy = 0, U = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);
  cx = W * 0.5;
  cy = H * 0.54;
  U = S * 0.155;
}
window.addEventListener('resize', resize);

/* =========================================================
   超椭圆
   |x/a|^n + |y/b|^n = 1
   ========================================================= */
function superPoint(t, a, b, n){
  const ct = Math.cos(t);
  const st = Math.sin(t);
  const p = 2 / n;
  return [
    a * Math.sign(ct) * Math.pow(Math.abs(ct), p),
    b * Math.sign(st) * Math.pow(Math.abs(st), p)
  ];
}

function superPath(a, b, n, segs){
  ctx.beginPath();
  for (let i = 0; i <= segs; i++){
    const t = (i / segs) * TAU;
    const p = superPoint(t, a, b, n);
    if (i === 0) ctx.moveTo(p[0], p[1]);
    else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
}

/* =========================================================
   三种睡姿
   ========================================================= */
const POSES = [
  {
    name: '蜷 缩', en: 'CURLED',
    bodyA: 1.00, bodyB: 0.92, bodyN: 2.80, bodyRot: -0.10,
    headX: 0.58, headY: -0.32, headA: 0.46, headB: 0.43,
    headN: 2.35, headRot: 0.26,
    earLdx: -0.20, earLdy: -0.34, earLrot: -0.32, earLs: 0.25,
    earRdx:  0.22, earRdy: -0.31, earRrot:  0.34, earRs: 0.23,
    tailP0x: 0.90, tailP0y: 0.50,
    tailP1x: 1.15, tailP1y: 1.06,
    tailP2x: 0.15, tailP2y: 1.32,
    tailP3x: -0.80, tailP3y: 0.86,
    tailBaseW: 0.130, tailTipW: 0.088,
    eyeOpen: 0.00,
    mouthOpen: 0.00,
    pawVisible: 0.55,
    pawX: 0.76, pawY: 0.40, pawA: 0.24, pawB: 0.16, pawRot: 0.30
  },
  {
    name: '伸 展', en: 'STRETCHED',
    bodyA: 1.28, bodyB: 0.58, bodyN: 3.05, bodyRot: 0.02,
    headX: 1.06, headY: -0.36, headA: 0.44, headB: 0.40,
    headN: 2.30, headRot: 0.10,
    earLdx: -0.17, earLdy: -0.32, earLrot: -0.28, earLs: 0.24,
    earRdx:  0.22, earRdy: -0.29, earRrot:  0.30, earRs: 0.22,
    tailP0x: -1.08, tailP0y: 0.06,
    tailP1x: -1.58, tailP1y: -0.22,
    tailP2x: -1.92, tailP2y: -0.55,
    tailP3x: -2.10, tailP3y: -0.95,
    tailBaseW: 0.120, tailTipW: 0.055,
    eyeOpen: 0.58,
    mouthOpen: 0.00,
    pawVisible: 1.00,
    pawX: 1.14, pawY: 0.40, pawA: 0.28, pawB: 0.15, pawRot: 0.06
  },
  {
    name: '打哈欠', en: 'YAWNING',
    bodyA: 1.04, bodyB: 0.85, bodyN: 2.70, bodyRot: -0.06,
    headX: 0.70, headY: -0.46, headA: 0.48, headB: 0.45,
    headN: 2.30, headRot: 0.36,
    earLdx: -0.19, earLdy: -0.35, earLrot: -0.36, earLs: 0.26,
    earRdx:  0.24, earRdy: -0.31, earRrot:  0.40, earRs: 0.24,
    tailP0x: 0.94, tailP0y: 0.44,
    tailP1x: 1.20, tailP1y: 1.02,
    tailP2x: 0.26, tailP2y: 1.30,
    tailP3x: -0.74, tailP3y: 0.88,
    tailBaseW: 0.130, tailTipW: 0.086,
    eyeOpen: 0.00,
    mouthOpen: 1.00,
    pawVisible: 0.65,
    pawX: 0.84, pawY: 0.42, pawA: 0.25, pawB: 0.16, pawRot: 0.28
  }
];

let curPose = Object.assign({}, POSES[0]);
let tgtPose = POSES[0];
let poseIdx = 0;

function lerpPose(cur, tgt, k){
  for (const key in tgt){
    if (typeof tgt[key] === 'number'){
      if (typeof cur[key] !== 'number') cur[key] = tgt[key];
      else cur[key] += (tgt[key] - cur[key]) * k;
    }
  }
}

/* =========================================================
   音频
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let purrGain = null;
let purrLfoGain = null;
let audioReady = false;
let fireGain = null;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().then(() => setAudioDot(true)).catch(() => {});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { audioCtx = new AC(); } catch(e){ return; }
  audioReady = true;

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.62;
  masterGain.connect(audioCtx.destination);

  const start = () => {
    setAudioDot(true);
    startPurr();
    startFire();
    scheduleCrackle();
  };

  if (audioCtx.state === 'suspended'){
    audioCtx.resume().then(start).catch(() => { audioReady = false; });
  } else {
    start();
  }
}

function startPurr(){
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = 26;

  const jitter = audioCtx.createOscillator();
  jitter.frequency.value = 4.7;
  const jitterG = audioCtx.createGain();
  jitterG.gain.value = 0.9;
  jitter.connect(jitterG);
  jitterG.connect(osc.frequency);
  jitter.start();

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 420;
  lp.Q.value = 1.4;

  const nLen = audioCtx.sampleRate * 2;
  const nBuf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const nd = nBuf.getChannelData(0);
  for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;

  const noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = nBuf;
  noiseSrc.loop = true;

  const nBp = audioCtx.createBiquadFilter();
  nBp.type = 'bandpass';
  nBp.frequency.value = 190;
  nBp.Q.value = 1.6;

  const nGain = audioCtx.createGain();
  nGain.gain.value = 0.34;

  purrGain = audioCtx.createGain();
  purrGain.gain.value = 0.0;

  purrLfoGain = audioCtx.createGain();
  purrLfoGain.gain.value = 0.030;

  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 25.5;

  const slowLfo = audioCtx.createOscillator();
  slowLfo.frequency.value = 0.42;
  const slowG = audioCtx.createGain();
  slowG.gain.value = 0.012;
  slowLfo.connect(slowG);
  slowG.connect(purrGain.gain);
  slowLfo.start();

  lfo.connect(purrLfoGain);
  purrLfoGain.connect(purrGain.gain);

  osc.connect(lp);
  lp.connect(purrGain);
  noiseSrc.connect(nBp);
  nBp.connect(nGain);
  nGain.connect(purrGain);

  purrGain.connect(masterGain);

  osc.start(now);
  noiseSrc.start(now);
  lfo.start(now);

  purrGain.gain.setTargetAtTime(0.052, now, 2.0);
}

function startFire(){
  const now = audioCtx.currentTime;
  const len = audioCtx.sampleRate * 3;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);

  let last = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.030 * w) / 1.030;
    d[i] = last * 3.6;
  }

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 240;
  lp.Q.value = 0.6;

  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 45;

  fireGain = audioCtx.createGain();
  fireGain.gain.value = 0.0;

  src.connect(lp);
  lp.connect(hp);
  hp.connect(fireGain);
  fireGain.connect(masterGain);
  src.start(now);

  fireGain.gain.setTargetAtTime(0.038, now, 2.4);

  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.13;
  const lg = audioCtx.createGain();
  lg.gain.value = 0.016;
  lfo.connect(lg);
  lg.connect(fireGain.gain);
  lfo.start();

  const lfo2 = audioCtx.createOscillator();
  lfo2.frequency.value = 0.07;
  const lg2 = audioCtx.createGain();
  lg2.gain.value = 80;
  lfo2.connect(lg2);
  lg2.connect(lp.frequency);
  lfo2.start();
}

function playCrackle(){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;

  const dur = 0.015 + Math.random() * 0.075;
  const n = Math.max(1, Math.ceil(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const d = buf.getChannelData(0);

  for (let i = 0; i < n; i++){
    const e = 1 - i / n;
    d[i] = (Math.random() * 2 - 1) * Math.pow(e, 2.6);
  }

  const src = audioCtx.createBufferSource();
  src.buffer = buf;

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 1100 + Math.random() * 2800;
  bp.Q.value = 1.4 + Math.random() * 3.2;

  const g = audioCtx.createGain();
  g.gain.value = 0.055 + Math.random() * 0.115;

  src.connect(bp);
  bp.connect(g);
  g.connect(masterGain);

  src.start(now);
}

function playBurst(){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;

  for (let k = 0; k < 5 + Math.floor(Math.random() * 5); k++){
    setTimeout(function(){
      if (!audioCtx) return;
      playCrackle();
    }, k * (30 + Math.random() * 70));
  }

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.exponentialRampToValueAtTime(48, now + 0.16);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.075, now + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 0.22);

  osc.connect(g);
  g.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.26);
}

let crackleTimer = null;
function scheduleCrackle(){
  if (crackleTimer) clearTimeout(crackleTimer);
  const wait = 180 + Math.random() * 1400;
  crackleTimer = setTimeout(function(){
    if (Math.random() < 0.14){
      playBurst();
    } else {
      playCrackle();
      if (Math.random() < 0.42) setTimeout(playCrackle, 40 + Math.random() * 130);
    }
    scheduleCrackle();
  }, wait);
}

/* =========================================================
   火星粒子
   ========================================================= */
const embers = [];
for (let i = 0; i < 34; i++){
  embers.push({
    x: Math.random(),
    y: 0.72 + Math.random() * 0.30,
    r: 0.5 + Math.random() * 1.8,
    vy: 0.014 + Math.random() * 0.034,
    vx: (Math.random() - 0.5) * 0.006,
    ph: Math.random() * TAU,
    life: Math.random(),
    maxLife: 0.6 + Math.random() * 0.4
  });
}

/* =========================================================
   点击涟漪反馈
   ========================================================= */
const ripples = [];

/* =========================================================
   背景
   ========================================================= */
function drawBackground(t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#140a0c');
  g.addColorStop(0.38, '#1a0d0c');
  g.addColorStop(0.72, '#160a08');
  g.addColorStop(1.00, '#0a0405');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const fireX = W * 0.78;
  const fireY = H * 1.02;
  const flicker = 0.86 + 0.14 * Math.sin(t * 3.1) + 0.08 * Math.sin(t * 7.3);

  const fg = ctx.createRadialGradient(
    fireX, fireY, 0,
    fireX, fireY, S * 0.85 * flicker
  );
  fg.addColorStop(0.00, 'rgba(255, 140, 50, 0.20)');
  fg.addColorStop(0.30, 'rgba(240, 100, 35, 0.10)');
  fg.addColorStop(0.62, 'rgba(180, 65, 25, 0.035)');
  fg.addColorStop(1.00, 'rgba(120, 40, 15, 0)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, 0, W, H);

  const fg2 = ctx.createRadialGradient(
    W * 0.20, H * 0.85, 0,
    W * 0.20, H * 0.85, S * 0.55
  );
  fg2.addColorStop(0.00, 'rgba(255, 160, 80, 0.055)');
  fg2.addColorStop(1.00, 'rgba(200, 100, 40, 0)');
  ctx.fillStyle = fg2;
  ctx.fillRect(0, 0, W, H);

  const gg = ctx.createRadialGradient(
    cx, cy + U * 1.35, 0,
    cx, cy + U * 1.35, U * 2.6
  );
  gg.addColorStop(0.00, 'rgba(0, 0, 0, 0.42)');
  gg.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gg;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < embers.length; i++){
    const e = embers[i];
    e.y -= e.vy * 0.016;
    e.x += e.vx * 0.016 + Math.sin(t * 0.7 + e.ph) * 0.0004;
    e.life += 0.0028;

    if (e.y < -0.05 || e.life > e.maxLife){
      e.y = 0.95 + Math.random() * 0.12;
      e.x = 0.52 + Math.random() * 0.48;
      e.life = 0;
      e.maxLife = 0.6 + Math.random() * 0.4;
      e.r = 0.5 + Math.random() * 1.8;
    }

    const u = e.life / e.maxLife;
    const a = Math.sin(u * Math.PI) * 0.72;

    const ex = e.x * W;
    const ey = e.y * H;
    const er = e.r * (1 + u * 0.6);

    const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, er * 4.5);
    eg.addColorStop(0.00, 'rgba(255, 225, 160, ' + (a * 0.9) + ')');
    eg.addColorStop(0.30, 'rgba(255, 160, 70, ' + (a * 0.42) + ')');
    eg.addColorStop(1.00, 'rgba(220, 90, 30, 0)');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(ex, ey, er * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   尾巴绘制
   ========================================================= */
function drawTail(P, t){
  const p0 = { x: P.tailP0x, y: P.tailP0y };
  const p1 = { x: P.tailP1x, y: P.tailP1y };
  const p2 = { x: P.tailP2x, y: P.tailP2y };
  const p3 = { x: P.tailP3x, y: P.tailP3y };

  const sway = Math.sin(t * 1.6) * 0.022;

  const N = 30;
  const pts = [];
  for (let i = 0; i <= N; i++){
    const u = i / N;
    const mt = 1 - u;
    const x = mt*mt*mt*p0.x + 3*mt*mt*u*p1.x + 3*mt*u*u*p2.x + u*u*u*p3.x;
    const y = mt*mt*mt*p0.y + 3*mt*mt*u*p1.y + 3*mt*u*u*p2.y + u*u*u*p3.y;
    pts.push({
      x: x + sway * Math.pow(u, 2.2),
      y: y + sway * 0.4 * Math.pow(u, 2.2)
    });
  }

  const left = [];
  const right = [];

  for (let i = 0; i < pts.length; i++){
    let dx, dy;
    if (i === 0){
      dx = pts[1].x - pts[0].x;
      dy = pts[1].y - pts[0].y;
    } else if (i === pts.length - 1){
      dx = pts[i].x - pts[i-1].x;
      dy = pts[i].y - pts[i-1].y;
    } else {
      dx = pts[i+1].x - pts[i-1].x;
      dy = pts[i+1].y - pts[i-1].y;
    }
    const dl = Math.hypot(dx, dy) || 1;
    const nx = -dy / dl;
    const ny =  dx / dl;

    const u = i / (pts.length - 1);
    const w = P.tailBaseW + (P.tailTipW - P.tailBaseW) * Math.pow(u, 0.78);

    left.push({ x: pts[i].x + nx * w, y: pts[i].y + ny * w });
    right.push({ x: pts[i].x - nx * w, y: pts[i].y - ny * w });
  }

  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
  for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
  ctx.closePath();

  const tg = ctx.createLinearGradient(p0.x, p0.y, p3.x, p3.y);
  tg.addColorStop(0.00, 'hsl(30, 62%, 52%)');
  tg.addColorStop(0.42, 'hsl(26, 60%, 46%)');
  tg.addColorStop(1.00, 'hsl(22, 55%, 38%)');
  ctx.fillStyle = tg;
  ctx.fill();

  ctx.strokeStyle = 'hsla(34, 70%, 68%, 0.28)';
  ctx.lineWidth = 0.012;
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
  for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
  ctx.closePath();
  ctx.clip();

  for (let k = 1; k <= 5; k++){
    const u = k / 6;
    const idx = Math.round(u * (pts.length - 1));
    const p = pts[idx];

    ctx.beginPath();
    ctx.arc(p.x, p.y, P.tailBaseW * 1.6, 0, TAU);
    ctx.fillStyle = 'hsla(24, 48%, 32%, ' + (0.24 * (1 - u * 0.4)) + ')';
    ctx.fill();
  }
  ctx.restore();
}

/* =========================================================
   身体绘制
   ========================================================= */
function drawBody(P, breathe, t){
  const a = P.bodyA * (1 + breathe * 0.014);
  const b = P.bodyB * (1 + breathe * 0.026);

  ctx.beginPath();
  ctx.ellipse(0.05, 0.16, a * 1.06, b * 1.06, 0, 0, TAU);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
  ctx.fill();

  superPath(a, b, P.bodyN, 96);

  const bg = ctx.createRadialGradient(
    -a * 0.30, -b * 0.42, 0,
    0, 0, a * 1.28
  );
  bg.addColorStop(0.00, 'hsl(36, 78%, 74%)');
  bg.addColorStop(0.34, 'hsl(31, 72%, 64%)');
  bg.addColorStop(0.68, 'hsl(27, 66%, 54%)');
  bg.addColorStop(1.00, 'hsl(23, 58%, 42%)');
  ctx.fillStyle = bg;
  ctx.fill();

  ctx.strokeStyle = 'hsla(36, 82%, 80%, 0.34)';
  ctx.lineWidth = 0.014;
  ctx.stroke();

  ctx.save();
  superPath(a, b, P.bodyN, 96);
  ctx.clip();

  ctx.globalCompositeOperation = 'multiply';
  for (let k = 0; k < 5; k++){
    const u = k / 4;
    const sx = -a * 0.86 + u * a * 0.90;

    ctx.beginPath();
    ctx.moveTo(sx, -b * 1.05);
    ctx.quadraticCurveTo(sx + a * 0.22, 0, sx - a * 0.06, b * 1.05);
    ctx.strokeStyle = 'hsla(24, 48%, 32%, ' + (0.20 - u * 0.05) + ')';
    ctx.lineWidth = 0.055 * (1 - u * 0.28);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  const hg = ctx.createRadialGradient(
    a * 0.30, b * 0.38, 0,
    a * 0.30, b * 0.38, a * 0.82
  );
  hg.addColorStop(0.00, 'hsla(40, 92%, 86%, ' + (0.30 * (1 - Math.abs(breathe) * 0.2)) + ')');
  hg.addColorStop(1.00, 'hsla(36, 85%, 78%, 0)');
  ctx.fillStyle = hg;
  superPath(a, b, P.bodyN, 96);
  ctx.fill();

  const chestR = a * (0.34 + breathe * 0.03);
  const cg = ctx.createRadialGradient(
    a * 0.10, -b * 0.05, 0,
    a * 0.10, -b * 0.05, chestR
  );
  cg.addColorStop(0.00, 'hsla(38, 95%, 90%, ' + (0.14 + breathe * 0.05) + ')');
  cg.addColorStop(1.00, 'hsla(34, 88%, 80%, 0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(a * 0.10, -b * 0.05, chestR, 0, TAU);
  ctx.fill();

  ctx.restore();
}

/* =========================================================
   前爪
   ========================================================= */
function drawPaw(P, t){
  if (P.pawVisible < 0.04) return;

  ctx.save();
  ctx.globalAlpha = P.pawVisible;
  ctx.translate(P.pawX, P.pawY);
  ctx.rotate(P.pawRot);

  superPath(P.pawA, P.pawB, 2.5, 40);

  const pg = ctx.createRadialGradient(
    -P.pawA * 0.3, -P.pawB * 0.4, 0,
    0, 0, P.pawA * 1.3
  );
  pg.addColorStop(0.00, 'hsl(38, 80%, 78%)');
  pg.addColorStop(0.62, 'hsl(32, 72%, 64%)');
  pg.addColorStop(1.00, 'hsl(26, 64%, 50%)');
  ctx.fillStyle = pg;
  ctx.fill();

  ctx.strokeStyle = 'hsla(36, 82%, 82%, 0.32)';
  ctx.lineWidth = 0.012;
  ctx.stroke();

  ctx.strokeStyle = 'hsla(24, 52%, 38%, 0.34)';
  ctx.lineWidth = 0.010;
  for (let i = -1; i <= 1; i++){
    ctx.beginPath();
    ctx.moveTo(i * P.pawA * 0.34, -P.pawB * 0.30);
    ctx.lineTo(i * P.pawA * 0.40, P.pawB * 0.48);
    ctx.stroke();
  }

  ctx.restore();
}

/* =========================================================
   耳朵
   ========================================================= */
function drawEar(dx, dy, rot, s){
  ctx.save();
  ctx.translate(dx, dy);
  ctx.rotate(rot);

  ctx.beginPath();
  ctx.moveTo(-s * 0.58, s * 0.48);
  ctx.quadraticCurveTo(-s * 0.72, -s * 0.52, 0, -s * 1.00);
  ctx.quadraticCurveTo(s * 0.60, -s * 0.48, s * 0.48, s * 0.42);
  ctx.closePath();

  const eg = ctx.createLinearGradient(0, -s, 0, s * 0.5);
  eg.addColorStop(0.00, 'hsl(30, 68%, 56%)');
  eg.addColorStop(1.00, 'hsl(26, 60%, 42%)');
  ctx.fillStyle = eg;
  ctx.fill();

  ctx.strokeStyle = 'hsla(36, 80%, 78%, 0.30)';
  ctx.lineWidth = 0.011;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-s * 0.30, s * 0.32);
  ctx.quadraticCurveTo(-s * 0.36, -s * 0.32, 0, -s * 0.62);
  ctx.quadraticCurveTo(s * 0.32, -s * 0.30, s * 0.25, s * 0.30);
  ctx.closePath();
  ctx.fillStyle = 'hsla(348, 62%, 62%, 0.68)';
  ctx.fill();

  ctx.restore();
}

/* =========================================================
   眼睛
   ========================================================= */
function drawEye(x, y, r, open, flip){
  if (open < 0.06){
    ctx.beginPath();
    ctx.moveTo(x - r * 0.92, y);
    ctx.quadraticCurveTo(x, y + r * 0.72, x + r * 0.92, y);
    ctx.strokeStyle = 'hsl(24, 48%, 26%)';
    ctx.lineWidth = r * 0.30;
    ctx.lineCap = 'round';
    ctx.stroke();
    return;
  }

  const h = r * open;

  ctx.beginPath();
  ctx.ellipse(x, y, r, h, 0, 0, TAU);
  ctx.fillStyle = 'hsl(42, 88%, 84%)';
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(
    x + r * 0.14 * flip, y,
    r * 0.72, h * 0.88, 0, 0, TAU
  );
  ctx.fillStyle = 'hsl(120, 42%, 34%)';
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(
    x + r * 0.18 * flip, y,
    r * 0.30, h * 0.76, 0, 0, TAU
  );
  ctx.fillStyle = '#0c0a08';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x - r * 0.22, y - h * 0.38, r * 0.20, 0, TAU);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x + r * 0.24, y + h * 0.30, r * 0.10, 0, TAU);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(x, y, r, h, 0, 0, TAU);
  ctx.strokeStyle = 'hsla(24, 52%, 24%, 0.62)';
  ctx.lineWidth = r * 0.13;
  ctx.stroke();
}

/* =========================================================
   鼻子与嘴
   ========================================================= */
function drawMouth(nx, ny, open, s){
  ctx.beginPath();
  ctx.moveTo(nx - s * 0.17, ny);
  ctx.lineTo(nx + s * 0.17, ny);
  ctx.lineTo(nx, ny + s * 0.21);
  ctx.closePath();
  ctx.fillStyle = 'hsl(348, 66%, 66%)';
  ctx.fill();
  ctx.strokeStyle = 'hsla(348, 60%, 48%, 0.55)';
  ctx.lineWidth = s * 0.030;
  ctx.stroke();

  if (open < 0.10){
    ctx.beginPath();
    ctx.moveTo(nx, ny + s * 0.21);
    ctx.quadraticCurveTo(nx - s * 0.15, ny + s * 0.42, nx - s * 0.30, ny + s * 0.24);
    ctx.strokeStyle = 'hsla(24, 50%, 30%, 0.72)';
    ctx.lineWidth = s * 0.055;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(nx, ny + s * 0.21);
    ctx.quadraticCurveTo(nx + s * 0.15, ny + s * 0.42, nx + s * 0.30, ny + s * 0.24);
    ctx.stroke();
  } else {
    const mw = s * (0.10 + open * 0.22);
    const mh = s * (0.06 + open * 0.34);

    ctx.beginPath();
    ctx.ellipse(nx, ny + s * 0.21 + mh * 0.72, mw, mh, 0, 0, TAU);
    ctx.fillStyle = 'hsl(348, 48%, 34%)';
    ctx.fill();
    ctx.strokeStyle = 'hsla(24, 50%, 26%, 0.62)';
    ctx.lineWidth = s * 0.045;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(
      nx, ny + s * 0.21 + mh * 1.02,
      mw * 0.62, mh * 0.44, 0, 0, TAU
    );
    ctx.fillStyle = 'hsl(348, 62%, 68%)';
    ctx.fill();
  }
}

/* =========================================================
   头部 —— 修正后的眼睛和鼻子位置
   ========================================================= */
function drawHead(P, breathe, t){
  /* 耳朵 */
  drawEar(P.earLdx, P.earLdy, P.earLrot, P.earLs);
  drawEar(P.earRdx, P.earRdy, P.earRrot, P.earRs);

  /* 头部轮廓 */
  superPath(P.headA, P.headB, P.headN, 72);

  const hg = ctx.createRadialGradient(
    -P.headA * 0.28, -P.headB * 0.38, 0,
    0, 0, P.headA * 1.30
  );
  hg.addColorStop(0.00, 'hsl(38, 82%, 78%)');
  hg.addColorStop(0.42, 'hsl(33, 76%, 67%)');
  hg.addColorStop(0.78, 'hsl(28, 68%, 56%)');
  hg.addColorStop(1.00, 'hsl(24, 60%, 44%)');
  ctx.fillStyle = hg;
  ctx.fill();

  ctx.strokeStyle = 'hsla(36, 82%, 82%, 0.32)';
  ctx.lineWidth = 0.013;
  ctx.stroke();

  /* 额头斑纹 + 口鼻部亮色 */
  ctx.save();
  superPath(P.headA, P.headB, P.headN, 72);
  ctx.clip();

  ctx.globalCompositeOperation = 'multiply';
  for (let i = -1; i <= 1; i += 2){
    ctx.beginPath();
    ctx.moveTo(i * P.headA * 0.30, -P.headB * 1.05);
    ctx.quadraticCurveTo(
      i * P.headA * 0.52, -P.headB * 0.22,
      i * P.headA * 0.22, P.headB * 0.40
    );
    ctx.strokeStyle = 'hsla(24, 48%, 34%, 0.26)';
    ctx.lineWidth = 0.032;
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* 口鼻部亮色（位于头部右下方） */
  const mg = ctx.createRadialGradient(
    P.headA * 0.42, P.headB * 0.16, 0,
    P.headA * 0.42, P.headB * 0.16, P.headA * 0.62
  );
  mg.addColorStop(0.00, 'hsla(42, 92%, 88%, 0.72)');
  mg.addColorStop(1.00, 'hsla(38, 86%, 80%, 0)');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.ellipse(
    P.headA * 0.46, P.headB * 0.20,
    P.headA * 0.60, P.headB * 0.52, 0.15, 0, TAU
  );
  ctx.fill();

  ctx.restore();

  /* ===== 眼睛（都在头部右侧，形成侧面透视）=====
     远眼：更小更靠左/上
     近眼：更大更靠右/下
     两眼瞳孔都朝右看（flip = 1）
  ================================================= */
  drawEye(P.headA * 0.10, -P.headB * 0.13, P.headA * 0.145, P.eyeOpen, 1);
  drawEye(P.headA * 0.42, -P.headB * 0.07, P.headA * 0.190, P.eyeOpen, 1);

  /* ===== 鼻与嘴（位于两眼之间的下方）===== */
  const noseX = P.headA * 0.40;
  const noseY = P.headB * 0.16;
  drawMouth(noseX, noseY, P.mouthOpen, P.headA * 0.52);

  /* ===== 胡须（从口鼻部向两侧伸出）===== */
  ctx.strokeStyle = 'hsla(38, 60%, 92%, 0.45)';
  ctx.lineWidth = 0.008;
  ctx.lineCap = 'round';

  for (let s = -1; s <= 1; s += 2){
    for (let k = 0; k < 3; k++){
      const baseX = noseX + P.headA * 0.10;
      const baseY = noseY + (k - 1) * P.headB * 0.06;
      const len = P.headA * (0.55 + k * 0.05);
      const spread = s * (0.14 + k * 0.10);

      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      ctx.quadraticCurveTo(
        baseX + len * 0.55, baseY + spread * P.headB * 0.28,
        baseX + len, baseY + spread * P.headB * 0.68
      );
      ctx.stroke();
    }
  }
}

/* =========================================================
   完整猫咪
   ========================================================= */
function drawCat(t){
  const P = curPose;

  const breathe =
      Math.sin(t * 2.62) * 0.62 +
      Math.sin(t * 4.10 + 0.9) * 0.38;

  ctx.save();
  ctx.translate(cx, cy);

  const scale = U * (1 + breathe * 0.006);
  ctx.scale(scale, scale);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  ctx.save();
  ctx.rotate(P.bodyRot);
  drawTail(P, t);
  drawBody(P, breathe, t);
  drawPaw(P, t);
  ctx.restore();

  /* 头部绝对定位 */
  const cosR = Math.cos(P.bodyRot);
  const sinR = Math.sin(P.bodyRot);
  const hx = P.headX * cosR - P.headY * sinR;
  const hy = P.headX * sinR + P.headY * cosR;
  const headBob = breathe * 0.012;

  ctx.save();
  ctx.translate(hx, hy + headBob);
  ctx.rotate(P.headRot);
  drawHead(P, breathe, t);
  ctx.restore();

  ctx.restore();

  return breathe;
}

/* =========================================================
   主循环
   ========================================================= */
let lastTime = performance.now();

function frame(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now * 0.001;

  /* 姿态插值 */
  const k = 1 - Math.exp(-3.4 * dt);
  lerpPose(curPose, tgtPose, k);

  /* 绘制 */
  drawBackground(t);
  const breathe = drawCat(t);

  /* 点击涟漪 */
  if (ripples.length > 0){
    ctx.globalCompositeOperation = 'lighter';
    for (let i = ripples.length - 1; i >= 0; i--){
      const rp = ripples[i];
      const age = (now - rp.t0) / 1000;
      if (age > 0.9){ ripples.splice(i, 1); continue; }

      const u = age / 0.9;
      const radius = U * (0.3 + u * 2.4);
      const alpha = (1 - u) * (1 - u) * 0.45;

      ctx.beginPath();
      ctx.arc(rp.x, rp.y, radius, 0, TAU);
      ctx.strokeStyle = 'hsla(34, 96%, 76%, ' + alpha + ')';
      ctx.lineWidth = 2 + (1 - u) * 6;
      ctx.stroke();

      /* 内圈 */
      if (u > 0.15){
        const u2 = (u - 0.15) / 0.85;
        const r2 = U * (0.15 + u2 * 1.6);
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, r2, 0, TAU);
        ctx.strokeStyle = 'hsla(28, 100%, 82%, ' + ((1 - u2) * 0.28) + ')';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, S * 0.30,
    W * 0.5, H * 0.5, S * 1.02
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.58, 'rgba(10, 4, 4, 0.26)');
  vg.addColorStop(1.00, 'rgba(3, 0, 0, 0.80)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* HUD */
  const nv = document.getElementById('nVal');
  if (nv) nv.textContent = curPose.bodyN.toFixed(2);

  const sb = document.getElementById('stateBig');
  const se = document.getElementById('stateEn');
  if (sb && se){
    sb.textContent = tgtPose.name;
    se.textContent = tgtPose.en;
  }

  const bv = document.getElementById('breathVal');
  if (bv){
    if (Math.abs(breathe) > 0.85) bv.textContent = '深吸';
    else if (breathe > 0.2)       bv.textContent = '吸气';
    else if (breathe < -0.2)      bv.textContent = '呼气';
    else                          bv.textContent = '平稳';
  }

  requestAnimationFrame(frame);
}

/* =========================================================
   交互 —— 修复点击无响应问题
   ========================================================= */
let lastClickTime = 0;

function nextPose(){
  /* 防止一次点击触发多次 */
  const now = performance.now();
  if (now - lastClickTime < 220) return;
  lastClickTime = now;

  /* 安全启动音频 */
  try { initAudio(); } catch(e) {}

  /* 切换姿态 */
  poseIdx = (poseIdx + 1) % POSES.length;
  tgtPose = POSES[poseIdx];

  /* 添加点击涟漪（画面中心） */
  ripples.push({ x: cx, y: cy, t0: now });
  /* 画面边缘再补一个，视觉更明显 */
  ripples.push({ x: cx, y: cy, t0: now + 80 });

  /* 打哈欠时呼噜声变化 */
  if (purrGain && audioCtx && audioCtx.state === 'running'){
    const tn = audioCtx.currentTime;
    purrGain.gain.cancelScheduledValues(tn);
    purrGain.gain.setTargetAtTime(0.018, tn, 0.4);
    purrGain.gain.setTargetAtTime(0.052, tn + 1.4, 0.9);
  }
}

/* window 级监听，确保在所有元素上都能触发 */
function onPointerDown(e){
  /* 忽略来自交互元素的点击 */
  const tgt = e.target;
  if (tgt && tgt.tagName && /^(BUTTON|INPUT|TEXTAREA|SELECT|A)$/.test(tgt.tagName)) return;

  if (e.cancelable) e.preventDefault();
  nextPose();
}

window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('touchstart', function(e){
  if (e.touches.length === 1) onPointerDown(e);
}, { passive: false });

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    nextPose();
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
requestAnimationFrame(function(now){
  lastTime = now;
  requestAnimationFrame(frame);
});

})();
</script>
