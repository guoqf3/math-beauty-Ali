<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三正交Hopf纤维化 · 四元数圆族投影 · S³编织</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d6a745;
            --cyan: #3cbca4;
            --rose: #d94050;
            --text: #cdbc8a;
            --text-dim: #887a58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.6vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.46rem, 0.92vw, 0.65rem);
            letter-spacing: 0.22em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.64);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.18);
            border-radius: 16px;
            padding: 1vh 2.4vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.6rem, 1.3vw, 0.9rem);
            color: #cdb886;
            letter-spacing: 0.07em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.4rem, 0.78vw, 0.56rem);
            color: #8a7a58;
            letter-spacing: 0.1em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3cbca4;
        }
        .accent-rose {
            color: #d94050;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.5s ease-out 0.3s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>三正交Hopf纤维化 · 四元数圆族投影 · S³编织</h1>
        <div class="subtitle">S³ = {q∈ℍ:|q|=1} &nbsp;·&nbsp; 左乘i/j/k圆纤维 &nbsp;·&nbsp; 球极投影至ℝ³</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">𝒞ⁱ(q₀)={eⁱᶿq₀}</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">𝒞ʲ(q₀)={eʲᶿq₀}</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">𝒞ᵏ(q₀)={eᵏᶿq₀}</span>
        </div>
        <div class="formula-detail">
            S³上三个正交Hopf纤维化 &nbsp;·&nbsp; 每个纤维为测地大圆 &nbsp;·&nbsp; 全局SO(4)旋转驱动动态编织
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 30);
        camera.position.set(2.5, 1.5, 7.5);
        camera.lookAt(0, 0, 0);

        // 颜色
        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3cbca4');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.8;

        // ==================== 背景星点 ====================
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 200;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const rad = 5.4 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
            starPos[i * 3 + 2] = rad * Math.cos(phi);
            starSizes[i] = Math.random() * 1.7 + 0.24;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.019,
            transparent: true,
            opacity: 0.48,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        // 极淡参考球壳
        const refSphereGeom = new THREE.SphereGeometry(2.7, 52, 36);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.08, depthWrite: false })
        );
        scene.add(refSphereWire);

        // 极淡参考环面
        const refTorusGeom = new THREE.TorusGeometry(2.05, 0.6, 12, 30);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1517, transparent: true, opacity: 0.07, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ==================== 四元数工具函数 ====================
        // 四元数: [w, x, y, z] 其中 w是标量部分, (x,y,z)是矢量部分
        function quatMul(a, b) {
            const aw = a[0],
                ax = a[1],
                ay = a[2],
                az = a[3];
            const bw = b[0],
                bx = b[1],
                by = b[2],
                bz = b[3];
            return [
                aw * bw - ax * bx - ay * by - az * bz,
                aw * bx + ax * bw + ay * bz - az * by,
                aw * by - ax * bz + ay * bw + az * bx,
                aw * bz + ax * by - ay * bx + az * bw,
            ];
        }

        function quatExp(theta, u) {
            // u是纯虚单位四元数 [0, ux, uy, uz] 且 |u|=1
            const c = Math.cos(theta);
            const s = Math.sin(theta);
            return [c, s * u[1], s * u[2], s * u[3]];
        }

        function quatNorm(q) {
            const n = Math.sqrt(q[0] ** 2 + q[1] ** 2 + q[2] ** 2 + q[3] ** 2);
            if (n < 1e-12) return [1, 0, 0, 0];
            return [q[0] / n, q[1] / n, q[2] / n, q[3] / n];
        }

        // 球极投影 S³ → R³: (w,x,y,z) → (x,y,z)/(1-w)
        function stereographic(q) {
            const w = q[0],
                x = q[1],
                y = q[2],
                z = q[3];
            const denom = 1 - w;
            const safeDenom = Math.max(Math.abs(denom), 0.04) * (denom >= 0 ? 1 : -1);
            return [x / safeDenom, y / safeDenom, z / safeDenom];
        }

        // 钳制到球体内
        function clampToSphere(pt, maxR = CLAMP_RADIUS) {
            const r = Math.sqrt(pt[0] ** 2 + pt[1] ** 2 + pt[2] ** 2);
            if (r > maxR && r > 0.001) {
                const sc = maxR / r;
                return [pt[0] * sc, pt[1] * sc, pt[2] * sc];
            }
            return pt;
        }

        // 在S³上均匀采样
        function randomS3() {
            const u1 = Math.random();
            const u2 = Math.random();
            const u3 = Math.random();
            const theta1 = 2 * Math.PI * u1;
            const theta2 = 2 * Math.PI * u2;
            const r = Math.sqrt(-Math.log(u3));
            const x = r * Math.cos(theta1);
            const y = r * Math.sin(theta1);
            const z = r * Math.cos(theta2);
            const w = r * Math.sin(theta2);
            const n = Math.sqrt(w * w + x * x + y * y + z * z);
            return [w / n, x / n, y / n, z / n];
        }

        // ==================== 曲线系统 ====================
        const allCurves = [];
        const POINTS_PER_CURVE = 120; // 每条纤维圆的顶点数

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.4;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.4;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.83,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, material);
            scene.add(line);
            const obj = { line, geometry: geom, positions };
            allCurves.push(obj);
            return obj;
        }

        // 虚单位四元数 i, j, k
        const I = [0, 1, 0, 0];
        const J = [0, 0, 1, 0];
        const K = [0, 0, 0, 1];

        // 构建纤维族
        function buildFiberFamily(count, generator, color) {
            const configs = [];
            for (let k = 0; k < count; k++) {
                // 均匀采样初始四元数
                const q0 = randomS3();
                const curve = createCurve(color);
                curve.q0 = q0;
                curve.generator = generator;
                curve.isFiber = true;
                configs.push(curve);
            }
            return configs;
        }

        // 三族纤维 + 额外混合纤维 + 点缀
        buildFiberFamily(18, I, colorGold);
        buildFiberFamily(18, J, colorCyan);
        buildFiberFamily(18, K, colorRose);

        // 混合纤维：使用(i+j)/√2, (j+k)/√2, (i+k)/√2 各2条
        const mixedGens = [
            quatNorm([0, 1, 1, 0]), // (i+j)/√2
            quatNorm([0, 0, 1, 1]), // (j+k)/√2
            quatNorm([0, 1, 0, 1]), // (i+k)/√2
        ];
        const mixedColors = [colorGold, colorCyan, colorRose, colorGold, colorCyan, colorRose];
        for (let m = 0; m < 6; m++) {
            const curve = createCurve(mixedColors[m]);
            curve.q0 = randomS3();
            curve.generator = mixedGens[m % 3];
            curve.isFiber = true;
        }

        // 额外三叶结点缀
        for (let e = 0; e < 4; e++) {
            const curve = createCurve([colorCyan, colorRose, colorGold, colorCyan][e]);
            curve.isExtra = true;
            curve.amp = 1.25 + e * 0.2;
            curve.freq = 1.8 + e * 0.28;
            curve.ph = e * 1.3;
        }

        console.log(`✅ 曲线总数: ${allCurves.length} (金18, 青18, 玫红18, 混合6, 点缀4)`);

        // 全局旋转四元数生成
        function globalRotationQuat(t) {
            // 旋转轴缓慢变化
            const angle = t * 0.35;
            const axisAngle = t * 0.15;
            const ax = Math.cos(axisAngle) * Math.sqrt(0.4);
            const ay = Math.sin(axisAngle) * Math.sqrt(0.3);
            const az = Math.cos(axisAngle * 1.3) * Math.sqrt(0.3);
            const n = Math.sqrt(ax * ax + ay * ay + az * az);
            if (n < 1e-9) return [1, 0, 0, 0];
            const u = [0, ax / n, ay / n, az / n];
            return quatExp(angle, u);
        }

        // 更新所有曲线
        function updateAllCurves(t) {
            const R = globalRotationQuat(t);
            for (let c = 0; c < allCurves.length; c++) {
                try {
                    const curve = allCurves[c];
                    const positions = curve.positions;
                    if (curve.isExtra) {
                        // 三叶结点缀
                        const amp = curve.amp;
                        const freq = curve.freq;
                        const ph = curve.ph;
                        for (let i = 0; i < POINTS_PER_CURVE; i++) {
                            const s = (i / POINTS_PER_CURVE) * Math.PI * 2;
                            const inner = s * freq + t * 0.5 + ph;
                            let x = amp * (Math.sin(inner) + 0.5 * Math.sin(3 * inner)) * 0.82;
                            let y = amp * (Math.cos(inner) - 0.4 * Math.cos(2 * inner)) * 0.82;
                            let z = amp * 0.6 * Math.sin(2 * inner + t * 0.32);
                            const r = Math.sqrt(x * x + y * y + z * z);
                            if (r > CLAMP_RADIUS && r > 0.001) {
                                const sc = CLAMP_RADIUS / r;
                                x *= sc;
                                y *= sc;
                                z *= sc;
                            }
                            positions[i * 3] = x;
                            positions[i * 3 + 1] = y;
                            positions[i * 3 + 2] = z;
                        }
                    } else if (curve.isFiber) {
                        // Hopf纤维圆
                        const q0 = curve.q0;
                        const gen = curve.generator;
                        for (let i = 0; i < POINTS_PER_CURVE; i++) {
                            const theta = (i / (POINTS_PER_CURVE - 1)) * Math.PI * 2;
                            // 指数映射生成纤维上的点
                            const expGen = quatExp(theta, gen);
                            // 左乘：expGen * q0
                            const qOnFiber = quatMul(expGen, q0);
                            // 全局右旋：qOnFiber * R
                            const qRotated = quatMul(qOnFiber, R);
                            // 球极投影
                            const s3 = stereographic(qRotated);
                            // 钳制
                            const p = clampToSphere(s3, CLAMP_RADIUS);
                            positions[i * 3] = p[0];
                            positions[i * 3 + 1] = p[1];
                            positions[i * 3 + 2] = p[2];
                        }
                    }
                    curve.geometry.attributes.position.needsUpdate = true;
                } catch (e) {
                    console.warn(`曲线${c}更新异常, 已跳过`, e);
                }
            }
        }

        // ==================== 流动粒子 ====================
        const particleCount = 22;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            const ci = i % allCurves.length;
            particleData.push({
                curveIndex: ci,
                progress: Math.random(),
                speed: 0.00055 + Math.random() * 0.0023,
            });
            let col;
            if (i < 8) col = colorGold.clone();
            else if (i < 15) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 1] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            try {
                for (let p = 0; p < particleCount; p++) {
                    const pd = particleData[p];
                    pd.progress += pd.speed;
                    if (pd.progress >= 1.0) pd.progress -= 1.0;
                    if (pd.progress < 0) pd.progress += 1.0;
                    const curveObj = allCurves[pd.curveIndex];
                    if (!curveObj || !curveObj.positions) continue;
                    const posArr = curveObj.positions;
                    const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                    const idx0 = Math.floor(floatIdx);
                    const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                    const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                    const i0 = idx0 * 3,
                        i1 = idx1 * 3;
                    particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                    particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                    particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
                }
                particlesGeom.attributes.position.needsUpdate = true;
            } catch (e) {
                console.warn('粒子更新异常, 已跳过', e);
            }
        }

        // ==================== 极度健壮的动画循环 ====================
        const clock = new THREE.Clock();
        let animationTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animationTime += dt;
                frameCount++;

                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const elapsed = (now - lastLogTime) / 1000;
                    const fps = Math.round(frameCount / elapsed);
                    console.log(
                        `🔄 运行中 | FPS: ${fps} | 时间: ${animationTime.toFixed(1)}s | dt: ${(dt * 1000).toFixed(1)}ms`
                    );
                    frameCount = 0;
                    lastLogTime = now;
                }

                updateAllCurves(animationTime);
                updateParticles();

                const breathe = 1 + 0.05 * Math.sin(animationTime * 0.4) * Math.cos(animationTime * 0.3);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.06;
                refSphereWire.rotation.y += dt * 0.05;

                refTorusWire.rotation.z += dt * 0.06;
                const torBreathe = 1 + 0.06 * Math.sin(animationTime * 0.43) * Math.cos(animationTime * 0.32);
                refTorusWire.scale.setScalar(torBreathe);

                const camH = animationTime * 0.1;
                const camV = 0.34 + 0.18 * Math.sin(animationTime * 0.15);
                const camD = 7.3 + 0.65 * Math.sin(animationTime * 0.2) * Math.cos(animationTime * 0.26);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.06 * Math.sin(animationTime * 0.1), 0.03 * Math.cos(animationTime * 0.13), 0);

                stars.rotation.y += dt * 0.014;
                stars.rotation.x += dt * 0.01;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画主循环异常, 循环仍继续:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                clock.getDelta();
            }
        });

        // ==================== 启动 ====================
        console.log('🚀 三正交Hopf纤维化动画初始化... 预渲染第一帧');
        updateAllCurves(0);
        updateParticles();
        renderer.render(scene, camera);
        clock.start();
        animationTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动，64条Hopf纤维圆在S³→R³投影中持续编织');
    </script>
</body>
</html>
