<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椭圆函数晶格 · 球极投影</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>椭圆函数晶格 · 球极投影</h2>
        <div class="sub">Weierstrass ℘-function · Doubly periodic lattice · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">等实部: Re(℘)=c</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">等虚部: Im(℘)=c</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">等模长: |℘|=c</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.5, 2.5, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟
        let startTime = performance.now();
        let elapsed = 0;
        function tick() { elapsed = (performance.now() - startTime) * 0.001; return elapsed; }

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        const SPHERE_R = 2.5;
        const PROJ_D = 2.2;

        // 立体投影：平面 → 球面
        function stereographic(px, py) {
            const denom = px*px + py*py + PROJ_D*PROJ_D;
            return new THREE.Vector3(
                2*PROJ_D*px / denom,
                2*PROJ_D*py / denom,
                (px*px + py*py - PROJ_D*PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // ---------- Weierstrass ℘ 函数近似 ----------
        // 使用双周期格点 truncation 求和：℘(z) = 1/z² + Σ'(1/(z-w)² - 1/w²)
        // 格点: ω1=1, ω2=τ*i (τ≈1.3)
        const tau = 1.3;
        const omega1 = 1.0;
        const omega2Real = 0.0, omega2Imag = tau;

        function latticePoint(m, n) {
            return { re: m*omega1 + n*omega2Real, im: m*0 + n*omega2Imag };
        }

        function weierstrassP(zRe, zIm) {
            // 1/z² 项
            let resRe = zRe*zRe - zIm*zIm;
            let resIm = 2*zRe*zIm;
            const denom0 = (zRe*zRe + zIm*zIm);
            if (denom0 > 1e-10) {
                resRe /= denom0*denom0;
                resIm = -resIm / (denom0*denom0);
            } else return { re: Infinity, im: Infinity };

            let sumRe = 0, sumIm = 0;
            const maxM = 8, maxN = 8;
            for (let m = -maxM; m <= maxM; m++) {
                for (let n = -maxN; n <= maxN; n++) {
                    if (m === 0 && n === 0) continue;
                    const w = latticePoint(m, n);
                    const dzRe = zRe - w.re;
                    const dzIm = zIm - w.im;
                    const dz2 = dzRe*dzRe + dzIm*dzIm;
                    if (dz2 < 1e-10) continue;
                    const w2 = w.re*w.re + w.im*w.im + 1e-10;
                    // 1/(z-w)²
                    const invRe = (dzRe*dzRe - dzIm*dzIm) / (dz2*dz2);
                    const invIm = -2*dzRe*dzIm / (dz2*dz2);
                    // 1/w²
                    const invWRe = (w.re*w.re - w.im*w.im) / (w2*w2);
                    const invWIm = -2*w.re*w.im / (w2*w2);
                    sumRe += invRe - invWRe;
                    sumIm += invIm - invWIm;
                }
            }
            resRe += sumRe;
            resIm += sumIm;
            return { re: resRe, im: resIm };
        }

        // ---------- 等值线追踪 ----------
        const planeRange = 1.8;
        const step = 0.015;

        function traceLevelCurve(startX, startY, evalFn, targetVal, type, maxSteps = 600) {
            const pts = [];
            let x = startX, y = startY;
            const visited = new Set();
            for (let s = 0; s < maxSteps; s++) {
                if (Math.abs(x) > planeRange || Math.abs(y) > planeRange) break;
                const key = Math.round(x*50) + ',' + Math.round(y*50);
                if (visited.has(key) && s > 20) break;
                if (s > 15) visited.add(key);

                pts.push([x, y]);

                const val = evalFn(x, y);
                let currentVal;
                if (type === 'real') currentVal = val.re;
                else if (type === 'imag') currentVal = val.im;
                else currentVal = Math.sqrt(val.re*val.re + val.im*val.im);

                const hx = 1e-5, hy = 1e-5;
                const valX = evalFn(x+hx, y);
                const valY = evalFn(x, y+hy);
                let dx, dy;
                if (type === 'real') {
                    dx = (valX.re - currentVal) / hx;
                    dy = (valY.re - currentVal) / hy;
                } else if (type === 'imag') {
                    dx = (valX.im - currentVal) / hx;
                    dy = (valY.im - currentVal) / hy;
                } else {
                    const rX = Math.sqrt(valX.re*valX.re + valX.im*valX.im);
                    const rY = Math.sqrt(valY.re*valY.re + valY.im*valY.im);
                    dx = (rX - currentVal) / hx;
                    dy = (rY - currentVal) / hy;
                }
                const grad2 = dx*dx + dy*dy;
                if (grad2 < 1e-12) break;
                const tangentX = -dy;
                const tangentY = dx;
                const tn = Math.sqrt(tangentX*tangentX + tangentY*tangentY);
                x += step * tangentX / tn;
                y += step * tangentY / tn;

                // 牛顿校正
                const valNew = evalFn(x, y);
                let newVal;
                if (type === 'real') newVal = valNew.re;
                else if (type === 'imag') newVal = valNew.im;
                else newVal = Math.sqrt(valNew.re*valNew.re + valNew.im*valNew.im);
                const err = newVal - targetVal;
                const corrX = -err * dx / (grad2 + 1e-10);
                const corrY = -err * dy / (grad2 + 1e-10);
                x += corrX;
                y += corrY;
            }
            return pts;
        }

        function findSeeds(targetVal, type, scanSteps = 60) {
            const seeds = [];
            const d = 2*planeRange / scanSteps;
            for (let i = 0; i <= scanSteps; i++) {
                const x0 = -planeRange + i*d;
                for (let j = 0; j <= scanSteps; j++) {
                    const y0 = -planeRange + j*d;
                    const val = weierstrassP(x0, y0);
                    let curVal;
                    if (type === 'real') curVal = val.re;
                    else if (type === 'imag') curVal = val.im;
                    else curVal = Math.sqrt(val.re*val.re + val.im*val.im);
                    if (Math.abs(curVal - targetVal) < 0.12 &&
                        curVal < Infinity && Math.abs(curVal) < 100) {
                        let tooClose = false;
                        for (const [sx, sy] of seeds) {
                            if (Math.abs(x0 - sx) < 0.3 && Math.abs(y0 - sy) < 0.3) {
                                tooClose = true;
                                break;
                            }
                        }
                        if (!tooClose) seeds.push([x0, y0]);
                    }
                }
            }
            return seeds;
        }

        // 生成一族等值线并转换为3D线条
        function createLevelCurves(targetVals, type, color, opacity) {
            const group = new THREE.Group();
            for (const tv of targetVals) {
                const seeds = findSeeds(tv, type, 45);
                for (const [sx, sy] of seeds) {
                    const raw = traceLevelCurve(sx, sy, weierstrassP, tv, type, 500);
                    if (raw.length < 2) continue;
                    const pts3D = raw.map(([x, y]) => stereographic(x, y));
                    const geom = new THREE.BufferGeometry().setFromPoints(pts3D);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // 生成多组目标值
        function generateTargetVals(type, count, offset = 0.1) {
            const vals = [];
            // 扫描平面上的函数值范围 (基于少量采样)
            const samples = [];
            for (let i = -planeRange; i <= planeRange; i += 0.3) {
                for (let j = -planeRange; j <= planeRange; j += 0.3) {
                    const v = weierstrassP(i, j);
                    if (type === 'real' && Math.abs(v.re) < 1e5) samples.push(v.re);
                    if (type === 'imag' && Math.abs(v.im) < 1e5) samples.push(v.im);
                    if (type === 'mod') {
                        const mod = Math.sqrt(v.re*v.re + v.im*v.im);
                        if (mod < 1e5) samples.push(mod);
                    }
                }
            }
            if (samples.length === 0) return [];
            samples.sort((a,b)=>a-b);
            const min = samples[Math.floor(samples.length*0.05)];
            const max = samples[Math.floor(samples.length*0.95)];
            for (let i = 0; i < count; i++) {
                vals.push(min + (i + offset) * (max - min) / (count + 1));
            }
            return vals;
        }

        // 主结构
        const rootGroup = new THREE.Group();
        rootGroup.name = 'elliptic-lattice';
        scene.add(rootGroup);

        // 金色：等实部线
        const realTargets = generateTargetVals('real', 35, 0.2);
        rootGroup.add(createLevelCurves(realTargets, 'real', COLOR_GOLD, 0.78));

        // 青色：等虚部线
        const imagTargets = generateTargetVals('imag', 35, 0.1);
        rootGroup.add(createLevelCurves(imagTargets, 'imag', COLOR_CYAN, 0.78));

        // 品红：等模长线
        const modTargets = generateTargetVals('mod', 30, 0.5);
        rootGroup.add(createLevelCurves(modTargets, 'mod', COLOR_MAGENTA, 0.72));

        console.log('椭圆函数晶格线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2*Math.random()-1);
            const dist = 6 + Math.random() * 10;
            starsPos[i*3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i*3+1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i*3+2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 动画循环
        function animate() {
            tick();
            const t = elapsed;
            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.28;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.6 + Math.sin(t * 0.15) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Weierstrass椭圆函数晶格动画已稳定运行');
    </script>
</body>
</html>
