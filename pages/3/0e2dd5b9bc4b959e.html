<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>公式呼吸灯 · y = A·sin(ωt)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{
    position:fixed;inset:0;pointer-events:none;z-index:10;
  }

  /* 标题 */
  #title{
    position:absolute;top:0;left:0;
    padding:24px 32px;
    opacity:0;
    animation:fade 1.6s 0.2s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;
    color:rgba(255,190,120,.38);
    font-weight:300;margin-bottom:8px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;
    letter-spacing:.28em;
    background:linear-gradient(96deg,#ffb060 0%,#ffd080 40%,#5ee0ff 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:8px;
    filter:drop-shadow(0 0 26px rgba(255,180,110,.42));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10.5px;letter-spacing:.16em;
    color:rgba(240,210,180,.52);
  }
  #title .sub .hl1{color:#ffc080;}
  #title .sub .hl2{color:#7ad0ff;}

  /* 读数 */
  #readouts{
    position:absolute;top:0;right:0;
    padding:24px 32px;
    text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.10em;line-height:2.0;
    color:rgba(200,190,240,.38);
    opacity:0;
    animation:fade 1.6s 1.0s ease forwards;
  }
  #readouts .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(255,180,130,.28);margin-bottom:6px;
  }
  #readouts .k{color:rgba(220,205,255,.50);}
  #readouts .v{color:rgba(255,215,150,.94);font-weight:600;}
  #readouts .v2{color:rgba(140,225,255,.94);font-weight:600;}

  /* 控件 */
  #controls{
    position:absolute;bottom:0;left:50%;
    transform:translateX(-50%);
    padding:0 24px 26px;
    display:flex;gap:28px;flex-wrap:wrap;justify-content:center;
    pointer-events:auto;
    opacity:0;
    animation:fade 1.6s 1.3s ease forwards;
    max-width:96vw;
  }
  .ctrl{
    display:flex;flex-direction:column;
    gap:9px;min-width:180px;
  }
  .ctrl-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.14em;
  }
  .ctrl-head .lb{color:rgba(220,200,240,.62);}
  .ctrl-head .vl{
    font-size:13px;font-weight:600;
    letter-spacing:.04em;
    color:rgba(255,220,160,.98);
  }
  .ctrl.a .ctrl-head .vl{color:rgba(255,190,120,.98);}
  .ctrl.w .ctrl-head .vl{color:rgba(120,220,255,.98);}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:3px;
    background:rgba(150,140,230,.20);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:rgba(255,240,220,.98);
    border:1px solid rgba(255,180,110,.85);
    box-shadow:0 0 14px rgba(255,170,100,.72);
    cursor:pointer;transition:transform .18s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18);}
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:rgba(255,240,220,.98);
    border:1px solid rgba(255,180,110,.85);
    box-shadow:0 0 14px rgba(255,170,100,.72);
    cursor:pointer;
  }
  .ctrl.w input[type=range]::-webkit-slider-thumb{
    border-color:rgba(120,220,255,.85);
    box-shadow:0 0 14px rgba(110,200,255,.72);
  }
  .ctrl.w input[type=range]::-moz-range-thumb{
    border-color:rgba(120,220,255,.85);
    box-shadow:0 0 14px rgba(110,200,255,.72);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:14px 16px;}
    #title .sub{font-size:9px;}
    #readouts{padding:14px 16px;font-size:8.5px;}
    #readouts .lab{margin-bottom:4px;}
    #controls{gap:16px;padding:0 16px 20px;}
    .ctrl{min-width:130px;gap:6px;}
    .ctrl-head{font-size:8.5px;}
    .ctrl-head .vl{font-size:11px;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">
    <div class="en">FORMULA BREATHING LAMP</div>
    <h1>公式呼吸灯</h1>
    <div class="sub">
      y = <span class="hl1">A</span> · sin(<span class="hl2">ω</span>t)
    </div>
  </div>

  <div id="readouts">
    <span class="lab">LIVE STATE</span>
    <div><span class="k">振幅 A </span><span class="v" id="rA">1.000</span></div>
    <div><span class="k">频率 ω </span><span class="v2" id="rW">1.20</span></div>
    <div><span class="k">周期 T </span><span class="v2" id="rT">5.24 s</span></div>
    <div><span class="k">信号 y </span><span class="v" id="rY">+0.000</span></div>
    <div><span class="k">亮度 </span><span class="v" id="rB">50.0%</span></div>
  </div>

  <div id="controls">
    <div class="ctrl a">
      <div class="ctrl-head">
        <span class="lb">振幅 A</span>
        <span class="vl" id="ampVal">1.00</span>
      </div>
      <input type="range" id="amp" min="0.10" max="1.00" step="0.01" value="1.00">
    </div>
    <div class="ctrl w">
      <div class="ctrl-head">
        <span class="lb">频率 ω</span>
        <span class="vl" id="freqVal">1.20</span>
      </div>
      <input type="range" id="freq" min="0.40" max="4.00" step="0.05" value="1.20">
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, BASE_R = 80;

/* =========================================================
   状态
   ========================================================= */
const state = {
  ampTarget: 1.00,
  ampCurrent: 1.00,
  freqTarget: 1.20,
  freqCurrent: 1.20,
  phase: 0,
  t: 0
};

/* 历史记录：{t, phase} —— 用于绘制过去时间的波形 */
const history = [];
const HISTORY_MAX = 1800;

/* 波形面板矩形 */
const wave = { x: 0, y: 0, w: 0, h: 0 };

/* =========================================================
   布局
   ========================================================= */
function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const isNarrow = W < 720;
  const controlsH = isNarrow ? 110 : 100;
  const waveH = Math.max(120, Math.min(H * 0.22, 190));
  const waveBottom = H - controlsH - 14;
  const waveTop = waveBottom - waveH;

  wave.x = Math.max(16, W * 0.05);
  wave.w = W - wave.x * 2;
  wave.y = waveTop;
  wave.h = waveH;

  /* LED 区域：波形上方 */
  const ledAreaTop = 24;
  const ledAreaBottom = waveTop - 16;
  const ledAreaH = Math.max(120, ledAreaBottom - ledAreaTop);

  CX = W * 0.5;
  CY = ledAreaTop + ledAreaH * 0.52;
  BASE_R = Math.min(W * 0.13, ledAreaH * 0.30, 130);
  BASE_R = Math.max(36, BASE_R);
}
window.addEventListener('resize', layout);

/* =========================================================
   工具
   ========================================================= */
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }

function hsla(h, s, l, a){
  return 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')';
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* 二分查找历史相位 */
function phaseAt(t){
  const n = history.length;
  if (n === 0) return 0;
  if (t >= history[n-1].t) return history[n-1].phase;
  if (t <= history[0].t) return history[0].phase;

  let lo = 0, hi = n - 1;
  while (hi - lo > 1){
    const mid = (lo + hi) >> 1;
    if (history[mid].t < t) lo = mid;
    else hi = mid;
  }
  const a = history[lo], b = history[hi];
  const dt = b.t - a.t;
  if (dt < 1e-6) return a.phase;
  return a.phase + (b.phase - a.phase) * ((t - a.t) / dt);
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(b){
  const bg = ctx.createRadialGradient(
    CX, CY, 0,
    CX, CY, Math.max(W, H) * 0.95
  );
  bg.addColorStop(0.00, '#0a0812');
  bg.addColorStop(0.42, '#05040c');
  bg.addColorStop(1.00, '#010105');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 整体随亮度呼吸的环境光 */
  if (b > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    const glow = ctx.createRadialGradient(
      CX, CY, 0,
      CX, CY, Math.max(W, H) * 0.78
    );
    glow.addColorStop(0.00, hsla(42, 100, 70, b * 0.10));
    glow.addColorStop(0.32, hsla(36, 100, 60, b * 0.045));
    glow.addColorStop(0.68, hsla(30, 100, 50, b * 0.015));
    glow.addColorStop(1.00, hsla(28, 100, 50, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* =========================================================
   绘制：LED 灯珠
   ========================================================= */
function drawLED(b){
  const cx = CX, cy = CY, R = BASE_R;

  /* ---------- 外层大气光晕 ---------- */
  ctx.globalCompositeOperation = 'lighter';

  const haloR = R * 7.5;
  const hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, haloR);
  hg.addColorStop(0.00, hsla(48, 100, 92, b * 0.42));
  hg.addColorStop(0.10, hsla(42, 100, 76, b * 0.32));
  hg.addColorStop(0.24, hsla(36, 100, 62, b * 0.16));
  hg.addColorStop(0.50, hsla(32, 100, 55, b * 0.055));
  hg.addColorStop(0.78, hsla(28, 100, 50, b * 0.016));
  hg.addColorStop(1.00, hsla(28, 100, 50, 0));
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(cx, cy, haloR, 0, TAU);
  ctx.fill();

  /* 中层辉光 */
  const midR = R * 3.2;
  const mg = ctx.createRadialGradient(
    cx - R * 0.15, cy - R * 0.15, 0,
    cx, cy, midR
  );
  mg.addColorStop(0.00, hsla(50, 100, 94, b * 0.55));
  mg.addColorStop(0.32, hsla(44, 100, 78, b * 0.28));
  mg.addColorStop(0.68, hsla(38, 100, 62, b * 0.08));
  mg.addColorStop(1.00, hsla(32, 100, 55, 0));
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.arc(cx, cy, midR, 0, TAU);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';

  /* ---------- 金属外壳 ---------- */
  ctx.beginPath();
  ctx.arc(cx, cy + R * 0.06, R * 1.06, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fill();

  const shellGrad = ctx.createRadialGradient(
    cx - R * 0.35, cy - R * 0.35, 0,
    cx, cy, R * 1.05
  );
  shellGrad.addColorStop(0.00, '#4a4a58');
  shellGrad.addColorStop(0.42, '#2a2a36');
  shellGrad.addColorStop(0.72, '#16161e');
  shellGrad.addColorStop(1.00, '#0a0a10');
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.05, 0, TAU);
  ctx.fillStyle = shellGrad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.05, -Math.PI * 0.85, -Math.PI * 0.25);
  ctx.strokeStyle = 'rgba(200,200,220,0.32)';
  ctx.lineWidth = R * 0.045;
  ctx.lineCap = 'round';
  ctx.stroke();

  /* ---------- 玻璃透镜 ---------- */
  const coreGrad = ctx.createRadialGradient(
    cx - R * 0.25, cy - R * 0.25, 0,
    cx, cy, R * 0.92
  );
  coreGrad.addColorStop(0.00, hsla(50, 100, 10 + b * 85, 1));
  coreGrad.addColorStop(0.35, hsla(44, 100, 6 + b * 72, 1));
  coreGrad.addColorStop(0.72, hsla(36, 95, 4 + b * 52, 1));
  coreGrad.addColorStop(1.00, hsla(30, 80, 3 + b * 32, 1));

  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.92, 0, TAU);
  ctx.fillStyle = coreGrad;
  ctx.fill();

  /* ---------- 内部发光 ---------- */
  if (b > 0.02){
    ctx.globalCompositeOperation = 'lighter';

    const innerR = R * (0.30 + b * 0.55);
    const ig = ctx.createRadialGradient(cx, cy, 0, cx, cy, innerR);
    ig.addColorStop(0.00, hsla(52, 100, 98, Math.min(1, b * 1.20)));
    ig.addColorStop(0.20, hsla(48, 100, 88, b * 0.92));
    ig.addColorStop(0.52, hsla(42, 100, 72, b * 0.52));
    ig.addColorStop(0.82, hsla(36, 100, 60, b * 0.16));
    ig.addColorStop(1.00, hsla(32, 100, 52, 0));
    ctx.fillStyle = ig;
    ctx.beginPath();
    ctx.arc(cx, cy, innerR, 0, TAU);
    ctx.fill();

    /* 白热核心 */
    if (b > 0.65){
      const hotP = (b - 0.65) / 0.35;
      const hotR = R * 0.18 * hotP;
      const hg2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, hotR * 3.5);
      hg2.addColorStop(0.00, 'rgba(255,255,255,' + hotP * 0.95 + ')');
      hg2.addColorStop(0.42, 'rgba(255,250,230,' + hotP * 0.42 + ')');
      hg2.addColorStop(1.00, 'rgba(255,240,200,0)');
      ctx.fillStyle = hg2;
      ctx.beginPath();
      ctx.arc(cx, cy, hotR * 3.5, 0, TAU);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 玻璃反射高光 ---------- */
  const refGrad = ctx.createRadialGradient(
    cx - R * 0.42, cy - R * 0.45, 0,
    cx - R * 0.42, cy - R * 0.45, R * 0.72
  );
  refGrad.addColorStop(0.00, 'rgba(255,255,255,' + (0.42 + b * 0.28) + ')');
  refGrad.addColorStop(0.28, 'rgba(255,255,255,' + (0.14 + b * 0.10) + ')');
  refGrad.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.92, 0, TAU);
  ctx.fillStyle = refGrad;
  ctx.fill();

  /* ---------- 边缘轮廓 ---------- */
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.92, 0, TAU);
  ctx.strokeStyle = hsla(45, 100, 88, 0.25 + b * 0.55);
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* ---------- 底座 ---------- */
  const baseY = cy + R * 1.05;
  const baseW = R * 0.55;
  const baseH = R * 0.22;

  ctx.beginPath();
  roundRect(cx - baseW * 0.5, baseY, baseW, baseH, 4);
  const baseGrad = ctx.createLinearGradient(
    cx - baseW * 0.5, 0, cx + baseW * 0.5, 0
  );
  baseGrad.addColorStop(0.00, '#1e1e26');
  baseGrad.addColorStop(0.42, '#3a3a48');
  baseGrad.addColorStop(0.62, '#2a2a36');
  baseGrad.addColorStop(1.00, '#14141a');
  ctx.fillStyle = baseGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(150,150,180,0.28)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* =========================================================
   绘制：波形图
   ========================================================= */
function drawWaveform(){
  const x0 = wave.x;
  const y0 = wave.y;
  const w = wave.w;
  const h = wave.h;

  if (w < 40 || h < 40) return;

  /* 面板 */
  ctx.fillStyle = 'rgba(6, 10, 22, 0.58)';
  roundRect(x0, y0, w, h, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 140, 220, 0.16)';
  ctx.lineWidth = 1;
  roundRect(x0, y0, w, h, 12);
  ctx.stroke();

  const midY = y0 + h * 0.5;
  const plotH = h * 0.38;

  /* 水平参考线 */
  const levels = [
    { v:  1.0, c: 'rgba(80, 130, 210, 0.10)' },
    { v:  0.5, c: 'rgba(80, 130, 210, 0.06)' },
    { v:  0.0, c: 'rgba(140, 180, 240, 0.24)' },
    { v: -0.5, c: 'rgba(80, 130, 210, 0.06)' },
    { v: -1.0, c: 'rgba(80, 130, 210, 0.10)' }
  ];
  for (let i = 0; i < levels.length; i++){
    const py = midY - levels[i].v * plotH;
    ctx.beginPath();
    ctx.moveTo(x0 + 8, py);
    ctx.lineTo(x0 + w - 8, py);
    ctx.strokeStyle = levels[i].c;
    ctx.stroke();
  }

  /* 轴标签 */
  ctx.font = '400 9px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(150, 190, 240, 0.32)';
  ctx.fillText('+1', x0 + 12, midY - plotH);
  ctx.fillText(' 0', x0 + 12, midY);
  ctx.fillText('−1', x0 + 12, midY + plotH);

  /* 时间窗口：约 2.5 个周期 */
  const T = TAU / Math.max(0.05, state.freqCurrent);
  const timeWindow = Math.max(3, Math.min(18, T * 2.5));

  const px0 = x0 + 6;
  const px1 = x0 + w - 6;
  const pW = px1 - px0;
  const tNow = state.t;
  const tMin = tNow - timeWindow;

  /* 曲线 */
  if (history.length > 0){
    const samples = Math.max(60, Math.floor(pW));
    const A = state.ampCurrent;

    let started = false;
    ctx.beginPath();

    for (let i = 0; i <= samples; i++){
      const u = i / samples;
      const tt = tMin + u * timeWindow;

      if (tt > tNow) break;
      if (tt < history[0].t){ started = false; continue; }

      const ph = phaseAt(tt);
      const y = A * Math.sin(ph);

      const px = px0 + u * pW;
      const py = midY - y * plotH;

      if (!started){
        ctx.moveTo(px, py);
        started = true;
      } else {
        ctx.lineTo(px, py);
      }
    }

    if (started){
      /* 光晕 */
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255, 180, 100, 0.14)';
      ctx.lineWidth = 8;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 200, 120, 0.28)';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';

      /* 主线 */
      const lineGrad = ctx.createLinearGradient(px0, 0, px1, 0);
      lineGrad.addColorStop(0.00, 'rgba(120, 180, 255, 0.42)');
      lineGrad.addColorStop(0.42, 'rgba(255, 200, 130, 0.88)');
      lineGrad.addColorStop(1.00, 'rgba(255, 230, 170, 0.98)');
      ctx.strokeStyle = lineGrad;
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }
  }

  /* 当前点 */
  const currentY = state.ampCurrent * Math.sin(state.phase);
  const curPx = px1;
  const curPy = midY - currentY * plotH;

  /* 从中心到当前点的虚线 */
  ctx.beginPath();
  ctx.setLineDash([3, 4]);
  ctx.moveTo(curPx, midY);
  ctx.lineTo(curPx, curPy);
  ctx.strokeStyle = 'rgba(255, 200, 130, 0.42)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);

  /* 脉冲光点 */
  const pulse = 1 + 0.18 * Math.sin(state.t * 4);
  const dotR = 5 * pulse;

  ctx.globalCompositeOperation = 'lighter';
  const dg = ctx.createRadialGradient(
    curPx, curPy, 0, curPx, curPy, dotR * 5
  );
  dg.addColorStop(0.00, hsla(48, 100, 96, 0.95));
  dg.addColorStop(0.32, hsla(42, 100, 76, 0.42));
  dg.addColorStop(1.00, hsla(36, 100, 62, 0));
  ctx.fillStyle = dg;
  ctx.beginPath();
  ctx.arc(curPx, curPy, dotR * 5, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.beginPath();
  ctx.arc(curPx, curPy, dotR, 0, TAU);
  ctx.fillStyle = 'rgba(255, 245, 220, 0.98)';
  ctx.fill();

  /* 面板标题 */
  ctx.font = '400 9.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(160, 190, 240, 0.42)';
  ctx.fillText('y = A · sin(ωt)  波形', x0 + 14, y0 + 10);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255, 215, 150, 0.72)';
  ctx.fillText('y = ' + currentY.toFixed(3), x0 + w - 14, y0 + 10);
}

/* =========================================================
   更新
   ========================================================= */
function update(dt){
  /* 平滑跟随滑块目标 */
  const k = Math.min(1, dt * 7);
  state.ampCurrent += (state.ampTarget - state.ampCurrent) * k;
  state.freqCurrent += (state.freqTarget - state.freqCurrent) * k;

  /* 累积相位（频率变化时保持相位连续） */
  state.phase += state.freqCurrent * dt;
  state.t += dt;

  /* 防止相位溢出 */
  if (state.phase > TAU * 1000){
    state.phase -= TAU * 1000;
    for (let i = 0; i < history.length; i++){
      history[i].phase -= TAU * 1000;
    }
  }

  /* 记录历史 */
  history.push({ t: state.t, phase: state.phase });
  if (history.length > HISTORY_MAX) history.shift();
}

/* =========================================================
   HUD
   ========================================================= */
let uiTick = 0;
function updateHUD(){
  uiTick++;
  if (uiTick % 4 !== 0) return;

  const A = state.ampCurrent;
  const w = state.freqCurrent;
  const T = TAU / Math.max(0.05, w);
  const y = A * Math.sin(state.phase);
  const b = clamp01((1 + y) / 2);

  const rA = document.getElementById('rA');
  const rW = document.getElementById('rW');
  const rT = document.getElementById('rT');
  const rY = document.getElementById('rY');
  const rB = document.getElementById('rB');

  if (rA) rA.textContent = A.toFixed(3);
  if (rW) rW.textContent = w.toFixed(2);
  if (rT) rT.textContent = T.toFixed(2) + ' s';
  if (rY) rY.textContent = (y >= 0 ? '+' : '') + y.toFixed(3);
  if (rB) rB.textContent = (b * 100).toFixed(1) + '%';
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);

  /* 当前亮度（正弦映射到 [0,1]） */
  const y = state.ampCurrent * Math.sin(state.phase);
  const brightness = clamp01((1 + y) / 2);

  drawBackground(brightness);
  drawLED(brightness);
  drawWaveform();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.38,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.22)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.88)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
const ampSlider = document.getElementById('amp');
const freqSlider = document.getElementById('freq');
const ampVal = document.getElementById('ampVal');
const freqVal = document.getElementById('freqVal');

ampSlider.addEventListener('input', function(e){
  const v = parseFloat(e.target.value);
  state.ampTarget = v;
  if (ampVal) ampVal.textContent = v.toFixed(2);
});

freqSlider.addEventListener('input', function(e){
  const v = parseFloat(e.target.value);
  state.freqTarget = v;
  if (freqVal) freqVal.textContent = v.toFixed(2);
});

/* 空格键重置 */
window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    state.ampTarget = 1.0;
    state.freqTarget = 1.2;
    ampSlider.value = '1.00';
    freqSlider.value = '1.20';
    if (ampVal) ampVal.textContent = '1.00';
    if (freqVal) freqVal.textContent = '1.20';
  }
});

/* =========================================================
   启动
   ========================================================= */
layout();
requestAnimationFrame(loop);

})();
</script>
