<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每次都不一样 · Chaos Nebula</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;}

  #ui{
    position:fixed;inset:0;pointer-events:none;z-index:5;
  }

  /* ---------- 左上标题 ---------- */
  #title{
    position:absolute;top:0;left:0;
    padding:42px 48px;
    opacity:0;
    animation:fade 1.8s 0.4s ease forwards;
  }
  #title h1{
    font-size:clamp(22px,3.4vw,46px);
    font-weight:200;
    letter-spacing:.36em;text-indent:.36em;
    background:linear-gradient(96deg,#8090ff 0%,#c09eff 38%,#ffcc77 72%,#ffeecc 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:16px;
    filter:drop-shadow(0 0 32px rgba(140,120,240,.42));
  }
  #title .en{
    font-size:10px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(160,180,230,.38);font-weight:300;
    margin-bottom:18px;
  }
  #title .sub{
    font-size:11px;letter-spacing:.22em;
    color:rgba(180,170,230,.30);
    line-height:2.0;font-weight:300;
  }

  /* ---------- 左下：参数 ---------- */
  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 48px 42px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(140,160,220,.26);
    opacity:0;
    animation:fade 1.8s 1.2s ease forwards;
  }
  #stats .k{color:rgba(200,170,255,.52);}
  #stats .v{color:rgba(255,210,140,.60);}
  #stats .lab{
    display:block;font-size:8.5px;
    letter-spacing:.42em;text-indent:.42em;
    color:rgba(120,140,200,.22);
    margin-bottom:8px;
  }

  /* ---------- 右下：按钮 ---------- */
  #btnWrap{
    position:absolute;bottom:0;right:0;
    padding:0 48px 42px;
    opacity:0;
    animation:fade 1.8s 1.6s ease forwards;
    pointer-events:auto;
  }
  #regen{
    font-family:inherit;
    font-size:11px;letter-spacing:.34em;text-indent:.34em;
    color:rgba(230,220,255,.85);
    background:rgba(20,14,50,.28);
    cursor:pointer;
    border:1px solid rgba(160,140,255,.34);
    border-radius:999px;
    padding:15px 34px;
    transition:.42s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #regen:hover{
    border-color:rgba(230,200,255,.92);
    box-shadow:0 0 36px rgba(160,140,255,.48);
    background:rgba(100,80,200,.16);
    transform:translateY(-1px);
  }
  #regen:active{transform:translateY(0);}

  /* ---------- 右上角小标 ---------- */
  #sig{
    position:absolute;top:0;right:0;
    padding:42px 48px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.32em;
    color:rgba(120,140,200,.20);
    opacity:0;
    animation:fade 1.8s 1.4s ease forwards;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:22px 22px;}
    #title .sub{font-size:9.5px;}
    #stats{padding:0 22px 22px;font-size:8.5px;}
    #btnWrap{padding:0 22px 22px;}
    #regen{padding:12px 22px;font-size:9.5px;}
    #sig{padding:22px 22px;font-size:8px;letter-spacing:.22em;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <h1>每次都不一样</h1>
    <div class="en">EVERY RUN IS DIFFERENT</div>
    <div class="sub">
      混沌方程迭代 · 星云生成<br>
      这一幅画面，只属于此刻
    </div>
  </div>

  <div id="sig">
    CHAOS · NEBULA<br>
    DE JONG ATTRACTOR
  </div>

  <div id="stats">
    <span class="lab">ATTRACTOR PARAMS</span>
    <div><span class="k">a </span><span class="v" id="pa">–</span></div>
    <div><span class="k">b </span><span class="v" id="pb">–</span></div>
    <div><span class="k">c </span><span class="v" id="pc">–</span></div>
    <div><span class="k">d </span><span class="v" id="pd">–</span></div>
    <div style="margin-top:6px;"><span class="k">seed </span><span class="v" id="seed">–</span></div>
  </div>

  <div id="btnWrap">
    <button id="regen">再 来 一 张</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 基础
   ========================================================= */
const TAU    = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha:false });

/* 离屏缓冲 —— 累积点云 */
const buf  = document.createElement('canvas');
const bctx = buf.getContext('2d', { alpha:false });

/* 发光层 */
const blur  = document.createElement('canvas');
const blctx = blur.getContext('2d');

let W = 0, H = 0;

/* 移动端降级 */
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                 window.innerWidth < 720;
const POINT_SCALE = isMobile ? 0.45 : 1.0;

/* =========================================================
   1. 调色板 —— 深紫 → 蓝 → 青 → 品红 → 金
   ========================================================= */
const PALETTE = [
  [0.00, [ 10,   6,  28]],
  [0.10, [ 26,  14,  66]],
  [0.22, [ 58,  34, 138]],
  [0.35, [ 84,  66, 202]],
  [0.48, [ 68, 138, 228]],
  [0.60, [132, 184, 244]],
  [0.72, [216, 162, 234]],
  [0.84, [255, 202, 132]],
  [0.94, [255, 232, 182]],
  [1.00, [255, 250, 232]]
];

function palette(t){
  t = t - Math.floor(t);
  for (let i = 0; i < PALETTE.length - 1; i++){
    const p0 = PALETTE[i][0], c0 = PALETTE[i][1];
    const p1 = PALETTE[i+1][0], c1 = PALETTE[i+1][1];
    if (t <= p1){
      let k = (t - p0) / (p1 - p0);
      k = k * k * (3 - 2 * k);
      return [
        c0[0] + (c1[0] - c0[0]) * k,
        c0[1] + (c1[1] - c0[1]) * k,
        c0[2] + (c1[2] - c0[2]) * k
      ];
    }
  }
  return PALETTE[PALETTE.length-1][1];
}

/* =========================================================
   2. 随机工具
   ========================================================= */
const rand = (a, b) => a + Math.random() * (b - a);

/* =========================================================
   3. 挑选一组"好看"的吸引子参数
   De Jong 吸引子:
     x' = sin(a·y) − cos(b·x)
     y' = sin(c·x) − cos(d·y)
   ========================================================= */
function pickParams(){
  for (let attempt = 0; attempt < 120; attempt++){
    const a = rand(-2.4, 2.4);
    const b = rand(-2.4, 2.4);
    const c = rand(-2.4, 2.4);
    const d = rand(-2.4, 2.4);

    let x = 0.13, y = 0.07, ok = true;

    /* 预热 */
    for (let i = 0; i < 120; i++){
      const nx = Math.sin(a * y) - Math.cos(b * x);
      const ny = Math.sin(c * x) - Math.cos(d * y);
      x = nx; y = ny;
      if (!isFinite(x) || !isFinite(y)){ ok = false; break; }
    }
    if (!ok) continue;

    /* 采样边界 */
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (let i = 0; i < 1600; i++){
      const nx = Math.sin(a * y) - Math.cos(b * x);
      const ny = Math.sin(c * x) - Math.cos(d * y);
      x = nx; y = ny;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }

    const bw = maxX - minX;
    const bh = maxY - minY;

    if (bw < 1.2 || bh < 1.2) continue;
    if (bw > 8.0 || bh > 8.0) continue;
    const ar = bw / bh;
    if (ar < 0.30 || ar > 3.30) continue;

    return { a, b, c, d };
  }
  /* 兜底：经典参数 */
  return { a: 1.4, b: -1.6, c: 1.4, d: 0.7 };
}

/* =========================================================
   4. 精确测量边界（用于铺满画布）
   ========================================================= */
function computeBounds(p){
  let x = 0.13, y = 0.07;

  for (let i = 0; i < 240; i++){
    const nx = Math.sin(p.a * y) - Math.cos(p.b * x);
    const ny = Math.sin(p.c * x) - Math.cos(p.d * y);
    x = nx; y = ny;
  }

  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (let i = 0; i < 4000; i++){
    const nx = Math.sin(p.a * y) - Math.cos(p.b * x);
    const ny = Math.sin(p.c * x) - Math.cos(p.d * y);
    x = nx; y = ny;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  return { minX, maxX, minY, maxY };
}

/* =========================================================
   5. 尺寸
   ========================================================= */
let bufImg = null, bufU32 = null;

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = W;
  canvas.height = H;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  buf.width  = W;
  buf.height = H;

  blur.width  = Math.max(1, Math.floor(W / 8));
  blur.height = Math.max(1, Math.floor(H / 8));

  bufImg = bctx.createImageData(W, H);
  bufU32 = new Uint32Array(bufImg.data.buffer);
}

/* =========================================================
   6. 运行时状态
   ========================================================= */
let params       = { a: 1.4, b: -1.6, c: 1.4, d: 0.7 };
let iterState    = { x: 0.13, y: 0.07 };
let projection   = { ox: 0, oy: 0, sc: 1 };

/* =========================================================
   7. 初始化一轮生成
   ========================================================= */
function initRun(){
  params = pickParams();

  const bnd = computeBounds(params);
  const bw  = Math.max(0.6, bnd.maxX - bnd.minX);
  const bh  = Math.max(0.6, bnd.maxY - bnd.minY);

  const pad  = 0.05;
  const availW = W * (1 - pad * 2);
  const availH = H * (1 - pad * 2);
  const sc   = Math.min(availW / bw, availH / bh);

  projection.sc = sc;
  projection.ox = (W - bw * sc) * 0.5 - bnd.minX * sc;
  projection.oy = (H - bh * sc) * 0.5 - bnd.minY * sc;

  /* 从吸引子附近随机起始 */
  iterState.x = rand(-0.4, 0.4);
  iterState.y = rand(-0.4, 0.4);

  /* 预热迭代器，落入吸引子 */
  for (let i = 0; i < 60; i++){
    const nx = Math.sin(params.a * iterState.y) - Math.cos(params.b * iterState.x);
    const ny = Math.sin(params.c * iterState.x) - Math.cos(params.d * iterState.y);
    iterState.x = nx; iterState.y = ny;
  }

  /* 清空点云缓冲为不透明黑 */
  bufU32.fill(0xff000000);

  /* 更新 HUD */
  document.getElementById('pa').textContent = params.a.toFixed(4);
  document.getElementById('pb').textContent = params.b.toFixed(4);
  document.getElementById('pc').textContent = params.c.toFixed(4);
  document.getElementById('pd').textContent = params.d.toFixed(4);
  document.getElementById('seed').textContent =
    Math.floor(Math.random() * 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0');
}

/* =========================================================
   8. 累积点云
   ========================================================= */
function accumulate(count){
  const u32 = bufU32;
  const p   = params;
  const ox  = projection.ox;
  const oy  = projection.oy;
  const sc  = projection.sc;

  let x = iterState.x;
  let y = iterState.y;

  for (let i = 0; i < count; i++){
    const nx = Math.sin(p.a * y) - Math.cos(p.b * x);
    const ny = Math.sin(p.c * x) - Math.cos(p.d * y);
    x = nx; y = ny;

    if (!isFinite(x) || !isFinite(y)){
      x = rand(-0.4, 0.4);
      y = rand(-0.4, 0.4);
      continue;
    }

    const px = (ox + x * sc) | 0;
    const py = (oy + y * sc) | 0;

    if (px < 0 || px >= W || py < 0 || py >= H) continue;

    /* ---- 颜色：由位置映射到调色板 ---- */
    const r   = Math.sqrt(x * x + y * y);
    const ang = Math.atan2(y, x);
    let t = (ang / TAU + 0.5) * 0.55 + Math.sqrt(r) * 0.16;
    t = t - Math.floor(t);

    const col = palette(t);

    const addR = col[0] * 0.070;
    const addG = col[1] * 0.070;
    const addB = col[2] * 0.070;

    /* ---- 加法混合 ---- */
    const idx = py * W + px;
    const c   = u32[idx];
    const cr  =  c        & 0xff;
    const cg  = (c >> 8)  & 0xff;
    const cb  = (c >> 16) & 0xff;

    let nr = cr + addR;
    let ng = cg + addG;
    let nb = cb + addB;

    if (nr > 255) nr = 255;
    if (ng > 255) ng = 255;
    if (nb > 255) nb = 255;

    u32[idx] = 0xff000000 |
               ((nb | 0) << 16) |
               ((ng | 0) << 8)  |
               (nr | 0);
  }

  iterState.x = x;
  iterState.y = y;
}

/* =========================================================
   9. 渲染（点云 + 光晕）
   ========================================================= */
function render(){
  bctx.putImageData(bufImg, 0, 0);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(buf, 0, 0);

  /* 缩小 → 放大 = 廉价高斯模糊，产生星云辉光 */
  blctx.clearRect(0, 0, blur.width, blur.height);
  blctx.drawImage(buf, 0, 0, blur.width, blur.height);

  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.65;
  ctx.drawImage(blur, 0, 0, W, H);
  ctx.globalAlpha = 1;
}

/* =========================================================
   10. 每帧点数（基于时间，随时间衰减）
   ========================================================= */
function pointsPerSecond(elapsed){
  if (elapsed < 0.40) return 0;
  if (elapsed < 2.20) return 620000;
  if (elapsed < 4.20) return 380000;
  if (elapsed < 6.20) return 200000;
  if (elapsed < 8.00) return 100000;
  return 0;
}

/* =========================================================
   11. 主循环 —— 用世代计数器保证同一时刻只有一个循环
   ========================================================= */
let running  = false;
let tickGen  = 0;      // ★ 每次 start() 递增，旧循环立即退出
let startTS  = 0;
let lastTS   = 0;

function tick(now, myGen){
  /* 如果已经被新的世代取代，或已停止，直接退出 */
  if (myGen !== tickGen || !running) return;

  if (!startTS){ startTS = now; lastTS = now; }

  const elapsed = (now - startTS) / 1000;
  let dt = (now - lastTS) / 1000;
  lastTS = now;

  if (dt > 0.05) dt = 0.05;
  if (dt < 0)    dt = 0;

  const rate = pointsPerSecond(elapsed) * POINT_SCALE;
  if (rate > 0 && dt > 0){
    let n = (rate * dt) | 0;
    if (n > 90000) n = 90000;
    if (n > 0) accumulate(n);
  }

  render();

  /* 继续下一帧，携带同一个世代号 */
  requestAnimationFrame(t => tick(t, myGen));
}

/* =========================================================
   12. 启动 / 重新生成
   ========================================================= */
function start(){
  /* 停止所有旧的循环 */
  running = false;
  tickGen++;
  const myGen = tickGen;

  /* 重建尺寸与状态 */
  resize();
  initRun();

  /* 清屏 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  startTS = 0;
  lastTS  = 0;
  running = true;

  requestAnimationFrame(t => tick(t, myGen));
}

/* ---------- 重新生成按钮 ---------- */
let regenTimer = null;

document.getElementById('regen').addEventListener('click', () => {
  /* 先取消上一次待执行的重新生成，避免多次点击叠加 */
  if (regenTimer){ clearTimeout(regenTimer); regenTimer = null; }

  /* 立刻停止当前循环 */
  running = false;
  tickGen++;

  /* 闪黑过渡 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  regenTimer = setTimeout(() => {
    regenTimer = null;
    start();
  }, 110);
});

/* ---------- 窗口尺寸变化 ---------- */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (regenTimer){ clearTimeout(regenTimer); regenTimer = null; }
    start();
  }, 320);
});

/* ---------- 启动 ---------- */
start();

})();
</script>
</body>
</html>
