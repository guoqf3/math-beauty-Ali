<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>脉动弦生物 · Chord-Pulse Organism</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#04060c;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  /* ---------- 左上标题 ---------- */
  #title{
    position:absolute;top:0;left:0;
    padding:40px 46px;
    opacity:0;animation:fade 1.8s .4s ease forwards;
  }
  #title h1{
    font-size:clamp(18px,2.4vw,30px);
    font-weight:200;
    letter-spacing:.42em;text-indent:.42em;
    background:linear-gradient(96deg,#5ee8ff 0%,#9b8cff 45%,#ff8cd0 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 26px rgba(100,200,255,.42));
  }
  #title .en{
    font-size:9.5px;letter-spacing:.50em;text-indent:.50em;
    color:rgba(140,220,255,.34);
  }

  /* ---------- 左下：数学结构 ---------- */
  #formula{
    position:absolute;bottom:0;left:0;
    padding:0 46px 34px;
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:clamp(9px,1.05vw,12px);
    line-height:2.0;
    letter-spacing:.02em;
    color:rgba(140,200,255,.30);
    max-width:min(780px, 88vw);
  }
  #formula .lab{
    display:block;font-size:8.5px;
    letter-spacing:.44em;text-indent:.44em;
    color:rgba(120,180,220,.22);
    margin-bottom:10px;
  }
  #formula .kw{color:rgba(140,255,240,.58);}
  #formula .fn{color:rgba(180,180,255,.56);}
  #formula .nm{color:rgba(255,180,220,.62);}
  #formula .op{color:rgba(150,190,225,.30);}

  /* ---------- 右下角 ---------- */
  #hint{
    position:absolute;bottom:0;right:0;
    padding:0 46px 34px;
    text-align:right;
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  #hint .big{
    font-size:clamp(9.5px,1.0vw,12px);
    letter-spacing:.34em;text-indent:.34em;
    color:rgba(255,180,220,.42);
    margin-bottom:10px;font-weight:300;
  }
  #hint .small{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(140,200,255,.22);
    line-height:1.9;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:20px 20px;}
    #formula{padding:0 20px 18px;font-size:8px;}
    #hint{padding:0 20px 18px;}
    #hint .small{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <h1>脉动弦生物</h1>
    <div class="en">CHORD-PULSE ORGANISM</div>
  </div>

  <div id="formula">
    <span class="lab">CHORD NETWORK · 4-WAVE MODULATION</span>
    <span class="kw">r</span>(<span class="fn">θ</span>,<span class="nm">t</span>) <span class="op">=</span> R <span class="op">·</span> ( <span class="nm">1</span>
    <span class="op">+</span> <span class="nm">.16</span><span class="op">·</span>sin(<span class="nm">3</span>θ<span class="op">+</span><span class="nm">1.1</span>t)
    <span class="op">+</span> <span class="nm">.10</span><span class="op">·</span>sin(<span class="nm">5</span>θ<span class="op">−</span><span class="nm">1.6</span>t)
    <span class="op">+</span> <span class="nm">.065</span><span class="op">·</span>sin(<span class="nm">8</span>θ<span class="op">+</span><span class="nm">.9</span>t)
    <span class="op">+</span> <span class="nm">.038</span><span class="op">·</span>sin(<span class="nm">13</span>θ<span class="op">−</span><span class="nm">2.3</span>t) )
    <br>
    <span class="kw">chord</span>: i <span class="op">→</span> (i<span class="op">+</span><span class="nm">13</span>) mod <span class="nm">96</span>
    <span class="op">·</span> i <span class="op">→</span> (i<span class="op">+</span><span class="nm">21</span>) mod <span class="nm">96</span>
    <span class="op">·</span> i <span class="op">→</span> (i<span class="op">+</span><span class="nm">34</span>) mod <span class="nm">96</span>
  </div>

  <div id="hint">
    <div class="big">弦网脉动</div>
    <div class="small">
      96 POINTS · 3 CHORD STEPS<br>
      DYNAMIC NETWORK OF CHORDS
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const TAU    = Math.PI * 2;

let W, H, DPR, CX, CY, R;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W * 0.5;
  CY = H * 0.5;
  R  = Math.min(W, H) * 0.30;
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   参数
   ========================================================= */
const N        = 96;
const STEPS    = [13, 21, 34];
const HUE_IN   = 180;   // 青色
const HUE_OUT  = 340;   // 洋红

/* =========================================================
   脉动半径 —— 四重频率叠加
   ========================================================= */
function radiusAt(theta, t){
  return 1
    + 0.16  * Math.sin( 3 * theta + t * 1.1)
    + 0.10  * Math.sin( 5 * theta - t * 1.6)
    + 0.065 * Math.sin( 8 * theta + t * 0.9)
    + 0.038 * Math.sin(13 * theta - t * 2.3);
}

/* =========================================================
   复用缓冲
   ========================================================= */
const px = new Float32Array(N);
const py = new Float32Array(N);
const pt = new Float32Array(N);

/* =========================================================
   主循环
   ========================================================= */
let T0 = performance.now();

function frame(now){
  requestAnimationFrame(frame);

  const t = (now - T0) / 1000;

  /* ---------- 清屏 ---------- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#04060c';
  ctx.fillRect(0, 0, W, H);

  /* ---------- 整体呼吸 ---------- */
  const breath = 1 + 0.04 * Math.sin(t * 0.8);

  /* ---------- 计算 96 个点 ---------- */
  for (let i = 0; i < N; i++){
    const theta = i / N * TAU;
    const r = radiusAt(theta, t) * R * breath;

    pt[i] = theta;
    px[i] = CX + r * Math.cos(theta);
    py[i] = CY + r * Math.sin(theta);
  }

  /* ---------- 加法混合 ---------- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  /* ---------- 体光 ---------- */
  const halo = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 2.1);
  halo.addColorStop(0.00, 'rgba(60, 100, 180, 0.20)');
  halo.addColorStop(0.42, 'rgba(50,  60, 140, 0.075)');
  halo.addColorStop(1.00, 'rgba(20,  15,  50, 0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);

  /* =======================================================
     弦网 —— 三组步长，各生成一类弦曲线
     ======================================================= */
  for (let s = 0; s < STEPS.length; s++){
    const step      = STEPS[s];
    const layerFade = 1.0 - s * 0.18;
    const layerWid  = 1.1 - s * 0.22;

    for (let i = 0; i < N; i++){
      const j = (i + step) % N;
      const u = i / N;

      /* 色相：沿环渐变 + 时间漂移 */
      const hue = (HUE_IN + u * (HUE_OUT - HUE_IN) + t * 22) % 360;

      /* 透明度：由该点的角度与时间调制 */
      const baseA = 0.10 + 0.05 * Math.sin(pt[i] * 3 + t * 2 + s * 1.2);
      const alpha = baseA * layerFade;

      ctx.beginPath();
      ctx.moveTo(px[i], py[i]);
      ctx.lineTo(px[j], py[j]);
      ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',88%,68%,' +
                        alpha.toFixed(3) + ')';
      ctx.lineWidth = layerWid;
      ctx.stroke();
    }
  }

  /* =======================================================
     外膜 —— 穿过所有点的闭合曲线
     ======================================================= */
  ctx.beginPath();
  for (let i = 0; i <= N; i++){
    const k = i % N;
    if (i === 0) ctx.moveTo(px[k], py[k]);
    else         ctx.lineTo(px[k], py[k]);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(120, 220, 255, 0.32)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 内膜 —— 缩进 8% */
  ctx.beginPath();
  for (let i = 0; i <= N; i++){
    const k = i % N;
    const x = CX + (px[k] - CX) * 0.92;
    const y = CY + (py[k] - CY) * 0.92;
    if (i === 0) ctx.moveTo(x, y);
    else         ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(200, 150, 255, 0.20)';
  ctx.lineWidth = 1.0;
  ctx.stroke();

  /* =======================================================
     细胞核
     ======================================================= */
  const coreR = R * 0.075 * (1 + 0.35 * Math.sin(t * 2.2));

  const coreGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR * 6);
  coreGrad.addColorStop(0.00, 'rgba(255, 255, 255, 0.95)');
  coreGrad.addColorStop(0.14, 'rgba(200, 240, 255, 0.62)');
  coreGrad.addColorStop(0.40, 'rgba(140, 130, 255, 0.28)');
  coreGrad.addColorStop(0.74, 'rgba(100,  80, 200, 0.09)');
  coreGrad.addColorStop(1.00, 'rgba( 60,  40, 120, 0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(CX, CY, coreR * 6, 0, TAU);
  ctx.fill();

  /* =======================================================
     漂浮粒子 —— 黄金角分布，缓慢公转
     ======================================================= */
  const GOLDEN = 2.399963229728653;
  const NUM_PARTICLES = 48;

  for (let i = 0; i < NUM_PARTICLES; i++){
    const seed  = i * GOLDEN;
    const drift = t * (0.06 + 0.025 * (i % 7)) + seed;
    const radB  = 1.15 + 0.30 * ((i * 7) % 11) / 11;
    const rad   = R * radB * (1 + 0.05 * Math.sin(t + i));
    const ang   = drift % TAU;

    const x = CX + rad * Math.cos(ang);
    const y = CY + rad * Math.sin(ang);

    const size = 0.7 + 1.4 * Math.abs(Math.sin(t * 1.5 + i * 0.9));
    const hue  = (HUE_IN + (i * 32) + t * 28) % 360;

    ctx.fillStyle = 'hsla(' + hue.toFixed(1) + ',90%,72%,0.42)';
    ctx.beginPath();
    ctx.arc(x, y, size, 0, TAU);
    ctx.fill();
  }

  /* ---------- 暗角 ---------- */
  ctx.globalCompositeOperation = 'source-over';
  const vig = ctx.createRadialGradient(
    CX, CY, Math.min(W, H) * 0.28,
    CX, CY, Math.max(W, H) * 0.78
  );
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

requestAnimationFrame(frame);

})();
</script>
</body>
</html>
