<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>李萨如图形 · 游动的金鱼</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#020a10;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;cursor:crosshair;
  }
  canvas{display:block;position:fixed;inset:0;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:42px 48px;opacity:0;
    animation:fade 1.8s 0.3s ease forwards;
  }
  #title .en{
    font-size:10px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,220,230,.36);font-weight:300;margin-bottom:14px;
  }
  #title h1{
    font-size:clamp(22px,3.2vw,42px);
    font-weight:200;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(96deg,#ffb060 0%,#ff8848 38%,#ffd080 68%,#7ee8e0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 30px rgba(255,150,80,.45));
  }
  #title .sub{
    font-size:11px;letter-spacing:.22em;line-height:2.0;
    color:rgba(180,230,240,.32);font-weight:300;
  }

  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 48px 42px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(160,215,230,.28);
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
  }
  #stats .k{color:rgba(190,200,255,.52);}
  #stats .v{color:rgba(255,215,150,.72);}
  #stats .lab{
    display:block;font-size:8.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(140,200,220,.24);margin-bottom:8px;
  }

  #meter{
    position:absolute;bottom:0;right:0;
    padding:0 48px 42px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(160,215,230,.28);
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  #meter .k{color:rgba(190,200,255,.52);}
  #meter .v{color:rgba(255,215,150,.72);}
  #meter .big{
    display:block;font-size:clamp(20px,2.4vw,30px);
    font-weight:200;letter-spacing:.22em;
    color:rgba(255,200,150,.85);
    margin-bottom:2px;transition:color .5s ease;
  }

  #audioDot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:rgba(200,180,255,.25);
    margin-left:6px;vertical-align:middle;
    transition:background .4s;
  }
  #audioDot.on{
    background:rgba(150,240,180,.9);
    box-shadow:0 0 8px rgba(150,240,180,.8);
  }

  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:46px;white-space:nowrap;
    font-size:10px;letter-spacing:.28em;
    color:rgba(170,225,235,.42);
    opacity:0;animation:fade 1.8s 1.8s ease forwards;
  }
  #hint .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:rgba(255,200,130,.85);vertical-align:middle;
    margin:0 8px;position:relative;top:-1px;
    animation:pulse 2.0s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.35;transform:scale(1);}
    50%{opacity:1;transform:scale(1.5);}
  }
  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:22px 22px;}
    #title .sub{font-size:9.5px;}
    #stats{padding:0 22px 22px;font-size:8.5px;}
    #meter{padding:0 22px 22px;font-size:8.5px;}
    #hint{padding-bottom:26px;font-size:8.5px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">LISSAJOUS CURVE · SWIMMING GOLDFISH</div>
    <h1>游动的金鱼</h1>
    <div class="sub">
      李萨如曲线 · 多频率叠加摆尾<br>
      鼠标移动 · 决定金鱼游向
    </div>
  </div>

  <div id="stats">
    <span class="lab">LISSAJOUS MOTION</span>
    <div><span class="k">x(t) = A₁ sin(a t + δ₁)</span></div>
    <div><span class="k">y(t) = A₂ sin(b t + δ₂)</span></div>
    <div><span class="k">摆尾</span> <span class="v">3 频率叠加</span></div>
    <div><span class="k">音频</span> <span class="v">气泡 + 水流</span><span id="audioDot"></span></div>
  </div>

  <div id="meter">
    <span class="big" id="stateBig">巡 游</span>
    <div style="margin-top:8px;"><span class="k">游速 </span><span class="v" id="speedVal">0.00</span></div>
    <div><span class="k">摆尾频率 </span><span class="v" id="tailVal">2.0 Hz</span></div>
  </div>

  <div id="hint">
    <span class="dot"></span>移动鼠标 · 金鱼追随而去<span class="dot"></span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   画布
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1, S = 0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);
}
window.addEventListener('resize', resize);

/* =========================================================
   鱼体轮廓查找表
   ========================================================= */
const BODY_PROFILE = [
  [0.00, 0.28], [0.08, 0.50], [0.16, 0.66], [0.24, 0.78],
  [0.32, 0.85], [0.42, 0.87], [0.52, 0.83], [0.62, 0.73],
  [0.72, 0.58], [0.82, 0.40], [0.90, 0.24], [1.00, 0.07]
];

function bodyProfile(s){
  if (s <= 0) return BODY_PROFILE[0][1];
  if (s >= 1) return BODY_PROFILE[BODY_PROFILE.length-1][1];
  for (let i = 0; i < BODY_PROFILE.length - 1; i++){
    const a = BODY_PROFILE[i], b = BODY_PROFILE[i + 1];
    if (s <= b[0]){
      const t = (s - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * t;
    }
  }
  return 0.07;
}

/* =========================================================
   金鱼状态
   ========================================================= */
const fish = {
  x: 0, y: 0,
  angle: 0,
  targetAngle: 0,
  speed: 0,
  targetSpeed: 0,
  bendPhase: 0,
  tailPhase: 0,
  finPhase: 0,
  bodyLen: 0,
  trail: [],
  eyeBlink: 0,
  eyeBlinkTimer: 3
};

function initFish(){
  fish.x = W * 0.5;
  fish.y = H * 0.5;
  fish.angle = 0;
  fish.targetAngle = 0;
  fish.speed = 0;
  fish.bodyLen = S * 0.135;
  fish.trail.length = 0;
}
initFish();

/* 鼠标 */
let mouseX = W * 0.5;
let mouseY = H * 0.5;
let mouseMoved = false;
let lastMouseX = mouseX, lastMouseY = mouseY;
let mouseVX = 0, mouseVY = 0;

window.addEventListener('mousemove', function(e){
  mouseX = e.clientX;
  mouseY = e.clientY;
  mouseMoved = true;
});

window.addEventListener('touchmove', function(e){
  if (e.touches.length){
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    mouseMoved = true;
  }
}, { passive: true });

/* =========================================================
   音频
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let waterGain = null;
let waterFilter = null;
let audioReady = false;

function setAudioDot(on){
  const dot = document.getElementById('audioDot');
  if (dot) dot.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().then(() => setAudioDot(true)).catch(() => {});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { audioCtx = new AC(); } catch(e){ return; }
  audioReady = true;

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.58;
  masterGain.connect(audioCtx.destination);

  const start = () => {
    setAudioDot(true);
    startWater();
    scheduleBubble();
  };

  if (audioCtx.state === 'suspended'){
    audioCtx.resume().then(start).catch(() => { audioReady = false; });
  } else {
    start();
  }
}

/* ---------- 水流声：棕噪声 + 低通 ---------- */
function startWater(){
  const len = audioCtx.sampleRate * 3;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);

  let last = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.022 * w) / 1.022;
    d[i] = last * 3.4;
  }

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  waterFilter = audioCtx.createBiquadFilter();
  waterFilter.type = 'lowpass';
  waterFilter.frequency.value = 380;
  waterFilter.Q.value = 0.6;

  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 60;

  waterGain = audioCtx.createGain();
  waterGain.gain.value = 0.052;

  src.connect(waterFilter);
  waterFilter.connect(hp);
  hp.connect(waterGain);
  waterGain.connect(masterGain);
  src.start();

  /* 缓慢起伏 */
  const lfo1 = audioCtx.createOscillator();
  lfo1.frequency.value = 0.11;
  const lfo1g = audioCtx.createGain();
  lfo1g.gain.value = 0.022;
  lfo1.connect(lfo1g);
  lfo1g.connect(waterGain.gain);
  lfo1.start();

  const lfo2 = audioCtx.createOscillator();
  lfo2.frequency.value = 0.062;
  const lfo2g = audioCtx.createGain();
  lfo2g.gain.value = 140;
  lfo2.connect(lfo2g);
  lfo2g.connect(waterFilter.frequency);
  lfo2.start();
}

/* ---------- 气泡 ---------- */
function playBubble(){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';

  const f0 = 280 + Math.random() * 800;
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f0 * (1.7 + Math.random() * 0.6), now + 0.075);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.018 + Math.random() * 0.020, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0003, now + 0.13);

  osc.connect(g);
  g.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.16);
}

let bubbleTimer = null;
function scheduleBubble(){
  if (bubbleTimer) clearTimeout(bubbleTimer);
  const wait = 700 + Math.random() * 2600;
  bubbleTimer = setTimeout(function(){
    playBubble();
    if (Math.random() < 0.38) setTimeout(playBubble, 90 + Math.random() * 220);
    scheduleBubble();
  }, wait);
}

/* =========================================================
   背景：水下焦散 + 气泡
   ========================================================= */
const bubbles = [];
for (let i = 0; i < 46; i++){
  bubbles.push({
    x: Math.random(),
    y: Math.random(),
    r: 1.0 + Math.random() * 3.2,
    speed: 0.012 + Math.random() * 0.035,
    wobble: Math.random() * TAU,
    wobbleSpeed: 0.4 + Math.random() * 0.9,
    alpha: 0.10 + Math.random() * 0.24
  });
}

function drawBackground(t){
  /* 深水渐变 */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#061a26');
  g.addColorStop(0.35, '#04121c');
  g.addColorStop(0.72, '#020a12');
  g.addColorStop(1.00, '#01050a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* 水面光柱 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++){
    const bx = W * (0.08 + 0.21 * i)
             + Math.sin(t * 0.13 + i * 1.7) * W * 0.09;
    const sway = Math.sin(t * 0.19 + i * 2.3) * W * 0.04;

    const lg = ctx.createLinearGradient(
      bx, -H * 0.08, bx + sway, H * 0.82
    );
    lg.addColorStop(0.00, 'rgba(110, 220, 230, 0.045)');
    lg.addColorStop(0.42, 'rgba(80, 190, 220, 0.022)');
    lg.addColorStop(1.00, 'rgba(50, 150, 200, 0)');

    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.ellipse(
      bx, H * 0.28,
      W * 0.10 + Math.abs(sway) * 0.4, H * 0.52,
      sway * 0.0008, 0, TAU
    );
    ctx.fill();
  }

  /* 气泡 */
  for (let i = 0; i < bubbles.length; i++){
    const b = bubbles[i];
    b.y -= b.speed * 0.016;
    if (b.y < -0.05){
      b.y = 1.05;
      b.x = Math.random();
    }
    const bx = b.x * W + Math.sin(t * b.wobbleSpeed + b.wobble) * 14;
    const by = b.y * H;

    ctx.beginPath();
    ctx.arc(bx, by, b.r, 0, TAU);

    const bg = ctx.createRadialGradient(
      bx - b.r * 0.32, by - b.r * 0.32, 0,
      bx, by, b.r * 1.6
    );
    bg.addColorStop(0.00, 'rgba(190, 245, 255, ' + (b.alpha * 1.6) + ')');
    bg.addColorStop(0.50, 'rgba(110, 200, 235, ' + (b.alpha * 0.45) + ')');
    bg.addColorStop(1.00, 'rgba(70, 150, 210, 0)');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(bx, by, b.r * 1.6, 0, TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   鱼尾拖痕
   ========================================================= */
function updateTrail(){
  if (fish.trail.length === 0 ||
      Math.hypot(fish.x - fish.trail[0].x, fish.y - fish.trail[0].y) > S * 0.012){
    fish.trail.unshift({ x: fish.x, y: fish.y });
    if (fish.trail.length > 30) fish.trail.pop();
  }
}

function drawTrail(){
  if (fish.trail.length < 2) return;

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  for (let i = 1; i < fish.trail.length; i++){
    const u = 1 - i / fish.trail.length;
    const a = u * u * 0.10;
    if (a < 0.004) continue;

    ctx.beginPath();
    ctx.moveTo(fish.trail[i - 1].x, fish.trail[i - 1].y);
    ctx.lineTo(fish.trail[i].x, fish.trail[i].y);
    ctx.strokeStyle = 'hsla(28, 100%, 62%, ' + a + ')';
    ctx.lineWidth = u * fish.bodyLen * 0.16 + 1;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制金鱼
   ========================================================= */
function drawFish(t){
  const bodyLen = fish.bodyLen;
  const bodyWidth = bodyLen * 0.30;
  const N = 22;

  /* ---------- 1. 计算脊柱（局部坐标） ---------- */
  const spine = [];
  for (let i = 0; i <= N; i++){
    const s = i / N;                       // 0 = 头, 1 = 尾
    const lx = (0.5 - s) * bodyLen;

    /* 多频率叠加的摆尾 */
    const amp = fish.bodyLen * 0.055 * Math.pow(s, 1.55);
    const bend =
        Math.sin(fish.bendPhase - s * 3.9) * amp
      + Math.sin(fish.bendPhase * 1.62 - s * 6.4) * amp * 0.36
      + Math.sin(fish.bendPhase * 0.55 - s * 2.2) * amp * 0.20;

    spine.push({ lx: lx, ly: bend, s: s });
  }

  /* ---------- 2. 局部 → 世界坐标变换 ---------- */
  const cosA = Math.cos(fish.angle);
  const sinA = Math.sin(fish.angle);

  function toWorld(lx, ly){
    return {
      x: fish.x + lx * cosA - ly * sinA,
      y: fish.y + lx * sinA + ly * cosA
    };
  }

  /* 世界坐标下的脊柱 */
  const ws = [];
  for (let i = 0; i <= N; i++){
    const p = toWorld(spine[i].lx, spine[i].ly);
    ws.push(p);
  }

  /* ---------- 3. 绘制尾鳍 ---------- */
  /* 尾部切线（局部坐标） */
  const tailPrev = spine[N - 2];
  const tailEnd  = spine[N];
  const tdx = tailEnd.lx - tailPrev.lx;
  const tdy = tailEnd.ly - tailPrev.ly;
  const tailDir = Math.atan2(tdy, tdx);

  const tailLen   = bodyLen * 0.92;
  const tailBaseW = bodyLen * 0.055;
  const tailTipW  = bodyLen * 0.62;

  const cosT = Math.cos(tailDir);
  const sinT = Math.sin(tailDir);

  function tailLocal(tx, ty){
    return {
      lx: tailEnd.lx + tx * cosT - ty * sinT,
      ly: tailEnd.ly + tx * sinT + ty * cosT
    };
  }

  const NT = 22;
  const tailPts = [];

  /* 上缘 */
  for (let i = 0; i <= NT; i++){
    const u = i / NT;
    const tx = tailLen * u;
    const halfW = tailBaseW + (tailTipW - tailBaseW) * Math.pow(u, 0.66);

    /* 李萨如式多频率波动 */
    const wave =
        Math.sin(fish.tailPhase - u * 3.8) * 1.00
      + Math.sin(fish.tailPhase * 1.58 - u * 5.6 + 0.7) * 0.42
      + Math.sin(fish.tailPhase * 0.62 - u * 2.1) * 0.22;

    const waveAmp = bodyLen * 0.075 * Math.pow(u, 1.35);
    const ty = -halfW + wave * waveAmp * 0.55;

    const p = tailLocal(tx, ty);
    const w = toWorld(p.lx, p.ly);
    tailPts.push(w);
  }

  /* 下缘（反向） */
  for (let i = NT; i >= 0; i--){
    const u = i / NT;
    const tx = tailLen * u;
    const halfW = tailBaseW + (tailTipW - tailBaseW) * Math.pow(u, 0.66);

    const wave =
        Math.sin(fish.tailPhase - u * 3.8 + 0.9) * 1.00
      + Math.sin(fish.tailPhase * 1.58 - u * 5.6 + 1.8) * 0.42
      + Math.sin(fish.tailPhase * 0.62 - u * 2.1 + 0.4) * 0.22;

    const waveAmp = bodyLen * 0.075 * Math.pow(u, 1.35);
    const ty = halfW + wave * waveAmp * 0.55;

    const p = tailLocal(tx, ty);
    const w = toWorld(p.lx, p.ly);
    tailPts.push(w);
  }

  ctx.beginPath();
  ctx.moveTo(tailPts[0].x, tailPts[0].y);
  for (let i = 1; i < tailPts.length; i++){
    ctx.lineTo(tailPts[i].x, tailPts[i].y);
  }
  ctx.closePath();

  const tailGrad = ctx.createRadialGradient(
    ws[N].x, ws[N].y, 0,
    ws[N].x, ws[N].y, tailLen
  );
  tailGrad.addColorStop(0.00, 'hsla(28, 96%, 62%, 0.78)');
  tailGrad.addColorStop(0.42, 'hsla(20, 94%, 54%, 0.55)');
  tailGrad.addColorStop(0.78, 'hsla(12, 92%, 48%, 0.30)');
  tailGrad.addColorStop(1.00, 'hsla(8, 90%, 44%, 0.06)');
  ctx.fillStyle = tailGrad;
  ctx.fill();

  ctx.strokeStyle = 'hsla(32, 100%, 76%, 0.30)';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  /* 尾鳍纹理 */
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 1; k <= 5; k++){
    const u = k / 6;
    const tx = tailLen * u;
    const halfW = tailBaseW + (tailTipW - tailBaseW) * Math.pow(u, 0.66);

    ctx.beginPath();
    const p1 = tailLocal(tx, -halfW * 0.92);
    const p2 = tailLocal(tx,  halfW * 0.92);
    const w1 = toWorld(p1.lx, p1.ly);
    const w2 = toWorld(p2.lx, p2.ly);
    ctx.moveTo(w1.x, w1.y);
    ctx.lineTo(w2.x, w2.y);
    ctx.strokeStyle = 'hsla(36, 100%, 80%, ' + (0.075 * (1 - u * 0.5)) + ')';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* ---------- 4. 绘制背鳍 ---------- */
  (function(){
    const i0 = Math.round(N * 0.30);
    const i1 = Math.round(N * 0.62);

    const p0 = ws[i0];
    const p1 = ws[i1];

    const nx = (p1.y - p0.y);
    const ny = -(p1.x - p0.x);
    const nl = Math.hypot(nx, ny) || 1;

    const finH = bodyLen * 0.30 * (1 + 0.10 * Math.sin(t * 1.6));
    const mx = (p0.x + p1.x) * 0.5 + (nx / nl) * finH * 0.35;
    const my = (p0.y + p1.y) * 0.5 + (ny / nl) * finH * 0.35;

    const tipX = (p0.x + p1.x) * 0.5 + (nx / nl) * finH;
    const tipY = (p0.y + p1.y) * 0.5 + (ny / nl) * finH;

    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.quadraticCurveTo(mx, my, tipX, tipY);
    ctx.quadraticCurveTo((p1.x + tipX) * 0.5, (p1.y + tipY) * 0.5, p1.x, p1.y);
    ctx.closePath();

    const fg = ctx.createLinearGradient(p0.x, p0.y, tipX, tipY);
    fg.addColorStop(0.00, 'hsla(22, 92%, 52%, 0.72)');
    fg.addColorStop(0.55, 'hsla(16, 90%, 46%, 0.42)');
    fg.addColorStop(1.00, 'hsla(10, 88%, 42%, 0.10)');
    ctx.fillStyle = fg;
    ctx.fill();

    ctx.strokeStyle = 'hsla(34, 100%, 74%, 0.30)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
  })();

  /* ---------- 5. 绘制胸鳍（一对） ---------- */
  const finSwing = Math.sin(fish.finPhase) * 0.42;
  for (let side = -1; side <= 1; side += 2){
    const idx = Math.round(N * 0.30);
    const base = ws[idx];

    const dir = fish.angle + side * (Math.PI * 0.5 + 0.35);
    const swingDir = dir + finSwing * side;

    const finLen = bodyLen * 0.42;
    const fx = base.x + Math.cos(swingDir) * finLen;
    const fy = base.y + Math.sin(swingDir) * finLen;

    const perp = swingDir + Math.PI * 0.5;
    const w = bodyLen * 0.085;
    const cx1 = base.x + Math.cos(swingDir) * finLen * 0.5 + Math.cos(perp) * w;
    const cy1 = base.y + Math.sin(swingDir) * finLen * 0.5 + Math.sin(perp) * w;
    const cx2 = base.x + Math.cos(swingDir) * finLen * 0.5 - Math.cos(perp) * w;
    const cy2 = base.y + Math.sin(swingDir) * finLen * 0.5 - Math.sin(perp) * w;

    ctx.beginPath();
    ctx.moveTo(base.x, base.y);
    ctx.quadraticCurveTo(cx1, cy1, fx, fy);
    ctx.quadraticCurveTo(cx2, cy2, base.x, base.y);
    ctx.closePath();

    const pg = ctx.createRadialGradient(
      base.x, base.y, 0,
      base.x, base.y, finLen
    );
    pg.addColorStop(0.00, 'hsla(24, 92%, 56%, 0.66)');
    pg.addColorStop(0.65, 'hsla(18, 90%, 48%, 0.26)');
    pg.addColorStop(1.00, 'hsla(12, 88%, 44%, 0.05)');
    ctx.fillStyle = pg;
    ctx.fill();

    ctx.strokeStyle = 'hsla(34, 100%, 76%, 0.24)';
    ctx.lineWidth = 0.85;
    ctx.stroke();
  }

  /* ---------- 6. 绘制鱼身 ---------- */
  const leftPts = [];
  const rightPts = [];

  for (let i = 0; i <= N; i++){
    const s = spine[i].s;

    /* 切线 */
    let dx, dy;
    if (i < N){
      dx = spine[i + 1].lx - spine[i].lx;
      dy = spine[i + 1].ly - spine[i].ly;
    } else {
      dx = spine[i].lx - spine[i - 1].lx;
      dy = spine[i].ly - spine[i - 1].ly;
    }
    const dl = Math.hypot(dx, dy) || 1;
    const nx = -dy / dl;
    const ny =  dx / dl;

    const halfW = bodyProfile(s) * bodyWidth;

    const pl = toWorld(spine[i].lx + nx * halfW, spine[i].ly + ny * halfW);
    const pr = toWorld(spine[i].lx - nx * halfW, spine[i].ly - ny * halfW);

    leftPts.push(pl);
    rightPts.push(pr);
  }

  ctx.beginPath();
  ctx.moveTo(leftPts[0].x, leftPts[0].y);
  for (let i = 1; i < leftPts.length; i++) ctx.lineTo(leftPts[i].x, leftPts[i].y);
  for (let i = rightPts.length - 1; i >= 0; i--) ctx.lineTo(rightPts[i].x, rightPts[i].y);
  ctx.closePath();

  /* 鱼身渐变 */
  const head = ws[0];
  const tail = ws[N];
  const bodyGrad = ctx.createLinearGradient(
    head.x, head.y,
    tail.x, tail.y
  );
  bodyGrad.addColorStop(0.00, 'hsl(34, 96%, 66%)');
  bodyGrad.addColorStop(0.20, 'hsl(28, 96%, 60%)');
  bodyGrad.addColorStop(0.55, 'hsl(22, 94%, 52%)');
  bodyGrad.addColorStop(0.85, 'hsl(16, 90%, 44%)');
  bodyGrad.addColorStop(1.00, 'hsl(12, 86%, 36%)');
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  /* 鱼身高光 */
  ctx.save();
  ctx.clip();

  const hl = ctx.createRadialGradient(
    head.x + (tail.x - head.x) * 0.32,
    head.y + (tail.y - head.y) * 0.32 - bodyWidth * 0.5,
    0,
    head.x + (tail.x - head.x) * 0.32,
    head.y + (tail.y - head.y) * 0.32 - bodyWidth * 0.5,
    bodyLen * 0.72
  );
  hl.addColorStop(0.00, 'rgba(255, 250, 225, 0.55)');
  hl.addColorStop(0.42, 'rgba(255, 225, 175, 0.18)');
  hl.addColorStop(1.00, 'rgba(255, 200, 140, 0)');
  ctx.fillStyle = hl;
  ctx.fillRect(0, 0, W, H);

  /* 鳞片纹理 */
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 2; i < N - 2; i += 2){
    const p = ws[i];
    const s = spine[i].s;
    const r = bodyProfile(s) * bodyWidth * 0.42;
    if (r < 1) continue;

    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI);
    ctx.strokeStyle = 'hsla(28, 80%, 36%, ' + (0.18 * (1 - s * 0.55)) + ')';
    ctx.lineWidth = Math.max(0.5, r * 0.16);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();

  /* 鱼身描边 */
  ctx.beginPath();
  ctx.moveTo(leftPts[0].x, leftPts[0].y);
  for (let i = 1; i < leftPts.length; i++) ctx.lineTo(leftPts[i].x, leftPts[i].y);
  for (let i = rightPts.length - 1; i >= 0; i--) ctx.lineTo(rightPts[i].x, rightPts[i].y);
  ctx.closePath();
  ctx.strokeStyle = 'hsla(38, 100%, 78%, 0.42)';
  ctx.lineWidth = 1.15;
  ctx.stroke();

  /* ---------- 7. 鳃线 ---------- */
  (function(){
    const gi = Math.round(N * 0.24);
    const p = ws[gi];

    const gdx = ws[gi + 2].x - ws[gi - 2].x;
    const gdy = ws[gi + 2].y - ws[gi - 2].y;
    const gl = Math.hypot(gdx, gdy) || 1;
    const gnx = -gdy / gl;
    const gny =  gdx / gl;

    const gh = bodyProfile(spine[gi].s) * bodyWidth * 0.72;

    ctx.beginPath();
    ctx.moveTo(p.x + gnx * gh, p.y + gny * gh);
    ctx.quadraticCurveTo(
      p.x + gdx * 0.10, p.y + gdy * 0.10,
      p.x - gnx * gh, p.y - gny * gh
    );
    ctx.strokeStyle = 'hsla(20, 70%, 34%, 0.45)';
    ctx.lineWidth = Math.max(0.8, bodyLen * 0.008);
    ctx.stroke();
  })();

  /* ---------- 8. 眼睛 ---------- */
  (function(){
    const eyeS = 0.13;
    const ei = Math.round(N * eyeS);
    const ep = ws[ei];

    /* 眼睛位置：身体上方偏侧 */
    const eyeOffset = bodyProfile(spine[ei].s) * bodyWidth * 0.42;
    const nx2 = -(ws[ei + 1].y - ws[ei - 1].y);
    const ny2 =  (ws[ei + 1].x - ws[ei - 1].x);
    const nl2 = Math.hypot(nx2, ny2) || 1;

    const eyeR = bodyLen * 0.058;
    const ex = ep.x + (nx2 / nl2) * eyeOffset;
    const ey = ep.y + (ny2 / nl2) * eyeOffset;

    /* 眨眼 */
    const blinkAmt = fish.eyeBlink;
    const openH = eyeR * (1 - blinkAmt * 0.88);

    /* 眼白 */
    ctx.beginPath();
    ctx.ellipse(ex, ey, eyeR, Math.max(0.4, openH), 0, 0, TAU);
    ctx.fillStyle = 'hsl(40, 96%, 92%)';
    ctx.fill();

    /* 虹膜 */
    if (blinkAmt < 0.6){
      ctx.beginPath();
      ctx.arc(ex + eyeR * 0.14 * cosA, ey + eyeR * 0.14 * sinA, eyeR * 0.62, 0, TAU);
      ctx.fillStyle = 'hsl(28, 92%, 30%)';
      ctx.fill();

      /* 瞳孔 */
      ctx.beginPath();
      ctx.arc(ex + eyeR * 0.20 * cosA, ey + eyeR * 0.20 * sinA, eyeR * 0.32, 0, TAU);
      ctx.fillStyle = '#0a0604';
      ctx.fill();

      /* 高光 */
      ctx.beginPath();
      ctx.arc(ex - eyeR * 0.22, ey - eyeR * 0.26, eyeR * 0.22, 0, TAU);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
      ctx.fill();
    }

    /* 眼眶 */
    ctx.beginPath();
    ctx.ellipse(ex, ey, eyeR * 1.16, Math.max(0.5, openH * 1.16), 0, 0, TAU);
    ctx.strokeStyle = 'hsla(20, 80%, 28%, 0.55)';
    ctx.lineWidth = Math.max(0.6, eyeR * 0.14);
    ctx.stroke();
  })();

  /* ---------- 9. 嘴 ---------- */
  (function(){
    const mp = ws[0];
    const mdx = ws[0].x - ws[2].x;
    const mdy = ws[0].y - ws[2].y;
    const ml = Math.hypot(mdx, mdy) || 1;

    const mouthR = bodyLen * 0.032;
    ctx.beginPath();
    ctx.arc(
      mp.x + (mdx / ml) * mouthR * 0.4,
      mp.y + (mdy / ml) * mouthR * 0.4,
      mouthR, 0, TAU
    );
    ctx.fillStyle = 'hsla(18, 80%, 26%, 0.60)';
    ctx.fill();
  })();
}

/* =========================================================
   主循环
   ========================================================= */
let lastTime = performance.now();

function frame(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now * 0.001;

  /* ---- 鼠标速度 ---- */
  mouseVX = mouseX - lastMouseX;
  mouseVY = mouseY - lastMouseY;
  lastMouseX = mouseX;
  lastMouseY = mouseY;

  /* ---- 金鱼转向与速度 ---- */
  const dx = mouseX - fish.x;
  const dy = mouseY - fish.y;
  const dist = Math.hypot(dx, dy);

  if (dist > S * 0.05){
    fish.targetAngle = Math.atan2(dy, dx);
    fish.targetSpeed = Math.min(6.5, (dist - S * 0.04) * 0.030);
  } else {
    fish.targetAngle += dt * 1.15;
    fish.targetSpeed = 1.2;
  }

  /* 平滑转向 */
  let dAng = fish.targetAngle - fish.angle;
  while (dAng >  Math.PI) dAng -= TAU;
  while (dAng < -Math.PI) dAng += TAU;
  fish.angle += dAng * (1 - Math.exp(-5.2 * dt));

  /* 平滑变速 */
  fish.speed += (fish.targetSpeed - fish.speed) * (1 - Math.exp(-3.2 * dt));

  /* 移动 */
  fish.x += Math.cos(fish.angle) * fish.speed * 60 * dt;
  fish.y += Math.sin(fish.angle) * fish.speed * 60 * dt;

  /* 边界回弹 */
  const pad = fish.bodyLen * 0.8;
  if (fish.x < pad){ fish.x = pad; fish.targetAngle = 0; }
  if (fish.x > W - pad){ fish.x = W - pad; fish.targetAngle = Math.PI; }
  if (fish.y < pad){ fish.y = pad; fish.targetAngle = Math.PI * 0.5; }
  if (fish.y > H - pad){ fish.y = H - pad; fish.targetAngle = -Math.PI * 0.5; }

  /* ---- 摆动相位 ---- */
  const tailFreq = 1.7 + fish.speed * 0.85;
  fish.bendPhase += dt * tailFreq * TAU * 0.62;
  fish.tailPhase += dt * tailFreq * TAU;
  fish.finPhase  += dt * (2.6 + fish.speed * 0.5) * TAU * 0.4;

  /* ---- 眨眼 ---- */
  fish.eyeBlinkTimer -= dt;
  if (fish.eyeBlinkTimer <= 0){
    fish.eyeBlinkTimer = 2.8 + Math.random() * 4.5;
    fish.eyeBlink = 1;
  }
  fish.eyeBlink += (0 - fish.eyeBlink) * (1 - Math.exp(-12 * dt));

  /* ---- 音频动态 ---- */
  if (audioReady && audioCtx && audioCtx.state === 'running' && waterGain){
    const targetVol = 0.042 + Math.min(0.030, fish.speed * 0.010);
    waterGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.4);
  }

  /* ---- 绘制 ---- */
  drawBackground(t);
  updateTrail();
  drawTrail();
  drawFish(t);

  /* ---- 暗角 ---- */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, S * 0.30,
    W * 0.5, H * 0.5, S * 1.0
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(0, 6, 14, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 2, 8, 0.76)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* ---- HUD ---- */
  const sv = document.getElementById('speedVal');
  if (sv) sv.textContent = fish.speed.toFixed(2);

  const tv = document.getElementById('tailVal');
  if (tv) tv.textContent = tailFreq.toFixed(1) + ' Hz';

  const sb = document.getElementById('stateBig');
  if (sb){
    if (fish.speed < 0.7)       sb.textContent = '悠 游';
    else if (fish.speed < 2.2)  sb.textContent = '巡 游';
    else if (fish.speed < 4.2)  sb.textContent = '游 弋';
    else                        sb.textContent = '疾 游';
  }

  requestAnimationFrame(frame);
}

/* =========================================================
   交互
   ========================================================= */
window.addEventListener('pointerdown', initAudio);
window.addEventListener('keydown', initAudio);
window.addEventListener('touchstart', initAudio, { passive: true });

/* =========================================================
   启动
   ========================================================= */
resize();
initFish();
requestAnimationFrame(function(now){
  lastTime = now;
  requestAnimationFrame(frame);
});

})();
</script>
