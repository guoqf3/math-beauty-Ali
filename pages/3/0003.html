<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>心形线 · 求爱的孔雀</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02010a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;cursor:pointer;
  }
  canvas{display:block;position:fixed;inset:0;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:42px 48px;opacity:0;
    animation:fade 1.8s 0.3s ease forwards;
  }
  #title .en{
    font-size:10px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,220,.36);font-weight:300;margin-bottom:14px;
  }
  #title h1{
    font-size:clamp(22px,3.2vw,42px);
    font-weight:200;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(96deg,#3ee0b8 0%,#4ab8ff 38%,#8a9eff 68%,#ffd08a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 30px rgba(80,200,220,.45));
  }
  #title .sub{
    font-size:11px;letter-spacing:.22em;line-height:2.0;
    color:rgba(140,200,225,.32);font-weight:300;
  }

  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 48px 42px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(130,195,225,.28);
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
  }
  #stats .k{color:rgba(170,190,255,.52);}
  #stats .v{color:rgba(255,215,150,.70);}
  #stats .lab{
    display:block;font-size:8.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(120,180,220,.24);margin-bottom:8px;
  }

  #meter{
    position:absolute;bottom:0;right:0;
    padding:0 48px 42px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(130,195,225,.28);
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  #meter .k{color:rgba(170,190,255,.52);}
  #meter .v{color:rgba(255,215,150,.70);}
  #meter .big{
    display:block;font-size:clamp(20px,2.4vw,30px);
    font-weight:200;letter-spacing:.22em;
    color:rgba(180,240,220,.85);
    margin-bottom:2px;transition:color .5s ease;
  }

  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:46px;white-space:nowrap;
    font-size:10px;letter-spacing:.28em;
    color:rgba(150,205,225,.42);
    opacity:0;animation:fade 1.8s 1.8s ease forwards;
  }
  #hint .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:rgba(255,210,140,.85);vertical-align:middle;
    margin:0 8px;position:relative;top:-1px;
    animation:pulse 2.0s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.35;transform:scale(1);}
    50%{opacity:1;transform:scale(1.5);}
  }
  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:22px 22px;}
    #title .sub{font-size:9.5px;}
    #stats{padding:0 22px 22px;font-size:8.5px;}
    #meter{padding:0 22px 22px;font-size:8.5px;}
    #hint{padding-bottom:26px;font-size:8.5px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">CARDIOID · PEACOCK DISPLAY</div>
    <h1>求爱的孔雀</h1>
    <div class="sub">
      心形线方程 · 逐层展开尾羽<br>
      点击屏幕 · 触发开屏
    </div>
  </div>

  <div id="stats">
    <span class="lab">CARDIOID EQUATION</span>
    <div><span class="k">r(ψ) = a(1 + cos ψ)</span></div>
    <div><span class="k">羽毛数</span> <span class="v" id="fnum">100</span></div>
    <div><span class="k">眼斑层</span> <span class="v">3 圈</span></div>
    <div><span class="k">展开顺序</span> <span class="v">中心 → 外侧</span></div>
  </div>

  <div id="meter">
    <span class="big" id="stateBig">收 拢</span>
    <div class="en" id="stateEn">FOLDED</div>
    <div style="margin-top:8px;"><span class="k">展开度 </span><span class="v" id="openVal">0%</span></div>
  </div>

  <div id="hint">
    <span class="dot"></span>点击屏幕 · 孔雀开屏<span class="dot"></span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   画布
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, DPR = 1, S = 0;
let skyGrad = null, vignette = null;
let originX = 0, originY = 0;

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                 window.innerWidth < 720;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.min(W, H);
  originX = W * 0.5;
  originY = H * 0.80;

  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0.00, '#03010e');
  skyGrad.addColorStop(0.32, '#080520');
  skyGrad.addColorStop(0.62, '#0c0a2a');
  skyGrad.addColorStop(0.85, '#0a0a22');
  skyGrad.addColorStop(1.00, '#040210');

  vignette = ctx.createRadialGradient(W*0.5, H*0.52, S*0.22, W*0.5, H*0.5, S*1.0);
  vignette.addColorStop(0.00, 'rgba(0,0,0,0)');
  vignette.addColorStop(0.62, 'rgba(2,0,10,0.24)');
  vignette.addColorStop(1.00, 'rgba(0,0,4,0.78)');

  computeMetrics();
}
window.addEventListener('resize', resize);

/* =========================================================
   羽毛数据
   ========================================================= */
const N_FEATHERS = isMobile ? 64 : 100;
const feathers = [];

const PHI = (1 + Math.sqrt(5)) * 0.5;

function initFeathers(){
  feathers.length = 0;

  for (let i = 0; i < N_FEATHERS; i++){
    const u = i / (N_FEATHERS - 1);
    /* ψ: 从 -170° 到 +170°，向上为 0 */
    const psi = (u - 0.5) * 2 * Math.PI * 0.944;

    /* 心形线长度因子：r = a(1 + cos ψ) */
    const cardioid = (1 + Math.cos(psi)) * 0.5;

    feathers.push({
      psi: psi,
      cardioid: cardioid,
      fullLen: 1,
      eyeR: 1,
      width: 1,
      p: 0,
      hueBase: 155 + (psi / Math.PI) * 40,
      seed: Math.random() * 100
    });
  }

  /* 从中心向外排序（中心最后绘制，位于顶层） */
  feathers.sort((a, b) => Math.abs(b.psi) - Math.abs(a.psi));
  feathers.reverse();
}

function computeMetrics(){
  const base = S * 0.06;
  const span = S * 0.24;

  for (let i = 0; i < feathers.length; i++){
    const f = feathers[i];
    f.fullLen = base + span * (1 + Math.cos(f.psi));
    f.eyeR    = f.fullLen * 0.072;
    f.width   = S * (0.0018 + 0.0010 * (1 - Math.abs(f.psi) / Math.PI));
  }
}

/* =========================================================
   状态
   ========================================================= */
let isOpen = false;
let globalOpen = 0;      // 用于 HUD 显示
let initDone = false;

/* =========================================================
   音频
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let delayNode = null;
let audioReady = false;

function initAudio(){
  if (audioReady) {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { audioCtx = new AC(); } catch(e){ return; }
  audioReady = true;

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);
  masterGain.gain.setTargetAtTime(0.72, audioCtx.currentTime, 2.2);

  /* ---- 回声延迟 ---- */
  delayNode = audioCtx.createDelay(1.2);
  delayNode.delayTime.value = 0.30;
  const fb = audioCtx.createGain();
  fb.gain.value = 0.30;
  delayNode.connect(fb);
  fb.connect(delayNode);
  delayNode.connect(masterGain);

  /* ---- 持续低音（坦布拉琴效果） ---- */
  startDrone();

  if (audioCtx.state === 'suspended') audioCtx.resume();

  schedulePlucks();
}

function startDrone(){
  /* A2, E3, A3, C#4 —— 拉格·拜拉夫骨干音 */
  const specs = [
    { f: 110.00, g: 0.55 },
    { f: 164.81, g: 0.32 },
    { f: 220.00, g: 0.22 },
    { f: 277.18, g: 0.12 }
  ];

  for (let i = 0; i < specs.length; i++){
    const sp = specs[i];
    const osc = audioCtx.createOscillator();
    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
    osc.frequency.value = sp.f * (1 + (Math.random() - 0.5) * 0.003);

    const g = audioCtx.createGain();
    g.gain.value = 0;
    g.gain.setTargetAtTime(0.020 * sp.g, audioCtx.currentTime, 3.0);

    /* 缓慢颤音，像琴弦自然震动 */
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.055 + i * 0.031;
    const lfoG = audioCtx.createGain();
    lfoG.gain.value = 0.004 + i * 0.0015;
    lfo.connect(lfoG);
    lfoG.connect(g.gain);
    lfo.start();

    osc.connect(g);
    g.connect(masterGain);
    osc.start();
  }
}

/* ---- 西塔琴式拨弦 ---- */
const RAGA = [
  220.00, 233.08, 277.18, 329.63, 349.23,
  415.30, 440.00, 466.16, 554.37
];

function playPluck(){
  if (!audioCtx || audioCtx.state !== 'running') return;

  const now = audioCtx.currentTime;
  const f = RAGA[Math.floor(Math.random() * RAGA.length)];

  const osc = audioCtx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = f;

  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = f * 2.0;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.052, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0003, now + 2.0);

  const g2 = audioCtx.createGain();
  g2.gain.value = 0.22;

  osc.connect(g);
  osc2.connect(g2);
  g2.connect(g);

  g.connect(masterGain);
  g.connect(delayNode);

  osc.start(now);
  osc.stop(now + 2.2);
  osc2.start(now);
  osc2.stop(now + 2.2);
}

function schedulePlucks(){
  const wait = 1.2 + Math.random() * 3.4;
  setTimeout(function(){
    playPluck();
    if (Math.random() < 0.35) setTimeout(playPluck, 180 + Math.random() * 240);
    schedulePlucks();
  }, wait * 1000);
}

/* ---- 孔雀鸣叫 ---- */
function playPeacockCall(){
  if (!audioCtx || audioCtx.state !== 'running') return;

  const now = audioCtx.currentTime;
  const calls = 2 + Math.floor(Math.random() * 2);

  for (let i = 0; i < calls; i++){
    const t0 = now + i * 0.46;
    const f0 = 740 + Math.random() * 300;

    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';

    osc.frequency.setValueAtTime(f0 * 0.62, t0);
    osc.frequency.exponentialRampToValueAtTime(f0 * 1.38, t0 + 0.075);
    osc.frequency.exponentialRampToValueAtTime(f0 * 0.86, t0 + 0.34);

    /* 低通滤波让声音柔和、带一点鼻音 */
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(3400, t0);
    lp.frequency.exponentialRampToValueAtTime(1300, t0 + 0.38);
    lp.Q.value = 4.5;

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.038, t0 + 0.025);
    g.gain.setValueAtTime(0.038, t0 + 0.16);
    g.gain.exponentialRampToValueAtTime(0.0004, t0 + 0.44);

    osc.connect(lp);
    lp.connect(g);
    g.connect(masterGain);
    g.connect(delayNode);

    osc.start(t0);
    osc.stop(t0 + 0.52);
  }
}

/* =========================================================
   星空背景
   ========================================================= */
const stars = [];
for (let i = 0; i < 190; i++){
  stars.push({
    x: Math.random(),
    y: Math.random() * 0.78,
    r: Math.random() * 1.2 + 0.20,
    ph: Math.random() * TAU,
    sp: 0.18 + Math.random() * 0.85,
    hue: 200 + Math.random() * 60
  });
}

function drawSky(t){
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = 0.10 + 0.36 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    ctx.fillStyle = 'hsla(' + s.hue + ', 80%, 82%, ' + (a * 0.72) + ')';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, TAU);
    ctx.fill();
  }

  /* 柔和的紫罗兰星云 */
  const nx = W * 0.30, ny = H * 0.22;
  const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, S * 0.55);
  ng.addColorStop(0.00, 'rgba(120, 80, 220, 0.055)');
  ng.addColorStop(0.45, 'rgba(80, 50, 180, 0.020)');
  ng.addColorStop(1.00, 'rgba(40, 20, 100, 0)');
  ctx.fillStyle = ng;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   绘制羽毛
   ========================================================= */
function drawFeather(f, t){
  const p = f.p;
  if (p < 0.008) return;

  const eased = 1 - Math.pow(1 - p, 3);

  /* 微风摆动 */
  const wob = Math.sin(t * 1.05 + f.psi * 2.4 + f.seed) * 0.016
            + Math.sin(t * 0.47 + f.psi * 1.3) * 0.010;

  const angle = f.psi + wob;
  const dirX = Math.sin(angle);
  const dirY = -Math.cos(angle);

  const len = f.fullLen * eased;

  const x0 = originX;
  const y0 = originY;

  /* 曲率：外侧羽毛稍弯 */
  const bend = 0.10 * (Math.abs(f.psi) / Math.PI) * eased;
  const perpX = -dirY;
  const perpY = dirX;

  const ctrlX = x0 + dirX * len * 0.52 + perpX * len * bend;
  const ctrlY = y0 + dirY * len * 0.52 + perpY * len * bend;

  const x1 = x0 + dirX * len;
  const y1 = y0 + dirY * len;

  const hue = f.hueBase;
  const sat = 68 + 18 * (1 - Math.abs(f.psi) / Math.PI);
  const lig = 34 + 22 * (1 - Math.abs(f.psi) / Math.PI);

  /* ---- 光晕层 ---- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(ctrlX, ctrlY, x1, y1);
  ctx.strokeStyle = 'hsla(' + hue + ', 100%, 62%, ' + (0.055 * eased) + ')';
  ctx.lineWidth = f.width * 7.5;
  ctx.stroke();

  /* ---- 主体羽轴 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(ctrlX, ctrlY, x1, y1);

  const grad = ctx.createLinearGradient(x0, y0, x1, y1);
  grad.addColorStop(0.00, 'hsla(' + hue + ', ' + sat + '%, ' + (lig - 10) + '%, ' + (0.85 * eased) + ')');
  grad.addColorStop(0.60, 'hsla(' + (hue + 8) + ', ' + (sat + 8) + '%, ' + lig + '%, ' + (0.75 * eased) + ')');
  grad.addColorStop(1.00, 'hsla(' + (hue + 20) + ', ' + (sat + 12) + '%, ' + (lig + 14) + '%, ' + (0.55 * eased) + ')');
  ctx.strokeStyle = grad;
  ctx.lineWidth = f.width * eased;
  ctx.stroke();

  /* ---- 羽枝（两侧小支线） ---- */
  const NB = 6;
  for (let i = 1; i <= NB; i++){
    const bt = i / (NB + 1);
    const mt = 1 - bt;
    const bx = mt*mt*x0 + 2*mt*bt*ctrlX + bt*bt*x1;
    const by = mt*mt*y0 + 2*mt*bt*ctrlY + bt*bt*y1;

    const bl = len * 0.070 * (1 - bt * 0.45) * eased;

    for (let s = -1; s <= 1; s += 2){
      const tipX = bx + perpX * bl * s + dirX * bl * 0.35;
      const tipY = by + perpY * bl * s + dirY * bl * 0.35;

      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(tipX, tipY);
      ctx.strokeStyle = 'hsla(' + (hue + 12) + ', ' + (sat + 10) + '%, '
                      + (lig + 28) + '%, ' + (0.16 * eased) + ')';
      ctx.lineWidth = Math.max(0.6, f.width * 0.55);
      ctx.stroke();
    }
  }

  /* =========================================================
     眼斑（孔雀羽毛的标志）
     ========================================================= */
  const et = 0.67;
  const mt = 1 - et;
  const ex = mt*mt*x0 + 2*mt*et*ctrlX + et*et*x1;
  const ey = mt*mt*y0 + 2*mt*et*ctrlY + et*et*y1;

  const er = f.eyeR * eased;
  if (er < 0.6) return;

  /* 外发光 */
  ctx.globalCompositeOperation = 'lighter';
  const gr = er * 3.4;
  const gg = ctx.createRadialGradient(ex, ey, 0, ex, ey, gr);
  gg.addColorStop(0.00, 'hsla(' + (hue + 18) + ', 100%, 74%, ' + (0.30 * eased) + ')');
  gg.addColorStop(0.42, 'hsla(' + (hue + 38) + ', 100%, 62%, ' + (0.09 * eased) + ')');
  gg.addColorStop(1.00, 'hsla(' + (hue + 58) + ', 100%, 54%, 0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(ex, ey, gr, 0, TAU);
  ctx.fill();

  /* 金色外环 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath();
  ctx.arc(ex, ey, er, 0, TAU);
  const rg1 = ctx.createRadialGradient(
    ex - er * 0.3, ey - er * 0.3, 0, ex, ey, er
  );
  rg1.addColorStop(0.00, 'hsla(48, 92%, 74%, ' + (0.86 * eased) + ')');
  rg1.addColorStop(0.55, 'hsla(40, 88%, 60%, ' + (0.78 * eased) + ')');
  rg1.addColorStop(1.00, 'hsla(30, 82%, 42%, ' + (0.68 * eased) + ')');
  ctx.fillStyle = rg1;
  ctx.fill();

  /* 青绿色内圈 */
  ctx.beginPath();
  ctx.arc(ex, ey, er * 0.74, 0, TAU);
  const rg2 = ctx.createRadialGradient(
    ex - er * 0.2, ey - er * 0.2, 0, ex, ey, er * 0.74
  );
  rg2.addColorStop(0.00, 'hsla(' + (hue + 6) + ', 88%, 56%, ' + (0.92 * eased) + ')');
  rg2.addColorStop(1.00, 'hsla(' + (hue + 18) + ', 82%, 38%, ' + (0.88 * eased) + ')');
  ctx.fillStyle = rg2;
  ctx.fill();

  /* 深蓝瞳孔 */
  ctx.beginPath();
  ctx.arc(ex, ey, er * 0.40, 0, TAU);
  ctx.fillStyle = 'hsla(232, 78%, 14%, ' + (0.95 * eased) + ')';
  ctx.fill();

  /* 瞳孔内圈 */
  ctx.beginPath();
  ctx.arc(ex, ey, er * 0.22, 0, TAU);
  ctx.fillStyle = 'hsla(240, 90%, 26%, ' + (0.85 * eased) + ')';
  ctx.fill();

  /* 高光 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.arc(ex - er * 0.16, ey - er * 0.18, er * 0.15, 0, TAU);
  ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.78 * eased) + ')';
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   孔雀身体
   ========================================================= */
function drawBody(t){
  const bx = originX;
  const by = originY + S * 0.028;

  const bodyR = S * 0.030;
  const bodyRy = S * 0.048;

  /* 身体 */
  ctx.beginPath();
  ctx.ellipse(bx, by, bodyR, bodyRy, 0, 0, TAU);
  const bg = ctx.createLinearGradient(bx - bodyR, by - bodyRy, bx + bodyR, by + bodyRy);
  bg.addColorStop(0.00, '#0c2238');
  bg.addColorStop(0.45, '#0a1c30');
  bg.addColorStop(1.00, '#06101e');
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(70, 170, 195, 0.28)';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  /* 胸部虹彩 */
  ctx.globalCompositeOperation = 'lighter';
  const cg = ctx.createRadialGradient(
    bx - bodyR * 0.25, by - bodyRy * 0.30, 0,
    bx, by, bodyRy * 0.95
  );
  cg.addColorStop(0.00, 'hsla(172, 85%, 52%, 0.16)');
  cg.addColorStop(0.55, 'hsla(196, 80%, 46%, 0.055)');
  cg.addColorStop(1.00, 'hsla(220, 80%, 40%, 0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(bx, by, bodyR, bodyRy, 0, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 颈部 */
  const neckY = by - bodyRy * 0.78;
  const neckX = bx;
  ctx.beginPath();
  ctx.moveTo(neckX - bodyR * 0.52, neckY + bodyR * 0.30);
  ctx.quadraticCurveTo(
    neckX - bodyR * 0.30, neckY - bodyR * 0.85,
    neckX - bodyR * 0.06, neckY - bodyR * 1.00
  );
  ctx.lineTo(neckX + bodyR * 0.06, neckY - bodyR * 1.00);
  ctx.quadraticCurveTo(
    neckX + bodyR * 0.30, neckY - bodyR * 0.85,
    neckX + bodyR * 0.52, neckY + bodyR * 0.30
  );
  ctx.closePath();
  ctx.fillStyle = '#0a1e34';
  ctx.fill();
  ctx.strokeStyle = 'rgba(70, 170, 195, 0.22)';
  ctx.stroke();

  /* 头部 */
  const headR = S * 0.017;
  const headX = neckX;
  const headY = neckY - bodyR * 1.42;

  ctx.beginPath();
  ctx.arc(headX, headY, headR, 0, TAU);
  ctx.fillStyle = '#0a1e34';
  ctx.fill();
  ctx.strokeStyle = 'rgba(70, 170, 195, 0.30)';
  ctx.stroke();

  /* 眼睛 */
  ctx.beginPath();
  ctx.arc(headX - headR * 0.34, headY - headR * 0.12, headR * 0.19, 0, TAU);
  ctx.fillStyle = 'rgba(240, 245, 255, 0.85)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(headX - headR * 0.34, headY - headR * 0.12, headR * 0.09, 0, TAU);
  ctx.fillStyle = '#050810';
  ctx.fill();

  /* 喙 */
  ctx.beginPath();
  ctx.moveTo(headX + headR * 0.78, headY - headR * 0.10);
  ctx.lineTo(headX + headR * 1.85, headY + headR * 0.10);
  ctx.lineTo(headX + headR * 0.78, headY + headR * 0.28);
  ctx.closePath();
  ctx.fillStyle = 'rgba(180, 150, 90, 0.78)';
  ctx.fill();

  /* 冠羽（三根小翎） */
  ctx.strokeStyle = 'rgba(90, 200, 210, 0.55)';
  ctx.lineWidth = Math.max(0.8, S * 0.0012);
  ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++){
    const a = -Math.PI * 0.5 + i * 0.32;
    const len = headR * (1.55 + (i === 0 ? 0.30 : 0));
    const sway = Math.sin(t * 1.4 + i * 1.7) * headR * 0.10;

    ctx.beginPath();
    ctx.moveTo(headX, headY - headR * 0.92);
    ctx.quadraticCurveTo(
      headX + Math.cos(a) * len * 0.6 + sway,
      headY + Math.sin(a) * len * 0.6,
      headX + Math.cos(a) * len + sway * 1.6,
      headY + Math.sin(a) * len
    );
    ctx.stroke();

    /* 翎端小点 */
    ctx.beginPath();
    ctx.arc(
      headX + Math.cos(a) * len + sway * 1.6,
      headY + Math.sin(a) * len,
      Math.max(1, S * 0.0022), 0, TAU
    );
    ctx.fillStyle = 'rgba(90, 220, 220, 0.55)';
    ctx.fill();
  }

  /* 双脚 */
  ctx.strokeStyle = 'rgba(140, 160, 190, 0.32)';
  ctx.lineWidth = Math.max(1, S * 0.0016);
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.moveTo(bx + s * bodyR * 0.36, by + bodyRy * 0.90);
    ctx.lineTo(bx + s * bodyR * 0.42, by + bodyRy * 1.22);
    ctx.stroke();

    for (let k = -1; k <= 1; k++){
      ctx.beginPath();
      ctx.moveTo(bx + s * bodyR * 0.42, by + bodyRy * 1.22);
      ctx.lineTo(
        bx + s * bodyR * 0.42 + k * S * 0.007,
        by + bodyRy * 1.30
      );
      ctx.stroke();
    }
  }
}

/* =========================================================
   主循环
   ========================================================= */
let lastNow = performance.now();

function frame(now){
  const t = now * 0.001;
  const dt = Math.min((now - lastNow) * 0.001, 0.05);
  lastNow = now;

  /* ---- 更新羽毛进度 ---- */
  let sum = 0;
  for (let i = 0; i < feathers.length; i++){
    const f = feathers[i];
    const baseDelay = Math.abs(f.psi) / Math.PI;

    if (isOpen){
      const rate = 1.75 / (1 + baseDelay * 3.4);
      f.p = Math.min(1, f.p + dt * rate);
    } else {
      const rate = 2.4 / (1 + baseDelay * 3.4);
      f.p = Math.max(0, f.p - dt * rate);
    }
    sum += f.p;
  }
  globalOpen = feathers.length > 0 ? sum / feathers.length : 0;

  /* ---- 背景 ---- */
  drawSky(t);

  /* ---- 中心柔光（提示可点击 / 开屏氛围） ---- */
  ctx.globalCompositeOperation = 'lighter';
  const pulse = 0.5 + 0.5 * Math.sin(t * 1.4);
  const haloA = isOpen ? (0.055 + globalOpen * 0.06) : (0.020 + pulse * 0.024);
  const halo = ctx.createRadialGradient(
    originX, originY, 0, originX, originY, S * 0.62
  );
  halo.addColorStop(0.00, 'hsla(168, 100%, 62%, ' + haloA + ')');
  halo.addColorStop(0.48, 'hsla(190, 100%, 56%, ' + (haloA * 0.32) + ')');
  halo.addColorStop(1.00, 'hsla(210, 100%, 50%, 0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(originX, originY, S * 0.62, 0, TAU);
  ctx.fill();

  /* ---- 羽毛（外侧先画） ---- */
  for (let i = 0; i < feathers.length; i++){
    drawFeather(feathers[i], t);
  }

  /* ---- 身体 ---- */
  drawBody(t);

  /* ---- 暗角 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  /* ---- HUD ---- */
  const ob = document.getElementById('openVal');
  if (ob) ob.textContent = (globalOpen * 100).toFixed(0) + '%';

  const sb = document.getElementById('stateBig');
  const se = document.getElementById('stateEn');
  if (sb && se){
    if (isOpen){
      if (globalOpen > 0.86){ sb.textContent = '盛 开'; se.textContent = 'FULL DISPLAY'; }
      else                  { sb.textContent = '开 屏 中'; se.textContent = 'UNFOLDING'; }
    } else {
      if (globalOpen < 0.14){ sb.textContent = '收 拢'; se.textContent = 'FOLDED'; }
      else                  { sb.textContent = '收 合 中'; se.textContent = 'FOLDING'; }
    }
  }

  requestAnimationFrame(frame);
}

/* =========================================================
   交互
   ========================================================= */
function toggle(){
  initAudio();
  isOpen = !isOpen;
  if (isOpen){
    setTimeout(playPeacockCall, 160 + Math.random() * 180);
  }
}

canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  toggle();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    toggle();
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
initFeathers();
computeMetrics();

document.getElementById('fnum').textContent = N_FEATHERS;

requestAnimationFrame(frame);

})();
</script>
