<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>曲面积分 · ∬_S F·dS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:26px 34px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,255,.36);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 40%,#a890ff 72%,#ffb060 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(10px,1.3vw,13px);
    letter-spacing:.12em;
    color:rgba(200,220,255,.58);
  }
  #title .formula .hl1{color:#5ee0ff;}
  #title .formula .hl2{color:#ffb060;}

  #stats{
    position:absolute;top:0;right:0;
    padding:26px 34px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.10em;line-height:2.0;
    color:rgba(170,200,250,.34);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:6px;
  }
  #stats .k{color:rgba(190,205,255,.52);}
  #stats .v{color:rgba(255,215,150,.92);font-weight:600;}
  #stats .vbig{
    font-size:clamp(18px,2.2vw,24px);
    font-weight:300;
    color:rgba(220,240,255,.94);
    display:block;line-height:1;
    margin:6px 0 8px;
    letter-spacing:.04em;
    filter:drop-shadow(0 0 12px rgba(140,200,255,.42));
  }

  #legend{
    position:absolute;bottom:0;left:0;
    padding:0 34px 28px;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #legend .lab{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:10px;
  }
  .legend-item{
    display:flex;align-items:center;gap:10px;
    margin-bottom:6px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.06em;
    color:rgba(190,205,255,.48);
  }
  .legend-bar{
    width:120px;height:6px;border-radius:3px;
    background:linear-gradient(90deg,
      hsl(200,85%,34%),
      hsl(160,90%,44%),
      hsl(90,88%,52%),
      hsl(40,94%,58%),
      hsl(20,92%,52%));
  }
  .legend-tick{
    display:flex;justify-content:space-between;

    margin-top:2px;
  }

  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:14px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,195,240,.32);
    opacity:0;animation:fade 1.6s 1.5s ease forwards;
    white-space:nowrap;
  }

  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 34px 28px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:14px 16px;}
    #title .formula{font-size:10px;}
    #stats{padding:14px 16px;font-size:8.5px;}
    #legend{padding:0 16px 16px;}
    .legend-bar{width:80px;}
    .legend-tick{width:80px;}
    #hint{display:none;}
    #audioDot{padding:0 16px 16px;font-size:8px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">SURFACE INTEGRAL · FLUX</div>
    <h1>曲面积分</h1>
    <div class="formula">
      <span class="hl1">∬_S</span> <span class="hl2">F</span>·d<span class="hl2">S</span>
      &nbsp;=&nbsp; ∬ F·n dS
    </div>
  </div>

  <div id="stats">
    <span class="lab">FLUX THROUGH SURFACE</span>
    <span class="vbig" id="fluxVal">0.000</span>
    <div><span class="k">面元 </span><span class="v" id="cellVal">0 / 0</span></div>
    <div><span class="k">最大密度 </span><span class="v" id="maxDens">1.50</span></div>
    <div><span class="k">状态 </span><span class="v" id="stateVal">构建中</span></div>
  </div>

  <div id="legend">
    <div class="lab">FLUX DENSITY F·n</div>
    <div class="legend-item">
      <span>低</span>
      <span class="legend-bar"></span>
      <span>高</span>
    </div>
    <div class="legend-tick">
      <span>0.5</span>
      <span>1.0</span>
      <span>1.5</span>
    </div>
  </div>

  <div id="hint">拖动旋转 · 滚轮缩放</div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>网格构建 · 流动</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let canvasCX = 0, canvasCY = 0;
let SCALE = 200;

/* 球面 */
const R = 1;

/* 网格细分 */
const U_SEGS = 16;
const V_SEGS = 26;

/* 相机 */
let yaw = 0.55;
let pitch = 0.36;
let camDist = 4.0;
let autoRotate = true;

/* 动画 */
let time = 0;
let gridProgress = 0;   // 0 → 1
let gridDone = false;
let completionPinged = false;

/* 拖拽 */
let dragging = false;
let lastMouseX = 0, lastMouseY = 0;
let dragVX = 0, dragVY = 0;

/* =========================================================
   布局
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  canvasCX = W * 0.5;
  canvasCY = H * 0.5;

  SCALE = Math.min(W, H) * 0.27;
}
window.addEventListener('resize', resize);

/* =========================================================
   3D 投影
   ========================================================= */
function rotatePoint(x, y, z){
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);

  const x1 = x * cy + z * sy;
  const z1 = -x * sy + z * cy;
  const y1 = y;

  const y2 = y1 * cp - z1 * sp;
  const z2 = y1 * sp + z1 * cp;

  return { x: x1, y: y2, z: z2 };
}

function project(x, y, z){
  const v = rotatePoint(x, y, z);
  const s = camDist / Math.max(0.5, camDist - v.z);
  return {
    x: canvasCX + v.x * s * SCALE,
    y: canvasCY - v.y * s * SCALE,
    vz: v.z,
    s: s
  };
}

function rotateNormal(x, y, z){
  return rotatePoint(x, y, z);
}

/* =========================================================
   球面顶点
   ========================================================= */
const verts = [];

function buildVerts(){
  verts.length = 0;
  for (let i = 0; i <= U_SEGS; i++){
    const u = (i / U_SEGS) * Math.PI;
    const su = Math.sin(u);
    const cu = Math.cos(u);
    const row = [];
    for (let j = 0; j <= V_SEGS; j++){
      const v = (j / V_SEGS) * TAU;
      const x = R * su * Math.cos(v);
      const y = R * cu;
      const z = R * su * Math.sin(v);
      row.push({
        x: x, y: y, z: z,
        nx: su * Math.cos(v),
        ny: cu,
        nz: su * Math.sin(v)
      });
    }
    verts.push(row);
  }
}

/* =========================================================
   向量场
   F(x,y,z) = (0.5x, 1.5y, 0.5z)
   在球面上 F·n = 0.5 + y²
   范围 [0.5, 1.5]
   ========================================================= */
function fieldAt(x, y, z){
  return { x: 0.5 * x, y: 1.5 * y, z: 0.5 * z };
}

/* =========================================================
   单元格数据（预计算）
   ========================================================= */
const cellData = [];

function computeCellData(){
  cellData.length = 0;

  let maxDens = 0;
  let minDens = Infinity;

  for (let i = 0; i < U_SEGS; i++){
    const row = [];
    for (let j = 0; j < V_SEGS; j++){
      const p00 = verts[i][j];
      const p01 = verts[i][j + 1];
      const p10 = verts[i + 1][j];
      const p11 = verts[i + 1][j + 1];

      const cx = (p00.x + p01.x + p10.x + p11.x) * 0.25;
      const cy = (p00.y + p01.y + p10.y + p11.y) * 0.25;
      const cz = (p00.z + p01.z + p10.z + p11.z) * 0.25;

      const nl = Math.hypot(cx, cy, cz) || 1;
      const nx = cx / nl, ny = cy / nl, nz = cz / nl;

      const F = fieldAt(cx, cy, cz);
      const density = F.x * nx + F.y * ny + F.z * nz;

      /* 面积元 */
      const uC = (i + 0.5) / U_SEGS * Math.PI;
      const du = Math.PI / U_SEGS;
      const dv = TAU / V_SEGS;
      const dS = R * R * Math.sin(uC) * du * dv;

      if (density > maxDens) maxDens = density;
      if (density < minDens) minDens = density;

      row.push({
        cx: cx, cy: cy, cz: cz,
        nx: nx, ny: ny, nz: nz,
        Fx: F.x, Fy: F.y, Fz: F.z,
        density: density,
        dS: dS,
        flux: density * dS
      });
    }
    cellData.push(row);
  }

  cellMin = minDens;
  cellMax = maxDens;
}

let cellMin = 0.5;
let cellMax = 1.5;

/* =========================================================
   粒子
   ========================================================= */
const particles = [];
const MAX_PARTICLES = 90;

function updateParticles(dt){
  /* 生成 —— 从球心附近向外 */
  if (particles.length < MAX_PARTICLES && Math.random() < 0.55){
    const theta = Math.random() * TAU;
    const phi = Math.acos(Math.random() * 2 - 1);

    particles.push({
      x: 0.05 * Math.sin(phi) * Math.cos(theta),
      y: 0.05 * Math.cos(phi),
      z: 0.05 * Math.sin(phi) * Math.sin(theta),
      age: 0,
      maxAge: 1.8 + Math.random() * 1.2,
      hue: 190 + Math.random() * 40,
      size: 1.2 + Math.random() * 1.6
    });
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    const F = fieldAt(p.x, p.y, p.z);

    const speed = 1.15;
    p.x += F.x * speed * dt;
    p.y += F.y * speed * dt;
    p.z += F.z * speed * dt;

    p.age += dt;

    const r = Math.hypot(p.x, p.y, p.z);
    if (p.age > p.maxAge || r > 2.6){
      particles.splice(i, 1);
    }
  }
}

function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const r = Math.hypot(p.x, p.y, p.z);

    /* 只在穿过球面区域可见 */
    const vis = Math.min(1, Math.max(0, 1 - Math.abs(r - 1.0) * 0.7));
    if (vis < 0.05) continue;

    const life = 1 - p.age / p.maxAge;
    const alpha = Math.min(1, life * 1.5) * 0.85;

    const sp = project(p.x, p.y, p.z);
    if (sp.s <= 0.3) continue;

    const sz = p.size * sp.s * 4;

    const g = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, sz * 2.2);
    g.addColorStop(0.00, 'hsla(' + p.hue + ',100%,92%,' + alpha + ')');
    g.addColorStop(0.42, 'hsla(' + p.hue + ',100%,72%,' + (alpha * 0.35) + ')');
    g.addColorStop(1.00, 'hsla(' + p.hue + ',100%,60%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sz * 2.2, 0, TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(){
  const bg = ctx.createRadialGradient(
    canvasCX, canvasCY, 0,
    canvasCX, canvasCY, Math.max(W, H) * 0.85
  );
  bg.addColorStop(0.00, '#0a1224');
  bg.addColorStop(0.42, '#060c1a');
  bg.addColorStop(1.00, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   通量 → 颜色
   ========================================================= */
function fluxColor(density, alpha){
  let t = (density - cellMin) / Math.max(1e-6, cellMax - cellMin);
  t = Math.max(0, Math.min(1, t));

  /* 色相：200（青蓝）→ 20（橙红） */
  const hue = 200 - t * 180;
  const sat = 88;
  const lig = 38 + t * 32;

  return {
    fill: 'hsla(' + hue.toFixed(0) + ',' + sat + '%,' + lig.toFixed(0) + '%,' + alpha + ')',
    stroke: 'hsla(' + hue.toFixed(0) + ',' + sat + '%,' + (lig + 22).toFixed(0) + '%,' + (alpha * 1.35) + ')',
    arrow: 'hsla(' + hue.toFixed(0) + ',100%,' + (78) + '%,0.92)',
    hue: hue,
    t: t
  };
}

/* =========================================================
   绘制：曲面
   ========================================================= */
function drawSurface(){
  const totalCells = U_SEGS * V_SEGS;
  const visibleCount = Math.floor(gridProgress * totalCells);

  /* 构建四边形列表 */
  const quads = [];

  for (let i = 0; i < U_SEGS; i++){
    const iProg = (i + 1) / U_SEGS;
    if (iProg > gridProgress + 0.001 && (i * V_SEGS) > visibleCount) {
      /* 在网格进度之外 */
    }

    for (let j = 0; j < V_SEGS; j++){
      const idx = i * V_SEGS + j;
      if (idx >= visibleCount) continue;

      const p00 = verts[i][j];
      const p01 = verts[i][j + 1];
      const p10 = verts[i + 1][j];
      const p11 = verts[i + 1][j + 1];

      const pr0 = project(p00.x, p00.y, p00.z);
      const pr1 = project(p01.x, p01.y, p01.z);
      const pr2 = project(p11.x, p11.y, p11.z);
      const pr3 = project(p10.x, p10.y, p10.z);

      const depth = (pr0.vz + pr1.vz + pr2.vz + pr3.vz) * 0.25;

      const data = cellData[i][j];
      const nv = rotateNormal(data.nx, data.ny, data.nz);

      quads.push({
        pr: [pr0, pr1, pr2, pr3],
        depth: depth,
        data: data,
        visible: nv.z > 0,
        frontFace: nv.z,
        i: i, j: j
      });
    }
  }

  /* 从远到近排序 */
  quads.sort(function(a, b){ return a.depth - b.depth; });

  /* 先绘制背面（透视） */
  ctx.lineJoin = 'round';

  for (let k = 0; k < quads.length; k++){
    const q = quads[k];
    if (q.visible) continue;
    drawQuadFace(q, true);
  }

  /* 绘制正面 */
  for (let k = 0; k < quads.length; k++){
    const q = quads[k];
    if (!q.visible) continue;
    drawQuadFace(q, false);
  }

  /* 正面法向量 */
  drawNormalVectors(quads, visibleCount);

  return visibleCount;
}

function drawQuadFace(q, isBack){
  const pr = q.pr;
  const data = q.data;

  const alpha = isBack ? 0.09 : (0.30 + q.data.density * 0.28);
  const col = fluxColor(data.density, alpha);

  /* 填充 */
  ctx.beginPath();
  ctx.moveTo(pr[0].x, pr[0].y);
  ctx.lineTo(pr[1].x, pr[1].y);
  ctx.lineTo(pr[2].x, pr[2].y);
  ctx.lineTo(pr[3].x, pr[3].y);
  ctx.closePath();

  ctx.fillStyle = col.fill;
  ctx.fill();

  /* 边框 */
  ctx.strokeStyle = col.stroke;
  ctx.lineWidth = isBack ? 0.5 : 0.9;
  ctx.stroke();
}

/* =========================================================
   绘制：法向量
   ========================================================= */
function drawNormalVectors(quads, visibleCount){
  const STEP = 2;
  const now = time;

  for (let i = 0; i < U_SEGS; i += STEP){
    for (let j = 0; j < V_SEGS; j += STEP){
      const idx = i * V_SEGS + j;
      if (idx >= visibleCount) continue;

      const data = cellData[i][j];
      const nv = rotateNormal(data.nx, data.ny, data.nz);
      if (nv.z < 0.12) continue;

      /* 法向量长度按通量大小 */
      const t = (data.density - cellMin) / Math.max(1e-6, cellMax - cellMin);
      const len = 0.14 + t * 0.20;

      /* 随时间脉动 */
      const pulse = 1 + 0.15 * Math.sin(now * 2.4 + i * 0.5 + j * 0.7);

      const cx = data.cx, cy = data.cy, cz = data.cz;
      const ex = cx + data.nx * len * pulse;
      const ey = cy + data.ny * len * pulse;
      const ez = cz + data.nz * len * pulse;

      const p1 = project(cx, cy, cz);
      const p2 = project(ex, ey, ez);

      const col = fluxColor(data.density, 1);

      /* 光线 */
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = 'hsla(' + col.hue.toFixed(0) + ',100%,78%,0.88)';
      ctx.lineWidth = 1.4;
      ctx.lineCap = 'round';
      ctx.stroke();

      /* 箭头 */
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const dl = Math.hypot(dx, dy);
      if (dl > 3){
        const ux = dx / dl;
        const uy = dy / dl;
        const hs = Math.min(5.5, dl * 0.45);

        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p2.x - ux * hs + uy * hs * 0.55, p2.y - uy * hs - ux * hs * 0.55);
        ctx.lineTo(p2.x - ux * hs - uy * hs * 0.55, p2.y - uy * hs + ux * hs * 0.55);
        ctx.closePath();
        ctx.fillStyle = 'hsla(' + col.hue.toFixed(0) + ',100%,82%,0.92)';
        ctx.fill();
      }

      /* 端点光点 */
      ctx.beginPath();
      ctx.arc(p2.x, p2.y, 1.8, 0, TAU);
      ctx.fillStyle = 'hsla(' + col.hue.toFixed(0) + ',100%,90%,0.94)';
      ctx.fill();
    }
  }
}

/* =========================================================
   总通量显示
   ========================================================= */
let totalFlux = 0;

function computeTotalFlux(visibleCount){
  let sum = 0;
  let count = 0;
  for (let i = 0; i < U_SEGS; i++){
    for (let j = 0; j < V_SEGS; j++){
      const idx = i * V_SEGS + j;
      if (idx >= visibleCount) continue;
      sum += cellData[i][j].flux;
      count++;
    }
  }
  return { flux: sum, count: count };
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let flowGain = null;
let flowFilter = null;
let audioReady = false;
let buildLastPing = 0;
let lastGrowthIdx = 0;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.42, ac.currentTime, 1.6);

  /* 流动声：带通噪声 */
  const bufLen = Math.floor(ac.sampleRate * 3);
  const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  flowFilter = ac.createBiquadFilter();
  flowFilter.type = 'bandpass';
  flowFilter.frequency.value = 680;
  flowFilter.Q.value = 1.6;

  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 140;

  flowGain = ac.createGain();
  flowGain.gain.value = 0;

  src.connect(flowFilter);
  flowFilter.connect(hp);
  hp.connect(flowGain);
  flowGain.connect(master);
  src.start();

  flowGain.gain.setTargetAtTime(0.022, ac.currentTime, 2.4);

  /* 缓慢的滤波摆动 */
  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.13;
  const lfoG = ac.createGain();
  lfoG.gain.value = 320;
  lfo.connect(lfoG);
  lfoG.connect(flowFilter.frequency);
  lfo.start();

  const lfo2 = ac.createOscillator();
  lfo2.frequency.value = 0.07;
  const lfo2G = ac.createGain();
  lfo2G.gain.value = 0.010;
  lfo2.connect(lfo2G);
  lfo2G.connect(flowGain.gain);
  lfo2.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* 网格构建脉冲音 */
function playBuildPing(i){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  if (now - buildLastPing < 0.055) return;
  buildLastPing = now;

  const t = i / U_SEGS;
  const freq = 520 + t * 720 + Math.random() * 80;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.72, now + 0.055);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.016, now + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.075);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.09);
}

/* 完成音效 */
function playCompleteChime(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [523.25, 659.25, 783.99, 1046.50];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.07;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.038, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.4);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.5);

    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = notes[i] * 2;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.03);
    g2.gain.linearRampToValueAtTime(0.012, t0 + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0);
    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.03);
    osc2.stop(t0 + 1.1);
  }
}

/* =========================================================
   UI
   ========================================================= */
let uiTick = 0;

function updateUI(visibleCount){
  uiTick++;
  if (uiTick % 4 !== 0) return;

  const res = computeTotalFlux(visibleCount);

  const fv = document.getElementById('fluxVal');
  const cv = document.getElementById('cellVal');
  const md = document.getElementById('maxDens');
  const sv = document.getElementById('stateVal');

  if (fv) fv.textContent = res.flux.toFixed(4);
  if (cv) cv.textContent = res.count + ' / ' + (U_SEGS * V_SEGS);
  if (md) md.textContent = cellMax.toFixed(3);

  if (sv){
    if (!gridDone){
      sv.textContent = '构建中 ' + Math.round(gridProgress * 100) + '%';
    } else if (Math.abs(res.flux - 4 * Math.PI * 0.767) < 0.15){
      sv.textContent = '收敛稳定';
    } else {
      sv.textContent = '完成';
    }
  }
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  time += dt;

  /* 自动旋转 */
  if (autoRotate && !dragging){
    yaw += dt * 0.22;
  }

  /* 拖拽惯性 */
  if (!dragging){
    yaw += dragVX * dt;
    pitch += dragVY * dt;
    dragVX *= Math.exp(-3 * dt);
    dragVY *= Math.exp(-3 * dt);
    if (pitch > 1.3) pitch = 1.3;
    if (pitch < -1.3) pitch = -1.3;
  }

  /* 网格生长 */
  if (!gridDone){
    gridProgress += dt * 0.42;
    if (gridProgress >= 1){
      gridProgress = 1;
      gridDone = true;
      if (!completionPinged){
        completionPinged = true;
        playCompleteChime();
      }
    }
  }

  /* 网格构建音：随生长进度触发 */
  const totalCells = U_SEGS * V_SEGS;
  const visibleCount = Math.floor(gridProgress * totalCells);

  if (!gridDone && visibleCount > lastGrowthIdx){
    /* 每 8 个格子触发一次 */
    const delta = visibleCount - lastGrowthIdx;
    if (delta > 0){
      const iAvg = Math.floor(lastGrowthIdx / V_SEGS);
      playBuildPing(Math.min(U_SEGS, iAvg));
    }
    lastGrowthIdx = visibleCount;
  }

  /* 粒子 */
  updateParticles(dt);

  /* 绘制 */
  drawBackground();

  const vc = drawSurface();
  drawParticles();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    canvasCX, canvasCY, Math.min(W, H) * 0.34,
    canvasCX, canvasCY, Math.max(W, H) * 0.85
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  updateUI(vc);
}

/* =========================================================
   交互
   ========================================================= */
canvas.addEventListener('pointerdown', function(e){
  initAudio();
  dragging = true;
  autoRotate = false;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  dragVX = 0;
  dragVY = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
});

canvas.addEventListener('pointermove', function(e){
  if (!dragging) return;

  const dx = e.clientX - lastMouseX;
  const dy = e.clientY - lastMouseY;

  yaw += dx * 0.008;
  pitch += dy * 0.006;
  if (pitch > 1.3) pitch = 1.3;
  if (pitch < -1.3) pitch = -1.3;

  dragVX = dx * 0.16;
  dragVY = dy * 0.12;

  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
});

function endDrag(e){
  dragging = false;
  if (e && e.pointerId !== undefined){
    try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
  }
  /* 5 秒后恢复自动旋转 */
  setTimeout(function(){
    if (!dragging) autoRotate = true;
  }, 3000);
}

canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* 滚轮缩放 */
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  initAudio();

  camDist += e.deltaY * 0.0035;
  if (camDist < 2.6) camDist = 2.6;
  if (camDist > 7.5) camDist = 7.5;
}, { passive: false });

/* 键盘 */
window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    /* 重置 */
    gridProgress = 0;
    gridDone = false;
    completionPinged = false;
    lastGrowthIdx = 0;
    particles.length = 0;
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    yaw = 0.55;
    pitch = 0.36;
    camDist = 4.0;
    autoRotate = true;
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
buildVerts();
computeCellData();
requestAnimationFrame(loop);

})();
</script>
