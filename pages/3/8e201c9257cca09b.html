<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斯托克斯沉降 · 颗粒终端沉降速度</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#01030a;
    font-family:"SF Mono",Consolas,"Courier New",monospace;cursor:crosshair}
  canvas{display:block;position:fixed;inset:0}

  .hud{
    position:fixed;z-index:10;pointer-events:none;
    font-size:12px;letter-spacing:.4px;line-height:2.0;
    color:#7fe8ff;
    text-shadow:0 0 10px rgba(0,200,255,.75),0 0 26px rgba(90,60,255,.35);
  }
  .hud .or{color:#ffc46b;text-shadow:0 0 10px rgba(255,160,50,.85)}
  .hud .pp{color:#c9a8ff;text-shadow:0 0 10px rgba(160,90,255,.85)}
  .hud .wh{color:#f0f8ff;text-shadow:0 0 12px rgba(220,240,255,.9)}
  .hud .gr{color:#8effb4;text-shadow:0 0 10px rgba(80,255,150,.85)}
  .hud .dim{color:#4a6a88;font-size:11px;text-shadow:none}
  .tl{top:16px;left:20px}
  .tr{top:16px;right:20px;text-align:right}
  .bl{bottom:18px;left:20px}
  .br{bottom:18px;right:20px;text-align:right}

  .ctrl{
    position:fixed;z-index:12;bottom:26px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
    font-size:10.5px;letter-spacing:1.2px;color:#7fe8ff;
    text-shadow:0 0 10px rgba(0,200,255,.8);
    background:rgba(4,12,24,.68);
    border:1px solid rgba(80,200,255,.22);
    border-radius:24px;padding:9px 20px;
    backdrop-filter:blur(9px);
    box-shadow:0 0 30px rgba(0,120,255,.12);
    max-width:min(720px,94vw);
  }
  .ctrl input[type=range]{
    -webkit-appearance:none;appearance:none;width:160px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,#0a2030,#0aa8e0,#ffb04a);
    outline:none;cursor:pointer;
  }
  .ctrl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fef4e0;border:1px solid rgba(255,255,255,.8);
    box-shadow:0 0 12px #ffb040,0 0 24px #00d5ff;cursor:pointer;
  }
  .ctrl input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border:none;border-radius:50%;background:#fef4e0;
    box-shadow:0 0 12px #ffb040;cursor:pointer;
  }
  .cv{color:#f0f8ff;min-width:56px;display:inline-block;text-align:right}

  .med{
    display:flex;gap:3px;padding:3px;
    background:rgba(0,0,0,.30);
    border:1px solid rgba(80,200,255,.16);
    border-radius:16px;
  }
  .med button{
    font-family:inherit;font-size:9.5px;letter-spacing:1.2px;
    color:#5fc8ff;background:transparent;border:none;
    border-radius:13px;padding:4px 11px;cursor:pointer;
    transition:all .22s;
    text-shadow:0 0 8px rgba(0,190,255,.6);
  }
  .med button:hover{color:#aef0ff}
  .med button.on{
    color:#fff;
    background:linear-gradient(135deg,rgba(0,120,220,.45),rgba(200,120,40,.45));
    text-shadow:0 0 12px rgba(180,240,255,.95);
  }

  .hint{
    position:fixed;z-index:10;bottom:88px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:2.4px;color:#3d5f78;
    text-shadow:0 0 10px rgba(0,170,255,.35);
    pointer-events:none;
  }

  @keyframes blink{
    0%,100%{opacity:.35}
    50%{opacity:1}
  }
  .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#7fe8ff;box-shadow:0 0 10px #00c8ff;
    margin-right:6px;vertical-align:middle;
    animation:blink 1.5s ease-in-out infinite;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud tl">
  <div>m·g = F<sub>d</sub> + F<sub>b</sub></div>
  <div>u<sub>t</sub> = d<sub>p</sub>²(ρ<sub>p</sub>−ρ<sub>f</sub>)g / 18μ</div>
  <div>F<sub>d</sub> = 3πμd<sub>p</sub>u<sub>t</sub></div>
  <div class="dim">斯托克斯沉降 · 终端速度</div>
</div>

<div class="hud tr">
  <div>ρ<sub>p</sub> = <span class="wh">2650</span> kg/m³</div>
  <div>ρ<sub>f</sub> = <span class="wh" id="rhof">1000</span> kg/m³</div>
  <div>μ = <span class="pp" id="muHud">1.0e-3</span> Pa·s</div>
  <div>Re = <span class="gr" id="reHud">0.000</span> <span class="dim">&lt;&lt; 1</span></div>
</div>

<div class="hud bl">
  <div>d<sub>p</sub> = <span class="wh" id="dpHud">58.0</span> μm</div>
  <div>u<sub>t</sub> = <span class="or" id="utHud">0.000e+0</span> m/s</div>
  <div class="dim"><span class="dot"></span>斯托克斯区 · 层流绕流</div>
</div>

<div class="hud br">
  <div>沉降 50 cm ≈ <span class="wh" id="tHud">--</span></div>
  <div>颗粒数 <span class="pp" id="nP">0</span></div>
  <div class="dim" id="medName">介质 · 水</div>
</div>

<div class="ctrl">
  <span>d<sub>p</sub></span>
  <input type="range" id="dpSlider" min="10" max="160" step="0.5" value="58">
  <span class="cv" id="dpVal">58.0 μm</span>
  <div class="med">
    <button id="mb0" class="on">水</button>
    <button id="mb1">油</button>
    <button id="mb2">空气</button>
  </div>
</div>

<div class="hint">点击水体发射颗粒 · 单击颗粒追踪沉速</div>

<script>
(function(){
"use strict";

/* ============================================================
   基础
============================================================ */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
const TAU = Math.PI * 2;
const CYCLE = 30;

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rand  = (a,b)=> a + Math.random()*(b-a);

/* ============================================================
   物理
============================================================ */
const RHO_P = 2650;
const G_ACC = 9.81;

const MEDIA = [
  { name:'水', rho_f:1000, mu:1.0e-3,
    c1:'#04202f', c2:'#0a4f70', c3:'#128ab0',
    accent:'#5fd8ff', glow:'#28a8ff', particleGlow:'#ffd070' },
  { name:'油', rho_f:850,  mu:5.0e-2,
    c1:'#2a1c06', c2:'#5a3c10', c3:'#9a6820',
    accent:'#ffc86b', glow:'#ffa030', particleGlow:'#ffe090' },
  { name:'空气', rho_f:1.2, mu:1.8e-5,
    c1:'#160c2e', c2:'#33205c', c3:'#5a3a90',
    accent:'#c9a8ff', glow:'#9a5aff', particleGlow:'#ffd8a0' }
];
let mi = 0;

let dp = 58;    // μm

function stokesVel(dUm, medium){
  const m = medium || MEDIA[mi];
  const d = dUm * 1e-6;
  return d*d*(RHO_P - m.rho_f)*G_ACC / (18*m.mu);
}

function reynolds(dUm, ut, medium){
  const m = medium || MEDIA[mi];
  const d = dUm * 1e-6;
  return m.rho_f * ut * d / m.mu;
}

/* 视觉速度（屏幕高度比例 / 秒）—— 对数压缩保留幂律趋势 */
function visualSpeed(ut){
  const lu = Math.log10(Math.max(ut, 1e-8));
  const t = clamp((lu + 4.6) / 4.6, 0, 1);
  return 0.048 + t * 0.42;
}

/* ============================================================
   画布
============================================================ */
let W=0, H=0, DPR=1;
let colX=0, colY=0, colW=0, colH=0, colBottom=0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.floor(W*DPR);
  cv.height = Math.floor(H*DPR);
  cv.style.width  = W+'px';
  cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  colW = Math.min(W*0.28, 268);
  colH = Math.min(H*0.74, 700);
  colX = W*0.5 - colW*0.5;
  colY = H*0.5 - colH*0.5;
  colBottom = colY + colH;
}

/* ============================================================
   堆积层
============================================================ */
const NBINS = 56;
let stackH = new Float32Array(NBINS);

function resetStack(){
  stackH.fill(0);
}

function stackAt(x){
  const t = clamp((x - colX)/colW, 0, 0.99999);
  const f = t * (NBINS-1);
  const i0 = Math.floor(f);
  const i1 = Math.min(NBINS-1, i0+1);
  const k  = f - i0;
  return stackH[i0]*(1-k) + stackH[i1]*k;
}

function addToStack(x, amount){
  const t = clamp((x - colX)/colW, 0, 0.99999);
  const i = Math.floor(t * NBINS);
  stackH[i] += amount;
  if (i > 0)        stackH[i-1] += amount*0.38;
  if (i < NBINS-1)  stackH[i+1] += amount*0.38;
  if (i > 1)        stackH[i-2] += amount*0.12;
  if (i < NBINS-2)  stackH[i+2] += amount*0.12;
  /* 限制最大高度 */
  for (let k=0;k<NBINS;k++){
    if (stackH[k] > colH*0.34) stackH[k] = colH*0.34;
  }
}

function smoothStack(){
  const tmp = stackH.slice();
  for (let i=1;i<NBINS-1;i++){
    stackH[i] = tmp[i]*0.62 + (tmp[i-1]+tmp[i+1])*0.19;
  }
}

/* ============================================================
   粒子
============================================================ */
const particles = [];
const MAX_P = 900;
const TRAIL_LEN = 16;

let tracked = null;

function spawnParticle(x, y, dUm){
  if (particles.length >= MAX_P) particles.shift();

  /* 高斯分布，集中于柱中心 */
  let rx = 0;
  for (let k=0;k<4;k++) rx += (Math.random()-0.5)*2;
  rx /= 4;

  const px = clamp(
    (x === undefined) ? colX + colW*0.5 + rx*colW*0.46 : x,
    colX + 6, colX + colW - 6
  );
  const py = (y === undefined) ? colY + rand(2, 12) : y;

  const ut = stokesVel(dUm);
  const vs = visualSpeed(ut);

  particles.push({
    x: px, y: py,
    d: dUm,
    ut: ut,
    v: vs,                 // 屏幕高度比例 / 秒
    vy: 0,
    size: clamp(1.6 + dUm/34, 1.8, 5.2),
    hue: 32 + Math.random()*26,
    wob: Math.random()*TAU,
    wobA: rand(0.25, 0.85),
    wobF: rand(1.6, 3.4),
    trail: [],
    settled: false,
    spawnT: t
  });
}

function resetParticles(){
  particles.length = 0;
  tracked = null;
  resetStack();
}

/* ============================================================
   更新
============================================================ */
function updateParticles(dt){
  const med = MEDIA[mi];
  const floorBase = colBottom;

  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];

    if (p.settled){
      /* 已沉降 —— 轻微抖动后静止 */
      p.wob += dt*0.5;
      continue;
    }

    /* 终端速度加速逼近（τ 很短，视觉上几乎立即） */
    const targetV = p.v * H;
    p.vy += (targetV - p.vy) * Math.min(1, dt*7.5);
    p.y += p.vy * dt;

    /* 横向微摆（模拟绕流涡动） */
    p.wob += dt * p.wobF;
    p.x += Math.sin(p.wob) * p.wobA * dt * 18;
    p.x = clamp(p.x, colX + 4, colX + colW - 4);

    /* 记录拖尾 */
    p.trail.push(p.x, p.y);
    if (p.trail.length > TRAIL_LEN*2) p.trail.splice(0, 2);

    /* 落地判定 */
    const stackTop = floorBase - stackAt(p.x);
    if (p.y + p.size >= stackTop){
      p.y = stackTop - p.size;
      p.settled = true;
      p.vy = 0;
      addToStack(p.x, p.size*0.55 + 0.6);
    }
  }

  smoothStack();
}

/* ============================================================
   绘制
============================================================ */
let t = 0;

function drawBG(){
  const g = ctx.createRadialGradient(W*0.5, H*0.46, 0,
                                     W*0.5, H*0.5, Math.max(W,H)*0.85);
  g.addColorStop(0,   '#050c18');
  g.addColorStop(0.5, '#02050c');
  g.addColorStop(1,   '#010104');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  /* 星尘 */
  ctx.globalCompositeOperation = 'lighter';
  const n = Math.floor(W*H/30000);
  for (let i=0;i<n;i++){
    const sx = (i*137.51 + t*2.4) % W;
    const sy = (i*91.73  + t*1.6) % H;
    const a = 0.02 + 0.045*Math.abs(Math.sin(i*1.9 + t*0.45));
    ctx.fillStyle = 'rgba(120,180,255,'+a.toFixed(3)+')';
    ctx.fillRect(sx, sy, 1.2, 1.2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawColumn(){
  const med = MEDIA[mi];

  /* 柱体渐变水体 */
  const g = ctx.createLinearGradient(0, colY, 0, colBottom);
  g.addColorStop(0,    med.c3);
  g.addColorStop(0.38, med.c2);
  g.addColorStop(0.80, med.c1);
  g.addColorStop(1,    '#010306');
  ctx.fillStyle = g;
  ctx.fillRect(colX, colY, colW, colH);

  /* 体积光柱 */
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createLinearGradient(colX, 0, colX+colW, 0);
  gl.addColorStop(0,    'rgba(0,0,0,0)');
  gl.addColorStop(0.30, 'rgba(255,255,255,0.020)');
  gl.addColorStop(0.50, 'rgba(255,255,255,0.045)');
  gl.addColorStop(0.70, 'rgba(255,255,255,0.020)');
  gl.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = gl;
  ctx.fillRect(colX, colY, colW, colH);

  /* 深度刻度线 */
  ctx.strokeStyle = 'rgba(140,220,255,0.10)';
  ctx.lineWidth = 1;
  for (let k=1;k<10;k++){
    const yy = colY + colH*k/10;
    const len = (k%5===0) ? 18 : 9;
    ctx.beginPath();
    ctx.moveTo(colX, yy); ctx.lineTo(colX+len, yy);
    ctx.moveTo(colX+colW, yy); ctx.lineTo(colX+colW-len, yy);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawWaterSurface(){
  const med = MEDIA[mi];
  const n = 32;

  ctx.globalCompositeOperation = 'lighter';

  /* 波动水面 */
  ctx.beginPath();
  ctx.moveTo(colX, colY);
  for (let i=0;i<=n;i++){
    const x = colX + colW*i/n;
    const y = colY + Math.sin(i*0.55 + t*1.6) * 2.6
                    + Math.sin(i*1.15 - t*2.1) * 1.4;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(colX+colW, colY-8);
  ctx.lineTo(colX, colY-8);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, colY-8, 0, colY+6);
  g.addColorStop(0, 'rgba(255,255,255,0.02)');
  g.addColorStop(1, 'rgba(160,230,255,0.16)');
  ctx.fillStyle = g;
  ctx.fill();

  /* 水面辉线 */
  ctx.beginPath();
  for (let i=0;i<=n;i++){
    const x = colX + colW*i/n;
    const y = colY + Math.sin(i*0.55 + t*1.6) * 2.6
                    + Math.sin(i*1.15 - t*2.1) * 1.4;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = 'rgba(190,245,255,0.42)';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';
}

function drawStack(){
  const med = MEDIA[mi];

  let any = false;
  for (let i=0;i<NBINS;i++){ if (stackH[i] > 0.3){ any = true; break; } }
  if (!any) return;

  ctx.beginPath();
  ctx.moveTo(colX, colBottom);
  for (let i=0;i<NBINS;i++){
    const x = colX + colW*(i+0.5)/NBINS;
    ctx.lineTo(x, colBottom - stackH[i]);
  }
  ctx.lineTo(colX+colW, colBottom);
  ctx.closePath();

  const g = ctx.createLinearGradient(0, colBottom - colH*0.35, 0, colBottom);
  g.addColorStop(0,   'rgba(255,200,110,0.32)');
  g.addColorStop(0.4, 'rgba(210,140,60,0.48)');
  g.addColorStop(1,   'rgba(120,70,26,0.62)');
  ctx.fillStyle = g;
  ctx.fill();

  /* 顶部亮边 */
  ctx.beginPath();
  for (let i=0;i<NBINS;i++){
    const x = colX + colW*(i+0.5)/NBINS;
    const y = colBottom - stackH[i];
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = 'rgba(255,224,160,0.55)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* 辉光 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  for (let i=0;i<NBINS;i++){
    const x = colX + colW*(i+0.5)/NBINS;
    const y = colBottom - stackH[i];
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = 'rgba(255,190,90,0.16)';
  ctx.lineWidth = 7;
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function drawParticles(){
  const med = MEDIA[mi];

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i=0;i<particles.length;i++){
    const p = particles[i];

    /* --- 拖尾 --- */
    const tr = p.trail;
    const n = tr.length/2;
    if (n > 2){
      for (let k=1;k<n;k++){
        const a = k/n;
        const x1 = tr[(k-1)*2],   y1 = tr[(k-1)*2+1];
        const x2 = tr[k*2],       y2 = tr[k*2+1];
        const alpha = a*a*0.55*(p.settled ? 0.25 : 1);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = 'hsla('+p.hue.toFixed(0)+',96%,66%,'+alpha.toFixed(3)+')';
        ctx.lineWidth = 0.6 + a*1.3;
        ctx.stroke();
      }
    }

    /* --- 颗粒主体 --- */
    const isTracked = (p === tracked);
    const R = p.size * (isTracked ? 1.6 : 1);

    /* 外辉光 */
    const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R*4.6);
    gg.addColorStop(0,   'hsla('+p.hue.toFixed(0)+',100%,72%,'+(isTracked?0.36:0.20)+')');
    gg.addColorStop(0.5, 'hsla('+p.hue.toFixed(0)+',100%,60%,0.055)');
    gg.addColorStop(1,   'hsla('+p.hue.toFixed(0)+',100%,50%,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, R*4.6, 0, TAU);
    ctx.fill();

    /* 内核 */
    const cg = ctx.createRadialGradient(
      p.x - R*0.28, p.y - R*0.28, 0,
      p.x, p.y, R
    );
    cg.addColorStop(0,   '#fffaf0');
    cg.addColorStop(0.45,'hsl('+p.hue.toFixed(0)+',96%,74%)');
    cg.addColorStop(1,   'hsl('+p.hue.toFixed(0)+',90%,50%)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, R, 0, TAU);
    ctx.fill();

    /* 追踪标记 */
    if (isTracked){
      ctx.beginPath();
      ctx.arc(p.x, p.y, R + 9 + Math.sin(t*6)*2, 0, TAU);
      ctx.strokeStyle = 'rgba(160,245,255,0.85)';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(p.x, p.y, R + 17, 0, TAU);
      ctx.strokeStyle = 'rgba(255,200,110,0.30)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  ctx.globalCompositeOperation = 'source-over';
}

function drawColumnWalls(){
  const med = MEDIA[mi];

  /* 外发光 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = hexA(med.accent, 0.14);
  ctx.lineWidth = 8;
  ctx.strokeRect(colX+2, colY, colW-4, colH);

  /* 内亮边 */
  ctx.strokeStyle = hexA(med.accent, 0.55);
  ctx.lineWidth = 1.3;
  ctx.strokeRect(colX+0.5, colY+0.5, colW-1, colH-1);

  ctx.globalCompositeOperation = 'source-over';
}

function hexA(hex, a){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

/* ============================================================
   追踪面板
============================================================ */
function drawTrackPanel(){
  if (!tracked || tracked.settled) {
    if (tracked && tracked.settled) tracked = null;
    return;
  }

  const p = tracked;
  const panelW = 152, panelH = 96;
  let px = colX + colW + 22;
  let py = clamp(p.y - panelH*0.5, 20, H - panelH - 20);
  if (px + panelW > W - 14) px = colX - panelW - 22;

  ctx.fillStyle = 'rgba(3,12,24,0.86)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(px, py, panelW, panelH, 8);
  else ctx.rect(px, py, panelW, panelH);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,200,255,0.36)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 连线 */
  ctx.beginPath();
  ctx.moveTo(p.x + (px > colX ? p.size+4 : -p.size-4), p.y);
  ctx.lineTo(px > colX ? px : px + panelW, py + panelH*0.5);
  ctx.strokeStyle = 'rgba(120,220,255,0.35)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,3]);
  ctx.stroke();
  ctx.setLineDash([]);

  const measV = Math.abs(p.vy) / H;    // 屏幕比例/秒
  const theoV = p.v;
  const errPct = theoV > 1e-6 ? ((measV - theoV)/theoV*100) : 0;

  ctx.font = '9.5px "SF Mono",Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(150,225,255,0.92)';
  ctx.fillText('颗粒追踪', px+10, py+16);

  ctx.fillStyle = 'rgba(190,235,255,0.78)';
  ctx.fillText('d_p = ' + p.d.toFixed(1) + ' μm', px+10, py+32);
  ctx.fillText('u_t 理论 = ' + p.ut.toExponential(2), px+10, py+47);

  ctx.fillStyle = 'rgba(255,205,120,0.92)';
  ctx.fillText('u 实测 ≈ ' + (measV*1000).toFixed(3) + ' mm/s', px+10, py+62);

  ctx.fillStyle = Math.abs(errPct) < 6
    ? 'rgba(140,255,180,0.88)'
    : 'rgba(255,150,140,0.88)';
  ctx.fillText('误差 ' + (errPct>=0?'+':'') + errPct.toFixed(1) + ' %', px+10, py+77);

  ctx.fillStyle = 'rgba(160,150,255,0.75)';
  ctx.fillText('Re = ' + reynolds(p.d, p.ut).toExponential(2), px+10, py+91);
  ctx.textAlign = 'start';
}

/* ============================================================
   主循环
============================================================ */
let last = 0;

function loop(ts){
  requestAnimationFrame(loop);

  if (!last){ last = ts; return; }
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  t += dt;

  /* 30 秒循环重置 */
  if (t >= CYCLE){
    t -= CYCLE;
    resetParticles();
    autoEmit(10);
  }

  /* 自动发射（少量维持画面活跃） */
  autoEmitAcc += dt;
  if (autoEmitAcc > 0.65){
    autoEmitAcc = 0;
    if (particles.length < MAX_P - 4) autoEmit(1);
  }

  updateParticles(dt);

  /* ---- 渲染 ---- */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  drawBG();
  drawColumn();
  drawStack();
  drawParticles();
  drawWaterSurface();
  drawColumnWalls();
  drawTrackPanel();

  /* 暗角 */
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.30,
                                      W/2, H/2, Math.max(W,H)*0.82);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,1,4,0.80)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  /* 循环淡出 */
  if (t > CYCLE - 1.5){
    const a = (t - (CYCLE-1.5)) / 1.5;
    ctx.fillStyle = 'rgba(1,3,8,'+(a*0.94).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }

  updateHUD(dt);
}

let autoEmitAcc = 0;

function autoEmit(n){
  for (let i=0;i<n;i++){
    spawnParticle(undefined, undefined, dp);
  }
}

/* ============================================================
   HUD
============================================================ */
const elRhof = document.getElementById('rhof');
const elMu   = document.getElementById('muHud');
const elRe   = document.getElementById('reHud');
const elDp   = document.getElementById('dpHud');
const elUt   = document.getElementById('utHud');
const elT    = document.getElementById('tHud');
const elNP   = document.getElementById('nP');
const elMed  = document.getElementById('medName');
const elDpVal= document.getElementById('dpVal');

let hudAcc = 0;

function updateHUD(dt){
  hudAcc += dt;
  if (hudAcc < 0.08) return;
  hudAcc = 0;

  const m = MEDIA[mi];
  const ut = stokesVel(dp);
  const Re = reynolds(dp, ut);

  elRhof.textContent = m.rho_f;
  elMu.textContent   = m.mu.toExponential(1);
  elRe.textContent   = Re.toExponential(2);
  elDp.textContent   = dp.toFixed(1);
  elUt.textContent   = ut.toExponential(3);
  elNP.textContent   = particles.length;
  elMed.textContent  = '介质 · ' + m.name;
  elDpVal.textContent= dp.toFixed(1) + ' μm';

  const tSec = 0.5 / Math.max(ut, 1e-12);
  if (tSec < 90) elT.textContent = tSec.toFixed(1) + ' s';
  else if (tSec < 5400) elT.textContent = (tSec/60).toFixed(1) + ' min';
  else elT.textContent = (tSec/3600).toFixed(2) + ' h';
}

/* ============================================================
   交互
============================================================ */
const dpSlider = document.getElementById('dpSlider');

dpSlider.addEventListener('input', function(){
  dp = parseFloat(dpSlider.value);
});

/* 点击水体 —— 发射颗粒 / 追踪颗粒 */
cv.addEventListener('pointerdown', function(e){
  const mx = e.clientX, my = e.clientY;

  /* 先检测是否点中已有颗粒 */
  let hit = null, bestD = 22;
  for (let i=0;i<particles.length;i++){
    const p = particles[i];
    if (p.settled) continue;
    const d = Math.hypot(mx - p.x, my - p.y);
    if (d < bestD){ bestD = d; hit = p; }
  }

  if (hit){
    tracked = hit;
    return;
  }

  /* 在水柱范围内 → 发射 */
  if (mx >= colX && mx <= colX+colW && my >= colY && my <= colBottom){
    spawnParticle(mx, Math.max(my, colY+4), dp);
    if (particles.length > 1){
      spawnParticle(mx + rand(-8,8), Math.max(my, colY+4), dp);
    }
  }
});

/* 介质切换 */
const mb = [0,1,2].map(i=> document.getElementById('mb'+i));

function setMedium(k){
  if (k === mi) return;
  mi = k;
  mb.forEach((b,i)=> b.classList.toggle('on', i===k));
  resetParticles();
  autoEmit(8);
}

mb.forEach((b,i)=> b.addEventListener('click', ()=> setMedium(i)));

window.addEventListener('resize', function(){
  resize();
  resetStack();
});

/* ============================================================
   启动
============================================================ */
function boot(){
  resize();
  resetStack();
  autoEmit(14);
  requestAnimationFrame(loop);
}

boot();

})();
</script>
