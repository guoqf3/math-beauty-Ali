<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>玫瑰曲线 · 自然生长</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #0a0412; color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: crosshair;
  }
  canvas { display: block; position: fixed; inset: 0; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  #title {
    position: absolute; top: 0; left: 0;
    padding: 42px 48px; opacity: 0;
    animation: fade 1.8s 0.3s ease forwards;
  }
  #title .en {
    font-size: 10px; letter-spacing: .52em; text-indent: .52em;
    color: rgba(240, 170, 200, .38); font-weight: 300; margin-bottom: 14px;
  }
  #title h1 {
    font-size: clamp(22px, 3.2vw, 42px);
    font-weight: 200; letter-spacing: .32em; text-indent: .32em;
    background: linear-gradient(96deg, #ffa8c8 0%, #f080b0 38%, #c080e0 72%, #ffd0a0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 14px;
    filter: drop-shadow(0 0 30px rgba(240, 130, 180, .45));
  }
  #title .sub {
    font-size: 11px; letter-spacing: .22em; line-height: 2.0;
    color: rgba(240, 190, 220, .32); font-weight: 300;
  }

  #stats {
    position: absolute; bottom: 0; left: 0;
    padding: 0 48px 42px;
    font-family: "SF Mono", Consolas, Monaco, "Courier New", monospace;
    font-size: 10px; letter-spacing: .14em; line-height: 2.1;
    color: rgba(230, 180, 220, .28);
    opacity: 0; animation: fade 1.8s 1.1s ease forwards;
  }
  #stats .k { color: rgba(220, 180, 255, .52); }
  #stats .v { color: rgba(255, 215, 170, .72); }
  #stats .lab {
    display: block; font-size: 8.5px; letter-spacing: .42em; text-indent: .42em;
    color: rgba(230, 170, 210, .24); margin-bottom: 8px;
  }

  #meter {
    position: absolute; bottom: 0; right: 0;
    padding: 0 48px 42px; text-align: right;
    font-family: "SF Mono", Consolas, Monaco, "Courier New", monospace;
    font-size: 10px; letter-spacing: .14em; line-height: 2.1;
    color: rgba(230, 180, 220, .28);
    opacity: 0; animation: fade 1.8s 1.4s ease forwards;
  }
  #meter .big {
    display: block; font-size: clamp(20px, 2.4vw, 30px);
    font-weight: 200; letter-spacing: .22em;
    color: rgba(255, 200, 220, .85);
    margin-bottom: 2px;
  }
  #meter .en {
    font-size: 9px; letter-spacing: .38em; text-indent: .38em;
    color: rgba(240, 180, 215, .40);
  }

  #audioDot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: rgba(200, 180, 255, .25);
    margin-left: 6px; vertical-align: middle;
    transition: background .4s;
  }
  #audioDot.on {
    background: rgba(150, 240, 180, .9);
    box-shadow: 0 0 8px rgba(150, 240, 180, .8);
  }

  #controls {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: min(480px, 76vw);
    padding-bottom: 42px;
    opacity: 0; animation: fade 1.8s 1.6s ease forwards;
    pointer-events: auto;
  }
  #timeline {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px;
    background: rgba(255, 170, 200, .16);
    border-radius: 2px;
    outline: none; cursor: pointer;
  }
  #timeline::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: hsla(340, 90%, 78%, .95);
    box-shadow: 0 0 14px hsla(340, 90%, 70%, .65);
    cursor: pointer;
    transition: transform .2s;
    border: 1px solid rgba(255, 220, 235, .85);
  }
  #timeline::-webkit-slider-thumb:hover { transform: scale(1.2); }
  #timeline::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: hsla(340, 90%, 78%, .95);
    box-shadow: 0 0 14px hsla(340, 90%, 70%, .65);
    cursor: pointer;
    border: 1px solid rgba(255, 220, 235, .85);
  }

  #hint {
    position: absolute;
    bottom: 14px; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    font-size: 9px; letter-spacing: .32em;
    color: rgba(240, 180, 210, .36);
    opacity: 0; animation: fade 1.8s 2.0s ease forwards;
  }

  @keyframes fade { to { opacity: 1; } }

  @media (max-width: 640px) {
    #title { padding: 22px 22px; }
    #title .sub { font-size: 9.5px; }
    #stats { padding: 0 22px 22px; font-size: 8.5px; }
    #meter { padding: 0 22px 22px; font-size: 8.5px; }
    #controls { padding-bottom: 22px; }
    #hint { font-size: 8px; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">ROSE CURVE · NATURAL GROWTH</div>
    <h1>绽放的玫瑰</h1>
    <div class="sub">
      茎 → 叶 → 花萼 → 花瓣 → 花蕊<br>
      自然生长顺序 · 完整一朵
    </div>
  </div>

  <div id="stats">
    <span class="lab">ROSE ANATOMY</span>
    <div><span class="k">花瓣</span> <span class="v">7 层 · k=5</span></div>
    <div><span class="k">花蕊</span> <span class="v">32 枚雄蕊</span></div>
    <div><span class="k">叶片</span> <span class="v">2 片 · 锯齿缘</span></div>
    <div><span class="k">音频</span> <span class="v">露珠 + 钢琴</span><span id="audioDot"></span></div>
  </div>

  <div id="meter">
    <span class="big" id="stateBig">种 子</span>
    <div class="en" id="stateEn">SEED</div>
    <div style="margin-top:8px;"><span class="k">生长度 </span><span class="v" id="openVal">0%</span></div>
  </div>

  <div id="controls">
    <input type="range" id="timeline" min="0" max="1000" value="0" />
  </div>
  <div id="hint">拖动时间轴 · 控制生长</div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   画布
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, S = 0, DPR = 1;
let flowerX = 0, flowerY = 0, flowerScale = 0;
let groundY = 0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);
  flowerX = W * 0.5;
  flowerY = H * 0.34;
  flowerScale = S * 0.30;
  groundY = H * 1.02;
}
window.addEventListener('resize', resize);

/* =========================================================
   玫瑰曲线参数 —— 延迟 = 该层花瓣开始绽放的进度值
   ========================================================= */
const K = 5;

const LAYERS = [
  { a: 0.19, delay: 0.48, hue: 352, sat: 76, lig: 26, rot: 0.00 },
  { a: 0.32, delay: 0.52, hue: 348, sat: 79, lig: 30, rot: 0.63 },
  { a: 0.46, delay: 0.56, hue: 344, sat: 81, lig: 34, rot: 0.20 },
  { a: 0.62, delay: 0.60, hue: 338, sat: 83, lig: 38, rot: 0.85 },
  { a: 0.79, delay: 0.64, hue: 332, sat: 85, lig: 43, rot: 0.35 },
  { a: 0.92, delay: 0.68, hue: 326, sat: 87, lig: 48, rot: 1.05 },
  { a: 1.00, delay: 0.72, hue: 320, sat: 89, lig: 53, rot: 0.50 }
];
const PETAL_DUR = 0.24;

/* =========================================================
   状态
   ========================================================= */
let progress = 0;
let autoPlay = true;
let autoTime = 0;
let lastTime = 0;

const timeline = document.getElementById('timeline');

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

/* =========================================================
   音频系统（更稳健的启动）
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let audioReady = false;
let audioDot = null;

function setAudioDot(on){
  if (!audioDot) audioDot = document.getElementById('audioDot');
  if (audioDot) audioDot.classList.toggle('on', on);
}

function initAudio(){
  // 已启动：只需确保在运行
  if (audioReady){
    if (audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().then(() => setAudioDot(true)).catch(() => {});
    } else if (audioCtx && audioCtx.state === 'running'){
      setAudioDot(true);
    }
    return;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { audioCtx = new AC(); } catch(e){ return; }
  audioReady = true;

  // 创建 masterGain 立即设好音量
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.62;
  masterGain.connect(audioCtx.destination);

  // 启动 resume，成功后开始播放
  const start = () => {
    setAudioDot(true);
    scheduleDewdrops();
    schedulePiano();
  };

  if (audioCtx.state === 'suspended'){
    audioCtx.resume().then(start).catch(() => {
      // resume 失败：仍然尝试通过后续点击
      audioReady = false;
    });
  } else {
    start();
  }
}

/* ---- 露珠滴落 ---- */
function playDewdrop(){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  const f0 = 1500 + Math.random() * 900;
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f0 * 0.26, now + 0.14);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.034, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 0.18);

  osc.connect(g);
  g.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.22);
}

let dewdropTimer = null;
function scheduleDewdrops(){
  if (dewdropTimer) clearTimeout(dewdropTimer);
  const wait = 1800 + Math.random() * 3200;
  dewdropTimer = setTimeout(function(){
    playDewdrop();
    if (Math.random() < 0.34) setTimeout(playDewdrop, 200 + Math.random() * 280);
    scheduleDewdrops();
  }, wait);
}

/* ---- 柔和钢琴 ---- */
const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

function playPianoNote(freq){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;
  const dur = 2.4 + Math.random() * 1.2;

  const partials = [1, 2, 3, 4, 5];
  const amps = [1, 0.38, 0.17, 0.075, 0.032];

  for (let i = 0; i < partials.length; i++){
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq * partials[i];

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.026 * amps[i], now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur * (1 - i * 0.12));

    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + dur + 0.1);
  }
}

let pianoTimer = null;
function schedulePiano(){
  if (pianoTimer) clearTimeout(pianoTimer);
  const wait = 1500 + Math.random() * 3000;
  pianoTimer = setTimeout(function(){
    playPianoNote(SCALE[Math.floor(Math.random() * SCALE.length)]);
    if (Math.random() < 0.30){
      setTimeout(() => {
        playPianoNote(SCALE[Math.floor(Math.random() * SCALE.length)]);
      }, 280 + Math.random() * 420);
    }
    schedulePiano();
  }, wait);
}

/* =========================================================
   花茎
   ========================================================= */
function drawStem(p, t){
  if (p <= 0) return;

  const eased = 1 - Math.pow(1 - p, 2.5);

  const startY = flowerY + S * 0.020;
  const curY = startY + (groundY - startY) * eased;

  const sway = Math.sin(t * 0.42) * S * 0.005;

  ctx.beginPath();
  ctx.moveTo(flowerX, startY);
  ctx.quadraticCurveTo(
    flowerX + sway * 1.3,
    (startY + curY) * 0.5,
    flowerX + sway * 0.4,
    curY
  );

  const stemW = Math.max(1.8, S * 0.0058) * eased;
  const sg = ctx.createLinearGradient(flowerX - stemW, 0, flowerX + stemW, 0);
  sg.addColorStop(0.00, 'hsla(140, 42%, 16%, 0.95)');
  sg.addColorStop(0.42, 'hsla(136, 46%, 26%, 0.96)');
  sg.addColorStop(0.62, 'hsla(132, 48%, 30%, 0.96)');
  sg.addColorStop(1.00, 'hsla(140, 44%, 18%, 0.95)');
  ctx.strokeStyle = sg;
  ctx.lineWidth = stemW;
  ctx.lineCap = 'round';
  ctx.stroke();

  /* 茎上的细毛 */
  if (eased > 0.15){
    ctx.strokeStyle = 'hsla(120, 40%, 42%, 0.20)';
    ctx.lineWidth = 0.9;
    for (let i = 0; i < 22; i++){
      const u = i / 22;
      const yy = startY + (curY - startY) * u;
      const sw = Math.sin(u * 3 + t * 0.6) * S * 0.002;
      const side = (i % 2) ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(flowerX + sw, yy);
      ctx.lineTo(flowerX + sw + side * S * 0.0055, yy - S * 0.0038);
      ctx.stroke();
    }
  }
}

/* =========================================================
   叶片
   ========================================================= */
function drawLeaf(px, py, angle, length, width, p, t){
  if (p <= 0) return;

  const eased = 1 - Math.pow(1 - p, 2.6);
  const L = length * eased;
  const Wd = width * eased;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);

  ctx.beginPath();
  const N = 44;

  for (let i = 0; i <= N; i++){
    const u = i / N;
    const y = -Math.sin(u * Math.PI) * Wd * (1 - u * 0.35);
    const x = u * L;
    const serr = 1 + Math.sin(u * Math.PI * 11) * 0.10;
    if (i === 0) ctx.moveTo(x, y * serr);
    else ctx.lineTo(x, y * serr);
  }
  for (let i = N; i >= 0; i--){
    const u = i / N;
    const y = Math.sin(u * Math.PI) * Wd * (1 - u * 0.35);
    const x = u * L;
    const serr = 1 + Math.sin(u * Math.PI * 11 + 0.7) * 0.10;
    ctx.lineTo(x, y * serr);
  }
  ctx.closePath();

  const lg = ctx.createLinearGradient(0, 0, L, 0);
  lg.addColorStop(0.00, 'hsla(142, 44%, 14%, 0.96)');
  lg.addColorStop(0.45, 'hsla(136, 48%, 22%, 0.94)');
  lg.addColorStop(0.78, 'hsla(130, 50%, 28%, 0.90)');
  lg.addColorStop(1.00, 'hsla(126, 52%, 34%, 0.82)');
  ctx.fillStyle = lg;
  ctx.fill();

  ctx.strokeStyle = 'hsla(120, 46%, 48%, 0.30)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(L * 0.96, 0);
  ctx.strokeStyle = 'hsla(120, 44%, 52%, 0.45)';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  for (let i = 1; i <= 6; i++){
    const u = i / 7;
    const x = u * L;
    const w = Math.sin(u * Math.PI) * Wd * 0.82;

    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.quadraticCurveTo(x + L * 0.055, -w * 0.5, x + L * 0.12, -w);
    ctx.strokeStyle = 'hsla(120, 42%, 48%, 0.28)';
    ctx.lineWidth = 0.85;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.quadraticCurveTo(x + L * 0.055, w * 0.5, x + L * 0.12, w);
    ctx.stroke();
  }

  const hl = ctx.createRadialGradient(
    L * 0.35, -Wd * 0.28, 0,
    L * 0.35, -Wd * 0.28, L * 0.55
  );
  hl.addColorStop(0.00, 'hsla(140, 90%, 72%, ' + (0.10 * eased) + ')');
  hl.addColorStop(1.00, 'hsla(140, 85%, 55%, 0)');
  ctx.fillStyle = hl;
  ctx.beginPath();
  ctx.ellipse(L * 0.40, -Wd * 0.10, L * 0.40, Wd * 0.55, -0.15, 0, TAU);
  ctx.fill();

  ctx.restore();
}

/* =========================================================
   花萼
   ========================================================= */
function drawSepals(p, t){
  if (p <= 0) return;

  const eased = 1 - Math.pow(1 - p, 2.2);
  const N = 5;
  const baseR = flowerScale * 0.055;

  for (let i = 0; i < N; i++){
    const u = (i - (N - 1) * 0.5) / N;
    const angle = Math.PI * 0.5 + u * 1.2;
    const len = flowerScale * 0.085 * eased;
    const w = flowerScale * 0.020 * eased;

    const ex = flowerX + Math.cos(angle) * len;
    const ey = flowerY + Math.sin(angle) * len;

    const perpX = -Math.sin(angle);
    const perpY =  Math.cos(angle);

    ctx.beginPath();
    ctx.moveTo(flowerX, flowerY + baseR * 0.4);
    ctx.quadraticCurveTo(
      (flowerX + ex) * 0.5 + perpX * w, (flowerY + ey) * 0.5 + perpY * w,
      ex, ey
    );
    ctx.quadraticCurveTo(
      (flowerX + ex) * 0.5 - perpX * w * 0.35, (flowerY + ey) * 0.5 - perpY * w * 0.35,
      flowerX, flowerY + baseR * 0.4
    );
    ctx.closePath();

    const sg = ctx.createLinearGradient(flowerX, flowerY, ex, ey);
    sg.addColorStop(0.00, 'hsla(140, 42%, 18%, 0.92)');
    sg.addColorStop(1.00, 'hsla(130, 46%, 26%, 0.62)');
    ctx.fillStyle = sg;
    ctx.fill();

    ctx.strokeStyle = 'hsla(125, 42%, 42%, 0.28)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
}

/* =========================================================
   花蕊
   ========================================================= */
function drawStamens(p, t){
  if (p <= 0) return;

  const eased = 1 - Math.pow(1 - p, 1.8);
  const N = 32;

  ctx.save();
  ctx.translate(flowerX, flowerY);

  for (let i = 0; i < N; i++){
    const angle = (i / N) * TAU + i * 0.13;
    const len = flowerScale * (0.075 + 0.055 * Math.sin(i * 1.73));
    const wob = Math.sin(t * 1.25 + i * 0.9) * 0.055;

    const ex = Math.cos(angle + wob) * len * eased;
    const ey = Math.sin(angle + wob) * len * eased;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(
      Math.cos(angle) * len * 0.55 * eased,
      Math.sin(angle) * len * 0.55 * eased,
      ex, ey
    );
    ctx.strokeStyle = 'hsla(48, 72%, 68%, ' + (0.55 * eased) + ')';
    ctx.lineWidth = 0.9;
    ctx.lineCap = 'round';
    ctx.stroke();

    const antherR = flowerScale * 0.0105 * eased;
    if (antherR > 0.35){
      ctx.beginPath();
      ctx.arc(ex, ey, antherR * 2.6, 0, TAU);
      const ag = ctx.createRadialGradient(ex, ey, 0, ex, ey, antherR * 2.6);
      ag.addColorStop(0.00, 'hsla(44, 96%, 78%, ' + (0.30 * eased) + ')');
      ag.addColorStop(1.00, 'hsla(38, 92%, 60%, 0)');
      ctx.fillStyle = ag;
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(ex, ey, antherR * 1.5, antherR * 0.95, angle + wob, 0, TAU);
      const bg = ctx.createRadialGradient(
        ex - antherR * 0.4, ey - antherR * 0.4, 0,
        ex, ey, antherR * 1.5
      );
      bg.addColorStop(0.00, 'hsla(50, 96%, 86%, ' + (0.95 * eased) + ')');
      bg.addColorStop(0.60, 'hsla(44, 92%, 66%, ' + (0.90 * eased) + ')');
      bg.addColorStop(1.00, 'hsla(36, 88%, 48%, ' + (0.82 * eased) + ')');
      ctx.fillStyle = bg;
      ctx.fill();
    }
  }

  /* 中心雌蕊 */
  const pistilR = flowerScale * 0.020 * eased;
  if (pistilR > 0.4){
    ctx.beginPath();
    ctx.arc(0, 0, pistilR * 3.2, 0, TAU);
    const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, pistilR * 3.2);
    pg.addColorStop(0.00, 'hsla(50, 96%, 88%, ' + (0.62 * eased) + ')');
    pg.addColorStop(0.42, 'hsla(350, 88%, 62%, ' + (0.18 * eased) + ')');
    pg.addColorStop(1.00, 'hsla(340, 80%, 50%, 0)');
    ctx.fillStyle = pg;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, pistilR, 0, TAU);
    ctx.fillStyle = 'hsla(48, 92%, 74%, ' + (0.95 * eased) + ')';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(-pistilR * 0.3, -pistilR * 0.3, pistilR * 0.4, 0, TAU);
    ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.75 * eased) + ')';
    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   花瓣层
   ========================================================= */
function drawRoseLayer(layer, p, t){
  if (p <= 0) return;

  const eased = 1 - Math.pow(1 - p, 3);
  const A = layer.a * eased;
  const rot = layer.rot * eased;

  const N = 260;
  const pts = [];

  for (let i = 0; i <= N; i++){
    const th = (i / N) * TAU;
    const r = A * Math.cos(K * (th - rot));
    const x = flowerX + r * Math.cos(th) * flowerScale;
    const y = flowerY + r * Math.sin(th) * flowerScale;
    pts.push(x, y);
  }

  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2){
    ctx.lineTo(pts[i], pts[i + 1]);
  }
  ctx.closePath();

  const grad = ctx.createRadialGradient(
    flowerX, flowerY, 0,
    flowerX, flowerY, A * flowerScale + 1
  );
  grad.addColorStop(0.00, 'hsla(' + (layer.hue + 8) + ', ' + layer.sat + '%, '
                          + Math.max(18, layer.lig - 10) + '%, ' + (0.95 * eased) + ')');
  grad.addColorStop(0.60, 'hsla(' + layer.hue + ', ' + layer.sat + '%, '
                          + layer.lig + '%, ' + (0.90 * eased) + ')');
  grad.addColorStop(1.00, 'hsla(' + (layer.hue - 8) + ', ' + layer.sat + '%, '
                          + (layer.lig + 14) + '%, ' + (0.78 * eased) + ')');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = 'hsla(' + (layer.hue + 15) + ', ' + layer.sat + '%, '
                  + (layer.lig + 24) + '%, ' + (0.26 * eased) + ')';
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* =========================================================
   主绘制 —— 自然生长顺序
   ========================================================= */
function draw(t){
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0a0412';
  ctx.fillRect(0, 0, W, H);

  /* 背景光晕 */
  const bgGlow = ctx.createRadialGradient(
    flowerX, flowerY, 0,
    flowerX, flowerY, S * 0.62
  );
  bgGlow.addColorStop(0.00, 'hsla(340, 75%, 28%, 0.14)');
  bgGlow.addColorStop(0.42, 'hsla(330, 65%, 22%, 0.050)');
  bgGlow.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = bgGlow;
  ctx.fillRect(0, 0, W, H);

  /* ========== 生长时间线 ==========
     茎:    0.00 → 0.32
     叶 1:  0.24 → 0.48
     叶 2:  0.32 → 0.56
     花萼:  0.42 → 0.56
     花瓣:  0.48 → 0.96（逐层，每层 0.24）
     花蕊:  0.76 → 0.98
     =================================== */
  const stemP  = clamp(progress / 0.32, 0, 1);
  const leaf1P = clamp((progress - 0.24) / 0.24, 0, 1);
  const leaf2P = clamp((progress - 0.32) / 0.24, 0, 1);
  const sepalP = clamp((progress - 0.42) / 0.14, 0, 1);
  const stamenP = clamp((progress - 0.76) / 0.22, 0, 1);

  /* ---- 1. 花茎 ---- */
  drawStem(stemP, t);

  /* ---- 2. 叶片（长在茎上） ---- */
  const stemStartY = flowerY + S * 0.020;
  const stemEndY = groundY;
  const stemLen = (stemEndY - stemStartY) * (1 - Math.pow(1 - stemP, 2.5));

  const leaf1Y = stemStartY + stemLen * 0.55;
  if (leaf1Y < H * 0.99 && leaf1P > 0){
    drawLeaf(
      flowerX - S * 0.003, leaf1Y,
      Math.PI * 0.92,
      S * 0.115, S * 0.045,
      leaf1P, t
    );
  }

  const leaf2Y = stemStartY + stemLen * 0.78;
  if (leaf2Y < H * 0.99 && leaf2P > 0){
    drawLeaf(
      flowerX + S * 0.003, leaf2Y,
      Math.PI * 0.08,
      S * 0.098, S * 0.038,
      leaf2P, t
    );
  }

  /* ---- 3. 花萼 ---- */
  drawSepals(sepalP, t);

  /* ---- 4. 花瓣（外 → 内，依次绽放） ---- */
  for (let i = LAYERS.length - 1; i >= 0; i--){
    const layer = LAYERS[i];
    const p = clamp((progress - layer.delay) / PETAL_DUR, 0, 1);
    drawRoseLayer(layer, p, t);
  }

  /* ---- 5. 花蕊（最后出现） ---- */
  drawStamens(stamenP, t);

  /* ---- 6. 花心光点 ---- */
  if (progress > 0.50){
    const cA = Math.min(1, (progress - 0.50) * 3.2);
    const coreR = flowerScale * 0.028 * (0.55 + progress * 0.45);
    const cg = ctx.createRadialGradient(
      flowerX, flowerY, 0,
      flowerX, flowerY, coreR * 3.2
    );
    cg.addColorStop(0.00, 'hsla(46, 92%, 88%, ' + (0.75 * cA) + ')');
    cg.addColorStop(0.35, 'hsla(350, 82%, 62%, ' + (0.28 * cA) + ')');
    cg.addColorStop(1.00, 'hsla(340, 70%, 40%, 0)');

    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(flowerX, flowerY, coreR * 3.2, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- 暗角 ---- */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, S * 0.30,
    W * 0.5, H * 0.5, S * 1.0
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(10, 2, 18, 0.22)');
  vg.addColorStop(1.00, 'rgba(4, 0, 10, 0.78)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   主循环
   ========================================================= */
function frame(time){
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  const t = time * 0.001;

  if (autoPlay){
    autoTime += dt;
    const growDur = 5.5;
    const holdDur = 2.2;
    if (autoTime < growDur){
      progress = autoTime / growDur;
    } else if (autoTime < growDur + holdDur){
      progress = 1;
    } else {
      autoTime = 0;
      progress = 0;
    }
    timeline.value = progress * 1000;
  }

  draw(t);

  const ov = document.getElementById('openVal');
  if (ov) ov.textContent = (progress * 100).toFixed(0) + '%';

  const sb = document.getElementById('stateBig');
  const se = document.getElementById('stateEn');
  if (sb && se){
    if (progress < 0.06)       { sb.textContent = '种 子'; se.textContent = 'SEED'; }
    else if (progress < 0.30)  { sb.textContent = '抽 茎'; se.textContent = 'STEM'; }
    else if (progress < 0.46)  { sb.textContent = '展 叶'; se.textContent = 'LEAVES'; }
    else if (progress < 0.58)  { sb.textContent = '含 苞'; se.textContent = 'BUDDING'; }
    else if (progress < 0.76)  { sb.textContent = '初 绽'; se.textContent = 'OPENING'; }
    else if (progress < 0.94)  { sb.textContent = '绽 放'; se.textContent = 'BLOOMING'; }
    else                       { sb.textContent = '盛 开'; se.textContent = 'FULL BLOOM'; }
  }

  requestAnimationFrame(frame);
}

/* =========================================================
   交互
   ========================================================= */
timeline.addEventListener('input', function(e){
  initAudio();
  progress = parseFloat(e.target.value) / 1000;
  autoPlay = false;
});

timeline.addEventListener('pointerdown', initAudio);

canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  initAudio();
  autoTime = 0;
  progress = 0;
  autoPlay = true;
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    autoTime = 0;
    progress = 0;
    autoPlay = true;
  }
});

window.addEventListener('touchstart', initAudio, { passive: true });
window.addEventListener('pointerdown', initAudio);

/* =========================================================
   启动
   ========================================================= */
resize();
requestAnimationFrame(function(time){
  lastTime = time;
  requestAnimationFrame(frame);
});

})();
</script>
