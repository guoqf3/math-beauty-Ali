<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>蝴蝶曲线 · Butterfly Curve</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#05030e;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;}

  /* ===== 标题 ===== */
  #title{
    position:absolute;top:0;left:0;
    padding:18px 24px;
    opacity:0;animation:fade 1.2s 0.2s ease forwards;
  }
  #title .en{
    font-size:8px;letter-spacing:.5em;text-indent:.5em;
    color:rgba(190,150,255,.42);font-weight:300;margin-bottom:5px;
  }
  #title h1{
    font-size:clamp(16px,2.1vw,24px);
    font-weight:300;letter-spacing:.24em;
    background:linear-gradient(96deg,#c09eff 0%,#e090d0 48%,#ffd080 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 22px rgba(180,130,255,.48));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.14em;
    color:rgba(210,190,255,.52);
    margin-top:5px;
  }

  /* ===== 公式卡片 ===== */
  #formula{
    position:absolute;
    top:18px;right:24px;
    padding:14px 18px;
    border-radius:14px;
    background:rgba(14,10,32,.76);
    border:1px solid rgba(160,120,255,.30);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    line-height:1.85;
    color:rgba(220,205,255,.82);
    opacity:0;animation:fade 1.2s 0.5s ease forwards;
    max-width:240px;
    text-align:left;
  }
  #formula .tag{
    font-size:8px;letter-spacing:.38em;
    color:rgba(190,150,255,.62);
    display:block;margin-bottom:8px;
  }
  #formula .eq{
    font-size:12px;
    line-height:1.9;
    color:rgba(230,220,255,.94);
    text-shadow:0 0 12px rgba(180,130,255,.42);
  }
  #formula .eq .hl1{color:#5ee0ff;}
  #formula .eq .hl2{color:#e090d0;}
  #formula .eq .hl3{color:#ffd080;}
  #formula .note{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid rgba(160,120,255,.20);
    font-size:8.5px;
    line-height:1.7;
    color:rgba(190,170,255,.48);
  }

  /* ===== 控制面板 ===== */
  #panel{
    position:absolute;
    bottom:0;left:50%;transform:translateX(-50%);
    width:min(640px,94vw);
    padding:0 20px 20px;
    display:flex;flex-direction:column;gap:14px;
    opacity:0;animation:fade 1.2s 1.0s ease forwards;
    pointer-events:none;
  }

  .ctrl-row{
    display:flex;align-items:center;gap:12px;
    pointer-events:auto;
    padding:10px 16px;
    border-radius:12px;
    background:rgba(14,10,32,.72);
    border:1px solid rgba(140,110,255,.22);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:border-color .3s;
  }
  .ctrl-row:hover{border-color:rgba(180,150,255,.48);}

  .ctrl-label{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.14em;
    color:rgba(200,185,255,.68);
    min-width:74px;
    text-align:right;
  }
  .ctrl-val{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:11px;font-weight:600;
    color:rgba(230,215,255,.98);
    min-width:46px;
    text-align:right;
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1;
    height:3px;
    background:rgba(140,120,240,.24);
    border-radius:2px;
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#e0d0ff,#a080ff);
    border:1px solid rgba(220,205,255,.92);
    box-shadow:0 0 14px rgba(180,130,255,.82);
    cursor:pointer;
    transition:transform .18s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.20);}
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#e0d0ff,#a080ff);
    border:1px solid rgba(220,205,255,.92);
    box-shadow:0 0 14px rgba(180,130,255,.82);
    cursor:pointer;
  }

  /* 色相滑块 */
  .hue-row input[type=range]{
    background:linear-gradient(90deg,
      #ff5a5a 0%, #ffd95a 16%, #7aff5a 33%,
      #5affd9 50%, #5a9bff 66%, #b85aff 83%, #ff5ab0 100%);
    height:6px;
    border-radius:3px;
  }

  /* 开关按钮 */
  .toggle{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.14em;
    padding:7px 14px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid rgba(160,130,255,.32);
    background:rgba(20,14,42,.72);
    color:rgba(200,185,255,.62);
    transition:.24s;
    white-space:nowrap;
    pointer-events:auto;
  }
  .toggle:hover{
    border-color:rgba(200,170,255,.82);
    color:rgba(230,220,255,.98);
    transform:translateY(-1px);
  }
  .toggle.on{
    background:linear-gradient(145deg,rgba(160,110,255,.82),rgba(90,50,180,.78));
    border-color:rgba(210,180,255,.88);
    color:rgba(240,230,255,.98);
    box-shadow:0 0 20px rgba(160,110,255,.62);
  }

  /* ===== 音频指示 ===== */
  #audioDot{
    position:absolute;
    bottom:0;left:22px;
    padding-bottom:20px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.20em;
    color:rgba(180,150,255,.30);
    display:flex;align-items:center;gap:6px;
    opacity:0;animation:fade 1.2s 1.4s ease forwards;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(180,150,255,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(190,150,255,.94);
    box-shadow:0 0 9px rgba(190,150,255,.85);
  }
  #audioDot.on{color:rgba(200,170,255,.62);}

  /* ===== Toast ===== */
  #toast{
    position:fixed;
    top:30%;left:50%;
    transform:translate(-50%,-50%) scale(.86);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(14px,1.9vw,20px);
    font-weight:300;letter-spacing:.22em;
    color:rgba(230,205,255,.98);
    text-shadow:0 0 30px rgba(180,130,255,.85);
    opacity:0;pointer-events:none;
    transition:opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
    z-index:100;
    white-space:nowrap;
    text-align:center;
    padding:14px 28px;
    border-radius:14px;
    background:rgba(26,14,52,.80);
    border:1px solid rgba(180,140,255,.52);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  #toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:12px 14px;}
    #title .sub{display:none;}
    #formula{
      top:12px;right:12px;
      padding:10px 12px;
      font-size:9px;
      max-width:160px;
    }
    #formula .eq{font-size:10px;}
    #formula .note{display:none;}
    #panel{padding:0 12px 14px;gap:8px;}
    .ctrl-row{padding:8px 12px;gap:9px;}
    .ctrl-label{min-width:56px;font-size:8.5px;}
    .ctrl-val{min-width:36px;font-size:10px;}
    .toggle{font-size:9px;padding:6px 10px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">BUTTERFLY CURVE</div>
    <h1>蝴蝶曲线</h1>
    <div class="sub">极坐标 · 对称之美</div>
  </div>

  <div id="formula">
    <span class="tag">POLAR EQUATION</span>
    <div class="eq">
      r(θ) = e<sup><span class="hl1">sin θ</span></sup><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;− <span class="hl2">2 cos 4θ</span><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+ sin<sup>5</sup><span class="hl3">((2θ−π)/24)</span>
    </div>
    <div class="note">
      θ ∈ [0, 2π] · 4 瓣对角分布<br>
      上翅大 · 下翅小 · 轴对称
    </div>
  </div>

  <div id="panel">
    <div class="ctrl-row">
      <span class="ctrl-label">翅膀展开</span>
      <input type="range" id="spread" min="0.5" max="1.4" step="0.01" value="1.00">
      <span class="ctrl-val" id="spreadVal">1.00</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">扇动速度</span>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.05" value="1.20">
      <span class="ctrl-val" id="speedVal">1.20</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">起伏强度</span>
      <input type="range" id="amp" min="0" max="1" step="0.01" value="0.55">
      <span class="ctrl-val" id="ampVal">0.55</span>
    </div>
    <div class="ctrl-row hue-row">
      <span class="ctrl-label">色彩</span>
      <input type="range" id="hue" min="0" max="360" step="1" value="280">
      <span class="ctrl-val" id="hueVal">280°</span>
    </div>
    <div class="ctrl-row" style="justify-content:center;gap:10px;">
      <button class="toggle on" id="btnFlap">振翅中</button>
      <button class="toggle" id="btnPause">暂停旋转</button>
    </div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>仅交互音效</span>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, BASE = 160;

/* =========================================================
   参数
   ========================================================= */
const params = {
  spread: 1.00,
  speed: 1.20,
  amp: 0.55,
  hue: 280,
  autoFlap: true,
  paused: false
};

/* =========================================================
   振翅相位
   ========================================================= */
let flapPhase = 0;
let bodyRotate = 0;

/* =========================================================
   音效系统（仅交互音效，无持续背景音）
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let lastFlapSound = 0;
let flapSoundArmed = true;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0.55;
  master.connect(ac.destination);

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioDot(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioDot(true);
  }
}

/* ---- 振翅音：只在振翅相位过零时触发 ---- */
function playFlap(intensity){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  if (now - lastFlapSound < 0.14) return;
  lastFlapSound = now;

  const s = Math.max(0.2, Math.min(1.4, intensity || 1));

  /* 低频拍打 */
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120 + Math.random() * 40, now);
  osc.frequency.exponentialRampToValueAtTime(200, now + 0.055);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.030 * s, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.11);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.13);

  /* 高频沙沙声 */
  const nl = Math.ceil(ac.sampleRate * 0.07);
  const buf = ac.createBuffer(1, nl, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const t = i / nl;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.4);
  }
  const src = ac.createBufferSource();
  src.buffer = buf;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2400 + Math.random() * 900;
  bp.Q.value = 1.8;

  const g2 = ac.createGain();
  g2.gain.value = 0.016 * s;

  src.connect(bp);
  bp.connect(g2);
  g2.connect(master);
  src.start(now);
}

/* ---- 按钮点击音 ---- */
function playClick(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(660, now);
  osc.frequency.exponentialRampToValueAtTime(990, now + 0.055);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.026, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.10);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.12);
}

/* ---- 滑块调节音：极短轻响 ---- */
function playTick(value){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 音高随参数值变化，形成"调音"手感 */
  const f = 440 + value * 660;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.008, now + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.05);
}

/* =========================================================
   蝴蝶翅膀形状
   ========================================================= */
const WING_KEYS = [
  { x: 0.00, y: -0.60 },
  { x: 0.22, y: -0.86 },
  { x: 0.58, y: -0.98 },
  { x: 0.90, y: -0.84 },
  { x: 1.08, y: -0.48 },
  { x: 1.04, y: -0.14 },
  { x: 0.84, y: 0.02 },
  { x: 0.62, y: 0.01 },
  { x: 0.82, y: 0.34 },
  { x: 0.76, y: 0.60 },
  { x: 0.50, y: 0.74 },
  { x: 0.22, y: 0.64 },
  { x: 0.00, y: 0.42 }
];

function buildSmoothPath(pts){
  const n = pts.length;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);

  for (let i = 0; i < n; i++){
    const p0 = pts[(i - 1 + n) % n];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[(i + 2) % n];

    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;

    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
  }

  ctx.closePath();
}

function currentFlap(){
  if (!params.autoFlap){
    return { scaleY: 1, rotate: 0 };
  }
  const phase = Math.sin(flapPhase);
  const scaleY = 1 - Math.abs(phase) * params.amp * 0.55;
  const rotate = phase * params.amp * 0.22;
  return { scaleY: scaleY, rotate: rotate };
}

/* =========================================================
   绘制蝴蝶
   ========================================================= */
function drawButterfly(t){
  const flap = currentFlap();
  const R = BASE * params.spread;

  /* 光环 */
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 2.4);
  halo.addColorStop(0, 'hsla(' + params.hue + ',100%,74%,0.24)');
  halo.addColorStop(0.42, 'hsla(' + (params.hue + 40) + ',100%,62%,0.08)');
  halo.addColorStop(1, 'hsla(' + (params.hue + 60) + ',100%,56%,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(CX, CY, R * 2.4, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 左右翅膀 */
  for (let side = -1; side <= 1; side += 2){
    ctx.save();
    ctx.translate(CX, CY);
    ctx.scale(side, 1);

    /* 振翅效果 */
    ctx.translate(0, -R * 0.55);
    ctx.rotate(flap.rotate);
    ctx.scale(1, flap.scaleY);
    ctx.translate(0, R * 0.55);

    const scaled = WING_KEYS.map(function(k){
      return { x: k.x * R, y: k.y * R };
    });

    buildSmoothPath(scaled);

    const wingGrad = ctx.createRadialGradient(
      R * 0.3, -R * 0.3, 0,
      R * 0.5, 0, R * 1.25
    );
    wingGrad.addColorStop(0.00, 'hsla(' + (params.hue + 40) + ',100%,84%,0.94)');
    wingGrad.addColorStop(0.32, 'hsla(' + (params.hue + 15) + ',95%,70%,0.88)');
    wingGrad.addColorStop(0.72, 'hsla(' + params.hue + ',88%,56%,0.78)');
    wingGrad.addColorStop(1.00, 'hsla(' + (params.hue - 20) + ',82%,42%,0.62)');
    ctx.fillStyle = wingGrad;
    ctx.fill();

    /* 翅膀外缘发光 */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'hsla(' + (params.hue + 30) + ',100%,82%,0.52)';
    ctx.lineWidth = R * 0.018;
    ctx.stroke();
    ctx.strokeStyle = 'hsla(' + (params.hue + 50) + ',100%,88%,0.88)';
    ctx.lineWidth = R * 0.008;
    ctx.stroke();
    ctx.restore();

    /* 翅脉纹理与斑点 */
    ctx.save();
    ctx.beginPath();
    buildSmoothPath(scaled);
    ctx.clip();

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++){
      const ang = -0.8 + i * 0.42;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.3);
      ctx.quadraticCurveTo(
        Math.cos(ang) * R * 0.65,
        -R * 0.3 + Math.sin(ang) * R * 0.65,
        Math.cos(ang) * R * 1.05,
        -R * 0.3 + Math.sin(ang) * R * 1.05
      );
      ctx.strokeStyle = 'hsla(' + (params.hue + 20) + ',100%,84%,0.28)';
      ctx.lineWidth = R * 0.010;
      ctx.stroke();
    }

    const spots = [
      { x: 0.62, y: -0.52, r: 0.10 },
      { x: 0.82, y: -0.20, r: 0.075 },
      { x: 0.60, y: 0.34, r: 0.070 }
    ];
    for (let k = 0; k < spots.length; k++){
      const sp = spots[k];
      const px = sp.x * R;
      const py = sp.y * R;
      const pr = sp.r * R;

      const spotGrad = ctx.createRadialGradient(px - pr * 0.3, py - pr * 0.3, 0, px, py, pr);
      spotGrad.addColorStop(0, 'hsla(48, 100%, 92%, 0.72)');
      spotGrad.addColorStop(1, 'hsla(' + (params.hue + 50) + ', 90%, 78%, 0.32)');
      ctx.fillStyle = spotGrad;
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
    ctx.restore();
  }

  /* 身体 */
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(bodyRotate);

  ctx.shadowColor = 'hsla(' + (params.hue + 40) + ',100%,70%,0.62)';
  ctx.shadowBlur = R * 0.12;

  const bodyH = R * 1.34;
  const bodyW = R * 0.085;

  ctx.beginPath();
  ctx.ellipse(0, 0, bodyW, bodyH * 0.5, 0, 0, TAU);

  const bodyGrad = ctx.createLinearGradient(-bodyW, 0, bodyW, 0);
  bodyGrad.addColorStop(0.00, 'hsla(' + (params.hue - 20) + ',70%,30%,0.98)');
  bodyGrad.addColorStop(0.50, 'hsla(' + (params.hue + 10) + ',85%,68%,0.98)');
  bodyGrad.addColorStop(1.00, 'hsla(' + (params.hue - 20) + ',70%,30%,0.98)');
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, -bodyH * 0.55, bodyW * 1.3, 0, TAU);
  ctx.fillStyle = 'hsla(' + (params.hue + 15) + ',82%,62%,0.98)';
  ctx.fill();

  for (let side = -1; side <= 1; side += 2){
    ctx.beginPath();
    ctx.arc(side * bodyW * 0.55, -bodyH * 0.58, bodyW * 0.42, 0, TAU);
    ctx.fillStyle = 'rgba(10, 4, 20, 0.94)';
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  for (let side = -1; side <= 1; side += 2){
    ctx.beginPath();
    ctx.moveTo(side * bodyW * 0.4, -bodyH * 0.68);
    ctx.quadraticCurveTo(
      side * R * 0.28, -R * 0.95,
      side * R * 0.42, -R * 1.12
    );
    ctx.strokeStyle = 'hsla(' + (params.hue + 25) + ',88%,72%,0.86)';
    ctx.lineWidth = R * 0.016;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(side * R * 0.42, -R * 1.12, R * 0.028, 0, TAU);
    ctx.fillStyle = 'hsla(' + (params.hue + 40) + ',100%,82%,0.98)';
    ctx.fill();
  }

  ctx.restore();

  /* 中心光点 */
  ctx.globalCompositeOperation = 'lighter';
  const corePulse = 1 + 0.20 * Math.sin(t * 2.6);
  const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 0.42 * corePulse);
  cg.addColorStop(0, 'hsla(' + (params.hue + 40) + ',100%,92%,0.62)');
  cg.addColorStop(0.42, 'hsla(' + (params.hue + 20) + ',100%,74%,0.24)');
  cg.addColorStop(1, 'hsla(' + params.hue + ',100%,62%,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(CX, CY, R * 0.42 * corePulse, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   背景
   ========================================================= */
const stars = [];

function buildStars(){
  stars.length = 0;
  const n = Math.min(180, Math.round(W * H / 11000));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.1 + 0.15,
      ph: Math.random() * TAU,
      sp: 0.2 + Math.random() * 0.8,
      hue: 240 + Math.random() * 80,
      base: 0.05 + Math.random() * 0.22
    });
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.46;
  BASE = Math.min(W, H) * 0.20;
  BASE = Math.max(90, Math.min(BASE, 190));

  buildStars();
}
window.addEventListener('resize', resize);

function drawBackground(t){
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.42, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  bg.addColorStop(0.00, '#0c0824');
  bg.addColorStop(0.42, '#060414');
  bg.addColorStop(1.00, '#020108');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.012) continue;

    ctx.fillStyle = 'hsla(' + s.hue + ',85%,86%,' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }

  for (let k = 0; k < 2; k++){
    const px = W * (0.28 + k * 0.44) + Math.sin(t * 0.04 + k * 1.7) * W * 0.08;
    const py = H * (0.42 + k * 0.20) + Math.cos(t * 0.03 + k) * H * 0.06;
    const r = Math.min(W, H) * (0.32 + k * 0.08);
    const hue = k === 0 ? 260 : 200;
    const g = ctx.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0.00, 'hsla(' + hue + ',85%,58%,0.055)');
    g.addColorStop(0.42, 'hsla(' + hue + ',85%,50%,0.020)');
    g.addColorStop(1.00, 'hsla(' + hue + ',85%,48%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   UI 绑定
   ========================================================= */
function bindSlider(id, key, valId, fmt){
  const el = document.getElementById(id);
  const vEl = document.getElementById(valId);
  if (!el) return;

  let lastTick = 0;

  function update(playSound){
    const v = parseFloat(el.value);
    params[key] = v;
    if (vEl) vEl.textContent = fmt ? fmt(v) : v.toFixed(2);

    /* 滑块拖动时播放极短轻响 */
    if (playSound){
      const now = performance.now();
      if (now - lastTick > 45){
        lastTick = now;
        playTick(v);
      }
    }
  }

  el.addEventListener('input', function(){
    initAudio();
    update(true);
  });

  update(false);
}

bindSlider('spread', 'spread', 'spreadVal', function(v){ return v.toFixed(2); });
bindSlider('speed', 'speed', 'speedVal', function(v){ return v.toFixed(2); });
bindSlider('amp', 'amp', 'ampVal', function(v){ return v.toFixed(2); });
bindSlider('hue', 'hue', 'hueVal', function(v){ return Math.round(v) + '°'; });

/* 振翅开关 */
const btnFlap = document.getElementById('btnFlap');
btnFlap.addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  playClick();
  params.autoFlap = !params.autoFlap;
  btnFlap.classList.toggle('on', params.autoFlap);
  btnFlap.textContent = params.autoFlap ? '振翅中' : '已停翅';
  showToast(params.autoFlap ? '恢复振翅' : '翅膀静止');
});

/* 暂停旋转 */
const btnPause = document.getElementById('btnPause');
btnPause.addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  playClick();
  params.paused = !params.paused;
  btnPause.classList.toggle('on', params.paused);
  btnPause.textContent = params.paused ? '已暂停' : '暂停旋转';
});

/* =========================================================
   Toast
   ========================================================= */
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toastEl.classList.remove('show');
  }, 1500);
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  /* 振翅相位 */
  if (params.autoFlap && !params.paused){
    flapPhase += dt * params.speed * 3.4;

    /* 相位过零时触发一次振翅音 */
    const cycle = Math.sin(flapPhase);
    if (flapSoundArmed && Math.abs(cycle) < 0.06){
      flapSoundArmed = false;
      playFlap(0.5 + params.amp * 0.8);
    }
    if (Math.abs(cycle) > 0.30){
      flapSoundArmed = true;
    }
  }

  /* 身体轻微旋转 */
  if (!params.paused){
    bodyRotate = Math.sin(t * 0.5) * 0.06;
  }

  drawBackground(t);
  drawButterfly(t);

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.36,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(1, 1, 6, 0.24)');
  vg.addColorStop(1, 'rgba(0, 0, 4, 0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   事件
   ========================================================= */
window.addEventListener('pointerdown', function(){
  initAudio();
}, { once: false });

window.addEventListener('keydown', function(e){
  if (e.key === ' '){
    e.preventDefault();
    initAudio();
    btnFlap.click();
  } else if (e.key === 'p' || e.key === 'P'){
    initAudio();
    btnPause.click();
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
requestAnimationFrame(loop);

setTimeout(function(){
  showToast('调节参数 · 观察蝴蝶振翅');
}, 900);

})();
</script>
