<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正二十面体对称轴 · 31大圆球面网络</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.85vw, 0.64rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.18);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.36rem, 0.68vw, 0.54rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">正二十面体对称轴 · 31大圆球面网络</div>
        <div class="subtitle">ICOSAHEDRAL SYMMETRY AXES &nbsp;·&nbsp; 31 GREAT CIRCLES ON S²</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">C₅:</span> 6条5重轴大圆 &nbsp;
            <span class="c2">C₃:</span> 10条3重轴大圆 &nbsp;
            <span class="c3">C₂:</span> 15条2重轴大圆
            <br>
            <span style="color:#9aa8b8;">φ=(1+√5)/2 &nbsp;|&nbsp; 12顶点·20面心·30边中点 &nbsp;|&nbsp; 球半径R=2.6 &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 20);

        const camera = new THREE.PerspectiveCamera(
            50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 25
        );
        camera.position.set(1.2, 0.6, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_SPHERE = '#3a4a5c', C_GLINT = '#8898aa';
        const R = 2.6;
        const NUM_SAMPLES = 220;

        const phi = (1 + Math.sqrt(5)) / 2;
        const invPhi = 1 / phi;

        function normalize(v) {
            const len = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
            return [v[0]/len, v[1]/len, v[2]/len];
        }

        function directionKey(v, eps = 0.02) {
            const abs = [Math.abs(v[0]), Math.abs(v[1]), Math.abs(v[2])].sort((a,b)=>b-a);
            return abs.map(x=>x.toFixed(4)).join(',');
        }

        // 5重轴
        const vertsRaw = [];
        const perms = [[0,1,2],[2,0,1],[1,2,0]];
        for (const [i,j,k] of perms) {
            for (let si=-1; si<=1; si+=2) {
                for (let sj=-1; sj<=1; sj+=2) {
                    const v = [0,0,0];
                    v[i]=0; v[j]=si; v[k]=sj*phi;
                    vertsRaw.push(normalize(v));
                }
            }
        }
        const axes5 = [];
        const seen5 = new Set();
        for (const v of vertsRaw) {
            const key = directionKey(v);
            if (!seen5.has(key)) { seen5.add(key); axes5.push(new THREE.Vector3(...v)); }
        }

        // 3重轴
        const facesRaw = [];
        for (let sx=-1; sx<=1; sx+=2)
            for (let sy=-1; sy<=1; sy+=2)
                for (let sz=-1; sz<=1; sz+=2)
                    facesRaw.push(normalize([sx,sy,sz]));
        for (const [i,j,k] of perms) {
            for (let sj=-1; sj<=1; sj+=2) {
                for (let sk=-1; sk<=1; sk+=2) {
                    const v = [0,0,0];
                    v[i]=0; v[j]=sj*invPhi; v[k]=sk*phi;
                    facesRaw.push(normalize(v));
                }
            }
        }
        const axes3 = [];
        const seen3 = new Set();
        for (const v of facesRaw) {
            const key = directionKey(v);
            if (!seen3.has(key)) { seen3.add(key); axes3.push(new THREE.Vector3(...v)); }
        }

        // 2重轴
        const edgeMids = [];
        for (let i=0; i<vertsRaw.length; i++) {
            for (let j=i+1; j<vertsRaw.length; j++) {
                const vi = new THREE.Vector3(...vertsRaw[i]);
                const vj = new THREE.Vector3(...vertsRaw[j]);
                const dist = vi.distanceTo(vj);
                if (dist < 1.1 && dist > 0.01) {
                    edgeMids.push(vi.clone().add(vj).normalize());
                }
            }
        }
        const axes2 = [];
        const seen2 = new Set();
        for (const v of edgeMids) {
            const key = directionKey([v.x, v.y, v.z]);
            if (!seen2.has(key)) { seen2.add(key); axes2.push(v.clone()); }
        }

        console.log('5重轴:', axes5.length, '3重轴:', axes3.length, '2重轴:', axes2.length);

        // 创建大圆线条（透明、不写入深度，确保重叠可见）
        function createGreatCircle(axis, radius, color, opacity) {
            const u = Math.abs(axis.x) < 0.9 ?
                new THREE.Vector3(0, -axis.z, axis.y).normalize() :
                new THREE.Vector3(-axis.z, 0, axis.x).normalize();
            const v = new THREE.Vector3().crossVectors(axis, u).normalize();
            const pts = [];
            for (let i=0; i<=NUM_SAMPLES; i++) {
                const a = (i/NUM_SAMPLES) * Math.PI*2;
                pts.push(u.clone().multiplyScalar(Math.cos(a)*radius).add(v.clone().multiplyScalar(Math.sin(a)*radius)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(color),
                transparent: true, opacity: opacity,
                depthWrite: false, depthTest: true
            });
            return new THREE.Line(geom, mat);
        }

        function createAxisLine(axis, radius, color, opacity) {
            const a = axis.clone().multiplyScalar(radius);
            const b = axis.clone().multiplyScalar(-radius);
            const geom = new THREE.BufferGeometry().setFromPoints([a,b]);
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(color),
                transparent: true, opacity: opacity,
                depthWrite: false, depthTest: true
            });
            return new THREE.Line(geom, mat);
        }

        const mainGroup = new THREE.Group();

        axes5.forEach(ax => { mainGroup.add(createGreatCircle(ax, R, C1, 0.7)); mainGroup.add(createAxisLine(ax, R, C1, 0.3)); });
        axes3.forEach(ax => { mainGroup.add(createGreatCircle(ax, R, C2, 0.65)); mainGroup.add(createAxisLine(ax, R, C2, 0.28)); });
        axes2.forEach(ax => { mainGroup.add(createGreatCircle(ax, R, C3, 0.6)); mainGroup.add(createAxisLine(ax, R, C3, 0.25)); });
        scene.add(mainGroup);

        // 参考球面线框（同样透明）
        function createSphereWireframe(radius, color, opacity) {
            const group = new THREE.Group();
            const segs = 180;
            const gen = (fx) => {
                const pts = [];
                for (let i=0; i<=segs; i++) pts.push(fx((i/segs)*Math.PI*2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(color),
                    transparent: true, opacity: opacity,
                    depthWrite: false, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            };
            gen((a)=>new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0));
            gen((a)=>new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
            gen((a)=>new THREE.Vector3(0, Math.cos(a)*radius, Math.sin(a)*radius));
            gen((a)=>{ const r = Math.sqrt(radius*radius - (radius*0.5)*(radius*0.5)); return new THREE.Vector3(Math.cos(a)*r, radius*0.5, Math.sin(a)*r); });
            gen((a)=>{ const r = Math.sqrt(radius*radius - (radius*0.5)*(radius*0.5)); return new THREE.Vector3(Math.cos(a)*r, -radius*0.5, Math.sin(a)*r); });
            return group;
        }
        const sphereRef = createSphereWireframe(R, C_SPHERE, 0.3);
        scene.add(sphereRef);

        // 轴端点光点
        function addGlints(axes, radius, color, sz) {
            const group = new THREE.Group();
            axes.forEach(axis => {
                [-1,1].forEach(sign => {
                    const pt = axis.clone().multiplyScalar(sign*radius);
                    [[-sz,0,0],[sz,0,0],[0,-sz,0],[0,sz,0],[0,0,-sz],[0,0,sz]].forEach(([dx,dy,dz]) => {
                        const g = new THREE.BufferGeometry().setFromPoints([pt.clone().add(new THREE.Vector3(dx,dy,dz)), pt]);
                        const m = new THREE.LineBasicMaterial({ color: new THREE.Color(color), transparent:true, opacity:0.6, depthWrite:false });
                        group.add(new THREE.Line(g,m));
                    });
                });
            });
            return group;
        }
        mainGroup.add(addGlints(axes5, R, C1, 0.045));
        mainGroup.add(addGlints(axes3, R, C2, 0.04));
        mainGroup.add(addGlints(axes2, R, C3, 0.035));

        // 原点光点
        (() => {
            const sz = 0.08;
            const g = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0),
                new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0),
                new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)
            ]);
            const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent:true, opacity:0.8, depthWrite:false });
            scene.add(new THREE.LineSegments(g,m));
        })();

        // 动画
        let time = 0, lastTime = performance.now(), frameCount = 0;
        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime)/1000;
            if (delta <=0 || delta>0.5) delta=0.016;
            lastTime = now;
            time += delta;
            frameCount++;

            mainGroup.rotation.y = time * 0.28;
            mainGroup.rotation.x = time * 0.16 + Math.sin(time*0.25)*0.22;
            mainGroup.rotation.z = Math.cos(time*0.19)*0.12;
            sphereRef.rotation.copy(mainGroup.rotation);

            camera.position.set(1.2+Math.sin(time*0.14)*0.5, 0.6+Math.cos(time*0.17)*0.45, 7.2+Math.sin(time*0.11)*0.45);
            camera.lookAt(0,0,0);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', ()=>{
            const w = container.clientWidth, h = Math.max(container.clientHeight,1);
            camera.aspect = w/h;
            camera.updateProjectionMatrix();
            renderer.setSize(w,h);
        });

        console.log('=== 正二十面体对称轴 · 31大圆球面网络 ===');
        console.log('5重轴大圆:', axes5.length, '3重轴大圆:', axes3.length, '2重轴大圆:', axes2.length);
        console.log('总大圆数:', axes5.length+axes3.length+axes2.length);
        console.log('✅ 所有大圆已透明叠加，确保全部可见');
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
