<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛伦兹嬗变 · 放射性衰变链与半衰期级联</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#04010e;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#d7ecff;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;display:block;z-index:0;}

  .vig{
    position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(0,0,0,0) 34%,
      rgba(0,0,0,.42) 72%,
      rgba(0,0,0,.86) 100%);
  }

  /* ── 顶部中央：人生启迪 ── */
  #title{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    z-index:7;pointer-events:none;
    font-size:clamp(12.5px,1.95vw,19px);
    letter-spacing:.13em;font-weight:500;
    color:#eefaff;white-space:nowrap;
    animation:tg 5s ease-in-out infinite;
  }
  @keyframes tg{
    0%,100%{text-shadow:0 0 6px rgba(255,140,235,.85),0 0 22px rgba(160,110,255,.65),0 0 44px rgba(110,235,255,.35);opacity:.93;}
    50%    {text-shadow:0 0 13px rgba(255,140,235,1),0 0 36px rgba(160,110,255,.95),0 0 74px rgba(110,235,255,.62);opacity:1;}
  }

  /* ── 边缘公式（强制水平不换行） ── */
  .eq{
    position:fixed;z-index:5;pointer-events:none;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:clamp(9px,1.0vw,12px);
    line-height:1.8;color:#8fd8ff;opacity:.74;
    text-shadow:0 0 9px rgba(80,200,255,.75),0 0 24px rgba(150,90,255,.35);
    letter-spacing:.015em;
    white-space:nowrap;           /* ← 关键：禁止竖排换行 */
  }
  .eq b{color:#ffd9ff;font-weight:600;text-shadow:0 0 10px rgba(255,120,240,.9);}
  .eq .dim{opacity:.55;font-size:.92em;}
  .tl{top:52px;left:16px;}
  .tr{top:52px;right:16px;text-align:right;}
  .bl{bottom:calc(var(--panel-h, 120px) + 22px);left:16px;}
  .br{bottom:calc(var(--panel-h, 120px) + 22px);right:16px;text-align:right;}

  /* ── 控制面板 ── */
  #panel{
    position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
    z-index:6;width:min(660px,93vw);
    padding:10px 16px 11px;border-radius:14px;
    background:rgba(9,3,24,.72);
    border:1px solid rgba(120,200,255,.22);
    box-shadow:0 0 28px rgba(80,160,255,.16),inset 0 0 36px rgba(120,60,255,.08);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-size:11px;display:flex;flex-direction:column;gap:6px;
  }
  .row{display:grid;grid-template-columns:56px 1fr 150px;align-items:center;gap:9px;}
  .tag{color:#7fe6ff;font-family:ui-monospace,Consolas,monospace;letter-spacing:.03em;}
  .val{text-align:right;color:#ffd9ff;font-family:ui-monospace,Consolas,monospace;
       font-size:10.5px;text-shadow:0 0 8px rgba(255,110,240,.7);
       white-space:nowrap;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#1de9ff,#a06bff,#ff5ff0);
    box-shadow:0 0 10px rgba(110,180,255,.45);cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 0 9px #7cf,0 0 20px #a6f;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:#fff;box-shadow:0 0 9px #7cf,0 0 20px #a6f;
  }
  .chk{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#9fe8ff;
    white-space:nowrap;
  }
  .chk input{
    -webkit-appearance:none;appearance:none;width:32px;height:16px;border-radius:8px;
    background:rgba(70,40,110,.8);border:1px solid rgba(130,200,255,.35);
    position:relative;cursor:pointer;transition:background .22s;outline:none;flex:none;
  }
  .chk input::after{
    content:'';position:absolute;top:1.5px;left:2px;width:11px;height:11px;
    border-radius:50%;background:#8fd8ff;transition:transform .22s,background .22s;
    box-shadow:0 0 8px rgba(120,220,255,.9);
  }
  .chk input:checked{background:rgba(170,70,220,.9);}
  .chk input:checked::after{transform:translateX(16px);background:#ffb0f0;
    box-shadow:0 0 10px rgba(255,120,240,1);}

  /* ── 底部读数：精简 + 水平排列 ── */
  #out{
    margin-top:0;padding-top:7px;
    border-top:1px solid rgba(110,200,255,.16);
    font-family:ui-monospace,Consolas,monospace;
    font-size:11px;color:#a9e6ff;
    display:flex;flex-wrap:wrap;
    gap:3px 18px;letter-spacing:.01em;
  }
  #out span{
    white-space:nowrap;          /* ← 关键：禁止竖排换行 */
    flex:0 0 auto;               /* ← 关键：不被压缩 */
  }
  #out b{color:#8cffd8;text-shadow:0 0 10px rgba(90,255,200,.8);font-weight:600;}
  #out .cA b{color:#ff9be8;text-shadow:0 0 10px rgba(255,140,235,.8);}
  #out .cB b{color:#7fe6ff;text-shadow:0 0 10px rgba(100,220,255,.8);}
  #out .cC b{color:#ffd97a;text-shadow:0 0 10px rgba(255,210,120,.8);}

  /* ── 点击探针标签 ── */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:8;}
  .probe{
    position:absolute;transform:translate(-50%,-50%);
    padding:8px 11px;border-radius:10px;
    font-family:ui-monospace,Consolas,monospace;
    font-size:10.5px;line-height:1.7;color:#e2f6ff;
    background:rgba(8,3,22,.88);
    border:1px solid rgba(130,220,255,.5);
    box-shadow:0 0 20px rgba(90,200,255,.45),inset 0 0 16px rgba(140,80,255,.22);
    white-space:nowrap;pointer-events:none;transition:opacity .15s linear;
  }
  .probe i{font-style:normal;color:#7fe6ff;}
  .probe em{font-style:normal;color:#ffb0f0;}

  @media (max-width:860px){
    .eq{font-size:9px;}
    .row{grid-template-columns:48px 1fr 118px;gap:7px;}
  }
  @media (max-width:560px){
    #title{letter-spacing:.04em;}
    .tr{display:none;}
    .br{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vig"></div>

<!-- 顶部中央：人生启迪 -->
<div id="title">原子从容衰变，教会我们时间会温柔地沉淀一切</div>

<!-- 边缘公式（均为单行短句） -->
<div class="eq tl">
  <div>N(t) = N₀ · e<sup>−λt</sup></div>
  <div class="dim">指数衰减律</div>
</div>

<div class="eq tr">
  <div>λ = ln2 / t<sub>1/2</sub></div>
  <div class="dim">半衰期关系</div>
</div>

<div class="eq bl">
  <div>dN<sub>B</sub>/dt = λ<sub>A</sub>N<sub>A</sub> − λ<sub>B</sub>N<sub>B</sub></div>
  <div class="dim">A → B → C（稳定）</div>
</div>

<div class="eq br">
  <div>t = 9.27 d：N<sub>A</sub> = 1.76×10<sup>5</sup>（<b>17.6%</b>）</div>
  <div class="dim">t<sub>1/2</sub> = 3.7 d　2.5 个半衰期</div>
</div>

<!-- 控制面板 -->
<div id="panel">
  <div class="row">
    <span class="tag">N₀</span>
    <input id="n0s" type="range" min="5" max="7" step="0.005" value="6">
    <span class="val" id="n0v">1.00×10⁶</span>
  </div>
  <div class="row">
    <span class="tag">t½(A)</span>
    <input id="ths" type="range" min="1" max="8" step="0.05" value="3.7">
    <span class="val" id="thv">3.70 d</span>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="thc" checked> 显示理论衰减曲线对照</label>
  </div>
  <div id="out">
    <span>t = <b id="tv">—</b></span>
    <span class="cA">A <b id="av">—</b></span>
    <span class="cB">B <b id="bv">—</b></span>
    <span class="cC">C <b id="cv">—</b></span>
  </div>
</div>

<div id="labels"></div>

<script>
(function(){
'use strict';

const LN2 = Math.LN2;

/* ================= 物理参数 ================= */
let N0   = 1e6;
let THA  = 3.7;      // 母核 A 半衰期（天）
let THB  = 1.9;      // 子核 B 半衰期（天）
let lamA = LN2/THA;
let lamB = LN2/THB;
let TTOT = THA*4;    // 模拟窗口（天）

const CYCLE = 30;    // 动画一轮 30 秒

let t = 0;           // 物理时间（天）
let realT = 0;       // 动画时钟（秒）

/* 精确解 */
function NA(tt){ return N0 * Math.exp(-lamA*tt); }
function NB(tt){
  if(Math.abs(lamB-lamA) < 1e-9) return N0*lamA*tt*Math.exp(-lamA*tt);
  return N0 * lamA/(lamB-lamA) * (Math.exp(-lamA*tt) - Math.exp(-lamB*tt));
}
function NC(tt){ return Math.max(0, N0 - NA(tt) - NB(tt)); }

/* ================= DOM ================= */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha:false });
const panelEl = document.getElementById('panel');
const labelHost = document.getElementById('labels');

/* ================= 画布尺寸 ================= */
let W=0,H=0,DPR=1,panelH=120;
let areaTop=70, areaBot=600;

function measurePanel(){
  const h = panelEl ? (panelEl.offsetHeight || 120) : 120;
  panelH = h;
  document.documentElement.style.setProperty('--panel-h', h + 'px');
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.round(W*DPR);
  cvs.height = Math.round(H*DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  measurePanel();
  areaTop = Math.max(76, H*0.10);
  areaBot = H - panelH - 46;
  if(areaBot < areaTop + 120) areaBot = H - 80;

  for(let i=0;i<atoms.length;i++){
    const a = atoms[i];
    a.x = Math.min(Math.max(a.x, 8), W-8);
    a.y = Math.min(Math.max(a.y, areaTop), areaBot);
  }
}

/* ================= 工具 ================= */
function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function fmt(x){
  if(!isFinite(x) || x <= 0) return '0';
  const e = Math.floor(Math.log10(x));
  const m = x/Math.pow(10,e);
  const SUPS={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
  const sup = s => String(s).split('').map(c => SUPS[c]!==undefined?SUPS[c]:c).join('');
  return m.toFixed(2) + '×10' + sup(e);
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* ================= 辉光精灵 ================= */
const spriteCache = {};
function glowSprite(hue){
  if(spriteCache[hue]) return spriteCache[hue];
  const S = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  g.addColorStop(0.00, 'hsla('+hue+',100%,88%,1)');
  g.addColorStop(0.16, 'hsla('+hue+',100%,74%,0.75)');
  g.addColorStop(0.46, 'hsla('+hue+',100%,60%,0.22)');
  g.addColorStop(1.00, 'hsla('+hue+',100%,55%,0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(S/2,S/2,S/2,0,6.2832); c.fill();
  spriteCache[hue] = cv;
  return cv;
}

/* ================= 粒子系统 ================= */
let atoms = [];
let rays  = [];
let bursts= [];

function newAtom(){
  const tA = -Math.log(1 - Math.random())/lamA;
  const tB = tA + (-Math.log(1 - Math.random())/lamB);
  return {
    x: rand(12, Math.max(20, W-12)),
    y: rand(areaTop, Math.max(areaTop+40, areaBot)),
    vx: rand(-8, 8),
    vy: rand(-8, 8),
    tA: tA, tB: tB,
    state: -1,
    ph: Math.random()*6.2832,
    sz: rand(0.75, 1.35)
  };
}

function regenerate(){
  atoms = []; rays = []; bursts = [];
  const N = Math.round(clamp(W*H/2100, 420, 900));
  for(let i=0;i<N;i++) atoms.push(newAtom());
}

function spawnDecay(a, fromState){
  const isA = (fromState === 0);
  const count = isA ? 2 : 3;
  for(let i=0;i<count;i++){
    const ang = Math.random()*6.2832;
    let hue, speed, life, wid;
    if(isA){
      hue   = rand(8, 38);
      speed = rand(55, 115);
      life  = rand(0.85, 1.45);
      wid   = rand(1.8, 2.9);
    }else{
      if(Math.random() < 0.42){
        hue   = rand(262, 296);
        speed = rand(190, 310);
        life  = rand(0.45, 0.85);
        wid   = rand(0.9, 1.5);
      }else{
        hue   = rand(176, 206);
        speed = rand(115, 195);
        life  = rand(0.6, 1.1);
        wid   = rand(1.1, 1.8);
      }
    }
    rays.push({
      x: a.x, y: a.y,
      vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed,
      hue: hue, life: 0, maxLife: life, wid: wid,
      spin: rand(-9, 9)
    });
  }
  bursts.push({
    x: a.x, y: a.y, r: 2,
    hue: isA ? rand(10,36) : rand(180,290),
    life: 0, maxLife: rand(0.42, 0.72)
  });
}

/* ================= 更新 ================= */
function step(dtSec){
  realT += dtSec;

  t += dtSec / CYCLE * TTOT;
  if(t >= TTOT){ t = 0; regenerate(); }

  for(let i=0;i<atoms.length;i++){
    const a = atoms[i];
    a.x += a.vx * dtSec;
    a.y += a.vy * dtSec;
    if(a.x < -20) a.x = W+20; else if(a.x > W+20) a.x = -20;
    if(a.y < areaTop-30) a.y = areaBot+20;
    else if(a.y > areaBot+30) a.y = areaTop-20;

    const ns = (t < a.tA) ? 0 : ((t < a.tB) ? 1 : 2);
    if(a.state < 0){
      a.state = ns;
    }else if(ns > a.state){
      for(let s = a.state; s < ns; s++) spawnDecay(a, s);
      a.state = ns;
    }
  }

  for(let i=rays.length-1;i>=0;i--){
    const p = rays[i];
    p.life += dtSec;
    if(p.life >= p.maxLife){ rays.splice(i,1); continue; }
    const sp = Math.hypot(p.vx,p.vy) || 1;
    const nx = -p.vy/sp, ny = p.vx/sp;
    p.vx += nx * p.spin * 55 * dtSec;
    p.vy += ny * p.spin * 55 * dtSec;
    const damp = Math.pow(0.72, dtSec);
    p.vx *= damp; p.vy *= damp;
    p.x += p.vx * dtSec;
    p.y += p.vy * dtSec;
    if(p.x < -60 || p.x > W+60 || p.y < -60 || p.y > H+60) rays.splice(i,1);
  }

  for(let i=bursts.length-1;i>=0;i--){
    const b = bursts[i];
    b.life += dtSec;
    if(b.life >= b.maxLife){ bursts.splice(i,1); continue; }
    b.r += 90 * dtSec;
  }
}

/* ================= 渲染 ================= */
function drawNebula(){
  const hb = (realT*8) % 360;
  const blobs = [
    [0.28, 0.34, 0.44, hb+280, 0.055],
    [0.74, 0.58, 0.38, hb+190, 0.045],
    [0.50, 0.78, 0.46, hb+330, 0.038]
  ];
  for(let i=0;i<blobs.length;i++){
    const b = blobs[i];
    const x = W*b[0] + Math.cos(realT*0.25 + i*2.1)*W*0.06;
    const y = H*b[1] + Math.sin(realT*0.21 + i*1.7)*H*0.05;
    const rr = Math.max(W,H)*b[2];
    const g = ctx.createRadialGradient(x,y,0,x,y,rr);
    g.addColorStop(0,   'hsla('+(b[3]|0)+',100%,58%,'+b[4]+')');
    g.addColorStop(0.45,'hsla('+((b[3]+50)%360|0)+',100%,52%,'+(b[4]*0.35)+')');
    g.addColorStop(1,   'hsla(0,0%,0%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }
}

function drawBursts(){
  for(let i=0;i<bursts.length;i++){
    const b = bursts[i];
    const k = 1 - b.life/b.maxLife;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, 6.2832);
    ctx.strokeStyle = 'hsla('+b.hue+',100%,78%,'+(k*0.55)+')';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r*0.55, 0, 6.2832);
    ctx.strokeStyle = 'hsla('+b.hue+',100%,88%,'+(k*0.32)+')';
    ctx.lineWidth = 3.4;
    ctx.stroke();
  }
}

function drawRays(){
  ctx.lineCap = 'round';
  for(let i=0;i<rays.length;i++){
    const p = rays[i];
    const k = 1 - p.life/p.maxLife;
    const a = k*k;
    if(a < 0.01) continue;
    const trail = 0.115;
    const ex = p.x - p.vx*trail;
    const ey = p.y - p.vy*trail;

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = 'hsla('+p.hue+',100%,62%,'+(a*0.24)+')';
    ctx.lineWidth = p.wid*4.2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = 'hsla('+p.hue+',100%,88%,'+a+')';
    ctx.lineWidth = p.wid;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.wid*1.5, 0, 6.2832);
    ctx.fillStyle = 'hsla('+p.hue+',100%,94%,'+a+')';
    ctx.fill();
  }
}

function drawAtoms(){
  for(let i=0;i<atoms.length;i++){
    const a = atoms[i];
    let hue, size, al;
    if(a.state === 0){        hue = 308; size = 12.5; al = 0.58; }
    else if(a.state === 1){   hue = 192; size = 10.0; al = 0.52; }
    else{                     hue = 45;  size = 8.0;  al = 0.40; }
    const spr = glowSprite(hue);
    const puls = 1 + 0.17*Math.sin(realT*2.1 + a.ph);
    const r = size * a.sz * puls;
    ctx.globalAlpha = al;
    ctx.drawImage(spr, a.x-r, a.y-r, r*2, r*2);
  }
  ctx.globalAlpha = 1;
}

/* ================= 迷你曲线图 ================= */
const showTheoryBox = document.getElementById('thc');
let showTheory = true;

function drawChart(){
  const cw = Math.min(238, W*0.30);
  const ch = 104;
  const ox = W - 16 - cw;
  const oy = 104;
  if(ox < 8 || cw < 120) return;

  ctx.globalCompositeOperation = 'source-over';

  roundRect(ctx, ox, oy, cw, ch, 9);
  ctx.fillStyle = 'rgba(6,2,18,0.60)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,200,255,0.20)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const px = ox + 12, py = oy + 12;
  const pw = cw - 24, ph = ch - 30;

  ctx.strokeStyle = 'rgba(120,200,255,0.075)';
  ctx.lineWidth = 1;
  for(let i=1;i<4;i++){
    const yy = py + ph*i/4;
    ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px+pw, yy); ctx.stroke();
  }

  if(showTheory){
    const curve = function(fn, hue, wid, alpha){
      ctx.beginPath();
      for(let i=0;i<=90;i++){
        const tt = i/90*TTOT;
        const v  = clamp(fn(tt)/N0, 0, 1);
        const xx = px + pw*(i/90);
        const yy = py + ph*(1-v);
        if(i===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
      }
      ctx.strokeStyle = 'hsla('+hue+',100%,66%,'+alpha+')';
      ctx.lineWidth = wid;
      ctx.stroke();
    };
    curve(NA, 308, 1.7, 0.92);
    curve(NB, 192, 1.7, 0.92);
    curve(NC, 45,  1.4, 0.72);
  }

  const cx0 = px + pw*clamp(t/TTOT, 0, 1);
  ctx.beginPath();
  ctx.moveTo(cx0, py);
  ctx.lineTo(cx0, py+ph);
  ctx.strokeStyle = 'rgba(255,255,255,0.42)';
  ctx.lineWidth = 1;
  ctx.stroke();

  let cA=0,cB=0,cC=0;
  for(let i=0;i<atoms.length;i++){
    const s = atoms[i].state;
    if(s===0) cA++; else if(s===1) cB++; else cC++;
  }
  const tot = atoms.length || 1;
  const plot = function(v, hue){
    const yy = py + ph*(1 - clamp(v/N0, 0, 1));
    ctx.beginPath();
    ctx.arc(cx0, yy, 3.2, 0, 6.2832);
    ctx.fillStyle = 'hsla('+hue+',100%,90%,0.96)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx0, yy, 6.6, 0, 6.2832);
    ctx.fillStyle = 'hsla('+hue+',100%,72%,0.18)';
    ctx.fill();
  };
  plot(cA/tot*N0, 308);
  plot(cB/tot*N0, 192);
  plot(cC/tot*N0, 45);

  ctx.font = '9.5px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(150,210,255,0.55)';
  ctx.fillText('0', px-2, py+ph+4);
  ctx.textAlign = 'right';
  ctx.fillText(TTOT.toFixed(1)+' d', px+pw, py+ph+4);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(180,225,255,0.75)';
  ctx.fillText('N(t) / N₀', px, oy - 1);

  ctx.globalCompositeOperation = 'lighter';
}

function render(){
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(4,1,14,0.27)';
  ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation = 'lighter';

  drawNebula();
  drawRays();
  drawBursts();
  drawAtoms();
  drawChart();

  ctx.globalCompositeOperation = 'source-over';
}

/* ================= 点击探针 ================= */
const labels = [];

function addLabel(px, py){
  const a = NA(t), b = NB(t), c = NC(t);
  const nA = a/N0*100, nB = b/N0*100, nC = c/N0*100;

  const el = document.createElement('div');
  el.className = 'probe';
  el.innerHTML =
    '<i>t</i> = ' + t.toFixed(2) + ' d　(' + (t/THA).toFixed(2) + ' 个半衰期)<br>' +
    '<i>N<sub>A</sub></i> = ' + fmt(a) + '　<em>' + nA.toFixed(1) + '%</em><br>' +
    '<i>N<sub>B</sub></i> = ' + fmt(b) + '　<em>' + nB.toFixed(1) + '%</em><br>' +
    '<i>N<sub>C</sub></i> = ' + fmt(c) + '　<em>' + nC.toFixed(1) + '%</em>';
  el.style.opacity = '0';
  labelHost.appendChild(el);
  labels.push({ x:px, y:py, el:el, born:realT });

  while(labels.length > 4){
    const old = labels.shift();
    if(old.el.parentNode) old.el.parentNode.removeChild(old.el);
  }
}

function updateLabels(){
  for(let i=labels.length-1;i>=0;i--){
    const L = labels[i];
    const age = realT - L.born;
    if(age > 7){
      if(L.el.parentNode) L.el.parentNode.removeChild(L.el);
      labels.splice(i,1);
      continue;
    }
    let opa = 1;
    if(age < 0.26) opa = age/0.26;
    else if(age > 5.8) opa = (7-age)/1.2;
    L.el.style.opacity = clamp(opa,0,1).toFixed(2);
    L.el.style.left = L.x + 'px';
    L.el.style.top  = L.y + 'px';
  }
}

cvs.addEventListener('pointerdown', function(ev){
  const rect = cvs.getBoundingClientRect();
  addLabel(ev.clientX - rect.left, ev.clientY - rect.top);
});

/* ================= 底部读数（精简） ================= */
const tvEl = document.getElementById('tv');
const avEl = document.getElementById('av');
const bvEl = document.getElementById('bv');
const cvEl = document.getElementById('cv');

function updateReadout(){
  const a = NA(t), b = NB(t), c = NC(t);
  tvEl.textContent = t.toFixed(2) + 'd';
  avEl.textContent = (a/N0*100).toFixed(1) + '%';
  bvEl.textContent = (b/N0*100).toFixed(1) + '%';
  cvEl.textContent = (c/N0*100).toFixed(1) + '%';
}

/* ================= UI 绑定 ================= */
const n0s = document.getElementById('n0s');
const ths = document.getElementById('ths');
const n0v = document.getElementById('n0v');
const thv = document.getElementById('thv');

function recalc(){
  lamA = LN2/THA;
  lamB = LN2/THB;
  TTOT = THA*4;
}

function onN0(){
  N0 = Math.pow(10, parseFloat(n0s.value));
  n0v.textContent = fmt(N0);
}

function onTH(){
  THA = parseFloat(ths.value);
  thv.textContent = THA.toFixed(2) + ' d';
  recalc();
  t = 0;
  regenerate();
}

n0s.addEventListener('input', onN0);
ths.addEventListener('input', onTH);
showTheoryBox.addEventListener('change', function(){
  showTheory = showTheoryBox.checked;
});

/* ================= 主循环 ================= */
let lastT = performance.now()/1000;

function loop(nowMs){
  const now = nowMs/1000;
  let dt = now - lastT;
  if(!(dt > 0)) dt = 0.016;
  if(dt > 0.08) dt = 0.08;
  lastT = now;

  step(dt);
  render();
  updateReadout();
  updateLabels();

  requestAnimationFrame(loop);
}

window.addEventListener('resize', function(){ resize(); });
window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); });

/* ================= 启动 ================= */
resize();
recalc();
regenerate();
n0v.textContent = fmt(N0);
thv.textContent = THA.toFixed(2) + ' d';

requestAnimationFrame(function(ts0){
  resize();
  recalc();
  regenerate();
  lastT = ts0/1000;
  requestAnimationFrame(loop);
});

})();
</script>
