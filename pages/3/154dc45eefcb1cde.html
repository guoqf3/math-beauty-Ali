<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E8根系投影 · 八维空间水晶</title>
    <style>
        :root { --bg: #020508; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.08em;
            color: #cfc7b5; text-shadow: 0 0 40px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 0.9vw, 0.66rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,5,8,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.16);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.42rem, 0.78vw, 0.62rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.26);
            line-height: 1.55; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 13px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.36rem; white-space: normal; line-height: 1.35; }
            #title-overlay .title { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">E8根系投影 · 八维空间水晶</div>
        <div class="subtitle">E8 ROOT SYSTEM PROJECTION &nbsp;·&nbsp; 240 VECTORS</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">I:</span> (±1,±1,0,0,0,0,0,0)及排列 (112根) &nbsp;
            <span class="c2">II:</span> (±½,±½,±½,±½,±½,±½,±½,±½) 偶数个负 (128根)
            <br>
            <span class="c3">投影:</span> ℝ⁸→ℝ³ 随机正交基 &nbsp;|&nbsp; 自适应连接阈值 &nbsp;|&nbsp; 边≈3500+
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#020508');
        scene.fog = new THREE.Fog('#020508', 7, 20);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 24);
        camera.position.set(1.5, 0.8, 6.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c'; // 暖金 – 整数根
        const C2 = '#5d9ec6'; // 冰蓝 – 半整数根 (偶数负≥4)
        const C3 = '#c77d9f'; // 玫瑰粉 – 半整数根 (偶数负<4)
        const C_FRAME = '#3a4a5c';
        const C_GLINT = '#8898aa';

        // ==================== E8根向量生成 ====================
        function generateE8Roots() {
            const roots = [];
            // 类型I: (±1,±1,0,0,0,0,0,0) 所有排列，共112
            for (let i = 0; i < 8; i++) {
                for (let j = i + 1; j < 8; j++) {
                    for (let si = -1; si <= 1; si += 2) {
                        for (let sj = -1; sj <= 1; sj += 2) {
                            const vec = new Array(8).fill(0);
                            vec[i] = si;
                            vec[j] = sj;
                            roots.push({ vec, type: 'int' });
                        }
                    }
                }
            }
            // 类型II: (±½,…,±½) 偶数个负 (128个)
            for (let mask = 0; mask < 256; mask++) {
                const signBits = [];
                for (let b = 0; b < 8; b++) {
                    signBits.push((mask >> b) & 1 ? -1 : 1);
                }
                const negCount = signBits.filter(s => s === -1).length;
                if (negCount % 2 === 0) {
                    const vec = signBits.map(s => s * 0.5);
                    roots.push({ vec, type: 'half' });
                }
            }
            return roots;
        }

        const roots = generateE8Roots();
        console.log('生成E8根数量:', roots.length);

        // ==================== 随机正交投影基 ====================
        function randomOrthogonalBasis(dim = 8) {
            // 生成3个正交单位向量
            const basis = [];
            for (let k = 0; k < 3; k++) {
                const v = new Array(dim).fill(0).map(() => Math.random() * 2 - 1);
                // Gram-Schmidt
                for (let j = 0; j < k; j++) {
                    const b = basis[j];
                    const dot = v.reduce((s, vi, i) => s + vi * b[i], 0);
                    for (let i = 0; i < dim; i++) v[i] -= dot * b[i];
                }
                const len = Math.sqrt(v.reduce((s, x) => s + x * x, 0));
                if (len < 1e-8) { k--; continue; }
                v.forEach((_, i) => v[i] /= len);
                basis.push(v);
            }
            return basis;
        }

        let projRows = randomOrthogonalBasis();
        function project(vec8, rows) {
            const x = vec8.reduce((s, v, i) => s + v * rows[0][i], 0);
            const y = vec8.reduce((s, v, i) => s + v * rows[1][i], 0);
            const z = vec8.reduce((s, v, i) => s + v * rows[2][i], 0);
            return new THREE.Vector3(x, y, z);
        }

        let projected = roots.map(r => project(r.vec, projRows));
        // 缩放至球半径约2.6
        let maxNorm = Math.max(...projected.map(p => p.length()));
        let scaleFactor = 2.6 / (maxNorm || 1);
        projected.forEach(p => p.multiplyScalar(scaleFactor));

        // 颜色分类
        const colors = roots.map(r => {
            if (r.type === 'int') return 0;
            const negCount = r.vec.filter(v => v < 0).length;
            return negCount >= 4 ? 1 : 2;
        });

        // ==================== 自适应阈值与边生成 ====================
        function computeDistanceThreshold(points, percentile = 0.06) {
            const n = points.length;
            // 采样估算，最多计算5000对距离
            const sampleSize = Math.min(8000, n * (n - 1) / 2);
            const dists = [];
            for (let cnt = 0; cnt < sampleSize; cnt++) {
                const i = Math.floor(Math.random() * n);
                let j = Math.floor(Math.random() * n);
                if (i === j) j = (j + 1) % n;
                dists.push(points[i].distanceTo(points[j]));
            }
            dists.sort((a, b) => a - b);
            const idx = Math.floor(dists.length * percentile);
            return dists[Math.max(0, Math.min(idx, dists.length - 1))];
        }

        const threshold = computeDistanceThreshold(projected, 0.06);
        console.log('自适应连接阈值:', threshold.toFixed(3));

        // 清空原有边容器并重新生成
        let edgeVertices1 = [];
        let edgeVertices2 = [];
        let edgeVertices3 = [];
        const n = projected.length;
        for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
                const d = projected[i].distanceTo(projected[j]);
                if (d < threshold) {
                    const colorIdx = colors[i];
                    const a = projected[i];
                    const b = projected[j];
                    const arr = colorIdx === 0 ? edgeVertices1 : (colorIdx === 1 ? edgeVertices2 : edgeVertices3);
                    arr.push(a.x, a.y, a.z, b.x, b.y, b.z);
                }
            }
        }

        const totalEdges = edgeVertices1.length / 6 + edgeVertices2.length / 6 + edgeVertices3.length / 6;
        console.log('总边数:', totalEdges, '暖金:', edgeVertices1.length/6, '冰蓝:', edgeVertices2.length/6, '玫瑰粉:', edgeVertices3.length/6);

        function createLineSegments(vertices, colorHex, opacity) {
            if (vertices.length === 0) return new THREE.Group(); // 空组避免错误
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            return new THREE.LineSegments(geom, mat);
        }

        const lines1 = createLineSegments(edgeVertices1, C1, 0.6);
        const lines2 = createLineSegments(edgeVertices2, C2, 0.58);
        const lines3 = createLineSegments(edgeVertices3, C3, 0.59);

        const mainGroup = new THREE.Group();
        mainGroup.add(lines1);
        mainGroup.add(lines2);
        mainGroup.add(lines3);
        scene.add(mainGroup);

        // 参考球面线框
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 150;
            const circleDefs = [
                (a) => new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0),
                (a) => new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius),
                (a) => new THREE.Vector3(0, Math.cos(a)*radius, Math.sin(a)*radius),
            ];
            for (const gen of circleDefs) {
                const pts = [];
                for (let i=0; i<=segs; i++) pts.push(gen((i/segs)*Math.PI*2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(2.65, C_FRAME, 0.22);
        scene.add(sphereRef);

        // 原点标记
        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.1;
            const pairs = [
                [new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0)],
                [new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0)],
                [new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)],
            ];
            for (const [a,b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true, opacity: 0.7, depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(createOriginGlint());

        // ==================== 动画循环 ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s 边:${totalEdges}`);
                logTime = now;
            }

            mainGroup.rotation.y = time * 0.28;
            mainGroup.rotation.x = time * 0.17 + Math.sin(time * 0.23) * 0.22;
            mainGroup.rotation.z = Math.cos(time * 0.19) * 0.18;

            sphereRef.rotation.y += 0.0014;
            sphereRef.rotation.x += 0.0009;

            const camX = 1.5 + Math.sin(time * 0.14) * 0.55;
            const camY = 0.8 + Math.cos(time * 0.18) * 0.45;
            const camZ = 6.5 + Math.sin(time * 0.11) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== E8根系投影 · 八维空间水晶 ===');
        console.log(`总点数:${n} 边数:${totalEdges} 阈值:${threshold.toFixed(3)}`);
        console.log('✅ 初始帧渲染完成，启动动画');
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
