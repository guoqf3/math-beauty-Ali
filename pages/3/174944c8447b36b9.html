<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玻尔兹曼分布 · 统计力学</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#06040e;
  }
  canvas { display:block; }

  #topText {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    width:min(82vw,1060px);
    min-height:2.4em;
    text-align:center;
    color:#ffe8c0;
    font-size:clamp(13px,1.5vw,19.5px);
    letter-spacing:.07em;
    line-height:1.75;
    font-weight:400;
    text-shadow:0 0 16px rgba(255,200,110,.75),
                0 0 46px rgba(255,150,50,.35);
    pointer-events:none;
    z-index:10;
  }
  #topText::after {
    content:'';
    display:inline-block;
    width:2px; height:.95em;
    background:#ffc861;
    margin-left:5px;
    vertical-align:-.12em;
    box-shadow:0 0 9px #ffc861;
    animation:blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50%{opacity:0;} }

  .formula {
    position:fixed;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    color:rgba(255,210,150,.55);
    font-size:clamp(11px,1.02vw,15.5px);
    letter-spacing:.05em;
    pointer-events:none;
    z-index:10;
    text-shadow:0 0 14px rgba(255,170,70,.55);
    line-height:1.8;
  }
  .f-tl { top:94px; left:24px; text-align:left; }
  .f-tr { top:94px; right:24px; text-align:right; }
  .f-bl { bottom:44px; left:24px; text-align:left; }

  #panel {
    position:fixed; right:24px; bottom:44px;
    width:240px;
    padding:13px 15px 11px;
    background:rgba(24,16,8,.52);
    border:1px solid rgba(255,180,90,.24);
    border-radius:11px;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    color:#d8b98c;
    font-size:12px;
    z-index:20;
    box-shadow:0 6px 30px rgba(0,0,0,.55),
               inset 0 0 22px rgba(255,150,50,.08);
  }
  #panel .row {
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:4px 8px;
    margin-bottom:11px;
  }
  #panel .row label { grid-column:1/3; letter-spacing:.05em; }
  #panel .row .val {
    font-family:"Cambria Math",Georgia,serif;
    color:#ffd27a;
    font-size:12px;
    min-width:46px;
    text-align:right;
  }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:100%; height:3px; border-radius:3px;
    background:linear-gradient(90deg,#5533aa,#ff8c2a,#ffe066);
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:#fff2d8;
    box-shadow:0 0 12px rgba(255,190,80,.95);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb {
    width:13px; height:13px; border:none; border-radius:50%;
    background:#fff2d8;
    box-shadow:0 0 12px rgba(255,190,80,.95);
    cursor:pointer;
  }
  #panel .hint {
    text-align:center;
    font-size:10.5px;
    color:rgba(215,180,130,.5);
    letter-spacing:.1em;
    margin-top:2px;
  }
</style>
</head>
<body>

<div id="topText"></div>

<div class="formula f-tl">
  P(Eᵢ) = exp(−Eᵢ / kT) / Z<br>
  Z = Σⱼ exp(−Eⱼ / kT)
</div>
<div class="formula f-tr">
  配分函数 Z　·　能级 Eᵢ<br>
  温度 T　·　占据概率 P
</div>
<div class="formula f-bl">
  自然界偏爱低能态　·　温度升高则高能级被激活
</div>

<div id="panel">
  <div class="row">
    <label>温度 T （kT 能量尺度）</label>
    <input id="sT" type="range" min="0.40" max="6.00" step="0.01" value="0.55">
    <span class="val" id="vT">0.55</span>
  </div>
  <div class="hint">拖拽旋转 · 观察能级占据分布</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06040e, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06040e, 0.011);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 900);
camera.position.set(0, 6.8, 19.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.enablePan = false;
controls.minDistance = 9;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.56;

/* ============================================================
   光点贴图
   ============================================================ */
function createSpriteTexture(){
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.18,'rgba(255,255,255,0.82)');
  g.addColorStop(0.46,'rgba(255,255,255,0.22)');
  g.addColorStop(1.00,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,s,s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPRITE = createSpriteTexture();

/* ============================================================
   能级定义
   ============================================================ */
const N_LEVELS = 8;
const SPACING  = 2.05;
const DY       = 0.82;

const LEVEL_X = [];
const LEVEL_Y = [];
for (let i = 0; i < N_LEVELS; i++){
  LEVEL_X.push((i - (N_LEVELS - 1) / 2) * SPACING);
  LEVEL_Y.push(0.45 + i * DY);
}

/* ============================================================
   粒子参数
   ============================================================ */
const TOTAL = 850;

const curPos    = new Float32Array(TOTAL * 3);
const posArr    = new Float32Array(TOTAL * 3);
const colArr    = new Float32Array(TOTAL * 3);
const offsetArr = new Float32Array(TOTAL * 3);
const uArr      = new Float32Array(TOTAL);

/* ---- 初始化粒子的固定属性 ---- */
(function initParticles(){
  for (let i = 0; i < TOTAL; i++){
    // 单位球内均匀随机方向 + 三次方根半径
    let ux, uy, uz, d2;
    do {
      ux = Math.random() * 2 - 1;
      uy = Math.random() * 2 - 1;
      uz = Math.random() * 2 - 1;
      d2 = ux*ux + uy*uy + uz*uz;
    } while (d2 > 1);

    const rr = Math.cbrt(Math.random());
    offsetArr[i*3    ] = ux * rr;
    offsetArr[i*3 + 1] = uy * rr;
    offsetArr[i*3 + 2] = uz * rr;

    uArr[i] = Math.random();

    // 初始位置（最低能级）
    const x0 = LEVEL_X[0] + offsetArr[i*3] * 0.6;
    const y0 = LEVEL_Y[0] + 0.3 + offsetArr[i*3 + 1] * 0.6;
    const z0 = offsetArr[i*3 + 2] * 0.6;

    curPos[i*3]     = x0;
    curPos[i*3 + 1] = y0;
    curPos[i*3 + 2] = z0;
    posArr[i*3]     = x0;
    posArr[i*3 + 1] = y0;
    posArr[i*3 + 2] = z0;
  }
})();

/* ============================================================
   颜色映射（金 → 品红 → 灰蓝，随能级升高饱和度降低）
   ============================================================ */
const COLOR_GOLD   = new THREE.Color(0xffbb33);
const COLOR_MAGENTA= new THREE.Color(0xdd44cc);
const COLOR_BLUE   = new THREE.Color(0x6688cc);
const _tmpColor    = new THREE.Color();

function levelColor(t, out){
  t = Math.max(0, Math.min(1, t));
  if (t < 0.5){
    out.copy(COLOR_GOLD).lerp(COLOR_MAGENTA, t * 2);
  } else {
    out.copy(COLOR_MAGENTA).lerp(COLOR_BLUE, (t - 0.5) * 2);
  }
  return out;
}

/* ============================================================
   星空背景
   ============================================================ */
(function buildStars(){
  const COUNT = 1000;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++){
    const r  = 80 + Math.random() * 170;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3    ] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.6 + 22;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th);

    const t = Math.random();
    col[i*3    ] = 0.65 + 0.35 * t;
    col[i*3 + 1] = 0.55 + 0.35 * t;
    col[i*3 + 2] = 0.45 + 0.25 * t;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 0.85, map: SPRITE, vertexColors: true,
    transparent: true, opacity: 0.6,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* ============================================================
   地面网格
   ============================================================ */
const grid = new THREE.GridHelper(46, 46, 0x33203a, 0x1f1228);
grid.position.y = -0.02;
grid.material.transparent = true;
grid.material.opacity = 0.32;
scene.add(grid);

/* ============================================================
   能级柱体（金色台阶）
   ============================================================ */
const plateGeo = new THREE.BoxGeometry(2.15, 0.07, 1.30);
const beamGeo  = new THREE.CylinderGeometry(0.035, 0.035, 1, 8);
const edgesGeo = new THREE.EdgesGeometry(plateGeo);

for (let i = 0; i < N_LEVELS; i++){
  const x = LEVEL_X[i];
  const y = LEVEL_Y[i];

  /* ---- 平台板 ---- */
  const plateMat = new THREE.MeshBasicMaterial({
    color: 0xddaa55,
    transparent: true,
    opacity: 0.34,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const plate = new THREE.Mesh(plateGeo, plateMat);
  plate.position.set(x, y, 0);
  plate.renderOrder = 2;
  scene.add(plate);

  /* ---- 发光边缘 ---- */
  const edgeMat = new THREE.LineBasicMaterial({
    color: 0xffcc66,
    transparent: true,
    opacity: 0.78,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const edge = new THREE.LineSegments(edgesGeo, edgeMat);
  edge.position.copy(plate.position);
  edge.renderOrder = 3;
  scene.add(edge);

  /* ---- 竖直支撑光柱 ---- */
  const beamMat = new THREE.MeshBasicMaterial({
    color: 0xaa7733,
    transparent: true,
    opacity: 0.20,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const beam = new THREE.Mesh(beamGeo, beamMat);
  beam.scale.y = y;
  beam.position.set(x, y / 2, 0);
  beam.renderOrder = 1;
  scene.add(beam);
}

/* ============================================================
   粒子系统
   ============================================================ */
const partGeo = new THREE.BufferGeometry();
partGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
partGeo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));

const partMat = new THREE.PointsMaterial({
  size: 0.30,
  map: SPRITE,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});

const partPoints = new THREE.Points(partGeo, partMat);
partPoints.frustumCulled = false;
partPoints.renderOrder = 6;
scene.add(partPoints);

/* ============================================================
   更新粒子分布
   ============================================================ */
const _probs  = new Float32Array(N_LEVELS);
const _cdf    = new Float32Array(N_LEVELS);
const _radius = new Float32Array(N_LEVELS);

function updateParticles(T, dt){
  /* ---- 玻尔兹曼分布 ---- */
  let Z = 0;
  for (let i = 0; i < N_LEVELS; i++){
    _probs[i] = Math.exp(-i / T);
    Z += _probs[i];
  }
  const invZ = 1 / Z;
  let cum = 0;
  for (let i = 0; i < N_LEVELS; i++){
    _probs[i] *= invZ;
    cum += _probs[i];
    _cdf[i] = cum;
    _radius[i] = 0.20 + 0.80 * Math.sqrt(_probs[i]);
  }

  /* ---- 平滑跟随系数 ---- */
  const k = 1 - Math.exp(-dt * 4.2);

  const yLo = LEVEL_Y[0];
  const yHi = LEVEL_Y[N_LEVELS - 1];
  const invSpan = 1 / (yHi - yLo);

  for (let p = 0; p < TOTAL; p++){
    const p3 = p * 3;

    /* ---- 由固定 u 反推能级 ---- */
    const u = uArr[p];
    let lv = N_LEVELS - 1;
    for (let i = 0; i < N_LEVELS; i++){
      if (u <= _cdf[i]){ lv = i; break; }
    }

    /* ---- 目标位置 ---- */
    const R  = _radius[lv];
    const ox = offsetArr[p3];
    const oy = offsetArr[p3 + 1];
    const oz = offsetArr[p3 + 2];

    const tx = LEVEL_X[lv] + ox * R;
    const ty = LEVEL_Y[lv] + 0.26 + oy * R * 0.85;
    const tz = oz * R * 0.92;

    /* ---- 平滑迁移 ---- */
    const cx = curPos[p3]     + (tx - curPos[p3])     * k;
    const cy = curPos[p3 + 1] + (ty - curPos[p3 + 1]) * k;
    const cz = curPos[p3 + 2] + (tz - curPos[p3 + 2]) * k;

    curPos[p3]     = cx;
    curPos[p3 + 1] = cy;
    curPos[p3 + 2] = cz;

    posArr[p3]     = cx;
    posArr[p3 + 1] = cy;
    posArr[p3 + 2] = cz;

    /* ---- 颜色由当前高度决定 ---- */
    const hFrac = Math.max(0, Math.min(1, (cy - yLo) * invSpan));
    levelColor(hFrac, _tmpColor);

    // 低能级更明亮
    const bright = 1.0 - 0.45 * hFrac;
    colArr[p3]     = _tmpColor.r * bright;
    colArr[p3 + 1] = _tmpColor.g * bright;
    colArr[p3 + 2] = _tmpColor.b * bright;
  }

  partGeo.attributes.position.needsUpdate = true;
  partGeo.attributes.color.needsUpdate = true;
}

/* ============================================================
   温度控制
   ============================================================ */
const DURATION = 30;

const sTEl = document.getElementById('sT');
const vTEl = document.getElementById('vT');

let userT     = 0.55;
let userTimer = 0;     // 秒

sTEl.addEventListener('input', e => {
  userT = parseFloat(e.target.value);
  vTEl.textContent = userT.toFixed(2);
  userTimer = 4.0;     // 手动控制保持 4 秒
});

/* 自动温度曲线：0.55 → 5.15 → 0.55 */
function autoTemperature(t){
  const phase = t / DURATION;
  const k = 0.5 - 0.5 * Math.cos(2 * Math.PI * phase);
  return 0.55 + k * 4.60;
}

/* ============================================================
   顶部文字
   ============================================================ */
const FULL_TEXT = '玻尔兹曼分布刻画热能驱动下系统状态按能量的指数概率分布——自然界偏爱低能量态，启示秩序与能量同温度权衡的统计本质规律。';
const topTextEl = document.getElementById('topText');
let lastShown = '';

function smoothstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function updateTopText(animT){
  const prog  = smoothstep(0.8, 25.5, animT);
  const n     = Math.floor(prog * FULL_TEXT.length);
  const shown = FULL_TEXT.slice(0, n);
  if (shown !== lastShown){
    topTextEl.textContent = shown;
    lastShown = shown;
  }
}

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let animT = 0;

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  animT += dt;
  if (animT >= DURATION) animT -= DURATION;

  /* ---- 温度：用户优先，否则自动曲线 ---- */
  let T;
  if (userTimer > 0){
    userTimer -= dt;
    T = userT;
  } else {
    T = autoTemperature(animT);
    // 同步滑块显示
    const cur = parseFloat(sTEl.value);
    if (Math.abs(cur - T) > 0.012){
      sTEl.value = T.toFixed(2);
      vTEl.textContent = T.toFixed(2);
    }
  }

  /* ---- 粒子分布 ---- */
  updateParticles(T, dt);

  /* ---- 文字 ---- */
  updateTopText(animT);

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   启动
   ============================================================ */
animate();

/* ============================================================
   自适应
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
