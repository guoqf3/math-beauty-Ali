<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小波变换 · 多尺度分析</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#02040c;
  }
  canvas { display:block; }

  #topText {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    width:min(82vw,1060px);
    min-height:2.4em;
    text-align:center;
    color:#d8ecff;
    font-size:clamp(13px,1.5vw,19.5px);
    letter-spacing:.07em;
    line-height:1.75;
    font-weight:400;
    text-shadow:0 0 16px rgba(110,200,255,.7),
                0 0 44px rgba(60,140,255,.35);
    pointer-events:none;
    z-index:10;
  }
  #topText::after {
    content:'';
    display:inline-block;
    width:2px; height:.95em;
    background:#7dffe0;
    margin-left:5px;
    vertical-align:-.12em;
    box-shadow:0 0 9px #7dffe0;
    animation:blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50%{opacity:0;} }

  .formula {
    position:fixed;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    color:rgba(150,205,255,.52);
    font-size:clamp(11px,1.02vw,15.5px);
    letter-spacing:.05em;
    pointer-events:none;
    z-index:10;
    text-shadow:0 0 14px rgba(80,160,255,.6);
    white-space:nowrap;
  }
  .f-tl { top:96px; left:24px; }
  .f-tr { top:96px; right:24px; text-align:right; }
  .f-bl { bottom:42px; left:24px; }

  #panel {
    position:fixed; right:24px; bottom:42px;
    width:232px;
    padding:13px 15px 10px;
    background:rgba(8,16,36,.52);
    border:1px solid rgba(80,160,255,.22);
    border-radius:11px;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    color:#95b2dd;
    font-size:12px;
    z-index:20;
    box-shadow:0 6px 30px rgba(0,0,0,.5),
               inset 0 0 22px rgba(60,130,255,.07);
  }
  #panel .row {
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:4px 8px;
    margin-bottom:11px;
  }
  #panel .row label { grid-column:1/3; letter-spacing:.05em; }
  #panel .row .val {
    font-family:"Cambria Math",Georgia,serif;
    color:#7dffe0;
    font-size:12px;
    min-width:42px;
    text-align:right;
  }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:100%; height:3px; border-radius:3px;
    background:linear-gradient(90deg,#00e0c0,#6a4dff,#ff4d9e);
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:#e8fff8;
    box-shadow:0 0 12px rgba(80,255,220,.95);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb {
    width:13px; height:13px; border:none; border-radius:50%;
    background:#e8fff8;
    box-shadow:0 0 12px rgba(80,255,220,.95);

  }
  #panel .hint {

    color:rgba(130,170,215,.5);
    letter-spacing:.1em;
    margin-top:2px;
  }
</style>
</head>
<body>

<div id="topText"></div>

<div class="formula f-tl">W(a,b) = 1/√a · ∫ f(t) · ψ*((t−b)/a) dt</div>
<div class="formula f-tr">尺度 a ↔ 频率　平移 b ↔ 时间</div>
<div class="formula f-bl">小波：变窗换时频兼顾　细看/概览由尺度取舍</div>

<div id="panel">
  <div class="row">
    <label>尺度参数 a</label>
    <input id="sA" type="range" min="0.15" max="2.50" step="0.01" value="0.80">
    <span class="val" id="vA">0.80</span>
  </div>
  <div class="hint">拖拽旋转视角 · 观察时频曲面</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x02040c, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02040c, 0.0068);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 900);
camera.position.set(4.5, 10.5, 27);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.enablePan = false;
controls.minDistance = 12;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.56;

/* ============================================================
   光点贴图
   ============================================================ */
function createSpriteTexture(){
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.18,'rgba(255,255,255,0.80)');
  g.addColorStop(0.48,'rgba(255,255,255,0.22)');
  g.addColorStop(1.00,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,s,s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPRITE = createSpriteTexture();

/* ============================================================
   参数域
   ============================================================ */
const B_MIN = -13, B_MAX = 13;
const A_MIN = 0.15, A_MAX = 2.50;
const A_MID = (A_MIN + A_MAX) * 0.5;
const A_HALF = (A_MAX - A_MIN) * 0.5;
const Z_HALF = 4.4;

function zFromA(a){
  return (A_MID - a) / A_HALF * Z_HALF;
}
function aFromZ(z){
  return A_MID - z / Z_HALF * A_HALF;
}

const DURATION = 30;

/* ============================================================
   合成信号
   ============================================================ */
function signalF(t){
  return 1.10 * Math.exp(-Math.pow(t-5.0, 2) / 6.0)  * Math.sin(2.50*t)
       + 0.90 * Math.exp(-Math.pow(t+4.5, 2) / 7.5) * Math.sin(1.20*t)
       + 0.55 * Math.exp(-Math.pow(t-0.3, 2) / 15.0)* Math.sin(0.55*t);
}

/* 母小波：Morlet 实部 ψ(u) = e^(−u²/2)·cos(5u) */
function morlet(u){
  return Math.exp(-0.5*u*u) * Math.cos(5.0*u);
}

/* ============================================================
   小波系数矩阵  W(a,b) = 1/√a ∫ f(t)·ψ((t−b)/a) dt
   ============================================================ */
const NB = 88, NA = 32;
const sgram = new Float32Array(NB * NA);
let maxAbs = 1e-9;

(function computeSgram(){
  const NW = 72;
  for (let ia = 0; ia < NA; ia++){
    const a = A_MIN + (ia/(NA-1)) * (A_MAX - A_MIN);
    const invSqrtA = 1 / Math.sqrt(a);
    const hw = 5.0 * a;
    for (let ib = 0; ib < NB; ib++){
      const b = B_MIN + (ib/(NB-1)) * (B_MAX - B_MIN);
      const t0 = b - hw, t1 = b + hw;
      const dtt = (t1 - t0) / (NW - 1);
      let sum = 0;
      for (let k = 0; k < NW; k++){
        const t = t0 + k * dtt;
        sum += signalF(t) * morlet((t - b) / a);
      }
      sum *= dtt * invSqrtA;
      const idx = ia * NB + ib;
      sgram[idx] = sum;
      const av = Math.abs(sum);
      if (av > maxAbs) maxAbs = av;
    }
  }
})();

/* 双线性采样 */
function sampleSgram(a, b){
  const fa = (a - A_MIN) / (A_MAX - A_MIN) * (NA - 1);
  const fb = (b - B_MIN) / (B_MAX - B_MIN) * (NB - 1);
  const ia = Math.max(0, Math.min(NA - 2, Math.floor(fa)));
  const ib = Math.max(0, Math.min(NB - 2, Math.floor(fb)));
  const ta = fa - ia, tb = fb - ib;
  const v00 = sgram[ia*NB + ib],     v01 = sgram[ia*NB + ib + 1];
  const v10 = sgram[(ia+1)*NB + ib], v11 = sgram[(ia+1)*NB + ib + 1];
  const v0 = v00 + (v01 - v00) * tb;
  const v1 = v10 + (v11 - v10) * tb;
  return v0 + (v1 - v0) * ta;
}

/* ============================================================
   彩虹色标
   ============================================================ */
const CMAP_P = [0.00, 0.14, 0.30, 0.48, 0.66, 0.84, 1.00];
const CMAP_C = [0x061634, 0x1a4fd6, 0x00c8ff, 0x22ff88, 0xffe600, 0xff6600, 0xff2266];
const CMAP_T = CMAP_C.map(h => new THREE.Color(h));

function cmap(t){
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < CMAP_P.length - 1; i++){
    if (t <= CMAP_P[i+1]){
      const f = (t - CMAP_P[i]) / (CMAP_P[i+1] - CMAP_P[i]);
      return CMAP_T[i].clone().lerp(CMAP_T[i+1], f);
    }
  }
  return CMAP_T[CMAP_T.length - 1].clone();
}

/* ============================================================
   星空背景
   ============================================================ */
(function buildStars(){
  const COUNT = 900;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++){
    const r  = 85 + Math.random() * 160;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3    ] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.6 + 30;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    size: 0.9, map: SPRITE, color: 0x88aaff,
    transparent: true, opacity: 0.45,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* ============================================================
   时频曲面
   ============================================================ */
const H_MAX = 4.8;

const baseAmp = new Float32Array(NB * NA);
const surfPos = new Float32Array(NB * NA * 3);
const surfCol = new Float32Array(NB * NA * 3);

for (let ia = 0; ia < NA; ia++){
  const a = A_MIN + (ia/(NA-1)) * (A_MAX - A_MIN);
  for (let ib = 0; ib < NB; ib++){
    const idx = ia * NB + ib;
    const i3  = idx * 3;
    const b   = B_MIN + (ib/(NB-1)) * (B_MAX - B_MIN);

    const v   = Math.abs(sgram[idx]) / maxAbs;
    const amp = Math.pow(v, 0.72);
    baseAmp[idx] = amp;

    surfPos[i3]     = b;
    surfPos[i3 + 1] = 0;
    surfPos[i3 + 2] = zFromA(a);

    const c = cmap(amp);
    surfCol[i3]     = c.r;
    surfCol[i3 + 1] = c.g;
    surfCol[i3 + 2] = c.b;
  }
}

const surfGeo = new THREE.BufferGeometry();
surfGeo.setAttribute('position', new THREE.BufferAttribute(surfPos, 3));
surfGeo.setAttribute('color',    new THREE.BufferAttribute(surfCol, 3));

const surfIndices = [];
for (let ia = 0; ia < NA - 1; ia++){
  for (let ib = 0; ib < NB - 1; ib++){
    const p = ia * NB + ib;
    surfIndices.push(p, p + 1, p + NB);
    surfIndices.push(p + 1, p + NB + 1, p + NB);
  }
}
surfGeo.setIndex(surfIndices);

const surfMat = new THREE.MeshBasicMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.88,
  blending: THREE.NormalBlending,
  depthWrite: false
});
const surfMesh = new THREE.Mesh(surfGeo, surfMat);
surfMesh.renderOrder = 2;
surfMesh.frustumCulled = false;
scene.add(surfMesh);

/* ---- 曲面上方的线框叠加（增强网格感） ---- */
const wirePos = new Float32Array(NB * NA * 3);
wirePos.set(surfPos);
const wireGeo = new THREE.BufferGeometry();
wireGeo.setAttribute('position', new THREE.BufferAttribute(wirePos, 3));
const wireIdx = [];
for (let ia = 0; ia < NA; ia += 2){
  for (let ib = 0; ib < NB - 1; ib++){
    const p = ia * NB + ib;
    wireIdx.push(p, p + 1);
  }
}
for (let ia = 0; ia < NA - 1; ia++){
  for (let ib = 0; ib < NB; ib += 4){
    const p = ia * NB + ib;
    wireIdx.push(p, p + NB);
  }
}
wireGeo.setIndex(wireIdx);
const wireMesh = new THREE.LineSegments(wireGeo, new THREE.LineBasicMaterial({
  color: 0x88ddff,
  transparent: true,
  opacity: 0.085,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
wireMesh.renderOrder = 3;
wireMesh.frustumCulled = false;
scene.add(wireMesh);

/* ============================================================
   地面信号曲线（银线）
   ============================================================ */
(function buildSignalLine(){
  const SN = 400;
  const pos = new Float32Array(SN * 3);
  for (let i = 0; i < SN; i++){
    const t = B_MIN + (i/(SN-1)) * (B_MAX - B_MIN);
    pos[i*3]     = t;
    pos[i*3 + 1] = -1.15 + signalF(t) * 0.62;
    pos[i*3 + 2] = Z_HALF + 1.6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({
    color: 0xcfd8ff,
    transparent: true,
    opacity: 0.68,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  l.renderOrder = 6;
  l.frustumCulled = false;
  scene.add(l);
})();

/* ---- 时间轴基线 ---- */
(function buildTimeAxis(){
  const pts = [
    new THREE.Vector3(B_MIN, -1.15, Z_HALF + 1.6),
    new THREE.Vector3(B_MAX, -1.15, Z_HALF + 1.6)
  ];
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({
    color: 0x7f96c8, transparent: true, opacity: 0.42,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  l.frustumCulled = false;
  scene.add(l);

  // 刻度
  for (let t = B_MIN; t <= B_MAX + 0.01; t += 2){
    const p1 = new THREE.Vector3(t, -1.15, Z_HALF + 1.6);
    const p2 = new THREE.Vector3(t, -1.50, Z_HALF + 1.6);
    const g2 = new THREE.BufferGeometry().setFromPoints([p1, p2]);
    const l2 = new THREE.Line(g2, new THREE.LineBasicMaterial({
      color: 0x7f96c8, transparent: true, opacity: 0.28,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    l2.frustumCulled = false;
    scene.add(l2);
  }
})();

/* ============================================================
   尺度轴 + 金色频率刻度环
   ============================================================ */
const AXIS_X = 15.8;

(function buildScaleAxis(){
  const p1 = new THREE.Vector3(AXIS_X, 0.0, -Z_HALF);
  const p2 = new THREE.Vector3(AXIS_X, 0.0,  Z_HALF);
  const g = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({
    color: 0x7f96c8, transparent: true, opacity: 0.36,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  l.frustumCulled = false;
  scene.add(l);

  const ringGeo = new THREE.TorusGeometry(0.40, 0.055, 8, 26);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffcc55,
    transparent: true,
    opacity: 0.62,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  for (let a = 0.25; a <= A_MAX; a += 0.25){
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.y = Math.PI / 2;
    ring.position.set(AXIS_X, 0, zFromA(a));
    ring.renderOrder = 5;
    scene.add(ring);
  }
})();

/* ============================================================
   扫掠光带（小波窗前沿）
   ============================================================ */
const sweepMat = new THREE.MeshBasicMaterial({
  color: 0x66e8ff,
  transparent: true,
  opacity: 0.0,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  depthWrite: false
});
const sweepMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), sweepMat);
sweepMesh.rotation.y = Math.PI / 2;
sweepMesh.scale.set(9.2, 6.2, 1);
sweepMesh.renderOrder = 7;
scene.add(sweepMesh);

/* ---- 光带边缘发光核 ---- */
const sweepCore = new THREE.Sprite(new THREE.SpriteMaterial({
  map: SPRITE, color: 0x9df2ff,
  transparent: true, opacity: 0.0,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
sweepCore.scale.set(4.2, 4.2, 1);
sweepCore.renderOrder = 9;
scene.add(sweepCore);

/* ============================================================
   小波窗标记（随尺度伸缩的环）
   ============================================================ */
const winRing = new THREE.Mesh(
  new THREE.TorusGeometry(1, 0.055, 10, 48),
  new THREE.MeshBasicMaterial({
    color: 0xffe066,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
winRing.rotation.y = Math.PI / 2;
winRing.renderOrder = 10;
scene.add(winRing);

const winGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: SPRITE, color: 0xffe9a0,
  transparent: true, opacity: 0.75,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
winGlow.renderOrder = 9;
scene.add(winGlow);

/* ============================================================
   流动粒子拖尾
   ============================================================ */
const PART_N = 260;
const partB    = new Float32Array(PART_N);
const partA    = new Float32Array(PART_N);
const partV    = new Float32Array(PART_N);
const partLife = new Float32Array(PART_N);
const partPos  = new Float32Array(PART_N * 3);
const partCol  = new Float32Array(PART_N * 3);

const partGeo = new THREE.BufferGeometry();
partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
partGeo.setAttribute('color',    new THREE.BufferAttribute(partCol, 3));
const partMat = new THREE.PointsMaterial({
  size: 0.24, map: SPRITE, vertexColors: true,
  transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false,
  sizeAttenuation: true
});
const partPoints = new THREE.Points(partGeo, partMat);
partPoints.frustumCulled = false;
partPoints.renderOrder = 8;
scene.add(partPoints);

/* ============================================================
   界面交互
   ============================================================ */
let sliderA = 0.80;

const sAEl = document.getElementById('sA');
const vAEl = document.getElementById('vA');

sAEl.addEventListener('input', e => {
  sliderA = parseFloat(e.target.value);
  vAEl.textContent = sliderA.toFixed(2);
});

/* ============================================================
   工具
   ============================================================ */
function smoothstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/* ============================================================
   顶部文字
   ============================================================ */
const FULL_TEXT = '小波以变窗换取时频兼顾——既得位置又得频率，启示解决问题要选择合适尺度辩证看待细节与全局的取舍。';
const topTextEl = document.getElementById('topText');
let lastShown = '';

function updateTopText(animT){
  const prog  = smoothstep(0.6, 23, animT);
  const n     = Math.floor(prog * FULL_TEXT.length);
  const shown = FULL_TEXT.slice(0, n);
  if (shown !== lastShown){
    topTextEl.textContent = shown;
    lastShown = shown;
  }
}

/* ============================================================
   曲面高度采样（用于粒子/窗口）
   ============================================================ */
function surfaceHeight(a, b){
  const v = Math.abs(sampleSgram(a, b)) / maxAbs;
  return Math.pow(v, 0.72) * H_MAX;
}

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let animT = 0;

const surfPosArr = surfGeo.attributes.position.array;
const wirePosArr = wireGeo.attributes.position.array;

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  animT += dt;
  if (animT >= DURATION) animT -= DURATION;

  /* ---------- 扫掠前沿位置 ---------- */
  let revealB;
  let sweepActive = 1.0;

  if (animT < 2.0){
    revealB = B_MIN;
    sweepActive = smoothstep(0.4, 2.0, animT) * 0.35;
  } else if (animT < 24.0){
    revealB = B_MIN + (animT - 2.0) / 22.0 * (B_MAX - B_MIN);
    sweepActive = 1.0;
  } else {
    revealB = B_MAX;
    sweepActive = 1.0 - smoothstep(24.5, 28.5, animT) * 0.7;
  }

  /* ---------- 曲面生长 ---------- */
  const reveal = revealB;

  for (let ia = 0; ia < NA; ia++){
    for (let ib = 0; ib < NB; ib++){
      const idx = ia * NB + ib;
      const i3  = idx * 3;
      const b   = surfPosArr[i3];

      let rev = (reveal - b) / 2.6;
      rev = rev < 0 ? 0 : (rev > 1 ? 1 : rev);
      rev = rev * rev * (3 - 2 * rev);

      const ripple = 0.94 + 0.06 * Math.sin(animT * 2.4 + b * 0.55 + ia * 0.42);
      const y = baseAmp[idx] * H_MAX * rev * ripple;

      surfPosArr[i3 + 1] = y;
      wirePosArr[i3 + 1] = y;
    }
  }
  surfGeo.attributes.position.needsUpdate = true;
  wireGeo.attributes.position.needsUpdate = true;

  /* ---------- 扫掠光带 ---------- */
  const sweepX = revealB;
  const sweepOp = sweepActive * (animT < 24.5 ? 0.20 : 0.08);

  sweepMat.opacity = sweepOp;
  sweepMesh.visible = sweepOp > 0.005;
  sweepMesh.position.set(sweepX, 2.6, 0);

  sweepCore.material.opacity = sweepActive * 0.72;
  sweepCore.visible = sweepActive > 0.02;
  sweepCore.position.set(sweepX, 1.6, 0);
  const scPulse = 1 + 0.16 * Math.sin(animT * 4.4);
  sweepCore.scale.set(4.0 * scPulse, 4.0 * scPulse, 1);

  /* ---------- 小波窗环 ---------- */
  const winZ = zFromA(sliderA);
  const winR = 0.45 + sliderA * 0.85;
  const winY = surfaceHeight(sliderA, revealB - 0.4) * 0.65 + winR * 0.55 + 0.25;

  winRing.scale.setScalar(winR);
  winRing.position.set(sweepX, winY, winZ);
  winRing.material.opacity = 0.55 + 0.28 * Math.sin(animT * 3.2);

  winGlow.scale.set(winR * 3.6, winR * 3.6, 1);
  winGlow.position.set(sweepX, winY, winZ);
  winGlow.material.opacity = 0.55 + 0.22 * Math.sin(animT * 3.9);

  /* ---------- 流动粒子 ---------- */
  const canSpawn = (animT > 2.2 && animT < 24.0);
  const pPos = partGeo.attributes.position.array;
  const pCol = partGeo.attributes.color.array;

  for (let i = 0; i < PART_N; i++){
    if (partLife[i] <= 0){
      if (!canSpawn){
        pPos[i*3 + 1] = -999;
        pCol[i*3] = pCol[i*3+1] = pCol[i*3+2] = 0;
        continue;
      }
      partB[i]    = revealB + (Math.random() - 0.4) * 1.4;
      partA[i]    = A_MIN + Math.random() * (A_MAX - A_MIN);
      partV[i]    = 3.0 + Math.random() * 6.0;
      partLife[i] = 0.55 + Math.random() * 0.75;
    }

    partLife[i] -= dt;
    partB[i]    -= partV[i] * dt;

    if (partLife[i] <= 0 || partB[i] < B_MIN - 1.5){
      partLife[i] = 0;
      pPos[i*3 + 1] = -999;
      pCol[i*3] = pCol[i*3+1] = pCol[i*3+2] = 0;
      continue;
    }

    const b = partB[i];
    const a = partA[i];
    const h = surfaceHeight(a, b);

    pPos[i*3]     = b;
    pPos[i*3 + 1] = h + 0.12 + 0.22 * Math.sin(animT * 6 + i);
    pPos[i*3 + 2] = zFromA(a);

    const lf = Math.min(1, partLife[i] / 0.55);
    pCol[i*3]     = 0.38 * lf + 0.30;
    pCol[i*3 + 1] = 0.88 * lf + 0.10;
    pCol[i*3 + 2] = 1.00 * lf;
  }
  partGeo.attributes.position.needsUpdate = true;
  partGeo.attributes.color.needsUpdate = true;

  /* ---------- 文字 ---------- */
  updateTopText(animT);

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   自适应
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
