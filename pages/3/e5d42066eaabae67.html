<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大模型涌现现象 · Emergence in LLM</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#03030a;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;color:#e8ecff;}
  canvas#scene{display:block;position:fixed;inset:0;}

  /* ---------- 顶部：启迪意义说明 ---------- */
  #topHud{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:min(1040px,94vw);padding:16px 28px 26px;text-align:center;
    z-index:12;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,3,18,.92) 0%,rgba(5,3,18,.55) 62%,rgba(5,3,18,0) 100%);
  }
  .hudTitle{
    font-size:13px;letter-spacing:10px;color:#a89bff;margin-bottom:10px;
    text-shadow:0 0 18px rgba(150,110,255,.85);font-weight:600;
  }
  .hudTitle::before,.hudTitle::after{content:"◆";font-size:8px;vertical-align:middle;
    color:#ffd166;opacity:.8;letter-spacing:0;margin:0 12px;}
  .hudText{
    font-size:17px;line-height:1.78;color:rgba(224,232,255,.94);
    text-shadow:0 0 14px rgba(110,140,255,.55);min-height:62px;
    letter-spacing:.6px;
  }
  .hudText::after{content:"▌";color:#7cf0ff;animation:blink .9s steps(1) infinite;
    margin-left:2px;font-size:14px;opacity:.9;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- 左侧：公式面板 ---------- */
  #formulaPanel{
    position:fixed;left:26px;top:50%;transform:translateY(-50%);
    z-index:11;pointer-events:none;
    padding:18px 20px;border-left:2px solid rgba(120,160,255,.35);
    background:linear-gradient(90deg,rgba(10,8,30,.55),rgba(10,8,30,0));
    border-radius:0 12px 12px 0;
  }
  .fLine{font-family:"Courier New",monospace;font-size:15px;letter-spacing:.5px;
    color:#9fd4ff;text-shadow:0 0 12px rgba(80,170,255,.7);margin:5px 0;white-space:nowrap;}
  .fLine.sub{font-size:12.5px;color:#b39bff;text-shadow:0 0 12px rgba(150,110,255,.7);}
  .fLine.hot{font-size:13px;color:#ffd166;text-shadow:0 0 14px rgba(255,200,80,.9);}
  .fLine.val{font-size:13px;color:#7cf0ff;text-shadow:0 0 12px rgba(80,240,255,.8);}

  /* ---------- 右下：曲线图 ---------- */
  #chartWrap{
    position:fixed;right:22px;bottom:20px;z-index:11;pointer-events:none;
    width:340px;padding:10px 10px 4px;border-radius:14px;
    background:linear-gradient(180deg,rgba(10,8,30,.62),rgba(10,8,30,.18));
    border:1px solid rgba(120,150,255,.18);
    box-shadow:0 0 40px rgba(80,60,200,.25) inset;
    backdrop-filter:blur(4px);
  }
  #chartCanvas{width:100%;height:auto;display:block;}
  .chartCap{font-size:11px;color:rgba(160,190,255,.65);text-align:center;
    letter-spacing:2px;padding:2px 0 4px;}

  /* ---------- 底部提示 ---------- */
  #hint{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    z-index:11;font-size:12px;letter-spacing:2px;color:rgba(160,190,255,.55);
    pointer-events:none;white-space:nowrap;
  }

  /* ---------- 能力卡片 ---------- */
  #card{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);
    width:min(460px,88vw);z-index:30;padding:22px 26px 24px;
    border-radius:18px;pointer-events:none;opacity:0;
    background:linear-gradient(150deg,rgba(20,14,48,.96),rgba(8,6,26,.96));
    border:1px solid rgba(140,120,255,.45);
    box-shadow:0 0 60px rgba(120,80,255,.45),0 0 120px rgba(80,200,255,.18);
    transition:opacity .35s ease,transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  #card.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  #cardTitle{font-size:21px;font-weight:700;letter-spacing:6px;margin-bottom:14px;}
  #cardBody{font-size:14px;line-height:1.85;color:rgba(214,224,255,.9);}
  .cardTag{display:inline-block;font-size:10.5px;letter-spacing:2px;padding:3px 10px;
    border-radius:20px;border:1px solid currentColor;margin-left:10px;vertical-align:middle;
    opacity:.85;font-weight:400;}

  @media (max-width:820px){
    #chartWrap{width:230px;right:10px;bottom:10px;}
    #formulaPanel{left:10px;padding:12px;}
    .fLine{font-size:12px;}
    .hudText{font-size:14px;}
    #hint{font-size:10px;letter-spacing:1px;}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="topHud">
  <div class="hudTitle">启迪意义说明</div>
  <div class="hudText" id="hudText"></div>
</div>

<div id="formulaPanel">
  <div class="fLine">L(N) = α·N<sup>-β</sup> + L<sub>∞</sub></div>
  <div class="fLine sub">Scaling Law</div>
  <div class="fLine hot">N<sub>c</sub> ≈ 10<sup>11</sup></div>
  <div class="fLine val" id="nVal">N = 1.0 × 10<sup>7</sup></div>
</div>

<div id="chartWrap">
  <canvas id="chartCanvas" width="720" height="300"></canvas>
  <div class="chartCap">能力 Emergence ← 参数规模 N →</div>
</div>

<div id="hint">鼠标拖拽 · 绕塔飞行 ｜ 滚轮 · 缩放 ｜ 点击光环 · 查看详情</div>

<div id="card">
  <div id="cardTitle"></div>
  <div id="cardBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
<script>
(function () {
'use strict';

/* ============================================================
   0. 基础工具
   ============================================================ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smoothstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x03030a, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05030f, 0.0013);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 5000);

/* ============================================================
   2. 星空背景
   ============================================================ */
(function buildStars() {
  const N = 1800;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const r = 700 + Math.random() * 1600;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph);
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    c.setHSL(0.52 + Math.random() * 0.38, 0.85, 0.55 + Math.random() * 0.35);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 7, vertexColors: true, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* ============================================================
   3. 神经塔（点云）
   ============================================================ */
const TOWER_H = 160;      // 塔最高
const BASE_R  = 26;       // 底部半径
const TOP_R   = 6;        // 顶部半径
const N_NODES = 14000;    // 神经元节点数

const nodeList = [];
const GOLDEN = 2.39996323;

for (let i = 0; i < N_NODES; i++) {
  const t = Math.random();                       // 归一化高度 0..1
  const a = i * GOLDEN + Math.random() * 0.7;    // 黄金角螺旋
  const rp = BASE_R * (1 - t) + TOP_R * t;       // 半径随高度收缩
  const inner = Math.random() < 0.22;            // 少量内部节点
  const rr = rp * (inner ? Math.random() * 0.72 : (0.86 + Math.random() * 0.18));

  const x = Math.cos(a) * rr;
  const z = Math.sin(a) * rr;
  const y = t * TOWER_H + (Math.random() - 0.5) * 2.6;

  // 虹彩流光色
  const hue = (0.50 + t * 0.42 + (Math.random() - 0.5) * 0.09 + 1) % 1;
  const c = new THREE.Color().setHSL(hue, 0.96, 0.60 + Math.random() * 0.10);

  nodeList.push({
    t, x, y, z,
    r: c.r, g: c.g, b: c.b,
    size: (0.9 + Math.random() * 1.9) * (1.0 - t * 0.22),
    phase: Math.random()
  });
}
nodeList.sort((p, q) => p.t - q.t);   // 按高度排序 → drawRange 自底向上生长

const posArr   = new Float32Array(N_NODES * 3);
const colArr   = new Float32Array(N_NODES * 3);
const sizeArr  = new Float32Array(N_NODES);
const phaseArr = new Float32Array(N_NODES);

for (let i = 0; i < N_NODES; i++) {
  const n = nodeList[i];
  posArr[i * 3] = n.x; posArr[i * 3 + 1] = n.y; posArr[i * 3 + 2] = n.z;
  colArr[i * 3] = n.r; colArr[i * 3 + 1] = n.g; colArr[i * 3 + 2] = n.b;
  sizeArr[i]  = n.size;
  phaseArr[i] = n.phase;
}

const towerGeo = new THREE.BufferGeometry();
towerGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
towerGeo.setAttribute('aColor',   new THREE.BufferAttribute(colArr, 3));
towerGeo.setAttribute('aSize',    new THREE.BufferAttribute(sizeArr, 1));
towerGeo.setAttribute('aPhase',   new THREE.BufferAttribute(phaseArr, 1));
towerGeo.setDrawRange(0, 0);
towerGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, TOWER_H / 2, 0), TOWER_H * 1.4);

const uScaleInit = window.innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));

const towerMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:  { value: 0 },
    uPR:    { value: renderer.getPixelRatio() },
    uScale: { value: uScaleInit }
  },
  vertexShader: `
    attribute float aSize;
    attribute vec3  aColor;
    attribute float aPhase;
    uniform float uTime;
    uniform float uPR;
    uniform float uScale;
    varying vec3  vColor;
    varying float vGlow;
    void main() {
      vColor = aColor;
      float tw = 0.55 + 0.45 * sin(uTime * 1.9 + aPhase * 6.2831);
      vGlow = tw;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uPR * (uScale / max(-mv.z, 1.0)) * (0.72 + 0.55 * tw);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3  vColor;
    varying float vGlow;
    void main() {
      vec2 uv = gl_PointCoord - vec2(0.5);
      float d = length(uv);
      if (d > 0.5) discard;
      float a = pow(1.0 - d * 2.0, 2.2);
      vec3 c = vColor * (0.65 + 1.55 * a) + vec3(0.22) * pow(a, 4.0);
      gl_FragColor = vec4(c, a * (0.50 + 0.50 * vGlow));
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const tower = new THREE.Points(towerGeo, towerMat);
scene.add(tower);

/* ============================================================
   4. 底部光晕环（塔基氛围）
   ============================================================ */
(function baseGlow() {
  const g = new THREE.RingGeometry(BASE_R * 0.8, BASE_R * 2.6, 96);
  const m = new THREE.MeshBasicMaterial({
    color: 0x5a7bff, transparent: true, opacity: 0.18, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring = new THREE.Mesh(g, m);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = -1.5;
  scene.add(ring);
  window.__baseRing = ring;
})();

/* ============================================================
   5. 能力光环
   ============================================================ */
const haloGroup = new THREE.Group();
scene.add(haloGroup);

const abilityDefs = [
  { name: '推 理', color: 0xffd166, t0: 0.57, radius: 26, yOff:   4, tilt: 0.10,
    card: '当参数规模跨过千亿级临界点，模型开始表现出多步逻辑推演能力：链式思考（Chain-of-Thought）、反事实推断、隐含前提识别等。这些能力在中小规模模型中几乎不可见，属于典型的"涌现"现象。' },
  { name: '编 码', color: 0x9b5de5, t0: 0.63, radius: 20, yOff:  20, tilt: 0.30,
    card: '跨过阈值后，模型能够理解复杂代码语义、完成跨文件补全，并根据自然语言描述生成可运行的程序。小模型在代码任务上接近随机水平，而大规模模型在此处出现能力的陡升。' },
  { name: '数 学', color: 0xff6ec7, t0: 0.69, radius: 31, yOff:  -8, tilt: 0.18,
    card: '多步算术、应用题求解、符号推理与方程变形等能力在阈值后突然出现。模型开始能够分步演算、自我校验并纠正中间错误，而非仅仅做模式匹配。' },
  { name: '翻 译', color: 0x4cc9f0, t0: 0.75, radius: 15, yOff:  36, tilt: 0.42,
    card: '低资源语种翻译、长文本跨语言语义保持、语用与文化语境适配等能力，在规模跨过临界点后显著提升，并出现训练目标中未显式指定的跨语言迁移能力。' }
];

function makeLabelSprite(text, colorHex) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 160;
  const ctx = cv.getContext('2d');
  const col = '#' + colorHex.toString(16).padStart(6, '0');
  ctx.font = 'bold 76px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = col;
  ctx.shadowBlur = 34;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, 256, 84);
  ctx.shadowBlur = 14;
  ctx.fillStyle = col;
  ctx.globalAlpha = 0.55;
  ctx.fillText(text, 256, 84);

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(17, 5.3, 1);
  return sp;
}

const abilities = [];
const hitDisks = [];

abilityDefs.forEach((def, idx) => {
  const grp = new THREE.Group();
  grp.position.set(0, def.yOff, 0);
  haloGroup.add(grp);

  const color = new THREE.Color(def.color);

  // 外圈辉光
  const g2 = new THREE.TorusGeometry(1, 0.055, 8, 140);
  const m2 = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring2 = new THREE.Mesh(g2, m2);
  ring2.scale.setScalar(def.radius);
  ring2.rotation.x = Math.PI / 2 - def.tilt;
  grp.add(ring2);

  // 核心亮环
  const g1 = new THREE.TorusGeometry(1, 0.013, 8, 200);
  const m1 = new THREE.MeshBasicMaterial({
    color: color.clone().lerp(new THREE.Color(0xffffff), 0.65),
    transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring1 = new THREE.Mesh(g1, m1);
  ring1.scale.setScalar(def.radius);
  ring1.rotation.x = Math.PI / 2 - def.tilt;
  grp.add(ring1);

  // 文字标签
  const label = makeLabelSprite(def.name, def.color);
  label.position.set(def.radius + 9, 2.5, 0);
  grp.add(label);

  // 射线拾取圆盘
  const diskGeo = new THREE.CircleGeometry(1, 40);
  const diskMat = new THREE.MeshBasicMaterial({
    transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide
  });
  const disk = new THREE.Mesh(diskGeo, diskMat);
  disk.scale.setScalar(def.radius * 1.18);
  disk.rotation.x = Math.PI / 2 - def.tilt;
  grp.add(disk);

  const ab = {
    def, grp, ring1, ring2, label, disk,
    glow: 0, active: false
  };
  disk.userData.ability = ab;
  hitDisks.push(disk);
  abilities.push(ab);
});

// 塔顶光核
const coreSprite = (function () {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(190,220,255,0.85)');
  g.addColorStop(0.45, 'rgba(140,110,255,0.35)');
  g.addColorStop(1, 'rgba(80,60,200,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(70, 70, 1);
  haloGroup.add(sp);
  return sp;
})();

/* ============================================================
   6. 相机轨道控制
   ============================================================ */
let camTheta = 0.7;
let camPhi = 1.24;
let camDist = 350;
let camTargetY = 40;
let dragging = false;
let lastX = 0, lastY = 0;
let downX = 0, downY = 0, moved = 0;

canvas.addEventListener('pointerdown', e => {
  dragging = true; moved = 0;
  lastX = downX = e.clientX;
  lastY = downY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  camTheta -= dx * 0.005;
  camPhi = clamp(camPhi - dy * 0.004, 0.32, 1.68);
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  const d = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved < 8 && d < 8) handleClick(e.clientX, e.clientY);
});
canvas.addEventListener('pointercancel', () => { dragging = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = clamp(camDist * (1 + e.deltaY * 0.0011), 110, 900);
}, { passive: false });

/* ============================================================
   7. 点击 → 能力卡片
   ============================================================ */
const cardEl = document.getElementById('card');
const cardTitleEl = document.getElementById('cardTitle');
const cardBodyEl = document.getElementById('cardBody');
let cardTimer = null;

function handleClick(mx, my) {
  const ndc = new THREE.Vector2(
    (mx / window.innerWidth) * 2 - 1,
    -(my / window.innerHeight) * 2 + 1
  );
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);

  const activeDisks = hitDisks.filter(d => d.userData.ability.active);
  const hits = ray.intersectObjects(activeDisks, false);
  if (hits.length) {
    showCard(hits[0].object.userData.ability);
  } else {
    cardEl.classList.remove('show');
  }
}

function showCard(ab) {
  const hex = '#' + ab.def.color.toString(16).padStart(6, '0');
  cardTitleEl.innerHTML = ab.def.name +
    '<span class="cardTag" style="color:' + hex + '">EMERGENT</span>';
  cardTitleEl.style.color = hex;
  cardTitleEl.style.textShadow = '0 0 24px ' + hex;
  cardBodyEl.textContent = ab.def.card;
  cardEl.classList.add('show');
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => cardEl.classList.remove('show'), 7000);
}

/* ============================================================
   8. 参数曲线（2D Canvas）
   ============================================================ */
const chartCanvas = document.getElementById('chartCanvas');
const cctx = chartCanvas.getContext('2d');
const CW = chartCanvas.width;
const CH = chartCanvas.height;

function capCurve(x) {
  // x ∈ [0,1] 对应 logN 从 7 到 12；阈值 x≈0.80
  const s = 1 / (1 + Math.exp(-(x - 0.845) * 42));
  return 0.07 * x + 0.93 * s;
}

function drawChart(p, time) {
  cctx.clearRect(0, 0, CW, CH);
  const padL = 58, padR = 34, padT = 26, padB = 48;
  const gx = padL, gy = padT;
  const gw = CW - padL - padR;
  const gh = CH - padT - padB;

  // 网格
  cctx.strokeStyle = 'rgba(120,160,255,0.11)';
  cctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = gy + gh * i / 4;
    cctx.beginPath(); cctx.moveTo(gx, y); cctx.lineTo(gx + gw, y); cctx.stroke();
  }
  // 阈值竖线
  const thrX = gx + 0.80 * gw;
  cctx.save();
  cctx.setLineDash([6, 7]);
  cctx.strokeStyle = 'rgba(255,209,102,0.42)';
  cctx.lineWidth = 1.6;
  cctx.beginPath(); cctx.moveTo(thrX, gy); cctx.lineTo(thrX, gy + gh); cctx.stroke();
  cctx.restore();

  // 完整曲线（暗底）
  cctx.beginPath();
  for (let i = 0; i <= 220; i++) {
    const x = i / 220;
    const px = gx + x * gw;
    const py = gy + gh - capCurve(x) * gh;
    i ? cctx.lineTo(px, py) : cctx.moveTo(px, py);
  }
  cctx.strokeStyle = 'rgba(140,170,255,0.20)';
  cctx.lineWidth = 2;
  cctx.stroke();

  // 已推进的曲线（渐变带）
  const N = Math.max(1, Math.floor(p * 220));
  const grad = cctx.createLinearGradient(gx, 0, gx + gw, 0);
  grad.addColorStop(0.00, '#4cc9f0');
  grad.addColorStop(0.45, '#9b5de5');
  grad.addColorStop(0.78, '#ffd166');
  grad.addColorStop(1.00, '#ff6ec7');

  cctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const x = i / 220;
    const px = gx + x * gw;
    const py = gy + gh - capCurve(x) * gh;
    i ? cctx.lineTo(px, py) : cctx.moveTo(px, py);
  }
  cctx.strokeStyle = grad;
  cctx.lineWidth = 4.5;
  cctx.lineJoin = 'round';
  cctx.shadowColor = '#9b5de5';
  cctx.shadowBlur = 16;
  cctx.stroke();
  cctx.shadowBlur = 0;

  // 当前点
  const cxp = gx + p * gw;
  const cyp = gy + gh - capCurve(p) * gh;
  const pulse = 6 + Math.sin(time * 6) * 2.2;
  cctx.beginPath();
  cctx.arc(cxp, cyp, pulse + 5, 0, Math.PI * 2);
  cctx.fillStyle = 'rgba(255,255,255,0.12)';
  cctx.fill();
  cctx.beginPath();
  cctx.arc(cxp, cyp, 6, 0, Math.PI * 2);
  cctx.fillStyle = '#ffffff';
  cctx.shadowColor = '#ffd166';
  cctx.shadowBlur = 22;
  cctx.fill();
  cctx.shadowBlur = 0;

  // 轴标签
  cctx.fillStyle = 'rgba(170,196,255,0.68)';
  cctx.font = '21px "Courier New", monospace';
  cctx.textAlign = 'center';
  cctx.textBaseline = 'top';
  const ticks = ['10⁷', '10⁸', '10⁹', '10¹⁰', '10¹¹', '10¹²'];
  ticks.forEach((s, i) => {
    cctx.fillText(s, gx + gw * i / 5, gy + gh + 12);
  });

  // 阈值标注
  cctx.fillStyle = 'rgba(255,209,102,0.9)';
  cctx.font = 'bold 20px "Courier New", monospace';
  cctx.textAlign = 'left';
  cctx.fillText('Nc', thrX + 6, gy + 4);
}

/* ============================================================
   9. 顶部文字（打字机）
   ============================================================ */
const hudTextEl = document.getElementById('hudText');
const FULL_TEXT = '量变积累到一定程度会引发质的飞跃——规模效应并非简单的线性叠加，而是当系统复杂度和规模跨过临界点后，会涌现出新质的能力，这启示我们在学习和组织发展中应注重规模与协同效应。';

/* ============================================================
   10. 主循环
   ============================================================ */
const DURATION = 30;          // 秒
const clock = new THREE.Clock();
let elapsed = 0;
let lastTextLen = -1;

const nValEl = document.getElementById('nVal');

function formatN(logN) {
  const exp = Math.floor(logN);
  const mant = Math.pow(10, logN - exp);
  return mant.toFixed(1) + ' × 10<sup>' + exp + '</sup>';
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.06);
  elapsed += dt;
  if (elapsed >= DURATION) elapsed -= DURATION;

  const t = elapsed / DURATION;                 // 0..1

  /* ---- 参数规模推进（缩放定律的"加速"增长） ---- */
  const ease = 1 - Math.pow(1 - t, 2);          // 越到后面越快
  const logN = 7 + 5 * ease;                    // 10^7 → 10^12
  const p = clamp((logN - 7) / 5, 0, 1);        // 0..1
  const topY = p * TOWER_H;

  /* ---- 神经塔生长 ---- */
  const vis = clamp(0.045 + 0.955 * p, 0, 1);
  const count = Math.max(24, Math.floor(N_NODES * vis));
  towerGeo.setDrawRange(0, count);

  towerMat.uniforms.uTime.value = elapsed;

  if (window.__baseRing) {
    window.__baseRing.material.opacity = 0.06 + 0.16 * p + 0.05 * Math.sin(elapsed * 2);
    window.__baseRing.scale.setScalar(0.6 + 0.5 * p);
  }

  /* ---- 相机 ---- */
  if (!dragging) camTheta += dt * 0.115;

  const ty = 40 + topY * 0.5;
  camTargetY += (ty - camTargetY) * Math.min(1, dt * 2.2);

  const sp = Math.sin(camPhi) * camDist;
  camera.position.set(
    Math.sin(camTheta) * sp,
    camTargetY + Math.cos(camPhi) * camDist,
    Math.cos(camTheta) * sp
  );
  camera.lookAt(0, camTargetY, 0);

  /* ---- 光环组跟随塔顶 ---- */
  haloGroup.position.y = topY;

  /* ---- 能力光环逐个点亮 ---- */
  abilities.forEach((ab, i) => {
    const a = smoothstep(ab.def.t0, ab.def.t0 + 0.055, t);
    ab.glow = a;

    const pulse = 0.72 + 0.28 * Math.sin(elapsed * 2.4 + i * 1.9);
    const scale = ab.def.radius * (0.45 + 0.55 * a) * (1 + 0.035 * Math.sin(elapsed * 2.8 + i));

    ab.ring1.scale.setScalar(scale);
    ab.ring2.scale.setScalar(scale);
    ab.disk.scale.setScalar(scale * 1.18);

    ab.ring1.material.opacity = a * 0.92 * pulse;
    ab.ring2.material.opacity = a * 0.24 * pulse;
    ab.label.material.opacity = a * (0.6 + 0.4 * pulse);

    const on = a > 0.02;
    ab.grp.visible = on;
    ab.active = a > 0.35;
  });

  /* ---- 塔顶光核 ---- */
  const coreA = smoothstep(0.52, 0.62, t);
  const corePulse = 0.75 + 0.25 * Math.sin(elapsed * 3.4);
  coreSprite.material.opacity = coreA * 0.85 * corePulse;
  coreSprite.scale.setScalar(55 + 30 * coreA * corePulse);

  /* ---- 2D 曲线 ---- */
  drawChart(p, elapsed);

  /* ---- 公式数值 ---- */
  nValEl.innerHTML = 'N = ' + formatN(logN);

  /* ---- 顶部文字 ---- */
  const shown = Math.floor(clamp((elapsed - 0.6) * 4.6, 0, FULL_TEXT.length));
  if (shown !== lastTextLen) {
    hudTextEl.textContent = FULL_TEXT.slice(0, shown);
    lastTextLen = shown;
  }

  renderer.render(scene, camera);
}

/* ============================================================
   11. 自适应
   ============================================================ */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  towerMat.uniforms.uScale.value =
    h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
});

/* ============================================================
   12. 启动
   ============================================================ */
drawChart(0, 0);
animate();

})();
</script>
