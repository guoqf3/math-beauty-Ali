<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>振动分析 · Vibration Analysis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050810;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  canvas { display: block; }
  #scene { position: fixed; inset: 0; }

  /* ---------- 顶部启迪文字 ---------- */
  #vib-text {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 64vw;
    max-width: 1020px;
    text-align: center;
    z-index: 30;
    pointer-events: none;
    font-size: clamp(13px, 1.12vw, 18px);
    line-height: 1.72;
    letter-spacing: 1.2px;
    color: #d6f6ff;
    text-shadow:
      0 0 10px rgba(80, 220, 255, 0.8),
      0 0 24px rgba(120, 90, 255, 0.5),
      0 0 46px rgba(60, 160, 255, 0.3);
  }
  #vib-text span { transition: none; }

  /* ---------- 边缘公式 ---------- */
  .hud {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    font-family: "Consolas", "SF Mono", "Courier New", monospace;
    font-size: clamp(9px, 0.82vw, 13px);
    letter-spacing: 0.6px;
    color: rgba(150, 220, 255, 0.75);
    text-shadow:
      0 0 8px rgba(60, 170, 255, 0.75),
      0 0 20px rgba(120, 60, 255, 0.35);
    white-space: nowrap;
  }
  .hud .k { color: rgba(255, 220, 120, 0.92); }
  .hud .c { color: rgba(120, 255, 220, 0.92); }
  .f-tl { top: 16px; left: 20px; }
  .f-tr { top: 16px; right: 20px; text-align: right; }
  .f-bl { bottom: 22px; left: 20px; }
  .f-br { bottom: 22px; right: 20px; text-align: right; }

  /* ---------- 示波器面板 ---------- */
  #osc-box {
    position: fixed;
    left: 20px;
    bottom: 58px;
    z-index: 30;
    pointer-events: none;
    border-radius: 12px;
    border: 1px solid rgba(60, 255, 190, 0.22);
    box-shadow: 0 0 30px rgba(30, 220, 160, 0.14), inset 0 0 40px rgba(0,0,0,0.5);
    overflow: hidden;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  /* ---------- 幅频响应面板 ---------- */
  #resp-box {
    position: fixed;
    right: 20px;
    bottom: 58px;
    z-index: 30;
    pointer-events: none;
    border-radius: 12px;
    border: 1px solid rgba(255, 120, 60, 0.22);
    box-shadow: 0 0 30px rgba(255, 90, 40, 0.14), inset 0 0 40px rgba(0,0,0,0.5);
    overflow: hidden;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  /* ---------- 状态标签 ---------- */
  #mode-lbl {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 30;
    pointer-events: none;
    font-family: "Consolas", "Courier New", monospace;
    font-size: clamp(11px, 1vw, 15px);
    letter-spacing: 3px;
    color: #7fe9ff;
    text-shadow: 0 0 12px rgba(80, 230, 255, 0.9), 0 0 30px rgba(120, 80, 255, 0.5);
    transition: color 0.3s;
  }

  /* ---------- 控制条 ---------- */
  #controls {
    position: fixed;
    left: 50%;
    bottom: 48px;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 16px;
    border-radius: 30px;
    background: rgba(10, 20, 40, 0.6);
    border: 1px solid rgba(80, 180, 255, 0.26);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 30px rgba(60, 140, 255, 0.18);
    font-family: "Consolas", "Courier New", monospace;
    font-size: 11px;
    color: rgba(170, 220, 255, 0.85);
    letter-spacing: 0.5px;
  }
  #controls button {
    background: linear-gradient(180deg, rgba(40, 130, 220, 0.55), rgba(20, 60, 130, 0.65));
    border: 1px solid rgba(110, 200, 255, 0.45);
    color: #cfeaff;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 15px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 8px rgba(100, 200, 255, 0.8);
  }
  #controls button:hover {
    background: linear-gradient(180deg, rgba(60, 170, 255, 0.75), rgba(30, 80, 170, 0.85));
    box-shadow: 0 0 18px rgba(90, 200, 255, 0.6);
  }

  /* ---------- 暗角 ---------- */
  #vignette {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background: radial-gradient(
      ellipse at 50% 48%,
      rgba(0, 0, 0, 0) 38%,
      rgba(0, 0, 0, 0.42) 76%,
      rgba(0, 0, 0, 0.82) 100%
    );
  }

  /* ---------- 共振警告光效 ---------- */
  #warn {
    position: fixed; inset: 0; z-index: 25; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(255, 0, 0, 0) 34%,
      rgba(255, 20, 30, 0.30) 76%,
      rgba(255, 0, 10, 0.62) 100%);
    opacity: 0;
  }

  /* ---------- 进度条 ---------- */
  #progress {
    position: fixed; bottom: 0; left: 0; height: 2px; width: 0%;
    z-index: 45;
    background: linear-gradient(90deg, #22e6ff, #39ff9e, #ffd24a, #ff5522);
    box-shadow: 0 0 14px rgba(120, 220, 255, 0.9);
    pointer-events: none;
  }

  @media (max-width: 980px) {
    .f-tr, .f-br { display: none; }
    #vib-text { width: 88vw; }
    #osc-box, #resp-box { transform: scale(0.72); transform-origin: bottom left; }
    #resp-box { transform-origin: bottom right; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="warn"></div>
<div id="progress"></div>

<div id="vib-text"></div>

<div class="hud f-tl">
  m·d²x/dt² + c·dx/dt + k·x = F(t)<br>
  ω<sub>n</sub> = √(k/m) &nbsp;·&nbsp; ζ = c/(2√(mk))
</div>
<div class="hud f-tr">
  共振放大因子&nbsp;Q = 1/(2ζ)<br>
  f = f<sub>n</sub> 时&nbsp;A<sub>max</sub> → Q 倍放大
</div>
<div class="hud f-bl">
  <span class="k">ζ &lt; 1</span> 欠阻尼 &nbsp;
  <span class="k">ζ = 1</span> 临界 &nbsp;
  <span class="k">ζ &gt; 1</span> 过阻尼
</div>
<div class="hud f-br">
  VIBRATION&nbsp;ANALYSIS&nbsp;/&nbsp;RESONANCE
</div>

<div id="osc-box"><canvas id="osc-canvas"></canvas></div>
<div id="resp-box"><canvas id="resp-canvas"></canvas></div>

<div id="mode-lbl">模态 1 · 一阶弯曲</div>

<div id="controls">
  <button id="btn-play">暂停</button>
  <button id="btn-reset">重播</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   振动分析 · Vibration Analysis
   悬臂梁模态 + 共振可视化
   ========================================================= */

/* ---------------- 常量 ---------------- */
const LOOP_TIME = 30;
const TEXT_FULL = 26;

const N_SEG   = 60;
const L_BEAM  = 120;
const X_START = -60;
const SEG_LEN = L_BEAM / N_SEG;

/* ---------------- 模态振型（悬臂梁特征函数） ---------------- */
const BETAS  = [1.8751, 4.6941, 7.8548, 10.9955];
const SIGMAS = [0.7339, 1.0185, 0.9992, 1.0000];

function modeShapeRaw(n, xi) {
  const b = BETAS[n], s = SIGMAS[n];
  return Math.cosh(b * xi) - Math.cos(b * xi)
       - s * (Math.sinh(b * xi) - Math.sin(b * xi));
}

const NORMS = [];
for (let n = 0; n < 4; n++) NORMS[n] = modeShapeRaw(n, 1);

/* 归一化：自由端位移 = 1 */
function modeShape(n, xi) {
  return modeShapeRaw(n, xi) / NORMS[n];
}

/* 各阶频率比（悬臂梁 β² 比例） */
const FREQ_RATIO = [1.0, 6.27, 17.55, 34.39];

/* ---------------- 位移颜色映射 ---------------- */
function dispColor(r) {
  r = Math.max(0, Math.min(1, r));
  let cr, cg, cb;
  if (r < 0.33) {
    const s = r / 0.33;
    cr = 0.10 + 0.18 * s;
    cg = 0.38 + 0.62 * s;
    cb = 1.00 - 0.05 * s;
  } else if (r < 0.66) {
    const s = (r - 0.33) / 0.33;
    cr = 0.28 + 0.62 * s;
    cg = 1.00 - 0.08 * s;
    cb = 0.95 - 0.85 * s;
  } else {
    const s = (r - 0.66) / 0.34;
    cr = 0.90 + 0.10 * s;
    cg = 0.92 - 0.78 * s;
    cb = 0.10 - 0.04 * s;
  }
  return [cr, cg, cb];
}

/* ---------------- 光点贴图 ---------------- */
function makeGlowTexture() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.20, 'rgba(255,255,255,0.92)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.34)');
  g.addColorStop(0.72, 'rgba(255,255,255,0.08)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const GLOW_TEX = makeGlowTexture();

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x050810, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050810, 0.0013);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 5000);

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.AmbientLight(0x2a3a55, 1.5));

const keyLight = new THREE.DirectionalLight(0xcce4ff, 1.3);
keyLight.position.set(100, 160, 120);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x3388ff, 0.55);
fillLight.position.set(-120, -40, -90);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x00ddff, 0.6);
rimLight.position.set(-90, 80, 140);
scene.add(rimLight);

/* 共振红色警告光 */
const warnLight = new THREE.PointLight(0xff2200, 0, 400);
warnLight.position.set(40, 0, 0);
scene.add(warnLight);

/* ---------------- 星空 ---------------- */
(function buildStars() {
  const COUNT = 1000;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const u = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const r = 800 + Math.random() * 1400;
    const s = Math.sqrt(1 - u * u);
    pos[i * 3]     = r * s * Math.cos(th);
    pos[i * 3 + 1] = r * u;
    pos[i * 3 + 2] = r * s * Math.sin(th);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x88b0e0, size: 2.0, map: GLOW_TEX,
    transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* ---------------- 地面 ---------------- */
(function buildFloor() {
  const g = new THREE.GridHelper(700, 36, 0x1a2a48, 0x0e1626);
  g.position.y = -70;
  g.material.transparent = true;
  g.material.opacity = 0.4;
  scene.add(g);

  const pg = new THREE.PlaneGeometry(700, 700);
  const pm = new THREE.MeshBasicMaterial({
    color: 0x040710, transparent: true, opacity: 0.92,
    side: THREE.DoubleSide, depthWrite: false
  });
  const plane = new THREE.Mesh(pg, pm);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -70.5;
  scene.add(plane);
})();

/* ---------------- 固定端墙面 ---------------- */
(function buildWall() {
  const wallGeo = new THREE.BoxGeometry(10, 70, 52);
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x3a4a5e,
    metalness: 0.75,
    roughness: 0.55,
    emissive: 0x0a1020,
    emissiveIntensity: 0.5
  });
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.set(X_START - 5, 0, 0);
  scene.add(wall);

  /* 墙面格栅纹理 */
  const gridMat = new THREE.LineBasicMaterial({
    color: 0x5599cc, transparent: true, opacity: 0.18,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  for (let i = 0; i < 5; i++) {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(X_START - 0.4, -30 + i * 15, -24),
      new THREE.Vector3(X_START - 0.4, -30 + i * 15,  24)
    ]);
    scene.add(new THREE.Line(g, gridMat));
  }
  for (let i = 0; i < 5; i++) {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(X_START - 0.4, -30, -24 + i * 12),
      new THREE.Vector3(X_START - 0.4,  30, -24 + i * 12)
    ]);
    scene.add(new THREE.Line(g, gridMat));
  }
})();

/* ---------------- 悬臂梁（分段盒体） ---------------- */
const beamMeshes = [];
const beamGeo = new THREE.BoxGeometry(SEG_LEN, 4, 4);

for (let i = 0; i < N_SEG; i++) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0x2266cc,
    emissive: 0x0a1a33,
    emissiveIntensity: 0.9,
    metalness: 0.86,
    roughness: 0.28
  });
  const mesh = new THREE.Mesh(beamGeo, mat);
  scene.add(mesh);
  beamMeshes.push(mesh);
}

/* ---------------- 变形轮廓发光线 ---------------- */
const linePosArr = new Float32Array((N_SEG + 1) * 3);
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePosArr, 3));
const lineMat = new THREE.LineBasicMaterial({
  color: 0x39ffdd,
  transparent: true,
  opacity: 0.55,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const outline = new THREE.Line(lineGeo, lineMat);
scene.add(outline);

/* 梁中轴线（上边缘发光线） */
const linePosArr2 = new Float32Array((N_SEG + 1) * 3);
const lineGeo2 = new THREE.BufferGeometry();
lineGeo2.setAttribute('position', new THREE.BufferAttribute(linePosArr2, 3));
const lineMat2 = new THREE.LineBasicMaterial({
  color: 0x88ccff,
  transparent: true,
  opacity: 0.28,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const outline2 = new THREE.Line(lineGeo2, lineMat2);
scene.add(outline2);

/* ---------------- 未变形参考线 ---------------- */
(function buildRefLine() {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(X_START, 0, 0),
    new THREE.Vector3(X_START + L_BEAM, 0, 0)
  ]);
  const m = new THREE.LineBasicMaterial({
    color: 0x4488bb, transparent: true, opacity: 0.18,
    depthWrite: false
  });
  scene.add(new THREE.Line(g, m));
})();

/* ---------------- 激励力箭头 ---------------- */
const forceArrow = new THREE.Group();

const arrowMat = new THREE.MeshBasicMaterial({
  color: 0xffdd44,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const fShaft = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 22, 10), arrowMat);
fShaft.position.y = 11;
forceArrow.add(fShaft);

const fHead = new THREE.Mesh(new THREE.ConeGeometry(3.2, 8, 14), arrowMat);
fHead.position.y = 26;
forceArrow.add(fHead);

forceArrow.position.set(X_START + L_BEAM + 4, 0, 0);
scene.add(forceArrow);

/* ---------------- 尖端振动粒子 ---------------- */
const NP = 40;
const tipParticles = [];
for (let i = 0; i < NP; i++) {
  const mat = new THREE.SpriteMaterial({
    map: GLOW_TEX,
    color: 0x88ddff,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(5, 5, 1);
  sp.visible = false;
  scene.add(sp);
  tipParticles.push({
    sprite: sp,
    life: 0,
    vx: 0, vy: 0, vz: 0,
    active: false
  });
}
let tipPCursor = 0;

/* ---------------- 状态计算 ---------------- */
function computeState(t) {
  let mode = 0;
  let amp = 0;
  let omega = 3.0;
  let fRatio = 0;
  let isSweep = false;
  let label = '模态 1 · 一阶弯曲';
  let color = '#7fe9ff';

  if (t < 2) {
    /* 静止起振 */
    mode = 0;
    amp = 0.4;
    omega = 2.0;
    label = '准备 · STANDBY';
    color = '#88aacc';
  } else if (t < 6) {
    /* 模态 1 */
    mode = 0;
    const s = (t - 2) / 4;
    amp = 6.5 * Math.min(1, s * 3);
    omega = 3.0;
    label = '模态 1 · 一阶弯曲';
    color = '#7fe9ff';
  } else if (t < 10) {
    /* 模态 2 */
    mode = 1;
    const s = (t - 6) / 4;
    amp = 6.0 * Math.min(1, s * 3);
    omega = 3.0;
    label = '模态 2 · 二阶 S 形';
    color = '#39ff9e';
  } else if (t < 14) {
    /* 模态 3 */
    mode = 2;
    const s = (t - 10) / 4;
    amp = 5.5 * Math.min(1, s * 3);
    omega = 3.0;
    label = '模态 3 · 三阶弯曲';
    color = '#ffd24a';
  } else if (t < 17) {
    /* 模态 4 */
    mode = 3;
    const s = (t - 14) / 3;
    amp = 5.0 * Math.min(1, s * 3);
    omega = 3.0;
    label = '模态 4 · 四阶复合';
    color = '#ff8a55';
  } else if (t < 22) {
    /* 扫频 */
    const s = (t - 17) / 5;
    fRatio = 0.4 + s * 1.2;
    omega = fRatio * 3.5;
    const zeta = 0.045;
    const r = fRatio;
    const resp = 1 / Math.sqrt(Math.pow(1 - r * r, 2) + Math.pow(2 * zeta * r, 2));
    amp = Math.min(13, 1.5 * resp);
    mode = 0;
    isSweep = true;
    label = '扫频激励 · f = ' + fRatio.toFixed(2) + ' f₁';
    color = fRatio > 0.85 && fRatio < 1.2 ? '#ff5522' : '#ffd24a';
  } else if (t < 27) {
    /* 共振 */
    const s = (t - 22) / 5;
    fRatio = 1.0;
    omega = 3.5;
    amp = 4 + 11 * Math.min(1, s * 2.5);
    mode = 0;
    isSweep = true;
    label = '⚠ 共振 · RESONANCE f = f₁';
    color = '#ff2a3a';
  } else {
    /* 衰减 */
    const s = (t - 27) / 3;
    fRatio = 1.0;
    omega = 3.5;
    amp = 15 * Math.exp(-3.2 * s);
    mode = 0;
    isSweep = true;
    label = '阻尼衰减 · DECAY';
    color = '#7fa8d0';
  }

  return { mode, amp, omega, fRatio, isSweep, label, color };
}

/* ---------------- 更新梁 ---------------- */
function updateBeam(st, phase) {
  const n = st.mode;
  const amp = st.amp;
  const sVal = Math.sin(phase);

  /* 节点位移 */
  const ys = new Float32Array(N_SEG + 1);
  for (let i = 0; i <= N_SEG; i++) {
    ys[i] = modeShape(n, i / N_SEG) * amp * sVal;
  }

  /* 更新每段盒体 */
  for (let i = 0; i < N_SEG; i++) {
    const x0 = X_START + i * SEG_LEN;
    const x1 = X_START + (i + 1) * SEG_LEN;
    const y0 = ys[i], y1 = ys[i + 1];

    const cx = (x0 + x1) * 0.5;
    const cy = (y0 + y1) * 0.5;
    const dx = x1 - x0;
    const dy = y1 - y0;
    const len = Math.sqrt(dx * dx + dy * dy);
    const ang = Math.atan2(dy, dx);

    const mesh = beamMeshes[i];
    mesh.position.set(cx, cy, 0);
    mesh.rotation.z = ang;
    mesh.scale.x = len / SEG_LEN;

    /* 颜色按位移幅值 */
    const cr = Math.min(1, Math.abs(cy) / 7);
    const c = dispColor(cr);
    mesh.material.color.setRGB(c[0], c[1], c[2]);
    mesh.material.emissive.setRGB(c[0] * 0.4, c[1] * 0.4, c[2] * 0.4);
    mesh.material.emissiveIntensity = 0.7 + cr * 0.9;
  }

  /* 更新发光线 */
  const lp = lineGeo.attributes.position.array;
  const lp2 = lineGeo2.attributes.position.array;
  for (let i = 0; i <= N_SEG; i++) {
    const x = X_START + i * SEG_LEN;
    lp[i * 3]     = x;
    lp[i * 3 + 1] = ys[i];
    lp[i * 3 + 2] = 0;

    lp2[i * 3]     = x;
    lp2[i * 3 + 1] = ys[i] + 2.4;
    lp2[i * 3 + 2] = 0;
  }
  lineGeo.attributes.position.needsUpdate = true;
  lineGeo2.attributes.position.needsUpdate = true;

  /* 尖端位移 */
  const tipY = amp * sVal;

  return tipY;
}

/* ---------------- 示波器数据 ---------------- */
const OSC_MAX = 220;
const oscHistory = [];

function pushOsc(v) {
  oscHistory.push(v);
  if (oscHistory.length > OSC_MAX) oscHistory.shift();
}

/* ---------------- 示波器绘制 ---------------- */
const oscCanvas = document.getElementById('osc-canvas');
const oscCtx = oscCanvas.getContext('2d');
const OSC_W = 290, OSC_H = 110;

function setupCanvas(cv, ctx, w, h) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = w * dpr;
  cv.height = h * dpr;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
setupCanvas(oscCanvas, oscCtx, OSC_W, OSC_H);

function drawOsc() {
  const ctx = oscCtx;
  const W = OSC_W, H = OSC_H;
  ctx.clearRect(0, 0, W, H);

  /* 背景 */
  ctx.fillStyle = 'rgba(5, 12, 20, 0.82)';
  ctx.fillRect(0, 0, W, H);

  /* 网格 */
  ctx.strokeStyle = 'rgba(40, 200, 160, 0.12)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = 14 + (H - 24) * i / 4;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let i = 0; i <= 10; i++) {
    const x = W * i / 10;
    ctx.beginPath(); ctx.moveTo(x, 12); ctx.lineTo(x, H - 10); ctx.stroke();
  }

  /* 中轴线 */
  ctx.strokeStyle = 'rgba(70, 230, 180, 0.3)';
  ctx.beginPath();
  ctx.moveTo(0, H / 2);
  ctx.lineTo(W, H / 2);
  ctx.stroke();

  /* 标题 */
  ctx.font = '10px Consolas, monospace';
  ctx.fillStyle = 'rgba(120, 255, 210, 0.85)';
  ctx.textAlign = 'left';
  ctx.fillText('OSCILLOSCOPE · 振动波形', 8, 11);

  if (oscHistory.length < 2) return;

  /* 波形 */
  const range = 18;
  ctx.beginPath();
  for (let i = 0; i < oscHistory.length; i++) {
    const x = (i / (OSC_MAX - 1)) * W;
    const y = H / 2 - (oscHistory[i] / range) * (H / 2 - 12);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#39ff9e';
  ctx.lineWidth = 1.8;
  ctx.shadowColor = '#39ff9e';
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 当前点 */
  const lastV = oscHistory[oscHistory.length - 1];
  const lx = W;
  const ly = H / 2 - (lastV / range) * (H / 2 - 12);
  ctx.beginPath();
  ctx.arc(lx - 2, ly, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#39ff9e';
  ctx.shadowBlur = 14;
  ctx.fill();
  ctx.shadowBlur = 0;
}

/* ---------------- 幅频响应曲线 ---------------- */
const respCanvas = document.getElementById('resp-canvas');
const respCtx = respCanvas.getContext('2d');
const RESP_W = 290, RESP_H = 110;
setupCanvas(respCanvas, respCtx, RESP_W, RESP_H);

function responseCurve(r, zeta) {
  return 1 / Math.sqrt(Math.pow(1 - r * r, 2) + Math.pow(2 * zeta * r, 2));
}

function drawResponse(st) {
  const ctx = respCtx;
  const W = RESP_W, H = RESP_H;
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(14, 8, 6, 0.82)';
  ctx.fillRect(0, 0, W, H);

  const padL = 30, padR = 12, padT = 22, padB = 20;
  const pw = W - padL - padR;
  const ph = H - padT - padB;

  const R_MAX = 2.4;
  const A_MAX = 12;

  /* 网格 */
  ctx.strokeStyle = 'rgba(255, 140, 70, 0.12)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + ph * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + pw, y); ctx.stroke();
  }
  for (let i = 0; i <= 6; i++) {
    const x = padL + pw * i / 6;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); ctx.stroke();
  }

  /* 坐标轴 */
  ctx.strokeStyle = 'rgba(255, 160, 90, 0.42)';
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, padT + ph);
  ctx.lineTo(padL + pw, padT + ph);
  ctx.stroke();

  /* 刻度 */
  ctx.font = '8px Consolas, monospace';
  ctx.fillStyle = 'rgba(255, 180, 120, 0.55)';
  ctx.textAlign = 'right';
  ctx.fillText(String(A_MAX), padL - 4, padT + 6);
  ctx.fillText('0', padL - 4, padT + ph + 3);

  ctx.textAlign = 'center';
  ctx.fillText('0', padL, padT + ph + 12);
  ctx.fillText('1.2', padL + pw * 0.5, padT + ph + 12);
  ctx.fillText('2.4', padL + pw, padT + ph + 12);

  /* 标题 */
  ctx.font = '10px Consolas, monospace';
  ctx.fillStyle = 'rgba(255, 190, 120, 0.9)';
  ctx.textAlign = 'left';
  ctx.fillText('幅频响应 · A(f)', 8, 13);

  /* 共振频率竖线 */
  const xr = padL + (1.0 / R_MAX) * pw;
  ctx.strokeStyle = 'rgba(255, 60, 60, 0.35)';
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(xr, padT);
  ctx.lineTo(xr, padT + ph);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 响应曲线 */
  const zeta = 0.045;
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const r = (i / 200) * R_MAX;
    const a = Math.min(A_MAX, responseCurve(r, zeta));
    const x = padL + (r / R_MAX) * pw;
    const y = padT + ph - (a / A_MAX) * ph;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#ff8844';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ff6622';
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 当前工作点 */
  if (st && st.fRatio > 0) {
    const r = Math.min(R_MAX, st.fRatio);
    const a = Math.min(A_MAX, responseCurve(r, zeta));
    const x = padL + (r / R_MAX) * pw;
    const y = padT + ph - (a / A_MAX) * ph;

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffaa44';
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffe0a0';
    ctx.fill();

    /* 读数 */
    ctx.font = '9px Consolas, monospace';
    ctx.fillStyle = 'rgba(255, 210, 140, 0.95)';
    ctx.textAlign = 'right';
    ctx.fillText('f/f₁ = ' + st.fRatio.toFixed(2), W - 10, padT + 10);
    ctx.fillText('A/A₀ = ' + a.toFixed(1), W - 10, padT + 22);
  }
}

/* ---------------- 粒子更新 ---------------- */
function spawnTipParticle(tipX, tipY, intensity) {
  const p = tipParticles[tipPCursor];
  tipPCursor = (tipPCursor + 1) % NP;

  p.sprite.position.set(
    tipX + (Math.random() - 0.5) * 6,
    tipY + (Math.random() - 0.5) * 6,
    (Math.random() - 0.5) * 6
  );
  p.vx = (Math.random() - 0.5) * 26 - intensity * 0.6;
  p.vy = (Math.random() - 0.5) * 26;
  p.vz = (Math.random() - 0.5) * 26;
  p.life = 1;
  p.active = true;
  p.sprite.visible = true;
  p.sprite.material.color.setRGB(1.0, 0.55 + Math.random() * 0.4, 0.15);
  p.sprite.scale.set(4 + Math.random() * 4, 4 + Math.random() * 4, 1);
}

function updateTipParticles(dt) {
  for (let i = 0; i < NP; i++) {
    const p = tipParticles[i];
    if (!p.active) continue;

    p.life -= dt * 1.5;
    if (p.life <= 0) {
      p.active = false;
      p.sprite.visible = false;
      continue;
    }

    p.sprite.position.x += p.vx * dt;
    p.sprite.position.y += p.vy * dt;
    p.sprite.position.z += p.vz * dt;

    p.vx *= 0.96;
    p.vy *= 0.96;
    p.vz *= 0.96;

    p.sprite.material.opacity = p.life * 0.85;
  }
}

/* ---------------- 相机控制 ---------------- */
const orbit = {
  theta: 0.72,
  phi: 1.28,
  dist: 235,
  targetDist: 235
};

let dragging = false;
let lastX = 0, lastY = 0;
let autoRotate = true;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  autoRotate = false;
  lastX = e.clientX;
  lastY = e.clientY;
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
});

window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  orbit.theta -= dx * 0.006;
  orbit.phi   -= dy * 0.006;
  orbit.phi = Math.max(0.22, Math.min(Math.PI * 0.86, orbit.phi));
});

window.addEventListener('pointerup', () => {
  dragging = false;
  setTimeout(() => { autoRotate = true; }, 2800);
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 0.89;
  orbit.targetDist = Math.max(60, Math.min(700, orbit.targetDist * k));
}, { passive: false });

let pinchDist = 0;
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      orbit.targetDist = Math.max(60, Math.min(700, orbit.targetDist * (pinchDist / d)));
    }
    pinchDist = d;
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { pinchDist = 0; });

/* ---------------- 顶部启迪文字 ---------------- */
const FULL_TEXT =
  '启示：振动分析揭示共振原理——当激励频率与结构固有频率契合时微小激励可引发振幅急剧放大甚至灾难性破坏——警示工程设计中避开共振频率、重视结构动力学匹配的智慧，也启示“同频共振”在人际与组织协同中的放大效应。';

const textEl = document.getElementById('vib-text');
const CHARS = Array.from(FULL_TEXT);
const SPANS = [];

(function buildText() {
  for (let i = 0; i < CHARS.length; i++) {
    const s = document.createElement('span');
    s.textContent = CHARS[i];
    s.style.opacity = '0';
    s._o = -1;
    textEl.appendChild(s);
    SPANS.push(s);
  }
})();

function updateText(t) {
  const total = CHARS.length;
  const reveal = Math.min(total, (t / TEXT_FULL) * total);
  for (let i = 0; i < total; i++) {
    let o = reveal - i;
    if (o < 0) o = 0; else if (o > 1) o = 1;
    o = Math.round(o * 10) / 10;
    if (SPANS[i]._o !== o) {
      SPANS[i].style.opacity = o;
      SPANS[i]._o = o;
    }
  }
}

function resetText() {
  for (let i = 0; i < SPANS.length; i++) {
    SPANS[i].style.opacity = '0';
    SPANS[i]._o = -1;
  }
}

/* ---------------- 控制条 ---------------- */
const btnPlay = document.getElementById('btn-play');
const btnReset = document.getElementById('btn-reset');
const modeLbl = document.getElementById('mode-lbl');
const warnEl = document.getElementById('warn');
let running = true;

btnPlay.addEventListener('click', () => {
  running = !running;
  btnPlay.textContent = running ? '暂停' : '继续';
});

btnReset.addEventListener('click', () => {
  resetAll();
  if (!running) { running = true; btnPlay.textContent = '暂停'; }
});

/* ---------------- 重置 ---------------- */
function resetAll() {
  sceneTime = 0;
  phase = 0;
  oscHistory.length = 0;
  warnEl.style.opacity = '0';
  warnLight.intensity = 0;

  for (let i = 0; i < NP; i++) {
    tipParticles[i].active = false;
    tipParticles[i].sprite.visible = false;
  }

  resetText();
}

/* ---------------- 主循环 ---------------- */
let lastTime = performance.now();
let sceneTime = 0;
let phase = 0;
const progressEl = document.getElementById('progress');

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  /* 时间推进 */
  if (running) {
    sceneTime += dt;
    if (sceneTime >= LOOP_TIME) {
      sceneTime -= LOOP_TIME;
      resetAll();
    }
  }

  const t = sceneTime;
  const st = computeState(t);

  /* 相位累积（保证频率变化时波形连续） */
  if (running) {
    phase += st.omega * dt;
  }

  /* ---------- 更新梁 ---------- */
  const tipY = updateBeam(st, phase);

  /* ---------- 激励力箭头 ---------- */
  if (st.isSweep) {
    arrowMat.opacity = 0.7 + 0.3 * Math.sin(t * 8);
    forceArrow.visible = true;

    /* 箭头方向随振动方向 */
    const dir = Math.sin(phase) >= 0 ? 1 : -1;
    forceArrow.position.y = tipY + dir * 4;
    forceArrow.scale.y = dir;
    forceArrow.scale.x = 0.85 + 0.3 * Math.abs(Math.sin(phase));
    forceArrow.scale.z = forceArrow.scale.x;
  } else {
    arrowMat.opacity = 0;
    forceArrow.visible = false;
  }

  /* ---------- 尖端粒子 ---------- */
  const tipX = X_START + L_BEAM;
  if (running && st.amp > 5 && Math.random() < 0.35) {
    spawnTipParticle(tipX, tipY, st.amp);
  }
  updateTipParticles(dt);

  /* ---------- 共振警告 ---------- */
  const warnAmt = Math.max(0, Math.min(1, (st.amp - 6) / 8));
  if (running) {
    const pulse = 0.55 + 0.45 * Math.sin(t * 12);
    warnEl.style.opacity = String(warnAmt * pulse * 0.75);
    warnLight.intensity = warnAmt * 4.5 * pulse;
    warnLight.position.set(tipX, tipY * 0.5, 0);
  } else {
    warnEl.style.opacity = '0';
    warnLight.intensity = 0;
  }

  /* ---------- 轮廓线发光随振幅 ---------- */
  lineMat.opacity = 0.30 + 0.55 * Math.min(1, st.amp / 12);
  lineMat2.opacity = 0.15 + 0.35 * Math.min(1, st.amp / 12);

  /* ---------- 相机 ---------- */
  if (autoRotate && !dragging) orbit.theta += dt * 0.075;
  orbit.dist += (orbit.targetDist - orbit.dist) * 0.075;

  const sp = Math.sin(orbit.phi);
  camera.position.set(
    orbit.dist * sp * Math.sin(orbit.theta),
    orbit.dist * Math.cos(orbit.phi),
    orbit.dist * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(0, 0, 0);

  /* ---------- 示波器 ---------- */
  if (running) pushOsc(tipY);
  drawOsc();

  /* ---------- 幅频响应 ---------- */
  drawResponse(st);

  /* ---------- 状态标签 ---------- */
  if (modeLbl.textContent !== st.label) {
    modeLbl.textContent = st.label;
    modeLbl.style.color = st.color;
  }

  /* ---------- 顶部文字 ---------- */
  updateText(t);

  /* ---------- 进度条 ---------- */
  progressEl.style.width = ((t / LOOP_TIME) * 100).toFixed(2) + '%';

  renderer.render(scene, camera);
}

/* ---------------- 窗口缩放 ---------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  setupCanvas(oscCanvas, oscCtx, OSC_W, OSC_H);
  setupCanvas(respCanvas, respCtx, RESP_W, RESP_H);
});

/* ---------------- 启动 ---------------- */
resetAll();
drawOsc();
drawResponse(null);
animate();
</script>
