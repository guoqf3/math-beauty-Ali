<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>蜂巢密铺 · 六重旋转对称</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#170a01;
    -webkit-tap-highlight-color:transparent;
  }
  #gl{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
    filter:saturate(1.06) contrast(1.03);
  }

  /* ---------- 数学公式 HUD ---------- */
  .hud{
    position:fixed;
    left:clamp(16px,4.2vw,54px);
    bottom:clamp(16px,4.4vh,52px);
    z-index:10;
    pointer-events:none;
    user-select:none;
    max-width:min(92vw,820px);
    color:#ffd98a;
    font-family:"Times New Roman","Songti SC","STSong",Georgia,serif;
    text-shadow:
      0 0 22px rgba(255,168,40,.55),
      0 0 60px rgba(255,120,0,.28),
      0 2px 8px rgba(0,0,0,.75);
    animation:hudIn 1.6s cubic-bezier(.2,.8,.25,1) both;
  }
  @keyframes hudIn{
    from{opacity:0;transform:translateY(18px) blur(6px);}
    to{opacity:1;transform:none;}
  }
  .hud .tag{
    font-size:clamp(9px,1.35vw,13px);
    letter-spacing:.46em;
    text-transform:uppercase;
    opacity:.72;
    margin-bottom:.85em;
    font-style:normal;
    white-space:nowrap;
  }
  .hud .eq{
    font-size:clamp(13.5px,2.05vw,23px);
    line-height:1.85;
    font-style:italic;
    letter-spacing:.012em;
    opacity:.96;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hud .eq.sm{
    font-size:clamp(10.5px,1.45vw,15.5px);
    opacity:.68;
    margin-top:.45em;
  }
  .hud sub{
    font-size:.62em;
    font-style:normal;
    vertical-align:-.22em;
    letter-spacing:0;
  }
  .hud .dot{
    display:inline-block;width:.42em;height:.42em;
    border-radius:50%;
    background:#ffbe45;
    box-shadow:0 0 12px 3px rgba(255,170,40,.85);
    vertical-align:.06em;
    margin-right:.6em;
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.35;transform:scale(.72);}
    50%    {opacity:1;  transform:scale(1.15);}
  }

  /* ---------- 右上角角标 ---------- */
  .corner{
    position:fixed;
    right:clamp(16px,4.2vw,54px);
    top:clamp(16px,4.2vh,48px);
    z-index:10;
    pointer-events:none;
    user-select:none;
    text-align:right;
    color:#ffca6b;
    font-family:"Times New Roman","Songti SC",serif;
    font-size:clamp(9px,1.25vw,12.5px);
    letter-spacing:.34em;
    line-height:2;
    opacity:.55;
    text-shadow:0 0 18px rgba(255,160,30,.6),0 2px 6px rgba(0,0,0,.7);
  }

  .nogl::after{
    content:"当前环境不支持 WebGL";
    position:fixed;inset:0;display:grid;place-items:center;
    color:#ffce78;font:16px/1.6 sans-serif;letter-spacing:.2em;
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div class="corner">
  C₆ &nbsp;/&nbsp; Δθ = 2π&#8202;/&#8202;6 = 60°<br>
  TRANSLATION ⊕ ROTATION
</div>

<div class="hud">
  <div class="tag"><span class="dot"></span>HEXAGONAL TESSELLATION · HONEYCOMB LATTICE</div>
  <div class="eq">
    H(x,&nbsp;y) = Σ<sub>(q,&nbsp;r)∈ℤ²</sub> h&#8202;( x − √3·s·(q + r/2),&nbsp;&nbsp;y − (3/2)·s·r )
  </div>
  <div class="eq sm">
    R<sub>60°</sub>(x,&nbsp;y) = ( x·cos&#8239;60° − y·sin&#8239;60°,&nbsp;&nbsp;x·sin&#8239;60° + y·cos&#8239;60° )
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('gl');
  var gl = canvas.getContext('webgl', {
        alpha: false, antialias: false, depth: false, stencil: false,
        premultipliedAlpha: false, preserveDrawingBuffer: false,
        powerPreference: 'high-performance'
      }) || canvas.getContext('experimental-webgl');

  if (!gl) { document.body.classList.add('nogl'); return; }

  /* ============================================================
     顶点着色器：全屏大三角形
     ============================================================ */
  var VS = [
    'attribute vec2 aPos;',
    'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
  ].join('\n');

  /* ============================================================
     片元着色器：蜂巢密铺 + 六重旋转 + 呼吸蜜金光晕
     ============================================================ */
  var FS = [
    'precision highp float;',
    '',
    'uniform vec2  uRes;',
    'uniform float uTime;',
    '',
    '#define PI  3.14159265359',
    '#define SQ3 1.73205080757',
    '',
    '/* 稳定哈希：以六边形整格坐标为输入 */',
    'float hash21(vec2 p){',
    '    p = fract(p * vec2(123.34, 345.45));',
    '    p += dot(p, p + 34.345);',
    '    return fract(p.x * p.y);',
    '}',
    '',
    'mat2 rot2(float a){',
    '    float c = cos(a), s = sin(a);',
    '    return mat2(c, -s, s, c);',
    '}',
    '',
    '/* 尖顶正六边形有符号距离场（外接圆半径 = 1，负值在内部） */',
    'float hexSDF(vec2 p){',
    '    vec2 a = abs(p);',
    '    return max(a.x, 0.5 * a.x + 0.8660254 * a.y) - 0.8660254;',
    '}',
    '',
    'void main(){',
    '    vec2  uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;',
    '    float t  = uTime;',
    '',
    '    float S  = 0.055;                 /* 单元尺度（uv 单位） */',
    '    vec2  p  = uv / S;',
    '',
    '    /* ---- 整体向左上方平移复制铺展 ---- */',
    '    p += vec2(t * 0.85, -t * 0.85);',
    '    p *= 1.0 + 0.012 * sin(t * 0.55);',
    '',
    '    /* ---- 轴向坐标 -> 定位最近六边形中心（4 候选精确解） ---- */',
    '    float rf = p.y / 1.5;',
    '    float qf = p.x / SQ3 - rf * 0.5;',
    '    vec2  bq = floor(vec2(qf, rf));',
    '',
    '    float best = 99999.0;',
    '    vec2  bc   = vec2(0.0);',
    '    vec2  bid  = vec2(0.0);',
    '',
    '    for (int i = 0; i < 2; i++){',
    '        for (int j = 0; j < 2; j++){',
    '            vec2  id = bq + vec2(float(i), float(j));',
    '            vec2  c  = vec2(SQ3 * (id.x + id.y * 0.5), 1.5 * id.y);',
    '            vec2  d  = p - c;',
    '            float d2 = dot(d, d);',
    '            if (d2 < best){ best = d2; bc = c; bid = id; }',
    '        }',
    '    }',
    '',
    '    vec2  loc = p - bc;',
    '    float h   = hash21(bid);',
    '',
    '    /* ---- 偶然出现的方位微调闪烁 ---- */',
    '    float gate = smoothstep(0.70, 1.0, sin(t * 0.50 + h * 47.0));',
    '    float ang  = gate * 0.11 * sin(t * 2.30 + h * 23.0);',
    '    vec2  lc   = rot2(ang) * loc;',
    '',
    '    float sdf = hexSDF(lc);',
    '    float rr  = length(lc);',
    '',
    '    /* ---- 伪 3D 穹顶法线光照 ---- */',
    '    vec3  n    = normalize(vec3(lc * 1.2, 1.0));',
    '    vec3  Ld   = normalize(vec3(-0.55, 0.62, 0.56));',
    '    float diff = clamp(dot(n, Ld), 0.0, 1.0);',
    '    float spec = pow(clamp(dot(n, normalize(Ld + vec3(0.0, 0.0, 1.0))), 0.0, 1.0), 26.0);',
    '',
    '    /* ---- 呼吸律动 / 扩散震幅波动传递 ---- */',
    '    float wave   = sin(length(uv) * 9.0 - t * 2.0);',
    '    float breath = 0.5 + 0.5 * sin(t * 1.15 + wave * 1.35 + h * 6.2831);',
    '',
    '    /* ---- 蜜格底色 ---- */',
    '    vec3 cLo = vec3(0.95, 0.52, 0.07);',
    '    vec3 cHi = vec3(1.00, 0.86, 0.44);',
    '    vec3 col = mix(cLo, cHi, clamp(diff * 1.3, 0.0, 1.0));',
    '    col *= 0.78 + 0.42 * breath;',
    '    col += spec * vec3(1.00, 0.93, 0.74) * 0.50;',
    '',
    '    /* ---- 澄黄蜜金光晕（沿格壁内侧泛起） ---- */',
    '    float glow = exp(-abs(sdf) * 7.0) * (0.28 + 0.72 * breath);',
    '    col += vec3(1.0, 0.74, 0.26) * glow * 0.80;',
    '',
    '    /* ---- 格心柔光呼吸 ---- */',
    '    col += vec3(1.0, 0.82, 0.45) * exp(-rr * rr * 2.6) * 0.22 * breath;',
    '',
    '    /* ---- 炫彩微光干涉 ---- */',
    '    vec3 iri = vec3(',
    '        sin(h * 6.2831 + t * 0.8),',
    '        sin(h * 6.2831 + t * 0.8 + 2.0944),',
    '        sin(h * 6.2831 + t * 0.8 + 4.1888)',
    '    );',
    '    col += iri * 0.05 * (0.40 + 0.60 * breath);',
    '',
    '    /* ---- 格壁：加深咖橙渐变描边 ---- */',
    '    float wall = smoothstep(-0.085, -0.012, sdf);',
    '    vec3  wallCol = mix(vec3(0.42, 0.18, 0.02),',
    '                        vec3(0.13, 0.05, 0.01),',
    '                        smoothstep(-0.070, 0.0, sdf));',
    '    col = mix(col, wallCol, wall);',
    '',
    '    /* ---- 内缘高光，强化单元密度秩序感 ---- */',
    '    float rim = smoothstep(-0.170, -0.100, sdf) * (1.0 - smoothstep(-0.100, -0.050, sdf));',
    '    col += vec3(1.0, 0.68, 0.26) * rim * 0.42 * (0.45 + 0.55 * breath);',
    '',
    '    /* ---- 暖蜂蜜琥珀渐晕 ---- */',
    '    float r   = length(uv);',
    '    float vig = smoothstep(1.50, 0.10, r);',
    '    col *= 0.40 + 0.74 * vig;',
    '    col += vec3(0.46, 0.22, 0.02) * (1.0 - vig) * 0.60;',
    '',
    '    /* ---- 色调映射与抖动 ---- */',
    '    col = col / (1.0 + col * 0.30);',
    '    col = pow(max(col, 0.0), vec3(0.92));',
    '    col += (hash21(gl_FragCoord.xy + t) - 0.5) * 0.012;',
    '',
    '    gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  /* ---------------- 着色器编译 ---------------- */
  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('Shader error:\n' + gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  var vs = compile(gl.VERTEX_SHADER, VS);
  var fs = compile(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return;

  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Link error:\n' + gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);

  /* ---------------- 全屏三角形 ---------------- */
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uRes  = gl.getUniformLocation(prog, 'uRes');
  var uTime = gl.getUniformLocation(prog, 'uTime');

  /* ---------------- 自适应尺寸 ---------------- */
  var DPR_CAP = 1.75;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    var w = Math.max(1, Math.floor(window.innerWidth  * dpr));
    var h = Math.max(1, Math.floor(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', resize, { passive: true });
  resize();

  /* ---------------- 渲染循环 ---------------- */
  var t0 = performance.now();

  function frame(now) {
    resize();
    var t = (now - t0) / 1000;

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
