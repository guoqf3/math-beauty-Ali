<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贝叶斯推断 · 概率更新</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 35%, #141d3a 0%, #0a0f22 42%, #03050c 100%);
  }
  canvas { display: block; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(0,0,0,0.6) 100%);
  }

  #topText {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    width: min(80vw, 1040px);
    min-height: 2.2em;
    text-align: center;
    color: #dfeaff;
    font-size: clamp(13px, 1.5vw, 20px);
    letter-spacing: 0.07em;
    line-height: 1.7;
    font-weight: 400;
    text-shadow: 0 0 16px rgba(110, 165, 255, 0.6),
                 0 0 42px rgba(70, 120, 255, 0.3);
    pointer-events: none;
    z-index: 10;
  }
  #topText::after {
    content: '';
    display: inline-block;
    width: 2px; height: 1em;
    background: #7fb0ff;
    margin-left: 5px;
    vertical-align: -0.12em;
    box-shadow: 0 0 8px #7fb0ff;
    animation: blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .formula {
    position: fixed;
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    color: rgba(150, 198, 255, 0.52);
    font-size: clamp(11px, 1.05vw, 16px);
    letter-spacing: 0.05em;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 14px rgba(90, 150, 255, 0.55);
    white-space: nowrap;
  }
  .f-tl { top: 92px; left: 24px; }
  .f-bl { bottom: 40px; left: 24px; }
  .f-tr { top: 92px; right: 24px; text-align: right; }

  #panel {
    position: fixed;
    right: 24px; bottom: 40px;
    width: 226px;
    padding: 13px 15px 10px;
    background: rgba(12, 20, 42, 0.46);
    border: 1px solid rgba(90, 140, 255, 0.22);
    border-radius: 11px;
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    color: #9fb6e0;
    font-size: 12px;
    z-index: 20;
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.45),
                inset 0 0 22px rgba(70, 120, 255, 0.07);
  }
  #panel .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 8px;
    margin-bottom: 11px;
  }
  #panel .row label { grid-column: 1 / 3; letter-spacing: 0.04em; }
  #panel .row .val {
    font-family: "Cambria Math", Georgia, serif;
    color: #ffd77a;
    font-size: 12px;
    min-width: 34px;
    text-align: right;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, #3a8bff, #ff5ea8);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #ffe9a8;
    box-shadow: 0 0 10px rgba(255, 210, 100, 0.9);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px;
    border: none;
    border-radius: 50%;
    background: #ffe9a8;
    box-shadow: 0 0 10px rgba(255, 210, 100, 0.9);
    cursor: pointer;
  }
  #panel .hint {
    text-align: center;
    font-size: 10.5px;
    color: rgba(140, 170, 215, 0.5);
    letter-spacing: 0.1em;
    margin-top: 2px;
  }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="topText"></div>

<div class="formula f-tl">P(A|B) = P(B|A) · P(A) / P(B)</div>
<div class="formula f-tr">后验 ∝ 似然 × 先验</div>
<div class="formula f-bl">σ_post² = 1 / ( 1/σ₀² + 1/σ_L² )</div>

<div id="panel">
  <div class="row">
    <label>先验宽度 σ₀</label>
    <input id="sP" type="range" min="0.60" max="2.60" step="0.05" value="1.50">
    <span class="val" id="vP">1.50</span>
  </div>
  <div class="row">
    <label>似然宽度 σ_L</label>
    <input id="sL" type="range" min="0.40" max="1.80" step="0.05" value="0.85">
    <span class="val" id="vL">0.85</span>
  </div>
  <div class="hint">拖拽旋转视角</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   基础场景
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 8.5, 21);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 8;
controls.maxDistance = 50;
controls.maxPolarAngle = Math.PI * 0.55;
controls.enablePan = false;

/* ---------- 光点贴图 ---------- */
function createSpriteTexture() {
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,255,255,0.78)');
  g.addColorStop(0.48, 'rgba(255,255,255,0.20)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const sprite = createSpriteTexture();

/* ---------- 地面网格 ---------- */
const grid = new THREE.GridHelper(52, 52, 0x2a3d75, 0x162047);
grid.position.y = -0.05;
grid.material.transparent = true;
grid.material.opacity = 0.22;
scene.add(grid);

/* ============================================================
   采样工具
   ============================================================ */
function sampleU() {
  // 以 exp(-u²/2) 为密度做拒绝采样（截断 ±4.2）
  for (let k = 0; k < 64; k++) {
    const u = (Math.random() * 2 - 1) * 4.2;
    if (Math.random() < Math.exp(-u * u * 0.5)) return u;
  }
  return 0;
}
function sampleZ() {
  let a = 0, b = 0;
  while (a === 0) a = Math.random();
  while (b === 0) b = Math.random();
  const z = Math.sqrt(-2 * Math.log(a)) * Math.cos(2 * Math.PI * b);
  return Math.max(-2.6, Math.min(2.6, z));
}

/* ============================================================
   概率山丘（发光粒子云）
   ============================================================ */
class Hill {
  constructor(count, hexColor, size) {
    this.count = count;
    this.u = new Float32Array(count);
    this.z = new Float32Array(count);
    this.d = new Float32Array(count);   // 预计算 exp(-(u²+z²)/2)
    this.ph = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      const u = sampleU();
      const z = sampleZ();
      this.u[i] = u;
      this.z[i] = z;
      this.d[i] = Math.exp(-(u * u + z * z) * 0.5);
      this.ph[i] = Math.random() * Math.PI * 2;
    }

    this.posArr = new Float32Array(count * 3);
    this.colArr = new Float32Array(count * 3);

    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.posArr, 3));
    this.geo.setAttribute('color', new THREE.BufferAttribute(this.colArr, 3));

    this.mat = new THREE.PointsMaterial({
      size,
      map: sprite,
      vertexColors: true,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    this.points = new THREE.Points(this.geo, this.mat);
    this.points.frustumCulled = false;
    this.points.renderOrder = 2;
    scene.add(this.points);
  }

  update(mu, sigma, amp, opacity, color, time) {
    if (opacity <= 0.003) { this.points.visible = false; return; }
    this.points.visible = true;
    this.mat.opacity = opacity;

    const { u, z, d, ph, posArr, colArr, count } = this;
    for (let i = 0; i < count; i++) {
      const i3 = i * 3;
      const di = d[i];
      const flick = 0.92 + 0.08 * Math.sin(time * 2.1 + ph[i]);
      posArr[i3]     = mu + sigma * u[i];
      posArr[i3 + 1] = amp * di * flick;
      posArr[i3 + 2] = z[i] * 1.7;

      const tw = 0.70 + 0.30 * Math.sin(time * 3.0 + ph[i] * 2.3);
      const b = (0.14 + 0.86 * di) * tw * 0.72;

      colArr[i3]     = color.r * b;
      colArr[i3 + 1] = color.g * b;
      colArr[i3 + 2] = color.b * b;
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.color.needsUpdate = true;
  }
}

/* ============================================================
   参数与颜色
   ============================================================ */
const MU_P = -3.2;          // 先验均值
const MU_L =  2.4;          // 似然（证据）均值
const AMP_P = 3.4;          // 先验峰值高度
const AMP_L = 4.2;          // 似然峰值高度

let sigmaP = 1.50;          // 先验宽度（滑块）
let sigmaL = 0.85;          // 似然宽度（滑块）

const cPrior = new THREE.Color(0x38bdf8);   // 先验：天蓝
const cLike  = new THREE.Color(0xff5ea8);   // 似然：品红
const cPost  = new THREE.Color(0xffc23a);   // 后验：金色
const cBlue  = new THREE.Color(0x38bdf8);

/* ---------- 三座山丘 ---------- */
const priorHill = new Hill(9000,  0x38bdf8, 0.125);
const likeHill  = new Hill(7000,  0xff5ea8, 0.120);
const postHill  = new Hill(11000, 0xffc23a, 0.145);

/* ============================================================
   数据流粒子
   ============================================================ */
const FLOW_N = 620;
const flowPos = new Float32Array(FLOW_N * 3);
const flowCol = new Float32Array(FLOW_N * 3);
const flowOff = new Float32Array(FLOW_N);
const flowSrc = new Uint8Array(FLOW_N);
for (let i = 0; i < FLOW_N; i++) {
  flowOff[i] = Math.random();
  flowSrc[i] = Math.random() < 0.5 ? 0 : 1;
}
const flowGeo = new THREE.BufferGeometry();
flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3));
flowGeo.setAttribute('color', new THREE.BufferAttribute(flowCol, 3));
const flowMat = new THREE.PointsMaterial({
  size: 0.15,
  map: sprite,
  vertexColors: true,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});
const flowPoints = new THREE.Points(flowGeo, flowMat);
flowPoints.frustumCulled = false;
flowPoints.renderOrder = 3;
scene.add(flowPoints);

function updateFlow(t, tt, muNow, ampNow) {
  const active = smoothstep(9.5, 11.2, t) * (1 - smoothstep(17, 21, t));
  flowMat.opacity = active;
  flowPoints.visible = active > 0.01;
  if (!flowPoints.visible) return;

  for (let i = 0; i < FLOW_N; i++) {
    const i3 = i * 3;
    const src = flowSrc[i];
    const p = (tt * 0.20 + flowOff[i]) % 1;

    const sx = src === 0 ? MU_P : MU_L;
    const sy = src === 0 ? AMP_P : AMP_L;
    const ex = muNow, ey = ampNow;

    const cx = (sx + ex) * 0.5;
    const cy = Math.max(sy, ey) + 3.6;

    const om = 1 - p;
    flowPos[i3]     = om * om * sx + 2 * om * p * cx + p * p * ex;
    flowPos[i3 + 1] = om * om * sy + 2 * om * p * cy + p * p * ey;
    flowPos[i3 + 2] = Math.sin(p * Math.PI * 2.2 + flowOff[i] * 12) * 1.9;

    const fade = Math.sin(p * Math.PI);
    const base = src === 0 ? cPrior : cLike;
    const r = base.r + (cPost.r - base.r) * p;
    const g = base.g + (cPost.g - base.g) * p;
    const b = base.b + (cPost.b - base.b) * p;

    flowCol[i3]     = r * fade * 1.05;
    flowCol[i3 + 1] = g * fade * 1.05;
    flowCol[i3 + 2] = b * fade * 1.05;
  }
  flowGeo.attributes.position.needsUpdate = true;
  flowGeo.attributes.color.needsUpdate = true;
}

/* ============================================================
   缓动
   ============================================================ */
function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
function easeInOut(x) {
  return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) * 0.5;
}

/* ============================================================
   顶部启示文字（打字机）
   ============================================================ */
const FULL_TEXT = '贝叶斯定理提供学习与更新的规范框架——信念随证据不断修正而不僵化，启示科学认知是一个不断用新信息更新旧认识的过程。';
const topTextEl = document.getElementById('topText');
let lastShown = '';

function updateTopText(t) {
  const prog = smoothstep(0.5, 25, t);
  const n = Math.floor(prog * FULL_TEXT.length);
  const shown = FULL_TEXT.slice(0, n);
  if (shown !== lastShown) {
    topTextEl.textContent = shown;
    lastShown = shown;
  }
}

/* ============================================================
   滑块交互
   ============================================================ */
const sP = document.getElementById('sP');
const sL = document.getElementById('sL');
const vP = document.getElementById('vP');
const vL = document.getElementById('vL');

sP.addEventListener('input', e => {
  sigmaP = parseFloat(e.target.value);
  vP.textContent = sigmaP.toFixed(2);
});
sL.addEventListener('input', e => {
  sigmaL = parseFloat(e.target.value);
  vL.textContent = sigmaL.toFixed(2);
});

/* ============================================================
   主循环
   ============================================================ */
const DURATION = 30;      // 动画总时长（秒）
const clock = new THREE.Clock();
let totalTime = 0;

const tmpColor = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  totalTime += dt;
  if (totalTime > 100000) totalTime = 0;

  const t = totalTime % DURATION;      // 循环时间轴

  /* ---------- 贝叶斯后验解析解 ---------- */
  const precP = 1 / (sigmaP * sigmaP);
  const precL = 1 / (sigmaL * sigmaL);
  const precPost = precP + precL;
  const sigmaPost = Math.sqrt(1 / precPost);
  const muPost = (MU_P * precP + MU_L * precL) / precPost;
  const ampPost = AMP_P * Math.pow(sigmaP / sigmaPost, 0.85);

  /* ---------- 时间轴关键帧 ---------- */
  // 先验：淡入 → 被证据“吸收”后淡出
  const priorOp = smoothstep(0.4, 3.6, t) * (1 - smoothstep(9.5, 15.5, t)) * 0.95;

  // 似然：证据登场 → 后验形成后退居背景
  const likeOp = smoothstep(4.5, 8.6, t) * (1 - 0.88 * smoothstep(19, 28, t)) * 0.90;

  // 后验：从先验的位置出发，向证据移动并变窄变尖
  const pAppear = smoothstep(9.0, 12.0, t);
  const pMorph  = easeInOut(smoothstep(10.0, 19.0, t));
  const postOp  = pAppear * (1 - smoothstep(27.5, 30, t));

  const muNow    = MU_P    + (muPost    - MU_P)    * pMorph;
  const sigmaNow = sigmaP  + (sigmaPost - sigmaP)  * pMorph;
  const ampNow   = AMP_P   + (ampPost   - AMP_P)   * pMorph;

  // 后验颜色：蓝 → 金
  tmpColor.copy(cBlue).lerp(cPost, pMorph);

  /* ---------- 更新三座山丘 ---------- */
  priorHill.update(MU_P,  sigmaP,  AMP_P,  priorOp, cPrior, totalTime);
  likeHill.update(MU_L,   sigmaL,  AMP_L,  likeOp,  cLike,  totalTime);
  postHill.update(muNow,  sigmaNow, ampNow, postOp, tmpColor, totalTime);

  /* ---------- 数据流 ---------- */
  updateFlow(t, totalTime, muNow, ampNow);

  /* ---------- 顶部文字 ---------- */
  updateTopText(t);

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   自适应
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
