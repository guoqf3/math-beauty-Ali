<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>双曲抛物面 · 展翅的鹰</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#03050c;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;cursor:grab;}
  canvas:active{cursor:grabbing;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:42px 48px;opacity:0;
    animation:fade 1.8s 0.3s ease forwards;
  }
  #title .en{
    font-size:10px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(240,200,150,.36);font-weight:300;margin-bottom:14px;
  }
  #title h1{
    font-size:clamp(22px,3.2vw,42px);
    font-weight:200;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(96deg,#ffd88a 0%,#f0a860 38%,#c080e0 78%,#80b0ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 30px rgba(240,180,110,.45));
  }
  #title .sub{
    font-size:11px;letter-spacing:.22em;line-height:2.0;
    color:rgba(240,210,170,.32);font-weight:300;
  }

  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 48px 42px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(230,200,170,.28);
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
  }
  #stats .k{color:rgba(240,210,255,.52);}
  #stats .v{color:rgba(255,225,170,.72);}
  #stats .lab{
    display:block;font-size:8.5px;letter-spacing:.42em;text-indent:.42em;
    color:rgba(230,190,150,.24);margin-bottom:8px;
  }

  #meter{
    position:absolute;bottom:0;right:0;
    padding:0 48px 42px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.14em;line-height:2.1;
    color:rgba(230,200,170,.28);
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  #meter .k{color:rgba(240,210,255,.52);}
  #meter .v{color:rgba(255,225,170,.72);}
  #meter .big{
    display:block;font-size:clamp(20px,2.4vw,30px);
    font-weight:200;letter-spacing:.22em;
    color:rgba(255,220,170,.85);
    margin-bottom:2px;transition:color .5s ease;
  }

  #audioDot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:rgba(200,180,255,.25);
    margin-left:6px;vertical-align:middle;
    transition:background .4s;
  }
  #audioDot.on{
    background:rgba(150,240,180,.9);
    box-shadow:0 0 8px rgba(150,240,180,.8);
  }

  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:46px;white-space:nowrap;
    font-size:10px;letter-spacing:.28em;
    color:rgba(240,210,170,.42);
    opacity:0;animation:fade 1.8s 1.8s ease forwards;
  }
  #hint .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:rgba(255,210,140,.85);vertical-align:middle;
    margin:0 8px;position:relative;top:-1px;
    animation:pulse 2.0s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.35;transform:scale(1);}
    50%{opacity:1;transform:scale(1.5);}
  }
  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:22px 22px;}
    #title .sub{font-size:9.5px;}
    #stats{padding:0 22px 22px;font-size:8.5px;}
    #meter{padding:0 22px 22px;font-size:8.5px;}
    #hint{padding-bottom:26px;font-size:8.5px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">HYPERBOLIC PARABOLOID · SOARING EAGLE</div>
    <h1>展翅的鹰</h1>
    <div class="sub">
      双曲抛物面方程 · z = x²/a² − y²/b²<br>
      拖拽旋转 · 滚轮控制飞行速度
    </div>
  </div>

  <div id="stats">
    <span class="lab">HYPERBOLIC PARABOLOID</span>
    <div><span class="k">z = x²/a² − y²/b²</span></div>
    <div><span class="k">翼展</span> <span class="v">8.0 单位</span></div>
    <div><span class="k">网格</span> <span class="v">32 × 18</span></div>
    <div><span class="k">音频</span> <span class="v">风声 + 鹰啸</span><span id="audioDot"></span></div>
  </div>

  <div id="meter">
    <span class="big" id="stateBig">翱 翔</span>
    <div style="margin-top:8px;"><span class="k">飞行速度 </span><span class="v" id="speedVal">1.00×</span></div>
    <div><span class="k">扑动频率 </span><span class="v" id="flapVal">1.4 Hz</span></div>
  </div>

  <div id="hint">
    <span class="dot"></span>拖拽旋转 · 滚轮变速<span class="dot"></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: true,
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x03050c, 1);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  42,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);

/* =========================================================
   光照
   ========================================================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.42));

const keyLight = new THREE.DirectionalLight(0xffd9a0, 1.35);
keyLight.position.set(6, 10, 8);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x6088ff, 0.62);
fillLight.position.set(-8, -2, -6);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffa880, 0.55);
rimLight.position.set(-3, 4, 8);
scene.add(rimLight);

const topLight = new THREE.DirectionalLight(0xffffff, 0.32);
topLight.position.set(0, 12, 0);
scene.add(topLight);

/* =========================================================
   鹰翼几何 —— 双曲抛物面
   ========================================================= */
const SPAN = 4.0;
const US = 32;
const VS = 18;

function createWingGeometry(side){
  const positions = [];
  const colors = [];
  const indices = [];
  const uCoords = [];

  const CHORD_ROOT = 1.55;
  const CHORD_TIP = 0.48;

  for (let i = 0; i <= US; i++){
    const u = i / US;

    /* 弦长渐缩 */
    const chord = CHORD_ROOT + (CHORD_TIP - CHORD_ROOT) * u;

    /* 后掠 */
    const sweep = u * u * 0.85;

    for (let j = 0; j <= VS; j++){
      const v = j / VS;
      const vNorm = v - 0.5;   // -0.5 → 0.5

      /* 位置 */
      const x = side * u * SPAN;
      const z = vNorm * chord + sweep;

      /* 双曲抛物面：y = (x/a)² − (z/b)²
         归一化后：y = u² − (2·vNorm)²·k
         翼展方向向外上扬，弦向中间拱起 */
      const xNorm = u;
      const zNorm = vNorm * 2;

      let y = (xNorm * xNorm) * 1.10 - (zNorm * zNorm) * 0.22;
      y += 0.12;

      positions.push(x, y, z);

      /* 颜色：深棕 → 金 */
      const hue = 28 + u * 18;
      const sat = 55 + u * 28;
      const lit = 28 + u * 38;
      const col = new THREE.Color().setHSL(hue / 360, sat / 100, lit / 100);
      colors.push(col.r, col.g, col.b);

      uCoords.push(u);
    }
  }

  for (let i = 0; i < US; i++){
    for (let j = 0; j < VS; j++){
      const a = i * (VS + 1) + j;
      const b = a + 1;
      const c = a + (VS + 1);
      const d = c + 1;
      indices.push(a, b, d, a, d, c);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  geo.userData.basePositions = new Float32Array(positions);
  geo.userData.uCoords = new Float32Array(uCoords);

  return geo;
}

/* =========================================================
   鹰翼材质
   ========================================================= */
const wingMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.42,
  metalness: 0.28,
  side: THREE.DoubleSide,
  flatShading: false
});

const leftWing = new THREE.Mesh(createWingGeometry(-1), wingMaterial);
const rightWing = new THREE.Mesh(createWingGeometry(1), wingMaterial);

/* =========================================================
   鹰身体 —— 椭球 + 头部 + 尾羽
   ========================================================= */
const eagle = new THREE.Group();

const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x2a1a12,
  roughness: 0.55,
  metalness: 0.30
});

const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 18), bodyMat);
body.scale.set(1.4, 0.85, 0.95);
body.position.set(0, 0.12, 0.15);
eagle.add(body);

/* 头部 */
const headMat = new THREE.MeshStandardMaterial({
  color: 0x3d2820,
  roughness: 0.48,
  metalness: 0.35
});
const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 18, 14), headMat);
head.position.set(0, 0.32, 0.72);
eagle.add(head);

/* 喙 */
const beakMat = new THREE.MeshStandardMaterial({
  color: 0xd9a860,
  roughness: 0.32,
  metalness: 0.55
});
const beak = new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.32, 10), beakMat);
beak.rotation.x = Math.PI * 0.5;
beak.position.set(0, 0.28, 1.02);
eagle.add(beak);

/* 尾羽 */
const tailMat = new THREE.MeshStandardMaterial({
  color: 0x1e120c,
  roughness: 0.62,
  metalness: 0.20,
  side: THREE.DoubleSide
});
const tail = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 1.15, 6, 10), tailMat);

/* 尾羽轻微弯曲 */
(function (){
  const pos = tail.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const u = (y + 0.575) / 1.15;
    pos.setZ(i, z - u * u * 0.22 + Math.abs(x) * 0.05);
    pos.setY(i, y + u * 0.12);
  }
  pos.needsUpdate = true;
  tail.geometry.computeVertexNormals();
})();

tail.rotation.x = Math.PI * 0.5 + 0.25;
tail.position.set(0, 0.06, -0.72);
eagle.add(tail);

/* 翅膀挂到鹰身上 */
leftWing.position.set(-0.15, 0.06, 0.08);
rightWing.position.set(0.15, 0.06, 0.08);
eagle.add(leftWing);
eagle.add(rightWing);

/* 整体缩放与倾斜 */
eagle.scale.setScalar(0.78);
eagle.rotation.x = 0.10;

scene.add(eagle);

/* =========================================================
   背景星尘
   ========================================================= */
const dustGeo = new THREE.BufferGeometry();
const dustCount = 240;
const dustPositions = new Float32Array(dustCount * 3);

for (let i = 0; i < dustCount; i++){
  const r = 12 + Math.random() * 22;
  const theta = Math.random() * TAU;
  const phi = Math.acos(2 * Math.random() - 1);

  dustPositions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
  dustPositions[i * 3 + 1] = r * Math.cos(phi) * 0.7;
  dustPositions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}

dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));

const dustMat = new THREE.PointsMaterial({
  color: 0x8899cc,
  size: 0.10,
  transparent: true,
  opacity: 0.55,
  sizeAttenuation: true,
  depthWrite: false
});

const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

/* =========================================================
   音频系统
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let windGain = null;
let windFilter = null;
let audioReady = false;

function setAudioDot(on){
  const dot = document.getElementById('audioDot');
  if (dot) dot.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().then(() => setAudioDot(true)).catch(() => {});
    }
    return;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { audioCtx = new AC(); } catch(e){ return; }
  audioReady = true;

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.58;
  masterGain.connect(audioCtx.destination);

  const start = () => {
    setAudioDot(true);
    startWind();
    scheduleEagleCry();
  };

  if (audioCtx.state === 'suspended'){
    audioCtx.resume().then(start).catch(() => {
      audioReady = false;
    });
  } else {
    start();
  }
}

/* ---------- 高空风声 ---------- */
function startWind(){
  const len = audioCtx.sampleRate * 4;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  windFilter = audioCtx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.value = 520;
  windFilter.Q.value = 0.78;

  windGain = audioCtx.createGain();
  windGain.gain.value = 0.045;

  src.connect(windFilter);
  windFilter.connect(windGain);
  windGain.connect(masterGain);
  src.start();

  /* 滤波器频率缓变 */
  const lfoF = audioCtx.createOscillator();
  lfoF.frequency.value = 0.12;
  const lfoFG = audioCtx.createGain();
  lfoFG.gain.value = 260;
  lfoF.connect(lfoFG);
  lfoFG.connect(windFilter.frequency);
  lfoF.start();

  /* 音量起伏 */
  const lfoG = audioCtx.createOscillator();
  lfoG.frequency.value = 0.07;
  const lfoGG = audioCtx.createGain();
  lfoGG.gain.value = 0.018;
  lfoG.connect(lfoGG);
  lfoGG.connect(windGain.gain);
  lfoG.start();
}

/* ---------- 鹰啸 ---------- */
function playEagleCry(){
  if (!audioCtx || audioCtx.state !== 'running') return;

  const now = audioCtx.currentTime;
  const syllables = 3 + Math.floor(Math.random() * 2);

  for (let i = 0; i < syllables; i++){
    const t0 = now + i * (0.14 + Math.random() * 0.05);
    const baseF = 1500 + Math.random() * 500;

    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(baseF * 0.72, t0);
    osc.frequency.exponentialRampToValueAtTime(baseF * 1.38, t0 + 0.045);
    osc.frequency.exponentialRampToValueAtTime(baseF * 0.68, t0 + 0.19);

    /* 高频谐波让声音更有穿透力 */
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(baseF * 1.5, t0);
    osc2.frequency.exponentialRampToValueAtTime(baseF * 2.6, t0 + 0.045);
    osc2.frequency.exponentialRampToValueAtTime(baseF * 1.3, t0 + 0.19);

    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 3200;
    lp.Q.value = 4.5;

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.032, t0 + 0.018);
    g.gain.setValueAtTime(0.032, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0004, t0 + 0.22);

    const g2 = audioCtx.createGain();
    g2.gain.value = 0.30;

    osc.connect(lp);
    osc2.connect(g2);
    g2.connect(lp);
    lp.connect(g);
    g.connect(masterGain);

    osc.start(t0); osc.stop(t0 + 0.28);
    osc2.start(t0); osc2.stop(t0 + 0.28);
  }
}

let cryTimer = null;
function scheduleEagleCry(){
  if (cryTimer) clearTimeout(cryTimer);
  const wait = 7000 + Math.random() * 9000;
  cryTimer = setTimeout(function(){
    playEagleCry();
    scheduleEagleCry();
  }, wait);
}

/* =========================================================
   相机控制
   ========================================================= */
let yaw = 0.55;
let pitch = 0.26;
let targetYaw = 0.55;
let targetPitch = 0.26;
let cameraDist = 10.5;

let dragging = false;
let lastPX = 0, lastPY = 0;
let autoRotate = true;
let autoRotatePause = 0;

/* 飞行速度 */
let speed = 1.0;
let targetSpeed = 1.0;

canvas.addEventListener('pointerdown', function(e){
  initAudio();
  dragging = true;
  lastPX = e.clientX;
  lastPY = e.clientY;
  autoRotate = false;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', function(e){
  if (!dragging) return;
  const dx = e.clientX - lastPX;
  const dy = e.clientY - lastPY;

  targetYaw += dx * 0.006;
  targetPitch += dy * 0.005;
  if (targetPitch >  1.15) targetPitch =  1.15;
  if (targetPitch < -0.55) targetPitch = -0.55;

  lastPX = e.clientX;
  lastPY = e.clientY;
});

function endDrag(e){
  dragging = false;
  autoRotatePause = 2.0;
  try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

/* 滚轮控制速度 */
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  initAudio();

  const dir = e.deltaY < 0 ? 1 : -1;
  targetSpeed += dir * 0.28;
  if (targetSpeed < 0.20) targetSpeed = 0.20;
  if (targetSpeed > 3.50) targetSpeed = 3.50;
}, { passive: false });

/* 触摸双指缩放 */
let lastTouchDist = 0;
canvas.addEventListener('touchmove', function(e){
  if (e.touches.length === 2){
    e.preventDefault();
    const t1 = e.touches[0];
    const t2 = e.touches[1];
    const dist = Math.sqrt(
      Math.pow(t2.clientX - t1.clientX, 2) +
      Math.pow(t2.clientY - t1.clientY, 2)
    );
    if (lastTouchDist > 0){
      const diff = lastTouchDist - dist;
      targetSpeed += diff * 0.012;
      if (targetSpeed < 0.20) targetSpeed = 0.20;
      if (targetSpeed > 3.50) targetSpeed = 3.50;
    }
    lastTouchDist = dist;
  }
}, { passive: false });

canvas.addEventListener('touchend', function(){
  lastTouchDist = 0;
});

window.addEventListener('keydown', initAudio);

/* =========================================================
   扑动更新 —— 顶点变形
   ========================================================= */
function updateWings(phase){
  const wings = [leftWing, rightWing];

  for (let w = 0; w < wings.length; w++){
    const geo = wings[w].geometry;
    const positions = geo.attributes.position.array;
    const basePos = geo.userData.basePositions;
    const uCoords = geo.userData.uCoords;
    const count = uCoords.length;

    for (let k = 0; k < count; k++){
      const i3 = k * 3;
      const u = uCoords[k];

      const bx = basePos[i3];
      const by = basePos[i3 + 1];
      const bz = basePos[i3 + 2];

      /* 扑动幅度随翼展增大 */
      const amp = 0.06 + 0.55 * u * u;

      /* 相位沿翼展延迟 */
      const wave = Math.sin(phase - u * 1.15);

      positions[i3]     = bx;
      positions[i3 + 1] = by + wave * amp * 0.62;
      positions[i3 + 2] = bz + wave * amp * 0.10;
    }

    geo.attributes.position.needsUpdate = true;
    geo.computeVertexNormals();
  }
}

/* =========================================================
   身体轻微起伏
   ========================================================= */
function updateBody(t, phase){
  const bob = Math.sin(phase * 0.5) * 0.035;
  const roll = Math.sin(phase * 0.35 + 0.5) * 0.035;

  eagle.position.y = bob;
  eagle.rotation.z = roll;
  eagle.rotation.x = 0.10 + Math.sin(phase * 0.42) * 0.022;
}

/* =========================================================
   主循环
   ========================================================= */
let lastTime = performance.now();
let flapPhase = 0;
let elapsed = 0;

function animate(now){
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  elapsed += dt;

  /* 速度缓动 */
  speed += (targetSpeed - speed) * (1 - Math.exp(-3.2 * dt));

  /* 扑动相位 */
  const flapFreq = 1.15 * speed;
  flapPhase += dt * flapFreq * TAU;

  /* 更新翅膀与身体 */
  updateWings(flapPhase);
  updateBody(elapsed, flapPhase);

  /* 自动旋转 */
  if (autoRotatePause > 0){
    autoRotatePause -= dt;
    if (autoRotatePause <= 0) autoRotate = true;
  }
  if (autoRotate){
    targetYaw += dt * 0.16 * Math.min(1.5, speed * 0.75);
  }

  /* 相机缓动 */
  yaw   += (targetYaw   - yaw)   * (1 - Math.exp(-6.5 * dt));
  pitch += (targetPitch - pitch) * (1 - Math.exp(-6.5 * dt));

  /* 速度影响相机距离（越快离得越近，增强速度感） */
  const targetDist = 11.5 - Math.min(2.5, (speed - 1.0) * 1.4);
  cameraDist += (targetDist - cameraDist) * (1 - Math.exp(-2.4 * dt));

  /* 相机位置 */
  const cp = Math.cos(pitch);
  camera.position.set(
    cameraDist * Math.sin(yaw) * cp,
    cameraDist * Math.sin(pitch) + 0.6,
    cameraDist * Math.cos(yaw) * cp
  );
  camera.lookAt(0, 0.35, 0);

  /* 星尘缓慢漂移 */
  dust.rotation.y += dt * 0.012;
  dust.rotation.x = Math.sin(elapsed * 0.06) * 0.08;

  /* 音频动态调整 */
  if (audioReady && audioCtx && audioCtx.state === 'running' && windGain){
    const targetVol = 0.032 + speed * 0.024;
    windGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.5);

    if (windFilter){
      const targetFreq = 420 + speed * 220;
      windFilter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.6);
    }
  }

  /* HUD */
  const sv = document.getElementById('speedVal');
  if (sv) sv.textContent = speed.toFixed(2) + '×';

  const fv = document.getElementById('flapVal');
  if (fv) fv.textContent = (flapFreq).toFixed(1) + ' Hz';

  const sb = document.getElementById('stateBig');
  if (sb){
    if (speed < 0.5)       sb.textContent = '滑 翔';
    else if (speed < 1.1)  sb.textContent = '翱 翔';
    else if (speed < 2.0)  sb.textContent = '疾 飞';
    else                   sb.textContent = '俯 冲';
  }

  renderer.render(scene, camera);
}

/* =========================================================
   窗口尺寸
   ========================================================= */
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================
   启动
   ========================================================= */
requestAnimationFrame(animate);

})();
</script>
</body>
</html>
