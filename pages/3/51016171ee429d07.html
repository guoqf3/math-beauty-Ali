<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>杨氏双缝干涉 · 明暗相间条纹</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#010006;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;}
  canvas{position:fixed;inset:0;display:block;}
  .hud{position:fixed;inset:0;pointer-events:none;}

  .epigraph{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    font-family:"Songti SC","STSong",serif;
    font-size:clamp(12px,1.35vw,19px);
    letter-spacing:.16em;white-space:nowrap;
    color:#eafff6;
    text-shadow:0 0 12px rgba(90,240,200,.9),0 0 34px rgba(120,90,255,.5);
    animation:breathe 4.3s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}

  .formula{
    position:absolute;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
    font-size:clamp(9px,.76vw,12px);
    line-height:1.75;letter-spacing:.02em;
    color:rgba(140,215,255,.42);
    text-shadow:0 0 9px rgba(80,180,255,.25);
    white-space:nowrap;
  }
  .formula b{color:rgba(190,230,255,.68);font-weight:500;}
  .tl{top:56px;left:22px;}
  .tr{top:56px;right:22px;text-align:right;}
  .bl{bottom:16px;left:22px;}
  .br{bottom:16px;right:22px;text-align:right;}

  .controls{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;
    pointer-events:auto;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;color:rgba(160,215,255,.85);
    background:rgba(6,12,26,.72);
    border:1px solid rgba(80,180,255,.24);
    border-radius:30px;padding:8px 22px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 0 28px rgba(60,160,255,.18);
    white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .controls input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:110px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,#2ef0c8,#4a9dff,#a04dff,#ff4fd8);
    outline:none;cursor:pointer;
  }
  .controls input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#eaf4ff;
    box-shadow:0 0 10px rgba(120,220,255,.95),0 0 20px rgba(160,90,255,.75);
    cursor:pointer;
  }
  .controls input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border:none;border-radius:50%;
    background:#eaf4ff;
    box-shadow:0 0 10px rgba(120,220,255,.95);
    cursor:pointer;
  }
  .val{color:#7de0ff;font-weight:600;min-width:70px;text-align:center;
    text-shadow:0 0 10px rgba(80,220,255,.7);}
  .controls input[type=checkbox]{
    -webkit-appearance:none;appearance:none;
    width:32px;height:16px;border-radius:9px;
    background:rgba(100,110,200,.28);
    position:relative;cursor:pointer;transition:background .25s;
  }
  .controls input[type=checkbox]::after{
    content:"";position:absolute;top:2px;left:2px;
    width:12px;height:12px;border-radius:50%;
    background:#a8b6e0;transition:transform .25s,background .25s;
  }
  .controls input[type=checkbox]:checked{background:rgba(60,200,180,.72);}
  .controls input[type=checkbox]:checked::after{transform:translateX(16px);background:#eaffff;}

  @media (max-width:980px){
    .bl,.br{display:none;}
    .controls{gap:8px;padding:7px 14px;font-size:10px;}
    .controls input[type=range]{width:66px;}
    .val{min-width:56px;}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="epigraph">两束光各行其路，相遇处明暗自分</div>

  <div class="formula tl">
    <b>杨氏双缝明暗纹条件</b><br>
    d·sinθ = m·λ　（明）<br>
    d·sinθ = (m+½)·λ　（暗）
  </div>
  <div class="formula tr">
    <b>条纹间距</b><br>
    Δy = L·λ / d
  </div>
  <div class="formula bl">
    <b>叠加强度分布</b><br>
    I = I₀ · cos²(π d sinθ / λ)
  </div>
  <div class="formula br">
    <b>参考参数</b><br>
    d = 0.5 mm　L = 2.0 m<br>
    λ = 550 nm　Δy = 2.2 mm
  </div>

  <div class="controls">
    <label>缝距 d
      <input type="range" id="dRange" min="0.25" max="1.00" value="0.50" step="0.01">
    </label>
    <span class="val" id="dLabel">0.50 mm</span>
    <label>波长 λ
      <input type="range" id="lRange" min="400" max="700" value="550" step="1">
    </label>
    <span class="val" id="lLabel">550 nm</span>
    <label>
      <input type="checkbox" id="multiToggle">
      多色
    </label>
  </div>
</div>

<script>
(() => {
'use strict';

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;

/* ============================================================
   物理常量
============================================================ */
const L_PHYS = 2.0;        // 屏距 2.0 m
const SCREEN_H_M = 0.020;  // 光屏可视物理高度 20 mm

/* ============================================================
   状态
============================================================ */
let W = 0, H = 0, DPR = 1;
let bgGrad = null;

/* 布局 */
let waveX0 = 0, waveX1 = 0, waveY0 = 0, waveY1 = 0;
let slitX = 0, slitY1 = 0, slitY2 = 0, cy = 0;
let screenX = 0;
let fsX0 = 0, fsX1 = 0;    // 光屏正面视图横向范围
let pxPerMeter = 1;

let simTime = 0, lastTime = 0;

/* 可调参数 */
let dMM = 0.50;            // 缝距 mm
let lambdaNM = 550;        // 波长 nm
let targetD = 0.50;
let targetL = 550;
let autoPlay = true;

let multiColor = false;
let probe = null;

/* 视觉参数 */
let lambdaVis = 20;
let dVis = 30;
const WAVE_SPEED = 110;

/* ============================================================
   离屏画布（波场逐像素计算）
============================================================ */
const offCv  = document.createElement('canvas');
const offCtx = offCv.getContext('2d');
const GRID_W = 260;
const GRID_H = 190;
offCv.width  = GRID_W;
offCv.height = GRID_H;

/* ============================================================
   快速正弦查找表
============================================================ */
const SIN_N = 4096;
const SIN_LUT = new Float32Array(SIN_N);
for (let i = 0; i < SIN_N; i++) SIN_LUT[i] = Math.sin(i / SIN_N * TAU);
function fastSin(x){
  let i = ((x * (SIN_N / TAU)) | 0) % SIN_N;
  if (i < 0) i += SIN_N;
  return SIN_LUT[i];
}

/* ============================================================
   颜色查找表（波场）
============================================================ */
const WLUT = new Uint8Array(256 * 3);
(function buildWLUT(){
  const stops = [
    [0.00,   6,   4,  22],
    [0.18,  20,  30,  95],
    [0.40,   0,  95, 200],
    [0.62,   0, 190, 215],
    [0.82,  70, 245, 220],
    [1.00, 220, 255, 245]
  ];
  for (let i = 0; i < 256; i++){
    const f = i / 255;
    let a = stops[0], b = stops[stops.length - 1];
    for (let k = 0; k < stops.length - 1; k++){
      if (f >= stops[k][0] && f <= stops[k + 1][0]){ a = stops[k]; b = stops[k + 1]; break; }
    }
    const span = (b[0] - a[0]) || 1;
    const t = (f - a[0]) / span;
    WLUT[i*3]   = (a[1] + (b[1] - a[1]) * t) | 0;
    WLUT[i*3+1] = (a[2] + (b[2] - a[2]) * t) | 0;
    WLUT[i*3+2] = (a[3] + (b[3] - a[3]) * t) | 0;
  }
})();

/* ============================================================
   工具
============================================================ */
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function smoothstep(x){ x = clamp(x, 0, 1); return x*x*(3 - 2*x); }
function rr(c2, x, y, w, h, r){
  c2.beginPath();
  c2.moveTo(x + r, y);
  c2.lineTo(x + w - r, y); c2.arcTo(x + w, y, x + w, y + r, r);
  c2.lineTo(x + w, y + h - r); c2.arcTo(x + w, y + h, x + w - r, y + h, r);
  c2.lineTo(x + r, y + h); c2.arcTo(x, y + h, x, y + h - r, r);
  c2.lineTo(x, y + r); c2.arcTo(x, y, x + r, y, r);
  c2.closePath();
}

/* ============================================================
   尺寸
============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* 波场区域 */
  waveX0 = W * 0.035;
  waveX1 = W * 0.575;
  waveY0 = H * 0.135;
  waveY1 = H * 0.845;

  cy = (waveY0 + waveY1) / 2;

  /* 狭缝 */
  slitX = waveX0 + 26;

  /* 光屏（俯视图中的竖线） */
  screenX = waveX1 - 6;

  /* 光屏正面视图 */
  fsX0 = W * 0.635;
  fsX1 = W * 0.965;

  /* 光屏高度对应 20 mm */
  const screenPxH = (waveY1 - waveY0) * 0.92;
  pxPerMeter = screenPxH / SCREEN_H_M;

  bgGrad = ctx.createRadialGradient(
    W * 0.42, H * 0.48, 0,
    W * 0.42, H * 0.48, Math.max(W, H) * 0.88
  );
  bgGrad.addColorStop(0,    '#050a1a');
  bgGrad.addColorStop(0.45, '#030512');
  bgGrad.addColorStop(1,    '#010004');
}

/* ============================================================
   30 秒剧本
============================================================ */
function scriptD(t){
  /* 0.25 → 0.75 → 0.25 平滑循环 */
  return 0.50 - 0.25 * Math.cos(TAU * t / 30);
}
function scriptL(t){
  /* 400 → 700 缓慢漂移 */
  return 550 + 150 * Math.sin(TAU * t / 30 - Math.PI / 2);
}

/* ============================================================
   光屏强度（物理）
============================================================ */
function screenIntensityAtY(pixelY){
  const dyPx = pixelY - cy;
  const dyM  = dyPx / pxPerMeter;
  const sinT = dyM / L_PHYS;
  const dM   = dMM * 1e-3;
  const lM   = lambdaNM * 1e-9;
  const delta = dM * sinT;
  const phase = Math.PI * delta / lM;
  const c = Math.cos(phase);
  return c * c;
}

/* 光程差（m）与级次 m */
function pathInfoAtY(pixelY){
  const dyPx = pixelY - cy;
  const dyM  = dyPx / pxPerMeter;
  const sinT = dyM / L_PHYS;
  const dM   = dMM * 1e-3;
  const lM   = lambdaNM * 1e-9;
  const delta = dM * sinT;
  return { delta: delta, m: delta / lM, sinT: sinT };
}

/* ============================================================
   更新
============================================================ */
function update(dt){
  simTime += dt;
  if (simTime >= 30) simTime -= 30;

  if (autoPlay){
    targetD = scriptD(simTime);
    targetL = scriptL(simTime);
    dRange.value = targetD.toFixed(2);
    lRange.value = Math.round(targetL);
  }

  dMM      += (targetD - dMM) * Math.min(1, dt * 4);
  lambdaNM += (targetL - lambdaNM) * Math.min(1, dt * 4);

  dMM = clamp(dMM, 0.25, 1.00);
  lambdaNM = clamp(lambdaNM, 400, 700);

  /* 视觉参数 */
  dVis      = 60 * dMM;
  lambdaVis = 20 * (lambdaNM / 550);

  /* 狭缝位置 */
  slitY1 = cy - dVis * 0.5;
  slitY2 = cy + dVis * 0.5;

  /* 标签 */
  dLabel.textContent = dMM.toFixed(2) + ' mm';
  lLabel.textContent = Math.round(lambdaNM) + ' nm';

  if (probe){
    probe.t += dt;
    if (probe.t > 4.0) probe = null;
  }
}

/* ============================================================
   渲染 · 波场
============================================================ */
function renderWaveField(t){
  const img = offCtx.createImageData(GRID_W, GRID_H);
  const data = img.data;

  const k = TAU / lambdaVis;
  const omega = k * WAVE_SPEED;

  const xScale = (waveX1 - waveX0) / GRID_W;
  const yScale = (waveY1 - waveY0) / GRID_H;

  const sX = slitX;
  const sY1 = slitY1;
  const sY2 = slitY2;

  let idx = 0;
  for (let j = 0; j < GRID_H; j++){
    const wy = waveY0 + (j + 0.5) * yScale;
    const dy1 = wy - sY1;
    const dy2 = wy - sY2;

    for (let i = 0; i < GRID_W; i++){
      const wx = waveX0 + (i + 0.5) * xScale;
      const dx = wx - sX;

      const r1 = Math.sqrt(dx*dx + dy1*dy1);
      const r2 = Math.sqrt(dx*dx + dy2*dy2);

      const v = fastSin(k * r1 - omega * t) + fastSin(k * r2 - omega * t);
      let I = v * v * 0.25;

      /* 狭缝附近柔化，抑制混叠 */
      const soft = Math.min(1, r1 / 6, r2 / 6);
      I *= soft;

      if (I > 1) I = 1;
      if (I < 0) I = 0;

      const ci = (I * 255) | 0;
      data[idx++] = WLUT[ci*3];
      data[idx++] = WLUT[ci*3+1];
      data[idx++] = WLUT[ci*3+2];
      data[idx++] = 255;
    }
  }

  offCtx.putImageData(img, 0, 0);

  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(offCv, waveX0, waveY0, waveX1 - waveX0, waveY1 - waveY0);
}

/* ============================================================
   渲染 · 狭缝与光屏（俯视图）
============================================================ */
function drawSlitsAndScreen(){
  /* --- 不透明挡板 --- */
  ctx.fillStyle = 'rgba(20, 15, 45, 0.92)';
  ctx.fillRect(slitX - 10, waveY0, 8, (slitY1 - 12) - waveY0);
  ctx.fillRect(slitX - 10, slitY1 + 12, 8, (slitY2 - 12) - (slitY1 + 12));
  ctx.fillRect(slitX - 10, slitY2 + 12, 8, waveY1 - (slitY2 + 12));

  /* --- 狭缝光点 --- */
  for (const sy of [slitY1, slitY2]){
    const g = ctx.createRadialGradient(slitX, sy, 0, slitX, sy, 18);
    g.addColorStop(0,   'rgba(220,255,250,0.95)');
    g.addColorStop(0.3, 'rgba(80,240,220,0.55)');
    g.addColorStop(1,   'rgba(0,180,200,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(slitX, sy, 18, 0, TAU);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(slitX, sy, 2.6, 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  /* --- 光屏（竖线 + 亮度分布） --- */
  const yTop = cy - (waveY1 - waveY0) * 0.46;
  const yBot = cy + (waveY1 - waveY0) * 0.46;

  for (let y = yTop; y < yBot; y += 2){
    const I = screenIntensityAtY(y);
    const a = 0.10 + 0.90 * I;
    const ci = (I * 255) | 0;
    ctx.fillStyle = `rgba(${WLUT[ci*3]},${WLUT[ci*3+1]},${WLUT[ci*3+2]},${a})`;
    ctx.fillRect(screenX - 4, y, 8, 2);
  }

  /* 光屏边框 */
  ctx.strokeStyle = 'rgba(120, 220, 255, 0.30)';
  ctx.lineWidth = 1;
  ctx.strokeRect(screenX - 6, yTop, 12, yBot - yTop);
}

/* ============================================================
   渲染 · 光屏正面视图
============================================================ */
function drawFrontScreen(){
  const yTop = cy - (waveY1 - waveY0) * 0.46;
  const yBot = cy + (waveY1 - waveY0) * 0.46;
  const w = fsX1 - fsX0;

  /* 面板底板 */
  ctx.fillStyle = 'rgba(4, 6, 18, 0.90)';
  rr(ctx, fsX0 - 8, yTop - 8, w + 16, (yBot - yTop) + 16, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(80, 180, 255, 0.22)';
  ctx.lineWidth = 1;
  rr(ctx, fsX0 - 8, yTop - 8, w + 16, (yBot - yTop) + 16, 10);
  ctx.stroke();

  /* 条纹 */
  for (let y = yTop; y < yBot; y += 2){
    let r = 0, g = 0, b = 0, a = 1;

    if (multiColor){
      /* 三色叠加：450 蓝 / 550 绿 / 650 红 */
      const dM = dMM * 1e-3;
      const dyPx = y - cy;
      const dyM = dyPx / pxPerMeter;
      const sinT = dyM / L_PHYS;

      const I1 = Math.pow(Math.cos(Math.PI * dM * sinT / (450e-9)), 2);
      const I2 = Math.pow(Math.cos(Math.PI * dM * sinT / (550e-9)), 2);
      const I3 = Math.pow(Math.cos(Math.PI * dM * sinT / (650e-9)), 2);

      r = 40 + 215 * I3;
      g = 40 + 215 * I2;
      b = 40 + 215 * I1;
      a = 0.95;
    } else {
      const I = screenIntensityAtY(y);
      const ci = (I * 255) | 0;
      r = WLUT[ci*3];
      g = WLUT[ci*3+1];
      b = WLUT[ci*3+2];
      a = 0.20 + 0.80 * I;
    }

    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${a})`;
    ctx.fillRect(fsX0, y, w, 2);
  }

  /* 标签 */
  ctx.font = '600 10.5px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(150, 220, 255, 0.72)';
  ctx.fillText('光屏正面视图', fsX0 + w/2, yTop - 18);

  ctx.font = '500 9.5px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle = 'rgba(140, 190, 255, 0.42)';
  ctx.fillText('中央零级主极大', fsX0 + w/2, cy + 3);

  /* 标注中央亮纹 */
  ctx.setLineDash([4, 5]);
  ctx.strokeStyle = 'rgba(255, 220, 140, 0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(fsX0 - 14, cy);
  ctx.lineTo(fsX1 + 8, cy);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 条纹级次标注（±1, ±2） */
  const lM = lambdaNM * 1e-9;
  const dM = dMM * 1e-3;
  const dyM = lM * L_PHYS / dM;   // 条纹间距（m）

  ctx.font = '600 9.5px ui-monospace,Menlo,Consolas,monospace';
  for (let m = -3; m <= 3; m++){
    if (m === 0) continue;
    const y = cy + m * dyM * pxPerMeter;
    if (y < yTop + 4 || y > yBot - 4) continue;
    ctx.fillStyle = 'rgba(255, 220, 140, 0.50)';
    ctx.textAlign = 'right';
    ctx.fillText((m > 0 ? '+' : '') + m, fsX0 - 6, y + 3.5);
  }
}

/* ============================================================
   渲染 · 点击探测
============================================================ */
function drawProbe(){
  if (!probe) return;
  const a = Math.max(0, 1 - probe.t / 4.0);
  if (a <= 0){ probe = null; return; }

  const x = probe.x, y = probe.y;

  /* 脉冲环 */
  ctx.beginPath();
  ctx.arc(x, y, 12 + (1 - a) * 22, 0, TAU);
  ctx.strokeStyle = `rgba(255, 225, 140, ${a * 0.68})`;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x, y, 4.5, 0, TAU);
  ctx.fillStyle = `rgba(255, 240, 180, ${a})`;
  ctx.shadowColor = 'rgba(255, 215, 120, 0.95)';
  ctx.shadowBlur = 16;
  ctx.fill();
  ctx.shadowBlur = 0;

  /* 信息 */
  const info = pathInfoAtY(y);
  const lines = [
    `距中心 y = ${((y - cy) / pxPerMeter * 1000).toFixed(2)} mm`,
    `光程差 Δ = ${(info.delta * 1e9).toFixed(0)} nm`,
    `级次 m = ${info.m.toFixed(2)}`,
    `sinθ = ${info.sinT.toExponential(2)}`,
    Math.abs(info.m - Math.round(info.m)) < 0.15 ? '接近明纹' : '介于明暗之间'
  ];

  ctx.font = '600 10.5px ui-monospace,Menlo,Consolas,monospace';
  let mw = 0;
  for (const l of lines) mw = Math.max(mw, ctx.measureText(l).width);

  const bw = mw + 20, bh = lines.length * 15.5 + 14;
  let bx = x + 16, by = y - bh / 2;
  if (bx + bw > W - 10) bx = x - bw - 16;
  if (by < 10) by = 10;
  if (by + bh > H - 80) by = H - 80 - bh;

  ctx.fillStyle = `rgba(16, 14, 34, ${a * 0.94})`;
  ctx.strokeStyle = `rgba(255, 215, 140, ${a * 0.58})`;
  ctx.lineWidth = 1;
  rr(ctx, bx, by, bw, bh, 9);
  ctx.fill(); ctx.stroke();

  ctx.textAlign = 'left';
  for (let i = 0; i < lines.length; i++){
    ctx.fillStyle = i === 0
      ? `rgba(255, 235, 170, ${a})`
      : `rgba(210, 228, 255, ${a * 0.88})`;
    ctx.fillText(lines[i], bx + 10, by + 18 + i * 15.5);
  }
}

/* ============================================================
   渲染 · 读数
============================================================ */
function drawReadout(){
  const dyMM = (L_PHYS * lambdaNM * 1e-9 / (dMM * 1e-3)) * 1000;
  const f1 = 0;

  const txt =
    `d = ${dMM.toFixed(2)} mm    ` +
    `λ = ${Math.round(lambdaNM)} nm    ` +
    `Δy = Lλ/d = ${dyMM.toFixed(2)} mm    ` +
    `L = 2.0 m`;

  ctx.font = '600 12px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(205, 240, 255, 0.85)';
  ctx.shadowColor = 'rgba(90, 220, 200, 0.85)';
  ctx.shadowBlur = 14;
  ctx.fillText(txt, W / 2, H - 66);
  ctx.shadowBlur = 0;
}

/* ============================================================
   主渲染
============================================================ */
function render(){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  renderWaveField(simTime);
  drawSlitsAndScreen();
  drawFrontScreen();
  drawProbe();
  drawReadout();
}

/* ============================================================
   主循环
============================================================ */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();
}

/* ============================================================
   交互
============================================================ */
const dRange = document.getElementById('dRange');
const dLabel = document.getElementById('dLabel');
const lRange = document.getElementById('lRange');
const lLabel = document.getElementById('lLabel');
const multiToggle = document.getElementById('multiToggle');

dRange.addEventListener('input', () => {
  autoPlay = false;
  targetD = parseFloat(dRange.value);
});
lRange.addEventListener('input', () => {
  autoPlay = false;
  targetL = parseFloat(lRange.value);
});
multiToggle.addEventListener('change', () => {
  multiColor = multiToggle.checked;
});

cv.addEventListener('pointerdown', (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const yTop = cy - (waveY1 - waveY0) * 0.46;
  const yBot = cy + (waveY1 - waveY0) * 0.46;

  /* 点击光屏正面视图 */
  if (mx >= fsX0 - 8 && mx <= fsX1 + 8 && my >= yTop && my <= yBot){
    probe = { x: mx, y: my, t: 0 };
    return;
  }
  /* 点击俯视图光屏线附近 */
  if (mx >= screenX - 20 && mx <= screenX + 20 && my >= yTop && my <= yBot){
    probe = { x: mx, y: my, t: 0 };
  }
});

window.addEventListener('resize', resize);

/* ============================================================
   启动
============================================================ */
resize();
requestAnimationFrame(loop);

})();
</script>
