<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>脉动生物 · Pulse Organism</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#03040a;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  /* ---------- 左上标题 ---------- */
  #title{
    position:absolute;top:0;left:0;
    padding:40px 46px;
    opacity:0;animation:fade 1.8s .4s ease forwards;
  }
  #title h1{
    font-size:clamp(18px,2.4vw,30px);
    font-weight:200;
    letter-spacing:.42em;text-indent:.42em;
    background:linear-gradient(96deg,#8090ff 0%,#c09eff 40%,#ffcc77 78%,#ffeecc 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 26px rgba(150,120,240,.42));
  }
  #title .en{
    font-size:9.5px;letter-spacing:.50em;text-indent:.50em;
    color:rgba(160,180,230,.34);
  }

  /* ---------- 左下：那一行代码 ---------- */
  #formula{
    position:absolute;bottom:0;left:0;
    padding:0 46px 34px;
    opacity:0;animation:fade 1.8s 1.1s ease forwards;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:clamp(9px,1.05vw,12px);
    line-height:2.0;
    letter-spacing:.02em;
    color:rgba(140,160,215,.30);
    max-width:min(760px, 84vw);
  }
  #formula .lab{
    display:block;font-size:8.5px;
    letter-spacing:.44em;text-indent:.44em;
    color:rgba(120,140,200,.22);
    margin-bottom:10px;
  }
  #formula .kw{color:rgba(190,155,255,.58);}
  #formula .fn{color:rgba(140,205,255,.56);}
  #formula .nm{color:rgba(255,205,130,.62);}
  #formula .op{color:rgba(150,172,225,.30);}

  /* ---------- 右下角 ---------- */
  #hint{
    position:absolute;bottom:0;right:0;
    padding:0 46px 34px;
    text-align:right;
    opacity:0;animation:fade 1.8s 1.4s ease forwards;
  }
  #hint .big{
    font-size:clamp(9.5px,1.0vw,12px);
    letter-spacing:.34em;text-indent:.34em;
    color:rgba(255,205,130,.42);
    margin-bottom:10px;font-weight:300;
  }
  #hint .small{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(140,160,215,.22);
    line-height:1.9;
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:640px){
    #title{padding:20px 20px;}
    #formula{padding:0 20px 18px;font-size:8px;}
    #hint{padding:0 20px 18px;}
    #hint .small{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <h1>脉动生物</h1>
    <div class="en">PULSE ORGANISM</div>
  </div>

  <div id="formula">
    <span class="lab">ONE LINE, ONE CREATURE</span>
    <span class="kw">const</span> <span class="fn">pulse</span> <span class="op">=</span> (a,t,k) <span class="op">=&gt;</span> <span class="nm">1</span>
    <span class="op">+</span> <span class="nm">.30</span><span class="op">·</span>sin(<span class="nm">3</span>a<span class="op">+</span>t)
    <span class="op">+</span> <span class="nm">.18</span><span class="op">·</span>sin(<span class="nm">5</span>a<span class="op">−</span><span class="nm">1.4</span>t)
    <span class="op">+</span> <span class="nm">.10</span><span class="op">·</span>sin(<span class="nm">8</span>a<span class="op">+</span><span class="nm">.7</span>t)
    <span class="op">+</span> <span class="nm">.06</span><span class="op">·</span>sin(<span class="nm">13</span>a<span class="op">−</span><span class="nm">2</span>t)
  </div>

  <div id="hint">
    <div class="big">四重频率叠加</div>
    <div class="small">
      SUPERPOSITION OF 4 SINE WAVES<br>
      r(θ) = Σ sin(kᵢθ ± ωᵢt)
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 基础
   ========================================================= */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, R = 0;

const TAU = Math.PI * 2;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.5;
  R  = Math.min(W, H) * 0.22;
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   1. ★ 那一行 ★
   四重正弦叠加的径向函数，决定生物的轮廓形状
   参数：
     a —— 极角
     t —— 时间
     k —— 相位偏移（用于让各层错位）
   ========================================================= */
const pulse = (a, t, k) =>
  1
  + 0.30 * Math.sin(3  * a + t * 0.90 + k)
  + 0.18 * Math.sin(5  * a - t * 1.40 + k * 2)
  + 0.10 * Math.sin(8  * a + t * 0.70 + k * 3)
  + 0.06 * Math.sin(13 * a - t * 2.00 + k * 4);

/* =========================================================
   2. 参数
   ========================================================= */
const N          = 240;   // 每条曲线的采样点数
const RING_COUNT = 20;    // 同心层数
const CILIA      = 72;    // 纤毛数量
const DOTS       = 48;    // 环绕粒子数

const HUE_IN  = 255;      // 内层色相：蓝紫
const HUE_OUT = 45;       // 外层色相：金

/* =========================================================
   3. 主循环
   ========================================================= */
let T0 = performance.now();

function frame(now){
  requestAnimationFrame(frame);

  const t = (now - T0) / 1000;

  /* ---------- 清屏 ---------- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#03040a';
  ctx.fillRect(0, 0, W, H);

  /* ---------- 切到加法混合 ---------- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  /* ---------- 整体呼吸 ---------- */
  const breath = 1 + 0.045 * Math.sin(t * 0.75);

  /* ---------- 体光：生物背后的柔光 ---------- */
  const halo = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 1.9);
  halo.addColorStop(0.00, 'rgba(88, 64, 170, 0.20)');
  halo.addColorStop(0.45, 'rgba(58, 40, 120, 0.07)');
  halo.addColorStop(1.00, 'rgba(20, 12, 50, 0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);

  /* =======================================================
     4. 同心脉动层
     ======================================================= */
  for (let i = 0; i < RING_COUNT; i++){
    const k = i / (RING_COUNT - 1);          // 0 → 1

    const scale = (0.16 + k * 0.92) * breath;
    const phase = i * 0.55;                  // 层间相位错位

    /* 色相：内紫 → 外金 */
    const hue = (HUE_IN + k * (360 - HUE_IN + HUE_OUT) + t * 7) % 360;
    const sat = 88 + k * 10;
    const lum = 52 + k * 20;

    /* ---- 构建曲线路径 ---- */
    ctx.beginPath();
    for (let j = 0; j <= N; j++){
      const a  = j / N * TAU;
      const rr = R * scale * pulse(a, t, phase);
      const px = CX + Math.cos(a) * rr;
      const py = CY + Math.sin(a) * rr;
      if (j) ctx.lineTo(px, py);
      else   ctx.moveTo(px, py);
    }
    ctx.closePath();

    /* ---- 外层柔光 ---- */
    const glowW = (16 - k * 7) * (1 + 0.18 * Math.sin(t * 2 + i));
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',' + sat.toFixed(0) + '%,' +
                      lum.toFixed(0) + '%,' + (0.032 + 0.030 * k).toFixed(3) + ')';
    ctx.lineWidth = glowW;
    ctx.stroke();

    /* ---- 内核亮线 ---- */
    ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',' + sat.toFixed(0) + '%,' +
                      Math.min(96, lum + 24).toFixed(0) + '%,' +
                      (0.26 + 0.44 * k).toFixed(3) + ')';
    ctx.lineWidth = 0.7 + k * 1.5;
    ctx.stroke();
  }

  /* =======================================================
     5. 纤毛 —— 从最外层向外甩出的细刺
     ======================================================= */
  ctx.beginPath();
  for (let i = 0; i < CILIA; i++){
    const a  = i / CILIA * TAU;
    const kk = i * 0.37;

    /* 起点贴在最外层膜上 */
    const r0  = R * 0.94 * breath * pulse(a, t, 9);
    /* 长度随时间起伏 */
    const len = R * (0.035 + 0.13 * (0.5 + 0.5 * Math.sin(t * 2.4 + kk)));
    const r1  = r0 + len;

    ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0);
    ctx.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1);
  }
  ctx.strokeStyle = 'hsla(48, 96%, 72%, 0.30)';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  /* =======================================================
     6. 细胞核 —— 中心脉动的光团
     ======================================================= */
  const coreR = R * 0.085 * (1 + 0.30 * Math.sin(t * 1.9));

  const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR * 5.2);
  cg.addColorStop(0.00, 'rgba(255, 252, 244, 0.92)');
  cg.addColorStop(0.18, 'rgba(255, 216, 152, 0.52)');
  cg.addColorStop(0.48, 'rgba(202, 132, 255, 0.16)');
  cg.addColorStop(1.00, 'rgba(150, 90, 240, 0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(CX, CY, coreR * 5.2, 0, TAU);
  ctx.fill();

  /* =======================================================
     7. 环绕粒子 —— 黄金角分布，随时间缓慢公转
     ======================================================= */
  const GOLDEN = 2.399963229728653;

  for (let i = 0; i < DOTS; i++){
    const a  = i * GOLDEN + t * (0.22 + (i % 7) * 0.075);
    const rr = R * (0.10 + 0.54 * Math.pow((i % 11) / 11, 0.72)) * breath;

    const px = CX + Math.cos(a) * rr;
    const py = CY + Math.sin(a) * rr;

    const size = 0.9 + 1.5 * Math.abs(Math.sin(t * 1.7 + i));
    const hue  = (HUE_IN + (i % 12) * 15 + t * 22) % 360;

    ctx.fillStyle = 'hsla(' + hue.toFixed(1) + ', 92%, 72%, 0.42)';
    ctx.beginPath();
    ctx.arc(px, py, size, 0, TAU);
    ctx.fill();
  }

  /* =======================================================
     8. 暗角 —— 收拢视线
     ======================================================= */
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(
    CX, CY, Math.min(W, H) * 0.28,
    CX, CY, Math.max(W, H) * 0.78
  );
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.70)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   9. 启动
   ========================================================= */
T0 = performance.now();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
