<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粒子烟花</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;cursor:crosshair}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let P = [], W, H;
const resize = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
resize(); onresize = resize;

// 移动：持续喷出小粒子
addEventListener('pointermove', e => {
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * 6.283, s = Math.random() * 3;
    P.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 1, h: Math.random() * 360 });
  }
  if (P.length > 4000) P.splice(0, P.length - 4000);
});

// 点击：爆发式烟花
addEventListener('pointerdown', e => {
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * 6.283, s = Math.random() * 9;
    P.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 1, h: Math.random() * 360 });
  }
});

(function loop() {
  // 半透明覆盖 —— 拖尾的魔法就在这一笔
  x.globalCompositeOperation = 'source-over';
  x.fillStyle = 'rgba(5,6,10,0.12)';
  x.fillRect(0, 0, W, H);

  // 发光叠加
  x.globalCompositeOperation = 'lighter';
  P = P.filter(p => p.l > 0.01);

  for (const p of P) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.06;            // 重力
    p.vx *= 0.985; p.vy *= 0.985;  // 空气阻力
    p.l *= 0.96;             // 生命衰减
    x.fillStyle = `hsla(${p.h},100%,${55 + p.l * 25}%,${p.l})`;
    x.beginPath();
    x.arc(p.x, p.y, p.l * 2.6, 0, 6.283);
    x.fill();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
