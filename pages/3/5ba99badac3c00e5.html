<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四色定理 · 图论染色</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#02061a;
  }
  canvas { display:block; }

  #topText {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    width:min(82vw,1060px);
    min-height:2.4em;
    text-align:center;
    color:#c8e4ff;
    font-size:clamp(13px,1.5vw,19.5px);
    letter-spacing:.07em;
    line-height:1.75;
    font-weight:400;
    text-shadow:0 0 16px rgba(110,200,255,.75),
                0 0 46px rgba(60,150,255,.35);
    pointer-events:none;
    z-index:10;
  }
  #topText::after {
    content:'';
    display:inline-block;
    width:2px; height:.95em;
    background:#7dd8ff;
    margin-left:5px;
    vertical-align:-.12em;
    box-shadow:0 0 9px #7dd8ff;
    animation:blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50%{opacity:0;} }

  .formula {
    position:fixed;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    color:rgba(160,210,255,.55);
    font-size:clamp(11px,1.02vw,15.5px);
    letter-spacing:.05em;
    pointer-events:none;
    z-index:10;
    text-shadow:0 0 14px rgba(80,170,255,.55);
    line-height:1.75;
  }
  .f-tl { top:94px; left:24px; text-align:left; }
  .f-tr { top:94px; right:24px; text-align:right; }
  .f-bl { bottom:44px; left:24px; text-align:left; }

  #panel {
    position:fixed; right:24px; bottom:44px;
    width:232px;
    padding:13px 15px 11px;
    background:rgba(6,14,34,.55);
    border:1px solid rgba(90,170,255,.25);
    border-radius:11px;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    color:#9cbbdd;
    font-size:12px;
    z-index:20;
    box-shadow:0 6px 30px rgba(0,0,0,.55),
               inset 0 0 22px rgba(70,150,255,.08);
  }
  #panel .stat {
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    letter-spacing:.04em;
  }
  #panel .stat .k { color:rgba(140,180,225,.7); }
  #panel .stat .v {
    font-family:"Cambria Math",Georgia,serif;
    color:#7dffd8;
    font-size:12.5px;
  }
  #panel .colors {
    display:flex;
    gap:6px;
    justify-content:center;
    margin-top:6px;
    margin-bottom:2px;
  }
  #panel .colors .sw {
    width:22px; height:22px;
    border-radius:5px;
    box-shadow:0 0 10px rgba(255,255,255,.14);
    transition:transform .2s;
  }
  #panel .colors .sw:hover { transform:scale(1.15); }
  #panel .hint {
    text-align:center;
    font-size:10.5px;
    color:rgba(140,180,225,.5);
    letter-spacing:.1em;
    margin-top:8px;
  }
</style>
</head>
<body>

<div id="topText"></div>

<div class="formula f-tl">
  χ(G) ≤ 4　（任意平面图可 4 染色）
</div>
<div class="formula f-tr">
  平面图 G　·　顶点 V　·　边 E<br>
  <span style="font-size:.85em;color:rgba(140,200,255,.45)">可约构型有限集</span>
</div>
<div class="formula f-bl">
  相邻区块必须异色　·　四色即足
</div>

<div id="panel">
  <div class="stat"><span class="k">顶点数 V</span><span class="v" id="vV">—</span></div>
  <div class="stat"><span class="k">边数 E</span><span class="v" id="vE">—</span></div>
  <div class="stat"><span class="k">色数 χ(G)</span><span class="v" id="vChi">—</span></div>
  <div class="colors">
    <div class="sw" style="background:#ff5c7a"></div>
    <div class="sw" style="background:#4ee0c8"></div>
    <div class="sw" style="background:#ffd23f"></div>
    <div class="sw" style="background:#5c8cff"></div>
  </div>
  <div class="hint">拖拽旋转 · 观察四色分布</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x02061a, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x02061a, 22, 62);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 900);
camera.position.set(3.2, 11.5, 13.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.34;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 45;
controls.minPolarAngle = 0.10;
controls.maxPolarAngle = Math.PI * 0.47;

/* ============================================================
   光点贴图
   ============================================================ */
function createSpriteTexture(){
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.18,'rgba(255,255,255,0.82)');
  g.addColorStop(0.46,'rgba(255,255,255,0.22)');
  g.addColorStop(1.00,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,s,s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPRITE = createSpriteTexture();

/* ============================================================
   星空背景
   ============================================================ */
(function buildStars(){
  const COUNT = 1500;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++){
    const r  = 70 + Math.random() * 180;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3    ] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.5 + 8;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th);

    const t = Math.random();
    col[i*3    ] = 0.55 + 0.45 * t;
    col[i*3 + 1] = 0.70 + 0.30 * t;
    col[i*3 + 2] = 1.00;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 0.9, map: SPRITE, vertexColors: true,
    transparent: true, opacity: 0.58,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* ============================================================
   地图生成参数
   ============================================================ */
const GW = 18;
const GH = 14;
const SPACING = 0.90;

const OFFSET_X = -GW * SPACING / 2;
const OFFSET_Z = -GH * SPACING / 2;

/* ---- 四色调色板 ---- */
const PALETTE = [
  new THREE.Color(0xff5c7a),   // 珊瑚红
  new THREE.Color(0x4ee0c8),   // 青绿
  new THREE.Color(0xffd23f),   // 金黄
  new THREE.Color(0x5c8cff),   // 亮蓝
];

/* ============================================================
   生成随机区域地图
   ============================================================ */
function generateMap(){
  const total = GW * GH;

  for (let attempt = 0; attempt < 30; attempt++){
    const grid  = new Int32Array(total).fill(-1);
    const regions = [];
    let regionId = 0;
    let filled = 0;

    /* ---- 随机增长区域 ---- */
    while (filled < total){
      let seed = -1;
      for (let i = 0; i < total; i++){
        if (grid[i] === -1){ seed = i; break; }
      }
      if (seed < 0) break;

      const cells = [seed];
      grid[seed] = regionId;
      filled++;

      const targetSize = 3 + Math.floor(Math.random() * 7);
      const frontier = [seed];

      while (frontier.length > 0 && cells.length < targetSize){
        const fi  = Math.floor(Math.random() * frontier.length);
        const cur = frontier[fi];
        const cx  = cur % GW;
        const cy  = Math.floor(cur / GW);

        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        for (let i = dirs.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          const t = dirs[i]; dirs[i] = dirs[j]; dirs[j] = t;
        }

        let grown = false;
        for (const [dx, dy] of dirs){
          const nx = cx + dx;
          const ny = cy + dy;
          if (nx < 0 || nx >= GW || ny < 0 || ny >= GH) continue;
          const ni = ny * GW + nx;
          if (grid[ni] !== -1) continue;

          grid[ni] = regionId;
          cells.push(ni);
          frontier.push(ni);
          filled++;
          grown = true;
          break;
        }
        if (!grown) frontier.splice(fi, 1);
      }

      regions.push(cells);
      regionId++;
    }

    if (regions.length < 14) continue;   // 太碎，重新生成

    /* ---- 邻接表 ---- */
    const adj = Array.from({ length: regions.length }, () => new Set());
    for (let y = 0; y < GH; y++){
      for (let x = 0; x < GW; x++){
        const r = grid[y * GW + x];
        if (x + 1 < GW){
          const r2 = grid[y * GW + x + 1];
          if (r2 !== r){ adj[r].add(r2); adj[r2].add(r); }
        }
        if (y + 1 < GH){
          const r2 = grid[(y + 1) * GW + x];
          if (r2 !== r){ adj[r].add(r2); adj[r2].add(r); }
        }
      }
    }

    /* ---- Welsh-Powell 贪心着色 ---- */
    const n = regions.length;
    const order = Array.from({ length: n }, (_, i) => i)
      .sort((a, b) => adj[b].size - adj[a].size);

    const color = new Int32Array(n).fill(-1);
    for (const i of order){
      const used = new Set();
      for (const nb of adj[i]) if (color[nb] >= 0) used.add(color[nb]);
      let c = 0;
      while (used.has(c)) c++;
      color[i] = c;
    }

    let maxColor = 0;
    for (let i = 0; i < n; i++) if (color[i] > maxColor) maxColor = color[i];

    if (maxColor <= 3){
      let edgeCount = 0;
      for (let i = 0; i < n; i++) edgeCount += adj[i].size;
      edgeCount /= 2;
      return { grid, regions, color, adj, V: n, E: edgeCount };
    }
  }

  /* 兜底（极少触发） */
  return generateMap();
}

const MAP = generateMap();

/* ---- 面板统计 ---- */
document.getElementById('vV').textContent = MAP.V;
document.getElementById('vE').textContent = MAP.E;
let chi = 0;
for (let i = 0; i < MAP.V; i++) if (MAP.color[i] > chi) chi = MAP.color[i];
document.getElementById('vChi').textContent = chi + 1;

/* ============================================================
   构建每个区域的 3D 组
   ============================================================ */
const regionItems = [];

function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }

(function buildRegions(){
  const { grid, regions, color } = MAP;

  /* ---- 计算每个区域的质心与出场顺序 ---- */
  const infos = regions.map((cells, rid) => {
    let cx = 0, cz = 0;
    for (const ci of cells){
      const gx = ci % GW;
      const gy = Math.floor(ci / GW);
      cx += OFFSET_X + (gx + 0.5) * SPACING;
      cz += OFFSET_Z + (gy + 0.5) * SPACING;
    }
    cx /= cells.length;
    cz /= cells.length;
    return { rid, cells, cx, cz, dist: Math.sqrt(cx*cx + cz*cz) };
  });

  infos.sort((a, b) => a.dist - b.dist);

  /* ---- 逐个构建 ---- */
  infos.forEach((info, orderIdx) => {
    const { rid, cells, cx, cz } = info;

    const positions = [];
    const indices   = [];
    let vBase = 0;

    for (const ci of cells){
      const gx = ci % GW;
      const gy = Math.floor(ci / GW);

      const x0 = OFFSET_X + gx * SPACING - cx;
      const z0 = OFFSET_Z + gy * SPACING - cz;
      const x1 = x0 + SPACING;
      const z1 = z0 + SPACING;

      positions.push(
        x0, 0, z0,
        x1, 0, z0,
        x1, 0, z1,
        x0, 0, z1
      );
      indices.push(vBase, vBase+1, vBase+2, vBase, vBase+2, vBase+3);
      vBase += 4;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    const mat = new THREE.MeshBasicMaterial({
      color: PALETTE[color[rid]],
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: true
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = 2;

    /* ---- 边界线段 ---- */
    const linePts = [];
    for (const ci of cells){
      const gx = ci % GW;
      const gy = Math.floor(ci / GW);

      const x0 = OFFSET_X + gx * SPACING - cx;
      const z0 = OFFSET_Z + gy * SPACING - cz;
      const x1 = x0 + SPACING;
      const z1 = z0 + SPACING;
      const LY = 0.012;

      if (gx + 1 >= GW || grid[gy*GW + gx + 1] !== rid)
        linePts.push(x1, LY, z0, x1, LY, z1);
      if (gx - 1 < 0  || grid[gy*GW + gx - 1] !== rid)
        linePts.push(x0, LY, z0, x0, LY, z1);
      if (gy + 1 >= GH || grid[(gy+1)*GW + gx] !== rid)
        linePts.push(x0, LY, z1, x1, LY, z1);
      if (gy - 1 < 0  || grid[(gy-1)*GW + gx] !== rid)
        linePts.push(x0, LY, z0, x1, LY, z0);
    }

    let lineMesh = null;
    if (linePts.length > 0){
      const lgeo = new THREE.BufferGeometry();
      lgeo.setAttribute('position', new THREE.Float32BufferAttribute(linePts, 3));
      const lmat = new THREE.LineBasicMaterial({
        color: 0xffdd88,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      lineMesh = new THREE.LineSegments(lgeo, lmat);
      lineMesh.renderOrder = 4;
    }

    const group = new THREE.Group();
    group.position.set(cx, 0, cz);
    group.scale.set(0.001, 0.001, 0.001);
    group.add(mesh);
    if (lineMesh) group.add(lineMesh);
    group.visible = false;
    scene.add(group);

    regionItems.push({
      group, mesh, lineMesh,
      mat, orderIdx,
      total: infos.length,
      appearAt: 0.55 + (orderIdx / infos.length) * 21.0,
      colorIdx: color[rid]
    });
  });
})();

/* ============================================================
   顶部文字
   ============================================================ */
const FULL_TEXT = '四色定理用四种颜色即可区分任何复杂平面地图——看似极其复杂的结构可由极少资源优雅覆盖，启示用有限资源高效组织复杂系统的智慧。';
const topTextEl = document.getElementById('topText');
let lastShown = '';

function smoothstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function updateTopText(animT){
  const prog  = smoothstep(0.8, 26.0, animT);
  const n     = Math.floor(prog * FULL_TEXT.length);
  const shown = FULL_TEXT.slice(0, n);
  if (shown !== lastShown){
    topTextEl.textContent = shown;
    lastShown = shown;
  }
}

/* ============================================================
   主循环
   ============================================================ */
const DURATION = 30;
const clock = new THREE.Clock();
let animT = 0;

const GROW_TIME = 0.62;      // 每个区域生长时长

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  animT += dt;
  if (animT >= DURATION) animT -= DURATION;

  /* ---- 全局淡出 ---- */
  const globalFade = 1 - smoothstep(27.5, 30.0, animT);

  /* ---- 逐区域生长 ---- */
  for (const it of regionItems){
    const local = (animT - it.appearAt) / GROW_TIME;

    let s = 0, op = 0;
    if (local > 0){
      const k = Math.min(1, local);
      s  = easeOutCubic(k);
      op = Math.min(1, k * 1.6);
    }

    if (s <= 0.0005){
      it.group.visible = false;
      continue;
    }

    it.group.visible = true;
    it.group.scale.set(s, s, s);

    const fade = op * globalFade;
    it.mat.opacity = 0.90 * fade;
    if (it.lineMesh) it.lineMesh.material.opacity = 0.85 * fade;
  }

  /* ---- 呼吸光晕：区域依次微微脉动 ---- */
  const timePulse = animT * 1.6;

  /* ---- 文字 ---- */
  updateTopText(animT);

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   启动 & 自适应
   ============================================================ */
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
