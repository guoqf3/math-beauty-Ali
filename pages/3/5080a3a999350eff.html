<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莫比乌斯纹理 · 不可定向编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>莫比乌斯纹理 · 不可定向编织</h2>
        <div class="sub">Möbius strip · Asymptotic nets · Non‑orientable foliation</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">v-曲线: s = const</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">s-曲线: v = const</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">斜向织线: v = k·s + φ</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.6, 2.8, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟
        let startTime = performance.now();
        let elapsed = 0;
        function tick() { elapsed = (performance.now() - startTime) * 0.001; return elapsed; }

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // ---- 莫比乌斯带参数方程 ----
        const R = 2.5;        // 大环半径
        const W = 0.78;       // 半带宽

        function mobiusPoint(v, s) {
            const cosV = Math.cos(v);
            const sinV = Math.sin(v);
            const cosHalf = Math.cos(v * 0.5);
            const sinHalf = Math.sin(v * 0.5);
            const rho = R + s * cosHalf;
            return new THREE.Vector3(
                rho * cosV,
                rho * sinV,
                s * sinHalf
            );
        }

        // ---- 族1：v-曲线 (s固定，v变化) 金色 ----
        function createVCurves(sValues, color, numPoints = 400) {
            const group = new THREE.Group();
            const dv = 2 * Math.PI / numPoints;
            for (const s of sValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const v = i * dv;
                    pts.push(mobiusPoint(v, s));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.78, depthWrite: true, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // ---- 族2：s-曲线 (v固定，s变化) 青色 ----
        function createSCurves(vValues, color, numPoints = 160) {
            const group = new THREE.Group();
            const ds = 2 * W / numPoints;
            for (const v of vValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const s = -W + i * ds;
                    pts.push(mobiusPoint(v, s));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.78, depthWrite: true, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // ---- 族3：斜向织线 (v = k·s + φ) 品红 ----
        function createDiagonalSlants(kValues, phiValues, color, numPoints = 180) {
            const group = new THREE.Group();
            for (const k of kValues) {
                for (const phi of phiValues) {
                    const pts = [];
                    const ds = 2 * W / numPoints;
                    for (let i = 0; i <= numPoints; i++) {
                        const s = -W + i * ds;
                        const v = k * s + phi;
                        if (v >= 0 && v <= 2 * Math.PI) {
                            pts.push(mobiusPoint(v, s));
                        }
                    }
                    if (pts.length >= 2) {
                        const geom = new THREE.BufferGeometry().setFromPoints(pts);
                        const mat = new THREE.LineBasicMaterial({
                            color, transparent: true, opacity: 0.62, depthWrite: true, depthTest: true
                        });
                        group.add(new THREE.Line(geom, mat));
                    }
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'mobius-system';
        scene.add(rootGroup);

        // 金色 v-曲线：s 取值 24 条
        const sCount = 24;
        const sValues = [];
        for (let i = 0; i < sCount; i++) {
            sValues.push(-W + i * 2 * W / (sCount - 1));
        }
        rootGroup.add(createVCurves(sValues, COLOR_GOLD));

        // 青色 s-曲线：v 取值 30 条
        const vCount = 30;
        const vValues = [];
        for (let i = 0; i < vCount; i++) {
            vValues.push(i * 2 * Math.PI / vCount);
        }
        rootGroup.add(createSCurves(vValues, COLOR_CYAN));

        // 品红斜线：k 取值 5 个斜率，φ 取值 6 个偏移
        const kValues = [-4.0, -2.0, -1.0, 2.0, 4.0];
        const phiValues = [];
        for (let i = 0; i < 6; i++) phiValues.push(i * Math.PI / 3);
        rootGroup.add(createDiagonalSlants(kValues, phiValues, COLOR_MAGENTA));

        console.log('莫比乌斯曲线总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 600;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 动画循环
        function animate() {
            tick();
            const t = elapsed;
            rootGroup.rotation.x = t * 0.18;
            rootGroup.rotation.y = t * 0.28;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 7.5;
            const camAngle = t * 0.08;
            const camHeight = 2.9 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 莫比乌斯不可定向编织动画已稳定运行');
    </script>
</body>
</html>
