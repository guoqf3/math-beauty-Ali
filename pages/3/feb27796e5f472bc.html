<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对数螺旋空间编织 · 指数螺线簇</title>
    <style>
        :root {
            --bg: #02010d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: clamp(18px, 3.8vh, 44px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #title-overlay h1 {
            color: #e1d0b5;
            font-size: clamp(1.2rem, 2.4vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 28px rgba(215, 180, 130, 0.55), 0 0 75px rgba(190, 150, 100, 0.25);
            margin: 0;
        }
        #title-overlay .subtitle {
            color: #bda78c;
            font-size: clamp(0.7rem, 1.2vw, 0.95rem);
            letter-spacing: 0.06em;
            margin-top: 0.3em;
            text-shadow: 0 0 14px rgba(180, 140, 100, 0.4);
        }

        #formula-overlay {
            position: fixed;
            bottom: clamp(26px, 4.8vh, 56px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(15, 11, 22, 0.72);
            border: 1px solid rgba(170, 145, 115, 0.28);
            border-radius: 12px;
            padding: clamp(10px, 1.4vh, 16px) clamp(16px, 3vw, 28px);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        #formula-overlay .formula-main {
            color: #f2dec5;
            font-size: clamp(0.8rem, 1.35vw, 1.15rem);
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a6947c;
            font-size: clamp(0.62rem, 0.95vw, 0.82rem);
            letter-spacing: 0.03em;
            margin-top: 0.25em;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.05em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>对数螺旋空间编织</h1>
        <div class="subtitle">Logarithmic Spiral Weave · Exponential Whorls</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                r(θ) = A·e<sup>bθ</sup><br>
                x = r·cos θ  y = r·sin θ<br>
                z = C·sin(dθ + δ)
            </div>
            <div class="formula-detail">
                θ ∈ [0, 6π] | b ∈ ℝ<sup>+</sup> | d ∈ ℕ | 16 curves
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02010d');
        scene.fog = new THREE.Fog('#02010d', 6, 20);

        const camera = new THREE.PerspectiveCamera(
            46,
            container.clientWidth / container.clientHeight,
            0.3,
            26
        );
        camera.position.set(0, 0.35, 7.0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight('#202040', 0.4));

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const totalPoints = 2000; // 每条曲线的采样点数
        const allLines = [];
        const curveCount = 16;

        const globalScale = 0.72; // 全局缩放，确保不超出画面
        const A = 1.0;            // 螺旋起始半径
        const C = 0.6;            // z轴调制振幅

        /**
         * 生成对数螺旋空间曲线
         * @param {number} b 指数增长系数
         * @param {number} d z轴调制频率
         * @param {number} delta z轴调制相位
         * @param {THREE.Euler} rotation 空间旋转欧拉角
         */
        function createLogSpiralCurve(b, d, delta, rotation) {
            const rotMatrix = new THREE.Matrix4().makeRotationFromEuler(rotation);
            const vertices = new Float32Array(totalPoints * 3);
            const thetaMax = Math.PI * 6; // 6π，约3圈

            for (let i = 0; i < totalPoints; i++) {
                const theta = (i / (totalPoints - 1)) * thetaMax;
                const r = A * Math.exp(b * theta);
                const x2d = r * Math.cos(theta);
                const y2d = r * Math.sin(theta);
                const z2d = C * Math.sin(d * theta + delta);

                const vec = new THREE.Vector3(x2d, y2d, z2d);
                vec.applyMatrix4(rotMatrix);
                vec.multiplyScalar(globalScale);

                vertices[i * 3] = vec.x;
                vertices[i * 3 + 1] = vec.y;
                vertices[i * 3 + 2] = vec.z;
            }
            return vertices;
        }

        function createLine(vertices, hue, opacity = 0.78) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0); // 初始不可见

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(hue, 0.90, 0.64),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: true,
                depthTest: true,
            });

            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // ==================== 生成16条对数螺旋线 ====================
        for (let j = 0; j < curveCount; j++) {
            // b 值在 0.04 到 0.09 之间均匀分布，产生不同的展开速度
            const b = 0.04 + (j / (curveCount - 1)) * 0.05;
            // d 值取 2 到 6 之间的整数
            const d = 2 + (j % 5);
            // 相位均匀分布
            const delta = j * 0.6;
            // 空间旋转角度：使曲线覆盖整个球面方向
            const rotY = (j / curveCount) * Math.PI * 2;
            const rotX = (j * 0.65) % Math.PI;
            const rotation = new THREE.Euler(rotX, rotY, 0);

            const vertices = createLogSpiralCurve(b, d, delta, rotation);
            const hue = (j / curveCount) * 0.85;
            const line = createLine(vertices, hue, 0.76);
            mainGroup.add(line);
            allLines.push(line);
        }

        console.log(`✅ 已生成 ${curveCount} 条对数螺旋曲线`);

        // ==================== 动画状态机 ====================
        const APPEAR_TIME = 5.0;      // 生长5秒
        const PAUSE_TIME = 1.5;       // 停顿1.5秒
        const DISAPPEAR_TIME = 5.0;   // 消散5秒
        const CYCLE_TOTAL = APPEAR_TIME + PAUSE_TIME + DISAPPEAR_TIME; // 11.5秒

        let animationStartTime = null;
        let firstFrameDone = false;

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInCubic(t) { return t * t * t; }

        function getProgress(elapsedSeconds) {
            const cycle = elapsedSeconds % CYCLE_TOTAL;
            if (cycle < APPEAR_TIME) {
                const t = cycle / APPEAR_TIME;
                return { progress: easeOutCubic(t), phase: 'appear' };
            } else if (cycle < APPEAR_TIME + PAUSE_TIME) {
                return { progress: 1.0, phase: 'pause' };
            } else {
                const t = (cycle - APPEAR_TIME - PAUSE_TIME) / DISAPPEAR_TIME;
                return { progress: 1.0 - easeInCubic(t), phase: 'disappear' };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            // 第一帧：强制渲染空白，避免闪现
            if (animationStartTime === null) {
                animationStartTime = timestamp;
                allLines.forEach(line => {
                    line.visible = false;
                    if (line.geometry) line.geometry.setDrawRange(0, 0);
                });
                renderer.render(scene, camera);
                firstFrameDone = true;
                return;
            }

            const elapsed = (timestamp - animationStartTime) / 1000;
            const { progress } = getProgress(elapsed);
            const drawCount = Math.floor(progress * totalPoints);
            const shouldBeVisible = drawCount >= 2;

            // 批量更新所有线条的绘制范围
            for (let i = 0; i < allLines.length; i++) {
                const line = allLines[i];
                if (!line || !line.geometry) continue;
                const maxPts = line.geometry.attributes.position.count;
                const lineDraw = Math.min(drawCount, maxPts);
                if (shouldBeVisible && lineDraw >= 2) {
                    line.visible = true;
                    line.geometry.setDrawRange(0, lineDraw);
                } else {
                    line.visible = false;
                    line.geometry.setDrawRange(0, 0);
                }
            }

            // 整体缓慢旋转，展现空间编织结构
            const rotY = elapsed * 0.07;
            const rotX = Math.sin(elapsed * 0.16) * 0.05;
            const rotZ = Math.cos(elapsed * 0.21) * 0.04;
            mainGroup.rotation.set(rotX, rotY, rotZ);

            // 相机轻柔晃动
            camera.position.x = Math.sin(elapsed * 0.14) * 0.22;
            camera.position.y = 0.35 + Math.cos(elapsed * 0.19) * 0.18;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 对数螺旋空间编织动画启动');
        console.log(`   - 曲线数量: ${curveCount}`);
        console.log(`   - 采样点/曲线: ${totalPoints}`);
        console.log(`   - 动画周期: ${CYCLE_TOTAL}s (生长${APPEAR_TIME}s + 停顿${PAUSE_TIME}s + 消散${DISAPPEAR_TIME}s)`);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
