<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>热力学循环 · Thermodynamic Cycle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05070e;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  canvas { display: block; }
  #scene { position: fixed; inset: 0; }

  /* ---------- 顶部启迪文字 ---------- */
  #thermo-text {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 64vw;
    max-width: 1020px;
    text-align: center;
    z-index: 30;
    pointer-events: none;
    font-size: clamp(13px, 1.12vw, 18px);
    line-height: 1.72;
    letter-spacing: 1.2px;
    color: #d6efff;
    text-shadow:
      0 0 10px rgba(255, 170, 60, 0.65),
      0 0 24px rgba(90, 200, 255, 0.5),
      0 0 46px rgba(60, 140, 255, 0.3);
  }
  #thermo-text span { transition: none; }

  /* ---------- 边缘公式 ---------- */
  .hud {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    font-family: "Consolas", "SF Mono", "Courier New", monospace;
    font-size: clamp(9px, 0.82vw, 13px);
    letter-spacing: 0.6px;
    color: rgba(150, 220, 255, 0.75);
    text-shadow:
      0 0 8px rgba(60, 170, 255, 0.75),
      0 0 20px rgba(120, 60, 255, 0.35);
    white-space: nowrap;
  }
  .hud .k { color: rgba(255, 200, 110, 0.92); }
  .hud .v { color: rgba(255, 130, 210, 0.92); }
  .hud .g { color: rgba(90, 255, 180, 0.92); }
  .f-tl { top: 16px; left: 20px; }
  .f-tr { top: 16px; right: 20px; text-align: right; }
  .f-bl { bottom: 22px; left: 20px; }
  .f-br { bottom: 22px; right: 20px; text-align: right; }

  /* ---------- P-V 相图 ---------- */
  #pv-box {
    position: fixed;
    right: 20px;
    bottom: 56px;
    z-index: 30;
    pointer-events: none;
    border-radius: 12px;
    border: 1px solid rgba(60, 255, 170, 0.22);
    box-shadow: 0 0 30px rgba(30, 200, 130, 0.14), inset 0 0 40px rgba(0,0,0,0.5);
    overflow: hidden;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  /* ---------- 仪表盘 ---------- */
  #gauge-box {
    position: fixed;
    left: 20px;
    bottom: 56px;
    z-index: 30;
    pointer-events: none;
    border-radius: 12px;
    border: 1px solid rgba(90, 170, 255, 0.22);
    box-shadow: 0 0 30px rgba(60, 140, 255, 0.14), inset 0 0 40px rgba(0,0,0,0.5);
    overflow: hidden;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  /* ---------- 控制条 ---------- */
  #controls {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 16px;
    border-radius: 30px;
    background: rgba(10, 20, 46, 0.6);
    border: 1px solid rgba(90, 170, 255, 0.26);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 30px rgba(60, 140, 255, 0.18);
    font-family: "Consolas", "Courier New", monospace;
    font-size: 11px;
    color: rgba(170, 220, 255, 0.85);
    letter-spacing: 0.5px;
  }
  #controls button {
    background: linear-gradient(180deg, rgba(40, 110, 220, 0.55), rgba(20, 50, 130, 0.65));
    border: 1px solid rgba(110, 200, 255, 0.45);
    color: #cfeaff;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 15px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 8px rgba(100, 200, 255, 0.8);
  }
  #controls button:hover {
    background: linear-gradient(180deg, rgba(60, 150, 255, 0.75), rgba(30, 70, 170, 0.85));
    box-shadow: 0 0 18px rgba(90, 190, 255, 0.6);
  }
  #controls .phase-lbl {
    min-width: 140px;
    text-align: center;
    color: #ffd24a;
    text-shadow: 0 0 10px rgba(255, 200, 80, 0.9);
    font-size: 11px;
    letter-spacing: 1px;
  }

  /* ---------- 暗角 ---------- */
  #vignette {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background: radial-gradient(
      ellipse at 50% 50%,
      rgba(0, 0, 0, 0) 38%,
      rgba(0, 0, 0, 0.42) 76%,
      rgba(0, 0, 0, 0.82) 100%
    );
  }

  /* ---------- 进度条 ---------- */
  #progress {
    position: fixed; bottom: 0; left: 0; height: 2px; width: 0%;
    z-index: 45;
    background: linear-gradient(90deg, #ff9b22, #22e6ff, #39ff9e, #ffd24a);
    box-shadow: 0 0 14px rgba(255, 190, 90, 0.9);
    pointer-events: none;
  }

  @media (max-width: 950px) {
    .f-tr, .f-br { display: none; }
    #thermo-text { width: 88vw; }
    #pv-box, #gauge-box { transform: scale(0.72); transform-origin: bottom right; }
    #gauge-box { transform-origin: bottom left; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="progress"></div>

<div id="thermo-text"></div>

<div class="hud f-tl">
  卡诺效率&nbsp;η = 1 − T<sub>c</sub>/T<sub>h</sub> = (T<sub>h</sub>−T<sub>c</sub>)/T<sub>h</sub><br>
  理想气体&nbsp;P·V = n·R·T
</div>
<div class="hud f-tr">
  第一定律&nbsp;ΔU = Q − W<br>
  熵增原理&nbsp;ΔS ≥ 0
</div>
<div class="hud f-bl">
  <span class="k">T<sub>h</sub></span>=600K &nbsp;
  <span class="k">T<sub>c</sub></span>=360K &nbsp;
  <span class="k">γ</span>=c<sub>p</sub>/c<sub>v</sub>=1.4
</div>
<div class="hud f-br">
  η<sub>carnot</sub> ≈ 40% &nbsp;·&nbsp; η<sub>real</sub> &lt; 35%
</div>

<div id="gauge-box"><canvas id="gauge-canvas"></canvas></div>
<div id="pv-box"><canvas id="pv-canvas"></canvas></div>

<div id="controls">
  <button id="btn-play">暂停</button>
  <button id="btn-reset">重播</button>
  <div class="phase-lbl" id="phase-lbl">等温膨胀 · 吸热</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   热力学循环 · Thermodynamic Cycle
   卡诺循环 3D 可视化
   ========================================================= */

/* ---------------- 常量 ---------------- */
const LOOP_TIME   = 30;      // 总循环时长（秒）
const TEXT_FULL   = 26;      // 文字显示完整时间
const CYCLE_TIME  = 7.5;     // 单个热力循环周期（30 秒内正好 4 次）

const TH   = 600;            // 高温热源温度 K
const TC   = 360;            // 低温热源温度 K
const GAMMA = 1.4;           // 绝热指数
const NR   = 1;              // nR 归一化

/* 卡诺循环四个状态点 */
const V1 = 0.40;
const V2 = 1.00;
const V3 = V2 * Math.pow(TH / TC, 1 / (GAMMA - 1));   // 3.5937
const V4 = V3 * V1 / V2;                              // 1.4375
const P1 = TH / V1;   // 1500
const P2 = TH / V2;   // 600
const P3 = TC / V3;   // 100.2
const P4 = TC / V4;   // 250.4

/* 气缸几何 */
const CYL_BOTTOM = -85;
const CYL_TOP    = 95;
const CYL_R      = 42;
const V_SCALE    = 40;
const V_OFFSET   = 8;

/* ---------------- 循环状态计算 ---------------- */
function easeInOut(s) {
  return s * s * (3 - 2 * s);
}

function getState(phase) {
  let p = phase % 1;
  if (p < 0) p += 1;

  let V, P, T;

  if (p < 0.25) {
    /* 1→2 等温膨胀（吸热） */
    const s = easeInOut(p / 0.25);
    V = V1 + (V2 - V1) * s;
    T = TH;
    P = T / V;
  } else if (p < 0.50) {
    /* 2→3 绝热膨胀（做功） */
    const s = easeInOut((p - 0.25) / 0.25);
    V = V2 + (V3 - V2) * s;
    P = P2 * Math.pow(V2 / V, GAMMA);
    T = P * V;
  } else if (p < 0.75) {
    /* 3→4 等温压缩（放热） */
    const s = easeInOut((p - 0.50) / 0.25);
    V = V3 + (V4 - V3) * s;
    T = TC;
    P = T / V;
  } else {
    /* 4→1 绝热压缩 */
    const s = easeInOut((p - 0.75) / 0.25);
    V = V4 + (V1 - V4) * s;
    P = P4 * Math.pow(V4 / V, GAMMA);
    T = P * V;
  }
  return { V, P, T };
}

function getPhaseName(p) {
  if (p < 0.25) return '等温膨胀 · 吸热';
  if (p < 0.50) return '绝热膨胀 · 做功';
  if (p < 0.75) return '等温压缩 · 放热';
  return '绝热压缩 · 升温';
}

/* ---------------- 温度颜色映射 ---------------- */
function tempColor(T) {
  let t = (T - 350) / 260;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  return [
    0.15 + 0.85 * t,
    0.60 - 0.25 * t,
    1.00 - 0.92 * t
  ];
}

/* ---------------- 渲染器 / 场景 ---------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x05070e, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070e, 0.00125);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
const camTarget = new THREE.Vector3(0, -8, 0);

/* ---------------- 圆形光点贴图 ---------------- */
function makeGlowTexture() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.22, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.48, 'rgba(255,255,255,0.32)');
  g.addColorStop(0.75, 'rgba(255,255,255,0.07)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const GLOW_TEX = makeGlowTexture();

/* ---------------- 星空与地面 ---------------- */
(function buildEnvironment() {
  /* 星空 */
  const COUNT = 1100;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const u = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const r = 900 + Math.random() * 1500;
    const s = Math.sqrt(1 - u * u);
    pos[i * 3]     = r * s * Math.cos(th);
    pos[i * 3 + 1] = r * u;
    pos[i * 3 + 2] = r * s * Math.sin(th);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x7fa8ff, size: 2.2, map: GLOW_TEX,
    transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  scene.add(new THREE.Points(geo, mat));

  /* 地面网格 */
  const grid = new THREE.GridHelper(900, 60, 0x1a3a6a, 0x102030);
  grid.position.y = -180;
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  scene.add(grid);

  /* 地面反射面 */
  const planeGeo = new THREE.PlaneGeometry(900, 900);
  const planeMat = new THREE.MeshBasicMaterial({
    color: 0x04060e, transparent: true, opacity: 0.85,
    side: THREE.DoubleSide, depthWrite: false
  });
  const plane = new THREE.Mesh(planeGeo, planeMat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -180.5;
  scene.add(plane);
})();

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.AmbientLight(0x334466, 1.4));

const keyLight = new THREE.DirectionalLight(0xbcd8ff, 1.15);
keyLight.position.set(120, 200, 140);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xff5522, 0.5);
rimLight.position.set(-160, 60, -120);
scene.add(rimLight);

const rimLight2 = new THREE.DirectionalLight(0x2288ff, 0.4);
rimLight2.position.set(150, -80, -100);
scene.add(rimLight2);

/* ---------------- 气缸结构 ---------------- */
const cylinderGroup = new THREE.Group();
scene.add(cylinderGroup);

/* 气缸壁（半透明） */
const cylWallGeo = new THREE.CylinderGeometry(CYL_R, CYL_R, CYL_TOP - CYL_BOTTOM, 64, 1, true);
const cylWallMat = new THREE.MeshPhongMaterial({
  color: 0x4488cc,
  emissive: 0x0a1a33,
  transparent: true,
  opacity: 0.10,
  side: THREE.DoubleSide,
  shininess: 120,
  specular: 0x88bbff,
  depthWrite: false
});
const cylWall = new THREE.Mesh(cylWallGeo, cylWallMat);
cylWall.position.y = (CYL_TOP + CYL_BOTTOM) / 2;
cylinderGroup.add(cylWall);

/* 气缸壁线框 */
const cylWireGeo = new THREE.CylinderGeometry(CYL_R, CYL_R, CYL_TOP - CYL_BOTTOM, 48, 8, true);
const cylWireMat = new THREE.MeshBasicMaterial({
  color: 0x3388ff, wireframe: true,
  transparent: true, opacity: 0.055,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const cylWire = new THREE.Mesh(cylWireGeo, cylWireMat);
cylWire.position.y = (CYL_TOP + CYL_BOTTOM) / 2;
cylinderGroup.add(cylWire);

/* 气缸顶部与底部封盖 */
const capGeo = new THREE.CylinderGeometry(CYL_R + 2, CYL_R + 2, 4, 64);
const capMat = new THREE.MeshPhongMaterial({
  color: 0x556677,
  emissive: 0x112233,
  shininess: 90,
  transparent: true,
  opacity: 0.55
});

const topCap = new THREE.Mesh(capGeo, capMat);
topCap.position.y = CYL_TOP + 2;
cylinderGroup.add(topCap);

const botCap = new THREE.Mesh(capGeo, capMat);
botCap.position.y = CYL_BOTTOM - 2;
cylinderGroup.add(botCap);

/* 气缸外的强化环 */
for (let i = 0; i < 5; i++) {
  const ringGeo = new THREE.TorusGeometry(CYL_R + 1.5, 1.6, 8, 64);
  const ringMat = new THREE.MeshPhongMaterial({
    color: 0x667788,
    emissive: 0x0a1520,
    shininess: 100,
    transparent: true,
    opacity: 0.42
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = CYL_BOTTOM + 18 + i * 40;
  cylinderGroup.add(ring);
}

/* ---------------- 活塞 ---------------- */
const pistonGroup = new THREE.Group();
scene.add(pistonGroup);

const pistonDiskGeo = new THREE.CylinderGeometry(CYL_R - 1.5, CYL_R - 1.5, 12, 64);
const pistonDiskMat = new THREE.MeshPhongMaterial({
  color: 0x8899aa,
  emissive: 0x1a2535,
  shininess: 140,
  specular: 0xaaccff,
  transparent: true,
  opacity: 0.92
});
const pistonDisk = new THREE.Mesh(pistonDiskGeo, pistonDiskMat);
pistonGroup.add(pistonDisk);

/* 活塞顶面高光环 */
const pistonTopRingGeo = new THREE.TorusGeometry(CYL_R - 2.5, 1.2, 8, 64);
const pistonTopRingMat = new THREE.MeshBasicMaterial({
  color: 0x66ccff,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const pistonTopRing = new THREE.Mesh(pistonTopRingGeo, pistonTopRingMat);
pistonTopRing.rotation.x = Math.PI / 2;
pistonTopRing.position.y = 6.2;
pistonGroup.add(pistonTopRing);

/* 活塞杆 */
const rodGeo = new THREE.CylinderGeometry(7, 7, 95, 24);
const rodMat = new THREE.MeshPhongMaterial({
  color: 0x99aabb,
  emissive: 0x152230,
  shininess: 160,
  specular: 0xccddff,
  transparent: true,
  opacity: 0.85
});
const rod = new THREE.Mesh(rodGeo, rodMat);
rod.position.y = -6 - 47.5;
pistonGroup.add(rod);

/* 活塞杆底部配重块 */
const rodEndGeo = new THREE.BoxGeometry(30, 8, 30);
const rodEndMat = new THREE.MeshPhongMaterial({
  color: 0x778899,
  emissive: 0x101825,
  shininess: 120,
  transparent: true,
  opacity: 0.8
});
const rodEnd = new THREE.Mesh(rodEndGeo, rodEndMat);
rodEnd.position.y = -6 - 95 - 4;
pistonGroup.add(rodEnd);

/* ---------------- 热源（底部） ---------------- */
const heatSrcGroup = new THREE.Group();
scene.add(heatSrcGroup);

const heatPlateGeo = new THREE.CylinderGeometry(CYL_R + 16, CYL_R + 22, 8, 64);
const heatPlateMat = new THREE.MeshPhongMaterial({
  color: 0xff6611,
  emissive: 0xff3300,
  emissiveIntensity: 0.9,
  transparent: true,
  opacity: 0.75
});
const heatPlate = new THREE.Mesh(heatPlateGeo, heatPlateMat);
heatPlate.position.y = CYL_BOTTOM - 10;
heatSrcGroup.add(heatPlate);

const heatGlowGeo = new THREE.CylinderGeometry(CYL_R + 34, CYL_R + 34, 2, 64);
const heatGlowMat = new THREE.MeshBasicMaterial({
  color: 0xff7722,
  transparent: true,
  opacity: 0.16,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const heatGlow = new THREE.Mesh(heatGlowGeo, heatGlowMat);
heatGlow.position.y = CYL_BOTTOM - 15;
heatSrcGroup.add(heatGlow);

const heatLight = new THREE.PointLight(0xff6622, 1.6, 300);
heatLight.position.set(0, CYL_BOTTOM - 20, 0);
scene.add(heatLight);

/* ---------------- 冷源（顶部） ---------------- */
const coolSrcGroup = new THREE.Group();
scene.add(coolSrcGroup);

const coolPlateGeo = new THREE.CylinderGeometry(CYL_R + 14, CYL_R + 18, 6, 64);
const coolPlateMat = new THREE.MeshPhongMaterial({
  color: 0x2299ff,
  emissive: 0x0044aa,
  emissiveIntensity: 0.75,
  transparent: true,
  opacity: 0.55
});
const coolPlate = new THREE.Mesh(coolPlateGeo, coolPlateMat);
coolPlate.position.y = CYL_TOP + 8;
coolSrcGroup.add(coolPlate);

/* 散热鳍片 */
for (let i = 0; i < 8; i++) {
  const ang = (i / 8) * Math.PI * 2;
  const finGeo = new THREE.BoxGeometry(6, 30, 22);
  const finMat = new THREE.MeshPhongMaterial({
    color: 0x3388cc,
    emissive: 0x002244,
    transparent: true,
    opacity: 0.4,
    shininess: 100
  });
  const fin = new THREE.Mesh(finGeo, finMat);
  fin.position.set(
    Math.cos(ang) * (CYL_R + 16),
    CYL_TOP + 24,
    Math.sin(ang) * (CYL_R + 16)
  );
  fin.rotation.y = -ang;
  coolSrcGroup.add(fin);
}

const coolLight = new THREE.PointLight(0x2288ff, 1.0, 260);
coolLight.position.set(0, CYL_TOP + 30, 0);
scene.add(coolLight);

/* ---------------- 气体发光体 ---------------- */
const gasGlowGeo = new THREE.CylinderGeometry(CYL_R - 3, CYL_R - 3, 1, 48, 1, true);
const gasGlowMat = new THREE.MeshBasicMaterial({
  color: 0xff4400,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  depthWrite: false
});
const gasGlow = new THREE.Mesh(gasGlowGeo, gasGlowMat);
scene.add(gasGlow);

/* ---------------- 气体分子粒子 ---------------- */
const NP = 260;
const pPos = new Float32Array(NP * 3);
const pVel = new Float32Array(NP * 3);
const pCol = new Float32Array(NP * 3);

(function initMolecules() {
  for (let i = 0; i < NP; i++) {
    const ang = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * (CYL_R - 5);
    const y = CYL_BOTTOM + 4 + Math.random() * 20;
    pPos[i * 3]     = Math.cos(ang) * r;
    pPos[i * 3 + 1] = y;
    pPos[i * 3 + 2] = Math.sin(ang) * r;

    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pVel[i * 3]     = Math.sin(ph) * Math.cos(th);
    pVel[i * 3 + 1] = Math.cos(ph);
    pVel[i * 3 + 2] = Math.sin(ph) * Math.sin(th);
  }
})();

const molGeo = new THREE.BufferGeometry();
molGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
molGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));

const molMat = new THREE.PointsMaterial({
  size: 5.5,
  map: GLOW_TEX,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});
const molecules = new THREE.Points(molGeo, molMat);
molecules.frustumCulled = false;
scene.add(molecules);

/* ---------------- 能量箭头粒子 ---------------- */
const AP = 220;
const aPos   = new Float32Array(AP * 3);
const aCol   = new Float32Array(AP * 3);
const aVel   = new Float32Array(AP * 3);
const aLife  = new Float32Array(AP);
const aType  = new Int8Array(AP);
let   aCursor = 0;

for (let i = 0; i < AP; i++) aLife[i] = 0;

const aGeo = new THREE.BufferGeometry();
aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
aGeo.setAttribute('color',    new THREE.BufferAttribute(aCol, 3));

const aMat = new THREE.PointsMaterial({
  size: 6.5,
  map: GLOW_TEX,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});
const arrows = new THREE.Points(aGeo, aMat);
arrows.frustumCulled = false;
scene.add(arrows);

function spawnArrow(type, x, y, z, vx, vy, vz) {
  const i = aCursor;
  aCursor = (aCursor + 1) % AP;

  aPos[i * 3]     = x;
  aPos[i * 3 + 1] = y;
  aPos[i * 3 + 2] = z;
  aVel[i * 3]     = vx;
  aVel[i * 3 + 1] = vy;
  aVel[i * 3 + 2] = vz;
  aLife[i] = 1;
  aType[i] = type;

  if (type === 0) {
    /* 热量流入 —— 金色 */
    aCol[i * 3] = 1.0; aCol[i * 3 + 1] = 0.72; aCol[i * 3 + 2] = 0.18;
  } else if (type === 1) {
    /* 热量流出 —— 冷蓝 */
    aCol[i * 3] = 0.25; aCol[i * 3 + 1] = 0.72; aCol[i * 3 + 2] = 1.0;
  } else {
    /* 机械功输出 —— 青色 */
    aCol[i * 3] = 0.18; aCol[i * 3 + 1] = 1.0; aCol[i * 3 + 2] = 0.85;
  }
}

/* ---------------- 相机控制 ---------------- */
const orbit = {
  theta: 0.9,
  phi: 1.28,
  dist: 430,
  targetDist: 430
};

let dragging = false;
let lastX = 0, lastY = 0;
let downX = 0, downY = 0;
let autoRotate = true;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  autoRotate = false;
  lastX = downX = e.clientX;
  lastY = downY = e.clientY;
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
});

window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  orbit.theta -= dx * 0.006;
  orbit.phi   -= dy * 0.006;
  orbit.phi = Math.max(0.2, Math.min(Math.PI * 0.88, orbit.phi));
});

window.addEventListener('pointerup', () => {
  dragging = false;
  setTimeout(() => { autoRotate = true; }, 2500);
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 0.89;
  orbit.targetDist = Math.max(60, Math.min(900, orbit.targetDist * k));
}, { passive: false });

/* 双指缩放 */
let pinchDist = 0;
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      orbit.targetDist = Math.max(60, Math.min(900, orbit.targetDist * (pinchDist / d)));
    }
    pinchDist = d;
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { pinchDist = 0; });

(function buildText() {
  for (let i = 0; i < CHARS.length; i++) {
    const s = document.createElement('span');
    s.textContent = CHARS[i];
    s.style.opacity = '0';
    s._o = -1;

  }
})();

function updateText(t) {
  const total = CHARS.length;
  const reveal = Math.min(total, (t / TEXT_FULL) * total);
  for (let i = 0; i < total; i++) {
    let o = reveal - i;
    if (o < 0) o = 0; else if (o > 1) o = 1;
    o = Math.round(o * 10) / 10;
    if (SPANS[i]._o !== o) {
      SPANS[i].style.opacity = o;
      SPANS[i]._o = o;
    }
  }
}

/* ---------------- P-V 相图 ---------------- */
const pvCanvas = document.getElementById('pv-canvas');
const pvCtx = pvCanvas.getContext('2d');
const PV_W = 320, PV_H = 236;

function setupCanvas(cv, ctx, w, h) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = w * dpr;
  cv.height = h * dpr;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
setupCanvas(pvCanvas, pvCtx, PV_W, PV_H);

function drawPV(phase) {
  const ctx = pvCtx;
  const W = PV_W, H = PV_H;
  ctx.clearRect(0, 0, W, H);

  const padL = 44, padR = 16, padT = 30, padB = 34;
  const pw = W - padL - padR;
  const ph = H - padT - padB;

  const Vmin = 0.2, Vmax = 4.0;
  const Pmin = 0, Pmax = 1650;

  const xOf = v => padL + (v - Vmin) / (Vmax - Vmin) * pw;
  const yOf = p => padT + (1 - (p - Pmin) / (Pmax - Pmin)) * ph;

  /* 背景 */
  ctx.fillStyle = 'rgba(4, 14, 16, 0.78)';
  ctx.fillRect(0, 0, W, H);

  /* 网格 */
  ctx.strokeStyle = 'rgba(40, 200, 140, 0.10)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + ph * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + pw, y); ctx.stroke();
  }
  for (let i = 0; i <= 5; i++) {
    const x = padL + pw * i / 5;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); ctx.stroke();
  }

  /* 坐标轴 */
  ctx.strokeStyle = 'rgba(70, 230, 170, 0.45)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph); ctx.lineTo(padL + pw, padT + ph);
  ctx.stroke();

  /* 刻度标签 */
  ctx.font = '9px Consolas, monospace';
  ctx.fillStyle = 'rgba(90, 230, 170, 0.6)';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = padT + ph * i / 4;
    const val = Math.round(Pmax * (1 - i / 4));
    ctx.fillText(String(val), padL - 6, y + 3);
  }
  ctx.textAlign = 'center';
  for (let i = 0; i <= 5; i++) {
    const x = padL + pw * i / 5;
    const val = (Vmin + (Vmax - Vmin) * i / 5).toFixed(1);
    ctx.fillText(val, x, padT + ph + 14);
  }

  /* 轴标题 */
  ctx.font = '10px Consolas, monospace';
  ctx.fillStyle = 'rgba(110, 255, 200, 0.85)';
  ctx.textAlign = 'center';
  ctx.fillText('V  ( 体  积 )', padL + pw / 2, H - 6);

  ctx.save();
  ctx.translate(13, padT + ph / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('P  ( 压  力 )', 0, 0);
  ctx.restore();

  /* 标题 */
  ctx.font = '11px Consolas, monospace';
  ctx.fillStyle = 'rgba(60, 255, 180, 0.9)';
  ctx.textAlign = 'left';
  ctx.fillText('P-V 相图 · CARNOT CYCLE', 12, 18);

  /* 完整闭环路径（暗） */
  ctx.beginPath();
  for (let i = 0; i <= 220; i++) {
    const st = getState(i / 220);
    const x = xOf(st.V), y = yOf(st.P);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(30, 150, 100, 0.42)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 已走过的路径（亮绿发光） */
  const steps = Math.max(2, Math.floor((phase % 1) * 220));
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const st = getState(i / 220);
    const x = xOf(st.V), y = yOf(st.P);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#39ff9e';
  ctx.lineWidth = 2.6;
  ctx.shadowColor = '#39ff9e';
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 四个状态点标记 */
  const states = [[V1, P1], [V2, P2], [V3, P3], [V4, P4]];
  for (let i = 0; i < 4; i++) {
    const x = xOf(states[i][0]);
    const y = yOf(states[i][1]);
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(120, 255, 200, 0.85)';
    ctx.fill();

    ctx.font = '9px Consolas, monospace';
    ctx.fillStyle = 'rgba(140, 255, 210, 0.8)';
    ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), x, y - 7);
  }

  /* 当前点 */
  const cur = getState(phase);
  const cx = xOf(cur.V), cy = yOf(cur.P);
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#39ff9e';
  ctx.shadowBlur = 20;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#c8ffe8';
  ctx.fill();

  /* 效率标注 */
  const eta = 1 - TC / TH;
  ctx.font = '10px Consolas, monospace';
  ctx.fillStyle = 'rgba(255, 210, 80, 0.92)';
  ctx.textAlign = 'right';
  ctx.fillText('η = ' + (eta * 100).toFixed(0) + '%', W - 14, 18);
}

/* ---------------- 温度 / 压力仪表 ---------------- */
const gaugeCanvas = document.getElementById('gauge-canvas');
const gaugeCtx = gaugeCanvas.getContext('2d');
const GA_W = 268, GA_H = 152;
setupCanvas(gaugeCanvas, gaugeCtx, GA_W, GA_H);

function drawGauge(T, P) {
  const ctx = gaugeCtx;
  const W = GA_W, H = GA_H;
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(6, 12, 26, 0.78)';
  ctx.fillRect(0, 0, W, H);

  /* 标题 */
  ctx.font = '10px Consolas, monospace';
  ctx.fillStyle = 'rgba(150, 210, 255, 0.8)';
  ctx.textAlign = 'left';
  ctx.fillText('THERMO METERS', 12, 16);

  /* ---------- 温度计（绿色） ---------- */
  const thX = 44;
  const thTop = 30;
  const thBot = 130;
  const thW = 16;
  const Tmin = 320, Tmax = 640;

  /* 温度计外管 */
  ctx.beginPath();
  const r = thW / 2;
  ctx.moveTo(thX - r, thTop);
  ctx.lineTo(thX - r, thBot - r);
  ctx.arc(thX, thBot - r, r, Math.PI, 0, true);
  ctx.lineTo(thX + r, thTop);
  ctx.closePath();
  ctx.fillStyle = 'rgba(20, 50, 60, 0.7)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(80, 220, 160, 0.5)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 温度填充 */
  let tRatio = (T - Tmin) / (Tmax - Tmin);
  tRatio = Math.max(0, Math.min(1, tRatio));
  const fillH = (thBot - thTop - thW) * tRatio;
  const fillTop = thBot - r - fillH;

  const grad = ctx.createLinearGradient(0, thBot, 0, thTop);
  grad.addColorStop(0, '#22ddff');
  grad.addColorStop(0.5, '#39ff9e');
  grad.addColorStop(1, '#ffd24a');

  ctx.beginPath();
  ctx.moveTo(thX - r + 2, fillTop);
  ctx.lineTo(thX - r + 2, thBot - r);
  ctx.arc(thX, thBot - r, r - 2, Math.PI, 0, true);
  ctx.lineTo(thX + r - 2, fillTop);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.shadowColor = '#39ff9e';
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;

  /* 刻度 */
  ctx.strokeStyle = 'rgba(120, 230, 190, 0.4)';
  ctx.lineWidth = 1;
  ctx.font = '8px Consolas, monospace';
  ctx.fillStyle = 'rgba(120, 230, 190, 0.65)';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = thBot - r - (thBot - thTop - thW) * (i / 4);
    ctx.beginPath();
    ctx.moveTo(thX + r + 2, y);
    ctx.lineTo(thX + r + 7, y);
    ctx.stroke();
    ctx.fillText(String(Math.round(Tmin + (Tmax - Tmin) * i / 4)), thX + r + 26, y + 3);
  }

  ctx.font = '9px Consolas, monospace';
  ctx.fillStyle = 'rgba(60, 255, 160, 0.95)';
  ctx.textAlign = 'center';
  ctx.fillText(T.toFixed(0) + ' K', thX + 8, thBot + 16);

  /* ---------- 压力表（黄色） ---------- */
  const gx = 178;
  const gy = 82;
  const gr = 48;

  /* 表盘 */
  ctx.beginPath();
  ctx.arc(gx, gy, gr, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(18, 30, 40, 0.8)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 200, 70, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* 内圈刻度 */
  const startAng = Math.PI * 0.75;
  const endAng   = Math.PI * 2.25;

  for (let i = 0; i <= 10; i++) {
    const a = startAng + (endAng - startAng) * i / 10;
    const isMajor = i % 2 === 0;
    const r1 = gr - (isMajor ? 10 : 6);
    const r2 = gr - 2;
    ctx.beginPath();
    ctx.moveTo(gx + Math.cos(a) * r1, gy + Math.sin(a) * r1);
    ctx.lineTo(gx + Math.cos(a) * r2, gy + Math.sin(a) * r2);
    ctx.strokeStyle = isMajor ? 'rgba(255, 210, 90, 0.8)' : 'rgba(255, 200, 70, 0.35)';
    ctx.lineWidth = isMajor ? 1.6 : 1;
    ctx.stroke();
  }

  /* 彩色压力弧 */
  let pRatio = P / 1650;
  pRatio = Math.max(0, Math.min(1, pRatio));
  ctx.beginPath();
  ctx.arc(gx, gy, gr - 5, startAng, startAng + (endAng - startAng) * pRatio);
  ctx.strokeStyle = '#ffcc44';
  ctx.lineWidth = 3.5;
  ctx.shadowColor = '#ffcc44';
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 指针 */
  const needleAng = startAng + (endAng - startAng) * pRatio;
  ctx.beginPath();
  ctx.moveTo(gx - Math.cos(needleAng) * 8, gy - Math.sin(needleAng) * 8);
  ctx.lineTo(gx + Math.cos(needleAng) * (gr - 12), gy + Math.sin(needleAng) * (gr - 12));
  ctx.strokeStyle = '#fff0a0';
  ctx.lineWidth = 2.2;
  ctx.shadowColor = '#ffdd66';
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 中心轴 */
  ctx.beginPath();
  ctx.arc(gx, gy, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe27a';
  ctx.fill();

  /* 数值 */
  ctx.font = '10px Consolas, monospace';
  ctx.fillStyle = 'rgba(255, 215, 90, 0.95)';
  ctx.textAlign = 'center';
  ctx.fillText(P.toFixed(0) + ' kPa', gx, gy + gr + 16);
}

const btnPlay = document.getElementById('btn-play');
const btnReset = document.getElementById('btn-reset');
const phaseLbl = document.getElementById('phase-lbl');
let running = true;

btnPlay.addEventListener('click', () => {
  running = !running;
  btnPlay.textContent = running ? '暂停' : '继续';
});

btnReset.addEventListener('click', () => {
  sceneTime = 0;
  resetText();
  if (!running) { running = true; btnPlay.textContent = '暂停'; }
});

function resetText() {
  for (let i = 0; i < SPANS.length; i++) {
    SPANS[i].style.opacity = '0';
    SPANS[i]._o = -1;
  }
}

/* ---------------- 主循环 ---------------- */
let lastTime = performance.now();
let sceneTime = 0;
const progressEl = document.getElementById('progress');

/* 缓存的上一帧状态，用于平滑 */
let currentPistonY = CYL_BOTTOM + V1 * V_SCALE + V_OFFSET;

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  if (running) {
    sceneTime += dt;
    if (sceneTime >= LOOP_TIME) {
      sceneTime -= LOOP_TIME;
      resetText();
    }
  }

  const phase = (sceneTime % CYCLE_TIME) / CYCLE_TIME;
  const st = getState(phase);
  const T = st.T;
  const P = st.P;
  const V = st.V;

  /* ---------- 活塞位置 ---------- */
  const pistonBottom = CYL_BOTTOM + V * V_SCALE + V_OFFSET;
  currentPistonY += (pistonBottom - currentPistonY) * Math.min(1, dt * 24);

  pistonGroup.position.y = currentPistonY + 6;

  /* ---------- 气体发光体 ---------- */
  const gasH = Math.max(2, currentPistonY - CYL_BOTTOM);
  gasGlow.scale.set(1, gasH, 1);
  gasGlow.position.y = CYL_BOTTOM + gasH / 2;

  const tc = tempColor(T);
  gasGlowMat.color.setRGB(tc[0] * 0.9, tc[1] * 0.5, tc[2] * 0.3);
  gasGlowMat.opacity = 0.06 + 0.09 * ((T - 340) / 280);

  /* ---------- 气体分子 ---------- */
  const speed = 26 * Math.pow(T / 360, 1.5);
  const yBottom = CYL_BOTTOM + 3;
  const yTop = currentPistonY - 3;
  const maxR = CYL_R - 5;

  for (let i = 0; i < NP; i++) {
    const i3 = i * 3;

    /* 布朗运动扰动 */
    pVel[i3]     += (Math.random() - 0.5) * 0.6;
    pVel[i3 + 1] += (Math.random() - 0.5) * 0.6;
    pVel[i3 + 2] += (Math.random() - 0.5) * 0.6;

    /* 归一化速度方向 */
    let vx = pVel[i3], vy = pVel[i3 + 1], vz = pVel[i3 + 2];
    const vlen = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
    vx /= vlen; vy /= vlen; vz /= vlen;
    pVel[i3] = vx; pVel[i3 + 1] = vy; pVel[i3 + 2] = vz;

    /* 位置更新 */
    let px = pPos[i3]     + vx * speed * dt;
    let py = pPos[i3 + 1] + vy * speed * dt;
    let pz = pPos[i3 + 2] + vz * speed * dt;

    /* 径向碰撞 */
    const rr = Math.sqrt(px * px + pz * pz);
    if (rr > maxR) {
      const nx = px / rr, nz = pz / rr;
      const dot = vx * nx + vz * nz;
      pVel[i3]     = vx - 2 * dot * nx;
      pVel[i3 + 2] = vz - 2 * dot * nz;
      px = nx * maxR * 0.98;
      pz = nz * maxR * 0.98;
    }

    /* 上下碰撞 */
    if (py < yBottom) {
      py = yBottom;
      pVel[i3 + 1] = Math.abs(pVel[i3 + 1]);
    } else if (py > yTop) {
      py = yTop;
      pVel[i3 + 1] = -Math.abs(pVel[i3 + 1]);
    }

    pPos[i3] = px;
    pPos[i3 + 1] = py;
    pPos[i3 + 2] = pz;

    /* 颜色随温度 */
    const col = tempColor(T);
    const flick = 0.85 + 0.15 * Math.sin(sceneTime * 8 + i * 1.7);
    pCol[i3]     = col[0] * flick;
    pCol[i3 + 1] = col[1] * flick;
    pCol[i3 + 2] = col[2] * flick;
  }

  molGeo.attributes.position.needsUpdate = true;
  molGeo.attributes.color.needsUpdate = true;

  /* ---------- 能量箭头粒子 ---------- */
  /* 生成 */
  if (running) {
    /* 吸热阶段：0 → 0.25 */
    if (phase < 0.25 && Math.random() < 0.85) {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.random() * (CYL_R - 8);
      spawnArrow(0,
        Math.cos(ang) * rad, CYL_BOTTOM - 16, Math.sin(ang) * rad,
        0, 26 + Math.random() * 16, 0
      );
    }
    /* 放热阶段：0.5 → 0.75 */
    if (phase > 0.5 && phase < 0.75 && Math.random() < 0.75) {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.random() * (CYL_R - 6);
      spawnArrow(1,
        Math.cos(ang) * rad, CYL_TOP - 4, Math.sin(ang) * rad,
        Math.cos(ang) * 22, 20 + Math.random() * 12, Math.sin(ang) * 22
      );
    }
    /* 做功阶段：0 → 0.5（膨胀） */
    if (phase < 0.5 && Math.random() < 0.55) {
      const ang = Math.random() * Math.PI * 2;
      const rad = CYL_R + 6 + Math.random() * 8;
      spawnArrow(2,
        Math.cos(ang) * rad, currentPistonY - 10, Math.sin(ang) * rad,
        Math.cos(ang) * 42, -8 - Math.random() * 12, Math.sin(ang) * 42
      );
    }
  }

  /* 更新 */
  const ap = aGeo.attributes.position.array;
  const ac = aGeo.attributes.color.array;

  for (let i = 0; i < AP; i++) {
    if (aLife[i] <= 0) {
      ap[i * 3]     = 0;
      ap[i * 3 + 1] = -9999;
      ap[i * 3 + 2] = 0;
      continue;
    }

    aLife[i] -= dt * 0.72;
    if (aLife[i] <= 0) {
      aLife[i] = 0;
      ap[i * 3 + 1] = -9999;
      continue;
    }

    const i3 = i * 3;
    ap[i3]     += aVel[i3] * dt;
    ap[i3 + 1] += aVel[i3 + 1] * dt;
    ap[i3 + 2] += aVel[i3 + 2] * dt;

    const fade = aLife[i];
    let r0, g0, b0;
    if (aType[i] === 0) { r0 = 1.0; g0 = 0.72; b0 = 0.18; }
    else if (aType[i] === 1) { r0 = 0.25; g0 = 0.72; b0 = 1.0; }
    else { r0 = 0.18; g0 = 1.0; b0 = 0.85; }

    ac[i3]     = r0 * fade;
    ac[i3 + 1] = g0 * fade;
    ac[i3 + 2] = b0 * fade;
  }

  aGeo.attributes.position.needsUpdate = true;
  aGeo.attributes.color.needsUpdate = true;

  /* ---------- 热源 / 冷源脉动 ---------- */
  heatLight.intensity = 1.2 + 0.9 * Math.sin(sceneTime * 3.2);
  coolLight.intensity = 0.7 + 0.5 * Math.cos(sceneTime * 2.7 + 1.2);

  heatGlowMat.opacity = 0.10 + 0.10 * Math.abs(Math.sin(sceneTime * 3.2));

  /* ---------- 相机 ---------- */
  if (autoRotate && !dragging) orbit.theta += dt * 0.09;
  orbit.dist += (orbit.targetDist - orbit.dist) * 0.075;

  const sp = Math.sin(orbit.phi);
  camera.position.set(
    camTarget.x + orbit.dist * sp * Math.sin(orbit.theta),
    camTarget.y + orbit.dist * Math.cos(orbit.phi),
    camTarget.z + orbit.dist * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(camTarget);

  /* ---------- 2D 面板 ---------- */
  drawPV(phase);
  drawGauge(T, P);

  /* ---------- 相位标签 ---------- */
  const pn = getPhaseName(phase);
  if (phaseLbl.textContent !== pn) phaseLbl.textContent = pn;

  /* ---------- 文字与进度 ---------- */
  updateText(sceneTime);
  progressEl.style.width = ((sceneTime / LOOP_TIME) * 100).toFixed(2) + '%';

  renderer.render(scene, camera);
}

/* ---------------- 窗口缩放 ---------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  setupCanvas(pvCanvas, pvCtx, PV_W, PV_H);
  setupCanvas(gaugeCanvas, gaugeCtx, GA_W, GA_H);
});

/* ---------------- 启动 ---------------- */
drawPV(0);
drawGauge(TH, P1);
updateText(0);
animate();
</script>
