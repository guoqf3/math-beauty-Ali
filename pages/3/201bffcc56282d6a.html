<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>彭罗斯镶嵌 · Penrose Tiling</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#04030c;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;}

  /* ---------- 暗角 ---------- */
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 50%,
      transparent 30%,
      rgba(4,3,12,.28) 62%,
      rgba(2,1,6,.82) 100%);
  }

  /* ---------- 界面 ---------- */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  #title{
    position:absolute;top:0;left:0;
    padding:38px 46px;
    opacity:0;animation:fade 2.0s .4s ease forwards;
  }
  #title h1{
    font-size:clamp(18px,2.4vw,30px);
    font-weight:200;
    letter-spacing:.44em;text-indent:.44em;
    background:linear-gradient(96deg,#c9a0ff 0%,#8ea8ff 32%,#5ee8e0 58%,#ffd48a 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:14px;
    filter:drop-shadow(0 0 28px rgba(160,140,255,.42));
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(180,170,255,.32);
    margin-bottom:14px;
  }
  #title .sub{
    font-size:10.5px;letter-spacing:.20em;line-height:1.9;
    color:rgba(150,180,235,.26);font-weight:300;
  }

  /* ---------- 右上 ---------- */
  #stats{
    position:absolute;top:0;right:0;
    padding:38px 46px;
    text-align:right;
    opacity:0;animation:fade 2.0s 1.0s ease forwards;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.22em;line-height:2.0;
    color:rgba(150,180,235,.24);
  }
  #stats .lab{
    display:block;font-size:8px;
    letter-spacing:.44em;text-indent:.44em;
    color:rgba(130,160,220,.20);
    margin-bottom:9px;
  }
  #stats .v{color:rgba(200,225,255,.52);}
  #stats .g{color:rgba(255,205,150,.52);}

  /* ---------- 左下：数学原理 ---------- */
  #formula{
    position:absolute;bottom:0;left:0;
    padding:0 46px 34px;
    opacity:0;animation:fade 2.0s 1.1s ease forwards;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:clamp(9px,1.0vw,11.5px);
    line-height:2.05;
    letter-spacing:.02em;
    color:rgba(150,180,235,.28);
    max-width:min(800px,88vw);
  }
  #formula .lab{
    display:block;font-size:8px;
    letter-spacing:.44em;text-indent:.44em;
    color:rgba(120,155,215,.20);
    margin-bottom:10px;
  }
  #formula .kw{color:rgba(200,170,255,.58);}
  #formula .fn{color:rgba(120,230,220,.52);}
  #formula .nm{color:rgba(255,205,140,.60);}
  #formula .op{color:rgba(140,175,225,.26);}
  #formula .cm{color:rgba(105,140,195,.20);font-style:italic;}

  /* ---------- 右下 ---------- */
  #hint{
    position:absolute;bottom:0;right:0;
    padding:0 46px 34px;
    text-align:right;
    opacity:0;animation:fade 2.0s 1.4s ease forwards;
  }
  #hint .big{
    font-size:clamp(9.5px,1.0vw,12px);
    letter-spacing:.32em;text-indent:.32em;
    color:rgba(200,180,255,.40);
    margin-bottom:10px;font-weight:300;
  }
  #hint .small{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.20em;
    color:rgba(140,170,225,.22);
    line-height:1.9;
  }
  #hint .key{
    display:inline-block;
    padding:1px 6px;margin:0 2px;
    border:1px solid rgba(140,170,225,.18);
    border-radius:3px;
    color:rgba(200,225,255,.42);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:680px){
    #title{padding:20px 20px;}
    #stats{padding:20px 20px;font-size:8px;}
    #formula{padding:0 20px 18px;font-size:8px;}
    #hint{padding:0 20px 18px;}
    #hint .small{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="ui">
  <div id="title">
    <h1>彭罗斯镶嵌</h1>
    <div class="en">PENROSE TILING</div>
    <div class="sub">五重对称 · 非周期铺砌 · 黄金比例细分</div>
  </div>

  <div id="stats">
    <span class="lab">TILE STATISTICS</span>
    <div><span>三角形 </span><span class="v" id="nTri">–</span></div>
    <div><span>薄 (A) </span><span class="v" id="nA">–</span></div>
    <div><span>胖 (B) </span><span class="v" id="nB">–</span></div>
    <div><span>A : B </span><span class="g" id="ratio">–</span></div>
  </div>

  <div id="formula">
    <span class="lab">ROBINSON TRIANGLE SUBDIVISION</span>
    <span class="kw">A</span>(36°,72°,72°)
    <span class="op">→</span> <span class="nm">2</span><span class="kw">A</span>
    <span class="op">+</span> <span class="nm">1</span><span class="fn">B</span>
    <span class="cm">&nbsp;&nbsp;// 薄菱形之半</span><br>
    <span class="fn">B</span>(36°,36°,108°)
    <span class="op">→</span> <span class="nm">1</span><span class="kw">A</span>
    <span class="op">+</span> <span class="nm">1</span><span class="fn">B</span>
    <span class="cm">&nbsp;&nbsp;// 胖菱形之半</span><br>
    <span class="fn">φ</span> <span class="op">=</span> (<span class="nm">1</span><span class="op">+</span><span class="nm">√5</span>)<span class="op">/</span><span class="nm">2</span>
    <span class="op">≈</span> <span class="nm">1.6180339887</span>
    <span class="cm">&nbsp;&nbsp;// 细分缩放因子 1/φ</span><br>
    <span class="fn">A:B</span> <span class="op">→</span> <span class="nm">φ:1</span>
    <span class="cm">&nbsp;&nbsp;// 黄金比例，永不重复</span>
  </div>

  <div id="hint">
    <div class="big">永不重复的秩序</div>
    <div class="small">
      <span class="key">点击</span> 加深细分<br>
      <span class="key">空格</span> 重置旋转
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 基础
   ========================================================= */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const PHI      = (1 + Math.sqrt(5)) / 2;   // 1.6180339887…
const INV_PHI  = 1 / PHI;                  // 0.6180339887…

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0;

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                 window.innerWidth < 720;

/* =========================================================
   1. 向量工具
   ========================================================= */
function lerp(a, b, t){
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}

/* =========================================================
   2. 细分规则
   ---------------------------------------------------------
   A 三角形（36°, 72°, 72°）：v[0] 是 36° 顶点
   B 三角形（36°, 36°, 108°）：v[0] 是 108° 顶点

   细分：
     A → 2A + 1B
     B → 1A + 1B
   缩放因子 1/φ
   ========================================================= */

/* ---------- 细分 A 三角形 ---------- */
function subdivideA(O, P, Q){
  /* O = 36° 顶点，P、Q = 72° 顶点 */
  const R = lerp(O, P, INV_PHI);   // 在 OP 上，OR = 1
  const S = lerp(O, Q, INV_PHI);   // 在 OQ 上，OS = 1

  return [
    { t: 'A', v: [O, R, S] },      // O 仍为 36°
    { t: 'A', v: [Q, R, P] },      // Q 为 36°
    { t: 'B', v: [S, R, Q] }       // S 为 108°
  ];
}

/* ---------- 细分 B 三角形 ---------- */
function subdivideB(Q, O, P){
  /* Q = 108° 顶点，O、P = 36° 顶点 */
  const R = lerp(O, P, INV_PHI);   // 在 OP 上，OR = 1

  return [
    { t: 'A', v: [O, Q, R] },      // O 为 36°
    { t: 'B', v: [R, P, Q] }       // R 为 108°
  ];
}

/* ---------- 对整组三角形细分 n 次 ---------- */
function subdivideAll(tris, n){
  for (let iter = 0; iter < n; iter++){
    const next = [];

    for (let i = 0; i < tris.length; i++){
      const tri = tris[i];

      if (tri.t === 'A'){
        const sub = subdivideA(tri.v[0], tri.v[1], tri.v[2]);
        next.push(sub[0], sub[1], sub[2]);
      } else {
        const sub = subdivideB(tri.v[0], tri.v[1], tri.v[2]);
        next.push(sub[0], sub[1]);
      }
    }

    tris = next;
  }
  return tris;
}

/* =========================================================
   3. 初始图案 —— 正十边形（10 个 A 三角形）
   ========================================================= */
function makeInitial(radius){
  const tris = [];
  const N = 10;

  for (let i = 0; i < N; i++){
    const a1 = (i / N) * Math.PI * 2;
    const a2 = ((i + 1) / N) * Math.PI * 2;

    const C  = [CX, CY];
    const V1 = [CX + radius * Math.cos(a1), CY + radius * Math.sin(a1)];
    const V2 = [CX + radius * Math.cos(a2), CY + radius * Math.sin(a2)];

    tris.push({ t: 'A', v: [C, V1, V2] });
  }

  return tris;
}

/* =========================================================
   4. 构建：生成路径并按颜色分桶
   ========================================================= */
let buckets   = [];     // [{ path: Path2D, color: string }]
let stats     = { total: 0, A: 0, B: 0 };
let basePaths = [];

function buildTiling(){
  CX = W * 0.5;
  CY = H * 0.5;

  /* ---- 十边形半径：覆盖屏幕对角线，留出旋转余量 ---- */
  const diag = Math.sqrt(W * W + H * H);
  const radius = diag * 0.62;

  /* ---- 细分次数：目标三角形短边约 26–40 px ---- */
  const targetEdge = isMobile ? 46 : 34;
  let iterations = Math.round(
    Math.log(radius / targetEdge) / Math.log(PHI)
  ) - 1;
  iterations = Math.max(4, Math.min(7, iterations));

  /* ---- 生成 ---- */
  let tris = makeInitial(radius);
  tris = subdivideAll(tris, iterations);

  stats.total = tris.length;
  stats.A = 0;
  stats.B = 0;

  /* ---- 按颜色分桶 ---- */
  const NB = 22;                     // 距离分桶数
  const maxD = radius;

  buckets = [];
  for (let i = 0; i < NB * 2; i++){
    buckets.push({ path: new Path2D(), color: '' });
  }

  for (let i = 0; i < tris.length; i++){
    const tri = tris[i];
    const v = tri.v;

    /* ---- 质心与距离 ---- */
    const mx = (v[0][0] + v[1][0] + v[2][0]) / 3;
    const my = (v[0][1] + v[1][1] + v[2][1]) / 3;
    const dx = mx - CX, dy = my - CY;
    let d = Math.sqrt(dx * dx + dy * dy);
    if (d > maxD) d = maxD;

    const t = d / maxD;

    /* ---- 分桶索引 ---- */
    let bi = Math.floor(t * NB);
    if (bi >= NB) bi = NB - 1;
    if (tri.t === 'B') bi += NB;

    const path = buckets[bi].path;

    path.moveTo(v[0][0], v[0][1]);
    path.lineTo(v[1][0], v[1][1]);
    path.lineTo(v[2][0], v[2][1]);
    path.closePath();

    if (tri.t === 'A') stats.A++;
    else               stats.B++;
  }

  /* ---- 计算每个桶的颜色 ---- */
  for (let k = 0; k < NB; k++){
    const t = (k + 0.5) / NB;

    /* A 三角形：紫罗兰 → 深紫 */
    const hueA = 268 - 22 * t;
    const satA = 68 - 14 * t;
    const litA = 54 - 16 * t;

    /* B 三角形：金色 → 暖橙 */
    const hueB = 46 + 16 * t;
    const satB = 82 - 12 * t;
    const litB = 58 - 14 * t;

    buckets[k].color      = 'hsl(' + hueA.toFixed(1) + ',' +
                                     satA.toFixed(1) + '%,' +
                                     litA.toFixed(1) + '%)';
    buckets[k + NB].color = 'hsl(' + hueB.toFixed(1) + ',' +
                                     satB.toFixed(1) + '%,' +
                                     litB.toFixed(1) + '%)';
  }

  /* ---- 只保留非空桶 ---- */
  const kept = [];
  for (let i = 0; i < buckets.length; i++){
    if (buckets[i].color) kept.push(buckets[i]);
  }
  buckets = kept;

  /* ---- 更新 HUD ---- */
  updateStats();
}

/* =========================================================
   5. HUD
   ========================================================= */
const nTriEl = document.getElementById('nTri');
const nAEl   = document.getElementById('nA');
const nBEl   = document.getElementById('nB');
const ratioEl= document.getElementById('ratio');

function updateStats(){
  nTriEl.textContent = stats.total.toLocaleString();
  nAEl.textContent   = stats.A.toLocaleString();
  nBEl.textContent   = stats.B.toLocaleString();

  const r = stats.B > 0 ? (stats.A / stats.B) : 0;
  ratioEl.textContent = r.toFixed(3) + '  (φ≈1.618)';
}

/* =========================================================
   6. 尺寸
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  buildTiling();
}

window.addEventListener('resize', resize);

/* =========================================================
   7. 动画状态
   ========================================================= */
let rotation = 0;
let autoSpin = true;

/* =========================================================
   8. 渲染
   ========================================================= */
function render(){
  /* ---------- 背景 ---------- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#04030c';
  ctx.fillRect(0, 0, W, H);

  /* 中心冷光 */
  const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.66);
  bg.addColorStop(0.00, 'rgba(46, 34, 88, 0.46)');
  bg.addColorStop(0.42, 'rgba(24, 20, 52, 0.20)');
  bg.addColorStop(1.00, 'rgba(4, 3, 12, 0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* ---------- 旋转并绘制所有瓷砖 ---------- */
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(rotation);
  ctx.translate(-CX, -CY);

  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  for (let i = 0; i < buckets.length; i++){
    const b = buckets[i];

    /* 填充 */
    ctx.fillStyle = b.color;
    ctx.fill(b.path);

    /* 同色描边，消除相邻三角形之间的细缝 */
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 0.75;
    ctx.stroke(b.path);
  }

  ctx.restore();

  /* ---------- 中心柔光 ---------- */
  ctx.globalCompositeOperation = 'lighter';
  const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.min(W, H) * 0.22);
  cg.addColorStop(0.00, 'rgba(190, 160, 255, 0.13)');
  cg.addColorStop(0.50, 'rgba(140, 110, 240, 0.05)');
  cg.addColorStop(1.00, 'rgba(120, 90, 220, 0)');
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, W, H);

  /* ---------- 暗角 ---------- */
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(
    CX, CY, Math.min(W, H) * 0.28,
    CX, CY, Math.max(W, H) * 0.78
  );
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.74)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   9. 主循环
   ========================================================= */
let lastTS = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastTS){ lastTS = now; return; }

  let dt = (now - lastTS) / 1000;
  lastTS = now;

  if (dt > 0.10) dt = 0.10;
  if (dt < 0)    dt = 0;

  /* 极缓慢自转 —— 约 90 秒一圈 */
  if (autoSpin){
    rotation += dt * 0.070;
    if (rotation > Math.PI * 2) rotation -= Math.PI * 2;
  }

  render();
}

/* =========================================================
   10. 交互
   ========================================================= */
/* 点击：切换自转 */
canvas.addEventListener('pointerdown', () => {
  autoSpin = !autoSpin;
});

/* 空格：重置旋转并恢复自转 */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){
    e.preventDefault();
    rotation = 0;
    autoSpin = true;
  }
});

/* =========================================================
   11. 启动
   ========================================================= */
resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
