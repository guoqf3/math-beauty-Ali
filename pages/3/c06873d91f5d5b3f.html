<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>傅里叶变换 · 频域分解</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03060f;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* 顶部启迪文字 */
  #topText{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    width:min(1080px,78vw);
    text-align:center;
    font-size:clamp(14px,1.85vw,23px);
    line-height:1.75;
    letter-spacing:.05em;
    font-weight:500;
    color:#d6ecff;
    text-shadow:0 0 14px rgba(90,180,255,.9),0 0 38px rgba(60,110,255,.55),0 0 70px rgba(120,60,255,.35);
    pointer-events:none;z-index:12;
    white-space:pre-wrap;
  }

  /* 边缘公式 */
  .formula{
    position:fixed;z-index:12;pointer-events:none;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    font-size:clamp(10px,1.02vw,15px);
    color:#79d4ff;opacity:.72;letter-spacing:.04em;line-height:1.95;
    text-shadow:0 0 10px rgba(70,190,255,.9),0 0 24px rgba(40,110,255,.6);
  }
  .tl{top:14px;left:18px}
  .bl{bottom:74px;left:18px}
  .tr{top:14px;right:18px;text-align:right}
  .br{bottom:74px;right:18px;text-align:right}
  .formula .dim{opacity:.62;font-size:.9em}

  /* 控制面板 */
  #ui{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    z-index:20;display:flex;flex-direction:column;gap:10px;align-items:center;
    padding:12px 20px;border-radius:16px;
    background:rgba(8,18,40,.55);
    border:1px solid rgba(90,170,255,.25);
    backdrop-filter:blur(10px);
    box-shadow:0 0 34px rgba(30,90,200,.28),inset 0 0 22px rgba(60,140,255,.08);
  }
  #ui .row{display:flex;gap:8px;align-items:center}
  #ui button{
    font:inherit;font-size:13px;padding:6px 16px;border-radius:9px;cursor:pointer;
    color:#a9d4ff;background:rgba(30,70,140,.35);
    border:1px solid rgba(90,170,255,.32);
    transition:.22s;letter-spacing:.05em;
  }
  #ui button:hover{background:rgba(50,120,220,.5);color:#e8f6ff}
  #ui button.active{
    color:#03121f;background:linear-gradient(180deg,#7fe3ff,#4aa8ff);
    border-color:#9fe9ff;box-shadow:0 0 18px rgba(90,200,255,.85)
  }
  #ui label{font-size:12.5px;color:#9cc8f5;letter-spacing:.06em;white-space:nowrap}
  #ui #nVal{color:#7fe3ff;font-weight:700;text-shadow:0 0 10px rgba(90,220,255,.9)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:190px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,#2a6cff,#00e5ff,#b96bff);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#eaf9ff;border:1px solid #8fe4ff;
    box-shadow:0 0 12px rgba(120,220,255,.95);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border:none;border-radius:50%;
    background:#eaf9ff;box-shadow:0 0 12px rgba(120,220,255,.95);cursor:pointer;
  }

  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:8;
    background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(0,0,0,.7) 100%);
  }
  @media (max-width:640px){
    #ui{padding:9px 12px;gap:7px}
    input[type=range]{width:120px}
    .formula{font-size:9px}
    .bl,.br{bottom:96px}
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="vignette"></div>
<div id="topText"></div>

<!-- 边缘公式 -->
<div class="formula tl">
  X(f) = ∫ x(t)·e<sup>−i2πft</sup> dt &nbsp;<span class="dim">(−∞ → +∞)</span><br>
  <span class="dim">采样率 fs · 基频 f₀ · 谐波次数 k · 时间窗 T</span>
</div>
<div class="formula tr">
  x(t) = Σ<sub>k</sub> a<sub>k</sub>·sin(2πk f₀ t)<br>
  <span class="dim">复杂信号 = 简单正弦的叠加</span>
</div>
<div class="formula bl">
  a<sub>k</sub> = (2/T)·∫<sub>0</sub><sup>T</sup> x(t)·sin(2πk f₀ t) dt
</div>
<div class="formula br">
  <span class="dim">时域 ⟷ 频域</span><br>
  X(f) ｜ |a<sub>k</sub>| ｜ phase
</div>

<!-- 控制面板 -->
<div id="ui">
  <div class="row">
    <button data-type="square" class="active">方波</button>
    <button data-type="saw">锯齿波</button>
    <button data-type="tri">三角波</button>
  </div>
  <div class="row">
    <label>谐波数 k</label>
    <input id="nRange" type="range" min="1" max="24" value="24" step="1">
    <label id="nVal">24</label>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============ 常量 ============ */
const W        = 46;      // 波形横向宽度
const SPACING  = 1.30;    // 各次谐波在纵深方向的间距
const MAXK     = 24;      // 最大谐波数
const AMP      = 3.3;     // 振幅缩放
const SAMPLES  = 260;     // 每条谐波的采样点数
const SUMS     = 380;     // 合成波采样点数
const CYCLE    = 30;      // 动画循环时长（秒）

/* ============ 渲染器 / 场景 / 相机 ============ */
const host = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03060f);
scene.fog = new THREE.FogExp2(0x03060f, 0.0072);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 3000);

const camTarget = new THREE.Vector3(0, 0, -4);
let camPhi  = 0.95;
let camDist = 58;
let dragTheta = 0;

/* ============ 光斑贴图 ============ */
function makeGlowTexture(){
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.22,'rgba(255,255,255,0.62)');
  g.addColorStop(0.55,'rgba(255,255,255,0.16)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const GLOW = makeGlowTexture();

/* ============ 灯光 ============ */
scene.add(new THREE.AmbientLight(0x3556a0, 1.5));
const pl1 = new THREE.PointLight(0x3f8bff, 320, 240); pl1.position.set(-40, 34, 42); scene.add(pl1);
const pl2 = new THREE.PointLight(0xff4fd8, 260, 240); pl2.position.set( 42, 26,-30); scene.add(pl2);
const pl3 = new THREE.PointLight(0x4fffe0, 200, 200); pl3.position.set(  0, 12, 60); scene.add(pl3);

/* ============ 地面网格 ============ */
const grid = new THREE.GridHelper(180, 60, 0x1b4a86, 0x0a1f3d);
grid.position.y = -15;
grid.material.transparent = true;
grid.material.opacity = 0.34;
grid.material.depthWrite = false;
scene.add(grid);

/* ============ 谐波结构 ============ */
const harmonics = [];
const hGroup = new THREE.Group();
scene.add(hGroup);

const zOf = k => 10 - (k - 1) * SPACING;   // 第 k 次谐波的纵深位置

for (let k = 1; k <= MAXK; k++){
  const hue   = 0.015 + ((k - 1) / (MAXK - 1)) * 0.76;
  const color = new THREE.Color().setHSL(hue, 1.0, 0.60);

  const g = new THREE.Group();
  g.position.z = zOf(k);
  hGroup.add(g);

  // —— 正弦曲线 ——
  const lgeo = new THREE.BufferGeometry();
  lgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SAMPLES * 3), 3));
  const lmat = new THREE.LineBasicMaterial({
    color, transparent:true, opacity:0.85,
    blending: THREE.AdditiveBlending, depthWrite:false
  });
  const line = new THREE.Line(lgeo, lmat);
  line.frustumCulled = false;
  g.add(line);

  // —— 频域柱体 ——
  const bgeo = new THREE.CylinderGeometry(0.24, 0.24, 1, 10, 1, true);
  bgeo.translate(0, 0.5, 0);
  const bmat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity:0.85,
    blending: THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
  });
  const bar = new THREE.Mesh(bgeo, bmat);
  bar.position.x = -W/2 - 3.0;
  g.add(bar);

  // —— 柱体光晕 ——
  const smat = new THREE.SpriteMaterial({
    map: GLOW, color, transparent:true, opacity:0.5,
    blending: THREE.AdditiveBlending, depthWrite:false
  });
  const sprite = new THREE.Sprite(smat);
  sprite.position.x = -W/2 - 3.0;
  g.add(sprite);

  harmonics.push({ g, line, bar, sprite, appear:0 });
}

/* ============ 合成波（重建信号） ============ */
const sumGeo = new THREE.BufferGeometry();
sumGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SUMS * 3), 3));
const sumLine = new THREE.Line(sumGeo, new THREE.LineBasicMaterial({
  color: 0xffffff, transparent:true, opacity:0.95,
  blending: THREE.AdditiveBlending, depthWrite:false
}));
sumLine.position.z = 14.5;
sumLine.frustumCulled = false;
scene.add(sumLine);

/* ============ 辉光粒子 ============ */
const PCOUNT = 700;
const pPos = new Float32Array(PCOUNT * 3);
const pCol = new Float32Array(PCOUNT * 3);
const tmpC = new THREE.Color();
for (let i = 0; i < PCOUNT; i++){
  pPos[i*3+0] = (Math.random() - 0.5) * 150;
  pPos[i*3+1] = Math.random() * 62 - 18;
  pPos[i*3+2] = (Math.random() - 0.5) * 150;
  tmpC.setHSL(0.48 + Math.random() * 0.38, 0.95, 0.62);
  pCol[i*3+0] = tmpC.r; pCol[i*3+1] = tmpC.g; pCol[i*3+2] = tmpC.b;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.85, map: GLOW, vertexColors:true, transparent:true, opacity:0.75,
  blending: THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
}));
scene.add(particles);

/* ============ 傅里叶系数 ============ */
let curType = 'square';
function coeff(k, type){
  const odd = (k % 2 === 1);
  if (type === 'square')  return odd ? (4 / Math.PI) / k : 0;
  if (type === 'saw')     return (2 / Math.PI) * (odd ? 1 : -1) / k;
  if (type === 'tri')     return odd ? (8 / (Math.PI * Math.PI)) * ((((k-1)/2) % 2 === 0) ? 1 : -1) / (k*k) : 0;
  return 1 / k;
}

/* ============ 后处理 Bloom ============ */
let composer = null;
(async () => {
  try {
    const [EC, RP, UB, OP] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js')
    ]);
    composer = new EC.EffectComposer(renderer);
    composer.addPass(new RP.RenderPass(scene, camera));
    composer.addPass(new UB.UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight), 0.72, 0.72, 0.06
    ));
    composer.addPass(new OP.OutputPass());
  } catch (e) {
    console.warn('Bloom 不可用，退回基础渲染', e);
  }
})();

/* ============ 顶部文字（逐字浮现） ============ */
const TEXT = '揭示任何复杂信号皆可由简单正弦波叠加而成——复杂性由简单成分的叠加涌现，教会我们从噪声中识别规律，用分解代替直觉。';
const topTextEl = document.getElementById('topText');
const chars = [...TEXT];
const spans = chars.map(ch => {
  const s = document.createElement('span');
  s.textContent = ch;
  s.style.opacity = '0';
  s.style.display = 'inline-block';
  s.style.transition = 'opacity .28s ease';
  topTextEl.appendChild(s);
  return s;
});
const TEXT_SPAN = 23.5;                       // 文字铺满所用时间
const charStep = TEXT_SPAN / spans.length;

/* ============ 交互 ============ */
let dragging = false, lastX = 0, lastY = 0;
const el = renderer.domElement;

el.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  dragTheta -= dx * 0.005;
  camPhi = Math.min(1.42, Math.max(0.16, camPhi - dy * 0.0042));
});
const endDrag = e => {
  dragging = false;
  try { el.releasePointerCapture(e.pointerId); } catch(_) {}
};
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);
el.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.min(125, Math.max(26, camDist * (1 + Math.sign(e.deltaY) * 0.085)));
}, { passive:false });

/* 波形按钮 */
document.querySelectorAll('#ui button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curType = btn.dataset.type;
  });
});

/* 谐波滑块 */
const nRange = document.getElementById('nRange');
const nVal   = document.getElementById('nVal');
let userMaxN = MAXK;
nRange.addEventListener('input', () => {
  userMaxN = parseInt(nRange.value, 10);
  nVal.textContent = userMaxN;
});

/* ============ 主循环 ============ */
const clock = new THREE.Clock();
let smoothDt = 1/60;

function tick(){
  requestAnimationFrame(tick);

  const dt = Math.min(clock.getDelta(), 0.05);
  smoothDt += (dt - smoothDt) * 0.15;
  const elapsed = clock.elapsedTime;
  const t = elapsed % CYCLE;          // 循环时间 0 → 30

  /* --- 谐波数量自动增长 --- */
  const GA = 3.5, GB = 25.5;
  let autoN;
  if (t < GA)      autoN = 1;
  else if (t >= GB) autoN = MAXK;
  else autoN = Math.round(1 + (t - GA) / (GB - GA) * (MAXK - 1));
  const N = Math.max(1, Math.min(MAXK, Math.min(autoN, userMaxN)));

  if (nVal.textContent !== String(userMaxN)) nVal.textContent = userMaxN;

  /* --- 相位 --- */
  const phase = elapsed * 1.15;
  const breathe = elapsed * 3.0;

  /* --- 逐条谐波更新 --- */
  for (let k = 1; k <= MAXK; k++){
    const h = harmonics[k-1];
    const active = (k <= N);

    if (!active){
      if (h.g.visible) h.g.visible = false;
      h.appear = 0;
      continue;
    }
    h.g.visible = true;
    h.appear = Math.min(1, h.appear + dt * 3.2);
    const ap = h.appear;

    const c = coeff(k, curType);
    const a = c * AMP;

    // 正弦曲线
    const arr = h.line.geometry.attributes.position.array;
    const kk = 2 * Math.PI * k / W;
    for (let j = 0; j < SAMPLES; j++){
      const x = -W/2 + W * j / (SAMPLES - 1);
      arr[j*3+0] = x;
      arr[j*3+1] = a * Math.sin(kk * x + phase) * ap;
      arr[j*3+2] = 0;
    }
    h.line.geometry.attributes.position.needsUpdate = true;
    h.line.material.opacity = (0.35 + 0.65 * ap) * (0.75 + 0.25 * Math.sin(breathe + k * 0.6));

    // 频域柱体
    const hgt = Math.max(0.03, Math.abs(a)) * ap;
    const pulse = 1 + 0.14 * Math.sin(breathe + k * 0.9);
    h.bar.scale.y = hgt;
    h.bar.scale.x = h.bar.scale.z = pulse;
    h.bar.material.opacity = 0.9 * ap;

    h.sprite.position.y = hgt * 0.5;
    const sc = 1.9 + hgt * 1.05;
    h.sprite.scale.set(sc, sc, 1);
    h.sprite.material.opacity = 0.5 * ap * (0.8 + 0.2 * Math.sin(breathe * 1.3 + k));
  }

  /* --- 合成波（所有谐波叠加） --- */
  const sArr = sumLine.geometry.attributes.position.array;
  for (let j = 0; j < SUMS; j++){
    const x = -W/2 + W * j / (SUMS - 1);
    let y = 0;
    for (let k = 1; k <= N; k++){
      const c = coeff(k, curType);
      if (c === 0) continue;
      y += c * AMP * Math.sin(2 * Math.PI * k * x / W + phase);
    }
    sArr[j*3+0] = x;
    sArr[j*3+1] = y;
    sArr[j*3+2] = 0;
  }
  sumLine.geometry.attributes.position.needsUpdate = true;
  sumLine.material.opacity = 0.55 + 0.4 * Math.abs(Math.sin(elapsed * 1.4));

  /* --- 相机（自动摆动 + 拖拽） --- */
  const autoTheta = Math.sin(elapsed * 0.135) * 0.52;
  const th = autoTheta + dragTheta;
  const sp = Math.sin(camPhi), cp = Math.cos(camPhi);
  camera.position.set(
    camTarget.x + camDist * sp * Math.sin(th),
    camTarget.y + camDist * cp,
    camTarget.z + camDist * sp * Math.cos(th)
  );
  camera.lookAt(camTarget);

  /* --- 粒子缓慢旋转 --- */
  particles.rotation.y += 0.00035;
  particles.rotation.x  = Math.sin(elapsed * 0.06) * 0.05;

  /* --- 顶部文字逐字浮现 --- */
  for (let i = 0; i < spans.length; i++){
    const a = Math.min(1, Math.max(0, (t - i * charStep) / 0.45));
    const s = spans[i];
    if (s._o !== a){ s._o = a; s.style.opacity = a.toFixed(3); }
  }

  /* --- 渲染 --- */
  if (composer) composer.render();
  else renderer.render(scene, camera);
}

/* ============ 自适应 ============ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});

tick();
</script>
</body>
</html>
