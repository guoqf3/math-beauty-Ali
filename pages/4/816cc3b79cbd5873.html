<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clifford平行线编织 · S³大圆族投影 · 四元数几何</title>
    <style>
        :root {
            --bg: #04040e;
            --gold: #d6a745;
            --cyan: #3dbca5;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.6vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.62rem);
            letter-spacing: 0.22em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 14, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.85rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.54rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3dbca5;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>Clifford平行线编织 · S³大圆族投影 · 四元数几何</h1>
        <div class="subtitle">左乘eⁱᶿ/ʲᶿ/ᵏᶿ生成的大圆族 &nbsp;·&nbsp; SO(4)旋转 &nbsp;·&nbsp; 球极投影至ℝ³</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">Cⁱ(q₀)={eⁱᶿq₀}</span>
            ⊗ <span class="accent-cyan">Cʲ(q₀)={eʲᶿq₀}</span>
            ⊗ <span class="accent-rose">Cᵏ(q₀)={eᵏᶿq₀}</span>
        </div>
        <div class="formula-detail">
            四元数左乘生成Clifford平行大圆 · 三族不同生成元 · 动态SO(4)旋转 · 编织空间链环
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.3, 1.4, 7.8);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3dbca5');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // ---------- 背景星点 ----------
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 140;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.3 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSizes[i] = Math.random() * 1.5 + 0.2;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.018,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 48, 32);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.06, depthWrite: false })
        );
        scene.add(refSphereWire);

        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 28);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.05, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- 四元数工具 ----------
        // q = [w, x, y, z]
        function quatMul(a, b) {
            return [
                a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
                a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
                a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
                a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0],
            ];
        }

        function quatExp(theta, unit) {
            const c = Math.cos(theta);
            const s = Math.sin(theta);
            return [c, s * unit[1], s * unit[2], s * unit[3]];
        }

        function stereographic(q) {
            const w = q[0],
                x = q[1],
                y = q[2],
                z = q[3];
            let denom = 1 - w;
            if (Math.abs(denom) < 1e-12) denom = 1e-12 * (denom >= 0 ? 1 : -1);
            const inv = 1 / denom;
            return [x * inv, y * inv, z * inv];
        }

        function clampPoint(p) {
            let [px, py, pz] = p;
            if (!Number.isFinite(px)) px = 0;
            if (!Number.isFinite(py)) py = 0;
            if (!Number.isFinite(pz)) pz = 0;
            const r = Math.sqrt(px * px + py * py + pz * pz);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const sc = CLAMP_RADIUS / r;
                return [px * sc, py * sc, pz * sc];
            }
            if (r < 0.001) return [0, 0, 0];
            return [px, py, pz];
        }

        // 单位虚四元数 i, j, k
        const I = [0, 1, 0, 0];
        const J = [0, 0, 1, 0];
        const K = [0, 0, 0, 1];

        // 生成随机种子四元数 (均匀分布在S³上)
        function randomUnitQuat() {
            const u1 = Math.random();
            const u2 = Math.random();
            const u3 = Math.random();
            const r = Math.sqrt(-Math.log(u3));
            const theta1 = 2 * Math.PI * u1;
            const theta2 = 2 * Math.PI * u2;
            const w = r * Math.cos(theta1);
            const x = r * Math.sin(theta1);
            const y = r * Math.cos(theta2);
            const z = r * Math.sin(theta2);
            const n = Math.sqrt(w * w + x * x + y * y + z * z);
            return [w / n, x / n, y / n, z / n];
        }

        // SO(4)作用: q → L * q * R†
        function so4Rotate(q, L, RConj) {
            return quatMul(L, quatMul(q, RConj));
        }

        // ---------- 曲线系统 ----------
        const POINTS_PER_FIBER = 100;
        const allCurves = [];

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_FIBER * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.83,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geom, positions, updateFn: null };
            allCurves.push(obj);
            return obj;
        }

        // 构建一族纤维
        function buildFamily(count, generator, color) {
            for (let k = 0; k < count; k++) {
                const q0 = randomUnitQuat();
                const curve = createCurve(color);
                curve.q0 = q0;
                curve.generator = generator;
                curve.updateFn = (t) => {
                    const pos = curve.positions;
                    // 动态左右旋转四元数
                    const thetaL = t * 0.4;
                    const thetaR = t * 0.55;
                    const L = [
                        Math.cos(thetaL * 0.7),
                        Math.sin(thetaL * 0.7) * 0.6,
                        Math.sin(thetaL * 0.7) * 0.8,
                        0
                    ];
                    const R = [
                        Math.cos(thetaR * 0.9),
                        0,
                        Math.sin(thetaR * 0.9) * 0.7,
                        Math.sin(thetaR * 0.9) * 0.5
                    ];
                    const RConj = [R[0], -R[1], -R[2], -R[3]];
                    for (let i = 0; i < POINTS_PER_FIBER; i++) {
                        const theta = (i / (POINTS_PER_FIBER - 1)) * Math.PI * 2;
                        const expGen = quatExp(theta, curve.generator);
                        const fiberPt = quatMul(expGen, curve.q0);
                        const rotated = so4Rotate(fiberPt, L, RConj);
                        const s3 = stereographic(rotated);
                        const p = clampPoint([s3[0] * 2.4, s3[1] * 2.4, s3[2] * 2.4]);
                        pos[i * 3] = p[0];
                        pos[i * 3 + 1] = p[1];
                        pos[i * 3 + 2] = p[2];
                    }
                    curve.geom.attributes.position.needsUpdate = true;
                };
            }
        }

        // 三族纤维：金=i，青=j，玫红=k，各25条，共75条
        buildFamily(25, I, colorGold);
        buildFamily(25, J, colorCyan);
        buildFamily(25, K, colorRose);

        console.log(`✅ 大圆纤维总数: ${allCurves.length}`);

        // ---------- 流动粒子 ----------
        const particleCount = 22;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                curveIndex: i % allCurves.length,
                progress: Math.random(),
                speed: 0.0007 + Math.random() * 0.002,
            });
            let col;
            if (i < 8) col = colorGold.clone();
            else if (i < 15) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.048,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const curveObj = allCurves[pd.curveIndex];
                if (!curveObj || !curveObj.positions) continue;
                const posArr = curveObj.positions;
                const floatIdx = pd.progress * (POINTS_PER_FIBER - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, POINTS_PER_FIBER - 1);
                const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                const i0 = idx0 * 3,
                    i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // ---------- 统一更新（绝对时间） ----------
        function safeUpdateCurves(t) {
            for (const curve of allCurves) {
                try {
                    if (curve.updateFn) curve.updateFn(t);
                } catch (e) {
                    console.warn('曲线更新异常', e);
                }
            }
        }

        // ---------- 稳健动画循环（绝对时间驱动） ----------
        const startTime = performance.now();
        let lastLogTime = startTime;
        let frameCount = 0;

        function animate(nowTS) {
            requestAnimationFrame(animate);
            try {
                const now = nowTS || performance.now();
                const elapsed = (now - startTime) / 1000; // 绝对时间(秒)
                frameCount++;

                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 绝对时间:${elapsed.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }

                // 更新所有曲线与粒子
                safeUpdateCurves(elapsed);
                updateParticles();

                // 背景结构呼吸
                const breathe = 1 + 0.04 * Math.sin(elapsed * 0.42) * Math.cos(elapsed * 0.3);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += 0.0008;
                refSphereWire.rotation.y += 0.0007;

                refTorusWire.rotation.z += 0.0008;
                const torBreathe = 1 + 0.05 * Math.sin(elapsed * 0.45) * Math.cos(elapsed * 0.33);
                refTorusWire.scale.setScalar(torBreathe);

                // 相机缓慢环绕
                const camH = elapsed * 0.12;
                const camV = 0.33 + 0.17 * Math.sin(elapsed * 0.15);
                const camD = 7.4 + 0.6 * Math.sin(elapsed * 0.2) * Math.cos(elapsed * 0.26);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.05 * Math.sin(elapsed * 0.1), 0.03 * Math.cos(elapsed * 0.13), 0);

                stars.rotation.y += 0.0002;
                stars.rotation.x += 0.00015;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环异常（已恢复）:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });

        // 启动：预渲染第一帧，然后开始循环
        console.log('🚀 Clifford平行线编织动画初始化...');
        safeUpdateCurves(0);
        updateParticles();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动（绝对时间驱动，保证持续运动）');
    </script>
</body>
</html>
