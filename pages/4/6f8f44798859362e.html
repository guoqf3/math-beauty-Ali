<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑体辐射 · 斯忒藩-玻尔兹曼定律</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}

#c{display:block;position:fixed;inset:0;}

.hud{position:fixed;z-index:5;pointer-events:none;}
  .hud .eq{
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    font-size:clamp(14px,1.85vw,27px);font-weight:600;letter-spacing:.4px;
    white-space:nowrap;
  }
  .hud .sub{font-size:clamp(9px,.9vw,13px);opacity:.6;margin-top:5px;letter-spacing:2.5px;}

.tl{top:20px;left:24px;}
  .tr{top:20px;right:24px;text-align:right;}
  .bl{bottom:190px;left:24px;}
  .br{bottom:190px;right:24px;text-align:right;}

.cyan  .eq{color:#9fe9ff;text-shadow:0 0 9px #26a9ff,0 0 28px rgba(38,169,255,.55);}
  .amber .eq{color:#ffc98a;text-shadow:0 0 9px #ff8a1e,0 0 28px rgba(255,138,30,.55);}
  .pink  .eq{color:#ffa8e8;text-shadow:0 0 9px #ff3bbd,0 0 28px rgba(255,59,189,.5);}
  .mint  .eq{color:#a6ffcf;text-shadow:0 0 9px #12e58a,0 0 28px rgba(18,229,138,.5);}
  .cyan .sub{color:#7fd4ff;} .amber .sub{color:#ffb066;}
  .pink .sub{color:#ff8ad6;} .mint .sub{color:#7ff0b8;}

#panel{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    z-index:6;display:flex;flex-direction:column;align-items:center;gap:10px;
    width:min(780px,93vw);pointer-events:none;
  }
  #stats{display:flex;gap:clamp(8px,3.2vw,50px);justify-content:center;
    font-size:clamp(9px,1.1vw,14px);letter-spacing:.5px;}
  .stat{text-align:center;}
  .stat .k{opacity:.55;font-size:.8em;letter-spacing:1.6px;color:#8fb8ff;}
  .stat .v{font-family:"Cambria Math",Georgia,serif;font-size:1.4em;margin-top:3px;
    color:#fff;text-shadow:0 0 14px rgba(120,200,255,.9);white-space:nowrap;}

#row{display:flex;align-items:center;gap:12px;width:100%;pointer-events:auto;}
  #tempSlider{
    -webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:3px;
    background:linear-gradient(90deg,#3d0a00,#a03000,#ff8c00,#ffd66b,#fff4d0,#cfe6ff,#8ab6ff);
    outline:none;cursor:pointer;
    box-shadow:0 0 16px rgba(255,140,40,.35);
  }
  #tempSlider::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:#fff;border:2px solid #ff9a3c;
    box-shadow:0 0 12px #ff9a3c,0 0 26px rgba(255,154,60,.75);cursor:pointer;
  }
  #tempSlider::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:#fff;
    border:2px solid #ff9a3c;box-shadow:0 0 12px #ff9a3c;cursor:pointer;
  }
  .slabel{font-size:11px;color:#8fb8ff;letter-spacing:1.6px;white-space:nowrap;opacity:.8;}

@media (max-width:720px){
    .bl,.br{bottom:170px;}
    .hud .sub{display:none;}
    .hud .eq{font-size:13px;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud tl cyan">
  <div class="eq">E = σ·T⁴</div>
  <div class="sub">斯忒藩 — 玻尔兹曼定律</div>
</div>

<div class="hud tr amber">
  <div class="eq">λ<sub>max</sub>·T = b = 2.898×10⁻³ m·K</div>
  <div class="sub">维恩位移定律</div>
</div>

<div class="hud bl pink">
  <div class="eq">P = ε·σ·A·T⁴</div>
  <div class="sub">斯特藩辐射功率</div>
</div>

<div class="hud br mint">
  <div class="eq">σ = 5.67×10⁻⁸ W/(m²·K⁴)</div>
  <div class="sub">斯特藩常量 · ε ≈ 0.98</div>
</div>

<div id="panel">
  <div id="stats">
    <div class="stat"><div class="k">温度 T</div><div class="v" id="vT">2000 K</div></div>
    <div class="stat"><div class="k">辐射功率密度 σT⁴</div><div class="v" id="vE">9.07×10⁵ W/m²</div></div>
    <div class="stat"><div class="k">峰值波长 λ_max</div><div class="v" id="vL">1.45 μm</div></div>
  </div>
  <div id="row">
    <span class="slabel">1000 K</span>
    <input id="tempSlider" type="range" min="1000" max="6000" step="5" value="1000">
    <span class="slabel">6000 K</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* ═══════════════ 物理常量 ═══════════════ */
const H_P = 6.62607015e-34;
const C_L = 2.99792458e8;
const K_B = 1.380649e-23;
const SIGMA = 5.670374419e-8;
const WIEN  = 2.897771955e-3;

const LMIN = 0.05e-6;      // 50 nm
const LMAX = 3.20e-6;      // 3.2 μm

/* 普朗克函数（去掉常数因子，只留形状） */
function planckNorm(lambda, T){
  const x = H_P * C_L / (lambda * K_B * T);
  if (x > 690) return 0;
  return (1 / Math.pow(lambda, 5)) / Math.expm1(x);
}
/* 6000K 峰值作为参考基准 */
const REF_PEAK = planckNorm(WIEN / 6000, 6000);

/* 完整普朗克辐射出射度 W/m³ */
function planckFull(lambda, T){
  const x = H_P * C_L / (lambda * K_B * T);
  if (x > 690) return 0;
  return (2 * Math.PI * H_P * C_L * C_L / Math.pow(lambda, 5)) / Math.expm1(x);
}

/* ═══════════════ 工具函数 ═══════════════ */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const smooth = x => { x = clamp(x,0,1); return x*x*(3-2*x); };

const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
             '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺'};
function sup(n){ return String(n).split('').map(c=>SUP[c]||c).join(''); }
function sci(x, d){
  d = d || 2;
  if (!isFinite(x) || x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  const m = x / Math.pow(10, e);
  return m.toFixed(d) + '×10' + sup(e);
}

/* ═══════════════ 波长 → 光谱色 ═══════════════ */
function spectralRGB(nm){
  let R = 0, G = 0, B = 0;

  if (nm >= 380 && nm < 440){ R = -(nm - 440) / 60; B = 1; }
  else if (nm >= 440 && nm < 490){ G = (nm - 440) / 50; B = 1; }
  else if (nm >= 490 && nm < 510){ G = 1; B = -(nm - 510) / 20; }
  else if (nm >= 510 && nm < 580){ R = (nm - 510) / 70; G = 1; }
  else if (nm >= 580 && nm < 645){ R = 1; G = -(nm - 645) / 65; }
  else if (nm >= 645 && nm <= 780){ R = 1; }
  else if (nm > 780){ R = 1; B = 0.05; }
  else { B = 1; R = 0.10; }          // < 380 nm → 紫外，暗紫

  let f = 1;
  if (nm < 380) f = 0.42;
  else if (nm < 420) f = 0.42 + 0.58 * (nm - 380) / 40;
  else if (nm <= 700) f = 1;
  else if (nm <= 780) f = 0.42 + 0.58 * (780 - nm) / 80;
  else if (nm <= 1100) f = 0.42 - 0.06 * (nm - 780) / 320;
  else f = 0.36 - 0.08 * Math.min(1, (nm - 1100) / 2200);

  return [R * f, G * f, B * f];
}

/* ═══════════════ 画布初始化 ═══════════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ═══════════════ 光谱渐变 ═══════════════ */
function spectrumGradient(x0, x1){
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  const STEPS = 56;
  for (let i = 0; i <= STEPS; i++){
    const f = i / STEPS;
    const lam = LMIN + (LMAX - LMIN) * f;
    const c = spectralRGB(lam * 1e9);
    g.addColorStop(f, 'rgb(' +
      Math.min(255, Math.round(c[0] * 255)) + ',' +
      Math.min(255, Math.round(c[1] * 255)) + ',' +
      Math.min(255, Math.round(c[2] * 255)) + ')');
  }
  return g;
}

/* ═══════════════ 时间轴：30 秒循环 ═══════════════ */
const CYCLE = 30000;

function tempAt(ms){
  const s = ms / 1000;
  let T;
  if (s < 2)        T = 1000;
  else if (s < 13)  T = 1000 + 5000 * smooth((s - 2) / 11);
  else if (s < 16)  T = 6000;
  else if (s < 27)  T = 6000 - 5000 * smooth((s - 16) / 11);
  else              T = 1000;
  return T;
}

/* ═══════════════ 交互状态 ═══════════════ */
const slider = document.getElementById('tempSlider');
let manualMode = false;
let manualT = 2000;
let manualStart = 0;

slider.addEventListener('input', function(){
  manualMode = true;
  manualT = parseFloat(slider.value);
  manualStart = performance.now();
});

let geo = { x0:0, x1:0, yTop:0, yBase:0 };
let curT = 2000;
let ptsCache = [];
let clickMark = null;

canvas.addEventListener('pointerdown', function(e){
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  if (mx < geo.x0 || mx > geo.x1) return;
  if (my < geo.yTop || my > geo.yBase + 30) return;

  const f = (mx - geo.x0) / (geo.x1 - geo.x0);
  const lam = LMIN + f * (LMAX - LMIN);
  if (lam <= 0) return;

  // 找曲线上最近的采样点
  let best = 0, bd = 1e9;
  for (let i = 0; i < ptsCache.length; i++){
    const d = Math.abs(ptsCache[i][0] - mx);
    if (d < bd){ bd = d; best = i; }
  }
  clickMark = {
    lam: lam,
    x: mx,
    y: ptsCache[best] ? ptsCache[best][1] : geo.yBase,
    until: performance.now() + 4500
  };
});

/* ═══════════════ HUD 更新 ═══════════════ */
const vT = document.getElementById('vT');
const vE = document.getElementById('vE');
const vL = document.getElementById('vL');

function updateHUD(T){
  const E  = SIGMA * Math.pow(T, 4);
  const lm = WIEN / T;
  vT.textContent = Math.round(T) + ' K';
  vE.textContent = sci(E, 2) + ' W/m²';
  vL.textContent = (lm * 1e6).toFixed(2) + ' μm';
}

/* ═══════════════ 主渲染 ═══════════════ */
const t0 = performance.now();

function render(now){
  const cyc = (now - t0) % CYCLE;

  let T;
  if (manualMode){
    T = manualT;
    if (now - manualStart > 7000) manualMode = false;
  }
  if (!manualMode){
    T = tempAt(cyc);
    slider.value = Math.round(T);
  }
  curT = T;
  updateHUD(T);

  /* ---------- 布局 ---------- */
  const pl = Math.max(44, W * 0.055);
  const pr = Math.max(44, W * 0.055);
  const pt = Math.max(78, H * 0.125);
  const pb = Math.min(195, Math.max(130, H * 0.205));

  const x0 = pl, x1 = W - pr;
  const yTop = pt, yBase = H - pb;
  const plotW = x1 - x0, plotH = yBase - yTop;
  geo = { x0, x1, yTop, yBase };

  const lx = lam => x0 + (lam - LMIN) / (LMAX - LMIN) * plotW;

  /* ---------- 背景 ---------- */
  ctx.fillStyle = '#000206';
  ctx.fillRect(0, 0, W, H);

  const warm = clamp((T - 1000) / 5000, 0, 1);
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.0031);
  const glowA = (0.26 + 0.40 * warm) * (0.86 + 0.14 * pulse);

  const cx = W * 0.46, cyy = yBase - plotH * 0.30;
  const bg = ctx.createRadialGradient(cx, cyy, 0, cx, cyy, Math.max(W, H) * 0.85);
  bg.addColorStop(0, 'rgba(' +
    Math.round(24 + 100 * warm) + ',' +
    Math.round(8 + 44 * warm) + ',' +
    Math.round(4 + 52 * warm) + ',' + glowA + ')');
  bg.addColorStop(0.42, 'rgba(' +
    Math.round(6 + 20 * warm) + ',' +
    Math.round(3 + 10 * warm) + ',' +
    Math.round(8 + 26 * warm) + ',' + (glowA * 0.55) + ')');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* ---------- 坐标网格 ---------- */
  ctx.save();
  ctx.strokeStyle = 'rgba(110,160,230,0.10)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 7]);
  for (let i = 1; i <= 4; i++){
    const y = yBase - plotH * i / 5;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    ctx.stroke();
  }
  ctx.restore();

  /* ---------- 可见光带 ---------- */
  const vx0 = lx(380e-9);
  const vx1 = lx(750e-9);
  const vw = vx1 - vx0;

  const visGrad = ctx.createLinearGradient(vx0, 0, vx1, 0);
  const VSTEPS = 24;
  for (let i = 0; i <= VSTEPS; i++){
    const f = i / VSTEPS;
    const nm = 380 + 370 * f;
    const c = spectralRGB(nm);
    visGrad.addColorStop(f, 'rgb(' +
      Math.round(c[0] * 255) + ',' +
      Math.round(c[1] * 255) + ',' +
      Math.round(c[2] * 255) + ')');
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.13;
  ctx.fillStyle = visGrad;
  ctx.fillRect(vx0, yTop, vw, plotH);
  ctx.globalAlpha = 0.30;
  ctx.strokeStyle = visGrad;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 5]);
  ctx.strokeRect(vx0, yTop, vw, plotH);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#ffe9b0';
  ctx.font = '600 11px "Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('可见光区 380–750 nm', (vx0 + vx1) / 2, yTop - 9);
  ctx.restore();

  /* ---------- 采样曲线 ---------- */
  const N = 300;
  const pts = [];
  let maxDisp = 0, peakX = x0, peakY = yBase, peakLam = 0;

  for (let i = 0; i <= N; i++){
    const lam = LMIN + (LMAX - LMIN) * i / N;
    const v = planckNorm(lam, T);
    const vn = v / REF_PEAK;
    const disp = Math.pow(Math.max(vn, 1e-14), 0.25);
    const px = lx(lam);
    const py = yBase - disp * plotH * 0.93;
    pts.push([px, py]);
    if (disp > maxDisp){
      maxDisp = disp; peakX = px; peakY = py; peakLam = lam;
    }
  }
  ptsCache = pts;

  const grad = spectrumGradient(x0, x1);

  /* ---------- 曲线下填充 ---------- */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], yBase);
  for (let i = 0; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineTo(pts[pts.length - 1][0], yBase);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.globalAlpha = 0.09 + 0.06 * warm;
  ctx.fill();
  ctx.restore();

  /* ---------- 辉光多层描边 ---------- */
  function tracePath(){
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  }

  const layers = [
    { w: 30, a: 0.045 },
    { w: 18, a: 0.075 },
    { w: 10, a: 0.13  },
    { w: 5,  a: 0.34  },
    { w: 2.4,a: 0.78  }
  ];

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = grad;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  for (let i = 0; i < layers.length; i++){
    const L = layers[i];
    ctx.globalAlpha = L.a * (0.88 + 0.12 * pulse);
    ctx.lineWidth = L.w;
    tracePath();
    ctx.stroke();
  }

  // 炽白核心
  ctx.globalAlpha = 0.55 + 0.35 * warm;
  ctx.lineWidth = 1.1;
  ctx.strokeStyle = grad;
  tracePath();
  ctx.stroke();
  ctx.restore();

  /* ---------- 峰值光晕 ---------- */
  if (maxDisp > 0.05){
    const r = 46 + 34 * maxDisp;
    const pg = ctx.createRadialGradient(peakX, peakY, 0, peakX, peakY, r);
    const inten = clamp(maxDisp * 1.25, 0, 1);
    pg.addColorStop(0,    'rgba(255,255,255,' + (0.62 * inten) + ')');
    pg.addColorStop(0.22, 'rgba(255,240,205,' + (0.34 * inten) + ')');
    pg.addColorStop(0.55, 'rgba(255,170,70,'  + (0.14 * inten) + ')');
    pg.addColorStop(1,    'rgba(255,120,20,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(peakX, peakY, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 峰值竖线
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = 'rgba(255,235,190,0.85)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    ctx.moveTo(peakX, peakY);
    ctx.lineTo(peakX, yBase);
    ctx.stroke();
    ctx.restore();

    // 峰值标记点
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.arc(peakX, peakY, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // λmax 标签
    const lmx = (peakLam * 1e6).toFixed(2);
    ctx.save();
    ctx.font = '600 12px "Cambria Math",Georgia,serif';
    ctx.fillStyle = 'rgba(255,236,190,0.92)';
    ctx.textAlign = peakX > W * 0.7 ? 'right' : 'left';
    const tx = peakX > W * 0.7 ? peakX - 10 : peakX + 10;
    ctx.fillText('λmax = ' + lmx + ' μm', tx, peakY - 12);
    ctx.restore();
  }

  /* ---------- 坐标轴 ---------- */
  ctx.save();
  ctx.strokeStyle = 'rgba(120,170,240,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, yBase);
  ctx.lineTo(x1, yBase);
  ctx.stroke();

  ctx.fillStyle = 'rgba(140,190,255,0.55)';
  ctx.font = '11px "Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  const ticks = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0];
  for (let i = 0; i < ticks.length; i++){
    const tx = lx(ticks[i] * 1e-6);
    if (tx < x0 + 6 || tx > x1 - 6) continue;
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(120,170,240,0.28)';
    ctx.moveTo(tx, yBase);
    ctx.lineTo(tx, yBase + 5);
    ctx.stroke();
    ctx.fillText(ticks[i].toFixed(1), tx, yBase + 19);
  }
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(140,190,255,0.42)';
  ctx.font = '11px "Segoe UI",sans-serif';
  ctx.fillText('波长 λ / μm', x1 - 78, yBase + 36);
  ctx.restore();

  /* ---------- 点击标记 ---------- */
  if (clickMark && now < clickMark.until){
    const life = (clickMark.until - now) / 4500;
    const alpha = clamp(life * 1.6, 0, 1);
    const lam = clickMark.lam;
    const M = planckFull(lam, T);
    const Mmic = M * 1e-6;   // W/(m²·μm)

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(160,255,255,0.95)';
    ctx.beginPath();
    ctx.arc(clickMark.x, clickMark.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,240,255,0.55)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.moveTo(clickMark.x, clickMark.y);
    ctx.lineTo(clickMark.x, yBase);
    ctx.stroke();
    ctx.restore();

    const nmVal = (lam * 1e9).toFixed(0);
    const line1 = nmVal + ' nm';
    const line2 = (Mmic > 0 && isFinite(Mmic)) ? sci(Mmic, 2) + ' W/(m²·μm)' : '—';

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '600 12px "Consolas","Segoe UI",monospace';
    const boxW = Math.max(ctx.measureText(line1).width, ctx.measureText(line2).width) + 20;
    const boxH = 42;
    let bx = clickMark.x + 14;
    let by = clickMark.y - 54;
    if (bx + boxW > W - 12) bx = clickMark.x - boxW - 14;
    if (by < 8) by = clickMark.y + 14;

    ctx.fillStyle = 'rgba(6,20,32,0.82)';
    ctx.strokeStyle = 'rgba(120,230,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, boxW, boxH, 7);
    else ctx.rect(bx, by, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#a9f2ff';
    ctx.fillText(line1, bx + 10, by + 17);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(line2, bx + 10, by + 33);
    ctx.restore();
  } else if (clickMark){
    clickMark = null;
  }

  requestAnimationFrame(render);
}

requestAnimationFrame(render);

})();
</script>
