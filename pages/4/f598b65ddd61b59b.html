<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有限元分析 · 数值求解</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#080c18;
  }
  canvas { display:block; }

  #topText {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    width:min(82vw,1060px);
    min-height:2.4em;
    text-align:center;
    color:#d4e8ff;
    font-size:clamp(13px,1.5vw,19.5px);
    letter-spacing:.07em;
    line-height:1.75;
    font-weight:400;
    text-shadow:0 0 16px rgba(90,200,255,.65),
                0 0 44px rgba(50,140,255,.32);
    pointer-events:none;
    z-index:10;
  }
  #topText::after {
    content:'';
    display:inline-block;
    width:2px; height:.95em;
    background:#ffb84d;
    margin-left:5px;
    vertical-align:-.12em;
    box-shadow:0 0 9px #ffb84d;
    animation:blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50%{opacity:0;} }

  .formula {
    position:fixed;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    color:rgba(140,200,255,.5);
    font-size:clamp(11px,1.02vw,15.5px);
    letter-spacing:.05em;
    pointer-events:none;
    z-index:10;
    text-shadow:0 0 14px rgba(70,150,255,.55);
    white-space:nowrap;
  }
  .f-tl { top:96px; left:24px; }
  .f-tr { top:96px; right:24px; text-align:right; }
  .f-bl { bottom:42px; left:24px; }

  #panel {
    position:fixed; right:24px; bottom:42px;
    width:226px;
    padding:13px 15px 10px;
    background:rgba(10,18,40,.5);
    border:1px solid rgba(80,160,255,.22);
    border-radius:11px;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    color:#95b2dd;
    font-size:12px;
    z-index:20;
    box-shadow:0 6px 30px rgba(0,0,0,.5),
               inset 0 0 22px rgba(60,130,255,.07);
  }
  #panel .row {
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:4px 8px;
    margin-bottom:11px;
  }
  #panel .row label { grid-column:1/3; letter-spacing:.05em; }
  #panel .row .val {
    font-family:"Cambria Math",Georgia,serif;
    color:#6ee8c0;
    font-size:12px;
    min-width:38px;
    text-align:right;
  }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:100%; height:3px; border-radius:3px;
    background:linear-gradient(90deg,#2fe89a,#4a7dff);
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:#d0f4ff;
    box-shadow:0 0 10px rgba(70,220,255,.85);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb {
    width:13px; height:13px; border:none; border-radius:50%;
    background:#d0f4ff;
    box-shadow:0 0 10px rgba(70,220,255,.85);
    cursor:pointer;
  }
  #panel .hint {
    text-align:center;
    font-size:10.5px;
    color:rgba(130,170,215,.5);
    letter-spacing:.1em;
    margin-top:2px;
  }
</style>
</head>
<body>

<div id="topText"></div>

<div class="formula f-tl">[K]{u} = {F}</div>
<div class="formula f-tr">K_e = ∫ Bᵀ D B dv</div>
<div class="formula f-bl">u = Σ Nᵢ · Uᵢ</div>

<div id="panel">
  <div class="row">
    <label>网格密度 (单元数 nx)</label>
    <input id="sNx" type="range" min="8" max="36" step="1" value="24">
    <span class="val" id="vNx">24</span>
  </div>
  <div class="row">
    <label>载荷大小 P</label>
    <input id="sP" type="range" min="0.4" max="1.4" step="0.02" value="1.00">
    <span class="val" id="vP">1.00</span>
  </div>
  <div class="hint">拖拽旋转视角</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080c18, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080c18, 0.010);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 900);
camera.position.set(6, 8, 25);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = false;
controls.enablePan = false;
controls.minDistance = 10;
controls.maxDistance = 65;
controls.maxPolarAngle = Math.PI * 0.58;

/* ============================================================
   光点贴图
   ============================================================ */
function createSpriteTexture(){
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.20,'rgba(255,255,255,0.78)');
  g.addColorStop(0.50,'rgba(255,255,255,0.22)');
  g.addColorStop(1.00,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,s,s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPRITE = createSpriteTexture();

/* ============================================================
   物理 / 几何参数
   ============================================================ */
const L        = 18;        // 梁长
const H        = 2.5;       // 梁高
const EI       = 3240;      // 抗弯刚度
const AMPLIFY  = 8;         // 变形放大系数
const SIGMA_REF = 18;       // 应力色彩参考值

const DURATION = 30;

let nx    = 24;             // 水平单元数（滑块）
let loadP = 1.00;           // 载荷（滑块）

/* ============================================================
   颜色映射（彩虹应力云图）
   ============================================================ */
const STOPS = [
  [0.00, 0x0a1a4a],
  [0.15, 0x0055ff],
  [0.32, 0x00d4aa],
  [0.52, 0x4dff00],
  [0.70, 0xffe600],
  [0.86, 0xff8800],
  [1.00, 0xff2244]
];
const STOPS_C = STOPS.map(([t, hex]) => [t, new THREE.Color(hex)]);

function colorMap(t){
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < STOPS_C.length - 1; i++){
    const [t0, c0] = STOPS_C[i];
    const [t1, c1] = STOPS_C[i+1];
    if (t <= t1){
      const f = (t - t0) / (t1 - t0);
      return c0.clone().lerp(c1, f);
    }
  }
  return STOPS_C[STOPS_C.length - 1][1].clone();
}

/* ============================================================
   星空背景
   ============================================================ */
(function buildStars(){
  const COUNT = 800;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++){
    const r  = 80 + Math.random() * 150;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3    ] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.6 + 25;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    size: 0.95, map: SPRITE, color: 0x8fb6ff,
    transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* ============================================================
   有限元网格构建
   ============================================================ */
let basePos = null;   // 节点基准位置
let dispPos = null;   // 单位载荷下的节点位移（已放大）
let fillGeom = null, fillMesh = null;
let lineGeom = null, lineMesh = null;

function buildMesh(){
  /* --- 清理旧网格 --- */
  if (fillMesh){ scene.remove(fillMesh); fillGeom.dispose(); fillMesh.material.dispose(); }
  if (lineMesh){ scene.remove(lineMesh); lineGeom.dispose(); lineMesh.material.dispose(); }
  fillMesh = lineMesh = fillGeom = lineGeom = null;

  const ny      = Math.max(2, Math.round(nx * 0.3));
  const nNodesX = nx + 1;
  const nNodesY = ny + 1;
  const nNodes  = nNodesX * nNodesY;

  basePos = new Float32Array(nNodes * 3);
  dispPos = new Float32Array(nNodes * 3);
  const colors = new Float32Array(nNodes * 3);

  const Ival = H * H * H / 12;

  /* ---- 节点：基准位置 / 单位载荷位移 / 应力颜色 ---- */
  for (let j = 0; j < nNodesY; j++){
    for (let i = 0; i < nNodesX; i++){
      const idx = j * nNodesX + i;
      const k   = idx * 3;

      const x0 = -L/2 + (i / nx) * L;
      const y0 = -H/2 + (j / ny) * H;

      basePos[k]     = x0;
      basePos[k + 1] = y0;
      basePos[k + 2] = 0;

      const s = x0 + L/2;   // 距固定端距离 0 → L

      // 悬臂梁解析解（单位载荷）
      const w  = -s * s * (3*L - s) / (6 * EI);   // 挠度
      const th = -s * (2*L - s) / (2 * EI);       // 转角
      const ux = -y0 * th;                         // 轴向位移

      dispPos[k]     = ux * AMPLIFY;
      dispPos[k + 1] = w  * AMPLIFY;
      dispPos[k + 2] = 0;

      // 应力 σ = M·y / I，单位载荷下 M = (L-s)
      const sigma = (L - s) * y0 / Ival;
      const t     = Math.min(1, Math.abs(sigma) / SIGMA_REF);
      const c     = colorMap(t);

      colors[k]     = c.r;
      colors[k + 1] = c.g;
      colors[k + 2] = c.b;
    }
  }

  /* ---- 填充面（顶点颜色） ---- */
  const positions = new Float32Array(nNodes * 3);
  positions.set(basePos);

  const indices = [];
  for (let j = 0; j < ny; j++){
    for (let i = 0; i < nx; i++){
      const a = j * nNodesX + i;
      const b = a + 1;
      const c = a + nNodesX;
      const d = c + 1;
      indices.push(a, b, d);
      indices.push(a, d, c);
    }
  }

  fillGeom = new THREE.BufferGeometry();
  fillGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  fillGeom.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  fillGeom.setIndex(indices);

  fillMesh = new THREE.Mesh(fillGeom, new THREE.MeshBasicMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.90,
    depthWrite: false
  }));
  fillMesh.renderOrder = 2;
  fillMesh.frustumCulled = false;
  scene.add(fillMesh);

  /* ---- 网格线框 ---- */
  const linePositions = new Float32Array(nNodes * 3);
  linePositions.set(basePos);

  const lineIdx = [];
  // 水平线
  for (let j = 0; j < nNodesY; j++){
    for (let i = 0; i < nx; i++){
      const a = j * nNodesX + i;
      lineIdx.push(a, a + 1);
    }
  }
  // 垂直线
  for (let j = 0; j < ny; j++){
    for (let i = 0; i < nNodesX; i++){
      const a = j * nNodesX + i;
      lineIdx.push(a, a + nNodesX);
    }
  }

  lineGeom = new THREE.BufferGeometry();
  lineGeom.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
  lineGeom.setIndex(lineIdx);

  lineMesh = new THREE.LineSegments(lineGeom, new THREE.LineBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.15,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  lineMesh.renderOrder = 3;
  lineMesh.frustumCulled = false;
  scene.add(lineMesh);
}

buildMesh();

/* ============================================================
   固定端墙体
   ============================================================ */
const wallGeom = new THREE.BoxGeometry(0.6, H + 2.0, 1.8);
const wallMat  = new THREE.MeshBasicMaterial({
  color: 0x2a3a5c, transparent: true, opacity: 0.45
});
const wall = new THREE.Mesh(wallGeom, wallMat);
wall.position.set(-L/2 - 0.35, 0, 0);
scene.add(wall);

const wallEdge = new THREE.LineSegments(
  new THREE.EdgesGeometry(wallGeom),
  new THREE.LineBasicMaterial({ color: 0x4a6a9c, transparent: true, opacity: 0.5 })
);
wallEdge.position.copy(wall.position);
scene.add(wallEdge);

/* ============================================================
   载荷箭头
   ============================================================ */
const arrowGroup = new THREE.Group();
const arrowMat = new THREE.MeshBasicMaterial({
  color: 0xffd24a, transparent: true, opacity: 0.9
});

const arrowShaft = new THREE.Mesh(
  new THREE.CylinderGeometry(0.07, 0.07, 1.6, 10), arrowMat
);
arrowShaft.position.y = 0.8;

const arrowHead = new THREE.Mesh(
  new THREE.ConeGeometry(0.25, 0.7, 14), arrowMat
);
arrowHead.position.y = -0.35;
arrowHead.rotation.z = Math.PI;

arrowGroup.add(arrowShaft, arrowHead);
scene.add(arrowGroup);

/* ============================================================
   应力集中光晕（固定端上下）
   ============================================================ */
const glowTop = new THREE.Sprite(new THREE.SpriteMaterial({
  map: SPRITE, color: 0xff4466,
  transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
glowTop.scale.set(2.6, 2.6, 1);
glowTop.position.set(-L/2, H/2, 0);
scene.add(glowTop);

const glowBot = new THREE.Sprite(new THREE.SpriteMaterial({
  map: SPRITE, color: 0xff4466,
  transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
glowBot.scale.set(2.6, 2.6, 1);
glowBot.position.set(-L/2, -H/2, 0);
scene.add(glowBot);

/* ============================================================
   网格更新
   ============================================================ */
function updateMesh(factor, P){
  if (!fillGeom || !lineGeom) return;

  const fillPos = fillGeom.attributes.position.array;
  const linePos = lineGeom.attributes.position.array;
  const n = fillPos.length / 3;

  for (let k = 0; k < n; k++){
    const k3 = k * 3;
    const x = basePos[k3]     + factor * P * dispPos[k3];
    const y = basePos[k3 + 1] + factor * P * dispPos[k3 + 1];

    fillPos[k3]     = x;
    fillPos[k3 + 1] = y;
    fillPos[k3 + 2] = 0;

    linePos[k3]     = x;
    linePos[k3 + 1] = y;
    linePos[k3 + 2] = 0;
  }

  fillGeom.attributes.position.needsUpdate = true;
  lineGeom.attributes.position.needsUpdate = true;
}

/* ============================================================
   顶部文字
   ============================================================ */
const FULL_TEXT = '有限元把连续问题离散为有限单元近似求解——化整为零再化零为整，启示复杂连续问题可通过合理离散化获得工程可用的近似解。';
const topTextEl = document.getElementById('topText');
let lastShown = '';

function smoothstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function updateTopText(animT){
  const prog  = smoothstep(0.5, 22, animT);
  const n     = Math.floor(prog * FULL_TEXT.length);
  const shown = FULL_TEXT.slice(0, n);
  if (shown !== lastShown){
    topTextEl.textContent = shown;
    lastShown = shown;
  }
}

/* ============================================================
   滑块交互
   ============================================================ */
const sNxEl = document.getElementById('sNx');
const sPEl  = document.getElementById('sP');
const vNxEl = document.getElementById('vNx');
const vPEl  = document.getElementById('vP');

sNxEl.addEventListener('input', e => {
  nx = parseInt(e.target.value, 10);
  vNxEl.textContent = nx;
  buildMesh();
});

sPEl.addEventListener('input', e => {
  loadP = parseFloat(e.target.value);
  vPEl.textContent = loadP.toFixed(2);
});

/* ============================================================
   主循环
   ============================================================ */
const clock  = new THREE.Clock();
let   animT  = 0;

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  animT += dt;
  if (animT >= DURATION) animT -= DURATION;

  /* ---- 变形进度 ---- */
  let factor;
  if      (animT <  2.0) factor = 0;
  else if (animT < 13.0) factor = smoothstep(0, 1, (animT - 2.0) / 11.0);
  else if (animT < 26.0) factor = 1;
  else if (animT < 29.0) factor = 1 - smoothstep(0, 1, (animT - 26.0) / 3.0);
  else                   factor = 0;

  /* ---- 变形网格 ---- */
  updateMesh(factor, loadP);

  /* ---- 载荷箭头 ---- */
  const freeEndY = -factor * loadP * 0.6 * AMPLIFY;
  arrowGroup.position.set(L/2, freeEndY + 2.1, 0);

  const arrowOp = smoothstep(3.5, 7.0, animT) * (1 - smoothstep(27.5, 29.5, animT));
  arrowMat.opacity = arrowOp * 0.92;
  arrowGroup.visible = arrowOp > 0.01;

  /* ---- 固定端应力集中脉动 ---- */
  const pulse = 1 + 0.18 * Math.sin(animT * 3.6);
  const glowOp = 0.28 + 0.30 * Math.max(0, factor);
  glowTop.material.opacity = glowOp * pulse;
  glowBot.material.opacity = glowOp * pulse;
  glowTop.scale.setScalar((2.4 + 0.35 * Math.sin(animT * 2.9)) * (0.6 + 0.8 * factor));
  glowBot.scale.setScalar((2.4 + 0.35 * Math.sin(animT * 2.9 + 1.3)) * (0.6 + 0.8 * factor));

  /* ---- 顶部文字 ---- */
  updateTopText(animT);

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   自适应
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
