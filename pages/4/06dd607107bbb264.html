<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薛定谔方程 · 粒子束缚态波函数概率云</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#04010e;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#d7ecff;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;display:block;z-index:0;}

  .vig{
    position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(0,0,0,0) 36%,
      rgba(0,0,0,.42) 72%,
      rgba(0,0,0,.85) 100%);
  }

  /* ── 顶部中央：人生启迪 ── */
  #title{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    z-index:7;pointer-events:none;
    font-size:clamp(12.5px,1.95vw,19px);
    letter-spacing:.13em;font-weight:500;
    color:#eefaff;white-space:nowrap;
    animation:tg 5s ease-in-out infinite;
  }
  @keyframes tg{
    0%,100%{text-shadow:0 0 6px rgba(110,235,255,.85),0 0 22px rgba(150,110,255,.65),0 0 44px rgba(255,120,240,.35);opacity:.93;}
    50%    {text-shadow:0 0 13px rgba(110,235,255,1),0 0 36px rgba(150,110,255,.95),0 0 74px rgba(255,120,240,.62);opacity:1;}
  }

  /* ── 边缘公式 ── */
  .eq{
    position:fixed;z-index:5;pointer-events:none;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:clamp(9px,1.0vw,12px);
    line-height:1.8;color:#8fd8ff;opacity:.74;
    text-shadow:0 0 9px rgba(80,200,255,.75),0 0 24px rgba(150,90,255,.35);
    letter-spacing:.015em;
  }
  .eq b{color:#ffd9ff;font-weight:600;text-shadow:0 0 10px rgba(255,120,240,.9);}
  .eq .dim{opacity:.55;font-size:.92em;}
  .tl{top:52px;left:16px;}
  .tr{top:52px;right:16px;text-align:right;}
  .bl{bottom:calc(var(--panel-h, 130px) + 30px);left:16px;}
  .br{bottom:calc(var(--panel-h, 130px) + 30px);right:16px;text-align:right;}

  /* ── 控制面板 ── */
  #panel{
    position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
    z-index:6;width:min(640px,93vw);
    padding:10px 16px 11px;border-radius:14px;
    background:rgba(9,3,24,.72);
    border:1px solid rgba(120,200,255,.22);
    box-shadow:0 0 28px rgba(80,160,255,.16),inset 0 0 36px rgba(120,60,255,.08);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-size:11px;display:flex;flex-direction:column;gap:7px;
  }
  .row{display:grid;grid-template-columns:46px 1fr 140px;align-items:center;gap:9px;}
  .tag{color:#7fe6ff;font-family:ui-monospace,Consolas,monospace;letter-spacing:.03em;}
  .val{text-align:right;color:#ffd9ff;font-family:ui-monospace,Consolas,monospace;
       font-size:10.5px;text-shadow:0 0 8px rgba(255,110,240,.7);}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#1de9ff,#a06bff,#ff5ff0);
    box-shadow:0 0 10px rgba(110,180,255,.45);cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 0 9px #7cf,0 0 20px #a6f;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:#fff;box-shadow:0 0 9px #7cf,0 0 20px #a6f;
  }
  .chk{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#9fe8ff;
  }
  .chk input{
    -webkit-appearance:none;appearance:none;width:32px;height:16px;border-radius:8px;
    background:rgba(70,40,110,.8);border:1px solid rgba(130,200,255,.35);
    position:relative;cursor:pointer;transition:background .22s;outline:none;flex:none;
  }
  .chk input::after{
    content:'';position:absolute;top:1.5px;left:2px;width:11px;height:11px;
    border-radius:50%;background:#8fd8ff;transition:transform .22s,background .22s;
    box-shadow:0 0 8px rgba(120,220,255,.9);
  }
  .chk input:checked{background:rgba(170,70,220,.9);}
  .chk input:checked::after{transform:translateX(16px);background:#ffb0f0;
    box-shadow:0 0 10px rgba(255,120,240,1);}

  #out{
    margin-top:0;padding-top:7px;
    border-top:1px solid rgba(110,200,255,.16);
    font-family:ui-monospace,Consolas,monospace;
    font-size:11px;color:#a9e6ff;
    display:flex;flex-wrap:wrap;gap:3px 16px;letter-spacing:.01em;
  }
  #out b{color:#8cffd8;text-shadow:0 0 10px rgba(90,255,200,.8);font-weight:600;}
  #out .hi{color:#ffb0f0;text-shadow:0 0 10px rgba(255,110,240,.8);}

  /* ── 点击探针标签 ── */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:8;}
  .probe{
    position:absolute;transform:translate(-50%,-50%);
    padding:8px 11px;border-radius:10px;
    font-family:ui-monospace,Consolas,monospace;
    font-size:10.5px;line-height:1.65;color:#e2f6ff;
    background:rgba(8,3,22,.88);
    border:1px solid rgba(130,220,255,.5);
    box-shadow:0 0 20px rgba(90,200,255,.45),inset 0 0 16px rgba(140,80,255,.22);
    white-space:nowrap;pointer-events:none;transition:opacity .15s linear;
  }
  .probe i{font-style:normal;color:#7fe6ff;}
  .probe em{font-style:normal;color:#ffb0f0;}

  @media (max-width:860px){
    .eq{font-size:9px;}
    .row{grid-template-columns:40px 1fr 112px;gap:7px;}
  }
  @media (max-width:560px){
    #title{letter-spacing:.04em;}
    .tr{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vig"></div>

<!-- 顶部中央：人生启迪 -->
<div id="title">束缚不是禁锢，波函数在阱中振荡出无限可能</div>

<!-- 边缘公式 -->
<div class="eq tl">
  <div>−ℏ²/(2m)·d²ψ/dx² + V(x)ψ = Eψ</div>
  <div class="dim">一维定态薛定谔方程</div>
</div>

<div class="eq tr">
  <div>ψ<sub>n</sub>(x) = √(2/a)·sin(nπx/a)</div>
  <div class="dim">无限深势阱本征波函数</div>
</div>

<div class="eq bl">
  <div>E<sub>n</sub> = n²π²ℏ²/(2ma²)</div>
  <div class="dim">n = 1,2,3…　零点能 E₁ = π²ℏ²/(2ma²)</div>
</div>

<div class="eq br">
  <div>|ψ<sub>n</sub>(x)|² = (2/a)·sin²(nπx/a)</div>
  <div class="dim">a = 1 nm　E₁ = 0.376 eV　E₂ = 1.50 eV</div>
</div>

<!-- 控制面板 -->
<div id="panel">
  <div class="row">
    <span class="tag">n</span>
    <input id="ns" type="range" min="1" max="5" step="1" value="1">
    <span class="val" id="nv">n = 1</span>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="sup"> 叠加态 ψ<sub>n</sub> + ψ<sub>n+1</sub>（拍频演化）</label>
  </div>
  <div id="out">
    <span>E<sub>n</sub> = <b id="env">—</b></span>
    <span>节点数 = <b id="nodv">—</b></span>
    <span>|ψ|²<sub>max</sub> = <b id="pkv">—</b></span>
    <span class="hi" id="tipv">—</span>
  </div>
</div>

<div id="labels"></div>

<script>
(function(){
'use strict';

/* ================= 常量 ================= */
const E_CH = 1.602176634e-19;
const A_W  = 1e-9;                 // 势阱宽度 a = 1 nm
const E1EV = 0.376;                // 基态能量（电子，a = 1nm）
const NMAX = 5;

/* ================= 画布 ================= */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha:false });
let W=0,H=0,cx=0,cy=0,DPR=1;
let xLeft=0, xRight=0, yBottom=0, yTop=0;
let panelH = 130;

let nSel = 1;
let superposition = false;
let tNow = 0;

/* ================= 几何（关键：动态避开底部面板） ================= */
function measurePanel(){
  const panelEl = document.getElementById('panel');
  if(panelEl){
    panelH = panelEl.offsetHeight || 130;
    document.documentElement.style.setProperty('--panel-h', panelH + 'px');
  }
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.round(W*DPR);
  cvs.height = Math.round(H*DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W/2; cy = H/2;

  // 关键：重新测量面板高度，并把动画纵向区域收缩到面板之上
  measurePanel();

  const topPad = Math.max(86, H*0.11);      // 顶部：让出标题与公式
  const botPad = panelH + 60;               // 底部：让出控制面板 + 呼吸余量

  xLeft   = W*0.175;
  xRight  = W*0.825;
  yTop    = topPad;
  yBottom = Math.max(topPad + 140, H - botPad);   // 保证至少有 140px 的可用高度

  // 若屏幕太矮，再压缩底部留白
  if(yBottom - yTop < 150){
    yBottom = Math.min(H - botPad*0.6, H - 90);
  }
}

function levelY(n){
  const f = (n*n)/(NMAX*NMAX);
  return yBottom - f*(yBottom - yTop);
}

function ampFor(n){
  const y = levelY(n);
  const yBelow = (n > 1) ? levelY(n-1) : yBottom;
  const gap = yBelow - y;
  return Math.max(10, Math.min(28, gap*0.40));
}

/* ================= 工具 ================= */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function sci(x,d){
  d = (d===undefined)?2:d;
  if(!isFinite(x)||x===0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  const m = x/Math.pow(10,e);
  return m.toFixed(d) + '×10^' + e;
}
function hueOf(n){ return (n*47 + 190) % 360; }

/* ================= 绘制：背景与势阱 ================= */
function drawWellGlow(t){
  const g = ctx.createLinearGradient(xLeft, yTop, xRight, yBottom);
  const hb = (t*9) % 360;
  g.addColorStop(0,   'hsla('+((hb+180)%360|0)+',95%,58%,0.030)');
  g.addColorStop(0.5, 'hsla('+((hb+250)%360|0)+',95%,58%,0.048)');
  g.addColorStop(1,   'hsla('+((hb+320)%360|0)+',95%,58%,0.026)');
  ctx.fillStyle = g;
  ctx.fillRect(xLeft, yTop, xRight-xLeft, yBottom-yTop);

  for(let s=0;s<2;s++){
    const x = s===0 ? xLeft : xRight;
    const wg = ctx.createLinearGradient(x, yTop, x, yBottom);
    wg.addColorStop(0,   'rgba(130,225,255,0)');
    wg.addColorStop(0.35,'rgba(130,225,255,0.30)');
    wg.addColorStop(0.75,'rgba(180,140,255,0.42)');
    wg.addColorStop(1,   'rgba(255,140,240,0.16)');
    ctx.fillStyle = wg;
    ctx.fillRect(x-1, yTop, 2, yBottom-yTop);
  }
}

/* ================= 绘制：概率云（只向上延伸，避免向下压到面板） ================= */
function drawCloud(n, y, amp, hue, isSel, t){
  const step = 3;
  const wide = (xRight - xLeft);
  const baseH = amp * (isSel ? 1.35 : 0.85);
  const alphaK = isSel ? 0.40 : 0.115;

  const useSuper = superposition && (n === nSel || n === nSel+1) && nSel < NMAX;
  const m = nSel + 1;
  const phi = t * Math.PI * 1.05;

  for(let x = xLeft; x <= xRight; x += step){
    const u = (x - xLeft)/wide;
    let p;
    if(useSuper){
      const s1 = Math.sin(nSel*Math.PI*u);
      const s2 = Math.sin(m*Math.PI*u);
      const A = 0.5*(s1*s1 + s2*s2) + s1*s2*Math.cos(phi);
      p = clamp(A*0.82, 0, 1);
    }else{
      const s = Math.sin(n*Math.PI*u);
      p = s*s;
    }
    if(p < 0.0015) continue;

    // 只向上延伸（h 从能级线往上方长），彻底避免向下遮挡
    const h = 3 + p*baseH;
    const tw = 0.72 + 0.28*Math.sin(t*2.1 + u*7.3 + n);
    const a  = p * alphaK * tw;
    if(a < 0.004) continue;

    ctx.fillStyle = 'hsla('+hue+',100%,'+(56 + p*28).toFixed(0)+'%,'+a.toFixed(3)+')';
    ctx.fillRect(x, y-h, step, h);
  }
}

/* ================= 绘制：波函数曲线 ================= */
function drawWave(n, y, amp, hue, isSel){
  const pts = [];
  const wide = xRight - xLeft;
  for(let x = xLeft; x <= xRight; x += 2){
    const u = (x - xLeft)/wide;
    pts.push([x, y - Math.sin(n*Math.PI*u)*amp]);
  }

  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const p = pts[i];
    if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
  }
  ctx.strokeStyle = 'hsla('+hue+',100%,62%,'+(isSel?0.22:0.07)+')';
  ctx.lineWidth = isSel ? 9 : 5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const p = pts[i];
    if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
  }
  ctx.strokeStyle = 'hsla('+hue+',100%,'+(isSel?84:70)+'%,'+(isSel?0.96:0.40)+')';
  ctx.lineWidth = isSel ? 2.3 : 1.2;
  ctx.stroke();
}

/* ================= 绘制：能级线 ================= */
function drawLevelLine(n, y, hue, isSel){
  ctx.beginPath();
  ctx.moveTo(xLeft, y);
  ctx.lineTo(xRight, y);
  ctx.strokeStyle = 'hsla('+hue+',92%,'+(isSel?76:56)+'%,'+(isSel?0.55:0.17)+')';
  ctx.lineWidth = isSel ? 1.7 : 1;
  ctx.setLineDash(isSel ? [] : [5,7]);
  ctx.stroke();
  ctx.setLineDash([]);

  if(isSel){
    ctx.fillStyle = 'hsla('+hue+',100%,80%,0.8)';
    ctx.fillRect(xLeft-4, y-1.5, 8, 3);
    ctx.fillRect(xRight-4, y-1.5, 8, 3);
  }
}

/* ================= 绘制：能级文字 ================= */
function drawLevelLabel(n, y, hue, isSel){
  const eV = (n*n*E1EV);
  ctx.font = (isSel ? '600 ' : '500 ') + '10.5px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'hsla('+hue+',100%,'+(isSel?88:66)+'%,'+(isSel?0.95:0.5)+')';
  ctx.fillText('n='+n, xLeft - 10, y - 7);
  ctx.font = (isSel ? '600 ' : '500 ') + '9.5px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'hsla('+hue+',100%,'+(isSel?80:58)+'%,'+(isSel?0.75:0.32)+')';
  ctx.fillText(eV.toFixed(eV<10?3:2)+' eV', xLeft - 10, y + 6);
}

/* ================= 绘制：选中态节点 ================= */
function drawNodes(n, y, amp, hue, t){
  if(n < 2) return;
  const wide = xRight - xLeft;
  for(let k=1;k<n;k++){
    const u = k/n;
    const x = xLeft + u*wide;
    const puls = 0.5 + 0.5*Math.sin(t*2.4 + k*1.3);
    ctx.beginPath();
    ctx.arc(x, y, 2.6 + puls*1.6, 0, 6.2832);
    ctx.fillStyle = 'hsla('+hue+',100%,86%,'+(0.30 + puls*0.35)+')';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, 8 + puls*5, 0, 6.2832);
    ctx.fillStyle = 'hsla('+hue+',100%,70%,'+(0.05 + puls*0.05)+')';
    ctx.fill();
  }
}

/* ================= 主渲染 ================= */
function render(t){
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(4,1,14,0.26)';
  ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation = 'lighter';

  drawWellGlow(t);

  for(let n = NMAX; n >= 1; n--){
    const y = levelY(n);
    const amp = ampFor(n);
    const hue = hueOf(n);
    const isSel = (n === nSel) ||
                  (superposition && nSel < NMAX && (n === nSel || n === nSel+1));

    drawCloud(n, y, amp, hue, (n===nSel), t);
    drawLevelLine(n, y, hue, isSel);
    drawWave(n, y, amp, hue, isSel);
    drawLevelLabel(n, y, hue, isSel);
    if(n === nSel) drawNodes(n, y, amp, hue, t);
  }

  // 底部基底线
  ctx.beginPath();
  ctx.moveTo(xLeft-10, yBottom);
  ctx.lineTo(xRight+10, yBottom);
  ctx.strokeStyle = 'rgba(150,200,255,0.16)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 宽度标注（贴着基线，避免碰到面板）
  ctx.font = '500 9.5px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(160,210,255,0.55)';
  ctx.fillText('a = 1 nm', (xLeft+xRight)/2, yBottom + 8);

  // 叠加态提示
  if(superposition && nSel < NMAX){
    const puls = 0.5 + 0.5*Math.sin(t*2.2);
    ctx.font = '600 11.5px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'hsla('+((t*40)%360|0)+',100%,80%,'+(0.55+puls*0.35)+')';
    ctx.fillText('ψ = (ψ'+nSel+' + ψ'+(nSel+1)+')/√2  ·  拍频演化中', cx, yBottom + 30);
  }
}

/* ================= 探针标签 ================= */
const labelHost = document.getElementById('labels');
const labels = [];

function addLabel(px, py){
  const wide = xRight - xLeft;
  const u = (px - xLeft)/wide;
  if(u < 0 || u > 1) return;

  const n = nSel;
  const psiRaw  = Math.sqrt(2/A_W) * Math.sin(n*Math.PI*u);
  const psi2Raw = (2/A_W) * Math.sin(n*Math.PI*u)*Math.sin(n*Math.PI*u);

  const el = document.createElement('div');
  el.className = 'probe';
  el.innerHTML =
    '<i>x</i> = ' + (u*A_W*1e9).toFixed(3) + ' nm　(u=' + u.toFixed(3) + ')<br>' +
    '<i>ψ</i> = ' + sci(psiRaw,2) + ' m<sup>-1/2</sup><br>' +
    '<i>|ψ|²</i> = ' + sci(psi2Raw,2) + ' m<sup>-1</sup><br>' +
    '<em>E' + n + ' = ' + (n*n*E1EV).toFixed(3) + ' eV　节点 ' + (n-1) + ' 个</em>';
  el.style.opacity = '0';
  labelHost.appendChild(el);

  labels.push({ x:px, y:py, el:el, born:tNow });
  while(labels.length > 5){
    const old = labels.shift();
    if(old.el.parentNode) old.el.parentNode.removeChild(old.el);
  }
}

function updateLabels(){
  for(let i=labels.length-1;i>=0;i--){
    const L = labels[i];
    const age = tNow - L.born;
    if(age > 7){
      if(L.el.parentNode) L.el.parentNode.removeChild(L.el);
      labels.splice(i,1);
      continue;
    }
    let opa = 1;
    if(age < 0.28) opa = age/0.28;
    else if(age > 5.8) opa = (7-age)/1.2;
    L.el.style.opacity = clamp(opa,0,1).toFixed(2);
    L.el.style.left = L.x + 'px';
    L.el.style.top  = L.y + 'px';
  }
}

/* ================= 主循环 ================= */
let lastT = performance.now()/1000;

function loop(nowMs){
  const now = nowMs/1000;
  let dt = now - lastT;
  if(!(dt > 0)) dt = 0.016;
  if(dt > 0.08) dt = 0.08;
  lastT = now;
  tNow += dt;

  render(tNow);
  updateLabels();

  requestAnimationFrame(loop);
}

/* ================= UI ================= */
const ns = document.getElementById('ns');
const sup = document.getElementById('sup');
const nvEl = document.getElementById('nv');
const envEl = document.getElementById('env');
const nodEl = document.getElementById('nodv');
const pkEl  = document.getElementById('pkv');
const tipEl = document.getElementById('tipv');

function updateUI(){
  nvEl.textContent = 'n = ' + nSel;
  envEl.textContent = (nSel*nSel*E1EV).toFixed(3) + ' eV';
  nodEl.textContent = (nSel-1) + ' 个';
  pkEl.textContent = sci(2/A_W,2) + ' m⁻¹';
  if(superposition && nSel < NMAX){
    tipEl.textContent = '叠加：E' + nSel + ' ↔ E' + (nSel+1) +
      '（ΔE=' + ((nSel+1)*(nSel+1)-nSel*nSel)*E1EV + ' eV）';
  }else{
    tipEl.textContent = '定态 |ψ' + nSel + '|² 驻波';
  }
}

ns.addEventListener('input', function(){
  nSel = parseInt(ns.value,10);
  updateUI();
});

sup.addEventListener('change', function(){
  superposition = sup.checked;
  updateUI();
});

cvs.addEventListener('pointerdown', function(ev){
  const rect = cvs.getBoundingClientRect();
  addLabel(ev.clientX - rect.left, ev.clientY - rect.top);
});

window.addEventListener('resize', function(){
  resize();
});
window.addEventListener('orientationchange', function(){
  setTimeout(resize, 220);
});

/* ================= 启动 ================= */
resize();
updateUI();

// 首帧后重算一次（字体/面板布局稳定后），确保面板高度准确
requestAnimationFrame(function(){
  resize();
  requestAnimationFrame(function(ts0){
    lastT = ts0/1000;
    requestAnimationFrame(loop);
  });
});

})();
</script>
</body>
</html>
