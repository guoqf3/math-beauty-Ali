<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>费马螺线编织 · 球极投影</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>费马螺线编织 · 球极投影</h2>
        <div class="sub">Fermat spirals · r = a√θ · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">a∈[0.18,0.42] 慢发</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">a∈[0.32,0.68] 中速</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">a∈[0.50,0.95] 快速</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.65;
        const PROJ_D = 2.2;
        const CURVE_POINTS = 500;
        const MAX_THETA = 22;
        const NUM_PHASES = 18;

        function stereographic(px, py) {
            const d = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / d,
                2 * PROJ_D * py / d,
                (px * px + py * py - PROJ_D * PROJ_D) / d
            ).multiplyScalar(SPHERE_R);
        }

        // Fermat spiral: r = a * sqrt(theta)
        function fermatSpiral(a, phaseOff, steps) {
            const pts = [];
            const dTheta = MAX_THETA / steps;
            for (let i = 0; i <= steps; i++) {
                const theta = 0.01 + i * dTheta;
                const r = a * Math.sqrt(theta);
                if (r > 7.5 || r < 1e-4) continue;
                const ang = theta + phaseOff;
                const px = r * Math.cos(ang);
                const py = r * Math.sin(ang);
                const sp = stereographic(px, py);
                if (sp && sp.length() < 9.5) pts.push(sp);
            }
            return pts;
        }

        function createFermatFamily(aValues, numPhases, color, opacity) {
            const group = new THREE.Group();
            for (const a of aValues) {
                for (let p = 0; p < numPhases; p++) {
                    const phase = p * 2 * Math.PI / numPhases;
                    // 正向
                    let pts = fermatSpiral(a, phase, CURVE_POINTS);
                    if (pts.length >= 2) {
                        const geom = new THREE.BufferGeometry().setFromPoints(pts);
                        const mat = new THREE.LineBasicMaterial({
                            color, transparent: true, opacity, depthWrite: true, depthTest: true,
                        });
                        group.add(new THREE.Line(geom, mat));
                    }
                    // 反向 (绕原点旋转180度并反方向，可增加编织密度)
                    pts = fermatSpiral(a, phase + Math.PI, CURVE_POINTS);
                    if (pts.length >= 2) {
                        const geom = new THREE.BufferGeometry().setFromPoints(pts);
                        const mat = new THREE.LineBasicMaterial({
                            color, transparent: true, opacity: opacity * 0.65, depthWrite: true, depthTest: true,
                        });
                        group.add(new THREE.Line(geom, mat));
                    }
                }
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'fermat-weave';
        scene.add(rootGroup);

        // 金色族：a较小，稀疏螺旋
        const goldA = [0.18, 0.24, 0.32, 0.42];
        rootGroup.add(createFermatFamily(goldA, NUM_PHASES, COLOR_GOLD, 0.60));
        rootGroup.add(createFermatFamily([0.20, 0.28], Math.floor(NUM_PHASES*0.6), COLOR_GOLD, 0.38));

        // 青色族：a中等
        const cyanA = [0.32, 0.42, 0.55, 0.68];
        rootGroup.add(createFermatFamily(cyanA, NUM_PHASES, COLOR_CYAN, 0.60));
        rootGroup.add(createFermatFamily([0.36, 0.48], Math.floor(NUM_PHASES*0.6), COLOR_CYAN, 0.38));

        // 品红族：a较大，密集快速发散
        const magentaA = [0.50, 0.62, 0.78, 0.95];
        rootGroup.add(createFermatFamily(magentaA, NUM_PHASES, COLOR_MAGENTA, 0.60));
        rootGroup.add(createFermatFamily([0.56, 0.70], Math.floor(NUM_PHASES*0.6), COLOR_MAGENTA, 0.38));

        // 辅助球面参考网格
        for (let i = 0; i < 9; i++) {
            const lat = (i + 0.5) * Math.PI / 9;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        console.log('费马螺线编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 稳定动画循环
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 费马螺线球极投影编织动画已稳定运行');
    </script>
</body>
</html>
