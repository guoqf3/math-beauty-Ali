<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四维超立方体截线 · 空间棱镜</title>
    <style>
        :root { --bg: #030509; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 40px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 0.9vw, 0.66rem); font-weight: 300; letter-spacing: 0.13em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(3,5,9,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.16);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.44rem, 0.8vw, 0.64rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.26);
            line-height: 1.55; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 13px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.38rem; white-space: normal; line-height: 1.35; }
            #title-overlay .title { font-size: 0.72rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">四维超立方体截线 · 空间棱镜</div>
        <div class="subtitle">TESSERACT SLICE LINES &nbsp;·&nbsp; ROTATING SECTIONS</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">Π₁: w=0.7</span>→<span class="c1">x=cosα·u, y=cosβ·v, z=w₀</span>&nbsp;
            <span class="c2">Π₂: w=0.0</span>→<span class="c2">x=u, y=v, z=0</span>&nbsp;
            <span class="c3">Π₃: w=−0.7</span>→<span class="c3">x=sinα·u, y=sinβ·v, z=w₀</span>
            <br>
            <span style="color:#9aa8b8;">u,v∈[−1,1]步长0.18 | α,β=ωt | 超立方体双旋转R(θₓ,θᵧ)</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ========== 场景 ==========
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#030509');
        scene.fog = new THREE.Fog('#030509', 5, 16);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 0.3, 22);
        camera.position.set(1.8, 1.3, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ========== 颜色 ==========
        const C1 = '#d4885c';
        const C2 = '#5d9ec6';
        const C3 = '#c77d9f';
        const C_FRAME = '#3a4c5e';
        const C_GLINT = '#8898aa';

        // ========== 参数 ==========
        const GRID_STEP = 0.18;
        const GRID_MAX = 1.0;
        const RANGE = [];
        for (let v = -GRID_MAX; v <= GRID_MAX + 0.001; v += GRID_STEP) RANGE.push(parseFloat(v.toFixed(10)));
        const N = RANGE.length * RANGE.length; // 每个截面的顶点数
        const SAMPLES_PER_EDGE = 2; // 每段只需2个点连直线，因为截面是平面网格
        // 我们将每个截面生成一个网格，包含横向和纵向线段

        // 生成网格线段顶点数组
        function generateGridLines(wFixed) {
            const vertices = [];
            // 横向线 (v变化, u固定)
            for (const u of RANGE) {
                const lineVerts = [];
                for (const v of RANGE) {
                    lineVerts.push(new THREE.Vector3(u, v, wFixed));
                }
                for (let i = 0; i < lineVerts.length - 1; i++) {
                    vertices.push(lineVerts[i].x, lineVerts[i].y, lineVerts[i].z);
                    vertices.push(lineVerts[i+1].x, lineVerts[i+1].y, lineVerts[i+1].z);
                }
            }
            // 纵向线 (u变化, v固定)
            for (const v of RANGE) {
                const lineVerts = [];
                for (const u of RANGE) {
                    lineVerts.push(new THREE.Vector3(u, v, wFixed));
                }
                for (let i = 0; i < lineVerts.length - 1; i++) {
                    vertices.push(lineVerts[i].x, lineVerts[i].y, lineVerts[i].z);
                    vertices.push(lineVerts[i+1].x, lineVerts[i+1].y, lineVerts[i+1].z);
                }
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            return geom;
        }

        // 创建三个截面的线条组，每个截面初始在w=wFixed平面上
        function createSliceGroup(wFixed, colorHex, opacity) {
            const geom = generateGridLines(wFixed);
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            const lineSegments = new THREE.LineSegments(geom, mat);
            const group = new THREE.Group();
            group.add(lineSegments);
            group.userData = { wFixed };
            return group;
        }

        const slice1 = createSliceGroup(0.7, C1, 0.72);
        const slice2 = createSliceGroup(0.0, C2, 0.68);
        const slice3 = createSliceGroup(-0.7, C3, 0.70);

        const mainGroup = new THREE.Group();
        mainGroup.add(slice1);
        mainGroup.add(slice2);
        mainGroup.add(slice3);
        scene.add(mainGroup);

        // 外部参考框架（立方体线框，范围[-1.2,1.2]）
        function createBoundingBox(size, colorHex, opacity) {
            const half = size/2;
            const corners = [
                [-half,-half,-half], [half,-half,-half], [half,half,-half], [-half,half,-half],
                [-half,-half,half], [half,-half,half], [half,half,half], [-half,half,half]
            ].map(v => new THREE.Vector3(v[0], v[1], v[2]));
            const edges = [
                [0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]
            ];
            const group = new THREE.Group();
            for (const [i,j] of edges) {
                const geom = new THREE.BufferGeometry().setFromPoints([corners[i], corners[j]]);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            // 顶点微光
            const sz = 0.06;
            for (const v of corners) {
                const pairs = [
                    [v.clone().add(new THREE.Vector3(-sz,0,0)), v.clone().add(new THREE.Vector3(sz,0,0))],
                    [v.clone().add(new THREE.Vector3(0,-sz,0)), v.clone().add(new THREE.Vector3(0,sz,0))],
                    [v.clone().add(new THREE.Vector3(0,0,-sz)), v.clone().add(new THREE.Vector3(0,0,sz))],
                ];
                for (const [a,b] of pairs) {
                    const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                    const m = new THREE.LineBasicMaterial({
                        color: new THREE.Color(C_GLINT),
                        transparent: true, opacity: 0.5, depthWrite: true,
                    });
                    group.add(new THREE.Line(g, m));
                }
            }
            return group;
        }
        const frame = createBoundingBox(2.4, C_FRAME, 0.32);
        scene.add(frame);

        // 原点光点
        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.1;
            const pairs = [
                [new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0)],
                [new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0)],
                [new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)],
            ];
            for (const [a,b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true, opacity: 0.7, depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(createOriginGlint());

        // ========== 动画 ==========
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            try {
                // 计算稳定的时间增量
                let delta = (now - lastTime) / 1000;
                if (delta <= 0 || delta > 0.5) delta = 0.016; // 防止异常值，保持默认帧率
                lastTime = now;
                time += delta;
                frameCount++;
                if (now - logTime > 4000) {
                    console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s delta:${(delta*1000).toFixed(1)}ms`);
                    logTime = now;
                }

                // 四维超立方体的双旋转角度
                const alpha = time * 0.38;
                const beta = time * 0.52;
                const cosA = Math.cos(alpha);
                const sinA = Math.sin(alpha);
                const cosB = Math.cos(beta);
                const sinB = Math.sin(beta);

                // 更新三个截面的顶点坐标（通过修改geometry的position）
                function updateSliceGeometry(group, wFixed, scaleX, scaleY) {
                    const lineSegments = group.children[0];
                    const geometry = lineSegments.geometry;
                    const positions = geometry.attributes.position.array;
                    const idx = 0;
                    // 重新生成顶点并应用旋转后的变换？这里我们直接对网格的每个点应用四维旋转后取(x,y,z)投影。
                    // 但为了性能，直接重新计算全量顶点。我们保留了原始网格在w=wFixed的平面，现在根据旋转参数将每个点(u,v,wFixed)通过双旋转映射到新的三维坐标。
                    const uRange = RANGE;
                    const vRange = RANGE;
                    let vi = 0;
                    // 横向线 (v变化, u固定)
                    for (const u of uRange) {
                        for (let k = 1; k < vRange.length; k++) {
                            const v1 = vRange[k-1];
                            const v2 = vRange[k];
                            // 四维点 (u, v1, wFixed, 0) 经过旋转 R(alpha,beta) 作用在 (x,y) 和 (z,w) 平面？
                            // 我们定义双旋转：x-y平面旋转alpha，z-w平面旋转beta。
                            const z1 = wFixed;
                            const w1 = 0; // 第四个分量
                            // x = u*cosA - v1*sinA
                            // y = u*sinA + v1*cosA
                            // z = z1*cosB - w1*sinB = wFixed*cosB
                            // w_new = z1*sinB + w1*cosB = wFixed*sinB (忽略)
                            const x1 = u*cosA - v1*sinA;
                            const y1 = u*sinA + v1*cosA;
                            const zz1 = wFixed*cosB;

                            const x2 = u*cosA - v2*sinA;
                            const y2 = u*sinA + v2*cosA;
                            const zz2 = wFixed*cosB;

                            positions[vi] = x1; positions[vi+1] = y1; positions[vi+2] = zz1;
                            vi += 3;
                            positions[vi] = x2; positions[vi+1] = y2; positions[vi+2] = zz2;
                            vi += 3;
                        }
                    }
                    // 纵向线 (u变化, v固定)
                    for (const v of vRange) {
                        for (let k = 1; k < uRange.length; k++) {
                            const u1 = uRange[k-1];
                            const u2 = uRange[k];
                            const x1 = u1*cosA - v*sinA;
                            const y1 = u1*sinA + v*cosA;
                            const zz1 = wFixed*cosB;

                            const x2 = u2*cosA - v*sinA;
                            const y2 = u2*sinA + v*cosA;
                            const zz2 = wFixed*cosB;

                            positions[vi] = x1; positions[vi+1] = y1; positions[vi+2] = zz1;
                            vi += 3;
                            positions[vi] = x2; positions[vi+1] = y2; positions[vi+2] = zz2;
                            vi += 3;
                        }
                    }
                    geometry.attributes.position.needsUpdate = true;
                }

                updateSliceGeometry(slice1, 0.7, cosA, cosB);
                updateSliceGeometry(slice2, 0.0, cosA, cosB);
                updateSliceGeometry(slice3, -0.7, cosA, cosB);

                // 主组绕Y轴缓慢旋转，增加视角变化
                mainGroup.rotation.y += 0.003;
                mainGroup.rotation.x = Math.sin(time * 0.25) * 0.2;
                mainGroup.rotation.z = Math.cos(time * 0.2) * 0.15;

                // 框架微动
                frame.rotation.y += 0.001;
                frame.rotation.x += 0.0007;

                // 相机轻微游走
                const camX = 1.8 + Math.sin(time * 0.16) * 0.55;
                const camY = 1.3 + Math.cos(time * 0.2) * 0.45;
                const camZ = 7.2 + Math.sin(time * 0.12) * 0.5;
                camera.position.set(camX, camY, camZ);
                camera.lookAt(0, 0, 0);

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环出错:', e);
                // 即使出错也继续下一帧
            }
        }

        // ========== 窗口调整 ==========
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        // ========== 启动 ==========
        console.log('=== 四维超立方体截线 · 空间棱镜 ===');
        console.log('截面1顶点数(暖金):', slice1.children[0].geometry.attributes.position.count);
        console.log('截面2顶点数(冰蓝):', slice2.children[0].geometry.attributes.position.count);
        console.log('截面3顶点数(玫瑰粉):', slice3.children[0].geometry.attributes.position.count);
        console.log('网格步长:', GRID_STEP, '范围[-1,1]');
        console.log('✅ 初始帧渲染，启动健壮动画循环...');

        // 初始渲染
        renderer.render(scene, camera);
        // 使用requestAnimationFrame启动，确保稳定
        requestAnimationFrame(animate);
    </script>
</body>
</html>
