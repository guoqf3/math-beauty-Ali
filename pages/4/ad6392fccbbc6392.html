<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐律动动物园 · Groove Zoo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #141026 0%, #0a0818 55%, #03020a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8e2f5;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding: 22px;
    display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap;
  }
  .stage {
    flex: 1 1 580px; min-width: 300px;
    position: relative;
    aspect-ratio: 760 / 520;
    border-radius: 26px;
    overflow: hidden;
    background: #0a0818;
    box-shadow: 0 26px 60px -26px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(180, 140, 255, .16) inset;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  .sound-toggle {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    background: rgba(26, 18, 48, .85);
    color: #d0b8ff;
    box-shadow: 0 5px 16px -5px rgba(0, 0, 0, .9),
                0 0 0 1px rgba(180, 140, 255, .32) inset;
    transition: transform .12s;
    z-index: 3;
  }
  .sound-toggle:active { transform: scale(.92); }

  .beat-dots {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 3;
  }
  .beat-dots i {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,.18);
    transition: background .1s, transform .1s;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset;
  }

  .panel {
    flex: 0 1 352px; min-width: 292px;
    background: rgba(20, 14, 36, .78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 26px;
    padding: 22px 22px 18px;
    box-shadow: 0 26px 60px -28px rgba(0, 0, 0, .95),
                0 0 0 1px rgba(180, 140, 255, .14) inset;
    display: flex; flex-direction: column; gap: 13px;
  }
  h1 {
    font-size: 20px; margin: 0; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
    color: #f2ecff;
  }
  h1 .emoji { font-size: 23px; }

  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 14px; text-align: center;
    padding: 10px 10px; border-radius: 15px;
    background: linear-gradient(135deg, rgba(46, 30, 78, .92), rgba(28, 20, 52, .92));
    color: #c8b0ff;
    letter-spacing: .3px;
    box-shadow: 0 0 0 1px rgba(180, 140, 255, .22) inset;
    line-height: 1.7;
  }
  .formula b { color: #ffd88a; font-weight: 700; }
  .formula .note { font-size: 11.5px; color: #8f7ec4; letter-spacing: .2px; }

  .songs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .song {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 11px; border: none; border-radius: 13px;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; letter-spacing: .2px;
    background: rgba(34, 24, 62, .95);
    color: #9d8ec9;
    box-shadow: 0 0 0 1.4px rgba(140, 110, 230, .22) inset;
    transition: all .16s;
    text-align: left;
  }
  .song .se { font-size: 16px; line-height: 1; }
  .song .sn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song:hover { background: rgba(44, 32, 78, .95); }
  .song.on {
    background: linear-gradient(180deg, #8b6ce8, #6844d0);
    color: #fff;
    box-shadow: 0 7px 18px -8px rgba(140, 110, 240, .95),
                0 0 0 1.4px rgba(210, 190, 255, .5) inset;
  }

  .readout {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
    padding: 11px 13px; border-radius: 15px;
    background: rgba(26, 18, 46, .92);
    box-shadow: 0 0 0 1px rgba(180, 140, 255, .16) inset;
    font-size: 12.5px;
  }
  .readout .k { color: #7d6ea8; font-weight: 700; }
  .readout .v {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    color: #c8a8ff; font-weight: 700; font-size: 13px;
    text-align: right;
  }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    color: #9484c0;
  }
  .field .val {
    color: #c8a8ff; font-variant-numeric: tabular-nums; font-size: 13.5px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #45306f, #a078f0);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: #140c26; border: 3.5px solid #a078f0;
    box-shadow: 0 0 12px rgba(170, 130, 250, .7);
    transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #140c26; border: 3.5px solid #a078f0;
    box-shadow: 0 0 12px rgba(170, 130, 250, .7);
  }
  input[type=range]::-moz-range-track {
    height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #45306f, #a078f0);
  }

  .btns { display: flex; gap: 10px; }
  button.main {
    flex: 1; padding: 12px 8px; border: none; border-radius: 14px;
    font-size: 14.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: .4px;
    background: linear-gradient(180deg, #9b6cf6, #6d40d8);
    color: #fff;
    box-shadow: 0 7px 20px -8px rgba(150, 100, 250, .95);
    transition: transform .12s, filter .12s;
  }
  button.main:hover { filter: brightness(1.08); }
  button.main:active { transform: translateY(2px) scale(.98); }
  button.main.playing {
    background: linear-gradient(180deg, #4ade80, #16a34a);
    color: #04200e;
    box-shadow: 0 7px 20px -8px rgba(70, 220, 130, .95);
  }
  button.main.ghost {
    flex: 0 0 auto; padding: 12px 18px;
    background: rgba(34, 24, 62, .95);
    color: #c8a8ff;
    box-shadow: 0 5px 14px -8px rgba(0, 0, 0, .9),
                0 0 0 1.5px rgba(180, 140, 255, .26) inset;
  }

  .hint {
    margin: 0; font-size: 12.5px; line-height: 1.7; color: #6f629a;
    text-align: center;
  }
  .hint kbd {
    background: rgba(40, 28, 72, .9); border-radius: 5px; padding: 1px 6px;
    font-family: inherit; font-size: 11.5px; color: #c8a8ff;
    box-shadow: 0 0 0 1px rgba(180, 140, 255, .24) inset;
  }
  @media (max-width: 740px) {
    .wrap { padding: 14px; gap: 16px; }
    .panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
    <div class="beat-dots" id="beatDots"></div>
  </div>

  <div class="panel">
    <h1><span class="emoji">🐾</span> 音乐律动动物园</h1>

    <div class="formula">
      动物姿态 = <b>f</b><sub>i</sub>(节拍相位 · 各自函数)<br>
      <span class="note">狮子踏步 | 大象甩鼻 | 猴子跳跃 | 小鸟展翅</span>
    </div>

    <div class="songs" id="songs"></div>

    <div class="readout">
      <span class="k">当前乐曲</span><span class="v" id="roSong">森林晨曲</span>
      <span class="k">速度</span><span class="v" id="roBpm">96 BPM</span>
      <span class="k">节拍相位</span><span class="v" id="roPhase">0.00</span>
      <span class="k">能量</span><span class="v" id="roEnergy">0%</span>
    </div>

    <div class="field">
      <div class="row"><span>整体律动幅度</span><span class="val" id="ampVal">100%</span></div>
      <input type="range" id="ampRange" min="0" max="100" step="1" value="100">
    </div>

    <div class="field">
      <div class="row"><span>节奏偏移</span><span class="val" id="swVal">0%</span></div>
      <input type="range" id="swRange" min="0" max="100" step="1" value="0">
    </div>

    <div class="btns">
      <button class="main" id="btnPlay">▶ 播放</button>
      <button class="main ghost" id="btnReset">重置</button>
    </div>

    <p class="hint">
      切换乐曲看动物们如何改变舞步 · <kbd>点击画面</kbd> 全体欢呼跳跃<br>
      观察每只动物的动作都锁定在同一个节拍相位上
    </p>

  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     常量
  ============================================================ */
  const W = 760, H = 520;
  const TAU = Math.PI * 2;
  const GROUND = 440;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  let KX = 1, KY = 1;

  function resizeCanvas() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.max(1, Math.round(rect.width  * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
    KX = cv.width / W;
    KY = cv.height / H;
  }
  window.addEventListener('resize', resizeCanvas);

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') {
      ctx.roundRect(x, y, w, h, r);
    } else {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  }

  /* ============================================================
     音频引擎
  ============================================================ */
  let ac = null, master = null, noiseBuf = null;
  let muted = false;

  function initAudio() {
    if (ac) {
      if (ac.state === 'suspended') ac.resume();
      return ac;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.75;

    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 4;

    master.connect(comp);
    comp.connect(ac.destination);
    return ac;
  }

  function getNoise() {
    if (noiseBuf) return noiseBuf;
    const len = Math.floor(ac.sampleRate * 0.5);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  function sKick(t, vol) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(165, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.36);
  }

  function sSnare(t, vol) {
    const src = ac.createBufferSource();
    src.buffer = getNoise();
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1900;
    bp.Q.value = 0.85;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t + 0.2);

    const o = ac.createOscillator();
    const g2 = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(215, t);
    g2.gain.setValueAtTime(vol * 0.42, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g2); g2.connect(master);
    o.start(t); o.stop(t + 0.13);
  }

  function sHat(t, vol, open) {
    const src = ac.createBufferSource();
    src.buffer = getNoise();
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 8200;
    const g = ac.createGain();
    const dur = open ? 0.14 : 0.045;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(hp); hp.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  function sNote(freq, t, dur, type, vol) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  /* ============================================================
     乐曲
  ============================================================ */
  const SONGS = [
    {
      id: 'forest', name: '森林晨曲', emoji: '🌲', bpm: 96,
      kick:  [1,0,0,0, 1,0,0,0],
      snare: [0,0,1,0, 0,0,1,0],
      hat:   [1,0,1,0, 1,0,1,1],
      bass:  [130.81,0,0,0, 146.83,0,0,0],
      mel:   [523.25, 587.33, 659.25, 587.33, 523.25, 783.99, 659.25, 587.33],
      sky:   ['#0a2620', '#123a30', '#08131a'],
      glow:  '#4ade80',
      ground:'#12301f',
      wave:  1.0
    },
    {
      id: 'desert', name: '沙漠热浪', emoji: '🏜️', bpm: 128,
      kick:  [1,0,0,1, 0,0,1,0],
      snare: [0,0,1,0, 0,0,1,0],
      hat:   [1,1,1,1, 1,1,1,1],
      bass:  [110, 0, 110, 0, 130.81, 0, 130.81, 0],
      mel:   [440, 523.25, 587.33, 523.25, 440, 587.33, 698.46, 587.33],
      sky:   ['#3a1a0a', '#4a2410', '#1e0d04'],
      glow:  '#fb923c',
      ground:'#3a2210',
      wave:  1.4
    },
    {
      id: 'ocean', name: '海洋摇篮', emoji: '🌊', bpm: 72,
      kick:  [1,0,0,0, 0,0,0,0],
      snare: [0,0,0,0, 1,0,0,0],
      hat:   [0,0,1,0, 0,0,1,0],
      bass:  [87.31, 0, 0, 0, 98, 0, 0, 0],
      mel:   [349.23, 440, 523.25, 440, 392, 523.25, 659.25, 523.25],
      sky:   ['#0a1a3a', '#122a4a', '#050c18'],
      glow:  '#38bdf8',
      ground:'#0c1e38',
      wave:  0.65
    },
    {
      id: 'carnival', name: '狂欢节', emoji: '🎉', bpm: 150,
      kick:  [1,0,1,0, 1,0,1,0],
      snare: [0,0,1,1, 0,0,1,1],
      hat:   [1,1,1,1, 1,1,1,1],
      bass:  [146.83,0,146.83,0, 164.81,0,164.81,0],
      mel:   [587.33, 698.46, 783.99, 880, 783.99, 698.46, 587.33, 659.25],
      sky:   ['#2a0a3a', '#3a104a', '#160420'],
      glow:  '#e879f9',
      ground:'#28103c',
      wave:  1.7
    }
  ];

  /* ============================================================
     状态
  ============================================================ */
  const S = {
    playing: false,
    songIndex: 0,
    mBeat: 0,          // 音乐拍数
    idlePhase: 0,      // 暂停时的空闲相位
    playStartTime: 0,
    amp: 1.0,
    swing: 0.0,
    pulse: 0,
    glow: 0,
    cheer: 0,          // 点击欢呼
    step: 0
  };

  let stepIdx = 0;
  let nextStepTime = 0;
  let stepDur = 0.25;
  let lastBeatFloor = 0;

  function song() { return SONGS[S.songIndex]; }

  /* ============================================================
     调度器
  ============================================================ */
  function scheduleStep(i, t, sg) {
    if (sg.kick[i]) sKick(t, 0.85);
    if (sg.snare[i]) sSnare(t, 0.32);
    if (sg.hat[i]) sHat(t, 0.10, i % 4 === 3);

    const b = sg.bass[i];
    if (b) sNote(b, t, stepDur * 1.5, 'sawtooth', 0.16);

    const m = sg.mel[i];
    if (m) {
      sNote(m, t, stepDur * 1.1, 'triangle', 0.085);
      sNote(m * 2, t, stepDur * 0.5, 'sine', 0.022);
    }
  }

  function scheduler() {
    if (!S.playing || !ac) return;
    const sg = song();
    const now = ac.currentTime;
    let guard = 0;
    while (nextStepTime < now + 0.13 && guard < 32) {
      scheduleStep(stepIdx, nextStepTime, sg);
      nextStepTime += stepDur;
      stepIdx = (stepIdx + 1) % 8;
      guard++;
    }
  }

  function startMusic() {
    initAudio();
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();

    const sg = song();
    stepDur = 60 / sg.bpm / 2;
    S.playStartTime = ac.currentTime - S.mBeat * 60 / sg.bpm;

    stepIdx = Math.ceil(S.mBeat * 2) % 8;
    nextStepTime = ac.currentTime + 0.06;
    S.playing = true;
    lastBeatFloor = Math.floor(S.mBeat);
  }

  function stopMusic() {
    S.playing = false;
  }

  /* ============================================================
     更新
  ============================================================ */
  function update(dt) {
    if (S.playing && ac) {
      const sg = song();
      S.mBeat = (ac.currentTime - S.playStartTime) * sg.bpm / 60;
      if (S.mBeat < 0) S.mBeat = 0;

      // 节拍事件
      const fl = Math.floor(S.mBeat);
      if (fl > lastBeatFloor) {
        lastBeatFloor = fl;
        S.glow = 1;
      }
      S.step = Math.floor(S.mBeat * 2) % 8;
    } else {
      S.idlePhase += dt * 0.75;
      S.step = -1;
    }

    // 节拍相位
    const beat = S.playing ? S.mBeat : S.idlePhase;
    const beatPhase = beat - Math.floor(beat);

    // 节拍脉冲（在拍点处最强，随后衰减）
    const rawPulse = Math.exp(-beatPhase * 4.6);
    S.pulse += (rawPulse - S.pulse) * Math.min(1, dt * 22);
    S.glow *= Math.exp(-dt * 3.6);
    S.cheer *= Math.exp(-dt * 2.4);

    // 更新节拍点 UI
    updateBeatDots();
  }

  /* ============================================================
     节拍点 UI
  ============================================================ */
  const beatDotsEl = document.getElementById('beatDots');
  const dotEls = [];
  for (let i = 0; i < 8; i++) {
    const d = document.createElement('i');
    beatDotsEl.appendChild(d);
    dotEls.push(d);
  }

  function updateBeatDots() {
    const sg = song();
    for (let i = 0; i < 8; i++) {
      const d = dotEls[i];
      const active = (S.step === i);
      const hasHit = sg.kick[i] || sg.snare[i];
      if (active) {
        d.style.background = sg.glow;
        d.style.transform = 'scale(1.5)';
        d.style.boxShadow = '0 0 10px ' + sg.glow;
      } else {
        d.style.background = hasHit ? 'rgba(255,255,255,0.30)' : 'rgba(255,255,255,0.13)';
        d.style.transform = 'scale(1)';
        d.style.boxShadow = 'none';
      }
    }
  }

  /* ============================================================
     绘制：背景
  ============================================================ */
  function drawBg(beat, pulse) {
    const sg = song();

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, sg.sky[0]);
    g.addColorStop(0.55, sg.sky[1]);
    g.addColorStop(1, sg.sky[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 节拍光晕
    const glowA = (0.06 + pulse * 0.16) * S.amp;
    const rg = ctx.createRadialGradient(W / 2, GROUND - 90, 30, W / 2, GROUND - 90, 420);
    rg.addColorStop(0, hexA(sg.glow, glowA));
    rg.addColorStop(0.5, hexA(sg.glow, glowA * 0.28));
    rg.addColorStop(1, hexA(sg.glow, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    // 舞台聚光灯
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const lx = 110 + i * 135;
      const swing = Math.sin(beat * 0.9 + i * 1.2) * 34;
      const lg = ctx.createLinearGradient(lx, 0, lx + swing, GROUND);
      lg.addColorStop(0, hexA(sg.glow, 0.055 + pulse * 0.05));
      lg.addColorStop(1, hexA(sg.glow, 0));
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(lx - 42, -10);
      ctx.lineTo(lx + 42, -10);
      ctx.lineTo(lx + swing + 128, GROUND + 30);
      ctx.lineTo(lx + swing - 128, GROUND + 30);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // 远处山丘
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 26) {
      const y = GROUND - 60 - Math.sin(x * 0.009 + 0.6) * 34
                          - Math.sin(x * 0.021 + 2.2) * 14;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND + 6);
    ctx.lineTo(0, GROUND + 6);
    ctx.closePath();
    ctx.fillStyle = hexA(sg.ground, 0.55);
    ctx.fill();

    // 地面舞台
    const gg = ctx.createLinearGradient(0, GROUND - 10, 0, H);
    gg.addColorStop(0, hexA(sg.ground, 0.92));
    gg.addColorStop(0.4, hexA(sg.ground, 0.72));
    gg.addColorStop(1, hexA(sg.sky[2], 0.95));
    ctx.fillStyle = gg;
    ctx.fillRect(0, GROUND - 6, W, H - GROUND + 6);

    // 地面亮边
    ctx.beginPath();
    ctx.moveTo(0, GROUND - 6);
    ctx.lineTo(W, GROUND - 6);
    ctx.strokeStyle = hexA(sg.glow, 0.20 + pulse * 0.28);
    ctx.lineWidth = 2;
    ctx.stroke();

    // 地砖分割线（透视）
    ctx.strokeStyle = hexA(sg.glow, 0.08 + pulse * 0.06);
    ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
      const x = i * 70 + 10;
      ctx.beginPath();
      ctx.moveTo(x, GROUND - 6);
      ctx.lineTo(x + (x - W / 2) * 0.34, H);
      ctx.stroke();
    }
  }

  function hexA(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substr(0, 2), 16);
    const g = parseInt(h.substr(2, 2), 16);
    const b = parseInt(h.substr(4, 2), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  /* ============================================================
     阴影
  ============================================================ */
  function shadow(x, y, w, h, a) {
    ctx.beginPath();
    ctx.ellipse(x, y, w, h, 0, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
    ctx.fill();
  }

  /* ============================================================
     动物 1 · 狮子（踏步）
  ============================================================ */
  function drawLion(x, y, beat, pulse) {
    const bounce = -pulse * 5 * S.amp;
    const L = Math.sin(beat * TAU);

    ctx.save();
    ctx.translate(x, y + bounce);

    // 尾巴
    const tw = Math.sin(beat * TAU) * 0.5;
    ctx.beginPath();
    ctx.moveTo(-36, -44);
    ctx.quadraticCurveTo(-64, -56, -58, -82 + tw * 14);
    ctx.strokeStyle = '#c9822a';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-58, -82 + tw * 14, 6, 0, TAU);
    ctx.fillStyle = '#8b4a14';
    ctx.fill();

    // 后腿
    leg(-26 + L * 5, -42, 0, 11, '#c9822a');
    // 前腿
    leg(26 - L * 5, -42, 0, 12, '#e0a03a');

    // 身体
    ctx.beginPath();
    ctx.ellipse(0, -58, 44, 27, 0, 0, TAU);
    const bg = ctx.createLinearGradient(0, -85, 0, -31);
    bg.addColorStop(0, '#f0b84c');
    bg.addColorStop(1, '#d18a28');
    ctx.fillStyle = bg;
    ctx.fill();

    // 肚子
    ctx.beginPath();
    ctx.ellipse(6, -46, 30, 14, 0, 0, TAU);
    ctx.fillStyle = '#f8dca0';
    ctx.fill();

    // 鬃毛
    const mx = 46, my = -76;
    ctx.beginPath();
    for (let i = 0; i < 15; i++) {
      const a = i / 15 * TAU - Math.PI / 2;
      const rr = 25 + Math.sin(i * 2.1) * 4 + pulse * 2.5 * S.amp;
      const px = mx + Math.cos(a) * rr;
      const py = my + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#a85e1a';
    ctx.fill();

    // 脸
    ctx.beginPath();
    ctx.arc(mx, my, 17, 0, TAU);
    const fg = ctx.createRadialGradient(mx - 5, my - 6, 3, mx, my, 20);
    fg.addColorStop(0, '#ffd782');
    fg.addColorStop(1, '#e8b04a');
    ctx.fillStyle = fg;
    ctx.fill();

    // 耳朵
    ctx.beginPath();
    ctx.arc(mx - 12, my - 13, 5.5, 0, TAU);
    ctx.arc(mx + 12, my - 13, 5.5, 0, TAU);
    ctx.fillStyle = '#c07a20';
    ctx.fill();

    // 眼睛
    const blink = 1;
    ctx.beginPath();
    ctx.arc(mx - 6, my - 3, 3.2, 0, TAU);
    ctx.arc(mx + 6, my - 3, 3.2, 0, TAU);
    ctx.fillStyle = '#2a1a08';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(mx - 7, my - 4.4, 1.3, 0, TAU);
    ctx.arc(mx + 5, my - 4.4, 1.3, 0, TAU);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // 鼻子
    ctx.beginPath();
    ctx.moveTo(mx, my + 3);
    ctx.lineTo(mx - 3.4, my + 6.5);
    ctx.lineTo(mx + 3.4, my + 6.5);
    ctx.closePath();
    ctx.fillStyle = '#8b4513';
    ctx.fill();

    // 嘴
    ctx.beginPath();
    ctx.arc(mx, my + 7, 5, 0.18 * Math.PI, 0.82 * Math.PI);
    ctx.strokeStyle = '#8b4513';
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.restore();

    function leg(lx, top, bot, w, c) {
      ctx.fillStyle = c;
      rrect(lx - w / 2, top, w, bot - top, w / 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(lx, bot, w * 0.62, 0, TAU);
      ctx.fillStyle = '#a86820';
      ctx.fill();
    }
  }

  /* ============================================================
     动物 2 · 大象（甩鼻）
  ============================================================ */
  function drawElephant(x, y, beat, pulse) {
    const bounce = -pulse * 3 * S.amp;
    const sway = Math.sin(beat * Math.PI);
    const trunkSway = Math.sin(beat * TAU) * 1.1 * S.amp;
    const earFlap = Math.sin(beat * TAU + 0.8) * 0.14 * S.amp;

    ctx.save();
    ctx.translate(x, y + bounce);

    // 后腿
    pillar(-44, -74, 20, '#7d7d94');
    pillar(-14, -74, 20, '#8888a0');

    // 身体
    ctx.beginPath();
    ctx.ellipse(-10, -98, 58, 47, 0, 0, TAU);
    const bg = ctx.createLinearGradient(0, -145, 0, -51);
    bg.addColorStop(0, '#b4b4c8');
    bg.addColorStop(1, '#84849c');
    ctx.fillStyle = bg;
    ctx.fill();

    // 前腿
    pillar(22, -74, 22, '#9090a8');
    pillar(52, -74, 22, '#9c9cb4');

    // 耳朵
    ctx.save();
    ctx.translate(44, -120);
    ctx.rotate(earFlap);
    ctx.beginPath();
    ctx.ellipse(0, 0, 27, 33, 0, 0, TAU);
    ctx.fillStyle = '#9a9ab0';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(5, 4, 18, 22, 0, 0, TAU);
    ctx.fillStyle = '#c2a8b8';
    ctx.fill();
    ctx.restore();

    // 头
    ctx.beginPath();
    ctx.ellipse(56, -116, 33, 35, 0, 0, TAU);
    const hg = ctx.createRadialGradient(46, -128, 6, 56, -116, 40);
    hg.addColorStop(0, '#c4c4d6');
    hg.addColorStop(1, '#9494ac');
    ctx.fillStyle = hg;
    ctx.fill();

    // 象鼻（正弦摆动）
    const tx = 76 + trunkSway * 26;
    const ty = -8;
    ctx.beginPath();
    ctx.moveTo(76, -108);
    ctx.bezierCurveTo(
      96 + trunkSway * 14, -80,
      96 + trunkSway * 30, -40,
      tx, ty
    );
    ctx.strokeStyle = '#9494ac';
    ctx.lineWidth = 17;
    ctx.lineCap = 'round';
    ctx.stroke();

    // 鼻尖
    ctx.beginPath();
    ctx.arc(tx, ty, 8.4, 0, TAU);
    ctx.fillStyle = '#8c8ca4';
    ctx.fill();
    // 鼻孔
    ctx.beginPath();
    ctx.arc(tx - 2.6, ty + 1.4, 1.8, 0, TAU);
    ctx.arc(tx + 2.6, ty + 1.4, 1.8, 0, TAU);
    ctx.fillStyle = '#4a4a5e';
    ctx.fill();

    // 象牙
    ctx.beginPath();
    ctx.moveTo(72, -98);
    ctx.quadraticCurveTo(90, -90, 94, -74);
    ctx.strokeStyle = '#f2ecdc';
    ctx.lineWidth = 4.2;
    ctx.lineCap = 'round';
    ctx.stroke();

    // 眼睛
    ctx.beginPath();
    ctx.arc(66, -124, 4.8, 0, TAU);
    ctx.fillStyle = '#2a2a3c';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(64.4, -125.6, 1.7, 0, TAU);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // 腮红
    ctx.beginPath();
    ctx.ellipse(48, -108, 8, 5, 0.3, 0, TAU);
    ctx.fillStyle = 'rgba(230, 150, 170, 0.30)';
    ctx.fill();

    ctx.restore();

    function pillar(lx, top, w, c) {
      ctx.fillStyle = c;
      rrect(lx - w / 2, top, w, -top - 4, w / 2.2);
      ctx.fill();
    }
  }

  /* ============================================================
     动物 3 · 猴子（跳跃抛物线）
  ============================================================ */
  function drawMonkey(x, y, beat, pulse) {
    // 每 2 拍跳一次的抛物线
    const cyc = (beat / 2) % 1;
    const jumpY = -4 * 52 * cyc * (1 - cyc) * S.amp;

    const squash = 1 - Math.max(0, 1 - cyc * 6) * 0.14 * S.amp;

    ctx.save();
    ctx.translate(x, y + jumpY);
    ctx.scale(1 / squash, squash);

    // 尾巴
    const tw = Math.sin(beat * TAU) * 0.5;
    ctx.beginPath();
    ctx.moveTo(-14, -34);
    ctx.bezierCurveTo(-44, -44 + tw * 10, -40, -78 + tw * 14, -16, -80 + tw * 16);
    ctx.strokeStyle = '#8b5a2b';
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.stroke();

    // 腿
    ctx.beginPath();
    ctx.moveTo(-7, -34);
    ctx.lineTo(-11 + tw * 4, 0);
    ctx.moveTo(7, -34);
    ctx.lineTo(11 - tw * 4, 0);
    ctx.strokeStyle = '#a06a35';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();
    // 脚
    ctx.beginPath();
    ctx.arc(-11 + tw * 4, 0, 4.5, 0, TAU);
    ctx.arc(11 - tw * 4, 0, 4.5, 0, TAU);
    ctx.fillStyle = '#8b5a2b';
    ctx.fill();

    // 身体
    ctx.beginPath();
    ctx.ellipse(0, -48, 17, 21, 0, 0, TAU);
    ctx.fillStyle = '#b87a40';
    ctx.fill();
    // 肚子
    ctx.beginPath();
    ctx.ellipse(2, -46, 11, 15, 0, 0, TAU);
    ctx.fillStyle = '#e0b880';
    ctx.fill();

    // 手臂
    const armSwing = Math.sin(beat * TAU) * 9;
    ctx.beginPath();
    ctx.moveTo(-12, -60);
    ctx.lineTo(-22, -38 + armSwing);
    ctx.moveTo(12, -60);
    ctx.lineTo(22, -38 - armSwing);
    ctx.strokeStyle = '#a06a35';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-22, -38 + armSwing, 4, 0, TAU);
    ctx.arc(22, -38 - armSwing, 4, 0, TAU);
    ctx.fillStyle = '#8b5a2b';
    ctx.fill();

    // 头
    ctx.beginPath();
    ctx.arc(0, -78, 15, 0, TAU);
    ctx.fillStyle = '#b87a40';
    ctx.fill();
    // 脸
    ctx.beginPath();
    ctx.ellipse(0, -74, 11.5, 10.5, 0, 0, TAU);
    ctx.fillStyle = '#e8c090';
    ctx.fill();

    // 耳朵
    ctx.beginPath();
    ctx.arc(-13.5, -82, 5.2, 0, TAU);
    ctx.arc(13.5, -82, 5.2, 0, TAU);
    ctx.fillStyle = '#a06a35';
    ctx.fill();

    // 眼睛
    ctx.beginPath();
    ctx.arc(-4.8, -80, 2.9, 0, TAU);
    ctx.arc(4.8, -80, 2.9, 0, TAU);
    ctx.fillStyle = '#2a1a10';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-5.8, -81, 1.1, 0, TAU);
    ctx.arc(3.8, -81, 1.1, 0, TAU);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // 嘴（随节拍微笑）
    ctx.beginPath();
    ctx.arc(0, -72, 4, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = '#6a3a1a';
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.restore();
  }

  /* ============================================================
     动物 4 · 小鸟（展翅）
  ============================================================ */
  function drawBird(x, y, beat, pulse) {
    const hover = Math.sin(beat * 0.6 * Math.PI) * 9;
    const flap = Math.sin(beat * TAU) * 0.85 * S.amp;
    const tilt = Math.sin(beat * 0.5 * Math.PI) * 0.09;

    ctx.save();
    ctx.translate(x, y + hover);
    ctx.rotate(tilt);

    // 尾巴
    ctx.beginPath();
    ctx.moveTo(-16, 3);
    ctx.lineTo(-40, -6);
    ctx.lineTo(-38, 10);
    ctx.closePath();
    ctx.fillStyle = '#d94a4a';
    ctx.fill();

    // 后翅
    ctx.save();
    ctx.translate(-2, -3);
    ctx.rotate(-flap * 0.75);
    ctx.beginPath();
    ctx.ellipse(-10, 0, 22, 9, -0.32, 0, TAU);
    ctx.fillStyle = 'rgba(190, 60, 60, 0.85)';
    ctx.fill();
    ctx.restore();

    // 身体
    ctx.beginPath();
    ctx.ellipse(0, 0, 21, 14, 0, 0, TAU);
    const bg = ctx.createLinearGradient(0, -14, 0, 14);
    bg.addColorStop(0, '#ff9a78');
    bg.addColorStop(1, '#e05a3a');
    ctx.fillStyle = bg;
    ctx.fill();

    // 胸口
    ctx.beginPath();
    ctx.ellipse(4, 5, 14, 8, 0, 0, TAU);
    ctx.fillStyle = 'rgba(255, 220, 180, 0.65)';
    ctx.fill();

    // 前翅
    ctx.save();
    ctx.translate(2, -5);
    ctx.rotate(flap);
    ctx.beginPath();
    ctx.ellipse(-12, 0, 26, 10, -0.36, 0, TAU);
    const wg = ctx.createLinearGradient(-30, -8, 8, 8);
    wg.addColorStop(0, '#ffb09a');
    wg.addColorStop(1, '#ff7a5a');
    ctx.fillStyle = wg;
    ctx.fill();
    // 羽毛线
    ctx.strokeStyle = 'rgba(255, 200, 180, 0.55)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-18 + i * 8, -4);
      ctx.lineTo(-22 + i * 8, 5);
      ctx.stroke();
    }
    ctx.restore();

    // 头
    ctx.beginPath();
    ctx.arc(17, -11, 10.5, 0, TAU);
    ctx.fillStyle = '#ff9a7a';
    ctx.fill();

    // 喙
    ctx.beginPath();
    ctx.moveTo(25, -13);
    ctx.lineTo(36, -9.5);
    ctx.lineTo(25, -6);
    ctx.closePath();
    ctx.fillStyle = '#ffd166';
    ctx.fill();

    // 眼睛
    ctx.beginPath();
    ctx.arc(20, -13, 3.4, 0, TAU);
    ctx.fillStyle = '#2a1a1a';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(18.8, -14.4, 1.3, 0, TAU);
    ctx.fillStyle = '#fff';
    ctx.fill();

    ctx.restore();
  }

  /* ============================================================
     绘制：欢呼粒子
  ============================================================ */
  const cheers = [];
  function spawnCheers(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const sp = 60 + Math.random() * 180;
      cheers.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        life: 1,
        max: 1,
        r: 2 + Math.random() * 4,
        hue: Math.random() * 360
      });
    }
  }

  function updateCheers(dt) {
    for (let i = cheers.length - 1; i >= 0; i--) {
      const c = cheers[i];
      c.life -= dt * 0.9;
      if (c.life <= 0) { cheers.splice(i, 1); continue; }
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.vy += 320 * dt;
      c.vx *= Math.exp(-dt * 1.4);
    }
  }

  function drawCheers() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < cheers.length; i++) {
      const c = cheers[i];
      const a = Math.max(0, c.life) * 0.85;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r * (0.5 + c.life * 0.8), 0, TAU);
      ctx.fillStyle = 'hsla(' + c.hue + ', 90%, 68%, ' + a + ')';
      ctx.fill();
    }
    ctx.restore();
  }

  /* ============================================================
     渲染
  ============================================================ */
  function render(dt) {
    ctx.setTransform(KX, 0, 0, KY, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const beat = S.playing ? S.mBeat : S.idlePhase;
    const pulse = S.pulse;

    drawBg(beat, pulse);

    // 阴影
    const sg = song();
    shadow(120, GROUND + 6, 56, 12, 0.32);
    shadow(330, GROUND + 6, 68, 14, 0.32);
    shadow(520, GROUND + 6, 26, 8, 0.28);
    shadow(660, 402, 30, 9, 0.14);

    // 动物（按 y 层次）
    drawLion(120, GROUND, beat, pulse);
    drawElephant(330, GROUND, beat, pulse);
    drawMonkey(520, GROUND, beat, pulse);
    drawBird(660, 178, beat, pulse);

    // 欢呼粒子
    updateCheers(dt);
    drawCheers();

    // 底部氛围光
    const fog = ctx.createLinearGradient(0, H - 110, 0, H);
    fog.addColorStop(0, 'rgba(0,0,0,0)');
    fog.addColorStop(1, hexA(sg.glow, 0.10));
    ctx.fillStyle = fog;
    ctx.fillRect(0, H - 110, W, 110);

    // HUD
    drawHud(beat, pulse);
  }

  function drawHud(beat, pulse) {
    const sg = song();
    ctx.font = '600 12.5px -apple-system, "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(sg.glow, 0.60);

    const bp = beat - Math.floor(beat);
    ctx.fillText(
      sg.emoji + ' ' + sg.name + '　·　' + sg.bpm + ' BPM　·　节拍 ' + (Math.floor(beat) + 1),
      24, 34
    );

    // 节拍脉冲条
    const bx = 24, by = 48, bw = 160;
    ctx.beginPath();
    ctx.rect(bx, by, bw, 5);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fill();

    ctx.beginPath();
    ctx.rect(bx, by, bw * bp, 5);
    ctx.fillStyle = hexA(sg.glow, 0.85);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(bx + bw * bp, by + 2.5, 4.2 * (1 + pulse * 0.5), 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // 状态
    ctx.fillStyle = hexA(sg.glow, 0.45);
    ctx.fillText(S.playing ? '▶ 演出中' : '⏸ 已暂停', 24, 76);
  }

  /* ============================================================
     主循环
  ============================================================ */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    scheduler();
    update(dt);
    render(dt);

    requestAnimationFrame(loop);
  }

  /* ============================================================
     UI
  ============================================================ */
  const songsEl = document.getElementById('songs');
  const songBtns = [];

  SONGS.forEach(function (sg, i) {
    const b = document.createElement('button');
    b.className = 'song';
    b.innerHTML = '<span class="se">' + sg.emoji + '</span>' +
                  '<span class="sn">' + sg.name + '</span>';
    b.addEventListener('click', function () {
      if (S.songIndex === i) return;
      S.songIndex = i;
      S.mBeat = 0;
      lastBeatFloor = 0;
      syncSongUI();

      if (S.playing) {
        startMusic();
      } else {
        // 试听一下鼓点
        initAudio();
        if (ac && !muted) {
          const t = ac.currentTime;
          sKick(t, 0.8);
          sKick(t + 0.28, 0.7);
          sNote(SONGS[i].mel[0], t + 0.14, 0.3, 'triangle', 0.08);
        }
      }
    });
    songsEl.appendChild(b);
    songBtns.push(b);
  });

  function syncSongUI() {
    songBtns.forEach(function (b, i) {
      b.classList.toggle('on', i === S.songIndex);
    });
    const sg = song();
    document.getElementById('roSong').textContent = sg.name;
    document.getElementById('roBpm').textContent = sg.bpm + ' BPM';
  }

  const btnPlay = document.getElementById('btnPlay');

  btnPlay.addEventListener('click', function () {
    initAudio();
    if (!ac) return;

    if (S.playing) {
      stopMusic();
      btnPlay.textContent = '▶ 播放';
      btnPlay.classList.remove('playing');
    } else {
      startMusic();
      btnPlay.textContent = '⏸ 暂停';
      btnPlay.classList.add('playing');
    }
  });

  const ampRange = document.getElementById('ampRange');
  const swRange = document.getElementById('swRange');
  const ampVal = document.getElementById('ampVal');
  const swVal = document.getElementById('swVal');

  ampRange.addEventListener('input', function () {
    S.amp = +this.value / 100;
    ampVal.textContent = Math.round(S.amp * 100) + '%';
  });

  swRange.addEventListener('input', function () {
    S.swing = +this.value / 100;
    swVal.textContent = Math.round(S.swing * 100) + '%';
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    initAudio();
    S.songIndex = 0;
    S.mBeat = 0;
    S.idlePhase = 0;
    S.amp = 1.0;
    S.swing = 0;
    lastBeatFloor = 0;

    ampRange.value = 100;
    swRange.value = 0;
    ampVal.textContent = '100%';
    swVal.textContent = '0%';

    syncSongUI();

    if (S.playing) startMusic();

    if (ac && !muted) {
      const t = ac.currentTime;
      [392, 523.25, 659.25, 783.99].forEach(function (f, i) {
        sNote(f, t + i * 0.07, 0.4, 'triangle', 0.06 - i * 0.008);
      });
    }
  });

  /* ---------- 点击画面：全体欢呼跳跃 ---------- */
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    initAudio();

    const rect = cv.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width * W;
    const my = (e.clientY - rect.top) / rect.height * H;

    S.cheer = 1;
    S.glow = 1;

    spawnCheers(mx, my, 34);

    if (ac && !muted) {
      const t = ac.currentTime;
      sKick(t, 0.9);
      sHat(t + 0.02, 0.14, true);
      const sg = song();
      const pick = sg.mel;
      for (let i = 0; i < 5; i++) {
        const f = pick[i % pick.length] * (i > 2 ? 2 : 1);
        sNote(f, t + 0.05 + i * 0.055, 0.28, 'triangle', 0.06 - i * 0.008);
      }
    }
  });

  /* ---------- 音效开关 ---------- */
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function () {
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    if (master) {
      master.gain.value = muted ? 0 : 0.75;
    }
    if (!muted) {
      initAudio();
      if (ac) {
        const t = ac.currentTime;
        sNote(880, t, 0.2, 'sine', 0.05);
        sNote(1174.66, t + 0.08, 0.22, 'sine', 0.04);
      }
    }
  });

  /* ============================================================
     启动
  ============================================================ */
  resizeCanvas();
  syncSongUI();

  // 试着预建一次音频（用户首次交互后才会真正启动）
  document.addEventListener('pointerdown', function once() {
    initAudio();
    document.removeEventListener('pointerdown', once);
  });

  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
