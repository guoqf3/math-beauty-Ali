<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>朗缪尔等温吸附 · 单分子层表面覆盖</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#010006;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;}
  canvas{position:fixed;inset:0;display:block;}
  .hud{position:fixed;inset:0;pointer-events:none;}

  .epigraph{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    font-family:"Songti SC","STSong",serif;
    font-size:clamp(12px,1.35vw,19px);
    letter-spacing:.16em;white-space:nowrap;
    color:#eafff8;
    text-shadow:0 0 12px rgba(90,240,200,.9),0 0 34px rgba(100,120,255,.5);
    animation:breathe 4.3s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}

  .formula{
    position:absolute;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
    font-size:clamp(9px,.76vw,12px);
    line-height:1.75;letter-spacing:.02em;
    color:rgba(140,215,220,.42);
    text-shadow:0 0 9px rgba(80,200,190,.25);
    white-space:nowrap;
  }
  .formula b{color:rgba(190,240,235,.68);font-weight:500;}
  .tl{top:56px;left:22px;}
  .tr{top:56px;right:22px;text-align:right;}
  .bl{bottom:16px;left:22px;}
  .br{bottom:16px;right:22px;text-align:right;}

  .controls{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:16px;
    pointer-events:auto;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;color:rgba(160,220,210,.85);
    background:rgba(6,14,20,.72);
    border:1px solid rgba(60,200,180,.24);
    border-radius:30px;padding:8px 22px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 0 28px rgba(50,180,160,.18);
    white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .controls input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:140px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,#1a4a8a,#2ea8ff,#2effc8,#b4ff5a);
    outline:none;cursor:pointer;
  }
  .controls input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#eaffff;
    box-shadow:0 0 10px rgba(80,240,200,.95),0 0 20px rgba(80,180,255,.75);
    cursor:pointer;
  }
  .controls input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border:none;border-radius:50%;
    background:#eaffff;
    box-shadow:0 0 10px rgba(80,240,200,.95);
    cursor:pointer;
  }
  .val{color:#7dffd8;font-weight:600;min-width:76px;text-align:center;
    text-shadow:0 0 10px rgba(80,240,200,.7);}
  .thval{color:#ffb340;font-weight:600;min-width:64px;text-align:center;
    text-shadow:0 0 10px rgba(255,170,60,.75);}
  .controls input[type=checkbox]{
    -webkit-appearance:none;appearance:none;
    width:32px;height:16px;border-radius:9px;
    background:rgba(80,120,140,.28);
    position:relative;cursor:pointer;transition:background .25s;
  }
  .controls input[type=checkbox]::after{
    content:"";position:absolute;top:2px;left:2px;
    width:12px;height:12px;border-radius:50%;
    background:#a8c8d0;transition:transform .25s,background .25s;
  }
  .controls input[type=checkbox]:checked{background:rgba(50,200,170,.72);}
  .controls input[type=checkbox]:checked::after{transform:translateX(16px);background:#eaffff;}

  @media (max-width:980px){
    .bl,.br{display:none;}
    .controls{gap:8px;padding:7px 14px;font-size:10px;}
    .controls input[type=range]{width:90px;}
    .val{min-width:58px;}
    .thval{min-width:52px;}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="epigraph">空位终将补满，正如努力终会填满人生的表面</div>

  <div class="formula tl">
    <b>朗缪尔等温式</b><br>
    θ = K·P / (1 + K·P)
  </div>
  <div class="formula tr">
    <b>吸附位点平衡</b><br>
    θ = Θ / θ<sub>max</sub> = K·P / (1+K·P)
  </div>
  <div class="formula bl">
    <b>参考数值 · 活性炭吸附 N₂</b><br>
    K = 9.27 atm⁻¹　V<sub>m</sub> = 58 cm³/g STP
  </div>
  <div class="formula br">
    <b>阿伏伽德罗常数</b><br>
    N<sub>A</sub> = 6.022×10²³ mol⁻¹
  </div>

  <div class="controls">
    <label>压力 P
      <input type="range" id="pRange" min="0.005" max="1.2" value="0.108" step="0.001">
    </label>
    <span class="val" id="pLabel">0.108 atm</span>
    <span class="thval" id="thLabel">θ = 50.0%</span>
    <label>
      <input type="checkbox" id="fitToggle" checked>
      拟合曲线
    </label>
  </div>
</div>

<script>
(() => {
'use strict';

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;

/* ============================================================
   物理参数
============================================================ */
const K_LANG = 9.27;        // 朗缪尔常数 atm⁻¹

/* ============================================================
   状态
============================================================ */
let W = 0, H = 0, DPR = 1;
let bgGrad = null;

/* 布局 */
let substrateX0, substrateX1, substrateY0, substrateY1;
let chartX0, chartY0, chartX1, chartY1;

let simTime = 0, lastTime = 0;

let P = 0.108, targetP = 0.108;
let autoPlay = true;
let showFit = true;

/* 吸附位点 */
const sites = [];
let siteGridCols = 0, siteGridRows = 0;

/* 自由气体分子 */
const gasMolecules = [];

/* 吸附/脱附统计 */
const stats = {
  occupied: 0,
  total: 0,
  adsHistory: [],
  lastAdsPush: -1
};

/* 点击探测 */
let probe = null;

/* ============================================================
   工具
============================================================ */
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function smoothstep(x){ x = clamp(x, 0, 1); return x*x*(3 - 2*x); }
function rand(a, b){ return a + Math.random() * (b - a); }
function rr(c2, x, y, w, h, r){
  c2.beginPath();
  c2.moveTo(x + r, y);
  c2.lineTo(x + w - r, y); c2.arcTo(x + w, y, x + w, y + r, r);
  c2.lineTo(x + w, y + h - r); c2.arcTo(x + w, y + h, x + w - r, y + h, r);
  c2.lineTo(x + r, y + h); c2.arcTo(x, y + h, x, y + h - r, r);
  c2.lineTo(x, y + r); c2.arcTo(x, y, x + r, y, r);
  c2.closePath();
}

function thetaOf(Pv){ return K_LANG * Pv / (1 + K_LANG * Pv); }

/* ============================================================
   尺寸与初始化
============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* 基底骨架区域 */
  substrateX0 = W * 0.045;
  substrateX1 = W * 0.555;
  substrateY0 = H * 0.215;
  substrateY1 = H * 0.815;

  /* 曲线图 */
  chartX0 = W * 0.625;
  chartY0 = H * 0.215;
  chartX1 = W * 0.955;
  chartY1 = H * 0.815;

  bgGrad = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.85
  );
  bgGrad.addColorStop(0,    '#04101a');
  bgGrad.addColorStop(0.45, '#02080f');
  bgGrad.addColorStop(1,    '#010005');

  buildSites();
  buildGasMolecules();
}

/* ============================================================
   构建活性位点（网格分布 + 抖动）
============================================================ */
function buildSites(){
  sites.length = 0;
  stats.total = 0;

  const cols = 13;
  const rows = 9;
  siteGridCols = cols;
  siteGridRows = rows;

  const cw = (substrateX1 - substrateX0) / cols;
  const ch = (substrateY1 - substrateY0) / rows;

  for (let j = 0; j < rows; j++){
    for (let i = 0; i < cols; i++){
      const x = substrateX0 + (i + 0.5) * cw + rand(-cw*0.22, cw*0.22);
      const y = substrateY0 + (j + 0.5) * ch + rand(-ch*0.22, ch*0.22);
      sites.push({
        x, y,
        r: Math.min(cw, ch) * 0.20,
        occupied: false,
        ph: Math.random() * TAU,
        glow: 0,
        occupyT: 0
      });
    }
  }
  stats.total = sites.length;
}

/* ============================================================
   自由气体分子
============================================================ */
function buildGasMolecules(){
  gasMolecules.length = 0;
  for (let i = 0; i < 90; i++){
    gasMolecules.push(spawnGas());
  }
}

function spawnGas(){
  return {
    x: rand(substrateX0 - 30, substrateX1 + 30),
    y: rand(substrateY0 - 30, substrateY1 + 30),
    vx: rand(-28, 28),
    vy: rand(-28, 28),
    r: rand(1.4, 2.6),
    ph: Math.random() * TAU,
    alive: true,
    targetSite: null,
    state: 'free'    // free | flying | desorb
  };
}

/* ============================================================
   30 秒剧本 · 压力
============================================================ */
function autoPValue(t){
  /* 0.02 → 1.15 缓慢上升，再回落 */
  const cycle = t / 30;
  const u = (Math.sin(cycle * TAU - Math.PI / 2) + 1) / 2;   // 0→1→0
  return 0.02 + 1.13 * u;
}

/* ============================================================
   更新
============================================================ */
function update(dt){
  simTime += dt;
  if (simTime >= 30) simTime -= 30;

  if (autoPlay){
    targetP = autoPValue(simTime);
    pRange.value = targetP.toFixed(3);
  }

  P += (targetP - P) * Math.min(1, dt * 4);
  P = clamp(P, 0.005, 1.2);

  pLabel.textContent = P.toFixed(3) + ' atm';
  thLabel.textContent = 'θ = ' + (thetaOf(P) * 100).toFixed(1) + '%';

  /* --- 目标占据数 --- */
  const targetFrac = thetaOf(P);
  const targetOcc  = targetFrac * stats.total;
  stats.occupied  = sites.filter(s => s.occupied).length;

  /* --- 吸附/脱附决策 --- */
  if (stats.occupied < targetOcc){
    /* 尝试吸附一个空位 */
    const empty = sites.filter(s => !s.occupied);
    if (empty.length > 0){
      const site = empty[(Math.random() * empty.length) | 0];
      site.occupied = true;
      site.occupyT = 0;
      site.glow = 1.2;
      /* 生成一个飞向位点的分子 */
      const g = spawnGas();
      g.x = rand(substrateX0 - 40, substrateX1 + 40);
      g.y = substrateY1 + 60;
      g.state = 'flying';
      g.targetSite = site;
      gasMolecules.push(g);
    }
  } else if (stats.occupied > targetOcc + 0.5){
    /* 脱附 */
    const occupied = sites.filter(s => s.occupied);
    if (occupied.length > 0){
      const site = occupied[(Math.random() * occupied.length) | 0];
      site.occupied = false;
      site.occupyT = 0;
      /* 生成一个向上飞离的分子 */
      const g = spawnGas();
      g.x = site.x;
      g.y = site.y;
      g.vx = rand(-20, 20);
      g.vy = -rand(60, 120);
      g.state = 'desorb';
      gasMolecules.push(g);
    }
  }

  /* --- 更新位点辉光 --- */
  for (const s of sites){
    if (s.occupied) s.occupyT += dt;
    s.glow = Math.max(0, s.glow - dt * 1.6);
  }

  /* --- 更新气体分子 --- */
  for (let i = gasMolecules.length - 1; i >= 0; i--){
    const g = gasMolecules[i];
    if (!g.alive){ gasMolecules.splice(i, 1); continue; }

    if (g.state === 'flying'){
      const tgt = g.targetSite;
      if (!tgt || !tgt.occupied){ g.alive = false; continue; }
      const dx = tgt.x - g.x, dy = tgt.y - g.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const sp = 320;
      g.x += dx / d * sp * dt;
      g.y += dy / d * sp * dt;
      if (d < 5){ g.alive = false; }
    } else if (g.state === 'desorb'){
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      if (g.y < substrateY0 - 80 || g.x < substrateX0 - 80 || g.x > substrateX1 + 80){
        g.alive = false;
      }
    } else {
      /* 自由浮动 */
      g.vx += rand(-60, 60) * dt;
      g.vy += rand(-60, 60) * dt;
      const sp = Math.sqrt(g.vx * g.vx + g.vy * g.vy);
      const MAX = 60;
      if (sp > MAX){
        g.vx *= MAX / sp;
        g.vy *= MAX / sp;
      }
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      if (g.x < substrateX0 - 50) g.vx = Math.abs(g.vx);
      if (g.x > substrateX1 + 50) g.vx = -Math.abs(g.vx);
      if (g.y < substrateY0 - 50) g.vy = Math.abs(g.vy);
      if (g.y > substrateY1 + 60) g.vy = -Math.abs(g.vy);
    }
  }

  /* 控制粒子数上限 */
  while (gasMolecules.length > 160) gasMolecules.shift();

  /* --- 历史记录 --- */
  if (simTime - stats.lastAdsPush > 0.1){
    stats.lastAdsPush = simTime;
    stats.adsHistory.push({
      t: simTime,
      occ: stats.occupied,
      P: P
    });
    if (stats.adsHistory.length > 500) stats.adsHistory.shift();
  }

  /* --- 探测计时 --- */
  if (probe){
    probe.t += dt;
    if (probe.t > 4) probe = null;
  }
}

/* ============================================================
   渲染 · 基底骨架
============================================================ */
function drawSubstrate(){
  /* 面板背景 */
  const g = ctx.createLinearGradient(
    substrateX0, substrateY0, substrateX1, substrateY1
  );
  g.addColorStop(0,    'rgba(20, 40, 70, 0.55)');
  g.addColorStop(0.45, 'rgba(12, 30, 55, 0.48)');
  g.addColorStop(1,    'rgba(8, 22, 42, 0.52)');
  ctx.fillStyle = g;
  rr(ctx, substrateX0 - 12, substrateY0 - 12,
     (substrateX1 - substrateX0) + 24,
     (substrateY1 - substrateY0) + 24, 14);
  ctx.fill();

  ctx.strokeStyle = 'rgba(60, 180, 200, 0.22)';
  ctx.lineWidth = 1;
  rr(ctx, substrateX0 - 12, substrateY0 - 12,
     (substrateX1 - substrateX0) + 24,
     (substrateY1 - substrateY0) + 24, 14);
  ctx.stroke();

  /* 多孔碳骨架：随机网格线 */
  ctx.strokeStyle = 'rgba(50, 150, 170, 0.14)';
  ctx.lineWidth = 0.9;
  const seed = 13;
  for (let i = 0; i < 60; i++){
    const x1 = substrateX0 + ((i * 97 + seed) % 1000) / 1000 * (substrateX1 - substrateX0);
    const y1 = substrateY0 + ((i * 53 + seed * 3) % 1000) / 1000 * (substrateY1 - substrateY0);
    const x2 = substrateX0 + ((i * 71 + seed * 7) % 1000) / 1000 * (substrateX1 - substrateX0);
    const y2 = substrateY0 + ((i * 113 + seed * 5) % 1000) / 1000 * (substrateY1 - substrateY0);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  /* 标题 */
  ctx.font = '600 11px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(140, 220, 230, 0.65)';
  ctx.fillText('活性炭多孔表面 · 吸附位点', substrateX0 - 6, substrateY0 - 22);
}

/* ============================================================
   渲染 · 吸附位点
============================================================ */
function drawSites(){
  const t = simTime;
  for (const s of sites){
    /* 空位点：灰蓝微光 */
    if (!s.occupied){
      const pulse = 0.55 + 0.45 * Math.sin(t * 1.8 + s.ph);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (1.5 + 0.2 * pulse), 0, TAU);
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 1.8);
      g.addColorStop(0, 'rgba(120, 170, 220, 0.32)');
      g.addColorStop(0.5, 'rgba(80, 130, 190, 0.14)');
      g.addColorStop(1, 'rgba(60, 100, 160, 0)');
      ctx.fillStyle = g;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 0.55, 0, TAU);
      ctx.fillStyle = 'rgba(140, 185, 235, 0.55)';
      ctx.fill();
    } else {
      /* 已占据：青绿荧光点亮 */
      const age = Math.min(1, s.occupyT * 2.5);
      const pulse = 0.7 + 0.3 * Math.sin(t * 3.2 + s.ph);
      const boost = s.glow;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (2.0 + 0.3 * pulse + boost), 0, TAU);
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 2.6);
      g.addColorStop(0,    `rgba(140, 255, 220, ${0.55 * age})`);
      g.addColorStop(0.32, `rgba(60, 240, 200, ${0.30 * age})`);
      g.addColorStop(0.65, `rgba(40, 160, 220, ${0.12 * age})`);
      g.addColorStop(1,    'rgba(20, 100, 180, 0)');
      ctx.fillStyle = g;
      ctx.fill();

      /* 吸附分子核心 */
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 0.75, 0, TAU);
      const cg = ctx.createRadialGradient(
        s.x - s.r * 0.25, s.y - s.r * 0.25, 0,
        s.x, s.y, s.r * 0.75
      );
      cg.addColorStop(0,   '#f0fffa');
      cg.addColorStop(0.5, '#5cffd0');
      cg.addColorStop(1,   '#1aa88a');
      ctx.fillStyle = cg;
      ctx.fill();

      /* 高光 */
      ctx.beginPath();
      ctx.arc(s.x - s.r * 0.3, s.y - s.r * 0.3, s.r * 0.22, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fill();
    }
  }
}

/* ============================================================
   渲染 · 自由气体分子
============================================================ */
function drawGasMolecules(){
  const t = simTime;
  ctx.globalCompositeOperation = 'lighter';

  for (const g of gasMolecules){
    if (!g.alive) continue;

    const tw = 0.65 + 0.35 * Math.sin(t * 4 + g.ph);

    if (g.state === 'flying'){
      /* 飞向位点：青绿拖尾 */
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * 3, 0, TAU);
      ctx.fillStyle = `rgba(100, 255, 220, ${0.22 * tw})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, TAU);
      ctx.fillStyle = `rgba(200, 255, 240, ${0.9 * tw})`;
      ctx.fill();
    } else if (g.state === 'desorb'){
      /* 脱附：橙黄色 */
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * 2.6, 0, TAU);
      ctx.fillStyle = `rgba(255, 180, 80, ${0.20 * tw})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, TAU);
      ctx.fillStyle = `rgba(255, 210, 140, ${0.85 * tw})`;
      ctx.fill();
    } else {
      /* 自由分子：浅青蓝 */
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * 2.4, 0, TAU);
      ctx.fillStyle = `rgba(100, 200, 255, ${0.10 * tw})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, TAU);
      ctx.fillStyle = `rgba(160, 220, 255, ${0.55 * tw})`;
      ctx.fill();
    }
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   渲染 · 覆盖率进度条
============================================================ */
function drawProgressBar(){
  const barX = substrateX0;
  const barY = substrateY1 + 36;
  const barW = substrateX1 - substrateX0;
  const barH = 10;

  const theta = thetaOf(P);
  const occFrac = stats.total > 0 ? stats.occupied / stats.total : 0;

  /* 背景 */
  ctx.fillStyle = 'rgba(30, 60, 90, 0.42)';
  rr(ctx, barX, barY, barW, barH, 5);
  ctx.fill();

  /* 实际占据 */
  if (occFrac > 0.005){
    const g = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    g.addColorStop(0,   '#2effc8');
    g.addColorStop(0.5, '#4affb0');
    g.addColorStop(1,   '#b4ff5a');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(80, 255, 200, 0.85)';
    ctx.shadowBlur = 14;
    rr(ctx, barX, barY, barW * occFrac, barH, 5);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  /* 理论上限线 */
  const thX = barX + barW * Math.min(theta, 1);
  ctx.setLineDash([3, 4]);
  ctx.strokeStyle = 'rgba(255, 210, 120, 0.65)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(thX, barY - 4);
  ctx.lineTo(thX, barY + barH + 4);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 文字 */
  ctx.font = '600 10.5px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(150, 230, 220, 0.85)';
  ctx.fillText('覆盖分数 θ', barX, barY - 10);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255, 220, 140, 0.85)';
  ctx.fillText(
    `${stats.occupied} / ${stats.total} 位点已占据`,
    barX + barW, barY - 10
  );
}

/* ============================================================
   渲染 · 等温线曲线图
============================================================ */
function drawChart(){
  const x0 = chartX0, x1 = chartX1;
  const y0 = chartY0, y1 = chartY1;
  const w = x1 - x0, h = y1 - y0;

  /* 面板 */
  ctx.fillStyle = 'rgba(6, 14, 24, 0.72)';
  rr(ctx, x0 - 20, y0 - 48, w + 40, h + 92, 13);
  ctx.fill();
  ctx.strokeStyle = 'rgba(60, 180, 200, 0.22)';
  ctx.lineWidth = 1;
  rr(ctx, x0 - 20, y0 - 48, w + 40, h + 92, 13);
  ctx.stroke();

  /* 标题 */
  ctx.font = '600 12px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(160, 230, 230, 0.85)';
  ctx.fillText('朗缪尔等温吸附曲线', x0 - 12, y0 - 26);

  ctx.font = '500 9.5px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle = 'rgba(140, 200, 210, 0.46)';
  ctx.fillText('θ = KP / (1+KP)　K = 9.27 atm⁻¹', x0 - 12, y0 - 10);

  /* 坐标轴 */
  ctx.strokeStyle = 'rgba(140, 200, 220, 0.32)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x0, y1);
  ctx.lineTo(x1, y1);
  ctx.stroke();

  /* 网格 */
  ctx.strokeStyle = 'rgba(80, 160, 180, 0.10)';
  for (let i = 1; i <= 5; i++){
    const y = y1 - (i / 5) * h;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    const x = x0 + (i / 5) * w;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  }

  /* 映射 */
  const P_MAX = 1.2;
  const mapX = (pv) => x0 + (pv / P_MAX) * w;
  const mapY = (thv) => y1 - thv * h;

  /* θ=1 饱和线 */
  ctx.setLineDash([4, 5]);
  ctx.strokeStyle = 'rgba(255, 200, 120, 0.42)';
  ctx.beginPath();
  ctx.moveTo(x0, mapY(1));
  ctx.lineTo(x1, mapY(1));
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.font = '500 10px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle = 'rgba(255, 210, 140, 0.62)';
  ctx.textAlign = 'left';
  ctx.fillText('θ = 1（饱和）', x0 + 4, mapY(1) - 5);

  /* θ=0.5 参考线 */
  ctx.setLineDash([3, 5]);
  ctx.strokeStyle = 'rgba(120, 220, 220, 0.28)';
  ctx.beginPath();
  ctx.moveTo(x0, mapY(0.5));
  ctx.lineTo(x1, mapY(0.5));
  ctx.stroke();
  ctx.setLineDash([]);

  /* 拟合曲线（虚线） */
  if (showFit){
    ctx.beginPath();
    const N = 200;
    for (let i = 0; i <= N; i++){
      const pv = (i / N) * P_MAX;
      const th = thetaOf(pv);
      const px = mapX(pv);
      const py = mapY(th);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = 'rgba(255, 170, 90, 0.72)';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([6, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* 实测曲线（根据 stats 累积的记录） */
  ctx.beginPath();
  let started = false;
  for (const rec of stats.adsHistory){
    const th = stats.total > 0 ? rec.occ / stats.total : 0;
    const px = mapX(rec.P);
    const py = mapY(th);
    if (!started){ ctx.moveTo(px, py); started = true; }
    else ctx.lineTo(px, py);
  }
  const cg = ctx.createLinearGradient(x0, 0, x1, 0);
  cg.addColorStop(0,    '#2effc8');
  cg.addColorStop(0.5,  '#4affb0');
  cg.addColorStop(1,    '#b4ff5a');
  ctx.strokeStyle = cg;
  ctx.lineWidth = 2.6;
  ctx.shadowColor = 'rgba(80, 255, 200, 0.9)';
  ctx.shadowBlur = 16;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 当前状态点 */
  const curX = mapX(P);
  const curY = mapY(thetaOf(P));
  const pulse = 1 + 0.3 * Math.sin(simTime * 4.5);

  ctx.beginPath();
  ctx.arc(curX, curY, 9 * pulse, 0, TAU);
  ctx.fillStyle = 'rgba(255, 220, 140, 0.20)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(curX, curY, 4.5, 0, TAU);
  ctx.fillStyle = '#ffe6a0';
  ctx.shadowColor = 'rgba(255, 210, 120, 0.95)';
  ctx.shadowBlur = 16;
  ctx.fill();
  ctx.shadowBlur = 0;

  /* 当前点标签 */
  const lbl = `P=${P.toFixed(3)}  θ=${(thetaOf(P)*100).toFixed(1)}%`;
  ctx.font = '600 10px ui-monospace,Menlo,Consolas,monospace';
  const tw = ctx.measureText(lbl).width;
  let lx = curX + 12, ly = curY - 24;
  if (lx + tw + 16 > x1) lx = curX - tw - 24;
  if (ly < y0 + 4) ly = y0 + 4;

  ctx.fillStyle = 'rgba(20, 30, 48, 0.92)';
  ctx.strokeStyle = 'rgba(255, 215, 140, 0.55)';
  ctx.lineWidth = 1;
  rr(ctx, lx, ly, tw + 14, 20, 6);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = 'rgba(255, 232, 170, 0.95)';
  ctx.textAlign = 'left';
  ctx.fillText(lbl, lx + 7, ly + 14);

  /* 坐标刻度 */
  ctx.font = '9.5px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle = 'rgba(140, 200, 210, 0.46)';
  ctx.textAlign = 'center';
  for (let i = 0; i <= 6; i++){
    const pv = (i / 6) * P_MAX;
    ctx.fillText(pv.toFixed(1), mapX(pv), y1 + 16);
  }
  ctx.textAlign = 'right';
  for (let i = 0; i <= 5; i++){
    ctx.fillText((i * 0.2).toFixed(1), x0 - 7, y1 - (i / 5) * h + 3.5);
  }

  /* 坐标名 */
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(150, 220, 220, 0.55)';
  ctx.fillText('压力 P (atm)', x1, y1 + 34);
  ctx.save();
  ctx.translate(x0 - 38, y0 + h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillText('覆盖分数 θ', 0, 0);
  ctx.restore();

  /* 图例 */
  ctx.font = '600 9.5px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(80, 255, 200, 0.85)';
  ctx.fillText('━ 实测覆盖', x0 + 6, y0 + 18);
  if (showFit){
    ctx.fillStyle = 'rgba(255, 170, 90, 0.85)';
    ctx.fillText('┅ 拟合曲线', x0 + 6, y0 + 34);
  }
}

/* ============================================================
   渲染 · 点击探测
============================================================ */
function drawProbe(){
  if (!probe) return;
  const a = Math.max(0, 1 - probe.t / 4);
  if (a <= 0){ probe = null; return; }

  const x = probe.x, y = probe.y;

  ctx.beginPath();
  ctx.arc(x, y, 14 + (1 - a) * 22, 0, TAU);
  ctx.strokeStyle = `rgba(255, 225, 150, ${a * 0.70})`;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x, y, 5, 0, TAU);
  ctx.fillStyle = `rgba(255, 240, 180, ${a})`;
  ctx.shadowColor = 'rgba(255, 210, 120, 0.95)';
  ctx.shadowBlur = 16;
  ctx.fill();
  ctx.shadowBlur = 0;

  /* 找最近位点 */
  let best = null, bd = Infinity;
  for (const s of sites){
    const d = (s.x - x) ** 2 + (s.y - y) ** 2;
    if (d < bd){ bd = d; best = s; }
  }

  const lines = [];
  if (best && Math.sqrt(bd) < 60){
    lines.push(
      best.occupied ? '● 该位点已吸附' : '○ 该位点空余'
    );
    if (best.occupied) {
      lines.push(`吸附时长 ${best.occupyT.toFixed(1)} s`);
    }
  }
  lines.push(`P = ${P.toFixed(3)} atm`);
  lines.push(`K = 9.27 atm⁻¹`);
  lines.push(`KP = ${(K_LANG * P).toFixed(3)}`);
  lines.push(`θ = ${(thetaOf(P) * 100).toFixed(1)}%`);

  ctx.font = '600 10.5px ui-monospace,Menlo,Consolas,monospace';
  let mw = 0;
  for (const l of lines) mw = Math.max(mw, ctx.measureText(l).width);

  const bw = mw + 20, bh = lines.length * 15.5 + 14;
  let bx = x + 16, by = y - bh / 2;
  if (bx + bw > W - 10) bx = x - bw - 16;
  if (by < 10) by = 10;
  if (by + bh > H - 80) by = H - 80 - bh;

  ctx.fillStyle = `rgba(12, 22, 30, ${a * 0.94})`;
  ctx.strokeStyle = `rgba(255, 215, 140, ${a * 0.58})`;
  ctx.lineWidth = 1;
  rr(ctx, bx, by, bw, bh, 9);
  ctx.fill(); ctx.stroke();

  ctx.textAlign = 'left';
  for (let i = 0; i < lines.length; i++){
    ctx.fillStyle = i === 0
      ? `rgba(255, 235, 170, ${a})`
      : `rgba(210, 240, 235, ${a * 0.88})`;
    ctx.fillText(lines[i], bx + 10, by + 18 + i * 15.5);
  }
}

/* ============================================================
   渲染 · 顶部读数
============================================================ */
function drawReadout(){
  const theta = thetaOf(P);
  const KP = K_LANG * P;

  const txt =
    `P = ${P.toFixed(3)} atm    ` +
    `KP = ${KP.toFixed(3)}    ` +
    `θ = KP/(1+KP) = ${(theta * 100).toFixed(1)}%    ` +
    `吸附位点 ${stats.occupied}/${stats.total}`;

  ctx.font = '600 12px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(205, 245, 240, 0.86)';
  ctx.shadowColor = 'rgba(80, 220, 200, 0.85)';
  ctx.shadowBlur = 14;
  ctx.fillText(txt, W / 2, H - 66);
  ctx.shadowBlur = 0;
}

/* ============================================================
   主渲染
============================================================ */
function render(){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  drawSubstrate();
  drawSites();
  drawGasMolecules();
  drawProgressBar();
  drawChart();
  drawProbe();
  drawReadout();
}

/* ============================================================
   主循环
============================================================ */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();
}

/* ============================================================
   交互
============================================================ */
const pRange   = document.getElementById('pRange');
const pLabel   = document.getElementById('pLabel');
const thLabel  = document.getElementById('thLabel');
const fitToggle = document.getElementById('fitToggle');

pRange.addEventListener('input', () => {
  autoPlay = false;
  targetP = parseFloat(pRange.value);
});

fitToggle.addEventListener('change', () => {
  showFit = fitToggle.checked;
});

cv.addEventListener('pointerdown', (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  probe = { x: mx, y: my, t: 0 };
});

window.addEventListener('resize', resize);

/* ============================================================
   启动
============================================================ */
resize();
requestAnimationFrame(loop);

})();
</script>
