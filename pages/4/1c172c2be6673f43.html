<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>公式变身术 · Formula Morph</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#04020c;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;}

  /* ===== 标题 ===== */
  #title{
    position:absolute;top:0;left:0;
    padding:18px 24px;
    opacity:0;animation:fade 1.2s 0.2s ease forwards;
  }
  #title .en{
    font-size:8px;letter-spacing:.5em;text-indent:.5em;
    color:rgba(190,150,255,.42);font-weight:300;margin-bottom:5px;
  }
  #title h1{
    font-size:clamp(16px,2.1vw,24px);
    font-weight:300;letter-spacing:.24em;
    background:linear-gradient(96deg,#b090ff 0%,#e090d0 45%,#ffd080 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 22px rgba(170,120,255,.48));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.14em;
    color:rgba(210,190,255,.52);
    margin-top:5px;
  }

  /* ===== 右上：进度 ===== */
  #progress{
    position:absolute;top:18px;right:24px;
    padding:11px 16px;
    border-radius:12px;
    background:rgba(16,10,34,.72);
    border:1px solid rgba(150,120,255,.28);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.10em;
    color:rgba(210,195,255,.62);
    opacity:0;animation:fade 1.2s 0.5s ease forwards;
    text-align:right;
  }
  #progress .h{
    font-size:8px;letter-spacing:.38em;
    color:rgba(180,150,255,.62);
    margin-bottom:5px;
    display:block;
  }
  #progress .v{
    font-size:16px;
    font-weight:300;
    color:rgba(230,225,255,.98);
    display:block;
  }
  #progress .v b{
    color:rgba(255,210,130,.98);
    font-weight:600;
  }

  /* ===== 图鉴 ===== */
  #collection{
    position:absolute;
    top:110px;right:24px;
    display:flex;flex-direction:column;gap:5px;
    opacity:0;animation:fade 1.2s 0.9s ease forwards;
    pointer-events:none;
  }
  .col-slot{
    display:flex;align-items:center;gap:8px;
    padding:6px 12px 6px 8px;
    border-radius:10px;
    background:rgba(14,10,30,.62);
    border:1px solid rgba(130,110,220,.16);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9px;letter-spacing:.06em;
    color:rgba(180,170,230,.32);
    transition:.5s cubic-bezier(.34,1.4,.64,1);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    min-width:140px;
  }
  .col-icon{
    width:20px;height:20px;
    border-radius:50%;
    background:rgba(120,110,180,.18);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;
    color:rgba(150,140,210,.42);
    flex-shrink:0;
    transition:.5s;
  }
  .col-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .col-slot.on{
    color:rgba(255,230,190,.98);
    border-color:rgba(255,200,120,.62);
    background:rgba(60,42,16,.72);
    box-shadow:0 0 20px rgba(255,190,90,.42);
  }
  .col-slot.on .col-icon{
    background:radial-gradient(circle at 35% 35%,
      hsl(var(--h), 100%, 84%),
      hsl(var(--h), 100%, 62%));
    color:rgba(20,10,30,.92);
    font-size:11px;
    box-shadow:0 0 12px hsl(var(--h), 100%, 68%);
  }

  /* ===== 底部输入栏 ===== */
  #bottom{
    position:absolute;bottom:0;left:0;right:0;
    padding:0 20px 22px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    opacity:0;animation:fade 1.2s 1.2s ease forwards;
    pointer-events:none;
  }
  .input-row{
    display:flex;gap:9px;
    pointer-events:auto;
    width:min(520px,94vw);
  }
  #formulaInput{
    flex:1;
    min-width:0;
    padding:14px 18px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:16px;
    font-weight:500;
    letter-spacing:.04em;
    color:rgba(230,238,255,.98);
    background:rgba(14,10,32,.82);
    border:1.5px solid rgba(140,120,240,.42);
    border-radius:13px;
    outline:none;
    transition:.24s;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  #formulaInput::placeholder{
    color:rgba(170,160,220,.34);
    font-weight:400;
    font-size:13px;
  }
  #formulaInput:focus{
    border-color:rgba(190,160,255,.92);
    box-shadow:0 0 26px rgba(150,120,255,.52);
    background:rgba(22,16,48,.90);
  }
  #formulaInput.error{
    border-color:rgba(255,130,110,.92);
    box-shadow:0 0 26px rgba(255,110,90,.52);
    animation:shakeInput 0.45s;
  }
  @keyframes shakeInput{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }

  #morphBtn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:12px;letter-spacing:.20em;
    padding:14px 26px;
    color:rgba(255,235,200,.98);
    background:linear-gradient(150deg,rgba(140,80,220,.86),rgba(70,40,140,.82));
    border:1.5px solid rgba(200,170,255,.62);
    border-radius:13px;
    cursor:pointer;
    transition:.24s cubic-bezier(.34,1.4,.64,1);
    box-shadow:
      0 8px 22px rgba(0,0,0,.48),
      0 0 24px rgba(150,110,255,.42),
      inset 0 1px 0 rgba(220,200,255,.28);
    white-space:nowrap;
    position:relative;
    overflow:hidden;
  }
  #morphBtn::before{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(140deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 42%);
    pointer-events:none;
  }
  #morphBtn:hover:not(.disabled){
    transform:translateY(-2px);
    border-color:rgba(230,205,255,.98);
    box-shadow:
      0 12px 30px rgba(0,0,0,.55),
      0 0 42px rgba(180,140,255,.72),
      inset 0 1px 0 rgba(230,215,255,.38);
  }
  #morphBtn:active:not(.disabled){
    transform:translateY(0) scale(.97);
  }
  #morphBtn.disabled{
    opacity:.42;
    cursor:not-allowed;
    transform:none;
  }

  .quick-row{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    pointer-events:auto;
    max-width:94vw;
  }
  .quick-chip{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.06em;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(20,14,42,.72);
    border:1px solid rgba(140,120,240,.26);
    color:rgba(200,185,255,.62);
    cursor:pointer;
    transition:.22s;
    white-space:nowrap;
  }
  .quick-chip:hover{
    border-color:rgba(190,165,255,.82);
    color:rgba(230,220,255,.98);
    background:rgba(50,36,100,.62);
    transform:translateY(-1px);
  }

  /* ===== 音频指示 ===== */
  #audioDot{
    position:absolute;bottom:0;left:22px;
    padding-bottom:22px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.20em;
    color:rgba(170,150,240,.30);
    display:flex;align-items:center;gap:6px;
    opacity:0;animation:fade 1.2s 1.6s ease forwards;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(170,150,240,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(190,150,255,.92);
    box-shadow:0 0 9px rgba(190,150,255,.85);
  }
  #audioDot.on{color:rgba(200,170,255,.62);}

  /* ===== Toast ===== */
  #toast{
    position:fixed;
    top:16%;left:50%;
    transform:translate(-50%,-50%) scale(.86);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(14px,1.9vw,20px);
    font-weight:300;letter-spacing:.22em;
    color:rgba(220,255,235,.98);
    text-shadow:0 0 30px rgba(140,255,200,.85);
    opacity:0;pointer-events:none;
    transition:opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
    z-index:100;
    white-space:nowrap;
    text-align:center;
    padding:14px 28px;
    border-radius:14px;
    background:rgba(10,24,20,.76);
    border:1px solid rgba(150,240,200,.42);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    max-width:92vw;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #toast.rare{
    color:rgba(255,235,170,.98);
    border-color:rgba(255,205,120,.72);
    background:rgba(54,34,12,.78);
    text-shadow:0 0 30px rgba(255,200,100,.95);
  }
  #toast.bad{
    color:rgba(255,180,155,.98);
    border-color:rgba(255,140,110,.62);
    background:rgba(42,14,10,.78);
    text-shadow:0 0 30px rgba(255,120,90,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:12px 14px;}
    #title .sub{display:none;}
    #progress{top:12px;right:12px;padding:8px 12px;}
    #progress .v{font-size:13px;}
    #collection{
      top:88px;right:12px;
      gap:4px;
    }
    .col-slot{font-size:8px;padding:5px 9px 5px 6px;min-width:96px;gap:6px;}
    .col-icon{width:16px;height:16px;font-size:9px;}
    .col-slot .col-name{display:none;}
    #bottom{padding:0 12px 16px;gap:8px;}
    #formulaInput{padding:12px 14px;font-size:14px;border-radius:11px;}
    #morphBtn{padding:12px 18px;font-size:11px;border-radius:11px;}
    .quick-chip{font-size:8.5px;padding:5px 10px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">FORMULA MORPH</div>
    <h1>公式变身术</h1>
    <div class="sub">输入公式 · 变身动物</div>
  </div>

  <div id="progress">
    <span class="h">图鉴收集</span>
    <span class="v"><b id="collectedCount">0</b> / <b id="totalCount">8</b></span>
  </div>

  <div id="collection"></div>

  <div id="bottom">
    <div class="input-row">
      <input type="text" id="formulaInput" placeholder="输入公式，如 y = x²" autocomplete="off" autocorrect="off" spellcheck="false" />
      <button id="morphBtn">变 身</button>
    </div>
    <div class="quick-row" id="quickRow"></div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>氛围音 · 变身音</span>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, BASE_R = 120;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.44;
  BASE_R = Math.min(W, H) * 0.19;
  BASE_R = Math.max(72, Math.min(BASE_R, 160));

  buildSymbols();
}
window.addEventListener('resize', resize);

/* =========================================================
   缓动
   ========================================================= */
function easeOutBack(x){
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }

/* =========================================================
   动物绘制函数
   ========================================================= */
function drawRabbit(R, t){
  const bounce = Math.abs(Math.sin(t * 2.4)) * R * 0.28;

  /* 抛物线轨迹 */
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.strokeStyle = 'hsl(340,95%,82%)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  for (let i = 0; i <= 40; i++){
    const u = (i / 40 - 0.5) * 2;
    const x = u * R * 0.95;
    const y = R * 0.62 - u * u * R * 0.68;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.save();
  ctx.translate(0, -bounce);

  const br = R * 0.42;

  /* 耳朵 */
  for (let s = -1; s <= 1; s += 2){
    ctx.save();
    ctx.translate(s * br * 0.32, -br * 1.02);
    ctx.rotate(s * 0.22);
    ctx.beginPath();
    ctx.ellipse(0, -br * 0.34, br * 0.17, br * 0.54, 0, 0, TAU);
    ctx.fillStyle = 'hsl(340,72%,86%)';
    ctx.fill();
    ctx.strokeStyle = 'hsl(340,80%,72%)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -br * 0.34, br * 0.085, br * 0.36, 0, 0, TAU);
    ctx.fillStyle = 'hsl(340,92%,76%)';
    ctx.fill();
    ctx.restore();
  }

  /* 身体 */
  const bg = ctx.createRadialGradient(-br * 0.3, -br * 0.3, 0, 0, 0, br * 1.15);
  bg.addColorStop(0, 'hsl(340,85%,95%)');
  bg.addColorStop(1, 'hsl(340,62%,78%)');
  ctx.beginPath();
  ctx.arc(0, 0, br, 0, TAU);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = 'hsl(340,85%,80%)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 眼睛 */
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.arc(s * br * 0.30, -br * 0.10, br * 0.13, 0, TAU);
    ctx.fillStyle = '#0a0a1a';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * br * 0.30 - br * 0.04, -br * 0.14, br * 0.05, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fill();
  }

  /* 鼻子 */
  ctx.beginPath();
  ctx.arc(0, br * 0.12, br * 0.06, 0, TAU);
  ctx.fillStyle = 'hsl(340,90%,70%)';
  ctx.fill();

  ctx.restore();
}

function drawSnail(R, t){
  ctx.save();

  /* 身体 */
  ctx.beginPath();
  ctx.ellipse(R * 0.15, R * 0.55, R * 0.72, R * 0.16, 0, 0, TAU);
  ctx.fillStyle = 'hsl(150,52%,74%)';
  ctx.fill();
  ctx.strokeStyle = 'hsl(150,62%,56%)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* 头部 */
  ctx.beginPath();
  ctx.arc(-R * 0.55, R * 0.42, R * 0.18, 0, TAU);
  ctx.fillStyle = 'hsl(150,58%,78%)';
  ctx.fill();
  ctx.stroke();

  /* 触角 */
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.moveTo(-R * 0.55 + s * R * 0.06, R * 0.34);
    ctx.quadraticCurveTo(
      -R * 0.55 + s * R * 0.20, R * 0.14,
      -R * 0.55 + s * R * 0.24, R * 0.04
    );
    ctx.strokeStyle = 'hsl(150,58%,70%)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-R * 0.55 + s * R * 0.24, R * 0.04, R * 0.05, 0, TAU);
    ctx.fillStyle = '#0a0a1a';
    ctx.fill();
  }

  /* 螺旋壳 —— 对数螺旋 */
  const cx = R * 0.15;
  const cy = R * 0.12;
  const rot = t * 0.6;

  ctx.beginPath();
  const a = R * 0.06;
  const b = 0.22;
  let started = false;
  for (let i = 0; i <= 260; i++){
    const th = (i / 260) * Math.PI * 7;
    const rr = a * Math.exp(b * th);
    if (rr > R * 0.85) break;
    const x = cx + Math.cos(th + rot) * rr;
    const y = cy + Math.sin(th + rot) * rr;
    if (!started){ ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'hsl(45,88%,66%)';
  ctx.lineWidth = R * 0.065;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.strokeStyle = 'hsl(50,98%,84%)';
  ctx.lineWidth = R * 0.026;
  ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();
}

function drawSnake(R, t){
  ctx.save();

  const N = 80;
  const pts = [];
  for (let i = 0; i <= N; i++){
    const u = i / N;
    const x = (u - 0.5) * R * 2.0;
    const y = Math.sin(u * Math.PI * 3 + t * 2) * R * 0.28;
    pts.push({ x: x, y: y });
  }

  /* 身体 */
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++){
    if (i === 0) ctx.moveTo(pts[i].x, pts[i].y);
    else ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.strokeStyle = 'hsl(140,62%,68%)';
  ctx.lineWidth = R * 0.22;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.strokeStyle = 'hsl(140,78%,84%)';
  ctx.lineWidth = R * 0.11;
  ctx.stroke();

  /* 花纹 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  for (let i = 0; i < pts.length; i += 4){
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, R * 0.05, 0, TAU);
    ctx.fillStyle = 'hsla(160,90%,80%,0.42)';
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* 头 */
  const head = pts[pts.length - 1];
  ctx.beginPath();
  ctx.arc(head.x, head.y, R * 0.17, 0, TAU);
  ctx.fillStyle = 'hsl(140,66%,76%)';
  ctx.fill();
  ctx.strokeStyle = 'hsl(140,72%,60%)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* 眼睛 */
  ctx.beginPath();
  ctx.arc(head.x - R * 0.04, head.y - R * 0.05, R * 0.035, 0, TAU);
  ctx.fillStyle = '#0a0a1a';
  ctx.fill();

  /* 舌头 */
  ctx.beginPath();
  ctx.moveTo(head.x + R * 0.14, head.y);
  ctx.lineTo(head.x + R * 0.30, head.y + R * 0.05);
  ctx.lineTo(head.x + R * 0.26, head.y - R * 0.02);
  ctx.strokeStyle = 'hsl(350,85%,68%)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.restore();
}

function drawHedgehog(R, t){
  ctx.save();

  /* 刺 */
  const N = 46;
  for (let i = 0; i < N; i++){
    const ang = (i / N) * TAU - Math.PI * 0.5;
    const baseR = R * 0.62;
    const tipR = baseR + R * (0.22 + Math.sin(t * 2.2 + i * 0.7) * 0.05);
    const x0 = Math.cos(ang) * baseR;
    const y0 = Math.sin(ang) * baseR;
    const x1 = Math.cos(ang) * tipR;
    const y1 = Math.sin(ang) * tipR;

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.strokeStyle = 'hsl(35,72%,45%)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  /* 身体 */
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.62, 0, TAU);
  const bg = ctx.createRadialGradient(-R * 0.2, -R * 0.2, 0, 0, 0, R * 0.72);
  bg.addColorStop(0, 'hsl(35,58%,78%)');
  bg.addColorStop(1, 'hsl(35,52%,60%)');
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = 'hsl(35,65%,48%)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 脸 */
  ctx.beginPath();
  ctx.ellipse(-R * 0.30, R * 0.18, R * 0.22, R * 0.20, 0, 0, TAU);
  ctx.fillStyle = 'hsl(30,48%,86%)';
  ctx.fill();

  /* 眼睛 */
  ctx.beginPath();
  ctx.arc(-R * 0.36, R * 0.12, R * 0.042, 0, TAU);
  ctx.fillStyle = '#0a0a1a';
  ctx.fill();

  /* 鼻子 */
  ctx.beginPath();
  ctx.arc(-R * 0.48, R * 0.22, R * 0.05, 0, TAU);
  ctx.fillStyle = 'hsl(0,0%,18%)';
  ctx.fill();

  ctx.restore();
}

function drawBird(R, t){
  const flap = Math.sin(t * 3.2) * 0.32;

  ctx.save();

  /* 左翼 —— 绝对值形状 */
  ctx.save();
  ctx.translate(-R * 0.18, R * 0.05);
  ctx.rotate(-0.15 + flap * 0.45);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-R * 0.55, -R * 0.62, -R * 0.95, -R * 0.20);
  ctx.quadraticCurveTo(-R * 0.52, -R * 0.20, 0, 0);
  ctx.closePath();
  ctx.fillStyle = 'hsl(200,72%,80%)';
  ctx.fill();
  ctx.strokeStyle = 'hsl(200,82%,64%)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.restore();

  /* 右翼 */
  ctx.save();
  ctx.translate(R * 0.18, R * 0.05);
  ctx.rotate(0.15 - flap * 0.45);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(R * 0.55, -R * 0.62, R * 0.95, -R * 0.20);
  ctx.quadraticCurveTo(R * 0.52, -R * 0.20, 0, 0);
  ctx.closePath();
  ctx.fillStyle = 'hsl(200,72%,80%)';
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  /* 身体 */
  ctx.beginPath();
  ctx.ellipse(0, R * 0.30, R * 0.30, R * 0.42, 0, 0, TAU);
  const bg = ctx.createRadialGradient(-R * 0.1, R * 0.15, 0, 0, R * 0.30, R * 0.55);
  bg.addColorStop(0, 'hsl(200,68%,88%)');
  bg.addColorStop(1, 'hsl(200,58%,72%)');
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = 'hsl(200,72%,60%)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* 眼睛 */
  ctx.beginPath();
  ctx.arc(-R * 0.10, R * 0.16, R * 0.055, 0, TAU);
  ctx.fillStyle = '#0a0a1a';
  ctx.fill();

  /* 喙 */
  ctx.beginPath();
  ctx.moveTo(0, R * 0.22);
  ctx.lineTo(R * 0.18, R * 0.26);
  ctx.lineTo(0, R * 0.32);
  ctx.closePath();
  ctx.fillStyle = 'hsl(30,92%,62%)';
  ctx.fill();

  ctx.restore();
}

function drawOctopus(R, t){
  ctx.save();

  /* 触手 */
  const N = 8;
  for (let i = 0; i < N; i++){
    const ang0 = (i / (N - 1) - 0.5) * Math.PI * 1.10;
    const wob = Math.sin(t * 2 + i * 0.9) * 0.22;

    const sx = Math.sin(ang0) * R * 0.42;
    const sy = Math.cos(ang0) * R * 0.28 + R * 0.10;

    const ex = Math.sin(ang0 + wob) * R * 0.72;
    const ey = R * 0.62 + wob * R * 0.10;

    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(
      (sx + ex) * 0.5 + wob * R * 0.25,
      (sy + ey) * 0.5,
      ex, ey
    );
    ctx.strokeStyle = 'hsl(280,62%,76%)';
    ctx.lineWidth = R * 0.10;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.strokeStyle = 'hsl(280,78%,86%)';
    ctx.lineWidth = R * 0.04;
    ctx.stroke();
  }

  /* 头部 */
  ctx.beginPath();
  ctx.arc(0, -R * 0.15, R * 0.50, 0, TAU);
  const bg = ctx.createRadialGradient(-R * 0.18, -R * 0.32, 0, 0, -R * 0.15, R * 0.62);
  bg.addColorStop(0, 'hsl(280,72%,86%)');
  bg.addColorStop(1, 'hsl(280,55%,68%)');
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = 'hsl(280,68%,58%)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 眼睛 */
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.arc(s * R * 0.18, -R * 0.20, R * 0.09, 0, TAU);
    ctx.fillStyle = '#fafafa';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * R * 0.18, -R * 0.20, R * 0.05, 0, TAU);
    ctx.fillStyle = '#0a0a1a';
    ctx.fill();
  }

  ctx.restore();
}

function drawFox(R, t){
  ctx.save();

  const sway = Math.sin(t * 1.5) * 0.08;

  /* 尾巴 */
  ctx.save();
  ctx.translate(R * 0.48, R * 0.40);
  ctx.rotate(sway);
  ctx.beginPath();
  ctx.ellipse(0, 0, R * 0.42, R * 0.20, -0.32, 0, TAU);
  ctx.fillStyle = 'hsl(28,78%,66%)';
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(R * 0.32, -R * 0.10, R * 0.16, R * 0.13, -0.32, 0, TAU);
  ctx.fillStyle = 'hsl(40,62%,90%)';
  ctx.fill();
  ctx.restore();

  /* 身体（钟形） */
  const bw = R * 0.42;
  const bh = R * 0.56;
  ctx.beginPath();
  ctx.moveTo(-bw, R * 0.58);
  ctx.bezierCurveTo(-bw * 1.1, -bh * 0.5, -bw * 0.58, -bh, 0, -bh);
  ctx.bezierCurveTo(bw * 0.58, -bh, bw * 1.1, -bh * 0.5, bw, R * 0.58);
  ctx.closePath();

  const bg = ctx.createRadialGradient(-R * 0.12, -bh * 0.5, 0, 0, 0, bh * 1.15);
  bg.addColorStop(0, 'hsl(28,88%,80%)');
  bg.addColorStop(1, 'hsl(28,72%,60%)');
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = 'hsl(28,74%,48%)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 耳朵 */
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.moveTo(s * R * 0.10, -bh * 0.78);
    ctx.lineTo(s * R * 0.28, -bh * 1.38);
    ctx.lineTo(s * R * 0.36, -bh * 0.72);
    ctx.closePath();
    ctx.fillStyle = 'hsl(28,78%,70%)';
    ctx.fill();
    ctx.strokeStyle = 'hsl(28,74%,50%)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  /* 眼睛 */
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.arc(s * R * 0.15, -bh * 0.50, R * 0.05, 0, TAU);
    ctx.fillStyle = '#0a0a1a';
    ctx.fill();
  }

  /* 鼻子 */
  ctx.beginPath();
  ctx.arc(0, -bh * 0.28, R * 0.05, 0, TAU);
  ctx.fillStyle = 'hsl(0,0%,15%)';
  ctx.fill();

  ctx.restore();
}

function drawButterfly(R, t){
  const flap = 0.35 + Math.abs(Math.sin(t * 1.9)) * 0.65;

  ctx.save();

  /* 翅膀：玫瑰线 r = cos(2θ) */
  function drawWing(side){
    ctx.save();
    ctx.scale(side * flap, 1);

    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 180; i++){
      const th = (i / 180) * TAU;
      const r = Math.cos(2 * th);
      if (r < 0) continue;
      const rr = Math.abs(r);
      const x = Math.cos(th) * rr * R * 0.92;
      const y = Math.sin(th) * rr * R * 0.92;
      if (first){ ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.95);
    grad.addColorStop(0, 'hsla(310,92%,84%,0.92)');
    grad.addColorStop(0.6, 'hsla(280,82%,70%,0.78)');
    grad.addColorStop(1, 'hsla(260,78%,58%,0.55)');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'hsla(315,95%,90%,0.85)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    /* 花纹 */
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.32, 0, TAU);
    ctx.strokeStyle = 'hsla(48,100%,86%,0.62)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.restore();
  }

  drawWing(-1);
  drawWing(1);

  /* 身体 */
  ctx.beginPath();
  ctx.ellipse(0, 0, R * 0.07, R * 0.58, 0, 0, TAU);
  ctx.fillStyle = 'hsl(280,55%,30%)';
  ctx.fill();

  /* 触角 */
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.moveTo(0, -R * 0.52);
    ctx.quadraticCurveTo(s * R * 0.16, -R * 0.88, s * R * 0.30, -R * 0.98);
    ctx.strokeStyle = 'hsl(280,62%,62%)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(s * R * 0.30, -R * 0.98, R * 0.05, 0, TAU);
    ctx.fillStyle = 'hsl(320,85%,82%)';
    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   公式归一化与匹配
   ========================================================= */
function normalize(str){
  return (str || '')
    .toLowerCase()
    .replace(/\s+/g, '')
    .replace(/\*\*/g, '^')
    .replace(/[·・×]/g, '*')
    .replace(/÷/g, '/')
    .replace(/²/g, '^2')
    .replace(/³/g, '^3')
    .replace(/θ/g, 'θ')
    .replace(/π/g, 'pi')
    .replace(/\*/g, '')
    .replace(/−/g, '-')
    .replace(/–/g, '-')
    .replace(/—/g, '-');
}

function matchAnimal(input){
  const n = normalize(input);
  if (!n) return null;

  /* 精确匹配优先 */
  for (let i = 0; i < ANIMALS.length; i++){
    const a = ANIMALS[i];
    for (let j = 0; j < a.patterns.length; j++){
      if (n === normalize(a.patterns[j])) return a;
    }
  }

  /* 包含匹配 */
  for (let i = 0; i < ANIMALS.length; i++){
    const a = ANIMALS[i];
    for (let j = 0; j < a.patterns.length; j++){
      const p = normalize(a.patterns[j]);
      if (p.length >= 3 && n.indexOf(p) >= 0) return a;
    }
  }

  return null;
}

/* =========================================================
   音效系统
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let droneOn = false;
let ambTimer = null;

function setAudioDot(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioDot(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.44, ac.currentTime, 1.6);

  startDrone();
  scheduleAmbient();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioDot(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioDot(true);
  }
}

/* ---- 氛围和弦 ---- */
function startDrone(){
  if (droneOn) return;
  droneOn = true;
  const now = ac.currentTime;

  /* A 小调：A2 C4 E4 A4 */
  const notes = [110.00, 261.63, 329.63, 440.00];
  const gains = [1.00, 0.48, 0.34, 0.20];

  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
    osc.frequency.value = notes[i];

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 620;
    lp.Q.value = 1.2;

    const g = ac.createGain();
    g.gain.value = 0;
    g.gain.setTargetAtTime(0.014 * gains[i], now, 3.0);

    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.028 + i * 0.011;
    const lfoG = ac.createGain();
    lfoG.gain.value = 0.006 * gains[i];
    lfo.connect(lfoG);
    lfoG.connect(g.gain);
    lfo.start();

    osc.connect(lp);
    lp.connect(g);
    g.connect(master);
    osc.start();
  }
}

/* ---- 空灵点缀 ---- */
function playAmbientPing(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [659.25, 783.99, 880.00, 1046.50, 1318.51];
  const f = notes[Math.floor(Math.random() * notes.length)];

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = f;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.005, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 3.0);
}

function scheduleAmbient(){
  if (ambTimer) clearTimeout(ambTimer);
  const wait = 2600 + Math.random() * 3600;
  ambTimer = setTimeout(function(){
    if (audioReady && ac && ac.state === 'running') playAmbientPing();
    scheduleAmbient();
  }, wait);
}

/* ---- 光爆 ---- */
function playBurst(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(880, now);
  osc.frequency.exponentialRampToValueAtTime(120, now + 0.36);

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(3600, now);
  lp.frequency.exponentialRampToValueAtTime(240, now + 0.36);
  lp.Q.value = 3.2;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.048, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.44);

  osc.connect(lp);
  lp.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.46);

  const nl = Math.ceil(ac.sampleRate * 0.28);
  const buf = ac.createBuffer(1, nl, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const t = i / nl;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.2);
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2200;
  bp.Q.value = 1.4;
  const ng = ac.createGain();
  ng.gain.value = 0.038;
  src.connect(bp);
  bp.connect(ng);
  ng.connect(master);
  src.start(now);
}

/* ---- 变身完成 ---- */
function playHatch(hue){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 每只动物一个独立的音阶基点 */
  const base = 261.63 * Math.pow(2, (hue / 360) * 0.6);

  const notes = [base, base * 1.25, base * 1.5, base * 2];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.075;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.038, t0 + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.5);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.7);

    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = notes[i] * 2;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.03);
    g2.gain.linearRampToValueAtTime(0.012, t0 + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1);
    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.03);
    osc2.stop(t0 + 1.3);
  }
}

/* ---- 新收集成就音 ---- */
function playCollect(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.06;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.034, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.6);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.8);
  }
}

/* ---- 失败 ---- */
function playFail(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  for (let k = 0; k < 2; k++){
    const t0 = now + k * 0.18;
    const osc = ac.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, t0);
    osc.frequency.exponentialRampToValueAtTime(140, t0 + 0.16);

    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.028, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 0.22);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 0.24);
  }
}

/* =========================================================
   粒子
   ========================================================= */
function spawnBurst(count, hue, speed){
  for (let i = 0; i < count; i++){
    const a = Math.random() * TAU;
    const v = 60 + Math.random() * speed;
    game.particles.push({
      x: CX + Math.cos(a) * 8,
      y: CY + Math.sin(a) * 8,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v,
      life: 1,
      decay: 1.2 + Math.random() * 1.5,
      size: 1.6 + Math.random() * 3.0,
      hue: hue + (Math.random() - 0.5) * 50
    });
  }
}

function updateParticles(dt){
  for (let i = game.particles.length - 1; i >= 0; i--){
    const p = game.particles[i];
    p.life -= p.decay * dt;
    if (p.life <= 0){ game.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.vy += 80 * dt;
  }
}

function drawParticles(){
  if (game.particles.length === 0) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < game.particles.length; i++){
    const p = game.particles[i];
    const a = p.life * p.life * 0.94;
    const r = p.size * p.life;

    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4.5);
    g.addColorStop(0, 'hsla(' + p.hue + ',100%,95%,' + a + ')');
    g.addColorStop(0.42, 'hsla(' + p.hue + ',100%,72%,' + (a * 0.32) + ')');
    g.addColorStop(1, 'hsla(' + p.hue + ',100%,62%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(t){
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.40, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  bg.addColorStop(0, '#0d0822');
  bg.addColorStop(0.42, '#070518');
  bg.addColorStop(1, '#020106');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 漂浮公式符号 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < bgSymbols.length; i++){
    const s = bgSymbols[i];

    s.x += s.vx * 0.016;
    s.y += s.vy * 0.016;
    s.rot += s.rotSpd * 0.016;

    if (s.y < -0.08){ s.y = 1.08; s.x = Math.random(); }
    if (s.x < -0.08) s.x = 1.08;
    if (s.x > 1.08) s.x = -0.08;

    const px = s.x * W;
    const py = s.y * H;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(s.rot);

    ctx.font = '300 ' + s.size + 'px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'hsla(' + s.hue + ', 80%, 76%, ' + s.alpha + ')';
    ctx.fillText(s.char, 0, 0);

    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：光球与动物
   ========================================================= */
function drawOrb(t){
  const pulse = 1 + Math.sin(t * 2.2) * 0.10;
  const R = BASE_R * 0.42 * pulse;

  ctx.save();
  ctx.translate(CX, CY);

  /* 外层光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 4.2);
  g.addColorStop(0, 'hsla(' + game.orbHue + ',100%,86%,0.62)');
  g.addColorStop(0.42, 'hsla(' + game.orbHue + ',100%,68%,0.22)');
  g.addColorStop(1, 'hsla(' + game.orbHue + ',100%,58%,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, R * 4.2, 0, TAU);
  ctx.fill();

  /* 核心 */
  ctx.globalCompositeOperation = 'source-over';
  const cg = ctx.createRadialGradient(-R * 0.3, -R * 0.3, 0, 0, 0, R);
  cg.addColorStop(0, 'rgba(255,255,255,1)');
  cg.addColorStop(0.5, 'hsla(' + game.orbHue + ',100%,82%,0.96)');
  cg.addColorStop(1, 'hsla(' + game.orbHue + ',100%,62%,0.88)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.fill();

  /* 轨道符号 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++){
    const ang = t * 0.9 + i * (TAU / 5);
    const rr = R * 2.4;
    const x = Math.cos(ang) * rr;
    const y = Math.sin(ang) * rr * 0.62;

    ctx.font = '500 ' + (R * 0.30).toFixed(0) + 'px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'hsla(' + (game.orbHue + i * 24) + ',100%,82%,0.72)';
    ctx.fillText(SYMBOLS[i % SYMBOLS.length], x, y);
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();
}

function drawAnimalScene(animal, t){
  /* 计算出现进度 */
  let scale = 1;
  let rotate = 0;
  let alpha = 1;

  if (game.phase === 'emerge'){
    const p = clamp01(game.phaseT / 0.9);
    scale = easeOutBack(p);
    rotate = (1 - p) * 0.5;
    alpha = clamp01(p * 1.4);
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(CX, CY);
  ctx.rotate(rotate);
  ctx.scale(scale, scale);

  /* 总光晕 */
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, BASE_R * 2.6);
  g.addColorStop(0, 'hsla(' + animal.hue + ',100%,82%,0.38)');
  g.addColorStop(0.5, 'hsla(' + animal.hue + ',100%,66%,0.14)');
  g.addColorStop(1, 'hsla(' + animal.hue + ',100%,58%,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, BASE_R * 2.6, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* 动物 */
  animal.draw(BASE_R, t);

  ctx.restore();

  /* 公式标签 */
  if (game.phase === 'active' || game.phase === 'emerge'){
    const p = game.phase === 'emerge'
      ? clamp01((game.phaseT - 0.4) / 0.5)
      : 1;

    if (p > 0.01){
      ctx.save();
      ctx.globalAlpha = p;

      const labelY = CY + BASE_R * 1.60;

      ctx.font = '600 ' + Math.min(22, BASE_R * 0.20).toFixed(0) +
        'px "SF Mono", Consolas, Monaco, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      /* 描边 */
      ctx.strokeStyle = 'rgba(4,2,16,0.88)';
      ctx.lineWidth = Math.max(3, BASE_R * 0.06);
      ctx.lineJoin = 'round';
      ctx.strokeText(animal.formula, CX, labelY);

      /* 填充 */
      const fg = ctx.createLinearGradient(
        CX - BASE_R, labelY - 20,
        CX + BASE_R, labelY + 20
      );
      fg.addColorStop(0, 'hsl(' + (animal.hue + 30) + ',100%,88%)');
      fg.addColorStop(1, 'hsl(' + animal.hue + ',100%,78%)');
      ctx.fillStyle = fg;
      ctx.fillText(animal.formula, CX, labelY);

      /* 名称 */
      ctx.font = '400 ' + Math.min(13, BASE_R * 0.12).toFixed(0) +
        'px "SF Mono", Consolas, Monaco, monospace';
      ctx.fillStyle = 'hsla(' + animal.hue + ',80%,84%,0.72)';
      ctx.fillText(animal.name + ' · ' + animal.shape, CX, labelY + BASE_R * 0.22);

      ctx.restore();
    }
  }
}

/* =========================================================
   渲染主函数
   ========================================================= */
function render(t){
  drawBackground(t);

  /* 光球 / 动物 */
  if (game.phase === 'idle'){
    drawOrb(t);
  } else if (game.phase === 'gathering'){
    drawOrb(t);
  } else if (game.phase === 'flash'){
    drawOrb(t);
  } else if (game.phase === 'emerge' || game.phase === 'active'){
    drawAnimalScene(game.currentAnimal, t);
  }

  /* 光爆 */
  if (game.phase === 'flash'){
    const p = clamp01(game.phaseT / 0.3);
    const R = BASE_R * (1 + p * 7);
    const a = (1 - p) * (1 - p) * 0.95;

    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++){
      const rr = R * (0.6 + k * 0.4);
      const aa = a * (1 - k * 0.30);
      if (aa < 0.01) continue;

      const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, rr);
      g.addColorStop(0, 'hsla(' + game.currentAnimal.hue + ',100%,94%,' + (aa * 0.42) + ')');
      g.addColorStop(0.42, 'hsla(' + game.currentAnimal.hue + ',100%,76%,' + (aa * 0.16) + ')');
      g.addColorStop(1, 'hsla(' + game.currentAnimal.hue + ',100%,64%,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(CX, CY, rr, 0, TAU);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 粒子 */
  drawParticles();

  /* 全屏闪光 */
  if (game.flash > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,245,225,' + (game.flash * 0.42) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.46, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.92
  );
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2,1,8,0.26)');
  vg.addColorStop(1, 'rgba(0,0,4,0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   状态机
   ========================================================= */
function setPhase(p){
  game.phase = p;
  game.phaseT = 0;
}

function updatePhase(dt){
  game.phaseT += dt;

  if (game.phase === 'gathering'){
    if (game.phaseT > 0.80){
      setPhase('flash');
      game.flash = 0.75;
      playBurst();
      spawnBurst(70, game.currentAnimal.hue, 340);
    }
  } else if (game.phase === 'flash'){
    game.flash *= Math.exp(-5.5 * dt);
    if (game.phaseT > 0.30){
      setPhase('emerge');
      playHatch(game.currentAnimal.hue);
    }
  } else if (game.phase === 'emerge'){
    if (game.phaseT > 0.90){
      setPhase('active');
      game.flash = 0.4;
    }
  } else if (game.phase === 'active'){
    game.flash *= Math.exp(-4 * dt);
  }
}

/* =========================================================
   变身主逻辑
   ========================================================= */
const inputEl = document.getElementById('formulaInput');
const morphBtn = document.getElementById('morphBtn');

function doMorph(){
  if (game.phase !== 'idle' && game.phase !== 'active') return;

  const raw = inputEl.value.trim();
  if (!raw){
    shakeInput();
    return;
  }

  initAudio();

  const animal = matchAnimal(raw);

  if (!animal){
    shakeInput();
    playFail();
    showToast('未识别的公式 · 试试 y=x² 或 r=θ', 'bad');
    return;
  }

  /* 开始变身 */
  game.currentAnimal = animal;
  game.orbHue = animal.hue;

  setPhase('gathering');
  playCharging();

  inputEl.blur();

  /* 更新图鉴 */
  if (!game.collected[animal.id]){
    game.collected[animal.id] = true;
    game.collectedCount++;
    updateProgress();
    markCollected(animal.id);

    setTimeout(function(){
      playCollect();
      showToast('✦ 新发现 · ' + animal.name, 'rare');
    }, 1400);
  } else {
    setTimeout(function(){
      showToast('再次变身 · ' + animal.name, false);
    }, 1400);
  }
}

function shakeInput(){
  inputEl.classList.remove('error');
  /* 强制重排以重启动画 */
  void inputEl.offsetWidth;
  inputEl.classList.add('error');
  setTimeout(function(){
    inputEl.classList.remove('error');
  }, 520);
}

/* =========================================================
   UI
   ========================================================= */
const collectionEl = document.getElementById('collection');

function buildCollection(){
  collectionEl.innerHTML = '';
  for (let i = 0; i < ANIMALS.length; i++){
    const a = ANIMALS[i];
    const el = document.createElement('div');
    el.className = 'col-slot';
    el.dataset.id = a.id;

    const icon = document.createElement('div');
    icon.className = 'col-icon';
    icon.style.setProperty('--h', a.hue);
    icon.textContent = '?';

    const name = document.createElement('div');
    name.className = 'col-name';
    name.textContent = a.name;

    el.appendChild(icon);
    el.appendChild(name);
    collectionEl.appendChild(el);
  }
}

function markCollected(id){
  const el = collectionEl.querySelector('[data-id="' + id + '"]');
  if (!el) return;
  el.classList.add('on');
  const icon = el.querySelector('.col-icon');
  if (icon) icon.textContent = '✓';
}

function updateProgress(){
  const c = document.getElementById('collectedCount');
  const t = document.getElementById('totalCount');
  if (c) c.textContent = game.collectedCount;
  if (t) t.textContent = ANIMALS.length;
}

/* ---- 快捷公式 ---- */
const QUICK_LIST = ['y = x²', 'y = sin(x)', 'r = θ', 'y = 1/x'];

function buildQuick(){
  const wrap = document.getElementById('quickRow');
  wrap.innerHTML = '';
  for (let i = 0; i < QUICK_LIST.length; i++){
    const chip = document.createElement('button');
    chip.className = 'quick-chip';
    chip.textContent = QUICK_LIST[i];
    chip.addEventListener('click', function(e){
      e.stopPropagation();
      initAudio();
      playClick();
      inputEl.value = QUICK_LIST[i];
      inputEl.focus();
    });
    wrap.appendChild(chip);
  }
}

/* =========================================================
   Toast
   ========================================================= */
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(text, type){
  toastEl.textContent = text;
  toastEl.classList.remove('bad', 'rare');
  if (type === 'bad') toastEl.classList.add('bad');
  else if (type === 'rare') toastEl.classList.add('rare');

  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toastEl.classList.remove('show');
  }, 2200);
}

/* =========================================================
   事件
   ========================================================= */
inputEl.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){
    e.preventDefault();
    doMorph();
  }
});

inputEl.addEventListener('focus', function(){
  initAudio();
});

morphBtn.addEventListener('click', function(e){
  e.preventDefault();
  initAudio();
  playClick();
  doMorph();
});

window.addEventListener('pointerdown', function(){
  initAudio();
}, { once: false });

window.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    inputEl.blur();
  }
});

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;
let t = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  t += dt;

  updatePhase(dt);
  updateParticles(dt);

  render(t);
}

/* =========================================================
   启动
   ========================================================= */
resize();
buildCollection();
buildQuick();
updateProgress();

requestAnimationFrame(loop);

setTimeout(function(){
  showToast('输入数学公式 · 让光球变身', false);
}, 1200);

setTimeout(function(){
  inputEl.focus();
}, 1600);

})();
</script>
