<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>积分面积填充 · 黎曼和收敛</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#03060d;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  /* 左上标题 */
  #title{
    position:absolute;top:0;left:0;
    padding:28px 36px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(255,180,120,.36);font-weight:300;margin-bottom:10px;
  }
  #title h1{
    font-size:clamp(18px,2.6vw,30px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#ffc880 0%,#ff9a80 38%,#e080b0 70%,#a090ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 26px rgba(255,170,120,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(12px,1.5vw,15px);
    letter-spacing:.10em;
    color:rgba(200,220,255,.62);
  }
  #title .formula .hl1{color:#5ee0ff;}
  #title .formula .hl2{color:#ffc880;}
  #title .formula .hl3{color:#a090ff;}

  /* 右上函数切换 */
  #funcs{
    position:absolute;top:0;right:0;
    padding:28px 36px;
    display:flex;flex-direction:column;gap:7px;
    align-items:flex-end;
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
    pointer-events:auto;
  }
  .fbtn{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.10em;
    color:rgba(200,215,250,.62);
    background:rgba(24,30,58,.46);
    border:1px solid rgba(150,140,230,.24);
    border-radius:8px;
    padding:7px 13px;cursor:pointer;
    transition:.28s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    white-space:nowrap;
    text-align:right;
    min-width:130px;
  }
  .fbtn:hover{
    border-color:rgba(255,200,160,.72);
    color:rgba(255,225,190,.95);
    background:rgba(120,80,60,.22);
  }
  .fbtn.on{
    border-color:rgba(255,200,140,.88);
    color:rgba(255,235,200,.98);
    background:rgba(150,100,60,.28);
    box-shadow:0 0 16px rgba(255,170,110,.32);
  }

  /* 左下进度与数值 */
  #panel{
    position:absolute;bottom:0;left:0;
    padding:0 36px 30px;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
    min-width:280px;
  }
  #panel .row{
    display:flex;justify-content:space-between;gap:22px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10.5px;letter-spacing:.08em;
    line-height:2.0;
  }
  #panel .row .k{color:rgba(180,200,245,.48);}
  #panel .row .v{color:rgba(255,215,150,.92);font-weight:600;}
  #panel .row .v1{color:rgba(140,225,255,.94);font-weight:600;}
  #panel .row .v2{color:rgba(255,160,120,.94);font-weight:600;}
  #panel .row.big{
    font-size:13px;line-height:2.4;
    margin-bottom:2px;
  }
  #panel .row.big .v{font-size:16px;}

  /* 进度条 */
  #bar{
    margin-top:10px;
    width:220px;height:3px;
    background:rgba(120,150,220,.16);
    border-radius:2px;
    overflow:hidden;
    position:relative;
  }
  #barFill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#5ee0ff,#ffc880,#e080b0);
    border-radius:2px;
    transition:width .12s linear;
    box-shadow:0 0 10px rgba(255,180,120,.6);
  }

  /* 右下 n 值显示 */
  #nDisplay{
    position:absolute;bottom:0;right:0;
    padding:0 36px 30px;
    text-align:right;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    opacity:0;animation:fade 1.6s 1.5s ease forwards;
  }
  #nDisplay .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(255,180,120,.32);margin-bottom:6px;
  }
  #nDisplay .bigv{
    font-size:clamp(26px,3.4vw,40px);
    font-weight:200;letter-spacing:.06em;
    color:rgba(200,230,255,.94);
    line-height:1;
    filter:drop-shadow(0 0 16px rgba(140,200,255,.45));
  }
  #nDisplay .sub{
    font-size:9.5px;letter-spacing:.16em;
    color:rgba(180,200,245,.44);
    margin-top:6px;
  }

  /* 音频指示 */
  #audioDot{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:14px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(255,190,140,.30);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
    display:flex;align-items:center;gap:7px;
    white-space:nowrap;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(200,160,220,.24);
    transition:background .4s, box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(255,180,140,.92);
    box-shadow:0 0 10px rgba(255,170,120,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:760px){
    #title{padding:14px 16px;}
    #title .en{font-size:8px;}
    #funcs{padding:14px 16px;gap:5px;}
    .fbtn{font-size:9px;padding:5px 9px;min-width:96px;border-radius:6px;}
    #panel{padding:0 16px 16px;min-width:180px;}
    #panel .row{font-size:9px;}
    #panel .row.big{font-size:11px;}
    #bar{width:140px;}
    #nDisplay{padding:0 16px 16px;}
    #nDisplay .bigv{font-size:22px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">DEFINITE INTEGRAL · RIEMANN SUM</div>
    <h1>积分面积填充</h1>
    <div class="formula">
      <span class="hl1">∫</span><sub><span class="hl3">a</span></sub><sup><span class="hl3">b</span></sup>
      <span class="hl2">f(x)</span> dx
    </div>
  </div>

  <div id="funcs">
    <button class="fbtn on" data-idx="0">f(x) = x²</button>
    <button class="fbtn" data-idx="1">f(x) = sin(x)</button>
    <button class="fbtn" data-idx="2">f(x) = √x</button>
    <button class="fbtn" data-idx="3">f(x) = 1/(1+x²)</button>
    <button class="fbtn" data-idx="4">f(x) = x·sin(x)</button>
  </div>

  <div id="panel">
    <div class="row big">
      <span class="k">黎曼和 Sₙ</span>
      <span class="v" id="sumVal">0.000000</span>
    </div>
    <div class="row">
      <span class="k">精确值 I</span>
      <span class="v1" id="exactVal">0.333333</span>
    </div>
    <div class="row">
      <span class="k">误差 |Sₙ − I|</span>
      <span class="v2" id="errVal">0.000000</span>
    </div>
    <div id="bar"><div id="barFill"></div></div>
  </div>

  <div id="nDisplay">
    <span class="lab">SUBDIVISIONS</span>
    <div class="bigv" id="nVal">4</div>
    <div class="sub" id="nSub">矩形条数 n = 4</div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>填充音 · 完成提示音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1, S = 0;

/* =========================================================
   函数库
   ========================================================= */
const FUNCS = [
  {
    label: 'f(x) = x²',
    f: function(x){ return x * x; },
    a: 0, b: 1,
    exact: 1 / 3,
    exactLabel: '1/3'
  },
  {
    label: 'f(x) = sin(x)',
    f: function(x){ return Math.sin(x); },
    a: 0, b: Math.PI,
    exact: 2,
    exactLabel: '2'
  },
  {
    label: 'f(x) = √x',
    f: function(x){ return Math.sqrt(x); },
    a: 0, b: 1,
    exact: 2 / 3,
    exactLabel: '2/3'
  },
  {
    label: 'f(x) = 1/(1+x²)',
    f: function(x){ return 1 / (1 + x * x); },
    a: 0, b: 1,
    exact: Math.PI / 4,
    exactLabel: 'π/4'
  },
  {
    label: 'f(x) = x·sin(x)',
    f: function(x){ return x * Math.sin(x); },
    a: 0, b: Math.PI,
    exact: Math.PI,
    exactLabel: 'π'
  }
];

let funcIdx = 0;
let F = FUNCS[funcIdx];

/* =========================================================
   动画状态
   ========================================================= */
const MAX_LEVEL = 7;         // n = 4 << 7 = 512
let level = 0;
let levelT = 0;
let finished = false;
let finishHold = 0;
let lastSoundSlot = -1;

let displaySum = 0;
let displayErr = 0;

function curN(){ return 4 << level; }
function curDur(){ return 0.90 + level * 0.20; }
function curProgress(){ return Math.min(1, levelT / curDur()); }

/* =========================================================
   布局
   ========================================================= */
let plotX = 0, plotY = 0, plotW = 0, plotH = 0;
let maxY = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H);

  plotW = Math.min(W * 0.82, H * 1.55);
  plotH = plotW * 0.60;
  plotX = (W - plotW) * 0.5;
  plotY = (H - plotH) * 0.5 - 10;

  /* 计算 y 轴范围 */
  let mx = 0;
  const N = 400;
  for (let i = 0; i <= N; i++){
    const x = F.a + (F.b - F.a) * i / N;
    const v = F.f(x);
    if (isFinite(v) && v > mx) mx = v;
  }
  maxY = Math.max(0.001, mx) * 1.18;
}
window.addEventListener('resize', resize);

function toPX(x){ return plotX + (x - F.a) / (F.b - F.a) * plotW; }
function toPY(y){ return plotY + plotH - (y / maxY) * plotH; }

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.52, ac.currentTime, 1.8);

  /* 极轻背景垫音 */
  const o = ac.createOscillator();
  o.type = 'sine';
  o.frequency.value = 55;
  const og = ac.createGain();
  og.gain.value = 0.012;
  o.connect(og);
  og.connect(master);
  o.start();

  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.09;
  const lg = ac.createGain();
  lg.gain.value = 0.007;
  lfo.connect(lg);
  lg.connect(og.gain);
  lfo.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* ---- 填充音：短促清亮 ---- */
function playFillTick(lv, pos){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 音高：随层级上升，随位置变化 */
  const base = 460 + lv * 55;
  const f = base + pos * 340 + Math.random() * 40;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 0.72, now + 0.055);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.024, now + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0003, now + 0.085);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.10);

  /* 极短噪声，模拟"填充"质感 */
  const nl = Math.max(1, Math.ceil(ac.sampleRate * 0.012));
  const nbuf = ac.createBuffer(1, nl, ac.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const t = i / nl;
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.5);
  }
  const nsrc = ac.createBufferSource();
  nsrc.buffer = nbuf;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2200 + Math.random() * 600;
  bp.Q.value = 1.8;
  const ng = ac.createGain();
  ng.gain.value = 0.005;
  nsrc.connect(bp);
  bp.connect(ng);
  ng.connect(master);
  nsrc.start(now);
}

/* ---- 层级完成音：音高逐级上升 ---- */
function playLevelDone(lv){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const freqs = [392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 698.46, 783.99];
  const f = freqs[Math.min(lv, freqs.length - 1)];

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = f;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.042, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0003, now + 0.75);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.80);

  /* 五度泛音 */
  const osc2 = ac.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = f * 1.5;

  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0, now + 0.02);
  g2.gain.linearRampToValueAtTime(0.018, now + 0.03);
  g2.gain.exponentialRampToValueAtTime(0.0002, now + 0.60);

  osc2.connect(g2);
  g2.connect(master);
  osc2.start(now + 0.02);
  osc2.stop(now + 0.65);
}

/* ---- 全部完成：上行和弦 ---- */
function playFinishChord(){
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];

  for (let i = 0; i < notes.length; i++){
    const f = notes[i];

    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;

    const g = ac.createGain();
    const t0 = now + i * 0.075;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.050, t0 + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0003, t0 + 2.2);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 2.4);

    /* 泛音 */
    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = f * 2;

    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.04);
    g2.gain.linearRampToValueAtTime(0.014, t0 + 0.06);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.5);

    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.04);
    osc2.stop(t0 + 1.7);
  }
}

/* =========================================================
   星星
   ========================================================= */
const stars = [];
function buildStars(){
  stars.length = 0;
  const n = Math.min(240, Math.round(W * H / 8000));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.0 + 0.14,
      ph: Math.random() * TAU,
      sp: 0.22 + Math.random() * 0.85,
      hue: 210 + Math.random() * 60,
      base: 0.05 + Math.random() * 0.22
    });
  }
}
window.addEventListener('resize', buildStars);

/* =========================================================
   计算黎曼和（实时，含部分矩形）
   ========================================================= */
function liveSum(){
  const n = curN();
  const fp = curProgress();
  const dx = (F.b - F.a) / n;

  let s = 0;
  const done = fp * n;

  for (let i = 0; i < n; i++){
    const rp = done - i;
    if (rp <= 0) break;
    const p = rp > 1 ? 1 : rp;
    const x = F.a + i * dx;
    s += F.f(x) * dx * p;
  }
  return s;
}

function fullSum(n){
  const dx = (F.b - F.a) / n;
  let s = 0;
  for (let i = 0; i < n; i++){
    s += F.f(F.a + i * dx) * dx;
  }
  return s;
}

/* =========================================================
   主更新
   ========================================================= */
function update(dt){
  if (dt > 0.06) dt = 0.06;

  if (finished){
    finishHold -= dt;
    if (finishHold <= 0){
      reset();
    }
  } else {
    levelT += dt;

    const n = curN();
    const fp = curProgress();
    const done = fp * n;

    /* 音效：每层最多 16 次填充音 */
    const maxSounds = 16;
    const every = Math.max(1, n / maxSounds);
    const slot = Math.floor(done / every);

    if (slot > lastSoundSlot){
      lastSoundSlot = slot;
      if (done < n - 0.01){
        playFillTick(level, done / n);
      }
    }

    /* 本层完成 */
    if (fp >= 1){
      if (level >= MAX_LEVEL){
        finished = true;
        finishHold = 4.5;
        playFinishChord();
      } else {
        playLevelDone(level);
        level++;
        levelT = 0;
        lastSoundSlot = -1;
      }
    }
  }

  /* 平滑显示数值 */
  const target = finished ? fullSum(curN()) : liveSum();
  displaySum += (target - displaySum) * (1 - Math.exp(-9 * dt));

  const targetErr = Math.abs(F.exact - target);
  displayErr += (targetErr - displayErr) * (1 - Math.exp(-9 * dt));
}

function reset(){
  level = 0;
  levelT = 0;
  finished = false;
  finishHold = 0;
  lastSoundSlot = -1;
  displaySum = 0;
  displayErr = Math.abs(F.exact);
}

/* =========================================================
   绘制
   ========================================================= */
function drawBackground(t){
  const bg = ctx.createRadialGradient(
    W * 0.5, H * 0.45, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.88
  );
  bg.addColorStop(0.00, '#0a1020');
  bg.addColorStop(0.42, '#050a16');
  bg.addColorStop(1.00, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.012) continue;
    ctx.fillStyle = 'hsla(' + s.hue + ', 80%, 86%, ' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- 网格 ---- */
function drawGrid(){
  /* 绘图区底衬 */
  ctx.fillStyle = 'rgba(4, 8, 18, 0.48)';
  ctx.fillRect(plotX, plotY, plotW, plotH);

  ctx.strokeStyle = 'rgba(90, 140, 220, 0.11)';
  ctx.lineWidth = 1;
  ctx.strokeRect(plotX, plotY, plotW, plotH);

  /* 水平网格线 */
  const stepsY = 4;
  for (let i = 0; i <= stepsY; i++){
    const y = plotY + plotH * i / stepsY;
    ctx.beginPath();
    ctx.moveTo(plotX, y);
    ctx.lineTo(plotX + plotW, y);
    ctx.strokeStyle = 'rgba(80, 130, 210, 0.075)';
    ctx.stroke();
  }

  /* 垂直网格线 */
  const stepsX = 8;
  for (let i = 0; i <= stepsX; i++){
    const x = plotX + plotW * i / stepsX;
    ctx.beginPath();
    ctx.moveTo(x, plotY);
    ctx.lineTo(x, plotY + plotH);
    ctx.strokeStyle = 'rgba(80, 130, 210, 0.075)';
    ctx.stroke();
  }
}

/* ---- 坐标轴 ---- */
function drawAxes(){
  const axisY = toPY(0);

  /* x 轴 */
  ctx.beginPath();
  ctx.moveTo(plotX, axisY);
  ctx.lineTo(plotX + plotW, axisY);
  ctx.strokeStyle = 'rgba(120, 170, 240, 0.42)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* y 轴（在 x = a 处） */
  ctx.beginPath();
  ctx.moveTo(plotX, plotY);
  ctx.lineTo(plotX, plotY + plotH);
  ctx.strokeStyle = 'rgba(120, 170, 240, 0.30)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* 刻度标签 */
  ctx.font = '400 10.5px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(150, 185, 240, 0.52)';

  /* x 轴标签 */
  const isPi = (funcIdx === 1 || funcIdx === 4);
  if (isPi){
    const labels = [0, Math.PI / 2, Math.PI];
    const texts = ['0', 'π/2', 'π'];
    for (let i = 0; i < labels.length; i++){
      const px = toPX(labels[i]);
      ctx.fillText(texts[i], px, axisY + 8);
    }
  } else {
    const labels = [0, 0.25, 0.5, 0.75, 1];
    for (let i = 0; i < labels.length; i++){
      const px = toPX(labels[i]);
      ctx.fillText(labels[i].toString(), px, axisY + 8);
    }
  }

  /* y 轴标签 */
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const ySteps = 4;
  for (let i = 0; i <= ySteps; i++){
    const v = maxY * i / ySteps;
    const py = toPY(v);
    if (py < plotY + 4) continue;
    ctx.fillText(v.toFixed(1), plotX - 8, py);
  }

  /* a 和 b 标记 */
  ctx.font = '600 12px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255, 200, 140, 0.78)';

  const pxA = toPX(F.a);
  const pxB = toPX(F.b);
  ctx.fillText('a', pxA, axisY + 26);
  ctx.fillText('b', pxB, axisY + 26);

  /* 竖直虚线标记 */
  ctx.setLineDash([4, 5]);
  ctx.strokeStyle = 'rgba(255, 200, 140, 0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pxA, plotY);
  ctx.lineTo(pxA, axisY);
  ctx.moveTo(pxB, plotY);
  ctx.lineTo(pxB, axisY);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---- 函数曲线 ---- */
function drawCurve(){
  const N = 460;
  const pts = [];
  for (let i = 0; i <= N; i++){
    const x = F.a + (F.b - F.a) * i / N;
    const y = F.f(x);
    pts.push({ x: toPX(x), y: toPY(Math.max(0, Math.min(maxY, y))) });
  }

  /* 曲线下方淡填充（精确面积） */
  ctx.beginPath();
  ctx.moveTo(pts[0].x, toPY(0));
  for (let i = 0; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.lineTo(pts[pts.length - 1].x, toPY(0));
  ctx.closePath();
  const areaGrad = ctx.createLinearGradient(0, plotY, 0, toPY(0));
  areaGrad.addColorStop(0.00, 'rgba(94, 200, 255, 0.055)');
  areaGrad.addColorStop(1.00, 'rgba(94, 200, 255, 0.012)');
  ctx.fillStyle = areaGrad;
  ctx.fill();

  /* 曲线路径 */
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(94, 200, 255, 0.20)';
  ctx.lineWidth = 9;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  /* 主体 */
  ctx.globalCompositeOperation = 'source-over';
  const grad = ctx.createLinearGradient(plotX, 0, plotX + plotW, 0);
  grad.addColorStop(0.00, 'rgba(94, 224, 255, 0.94)');
  grad.addColorStop(0.50, 'rgba(110, 190, 255, 0.96)');
  grad.addColorStop(1.00, 'rgba(160, 150, 255, 0.92)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.6;
  ctx.stroke();
}

/* ---- 矩形条 ---- */
function drawRects(){
  const n = curN();
  const fp = curProgress();
  const done = fp * n;
  const dx = (F.b - F.a) / n;
  const baseY = toPY(0);

  ctx.globalCompositeOperation = 'source-over';

  for (let i = 0; i < n; i++){
    const rp = done - i;
    if (rp <= 0) break;
    const p = rp > 1 ? 1 : rp;

    const x0 = F.a + i * dx;
    const h = F.f(x0);
    if (!isFinite(h) || h <= 0) continue;

    const px0 = toPX(x0);
    const px1 = toPX(x0 + dx);
    const pyT = toPY(h * p);

    const w = px1 - px0;
    if (w < 0.25) continue;

    /* 颜色：按高度略变 */
    const hRatio = Math.min(1, h / maxY);
    const hue = 34 + hRatio * 12;

    /* 填充 */
    ctx.fillStyle = 'hsla(' + hue + ', 92%, ' + (54 + hRatio * 8) + '%, ' + (0.22 + 0.32 * p) + ')';
    ctx.fillRect(px0, pyT, w, baseY - pyT);

    /* 顶面高光 */
    if (p > 0.98 && w > 1.2){
      ctx.fillStyle = 'hsla(' + (hue + 8) + ', 100%, 78%, 0.55)';
      ctx.fillRect(px0, pyT, w, Math.max(0.8, 1.2));
    }

    /* 边框（仅当足够宽） */
    if (w > 3){
      ctx.strokeStyle = 'hsla(' + hue + ', 92%, 68%, ' + (0.20 + 0.20 * p) + ')';
      ctx.lineWidth = 0.9;
      ctx.strokeRect(px0, pyT, w, baseY - pyT);
    }
  }
}

/* ---- 完成时的辉光 ---- */
function drawFinishGlow(t){
  if (!finished) return;

  const u = 1 - Math.max(0, Math.min(1, finishHold / 4.5));
  const pulse = u < 0.18
    ? Math.sin((u / 0.18) * Math.PI)
    : Math.max(0, 1 - (u - 0.18) / 0.3) * 0.55;

  if (pulse < 0.02) return;

  ctx.globalCompositeOperation = 'lighter';
  const r = Math.max(plotW, plotH) * 0.62 * (1 + 0.12 * pulse);
  const g = ctx.createRadialGradient(
    plotX + plotW * 0.5, plotY + plotH * 0.5, 0,
    plotX + plotW * 0.5, plotY + plotH * 0.5, r
  );
  g.addColorStop(0.00, 'rgba(255, 235, 200, ' + (0.10 * pulse) + ')');
  g.addColorStop(0.42, 'rgba(255, 190, 130, ' + (0.04 * pulse) + ')');
  g.addColorStop(1.00, 'rgba(255, 150, 190, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(plotX + plotW * 0.5, plotY + plotH * 0.5, r, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- 主渲染 ---- */
function render(t){
  drawBackground(t);
  drawGrid();

  /* 矩形在曲线下方 */
  drawRects();

  /* 曲线在矩形上方，保持清晰 */
  drawCurve();

  /* 坐标轴最上层 */
  drawAxes();

  drawFinishGlow(t);

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.82
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.90)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   HUD
   ========================================================= */
let hudTick = 0;

function updateHUD(){
  hudTick++;
  if (hudTick % 4 !== 0) return;

  const sv = document.getElementById('sumVal');
  const ev = document.getElementById('exactVal');
  const er = document.getElementById('errVal');
  const nv = document.getElementById('nVal');
  const ns = document.getElementById('nSub');
  const bf = document.getElementById('barFill');

  if (sv) sv.textContent = displaySum.toFixed(6);
  if (ev) ev.textContent = F.exact.toFixed(6);
  if (er){
    const e = displayErr;
    er.textContent = e < 0.00005 ? e.toExponential(2) : e.toFixed(6);
  }

  const n = curN();
  if (nv) nv.textContent = n;
  if (ns) ns.textContent = '矩形条数 n = ' + n;

  /* 进度条：总进度 */
  const total = (finished ? 1 : (level + curProgress()) / (MAX_LEVEL + 1));
  if (bf) bf.style.width = (total * 100).toFixed(1) + '%';
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;

function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  update(dt);
  render(t);
  updateHUD();
}

/* =========================================================
   交互
   ========================================================= */
const fbtns = document.querySelectorAll('.fbtn');
fbtns.forEach(function(btn){
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    initAudio();
    const idx = parseInt(btn.dataset.idx, 10);
    if (idx === funcIdx) return;

    funcIdx = idx;
    F = FUNCS[funcIdx];

    fbtns.forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');

    resize();
    reset();
  });
});

window.addEventListener('pointerdown', function(){
  initAudio();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    reset();
  } else if (e.key === 'f' || e.key === 'F'){
    initAudio();
    /* 直接跳到最终层 */
    level = MAX_LEVEL;
    levelT = curDur();
    finished = true;
    finishHold = 4.5;
    lastSoundSlot = 999;
    playFinishChord();
  }
});

/* =========================================================
   启动
   ========================================================= */
buildStars();
resize();
reset();
requestAnimationFrame(loop);

})();
</script>
