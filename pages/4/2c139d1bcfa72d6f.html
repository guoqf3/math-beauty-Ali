<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>布朗运动 · 颗粒随机游走扩散位移分布</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#010006;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;}
  canvas{position:fixed;inset:0;display:block;}
  .hud{position:fixed;inset:0;pointer-events:none;}

  .epigraph{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    font-family:"Songti SC","STSong",serif;
    font-size:clamp(12px,1.35vw,19px);
    letter-spacing:.16em;white-space:nowrap;
    color:#e9fbff;
    text-shadow:0 0 12px rgba(90,230,255,.9),0 0 34px rgba(140,90,255,.5);
    animation:breathe 4.3s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}

  .formula{
    position:absolute;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
    font-size:clamp(9px,.76vw,12px);
    line-height:1.75;letter-spacing:.02em;
    color:rgba(140,210,255,.42);
    text-shadow:0 0 9px rgba(80,180,255,.25);
    white-space:nowrap;
  }
  .formula b{color:rgba(190,230,255,.68);font-weight:500;}
  .tl{top:56px;left:22px;}
  .tr{top:56px;right:22px;text-align:right;}
  .bl{bottom:16px;left:22px;}
  .br{bottom:16px;right:22px;text-align:right;}

  .controls{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;
    pointer-events:auto;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;color:rgba(160,215,255,.85);
    background:rgba(6,12,26,.72);
    border:1px solid rgba(80,170,255,.24);
    border-radius:30px;padding:8px 22px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 0 28px rgba(60,150,255,.18);
    white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .controls input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:110px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,#2ef0d0,#4a7dff,#a04dff,#ff4fd8);
    outline:none;cursor:pointer;
  }
  .controls input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#eaf4ff;
    box-shadow:0 0 10px rgba(120,220,255,.95),0 0 20px rgba(160,90,255,.75);
    cursor:pointer;
  }
  .controls input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border:none;border-radius:50%;
    background:#eaf4ff;
    box-shadow:0 0 10px rgba(120,220,255,.95);
    cursor:pointer;
  }
  .val{color:#7de0ff;font-weight:600;min-width:56px;text-align:center;
    text-shadow:0 0 10px rgba(80,220,255,.7);}
  .dval{color:#c48dff;font-weight:600;min-width:96px;text-align:center;
    text-shadow:0 0 10px rgba(180,90,255,.75);}

  @media (max-width:960px){
    .bl,.br{display:none;}
    .controls{gap:8px;padding:7px 14px;font-size:10px;}
    .controls input[type=range]{width:70px;}
    .val{min-width:44px;}
    .dval{min-width:76px;}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="epigraph">每一次碰撞都是偶然，走出多远却是必然</div>

  <div class="formula tl">
    <b>均方位移 · 弥散</b><br>
    ⟨r²⟩ = 2 d D t　（d 维）
  </div>
  <div class="formula tr">
    <b>爱因斯坦位移公式</b><br>
    x<sub>rms</sub> = √(2 D t)
  </div>
  <div class="formula bl">
    <b>斯托克斯-爱因斯坦关系</b><br>
    D = k<sub>B</sub>T / (6 π η a)
  </div>
  <div class="formula br">
    <b>聚苯乙烯微球 · 水 · 300 K</b><br>
    a = 1.0 μm　D ≈ 2.2×10⁻¹³ m²/s
  </div>

  <div class="controls">
    <label>温度 T
      <input type="range" id="tRange" min="250" max="400" value="300" step="1">
    </label>
    <span class="val" id="tLabel">300 K</span>
    <label>半径 a
      <input type="range" id="aRange" min="0.5" max="2.5" value="1.0" step="0.05">
    </label>
    <span class="val" id="aLabel">1.00 μm</span>
    <span class="dval" id="dLabel">D = 2.20×10⁻¹³</span>
  </div>
</div>

<script>
(() => {
'use strict';

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;

/* ============================================================
   物理常量（以“展示单位”表示）
============================================================ */
const KB   = 1.380649e-23;
const ETA  = 0.001;         // 水的动力粘度 Pa·s
const T_REF = 300;
const A_REF = 1.0e-6;       // 1.0 μm
const D_REF = 2.2e-13;      // m²/s  参考扩散系数

/* 视觉尺度：将扩散过程映射到屏幕 */
const PX_PER_UM = 6.5;      // 1 μm 对应 6.5 像素
const TIME_SCALE = 0.62;    // 1 秒真实时间 → 0.62 秒物理时间

/* ============================================================
   状态
============================================================ */
let W = 0, H = 0, DPR = 1;
let cx = 0, cy = 0;
let bgGrad = null;

/* 图表 */
let gx0 = 0, gy0 = 0, gx1 = 0, gy1 = 0;

let simTime = 0, lastTime = 0;

let T = T_REF, targetT = T_REF;
let aUm = 1.0, targetA = 1.0;
let autoPlay = true;

/* 主追踪粒子（一颗微球） */
const main = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  r: 15,
  x0: 0, y0: 0
};

/* 轨迹 */
const trail = [];
const TRAIL_MAX = 320;
const HISTORY = [];       // 用于 ⟨r²⟩ 统计

/* 热噪声粒子 */
const thermals = [];

/* 用户点击产生的关注粒子 */
let focus = null;

/* 屏幕星空 */
const stars = [];

/* ============================================================
   工具
============================================================ */
function smoothstep(x){ x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function gaussRand(){
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}
function rr(c2, x, y, w, h, r){
  c2.beginPath();
  c2.moveTo(x + r, y);
  c2.lineTo(x + w - r, y); c2.arcTo(x + w, y, x + w, y + r, r);
  c2.lineTo(x + w, y + h - r); c2.arcTo(x + w, y + h, x + w - r, y + h, r);
  c2.lineTo(x + r, y + h); c2.arcTo(x, y + h, x, y + h - r, r);
  c2.lineTo(x, y + r); c2.arcTo(x, y, x + r, y, r);
  c2.closePath();
}

/* 扩散系数（真实物理，m²/s） */
function diffusionCoeff(Tv, aMeter){
  return KB * Tv / (6 * Math.PI * ETA * aMeter);
}
/* 像素单位下的扩散系数 */
function diffusionPx(){
  const D = diffusionCoeff(T, aUm * 1e-6);        // m²/s
  /* 1 m²/s → (PX_PER_UM × 1e6)² px²/s  量级过大，做视觉缩放 */
  /* 使用相对参考的缩放，保证 1 μm / 300K 时步长适中 */
  const ratio = D / D_REF;
  return ratio * 36;   // 参考时 D_px = 36 px²/s
}

/* ============================================================
   初始化
============================================================ */
function initStars(){
  stars.length = 0;
  const N = 240;
  for (let i = 0; i < N; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.35 + Math.random() * 1.05,
      a: 0.10 + Math.random() * 0.55,
      ph: Math.random() * TAU,
      dp: 0.4 + Math.random() * 1.6
    });
  }
}

function initThermals(){
  thermals.length = 0;
  const N = 260;
  for (let i = 0; i < N; i++){
    const ang = Math.random() * TAU;
    const rr0 = 60 + Math.random() * Math.max(W, H) * 0.62;
    thermals.push({
      x: cx + Math.cos(ang) * rr0,
      y: cy + Math.sin(ang) * rr0,
      vx: gaussRand() * 42,
      vy: gaussRand() * 42,
      r: 0.6 + Math.random() * 1.15,
      ph: Math.random() * TAU,
      life: 0.6 + Math.random() * 0.9
    });
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  cx = W * 0.5;
  cy = H * 0.47;

  gx0 = W * 0.685;
  gy0 = H * 0.575;
  gx1 = W * 0.945;
  gy1 = H * 0.795;

  bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.85);
  bgGrad.addColorStop(0,    '#050c1c');
  bgGrad.addColorStop(0.45, '#030614');
  bgGrad.addColorStop(1,    '#010005');

  /* 重置位置（避免 resize 后飞出） */
  if (main.x === 0 && main.y === 0){
    main.x = cx; main.y = cy;
    main.x0 = cx; main.y0 = cy;
  } else {
    const dx = main.x - cx, dy = main.y - cy;
    main.x = cx + dx * 0.4;
    main.y = cy + dy * 0.4;
    main.x0 = cx;
    main.y0 = cy;
    trail.length = 0;
    HISTORY.length = 0;
  }

  initStars();
  initThermals();
}

/* ============================================================
   30 秒自动剧本
============================================================ */
function autoT(t){
  if (t < 6)  return 300;
  if (t < 12) return 300 + 100 * smoothstep((t - 6) / 6);
  if (t < 18) return 400;
  if (t < 24) return 400 - 150 * smoothstep((t - 18) / 6);
  return 250 + 50 * smoothstep((t - 24) / 6);
}
function autoA(t){
  if (t < 12) return 1.0;
  if (t < 18) return 1.0 + 1.5 * smoothstep((t - 12) / 6);
  if (t < 24) return 2.5 - 2.0 * smoothstep((t - 18) / 6);
  return 0.5 + 0.5 * smoothstep((t - 24) / 6);
}

/* ============================================================
   更新
============================================================ */
function update(dt){
  simTime += dt;
  if (simTime >= 30) simTime -= 30;

  if (autoPlay){
    targetT = autoT(simTime);
    targetA = autoA(simTime);
    tRange.value = Math.round(targetT);
    aRange.value = targetA.toFixed(2);
  }

  T += (targetT - T) * Math.min(1, dt * 5);
  aUm += (targetA - aUm) * Math.min(1, dt * 5);
  aUm = clamp(aUm, 0.5, 2.5);

  const D_real = diffusionCoeff(T, aUm * 1e-6);
  const D_px = diffusionPx();

  /* 粒子显示半径随 aUm 缩放 */
  main.r = 6 + 9 * aUm;

  /* --- 布朗运动：Ornstein-Uhlenbeck 形式 --- */
  const gamma = 8.0;         // 阻尼系数
  const sigma = Math.sqrt(2 * D_px * gamma);
  const sqrtDt = Math.sqrt(dt);

  main.vx += (-gamma * main.vx) * dt + sigma * sqrtDt * gaussRand();
  main.vy += (-gamma * main.vy) * dt + sigma * sqrtDt * gaussRand();

  main.x += main.vx * dt;
  main.y += main.vy * dt;

  /* 边界反射 */
  const margin = main.r + 12;
  if (main.x < margin){
    main.x = margin; main.vx = Math.abs(main.vx) * 0.75;
  }
  if (main.x > W - margin){
    main.x = W - margin; main.vx = -Math.abs(main.vx) * 0.75;
  }
  if (main.y < H * 0.16){
    main.y = H * 0.16; main.vy = Math.abs(main.vy) * 0.75;
  }
  if (main.y > H * 0.86){
    main.y = H * 0.86; main.vy = -Math.abs(main.vy) * 0.75;
  }

  /* --- 更新轨迹 --- */
  trail.push({ x: main.x, y: main.y, t: simTime });
  if (trail.length > TRAIL_MAX) trail.shift();

  /* --- 位移记录（用于 ⟨r²⟩） --- */
  const dx0 = main.x - main.x0;
  const dy0 = main.y - main.y0;
  const r2 = dx0 * dx0 + dy0 * dy0;
  HISTORY.push({ t: simTime, r2: r2 });
  if (HISTORY.length > 900) HISTORY.shift();

  /* --- 热噪声粒子 --- */
  for (const p of thermals){
    /* 受布朗式随机力 */
    p.vx += gaussRand() * 80 * dt;
    p.vy += gaussRand() * 80 * dt;
    /* 阻尼 */
    p.vx *= (1 - 1.6 * dt);
    p.vy *= (1 - 1.6 * dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    /* 环绕式重生 */
    if (p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30){
      const ang = Math.random() * TAU;
      const rr0 = Math.max(W, H) * 0.55 + Math.random() * 100;
      p.x = cx + Math.cos(ang) * rr0;
      p.y = cy + Math.sin(ang) * rr0;
      p.vx = gaussRand() * 42;
      p.vy = gaussRand() * 42;
    }
  }

  /* --- 关注点计时 --- */
  if (focus){
    focus.t += dt;
    if (focus.t > 3.2) focus = null;
  }
}

/* ============================================================
   渲染 · 星空背景
============================================================ */
function drawStars(){
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars){
    const tw = 0.45 + 0.55 * Math.sin(simTime * s.dp + s.ph);
    ctx.fillStyle = `rgba(140,190,255,${s.a * tw * 0.65})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   渲染 · 热噪声粒子
============================================================ */
function drawThermals(){
  ctx.globalCompositeOperation = 'lighter';
  const t = simTime;
  for (const p of thermals){
    const d = Math.sqrt(
      (p.x - main.x) * (p.x - main.x) + (p.y - main.y) * (p.y - main.y)
    );
    /* 越靠近越亮（暗示碰撞更频繁） */
    const prox = Math.exp(-d / 160);
    const tw = 0.55 + 0.45 * Math.sin(t * 4.5 + p.ph);
    const a = (0.08 + 0.35 * prox) * tw;

    ctx.fillStyle = `rgba(120,225,255,${a})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   渲染 · 轨迹
============================================================ */
function drawTrail(){
  if (trail.length < 2) return;

  ctx.globalCompositeOperation = 'lighter';
  const N = trail.length;

  for (let i = 1; i < N; i++){
    const u = i / N;
    const p0 = trail[i - 1];
    const p1 = trail[i];

    /* 颜色：青蓝 → 紫红，随“年龄”渐变 */
    let cr, cg, cb;
    if (u < 0.5){
      const k = u / 0.5;
      cr = 60 + (160 - 60) * k;
      cg = 235 + (100 - 235) * k;
      cb = 255;
    } else {
      const k = (u - 0.5) / 0.5;
      cr = 160 + (255 - 160) * k;
      cg = 100 + (75 - 100) * k;
      cb = 255 - (255 - 225) * k;
    }

    const alpha = 0.20 + 0.60 * u;
    ctx.strokeStyle = `rgba(${cr|0},${cg|0},${cb|0},${alpha})`;
    ctx.lineWidth = 0.9 + 2.1 * u;
    ctx.shadowColor = `rgba(${cr|0},${cg|0},${cb|0},0.85)`;
    ctx.shadowBlur = 8 * u;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   渲染 · 参考圆（x_rms）
============================================================ */
function drawRmsCircle(){
  const dx = main.x - main.x0;
  const dy = main.y - main.y0;
  const rPx = Math.sqrt(dx * dx + dy * dy);

  /* 从起点到当前 */
  ctx.setLineDash([4, 5]);
  ctx.strokeStyle = 'rgba(255,215,140,0.32)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(main.x0, main.y0);
  ctx.lineTo(main.x, main.y);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 以起点为圆心的位移圆 */
  if (rPx > 4){
    ctx.setLineDash([3, 6]);
    ctx.strokeStyle = 'rgba(255,215,140,0.20)';
    ctx.beginPath();
    ctx.arc(main.x0, main.y0, rPx, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* 起点标记 */
  ctx.beginPath();
  ctx.arc(main.x0, main.y0, 3, 0, TAU);
  ctx.fillStyle = 'rgba(255,220,140,0.55)';
  ctx.fill();

  /* 位移值 */
  const aMeter = aUm * 1e-6;
  const D = diffusionCoeff(T, aMeter);
  const tElapsed = simTime > 0 ? Math.min(simTime, 30) : 0.001;
  const rmsTheory = Math.sqrt(2 * D * tElapsed) * 1e6;   // μm

  const txt = `位移 ${(rPx / PX_PER_UM).toFixed(1)} μm   ` +
              `x_rms(理论) = ${rmsTheory.toFixed(1)} μm`;
  ctx.font = '600 11px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,225,150,0.78)';
  ctx.fillText(txt, main.x0 + 10, main.y0 - 8);
}

/* ============================================================
   渲染 · 主微球
============================================================ */
function drawMainBall(){
  const t = simTime;
  const pulse = 1 + 0.06 * Math.sin(t * 4.2);

  /* 外光晕 */
  const gR = main.r * 4.2 * pulse;
  const g = ctx.createRadialGradient(main.x, main.y, 0, main.x, main.y, gR);
  g.addColorStop(0,   'rgba(180,255,240,0.32)');
  g.addColorStop(0.28,'rgba(90,225,255,0.16)');
  g.addColorStop(0.62,'rgba(150,90,255,0.06)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(main.x, main.y, gR, 0, TAU);
  ctx.fill();

  /* 球体 */
  const sg = ctx.createRadialGradient(
    main.x - main.r * 0.32, main.y - main.r * 0.32, 0,
    main.x, main.y, main.r
  );
  sg.addColorStop(0,    '#f4ffff');
  sg.addColorStop(0.38, '#9ff0ff');
  sg.addColorStop(0.78, '#3ec8ff');
  sg.addColorStop(1,    '#1566b0');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(main.x, main.y, main.r, 0, TAU);
  ctx.fill();

  /* 边缘光 */
  ctx.beginPath();
  ctx.arc(main.x, main.y, main.r, 0, TAU);
  ctx.strokeStyle = 'rgba(200,250,255,0.85)';
  ctx.lineWidth = 1.2;
  ctx.shadowColor = 'rgba(120,220,255,0.9)';
  ctx.shadowBlur = 18;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 高光点 */
  ctx.beginPath();
  ctx.arc(main.x - main.r * 0.32, main.y - main.r * 0.32, main.r * 0.22, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fill();

  /* 运动方向箭头 */
  const sp = Math.sqrt(main.vx * main.vx + main.vy * main.vy);
  if (sp > 6){
    const ux = main.vx / sp, uy = main.vy / sp;
    const len = Math.min(sp * 0.35, 60);
    const x2 = main.x + ux * (main.r + len);
    const y2 = main.y + uy * (main.r + len);
    ctx.beginPath();
    ctx.moveTo(main.x + ux * main.r, main.y + uy * main.r);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = 'rgba(200,245,255,0.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    /* 箭头 */
    const ang = Math.atan2(uy, ux);
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 7 * Math.cos(ang - 0.45), y2 - 7 * Math.sin(ang - 0.45));
    ctx.lineTo(x2 - 7 * Math.cos(ang + 0.45), y2 - 7 * Math.sin(ang + 0.45));
    ctx.closePath();
    ctx.fillStyle = 'rgba(200,245,255,0.65)';
    ctx.fill();
  }
}

/* ============================================================
   渲染 · 点击关注点
============================================================ */
function drawFocus(){
  if (!focus) return;
  const a = Math.max(0, 1 - focus.t / 3.2);
  if (a <= 0){ focus = null; return; }

  ctx.beginPath();
  ctx.arc(focus.x, focus.y, 6 + (1 - a) * 24, 0, TAU);
  ctx.strokeStyle = `rgba(255,215,120,${a * 0.72})`;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(focus.x, focus.y, 4, 0, TAU);
  ctx.fillStyle = `rgba(255,235,170,${a})`;
  ctx.fill();

  const lines = [
    `点击点  (${focus.x.toFixed(0)}, ${focus.y.toFixed(0)})`,
    `距主粒子  ${focus.d.toFixed(1)} px`
  ];

  ctx.font = '600 10.5px ui-monospace,Menlo,Consolas,monospace';
  let mw = 0;
  for (const l of lines) mw = Math.max(mw, ctx.measureText(l).width);
  const bw = mw + 18, bh = lines.length * 16 + 12;
  let bx = focus.x + 16, by = focus.y - bh / 2;
  if (bx + bw > W - 10) bx = focus.x - bw - 16;
  if (by < 10) by = 10;
  if (by + bh > H - 80) by = H - 80 - bh;

  ctx.fillStyle = `rgba(18,14,34,${a * 0.92})`;
  ctx.strokeStyle = `rgba(255,215,130,${a * 0.55})`;
  ctx.lineWidth = 1;
  rr(ctx, bx, by, bw, bh, 8);
  ctx.fill(); ctx.stroke();

  ctx.textAlign = 'left';
  for (let i = 0; i < lines.length; i++){
    ctx.fillStyle = i === 0
      ? `rgba(255,232,160,${a})`
      : `rgba(210,225,255,${a * 0.85})`;
    ctx.fillText(lines[i], bx + 9, by + 18 + i * 16);
  }
}

/* ============================================================
   渲染 · ⟨r²⟩ 曲线图
============================================================ */
function drawChart(){
  const px0 = gx0, py0 = gy0, px1 = gx1, py1 = gy1;
  const w = px1 - px0, h = py1 - py0;

  /* 面板 */
  ctx.fillStyle = 'rgba(6,10,24,0.70)';
  rr(ctx, px0 - 14, py0 - 36, w + 28, h + 62, 11);
  ctx.fill();
  ctx.strokeStyle = 'rgba(80,150,255,0.20)';
  ctx.lineWidth = 1;
  rr(ctx, px0 - 14, py0 - 36, w + 28, h + 62, 11);
  ctx.stroke();

  /* 标题 */
  ctx.font = '600 11.5px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(160,220,255,0.85)';
  ctx.fillText('⟨r²⟩ 随时间增长', px0 - 6, py0 - 18);

  ctx.font = '500 9px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle = 'rgba(140,185,255,0.42)';
  ctx.fillText('线性 ∝ t', px0 - 6, py0 - 5);

  /* 坐标轴 */
  ctx.strokeStyle = 'rgba(140,180,255,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px0, py0);
  ctx.lineTo(px0, py1);
  ctx.lineTo(px1, py1);
  ctx.stroke();

  /* 统计 HISTORY 中 r² 随时间 */
  const tEnd = 30;
  const tNow = simTime;
  if (HISTORY.length < 2) return;

  /* 计算最大 r² 以确定纵轴尺度 */
  let maxR2 = 1;
  for (const hrec of HISTORY){
    if (hrec.r2 > maxR2) maxR2 = hrec.r2;
  }
  maxR2 = Math.max(maxR2, 400);
  maxR2 *= 1.15;

  const mapX = (t) => px0 + clamp(t / tEnd, 0, 1) * w;
  const mapY = (v) => py1 - clamp(v / maxR2, 0, 1) * h;

  /* 网格 */
  ctx.strokeStyle = 'rgba(100,140,255,0.075)';
  for (let i = 1; i <= 3; i++){
    const y = py1 - (i / 3) * h;
    ctx.beginPath(); ctx.moveTo(px0, y); ctx.lineTo(px1, y); ctx.stroke();
  }
  for (let t = 5; t < 30; t += 5){
    const x = mapX(t);
    ctx.beginPath(); ctx.moveTo(x, py0); ctx.lineTo(x, py1); ctx.stroke();
  }

  /* ⟨r²⟩ 曲线 */
  ctx.beginPath();
  for (let i = 0; i < HISTORY.length; i++){
    const hrec = HISTORY[i];
    const x = mapX(hrec.t);
    const y = mapY(hrec.r2);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  const cg = ctx.createLinearGradient(px0, 0, px1, 0);
  cg.addColorStop(0,    '#2ef0d0');
  cg.addColorStop(0.45, '#5cc8ff');
  cg.addColorStop(1,    '#c07bff');
  ctx.strokeStyle = cg;
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(120,220,255,0.85)';
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* 当前点 */
  if (HISTORY.length > 0){
    const lastR = HISTORY[HISTORY.length - 1];
    const x = mapX(lastR.t);
    const y = mapY(lastR.r2);
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, TAU);
    ctx.fillStyle = '#ffe6a0';
    ctx.shadowColor = 'rgba(255,210,120,0.9)';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  /* 理论线 2dDt */
  const aMeter = aUm * 1e-6;
  const D = diffusionCoeff(T, aMeter);
  const theoryFactor = (2 * 2 * D) / (PX_PER_UM * 1e-6 * PX_PER_UM * 1e-6);
  const theoryAtT = theoryFactor * 1e-12 * tEnd;
  if (theoryAtT > 0.5){
    ctx.beginPath();
    for (let i = 0; i <= 40; i++){
      const tt = (i / 40) * tEnd;
      const v = theoryFactor * 1e-12 * tt;
      const x = mapX(tt);
      const y = mapY(v);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = 'rgba(255,170,90,0.55)';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '500 9px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillStyle = 'rgba(255,180,100,0.72)';
    ctx.textAlign = 'right';
    ctx.fillText('⟨r²⟩ = 4Dt 理论', px1 - 6, py0 + 14);
  }

  /* 横轴刻度 */
  ctx.font = '9.5px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle = 'rgba(140,180,255,0.42)';
  ctx.textAlign = 'center';
  for (let t = 5; t < 30; t += 5){
    ctx.fillText(t + 's', mapX(t), py1 + 13);
  }
}

/* ============================================================
   渲染 · 读数
============================================================ */
function drawReadout(){
  const D = diffusionCoeff(T, aUm * 1e-6);
  const tEst = 10;
  const rms10 = Math.sqrt(2 * D * tEst) * 1e6;   // μm

  const txt =
    `T = ${T.toFixed(0)} K    ` +
    `a = ${aUm.toFixed(2)} μm    ` +
    `D = ${D.toExponential(2)} m²/s    ` +
    `t=10s 时 x_rms ≈ ${rms10.toFixed(1)} μm`;

  ctx.font = '600 11.5px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(200,235,255,0.85)';
  ctx.shadowColor = 'rgba(90,190,255,0.85)';
  ctx.shadowBlur = 14;
  ctx.fillText(txt, W / 2, H - 68);
  ctx.shadowBlur = 0;
}

/* ============================================================
   主渲染
============================================================ */
function render(){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  drawStars();
  drawThermals();
  drawTrail();
  drawRmsCircle();
  drawMainBall();
  drawFocus();
  drawChart();
  drawReadout();
}

/* ============================================================
   主循环
============================================================ */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();
}

/* ============================================================
   交互
============================================================ */
const tRange  = document.getElementById('tRange');
const tLabel  = document.getElementById('tLabel');
const aRange  = document.getElementById('aRange');
const aLabel  = document.getElementById('aLabel');
const dLabel  = document.getElementById('dLabel');

tRange.addEventListener('input', () => {
  autoPlay = false;
  targetT = parseFloat(tRange.value);
});
aRange.addEventListener('input', () => {
  autoPlay = false;
  targetA = parseFloat(aRange.value);
});

/* 每帧刷新标签（在 update 里最好，但这里统一处理亦可） */
setInterval(() => {
  tLabel.textContent = T.toFixed(0) + ' K';
  aLabel.textContent = aUm.toFixed(2) + ' μm';
  const D = diffusionCoeff(T, aUm * 1e-6);
  dLabel.textContent = 'D = ' + D.toExponential(2);
}, 100);

cv.addEventListener('pointerdown', (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const d = Math.sqrt((mx - main.x) ** 2 + (my - main.y) ** 2);
  focus = { x: mx, y: my, t: 0, d: d };
});

window.addEventListener('resize', resize);

/* ============================================================
   启动
============================================================ */
resize();
requestAnimationFrame(loop);

})();
</script>
