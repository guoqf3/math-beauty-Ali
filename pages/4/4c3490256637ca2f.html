<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超椭圆映射 · de Sitter测地线 · Bloch旋量进动</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d7a545;
            --cyan: #3bbba3;
            --rose: #d94050;
            --text: #cebd8a;
            --text-dim: #887a58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.7vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.16em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(215, 165, 69, 0.45), 0 0 78px rgba(215, 165, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.46rem, 0.92vw, 0.64rem);
            letter-spacing: 0.22em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.1vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.64);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.18);
            border-radius: 16px;
            padding: 1vh 2.4vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.6rem, 1.28vw, 0.88rem);
            color: #cdb886;
            letter-spacing: 0.07em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.4rem, 0.78vw, 0.56rem);
            color: #8a7a58;
            letter-spacing: 0.1em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d7a545;
        }
        .accent-cyan {
            color: #3bbba3;
        }
        .accent-rose {
            color: #d94050;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.5s ease-out 0.3s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>超椭圆映射 · de Sitter测地线 · Bloch旋量进动</h1>
        <div class="subtitle">Lamé曲线球极投影 &nbsp;·&nbsp; dS³类时测地线 &nbsp;·&nbsp; 含时磁场旋量演化</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">|x/a|ⁿ+|y/b|ⁿ=1 ↦ S²</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">γ(τ)=cosh(τ)P+sinh(τ)V</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">Ṁ=γ M×B(t)</span>
        </div>
        <div class="formula-detail">
            Lamé超椭圆球极投影 &nbsp;·&nbsp; de Sitter空间测地线族 &nbsp;·&nbsp; 布洛赫方程旋量进动 &nbsp;·&nbsp; 三维映射交织
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.5, 30);
        camera.position.set(2.6, 1.5, 7.5);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d7a545');
        const colorCyan = new THREE.Color('#3bbba3');
        const colorRose = new THREE.Color('#d94050');

        const CLAMP_RADIUS = 2.8;

        // ==================== 背景星点 ====================
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 200;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const rad = 5.4 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
            starPos[i * 3 + 2] = rad * Math.cos(phi);
            starSizes[i] = Math.random() * 1.7 + 0.25;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.019,
            transparent: true,
            opacity: 0.48,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        // 极淡参考球壳
        const refSphereGeom = new THREE.SphereGeometry(2.7, 52, 36);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.08, depthWrite: false })
        );
        scene.add(refSphereWire);

        // 极淡参考环面
        const refTorusGeom = new THREE.TorusGeometry(2.05, 0.6, 12, 30);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1517, transparent: true, opacity: 0.07, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ==================== 曲线系统 ====================
        const allCurves = [];
        const POINTS_PER_CURVE = 180;

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.35;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.35;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.35;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.84,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geometry: geom, positions };
            allCurves.push(obj);
            return obj;
        }

        // ---------- 辅助：球极投影 ----------
        function stereographic(x, y, radius = 2.6) {
            const r2 = x * x + y * y;
            const denom = 1 + r2 / (radius * radius);
            return [
                (2 * x) / denom,
                (2 * y) / denom,
                (1 - r2 / (radius * radius)) * radius / denom,
            ];
        }

        // 钳制
        function clampToSphere(pt, maxR = CLAMP_RADIUS) {
            const r = Math.sqrt(pt[0] ** 2 + pt[1] ** 2 + pt[2] ** 2);
            if (r > maxR && r > 0.001) {
                const scl = maxR / r;
                return [pt[0] * scl, pt[1] * scl, pt[2] * scl];
            }
            return pt;
        }

        // ---------- 组1：超椭圆球极投影 (金色) ----------
        const goldCount = 16;
        const goldConfigs = [];
        for (let k = 0; k < goldCount; k++) {
            const a = 1.8 + Math.random() * 0.6;
            const b = 1.4 + Math.random() * 0.8;
            const n0 = 0.8 + Math.random() * 3.5;
            goldConfigs.push({ a, b, n0, phase: k * 0.65 });
        }

        for (let k = 0; k < goldCount; k++) {
            const cfg = goldConfigs[k];
            const curve = createCurve(colorGold);
            curve.updateFn = (t) => {
                const positions = curve.positions;
                const n = cfg.n0 + 0.9 * Math.sin(t * 0.3 + cfg.phase) * Math.cos(t * 0.2 + cfg.phase * 0.8);
                // 避免n太小
                const safeN = Math.max(0.35, Math.min(6, n));
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    const theta = (i / POINTS_PER_CURVE) * Math.PI * 2;
                    const cosT = Math.cos(theta);
                    const sinT = Math.sin(theta);
                    const pow = 2 / safeN;
                    const x2d = cfg.a * Math.pow(Math.abs(cosT), pow) * (cosT >= 0 ? 1 : -1);
                    const y2d = cfg.b * Math.pow(Math.abs(sinT), pow) * (sinT >= 0 ? 1 : -1);
                    const s3 = stereographic(x2d, y2d, 2.55);
                    const p = clampToSphere(s3, CLAMP_RADIUS);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geometry.attributes.position.needsUpdate = true;
            };
        }

        // ---------- 组2：de Sitter类时测地线 (青色) ----------
        const cyanCount = 16;
        const dSRadius = 2.4;
        const cyanConfigs = [];
        for (let k = 0; k < cyanCount; k++) {
            // 初始点P在双曲面上：取类空部分为固定点
            const phi0 = Math.random() * Math.PI * 2;
            const theta0 = Math.acos(2 * Math.random() - 1);
            const P = [
                dSRadius * Math.sinh(0.3),
                dSRadius * Math.cosh(0.3) * Math.sin(theta0) * Math.cos(phi0),
                dSRadius * Math.cosh(0.3) * Math.sin(theta0) * Math.sin(phi0),
                dSRadius * Math.cosh(0.3) * Math.cos(theta0),
            ];
            // 速度方向V：类时归一化 -v0^2+v1^2+v2^2+v3^2 = -1
            const phiV = Math.random() * Math.PI * 2;
            const thetaV = Math.acos(2 * Math.random() - 1);
            const vSpatial = [
                Math.sin(thetaV) * Math.cos(phiV),
                Math.sin(thetaV) * Math.sin(phiV),
                Math.cos(thetaV),
            ];
            const v0 = Math.sqrt(1 + vSpatial[0] ** 2 + vSpatial[1] ** 2 + vSpatial[2] ** 2);
            const V = [v0, vSpatial[0], vSpatial[1], vSpatial[2]];
            cyanConfigs.push({ P, V });
        }

        for (let k = 0; k < cyanCount; k++) {
            const cfg = cyanConfigs[k];
            const curve = createCurve(colorCyan);
            curve.updateFn = (t) => {
                const positions = curve.positions;
                const R = dSRadius;
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    const tau = (i / (POINTS_PER_CURVE - 1)) * 5 - 2.5;
                    const ch = Math.cosh(tau / R);
                    const sh = Math.sinh(tau / R);
                    const x1 = ch * cfg.P[1] + R * sh * cfg.V[1];
                    const x2 = ch * cfg.P[2] + R * sh * cfg.V[2];
                    const x3 = ch * cfg.P[3] + R * sh * cfg.V[3];
                    const scale = 0.9;
                    const p = clampToSphere([x1 * scale, x2 * scale, x3 * scale], CLAMP_RADIUS);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geometry.attributes.position.needsUpdate = true;
            };
        }

        // ---------- 组3：Bloch旋量进动 (玫红) ----------
        const roseCount = 16;
        const roseConfigs = [];
        for (let k = 0; k < roseCount; k++) {
            const phi = Math.random() * Math.PI * 2;
            const theta = Math.acos(2 * Math.random() - 1);
            const M0 = [
                Math.sin(theta) * Math.cos(phi),
                Math.sin(theta) * Math.sin(phi),
                Math.cos(theta),
            ];
            const B0 = 1.2 + Math.random() * 0.8;
            const omega = 0.7 + Math.random() * 1.6;
            const Bz = 0.4 + Math.random() * 1.0;
            roseConfigs.push({ M0, B0, omega, Bz, phase: k * 0.8 });
        }

        function rk4Bloch(M, dt, B) {
            const cross = (a, b) => [
                a[1] * b[2] - a[2] * b[1],
                a[2] * b[0] - a[0] * b[2],
                a[0] * b[1] - a[1] * b[0],
            ];
            const k1 = cross(M, B);
            const M2 = [M[0] + 0.5 * dt * k1[0], M[1] + 0.5 * dt * k1[1], M[2] + 0.5 * dt * k1[2]];
            const k2 = cross(M2, B);
            const M3 = [M[0] + 0.5 * dt * k2[0], M[1] + 0.5 * dt * k2[1], M[2] + 0.5 * dt * k2[2]];
            const k3 = cross(M3, B);
            const M4 = [M[0] + dt * k3[0], M[1] + dt * k3[1], M[2] + dt * k3[2]];
            const k4 = cross(M4, B);
            let Mnew = [
                M[0] + (dt / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
                M[1] + (dt / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]),
                M[2] + (dt / 6) * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]),
            ];
            const norm = Math.sqrt(Mnew[0] ** 2 + Mnew[1] ** 2 + Mnew[2] ** 2);
            if (norm > 1e-9) {
                Mnew = [Mnew[0] / norm, Mnew[1] / norm, Mnew[2] / norm];
            }
            return Mnew;
        }

        for (let k = 0; k < roseCount; k++) {
            const cfg = roseConfigs[k];
            const curve = createCurve(colorRose);
            curve.updateFn = (t) => {
                const positions = curve.positions;
                const h = 0.018;
                const midIdx = Math.floor(POINTS_PER_CURVE / 2);
                // 先积分到中心点
                let M = [...cfg.M0];
                const B = (time) => [
                    cfg.B0 * Math.cos(cfg.omega * time + cfg.phase),
                    cfg.B0 * Math.sin(cfg.omega * time + cfg.phase),
                    cfg.Bz + 0.25 * Math.sin(cfg.omega * 0.5 * time),
                ];
                // 计算所有时间点的磁场
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    const s = (i / (POINTS_PER_CURVE - 1)) * 5 - 2.5;
                    const time = t + s;
                    // 重置到中心点重新积分
                    if (i === 0) {
                        M = [...cfg.M0];
                        // 反向积分
                        const stepsBack = Math.floor(Math.abs(s) / h);
                        for (let step = 0; step < stepsBack; step++) {
                            const localTime = t - step * h;
                            M = rk4Bloch(M, -h, B(localTime));
                        }
                    } else if (i === midIdx) {
                        M = [...cfg.M0];
                    } else if (i > midIdx) {
                        const stepsFwd = Math.floor((i - midIdx) * 0.04 / h);
                        M = [...cfg.M0];
                        for (let step = 0; step < stepsFwd; step++) {
                            const localTime = t + step * h;
                            M = rk4Bloch(M, h, B(localTime));
                        }
                    } else {
                        const stepsBack = Math.floor((midIdx - i) * 0.04 / h);
                        M = [...cfg.M0];
                        for (let step = 0; step < stepsBack; step++) {
                            const localTime = t - step * h;
                            M = rk4Bloch(M, -h, B(localTime));
                        }
                    }
                    const scale = 2.5;
                    const p = clampToSphere([M[0] * scale, M[1] * scale, M[2] * scale], CLAMP_RADIUS);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geometry.attributes.position.needsUpdate = true;
            };
        }

        // ---------- 额外：三叶结与环面结点缀 ----------
        const extraCount = 4;
        const extraColors = [colorCyan, colorRose, colorGold, colorCyan];
        for (let k = 0; k < extraCount; k++) {
            const col = extraColors[k];
            const curve = createCurve(col);
            const amp = 1.3 + k * 0.22;
            const freq = 2.0 + k * 0.28;
            const ph = k * 1.4;
            curve.updateFn = (t) => {
                const positions = curve.positions;
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    const s = (i / POINTS_PER_CURVE) * Math.PI * 2;
                    const inner = s * freq + t * 0.5 + ph;
                    const x0 = amp * (Math.sin(inner) + 0.5 * Math.sin(3 * inner)) * 0.82;
                    const y0 = amp * (Math.cos(inner) - 0.42 * Math.cos(2 * inner)) * 0.82;
                    const z0 = amp * 0.65 * Math.sin(2 * inner + t * 0.35);
                    const p = clampToSphere([x0, y0, z0], CLAMP_RADIUS);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geometry.attributes.position.needsUpdate = true;
            };
        }

        console.log(`✅ 曲线总数: ${allCurves.length} (金:${goldCount}, 青:${cyanCount}, 玫红:${roseCount}, 额外:${extraCount})`);

        // ==================== 流动粒子 ====================
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            const ci = i % allCurves.length;
            particleData.push({
                curveIndex: ci,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0022,
            });
            let col;
            if (i < 7) col = colorGold.clone();
            else if (i < 14) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 1] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        // ==================== 极度健壮的动画循环 ====================
        const clock = new THREE.Clock();
        let animationTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function updateAllCurves(t) {
            for (let c = 0; c < allCurves.length; c++) {
                try {
                    const curve = allCurves[c];
                    if (curve.updateFn) {
                        curve.updateFn(t);
                    }
                } catch (e) {
                    console.warn(`曲线${c}更新异常, 已跳过`, e);
                }
            }
        }

        function updateParticles() {
            try {
                for (let p = 0; p < particleCount; p++) {
                    const pd = particleData[p];
                    pd.progress += pd.speed;
                    if (pd.progress >= 1.0) pd.progress -= 1.0;
                    if (pd.progress < 0) pd.progress += 1.0;
                    const curveObj = allCurves[pd.curveIndex];
                    if (!curveObj || !curveObj.positions) continue;
                    const posArr = curveObj.positions;
                    const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                    const idx0 = Math.floor(floatIdx);
                    const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                    const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                    const i0 = idx0 * 3,
                        i1 = idx1 * 3;
                    particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                    particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                    particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
                }
                particlesGeom.attributes.position.needsUpdate = true;
            } catch (e) {
                console.warn('粒子更新异常, 已跳过', e);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animationTime += dt;
                frameCount++;

                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const elapsed = (now - lastLogTime) / 1000;
                    const fps = Math.round(frameCount / elapsed);
                    console.log(`🔄 运行中 | FPS: ${fps} | 时间: ${animationTime.toFixed(1)}s | dt: ${(dt*1000).toFixed(1)}ms`);
                    frameCount = 0;
                    lastLogTime = now;
                }

                updateAllCurves(animationTime);
                updateParticles();

                const breathe = 1 + 0.05 * Math.sin(animationTime * 0.41) * Math.cos(animationTime * 0.3);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.06;
                refSphereWire.rotation.y += dt * 0.05;

                refTorusWire.rotation.z += dt * 0.06;
                const torBreathe = 1 + 0.06 * Math.sin(animationTime * 0.44) * Math.cos(animationTime * 0.33);
                refTorusWire.scale.setScalar(torBreathe);

                const camH = animationTime * 0.1;
                const camV = 0.34 + 0.18 * Math.sin(animationTime * 0.15);
                const camD = 7.3 + 0.65 * Math.sin(animationTime * 0.2) * Math.cos(animationTime * 0.26);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.06 * Math.sin(animationTime * 0.1), 0.03 * Math.cos(animationTime * 0.13), 0);

                stars.rotation.y += dt * 0.014;
                stars.rotation.x += dt * 0.01;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画主循环异常, 循环仍继续:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                clock.getDelta();
            }
        });

        // ==================== 启动 ====================
        console.log('🚀 超椭圆·de Sitter·Bloch 动画初始化... 预渲染第一帧');
        updateAllCurves(0);
        updateParticles();
        renderer.render(scene, camera);
        clock.start();
        animationTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动，52条空间曲线持续编织演化');
    </script>
</body>
</html>
