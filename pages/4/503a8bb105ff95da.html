<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博罗梅安环 · 三环互锁拓扑</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 72px rgba(170,150,130,0.22);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 0.9vw, 0.66rem); font-weight: 300; letter-spacing: 0.13em;
            color: #a09888; text-shadow: 0 0 16px rgba(155,145,125,0.32);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 12px 24px; border-radius: 34px;
            border: 1px solid rgba(175,155,135,0.18);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.4rem, 0.75vw, 0.6rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 14px rgba(185,170,145,0.27);
            line-height: 1.55; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 8px 14px; border-radius: 26px; }
            #formula-overlay .formula { font-size: 0.34rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">博罗梅安环 · 三环互锁拓扑</div>
        <div class="subtitle">BORROMEAN RINGS &nbsp;·&nbsp; 3‑COMPONENT LINK</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">R₁:</span> 法向(0,1,0) 偏移d₁ &nbsp;
            <span class="c2">R₂:</span> 法向(√3/2,1/2,0) 偏移d₂ &nbsp;
            <span class="c3">R₃:</span> 法向(−√3/2,1/2,0) 偏移d₃
            <br>
            <span style="color:#9aa8b8;">各5同心环 &nbsp;R=2.45 &nbsp;互锁但两两不链 &nbsp;绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 7, 20);

        const camera = new THREE.PerspectiveCamera(
            48,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            25
        );
        camera.position.set(1.6, 0.7, 7.0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c';
        const C2 = '#5d9ec6';
        const C3 = '#c77d9f';
        const C_SPHERE = '#3a4a5c';
        const C_GLINT = '#8898aa';

        const R_BASE = 2.45;
        const OFFSET_BASE = 0.55;
        const NUM_CONCENTRIC = 5;
        const CONCENTRIC_SPACING = 0.06;
        const NUM_SAMPLES = 260;

        // ==================== 三个环的法向量与偏移 ====================
        const normals = [
            new THREE.Vector3(0, 1, 0).normalize(),
            new THREE.Vector3(Math.sqrt(3)/2, 0.5, 0).normalize(),
            new THREE.Vector3(-Math.sqrt(3)/2, 0.5, 0).normalize()
        ];

        const offsets = [
            new THREE.Vector3(0, OFFSET_BASE, 0),
            new THREE.Vector3(Math.sqrt(3)/2 * OFFSET_BASE, 0.5 * OFFSET_BASE, 0),
            new THREE.Vector3(-Math.sqrt(3)/2 * OFFSET_BASE, 0.5 * OFFSET_BASE, 0)
        ];

        // 每个环的平面由法向量和偏移定义；环在该平面上的圆，圆心为偏移点
        // 圆的半径需要使环通过原点附近（使它们互锁）
        // 圆心在偏移处，圆在垂直于法向量的平面上
        // 半径取 sqrt(R_BASE² - |offset|²) 使得环上的点距原点为R_BASE（在球面上）
        const radii = offsets.map(off => {
            const d = off.length();
            return Math.sqrt(Math.max(0.01, R_BASE * R_BASE - d * d));
        });

        // ==================== 生成单个环的采样点 ====================
        function generateRingPoints(normal, offset, radius, numSamples) {
            // 在垂直于normal的平面上，以offset为圆心，半径为radius的圆
            // 需要两个正交方向u, v，它们都在垂直于normal的平面上
            let u, v;
            if (Math.abs(normal.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(normal).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
            }
            v = normal.clone().cross(u).normalize();

            const pts = [];
            for (let i = 0; i <= numSamples; i++) {
                const angle = (i / numSamples) * Math.PI * 2;
                const pt = offset.clone()
                    .add(u.clone().multiplyScalar(radius * Math.cos(angle)))
                    .add(v.clone().multiplyScalar(radius * Math.sin(angle)));
                pts.push(pt);
            }
            return pts;
        }

        // ==================== 创建一组同心环 ====================
        function createConcentricRings(normal, offset, baseRadius, numRings, spacing, colorHex, opacity) {
            const group = new THREE.Group();
            const half = (numRings - 1) / 2;
            for (let k = 0; k < numRings; k++) {
                const r = baseRadius + (k - half) * spacing;
                const pts = generateRingPoints(normal, offset, r, NUM_SAMPLES);
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // ==================== 创建三个环组 ====================
        const ringGroup1 = createConcentricRings(normals[0], offsets[0], radii[0], NUM_CONCENTRIC, CONCENTRIC_SPACING, C1, 0.62);
        const ringGroup2 = createConcentricRings(normals[1], offsets[1], radii[1], NUM_CONCENTRIC, CONCENTRIC_SPACING, C2, 0.6);
        const ringGroup3 = createConcentricRings(normals[2], offsets[2], radii[2], NUM_CONCENTRIC, CONCENTRIC_SPACING, C3, 0.61);

        const mainGroup = new THREE.Group();
        mainGroup.add(ringGroup1);
        mainGroup.add(ringGroup2);
        mainGroup.add(ringGroup3);
        scene.add(mainGroup);

        // ==================== 交点小球标记 ====================
        function createIntersectionGlints(colorHex, sz) {
            const group = new THREE.Group();
            // 计算三个环之间的近似交点（在原点附近）
            // 环i和环j的交点近似计算
            const allIntersections = [];
            for (let i = 0; i < 3; i++) {
                for (let j = i+1; j < 3; j++) {
                    // 采样环i和环j的点，找最近的点对
                    const ptsI = generateRingPoints(normals[i], offsets[i], radii[i], 200);
                    const ptsJ = generateRingPoints(normals[j], offsets[j], radii[j], 200);
                    let minDist = Infinity;
                    let bestI = null, bestJ = null;
                    for (const pi of ptsI) {
                        for (const pj of ptsJ) {
                            const d = pi.distanceTo(pj);
                            if (d < minDist) { minDist = d; bestI = pi.clone(); bestJ = pj.clone(); }
                        }
                    }
                    if (bestI && bestJ && minDist < 0.4) {
                        const mid = bestI.add(bestJ).multiplyScalar(0.5);
                        allIntersections.push(mid);
                    }
                }
            }
            for (const pt of allIntersections) {
                const pairs = [
                    [pt.clone().add(new THREE.Vector3(-sz,0,0)), pt.clone().add(new THREE.Vector3(sz,0,0))],
                    [pt.clone().add(new THREE.Vector3(0,-sz,0)), pt.clone().add(new THREE.Vector3(0,sz,0))],
                    [pt.clone().add(new THREE.Vector3(0,0,-sz)), pt.clone().add(new THREE.Vector3(0,0,sz))],
                ];
                for (const [a,b] of pairs) {
                    const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                    const m = new THREE.LineBasicMaterial({
                        color: new THREE.Color(colorHex),
                        transparent: true, opacity: 0.7, depthWrite: true,
                    });
                    group.add(new THREE.Line(g, m));
                }
            }
            return group;
        }
        const glints = createIntersectionGlints(C_GLINT, 0.07);
        mainGroup.add(glints);

        // ==================== 参考球面线框 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 170;
            const circleDefs = [
                (a) => new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0),
                (a) => new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius),
                (a) => new THREE.Vector3(0, Math.cos(a)*radius, Math.sin(a)*radius),
            ];
            for (const gen of circleDefs) {
                const pts = [];
                for (let i=0; i<=segs; i++) pts.push(gen((i/segs)*Math.PI*2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(R_BASE, C_SPHERE, 0.2);
        scene.add(sphereRef);

        // ==================== 原点光点 ====================
        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.1;
            const pairs = [
                [new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0)],
                [new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0)],
                [new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)],
            ];
            for (const [a,b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true, opacity: 0.7, depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(createOriginGlint());

        // ==================== 动画循环（绝对时间） ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s 环:15个`);
                logTime = now;
            }

            // 整个结构绕对角线旋转
            mainGroup.rotation.y = time * 0.28;
            mainGroup.rotation.x = time * 0.16 + Math.sin(time * 0.23) * 0.2;
            mainGroup.rotation.z = Math.cos(time * 0.19) * 0.14;

            // 参考球面同步旋转
            sphereRef.rotation.copy(mainGroup.rotation);

            // 相机游走
            const camX = 1.6 + Math.sin(time * 0.15) * 0.55;
            const camY = 0.7 + Math.cos(time * 0.18) * 0.45;
            const camZ = 7.0 + Math.sin(time * 0.11) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== 博罗梅安环 · 三环互锁拓扑 ===');
        console.log('环1(暖金):', NUM_CONCENTRIC, '个同心圆');
        console.log('环2(冰蓝):', NUM_CONCENTRIC, '个同心圆');
        console.log('环3(玫瑰粉):', NUM_CONCENTRIC, '个同心圆');
        console.log('总圆数:', NUM_CONCENTRIC * 3);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
