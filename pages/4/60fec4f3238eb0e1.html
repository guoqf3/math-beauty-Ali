<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香农信息论 · 通信极限</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#02040e;
  }
  canvas { display:block; }

  #topText {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    width:min(82vw,1060px);
    min-height:2.4em;
    text-align:center;
    color:#c8e8ff;
    font-size:clamp(13px,1.5vw,19.5px);
    letter-spacing:.07em;
    line-height:1.75;
    font-weight:400;
    text-shadow:0 0 16px rgba(110,220,255,.75),
                0 0 46px rgba(60,160,255,.35);
    pointer-events:none;
    z-index:10;
  }
  #topText::after {
    content:'';
    display:inline-block;
    width:2px; height:.95em;
    background:#66e8ff;
    margin-left:5px;
    vertical-align:-.12em;
    box-shadow:0 0 9px #66e8ff;
    animation:blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50%{opacity:0;} }

  .formula {
    position:fixed;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    color:rgba(150,215,255,.55);
    font-size:clamp(11px,1.02vw,15.5px);
    letter-spacing:.05em;
    pointer-events:none;
    z-index:10;
    text-shadow:0 0 14px rgba(80,180,255,.55);
    line-height:1.75;
  }
  .f-tl { top:94px; left:24px; text-align:left; }
  .f-tr { top:94px; right:24px; text-align:right; }
  .f-bl { bottom:44px; left:24px; text-align:left; }

  #panel {
    position:fixed; right:24px; bottom:44px;
    width:244px;
    padding:13px 15px 11px;
    background:rgba(4,12,32,.58);
    border:1px solid rgba(80,170,255,.25);
    border-radius:11px;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    color:#9cbbdd;
    font-size:12px;
    z-index:20;
    box-shadow:0 6px 30px rgba(0,0,0,.55),
               inset 0 0 22px rgba(60,140,255,.08);
  }
  #panel .row {
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:4px 8px;
    margin-bottom:10px;
  }
  #panel .row label { grid-column:1/3; letter-spacing:.05em; }
  #panel .row .val {
    font-family:"Cambria Math",Georgia,serif;
    color:#6effd8;
    font-size:13px;
    min-width:44px;
    text-align:right;
  }
  #panel .stat {
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
    letter-spacing:.04em;
  }
  #panel .stat .k { color:rgba(140,180,225,.72); }
  #panel .stat .v {
    font-family:"Cambria Math",Georgia,serif;
    color:#7dd8ff;
    font-size:12.5px;
  }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:100%; height:3px; border-radius:3px;
    background:linear-gradient(90deg,#ff5c7a,#ffd23f,#4ee0c8);
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:#e8f8ff;
    box-shadow:0 0 12px rgba(80,220,255,.95);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb {
    width:13px; height:13px; border:none; border-radius:50%;
    background:#e8f8ff;
    box-shadow:0 0 12px rgba(80,220,255,.95);
    cursor:pointer;
  }
  #panel .hint {
    text-align:center;
    font-size:10.5px;
    color:rgba(140,180,225,.5);
    letter-spacing:.1em;
    margin-top:8px;
  }
</style>
</head>
<body>

<div id="topText"></div>

<div class="formula f-tl">
  C = B · log₂(1 + S/N)
</div>
<div class="formula f-tr">
  带宽 B　·　信噪比 S/N<br>
  <span style="font-size:.85em;color:rgba(140,200,255,.45)">纠错编码 逼近香农极限</span>
</div>
<div class="formula f-bl">
  噪声中可靠传输的理论极限　·　管道粗细 ∝ 信道容量
</div>

<div id="panel">
  <div class="row">
    <label>信噪比 S/N （dB 近似）</label>
    <input id="sN" type="range" min="1" max="100" step="0.5" value="3">
    <span class="val" id="vN">3.0</span>
  </div>
  <div class="stat"><span class="k">信道容量 C</span><span class="v" id="vC">—</span></div>
  <div class="stat"><span class="k">管道半径 r ∝ C</span><span class="v" id="vR">—</span></div>
  <div class="hint">拖拽旋转 · 观察信道容量变化</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x02040e, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02040e, 0.010);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 900);
camera.position.set(0, 10, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.34;
controls.enablePan = false;
controls.minDistance = 12;
controls.maxDistance = 65;
controls.maxPolarAngle = Math.PI * 0.58;

/* ============================================================
   光点贴图
   ============================================================ */
function createSpriteTexture(){
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.18,'rgba(255,255,255,0.82)');
  g.addColorStop(0.46,'rgba(255,255,255,0.22)');
  g.addColorStop(1.00,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,s,s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPRITE = createSpriteTexture();

/* ============================================================
   常量
   ============================================================ */
const PIPE_LEN   = 29;
const PIPE_HALF  = PIPE_LEN * 0.5;
const BANDWIDTH  = 5.0;
const DURATION   = 30;

function calcCapacity(snr){
  return BANDWIDTH * Math.log2(1 + snr);
}
const CAP_MAX = calcCapacity(100);

/* ============================================================
   星空背景
   ============================================================ */
(function buildStars(){
  const COUNT = 1600;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++){
    const r  = 75 + Math.random() * 180;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3    ] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.5 + 10;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th);

    const t = Math.random();
    col[i*3    ] = 0.55 + 0.45 * t;
    col[i*3 + 1] = 0.72 + 0.28 * t;
    col[i*3 + 2] = 1.00;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 0.9, map: SPRITE, vertexColors: true,
    transparent: true, opacity: 0.58,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* ============================================================
   信道管道（沿 X 轴）
   ============================================================ */
const pipeGeo = new THREE.CylinderGeometry(1, 1, PIPE_LEN, 44, 1, true);
pipeGeo.rotateZ(Math.PI / 2);

const pipeMat = new THREE.MeshBasicMaterial({
  color: 0x2a6acc,
  transparent: true,
  opacity: 0.10,
  side: THREE.DoubleSide,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const pipeMesh = new THREE.Mesh(pipeGeo, pipeMat);
pipeMesh.renderOrder = 1;
scene.add(pipeMesh);

/* ---- 管道线框 ---- */
const pipeWireGeo = new THREE.CylinderGeometry(1, 1, PIPE_LEN, 28, 1, true);
pipeWireGeo.rotateZ(Math.PI / 2);
const pipeWire = new THREE.LineSegments(
  new THREE.WireframeGeometry(pipeWireGeo),
  new THREE.LineBasicMaterial({
    color: 0x55aaff,
    transparent: true,
    opacity: 0.10,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
pipeWire.renderOrder = 2;
scene.add(pipeWire);

/* ============================================================
   发射端 / 接收端标记
   ============================================================ */
function makeEndRing(x, color, direction){
  const ringGeo = new THREE.TorusGeometry(1, 0.055, 10, 60);
  const ringMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.75,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.x = x;
  ring.rotation.y = Math.PI / 2;
  ring.renderOrder = 5;
  scene.add(ring);

  /* 发光中心 */
  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: SPRITE, color,
    transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  core.position.x = x;
  core.scale.set(2.4, 2.4, 1);
  core.renderOrder = 6;
  scene.add(core);

  return { ring, core };
}

const endA = makeEndRing(-PIPE_HALF, 0x44ddff,  1);
const endB = makeEndRing( PIPE_HALF, 0xffd24a, -1);

/* ============================================================
   流动粒子
   ============================================================ */
const FLOW_N = 700;
const flowPos = new Float32Array(FLOW_N * 3);
const flowCol = new Float32Array(FLOW_N * 3);
const flowX    = new Float32Array(FLOW_N);
const flowNY   = new Float32Array(FLOW_N);
const flowNZ   = new Float32Array(FLOW_N);
const flowSpd  = new Float32Array(FLOW_N);
const flowPertY = new Float32Array(FLOW_N);
const flowPertZ = new Float32Array(FLOW_N);
const flowSeed = new Float32Array(FLOW_N);

for (let i = 0; i < FLOW_N; i++){
  const theta = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random());
  flowNY[i] = Math.cos(theta) * r;
  flowNZ[i] = Math.sin(theta) * r;
  flowX[i]  = -PIPE_HALF + Math.random() * PIPE_LEN;
  flowSpd[i] = 4.0 + Math.random() * 4.5;
  flowSeed[i] = Math.random() * Math.PI * 2;
}

const flowGeo = new THREE.BufferGeometry();
flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3));
flowGeo.setAttribute('color',    new THREE.BufferAttribute(flowCol, 3));

const flowMat = new THREE.PointsMaterial({
  size: 0.28, map: SPRITE, vertexColors: true,
  transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false,
  sizeAttenuation: true
});

const flowPoints = new THREE.Points(flowGeo, flowMat);
flowPoints.frustumCulled = false;
flowPoints.renderOrder = 7;
scene.add(flowPoints);

/* ============================================================
   噪声云
   ============================================================ */
const CLOUD_N = 1800;
const cloudPos  = new Float32Array(CLOUD_N * 3);
const cloudBase = new Float32Array(CLOUD_N * 3);
const cloudPhase = new Float32Array(CLOUD_N);
const cloudSpd  = new Float32Array(CLOUD_N);

for (let i = 0; i < CLOUD_N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(Math.random() * 2 - 1);
  const r     = 0.6 + Math.pow(Math.random(), 0.55) * 5.5;

  const bx = r * Math.sin(phi) * Math.cos(theta) * 0.95;
  const by = r * Math.cos(phi) * 0.85;
  const bz = r * Math.sin(phi) * Math.sin(theta);

  cloudBase[i*3]     = bx;
  cloudBase[i*3 + 1] = by;
  cloudBase[i*3 + 2] = bz;
  cloudPos[i*3]      = bx;
  cloudPos[i*3 + 1]  = by;
  cloudPos[i*3 + 2]  = bz;
  cloudPhase[i] = Math.random() * Math.PI * 2;
  cloudSpd[i]   = 0.4 + Math.random() * 1.4;
}

const cloudGeo = new THREE.BufferGeometry();
cloudGeo.setAttribute('position', new THREE.BufferAttribute(cloudPos, 3));

const cloudMat = new THREE.PointsMaterial({
  size: 0.18, map: SPRITE, color: 0x9aaabb,
  transparent: true, opacity: 0.30,
  blending: THREE.AdditiveBlending, depthWrite: false,
  sizeAttenuation: true
});

const cloudPoints = new THREE.Points(cloudGeo, cloudMat);
cloudPoints.frustumCulled = false;
cloudPoints.renderOrder = 3;
scene.add(cloudPoints);

/* ============================================================
   接收端星座图（4x4 网格点 + 金色连线）
   ============================================================ */
const SYM_GRID = 4;
const symPoints = [];

(function buildConstellation(){
  const gap = 0.72;
  const half = (SYM_GRID - 1) / 2;

  for (let i = 0; i < SYM_GRID; i++){
    for (let j = 0; j < SYM_GRID; j++){
      const y = (i - half) * gap;
      const z = (j - half) * gap;
      symPoints.push({ y, z, i, j });
    }
  }

  /* ---- 点 ---- */
  const count = symPoints.length;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);

  for (let k = 0; k < count; k++){
    pos[k*3    ] = PIPE_HALF - 0.6;
    pos[k*3 + 1] = symPoints[k].y;
    pos[k*3 + 2] = symPoints[k].z;
    col[k*3    ] = 1.00;
    col[k*3 + 1] = 0.85;
    col[k*3 + 2] = 0.42;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const m = new THREE.PointsMaterial({
    size: 0.42, map: SPRITE, vertexColors: true,
    transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });

  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  pts.renderOrder = 9;
  scene.add(pts);

  /* ---- 网格连线 ---- */
  const lineSegs = [];
  for (const p of symPoints){
    if (p.i < SYM_GRID - 1){
      const q = symPoints.find(s => s.i === p.i + 1 && s.j === p.j);
      lineSegs.push(PIPE_HALF - 0.6, p.y, p.z, PIPE_HALF - 0.6, q.y, q.z);
    }
    if (p.j < SYM_GRID - 1){
      const q = symPoints.find(s => s.i === p.i && s.j === p.j + 1);
      lineSegs.push(PIPE_HALF - 0.6, p.y, p.z, PIPE_HALF - 0.6, q.y, q.z);
    }
  }

  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(lineSegs, 3));
  const lm = new THREE.LineBasicMaterial({
    color: 0xffcc66,
    transparent: true,
    opacity: 0.22,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const l = new THREE.LineSegments(lg, lm);
  l.frustumCulled = false;
  l.renderOrder = 8;
  scene.add(l);

  window.__symPoints = pts;
})();

/* ============================================================
   参数与交互
   ============================================================ */
let snr = 3.0;
let userTimer = 0;

const sNEl = document.getElementById('sN');
const vNEl = document.getElementById('vN');
const vCEl = document.getElementById('vC');
const vREl = document.getElementById('vR');

sNEl.addEventListener('input', e => {
  snr = parseFloat(e.target.value);
  vNEl.textContent = snr.toFixed(1);
  userTimer = 6.0;
});

/* ---- 自动 SNR 曲线 ---- */
function autoSNR(t){
  const ph = t / DURATION;
  const k = 0.5 - 0.5 * Math.cos(2 * Math.PI * ph);
  return 3.0 + k * 77.0;
}

/* ============================================================
   顶部文字
   ============================================================ */
const FULL_TEXT = '香农公式给出信息能在噪声信道可靠传输的理论极限——确定性界定通信可能性的边界，启示有界条件下如何最优地逼近极限效率的方法论。';
const topTextEl = document.getElementById('topText');
let lastShown = '';

function smoothstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function updateTopText(animT){
  const prog  = smoothstep(0.8, 26.0, animT);
  const n     = Math.floor(prog * FULL_TEXT.length);
  const shown = FULL_TEXT.slice(0, n);
  if (shown !== lastShown){
    topTextEl.textContent = shown;
    lastShown = shown;
  }
}

/* ============================================================
   更新：流动粒子
   ============================================================ */
function updateFlow(dt, pipeRadius, noiseLevel, time){
  const arr = flowPos;
  const col = flowCol;

  const baseR = pipeRadius * 0.85;

  for (let i = 0; i < FLOW_N; i++){
    const i3 = i * 3;

    /* ---- 沿管道推进 ---- */
    flowX[i] += flowSpd[i] * dt;
    if (flowX[i] > PIPE_HALF){
      flowX[i] = -PIPE_HALF;
      flowPertY[i] = 0;
      flowPertZ[i] = 0;
    }

    const x = flowX[i];

    /* ---- 噪声包络 ---- */
    const nx  = x / 4.5;
    const env = Math.exp(-nx * nx);

    /* ---- 扰动衰减 ---- */
    flowPertY[i] *= 0.984;
    flowPertZ[i] *= 0.984;

    /* ---- 噪声区扰动 ---- */
    if (env > 0.04 && noiseLevel > 0.02){
      const kick = env * noiseLevel * 0.38;
      flowPertY[i] += (Math.random() - 0.5) * kick;
      flowPertZ[i] += (Math.random() - 0.5) * kick;
    }

    /* ---- 接收端纠错 ---- */
    if (x > 3.0){
      const k = Math.min(1, (x - 3.0) / 10.0) * 0.22;
      flowPertY[i] *= (1 - k);
      flowPertZ[i] *= (1 - k);
    }

    /* ---- 最终位置 ---- */
    const py = flowNY[i] * baseR + flowPertY[i];
    const pz = flowNZ[i] * baseR + flowPertZ[i];

    arr[i3]     = x;
    arr[i3 + 1] = py;
    arr[i3 + 2] = pz;

    /* ---- 颜色：扰动越大越偏红 ---- */
    const disturb = Math.min(1, (Math.abs(flowPertY[i]) + Math.abs(flowPertZ[i])) * 1.6);

    const r = 0.25 + disturb * 0.75;
    const g = 0.95 - disturb * 0.55;
    const b = 1.00 - disturb * 0.85;

    const flick = 0.72 + 0.28 * Math.sin(time * 5.2 + flowSeed[i]);

    col[i3]     = r * flick;
    col[i3 + 1] = g * flick;
    col[i3 + 2] = b * flick;
  }

  flowGeo.attributes.position.needsUpdate = true;
  flowGeo.attributes.color.needsUpdate = true;
}

/* ============================================================
   更新：噪声云
   ============================================================ */
function updateCloud(time, noiseLevel){
  const arr = cloudPos;

  for (let i = 0; i < CLOUD_N; i++){
    const i3 = i * 3;
    const ph = cloudPhase[i];
    const sp = cloudSpd[i];

    arr[i3]     = cloudBase[i3]     + Math.sin(time * sp * 0.7 + ph) * 0.38;
    arr[i3 + 1] = cloudBase[i3 + 1] + Math.cos(time * sp * 0.9 + ph * 1.3) * 0.38;
    arr[i3 + 2] = cloudBase[i3 + 2] + Math.sin(time * sp * 0.8 + ph * 0.7) * 0.38;
  }
  cloudGeo.attributes.position.needsUpdate = true;

  cloudMat.opacity = 0.05 + 0.42 * noiseLevel;
  cloudMat.size    = 0.14 + 0.08 * noiseLevel;
}

/* ============================================================
   更新：发射/接收端环
   ============================================================ */
function updateEndRings(pipeRadius, time, capacityRatio){
  const pulse = 1 + 0.10 * Math.sin(time * 3.4);

  [endA, endB].forEach((e, idx) => {
    e.ring.scale.setScalar(pipeRadius * pulse);
    e.ring.material.opacity = 0.42 + 0.38 * capacityRatio;
    e.core.scale.set(2.2 + pipeRadius * 1.5, 2.2 + pipeRadius * 1.5, 1);
    e.core.material.opacity = 0.30 + 0.35 * capacityRatio +
                              0.15 * Math.sin(time * 4.2 + idx * 1.7);
  });
}

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let animT = 0;

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  animT += dt;
  if (animT >= DURATION) animT -= DURATION;

  /* ---- 决定 SNR ---- */
  if (userTimer > 0){
    userTimer -= dt;
  } else {
    snr = autoSNR(animT);

    // 同步滑块
    const shown = snr.toFixed(1);
    if (vNEl.textContent !== shown){
      vNEl.textContent = shown;
      sNEl.value = shown;
    }
  }

  /* ---- 计算信道容量与管道半径 ---- */
  const capacity = calcCapacity(snr);
  const capRatio = Math.min(1, capacity / CAP_MAX);
  const pipeRadius = 0.55 + 1.75 * capRatio;

  /* ---- 噪声强度 ---- */
  const noiseLevel = 1 / (1 + Math.pow(snr / 4.0, 0.72));

  /* ---- 更新管道 ---- */
  pipeMesh.scale.set(1, pipeRadius, pipeRadius);
  pipeWire.scale.set(1, pipeRadius, pipeRadius);

  const globalFade = smoothstep(0, 0.8, animT) *
                     (1 - smoothstep(28.5, 30.0, animT));

  pipeMat.opacity   = (0.07 + 0.09 * capRatio) * globalFade;
  pipeWire.material.opacity = (0.06 + 0.10 * capRatio) * globalFade;

  /* ---- 流动粒子 ---- */
  updateFlow(dt, pipeRadius, noiseLevel, animT);

  /* ---- 噪声云 ---- */
  updateCloud(animT, noiseLevel);

  /* ---- 端环 ---- */
  updateEndRings(pipeRadius, animT, capRatio);

  /* ---- 接收端星座图：随管道缩放 ---- */
  const symPts = window.__symPoints;
  if (symPts){
    symPts.position.x = PIPE_HALF - 0.6;
    symPts.scale.setScalar(pipeRadius * 0.85);
    symPts.material.opacity = 0.55 + 0.40 * capRatio;
  }

  /* ---- 面板更新 ---- */
  vCEl.textContent = capacity.toFixed(2);
  vREl.textContent = pipeRadius.toFixed(2);

  /* ---- 文字 ---- */
  updateTopText(animT);

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   启动
   ============================================================ */
animate();

/* ============================================================
   自适应
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
