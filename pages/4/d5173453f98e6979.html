<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帕累托最优 · 效率与公平的边界</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060f;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;}

  #gl{
    position:fixed;top:0;left:0;
    width:100vw;height:100vh;
    display:block;z-index:0;
  }

  #vignette{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 32%, rgba(2,3,14,.75) 100%);
  }

  /* 顶部启迪文字 */
  #topText{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    width:min(940px,88vw);
    text-align:center;
    font-size:20px;line-height:1.82;letter-spacing:.5px;
    font-weight:500;
    color:#eaf3ff;
    text-shadow:0 0 12px rgba(150,200,255,.75),0 0 34px rgba(255,210,120,.35);
    pointer-events:none;z-index:10;
    user-select:none;
  }
  #topText span{opacity:0;}

  /* 边缘公式 */
  .fml{
    position:fixed;z-index:10;pointer-events:none;user-select:none;
    font-family:"Cambria Math",Georgia,"Times New Roman",serif;
    font-size:13px;letter-spacing:.5px;white-space:nowrap;
    color:rgba(190,215,255,.42);
    text-shadow:0 0 12px rgba(140,180,255,.40);
    animation:fmlPulse 7s ease-in-out infinite;
  }
  @keyframes fmlPulse{0%,100%{opacity:.5;}50%{opacity:1;}}
  .tl{top:16px;left:18px;}
  .tr{top:16px;right:18px;text-align:right;}
  .bl{bottom:16px;left:18px;}
  .br{bottom:16px;right:18px;text-align:right;}

  /* 控制面板 */
  #panel{
    position:fixed;bottom:44px;left:50%;transform:translateX(-50%);
    display:flex;gap:22px;align-items:center;
    padding:11px 22px 9px;
    border-radius:16px;
    background:rgba(10,14,32,.50);
    border:1px solid rgba(150,200,255,.18);
    box-shadow:0 0 30px rgba(80,140,255,.14) inset,0 0 26px rgba(0,0,0,.55);
    z-index:20;user-select:none;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .ctl{display:flex;flex-direction:column;align-items:center;gap:4px;width:170px;}
  .ctl .lbl{
    font-size:12px;letter-spacing:1px;font-weight:600;
    color:#ffd98a;text-shadow:0 0 10px rgba(255,200,90,.6);
  }
  .ctl .pv{
    font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;
    color:#9fd8ff;
  }
  .ctl input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:160px;height:4px;border-radius:3px;
    background:linear-gradient(90deg,rgba(255,210,120,.65),rgba(120,200,255,.28));
    outline:none;cursor:pointer;
    color:#ffd166;
  }
  .ctl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:#fff;border:none;
    box-shadow:0 0 10px currentColor,0 0 22px currentColor;
    cursor:grab;
  }
  .ctl input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;border:none;
    background:#fff;
    box-shadow:0 0 10px currentColor,0 0 22px currentColor;
    cursor:grab;
  }

  #status{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    font-size:13px;letter-spacing:1.5px;font-weight:600;
    z-index:20;pointer-events:none;user-select:none;
    transition:color .35s ease, text-shadow .35s ease;
  }

  #overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#04060f;z-index:50;pointer-events:none;opacity:1;
  }

  #err{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:100;color:#ffb0b0;font-size:16px;text-align:center;
    padding:24px 32px;border-radius:12px;
    background:rgba(40,10,20,.75);border:1px solid rgba(255,120,120,.35);
    display:none;max-width:80vw;line-height:1.7;
  }

  @media (max-width:800px){
    #topText{font-size:14px;line-height:1.7;top:8px;}
    .fml{font-size:10px;}
    #panel{gap:10px;padding:8px 12px 6px;bottom:34px;}
    .ctl{width:120px;}
    .ctl input[type=range]{width:110px;}
    #status{bottom:84px;font-size:11px;}
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="vignette"></div>

<div id="topText"></div>

<div class="fml tl">x* Pareto Optimal&nbsp;⟺&nbsp;∄ x : x ≻ x*</div>
<div class="fml tr">∀x ∃i: Uᵢ(x*) ≥ Uᵢ(x) ⇒ ∃j: Uⱼ(x*) &lt; Uⱼ(x)</div>
<div class="fml bl">max&nbsp;Σ αᵢ · Uᵢ(x)&nbsp;&nbsp;αᵢ ≥ 0</div>
<div class="fml br">Pareto Frontier&nbsp;⊂&nbsp;∂(Feasible Set)</div>

<div id="status">配置点偏离前沿</div>
<div id="panel"></div>
<div id="overlay"></div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
}
</script>

<script>
window.addEventListener('load', function () {
'use strict';

var errBox = document.getElementById('err');
var overlayEl = document.getElementById('overlay');
function fail(msg){
  errBox.style.display = 'block';
  errBox.textContent = msg;
  if (overlayEl) overlayEl.style.opacity = '0';
}

if (typeof THREE === 'undefined') {
  fail('Three.js 加载失败，请检查网络后刷新页面。');
  return;
}

try {

/* ============================================================
   0. 常量
   ============================================================ */
var LOOP_TIME = 30;

/* 环面（甜甜圈可行域）参数 */
var R_MAIN = 5.4;   // 主半径
var R_TUBE = 2.05;  // 管半径

function torusPoint(u, v){
  var rr = R_MAIN + R_TUBE * Math.cos(v);
  return new THREE.Vector3(
    rr * Math.cos(u),
    R_TUBE * Math.sin(v),
    rr * Math.sin(u)
  );
}

/* 帕累托前沿参数曲线：沿环面外上边缘缠绕 */
function frontParam(u){
  return 0.30 + 0.62 * Math.sin(u * 1.5) + 0.22 * Math.cos(u * 3.0);
}

/* ============================================================
   1. 渲染环境
   ============================================================ */
var canvas = document.getElementById('gl');
var renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
} catch (e) {
  fail('WebGL 初始化失败，请使用支持 WebGL 的浏览器。');
  return;
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight));
renderer.setClearColor(0x04060f, 1);

var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060f, 0.0072);

var camera = new THREE.PerspectiveCamera(
  46,
  Math.max(1, window.innerWidth) / Math.max(1, window.innerHeight),
  0.1, 600
);

var camTarget = new THREE.Vector3(0, 0.4, 0);
var camTheta = 0.6, camPhi = 1.08, camDist = 21.5;

function updateCamera(){
  var sp = Math.sin(camPhi), cp = Math.cos(camPhi);
  camera.position.set(
    camTarget.x + camDist * sp * Math.sin(camTheta),
    camTarget.y + camDist * cp,
    camTarget.z + camDist * sp * Math.cos(camTheta)
  );
  camera.lookAt(camTarget);
}
updateCamera();

/* ============================================================
   2. 灯光
   ============================================================ */
scene.add(new THREE.AmbientLight(0x4a5a88, 0.85));

var dLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
dLight1.position.set(12, 18, 10);
scene.add(dLight1);

var dLight2 = new THREE.DirectionalLight(0x88aaff, 0.55);
dLight2.position.set(-12, -10, -12);
scene.add(dLight2);

var pLight = new THREE.PointLight(0xffcc77, 0.9, 60);
pLight.position.set(0, 8, 0);
scene.add(pLight);

/* ============================================================
   3. 纹理工具
   ============================================================ */
function makeGlowTex(){
  var S = 128;
  var c = document.createElement('canvas'); c.width = c.height = S;
  var g = c.getContext('2d');
  var grd = g.createRadialGradient(S/2,S/2,0, S/2,S/2,S/2);
  grd.addColorStop(0.00,'rgba(255,255,255,1.00)');
  grd.addColorStop(0.25,'rgba(255,255,255,0.55)');
  grd.addColorStop(0.60,'rgba(255,255,255,0.12)');
  grd.addColorStop(1.00,'rgba(255,255,255,0.00)');
  g.fillStyle = grd;
  g.fillRect(0,0,S,S);
  return new THREE.CanvasTexture(c);
}
var GLOW_TEX = makeGlowTex();

/* ============================================================
   4. 星空背景
   ============================================================ */
(function buildStars(){
  var N = 1500;
  var pos = new Float32Array(N * 3);
  var col = new Float32Array(N * 3);
  var cc = new THREE.Color();
  for (var i = 0; i < N; i++) {
    var r = 70 + Math.random() * 160;
    var th = Math.random() * Math.PI * 2;
    var ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph) * 0.75;
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    cc.setHSL(0.58 + Math.random() * 0.12, 0.55, 0.60 + Math.random() * 0.35);
    col[i*3] = cc.r; col[i*3+1] = cc.g; col[i*3+2] = cc.b;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  var mat = new THREE.PointsMaterial({
    size: 0.95, vertexColors: true, transparent: true, opacity: 0.85,
    depthWrite: false, blending: THREE.AdditiveBlending,
    map: GLOW_TEX, sizeAttenuation: true
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* ============================================================
   5. 可行域：甜甜圈状半透明多面体
   ============================================================ */
function buildTorusGeo(R, r, uSeg, vSeg){
  var geo = new THREE.BufferGeometry();
  var positions = [];
  var normals = [];
  var uvs = [];
  var indices = [];

  for (var i = 0; i <= uSeg; i++) {
    var u = i / uSeg * Math.PI * 2;
    for (var j = 0; j <= vSeg; j++) {
      var v = j / vSeg * Math.PI * 2;
      var p = torusPoint(u, v);
      positions.push(p.x, p.y, p.z);

      var nx = Math.cos(v) * Math.cos(u);
      var ny = Math.sin(v);
      var nz = Math.cos(v) * Math.sin(u);
      normals.push(nx, ny, nz);

      uvs.push(i / uSeg, j / vSeg);
    }
  }

  for (var a = 0; a < uSeg; a++) {
    for (var b = 0; b < vSeg; b++) {
      var i0 = a * (vSeg + 1) + b;
      var i1 = i0 + vSeg + 1;
      indices.push(i0, i1, i0 + 1);
      indices.push(i1, i1 + 1, i0 + 1);
    }
  }

  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  return geo;
}

var feasibleGeo = buildTorusGeo(R_MAIN, R_TUBE, 72, 40);

var feasibleMat = new THREE.MeshPhongMaterial({
  color: 0xdce8ff,
  transparent: true,
  opacity: 0.105,
  shininess: 90,
  specular: 0x99bbff,
  side: THREE.DoubleSide,
  depthWrite: false,
  emissive: 0x14203c,
  emissiveIntensity: 0.6
});
var feasibleMesh = new THREE.Mesh(feasibleGeo, feasibleMat);
scene.add(feasibleMesh);

/* 线框叠加 */
var wireGeo = buildTorusGeo(R_MAIN, R_TUBE, 36, 20);
var wireMat = new THREE.MeshBasicMaterial({
  color: 0x5fa8e8,
  wireframe: true,
  transparent: true,
  opacity: 0.055,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
var wireMesh = new THREE.Mesh(wireGeo, wireMat);
scene.add(wireMesh);

/* ============================================================
   6. 无差异曲线（彩虹渐变嵌套环）
   ============================================================ */
var INDIFF_COLORS = [0xff5f7e, 0xffb347, 0x7dffb3, 0x5fd0ff, 0xb388ff];
var indiffRings = [];

var indiffConfig = [
  { r: 1.05, y: -2.6 },
  { r: 1.70, y: -1.3 },
  { r: 2.35, y:  0.0 },
  { r: 3.00, y:  1.3 },
  { r: 3.60, y:  2.6 }
];

for (var ii = 0; ii < indiffConfig.length; ii++) {
  var cfg = indiffConfig[ii];
  var colHex = INDIFF_COLORS[ii];

  var rgeo = new THREE.TorusGeometry(cfg.r, 0.035, 8, 120);
  var rmat = new THREE.MeshBasicMaterial({
    color: colHex,
    transparent: true,
    opacity: 0.62,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  var ring = new THREE.Mesh(rgeo, rmat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = cfg.y;
  scene.add(ring);

  indiffRings.push({
    mesh: ring,
    mat: rmat,
    baseY: cfg.y,
    baseR: cfg.r,
    phase: ii * 0.9,
    color: colHex
  });
}

/* ============================================================
   7. 帕累托前沿（金色发光管）
   ============================================================ */
var frontPts = [];
var FRONT_N = 260;
for (var fp = 0; fp < FRONT_N; fp++) {
  var uu = (fp / FRONT_N) * Math.PI * 2;
  var vv = frontParam(uu);
  frontPts.push(torusPoint(uu, vv));
}
var frontCurve = new THREE.CatmullRomCurve3(frontPts, true, 'catmullrom', 0.5);

var frontGeo = new THREE.TubeGeometry(frontCurve, 320, 0.085, 10, true);
var frontMat = new THREE.MeshBasicMaterial({
  color: 0xffd166,
  transparent: true,
  opacity: 0.92,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
var frontMesh = new THREE.Mesh(frontGeo, frontMat);
scene.add(frontMesh);

/* 前沿外侧光晕 */
var frontGlowGeo = new THREE.TubeGeometry(frontCurve, 200, 0.30, 8, true);
var frontGlowMat = new THREE.MeshBasicMaterial({
  color: 0xffb830,
  transparent: true,
  opacity: 0.14,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
var frontGlowMesh = new THREE.Mesh(frontGlowGeo, frontGlowMat);
scene.add(frontGlowMesh);

/* 前沿上的浮动粒子 */
var FRONT_DOT_N = 90;
var fdGeo = new THREE.BufferGeometry();
var fdPos = new Float32Array(FRONT_DOT_N * 3);
var fdT = [];
for (var fd = 0; fd < FRONT_DOT_N; fd++) {
  fdT.push(Math.random());
  fdPos[fd*3] = 0; fdPos[fd*3+1] = 0; fdPos[fd*3+2] = 0;
}
fdGeo.setAttribute('position', new THREE.BufferAttribute(fdPos, 3));
var fdPoints = new THREE.Points(fdGeo, new THREE.PointsMaterial({
  color: 0xffe8a8, size: 0.19, transparent: true, opacity: 0.95,
  depthWrite: false, blending: THREE.AdditiveBlending,
  map: GLOW_TEX, sizeAttenuation: true
}));
scene.add(fdPoints);

/* ============================================================
   8. 配置点
   ============================================================ */
var configGroup = new THREE.Group();
scene.add(configGroup);

/* 核心球体 */
var cfgCoreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
var cfgCore = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 20), cfgCoreMat);
configGroup.add(cfgCore);

/* 外层光晕 */
var cfgGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: GLOW_TEX, color: 0xffffff, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
cfgGlow.scale.set(2.2, 2.2, 1);
configGroup.add(cfgGlow);

/* 外圈环 */
var cfgRingMat = new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.7,
  blending: THREE.AdditiveBlending, depthWrite: false
});
var cfgRing = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.022, 8, 40), cfgRingMat);
configGroup.add(cfgRing);

/* 改进方向箭头（从配置点指向最近前沿点） */
var arrowGroup = new THREE.Group();
scene.add(arrowGroup);

var arrowLineMat = new THREE.LineBasicMaterial({
  color: 0x66ffcc, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false
});
var arrowLineGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0)
]);
var arrowLine = new THREE.Line(arrowLineGeo, arrowLineMat);
arrowGroup.add(arrowLine);

var arrowHeadMat = new THREE.MeshBasicMaterial({
  color: 0x66ffcc, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false
});
var arrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.36, 12), arrowHeadMat);
arrowGroup.add(arrowHead);

/* ============================================================
   9. 状态
   ============================================================ */
var loopT = 0;
var deviation = 0;      // 0 = 在前沿上，1 = 深入内部
var autoMode = true;
var autoDev = 0;
var frontT = 0;         // 沿前沿曲线的参数

/* ============================================================
   10. 滑块
   ============================================================ */
var panelEl = document.getElementById('panel');
var statusEl = document.getElementById('status');

var ctlDiv = document.createElement('div');
ctlDiv.className = 'ctl';

var lblEl = document.createElement('div');
lblEl.className = 'lbl';
lblEl.textContent = '偏离前沿程度';

var slider = document.createElement('input');
slider.type = 'range';
slider.min = 0;
slider.max = 1000;
slider.value = 0;

var pvEl = document.createElement('div');
pvEl.className = 'pv';
pvEl.textContent = '0.00';

ctlDiv.appendChild(lblEl);
ctlDiv.appendChild(slider);
ctlDiv.appendChild(pvEl);
panelEl.appendChild(ctlDiv);

slider.addEventListener('input', function(){
  autoMode = false;
  deviation = this.value / 1000;
  pvEl.textContent = deviation.toFixed(2);
});

/* ============================================================
   11. 顶部文字
   ============================================================ */
var TEXT = "帕累托最优给出效率资源配置的客观判断标准——无法在不损害他人下改进任何人即达到了某种效率极限，启示效率与公平的权衡之美。";
var topTextEl = document.getElementById('topText');
var charSpans = [];
(function buildText(){
  var frag = document.createDocumentFragment();
  for (var i = 0; i < TEXT.length; i++) {
    var s = document.createElement('span');
    s.textContent = TEXT[i];
    s._o = -1;
    frag.appendChild(s);
    charSpans.push(s);
  }
  topTextEl.appendChild(frag);
})();

var TEXT_START = 0.8;
var TEXT_END   = 22.5;
var TEXT_GAP   = (TEXT_END - TEXT_START) / Math.max(1, charSpans.length);

function updateText(){
  for (var i = 0; i < charSpans.length; i++) {
    var t0 = TEXT_START + i * TEXT_GAP;
    var o = (loopT - t0) / 0.34;
    if (o < 0) o = 0; else if (o > 1) o = 1;
    o = Math.round(o * 16) / 16;
    if (charSpans[i]._o !== o) {
      charSpans[i]._o = o;
      charSpans[i].style.opacity = o;
    }
  }
}

/* ============================================================
   12. 遮罩
   ============================================================ */
function updateOverlay(){
  var ov;
  if (loopT > 28.2) ov = Math.min(1, (loopT - 28.2) / 1.8);
  else              ov = Math.max(0, 1 - loopT / 1.3);
  overlayEl.style.opacity = ov.toFixed(3);
}

/* ============================================================
   13. 交互
   ============================================================ */
var dragging = false, lastX = 0, lastY = 0, idleT = 0;
canvas.addEventListener('pointerdown', function(e){
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('pointerup', function(){
  dragging = false;
  canvas.style.cursor = 'grab';
});
window.addEventListener('pointermove', function(e){
  if (!dragging) return;
  camTheta -= (e.clientX - lastX) * 0.0058;
  camPhi   -= (e.clientY - lastY) * 0.0048;
  camPhi = Math.max(0.28, Math.min(1.48, camPhi));
  lastX = e.clientX; lastY = e.clientY;
  idleT = 0;
});
canvas.style.cursor = 'grab';

window.addEventListener('resize', function(){
  var W = Math.max(1, window.innerWidth);
  var H = Math.max(1, window.innerHeight);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

/* ============================================================
   14. 主循环
   ============================================================ */
var lastT = performance.now();
var errCount = 0;

function animate(){
  requestAnimationFrame(animate);
  var now;
  try { now = performance.now(); } catch (e) { now = Date.now(); }

  var dt = (now - lastT) / 1000;
  lastT = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;

  try {
    tick(dt, now / 1000);
  } catch (e) {
    errCount++;
    if (errCount <= 3) console.error(e);
  }
}

var tmpV = new THREE.Vector3();
var tmpV2 = new THREE.Vector3();

function tick(dt, nowT){
  /* 循环计时 */
  loopT += dt;
  if (loopT >= LOOP_TIME) {
    loopT -= LOOP_TIME;
  }
  if (!isFinite(loopT)) loopT = 0;

  /* 沿前沿移动 */
  frontT = (frontT + dt * 0.062) % 1;

  /* 自动模式：偏离程度随循环变化 */
  if (autoMode) {
    // 0-8s: 偏离内部；8-16s: 靠近前沿；16-24s: 在前沿上；24-30s: 再次离开
    var t = loopT;
    if (t < 8) {
      autoDev = 0.72;
    } else if (t < 16) {
      autoDev = 0.72 * (1 - (t - 8) / 8);
    } else if (t < 24) {
      autoDev = 0.0;
    } else {
      autoDev = Math.min(0.72, (t - 24) / 6 * 0.72);
    }
    // 平滑
    deviation += (autoDev - deviation) * Math.min(1, dt * 2.2);
    slider.value = Math.round(deviation * 1000);
    pvEl.textContent = deviation.toFixed(2);
  }

  /* --- 计算配置点位置 --- */
  var frontPt = frontCurve.getPointAt(frontT, tmpV).clone();

  // 内部方向：从点指向原点
  var toCenter = frontPt.clone().multiplyScalar(-1).normalize();

  // 实际位置 = 前沿点 + 偏离 * 方向 * 距离
  var devDist = deviation * 3.6;
  var actualPt = frontPt.clone().addScaledVector(toCenter, devDist);

  // 平滑移动
  configGroup.position.lerp(actualPt, Math.min(1, dt * 6.5));

  /* --- 判断是否在前沿上 --- */
  var onFront = deviation < 0.06;
  var color = onFront ? 0xffd166 : 0x66ffcc;

  cfgCoreMat.color.setHex(onFront ? 0xfff0c0 : 0xd8fff0);
  cfgGlow.material.color.setHex(color);
  cfgRingMat.color.setHex(color);

  var pulse = 1 + Math.sin(nowT * 4.2) * 0.14;
  cfgGlow.scale.set(2.2 * pulse, 2.2 * pulse, 1);
  cfgRing.rotation.z += dt * 1.8;
  cfgRing.rotation.x += dt * 0.9;

  /* --- 状态文字 --- */
  if (onFront) {
    statusEl.textContent = '✓ 位于帕累托前沿 · 无法改进';
    statusEl.style.color = '#ffd166';
    statusEl.style.textShadow = '0 0 14px rgba(255,200,90,.85)';
  } else {
    statusEl.textContent = '↗ 存在可改进方向 · 未达前沿';
    statusEl.style.color = '#66ffcc';
    statusEl.style.textShadow = '0 0 14px rgba(80,255,200,.85)';
  }

  /* --- 改进方向箭头 --- */
  var showArrow = deviation > 0.08;
  arrowGroup.visible = showArrow;

  if (showArrow) {
    var arrowStart = configGroup.position.clone();
    var arrowEnd = frontPt.clone();
    var dir = arrowEnd.clone().sub(arrowStart);
    var len = dir.length();

    if (len > 0.05) {
      dir.normalize();

      // 线
      var linePos = arrowLineGeo.attributes.position.array;
      linePos[0] = arrowStart.x; linePos[1] = arrowStart.y; linePos[2] = arrowStart.z;
      linePos[3] = arrowEnd.x - dir.x * 0.36;
      linePos[4] = arrowEnd.y - dir.y * 0.36;
      linePos[5] = arrowEnd.z - dir.z * 0.36;
      arrowLineGeo.attributes.position.needsUpdate = true;

      // 箭头
      arrowHead.position.copy(arrowEnd).addScaledVector(dir, -0.18);
      arrowHead.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), dir
      );

      // 呼吸闪烁
      var aop = 0.45 + 0.45 * Math.sin(nowT * 5.5);
      arrowLineMat.opacity = aop;
      arrowHeadMat.opacity = aop;
    }
  }

  /* --- 前沿粒子 --- */
  var fdArr = fdGeo.attributes.position.array;
  for (var i = 0; i < FRONT_DOT_N; i++) {
    fdT[i] = (fdT[i] + dt * 0.028) % 1;
    var pp = frontCurve.getPointAt(fdT[i], tmpV2);
    fdArr[i*3]   = pp.x;
    fdArr[i*3+1] = pp.y;
    fdArr[i*3+2] = pp.z;
  }
  fdGeo.attributes.position.needsUpdate = true;

  /* --- 前沿亮度脉动 --- */
  var fPulse = 0.82 + 0.18 * Math.sin(nowT * 2.6);
  frontMat.opacity = fPulse;
  frontGlowMat.opacity = 0.10 + 0.10 * fPulse;

  /* --- 无差异曲线动画 --- */
  for (var k = 0; k < indiffRings.length; k++) {
    var ir = indiffRings[k];
    ir.mesh.rotation.z += dt * (0.18 + k * 0.05);
    ir.mesh.position.y = ir.baseY + Math.sin(nowT * 0.8 + ir.phase) * 0.22;

    var rr = 1 + Math.sin(nowT * 1.4 + ir.phase) * 0.035;
    ir.mesh.scale.set(rr, rr, rr);

    var iop = 0.38 + 0.34 * (0.5 + 0.5 * Math.sin(nowT * 1.1 + ir.phase));
    ir.mat.opacity = iop;
  }

  /* --- 可行域呼吸 --- */
  var fScale = 1 + Math.sin(nowT * 0.55) * 0.014;
  feasibleMesh.scale.set(fScale, fScale, fScale);
  wireMesh.scale.set(fScale, fScale, fScale);

  feasibleMat.opacity = 0.088 + 0.040 * (0.5 + 0.5 * Math.sin(nowT * 0.9));

  /* --- 相机缓慢环绕 --- */
  if (!dragging) {
    idleT += dt;
    camTheta += dt * 0.052;
  }
  updateCamera();

  /* --- 文字与遮罩 --- */
  updateText();
  updateOverlay();

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

} catch (e) {
  console.error(e);
  fail('初始化失败：' + (e && e.message ? e.message : e));
}

});
</script>
</body>
</html>
