<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正交环面编织 · 三族测地线网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>正交环面编织 · 三族测地线网</h2>
        <div class="sub">Three orthogonal torus geodesic foliations · Irrational slopes</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">T₁(z轴): φ=√2·θ+φ₀</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">T₂(x轴): φ=√3·θ+ψ₀</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">T₃(y轴): φ=π·θ+χ₀</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(4.0, 2.8, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const THETA_MAX = 20 * Math.PI;
        const STEPS = 620;

        // ---- 环面参数化 ----
        const R = 2.45;
        const r = 0.65;

        function torusZ(theta, phi) {
            const rho = R + r * Math.cos(phi);
            return new THREE.Vector3(rho * Math.cos(theta), rho * Math.sin(theta), r * Math.sin(phi));
        }
        function torusX(theta, phi) {
            const rho = R + r * Math.cos(phi);
            return new THREE.Vector3(r * Math.sin(phi), rho * Math.cos(theta), rho * Math.sin(theta));
        }
        function torusY(theta, phi) {
            const rho = R + r * Math.cos(phi);
            return new THREE.Vector3(rho * Math.sin(theta), r * Math.sin(phi), rho * Math.cos(theta));
        }

        // ---- 测地线生成 ----
        function createGeodesic(torusFn, omega, phi0, color, opacity) {
            const pts = [];
            const dt = THETA_MAX / STEPS;
            for (let i = 0; i <= STEPS; i++) {
                const theta = i * dt;
                const phi = omega * theta + phi0;
                const p = torusFn(theta, phi);
                if (p.length() < 10) pts.push(p);
            }
            if (pts.length < 2) return null;
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        function createGeodesicFamily(torusFn, omegas, count, color, opacity) {
            const group = new THREE.Group();
            for (const omega of omegas) {
                const num = Math.ceil(count / omegas.length);
                for (let k = 0; k < num; k++) {
                    const phi0 = k * 2 * Math.PI / num;
                    const line = createGeodesic(torusFn, omega, phi0, color, opacity);
                    if (line) group.add(line);
                }
            }
            return group;
        }

        // ---- 辅助经纬线 ----
        function createTorusGrid(torusFn, color, opacity, meridianCount, parallelCount) {
            const group = new THREE.Group();
            for (let i = 0; i < meridianCount; i++) {
                const theta = i * 2 * Math.PI / meridianCount;
                const pts = [];
                for (let j = 0; j <= 220; j++) pts.push(torusFn(theta, j * 2 * Math.PI / 220));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            for (let i = 0; i < parallelCount; i++) {
                const phi = i * 2 * Math.PI / parallelCount;
                const pts = [];
                for (let j = 0; j <= 220; j++) pts.push(torusFn(j * 2 * Math.PI / 220, phi));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // ---- 主组 ----
        const rootGroup = new THREE.Group();
        rootGroup.name = 'triple-torus-weave';
        scene.add(rootGroup);

        // 金色测地线：绕z轴环面，斜率√2和φ
        rootGroup.add(createGeodesicFamily(torusZ, [Math.sqrt(2), (1 + Math.sqrt(5)) / 2], 28, COLOR_GOLD, 0.62));
        rootGroup.add(createTorusGrid(torusZ, COLOR_GOLD, 0.08, 14, 14));

        // 青色测地线：绕x轴环面，斜率√3和π
        rootGroup.add(createGeodesicFamily(torusX, [Math.sqrt(3), Math.PI], 28, COLOR_CYAN, 0.62));
        rootGroup.add(createTorusGrid(torusX, COLOR_CYAN, 0.08, 14, 14));

        // 品红测地线：绕y轴环面，斜率√5和e
        rootGroup.add(createGeodesicFamily(torusY, [Math.sqrt(5), Math.E], 28, COLOR_MAGENTA, 0.62));
        rootGroup.add(createTorusGrid(torusY, COLOR_MAGENTA, 0.08, 14, 14));

        console.log('正交环面编织线条总数:', rootGroup.children.length);

        // ---- 背景星点 ----
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 11;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.26;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 8.0;
            const camAngle = t * 0.08;
            const camHeight = 2.9 + Math.sin(t * 0.16) * 0.8;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 正交环面三族测地线编织动画已稳定运行');
    </script>
</body>
</html>
