<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双纽线编织 · 伯努利卵形族</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>双纽线编织 · 伯努利卵形族</h2>
        <div class="sub">Lemniscate of Bernoulli · |z²−a²|=k² · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">a=1.0, k∈[0.15,1.60]</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">a=1.15, k∈[0.20,1.80]</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">a=0.85, k∈[0.12,1.40]</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.15;
        const CURVE_POINTS = 480;

        // 球极投影
        function stereographic(px, py) {
            const d = px * px + py * py + PROJ_D * PROJ_D;
            const f = 2 * PROJ_D * SPHERE_R / d;
            return new THREE.Vector3(px * f, py * f, (px * px + py * py - PROJ_D * PROJ_D) / d * SPHERE_R);
        }

        // 伯努利双纽线参数化: |z²-a²|=k²
        // 在极坐标下: r² = a²·cos2θ ± √(k⁴ - a⁴·sin²2θ)
        function lemniscatePoint(a, k, theta) {
            const cos2 = Math.cos(2 * theta);
            const sin2 = Math.sin(2 * theta);
            const a2 = a * a;
            const k4 = k * k * k * k;
            const disc = k4 - a2 * a2 * sin2 * sin2;
            if (disc < 0) return null;
            const r2 = a2 * cos2 + Math.sqrt(disc);
            if (r2 <= 0) return null;
            const r = Math.sqrt(r2);
            if (r > 8 || r < 0.004) return null;
            return { x: r * Math.cos(theta), y: r * Math.sin(theta) };
        }

        // 生成一族双纽线
        function createLemniscateFamily(a, kValues, rotAngle, numPhases, color, opacity) {
            const group = new THREE.Group();
            const cosR = Math.cos(rotAngle);
            const sinR = Math.sin(rotAngle);

            for (const k of kValues) {
                for (let p = 0; p < numPhases; p++) {
                    const phaseOff = p * 2 * Math.PI / numPhases;
                    const pts3D = [];
                    const dTheta = 2 * Math.PI / CURVE_POINTS;
                    for (let i = 0; i <= CURVE_POINTS; i++) {
                        const theta = i * dTheta + phaseOff * 0.5;
                        const lp = lemniscatePoint(a, k, theta);
                        if (!lp) continue;
                        const rx = lp.x * cosR - lp.y * sinR;
                        const ry = lp.x * sinR + lp.y * cosR;
                        const sp = stereographic(rx, ry);
                        if (sp && sp.length() < 9.5) pts3D.push(sp);
                    }
                    if (pts3D.length >= 2) {
                        const geom = new THREE.BufferGeometry().setFromPoints(pts3D);
                        const mat = new THREE.LineBasicMaterial({
                            color, transparent: true, opacity, depthWrite: true, depthTest: true,
                        });
                        group.add(new THREE.Line(geom, mat));
                    }
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'lemniscate-weave';
        scene.add(rootGroup);

        const numPhases = 16;

        // 金色族：a=1.0, k值较小到中等
        const goldK = [];
        for (let i = 0; i < 22; i++) goldK.push(0.15 + i * 1.45 / 21);
        rootGroup.add(createLemniscateFamily(1.0, goldK, 0, numPhases, COLOR_GOLD, 0.58));
        // 额外金色（更密集）
        const goldK2 = [];
        for (let i = 0; i < 12; i++) goldK2.push(0.22 + i * 1.1 / 11);
        rootGroup.add(createLemniscateFamily(1.0, goldK2, 0, Math.floor(numPhases * 0.5), COLOR_GOLD, 0.35));

        // 青色族：a=1.15, k值中等
        const cyanK = [];
        for (let i = 0; i < 22; i++) cyanK.push(0.20 + i * 1.60 / 21);
        rootGroup.add(createLemniscateFamily(1.15, cyanK, Math.PI / 3, numPhases, COLOR_CYAN, 0.58));
        const cyanK2 = [];
        for (let i = 0; i < 12; i++) cyanK2.push(0.28 + i * 1.25 / 11);
        rootGroup.add(createLemniscateFamily(1.15, cyanK2, Math.PI / 3, Math.floor(numPhases * 0.5), COLOR_CYAN, 0.35));

        // 品红族：a=0.85, k值从小到大
        const magentaK = [];
        for (let i = 0; i < 22; i++) magentaK.push(0.12 + i * 1.28 / 21);
        rootGroup.add(createLemniscateFamily(0.85, magentaK, 2 * Math.PI / 3, numPhases, COLOR_MAGENTA, 0.58));
        const magentaK2 = [];
        for (let i = 0; i < 12; i++) magentaK2.push(0.18 + i * 0.95 / 11);
        rootGroup.add(createLemniscateFamily(0.85, magentaK2, 2 * Math.PI / 3, Math.floor(numPhases * 0.5), COLOR_MAGENTA, 0.35));

        // 额外旋转角度的变体
        rootGroup.add(createLemniscateFamily(1.0, goldK.slice(0, 8), Math.PI / 6, 6, COLOR_GOLD, 0.28));
        rootGroup.add(createLemniscateFamily(1.15, cyanK.slice(0, 8), -Math.PI / 6, 6, COLOR_CYAN, 0.28));
        rootGroup.add(createLemniscateFamily(0.85, magentaK.slice(0, 8), -Math.PI / 4, 6, COLOR_MAGENTA, 0.28));

        console.log('双纽线编织线条总数:', rootGroup.children.length);

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 220; j++) {
                const phi = j * 2 * Math.PI / 220;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 220; j++) {
                const theta = 0.02 + j * Math.PI / 220;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 稳定动画循环
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.09;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 伯努利双纽线球极投影编织动画已稳定运行');
    </script>
</body>
</html>
