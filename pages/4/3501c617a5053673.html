<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恩内佩尔曲面 · 渐近线网络</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>恩内佩尔曲面 · 渐近线网络</h2>
        <div class="sub">Enneper minimal surface · Asymptotic curves</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">u‑曲线 (v=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">v‑曲线 (u=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">渐近线 u±v = const</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 场景基础
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.2, 2.0, 7.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟（防止暂停）
        let startTime = performance.now();
        let elapsed = 0;
        function tick() {
            elapsed = (performance.now() - startTime) * 0.001;
            return elapsed;
        }

        // 颜色
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // 恩内佩尔曲面参数方程
        function enneper(u, v) {
            const u2 = u * u;
            const v2 = v * v;
            return new THREE.Vector3(
                u - u2 * u / 3 + u * v2,
                v - v2 * v / 3 + v * u2,
                u2 - v2
            );
        }

        const scale = 0.52;         // 缩放以适应视图
        const uRange = 2.0;        // u,v 范围 [-uRange, uRange]
        const vRange = 2.0;

        // 生成曲线组：金色 u-曲线 (固定v变化u)
        function createUCurves(vValues, color, samples = 240) {
            const group = new THREE.Group();
            const du = 2 * uRange / samples;
            for (const v of vValues) {
                const pts = [];
                for (let i = 0; i <= samples; i++) {
                    const u = -uRange + i * du;
                    const p = enneper(u, v).multiplyScalar(scale);
                    pts.push(p);
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.88, depthWrite: true, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 生成 v-曲线 (固定u变化v)
        function createVCurves(uValues, color, samples = 240) {
            const group = new THREE.Group();
            const dv = 2 * vRange / samples;
            for (const u of uValues) {
                const pts = [];
                for (let i = 0; i <= samples; i++) {
                    const v = -vRange + i * dv;
                    const p = enneper(u, v).multiplyScalar(scale);
                    pts.push(p);
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.88, depthWrite: true, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 渐近线：u+v = const 和 u-v = const (满足 du²-dv²=0)
        function createAsymptoticLines(color, dir, samples = 260) {
            const group = new THREE.Group();
            const step = 0.09; // 常数间隔
            const constantValues = [];
            const constMin = -2.8, constMax = 2.8;
            for (let c = constMin; c <= constMax; c += step) constantValues.push(c);

            for (const c of constantValues) {
                const pts = [];
                // dir = +1: u+v=c => v = c - u
                // dir = -1: u-v=c => v = u - c
                const du = 4.0 / samples;
                for (let i = 0; i <= samples; i++) {
                    const u = -2.0 + i * du;
                    let v;
                    if (dir === 1) v = c - u;
                    else v = u - c;
                    if (Math.abs(u) > uRange || Math.abs(v) > vRange) continue;
                    const p = enneper(u, v).multiplyScalar(scale);
                    pts.push(p);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.7, depthWrite: true, depthTest: true
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'enneper-system';
        scene.add(rootGroup);

        // 金色：u-曲线 (v固定) 36条
        const vValues = [];
        for (let i = 0; i < 36; i++) vValues.push(-1.8 + i * 3.6 / 35);
        rootGroup.add(createUCurves(vValues, COLOR_GOLD));

        // 青色：v-曲线 (u固定) 36条
        const uValues = [];
        for (let i = 0; i < 36; i++) uValues.push(-1.8 + i * 3.6 / 35);
        rootGroup.add(createVCurves(uValues, COLOR_CYAN));

        // 品红：渐近线 (u+v=const 和 u-v=const)
        rootGroup.add(createAsymptoticLines(COLOR_MAGENTA, 1));   // u+v
        rootGroup.add(createAsymptoticLines(COLOR_MAGENTA, -1));  // u-v

        console.log('恩内佩尔线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 600;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.6,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 稳定动画循环
        function animate() {
            tick();
            const t = elapsed;

            rootGroup.rotation.x = t * 0.19;
            rootGroup.rotation.y = t * 0.27;
            rootGroup.rotation.z = t * 0.12;

            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.1 + Math.sin(t * 0.15) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // 响应式处理
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 恩内佩尔曲面渐近线动画稳定运行中');
    </script>
</body>
</html>
