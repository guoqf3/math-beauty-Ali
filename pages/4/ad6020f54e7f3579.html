<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆运动 · θ(t) = θ₀·cos(ωt)</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #04060f;
  }
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 130% 110% at 50% 38%,
      #101f3a 0%, #0a1730 16%, #071028 34%,
      #040a1c 54%, #020510 76%, #04060f 100%);
  }
  #glow {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
    background: radial-gradient(circle 40vw at 50% 42%,
      rgba(255, 190, 90, 0.055) 0%,
      rgba(70, 90, 180, 0.022) 48%,
      rgba(0, 0, 0, 0) 75%);
  }
  canvas { position: fixed; inset: 0; display: block; z-index: 1; }

  #formula {
    position: fixed;
    left: 34px; top: 32px;
    z-index: 2;
    color: rgba(255, 225, 175, 0.72);
    font: 13px/1.95 "Cambria Math", "Times New Roman", Georgia, serif;
    letter-spacing: 0.02em;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 16px rgba(255, 180, 80, 0.38);
  }
  #formula .title {
    display: block;
    font-size: 10px;
    letter-spacing: 0.32em;
    color: rgba(255, 195, 130, 0.42);
    margin-bottom: 11px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #formula .line { display: block; margin: 2px 0; }
  #formula .key { color: rgba(255, 240, 200, 0.95); }

  #hint {
    position: fixed;
    left: 50%; bottom: 24px;
    transform: translateX(-50%);
    z-index: 2;
    color: rgba(150, 180, 230, 0.22);
    font: 11px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
    letter-spacing: 0.26em;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="glow"></div>

<div id="formula">
  <span class="title">单摆运动 · 简谐摆动</span>
  <span class="line"><span class="key">θ</span>(t) = θ₀ · cos( <span class="key">ω</span> t + φ )</span>
  <span class="line"><span class="key">ω</span> = √( g / L )　·　T = 2π / <span class="key">ω</span></span>
</div>

<div id="hint">θ(t) = θ₀·cos(ωt)　·　相位差摆锤群像</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. 基础环境
   ============================================================ */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 1.35, 7.6);
camera.lookAt(0, 1.3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

/* ============================================================
   2. 星空背景
   ============================================================ */
(function createStars() {
  const COUNT = 2000;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);

  for (let i = 0; i < COUNT; i++) {
    const r     = 60 + Math.random() * 140;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);

    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);

    const b = 0.22 + Math.random() * 0.62;
    const w = 0.6 + Math.random() * 0.4;
    col[i * 3]     = b * (0.72 + 0.28 * w);
    col[i * 3 + 1] = b * (0.78 + 0.22 * w);
    col[i * 3 + 2] = b * (0.92 + 0.08 * w);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.85, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity: 0.85, depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const stars = new THREE.Points(geo, mat);
  stars.frustumCulled = false;
  scene.add(stars);
})();

/* ============================================================
   3. 单摆参数
   θ(t) = θ₀·cos(ωt + φ)    ω = √(g/L)
   ============================================================ */
const PENDULUM_COUNT = 11;
const PIVOT_Y   = 3.05;
const SPREAD_X  = 7.0;
const THETA_0   = 0.42;
const G         = 9.8;
const TRAIL_LEN = 58;

const pendulums = [];

for (let i = 0; i < PENDULUM_COUNT; i++) {
  const t      = i / (PENDULUM_COUNT - 1);
  const pivotX = (t - 0.5) * SPREAD_X;

  /* 摆长：从左到右依次加长 → 摆动依次变慢 */
  const L     = 1.55 + t * 1.85;
  const omega = Math.sqrt(G / L);

  /* 微小相位差，让群像立刻呈现交错波形 */
  const phase = i * 0.12;

  /* 颜色：暖白 → 琥珀 */
  const c1 = new THREE.Color(0xfff0c8);
  const c2 = new THREE.Color(0xffa838);
  const color = c1.clone().lerp(c2, t);

  pendulums.push({ pivotX, L, omega, phase, color });
}

/* ============================================================
   4. 构建每个单摆
   ============================================================ */
const bobMeshes = [];
const ropeLines = [];
const trailPts  = [];

const bobGeo  = new THREE.SphereGeometry(0.105, 16, 12);
const haloGeo = new THREE.SphereGeometry(0.30, 14, 10);
const pivotGeo = new THREE.SphereGeometry(0.045, 10, 8);

for (let i = 0; i < PENDULUM_COUNT; i++) {
  const p = pendulums[i];

  /* —— 支点小光点 —— */
  const pivotMesh = new THREE.Mesh(pivotGeo, new THREE.MeshBasicMaterial({
    color: 0xffd9a0, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  pivotMesh.position.set(p.pivotX, PIVOT_Y, 0);
  scene.add(pivotMesh);

  /* —— 摆锤（发光球） —— */
  const bob = new THREE.Mesh(bobGeo, new THREE.MeshBasicMaterial({
    color: p.color, transparent: true, opacity: 1.0,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(bob);
  bobMeshes.push(bob);

  /* 光晕 */
  const halo = new THREE.Mesh(haloGeo, new THREE.MeshBasicMaterial({
    color: p.color, transparent: true, opacity: 0.14,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  bob.add(halo);

  /* —— 摆绳 —— */
  const ropeGeo = new THREE.BufferGeometry();
  ropeGeo.setAttribute('position',
    new THREE.BufferAttribute(new Float32Array(6), 3));
  const rope = new THREE.Line(ropeGeo, new THREE.LineBasicMaterial({
    color: 0xffd8a0, transparent: true, opacity: 0.26,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(rope);
  ropeLines.push(rope);

  /* —— 轨迹点云 —— */
  const tGeo = new THREE.BufferGeometry();
  const tPos = new Float32Array(TRAIL_LEN * 3);
  const tCol = new Float32Array(TRAIL_LEN * 3);
  tGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
  tGeo.setAttribute('color',    new THREE.BufferAttribute(tCol, 3));

  const trail = new THREE.Points(tGeo, new THREE.PointsMaterial({
    size: 0.05, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity: 1.0,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  trail.frustumCulled = false;
  scene.add(trail);
  trailPts.push({ geo: tGeo, pos: tPos, col: tCol });

  /* 初始化轨迹到起始位置 */
  const th0 = THETA_0 * Math.cos(p.phase);
  const ix  = p.pivotX + p.L * Math.sin(th0);
  const iy  = PIVOT_Y - p.L * Math.cos(th0);
  for (let k = 0; k < TRAIL_LEN; k++) {
    tPos[k * 3]     = ix;
    tPos[k * 3 + 1] = iy;
    tPos[k * 3 + 2] = 0;
  }
}

/* ============================================================
   5. 动画循环
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  for (let i = 0; i < PENDULUM_COUNT; i++) {
    const p = pendulums[i];

    /* —— 单摆运动方程 —— */
    const theta = THETA_0 * Math.cos(p.omega * elapsed + p.phase);

    const bobX = p.pivotX + p.L * Math.sin(theta);
    const bobY = PIVOT_Y - p.L * Math.cos(theta);

    /* 更新摆锤 */
    bobMeshes[i].position.set(bobX, bobY, 0);

    /* 更新摆绳 */
    const rp = ropeLines[i].geometry.attributes.position.array;
    rp[0] = p.pivotX; rp[1] = PIVOT_Y; rp[2] = 0;
    rp[3] = bobX;     rp[4] = bobY;    rp[5] = 0;
    ropeLines[i].geometry.attributes.position.needsUpdate = true;

    /* —— 更新轨迹：整体后移 + 新点插入头部 —— */
    const tp = trailPts[i].pos;
    const tc = trailPts[i].col;

    for (let k = TRAIL_LEN - 1; k > 0; k--) {
      tp[k * 3]     = tp[(k - 1) * 3];
      tp[k * 3 + 1] = tp[(k - 1) * 3 + 1];
      tp[k * 3 + 2] = tp[(k - 1) * 3 + 2];
    }
    tp[0] = bobX;
    tp[1] = bobY;
    tp[2] = 0;

    /* 颜色：头部亮，尾部三次方衰减 */
    const cr = p.color.r, cg = p.color.g, cb = p.color.b;
    for (let k = 0; k < TRAIL_LEN; k++) {
      const f  = 1 - k / TRAIL_LEN;
      const f2 = f * f * f;
      tc[k * 3]     = cr * f2;
      tc[k * 3 + 1] = cg * f2;
      tc[k * 3 + 2] = cb * f2;
    }

    trailPts[i].geo.attributes.position.needsUpdate = true;
    trailPts[i].geo.attributes.color.needsUpdate    = true;
  }

  /* —— 相机极缓慢游移 —— */
  camera.position.x = Math.sin(elapsed * 0.13) * 0.40;
  camera.position.y = 1.35 + Math.cos(elapsed * 0.17) * 0.18;
  camera.position.z = 7.6 + Math.sin(elapsed * 0.10) * 0.28;
  camera.lookAt(0, 1.3, 0);

  renderer.render(scene, camera);
}

animate();

/* ============================================================
   6. 自适应
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
