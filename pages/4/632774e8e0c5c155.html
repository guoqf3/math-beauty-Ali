<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纳米制造 · Nanofabrication</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#02040e;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    cursor:default;}
  #scene{display:block;width:100%;height:100%;cursor:grab;}
  #scene:active{cursor:grabbing;}

  /* 顶部启迪意义文字 */
  #topText{
    position:fixed;top:22px;left:50%;transform:translateX(-50%);
    width:76%;max-width:980px;text-align:center;
    font-size:17px;line-height:1.85;letter-spacing:1.2px;
    color:#c8ecff;
    text-shadow:0 0 14px rgba(0,190,255,.75),0 0 34px rgba(0,120,255,.45);
    pointer-events:none;z-index:20;font-weight:400;
    min-height:66px;
  }
  #cursor{
    display:inline-block;color:#5fe6ff;
    animation:blink 1s steps(1) infinite;
    text-shadow:0 0 10px #00d8ff;
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  /* 边缘公式 */
  .edge{
    position:fixed;z-index:20;pointer-events:none;
    font-family:"SFMono-Regular",Consolas,"Courier New",monospace;
    font-size:12.5px;line-height:2.1;letter-spacing:.5px;
    color:rgba(110,215,255,.55);
    text-shadow:0 0 10px rgba(0,160,255,.5);
  }
  .edge.left{left:20px;top:50%;transform:translateY(-50%);text-align:left;}
  .edge.right{right:20px;top:50%;transform:translateY(-50%);text-align:right;}
  .edge .hl{color:rgba(150,240,255,.85);text-shadow:0 0 14px rgba(0,200,255,.8);}
  .edge .dim{color:rgba(90,150,200,.4);}

  /* 尺度标尺 */
  #scale{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    z-index:20;pointer-events:none;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:15px;letter-spacing:2px;
    color:rgba(140,235,255,.9);
    text-shadow:0 0 16px rgba(0,200,255,.9);
    padding:6px 18px;
    border:1px solid rgba(0,180,255,.25);
    border-radius:20px;
    background:rgba(0,30,60,.35);
    backdrop-filter:blur(4px);
    white-space:nowrap;
  }

  /* 交互提示 */
  #hint{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    z-index:20;pointer-events:none;
    font-size:11.5px;letter-spacing:1.5px;
    color:rgba(110,190,240,.45);
    white-space:nowrap;
  }

  /* 闪光遮罩 */
  #flash{
    position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,
      #ffffff 0%, #c8f6ff 18%, rgba(60,190,255,.75) 42%,
      rgba(0,90,220,.35) 68%, rgba(0,0,0,0) 90%);
  }

  /* 暗角 */
  #vignette{
    position:fixed;inset:0;z-index:12;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(0,0,0,0) 38%, rgba(0,6,20,.55) 78%, rgba(0,3,12,.92) 100%);
  }
  /* 扫描线质感 */
  #scan{
    position:fixed;inset:0;z-index:13;pointer-events:none;opacity:.16;
    background:repeating-linear-gradient(0deg,
      rgba(0,220,255,.16) 0px, rgba(0,220,255,.16) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode:screen;
  }

  /* 光束状态指示 */
  #beamState{
    position:fixed;top:20px;right:22px;z-index:20;pointer-events:none;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11.5px;letter-spacing:1.5px;
    color:rgba(120,255,220,.85);
    text-shadow:0 0 12px rgba(0,255,200,.8);
  }
  #beamState.off{color:rgba(255,120,150,.8);text-shadow:0 0 12px rgba(255,60,100,.7);}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="vignette"></div>
<div id="scan"></div>
<div id="flash"></div>

<div id="topText"><span id="typed"></span><span id="cursor">▊</span></div>

<div class="edge left">
  <div><span class="hl">R = k₁ · λ / NA</span></div>
  <div class="dim">— 瑞利判据</div>
  <div style="height:10px"></div>
  <div>λ = h / p</div>
  <div class="dim">— 德布罗意波长</div>
  <div style="height:10px"></div>
  <div>d = 0.5 μm</div>
</div>

<div class="edge right">
  <div><span class="hl">EUV λ = 13.5 nm</span></div>
  <div style="height:10px"></div>
  <div>CD &lt; 10 nm</div>
  <div style="height:10px"></div>
  <div>Δ ≈ 5 nm</div>
  <div class="dim">— 图案化精度</div>
</div>

<div id="beamState">◉ BEAM ON</div>

<div id="scale">10⁰ m · 宏观</div>
<div id="hint">拖动旋转 · 滚轮缩放 · 点击切换光束</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   基础初始化
============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040e);
scene.fog = new THREE.FogExp2(0x02040e, 0.0075);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.05, 4000);

/* ============================================================
   环境贴图（用于金属虹彩反射）
============================================================ */
function makeEnvCanvas(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,256);
  g.addColorStop(0.00,'#0b2a63');
  g.addColorStop(0.42,'#123a7a');
  g.addColorStop(0.50,'#2668b8');
  g.addColorStop(0.58,'#0a1c3c');
  g.addColorStop(1.00,'#02060f');
  ctx.fillStyle = g; ctx.fillRect(0,0,512,256);

  const blobs = [
    [70,  55, 55,'rgba(0,255,240,0.95)'],
    [255, 85, 65,'rgba(255,0,200,0.80)'],
    [420, 65, 50,'rgba(255,180,0,0.75)'],
    [170,180, 80,'rgba(0,120,255,0.55)'],
    [360,200, 60,'rgba(140,0,255,0.50)'],
    [490,140, 45,'rgba(0,255,140,0.45)']
  ];
  for (const [x,y,r,col] of blobs){
    const rg = ctx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0, col);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(x-r, y-r, r*2, r*2);
  }
  return c;
}

const pmrem = new THREE.PMREMGenerator(renderer);
const envSourceTex = new THREE.CanvasTexture(makeEnvCanvas());
envSourceTex.mapping = THREE.EquirectangularReflectionMapping;
const envRT = pmrem.fromEquirectangular(envSourceTex);
scene.environment = envRT.texture;
envSourceTex.dispose();
pmrem.dispose();

/* ============================================================
   发光贴图工具
============================================================ */
function makeGlowTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.20,'rgba(180,245,255,0.9)');
  g.addColorStop(0.48,'rgba(60,180,255,0.35)');
  g.addColorStop(0.75,'rgba(20,90,220,0.10)');
  g.addColorStop(1.00,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const GLOW_TEX = makeGlowTexture();

/* ============================================================
   灯光
============================================================ */
scene.add(new THREE.AmbientLight(0x223866, 0.9));

const keyLight = new THREE.DirectionalLight(0x9fd8ff, 1.4);
keyLight.position.set(6, 12, 8);
scene.add(keyLight);

const pCyan = new THREE.PointLight(0x00ffe0, 45, 90);
pCyan.position.set(10, 7, 9);
scene.add(pCyan);

const pMagenta = new THREE.PointLight(0xff2fa0, 45, 90);
pMagenta.position.set(-10, 6, -8);
scene.add(pMagenta);

const pAmber = new THREE.PointLight(0xffaa33, 35, 90);
pAmber.position.set(0, 14, -4);
scene.add(pAmber);

const pBlue = new THREE.PointLight(0x2255ff, 40, 90);
pBlue.position.set(-6, -8, 6);
scene.add(pBlue);

/* ============================================================
   星空
============================================================ */
(function buildStars(){
  const N = 1400;
  const pos = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    const r = 120 + Math.random()*900;
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({
    color:0x9ecbff, size:1.6, sizeAttenuation:false,
    transparent:true, opacity:0.85, fog:false,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  scene.add(new THREE.Points(g,m));
})();

/* ============================================================
   宏观层：苹果
============================================================ */
const appleGroup = new THREE.Group();
scene.add(appleGroup);

(function buildApple(){
  const bodyGeo = new THREE.SphereGeometry(1, 64, 48);
  bodyGeo.scale(1, 0.92, 1);
  const bodyMat = new THREE.MeshStandardMaterial({
    color:0xc9182c, roughness:0.32, metalness:0.18,
    emissive:0x33060a, emissiveIntensity:1.0,
    envMapIntensity:0.9
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  appleGroup.add(body);

  // 顶部凹陷（用一个小暗球模拟）
  const dent = new THREE.Mesh(
    new THREE.SphereGeometry(0.17, 20, 14),
    new THREE.MeshStandardMaterial({color:0x4a0810, roughness:0.9})
  );
  dent.position.set(0, 0.90, 0);
  dent.scale.set(1, 0.5, 1);
  appleGroup.add(dent);

  // 果柄
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.055, 0.34, 8),
    new THREE.MeshStandardMaterial({color:0x6b4a2a, roughness:0.95})
  );
  stem.position.set(0.02, 1.02, 0);
  stem.rotation.z = -0.18;
  appleGroup.add(stem);

  // 叶片
  const leafGeo = new THREE.SphereGeometry(0.22, 20, 12);
  leafGeo.scale(1, 0.10, 0.52);
  const leaf = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({
    color:0x2fa84f, roughness:0.55, metalness:0.1,
    emissive:0x062a10, side:THREE.DoubleSide
  }));
  leaf.position.set(0.26, 1.13, 0.02);
  leaf.rotation.z = -0.55;
  leaf.rotation.y = 0.4;
  appleGroup.add(leaf);

  // 高光点
  const hi = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 16, 12),
    new THREE.MeshBasicMaterial({
      color:0xffaaaa, transparent:true, opacity:0.32,
      blending:THREE.AdditiveBlending, depthWrite:false
    })
  );
  hi.position.set(-0.48, 0.52, 0.62);
  hi.scale.set(1, 0.6, 0.4);
  appleGroup.add(hi);

  // 环绕光晕
  const halo = new THREE.Mesh(
    new THREE.TorusGeometry(1.65, 0.006, 6, 160),
    new THREE.MeshBasicMaterial({
      color:0x3fa8ff, transparent:true, opacity:0.45,
      blending:THREE.AdditiveBlending, depthWrite:false
    })
  );
  halo.rotation.x = Math.PI*0.42;
  halo.rotation.y = 0.3;
  appleGroup.add(halo);
})();

/* ============================================================
   纳米层：光刻工厂
============================================================ */
const nanoGroup = new THREE.Group();
nanoGroup.visible = false;
scene.add(nanoGroup);

/* --- 晶圆基底 --- */
(function buildWafer(){
  const waferMat = new THREE.MeshStandardMaterial({
    color:0x0a1e3a, metalness:0.98, roughness:0.14,
    envMapIntensity:1.5, emissive:0x020a18, emissiveIntensity:1
  });
  const wafer = new THREE.Mesh(
    new THREE.CylinderGeometry(9.6, 9.8, 0.42, 96, 1, false), waferMat
  );
  wafer.position.y = -0.21;
  nanoGroup.add(wafer);

  // 边缘光环
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(9.6, 0.045, 8, 160),
    new THREE.MeshBasicMaterial({
      color:0x00e5ff, transparent:true, opacity:0.85,
      blending:THREE.AdditiveBlending, depthWrite:false
    })
  );
  ring.rotation.x = Math.PI/2;
  ring.position.y = 0.02;
  nanoGroup.add(ring);

  // 第二层呼吸环
  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(6.2, 0.018, 6, 140),
    new THREE.MeshBasicMaterial({
      color:0x66aaff, transparent:true, opacity:0.35,
      blending:THREE.AdditiveBlending, depthWrite:false
    })
  );
  ring2.rotation.x = Math.PI/2;
  ring2.position.y = 0.03;
  nanoGroup.add(ring2);

  // 网格
  const grid = new THREE.GridHelper(19, 38, 0x0d4a78, 0x082a44);
  grid.position.y = 0.012;
  grid.material.transparent = true;
  grid.material.opacity = 0.5;
  grid.material.depthWrite = false;
  nanoGroup.add(grid);
})();

/* --- 纳米柱阵列 --- */
const COLS = 14, ROWS = 14;
const SPACING = 0.86;
const pillarItems = [];

for (let r=0; r<ROWS; r++){
  const order = [];
  for (let c=0; c<COLS; c++) order.push(r%2===0 ? c : COLS-1-c);
  for (const c of order){
    const x = (c - (COLS-1)/2) * SPACING;
    const z = (r - (ROWS-1)/2) * SPACING;
    const dist = Math.hypot(x, z);
    pillarItems.push({
      x, z, dist,
      h: 0.75 + 0.55 * Math.exp(-(dist*dist)/26) + Math.random()*0.12,
      t0: 0
    });
  }
}

const pillarGeo = new THREE.CylinderGeometry(0.135, 0.185, 1, 6, 1, false);
pillarGeo.translate(0, 0.5, 0);

const pillarMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  metalness: 1.0,
  roughness: 0.13,
  envMapIntensity: 2.0,
  emissive: 0x0a1a33,
  emissiveIntensity: 1.0
});

const pillars = new THREE.InstancedMesh(pillarGeo, pillarMat, pillarItems.length);
pillars.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
pillars.frustumCulled = false;
nanoGroup.add(pillars);

const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

for (let i=0; i<pillarItems.length; i++){
  const it = pillarItems[i];
  dummy.position.set(it.x, 0, it.z);
  dummy.scale.set(1, 0.0001, 1);
  dummy.updateMatrix();
  pillars.setMatrixAt(i, dummy.matrix);

  // 角向彩虹色 —— 金属虹彩
  const ang = Math.atan2(it.z, it.x) / (Math.PI*2) + 0.5;
  const hue = (ang + it.dist*0.045) % 1;
  tmpColor.setHSL(hue, 0.88, 0.62);
  pillars.setColorAt(i, tmpColor);
}
pillars.instanceColor.needsUpdate = true;
pillars.instanceMatrix.needsUpdate = true;

/* --- 光刻光束 --- */
const beamGroup = new THREE.Group();
beamGroup.visible = false;
nanoGroup.add(beamGroup);

// 锥形光束
const beamCone = new THREE.Mesh(
  new THREE.CylinderGeometry(0.30, 0.022, 15, 16, 1, true),
  new THREE.MeshBasicMaterial({
    color:0x7ff0ff, transparent:true, opacity:0.22,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
  })
);
beamCone.position.y = 7.5;
beamGroup.add(beamCone);

// 内芯
const beamCore = new THREE.Mesh(
  new THREE.CylinderGeometry(0.075, 0.012, 15, 12, 1, true),
  new THREE.MeshBasicMaterial({
    color:0xeaffff, transparent:true, opacity:0.65,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
  })
);
beamCore.position.y = 7.5;
beamGroup.add(beamCore);

// 落点光斑
const spot = new THREE.Sprite(new THREE.SpriteMaterial({
  map: GLOW_TEX, color:0x9ff4ff, transparent:true, opacity:0.95,
  blending:THREE.AdditiveBlending, depthWrite:false
}));
spot.scale.set(2.4, 2.4, 1);
spot.position.y = 0.05;
beamGroup.add(spot);

// 落点核心亮点
const spotCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.14, 16, 12),
  new THREE.MeshBasicMaterial({
    color:0xffffff, transparent:true, opacity:1,
    blending:THREE.AdditiveBlending, depthWrite:false
  })
);
spotCore.position.y = 0.06;
beamGroup.add(spotCore);

// 光束点光源
const beamLight = new THREE.PointLight(0x66eeff, 8, 12);
beamLight.position.y = 0.6;
beamGroup.add(beamLight);

/* ============================================================
   时间轴与相机关键帧
============================================================ */
const LOOP = 30;                 // 循环总时长（秒）
const FAB_START = 10.5;          // 加工开始
const FAB_END   = 23.0;          // 扫描结束

// 计算每根柱子的生成时刻
for (let i=0; i<pillarItems.length; i++){
  pillarItems[i].t0 = FAB_START + (i / pillarItems.length) * (FAB_END - FAB_START);
}

const camKeys = [
  {t:0.0,  pos:[0, 1.20, 6.60], look:[0, 0, 0]},
  {t:5.6,  pos:[0, 0.35, 3.10], look:[0, 0, 0]},
  {t:7.5,  pos:[0, 8.0, 23.0],  look:[0, 0, 0]},
  {t:10.5, pos:[0, 18.0, 15.0], look:[0, 0, 0]},
  {t:15.5, pos:[9.0, 12.5, 13.0], look:[0, 0, 0]},
  {t:21.0, pos:[13.0, 7.5, 5.0],  look:[0, 0.9, 0]},
  {t:25.5, pos:[6.0, 2.6, 10.0],  look:[0, 0.7, 0]},
  {t:30.0, pos:[0, 1.20, 6.60],   look:[0, 0, 0]}
];

function sampleCam(t){
  let a = camKeys[0], b = camKeys[camKeys.length-1];
  for (let i=0; i<camKeys.length-1; i++){
    if (t >= camKeys[i].t && t <= camKeys[i+1].t){
      a = camKeys[i]; b = camKeys[i+1];
      break;
    }
  }
  const span = b.t - a.t;
  let u = span > 0 ? (t - a.t) / span : 0;
  u = u*u*(3 - 2*u);
  return {
    pos:  new THREE.Vector3().fromArray(a.pos ).lerp(new THREE.Vector3().fromArray(b.pos ), u),
    look: new THREE.Vector3().fromArray(a.look).lerp(new THREE.Vector3().fromArray(b.look), u)
  };
}

/* ============================================================
   交互状态
============================================================ */
let dragYaw = 0, dragPitch = 0;
let tYaw = 0,   tPitch = 0;
let zoom = 1;
let beamOn = true;
let isDown = false, moved = false, lastX = 0, lastY = 0;

canvas.addEventListener('pointerdown', e => {
  isDown = true; moved = false;
  lastX = e.clientX; lastY = e.clientY;
});

window.addEventListener('pointermove', e => {
  if (!isDown) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
  tYaw   -= dx * 0.005;
  tPitch -= dy * 0.004;
  tPitch = Math.max(-0.85, Math.min(0.85, tPitch));
});

window.addEventListener('pointerup', () => {
  if (isDown && !moved){
    beamOn = !beamOn;
    beamStateEl.textContent = beamOn ? '◉ BEAM ON' : '◎ BEAM OFF';
    beamStateEl.className = beamOn ? '' : 'off';
  }
  isDown = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= (1 + e.deltaY * 0.0012);
  zoom = Math.max(0.22, Math.min(4.5, zoom));
}, {passive:false});

/* ============================================================
   HUD 元素
============================================================ */
const typedEl    = document.getElementById('typed');
const scaleEl    = document.getElementById('scale');
const flashEl    = document.getElementById('flash');
const beamStateEl= document.getElementById('beamState');

const FULL_TEXT = '纳米制造让人类首次在原子尺度上“排列”物质，展现了“积跬步以至千里”的细微积累造就宏大工程的哲学，同时预示未来制造业向原子级精准操控的方向演进。';

/* ============================================================
   主循环
============================================================ */
const clock = new THREE.Clock();
let T = 0;
let fabOffset = 0;

function easeOutCubic(x){ return 1 - Math.pow(1-x, 3); }

function updatePillars(Ts){
  for (let i=0; i<pillarItems.length; i++){
    const it = pillarItems[i];
    let g = (Ts - it.t0) / 0.52;
    if (g < 0) g = 0;
    else if (g > 1) g = 1;
    const e = easeOutCubic(g);
    const h = e < 0.0006 ? 0.0006 : e * it.h;

    dummy.position.set(it.x, 0, it.z);
    dummy.scale.set(1, h, 1);
    dummy.updateMatrix();
    pillars.setMatrixAt(i, dummy.matrix);
  }
  pillars.instanceMatrix.needsUpdate = true;
}

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.06);
  T += dt;
  if (T >= LOOP){ T -= LOOP; fabOffset = 0; }

  // 光束关闭时冻结加工进度
  if (!beamOn && T > FAB_START - 1 && T < FAB_END + 2.5){
    fabOffset += dt;
  }
  const Ts = T - fabOffset;

  /* ---------- 相机 ---------- */
  const {pos: basePos, look} = sampleCam(T);

  dragYaw   += (tYaw   - dragYaw)   * 0.09;
  dragPitch += (tPitch - dragPitch) * 0.09;

  const dir = basePos.clone().sub(look);
  const sph = new THREE.Spherical().setFromVector3(dir);
  sph.theta += dragYaw;
  sph.phi = Math.max(0.10, Math.min(Math.PI - 0.10, sph.phi + dragPitch));
  sph.radius *= zoom;
  dir.setFromSpherical(sph);

  camera.position.copy(look).add(dir);
  camera.lookAt(look);

  /* ---------- 宏观 / 微观切换 ---------- */
  const inNano = T >= 7.5;
  appleGroup.visible = !inNano;
  nanoGroup.visible  =  inNano;

  // 苹果自转
  if (!inNano){
    appleGroup.rotation.y += dt * 0.22;
    appleGroup.rotation.z = Math.sin(T * 0.6) * 0.05;
    appleGroup.position.y = Math.sin(T * 0.9) * 0.045;
  }

  /* ---------- 纳米柱生长 ---------- */
  if (inNano){
    updatePillars(Ts);

    // 整体缓慢自转
    nanoGroup.rotation.y += dt * 0.035;

    // 晶圆边缘环呼吸
    const pulseRing = 1 + Math.sin(T * 2.0) * 0.006;
    nanoGroup.children[1].scale.set(pulseRing, 1, pulseRing);
  }

  /* ---------- 光束 ---------- */
  const fabricating = Ts > FAB_START - 0.8 && Ts < FAB_END + 1.8;
  const showBeam = inNano && beamOn && fabricating;
  beamGroup.visible = showBeam;

  if (showBeam){
    let u = (Ts - FAB_START) / (FAB_END - FAB_START);
    u = Math.max(0, Math.min(1, u));
    const idx = Math.min(pillarItems.length - 1, Math.floor(u * pillarItems.length));
    const it = pillarItems[idx];

    beamGroup.position.set(it.x, 0, it.z);

    const pulse = 1 + Math.sin(T * 22) * 0.18;
    spot.scale.set(2.4 * pulse, 2.4 * pulse, 1);
    spotCore.scale.setScalar(0.9 + Math.sin(T * 26) * 0.25);
    beamLight.intensity = 7 + Math.sin(T * 20) * 3;

    beamCone.rotation.y += dt * 2.2;
    beamCore.rotation.y -= dt * 3.0;

    // 正在加工位置的柱体额外发光感（通过轻微缩放抖动模拟）
    spot.material.opacity = 0.85 + Math.sin(T * 18) * 0.12;
  }

  /* ---------- 闪光转场 ---------- */
  let flash = 0;
  if (T > 5.8 && T < 9.3){
    const u = (T - 5.8) / 3.5;
    flash = Math.pow(Math.sin(u * Math.PI), 0.65);
  }
  if (T > 28.6){
    flash = Math.max(flash, (T - 28.6) / 1.4);
  }
  flashEl.style.opacity = Math.min(1, flash);

  /* ---------- 顶部文字逐字显示 ---------- */
  const tp = Math.max(0, Math.min(1, (T - 1.6) / 26.6));
  const n = Math.floor(tp * FULL_TEXT.length);
  if (typedEl.textContent.length !== n){
    typedEl.textContent = FULL_TEXT.slice(0, n);
  }

  /* ---------- 尺度标尺 ---------- */
  let label;
  if      (T < 3.6) label = '10⁰ m · 宏观 · 苹果';
  else if (T < 6.6) label = '10⁻³ m · 毫米 · 晶圆';
  else if (T < 9.6) label = '10⁻⁶ m · 微米 · 光刻';
  else              label = '10⁻⁹ m · 纳米 · 原子组装';
  if (scaleEl.textContent !== label) scaleEl.textContent = label;

  /* ---------- 点光源缓慢环绕，制造虹彩流动感 ---------- */
  pCyan.position.x    = Math.cos(T * 0.35) * 11;
  pCyan.position.z    = Math.sin(T * 0.35) * 11;
  pMagenta.position.x = Math.cos(T * 0.35 + 2.4) * 11;
  pMagenta.position.z = Math.sin(T * 0.35 + 2.4) * 11;
  pBlue.position.x    = Math.cos(T * 0.28 + 4.4) * 9;
  pBlue.position.z    = Math.sin(T * 0.28 + 4.4) * 9;

  renderer.render(scene, camera);
}

/* ============================================================
   Resize
============================================================ */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

animate();

})();
</script>
</body>
