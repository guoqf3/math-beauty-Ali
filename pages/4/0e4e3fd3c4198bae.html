<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassini编织 · 卵形线正交网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Cassini编织 · 卵形线正交网</h2>
        <div class="sub">Cassini ovals · |z²−c²|=k² · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">c固定(0.8), k∈[0.3,2.0]</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">k固定(1.0), c∈[0.2,1.6]</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">c/k=const ∈ {½,1,2,3}</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.65;
        const PROJ_D = 2.2;

        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // Cassini卵形线：r⁴ − 2c²r²cos(2θ) + c⁴ − k⁴ = 0
        function cassiniR2(theta, c2, k4) {
            const cos2t = Math.cos(2 * theta);
            const b = -2 * c2 * cos2t;
            const disc = b * b - 4 * (c2 * c2 - k4);
            if (disc < 0) return [];
            const sqrtD = Math.sqrt(disc);
            const r2a = (-b + sqrtD) / 2;
            const r2b = (-b - sqrtD) / 2;
            const result = [];
            if (r2a > 1e-8) result.push(Math.sqrt(r2a));
            if (r2b > 1e-8) result.push(Math.sqrt(r2b));
            return result;
        }

        function createCassiniCurve(c, k, numPoints, color, opacity) {
            const c2 = c * c;
            const k4 = k * k * k * k;
            const pts = [];
            const dTheta = 2 * Math.PI / numPoints;

            for (let i = 0; i <= numPoints; i++) {
                const theta = i * dTheta;
                const rVals = cassiniR2(theta, c2, k4);
                for (const rVal of rVals) {
                    if (rVal < 0.02 || rVal > 8) continue;
                    const px = rVal * Math.cos(theta);
                    const py = rVal * Math.sin(theta);
                    const sp = stereographic(px, py);
                    if (sp && sp.length() < 9.5) pts.push(sp);
                }
            }
            if (pts.length < 2) return null;
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: true, depthTest: true });
            return new THREE.Line(geom, mat);
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'cassini-weave';
        scene.add(rootGroup);

        const curvePoints = 400;

        // 金色族：固定c=0.8，变化k
        const cFix = 0.8;
        const kGoldVals = [];
        for (let i = 0; i < 26; i++) kGoldVals.push(0.28 + i * 1.8 / 25);
        kGoldVals.forEach(k => {
            const line = createCassiniCurve(cFix, k, curvePoints, COLOR_GOLD, 0.60);
            if (line) rootGroup.add(line);
        });
        // 额外金色（更密集的k）
        const kGoldExtra = [];
        for (let i = 0; i < 16; i++) kGoldExtra.push(0.33 + i * 1.6 / 15);
        kGoldExtra.forEach(k => {
            const line = createCassiniCurve(cFix, k, curvePoints, COLOR_GOLD, 0.38);
            if (line) rootGroup.add(line);
        });

        // 青色族：固定k=1.0，变化c
        const kFix = 1.0;
        const cCyanVals = [];
        for (let i = 0; i < 24; i++) cCyanVals.push(0.2 + i * 1.5 / 23);
        cCyanVals.forEach(c => {
            const line = createCassiniCurve(c, kFix, curvePoints, COLOR_CYAN, 0.60);
            if (line) rootGroup.add(line);
        });
        const cCyanExtra = [];
        for (let i = 0; i < 14; i++) cCyanExtra.push(0.25 + i * 1.35 / 13);
        cCyanExtra.forEach(c => {
            const line = createCassiniCurve(c, kFix, curvePoints, COLOR_CYAN, 0.38);
            if (line) rootGroup.add(line);
        });

        // 品红族：c/k = const
        const ratios = [0.5, 1.0, 2.0, 3.0];
        ratios.forEach(ratio => {
            const baseVals = [];
            for (let i = 0; i < 16; i++) baseVals.push(0.25 + i * 1.6 / 15);
            baseVals.forEach(k => {
                const c = ratio * k;
                if (c < 0.1 || c > 3.0) return;
                const line = createCassiniCurve(c, k, curvePoints, COLOR_MAGENTA, 0.55);
                if (line) rootGroup.add(line);
            });
        });
        // 额外品红（更密的螺旋族）
        const extraRatios = [0.75, 1.5, 2.5];
        extraRatios.forEach(ratio => {
            const baseVals = [];
            for (let i = 0; i < 10; i++) baseVals.push(0.3 + i * 1.2 / 9);
            baseVals.forEach(k => {
                const c = ratio * k;
                if (c < 0.1 || c > 2.8) return;
                const line = createCassiniCurve(c, k, curvePoints, COLOR_MAGENTA, 0.35);
                if (line) rootGroup.add(line);
            });
        });

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        console.log('Cassini编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Cassini卵形线编织动画已稳定运行');
    </script>
</body>
</html>
