<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>受迫振动与共振 · 品质因数Q值</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03040e}
  body{
    font-family:"SF Mono","Consolas","Menlo","Courier New",monospace;
    color:#bfe9ff;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;display:block;z-index:0;touch-action:none}
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(0,0,0,.78) 100%);
  }
  .quote{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    z-index:3;pointer-events:none;
    font-size:17px;letter-spacing:3px;white-space:nowrap;
    color:#eaf6ff;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    text-shadow:0 0 10px rgba(200,180,255,.9),0 0 26px rgba(150,120,255,.6),0 0 52px rgba(255,120,220,.45);
    animation:qglow 5s ease-in-out infinite;
  }
  @keyframes qglow{
    0%,100%{opacity:.86;text-shadow:0 0 10px rgba(200,180,255,.85),0 0 26px rgba(150,120,255,.55),0 0 52px rgba(255,120,220,.4)}
    50%{opacity:1;text-shadow:0 0 16px rgba(240,235,255,1),0 0 38px rgba(180,150,255,.9),0 0 70px rgba(255,150,240,.6)}
  }
  .panel{
    position:fixed;top:50%;transform:translateY(-50%);
    z-index:3;pointer-events:none;
    font-size:12px;line-height:2.0;letter-spacing:.5px;
    color:rgba(150,225,255,.5);
    text-shadow:0 0 9px rgba(0,180,255,.45);
  }
  .panel .line{white-space:nowrap}
  .panel .hl{color:rgba(255,220,255,.95);text-shadow:0 0 12px rgba(230,140,255,.9)}
  .panel .dim{color:rgba(150,170,230,.4);font-size:11px}
  .panel.left{left:22px;text-align:left}
  .panel.right{right:22px;text-align:right}
  .controls{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    z-index:4;display:flex;align-items:center;gap:14px;
    padding:10px 20px;border-radius:44px;
    background:rgba(8,14,32,.68);
    border:1px solid rgba(160,120,255,.25);
    box-shadow:0 0 26px rgba(120,80,255,.22),inset 0 0 22px rgba(100,60,200,.12);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:11px;letter-spacing:.4px;white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:7px;color:rgba(180,215,255,.85)}
  .tval{color:#f0d8ff;text-shadow:0 0 10px rgba(220,140,255,.9);min-width:50px;display:inline-block;text-align:right}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:104px;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,rgba(80,200,255,.9),rgba(220,120,255,.9));
    box-shadow:0 0 12px rgba(160,120,255,.55);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#d0a0ff 55%,#7a3aff);
    box-shadow:0 0 14px rgba(210,160,255,.95),0 0 26px rgba(160,100,255,.6);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#d0a0ff 55%,#7a3aff);
    box-shadow:0 0 14px rgba(210,160,255,.95);cursor:pointer;
  }
  .toggle{
    cursor:pointer;user-select:none;
    padding:5px 13px;border-radius:20px;
    border:1px solid rgba(160,120,255,.3);
    background:rgba(40,28,82,.32);
    color:rgba(200,180,255,.7);
    transition:all .25s ease;
  }
  .toggle:hover{border-color:rgba(210,170,255,.6);color:#f0e6ff}
  .toggle.on{
    background:rgba(160,110,255,.20);
    border-color:rgba(220,180,255,.85);
    color:#faf4ff;
    box-shadow:0 0 16px rgba(180,130,255,.55),inset 0 0 12px rgba(180,130,255,.22);
  }
  @media (max-width:920px){
    .panel{display:none}
    .quote{font-size:13px;letter-spacing:1.5px;top:12px}
    .controls{gap:8px;padding:8px 12px;font-size:10px;bottom:10px}
    input[type=range]{width:66px}
    .tval{min-width:38px}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="quote">与你的频率共振，微小的推力也能激起生命的巨浪</div>

<div class="panel left">
  <div class="line">m·ẍ + c·ẋ + k·x = F₀·cos(ωt)</div>
  <div class="line">A(ω) = F₀ / [m√((ω₀²−ω²)² + (γω)²)]</div>
  <div class="line">ω_res = √(ω₀² − γ²/2)</div>
  <div class="line">Q = ω₀/γ = ω₀·m/c</div>
  <div class="line dim" style="margin-top:8px">Δω = γ  ⇔  峰宽 ∝ 1/Q</div>
</div>

<div class="panel right">
  <div class="line">ω₀ = 10.0 rad/s</div>
  <div class="line">γ = <span class="hl" id="vG">0.50</span> /s</div>
  <div class="line hl">Q = <span id="vQ">20.0</span></div>
  <div class="line">ω_res = <span id="vWr">9.99</span> rad/s</div>
  <div class="line">Δω = <span id="vDw">0.50</span> rad/s</div>
  <div class="line hl">A_res = <span id="vAr">5.00</span> cm</div>
  <div class="line" style="margin-top:5px">ω_d = <span id="vWd">3.00</span> rad/s</div>
  <div class="line">A(ω_d) = <span id="vAd">0.28</span> cm</div>
</div>

<div class="controls">
  <label>ω_d
    <input type="range" id="wSlider" min="0" max="20" step="0.01" value="3">
  </label>
  <span class="tval" id="wLabel">3.00</span>
  <label>γ
    <input type="range" id="gSlider" min="0.1" max="2.5" step="0.01" value="0.5">
  </label>
  <span class="tval" id="gLabel">0.50</span>
  <div class="toggle on" id="btnAuto">自动</div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   物理核心
============================================================ */
const W0 = 10;                    // 固有角频率 rad/s
let gamma = 0.5;                  // 阻尼系数 /s

function ampAt(w){
  const d = W0 * W0 - w * w;
  const q = gamma * w;
  return 1 / Math.sqrt(d * d + q * q);
}
function phaseAt(w){
  return Math.atan2(gamma * w, W0 * W0 - w * w);
}
function resFreq(){
  const v = W0 * W0 - gamma * gamma / 2;
  return v > 0 ? Math.sqrt(v) : 0;
}
function qFactor(){
  return W0 / gamma;
}

/* ============================================================
   画布
============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let stars = [];

function buildStars(){
  stars = [];
  const n = Math.round(W * H / 8200);
  for(let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.15 + 0.22,
      ph: Math.random() * Math.PI * 2,
      sp: 0.3 + Math.random() * 1.5,
      hue: 220 + Math.random() * 100
    });
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   状态
============================================================ */
const st = {
  t: 0,
  wd: 3,
  phase: 0,
  auto: true,
  yMax: 0,
  flash: 0
};

/* ============================================================
   DOM
============================================================ */
const wSlider = document.getElementById('wSlider');
const gSlider = document.getElementById('gSlider');
const wLabel  = document.getElementById('wLabel');
const gLabel  = document.getElementById('gLabel');
const btnAuto = document.getElementById('btnAuto');

const elG  = document.getElementById('vG');
const elQ  = document.getElementById('vQ');
const elWr = document.getElementById('vWr');
const elDw = document.getElementById('vDw');
const elAr = document.getElementById('vAr');
const elWd = document.getElementById('vWd');
const elAd = document.getElementById('vAd');

wSlider.addEventListener('input', function(e){
  st.wd = parseFloat(e.target.value);
  st.auto = false;
  btnAuto.classList.remove('on');
});
gSlider.addEventListener('input', function(e){
  gamma = parseFloat(e.target.value);
  st.yMax = 0;
});
btnAuto.addEventListener('click', function(){
  st.auto = !st.auto;
  btnAuto.classList.toggle('on', st.auto);
});

/* ============================================================
   更新
============================================================ */
function update(dt){
  st.t += dt;

  if(st.auto){
    /* 30 秒往返扫频：3 → 17 → 3 rad/s */
    st.wd = 10 + 7 * Math.sin(2 * Math.PI * st.t / 30 - Math.PI / 2);
    wSlider.value = st.wd;
  }

  st.phase += st.wd * dt;
  if(st.phase > 1e7) st.phase -= 1e7;

  /* 共振闪光强度 */
  const wR = resFreq();
  const Ares = ampAt(wR);
  const Anow = ampAt(st.wd);
  const ratio = Ares > 0 ? Anow / Ares : 0;
  const target = Math.max(0, (ratio - 0.34) / 0.66);
  const k = target > st.flash ? 0.30 : 0.07;
  st.flash += (target - st.flash) * k;
  st.flash = Math.max(0, Math.min(1, st.flash));
}

/* ============================================================
   数值面板
============================================================ */
function updateUI(){
  const wR = resFreq();
  const Ares = ampAt(wR) * 25;
  const Anow = ampAt(st.wd) * 25;
  elG.textContent  = gamma.toFixed(2);
  elQ.textContent  = qFactor().toFixed(1);
  elWr.textContent = wR.toFixed(2);
  elDw.textContent = gamma.toFixed(2);
  elAr.textContent = Ares.toFixed(2);
  elWd.textContent = st.wd.toFixed(2);
  elAd.textContent = Anow.toFixed(2);
  wLabel.textContent = st.wd.toFixed(2);
  gLabel.textContent = gamma.toFixed(2);
}

/* ============================================================
   背景
============================================================ */
function drawBackground(){
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#03040e';
  ctx.fillRect(0, 0, W, H);

  const hueShift = 32 * Math.sin(st.t * Math.PI * 2 / 30);
  const g = ctx.createRadialGradient(
    W * 0.5, H * 0.34, 0,
    W * 0.5, H * 0.34, Math.max(W, H) * 0.72
  );
  g.addColorStop(0,   'hsla(' + (252 + hueShift) + ',78%,15%,0.62)');
  g.addColorStop(0.46,'hsla(' + (288 + hueShift) + ',74%,9%,0.26)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(){
  ctx.globalCompositeOperation = 'lighter';
  for(let i = 0; i < stars.length; i++){
    const s = stars[i];
    const tw = 0.5 + 0.5 * Math.sin(st.t * s.sp + s.ph);
    ctx.fillStyle = 'hsla(' + s.hue + ',75%,' + (72 + 20 * tw) + '%,' + (0.08 + 0.50 * tw * tw) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   弹簧
============================================================ */
function drawSpring(x0, y0, x1, y1, coils, amp, color, glowColor){
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy);
  if(len < 1) return;
  const ang = Math.atan2(dy, dx);

  ctx.save();
  ctx.translate(x0, y0);
  ctx.rotate(ang);

  const n = coils * 2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for(let i = 0; i <= n; i++){
    const t = i / n;
    const px = t * len;
    let py = 0;
    if(i > 0 && i < n){
      py = ((i % 2) ? 1 : -1) * amp * Math.sin(t * Math.PI);
    }
    ctx.lineTo(px, py);
  }

  ctx.strokeStyle = color;
  ctx.lineWidth = 2.2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if(glowColor){
    ctx.shadowBlur = 13;
    ctx.shadowColor = glowColor;
  }
  ctx.stroke();
  ctx.restore();
}

/* ============================================================
   弹簧振子
============================================================ */
function drawOscillator(){
  const minDim = Math.min(W, H);
  const pivotX = W * 0.12;
  const pivotY = H * 0.255;
  const restLen = Math.min(W * 0.145, 185);
  const massSize = minDim * 0.052;

  const A = ampAt(st.wd);
  const phi = phaseAt(st.wd);
  const maxDisp = minDim * 0.115;

  const cosPh = Math.cos(st.phase - phi);
  const ampPx = maxDisp * (1 - Math.exp(-A / 0.35));
  const dispPx = ampPx * cosPh;

  const massLeft = pivotX + restLen + dispPx;
  const massCX = massLeft + massSize / 2;
  const massCY = pivotY;

  /* ---- 墙壁 ---- */
  ctx.globalCompositeOperation = 'source-over';
  const wallGrad = ctx.createLinearGradient(pivotX - 16, 0, pivotX, 0);
  wallGrad.addColorStop(0, 'rgba(90,140,255,0.06)');
  wallGrad.addColorStop(1, 'rgba(140,200,255,0.58)');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(pivotX - 15, pivotY - massSize * 1.05, 15, massSize * 2.1);

  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(170,225,255,0.78)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY - massSize * 1.05);
  ctx.lineTo(pivotX, pivotY + massSize * 1.05);
  ctx.stroke();

  /* ---- 弹簧 ---- */
  const stretch = Math.abs(dispPx) / restLen;
  const springHue = 195 + 70 * Math.min(1, stretch * 2.2);
  drawSpring(
    pivotX, pivotY,
    massLeft, pivotY,
    13,
    Math.max(3, massSize * 0.20),
    'hsla(' + springHue + ',100%,72%,0.92)',
    'hsla(' + springHue + ',100%,60%,0.9)'
  );

  /* ---- 平衡位置虚线 ---- */
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.setLineDash([3, 8]);
  ctx.strokeStyle = 'rgba(150,200,255,0.20)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pivotX + restLen + massSize / 2, pivotY - massSize * 0.95);
  ctx.lineTo(pivotX + restLen + massSize / 2, pivotY + massSize * 0.95);
  ctx.stroke();
  ctx.restore();

  /* ---- 质量块 ---- */
  const heat = Math.min(1, A / 0.22);
  const hue = 200 + 110 * heat;

  ctx.globalCompositeOperation = 'lighter';

  const haloR = massSize * (1.9 + 1.7 * heat);
  const hg = ctx.createRadialGradient(massCX, massCY, 0, massCX, massCY, haloR);
  hg.addColorStop(0,   'hsla(' + hue + ',100%,82%,' + (0.42 + 0.38 * heat) + ')');
  hg.addColorStop(0.42,'hsla(' + (hue + 35) + ',100%,62%,' + (0.16 + 0.22 * heat) + ')');
  hg.addColorStop(1,   'hsla(' + (hue + 70) + ',100%,55%,0)');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(massCX, massCY, haloR, 0, Math.PI * 2);
  ctx.fill();

  const mg = ctx.createLinearGradient(
    massLeft, massCY - massSize / 2,
    massLeft + massSize, massCY + massSize / 2
  );
  mg.addColorStop(0,   'hsla(' + hue + ',100%,' + (74 + 22 * heat) + '%,0.95)');
  mg.addColorStop(0.5, 'hsla(' + (hue + 30) + ',100%,' + (58 + 30 * heat) + '%,0.95)');
  mg.addColorStop(1,   'hsla(' + (hue + 60) + ',100%,48%,0.90)');

  ctx.fillStyle = mg;
  ctx.beginPath();
  if(ctx.roundRect){
    ctx.roundRect(massLeft, massCY - massSize / 2, massSize, massSize, massSize * 0.20);
  } else {
    ctx.rect(massLeft, massCY - massSize / 2, massSize, massSize);
  }
  ctx.fill();

  ctx.strokeStyle = 'hsla(' + hue + ',100%,' + (85 + 15 * heat) + '%,0.95)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.35 * heat) + ')';
  ctx.beginPath();
  ctx.arc(massCX - massSize * 0.18, massCY - massSize * 0.18, massSize * 0.13, 0, Math.PI * 2);
  ctx.fill();

  /* ---- 驱动力箭头 ---- */
  const driveSign = Math.cos(st.phase);
  const arrowLen = massSize * (0.55 + 0.55 * Math.abs(driveSign));
  const ay = massCY + massSize * 0.86;
  const dir = driveSign >= 0 ? 1 : -1;

  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,190,120,0.85)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(massCX, ay);
  ctx.lineTo(massCX + dir * arrowLen, ay);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,190,120,0.85)';
  ctx.beginPath();
  ctx.moveTo(massCX + dir * arrowLen, ay);
  ctx.lineTo(massCX + dir * (arrowLen - 7), ay - 4);
  ctx.lineTo(massCX + dir * (arrowLen - 7), ay + 4);
  ctx.closePath();
  ctx.fill();

  ctx.font = '10px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(255,205,150,0.78)';
  ctx.textAlign = 'center';
  ctx.fillText('F₀cos(ωt)', massCX, ay + 16);
  ctx.textAlign = 'left';

  /* ---- 文字读数 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.font = '11px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(200,230,255,0.58)';
  ctx.fillText('受迫振子  m·ẍ + c·ẋ + k·x = F₀cos(ωt)', pivotX - 14, pivotY - massSize * 1.55);

  ctx.fillStyle = 'rgba(255,215,255,0.75)';
  ctx.fillText('A = ' + (A * 25).toFixed(2) + ' cm', pivotX - 14, pivotY - massSize * 1.55 + 18);
}

/* ============================================================
   响应曲线
============================================================ */
const plotBox = { xOfW: null, yOfA: null };

function drawCurve(){
  const xl = W * 0.075;
  const xr = W * 0.925;
  const yt = H * 0.485;
  const yb = H * 0.855;

  if(xr - xl < 120 || yb - yt < 60) return;

  const wMin = 0, wMax = 20;
  const N = 720;

  /* --- 采样 --- */
  const arr = new Float64Array(N + 1);
  let maxA = 0;
  for(let i = 0; i <= N; i++){
    const w = wMin + (wMax - wMin) * i / N;
    const a = ampAt(w);
    arr[i] = a;
    if(a > maxA) maxA = a;
  }

  /* --- 纵轴自适应（平滑） --- */
  const targetYMax = maxA * 1.10;
  if(st.yMax <= 0) st.yMax = targetYMax;
  st.yMax += (targetYMax - st.yMax) * 0.07;
  const yMax = st.yMax;

  const xOfW = function(w){ return xl + (w - wMin) / (wMax - wMin) * (xr - xl); };
  const yOfA = function(a){ return yb - Math.min(a / yMax, 1) * (yb - yt); };
  plotBox.xOfW = xOfW;
  plotBox.yOfA = yOfA;

  /* --- 面板底 --- */
  ctx.globalCompositeOperation = 'source-over';
  const panelG = ctx.createLinearGradient(0, yt, 0, yb);
  panelG.addColorStop(0, 'rgba(18,12,42,0.62)');
  panelG.addColorStop(1, 'rgba(6,10,26,0.62)');
  ctx.fillStyle = panelG;
  ctx.fillRect(xl, yt, xr - xl, yb - yt);

  /* --- 共振危险区 --- */
  const wR = resFreq();
  const bandHalf = Math.max(0.35, gamma * 0.85);
  const dx1 = xOfW(Math.max(0, wR - bandHalf));
  const dx2 = xOfW(Math.min(20, wR + bandHalf));
  const warnA = 0.06 + 0.18 * st.flash;
  const warnG = ctx.createLinearGradient(dx1, 0, dx2, 0);
  warnG.addColorStop(0,   'rgba(255,80,140,0)');
  warnG.addColorStop(0.5, 'rgba(255,90,150,' + warnA + ')');
  warnG.addColorStop(1,   'rgba(255,80,140,0)');
  ctx.fillStyle = warnG;
  ctx.fillRect(dx1, yt, dx2 - dx1, yb - yt);

  /* --- 网格 --- */
  ctx.strokeStyle = 'rgba(110,180,255,0.085)';
  ctx.lineWidth = 1;
  for(let w = 0; w <= 20; w += 2){
    const x = xOfW(w);
    ctx.beginPath();
    ctx.moveTo(x, yt);
    ctx.lineTo(x, yb);
    ctx.stroke();
  }
  for(let k = 1; k <= 4; k++){
    const y = yb - (k / 4) * (yb - yt);
    ctx.beginPath();
    ctx.moveTo(xl, y);
    ctx.lineTo(xr, y);
    ctx.stroke();
  }

  /* --- 坐标轴 --- */
  ctx.strokeStyle = 'rgba(140,200,255,0.32)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(xl, yt);
  ctx.lineTo(xl, yb);
  ctx.lineTo(xr, yb);
  ctx.stroke();

  /* --- 刻度 --- */
  ctx.font = '10px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(155,210,255,0.5)';
  ctx.textAlign = 'center';
  for(let w = 0; w <= 20; w += 4){
    const x = xOfW(w);
    ctx.beginPath();
    ctx.moveTo(x, yb);
    ctx.lineTo(x, yb + 5);
    ctx.strokeStyle = 'rgba(140,200,255,0.32)';
    ctx.stroke();
    ctx.fillText(w + '', x, yb + 17);
  }
  ctx.fillStyle = 'rgba(170,220,255,0.55)';
  ctx.fillText('ω_d  (rad/s)', (xl + xr) / 2, yb + 33);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(155,210,255,0.5)';
  for(let k = 1; k <= 3; k++){
    const a = yMax * k / 4;
    const y = yOfA(a);
    ctx.fillText((a * 25).toFixed(1), xl - 7, y + 3.5);
  }
  ctx.save();
  ctx.translate(20, (yt + yb) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(170,220,255,0.55)';
  ctx.fillText('振幅 A (cm)', 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';

  /* --- 曲线坐标 --- */
  const px = new Float64Array(N + 1);
  const py = new Float64Array(N + 1);
  for(let i = 0; i <= N; i++){
    const w = wMin + (wMax - wMin) * i / N;
    px[i] = xOfW(w);
    py[i] = yOfA(arr[i]);
  }

  ctx.globalCompositeOperation = 'lighter';

  /* --- 填充 --- */
  const fillG = ctx.createLinearGradient(0, yt, 0, yb);
  fillG.addColorStop(0,   'rgba(180,120,255,0.30)');
  fillG.addColorStop(0.4, 'rgba(120,160,255,0.13)');
  fillG.addColorStop(1,   'rgba(70,200,255,0.015)');
  ctx.beginPath();
  ctx.moveTo(px[0], yb);
  for(let i = 0; i <= N; i++) ctx.lineTo(px[i], py[i]);
  ctx.lineTo(px[N], yb);
  ctx.closePath();
  ctx.fillStyle = fillG;
  ctx.fill();

  /* --- 渐变描边 --- */
  const sGrad = ctx.createLinearGradient(xl, 0, xr, 0);
  sGrad.addColorStop(0,    'rgba(80,220,255,0.92)');
  sGrad.addColorStop(0.30, 'rgba(150,150,255,0.95)');
  sGrad.addColorStop(0.50, 'rgba(240,140,255,1)');
  sGrad.addColorStop(0.70, 'rgba(150,150,255,0.95)');
  sGrad.addColorStop(1,    'rgba(80,220,255,0.92)');

  ctx.beginPath();
  ctx.moveTo(px[0], py[0]);
  for(let i = 1; i <= N; i++) ctx.lineTo(px[i], py[i]);

  ctx.save();
  ctx.strokeStyle = sGrad;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.16;
  ctx.lineWidth = 14;
  ctx.stroke();
  ctx.globalAlpha = 0.36;
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = sGrad;
  ctx.lineWidth = 2.3;
  ctx.lineJoin = 'round';
  ctx.shadowBlur = 18;
  ctx.shadowColor = 'rgba(190,150,255,0.85)';
  ctx.stroke();
  ctx.restore();

  /* --- 共振峰顶点 --- */
  const peakX = xOfW(wR);
  const peakY = yOfA(ampAt(wR));
  const pulse = 1 + 0.20 * Math.sin(st.t * 5.5);

  ctx.globalCompositeOperation = 'lighter';
  const pg = ctx.createRadialGradient(peakX, peakY, 0, peakX, peakY, 30 * pulse);
  pg.addColorStop(0,   'rgba(255,255,255,0.92)');
  pg.addColorStop(0.20,'rgba(255,190,255,0.55)');
  pg.addColorStop(0.52,'rgba(200,120,255,0.20)');
  pg.addColorStop(1,   'rgba(140,60,255,0)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.arc(peakX, peakY, 30 * pulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(230,170,255,0.38)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(peakX, peakY);
  ctx.lineTo(peakX, yb);
  ctx.stroke();
  ctx.restore();

  ctx.font = '10px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(240,190,255,0.85)';
  ctx.textAlign = 'center';
  ctx.fillText('ω_res', peakX, yb - 6);

  /* --- 当前 ω_d 标记 --- */
  const mX = xOfW(st.wd);
  const mA = ampAt(st.wd);
  const mY = yOfA(mA);
  const AresNow = ampAt(resFreq()) || 1e-9;
  const heat = Math.min(1, mA / AresNow);
  const flick = 1 + 0.22 * Math.sin(st.t * 9);

  ctx.save();
  ctx.setLineDash([3, 5]);
  ctx.strokeStyle = 'hsla(' + (200 + 90 * heat) + ',100%,72%,' + (0.30 + 0.45 * heat) + ')';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(mX, mY);
  ctx.lineTo(mX, yb);
  ctx.stroke();
  ctx.restore();

  const dotR = 22 * (1 + 0.85 * heat) * flick;
  const dg = ctx.createRadialGradient(mX, mY, 0, mX, mY, dotR);
  dg.addColorStop(0,   'rgba(255,255,255,' + (0.85 + 0.15 * heat) + ')');
  dg.addColorStop(0.22,'hsla(' + (200 + 90 * heat) + ',100%,75%,' + (0.55 * (0.5 + 0.5 * heat)) + ')');
  dg.addColorStop(0.58,'hsla(' + (250 + 60 * heat) + ',100%,65%,' + (0.18 + 0.22 * heat) + ')');
  dg.addColorStop(1,   'hsla(' + (280 + 40 * heat) + ',100%,60%,0)');
  ctx.fillStyle = dg;
  ctx.beginPath();
  ctx.arc(mX, mY, dotR, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(mX, mY, 3.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
  ctx.font = '10px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(220,245,255,0.88)';
  const labelY = Math.max(yt + 12, mY - 16);
  ctx.fillText((mA * 25).toFixed(2) + ' cm', mX, labelY);

  /* --- 标题 --- */
  ctx.textAlign = 'left';
  ctx.font = '11px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(190,225,255,0.58)';
  ctx.fillText('幅频响应  A(ω) = F₀ / [m√((ω₀²−ω²)² + (γω)²)]', xl + 8, yt - 12);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(245,200,255,0.82)';
  ctx.fillText('Q = ' + qFactor().toFixed(1) + '   Δω = ' + gamma.toFixed(2) + ' rad/s', xr - 8, yt - 12);
  ctx.textAlign = 'left';
}

/* ============================================================
   共振闪光叠加
============================================================ */
function drawFlashOverlay(){
  if(st.flash < 0.02) return;
  const f = st.flash;

  ctx.globalCompositeOperation = 'lighter';

  const g = ctx.createRadialGradient(
    W * 0.5, H * 0.5, 0,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.62
  );
  g.addColorStop(0,   'rgba(255,220,255,' + (0.055 * f) + ')');
  g.addColorStop(0.45,'rgba(220,160,255,' + (0.032 * f) + ')');
  g.addColorStop(1,   'rgba(180,100,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if(plotBox.xOfW && plotBox.yOfA){
    const mX = plotBox.xOfW(st.wd);
    const mY = plotBox.yOfA(ampAt(st.wd));
    const rr = 40 + 130 * f;

    ctx.strokeStyle = 'rgba(255,220,255,' + (0.42 * f) + ')';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(mX, mY, rr, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(200,160,255,' + (0.26 * f) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(mX, mY, rr * 1.55, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   主循环
============================================================ */
let prev = performance.now();
let uiTick = 0;

function render(){
  drawBackground();
  drawStars();
  drawCurve();
  drawOscillator();
  drawFlashOverlay();
}

function frame(now){
  let dt = (now - prev) / 1000;
  prev = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);
  render();

  uiTick++;
  if(uiTick % 5 === 0) updateUI();

  requestAnimationFrame(frame);
}

updateUI();
requestAnimationFrame(frame);

})();
</script>
