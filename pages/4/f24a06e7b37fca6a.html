<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>爱因斯坦质能方程 · E=mc²</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#010206;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  /* 左上标题 */
  #title{
    position:absolute;top:0;left:0;
    padding:26px 34px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(255,190,120,.38);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#ffb060 0%,#ffd080 34%,#5ee0ff 72%,#7ab8ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(255,170,110,.48));
  }
  #title .sub{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10.5px;letter-spacing:.18em;
    color:rgba(240,210,180,.52);font-weight:300;
  }

  /* 右上：物理常量 */
  #consts{
    position:absolute;top:0;right:0;
    padding:26px 34px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.10em;line-height:2.0;
    color:rgba(200,185,240,.42);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #consts .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(255,180,130,.28);margin-bottom:6px;
  }
  #consts .k{color:rgba(220,200,255,.52);}
  #consts .v{color:rgba(255,215,150,.92);font-weight:600;}
  #consts .v2{color:rgba(140,225,255,.94);font-weight:600;}

  /* 左下：实时状态 */
  #stats{
    position:absolute;bottom:0;left:0;
    padding:0 34px 26px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:10px;letter-spacing:.10em;line-height:2.0;
    color:rgba(200,190,240,.40);
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(255,180,130,.28);margin-bottom:6px;
  }
  #stats .k{color:rgba(220,205,255,.52);}
  #stats .vM{color:rgba(255,200,130,.96);font-weight:600;}
  #stats .vC{color:rgba(120,225,255,.96);font-weight:600;}
  #stats .vE{color:rgba(255,160,200,.96);font-weight:600;}

  /* 右下：阶段指示 */
  #phases{
    position:absolute;bottom:0;right:0;
    padding:0 34px 26px;
    display:flex;flex-direction:column;gap:6px;
    align-items:flex-end;
    opacity:0;animation:fade 1.6s 1.5s ease forwards;
  }
  .ph-row{
    display:flex;align-items:center;gap:9px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:9.5px;letter-spacing:.10em;
    color:rgba(200,190,240,.30);
    transition:all .5s cubic-bezier(.4,0,.2,1);
  }
  .ph-row .dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(140,140,200,.18);
    transition:all .5s;
  }
  .ph-row .nm{
    min-width:64px;
    text-align:left;
  }
  .ph-row.on{
    color:rgba(255,225,180,.98);
  }
  .ph-row.on .dot{
    background:rgba(255,200,110,.96);
    box-shadow:0 0 12px rgba(255,180,90,.88);
  }
  .ph-row.on .nm{
    text-shadow:0 0 10px rgba(255,190,100,.55);
  }

  /* 音频指示 */
  #audioDot{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:14px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(220,190,160,.32);
    opacity:0;animation:fade 1.6s 1.7s ease forwards;
    display:flex;align-items:center;gap:7px;
    white-space:nowrap;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(220,160,120,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(255,200,140,.92);
    box-shadow:0 0 9px rgba(255,180,100,.88);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:14px 16px;}
    #title .sub{font-size:9px;}
    #consts{padding:14px 16px;font-size:8.5px;}
    #stats{padding:0 16px 16px;font-size:8.5px;}
    #phases{padding:0 16px 16px;gap:4px;}
    .ph-row{font-size:8px;}
    .ph-row .nm{min-width:48px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">EINSTEIN · MASS-ENERGY EQUIVALENCE</div>
    <h1>质能方程</h1>
    <div class="sub">E = mc² &nbsp;·&nbsp; 质量转化为能量</div>
  </div>

  <div id="consts">
    <span class="lab">PHYSICAL CONSTANTS</span>
    <div><span class="k">光速 c </span><span class="v2">299,792,458 m/s</span></div>
    <div><span class="k">c² </span><span class="v2">8.987 × 10¹⁶ m²/s²</span></div>
    <div><span class="k">1 g 质量 </span><span class="v">≈ 9×10¹³ J</span></div>
  </div>

  <div id="stats">
    <span class="lab">LIVE STATE</span>
    <div><span class="k">质量 m </span><span class="vM" id="vM">1.00</span></div>
    <div><span class="k">光速状态 c </span><span class="vC" id="vC">静止</span></div>
    <div><span class="k">能量 E </span><span class="vE" id="vE">0.0</span></div>
  </div>

  <div id="phases">
    <div class="ph-row" data-i="0">
      <span class="dot"></span><span class="nm">质 量</span><span>m</span>
    </div>
    <div class="ph-row" data-i="1">
      <span class="dot"></span><span class="nm">光 速</span><span>c</span>
    </div>
    <div class="ph-row" data-i="2">
      <span class="dot"></span><span class="nm">转 化</span><span>mc²</span>
    </div>
    <div class="ph-row" data-i="3">
      <span class="dot"></span><span class="nm">能 量</span><span>E</span>
    </div>
  </div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>能量释放 · 光束</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0;

/* 世界单位半径（像素） */
const CORE_R = 62;

/* =========================================================
   时间线
   ========================================================= */
const PHASE_NAMES = ['MASS', 'LIGHT', 'TRANSFORM', 'ENERGY'];

const TIMELINE = [
  { name: 'MASS',      start: 0.0,  dur: 2.2 },
  { name: 'LIGHT',     start: 2.2,  dur: 2.8 },
  { name: 'TRANSFORM', start: 5.0,  dur: 2.6 },
  { name: 'ENERGY',    start: 7.6,  dur: 4.4 }
];

const CYCLE = 12.0;

let cycleT = 0;
let lastT = 0;

function getPhase(t){
  for (let i = TIMELINE.length - 1; i >= 0; i--){
    if (t >= TIMELINE[i].start){
      const ph = TIMELINE[i];
      return {
        idx: i,
        name: ph.name,
        p: Math.min(1, (t - ph.start) / ph.dur),
        raw: t - ph.start
      };
    }
  }
  return { idx: 0, name: 'MASS', p: 0, raw: 0 };
}

/* =========================================================
   缓动
   ========================================================= */
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
function easeInCubic(x){ return x * x * x; }
function easeOutQuart(x){ return 1 - Math.pow(1 - x, 4); }
function easeInOutCubic(x){
  return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
}

/* =========================================================
   画布
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.5;

  buildStars();
  buildGlowSprite();
}
window.addEventListener('resize', resize);

/* =========================================================
   星空
   ========================================================= */
const stars = [];
function buildStars(){
  stars.length = 0;
  const n = Math.min(220, Math.round(W * H / 8500));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.05 + 0.14,
      ph: Math.random() * TAU,
      sp: 0.18 + Math.random() * 0.72,
      hue: 200 + Math.random() * 80,
      base: 0.05 + Math.random() * 0.24
    });
  }
}

/* =========================================================
   预渲染光晕精灵
   ========================================================= */
const spriteWarm = document.createElement('canvas');
const spriteCool = document.createElement('canvas');
const spriteWhite = document.createElement('canvas');

function makeSprite(target, hue, sat){
  const SZ = 128;
  target.width = SZ;
  target.height = SZ;
  const c = target.getContext('2d');
  const g = c.createRadialGradient(SZ/2, SZ/2, 0, SZ/2, SZ/2, SZ/2);
  g.addColorStop(0.00, 'hsla(' + hue + ',' + sat + '%, 96%, 1)');
  g.addColorStop(0.16, 'hsla(' + hue + ',' + sat + '%, 84%, 0.72)');
  g.addColorStop(0.42, 'hsla(' + hue + ',' + sat + '%, 68%, 0.24)');
  g.addColorStop(0.72, 'hsla(' + hue + ',' + sat + '%, 60%, 0.06)');
  g.addColorStop(1.00, 'hsla(' + hue + ',' + sat + '%, 56%, 0)');
  c.fillStyle = g;
  c.fillRect(0, 0, SZ, SZ);
}

function buildGlowSprite(){
  makeSprite(spriteWarm, 34, 100);
  makeSprite(spriteCool, 195, 100);
  makeSprite(spriteWhite, 48, 40);
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let audioReady = false;
let droneGain = null;
let lastBeepT = 0;
let lastPhaseIdx = -1;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.42, ac.currentTime, 1.8);

  /* 背景低频轰鸣 */
  const o1 = ac.createOscillator();
  o1.type = 'sine';
  o1.frequency.value = 48;

  const o2 = ac.createOscillator();
  o2.type = 'sine';
  o2.frequency.value = 48.7;

  droneGain = ac.createGain();
  droneGain.gain.value = 0.018;

  o1.connect(droneGain);
  o2.connect(droneGain);
  droneGain.connect(master);
  o1.start();
  o2.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* 光束音：短促高频上行 */
function playBeam(pitch){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  if (now - lastBeepT < 0.06) return;
  lastBeepT = now;

  const f = 880 + Math.random() * 620 + (pitch || 0) * 180;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 1.6, now + 0.07);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.014, now + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.10);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.12);
}

/* 能量释放音：大幅下行 + 噪声爆发 */
function playBurst(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  /* 低频下扫 */
  const osc = ac.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(340, now);
  osc.frequency.exponentialRampToValueAtTime(42, now + 1.6);

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1800, now);
  lp.frequency.exponentialRampToValueAtTime(180, now + 1.6);
  lp.Q.value = 3.5;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.10, now + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 1.8);

  osc.connect(lp);
  lp.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 1.9);

  /* 噪声冲击 */
  const nl = Math.max(1, Math.ceil(ac.sampleRate * 1.2));
  const buf = ac.createBuffer(1, nl, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < nl; i++){
    const t = i / nl;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 1.6);
  }
  const src = ac.createBufferSource();
  src.buffer = buf;

  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 200;

  const ng = ac.createGain();
  ng.gain.value = 0.075;

  src.connect(hp);
  hp.connect(ng);
  ng.connect(master);
  src.start(now);
}

/* 公式显现音：上升和弦 */
function playChord(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.08;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.038, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.8);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 2.0);

    /* 高八度泛音 */
    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = notes[i] * 2;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.04);
    g2.gain.linearRampToValueAtTime(0.012, t0 + 0.06);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
    osc2.connect(g2);
    g2.connect(master);
    osc2.start(t0 + 0.04);
    osc2.stop(t0 + 1.5);
  }
}

/* =========================================================
   光脉冲
   ========================================================= */
const pulses = [];
let pulseTimer = 0;

function spawnPulse(){
  pulses.push({
    r: 0,
    life: 1,
    /* 速度代表光速 c */
    v: CORE_R * 4.2,
    hue: 195,
    thickness: 2.0,
    bright: 0.8
  });
}

/* =========================================================
   能量粒子
   ========================================================= */
const energyParticles = [];

function spawnEnergyBurst(count, speedMin, speedMax){
  for (let i = 0; i < count; i++){
    const a = Math.random() * TAU;
    const sp = speedMin + Math.random() * (speedMax - speedMin);

    energyParticles.push({
      x: 0, y: 0,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 0.5 + Math.random() * 0.8,
      size: 1.2 + Math.random() * 2.6,
      hue: 40 + Math.random() * 40,
      /* 内部燃烧因子 */
      burn: 0.5 + Math.random() * 0.5
    });
  }
}

/* =========================================================
   光束粒子（沿光束方向飞出的光子）
   ========================================================= */
const photons = [];

function spawnPhoton(){
  const a = Math.random() * TAU;
  photons.push({
    angle: a,
    r: CORE_R * 0.4,
    v: CORE_R * 6.5 + Math.random() * CORE_R * 2.5,
    life: 1,
    size: 1.2 + Math.random() * 1.6,
    hue: 195
  });
}

/* =========================================================
   更新
   ========================================================= */
function update(dt){
  if (dt > 0.05) dt = 0.05;

  cycleT += dt;
  if (cycleT >= CYCLE){
    cycleT -= CYCLE;
    lastPhaseIdx = -1;
    energyParticles.length = 0;
    photons.length = 0;
    pulses.length = 0;
  }

  const phase = getPhase(cycleT);

  /* 阶段切换音效 */
  if (phase.idx !== lastPhaseIdx){
    lastPhaseIdx = phase.idx;

    if (phase.idx === 1){
      /* 光速阶段开始：触发柔和和弦 */
      playChord();
    } else if (phase.idx === 2){
      /* 转化阶段：能量爆发 */
      playBurst();
    } else if (phase.idx === 3){
      /* 能量阶段：触发终场和弦 */
      playChord();
    }
  }

  /* 光脉冲生成 */
  if (phase.idx === 1 || phase.idx === 2){
    pulseTimer += dt;
    const interval = phase.idx === 1 ? 0.32 : 0.18;
    while (pulseTimer > interval){
      pulseTimer -= interval;
      spawnPulse();
      playBeam(Math.random());
    }
  } else if (phase.idx === 0){
    pulseTimer = 0;
  }

  /* 光脉冲推进 */
  for (let i = pulses.length - 1; i >= 0; i--){
    const p = pulses[i];
    p.r += p.v * dt;
    /* 距离越远越淡 */
    p.life -= dt * 0.55;
    if (p.life <= 0) pulses.splice(i, 1);
  }

  /* 光子推进（沿光束方向） */
  if (phase.idx >= 1 && phase.idx <= 2){
    if (Math.random() < 0.65){
      spawnPhoton();
    }
  }

  for (let i = photons.length - 1; i >= 0; i--){
    const ph = photons[i];
    ph.r += ph.v * dt;
    ph.life -= dt * 0.6;
    if (ph.life <= 0) photons.splice(i, 1);
  }

  /* 能量粒子（在转化阶段爆发） */
  if (phase.idx === 2 && phase.raw < 0.05){
    spawnEnergyBurst(180, CORE_R * 3, CORE_R * 10);
  }

  for (let i = energyParticles.length - 1; i >= 0; i--){
    const p = energyParticles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.978;
    p.vy *= 0.978;
    p.life -= dt * p.decay * 0.55;
    if (p.life <= 0) energyParticles.splice(i, 1);
  }

  /* 音频动态调整 */
  if (audioReady && ac && ac.state === 'running' && droneGain){
    const now = ac.currentTime;
    /* 能量阶段降低背景轰鸣音量 */
    if (phase.idx === 2){
      droneGain.gain.setTargetAtTime(0.042, now, 0.3);
    } else if (phase.idx === 3){
      droneGain.gain.setTargetAtTime(0.022, now, 1.2);
    } else {
      droneGain.gain.setTargetAtTime(0.016, now, 1.2);
    }
  }
}

/* =========================================================
   绘制：背景
   ========================================================= */
function drawBackground(t){
  const bg = ctx.createRadialGradient(
    CX, CY, 0, CX, CY, Math.max(W, H) * 0.88
  );
  bg.addColorStop(0.00, '#0a0814');
  bg.addColorStop(0.42, '#05040c');
  bg.addColorStop(1.00, '#010105');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星空 */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.base * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (a < 0.012) continue;
    ctx.fillStyle = 'hsla(' + s.hue + ', 80%, 88%, ' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：质量球
   ========================================================= */
function drawMassCore(t, phase){
  if (phase.idx > 2) return;

  /* 半径：在 MASS 阶段从 0 增长到 CORE_R，在 TRANSFORM 阶段缩回 0 */
  let r;
  let brightness;

  if (phase.idx === 0){
    /* 质量出现 */
    const p = easeOutCubic(phase.p);
    r = CORE_R * p;
    brightness = 0.6 + 0.4 * p;

    /* 脉搏 */
    r *= 1 + 0.06 * Math.sin(t * 4.8);
  } else if (phase.idx === 1){
    /* 光速阶段 */
    r = CORE_R * (1 + 0.04 * Math.sin(t * 3.6));
    brightness = 1.0;
  } else {
    /* 转化阶段：快速缩小 */
    const p = easeInCubic(phase.p);
    r = CORE_R * (1 - p);
    brightness = 1.0 - p * 0.4;
  }

  if (r < 0.5) return;

  /* 外光晕 */
  ctx.globalCompositeOperation = 'lighter';

  const glowR = r * 4.2;
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, glowR);
  g.addColorStop(0.00, 'hsla(34, 100%, 92%, ' + (0.72 * brightness) + ')');
  g.addColorStop(0.20, 'hsla(28, 100%, 76%, ' + (0.42 * brightness) + ')');
  g.addColorStop(0.52, 'hsla(22, 100%, 62%, ' + (0.14 * brightness) + ')');
  g.addColorStop(1.00, 'hsla(18, 100%, 52%, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(CX, CY, glowR, 0, TAU);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';

  /* 球体本体 */
  const bodyG = ctx.createRadialGradient(
    CX - r * 0.35, CY - r * 0.35, 0,
    CX, CY, r
  );
  bodyG.addColorStop(0.00, 'hsla(48, 100%, 98%, ' + brightness + ')');
  bodyG.addColorStop(0.32, 'hsla(38, 100%, 86%, ' + brightness + ')');
  bodyG.addColorStop(0.72, 'hsla(28, 100%, 64%, ' + brightness + ')');
  bodyG.addColorStop(1.00, 'hsla(18, 95%, 44%, ' + brightness + ')');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.arc(CX, CY, r, 0, TAU);
  ctx.fill();

  /* 边缘光晕 */
  ctx.strokeStyle = 'hsla(42, 100%, 88%, ' + (0.62 * brightness) + ')';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 内部高光 */
  ctx.beginPath();
  ctx.arc(CX - r * 0.32, CY - r * 0.34, r * 0.22, 0, TAU);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
  ctx.fill();

  /* 标签 m */
  if (phase.idx === 0 && phase.p > 0.6){
    const a = (phase.p - 0.6) / 0.4;

    ctx.font = '200 ' + (r * 0.88).toFixed(0) + 'px "Helvetica Neue", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.strokeStyle = 'rgba(60, 20, 0, ' + (0.72 * a) + ')';
    ctx.lineWidth = Math.max(2, r * 0.08);
    ctx.lineJoin = 'round';
    ctx.strokeText('m', CX, CY);

    ctx.fillStyle = 'rgba(255, 245, 220, ' + a + ')';
    ctx.fillText('m', CX, CY);
  }
}

/* =========================================================
   绘制：光脉冲环
   ========================================================= */
function drawPulses(){
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < pulses.length; i++){
    const p = pulses[i];
    const a = p.life * p.life * 0.55;

    if (a < 0.01) continue;

    /* 外光晕 */
    ctx.beginPath();
    ctx.arc(CX, CY, p.r, 0, TAU);
    ctx.strokeStyle = 'hsla(' + p.hue + ', 100%, 82%, ' + (a * 0.22) + ')';
    ctx.lineWidth = 14;
    ctx.stroke();

    /* 中光晕 */
    ctx.beginPath();
    ctx.arc(CX, CY, p.r, 0, TAU);
    ctx.strokeStyle = 'hsla(' + p.hue + ', 100%, 78%, ' + (a * 0.55) + ')';
    ctx.lineWidth = 4;
    ctx.stroke();

    /* 核心亮线 */
    ctx.beginPath();
    ctx.arc(CX, CY, p.r, 0, TAU);
    ctx.strokeStyle = 'hsla(' + p.hue + ', 100%, 92%, ' + a + ')';
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：光子
   ========================================================= */
function drawPhotons(){
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < photons.length; i++){
    const p = photons[i];
    const a = p.life * p.life * 0.92;
    if (a < 0.02) continue;

    const x = CX + Math.cos(p.angle) * p.r;
    const y = CY + Math.sin(p.angle) * p.r;

    /* 拖尾 */
    const tailLen = p.r - 12;
    const tx = CX + Math.cos(p.angle) * tailLen;
    const ty = CY + Math.sin(p.angle) * tailLen;

    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(x, y);
    ctx.strokeStyle = 'hsla(' + p.hue + ', 100%, 84%, ' + (a * 0.72) + ')';
    ctx.lineWidth = p.size * 0.9;
    ctx.lineCap = 'round';
    ctx.stroke();

    /* 光点 */
    const sz = p.size * 5;
    ctx.drawImage(spriteCool, x - sz * 0.5, y - sz * 0.5, sz, sz);
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：能量粒子
   ========================================================= */
function drawEnergyParticles(){
  if (energyParticles.length === 0) return;

  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < energyParticles.length; i++){
    const p = energyParticles[i];
    const a = p.life * p.life * 0.95;
    if (a < 0.02) continue;

    const x = CX + p.x;
    const y = CY + p.y;

    /* 燃烧色：从亮白到橙红 */
    const hue = p.hue + (1 - p.life) * 12;
    const light = 88 - (1 - p.life) * 30;

    /* 光晕 */
    const sz = p.size * 6;
    ctx.globalAlpha = a;
    ctx.drawImage(spriteWarm, x - sz * 0.5, y - sz * 0.5, sz, sz);
    ctx.globalAlpha = 1;

    /* 核心亮线 */
    ctx.beginPath();
    ctx.arc(x, y, p.size * 0.8, 0, TAU);
    ctx.fillStyle = 'hsla(' + hue + ', 100%, ' + light + '%, ' + a + ')';
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：能量爆发环
   ========================================================= */
function drawBurstRing(phase, t){
  if (phase.idx !== 2) return;

  const p = easeOutQuart(phase.p);
  if (p < 0.01) return;

  const R = CORE_R * 14 * p;
  const a = (1 - p) * 0.85;

  /* 外圈 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, TAU);
  ctx.strokeStyle = 'hsla(38, 100%, 82%, ' + (a * 0.18) + ')';
  ctx.lineWidth = 32 * (1 - p) + 2;
  ctx.stroke();

  /* 中圈 */
  ctx.beginPath();
  ctx.arc(CX, CY, R * 0.86, 0, TAU);
  ctx.strokeStyle = 'hsla(30, 100%, 78%, ' + (a * 0.42) + ')';
  ctx.lineWidth = 10 * (1 - p) + 1;
  ctx.stroke();

  /* 内圈 */
  ctx.beginPath();
  ctx.arc(CX, CY, R * 0.74, 0, TAU);
  ctx.strokeStyle = 'hsla(195, 100%, 88%, ' + (a * 0.62) + ')';
  ctx.lineWidth = 4 * (1 - p) + 0.6;
  ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：全局光晕（能量爆发瞬间）
   ========================================================= */
function drawGlobalFlash(phase){
  if (phase.idx !== 2) return;

  const p = phase.p;
  /* 脉冲：在开始后 0.15 达到峰值 */
  let intensity;
  if (p < 0.15){
    intensity = p / 0.15;
  } else {
    intensity = Math.max(0, 1 - (p - 0.15) / 0.6);
  }

  if (intensity < 0.01) return;

  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255, 200, 130, ' + (intensity * 0.18) + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   绘制：公式 E = mc²
   ========================================================= */
function drawFormula(phase, t){
  /* 公式在 ENERGY 阶段逐步显现 */
  let alpha = 0;
  if (phase.idx === 3){
    const p = phase.p;
    if (p < 0.25){
      alpha = easeOutCubic(p / 0.25);
    } else {
      alpha = 1;
    }
  } else if (phase.idx === 2 && phase.p > 0.8){
    /* 转化结束时出现预兆 */
    alpha = (phase.p - 0.8) / 0.2 * 0.3;
  }

  if (alpha < 0.01) return;

  /* 防止与质量球重叠：能量阶段质量已消失 */
  const baseSize = Math.min(W * 0.09, H * 0.14);
  const size = baseSize * (0.92 + 0.08 * Math.sin(t * 1.4));

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /* 每一部分的颜色 */
  const parts = [
    { txt: 'E',      hue: 195 },
    { txt: ' = ',     hue: 200 },
    { txt: 'm',      hue: 34  },
    { txt: 'c',      hue: 195 },
    { txt: '²',      hue: 195 }
  ];

  ctx.font = '200 ' + size.toFixed(0) + 'px "Helvetica Neue", Arial, sans-serif';

  /* 计算总宽度 */
  let totalW = 0;
  const widths = [];
  for (let i = 0; i < parts.length; i++){
    const w = ctx.measureText(parts[i].txt).width;
    widths.push(w);
    totalW += w;
  }

  let x = CX - totalW * 0.5;
  const y = CY;

  /* 光晕 */
  ctx.globalCompositeOperation = 'lighter';

  ctx.save();
  ctx.shadowColor = 'rgba(255, 200, 130, ' + (alpha * 0.72) + ')';
  ctx.shadowBlur = size * 0.6;

  for (let i = 0; i < parts.length; i++){
    ctx.fillStyle = 'hsla(' + parts[i].hue + ', 92%, 80%, ' + (alpha * 0.62) + ')';
    ctx.fillText(parts[i].txt, x + widths[i] * 0.5, y);
    x += widths[i];
  }
  ctx.restore();

  /* 主体 */
  x = CX - totalW * 0.5;
  for (let i = 0; i < parts.length; i++){
    const hue = parts[i].hue;
    const grad = ctx.createLinearGradient(
      x, y - size * 0.6,
      x + widths[i], y + size * 0.6
    );

    if (hue === 34){
      grad.addColorStop(0, 'hsla(48, 100%, 92%, ' + alpha + ')');
      grad.addColorStop(1, 'hsla(28, 100%, 76%, ' + alpha + ')');
    } else {
      grad.addColorStop(0, 'hsla(195, 100%, 90%, ' + alpha + ')');
      grad.addColorStop(1, 'hsla(210, 100%, 72%, ' + alpha + ')');
    }

    ctx.fillStyle = grad;
    ctx.fillText(parts[i].txt, x + widths[i] * 0.5, y);
    x += widths[i];
  }

  ctx.globalCompositeOperation = 'source-over';

  /* 公式下方小注 */
  if (phase.idx === 3 && phase.p > 0.6){
    const a = (phase.p - 0.6) / 0.4;

    ctx.font = '400 ' + (baseSize * 0.18).toFixed(0) + 'px "SF Mono", Consolas, Monaco, monospace';
    ctx.fillStyle = 'hsla(210, 100%, 82%, ' + (a * 0.72) + ')';
    ctx.fillText('质量与能量等价', CX, CY + baseSize * 0.72);
  }
}

/* =========================================================
   绘制：阶段标签
   ========================================================= */
function drawPhaseLabel(phase, t){
  /* 在各阶段中心稍下方显示阶段说明 */
  const labels = {
    MASS:      '质量 m',
    LIGHT:     '光速 c 扩散',
    TRANSFORM: '转化：mc²',
    ENERGY:    ''
  };

  const txt = labels[phase.name];
  if (!txt) return;

  /* 只在阶段开始的前 30% 显示 */
  if (phase.p > 0.35) return;

  const a = phase.p < 0.1
    ? phase.p / 0.1
    : 1 - (phase.p - 0.1) / 0.25;

  if (a < 0.02) return;

  const size = Math.min(W * 0.028, 22);

  ctx.font = '500 ' + size.toFixed(0) + 'px "SF Mono", Consolas, Monaco, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'hsla(42, 100%, 88%, ' + (a * 0.72) + ')';
  ctx.fillText(txt, CX, CY - CORE_R * 4.5);

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   更新 HUD
   ========================================================= */
let uiTick = 0;

function updateHUD(t, phase){
  uiTick++;
  if (uiTick % 5 !== 0) return;

  const vM = document.getElementById('vM');
  const vC = document.getElementById('vC');
  const vE = document.getElementById('vE');

  /* 质量 */
  let mass = 1.0;
  if (phase.idx === 0){
    mass = easeOutCubic(phase.p);
  } else if (phase.idx === 2){
    mass = 1 - easeInCubic(phase.p);
  } else if (phase.idx === 3){
    mass = 0;
  }
  if (vM) vM.textContent = mass.toFixed(3);

  /* 光速状态 */
  if (vC){
    if (phase.idx === 0){
      vC.textContent = '静止';
    } else if (phase.idx === 1){
      vC.textContent = 'c · 扩散中';
    } else if (phase.idx === 2){
      vC.textContent = 'c² · 释放中';
    } else {
      vC.textContent = '已释放';
    }
  }

  /* 能量：显示当前累积能量（视觉数值） */
  let energy = 0;
  if (phase.idx === 0 || phase.idx === 1){
    energy = 0;
  } else if (phase.idx === 2){
    energy = easeOutQuart(phase.p);
  } else {
    energy = 1;
  }

  /* 映射为科学计数值：1 g → 9 × 10¹³ J */
  if (vE){
    const val = energy * 9.0;
    if (val < 0.01){
      vE.textContent = '0';
    } else {
      vE.textContent = val.toFixed(2) + ' ×10¹³ J';
    }
  }
}

/* =========================================================
   主循环
   ========================================================= */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  const t = now * 0.001;

  /* 更新 */
  update(dt);

  const phase = getPhase(cycleT);

  /* 渲染 */
  drawBackground(t);

  /* 光脉冲（在最底层） */
  drawPulses();

  /* 能量爆发环 */
  drawBurstRing(phase, t);

  /* 光子（沿光束方向） */
  drawPhotons();

  /* 质量球 */
  drawMassCore(t, phase);

  /* 能量粒子 */
  drawEnergyParticles();

  /* 全局闪光 */
  drawGlobalFlash(phase);

  /* 公式 */
  drawFormula(phase, t);

  /* 阶段标签 */
  drawPhaseLabel(phase, t);

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    CX, CY, Math.min(W, H) * 0.32,
    CX, CY, Math.max(W, H) * 0.88
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 2, 8, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 0, 4, 0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* HUD */
  updateHUD(t, phase);

  /* 阶段指示点 */
  const phRows = document.querySelectorAll('.ph-row');
  for (let i = 0; i < phRows.length; i++){
    phRows[i].classList.toggle('on', i === phase.idx);
  }
}

/* =========================================================
   交互
   ========================================================= */
window.addEventListener('pointerdown', function(){
  initAudio();
});

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    cycleT = 0;
    lastPhaseIdx = -1;
    energyParticles.length = 0;
    photons.length = 0;
    pulses.length = 0;
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    cycleT = 0;
    lastPhaseIdx = -1;
    energyParticles.length = 0;
    photons.length = 0;
    pulses.length = 0;
  } else if (e.key >= '1' && e.key <= '4'){
    initAudio();
    const idx = parseInt(e.key, 10) - 1;
    if (idx >= 0 && idx < TIMELINE.length){
      cycleT = TIMELINE[idx].start + 0.01;
      lastPhaseIdx = -1;
    }
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
buildGlowSprite();
requestAnimationFrame(loop);

})();
</script>
