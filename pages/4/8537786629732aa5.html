<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>电化学电解 · 法拉第定律与能斯特方程</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000308;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}

#c{display:block;position:fixed;inset:0;}

/* ── 顶部启迪语 ── */
  #topLine{
    position:fixed;top:15px;left:50%;transform:translateX(-50%);
    z-index:9;pointer-events:none;white-space:nowrap;
    font-size:clamp(12px,1.62vw,21px);
    font-weight:600;letter-spacing:2.5px;
    color:#c4f7ff;
    text-shadow:0 0 10px #22d3ff,0 0 32px rgba(34,211,255,.62),0 0 64px rgba(0,255,200,.32);
    animation:tp 4.2s ease-in-out infinite;
  }
  @keyframes tp{
    0%,100%{opacity:.80;filter:brightness(1)}
    50%{opacity:1;filter:brightness(1.38)}
  }

/* ── 边缘公式 ── */
  .hud{position:fixed;z-index:8;pointer-events:none;}
  .hud .eq{
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    font-size:clamp(12px,1.62vw,24px);font-weight:600;letter-spacing:.4px;
    white-space:nowrap;
  }
  .hud .sub{font-size:clamp(8px,.82vw,12px);opacity:.62;margin-top:4px;letter-spacing:2.2px;}

.tl{top:52px;left:22px;}
  .tr{top:52px;right:22px;text-align:right;}
  .bl{bottom:212px;left:22px;}
  .br{bottom:212px;right:22px;text-align:right;}

.cyan .eq{color:#9fe9ff;text-shadow:0 0 9px #26a9ff,0 0 30px rgba(38,169,255,.6);}
  .gold .eq{color:#ffcf8a;text-shadow:0 0 9px #ff8a1e,0 0 30px rgba(255,138,30,.6);}
  .mint .eq{color:#a6ffd8;text-shadow:0 0 9px #12e5a0,0 0 30px rgba(18,229,160,.55);}
  .violet .eq{color:#d8b4ff;text-shadow:0 0 9px #a855f7,0 0 30px rgba(168,85,247,.55);}

.cyan .sub{color:#7fd4ff;} .gold .sub{color:#ffb066;}
  .mint .sub{color:#7ff0c4;} .violet .sub{color:#c9a6ff;}

/* ── 底部控制面板 ── */
  #panel{
    position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
    z-index:7;display:flex;flex-direction:column;align-items:center;gap:9px;
    width:min(840px,94vw);pointer-events:none;
  }
  #stats{
    display:flex;flex-wrap:wrap;gap:clamp(6px,2.6vw,42px);
    justify-content:center;align-items:flex-end;
    font-size:clamp(8.5px,1.02vw,13px);letter-spacing:.4px;
  }
  .stat{text-align:center;min-width:74px;}
  .stat .k{opacity:.55;font-size:.8em;letter-spacing:1.5px;color:#8fb8ff;white-space:nowrap;}
  .stat .v{font-family:"Cambria Math",Georgia,serif;font-size:1.42em;margin-top:3px;
    color:#fff;text-shadow:0 0 14px rgba(120,200,255,.9);white-space:nowrap;}
  .stat .v.hot{color:#ffd9a0;text-shadow:0 0 14px rgba(255,160,60,.95);}

#row{display:flex;align-items:center;gap:11px;width:100%;pointer-events:auto;}
  #row .lb{font-size:10.5px;color:#8fb8ff;letter-spacing:1.6px;white-space:nowrap;opacity:.82;}

input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:3px;
    outline:none;cursor:pointer;
  }
  #sliderI{
    background:linear-gradient(90deg,#0d2a40,#1a6fa8,#2affc8);
    box-shadow:0 0 14px rgba(42,255,200,.32);
  }
  #sliderT{
    background:linear-gradient(90deg,#3a1200,#a86000,#ffc76b,#8fd8ff,#2affc8);
    box-shadow:0 0 14px rgba(255,180,80,.3);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid #2affc8;
    box-shadow:0 0 12px #2affc8,0 0 26px rgba(42,255,200,.7);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#fff;
    border:2px solid #2affc8;box-shadow:0 0 12px #2affc8;cursor:pointer;
  }

/* ── 开关 ── */
  .tgl{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    pointer-events:auto;user-select:none;
    font-size:11px;letter-spacing:1.4px;color:#8fd8ff;opacity:.85;
  }
  .tgl input{display:none;}
  .tgl .box{
    width:34px;height:18px;border-radius:10px;position:relative;
    background:rgba(20,50,80,.9);border:1px solid rgba(80,180,255,.45);
    transition:.25s;
  }
  .tgl .box::after{
    content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;
    border-radius:50%;background:#5b8fbf;transition:.25s;
  }
  .tgl input:checked + .box{background:rgba(20,120,100,.9);border-color:#2affc8;
    box-shadow:0 0 14px rgba(42,255,200,.55);}
  .tgl input:checked + .box::after{left:18px;background:#2affc8;
    box-shadow:0 0 10px #2affc8;}

@media (max-width:640px){
    .bl,.br{bottom:196px;}
    .hud .sub{display:none;}
    .tl,.tr{top:46px;}
    #topLine{letter-spacing:1px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="topLine">积微成著，持续的电流终将镀出人生的光华</div>

<div class="hud tl cyan">
  <div class="eq">m = k·Q = k·I·t&nbsp;&nbsp;,&nbsp;&nbsp;k = M/(nF)</div>
  <div class="sub">法拉第电解第一定律</div>
</div>

<div class="hud tr gold">
  <div class="eq">E = E⁰ − (RT/nF)·ln Q</div>
  <div class="sub">能斯特方程 · E⁰(Cu²⁺/Cu) = −0.34 V</div>
</div>

<div class="hud bl violet">
  <div class="eq">ΔG = −nFE</div>
  <div class="sub">吉布斯自由能 · 非自发需外电压</div>
</div>

<div class="hud br mint">
  <div class="eq">F = 96485 C/mol&nbsp;&nbsp;,&nbsp;&nbsp;n = 2</div>
  <div class="sub">法拉第常数 · 铜离子价态</div>
</div>

<div id="panel">
  <div id="stats">
    <div class="stat"><div class="k">电流 I</div><div class="v" id="vI">1.5 A</div></div>
    <div class="stat"><div class="k">通电时间 t</div><div class="v" id="vT">0 min</div></div>
    <div class="stat"><div class="k">电荷量 Q = I·t</div><div class="v" id="vQ">0 C</div></div>
    <div class="stat"><div class="k">理论沉积 m</div><div class="v hot" id="vM">0.00 g</div></div>
    <div class="stat"><div class="k">实测 (58%)</div><div class="v" id="vMr">0.00 g</div></div>
  </div>
  <div id="row">
    <span class="lb">I</span>
    <input id="sliderI" type="range" min="0.5" max="4" step="0.1" value="1.5">
    <span class="lb">t</span>
    <input id="sliderT" type="range" min="0" max="120" step="1" value="0">
  </div>
  <label class="tgl">
    <input type="checkbox" id="theoryToggle">
    <span class="box"></span>
    <span>叠加法拉第理论曲线 · 实测对照</span>
  </label>
</div>

<script>
(function(){
'use strict';

/* ═══════════════ 画布 ═══════════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ═══════════════ 常量 ═══════════════ */
const F_CONST = 96485;        // C/mol
const N_CU    = 2;
const M_CU    = 63.546;       // g/mol
const K_CU    = M_CU / (N_CU * F_CONST);   // g/C
const EFF     = 0.58;
const E0_CU   = -0.34;        // V
const CYCLE   = 30000;        // ms

/* ═══════════════ 状态 ═══════════════ */
let currentI = 1.5;
let t0 = performance.now();
let lastNow = performance.now();
let draggingT = false;
let clickInfo = null;
let showTheory = false;

const bubbles = [];
const ions    = [];
const drops   = [];

let hitA = null, hitC = null;
let tankRect = null;

/* ═══════════════ 工具 ═══════════════ */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
function rr(x,y,w,h,r){
  ctx.beginPath();
  if (ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ═══════════════ 交互 ═══════════════ */
const sliderI = document.getElementById('sliderI');
const sliderT = document.getElementById('sliderT');
const theoryToggle = document.getElementById('theoryToggle');

sliderI.addEventListener('input', function(){
  currentI = parseFloat(this.value);
});

sliderT.addEventListener('pointerdown', ()=> draggingT = true);
window.addEventListener('pointerup', ()=> draggingT = false);

sliderT.addEventListener('input', function(){
  const t = parseFloat(this.value);
  const pp = 0.06 + 0.84 * (t / 120);
  t0 = performance.now() - pp * CYCLE;
});

theoryToggle.addEventListener('change', function(){
  showTheory = this.checked;
});

canvas.addEventListener('pointerdown', function(e){
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  function hit(box, type){
    if (!box) return false;
    if (mx >= box.x - 6 && mx <= box.x + box.w + 6 &&
        my >= box.y - 6 && my <= box.y + box.h + 6){
      clickInfo = { type: type, until: performance.now() + 5200 };
      return true;
    }
    return false;
  }
  if (hit(hitA, 'anode')) return;
  if (hit(hitC, 'cathode')) return;
});

/* ═══════════════ HUD ═══════════════ */
const vI  = document.getElementById('vI');
const vT  = document.getElementById('vT');
const vQ  = document.getElementById('vQ');
const vM  = document.getElementById('vM');
const vMr = document.getElementById('vMr');

/* ═══════════════ 粒子系统 ═══════════════ */
function spawnBubble(anodeCX, cathodeCX, aW, cW, liquidTop, liquidBot){
  if (bubbles.length > 220) return;
  const isA = Math.random() < 0.5;
  const cx  = isA ? anodeCX : cathodeCX;
  const w   = isA ? aW : cW;
  const dir = isA ? -1 : 1;
  const x = cx + dir * (w / 2 + 1 + Math.random() * 4);
  const y = liquidBot - Math.random() * (liquidBot - liquidTop) * 0.92;
  bubbles.push({
    x: x, y: y,
    r: 1.0 + Math.random() * 2.4,
    vy: -(0.55 + Math.random() * 1.25),
    ph: Math.random() * 6.283,
    wob: 0.25 + Math.random() * 0.55
  });
}

function spawnIon(anodeCX, aW, liquidTop, liquidBot){
  if (ions.length > 150) return;
  ions.push({
    x: anodeCX + aW/2 + 4 + Math.random() * 30,
    y: liquidTop + Math.random() * (liquidBot - liquidTop),
    vx: 0.35 + Math.random() * 0.85,
    r: 1.2 + Math.random() * 1.9,
    ph: Math.random() * 6.283
  });
}

function updateParticles(dt, now, geo){
  const { anodeCX, cathodeCX, aW, cW, liquidTop, liquidBot } = geo;

  /* 气泡生成 */
  const rateB = currentI * 0.42 * dt;
  let nb = Math.floor(rateB);
  if (Math.random() < rateB - nb) nb++;
  for (let i = 0; i < nb; i++) spawnBubble(anodeCX, cathodeCX, aW, cW, liquidTop, liquidBot);

  /* 离子生成 */
  const rateI = currentI * 0.36 * dt;
  let ni = Math.floor(rateI);
  if (Math.random() < rateI - ni) ni++;
  for (let i = 0; i < ni; i++) spawnIon(anodeCX, aW, liquidTop, liquidBot);

  /* 气泡更新 */
  for (let i = bubbles.length - 1; i >= 0; i--){
    const b = bubbles[i];
    b.y += b.vy * dt;
    b.x += Math.sin(now * 0.004 + b.ph) * b.wob * dt;
    if (b.y < liquidTop + 2){
      // 破裂 → 溅射液滴
      if (drops.length < 160){
        const nd = 3 + (Math.random() * 3 | 0);
        for (let k = 0; k < nd; k++){
          drops.push({
            x: b.x, y: liquidTop,
            vx: (Math.random() - 0.5) * 2.4,
            vy: -1.2 - Math.random() * 2.6,
            r: 0.7 + Math.random() * 1.5,
            life: 1
          });
        }
      }
      bubbles.splice(i, 1);
    }
  }

  /* 离子更新 */
  for (let i = ions.length - 1; i >= 0; i--){
    const p = ions[i];
    p.x += p.vx * dt * (0.8 + currentI * 0.35);
    p.y += Math.sin(now * 0.003 + p.ph) * 0.35 * dt;
    if (p.x > cathodeCX - cW/2 - 2) ions.splice(i, 1);
  }

  /* 液滴更新 */
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.vy += 0.13 * dt;
    d.x  += d.vx * dt;
    d.y  += d.vy * dt;
    d.life -= dt * 0.018;
    if (d.life <= 0 || d.y > liquidTop + 34) drops.splice(i, 1);
  }
}

/* ═══════════════ 绘制：电极 ═══════════════ */
function drawAnode(x, y, w, h, prog){
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0,   '#8a3d00');
  g.addColorStop(0.32,'#ffa733');
  g.addColorStop(0.55,'#ffd98a');
  g.addColorStop(0.78,'#ff8c1a');
  g.addColorStop(1,   '#7a3400');

  ctx.save();
  ctx.shadowColor = '#ff8a1e';
  ctx.shadowBlur  = 26;
  ctx.fillStyle = g;
  rr(x, y, w, h, 3);
  ctx.fill();
  ctx.restore();

  // 溶解的锯齿边缘
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.35 + 0.4 * prog;
  ctx.fillStyle = 'rgba(255,190,90,0.75)';
  const notches = 9;
  for (let i = 0; i < notches; i++){
    const ny = y + h * (i + 0.5) / notches;
    const nr = 1.2 + Math.random() * (1 + prog * 2.2);
    ctx.beginPath();
    ctx.arc(x + (Math.random() < 0.5 ? 0 : w), ny, nr, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();
}

function drawCathode(cx, baseW, coatProg, y, h){
  const extra = baseW * 1.05 * coatProg;
  const totalW = baseW + extra * 2;
  const x = cx - totalW / 2;

  /* 镀铜层辉光 */
  if (coatProg > 0.01){
    ctx.save();
    ctx.shadowColor = '#2affc8';
    ctx.shadowBlur  = 16 + 34 * coatProg;
    const cg = ctx.createLinearGradient(x, 0, x + totalW, 0);
    cg.addColorStop(0,    'rgba(0,180,140,0.15)');
    cg.addColorStop(0.16, 'rgba(42,255,200,0.72)');
    cg.addColorStop(0.5,  'rgba(180,255,235,0.92)');
    cg.addColorStop(0.84, 'rgba(42,255,200,0.72)');
    cg.addColorStop(1,    'rgba(0,180,140,0.15)');
    ctx.fillStyle = cg;
    rr(x, y, totalW, h, 3);
    ctx.fill();
    ctx.restore();

    // 镀层表面的闪光点
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.4 + 0.45 * coatProg;
    const glintN = 10;
    for (let i = 0; i < glintN; i++){
      const gy = y + h * (i + 0.5) / glintN;
      const gx = x + (Math.random() < 0.5 ? Math.random()*extra : totalW - Math.random()*extra);
      ctx.fillStyle = 'rgba(200,255,245,0.9)';
      ctx.beginPath();
      ctx.arc(gx, gy, 0.9 + Math.random() * 1.4, 0, 6.283);
      ctx.fill();
    }
    ctx.restore();
  }

  /* 阴极基体 */
  ctx.save();
  const bg = ctx.createLinearGradient(cx - baseW/2, 0, cx + baseW/2, 0);
  bg.addColorStop(0,   '#0b2340');
  bg.addColorStop(0.45,'#1b4a7a');
  bg.addColorStop(0.6, '#2d6ba8');
  bg.addColorStop(1,   '#0a1e38');
  ctx.fillStyle = bg;
  rr(cx - baseW/2, y, baseW, h, 3);
  ctx.fill();

  ctx.strokeStyle = 'rgba(110,200,255,0.7)';
  ctx.lineWidth = 1.4;
  ctx.shadowColor = '#3fb8ff';
  ctx.shadowBlur = 12;
  rr(cx - baseW/2, y, baseW, h, 3);
  ctx.stroke();
  ctx.restore();
}

/* ═══════════════ 绘制：理论曲线面板 ═══════════════ */
function drawTheoryPanel(px, py, pw, ph, tMin){
  ctx.save();
  // 面板底
  ctx.fillStyle = 'rgba(3,14,26,0.82)';
  ctx.strokeStyle = 'rgba(90,200,255,0.42)';
  ctx.lineWidth = 1;
  rr(px, py, pw, ph, 9);
  ctx.fill();
  ctx.stroke();

  const padL = 34, padR = 12, padT = 24, padB = 24;
  const gx0 = px + padL, gx1 = px + pw - padR;
  const gy0 = py + padT, gy1 = py + ph - padB;
  const gw = gx1 - gx0, gh = gy1 - gy0;

  const maxM = K_CU * currentI * 7200;

  // 标题
  ctx.fillStyle = 'rgba(140,220,255,0.85)';
  ctx.font = '600 10px "Segoe UI",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('m — t  法拉第理论 vs 实测', px + 10, py + 15);

  // 网格
  ctx.strokeStyle = 'rgba(90,160,230,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 5]);
  for (let i = 1; i <= 3; i++){
    const y = gy1 - gh * i / 4;
    ctx.beginPath(); ctx.moveTo(gx0, y); ctx.lineTo(gx1, y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // 理论直线
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,190,90,0.95)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ffa733';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(gx0, gy1);
  ctx.lineTo(gx1, gy0);
  ctx.stroke();
  ctx.restore();

  // 实测线（58%）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(42,255,200,0.9)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#2affc8';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(gx0, gy1);
  ctx.lineTo(gx1, gy1 - gh * EFF);
  ctx.stroke();
  ctx.restore();

  // 当前时刻标记
  const fx = gx0 + gw * clamp(tMin / 120, 0, 1);
  const yTheo = gy1 - gh * clamp(tMin / 120, 0, 1);
  const yReal = gy1 - gh * clamp(tMin / 120, 0, 1) * EFF;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(fx, gy0); ctx.lineTo(fx, gy1); ctx.stroke();

  ctx.fillStyle = '#ffc98a';
  ctx.beginPath(); ctx.arc(fx, yTheo, 3.2, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#2affc8';
  ctx.beginPath(); ctx.arc(fx, yReal, 3.2, 0, 6.283); ctx.fill();
  ctx.restore();

  // 轴标注
  ctx.fillStyle = 'rgba(140,200,255,0.5)';
  ctx.font = '9px "Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('0', gx0, gy1 + 12);
  ctx.fillText('120 min', gx1, gy1 + 12);
  ctx.textAlign = 'right';
  ctx.fillText(maxM.toFixed(1) + ' g', gx0 - 3, gy0 + 4);
  ctx.fillText('0', gx0 - 3, gy1 + 3);

  ctx.restore();
}

/* ═══════════════ 主循环 ═══════════════ */
function render(now){
  const dt = Math.min(48, now - lastNow) / 16.667;
  lastNow = now;

  const cyc = (now - t0) % CYCLE;
  const p = cyc / CYCLE;

  /* ── 时间进度 ── */
  let tMin;
  if (p < 0.06)       tMin = 0;
  else if (p < 0.88)  tMin = 120 * (p - 0.06) / 0.82;
  else                tMin = 120;

  if (!draggingT) sliderT.value = Math.round(tMin);

  /* ── 物理量 ── */
  const tSec  = tMin * 60;
  const Q     = currentI * tSec;
  const mTheo = K_CU * Q;
  const mReal = mTheo * EFF;

  let coatVis = Math.min(1, (currentI / 1.5) * (tMin / 120));
  if (p > 0.95) coatVis *= Math.max(0, 1 - (p - 0.95) / 0.05);

  /* ── HUD 数值 ── */
  vI.textContent  = currentI.toFixed(1) + ' A';
  vT.textContent  = Math.round(tMin) + ' min';
  vQ.textContent  = Q >= 10000 ? (Q/1000).toFixed(1) + ' kC' : Math.round(Q) + ' C';
  vM.textContent  = mTheo.toFixed(2) + ' g';
  vMr.textContent = mReal.toFixed(2) + ' g';

  /* ═══════ 布局 ═══════ */
  const topH = Math.max(96, H * 0.145);
  const botH = Math.min(212, H * 0.34);
  const avail = H - topH - botH;

  let tankH = Math.min(avail * 0.98, 450);
  let tankW = tankH * 1.88;
  const maxW = Math.min(W * 0.86, 900);
  if (tankW > maxW){ tankW = maxW; tankH = tankW / 1.88; }

  const tankX = (W - tankW) / 2;
  const tankY = topH + (avail - tankH) / 2;

  const liquidTop = tankY + tankH * 0.17;
  const liquidBot = tankY + tankH - tankH * 0.035;

  const eTop = tankY + tankH * 0.055;
  const eBot = liquidBot - tankH * 0.018;
  const baseW = tankW * 0.05;

  const anodeCX   = tankX + tankW * 0.285;
  const cathodeCX = tankX + tankW * 0.715;

  const aW = baseW * (1 - 0.42 * coatVis);
  const cExtra = baseW * 1.05 * coatVis;
  const cW = baseW + cExtra * 2;

  hitA = { x: anodeCX - aW/2, y: eTop, w: aW, h: eBot - eTop };
  hitC = { x: cathodeCX - cW/2, y: eTop, w: cW, h: eBot - eTop };
  tankRect = { x: tankX, y: tankY, w: tankW, h: tankH };

  /* ═══════ 背景 ═══════ */
  ctx.fillStyle = '#000308';
  ctx.fillRect(0, 0, W, H);

  const warm = clamp((currentI - 0.5) / 3.5, 0, 1);
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.0028);

  const bg = ctx.createRadialGradient(
    tankX + tankW/2, tankY + tankH*0.55, 0,
    tankX + tankW/2, tankY + tankH*0.55, Math.max(W, H) * 0.78
  );
  bg.addColorStop(0, 'rgba(' + Math.round(8 + 22*warm) + ',' +
    Math.round(30 + 50*warm) + ',' + Math.round(60 + 55*warm) + ',' +
    (0.32 + 0.22 * pulse) + ')');
  bg.addColorStop(0.45, 'rgba(6,22,48,' + (0.18 + 0.1*warm) + ')');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* ═══════ 电解槽 ═══════ */
  // 玻璃容器
  ctx.save();
  const tg = ctx.createLinearGradient(tankX, tankY, tankX + tankW, tankY + tankH);
  tg.addColorStop(0, 'rgba(8,26,48,0.9)');
  tg.addColorStop(1, 'rgba(4,14,30,0.94)');
  ctx.fillStyle = tg;
  rr(tankX, tankY, tankW, tankH, 16);
  ctx.fill();
  ctx.restore();

  // 电解液
  ctx.save();
  const liqG = ctx.createLinearGradient(0, liquidTop, 0, liquidBot);
  liqG.addColorStop(0,   'rgba(26,100,190,0.52)');
  liqG.addColorStop(0.5, 'rgba(14,64,145,0.62)');
  liqG.addColorStop(1,   'rgba(6,32,88,0.78)');
  ctx.fillStyle = liqG;
  rr(tankX + 2, liquidTop, tankW - 4, liquidBot - liquidTop + tankH*0.03, 8);
  ctx.fill();
  ctx.restore();

  // 液面波动线
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(110,220,255,0.55)';
  ctx.lineWidth = 1.6;
  ctx.shadowColor = '#4fd8ff';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  const steps = 40;
  for (let i = 0; i <= steps; i++){
    const fx = tankX + 2 + (tankW - 4) * i / steps;
    const fy = liquidTop + Math.sin(now * 0.0022 + i * 0.42) * 1.8 +
               Math.sin(now * 0.0037 + i * 0.21) * 1.1;
    if (i === 0) ctx.moveTo(fx, fy); else ctx.lineTo(fx, fy);
  }
  ctx.stroke();
  ctx.restore();

  // 液体内部辉光
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createRadialGradient(
    tankX + tankW*0.5, liquidBot, 0,
    tankX + tankW*0.5, liquidBot, tankW * 0.6
  );
  lg.addColorStop(0, 'rgba(40,120,220,' + (0.16 + 0.12*warm) + ')');
  lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(tankX, liquidTop, tankW, liquidBot - liquidTop);
  ctx.restore();

  /* ═══════ 粒子更新 ═══════ */
  updateParticles(dt, now, {
    anodeCX, cathodeCX, aW, cW, liquidTop, liquidBot
  });

  /* ═══════ 离子 ═══════ */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < ions.length; i++){
    const p = ions[i];
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.4);
    g.addColorStop(0,   'rgba(200,245,255,0.92)');
    g.addColorStop(0.35,'rgba(70,190,255,0.48)');
    g.addColorStop(1,   'rgba(20,90,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 3.4, 0, 6.283);
    ctx.fill();

    ctx.fillStyle = 'rgba(230,252,255,0.85)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 0.55, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();

  /* ═══════ 电极 ═══════ */
  drawAnode(anodeCX - aW/2, eTop, aW, eBot - eTop, coatVis);
  drawCathode(cathodeCX, baseW, coatVis, eTop, eBot - eTop);

  /* ═══════ 气泡 ═══════ */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < bubbles.length; i++){
    const b = bubbles[i];
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.6);
    g.addColorStop(0,   'rgba(255,255,255,0.95)');
    g.addColorStop(0.32,'rgba(150,235,255,0.48)');
    g.addColorStop(1,   'rgba(60,160,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 2.6, 0, 6.283);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.55, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();

  /* ═══════ 液滴 ═══════ */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < drops.length; i++){
    const d = drops[i];
    const a = clamp(d.life, 0, 1);
    ctx.fillStyle = 'rgba(180,240,255,' + (0.8 * a) + ')';
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();

  /* ═══════ 玻璃边框 ═══════ */
  ctx.save();
  ctx.strokeStyle = 'rgba(110,200,255,0.42)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#4fd8ff';
  ctx.shadowBlur = 18;
  rr(tankX, tankY, tankW, tankH, 16);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(200,240,255,0.14)';
  ctx.lineWidth = 1;
  rr(tankX + 3, tankY + 3, tankW - 6, tankH - 6, 13);
  ctx.stroke();
  ctx.restore();

  /* ═══════ 电极标签 ═══════ */
  ctx.save();
  ctx.font = '600 11px "Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,190,110,0.82)';
  ctx.fillText('阳极  Cu', anodeCX, eTop - 9);
  ctx.fillStyle = 'rgba(120,255,220,0.85)';
  ctx.fillText('阴极  Cu', cathodeCX, eTop - 9);
  ctx.restore();

  /* ═══════ 理论曲线面板 ═══════ */
  if (showTheory){
    const pw = Math.min(232, tankW * 0.44);
    const ph = pw * 0.66;
    drawTheoryPanel(tankX + tankW - pw - 16, tankY + 16, pw, ph, tMin);
  }

  /* ═══════ 电极点击信息 ═══════ */
  if (clickInfo && now < clickInfo.until){
    const life = (clickInfo.until - now) / 5200;
    const alpha = clamp(life * 1.8, 0, 1);
    const isA = clickInfo.type === 'anode';

    const anchorX = isA ? anodeCX : cathodeCX;
    const boxW = 236, boxH = 84;
    let bx = anchorX - boxW / 2;
    let by = isA ? eTop - 108 : eTop - 108;
    bx = clamp(bx, 10, W - boxW - 10);
    by = Math.max(10, by);

    ctx.save();
    ctx.globalAlpha = alpha;

    ctx.fillStyle = 'rgba(4,16,30,0.9)';
    ctx.strokeStyle = isA ? 'rgba(255,170,60,0.75)' : 'rgba(42,255,200,0.75)';
    ctx.lineWidth = 1.4;
    ctx.shadowColor = isA ? '#ffa733' : '#2affc8';
    ctx.shadowBlur = 16;
    rr(bx, by, boxW, boxH, 9);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'left';
    ctx.font = '700 12px "Segoe UI",sans-serif';
    ctx.fillStyle = isA ? '#ffc98a' : '#8dffe0';
    ctx.fillText(isA ? '阳极 · 氧化反应' : '阴极 · 还原反应', bx + 12, by + 21);

    ctx.font = '600 14px "Cambria Math",Georgia,serif';
    ctx.fillStyle = '#eaf6ff';
    ctx.fillText(isA ? 'Cu − 2e⁻ → Cu²⁺' : 'Cu²⁺ + 2e⁻ → Cu', bx + 12, by + 46);

    ctx.font = '11px "Segoe UI",sans-serif';
    ctx.fillStyle = isA ? 'rgba(255,190,120,0.8)' : 'rgba(140,255,220,0.8)';
    ctx.fillText(isA ? '失去 2 个电子 · 铜溶解进入溶液'
                     : '得到 2 个电子 · 铜沉积于电极', bx + 12, by + 68);
    ctx.restore();
  }

  requestAnimationFrame(render);
}

requestAnimationFrame(function(t){
  lastNow = t;
  t0 = t;
  render(t);
});

})();
</script>
</body>
