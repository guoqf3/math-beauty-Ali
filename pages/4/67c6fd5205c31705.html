<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>数学曲线之美 · 双曲调和曲线</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #07070e;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', serif;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      left: 0;
      right: 0;
      text-align: center;
    }
    #title-overlay {
      top: clamp(16px, 4vh, 42px);
    }
    #title-overlay h1 {
      font-size: clamp(1.2rem, 2.8vw, 1.9rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #f3ebda;
      text-shadow: 0 0 30px rgba(210, 180, 140, 0.5), 0 0 80px rgba(160, 130, 90, 0.25);
      margin: 0;
      line-height: 1.3;
    }
    #title-overlay .subtitle {
      font-size: clamp(0.7rem, 1.4vw, 0.95rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: #b8aa90;
      text-shadow: 0 0 18px rgba(180, 150, 110, 0.35);
      margin-top: 6px;
    }
    #formula-overlay {
      bottom: clamp(20px, 5vh, 50px);
    }
    .formula-box {
      display: inline-block;
      background: rgba(16, 14, 10, 0.72);
      border: 1px solid rgba(180, 145, 100, 0.35);
      border-radius: 14px;
      padding: clamp(10px, 2vh, 18px) clamp(20px, 3.5vw, 36px);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition: opacity 0.8s ease;
    }
    .formula-line {
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      color: #d4c8aa;
      letter-spacing: 0.05em;
      line-height: 1.9;
      font-style: italic;
      white-space: nowrap;
    }
    .fn {
      color: #e8c97a;
      font-style: normal;
      font-weight: bold;
    }
    .hyp {
      color: #d4b060;
      font-style: normal;
      font-weight: bold;
    }
    .paren {
      color: #c4a870;
      font-style: normal;
    }
    .op {
      color: #b8956e;
      font-style: normal;
    }
    .param {
      color: #a09070;
      font-style: normal;
    }
    @media (max-width: 600px) {
      .formula-line {
        font-size: 0.7rem;
        letter-spacing: 0.02em;
        white-space: normal;
      }
      .formula-box {
        padding: 8px 12px;
        border-radius: 10px;
      }
      #title-overlay h1 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="overlay" id="title-overlay">
    <h1>数学曲线之美</h1>
    <div class="subtitle">双曲调和曲线 · Hyperbolic Harmonics</div>
  </div>

  <div class="overlay" id="formula-overlay">
    <div class="formula-box">
      <div class="formula-line">
        <span class="fn">x</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span>
        <span class="hyp">sinh</span><span class="paren">(</span><span class="fn">cos</span><span class="paren">(</span>a t<span class="paren">)</span><span class="paren">)</span>
        <span class="op">·</span> <span class="fn">cos</span><span class="paren">(</span>b t <span class="op">+</span> φ<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">y</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span>
        <span class="hyp">cosh</span><span class="paren">(</span><span class="fn">sin</span><span class="paren">(</span>c t<span class="paren">)</span><span class="paren">)</span>
        <span class="op">·</span> <span class="fn">sin</span><span class="paren">(</span>d t <span class="op">+</span> ψ<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">z</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span>
        <span class="hyp">tanh</span><span class="paren">(</span><span class="fn">cos</span><span class="paren">(</span>e t<span class="paren">)</span><span class="paren">)</span>
        <span class="op">·</span> <span class="fn">sin</span><span class="paren">(</span>f t <span class="op">+</span> θ<span class="paren">)</span>
        &nbsp;&nbsp;<span class="param">a..f ∈ ℤ⁺</span>&nbsp;<span class="param">t ∈ [0,2π]</span>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ==================== DOM 元素 ====================
    const container = document.getElementById('canvas-container');
    const formulaBox = document.querySelector('.formula-box');

    // ==================== 场景初始化 ====================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07070e, 0.00008);

    // 相机
    const camera = new THREE.PerspectiveCamera(
      48,
      container.clientWidth / container.clientHeight,
      0.4,
      32
    );
    camera.position.set(3.6, 1.8, 5.8);
    camera.lookAt(0, 0, 0);

    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x07070e);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // ==================== 背景星场 ====================
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 500;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 10 + Math.random() * 12;
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({
      color: 0xcec8b5,
      size: 0.019,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // ==================== 曲线参数 ====================
    const TOTAL_VERTICES = 3000;
    const CURVE_COUNT = 38;
    const GROW_DURATION = 15.0;
    const PAUSE_DURATION = 1.5;
    const SHRINK_DURATION = 15.0;
    const CYCLE_TOTAL = GROW_DURATION + PAUSE_DURATION + SHRINK_DURATION; // 31.5s

    // 预定义整数频率组合
    function buildCurveParams(count) {
      const params = [];
      const freqA = [2, 3, 4, 5, 2, 3, 4, 5, 6, 3, 5, 7, 2, 4, 6, 3, 5, 4, 7];
      const freqB = [3, 2, 5, 4, 7, 5, 3, 2, 5, 4, 3, 2, 5, 3, 5, 7, 4, 6, 5];
      const freqC = [4, 5, 2, 3, 3, 7, 6, 5, 4, 2, 7, 4, 3, 6, 2, 5, 3, 5, 4];
      const freqD = [5, 3, 4, 6, 5, 2, 7, 3, 2, 5, 4, 6, 5, 2, 7, 4, 6, 3, 5];
      const freqE = [3, 7, 5, 2, 4, 3, 5, 6, 3, 7, 2, 4, 5, 3, 6, 2, 5, 4, 3];
      const freqF = [7, 4, 3, 5, 2, 6, 4, 3, 7, 5, 3, 5, 2, 4, 3, 6, 2, 7, 4];

      for (let i = 0; i < count; i++) {
        const idx = i % freqA.length;
        const a = freqA[idx];
        const b = freqB[idx];
        const c = freqC[idx];
        const d = freqD[idx];
        const e = freqE[idx];
        const f = freqF[idx];
        const phi = (i * 0.73 + 0.4) % (Math.PI * 2);
        const psi = (i * 0.88 + 1.6) % (Math.PI * 2);
        const theta = (i * 0.61 + 2.5) % (Math.PI * 2);
        // 振幅微调
        const ampX = 0.85 + (i % 7) * 0.025;
        const ampY = 0.85 + ((i + 3) % 7) * 0.025;
        const ampZ = 0.78 + ((i + 5) % 7) * 0.022;
        params.push({ a, b, c, d, e, f, phi, psi, theta, ampX, ampY, ampZ });
      }
      return params;
    }
    const curveParamsList = buildCurveParams(CURVE_COUNT);

    // 色相均匀分布
    const hues = Array.from({ length: CURVE_COUNT }, (_, k) => (k / CURVE_COUNT + 0.04) % 1);

    // ==================== 生成曲线数据 ====================
    function generateCurveData(p, hue) {
      const positions = new Float32Array(TOTAL_VERTICES * 3);
      const colors = new Float32Array(TOTAL_VERTICES * 3);

      for (let i = 0; i < TOTAL_VERTICES; i++) {
        const t = (i / (TOTAL_VERTICES - 1)) * Math.PI * 2;

        // 使用双曲函数与三角函数的组合
        const sinhCos = Math.sinh(Math.cos(p.a * t));
        const coshSin = Math.cosh(Math.sin(p.c * t));
        const tanhCos = Math.tanh(Math.cos(p.e * t));

        const x = p.ampX * sinhCos * Math.cos(p.b * t + p.phi);
        const y = p.ampY * coshSin * Math.sin(p.d * t + p.psi);
        const z = p.ampZ * tanhCos * Math.sin(p.f * t + p.theta);

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // 颜色随t和色相微调
        const hueShift = Math.sin(t * 2.9 + hue * 12) * 0.018;
        const h = (hue + hueShift + 1) % 1;
        const s = 0.68 + Math.sin(t * 3.6 + hue * 9) * 0.12;
        const l = 0.50 + Math.cos(t * 5.3 + hue * 7) * 0.10;
        const color = new THREE.Color();
        color.setHSL(h, s, l);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      return { positions, colors };
    }

    // ==================== 创建所有曲线 ====================
    const curveGroup = new THREE.Group();
    scene.add(curveGroup);
    const allGeometries = [];

    curveParamsList.forEach((params, idx) => {
      const { positions, colors } = generateCurveData(params, hues[idx]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      // 初始完全隐藏
      geometry.setDrawRange(0, 0);

      const material = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.NormalBlending,
        depthTest: true,
        depthWrite: true,
      });
      const line = new THREE.Line(geometry, material);
      line.renderOrder = idx;
      curveGroup.add(line);
      allGeometries.push(geometry);
    });

    // ==================== 装饰参考环 ====================
    const ringGeo = new THREE.TorusGeometry(1.35, 0.007, 32, 180);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x3e3832,
      transparent: true,
      opacity: 0.22,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.renderOrder = 999;
    curveGroup.add(ring);

    const ring2Geo = new THREE.TorusGeometry(1.0, 0.005, 24, 140);
    const ring2Mat = new THREE.MeshBasicMaterial({
      color: 0x4c453a,
      transparent: true,
      opacity: 0.17,
      depthWrite: false,
    });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    ring2.rotation.x = Math.PI / 3;
    ring2.rotation.y = Math.PI / 5;
    ring2.renderOrder = 998;
    curveGroup.add(ring2);

    // ==================== 动画状态 ====================
    const clock = new THREE.Clock();
    let lastDrawCount = -1;
    let currentPhase = 'grow';

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // ==================== 渲染循环 ====================
    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const cycleTime = elapsed % CYCLE_TOTAL;

      let progress;
      if (cycleTime < GROW_DURATION) {
        const raw = cycleTime / GROW_DURATION;
        progress = easeInOutCubic(raw);
        currentPhase = 'grow';
      } else if (cycleTime < GROW_DURATION + PAUSE_DURATION) {
        progress = 1.0;
        currentPhase = 'pause';
      } else {
        const shrinkElapsed = cycleTime - (GROW_DURATION + PAUSE_DURATION);
        const raw = 1.0 - shrinkElapsed / SHRINK_DURATION;
        progress = easeInOutCubic(Math.max(0, Math.min(1, raw)));
        currentPhase = 'shrink';
      }

      const drawCount = Math.max(0, Math.floor(progress * TOTAL_VERTICES));

      // 仅在绘制数量变化时更新几何体
      if (drawCount !== lastDrawCount) {
        allGeometries.forEach(geo => geo.setDrawRange(0, drawCount));
        lastDrawCount = drawCount;
      }

      // 曲线组缓慢旋转并轻微摆动
      curveGroup.rotation.y += 0.0023;
      curveGroup.rotation.x = Math.sin(elapsed * 0.20) * 0.15;
      curveGroup.rotation.z = Math.cos(elapsed * 0.25) * 0.11;

      // 星场微动
      stars.rotation.y += 0.0002;
      stars.rotation.x += 0.0001;

      // 光环呼吸效果
      const breathe = 1 + Math.sin(elapsed * 0.68) * 0.04;
      ring.scale.setScalar(breathe);
      ring.material.opacity = 0.18 + Math.sin(elapsed * 0.52) * 0.06;
      ring2.scale.setScalar(1 + Math.cos(elapsed * 0.63) * 0.05);
      ring2.material.opacity = 0.14 + Math.cos(elapsed * 0.58) * 0.05;

      // 公式面板透明度
      if (formulaBox) {
        let op;
        if (currentPhase === 'pause') op = 0.95;
        else if (currentPhase === 'grow' && progress > 0.5) op = 0.5 + (progress - 0.5) * 0.9;
        else if (currentPhase === 'shrink' && progress < 0.5) op = 0.5 + progress * 0.9;
        else op = 0.55 + progress * 0.4;
        formulaBox.style.opacity = Math.max(0.35, Math.min(1, op));
      }

      renderer.render(scene, camera);
    }

    // ==================== 响应式处理 ====================
    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 150));

    // ==================== 启动动画 ====================
    // 确保初始状态所有曲线完全隐藏
    allGeometries.forEach(geo => geo.setDrawRange(0, 0));
    lastDrawCount = 0;
    clock.start();

    // 立即执行第一帧，确保不会出现空白停顿
    requestAnimationFrame(animate);

    console.log('%c🌀 双曲调和曲线 %c已启动',
      'color:#e8c97a;font-size:1.1em;',
      'color:#b8aa90;');
    console.log('%c' + CURVE_COUNT + '条双曲函数曲线 | 从无到有15s → 停顿1.5s → 从有到无15s | 完美闭合',
      'color:#b8956e;font-size:0.9em;');
    console.log('%c公式: x=sinh(cos(at))·cos(bt) | y=cosh(sin(ct))·sin(dt) | z=tanh(cos(et))·sin(ft)',
      'color:#9a8a6e;font-size:0.85em;');
  </script>
</body>
</html>
