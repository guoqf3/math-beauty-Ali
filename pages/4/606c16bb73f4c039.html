<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谐波花瓣 · 极坐标谐振</title>
    <style>
        :root {
            --bg: #030311;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: clamp(18px, 3.8vh, 44px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #title-overlay h1 {
            color: #e2d1b6;
            font-size: clamp(1.2rem, 2.3vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 30px rgba(220, 185, 135, 0.55), 0 0 80px rgba(190, 155, 105, 0.25);
            margin: 0;
        }
        #title-overlay .subtitle {
            color: #bfa888;
            font-size: clamp(0.7rem, 1.2vw, 0.95rem);
            letter-spacing: 0.06em;
            margin-top: 0.3em;
            text-shadow: 0 0 15px rgba(180, 145, 105, 0.4);
        }

        #formula-overlay {
            position: fixed;
            bottom: clamp(26px, 4.8vh, 56px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(16, 12, 22, 0.72);
            border: 1px solid rgba(170, 145, 115, 0.28);
            border-radius: 12px;
            padding: clamp(10px, 1.4vh, 16px) clamp(18px, 3vw, 30px);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        #formula-overlay .formula-main {
            color: #f3e0c5;
            font-size: clamp(0.82rem, 1.4vw, 1.2rem);
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a8967e;
            font-size: clamp(0.62rem, 0.95vw, 0.82rem);
            letter-spacing: 0.03em;
            margin-top: 0.25em;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.05em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>谐波花瓣</h1>
        <div class="subtitle">Harmonic Petals · Polar Resonance</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                r(θ) = 1.6 + 1.3 sin(2θ) + 0.7 cos(5θ)<br>
                &emsp; x = r(θ) cos(θ+α)  z = 0.8 sin(4θ)
            </div>
            <div class="formula-detail">
                θ ∈ [0, 4π] | α ∈ [0, 2π] | 16 harmonics
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#030311');
        scene.fog = new THREE.Fog('#030311', 5.5, 16);

        const camera = new THREE.PerspectiveCamera(
            46,
            container.clientWidth / container.clientHeight,
            0.3,
            26
        );
        camera.position.set(0, 0.4, 7.4);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight('#202040', 0.5));

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const allLines = [];
        const totalPoints = 1600; // 每条曲线的采样点数

        // ==================== 谐波花瓣曲线生成 ====================
        function petalRadius(theta) {
            // 极坐标方程
            return 1.6 + 1.3 * Math.sin(2 * theta) + 0.7 * Math.cos(5 * theta);
        }

        function generateHarmonicPetal(phaseAlpha, zAmp, zFreq, scale) {
            const vertices = new Float32Array(totalPoints * 3);
            for (let i = 0; i < totalPoints; i++) {
                const theta = (i / (totalPoints - 1)) * Math.PI * 4; // θ: 0 → 4π
                const r = petalRadius(theta);
                const angle = theta + phaseAlpha;
                const x = scale * r * Math.cos(angle);
                const y = scale * r * Math.sin(angle);
                const z = scale * zAmp * Math.sin(zFreq * theta);
                vertices[i * 3] = x;
                vertices[i * 3 + 1] = y;
                vertices[i * 3 + 2] = z;
            }
            return vertices;
        }

        function createLine(vertices, colorHSL, opacity = 0.78) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0); // 初始隐藏

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.NormalBlending,
                depthWrite: true,
                depthTest: true,
            });

            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // ==================== 配置16条曲线，均匀相位偏移，色相环分布 ====================
        const curveCount = 16;
        const scale = 0.48;
        const zAmp = 0.8;
        const zFreq = 4;

        for (let i = 0; i < curveCount; i++) {
            const alpha = (i / curveCount) * Math.PI * 2;
            const hue = (i / curveCount) * 0.85; // 覆盖大部分色相
            const color = { h: hue, s: 0.85, l: 0.60 };
            const vertices = generateHarmonicPetal(alpha, zAmp, zFreq, scale);
            const line = createLine(vertices, color, 0.75);
            mainGroup.add(line);
            allLines.push(line);
        }

        // ==================== 添加极淡的参考圆环（增强空间层次） ====================
        function createReferenceCircle(radius, colorHSL, opacity) {
            const pts = 300;
            const vertices = new Float32Array(pts * 3);
            for (let i = 0; i < pts; i++) {
                const angle = (i / (pts - 1)) * Math.PI * 2;
                vertices[i * 3] = radius * Math.cos(angle);
                vertices[i * 3 + 1] = radius * Math.sin(angle);
                vertices[i * 3 + 2] = 0;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setDrawRange(0, 0);
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(colorHSL.h, colorHSL.s, colorHSL.l),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.NormalBlending,
                depthWrite: true,
            });
            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        const refCircles = [];
        const refColor = { h: 0.55, s: 0.12, l: 0.5 };
        const radii = [0.8, 1.3, 1.9, 2.45];
        radii.forEach(r => {
            const circle = createReferenceCircle(r, refColor, 0.18);
            mainGroup.add(circle);
            allLines.push(circle);
            refCircles.push(circle);
        });

        console.log(`✅ 已生成 ${curveCount} 条谐波花瓣曲线 + ${refCircles.length} 条参考圆环`);

        // ==================== 动画状态机 ====================
        const CYCLE_TOTAL = 7.0;
        const APPEAR_TIME = 3.0;
        const PAUSE_TIME = 1.0;
        const DISAPPEAR_TIME = 3.0;

        let animationStartTime = null;
        let firstFrameDone = false;

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInCubic(t) { return t * t * t; }

        function getProgress(elapsedSeconds) {
            const cycle = elapsedSeconds % CYCLE_TOTAL;
            if (cycle < APPEAR_TIME) {
                const t = cycle / APPEAR_TIME;
                return { progress: easeOutCubic(t), phase: 'appear' };
            } else if (cycle < APPEAR_TIME + PAUSE_TIME) {
                return { progress: 1.0, phase: 'pause' };
            } else {
                const t = (cycle - APPEAR_TIME - PAUSE_TIME) / DISAPPEAR_TIME;
                return { progress: 1.0 - easeInCubic(t), phase: 'disappear' };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            if (animationStartTime === null) {
                animationStartTime = timestamp;
                // 第一帧全部隐藏
                allLines.forEach(line => {
                    line.visible = false;
                    if (line.geometry) line.geometry.setDrawRange(0, 0);
                });
                renderer.render(scene, camera);
                firstFrameDone = true;
                return;
            }

            const elapsed = (timestamp - animationStartTime) / 1000;
            const { progress } = getProgress(elapsed);
            const drawCount = Math.floor(progress * totalPoints);
            const visible = drawCount >= 2;

            for (let i = 0; i < allLines.length; i++) {
                const line = allLines[i];
                if (!line || !line.geometry) continue;
                const maxPts = line.geometry.attributes.position.count;
                const lineDraw = Math.min(drawCount, maxPts);
                if (visible && lineDraw >= 2) {
                    line.visible = true;
                    line.geometry.setDrawRange(0, lineDraw);
                } else {
                    line.visible = false;
                    line.geometry.setDrawRange(0, 0);
                }
            }

            // 缓慢自转 + 轻微摇晃
            const rotY = elapsed * 0.14;
            const rotX = Math.sin(elapsed * 0.27) * 0.09;
            const rotZ = Math.cos(elapsed * 0.33) * 0.07;
            mainGroup.rotation.set(rotX, rotY, rotZ);

            // 相机微动
            camera.position.x = Math.sin(elapsed * 0.18) * 0.3;
            camera.position.y = 0.4 + Math.cos(elapsed * 0.24) * 0.25;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 谐波花瓣动画启动');
        console.log(`   - 花瓣曲线: ${curveCount} 条`);
        console.log(`   - 参考圆环: ${refCircles.length} 条`);
        console.log(`   - 采样点/曲线: ${totalPoints}`);
        console.log(`   - 动画周期: ${CYCLE_TOTAL}s (出现${APPEAR_TIME}s + 停顿${PAUSE_TIME}s + 消失${DISAPPEAR_TIME}s)`);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
