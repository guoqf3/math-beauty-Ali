<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空间等角螺线编织 · 对数螺线共形投影 · 球面映射</title>
    <style>
        :root {
            --bg: #04040e;
            --gold: #d6a745;
            --cyan: #3dbca5;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.3vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.1em;
            color: #e2cf9c;
            text-shadow: 0 0 36px rgba(214, 167, 69, 0.42), 0 0 74px rgba(214, 167, 69, 0.12);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.4rem, 0.82vw, 0.54rem);
            letter-spacing: 0.17em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.2vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 1.8vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 14, 0.6);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            border: 1px solid rgba(140, 118, 84, 0.15);
            border-radius: 15px;
            padding: 0.8vh 2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.5rem, 1.1vw, 0.75rem);
            color: #cdb886;
            letter-spacing: 0.04em;
            line-height: 1.55;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.32rem, 0.65vw, 0.45rem);
            color: #8a7a58;
            letter-spacing: 0.07em;
            margin-top: 0.15vh;
            opacity: 0.65;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3dbca5;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.3s ease-out 0.15s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <h1>空间等角螺线编织 · 对数螺线共形投影 · 球面映射</h1>
        <div class="subtitle">r=a·e^(bφ) 球面螺旋 &nbsp;·&nbsp; dθ/ds=κ 恒曲率 &nbsp;·&nbsp; 三族交织</div>
    </div>
    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">γ₁(s): r=e^(α₁s), θ=β₁s</span>
            ⊗ <span class="accent-cyan">γ₂(s): r=e^(α₂s), θ=β₂s</span>
            ⊗ <span class="accent-rose">γ₃(s): M∘(e^(α₃s), θ=β₃s)</span>
        </div>
        <div class="formula-detail">
            球面对数螺线 · Möbius共形变换 · 球极逆投影 · SO(3)全局旋转 · 自相似编织
        </div>
    </div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.3, 1.4, 7.8);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3dbca5');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;
        const SPHERE_R = 2.5;

        // ---------- 背景星点 ----------
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 110;
        const starPos = new Float32Array(starCount * 3);
        const starSz = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.3 + Math.random() * 8;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSz[i] = Math.random() * 1.3 + 0.14;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSz, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.015,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.55, 44, 28);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.04, depthWrite: false })
        );
        scene.add(refSphereWire);
        const refTorusGeom = new THREE.TorusGeometry(1.95, 0.48, 10, 22);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.03, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- 工具函数 ----------
        function invStereo(x, y, z) {
            const r2 = x * x + y * y + z * z;
            const denom = 1 + r2 / (SPHERE_R * SPHERE_R);
            const inv = 1 / Math.max(denom, 1e-12);
            return [(2 * x) * inv, (2 * y) * inv, ((1 - r2 / (SPHERE_R * SPHERE_R)) * SPHERE_R) * inv];
        }

        function clampPt(p) {
            let [x, y, z] = p;
            if (!Number.isFinite(x)) x = 0;
            if (!Number.isFinite(y)) y = 0;
            if (!Number.isFinite(z)) z = 0;
            const r = Math.sqrt(x * x + y * y + z * z);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const s = CLAMP_RADIUS / r;
                return [x * s, y * s, z * s];
            }
            return [x, y, z];
        }

        function so3Matrix(t) {
            const angle = t * 0.22;
            const ax = Math.cos(t * 0.15) * 0.48;
            const ay = Math.sin(t * 0.11) * 0.43;
            const az = Math.cos(t * 0.17 + 1.1) * 0.45;
            const n = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
            const ux = ax / n,
                uy = ay / n,
                uz = az / n;
            const c = Math.cos(angle),
                s = Math.sin(angle),
                t1 = 1 - c;
            return [
                c + ux * ux * t1, ux * uy * t1 - uz * s, ux * uz * t1 + uy * s,
                uy * ux * t1 + uz * s, c + uy * uy * t1, uy * uz * t1 - ux * s,
                uz * ux * t1 - uy * s, uz * uy * t1 + ux * s, c + uz * uz * t1,
            ];
        }

        function applySo3(pt, R) {
            return [
                R[0] * pt[0] + R[1] * pt[1] + R[2] * pt[2],
                R[3] * pt[0] + R[4] * pt[1] + R[5] * pt[2],
                R[6] * pt[0] + R[7] * pt[1] + R[8] * pt[2],
            ];
        }

        // Möbius变换 (用于玫红族)
        function cpx(r, i) { return { re: r, im: i }; }
        function cpxMul(u, v) { return cpx(u.re * v.re - u.im * v.im, u.re * v.im + u.im * v.re); }
        function cpxAdd(u, v) { return cpx(u.re + v.re, u.im + v.im); }
        function cpxDiv(u, v) {
            const d = v.re * v.re + v.im * v.im;
            return cpx((u.re * v.re + u.im * v.im) / d, (u.im * v.re - u.re * v.im) / d);
        }
        function mobius(z, a, b, c, d) {
            return cpxDiv(cpxAdd(cpxMul(a, z), b), cpxAdd(cpxMul(c, z), d));
        }

        // ---------- 曲线系统 ----------
        const POINTS_PER_CURVE = 130;
        const allCurves = [];

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.81,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geom, positions, updateFn: null };
            allCurves.push(obj);
            return obj;
        }

        function logSpiralPoint(t, a, b, theta0, phi0) {
            const r = a * Math.exp(b * t);
            const theta = t + theta0;
            const phi = phi0;
            const x = r * Math.sin(theta) * Math.cos(phi);
            const y = r * Math.sin(theta) * Math.sin(phi);
            const z = r * Math.cos(theta);
            return [x, y, z];
        }

        function buildSpiralFamily(count, aRange, bRange, color, useMobius) {
            for (let k = 0; k < count; k++) {
                const a = aRange[0] + (k / count) * (aRange[1] - aRange[0]);
                const b = bRange[0] + (k / count) * (bRange[1] - bRange[0]);
                const theta0 = (k * 2.39996) % (Math.PI * 2);
                const phi0 = (k * 1.61803) % (Math.PI * 2);
                const curve = createCurve(color);
                curve.a = a;
                curve.b = b;
                curve.theta0 = theta0;
                curve.phi0 = phi0;
                curve.useMobius = useMobius;
                curve.updateFn = (t) => {
                    const positions = curve.positions;
                    const R3 = so3Matrix(t);
                    const aDyn = curve.a * (1 + 0.15 * Math.sin(t * 0.35 + k));
                    const bDyn = curve.b * (1 + 0.12 * Math.cos(t * 0.4 + k * 0.7));
                    const tMin = -3.2,
                        tMax = 3.2;
                    // Möbius参数随时间变化
                    const ma = cpx(0.9 * Math.cos(t * 0.25), 0.35 * Math.sin(t * 0.3 + k));
                    const mb = cpx(-0.2 * Math.sin(t * 0.35), 0.15 * Math.cos(t * 0.28 + k));
                    const mc = cpx(0.1 * Math.cos(t * 0.4), -0.1 * Math.sin(t * 0.33 + k));
                    const md = cpx(1.05 + 0.15 * Math.sin(t * 0.2), 0.08 * Math.cos(t * 0.22 + k));
                    for (let i = 0; i < POINTS_PER_CURVE; i++) {
                        const s = tMin + (i / (POINTS_PER_CURVE - 1)) * (tMax - tMin);
                        let p = logSpiralPoint(s, aDyn, bDyn, curve.theta0, curve.phi0);
                        if (curve.useMobius) {
                            const zComp = cpx(p[0], p[1]);
                            const w = mobius(zComp, ma, mb, mc, md);
                            p = [w.re, w.im, p[2]];
                        }
                        p = invStereo(p[0], p[1], p[2]);
                        p = applySo3(p, R3);
                        p = clampPt(p);
                        positions[i * 3] = p[0];
                        positions[i * 3 + 1] = p[1];
                        positions[i * 3 + 2] = p[2];
                    }
                    curve.geom.attributes.position.needsUpdate = true;
                };
            }
        }

        buildSpiralFamily(24, [0.15, 1.6], [0.15, 0.5], colorGold, false);
        buildSpiralFamily(24, [0.2, 1.8], [-0.25, -0.08], colorCyan, false);
        buildSpiralFamily(24, [0.18, 1.7], [0.08, 0.35], colorRose, true);

        console.log(`✅ 螺线总数: ${allCurves.length}`);

        // ---------- 流动粒子 ----------
        const particleCount = 22;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                curveIndex: i % allCurves.length,
                progress: Math.random(),
                speed: 0.00055 + Math.random() * 0.0023,
            });
            const col = i < 8 ? colorGold : i < 15 ? colorCyan : colorRose;
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.042,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const curveObj = allCurves[pd.curveIndex];
                if (!curveObj || !curveObj.positions) continue;
                const posArr = curveObj.positions;
                const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                const i0 = idx0 * 3,
                    i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        function updateAll(elapsed) {
            for (const curve of allCurves) {
                try { if (curve.updateFn) curve.updateFn(elapsed); } catch (e) {}
            }
        }

        // ---------- 动画循环（绝对时间驱动） ----------
        const startTime = performance.now();
        let frameCount = 0,
            lastLogTime = startTime;

        function animate(nowTS) {
            requestAnimationFrame(animate);
            try {
                const now = nowTS || performance.now();
                const elapsed = (now - startTime) / 1000;
                frameCount++;
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${elapsed.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }
                updateAll(elapsed);
                updateParticles();

                const breathe = 1 + 0.04 * Math.sin(elapsed * 0.32);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += 0.00065;
                refSphereWire.rotation.y += 0.0006;
                refTorusWire.rotation.z += 0.00065;
                refTorusWire.scale.setScalar(1 + 0.04 * Math.sin(elapsed * 0.36));

                const camH = elapsed * 0.07;
                const camV = 0.32 + 0.17 * Math.sin(elapsed * 0.13);
                const camD = 7.5 + 0.5 * Math.sin(elapsed * 0.16);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0, 0, 0);
                stars.rotation.y += 0.00014;
                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环错误（已恢复）:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });

        // 启动
        console.log('🚀 空间等角螺线编织动画初始化...');
        updateAll(0);
        updateParticles();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动（对数螺线+共形变换，绝对时间驱动，永不停止）');
    </script>
</body>
</html>
