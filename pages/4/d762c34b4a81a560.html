<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>混沌理论 · 洛伦兹吸引子</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#01030a;
  }
  canvas { display:block; }

  #topText {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    width:min(82vw,1060px);
    min-height:2.4em;
    text-align:center;
    color:#ffe6c8;
    font-size:clamp(13px,1.5vw,19.5px);
    letter-spacing:.07em;
    line-height:1.75;
    font-weight:400;
    text-shadow:0 0 16px rgba(255,190,90,.75),
                0 0 46px rgba(255,120,40,.35);
    pointer-events:none;
    z-index:10;
  }
  #topText::after {
    content:'';
    display:inline-block;
    width:2px; height:.95em;
    background:#ffc24d;
    margin-left:5px;
    vertical-align:-.12em;
    box-shadow:0 0 9px #ffc24d;
    animation:blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50%{opacity:0;} }

  .formula {
    position:fixed;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    color:rgba(255,205,140,.52);
    font-size:clamp(11px,1.02vw,15.5px);
    letter-spacing:.05em;
    pointer-events:none;
    z-index:10;
    text-shadow:0 0 14px rgba(255,160,60,.55);
    line-height:1.75;
  }
  .f-tl { top:94px; left:24px; text-align:left; }
  .f-tr { top:94px; right:24px; text-align:right; }
  .f-bl { bottom:44px; left:24px; text-align:left; }

  #panel {
    position:fixed; right:24px; bottom:44px;
    width:238px;
    padding:13px 15px 11px;
    background:rgba(18,10,6,.5);
    border:1px solid rgba(255,170,80,.22);
    border-radius:11px;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    color:#d8b48c;
    font-size:12px;
    z-index:20;
    box-shadow:0 6px 30px rgba(0,0,0,.55),
               inset 0 0 22px rgba(255,140,40,.07);
  }
  #panel .row {
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:4px 8px;
    margin-bottom:10px;
  }
  #panel .row label { grid-column:1/3; letter-spacing:.05em; }
  #panel .row .val {
    font-family:"Cambria Math",Georgia,serif;
    color:#ffd27a;
    font-size:12px;
    min-width:46px;
    text-align:right;
  }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:100%; height:3px; border-radius:3px;
    background:linear-gradient(90deg,#2a5fa8,#ff8c2a,#ff3a6a);
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:#fff0d0;
    box-shadow:0 0 12px rgba(255,180,60,.95);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb {
    width:13px; height:13px; border:none; border-radius:50%;
    background:#fff0d0;
    box-shadow:0 0 12px rgba(255,180,60,.95);
    cursor:pointer;
  }
  #resetBtn {
    width:100%;
    margin-top:2px;
    padding:6px 0;
    background:rgba(255,160,60,.12);
    border:1px solid rgba(255,170,80,.35);
    border-radius:7px;
    color:#ffd9a0;
    font-size:11.5px;
    letter-spacing:.12em;
    cursor:pointer;
    font-family:inherit;
    transition:all .22s ease;
  }
  #resetBtn:hover {
    background:rgba(255,180,80,.25);
    box-shadow:0 0 16px rgba(255,170,60,.45);
  }
  #panel .hint {
    text-align:center;
    font-size:10.5px;
    color:rgba(215,170,120,.5);
    letter-spacing:.1em;
    margin-top:8px;
  }
</style>
</head>
<body>

<div id="topText"></div>

<div class="formula f-tl">
  dx/dt = σ(y − x)<br>
  dy/dt = x(ρ − z) − y<br>
  dz/dt = xy − βz
</div>
<div class="formula f-tr">
  ‖δx(t)‖ ≈ ‖δx₀‖ · e^(λt)<br>
  初始差异 δx₀ = 1 × 10⁻⁴
</div>
<div class="formula f-bl">
  σ = 10　　ρ = 28　　β = 8/3
</div>

<div id="panel">
  <div class="row">
    <label>参数 ρ （混沌阈值 ≈ 24.74）</label>
    <input id="sRho" type="range" min="8" max="45" step="0.5" value="28">
    <span class="val" id="vRho">28.0</span>
  </div>
  <button id="resetBtn">重 置 轨 迹</button>
  <div class="hint">拖拽旋转 · 观察蝴蝶双翼</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x01030a, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 900);
camera.position.set(14.5, 9.5, 16.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.92;

/* ============================================================
   光点贴图
   ============================================================ */
function createSpriteTexture(){
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.18,'rgba(255,255,255,0.82)');
  g.addColorStop(0.46,'rgba(255,255,255,0.22)');
  g.addColorStop(1.00,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,s,s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPRITE = createSpriteTexture();

/* ============================================================
   洛伦兹系统参数
   ============================================================ */
const SIGMA = 10.0;
const BETA  = 8 / 3;
let   RHO   = 28.0;

const SCALE = 0.28;      // 洛伦兹坐标 → 场景坐标
const ZOFF  = 7.0;       // 高度居中偏移

const N  = 9000;         // 轨迹采样点数
const DT = 0.004;        // 积分步长

const DURATION = 30;     // 动画循环时长（秒）

/* ============================================================
   颜色
   ============================================================ */
const COL_A = new THREE.Color(0xffcc44);   // 轨迹 A：金
const COL_B = new THREE.Color(0x3ac8ff);   // 轨迹 B：青

/* ============================================================
   RK4 积分器（零分配）
   ============================================================ */
const _k1 = new Float64Array(3);
const _k2 = new Float64Array(3);
const _k3 = new Float64Array(3);
const _k4 = new Float64Array(3);
const _outA = new Float64Array(3);
const _outB = new Float64Array(3);

function lorenzDeriv(x, y, z, rho, out){
  out[0] = SIGMA * (y - x);
  out[1] = x * (rho - z) - y;
  out[2] = x * y - BETA * z;
  return out;
}

function rk4Step(x, y, z, rho, dt, out){
  lorenzDeriv(x, y, z, rho, _k1);
  lorenzDeriv(
    x + dt * 0.5 * _k1[0],
    y + dt * 0.5 * _k1[1],
    z + dt * 0.5 * _k1[2], rho, _k2);
  lorenzDeriv(
    x + dt * 0.5 * _k2[0],
    y + dt * 0.5 * _k2[1],
    z + dt * 0.5 * _k2[2], rho, _k3);
  lorenzDeriv(
    x + dt * _k3[0],
    y + dt * _k3[1],
    z + dt * _k3[2], rho, _k4);

  out[0] = x + dt / 6 * (_k1[0] + 2 * _k2[0] + 2 * _k3[0] + _k4[0]);
  out[1] = y + dt / 6 * (_k1[1] + 2 * _k2[1] + 2 * _k3[1] + _k4[1]);
  out[2] = z + dt / 6 * (_k1[2] + 2 * _k2[2] + 2 * _k3[2] + _k4[2]);
  return out;
}

/* ============================================================
   轨迹缓冲区
   ============================================================ */
const trajA = new Float32Array(N * 3);
const trajB = new Float32Array(N * 3);

let pendingRho  = RHO;
let needsRebuild = true;

function rebuildTrajectories(){
  const rho = pendingRho;

  let  x = 1.0,  y = 1.0,  z = 1.0;
  let xb = 1.0 + 1e-4, yb = 1.0, zb = 1.0;   // 初始仅差万分之一

  for (let i = 0; i < N; i++){
    const i3 = i * 3;

    trajA[i3    ] =  x * SCALE;
    trajA[i3 + 1] =  z * SCALE - ZOFF;
    trajA[i3 + 2] =  y * SCALE;

    trajB[i3    ] = xb * SCALE;
    trajB[i3 + 1] = zb * SCALE - ZOFF;
    trajB[i3 + 2] = yb * SCALE;

    rk4Step(x, y, z, rho, DT, _outA);
    x = _outA[0]; y = _outA[1]; z = _outA[2];

    rk4Step(xb, yb, zb, rho, DT, _outB);
    xb = _outB[0]; yb = _outB[1]; zb = _outB[2];
  }

  geoA.attributes.position.needsUpdate = true;
  geoB.attributes.position.needsUpdate = true;
}

/* ============================================================
   星空背景
   ============================================================ */
(function buildStars(){
  const COUNT = 1100;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++){
    const r  = 80 + Math.random() * 180;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3    ] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.6 + 20;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th);

    const t = Math.random();
    col[i*3    ] = 0.55 + 0.45 * t;
    col[i*3 + 1] = 0.62 + 0.30 * t;
    col[i*3 + 2] = 0.85 + 0.15 * t;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 0.85, map: SPRITE, vertexColors: true,
    transparent: true, opacity: 0.62,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* ============================================================
   轨迹 A / B 的几何体
   ============================================================ */
const geoA = new THREE.BufferGeometry();
geoA.setAttribute('position', new THREE.BufferAttribute(trajA, 3));
geoA.setDrawRange(0, 0);

const geoB = new THREE.BufferGeometry();
geoB.setAttribute('position', new THREE.BufferAttribute(trajB, 3));
geoB.setDrawRange(0, 0);

/* ---- 线条 ---- */
const matLineA = new THREE.LineBasicMaterial({
  color: COL_A, transparent: true, opacity: 0.72,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const matLineB = new THREE.LineBasicMaterial({
  color: COL_B, transparent: true, opacity: 0.66,
  blending: THREE.AdditiveBlending, depthWrite: false
});

const lineA = new THREE.Line(geoA, matLineA);
const lineB = new THREE.Line(geoB, matLineB);
lineA.frustumCulled = false;
lineB.frustumCulled = false;
lineA.renderOrder = 3;
lineB.renderOrder = 3;
scene.add(lineA, lineB);

/* ---- 点云（增强发光） ---- */
const matDotA = new THREE.PointsMaterial({
  size: 0.135, map: SPRITE, color: 0xffe9a8,
  transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false,
  sizeAttenuation: true
});
const matDotB = new THREE.PointsMaterial({
  size: 0.125, map: SPRITE, color: 0xa8e8ff,
  transparent: true, opacity: 0.48,
  blending: THREE.AdditiveBlending, depthWrite: false,
  sizeAttenuation: true
});

const dotsA = new THREE.Points(geoA, matDotA);
const dotsB = new THREE.Points(geoB, matDotB);
dotsA.frustumCulled = false;
dotsB.frustumCulled = false;
dotsA.renderOrder = 4;
dotsB.renderOrder = 4;
scene.add(dotsA, dotsB);

/* ============================================================
   轨迹头部光球
   ============================================================ */
const headA = new THREE.Sprite(new THREE.SpriteMaterial({
  map: SPRITE, color: 0xffe27a,
  transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
headA.scale.set(1.15, 1.15, 1);
headA.renderOrder = 8;
scene.add(headA);

const headB = new THREE.Sprite(new THREE.SpriteMaterial({
  map: SPRITE, color: 0x8fe8ff,
  transparent: true, opacity: 0.88,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
headB.scale.set(1.0, 1.0, 1);
headB.renderOrder = 8;
scene.add(headB);

/* ---- 起点标记 ---- */
const originMark = new THREE.Sprite(new THREE.SpriteMaterial({
  map: SPRITE, color: 0xffffff,
  transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
originMark.scale.set(0.9, 0.9, 1);
originMark.position.set(1 * SCALE, 1 * SCALE - ZOFF, 1 * SCALE);
scene.add(originMark);

/* ============================================================
   发光粒子尾迹
   ============================================================ */
const PART_N = 900;
const pPos  = new Float32Array(PART_N * 3);
const pCol  = new Float32Array(PART_N * 3);
const pBase = new Float32Array(PART_N * 3);
const pVel  = new Float32Array(PART_N * 3);
const pLife = new Float32Array(PART_N);
const pMax  = new Float32Array(PART_N);

for (let i = 0; i < PART_N; i++){
  pLife[i] = 0;
  pPos[i*3 + 1] = -9999;
}

const partGeo = new THREE.BufferGeometry();
partGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
partGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));

const partMat = new THREE.PointsMaterial({
  size: 0.20, map: SPRITE, vertexColors: true,
  transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false,
  sizeAttenuation: true
});

const partPoints = new THREE.Points(partGeo, partMat);
partPoints.frustumCulled = false;
partPoints.renderOrder = 6;
scene.add(partPoints);

function updateParticles(dt, headIdx, active){
  const srcA = trajA, srcB = trajB;

  for (let j = 0; j < PART_N; j++){
    const j3 = j * 3;

    if (pLife[j] <= 0){
      if (!active || Math.random() > 0.021){
        pCol[j3] = pCol[j3 + 1] = pCol[j3 + 2] = 0;
        pPos[j3 + 1] = -9999;
        continue;
      }
      const onA = Math.random() < 0.5;
      const src  = onA ? srcA : srcB;
      const base = onA ? COL_A : COL_B;
      const h3   = headIdx * 3;

      pPos[j3    ] = src[h3    ] + (Math.random() - 0.5) * 0.30;
      pPos[j3 + 1] = src[h3 + 1] + (Math.random() - 0.5) * 0.30;
      pPos[j3 + 2] = src[h3 + 2] + (Math.random() - 0.5) * 0.30;

      pVel[j3    ] = (Math.random() - 0.5) * 0.55;
      pVel[j3 + 1] = (Math.random() - 0.5) * 0.55 + 0.18;
      pVel[j3 + 2] = (Math.random() - 0.5) * 0.55;

      pMax[j]  = 0.55 + Math.random() * 0.95;
      pLife[j] = pMax[j];

      pBase[j3    ] = base.r;
      pBase[j3 + 1] = base.g;
      pBase[j3 + 2] = base.b;

      pCol[j3    ] = base.r;
      pCol[j3 + 1] = base.g;
      pCol[j3 + 2] = base.b;
    } else {
      pLife[j] -= dt;
      pPos[j3    ] += pVel[j3    ] * dt;
      pPos[j3 + 1] += pVel[j3 + 1] * dt;
      pPos[j3 + 2] += pVel[j3 + 2] * dt;

      const lf = Math.max(0, pLife[j] / pMax[j]);
      const b  = lf * lf * 0.95;

      pCol[j3    ] = pBase[j3    ] * b;
      pCol[j3 + 1] = pBase[j3 + 1] * b;
      pCol[j3 + 2] = pBase[j3 + 2] * b;
    }
  }

  partGeo.attributes.position.needsUpdate = true;
  partGeo.attributes.color.needsUpdate = true;
}

/* ============================================================
   工具
   ============================================================ */
function smoothstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/* ============================================================
   顶部文字
   ============================================================ */
const FULL_TEXT = '洛伦兹吸引子展现确定系统中的内在随机性——初始微小差异导致结果天壤之别，启示蝴蝶效应：微小变化可在长期中放大为巨变。';
const topTextEl = document.getElementById('topText');
let lastShown = '';

function updateTopText(animT){
  const prog  = smoothstep(0.8, 25.5, animT);
  const n     = Math.floor(prog * FULL_TEXT.length);
  const shown = FULL_TEXT.slice(0, n);
  if (shown !== lastShown){
    topTextEl.textContent = shown;
    lastShown = shown;
  }
}

/* ============================================================
   界面交互
   ============================================================ */
const sRhoEl   = document.getElementById('sRho');
const vRhoEl   = document.getElementById('vRho');
const resetBtn = document.getElementById('resetBtn');

sRhoEl.addEventListener('input', e => {
  pendingRho = parseFloat(e.target.value);
  vRhoEl.textContent = pendingRho.toFixed(1);
  needsRebuild = true;
  animT = 0;
  resetParticles();
});

resetBtn.addEventListener('click', () => {
  animT = 0;
  needsRebuild = true;
  resetParticles();
});

function resetParticles(){
  for (let i = 0; i < PART_N; i++){
    pLife[i] = 0;
    pPos[i*3 + 1] = -9999;
    pCol[i*3] = pCol[i*3+1] = pCol[i*3+2] = 0;
  }
  partGeo.attributes.position.needsUpdate = true;
  partGeo.attributes.color.needsUpdate = true;
}

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let animT = 0;

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  /* ---- 参数变更时重建 ---- */
  if (needsRebuild){
    RHO = pendingRho;
    rebuildTrajectories();
    needsRebuild = false;
    animT = 0;
  }

  animT += dt;
  if (animT >= DURATION) animT -= DURATION;

  /* ---- 生长进度 ---- */
  const growProg = smoothstep(0.25, 26.5, animT);
  const headIdx  = Math.min(N - 1, Math.floor(growProg * (N - 1)));
  const visible  = headIdx + 1;

  /* ---- 整体淡入淡出 ---- */
  const fadeIn  = smoothstep(0.0, 1.2, animT);
  const fadeOut = 1 - smoothstep(27.0, 29.8, animT);
  const globalOp = fadeIn * fadeOut;

  lineA.material.opacity = 0.72 * globalOp;
  lineB.material.opacity = 0.66 * globalOp;
  matDotA.opacity = 0.55 * globalOp;
  matDotB.opacity = 0.48 * globalOp;

  geoA.setDrawRange(0, visible);
  geoB.setDrawRange(0, visible);

  /* ---- 头部光球 ---- */
  const h3 = headIdx * 3;

  headA.position.set(trajA[h3], trajA[h3 + 1], trajA[h3 + 2]);
  headB.position.set(trajB[h3], trajB[h3 + 1], trajB[h3 + 2]);

  const pulse = 1 + 0.22 * Math.sin(animT * 8.5);
  headA.scale.set(1.15 * pulse, 1.15 * pulse, 1);
  headB.scale.set(1.0 * pulse, 1.0 * pulse, 1);

  headA.material.opacity = 0.95 * globalOp;
  headB.material.opacity = 0.88 * globalOp;

  /* ---- 起点标记脉动 ---- */
  originMark.material.opacity = 0.35 + 0.5 * Math.abs(Math.sin(animT * 2.4));
  originMark.scale.setScalar(0.65 + 0.35 * Math.sin(animT * 2.4));

  /* ---- 粒子 ---- */
  const active = (animT > 0.8 && animT < 27.5);
  updateParticles(dt, headIdx, active);

  /* ---- 文字 ---- */
  updateTopText(animT);

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   启动
   ============================================================ */
rebuildTrajectories();
animate();

/* ============================================================
   自适应
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
