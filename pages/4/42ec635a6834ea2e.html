<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悬挂控制臂 · 拓扑优化演示 (SIMP/BESO)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #e2f0ff; --ink-dim: #8ba8c7;
    --line: rgba(110, 180, 255, .25); --accent: #6fe3ff;
    --panel: rgba(9, 25, 48, .78);
  }
  html, body { height: 100%; overflow: hidden; background: #030c18; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  .app {
    position: relative; width: 100vw; height: 100vh;
    background: radial-gradient(ellipse at 50% 35%, #0d2340 0%, #06152b 50%, #030c18 100%);
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(90, 170, 255, .04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90, 170, 255, .04) 1px, transparent 1px);
    background-size: 30px 30px; pointer-events: none; z-index: 0;
  }
  .grid-bg::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 190, 255, .08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 190, 255, .08) 1px, transparent 1px);
    background-size: 150px 150px;
  }
  #matLayer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

  .title-bar {
    position: absolute; top: 22px; left: 0; width: 100%;
    text-align: center; pointer-events: none; z-index: 5;
  }
  .title-bar h1 {
    font-size: clamp(13px, 1.5vw, 19px); font-weight: 600;
    letter-spacing: 6px; color: #eaf6ff;
    text-shadow: 0 0 22px rgba(110, 200, 255, .65);
  }
  .title-bar h2 {
    margin-top: 6px; font-size: clamp(10px, .95vw, 12px);
    font-weight: 400; letter-spacing: 4px; color: var(--ink-dim);
  }

  .hud { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .panel {
    position: absolute; padding: 15px 18px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 30px rgba(0, 50, 120, .4), inset 0 0 26px rgba(60, 140, 255, .05);
    font-size: 12.5px; letter-spacing: .6px;
  }
  .panel::before, .panel::after {
    content: ''; position: absolute; width: 10px; height: 10px;
    border: 1px solid rgba(120, 210, 255, .75);
  }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .panel::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .steps-panel {
    left: clamp(16px, 3vw, 44px); top: 50%;
    transform: translateY(-50%); min-width: 220px;
  }
  .panel-title {
    font-size: 10px; letter-spacing: 3px; color: #5d90c4;
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px dashed rgba(110, 180, 255, .22);
  }
  .step {
    display: flex; align-items: center; gap: 11px; padding: 7px 0;
    opacity: .32; transition: opacity .45s, color .45s, transform .45s;
  }
  .step .dot {
    width: 8px; height: 8px; flex: 0 0 auto;
    border: 1px solid currentColor; transform: rotate(45deg);
    transition: all .45s;
  }
  .step.active {
    opacity: 1; color: var(--accent); transform: translateX(4px);
    text-shadow: 0 0 14px rgba(110, 225, 255, .7);
  }
  .step.active .dot {
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent), 0 0 24px rgba(110, 225, 255, .5);
  }
  .step.done { opacity: .62; color: #7fb6e0; }
  .step.done .dot { background: rgba(127, 182, 224, .55); }

  .stats-panel {
    right: clamp(16px, 3vw, 44px); bottom: clamp(16px, 4vh, 46px);
    min-width: 272px;
  }
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 0; color: var(--ink-dim);
  }
  .row b {
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 15px; font-weight: 600; color: #d8eeff; letter-spacing: 1px;
  }
  .row.hl {
    margin-top: 8px; padding-top: 11px;
    border-top: 1px dashed rgba(110, 180, 255, .22);
    color: #9fd8ff; font-size: 13px;
  }
  .row.hl b {
    font-size: 24px; color: #5cffb1; transition: text-shadow .5s;
  }
  .row.hl b.lit {
    text-shadow: 0 0 16px rgba(92, 255, 177, .95), 0 0 34px rgba(92, 255, 177, .5);
  }
  .bars { margin-top: 13px; }
  .bar-line { margin-bottom: 9px; }
  .bar-label {
    display: flex; justify-content: space-between; font-size: 10px;
    color: #5d90c4; letter-spacing: 1.6px; margin-bottom: 5px;
  }
  .bar-track {
    height: 8px; background: rgba(80, 150, 220, .12);
    border: 1px solid rgba(110, 180, 255, .2); position: relative; overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 0%;
    transition: width 1.5s cubic-bezier(.25, .8, .3, 1);
    box-shadow: 0 0 14px currentColor;
  }
  #barBefore { width: 100%; background: linear-gradient(90deg, #2a6fb8, #6fa8dc); color: #6fa8dc; }
  #barAfter  { background: linear-gradient(90deg, #1fbf7a, #5cffb1); color: #5cffb1; }

  .legend-panel {
    right: clamp(16px, 3vw, 44px); top: clamp(96px, 16vh, 150px);
    padding: 12px 16px;
    transition: opacity .8s;
  }
  .legend-panel.hide { opacity: 0; }
  .legend-bar {
    width: 168px; height: 10px; margin-top: 9px;
    border: 1px solid rgba(110, 180, 255, .3);
    background: linear-gradient(90deg,
      #193cff 0%, #00b4f0 16%, #14e15a 34%,
      #ffe614 52%, #ff6e00 72%, #ff281e 88%, #dc0050 100%);
    box-shadow: 0 0 18px rgba(80, 160, 255, .3);
  }
  .legend-scale {
    display: flex; justify-content: space-between; width: 168px;
    margin-top: 6px; font-size: 9.5px; letter-spacing: 1.2px; color: #5d90c4;
  }
  .algo-badge {
    position: absolute; left: clamp(16px, 3vw, 44px); bottom: clamp(16px, 4vh, 46px);
    padding: 9px 14px; border: 1px solid rgba(110, 200, 255, .3);
    background: rgba(9, 30, 58, .6); font-size: 10.5px;
    letter-spacing: 2.2px; color: #6fa8dc; backdrop-filter: blur(6px);
  }
  .algo-badge b { color: #8fd0ff; font-weight: 600; }

  .progress-bar {
    position: absolute; left: 50%; bottom: 4%;
    transform: translateX(-50%); width: min(480px, 60vw); height: 3px;
    background: rgba(80, 150, 220, .15); z-index: 8; overflow: hidden;
    opacity: 0; transition: opacity .6s;
  }
  .progress-bar.show { opacity: 1; }
  .progress-inner {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2a6fb8, #6fe3ff);
    box-shadow: 0 0 12px rgba(110, 225, 255, .8);
    transition: width .3s linear;
  }

  .start-btn {
    position: absolute; left: 50%; bottom: 7%;
    transform: translateX(-50%) translateY(14px);
    padding: 15px 46px; font-family: inherit; font-size: 14px;
    letter-spacing: 5px; color: #d5f1ff;
    background: rgba(12, 40, 74, .85);
    border: 1px solid rgba(110, 210, 255, .55);
    cursor: pointer; z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity .45s, transform .45s, box-shadow .3s, background .3s;
    box-shadow: 0 0 24px rgba(60, 160, 255, .28), inset 0 0 24px rgba(60, 160, 255, .1);
    backdrop-filter: blur(6px);
  }
  .start-btn.show {
    opacity: 1; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .start-btn:hover {
    background: rgba(20, 62, 110, .95);
    box-shadow: 0 0 40px rgba(80, 200, 255, .55), inset 0 0 30px rgba(80, 200, 255, .18);
    color: #fff;
  }
  .start-btn:active { transform: translateX(-50%) translateY(2px) scale(.98); }

  #armStroke {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    transition: stroke-dashoffset 1.6s cubic-bezier(.45, .05, .3, 1), opacity 1s;
    filter: drop-shadow(0 0 6px rgba(120, 200, 255, .55));
    opacity: .40;
  }
  #armStroke.draw { stroke-dashoffset: 0; }
  #armStroke.dim { opacity: .08; }
  #flashPath { opacity: 0; pointer-events: none; }
  #flashPath.flash { animation: flashPulse .9s ease-out; }
  @keyframes flashPulse {
    0% { opacity: 0; } 25% { opacity: .4; } 100% { opacity: 0; }
  }

  #loadGroup .loadpath {
    fill: none; stroke: #86dcff; stroke-width: 2.4; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
    transition: stroke-dashoffset 1.15s cubic-bezier(.4, .05, .35, 1), opacity .9s;
    filter: drop-shadow(0 0 6px rgba(110, 220, 255, .8));
  }
  #loadGroup.on .loadpath { opacity: 1; stroke-dashoffset: 0; }
  #loadGroup.on .loadpath:nth-child(1) { transition-delay: 0s; }
  #loadGroup.on .loadpath:nth-child(2) { transition-delay: .28s; }
  #loadGroup.on .loadpath:nth-child(3) { transition-delay: .28s; }
  .pulsepath {
    fill: none; stroke: #ffffff; stroke-width: 3.2; stroke-linecap: round;
    stroke-dasharray: 0.018 0.09; stroke-dashoffset: 0; opacity: 0;
    transition: opacity .8s;
    filter: drop-shadow(0 0 8px #7fe4ff) drop-shadow(0 0 16px rgba(110, 220, 255, .7));
    animation: flowDash 1.15s linear infinite;
  }
  @keyframes flowDash { to { stroke-dashoffset: -0.108; } }
  #pulseGroup.on .pulsepath { opacity: .95; }
  #pulseGroup.on .pulsepath:nth-child(2) { animation-delay: .18s; }
  #pulseGroup.on .pulsepath:nth-child(3) { animation-delay: .18s; }
  .ripple {
    fill: none; stroke: #7fe4ff; stroke-width: 2;
    transform-box: fill-box; transform-origin: center; opacity: 0;
  }
  #rippleGroup.on .ripple { animation: rippleOut 1.8s ease-out infinite; }
  #rippleGroup.on .ripple:nth-child(2) { animation-delay: .6s; }
  #rippleGroup.on .ripple:nth-child(3) { animation-delay: 1.2s; }
  @keyframes rippleOut {
    0% { transform: scale(.35); opacity: .95; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  .tag {
    font-family: "Consolas", "SF Mono", monospace; font-size: 11px;
    letter-spacing: 1.6px; fill: #7fb6e0; opacity: 0;
    transition: opacity .9s;
  }
  .tag.on { opacity: .95; }
  .joint-ring {
    fill: none; stroke: #8fd0ff; stroke-width: 1.4; opacity: 0;
    transition: opacity .8s;
  }
  .joint-ring.on { opacity: .85; }

  @media (max-width: 900px) {
    .steps-panel { left: 12px; padding: 11px 13px; min-width: 0; font-size: 11px; }
    .stats-panel { right: 12px; bottom: 12px; min-width: 206px; padding: 11px 13px; }
    .legend-panel { display: none; }
    .algo-badge { display: none; }
    .row.hl b { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="grid-bg"></div>
  <canvas id="matLayer"></canvas>

  <svg id="scene" viewBox="0 0 820 520" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="ballGrad" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="30%" stop-color="#c0c8d4"/>
        <stop offset="70%" stop-color="#6a7482"/>
        <stop offset="100%" stop-color="#2d3540"/>
      </radialGradient>
      <radialGradient id="ballGrad2" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="30%" stop-color="#c0c8d4"/>
        <stop offset="70%" stop-color="#6a7482"/>
        <stop offset="100%" stop-color="#2d3540"/>
      </radialGradient>
    </defs>

    <path id="flashPath"
          d="M 185 85 C 250 90 300 120 360 150 C 440 190 540 215 620 225
             A 40 40 0 0 1 620 275 C 540 285 440 310 360 350
             C 300 380 250 410 185 415 A 55 55 0 0 1 130 360
             L 130 140 A 55 55 0 0 1 185 85 Z"
          fill="#a8e0ff"/>

    <path id="armStroke"
          pathLength="1"
          d="M 185 85 C 250 90 300 120 360 150 C 440 190 540 215 620 225
             A 40 40 0 0 1 620 275 C 540 285 440 310 360 350
             C 300 380 250 410 185 415 A 55 55 0 0 1 130 360
             L 130 140 A 55 55 0 0 1 185 85 Z"
          fill="none" stroke="#d8efff" stroke-width="1.5"/>

    <g stroke="#8ba8c7" fill="none" stroke-width="2.5" opacity="0.5">
      <path d="M 60 140 L 80 140 L 80 155 L 95 125 L 110 155 L 125 125 L 140 155 L 155 125 L 165 140 L 185 140"/>
      <path d="M 640 270 L 660 270 L 660 285 L 675 255 L 690 285 L 705 255 L 720 285 L 735 255 L 745 270 L 760 270"/>
    </g>

    <g id="joints">
      <circle class="joint-ring" cx="185" cy="140" r="35" stroke-dasharray="5 4"/>
      <circle class="joint-ring" cx="185" cy="140" r="13"/>
      <circle cx="185" cy="140" r="7" fill="url(#ballGrad)"/>
      <circle class="joint-ring" cx="185" cy="360" r="35" stroke-dasharray="5 4"/>
      <circle class="joint-ring" cx="185" cy="360" r="13"/>
      <circle cx="185" cy="360" r="7" fill="url(#ballGrad2)"/>
      <circle class="joint-ring" cx="620" cy="250" r="25" stroke-dasharray="5 4"/>
      <circle class="joint-ring" cx="620" cy="250" r="10"/>
      <circle cx="620" cy="250" r="6" fill="url(#ballGrad)"/>
    </g>

    <g id="rippleGroup">
      <circle class="ripple" cx="620" cy="250" r="30"/>
      <circle class="ripple" cx="620" cy="250" r="30"/>
      <circle class="ripple" cx="620" cy="250" r="30"/>
    </g>

    <g id="loadGroup">
      <path class="loadpath" pathLength="1" d="M 782 250 L 668 250"/>
      <path class="loadpath" pathLength="1"
            d="M 620 250 C 540 234 460 204 380 179 C 320 159 255 145 200 140"/>
      <path class="loadpath" pathLength="1"
            d="M 620 250 C 540 266 460 296 380 321 C 320 341 255 355 200 360"/>
    </g>
    <g id="pulseGroup">
      <path class="pulsepath" pathLength="1" d="M 782 250 L 668 250"/>
      <path class="pulsepath" pathLength="1"
            d="M 620 250 C 540 234 460 204 380 179 C 320 159 255 145 200 140"/>
      <path class="pulsepath" pathLength="1"
            d="M 620 250 C 540 266 460 296 380 321 C 320 341 255 355 200 360"/>
    </g>

    <text class="tag" id="tagImpact" x="700" y="228">路面冲击</text>
    <text class="tag" id="tagBush" x="96" y="118">衬套 A</text>
    <text class="tag" id="tagBush2" x="96" y="392">衬套 B</text>
    <text class="tag" id="tagBall" x="648" y="302">球头销</text>
    <text class="tag" id="tagOpt" x="140" y="478">拓扑优化 · 低应力单元剥离</text>
  </svg>

  <div class="hud">
    <div class="panel steps-panel">
      <div class="panel-title">ANALYSIS SEQUENCE</div>
      <div class="step" data-step="1"><span class="dot"></span>载荷传递路径</div>
      <div class="step" data-step="2"><span class="dot"></span>拓扑优化迭代</div>
      <div class="step" data-step="3"><span class="dot"></span>轻量化结果验证</div>
    </div>
    <div class="panel legend-panel" id="legendPanel">
      <div class="panel-title">VON MISES STRESS</div>
      <div class="legend-bar"></div>
      <div class="legend-scale"><span>低应力</span><span>高应力</span></div>
    </div>
    <div class="algo-badge">ALGORITHM · <b>SIMP / BESO</b></div>
    <div class="panel stats-panel">
      <div class="panel-title">OPTIMIZATION RESULT</div>
      <div class="row"><span>迭代次数</span><b id="iterVal">00</b></div>
      <div class="row"><span>粒子总数</span><b id="cellTotal">—</b></div>
      <div class="row"><span>已剥离粒子</span><b id="cellRemoved">0</b></div>
      <div class="row"><span>原始质量</span><b id="massBefore">8.42 kg</b></div>
      <div class="row"><span>优化质量</span><b id="massAfter">—</b></div>
      <div class="bars">
        <div class="bar-line">
          <div class="bar-label"><span>BEFORE</span><span>8.42 kg</span></div>
          <div class="bar-track"><div class="bar-fill" id="barBefore"></div></div>
        </div>
        <div class="bar-line">
          <div class="bar-label"><span>AFTER</span><span>4.73 kg</span></div>
          <div class="bar-track"><div class="bar-fill" id="barAfter"></div></div>
        </div>
      </div>
      <div class="row hl"><span>重量减轻</span><b id="massCut">—</b></div>
    </div>
  </div>

  <div class="progress-bar" id="progressBar">
    <div class="progress-inner" id="progressInner"></div>
  </div>
  <button class="start-btn show" id="startBtn">▶ 开始演示</button>
</div>

<script>
(() => {
  'use strict';
  const $  = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  const VB_W = 820, VB_H = 520;
  const ARM_D = "M 185 85 C 250 90 300 120 360 150 C 440 190 540 215 620 225 " +
                "A 40 40 0 0 1 620 275 C 540 285 440 310 360 350 " +
                "C 300 380 250 410 185 415 A 55 55 0 0 1 130 360 " +
                "L 130 140 A 55 55 0 0 1 185 85 Z";

  const REMOVE_RATIO = 0.575;
  /* ★ 迭代次数从 12 增加到 20，速度从 2800ms 加快到 1400ms ★ */
  const ITERATIONS = 20;
  const ITER_INTERVAL_MS = 1400;

  const canvas    = $('#matLayer');
  const ctx       = canvas.getContext('2d', { alpha: true });
  const armStroke = $('#armStroke');
  const flashPath = $('#flashPath');
  const loadGroup = $('#loadGroup');
  const pulseGrp  = $('#pulseGroup');
  const rippleGrp = $('#rippleGroup');
  const tags      = $$('.tag');
  const rings     = $$('.joint-ring');
  const steps     = $$('.step');
  const startBtn  = $('#startBtn');
  const progressBar   = $('#progressBar');
  const progressInner = $('#progressInner');
  const legendPanel   = $('#legendPanel');

  const iterVal       = $('#iterVal');
  const cellTotalEl   = $('#cellTotal');
  const cellRemovedEl = $('#cellRemoved');
  const massAfter     = $('#massAfter');
  const massCut       = $('#massCut');
  const barAfter      = $('#barAfter');

  /* ==========================================================
     音频引擎
     ========================================================== */
  let actx = null, master = null, noiseBuf = null;
  function initAudio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.5;
    master.connect(actx.destination);
    const len = Math.floor(actx.sampleRate * 0.4);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function gearBurst(count = 3, delay = 0, baseFreq = 900) {
    if (!actx) return;
    const t0 = actx.currentTime + delay;
    for (let i = 0; i < count; i++) {
      const t = t0 + i * 0.048;
      const src = actx.createBufferSource();
      src.buffer = noiseBuf;
      const bp = actx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = baseFreq + Math.random() * 700; bp.Q.value = 9;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.13, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.052);
      src.connect(bp).connect(g).connect(master);
      src.start(t); src.stop(t + 0.07);
    }
  }
  function gearWhirr(dur = 0.55) {
    if (!actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(58, t);
    o.frequency.linearRampToValueAtTime(74, t + dur);
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.04, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp).connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function metalClang() {
    if (!actx) return;
    const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = noiseBuf;
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(0.3, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    src.connect(hp).connect(ng).connect(master);
    src.start(t); src.stop(t + 0.4);
    [742, 1129, 1621, 2287, 3140].forEach((f, i) => {
      const o = actx.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.985, t + 1.2);
      const g = actx.createGain();
      const amp = 0.13 / (i + 1);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1 + i * 0.22);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + 2.2);
    });
  }

  /* ==========================================================
     应力场
     ========================================================== */
  function distToSeg(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = ((px - x1) * dx + (py - y1) * dy) / len2;
    t = clamp(t, 0, 1);
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }
  const SG = 32;
  function stressAt(x, y) {
    const dAC = distToSeg(x, y, 195, 148, 612, 250);
    const dBC = distToSeg(x, y, 195, 352, 612, 250);
    const dC  = Math.hypot(x - 620, y - 250);
    const dA  = Math.hypot(x - 185, y - 140);
    const dB  = Math.hypot(x - 185, y - 360);
    let s = 0;
    s += Math.exp(-(dAC * dAC) / (2 * SG * SG));
    s += Math.exp(-(dBC * dBC) / (2 * SG * SG));
    s += 0.85 * Math.exp(-(dC * dC) / (2 * 55 * 55));
    s += 0.60 * Math.exp(-(dA * dA) / (2 * 48 * 48));
    s += 0.60 * Math.exp(-(dB * dB) / (2 * 48 * 48));
    return s;
  }
  const S_MAX = 1.65;

  /* ==========================================================
     热力图色阶
     ========================================================== */
  const STOPS = [
    [0.00, [ 25,  60, 255]],
    [0.16, [  0, 180, 240]],
    [0.34, [ 20, 225,  90]],
    [0.52, [255, 230,  20]],
    [0.72, [255, 110,   0]],
    [0.88, [255,  40,  30]],
    [1.00, [220,   0,  80]],
  ];
  function heatRGB(t) {
    t = clamp(t, 0, 1);
    for (let i = 0; i < STOPS.length - 1; i++) {
      const a = STOPS[i], b = STOPS[i + 1];
      if (t <= b[0]) {
        const k = (t - a[0]) / (b[0] - a[0]);
        return [
          Math.round(a[1][0] + (b[1][0] - a[1][0]) * k),
          Math.round(a[1][1] + (b[1][1] - a[1][1]) * k),
          Math.round(a[1][2] + (b[1][2] - a[1][2]) * k),
        ];
      }
    }
    return STOPS[STOPS.length - 1][1];
  }
  const HEAT_RGB = [];
  for (let i = 0; i < 64; i++) HEAT_RGB.push(heatRGB(i / 63));

  /* ==========================================================
     Canvas 尺寸
     ========================================================== */
  let W = 0, H = 0, dpr = 1, viewScale = 1, offX = 0, offY = 0;

  function resize() {
    dpr = 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W;
    canvas.height = H;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    viewScale = Math.min(W / VB_W, H / VB_H);
    offX = (W - VB_W * viewScale) / 2;
    offY = (H - VB_H * viewScale) / 2;
  }

  /* ==========================================================
     金属层预渲染
     ========================================================== */
  const SOLID_SS = 2;
  const solidCanvas = document.createElement('canvas');
  solidCanvas.width  = VB_W * SOLID_SS;
  solidCanvas.height = VB_H * SOLID_SS;
  const sctx = solidCanvas.getContext('2d', { willReadFrequently: true });
  const ARM_PATH = new Path2D(ARM_D);

  function buildSolidLayer() {
    sctx.setTransform(SOLID_SS, 0, 0, SOLID_SS, 0, 0);
    sctx.clearRect(0, 0, VB_W, VB_H);
    sctx.save();
    sctx.clip(ARM_PATH);

    const grad = sctx.createLinearGradient(120, 60, 680, 440);
    grad.addColorStop(0,    '#6d7887');
    grad.addColorStop(0.18, '#aab5c5');
    grad.addColorStop(0.38, '#e4ecf5');
    grad.addColorStop(0.52, '#f0f6fc');
    grad.addColorStop(0.68, '#b6c2d0');
    grad.addColorStop(0.85, '#7a879a');
    grad.addColorStop(1,    '#4a5567');
    sctx.fillStyle = grad;
    sctx.fillRect(0, 0, VB_W, VB_H);

    const hlGrad = sctx.createLinearGradient(0, 90, 0, 200);
    hlGrad.addColorStop(0, 'rgba(255,255,255,0)');
    hlGrad.addColorStop(0.5, 'rgba(255,255,255,0.38)');
    hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
    sctx.fillStyle = hlGrad;
    sctx.fillRect(0, 80, VB_W, 130);

    sctx.strokeStyle = 'rgba(255,255,255,0.55)';
    sctx.lineWidth = 3;
    sctx.beginPath();
    sctx.moveTo(190, 100);
    sctx.bezierCurveTo(280, 110, 400, 155, 520, 195);
    sctx.stroke();
    sctx.strokeStyle = 'rgba(255,255,255,0.28)';
    sctx.lineWidth = 1.5;
    sctx.beginPath();
    sctx.moveTo(190, 110);
    sctx.bezierCurveTo(280, 122, 400, 168, 520, 208);
    sctx.stroke();

    const darkGrad = sctx.createLinearGradient(0, 320, 0, 470);
    darkGrad.addColorStop(0, 'rgba(0,0,0,0)');
    darkGrad.addColorStop(0.6, 'rgba(0,0,0,0.16)');
    darkGrad.addColorStop(1, 'rgba(0,0,0,0.45)');
    sctx.fillStyle = darkGrad;
    sctx.fillRect(0, 320, VB_W, 150);

    sctx.strokeStyle = 'rgba(255,255,255,0.22)';
    sctx.lineWidth = 2;
    sctx.beginPath();
    sctx.moveTo(200, 400);
    sctx.bezierCurveTo(300, 385, 450, 345, 590, 285);
    sctx.stroke();

    sctx.restore();

    sctx.strokeStyle = 'rgba(255,255,255,0.7)';
    sctx.lineWidth = 1.4;
    sctx.beginPath();
    sctx.moveTo(188, 92);
    sctx.bezierCurveTo(252, 96, 302, 126, 362, 156);
    sctx.bezierCurveTo(442, 196, 540, 221, 612, 231);
    sctx.stroke();

    sctx.strokeStyle = 'rgba(30, 45, 70, 0.85)';
    sctx.lineWidth = 1.5;
    sctx.stroke(ARM_PATH);
  }

  /* ==========================================================
     1 像素粒子化 —— 带多部位同时剥离的优先级
     ========================================================== */
  let pixels = [];
  let imageData = null;
  let buf32 = null;
  const GLOW_CYAN  = [111, 227, 255];
  const GLOW_GREEN = [ 92, 255, 177];

  function buildPixels() {
    /* 1. 掩码 */
    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = W; maskCanvas.height = H;
    const mctx = maskCanvas.getContext('2d', { willReadFrequently: true });
    mctx.save();
    mctx.translate(offX, offY);
    mctx.scale(viewScale, viewScale);
    mctx.fillStyle = '#fff';
    mctx.fill(ARM_PATH);
    mctx.restore();
    const maskData = mctx.getImageData(0, 0, W, H).data;

    /* 2. 金属层数据 */
    const solidData = sctx.getImageData(0, 0, solidCanvas.width, solidCanvas.height).data;

    /* 3. 遍历所有像素 */
    pixels = [];
    const invScale = 1 / viewScale;
    for (let py = 0; py < H; py++) {
      const rowBase = py * W;
      for (let px = 0; px < W; px++) {
        if (maskData[(rowBase + px) * 4 + 3] < 128) continue;
        const sx = (px - offX) * invScale;
        const sy = (py - offY) * invScale;
        const s = stressAt(sx, sy);
        const t = clamp(s / S_MAX, 0, 1);
        const tIdx = Math.min(63, Math.max(0, Math.round(t * 63)));
        const ssx = Math.round(sx * SOLID_SS);
        const ssy = Math.round(sy * SOLID_SS);
        const si = (ssy * solidCanvas.width + ssx) * 4;
        pixels.push({
          px, py,
          mr: solidData[si], mg: solidData[si + 1], mb: solidData[si + 2],
          tIdx, s,
          seedDist: 0,
          priority: 0,
          life: 1, rmStart: Infinity
        });
      }
    }

    /* ================================================================
       ★ 关键：多部位同时剥离的优先级计算
       1. 识别低应力像素，从中挑选若干彼此分开的“剥离种子”
       2. 每个像素计算到最近种子的距离
       3. 优先级 = 应力权重 + 到种子距离权重
          → 低应力且靠近种子的像素优先剥离
          → 多个种子同时向外侵蚀，形成多个剥离中心
       ================================================================ */
    pixels.sort((a, b) => a.s - b.s);

    const lowIdx = Math.floor(pixels.length * 0.40);
    const lowPixels = pixels.slice(0, lowIdx);

    /* 贪心挑选 14 个彼此分开的种子 */
    const seeds = [];
    const minSeedDist = 170;
    const shuffled = lowPixels.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < shuffled.length; i++) {
      const c = shuffled[i];
      let ok = true;
      for (let k = 0; k < seeds.length; k++) {
        const s = seeds[k];
        if (Math.hypot(c.px - s.px, c.py - s.py) < minSeedDist) { ok = false; break; }
      }
      if (ok) seeds.push(c);
      if (seeds.length >= 14) break;
    }

    /* 计算到最近种子的距离 */
    let maxDist = 1;
    for (let i = 0; i < pixels.length; i++) {
      const p = pixels[i];
      let minD = Infinity;
      for (let k = 0; k < seeds.length; k++) {
        const s = seeds[k];
        const dx = p.px - s.px, dy = p.py - s.py;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < minD) minD = d;
      }
      p.seedDist = minD;
      if (minD > maxDist) maxDist = minD;
    }

    /* 优先级：应力为主，种子距离为辅 */
    for (let i = 0; i < pixels.length; i++) {
      const p = pixels[i];
      p.priority = (p.s / S_MAX) * 1.0 + (p.seedDist / maxDist) * 0.40;
    }

    pixels.sort((a, b) => a.priority - b.priority);

    imageData = ctx.createImageData(W, H);
    buf32 = new Uint32Array(imageData.data.buffer);
    cellTotalEl.textContent = pixels.length;
  }

  /* ==========================================================
     渲染状态
     ========================================================== */
  let heatAlpha  = 1, heatTarget  = 1;
  let finishGlow = 0, finishTarget = 0;

  /* ==========================================================
     渲染循环
     ========================================================== */
  let lastT = performance.now();

  function render(now) {
    const dt = Math.min(now - lastT, 64);
    lastT = now;
    heatAlpha  += (heatTarget  - heatAlpha)  * (1 - Math.exp(-dt / 220));
    finishGlow += (finishTarget - finishGlow) * (1 - Math.exp(-dt / 260));

    buf32.fill(0);

    const heatW  = Math.min(1, heatAlpha) * 0.88;
    const iHeatW = 1 - heatW;

    const glowActive = finishGlow > 0.01;
    const gf = finishGlow * 0.32;

    const sweep = (now * 0.00035) % 1;
    const sweepX = -200 + sweep * (W + 400);

    const len = pixels.length;
    const Wlocal = W;

    for (let i = 0; i < len; i++) {
      const p = pixels[i];

      if (p.rmStart !== Infinity) {
        const e = now - p.rmStart;
        if (e > 0) {
          const l = 1 - e / 300;
          p.life = l > 0 ? l : 0;
        }
      }
      if (p.life <= 0) continue;

      const ti = p.tIdx;
      const hc = HEAT_RGB[ti];

      /* 应力热力图完全淡出后，纯金属色 */
      let r, g, b;
      if (heatAlpha < 0.005) {
        r = p.mr; g = p.mg; b = p.mb;
      } else {
        r = p.mr * iHeatW + hc[0] * heatW;
        g = p.mg * iHeatW + hc[1] * heatW;
        b = p.mb * iHeatW + hc[2] * heatW;
      }

      if (glowActive && ti > 42) {
        const gc = ti > 52 ? GLOW_GREEN : GLOW_CYAN;
        r = r * (1 - gf) + gc[0] * gf;
        g = g * (1 - gf) + gc[1] * gf;
        b = b * (1 - gf) + gc[2] * gf;
      }

      if (glowActive) {
        const dx = p.px - sweepX;
        if (dx > -140 && dx < 140) {
          const hf = (1 - Math.abs(dx) / 140) * finishGlow * 0.55;
          r += (255 - r) * hf;
          g += (255 - g) * hf;
          b += (255 - b) * hf;
        }
      }

      const a = (p.life * 255) | 0;
      buf32[p.py * Wlocal + p.px] =
        (a << 24) |
        ((b & 0xff) << 16) |
        ((g & 0xff) << 8) |
        (r & 0xff);
    }

    ctx.putImageData(imageData, 0, 0);
    requestAnimationFrame(render);
  }

  /* ==========================================================
     数字滚动 / 进度条
     ========================================================== */
  function animateNumber(el, from, to, dur, decimals, suffix = '') {
    const t0 = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (from + (to - from) * eased).toFixed(decimals) + suffix;
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  let progStart = 0, progDur = 1;
  function startProgress(totalMs) {
    progStart = performance.now(); progDur = totalMs;
    progressBar.classList.add('show');
    progressInner.style.width = '0%';
    tickProgress();
  }
  function tickProgress() {
    const p = Math.min(1, (performance.now() - progStart) / progDur);
    progressInner.style.width = (p * 100).toFixed(2) + '%';
    if (p < 1) requestAnimationFrame(tickProgress);
  }
  function endProgress() {
    progressInner.style.width = '100%';
    setTimeout(() => progressBar.classList.remove('show'), 900);
  }

  /* ==========================================================
     状态控制
     ========================================================== */
  function setStep(n) {
    steps.forEach(s => {
      const k = Number(s.dataset.step);
      s.classList.toggle('active', k === n);
      s.classList.toggle('done', k < n);
    });
  }
  function resetScene() {
    heatAlpha = 0; heatTarget = 0;
    finishGlow = 0; finishTarget = 0;
    for (let i = 0; i < pixels.length; i++) {
      pixels[i].life = 1;
      pixels[i].rmStart = Infinity;
    }
    armStroke.classList.remove('draw', 'dim');
    flashPath.classList.remove('flash');
    loadGroup.classList.remove('on');
    pulseGrp.classList.remove('on');
    rippleGrp.classList.remove('on');
    tags.forEach(t => t.classList.remove('on'));
    rings.forEach(r => r.classList.remove('on'));
    steps.forEach(s => s.classList.remove('active', 'done'));
    legendPanel.classList.remove('hide');

    iterVal.textContent = '00';
    cellRemovedEl.textContent = '0';
    massAfter.textContent = '—';
    massCut.textContent = '—';
    massCut.classList.remove('lit');
    barAfter.style.width = '0%';
  }

  /* ==========================================================
     主时间轴
     ========================================================== */
  let running = false;
  async function runDemo() {
    if (running) return;
    running = true;

    resetScene();
    /* 总时长约 52 秒 */
    startProgress(52000);
    await sleep(300);

    /* 阶段 0：实心结构 + 热力图显现 */
    armStroke.classList.add('draw');
    await sleep(700);
    heatTarget = 1;
    await sleep(1200);
    rings.forEach((r, i) => setTimeout(() => r.classList.add('on'), i * 100));
    gearBurst(2, 0, 1200);
    await sleep(1600);

    /* 阶段 1：载荷传递路径 */
    setStep(1);
    rippleGrp.classList.add('on');
    loadGroup.classList.add('on');
    await sleep(600);
    tags[0].classList.add('on');
    tags[3].classList.add('on');
    await sleep(1200);
    pulseGrp.classList.add('on');
    gearBurst(2, 0, 1600);
    await sleep(1000);
    tags[1].classList.add('on');
    tags[2].classList.add('on');
    await sleep(1600);
    await sleep(1200);

    /* 阶段 2：拓扑优化 20 次快速迭代 */
    setStep(2);
    tags[4].classList.add('on');
    await sleep(500);

    const totalRemove = Math.floor(pixels.length * REMOVE_RATIO);
    const perBatch    = Math.max(1, Math.floor(totalRemove / ITERATIONS));
    let removedCount  = 0;

    for (let it = 1; it <= ITERATIONS; it++) {
      let taken = 0;
      const base = performance.now();
      for (let i = 0; i < pixels.length && taken < perBatch; i++) {
        const p = pixels[i];
        if (p.rmStart !== Infinity) continue;
        /* 交错 0.5ms，让剥离像细微颗粒流同时从多个位置涌出 */
        p.rmStart = base + taken * 0.5;
        taken++; removedCount++;
      }
      iterVal.textContent = String(it).padStart(2, '0');
      cellRemovedEl.textContent = String(removedCount);
      gearWhirr(0.35);
      gearBurst(2, 0, 780 + it * 70);
      await sleep(ITER_INTERVAL_MS);
    }

    /* ================================================================
       阶段 3：结构定型 → 清除所有应力信息 → 只留下闪耀金属构件
       ================================================================ */
    setStep(3);
    metalClang();
    flashPath.classList.add('flash');
    setTimeout(() => flashPath.classList.remove('flash'), 900);

    /* ★ 去掉应力颜色（热力图淡出）、去掉载荷传递线 ★ */
    heatTarget = 0;
    loadGroup.classList.remove('on');
    pulseGrp.classList.remove('on');
    rippleGrp.classList.remove('on');
    tags.forEach(t => t.classList.remove('on'));
    legendPanel.classList.add('hide');
    armStroke.classList.add('dim');   /* 蓝框淡化 */

    /* ★ 开启金属光泽 ★ */
    finishTarget = 1;

    await sleep(1800);
    animateNumber(massAfter, 8.42, 4.73, 1500, 2, ' kg');
    barAfter.style.width = '56.2%';
    await sleep(1700);
    animateNumber(massCut, 0, 43.8, 1000, 1, '%');
    await sleep(1100);
    massCut.classList.add('lit');
    await sleep(2600);

    endProgress();
    running = false;
    startBtn.textContent = '↻ 重新演示';
    startBtn.classList.add('show');
  }

  /* ==========================================================
     启动
     ========================================================== */
  startBtn.addEventListener('click', async () => {
    initAudio();
    if (actx && actx.state === 'suspended') await actx.resume();
    startBtn.classList.remove('show');
    startBtn.textContent = '演示中…';
    await sleep(300);
    runDemo();
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!running && startBtn.classList.contains('show')) startBtn.click();
    }
  });

  /* ==========================================================
     初始化
     ========================================================== */
  function boot() {
    resize();
    buildSolidLayer();
    buildPixels();
    armStroke.classList.add('draw');
    rings.forEach((r, i) => setTimeout(() => r.classList.add('on'), i * 70));
    heatAlpha = 1; heatTarget = 1;
    requestAnimationFrame(render);
  }

  let resizeTimeout = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      resize();
      buildPixels();
    }, 240);
  });

  boot();
})();
</script>
</body>
