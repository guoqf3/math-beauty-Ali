<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定积分的定义 · 炫彩动画演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05060a;
    overflow: hidden;
    font-family: "Cambria Math", "Times New Roman", "Georgia", serif;
  }
  body::before {
    /* 背景极光辉光 */
    content: "";
    position: fixed; inset: -30%;
    background:
      radial-gradient(circle at 30% 30%, rgba(0, 170, 255, 0.18), transparent 45%),
      radial-gradient(circle at 72% 68%, rgba(255, 0, 140, 0.16), transparent 45%),
      radial-gradient(circle at 55% 20%, rgba(140, 0, 255, 0.12), transparent 50%);
    filter: blur(30px);
    animation: aurora 18s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes aurora {
    0%   { transform: translate3d(-3%, -2%, 0) scale(1.02); opacity: .8; }
    50%  { transform: translate3d(3%, 2%, 0) scale(1.08);  opacity: 1; }
    100% { transform: translate3d(-2%, 3%, 0) scale(1.03); opacity: .85; }
  }

  #stage { position: fixed; inset: 0; }

  canvas#fx {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  svg#wave {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
  }

  /* ---------- 页面边缘的数字公式层 ---------- */
  .edge-formula {
    position: fixed;
    font-family: "Cambria Math", "Latin Modern Math", "Georgia", serif;
    color: rgba(255, 255, 255, 0.34);
    font-size: 15px;
    letter-spacing: .06em;
    white-space: nowrap;
    text-shadow: 0 0 14px rgba(120, 200, 255, .35);
    user-select: none;
    pointer-events: none;
    animation: edgeFade 6s ease-in-out infinite;
  }
  @keyframes edgeFade {
    0%, 100% { opacity: .30; }
    50%      { opacity: .62; }
  }
  .edge-top-left    { top: 16px; left: 22px; }
  .edge-top-right   { top: 16px; right: 22px; animation-delay: -1.5s; }
  .edge-bot-left    { bottom: 16px; left: 22px; animation-delay: -3s;
                      writing-mode: horizontal-tb; }
  .edge-bot-right   { bottom: 16px; right: 22px; animation-delay: -4.5s; }

  /* 侧边竖排 */
  .edge-side-left {
    left: 10px; top: 50%;
    transform: translateY(-50%) rotate(-90deg);
    transform-origin: left center;
    font-size: 12.5px;
    color: rgba(180, 220, 255, .30);
    animation-delay: -2s;
  }
  .edge-side-right {
    right: 10px; top: 50%;
    transform: translateY(-50%) rotate(90deg);
    transform-origin: right center;
    font-size: 12.5px;
    color: rgba(255, 190, 230, .30);
    animation-delay: -5s;
  }

  /* ---------- 中央大公式 ---------- */
  #mainFormula {
    position: fixed;
    left: 50%; top: 6.2%;
    transform: translateX(-50%);
    text-align: center;
    color: #eaf4ff;
    font-family: "Cambria Math", "Georgia", serif;
    font-size: clamp(15px, 2.05vw, 30px);
    letter-spacing: .04em;
    text-shadow:
      0 0 18px rgba(120, 200, 255, .65),
      0 0 42px rgba(255, 60, 170, .35);
    animation: formulaPulse 4.2s ease-in-out infinite;
    white-space: nowrap;
    z-index: 20;
  }
  @keyframes formulaPulse {
    0%, 100% { text-shadow: 0 0 16px rgba(120,200,255,.55), 0 0 38px rgba(255,60,170,.28); }
    50%      { text-shadow: 0 0 30px rgba(120,200,255,.95), 0 0 66px rgba(255,60,170,.55); }
  }
  #mainFormula .lbl {
    display: block;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(10px, 1.05vw, 15px);
    letter-spacing: .42em;
    color: rgba(190, 225, 255, .68);
    margin-top: .55em;
    text-indent: .42em;
    text-shadow: 0 0 12px rgba(120, 200, 255, .5);
  }

  /* ---------- 右侧 / 中央 实时积分值 ---------- */
  #valueHUD {
    position: fixed;
    right: 3.4vw; top: 50%;
    transform: translateY(-50%);
    text-align: right;
    z-index: 30;
    font-family: "Cambria Math", "Georgia", serif;
    pointer-events: none;
  }
  #valueLabel {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 11.5px;
    letter-spacing: .34em;
    color: rgba(180, 215, 255, .62);
    margin-bottom: .5em;
    text-shadow: 0 0 10px rgba(120, 200, 255, .5);
  }
  #intValue {
    display: block;
    font-size: clamp(26px, 3.6vw, 58px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    line-height: 1;
    transition: color .18s linear;
  }
  #intValue.flash {
    animation: valueFlash .18s ease-out;
  }
  @keyframes valueFlash {
    0%   { transform: scale(1.24); filter: brightness(2.1); }
    100% { transform: scale(1);    filter: brightness(1); }
  }
  #trueValue {
    margin-top: .7em;
    font-size: clamp(10px, 1.05vw, 14px);
    color: rgba(255, 255, 255, .40);
    font-variant-numeric: tabular-nums;
    letter-spacing: .08em;
  }
  #trueValue b { color: rgba(120, 240, 200, .82); font-weight: 600; }

  /* ---------- 底部 n 指示器 ---------- */
  #nHUD {
    position: fixed;
    left: 50%; bottom: 5.2%;
    transform: translateX(-50%);
    z-index: 30;
    text-align: center;
    font-family: "Cambria Math", "Georgia", serif;
    pointer-events: none;
  }
  #nValue {
    font-size: clamp(20px, 2.5vw, 40px);
    font-weight: 600;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(255, 90, 190, .75), 0 0 48px rgba(90, 190, 255, .5);
  }
  #nHUD .nlabel {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 11px;
    letter-spacing: .34em;
    color: rgba(200, 225, 255, .58);
    margin-bottom: .35em;
  }
  /* n 进度条 */
  #bar {
    width: min(46vw, 460px);
    height: 2px;
    margin: 12px auto 0;
    background: rgba(255, 255, 255, .10);
    border-radius: 2px;
    overflow: hidden;
  }
  #barFill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: linear-gradient(90deg, #00d4ff, #7c4dff, #ff2d95, #ffb800, #00ffa3);
    box-shadow: 0 0 16px rgba(255, 80, 180, .8);
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="fx"></canvas>
  <svg id="wave" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#00e5ff"/>
        <stop offset="35%"  stop-color="#7c4dff"/>
        <stop offset="68%"  stop-color="#ff2d95"/>
        <stop offset="100%" stop-color="#ffb800"/>
      </linearGradient>
      <linearGradient id="curveGlow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#00e5ff" stop-opacity=".9"/>
        <stop offset="50%"  stop-color="#ff2d95" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#ffb800" stop-opacity=".9"/>
      </linearGradient>
      <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <clipPath id="areaClip">
        <rect x="0" y="0" width="1600" height="900"/>
      </clipPath>
    </defs>

    <!-- 坐标轴 -->
    <g id="axes" stroke="rgba(255,255,255,0.16)" stroke-width="1.4" fill="none">
      <line id="xAxis" x1="0" y1="0" x2="0" y2="0"/>
      <line id="yAxis" x1="0" y1="0" x2="0" y2="0"/>
    </g>

    <!-- 填充矩形组 -->
    <g id="rects" clip-path="url(#areaClip)"></g>

    <!-- 积分区间标记 a / b -->
    <g id="marks"></g>

    <!-- 曲线 -->
    <path id="curve" fill="none" stroke="url(#curveGrad)" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#blurGlow)"/>
    <path id="curveThin" fill="none" stroke="url(#curveGlow)" stroke-width="1.2"
          opacity="0.55" stroke-linecap="round"/>

    <!-- 曲线上的采样点 -->
    <g id="dots"></g>
  </svg>
</div>

<!-- ================= 边缘公式 ================= -->
<div class="edge-formula edge-top-left">
  ∫ₐᵇ f(x) dx = lim<sub>n→∞</sub> Σ f(xᵢ)Δx
</div>
<div class="edge-formula edge-top-right">
  Δx = (b − a) / n
</div>
<div class="edge-formula edge-bot-left">
  Σᵢ₌₁ⁿ f(xᵢ)Δx &nbsp;→&nbsp; ∫ₐᵇ f(x)dx
</div>
<div class="edge-formula edge-bot-right">
  ‖P‖ → 0
</div>
<div class="edge-formula edge-side-left">
  x₀ &lt; x₁ &lt; ⋯ &lt; xₙ
</div>
<div class="edge-formula edge-side-right">
  0 ≤ n &lt; ∞
</div>

<!-- ================= 中央公式 ================= -->
<div id="mainFormula">
  ∫<sub>a</sub><sup>b</sup> f(x) dx =
  lim<sub>n→∞</sub> Σ<sub>i=1</sub><sup>n</sup> f(x<sub>i</sub>)Δx
  <span class="lbl">定 积 分 的 定 义</span>
</div>

<!-- ================= 实时积分值 ================= -->
<div id="valueHUD">
  <div id="valueLabel">R I E M A N N &nbsp; S U M</div>
  <span id="intValue">0.000000</span>
  <div id="trueValue">真实值 ∫ = <b id="trueVal">9.666667</b></div>
</div>

<!-- ================= n 指示器 ================= -->
<div id="nHUD">
  <div class="nlabel">分 割 数 n</div>
  <div id="nValue">1</div>
  <div id="bar"><div id="barFill"></div></div>
</div>

<script>
(() => {
  "use strict";

  /* ================= 数学设定 ================= */
  // f(x) = 3 - (x-3)² / 4  ,  区间 [a,b] = [0,4]
  // 解析原函数 F(x) = 3x - (x-3)³ / 12  →  ∫₀⁴ = 9.6666…
  const A = 0.0, B = 4.0;
  const f = (x) => 3 - ((x - 3) * (x - 3)) / 4;
  const Fx = (x) => 3 * x - Math.pow(x - 3, 3) / 12;
  const TRUE = Fx(B) - Fx(A);   // = 9.666666…

  /* ================= 画布 / 布局 ================= */
  const fxCanvas = document.getElementById("fx");
  const ctx = fxCanvas.getContext("2d");
  const svg = document.getElementById("wave");
  const W = 1600, H = 900;
  const VB_W = 1600, VB_H = 900; // svg viewBox 内部坐标系

  // 绘图区（SVG 内部坐标）
  const padL = 190, padR = 300, padT = 230, padB = 210;
  const gx0 = padL, gx1 = VB_W - padR;          // x 轴起止
  const gy0 = VB_H - padB;                       // x 轴 y
  const gyTop = padT;                            // 顶部
  const yMax = 3.35;                             // f 最大值约 3.0

  const toX = (x) => gx0 + (x - A) / (B - A) * (gx1 - gx0);
  const toY = (v) => gy0 - (v / yMax) * (gy0 - gyTop);

  /* ================= 元素引用 ================= */
  const rectsG   = document.getElementById("rects");
  const dotsG    = document.getElementById("dots");
  const marksG   = document.getElementById("marks");
  const curveP   = document.getElementById("curve");
  const curveThinP = document.getElementById("curveThin");
  const xAxis    = document.getElementById("xAxis");
  const yAxis    = document.getElementById("yAxis");

  const intValueEl = document.getElementById("intValue");
  const trueValEl  = document.getElementById("trueVal");
  const nValueEl   = document.getElementById("nValue");
  const barFill    = document.getElementById("barFill");

  trueValEl.textContent = TRUE.toFixed(6);

  /* ================= 静态：坐标轴 & 曲线 ================= */
  function buildStatic() {
    xAxis.setAttribute("x1", gx0 - 30);
    xAxis.setAttribute("y1", gy0);
    xAxis.setAttribute("x2", gx1 + 60);
    xAxis.setAttribute("y2", gy0);

    yAxis.setAttribute("x1", gx0);
    yAxis.setAttribute("y1", gy0 + 26);
    yAxis.setAttribute("x2", gx0);
    yAxis.setAttribute("y2", gyTop - 40);

    // 曲线路径
    let d = "", dt = "";
    const N = 420;
    for (let i = 0; i <= N; i++) {
      const x = A + (B - A) * i / N;
      const px = toX(x), py = toY(f(x));
      d  += (i === 0 ? "M" : "L") + px.toFixed(2) + " " + py.toFixed(2);
      dt += (i === 0 ? "M" : "L") + px.toFixed(2) + " " + py.toFixed(2);
    }
    curveP.setAttribute("d", d);
    curveThinP.setAttribute("d", dt);

    // a / b 刻度
    const g = [];
    const mk = (x, label, anchor) => {
      const px = toX(x);
      g.push(`<line x1="${px}" y1="${gy0}" x2="${px}" y2="${gy0 + 12}"
              stroke="rgba(255,255,255,.35)" stroke-width="1.6"/>`);
      g.push(`<text x="${px}" y="${gy0 + 42}" fill="rgba(215,235,255,.75)"
              font-size="20" font-family="Cambria Math, Georgia, serif"
              text-anchor="${anchor}">${label}</text>`);
    };
    mk(A, "a", "middle");
    mk(B, "b", "middle");
    // 虚线辅助
    g.push(`<line x1="${toX(B)}" y1="${toY(f(B))}" x2="${toX(B)}" y2="${gy0}"
            stroke="rgba(255,255,255,.18)" stroke-width="1" stroke-dasharray="5 6"/>`);
    g.push(`<line x1="${toX(A)}" y1="${toY(f(A))}" x2="${toX(A)}" y2="${gy0}"
            stroke="rgba(255,255,255,.18)" stroke-width="1" stroke-dasharray="5 6"/>`);
    marksG.innerHTML = g.join("");
  }

  /* ================= 霓虹彩虹调色 ================= */
  // 依据矩形在区间中的归一位置 t∈[0,1] 与时间相位，给出霓虹渐变彩色
  function neonColor(t, alpha) {
    // HSL 彩虹循环 + 色相随位置推进
    const hue = (t * 330 + tPhase * 55) % 360;
    const sat = 92 + 8 * Math.sin(t * 6.28 + tPhase);
    const lig = 56 + 10 * Math.sin(t * 9.4 - tPhase * 1.3);
    return `hsla(${hue.toFixed(0)}, ${sat.toFixed(0)}%, ${lig.toFixed(0)}%, ${alpha})`;
  }

  /* ================= 动画状态 ================= */
  let tPhase = 0;

  // n 的分级序列：从 1 逐级加密到 1000
  const N_STEPS = [
    1,2,3,4,5,6,8,10,12,15,18,22,26,30,36,42,50,60,72,86,
    100,120,145,175,210,250,300,360,430,500,600,700,800,900,1000
  ];
  let stepIdx = 0;
  let curN = N_STEPS[0];
  let fromN = N_STEPS[0], toN = N_STEPS[0];
  let stepT = 1;           // 0→1 当前段插值进度
  const STEP_DUR = 900;    // 每级用时(ms)
  const HOLD_END = 2600;   // 到 1000 后停留
  let holdTimer = 0;
  let phaseMode = "grow";  // grow | hold | restart

  /* ---------- 黎曼和计算 ---------- */
  function riemann(n, mode) {
    const dx = (B - A) / n;
    let s = 0;
    for (let i = 0; i < n; i++) {
      const xl = A + i * dx, xr = xl + dx;
      let xm;
      if (mode === "left")       xm = xl;
      else if (mode === "right") xm = xr;
      else                       xm = (xl + xr) / 2;
      s += f(xm) * dx;
    }
    return s;
  }

  /* ================= 绘制矩形 ================= */
  let lastRenderedN = -1;
  function renderRects(nFloat) {
    const n = Math.max(1, Math.round(nFloat));
    if (n === lastRenderedN) return;
    lastRenderedN = n;

    const dx = (B - A) / n;
    const parts = [];
    const dotParts = [];
    const dotStep = Math.max(1, Math.floor(n / 90)); // 采样点上限

    for (let i = 0; i < n; i++) {
      const xl = A + i * dx, xr = xl + dx;
      const xm = (xl + xr) / 2;
      const h = f(xm);
      const t = n === 1 ? 0.5 : i / (n - 1);

      const px = toX(xl), pw = Math.max(0.35, toX(xr) - toX(xl));
      const py = toY(h), ph = gy0 - py;

      // 透明度：越密越半透，形成霓虹叠加
      const baseA = n <= 8 ? 0.62 : (n <= 60 ? 0.46 : 0.30);
      const a = baseA * (0.86 + 0.14 * Math.sin(t * 22 + tPhase * 2.2));

      const c1 = neonColor(t, a);
      const slope = 0.34 + 0.4 * ((i % 2 === 0) ? 0.65 : 1);
      const c2 = neonColor(t + 0.06, a * 0.82);

      parts.push(
        `<rect x="${px.toFixed(2)}" y="${py.toFixed(2)}"
           width="${pw.toFixed(2)}" height="${Math.max(0, ph).toFixed(2)}"
           fill="url(#g${i})" stroke="rgba(255,255,255,0.10)"
           stroke-width="0.6"/>`
      );
      // 动态渐变 defs（逐矩形独立色）
      parts.push(
        `<defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1">
           <stop offset="0%"   stop-color="${c1}"/>
           <stop offset="100%" stop-color="${c2}" stop-opacity="${(a*0.55).toFixed(3)}"/>
         </linearGradient></defs>`
      );

      if (n <= 220 && i % dotStep === 0) {
        const cx = toX(xm), cy = toY(h);
        dotParts.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${n<=30?4.2:2.6}"
          fill="#ffffff" opacity="${n<=30?0.95:0.7}"/>`);
        if (n <= 14) {
          dotParts.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="9"
            fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.2"/>`);
        }
      }
    }
    rectsG.innerHTML = parts.join("");
    dotsG.innerHTML = dotParts.join("");
  }

  /* ================= 数值 HUD 更新 ================= */
  let lastShownShake = 0;
  function updateValue(val, n) {
    intValueEl.textContent = val.toFixed(6);
    intValueEl.style.color = `hsl(${(tPhase * 60) % 360}, 100%, 72%)`;

    // 数字抖动闪烁（n 越大越频繁）
    const now = performance.now();
    const interval = Math.max(45, 620 / Math.log2(n + 2));
    if (now - lastShownShake > interval) {
      lastShownShake = now;
      intValueEl.classList.remove("flash");
      void intValueEl.offsetWidth;
      intValueEl.classList.add("flash");
    }

    nValueEl.textContent = n;
    const prog = Math.min(1, Math.log2(n + 1) / Math.log2(1001));
    barFill.style.width = (prog * 100).toFixed(2) + "%";
  }

  /* ================= 背景粒子 & 光条 ================= */
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let cw = 0, ch = 0;
  function resizeCanvas() {
    cw = window.innerWidth; ch = window.innerHeight;
    fxCanvas.width = cw * DPR; fxCanvas.height = ch * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  const particles = [];
  for (let i = 0; i < 110; i++) {
    particles.push({
      x: Math.random(), y: Math.random(),
      r: 0.6 + Math.random() * 2.1,
      vx: (Math.random() - 0.5) * 0.00035,
      vy: -0.00020 - Math.random() * 0.00040,
      hue: Math.random() * 360,
      ph: Math.random() * 6.28
    });
  }

  function drawFX() {
    ctx.clearRect(0, 0, cw, ch);
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -0.05) { p.y = 1.05; p.x = Math.random(); }
      if (p.x < -0.05) p.x = 1.05;
      if (p.x > 1.05)  p.x = -0.05;
      const tw = 0.42 + 0.58 * Math.abs(Math.sin(tPhase * 0.9 + p.ph));
      const px = p.x * cw, py = p.y * ch;
      const g = ctx.createRadialGradient(px, py, 0, px, py, p.r * 7);
      g.addColorStop(0, `hsla(${(p.hue + tPhase * 34) % 360}, 100%, 70%, ${0.55 * tw})`);
      g.addColorStop(1, "hsla(0,0%,0%,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, p.r * 7, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  /* ================= 主循环 ================= */
  let last = performance.now();
  let tAcc = 0;

  function frame(now) {
    const dt = Math.min(64, now - last);
    last = now;
    tPhase += dt * 0.0011;

    // --- n 分级推进 ---
    if (phaseMode === "grow") {
      stepT += dt / STEP_DUR;
      if (stepT >= 1) {
        stepT = 1;
        curN = toN;
        if (stepIdx >= N_STEPS.length - 1) {
          phaseMode = "hold";
          holdTimer = 0;
        } else {
          stepIdx++;
          fromN = N_STEPS[stepIdx - 1];
          toN   = N_STEPS[stepIdx];
          stepT = 0;
        }
      } else {
        // 平滑插值（对数域更均匀）
        const e = stepT * stepT * (3 - 2 * stepT); // smoothstep
        curN = Math.exp(
          Math.log(fromN) * (1 - e) + Math.log(toN) * e
        );
      }
    } else if (phaseMode === "hold") {
      curN = 1000;
      holdTimer += dt;
      if (holdTimer > HOLD_END) {
        phaseMode = "restart";
        stepIdx = 0;
        fromN = N_STEPS[0]; toN = N_STEPS[1];
        stepT = 0; curN = N_STEPS[0];
      }
    } else if (phaseMode === "restart") {
      phaseMode = "grow";
      stepT = 0; curN = N_STEPS[0];
    }

    renderRects(curN);

    const n = Math.max(1, Math.round(curN));
    const val = riemann(n, "mid");
    updateValue(val, n);

    drawFX();
    requestAnimationFrame(frame);
  }

  buildStatic();
  renderRects(1);
  requestAnimationFrame(frame);

  // 定期轻量重渲染以便霓虹色随时间流动（低频，节省性能）
  setInterval(() => {
    lastRenderedN = -1;
  }, 140);

})();
</script>
</body>
