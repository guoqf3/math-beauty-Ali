<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>相变理论 · Phase Transition</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#03010a;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;cursor:grab;}
  html:active{cursor:grabbing;}
  canvas{display:block;position:fixed;inset:0;}

  #caption{
    position:fixed;top:26px;left:50%;transform:translateX(-50%);
    color:#f5e9ff;font-size:clamp(14px,1.5vw,24px);
    letter-spacing:3px;font-weight:500;white-space:nowrap;
    pointer-events:none;z-index:10;
    text-shadow:0 0 12px rgba(168,85,247,.95),0 0 34px rgba(232,121,249,.6),0 0 72px rgba(56,189,248,.4);
    transition:opacity .4s ease;
  }

  .fx{
    position:fixed;color:#c084fc;font-size:14px;letter-spacing:1px;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    text-shadow:0 0 10px rgba(168,85,247,.9),0 0 26px rgba(139,92,246,.5);
    pointer-events:none;opacity:.85;white-space:nowrap;z-index:10;
  }
  #fx1{top:108px;left:30px;}
  #fx2{bottom:108px;left:30px;}
  #fx3{top:108px;right:30px;text-align:right;}
  #fx4{bottom:108px;right:30px;text-align:right;
       color:#22d3ee;text-shadow:0 0 10px rgba(34,211,238,.9),0 0 26px rgba(6,182,212,.5);}

  #hud{
    position:fixed;bottom:104px;left:50%;transform:translateX(-50%);
    color:#c4b5fd;font-size:13px;letter-spacing:2px;opacity:.85;
    pointer-events:none;white-space:nowrap;
    text-shadow:0 0 12px rgba(139,92,246,.8);
    font-family:"Consolas","Courier New",monospace;z-index:10;
  }
  #hud b{color:#e9d5ff;font-weight:600;}
  #hud i{font-style:normal;color:#67e8f9;}

  #panel{
    position:fixed;bottom:38px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:16px;
    background:rgba(30,15,60,.58);border:1px solid rgba(168,85,247,.38);
    border-radius:30px;padding:10px 26px;
    backdrop-filter:blur(10px);z-index:20;
    box-shadow:0 0 34px rgba(168,85,247,.28),inset 0 0 22px rgba(120,60,220,.15);
  }
  #panel span{
    color:#d8b4fe;font-size:13px;letter-spacing:2px;
    font-family:"Consolas",monospace;white-space:nowrap;
  }
  #slider{
    -webkit-appearance:none;appearance:none;
    width:min(320px,36vw);height:5px;border-radius:3px;
    background:linear-gradient(90deg,#3b82f6,#22d3ee,#fb923c,#ef4444);
    outline:none;cursor:pointer;
  }
  #slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid #c084fc;cursor:pointer;
    box-shadow:0 0 14px rgba(192,132,252,.95);
  }
  #slider::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:#fff;border:2px solid #c084fc;cursor:pointer;
  }

  .corner{
    position:fixed;width:54px;height:54px;pointer-events:none;opacity:.4;z-index:9;
    border-color:#a855f7;
  }
  .c1{top:16px;left:16px;border-top:1px solid;border-left:1px solid;}
  .c2{top:16px;right:16px;border-top:1px solid;border-right:1px solid;}
  .c3{bottom:16px;left:16px;border-bottom:1px solid;border-left:1px solid;}
  .c4{bottom:16px;right:16px;border-bottom:1px solid;border-right:1px solid;}

  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 40%,rgba(0,0,0,.7) 100%);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="caption"></div>

<div class="fx" id="fx1">dP/dT = ΔH / (T·ΔV)</div>
<div class="fx" id="fx2">ΔG = ΔH − T·ΔS</div>
<div class="fx" id="fx3">M ∝ (T<sub>c</sub> − T)<sup>β</sup> &nbsp; β ≈ 1/3</div>
<div class="fx" id="fx4">压缩率发散 γ ≈ 4/3</div>

<div class="corner c1"></div>
<div class="corner c2"></div>
<div class="corner c3"></div>
<div class="corner c4"></div>

<div id="hud"></div>

<div id="panel">
  <span id="phaseLabel">固相</span>
  <input type="range" id="slider" min="0" max="1000" value="0" step="1">
  <span id="modeLabel">自动</span>
</div>

<script>
/* ==========================================================
   相变理论 · Phase Transition 3D 粒子动画
   ========================================================== */
const canvas    = document.getElementById('c');
const ctx       = canvas.getContext('2d');
const captionEl = document.getElementById('caption');
const hudEl     = document.getElementById('hud');
const slider    = document.getElementById('slider');
const phaseLabel= document.getElementById('phaseLabel');
const modeLabel = document.getElementById('modeLabel');

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- 工具 ---------------- */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
function smoothstep(e0,e1,x){
  const t = clamp((x-e0)/(e1-e0), 0, 1);
  return t*t*(3-2*t);
}

/* ---------------- 相机 ---------------- */
let userYaw   = -0.55;
let userPitch =  0.28;
let camDist   = 135;
let camYaw = userYaw, camPitch = userPitch;
let SCX = 0, SCY = 0;
let focusX = 0, focusY = 0, focusZ = 0;
const FOCAL = 1100;

function project(x, y, z){
  const dx = x - focusX, dy = y - focusY, dz = z - focusZ;
  const cyw = Math.cos(camYaw), syw = Math.sin(camYaw);
  const X1 =  dx*cyw + dz*syw;
  const Z1 = -dx*syw + dz*cyw;
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const Y2 = dy*cp - Z1*sp;
  const Z2 = dy*sp + Z1*cp;
  const zc = Z2 + camDist;
  if (zc < 5) return null;
  const f = FOCAL / zc;
  return { x: SCX + X1*f, y: SCY - Y2*f, zc: zc, f: f };
}

/* ---------------- 常量 ---------------- */
const CYCLE = 30;            // 30 秒循环
const Tm = 0.33;             // 归一化熔点
const Tb = 0.66;             // 归一化沸点
const BOX = 20;              // 立方体半边长
const NA  = 6;               // 每边原子数
const SP  = (2*BOX)/(NA-1);  // 晶格间距

/* ---------------- 原子初始化 ---------------- */
const atoms = [];
for (let i=0;i<NA;i++){
  for (let j=0;j<NA;j++){
    for (let k=0;k<NA;k++){
      const Lx = -BOX + i*SP;
      const Ly = -BOX + j*SP;
      const Lz = -BOX + k*SP;
      atoms.push({
        Lx, Ly, Lz,
        x: Lx, y: Ly, z: Lz,
        ox: (Math.random()-0.5)*18,
        oy: (Math.random()-0.5)*18,
        oz: (Math.random()-0.5)*18,
        ph1: Math.random()*6.2832,
        ph2: Math.random()*6.2832,
        ph3: Math.random()*6.2832
      });
    }
  }
}

/* ---------------- 热量 → 温度（含潜热平台） ---------------- */
function tempFromHeat(Q){
  const q1 = 0.28, q2 = 0.40, q3 = 0.70, q4 = 0.82;
  if (Q <= q1) return (Q/q1) * Tm;
  if (Q <= q2) return Tm;
  if (Q <= q3) return Tm + (Tb-Tm)*(Q-q2)/(q3-q2);
  if (Q <= q4) return Tb;
  return Tb + (1-Tb)*(Q-q4)/(1-q4);
}

/* ---------------- 爆发粒子 ---------------- */
const bursts = [];
function spawnBurst(type){
  const count = (type==='boil') ? 70 : 46;
  let hue = 32;
  if (type==='boil')   hue = 5;
  if (type==='freeze') hue = 210;
  if (type==='condense') hue = 320;
  for (let i=0;i<count;i++){
    const up = (type==='boil');
    bursts.push({
      x: (Math.random()-0.5)*10,
      y: (Math.random()-0.5)*10,
      z: (Math.random()-0.5)*10,
      vx: (Math.random()-0.5)*75,
      vy: up ? (Math.random()*70+25) : (Math.random()-0.5)*75,
      vz: (Math.random()-0.5)*75,
      life: 1,
      hue: hue + (Math.random()-0.5)*30,
      size: 0.8 + Math.random()*1.8
    });
  }
}
function updateBursts(dt){
  for (let i=bursts.length-1;i>=0;i--){
    const b = bursts[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.z += b.vz*dt;
    b.vx *= 0.955; b.vy *= 0.955; b.vz *= 0.955;
    b.life -= dt*1.05;
    if (b.life <= 0) bursts.splice(i,1);
  }
}

/* ---------------- 原子物理更新 ---------------- */
function updateAtoms(dt, t, T, solidF, liqF, gasF){
  const vibAmp = 0.2 + 1.9 * (T / Math.max(Tm, 0.001));

  for (let i=0;i<atoms.length;i++){
    const a = atoms[i];

    // 固态：晶格振动
    const sx = a.Lx + Math.sin(t*7.5 + a.ph1) * vibAmp;
    const sy = a.Ly + Math.sin(t*8.3 + a.ph2) * vibAmp;
    const sz = a.Lz + Math.sin(t*6.9 + a.ph3) * vibAmp;

    // 液态：无序偏移
    const lx = a.Lx + a.ox;
    const ly = a.Ly + a.oy;
    const lz = a.Lz + a.oz;

    // 气态：自由飞散
    const gx = Math.sin(t*1.9 + a.ph1) * BOX * 0.86;
    const gy = Math.sin(t*2.4 + a.ph2) * BOX * 0.86;
    const gz = Math.sin(t*1.6 + a.ph3) * BOX * 0.86;

    const tx = sx*solidF + lx*liqF + gx*gasF;
    const ty = sy*solidF + ly*liqF + gy*gasF;
    const tz = sz*solidF + lz*liqF + gz*gasF;

    const kf   = 30*solidF + 5.2*liqF + 3.2*gasF;
    const rate = 1 - Math.exp(-kf*dt);

    a.x += (tx - a.x) * rate;
    a.y += (ty - a.y) * rate;
    a.z += (tz - a.z) * rate;

    // 边界约束
    if (a.x >  BOX) a.x =  BOX;
    if (a.x < -BOX) a.x = -BOX;
    if (a.y >  BOX) a.y =  BOX;
    if (a.y < -BOX) a.y = -BOX;
    if (a.z >  BOX) a.z =  BOX;
    if (a.z < -BOX) a.z = -BOX;
  }
}

/* ==========================================================
   绘制：立方体容器
   ========================================================== */
const CUBE_V = [
  [-BOX,-BOX,-BOX],[ BOX,-BOX,-BOX],[ BOX, BOX,-BOX],[-BOX, BOX,-BOX],
  [-BOX,-BOX, BOX],[ BOX,-BOX, BOX],[ BOX, BOX, BOX],[-BOX, BOX, BOX]
];
const CUBE_E = [
  [0,1],[1,2],[2,3],[3,0],
  [4,5],[5,6],[6,7],[7,4],
  [0,4],[1,5],[2,6],[3,7]
];

function drawCube(alpha){
  const P = [];
  for (let i=0;i<8;i++){
    P.push(project(CUBE_V[i][0], CUBE_V[i][1], CUBE_V[i][2]));
  }
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = 'rgba(150,90,255,' + alpha + ')';
  for (let i=0;i<CUBE_E.length;i++){
    const a = P[CUBE_E[i][0]], b = P[CUBE_E[i][1]];
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
}

/* ==========================================================
   绘制：原子
   ========================================================== */
const projBuf = [];

function drawAtoms(T, solidF, liqF, gasF, Q){
  projBuf.length = 0;

  for (let i=0;i<atoms.length;i++){
    const a = atoms[i];
    const p = project(a.x, a.y, a.z);
    if (!p) continue;
    projBuf.push({ x: p.x, y: p.y, zc: p.zc, f: p.f });
  }

  // 远 → 近
  projBuf.sort((A,B)=> B.zc - A.zc);

  // 相变附近“临界乳光”闪烁强度
  const flick = Math.exp(-Math.pow((Q-0.34)/0.045, 2))
              + Math.exp(-Math.pow((Q-0.76)/0.045, 2));

  // 温度 → 色相（蓝 → 橙 → 红）
  const hue = 215*solidF + 32*liqF + 358*gasF;
  const lum = 55 + 14*T;

  ctx.globalCompositeOperation = 'lighter';

  for (let n=0;n<projBuf.length;n++){
    const c = projBuf[n];
    let r = 1.25 * c.f;
    r *= 1 + flick * (Math.random()-0.5) * 0.85;
    if (r < 1.5) r = 1.5;

    // 外层辉光
    ctx.fillStyle = 'hsla(' + hue + ',100%,' + lum + '%,0.055)';
    ctx.beginPath(); ctx.arc(c.x, c.y, r*3.1, 0, 6.2832); ctx.fill();

    // 中层光晕
    ctx.fillStyle = 'hsla(' + hue + ',100%,' + lum + '%,0.16)';
    ctx.beginPath(); ctx.arc(c.x, c.y, r*1.7, 0, 6.2832); ctx.fill();

    // 内核
    ctx.fillStyle = 'hsla(' + hue + ',100%,' + (lum+22) + '%,0.92)';
    ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 6.2832); ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ==========================================================
   绘制：爆发粒子
   ========================================================== */
function drawBursts(){
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<bursts.length;i++){
    const b = bursts[i];
    const p = project(b.x, b.y, b.z);
    if (!p) continue;
    const r = Math.max(1, b.size * p.f * 0.26) * b.life;

    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r*2.6);
    g.addColorStop(0, 'hsla(' + b.hue + ',100%,72%,' + (0.85*b.life) + ')');
    g.addColorStop(0.5, 'hsla(' + b.hue + ',100%,58%,' + (0.35*b.life) + ')');
    g.addColorStop(1, 'hsla(' + b.hue + ',100%,50%,0)');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r*2.6, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ==========================================================
   绘制：温度计 & 能量条
   ========================================================== */
function drawGauges(T, Q){
  /* ---- 温度计（右） ---- */
  const tx = W - 64;
  const ty0 = H*0.26, ty1 = H*0.74;
  const th = ty1 - ty0;

  ctx.fillStyle = 'rgba(255,255,255,0.055)';
  ctx.fillRect(tx-7, ty0, 14, th);

  const fh = th * T;
  if (fh > 0.5){
    const g = ctx.createLinearGradient(0, ty1, 0, ty0);
    g.addColorStop(0.00, '#3b82f6');
    g.addColorStop(0.33, '#22d3ee');
    g.addColorStop(0.55, '#fb923c');
    g.addColorStop(0.78, '#ef4444');
    g.addColorStop(1.00, '#fbbf24');
    ctx.fillStyle = g;
    ctx.fillRect(tx-7, ty1-fh, 14, fh);
  }

  // 刻度
  ctx.strokeStyle = 'rgba(190,150,255,0.30)';
  ctx.lineWidth = 1;
  for (let v=0; v<=1.0001; v+=0.1){
    const y = ty1 - th*v;
    ctx.beginPath();
    ctx.moveTo(tx+9, y);
    ctx.lineTo(tx+15, y);
    ctx.stroke();
  }

  // 熔点/沸点标记
  const marks = [[Tm,'T_m'],[Tb,'T_b']];
  ctx.font = '11px Consolas, monospace';
  ctx.textAlign = 'right';
  for (let i=0;i<marks.length;i++){
    const y = ty1 - th*marks[i][0];
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tx-11, y);
    ctx.lineTo(tx+18, y);
    ctx.stroke();

    ctx.fillStyle = 'rgba(225,205,255,0.9)';
    ctx.fillText(marks[i][1], tx-15, y+4);
  }

  // 标签
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(200,160,255,0.75)';
  ctx.font = '12px Consolas, monospace';
  ctx.fillText('T', tx, ty0 - 16);

  /* ---- 能量条（左） ---- */
  const ex = 60;
  const ey0 = H*0.26, ey1 = H*0.74;
  const eh = ey1 - ey0;

  ctx.fillStyle = 'rgba(255,255,255,0.055)';
  ctx.fillRect(ex-7, ey0, 14, eh);

  const efh = eh * Q;
  if (efh > 0.5){
    const g2 = ctx.createLinearGradient(0, ey1, 0, ey0);
    g2.addColorStop(0.00, '#7c3aed');
    g2.addColorStop(0.45, '#ec4899');
    g2.addColorStop(1.00, '#f59e0b');
    ctx.fillStyle = g2;
    ctx.fillRect(ex-7, ey1-efh, 14, efh);
  }

  // 潜热平台标记
  const plateaus = [[0.28,0.40],[0.70,0.82]];
  for (let i=0;i<plateaus.length;i++){
    const yA = ey1 - eh*plateaus[i][1];
    const yB = ey1 - eh*plateaus[i][0];
    ctx.strokeStyle = 'rgba(103,232,249,0.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(ex+9, yA); ctx.lineTo(ex+15, yA);
    ctx.moveTo(ex+9, yB); ctx.lineTo(ex+15, yB);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ex+12, yA);
    ctx.lineTo(ex+12, yB);
    ctx.stroke();
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(200,160,255,0.75)';
  ctx.font = '12px Consolas, monospace';
  ctx.fillText('Q', ex, ey0 - 16);
  ctx.font = '10px Consolas, monospace';
  ctx.fillStyle = 'rgba(150,220,255,0.6)';
  ctx.fillText('潜热', ex + 26, (ey1 - eh*0.34));
  ctx.fillText('平台', ex + 26, (ey1 - eh*0.34) + 13);
}

/* ==========================================================
   顶部文字
   ========================================================== */
const CAPTIONS = [
  '相变揭示“量变引发质变”的普适原理——当温度越过临界值',
  '系统性质发生根本性跃变，这种临界现象广泛存在于物理到社会',
  '各领域，理解临界点与涨落是把握复杂系统演化规律的关键',
  '从冰融成水到社会变革，阈值处总迸发着新生的力量'
];
let capIdx = -1;

function updateCaption(t){
  const segDur = CYCLE / CAPTIONS.length;
  let i = Math.floor(t / segDur);
  if (i >= CAPTIONS.length) i = CAPTIONS.length - 1;
  const lt = t - i * segDur;

  if (i !== capIdx){
    capIdx = i;
    captionEl.textContent = CAPTIONS[i];
  }

  const fade = 0.8;
  let op = 1;
  if (lt < fade) op = lt/fade;
  else if (lt > segDur - fade) op = Math.max(0, (segDur-lt)/fade);
  captionEl.style.opacity = clamp(op,0,1).toFixed(3);
}

/* ==========================================================
   主渲染
   ========================================================== */
function render(t, T, solidF, liqF, gasF, Q){
  SCX = W * 0.5;
  SCY = H * 0.50;

  camYaw   = userYaw;
  camPitch = userPitch;

  /* ---- 背景 ---- */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  const bg = ctx.createRadialGradient(SCX, SCY, 0, SCX, SCY, Math.max(W,H)*0.72);
  bg.addColorStop(0.00, '#180b34');
  bg.addColorStop(0.45, '#0b0520');
  bg.addColorStop(1.00, '#03010a');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  /* ---- 立方体（后层） ---- */
  drawCube(0.10);

  /* ---- 原子 ---- */
  drawAtoms(T, solidF, liqF, gasF, Q);

  /* ---- 立方体（前层） ---- */
  drawCube(0.26);

  /* ---- 爆发粒子 ---- */
  drawBursts();

  /* ---- 仪表 ---- */
  drawGauges(T, Q);

  /* ---- 文字 ---- */
  updateCaption(t);

  /* ---- HUD ---- */
  let phaseName;
  if (Q > 0.28 && Q < 0.40)      phaseName = '熔化中 · 吸收潜热';
  else if (Q > 0.70 && Q < 0.82) phaseName = '汽化中 · 吸收潜热';
  else if (solidF > 0.6)         phaseName = '固相 · 晶格有序';
  else if (gasF > 0.6)           phaseName = '气相 · 自由飞散';
  else                            phaseName = '液相 · 无序流动';

  hudEl.innerHTML =
    'T = <b>' + T.toFixed(3) + '</b> &nbsp;|&nbsp; ' +
    'Q = <b>' + Q.toFixed(3) + '</b> &nbsp;|&nbsp; ' +
    '相态：<i>' + phaseName + '</i> &nbsp;|&nbsp; ' +
    '拖动旋转 · 滚轮缩放 · 滑块调温';

  phaseLabel.textContent = phaseName.split(' ')[0];
}

/* ==========================================================
   主循环
   ========================================================== */
let tAcc = 0;
let lastNow = 0;
let prevQ = 0;
let manualMode = false;
let manualQ = 0;

function frame(now){
  if (!lastNow) lastNow = now;
  let dt = (now - lastNow) / 1000;
  lastNow = now;
  if (dt > 0.06) dt = 0.06;
  if (dt <= 0)   dt = 1/60;

  tAcc += dt;
  const tLoop = tAcc % CYCLE;

  /* ---- 热量 Q ---- */
  let Q;
  if (manualMode){
    Q = manualQ;
  } else {
    Q = 0.5 - 0.5 * Math.cos(2 * Math.PI * tLoop / CYCLE);
  }

  const T = tempFromHeat(Q);

  /* ---- 相分数 ---- */
  const solidF = 1 - smoothstep(0.28, 0.40, Q);
  const gasF   = smoothstep(0.70, 0.82, Q);
  const liqF   = Math.max(0, 1 - solidF - gasF);

  /* ---- 相变事件触发 ---- */
  if (prevQ < 0.28 && Q >= 0.28) spawnBurst('melt');
  if (prevQ < 0.70 && Q >= 0.70) spawnBurst('boil');
  if (prevQ > 0.28 && Q <= 0.28) spawnBurst('freeze');
  if (prevQ > 0.70 && Q <= 0.70) spawnBurst('condense');
  prevQ = Q;

  /* ---- 更新 ---- */
  updateAtoms(dt, tLoop, T, solidF, liqF, gasF);
  updateBursts(dt);

  /* ---- 渲染 ---- */
  render(tLoop, T, solidF, liqF, gasF, Q);

  /* ---- 滑块同步 ---- */
  if (!manualMode){
    slider.value = Math.round(Q * 1000);
  }

  requestAnimationFrame(frame);
}

/* ==========================================================
   交互
   ========================================================== */
let dragging = false, lastMX = 0, lastMY = 0, dragDist = 0;

canvas.addEventListener('mousedown', e=>{
  dragging = true; dragDist = 0;
  lastMX = e.clientX; lastMY = e.clientY;
});
window.addEventListener('mousemove', e=>{
  if (!dragging) return;
  const dx = e.clientX - lastMX;
  const dy = e.clientY - lastMY;
  lastMX = e.clientX; lastMY = e.clientY;
  dragDist += Math.abs(dx) + Math.abs(dy);
  userYaw   += dx * 0.006;
  userPitch  = clamp(userPitch + dy * 0.005, -0.85, 1.15);
});
window.addEventListener('mouseup', ()=>{
  if (dragging && dragDist < 6 && manualMode){
    manualMode = false;
    modeLabel.textContent = '自动';
  }
  dragging = false;
});

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camDist = clamp(camDist + e.deltaY * 0.07, 55, 260);
}, { passive:false });

canvas.addEventListener('touchstart', e=>{
  if (e.touches.length === 1){
    dragging = true; dragDist = 0;
    lastMX = e.touches[0].clientX;
    lastMY = e.touches[0].clientY;
  }
}, { passive:true });

canvas.addEventListener('touchmove', e=>{
  if (!dragging || e.touches.length !== 1) return;
  const t0 = e.touches[0];
  const dx = t0.clientX - lastMX;
  const dy = t0.clientY - lastMY;
  lastMX = t0.clientX; lastMY = t0.clientY;
  dragDist += Math.abs(dx) + Math.abs(dy);
  userYaw   += dx * 0.008;
  userPitch  = clamp(userPitch + dy * 0.006, -0.85, 1.15);
}, { passive:true });

canvas.addEventListener('touchend', ()=>{
  if (dragging && dragDist < 7 && manualMode){
    manualMode = false;
    modeLabel.textContent = '自动';
  }
  dragging = false;
}, { passive:true });

slider.addEventListener('input', ()=>{
  manualMode = true;
  manualQ = slider.value / 1000;
  modeLabel.textContent = '手动';
});

/* ==========================================================
   启动
   ========================================================== */
requestAnimationFrame(frame);
</script>
</body>
</html>
