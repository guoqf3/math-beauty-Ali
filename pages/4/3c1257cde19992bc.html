<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>史瓦西进动 · 弯曲时空编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>史瓦西进动 · 弯曲时空编织</h2>
        <div class="sub">Schwarzschild bound orbits · Perihelion precession · M=1</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">d²u/dφ² + u = 1/L² + 3u²</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">Veff = −1/r + L²/2r² − L²/r³</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">Δφ = 2π + 6πM²/L²</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.2, 2.1, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.4;

        // 球极投影
        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            if (denom < 1e-6) return null;
            const f = 2 * PROJ_D * SPHERE_R / denom;
            return new THREE.Vector3(px * f, py * f, (px * px + py * py - PROJ_D * PROJ_D) / denom * SPHERE_R);
        }

        // RK4积分：d²u/dφ² = f(u) = 1/L² - u + 3u²
        function f(u, L2) {
            return 1 / L2 - u + 3 * u * u;
        }

        function integrateOrbit(u0, du0, L2, phiMax, steps) {
            const dphi = phiMax / steps;
            let u = u0;
            let du = du0;
            const pts = [];
            for (let i = 0; i <= steps; i++) {
                const phi = i * dphi;
                const r = 1 / u;
                const px = r * Math.cos(phi);
                const py = r * Math.sin(phi);
                const sp = stereographic(px, py);
                if (sp && sp.length() < 9.0 && r < 35) pts.push(sp);

                // RK4
                const k1u = du;
                const k1du = f(u, L2);
                const k2u = du + k1du * dphi * 0.5;
                const k2du = f(u + k1u * dphi * 0.5, L2);
                const k3u = du + k2du * dphi * 0.5;
                const k3du = f(u + k2u * dphi * 0.5, L2);
                const k4u = du + k3du * dphi;
                const k4du = f(u + k3u * dphi, L2);

                u += (k1u + 2 * k2u + 2 * k3u + k4u) * dphi / 6;
                du += (k1du + 2 * k2du + 2 * k3du + k4du) * dphi / 6;
                if (u < 0.005 || u > 0.4) break;
            }
            return pts;
        }

        // 从远星点出发（du=0，u取较小值）
        function generateOrbitFamily(L, u0Values, color, opacity, phiMax, steps) {
            const group = new THREE.Group();
            const L2 = L * L;
            for (const u0 of u0Values) {
                const pts = integrateOrbit(u0, 0, L2, phiMax, steps);
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity,
                        depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'schwarzschild-weave';
        scene.add(rootGroup);

        const phiMax = 14 * Math.PI;
        const steps = 480;

        // 金色族：L=3.75，明显进动，快速绕转
        const goldU0 = [0.04, 0.05, 0.06, 0.07, 0.08, 0.09, 0.10, 0.11, 0.12, 0.13, 0.14, 0.15, 0.16, 0.17];
        rootGroup.add(generateOrbitFamily(3.75, goldU0, COLOR_GOLD, 0.60, phiMax, steps));

        // 金色族补充：L=3.9
        const goldU0b = [0.045, 0.055, 0.065, 0.075, 0.085, 0.095, 0.105, 0.115, 0.125, 0.135, 0.145, 0.155];
        rootGroup.add(generateOrbitFamily(3.9, goldU0b, COLOR_GOLD, 0.52, phiMax * 0.85, steps));

        // 青色族：L=4.3，中等进动
        const cyanU0 = [0.035, 0.045, 0.055, 0.065, 0.075, 0.085, 0.095, 0.105, 0.115, 0.125, 0.135, 0.145, 0.155];
        rootGroup.add(generateOrbitFamily(4.3, cyanU0, COLOR_CYAN, 0.60, phiMax, steps));
        const cyanU0b = [0.04, 0.05, 0.06, 0.07, 0.08, 0.09, 0.10, 0.11, 0.12, 0.13, 0.14, 0.15];
        rootGroup.add(generateOrbitFamily(4.6, cyanU0b, COLOR_CYAN, 0.52, phiMax * 0.85, steps));

        // 品红族：L=5.2，接近椭圆但仍有少量进动
        const magentaU0 = [0.03, 0.04, 0.05, 0.06, 0.07, 0.08, 0.09, 0.10, 0.11, 0.12, 0.13, 0.14, 0.15, 0.16];
        rootGroup.add(generateOrbitFamily(5.2, magentaU0, COLOR_MAGENTA, 0.60, phiMax, steps));
        const magentaU0b = [0.035, 0.045, 0.055, 0.065, 0.075, 0.085, 0.095, 0.105, 0.115, 0.125, 0.135];
        rootGroup.add(generateOrbitFamily(5.8, magentaU0b, COLOR_MAGENTA, 0.50, phiMax * 0.85, steps));

        // 额外：近圆轨道附近更密集
        const goldNearCirc = [0.100, 0.102, 0.104, 0.098, 0.096];
        rootGroup.add(generateOrbitFamily(3.75, goldNearCirc, COLOR_GOLD, 0.45, phiMax * 0.7, Math.floor(steps * 0.8)));
        const cyanNearCirc = [0.071, 0.073, 0.075, 0.069, 0.067];
        rootGroup.add(generateOrbitFamily(4.3, cyanNearCirc, COLOR_CYAN, 0.45, phiMax * 0.7, Math.floor(steps * 0.8)));
        const magentaNearCirc = [0.045, 0.047, 0.049, 0.043, 0.041];
        rootGroup.add(generateOrbitFamily(5.2, magentaNearCirc, COLOR_MAGENTA, 0.45, phiMax * 0.7, Math.floor(steps * 0.8)));

        // 参考球面网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const ang = j * 2 * Math.PI / 240;
                pts.push(new THREE.Vector3(r * Math.cos(ang), z, r * Math.sin(ang)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.10, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const theta = 0.02 + j * Math.PI / 240;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }

        console.log('史瓦西进动轨道总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.2 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 史瓦西进动弯曲时空编织动画已稳定运行');
    </script>
</body>
</html>
