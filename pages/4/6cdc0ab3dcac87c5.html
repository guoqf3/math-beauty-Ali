<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>费马大定理 · 数论</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#03030a;
  }
  canvas { display:block; }

  #topText {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    width:min(82vw,1060px);
    min-height:2.4em;
    text-align:center;
    color:#f0e0b0;
    font-size:clamp(13px,1.5vw,19.5px);
    letter-spacing:.07em;
    line-height:1.75;
    font-weight:400;
    text-shadow:0 0 16px rgba(255,210,110,.75),
                0 0 46px rgba(255,160,60,.35);
    pointer-events:none;
    z-index:10;
  }
  #topText::after {
    content:'';
    display:inline-block;
    width:2px; height:.95em;
    background:#ffd070;
    margin-left:5px;
    vertical-align:-.12em;
    box-shadow:0 0 9px #ffd070;
    animation:blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50%{opacity:0;} }

  .formula {
    position:fixed;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    color:rgba(255,210,140,.55);
    font-size:clamp(11px,1.02vw,15.5px);
    letter-spacing:.05em;
    pointer-events:none;
    z-index:10;
    text-shadow:0 0 14px rgba(255,180,70,.55);
    line-height:1.75;
  }
  .f-tl { top:94px; left:24px; text-align:left; }
  .f-tr { top:94px; right:24px; text-align:right; }
  .f-bl { bottom:44px; left:24px; text-align:left; }

  #nDisplay {
    color:#ffd080;
    font-size:1.15em;
    text-shadow:0 0 18px rgba(255,180,70,.9);
  }

  #panel {
    position:fixed; right:24px; bottom:44px;
    width:240px;
    padding:13px 15px 11px;
    background:rgba(20,14,8,.55);
    border:1px solid rgba(255,180,80,.25);
    border-radius:11px;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    color:#d8ba8c;
    font-size:12px;
    z-index:20;
    box-shadow:0 6px 30px rgba(0,0,0,.55),
               inset 0 0 22px rgba(255,150,50,.08);
  }
  #panel .row {
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:4px 8px;
    margin-bottom:11px;
  }
  #panel .row label { grid-column:1/3; letter-spacing:.05em; }
  #panel .row .val {
    font-family:"Cambria Math",Georgia,serif;
    color:#ffd27a;
    font-size:13px;
    min-width:46px;
    text-align:right;
  }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:100%; height:3px; border-radius:3px;
    background:linear-gradient(90deg,#ffcc44,#ff5a2a,#cc2244);
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:#fff2d0;
    box-shadow:0 0 12px rgba(255,190,80,.95);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb {
    width:13px; height:13px; border:none; border-radius:50%;
    background:#fff2d0;
    box-shadow:0 0 12px rgba(255,190,80,.95);
    cursor:pointer;
  }
  #panel .hint {
    text-align:center;
    font-size:10.5px;
    color:rgba(215,180,130,.5);
    letter-spacing:.1em;
    margin-top:2px;
  }
</style>
</head>
<body>

<div id="topText"></div>

<div class="formula f-tl">
  xⁿ + yⁿ = zⁿ　n &gt; 2　无非平凡正整数解
</div>
<div class="formula f-tr">
  指数 n = <span id="nDisplay">2.00</span><br>
  <span style="font-size:.85em;color:rgba(255,190,100,.45)">椭圆曲线 ↔ 模形式</span>
</div>
<div class="formula f-bl">
  n = 2　解存在（毕达哥拉斯）<br>
  n &gt; 2　解消失（费马 · 怀尔斯）
</div>

<div id="panel">
  <div class="row">
    <label>指数 n （临界转变 ≈ 2 → 3）</label>
    <input id="sN" type="range" min="2" max="5.5" step="0.01" value="2.0">
    <span class="val" id="vN">2.00</span>
  </div>
  <div class="hint">拖拽旋转 · 观察解空间形态</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x03030a, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03030a, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 900);
camera.position.set(8.5, 6.5, 11.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.38;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.96;

/* ============================================================
   光点贴图
   ============================================================ */
function createSpriteTexture(){
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.18,'rgba(255,255,255,0.82)');
  g.addColorStop(0.46,'rgba(255,255,255,0.22)');
  g.addColorStop(1.00,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,s,s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPRITE = createSpriteTexture();

/* ============================================================
   常数
   ============================================================ */
const DURATION = 30;
const SCALE    = 2.65;      // 形状缩放
const EPS      = 1e-6;

/* ============================================================
   星空背景
   ============================================================ */
(function buildStars(){
  const COUNT = 1600;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++){
    const r  = 70 + Math.random() * 180;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3    ] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.cos(ph) * 0.7 + 15;
    pos[i*3 + 2] = r * Math.sin(ph) * Math.sin(th);

    const t = Math.random();
    col[i*3    ] = 0.75 + 0.25 * t;
    col[i*3 + 1] = 0.70 + 0.25 * t;
    col[i*3 + 2] = 0.55 + 0.20 * t;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 0.85, map: SPRITE, vertexColors: true,
    transparent: true, opacity: 0.65,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(g, m));
})();

/* ============================================================
   构建 |x|ⁿ+|y|ⁿ+|z|ⁿ = 1 的线框雕塑
   ============================================================ */
const dirX = [];
const dirY = [];
const dirZ = [];
const segments = [];

function pushVert(theta, phi){
  const st = Math.sin(theta);
  const ct = Math.cos(theta);
  const cp = Math.cos(phi);
  const sp = Math.sin(phi);
  dirX.push(st * cp);
  dirY.push(ct);
  dirZ.push(st * sp);
  return dirX.length - 1;
}

const N_MER = 18, SEG_MER = 40;
const N_PAR = 14, SEG_PAR = 44;

// 经线（φ 固定，θ 从 0 到 π）
for (let m = 0; m < N_MER; m++){
  const phi = m * Math.PI * 2 / N_MER;
  let prev = -1;
  for (let i = 0; i <= SEG_MER; i++){
    const theta = i * Math.PI / SEG_MER;
    const idx = pushVert(theta, phi);
    if (prev >= 0) segments.push(prev, idx);
    prev = idx;
  }
}

// 纬线（θ 固定，φ 绕一圈）
for (let p = 1; p < N_PAR; p++){
  const theta = p * Math.PI / N_PAR;
  let prev = -1;
  for (let i = 0; i <= SEG_PAR; i++){
    const phi = i * Math.PI * 2 / SEG_PAR;
    const idx = pushVert(theta, phi);
    if (prev >= 0) segments.push(prev, idx);
    prev = idx;
  }
}

const NUM_V = dirX.length;
const surfPos = new Float32Array(NUM_V * 3);

const surfGeo = new THREE.BufferGeometry();
surfGeo.setAttribute('position', new THREE.BufferAttribute(surfPos, 3));
surfGeo.setIndex(segments);

/* ---- 主网格：金色细线 ---- */
const surfMat = new THREE.LineBasicMaterial({
  color: 0xffcc66,
  transparent: true,
  opacity: 0.72,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const surfMesh = new THREE.LineSegments(surfGeo, surfMat);
surfMesh.frustumCulled = false;
surfMesh.renderOrder = 3;
scene.add(surfMesh);

/* ---- 高亮经线（略微更亮） ---- */
const accentIdx = [];
for (let m = 0; m < N_MER; m += 3){
  const phi = m * Math.PI * 2 / N_MER;
  let prev = -1;
  const tmp = [];
  for (let i = 0; i <= SEG_MER; i++){
    const theta = i * Math.PI / SEG_MER;
    const st = Math.sin(theta), ct = Math.cos(theta);
    const cp = Math.cos(phi), sp = Math.sin(phi);
    dirX.push(st * cp);
    dirY.push(ct);
    dirZ.push(st * sp);
    const idx = dirX.length - 1;
    if (prev >= 0) tmp.push(prev, idx);
    prev = idx;
  }
  accentIdx.push(...tmp);
}
const accentGeo = new THREE.BufferGeometry();
const accentPos = new Float32Array(dirX.length * 3);
accentGeo.setAttribute('position', new THREE.BufferAttribute(accentPos, 3));
accentGeo.setIndex(accentIdx);
const accentMat = new THREE.LineBasicMaterial({
  color: 0xffaa44,
  transparent: true,
  opacity: 0.92,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const accentMesh = new THREE.LineSegments(accentGeo, accentMat);
accentMesh.frustumCulled = false;
accentMesh.renderOrder = 4;
scene.add(accentMesh);

const TOTAL_V = dirX.length;

/* ============================================================
   解粒子云（当 n≈2 时存在）
   ============================================================ */
const PART_N = 2400;
const pdirX = new Float32Array(PART_N);
const pdirY = new Float32Array(PART_N);
const pdirZ = new Float32Array(PART_N);
const pPhase = new Float32Array(PART_N);

for (let i = 0; i < PART_N; i++){
  const u = Math.random() * 2 - 1;
  const theta = Math.acos(u);
  const phi = Math.random() * Math.PI * 2;
  pdirX[i] = Math.sin(theta) * Math.cos(phi);
  pdirY[i] = Math.cos(theta);
  pdirZ[i] = Math.sin(theta) * Math.sin(phi);
  pPhase[i] = Math.random() * Math.PI * 2;
}

const partPos = new Float32Array(PART_N * 3);
const partCol = new Float32Array(PART_N * 3);

const partGeo = new THREE.BufferGeometry();
partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
partGeo.setAttribute('color',    new THREE.BufferAttribute(partCol, 3));

const partMat = new THREE.PointsMaterial({
  size: 0.075,
  map: SPRITE,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});

const partPoints = new THREE.Points(partGeo, partMat);
partPoints.frustumCulled = false;
partPoints.renderOrder = 6;
scene.add(partPoints);

/* ============================================================
   临界红色闪光
   ============================================================ */
const flashSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: SPRITE,
  color: 0xff2244,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
flashSprite.scale.setScalar(1);
flashSprite.renderOrder = 9;
scene.add(flashSprite);

/* ============================================================
   旋转光环
   ============================================================ */
const rings = [];
for (let i = 0; i < 3; i++){
  const ringGeo = new THREE.TorusGeometry(4.0 + i * 0.42, 0.012, 6, 140);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffcc66,
    transparent: true,
    opacity: 0.22 - i * 0.045,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 + i * 0.42;
  ring.rotation.z = i * 0.75;
  ring.renderOrder = 2;
  scene.add(ring);
  rings.push(ring);
}

/* ============================================================
   半径计算：|dx|ⁿ + |dy|ⁿ + |dz|ⁿ 之和取 −1/n 次幂
   ============================================================ */
function computeRadii(n, out){
  for (let i = 0; i < out.length; i++){
    const ax = Math.abs(dirX[i]);
    const ay = Math.abs(dirY[i]);
    const az = Math.abs(dirZ[i]);
    const s = Math.pow(ax < EPS ? EPS : ax, n)
            + Math.pow(ay < EPS ? EPS : ay, n)
            + Math.pow(az < EPS ? EPS : az, n);
    out[i] = Math.pow(s, -1 / n);
  }
}

const radii = new Float32Array(TOTAL_V);
const radiiA = new Float32Array(TOTAL_V);

/* ============================================================
   更新雕塑顶点
   ============================================================ */
function updateSculpture(n){
  computeRadii(n, radii);

  // 主线框
  for (let i = 0; i < NUM_V; i++){
    const r = radii[i] * SCALE;
    surfPos[i*3    ] = dirX[i] * r;
    surfPos[i*3 + 1] = dirY[i] * r;
    surfPos[i*3 + 2] = dirZ[i] * r;
  }
  surfGeo.attributes.position.needsUpdate = true;

  // 高亮经线
  for (let i = 0; i < TOTAL_V; i++){
    const r = radii[i] * SCALE;
    accentPos[i*3    ] = dirX[i] * r;
    accentPos[i*3 + 1] = dirY[i] * r;
    accentPos[i*3 + 2] = dirZ[i] * r;
  }
  accentGeo.attributes.position.needsUpdate = true;
}

/* ============================================================
   参数 n 的时间曲线
   ============================================================ */
function computeN(t){
  t = ((t % DURATION) + DURATION) % DURATION;
  if (t < 4)   return 2.0;
  if (t < 10)  return 2.0 + (t - 4) / 6 * 0.9;      // 2.0 → 2.9
  if (t < 13)  return 2.9 + (t - 10) / 3 * 0.2;     // 2.9 → 3.1
  if (t < 22)  return 3.1 + (t - 13) / 9 * 2.4;     // 3.1 → 5.5
  if (t < 27)  return 5.5;
  return 5.5 - (t - 27) / 3 * 3.5;                  // 5.5 → 2.0
}

/* ============================================================
   平滑阶跃
   ============================================================ */
function smoothstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/* ============================================================
   顶部文字
   ============================================================ */
const FULL_TEXT = '费马大定理历经358年证明一个看似简单的猜想——最简洁的方程可能是最深奥的山峰，启示真理的简洁与证明之路的漫长专注之美。';
const topTextEl = document.getElementById('topText');
let lastShown = '';

function updateTopText(animT){
  const prog  = smoothstep(0.8, 25.0, animT);
  const n     = Math.floor(prog * FULL_TEXT.length);
  const shown = FULL_TEXT.slice(0, n);
  if (shown !== lastShown){
    topTextEl.textContent = shown;
    lastShown = shown;
  }
}

/* ============================================================
   界面
   ============================================================ */
const sNEl    = document.getElementById('sN');
const vNEl    = document.getElementById('vN');
const nDispEl = document.getElementById('nDisplay');

let manualN     = 2.0;
let manualTimer = 0;

sNEl.addEventListener('input', e => {
  manualN     = parseFloat(e.target.value);
  manualTimer = 5.0;
  vNEl.textContent = manualN.toFixed(2);
  nDispEl.textContent = manualN.toFixed(2);
});

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let animT = 0;

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  animT += dt;
  if (animT >= DURATION) animT -= DURATION;

  /* ---- 决定当前的 n ---- */
  let n;
  if (manualTimer > 0){
    manualTimer -= dt;
    n = manualN;
  } else {
    n = computeN(animT);
    // 同步滑块与显示
    const shown = n.toFixed(2);
    if (vNEl.textContent !== shown){
      vNEl.textContent = shown;
      nDispEl.textContent = shown;
      if (document.activeElement !== sNEl){
        sNEl.value = shown;
      }
    }
  }

  /* ---- 更新雕塑 ---- */
  updateSculpture(n);

  /* ---- 解粒子云 ---- */
  const pAlpha = 1 - smoothstep(2.0, 2.9, n);
  partPoints.visible = pAlpha > 0.005;
  partMat.opacity = pAlpha * 0.95;

  if (partPoints.visible){
    const baseR = 3.05;
    for (let i = 0; i < PART_N; i++){
      const i3 = i * 3;
      const r  = baseR
               + Math.sin(animT * 1.6 + pPhase[i]) * 0.22
               + Math.sin(animT * 0.7 + pPhase[i] * 2.3) * 0.10;

      partPos[i3    ] = pdirX[i] * r;
      partPos[i3 + 1] = pdirY[i] * r;
      partPos[i3 + 2] = pdirZ[i] * r;

      // 冷白偏青，随 n 增大更偏红（暗示解在消逝）
      const warm = smoothstep(2.0, 2.9, n);
      partCol[i3    ] = 0.75 + 0.25 * warm;
      partCol[i3 + 1] = 0.90 - 0.25 * warm;
      partCol[i3 + 2] = 1.00 - 0.55 * warm;
    }
    partGeo.attributes.position.needsUpdate = true;
    partGeo.attributes.color.needsUpdate = true;
  }

  /* ---- 临界红色闪光 ---- */
  const flashRaw = Math.max(0, 1 - Math.abs(animT - 11.5) / 2.6);
  const flash    = flashRaw * flashRaw * (3 - 2 * flashRaw);

  flashSprite.material.opacity = flash * 0.55;
  const fs = 2.5 + flash * 9.0;
  flashSprite.scale.set(fs, fs, 1);

  /* ---- 旋转光环 ---- */
  for (let i = 0; i < rings.length; i++){
    rings[i].rotation.z += dt * (0.12 + i * 0.07);
    rings[i].rotation.y += dt * (0.06 + i * 0.03);
  }

  /* ---- 雕塑整体透明度随淡入 ---- */
  const fade = smoothstep(0, 0.8, animT) * (1 - smoothstep(28.5, 29.9, animT));
  surfMat.opacity   = 0.72 * fade;
  accentMat.opacity = 0.92 * fade;

  /* ---- 顶部文字 ---- */
  updateTopText(animT);

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   初始化
   ============================================================ */
updateSculpture(2.0);
animate();

/* ============================================================
   自适应
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
