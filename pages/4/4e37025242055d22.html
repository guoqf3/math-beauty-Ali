<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三轴轨道编织 · 旋转群圆族</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>三轴轨道编织 · 旋转群圆族</h2>
        <div class="sub">Three orthogonal rotation axes · Circular orbit families on S²</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">绕x轴: {Rₓ(θ)·p₀ | θ∈[0,2π]}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">绕y轴: {R_y(θ)·p₀ | θ∈[0,2π]}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">绕z轴: {R_z(θ)·p₀ | θ∈[0,2π]}</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.6, 2.5, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const RADIUS = 2.65;
        const CIRCLE_POINTS = 340;

        // 生成绕给定轴旋转的圆族
        function createOrbitFamily(axis, color, opacity, numOrbits, numPoints) {
            const group = new THREE.Group();
            // 构建两个正交于axis的方向
            let u, v;
            if (Math.abs(axis.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(axis).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(axis).normalize();
            }
            v = axis.clone().cross(u).normalize();

            // 生成多个不同"纬度"的圆——圆的平面在axis上的投影位置
            const maxOffset = RADIUS * 0.86;
            for (let i = 0; i < numOrbits; i++) {
                const offset = -maxOffset + i * 2 * maxOffset / (numOrbits - 1);
                const circleRadius = Math.sqrt(RADIUS * RADIUS - offset * offset);
                if (circleRadius < 0.03) continue;
                const center = axis.clone().multiplyScalar(offset);
                const pts = [];
                const dAngle = 2 * Math.PI / numPoints;
                for (let j = 0; j <= numPoints; j++) {
                    const angle = j * dAngle;
                    const pt = center.clone()
                        .add(u.clone().multiplyScalar(circleRadius * Math.cos(angle)))
                        .add(v.clone().multiplyScalar(circleRadius * Math.sin(angle)));
                    pts.push(pt);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 生成对角轴方向的圆族（斜向旋转）
        function createDiagonalOrbits(axis, color, opacity, numOrbits, numPoints) {
            const group = new THREE.Group();
            let u, v;
            if (Math.abs(axis.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(axis).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(axis).normalize();
            }
            v = axis.clone().cross(u).normalize();

            const maxOffset = RADIUS * 0.8;
            for (let i = 0; i < numOrbits; i++) {
                const offset = -maxOffset + i * 2 * maxOffset / (numOrbits - 1);
                const circleRadius = Math.sqrt(RADIUS * RADIUS - offset * offset);
                if (circleRadius < 0.03) continue;
                const center = axis.clone().multiplyScalar(offset);
                const pts = [];
                const dAngle = 2 * Math.PI / numPoints;
                for (let j = 0; j <= numPoints; j++) {
                    const angle = j * dAngle;
                    const pt = center.clone()
                        .add(u.clone().multiplyScalar(circleRadius * Math.cos(angle)))
                        .add(v.clone().multiplyScalar(circleRadius * Math.sin(angle)));
                    pts.push(pt);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'triaxial-orbits';
        scene.add(rootGroup);

        const numOrbits = 28;
        const numExtraOrbits = 16;

        // 金色族：绕x轴
        const axisX = new THREE.Vector3(1, 0, 0);
        rootGroup.add(createOrbitFamily(axisX, COLOR_GOLD, 0.60, numOrbits, CIRCLE_POINTS));
        rootGroup.add(createOrbitFamily(axisX, COLOR_GOLD, 0.38, numExtraOrbits, CIRCLE_POINTS));

        // 青色族：绕y轴
        const axisY = new THREE.Vector3(0, 1, 0);
        rootGroup.add(createOrbitFamily(axisY, COLOR_CYAN, 0.60, numOrbits, CIRCLE_POINTS));
        rootGroup.add(createOrbitFamily(axisY, COLOR_CYAN, 0.38, numExtraOrbits, CIRCLE_POINTS));

        // 品红族：绕z轴
        const axisZ = new THREE.Vector3(0, 0, 1);
        rootGroup.add(createOrbitFamily(axisZ, COLOR_MAGENTA, 0.60, numOrbits, CIRCLE_POINTS));
        rootGroup.add(createOrbitFamily(axisZ, COLOR_MAGENTA, 0.38, numExtraOrbits, CIRCLE_POINTS));

        // 对角方向（混合色，淡色）
        const diagAxis1 = new THREE.Vector3(1, 1, 1).normalize();
        rootGroup.add(createDiagonalOrbits(diagAxis1, COLOR_GOLD, 0.28, 14, CIRCLE_POINTS));
        const diagAxis2 = new THREE.Vector3(1, -1, 0.7).normalize();
        rootGroup.add(createDiagonalOrbits(diagAxis2, COLOR_CYAN, 0.28, 14, CIRCLE_POINTS));
        const diagAxis3 = new THREE.Vector3(0.5, 1, -1).normalize();
        rootGroup.add(createDiagonalOrbits(diagAxis3, COLOR_MAGENTA, 0.28, 14, CIRCLE_POINTS));

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = RADIUS * Math.sin(lat);
            const z = RADIUS * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const phi = j * 2 * Math.PI / 240;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const theta = 0.02 + j * Math.PI / 240;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(RADIUS * st * Math.cos(phi), RADIUS * Math.cos(theta), RADIUS * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        console.log('三轴旋转轨道编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        scheduleFrame();

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 三轴旋转轨道族编织动画已稳定运行');
    </script>
</body>
</html>
