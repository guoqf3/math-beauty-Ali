<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>螺旋面 · 旋转对称 · 直纹交织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>螺旋面 · 旋转对称 · 直纹交织</h2>
        <div class="sub">Helicoid ruled surface · C₃ symmetry · Spatial interlacing</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">r(u,v) = (u cos v , u sin v , c v)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">C₃ 旋转 : (x,y,z) ↦ (cos120° -... )</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">渐近线网 : u=const · v=const</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 30);
        camera.position.set(3.2, 2.5, 8.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        clock.start();

        // ---------- 颜色 ----------
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // ---------- 螺旋面线框生成 ----------
        function createHelicoidWireframe(c, uMin, uMax, uSteps, vMin, vMax, vSteps, color) {
            const group = new THREE.Group();

            // u-曲线 (螺旋线) ：固定 u，v 变化
            const uValues = [];
            const du = (uMax - uMin) / uSteps;
            for (let i = 0; i <= uSteps; i++) {
                uValues.push(uMin + i * du);
            }
            const vValues = [];
            const dv = (vMax - vMin) / vSteps;
            const vCount = vSteps + 1;

            // 构建所有 u-曲线（每条曲线是v方向）
            const uLineCount = uValues.length;
            const vCountTotal = vCount;
            const pointsPerULine = vCountTotal;
            // 合并所有u线线段进一个positions数组？ 线段需要使用索引。 LineSegments需要两个顶点一条。简单使用 Line 几何体，每条线一个几何体，但会创建大量对象。 为了性能，我们将所有u线合并为一个 LineSegments，每条u线由若干线段组成。
            // 我们可以为 u-曲线 和 v-曲线 分别生成一个 LineSegments 对象，包含所有线段。

            const buildLines = (fixedParamArray, isUCurve) => {
                // 如果是 u曲线，则固定u，遍历v；如果是 v曲线，则固定v，遍历u。
                const totalLines = fixedParamArray.length;
                const totalVertices = totalLines * (isUCurve ? vCountTotal : (uSteps + 1)) * 2; // 每个线段2个点
                const positions = new Float32Array(totalVertices * 3);
                let idx = 0;
                if (isUCurve) {
                    // 每条u曲线有 (vCountTotal-1) 个线段
                    for (const uVal of fixedParamArray) {
                        for (let j = 0; j < vValues.length - 1; j++) {
                            const v1 = vValues[j];
                            const v2 = vValues[j + 1];
                            const x1 = uVal * Math.cos(v1);
                            const y1 = uVal * Math.sin(v1);
                            const z1 = c * v1;
                            const x2 = uVal * Math.cos(v2);
                            const y2 = uVal * Math.sin(v2);
                            const z2 = c * v2;
                            positions[idx++] = x1; positions[idx++] = y1; positions[idx++] = z1;
                            positions[idx++] = x2; positions[idx++] = y2; positions[idx++] = z2;
                        }
                    }
                } else {
                    // v曲线固定v，遍历u
                    const uVals = [];
                    const du2 = (uMax - uMin) / uSteps;
                    for (let i = 0; i <= uSteps; i++) uVals.push(uMin + i * du2);
                    for (const vVal of fixedParamArray) {
                        for (let i = 0; i < uVals.length - 1; i++) {
                            const u1 = uVals[i];
                            const u2 = uVals[i + 1];
                            const x1 = u1 * Math.cos(vVal);
                            const y1 = u1 * Math.sin(vVal);
                            const z1 = c * vVal;
                            const x2 = u2 * Math.cos(vVal);
                            const y2 = u2 * Math.sin(vVal);
                            const z2 = c * vVal;
                            positions[idx++] = x1; positions[idx++] = y1; positions[idx++] = z1;
                            positions[idx++] = x2; positions[idx++] = y2; positions[idx++] = z2;
                        }
                    }
                }
                return positions;
            };

            // 生成 u-曲线 线段集
            const uPositions = buildLines(uValues, true);
            const uGeom = new THREE.BufferGeometry();
            uGeom.setAttribute('position', new THREE.BufferAttribute(uPositions, 3));
            const uMat = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.65,
                depthWrite: true,
                depthTest: true,
            });
            group.add(new THREE.LineSegments(uGeom, uMat));

            // 生成 v-曲线 线段集
            const vPositions = buildLines(vValues, false);
            const vGeom = new THREE.BufferGeometry();
            vGeom.setAttribute('position', new THREE.BufferAttribute(vPositions, 3));
            const vMat = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.5,
                depthWrite: true,
                depthTest: true,
            });
            group.add(new THREE.LineSegments(vGeom, vMat));

            return group;
        }

        // 螺旋面参数
        const uMin = -2.8;
        const uMax = 2.8;
        const uSteps = 28;   // 产生29条u曲线
        const vMin = -4 * Math.PI;
        const vMax = 4 * Math.PI;
        const vSteps = 120;  // 产生121条v曲线
        const c = 0.38; // 螺距常数

        // 创建三个螺旋面实例，分别对应三种颜色，并绕 Z 轴旋转 0°, 120°, 240°
        const rootGroup = new THREE.Group();
        rootGroup.name = 'helicoid-symmetry';
        scene.add(rootGroup);

        const colors = [COLOR_GOLD, COLOR_CYAN, COLOR_MAGENTA];
        const angles = [0, 2 * Math.PI / 3, 4 * Math.PI / 3];

        const helicoidGroups = [];

        for (let i = 0; i < 3; i++) {
            const wireframe = createHelicoidWireframe(c, uMin, uMax, uSteps, vMin, vMax, vSteps, colors[i]);
            const pivot = new THREE.Group();
            pivot.add(wireframe);
            pivot.rotation.z = angles[i];
            rootGroup.add(pivot);
            helicoidGroups.push({ group: pivot, baseAngle: angles[i] });
        }

        // ---------- 附加：中心线骨架（沿Z轴）以增强视觉效果 ----------
        // 在三个螺旋面交汇的中心区域添加一些轴射线，形成编织感
        const axisGroup = new THREE.Group();
        axisGroup.name = 'axis-lines';
        // 生成沿着Z轴的多条螺旋线（金色、青色、品红各有些）
        const axisColors = [COLOR_GOLD, COLOR_CYAN, COLOR_MAGENTA];
        for (let k = 0; k < 3; k++) {
            const pts = [];
            const radius = 0.3 + k * 0.15;
            const turns = 12;
            const pointsCount = 800;
            for (let i = 0; i <= pointsCount; i++) {
                const t = (i / pointsCount) * turns * Math.PI;
                const x = radius * Math.cos(t);
                const y = radius * Math.sin(t);
                const z = c * t;
                pts.push(new THREE.Vector3(x, y, z));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: axisColors[k],
                linewidth: 1,
                transparent: true,
                opacity: 0.55,
                depthTest: true,
                depthWrite: true,
            });
            axisGroup.add(new THREE.Line(geom, mat));
        }
        rootGroup.add(axisGroup);

        // ---------- 背景星点 ----------
        const starsGroup = new THREE.Group();
        starsGroup.name = 'stars';
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 400;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 9;
            starsPositions[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPositions[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPositions[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.5,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---------- 动画循环（setAnimationLoop 确保稳定）----------
        function animate() {
            const elapsed = clock.getElapsedTime();

            // 整体组绕 X 和 Y 轴缓慢旋转
            rootGroup.rotation.x = elapsed * 0.13;
            rootGroup.rotation.y = elapsed * 0.22;
            rootGroup.rotation.z = elapsed * 0.07;

            // 内部轴组相对旋转
            axisGroup.rotation.z = elapsed * 0.35;

            // 背景星点旋转
            starsGroup.rotation.y = elapsed * 0.03;
            starsGroup.rotation.x = elapsed * 0.02;

            // 相机环绕
            const camRadius = 8.5;
            const camAngle = elapsed * 0.09;
            const camHeight = 2.8 + Math.sin(elapsed * 0.18) * 1.0;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);

        // ---------- 窗口缩放 ----------
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
        onResize();

        console.log('✨ 螺旋面·三阶对称动画已启动');
    </script>
</body>
</html>
