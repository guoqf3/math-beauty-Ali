<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正二十面体对称网 · 15大圆编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
        }
        #canvas-container { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1; }
        canvas { display:block; }
        .overlay-title {
            position:fixed; top:0; left:0; right:0; z-index:10; pointer-events:none;
            padding:22px 20px 8px; text-align:center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight:400; letter-spacing:0.13em;
            color:#e8d5b0; text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin:0 0 2px; line-height:1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem); letter-spacing:0.22em; color:rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position:fixed; bottom:0; left:0; right:0; z-index:10; pointer-events:none;
            padding:8px 20px 18px; text-align:center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem); color:rgba(210,200,185,0.8); letter-spacing:0.03em; line-height:1.7;
        }
        .clr-gold { color:#d4a843; font-weight:bold; }
        .clr-cyan { color:#45b7aa; font-weight:bold; }
        .clr-magenta { color:#d4708a; font-weight:bold; }
        .formula-sep { display:inline-block; margin:0 14px; color:rgba(150,140,130,0.35); }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>正二十面体对称网 · 15大圆编织</h2>
        <div class="sub">Icosahedral 2‑fold axes · 15 symmetry planes · Great circle bundles</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">Γₓ: 法向·x̂ > cos65°</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">Γ_y: 法向·ŷ > cos65°</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">Γ_z: 法向·ẑ > cos65°</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        const getElapsed = () => clock.getElapsedTime();

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const RADIUS = 2.65;
        const CIRCLE_POINTS = 340;
        const OFFSETS = [-0.45, -0.26, -0.10, 0.0, 0.10, 0.26, 0.45];
        const EXTRA_OFFSETS = [-0.36, -0.18, 0.06, 0.18, 0.36];
        const PHI_G = (1 + Math.sqrt(5)) / 2;

        // ---- 正二十面体顶点（未归一化）----
        function icoVerticesRaw() {
            const v = [];
            const coords = [
                [0, 1, PHI_G], [0, 1, -PHI_G], [0, -1, PHI_G], [0, -1, -PHI_G],
                [1, PHI_G, 0], [1, -PHI_G, 0], [-1, PHI_G, 0], [-1, -PHI_G, 0],
                [PHI_G, 0, 1], [PHI_G, 0, -1], [-PHI_G, 0, 1], [-PHI_G, 0, -1]
            ];
            for (const [x, y, z] of coords) {
                const len = Math.sqrt(x * x + y * y + z * z);
                v.push(new THREE.Vector3(x / len, y / len, z / len));
            }
            return v;
        }

        const vertices = icoVerticesRaw();
        const N = vertices.length; // 12

        // ---- 寻找30条边（距离=最短邻近距离）----
        const edgeDists = [];
        for (let i = 0; i < N; i++) {
            for (let j = i + 1; j < N; j++) {
                edgeDists.push({ i, j, d2: vertices[i].distanceToSquared(vertices[j]) });
            }
        }
        edgeDists.sort((a, b) => a.d2 - b.d2);
        // 取前30条作为边
        const edges = edgeDists.slice(0, 30);

        // ---- 计算二重轴方向（边中点方向）----
        const rawNormals = edges.map(e => {
            return vertices[e.i].clone().add(vertices[e.j]).normalize();
        });

        // ---- 去重：合并相反方向 ----
        const uniqueNormals = [];
        const tolerance = 0.08;
        for (const n of rawNormals) {
            let dup = false;
            for (const u of uniqueNormals) {
                const dot = Math.abs(n.dot(u));
                if (dot > 1 - tolerance) { dup = true; break; }
            }
            if (!dup) uniqueNormals.push(n);
        }
        console.log('唯一法向量数 (应为15):', uniqueNormals.length);

        // ---- 颜色分配 ----
        function assignColor(normal) {
            const ax = Math.abs(normal.x);
            const ay = Math.abs(normal.y);
            const az = Math.abs(normal.z);
            if (ax >= ay && ax >= az) return COLOR_GOLD;
            if (ay >= az) return COLOR_CYAN;
            return COLOR_MAGENTA;
        }

        // ---- 生成圆 ----
        function createCircle(normal, offsetDist, radius) {
            const n = normal.clone().normalize();
            let u, v;
            if (Math.abs(n.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(n).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(n).normalize();
            }
            v = n.clone().cross(u).normalize();
            const absD = Math.abs(offsetDist);
            if (absD >= radius - 0.005) return [];
            const cirR = Math.sqrt(radius * radius - offsetDist * offsetDist);
            const center = n.clone().multiplyScalar(offsetDist);
            const pts = [];
            const dAngle = 2 * Math.PI / CIRCLE_POINTS;
            for (let i = 0; i <= CIRCLE_POINTS; i++) {
                const angle = i * dAngle;
                pts.push(center.clone()
                    .add(u.clone().multiplyScalar(cirR * Math.cos(angle)))
                    .add(v.clone().multiplyScalar(cirR * Math.sin(angle))));
            }
            return pts;
        }

        // ---- 主组 ----
        const rootGroup = new THREE.Group();
        rootGroup.name = 'ico-symmetry-weave';
        scene.add(rootGroup);

        function addCircleLine(group, pts, color, opacity) {
            if (pts.length < 2) return;
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            group.add(new THREE.Line(geom, mat));
        }

        for (const normal of uniqueNormals) {
            const color = assignColor(normal);
            // 主偏移族
            for (const d of OFFSETS) {
                const pts = createCircle(normal, d * RADIUS, RADIUS);
                addCircleLine(rootGroup, pts, color, 0.58);
            }
            // 额外偏移族
            for (const d of EXTRA_OFFSETS) {
                const pts = createCircle(normal, d * RADIUS, RADIUS);
                addCircleLine(rootGroup, pts, color, 0.35);
            }
        }

        console.log('正二十面体对称网线条总数:', rootGroup.children.length);

        // 辅助球面参考线（极淡）
        for (let i = 0; i < 9; i++) {
            const lat = (i + 0.5) * Math.PI / 9;
            const r = RADIUS * Math.sin(lat);
            const z = RADIUS * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 6; k++) {
            const phi = k * Math.PI / 3;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(RADIUS * st * Math.cos(phi), RADIUS * Math.cos(theta), RADIUS * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const sc = 550;
        const sp = new Float32Array(sc * 3);
        for (let i = 0; i < sc; i++) {
            const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), d = 6.5 + Math.random() * 10;
            sp[i * 3] = d * Math.sin(ph) * Math.cos(th);
            sp[i * 3 + 1] = d * Math.sin(ph) * Math.sin(th);
            sp[i * 3 + 2] = d * Math.cos(ph);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(sp, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        })));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.27;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const cr = 7.6, ca = t * 0.08, ch = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        renderer.setAnimationLoop(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 正二十面体对称群二重轴大圆编织动画已稳定运行');
    </script>
</body>
</html>
