<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆锥曲线编织 · 共焦点椭圆双曲线网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
        }
        #canvas-container { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1; }
        canvas { display:block; }
        .overlay-title {
            position:fixed; top:0; left:0; right:0; z-index:10; pointer-events:none;
            padding:22px 20px 8px; text-align:center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight:400; letter-spacing:0.13em;
            color:#e8d5b0; text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin:0 0 2px; line-height:1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem); letter-spacing:0.22em; color:rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position:fixed; bottom:0; left:0; right:0; z-index:10; pointer-events:none;
            padding:8px 20px 18px; text-align:center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem); color:rgba(210,200,185,0.8); letter-spacing:0.03em; line-height:1.7;
        }
        .clr-gold { color:#d4a843; font-weight:bold; }
        .clr-cyan { color:#45b7aa; font-weight:bold; }
        .clr-magenta { color:#d4708a; font-weight:bold; }
        .formula-sep { display:inline-block; margin:0 14px; color:rgba(150,140,130,0.35); }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>共焦点圆锥曲线编织 · 球极投影网</h2>
        <div class="sub">Confocal ellipses & hyperbolas · Stereographic projection · Foci ±c</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">椭圆: |z+c|+|z−c|=2a, a>c</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">双曲线: ||z+c|−|z−c||=2a, a<c</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">旋转30°后的椭圆/双曲线</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        const getElapsed = () => clock.getElapsedTime();

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.25;
        const CURVE_POINTS = 320;
        const FOCUS_C = 1.5;

        // ---- 球极投影 ----
        function stereographic(px, py) {
            const d = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / d,
                2 * PROJ_D * py / d,
                (px * px + py * py - PROJ_D * PROJ_D) / d
            ).multiplyScalar(SPHERE_R);
        }

        // ---- 椭圆参数化：x = a cosθ, y = b sinθ, b² = a² - c² ----
        function ellipsePoints(a, c, numPoints) {
            const b = Math.sqrt(Math.abs(a * a - c * c));
            const pts = [];
            const dTheta = 2 * Math.PI / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const theta = i * dTheta;
                const px = a * Math.cos(theta);
                const py = b * Math.sin(theta);
                const sp = stereographic(px, py);
                if (sp && sp.length() < 9.5) pts.push(sp);
            }
            return pts;
        }

        // ---- 双曲线参数化：x = a secθ, y = b tanθ, b² = c² - a² (取a<c) ----
        function hyperbolaPoints(a, c, numPoints) {
            const b = Math.sqrt(Math.abs(c * c - a * a));
            const pts = [];
            // 左右两支
            for (let branch = 0; branch < 2; branch++) {
                const tMin = -1.4, tMax = 1.4;
                const dt = (tMax - tMin) / (numPoints / 2);
                for (let i = 0; i <= numPoints / 2; i++) {
                    const t = tMin + i * dt;
                    const secT = 1 / Math.cos(t);
                    if (Math.abs(secT) > 8) continue;
                    const x = (branch === 0 ? 1 : -1) * a * secT;
                    const y = b * Math.tan(t);
                    const sp = stereographic(x, y);
                    if (sp && sp.length() < 9.5) pts.push(sp);
                }
            }
            return pts;
        }

        // ---- 旋转任意曲线 ----
        function rotatePoints(pts, angle) {
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);
            return pts.map(p => {
                const x = p.x * cosA - p.y * sinA;
                const y = p.x * sinA + p.y * cosA;
                return stereographic(x, y);
            }).filter(sp => sp && sp.length() < 9.5);
        }

        // ---- 创建一族曲线 ----
        function createCurveGroup(aValues, isEllipse, color, opacity, rotation) {
            const group = new THREE.Group();
            for (const a of aValues) {
                if (isEllipse && a <= FOCUS_C) continue;
                if (!isEllipse && a >= FOCUS_C) continue;
                const pts = isEllipse ? ellipsePoints(a, FOCUS_C, CURVE_POINTS) : hyperbolaPoints(a, FOCUS_C, CURVE_POINTS);
                const finalPts = (rotation === 0) ? pts : rotatePoints(pts, rotation * Math.PI / 180);
                if (finalPts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(finalPts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // ---- 主组 ----
        const rootGroup = new THREE.Group();
        rootGroup.name = 'confocal-conics-weave';
        scene.add(rootGroup);

        // 金色族：椭圆，a > c
        const aEllipse = [];
        for (let a = FOCUS_C + 0.08; a <= 3.2; a += 0.07) aEllipse.push(a);
        rootGroup.add(createCurveGroup(aEllipse, true, COLOR_GOLD, 0.62, 0));

        // 青色族：双曲线，a < c
        const aHyperbola = [];
        for (let a = 0.12; a <= FOCUS_C - 0.08; a += 0.06) aHyperbola.push(a);
        rootGroup.add(createCurveGroup(aHyperbola, false, COLOR_CYAN, 0.62, 0));

        // 品红族：旋转30°的椭圆和双曲线（混合）
        const aMixEllipse = [];
        for (let a = FOCUS_C + 0.2; a <= 2.8; a += 0.12) aMixEllipse.push(a);
        const aMixHyper = [];
        for (let a = 0.18; a <= FOCUS_C - 0.18; a += 0.10) aMixHyper.push(a);
        rootGroup.add(createCurveGroup(aMixEllipse, true, COLOR_MAGENTA, 0.55, 30));
        rootGroup.add(createCurveGroup(aMixHyper, false, COLOR_MAGENTA, 0.52, 30));
        rootGroup.add(createCurveGroup(aMixEllipse, true, COLOR_MAGENTA, 0.48, -30));
        rootGroup.add(createCurveGroup(aMixHyper, false, COLOR_MAGENTA, 0.45, -30));

        // 额外稀疏层
        const aExtraEllipse = [];
        for (let a = FOCUS_C + 0.04; a <= 3.4; a += 0.35) aExtraEllipse.push(a);
        const aExtraHyper = [];
        for (let a = 0.06; a <= FOCUS_C - 0.06; a += 0.28) aExtraHyper.push(a);
        rootGroup.add(createCurveGroup(aExtraEllipse, true, COLOR_GOLD, 0.35, 0));
        rootGroup.add(createCurveGroup(aExtraHyper, false, COLOR_CYAN, 0.35, 0));
        rootGroup.add(createCurveGroup(aExtraEllipse, true, COLOR_MAGENTA, 0.30, 15));
        rootGroup.add(createCurveGroup(aExtraHyper, false, COLOR_MAGENTA, 0.28, -15));

        console.log('共焦点圆锥曲线编织线条总数:', rootGroup.children.length);

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const sc = 550;
        const sp = new Float32Array(sc * 3);
        for (let i = 0; i < sc; i++) {
            const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), d = 6.5 + Math.random() * 10;
            sp[i * 3] = d * Math.sin(ph) * Math.cos(th);
            sp[i * 3 + 1] = d * Math.sin(ph) * Math.sin(th);
            sp[i * 3 + 2] = d * Math.cos(ph);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(sp, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        })));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.09;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const cr = 7.3, ca = t * 0.08, ch = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        // 预渲染首帧，确保立即显示
        renderer.render(scene, camera);
        renderer.setAnimationLoop(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 共焦点圆锥曲线球极投影编织动画已稳定运行');
    </script>
</body>
</html>
