<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抛物线跳跃兔 · Parabolic Jumping Rabbit</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: linear-gradient(160deg, #eaf6ff 0%, #dceefb 40%, #d6f0e2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #22415a;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1160px; margin: 0 auto; padding: 22px;
    display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap;
  }
  .stage {
    flex: 1 1 580px; min-width: 300px;
    position: relative;
    aspect-ratio: 760 / 520;
    border-radius: 26px;
    overflow: hidden;
    background: #eaf6ff;
    box-shadow: 0 22px 46px -22px rgba(40, 90, 140, .55),
                0 0 0 1px rgba(255, 255, 255, .8) inset;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  .sound-toggle {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    background: rgba(255, 255, 255, .9);
    box-shadow: 0 5px 14px -5px rgba(40, 100, 150, .5);
    transition: transform .12s;
    z-index: 3;
  }
  .sound-toggle:active { transform: scale(.92); }

  .panel {
    flex: 0 1 340px; min-width: 288px;
    background: rgba(255, 255, 255, .78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 26px;
    padding: 22px 22px 18px;
    box-shadow: 0 20px 44px -24px rgba(40, 90, 140, .5),
                0 0 0 1px rgba(255, 255, 255, .85) inset;
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 {
    font-size: 21px; margin: 0; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
  }
  h1 .emoji { font-size: 24px; }

  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 18px; text-align: center;
    padding: 11px 10px; border-radius: 15px;
    background: linear-gradient(135deg, #e8f4ff, #d6ebfb);
    color: #245b86;
    letter-spacing: .4px;
    box-shadow: 0 0 0 1px rgba(175, 215, 245, .85) inset;
    line-height: 1.5;
  }
  .formula b { color: #d1662b; font-weight: 700; }

  .readout {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
    padding: 11px 13px; border-radius: 15px;
    background: rgba(240, 248, 255, .95);
    box-shadow: 0 0 0 1px rgba(190, 220, 245, .9) inset;
    font-size: 12.5px;
  }
  .readout .k { color: #6b8ba3; font-weight: 700; }
  .readout .v {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    color: #1d6fa5; font-weight: 700; font-size: 13.5px;
    text-align: right;
  }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .field .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    color: #3b5f7a;
  }
  .field .val { color: #1d6fa5; font-variant-numeric: tabular-nums; font-size: 14px; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #9dd0f2, #4a9fdc);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: #fff; border: 3.5px solid #4a9fdc;
    box-shadow: 0 2px 7px rgba(40, 100, 150, .4);
    transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; border: 3.5px solid #4a9fdc;
    box-shadow: 0 2px 7px rgba(40, 100, 150, .4);
  }
  input[type=range]::-moz-range-track {
    height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #9dd0f2, #4a9fdc);
  }

  .btns { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 11px 8px; border: none; border-radius: 14px;
    font-size: 14.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: .4px;
    background: linear-gradient(180deg, #63b3e8, #2f8bcc);
    color: #fff;
    box-shadow: 0 7px 15px -7px rgba(30, 110, 170, .95);
    transition: transform .12s, filter .12s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(2px) scale(.98); }
  button.ghost {
    background: rgba(255, 255, 255, .95);
    color: #1d6fa5;
    box-shadow: 0 5px 13px -7px rgba(40, 100, 150, .7),
                0 0 0 1.5px #b5dcf5 inset;
  }
  .hint {
    margin: 0; font-size: 12.5px; line-height: 1.65; color: #6b8ba3;
    text-align: center;
  }
  .hint kbd {
    background: #eaf6ff; border-radius: 5px; padding: 1px 5px;
    font-family: inherit; font-size: 11.5px; color: #1d6fa5;
    box-shadow: 0 0 0 1px #c3e2f7 inset;
  }
  @media (max-width: 720px) {
    .wrap { padding: 14px; gap: 16px; }
    .panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
  </div>

  <div class="panel">
    <h1><span class="emoji">🐇</span> 抛物线跳跃兔</h1>

    <div class="formula" id="eqText">
      y = −0.60(x − 6.0)² + 2.20
    </div>

    <div class="readout">
      <span class="k">顶点</span><span class="v" id="roVertex">(6.0, 2.20)</span>
      <span class="k">开口方向</span><span class="v" id="roOpen">向下</span>
      <span class="k">最大值</span><span class="v" id="roMax">2.20</span>
      <span class="k">落点间距</span><span class="v" id="roDist">3.83</span>
    </div>

    <div class="field">
      <div class="row"><span>陡峭程度 a</span><span class="val" id="aVal">0.60</span></div>
      <input type="range" id="aRange" min="35" max="140" step="1" value="60">
    </div>

    <div class="field">
      <div class="row"><span>顶点横坐标 h</span><span class="val" id="hVal">6.0</span></div>
      <input type="range" id="hRange" min="25" max="90" step="1" value="60">
    </div>

    <div class="field">
      <div class="row"><span>顶点高度 k</span><span class="val" id="kVal">2.20</span></div>
      <input type="range" id="kRange" min="80" max="400" step="5" value="220">
    </div>

    <div class="btns">
      <button id="btnJump">让兔子跳！</button>
      <button id="btnReset" class="ghost">重置</button>
    </div>

    <p class="hint">
      拖动滑杆看轨迹变化 · <kbd>点击画面</kbd> 兔子会立刻起跳哦～
    </p>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     逻辑坐标系
  ============================================================ */
  const LOGIC_W = 760, LOGIC_H = 520;
  const GROUND_Y = 452;                 // 世界坐标 y = 0 的屏幕 y
  const WORLD_X_MIN = -0.5;
  const WORLD_X_MAX = 12.5;
  const SCALE = LOGIC_W / (WORLD_X_MAX - WORLD_X_MIN);   // ≈ 58.46

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const toSX = (x) => (x - WORLD_X_MIN) * SCALE;
  const toSY = (y) => GROUND_Y - y * SCALE;

  /* ============================================================
     音频
  ============================================================ */
  let actx = null, muted = false;

  function ensureAudio() {
    if (muted) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, dur, type, vol, delay, freqEnd) {
    const ac = ensureAudio(); if (!ac) return;
    type = type || 'sine'; vol = vol || 0.08; delay = delay || 0;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur * 0.85);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }

  /** 起跳“boing” */
  function sndJump() {
    tone(270, 0.24, 'sine', 0.085, 0, 720);
    tone(540, 0.16, 'triangle', 0.03, 0.02, 980);
  }

  /** 落地“咚” */
  function sndLand() {
    tone(190, 0.18, 'sine', 0.10, 0, 62);
    tone(95,  0.22, 'triangle', 0.05, 0.01, 45);
  }

  /** 顶点轻微“叮” */
  function sndApex() {
    tone(1180, 0.14, 'sine', 0.028);
  }

  let lastBlip = 0;
  function sndBlip(freq) {
    const now = performance.now();
    if (now - lastBlip < 65) return;
    lastBlip = now;
    tone(freq, 0.055, 'sine', 0.042);
  }

  /* ============================================================
     参数与几何
  ============================================================ */
  const params = { a: 0.60, h: 6.0, k: 2.20 };

  function computeGeom() {
    const a = params.a, h = params.h, k = params.k;
    const half = Math.sqrt(Math.max(k / a, 1e-6));
    return { a, h, k, half, x0: h - half, x1: h + half, dist: 2 * half };
  }

  let geom = computeGeom();

  /* ============================================================
     跳跃状态
  ============================================================ */
  const jump = {
    g: geom,        // 本次跳跃快照
    p: 0,           // 0..1 进度
    dur: 1,
    resting: true,
    restT: 0.2,
    x: geom.x0,
    y: 0,
    rot: 0,
    squash: 0,
    stretch: 0,
    apexFired: false
  };

  const particles = [];

  function spawnDust(x) {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 0.6,
        y: Math.random() * 0.12,
        vx: (Math.random() - 0.5) * 2.2,
        vy: Math.random() * 1.6 + 0.2,
        life: 0.55 + Math.random() * 0.35,
        max: 0.9,
        r: 0.05 + Math.random() * 0.09
      });
    }
  }

  function startJump() {
    jump.g = geom;
    jump.p = 0;
    jump.dur = Math.max(0.52, Math.min(1.55, geom.dist / 4.2));
    jump.resting = false;
    jump.restT = 0;
    jump.apexFired = false;
    jump.stretch = 1;
    jump.x = geom.x0;
    jump.y = 0;
    jump.rot = 0;
    sndJump();
  }

  /** 参数变化时重新定位兔子 */
  function applyParams() {
    geom = computeGeom();
    if (jump.resting) {
      jump.g = geom;
      jump.x = geom.x1;
      jump.y = 0;
    } else {
      jump.g = geom;
      const g = jump.g;
      jump.x = g.x0 + (g.x1 - g.x0) * jump.p;
      jump.y = -g.a * (jump.x - g.h) * (jump.x - g.h) + g.k;
      if (jump.y < 0) jump.y = 0;
    }
  }

  /* ============================================================
     更新
  ============================================================ */
  function update(dt) {
    jump.squash *= Math.exp(-dt * 9);
    jump.stretch *= Math.exp(-dt * 11);

    if (jump.resting) {
      jump.restT += dt;
      if (jump.restT > 0.30) startJump();
    } else {
      jump.p += dt / jump.dur;

      if (jump.p >= 1) {
        jump.p = 1;
        jump.resting = true;
        jump.restT = 0;
        jump.squash = 1;
        jump.x = jump.g.x1;
        jump.y = 0;
        jump.rot = 0;
        spawnDust(jump.g.x1);
        sndLand();
      } else {
        const g = jump.g;
        jump.x = g.x0 + (g.x1 - g.x0) * jump.p;
        jump.y = -g.a * (jump.x - g.h) * (jump.x - g.h) + g.k;
        if (jump.y < 0) jump.y = 0;

        // 顶点提示音
        if (!jump.apexFired && jump.p >= 0.5) {
          jump.apexFired = true;
          if (jump.p < 0.58) sndApex();
        }

        // 旋转：速度方向 × 0.55
        const dxdt = (g.x1 - g.x0) / jump.dur;
        const dydt = -2 * g.a * (jump.x - g.h) * dxdt;
        jump.rot = -Math.atan2(dydt, dxdt) * 0.55;
      }
    }

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.life -= dt;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy -= 5.5 * dt;
      pt.vx *= Math.exp(-dt * 2.2);
    }
  }

  /* ============================================================
     画布尺寸
  ============================================================ */
  function resizeCanvas() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(rect.width * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
  }
  window.addEventListener('resize', resizeCanvas);

  /* ============================================================
     背景绘制
  ============================================================ */
  const CLOUDS = [
    { x: 90,  y: 78,  s: 1.0, v: 6 },
    { x: 380, y: 52,  s: 0.72, v: 9 },
    { x: 610, y: 96,  s: 1.15, v: 4.5 }
  ];
  let cloudT = 0;

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, '#cfe9fb');
    g.addColorStop(0.55, '#e3f3fd');
    g.addColorStop(1, '#f3fbf4');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, LOGIC_W, GROUND_Y + 2);

    // 太阳
    const sunX = 660, sunY = 88;
    const sg = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 105);
    sg.addColorStop(0, 'rgba(255, 246, 200, 0.95)');
    sg.addColorStop(0.35, 'rgba(255, 238, 170, 0.45)');
    sg.addColorStop(1, 'rgba(255, 238, 170, 0)');
    ctx.beginPath();
    ctx.arc(sunX, sunY, 105, 0, Math.PI * 2);
    ctx.fillStyle = sg;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 250, 215, 0.95)';
    ctx.fill();

    // 云朵
    cloudT += 0.016;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    for (const c of CLOUDS) {
      let cx = (c.x + cloudT * c.v) % (LOGIC_W + 220) - 110;
      const cy = c.y, s = c.s;
      ctx.beginPath();
      ctx.arc(cx, cy, 22 * s, 0, Math.PI * 2);
      ctx.arc(cx + 26 * s, cy - 10 * s, 28 * s, 0, Math.PI * 2);
      ctx.arc(cx + 58 * s, cy + 2 * s, 20 * s, 0, Math.PI * 2);
      ctx.arc(cx + 30 * s, cy + 12 * s, 22 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, GROUND_Y, 0, LOGIC_H);
    g.addColorStop(0, '#a9dd8b');
    g.addColorStop(0.18, '#8ccf6e');
    g.addColorStop(1, '#5aa848');
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND_Y, LOGIC_W, LOGIC_H - GROUND_Y);

    // 顶部亮边
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(LOGIC_W, GROUND_Y);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 草叶
    ctx.strokeStyle = 'rgba(70, 145, 60, 0.55)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let i = 0; i < 46; i++) {
      const gx = (i * 71 + 23) % LOGIC_W;
      const hgt = 7 + ((i * 37) % 9);
      const bend = ((i * 13) % 7) - 3;
      ctx.beginPath();
      ctx.moveTo(gx, GROUND_Y + 4);
      ctx.quadraticCurveTo(gx + bend, GROUND_Y - hgt * 0.5, gx + bend * 1.6, GROUND_Y - hgt);
      ctx.stroke();
    }
  }

  function drawAxes() {
    // 高度网格
    ctx.save();
    ctx.setLineDash([5, 7]);
    ctx.lineWidth = 1;
    for (let hgt = 1; hgt <= 4; hgt++) {
      const sy = toSY(hgt);
      if (sy < 40) continue;
      ctx.beginPath();
      ctx.moveTo(28, sy);
      ctx.lineTo(LOGIC_W - 24, sy);
      ctx.strokeStyle = 'rgba(90, 150, 200, 0.18)';
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.font = '600 11px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(70, 130, 180, 0.55)';
      ctx.textAlign = 'left';
      ctx.fillText(hgt, 8, sy + 4);
      ctx.setLineDash([5, 7]);
    }
    ctx.restore();

    // 地面刻度
    ctx.font = '600 11px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    for (let i = 0; i <= 12; i++) {
      const sx = toSX(i);
      if (sx < 16 || sx > LOGIC_W - 16) continue;
      ctx.beginPath();
      ctx.moveTo(sx, GROUND_Y + 3);
      ctx.lineTo(sx, GROUND_Y + 10);
      ctx.strokeStyle = 'rgba(45, 105, 55, 0.45)';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      ctx.fillStyle = 'rgba(45, 105, 55, 0.7)';
      ctx.fillText(i, sx, GROUND_Y + 24);
    }
  }

  /* ============================================================
     抛物线绘制
  ============================================================ */
  function traceParabola(g, fromP, toP) {
    const N = 180;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = fromP + (toP - fromP) * i / N;
      const x = g.x0 + (g.x1 - g.x0) * u;
      const y = -g.a * (x - g.h) * (x - g.h) + g.k;
      const sx = toSX(x), sy = toSY(Math.max(0, y));
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
  }

  function drawTrajectory() {
    const g = jump.g;
    const p = jump.resting ? 1 : jump.p;

    // 完整虚线轨迹
    ctx.save();
    ctx.setLineDash([8, 8]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(70, 150, 210, 0.32)';
    ctx.lineCap = 'round';
    traceParabola(g, 0, 1);
    ctx.stroke();
    ctx.restore();

    // 已走过的实线
    if (p > 0.005) {
      ctx.save();
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(45, 130, 200, 0.75)';
      ctx.shadowColor = 'rgba(60, 150, 220, 0.55)';
      ctx.shadowBlur = 10;
      traceParabola(g, 0, p);
      ctx.stroke();
      ctx.restore();
    }

    // 顶点
    const vx = toSX(g.h), vy = toSY(g.k);
    ctx.save();
    ctx.setLineDash([4, 6]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(209, 102, 43, 0.5)';
    ctx.beginPath();
    ctx.moveTo(vx, vy);
    ctx.lineTo(vx, GROUND_Y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(vx, vy);
    ctx.lineTo(toSX(WORLD_X_MIN + 0.15), vy);
    ctx.stroke();
    ctx.restore();

    // 顶点圆点
    ctx.beginPath();
    ctx.arc(vx, vy, 6.5, 0, Math.PI * 2);
    ctx.fillStyle = '#d1662b';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(vx, vy, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // 顶点标签
    ctx.font = '700 13px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a94f1e';
    const label = '(' + g.h.toFixed(1) + ', ' + g.k.toFixed(2) + ')';
    ctx.fillText(label, vx, vy - 16);

    // 落点标记
    [g.x0, g.x1].forEach(function (px) {
      const sx = toSX(px);
      ctx.beginPath();
      ctx.arc(sx, GROUND_Y, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(45, 130, 200, 0.85)';
      ctx.fill();
    });

    // 跨度标注
    const mx = (toSX(g.x0) + toSX(g.x1)) / 2;
    const my = GROUND_Y + 42;
    ctx.save();
    ctx.strokeStyle = 'rgba(40, 110, 170, 0.7)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(toSX(g.x0), my);
    ctx.lineTo(toSX(g.x1), my);
    ctx.stroke();
    // 端帽
    [toSX(g.x0), toSX(g.x1)].forEach(function (sx) {
      ctx.beginPath();
      ctx.moveTo(sx, my - 5);
      ctx.lineTo(sx, my + 5);
      ctx.stroke();
    });
    ctx.restore();

    ctx.font = '700 12.5px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1d6fa5';
    ctx.fillText('跨度 ' + g.dist.toFixed(2), mx, my - 9);
  }

  /* ============================================================
     兔子绘制
  ============================================================ */
  function drawRabbit(cx, cy, rot, sqx, sqy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(sqx, sqy);

    const bodyGrad = ctx.createLinearGradient(0, -58, 0, 4);
    bodyGrad.addColorStop(0, '#ffffff');
    bodyGrad.addColorStop(0.6, '#fdf4ea');
    bodyGrad.addColorStop(1, '#f0dcc9');

    const outline = '#e3cdb7';
    ctx.lineJoin = 'round';

    // 尾巴
    ctx.beginPath();
    ctx.arc(-24, -20, 7.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.3;
    ctx.stroke();

    // 后腿
    ctx.beginPath();
    ctx.ellipse(-13, -3.5, 9, 4.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f3e2d2';
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.stroke();

    // 前腿
    ctx.beginPath();
    ctx.ellipse(7, -3.5, 8, 4.2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f7e8da';
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.stroke();

    // 耳朵
    function ear(ex, ey, rotE, innerShade) {
      ctx.save();
      ctx.translate(ex, ey);
      ctx.rotate(rotE);
      ctx.beginPath();
      ctx.ellipse(0, 0, 5.2, 15.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#fffaf4';
      ctx.fill();
      ctx.strokeStyle = outline;
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(0, 1.5, 2.4, 9.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = innerShade;
      ctx.fill();
      ctx.restore();
    }
    ear(9, -49, -0.22, '#ffd4d8');
    ear(20, -47, 0.14, '#ffd9dd');

    // 身体
    ctx.beginPath();
    ctx.ellipse(-5, -18, 18.5, 15.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 头部
    ctx.beginPath();
    ctx.arc(15, -29, 12.5, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.stroke();

    // 腮红
    ctx.beginPath();
    ctx.ellipse(9, -24, 5, 3.4, -0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 170, 175, 0.5)';
    ctx.fill();

    // 眼睛
    ctx.beginPath();
    ctx.arc(20, -32, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = '#2b2a33';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(18.9, -33.2, 1.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();

    // 鼻子
    ctx.beginPath();
    ctx.arc(26, -27, 2.1, 0, Math.PI * 2);
    ctx.fillStyle = '#f09aa4';
    ctx.fill();

    // 胡须
    ctx.strokeStyle = 'rgba(180, 150, 130, 0.65)';
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const yy = -29 + i * 2.6;
      ctx.beginPath();
      ctx.moveTo(28, yy);
      ctx.lineTo(38, yy - 2 + i * 1.4);
      ctx.stroke();
    }

    ctx.restore();
  }

  /* ============================================================
     粒子绘制
  ============================================================ */
  function drawParticles() {
    for (const pt of particles) {
      const a = Math.max(0, pt.life / pt.max);
      const sx = toSX(pt.x), sy = toSY(pt.y);
      ctx.beginPath();
      ctx.arc(sx, sy, pt.r * SCALE, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200, 225, 175, ' + (a * 0.75) + ')';
      ctx.fill();
    }
  }

  /* ============================================================
     渲染
  ============================================================ */
  function render() {
    const kx = cv.width / LOGIC_W;
    const ky = cv.height / LOGIC_H;
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
    ctx.clearRect(0, 0, LOGIC_W, LOGIC_H);

    drawSky();
    drawGround();
    drawAxes();
    drawTrajectory();

    // 兔子影子
    const rcx = toSX(jump.x);
    const rcy = toSY(jump.y);
    const groundSX = toSX(jump.x);
    const hgt = Math.max(0, jump.y);
    const shrink = Math.max(0.35, 1 - hgt * 0.16);
    const shadowA = Math.max(0.06, 0.30 - hgt * 0.055);

    ctx.beginPath();
    ctx.ellipse(groundSX, GROUND_Y + 5, 26 * shrink, 8 * shrink, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(45, 95, 45, ' + shadowA + ')';
    ctx.fill();

    // 兔子
    const sy = 1 - 0.24 * jump.squash + 0.20 * jump.stretch;
    const sx = 1 + 0.18 * jump.squash - 0.11 * jump.stretch;
    drawRabbit(rcx, rcy, jump.rot, sx, sy);

    drawParticles();

    // 画布上的小提示
    ctx.font = '700 13px -apple-system, "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(45, 105, 155, 0.55)';
    ctx.fillText('y = −a(x − h)² + k', 24, 34);
  }

  /* ============================================================
     主循环
  ============================================================ */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     UI
  ============================================================ */
  const aRange = document.getElementById('aRange');
  const hRange = document.getElementById('hRange');
  const kRange = document.getElementById('kRange');
  const aVal = document.getElementById('aVal');
  const hVal = document.getElementById('hVal');
  const kVal = document.getElementById('kVal');
  const eqText = document.getElementById('eqText');
  const roVertex = document.getElementById('roVertex');
  const roOpen = document.getElementById('roOpen');
  const roMax = document.getElementById('roMax');
  const roDist = document.getElementById('roDist');

  function syncUI() {
    aVal.textContent = params.a.toFixed(2);
    hVal.textContent = params.h.toFixed(1);
    kVal.textContent = params.k.toFixed(2);

    const aStr = params.a.toFixed(2);
    const hStr = params.h.toFixed(1);
    const kStr = params.k.toFixed(2);
    eqText.innerHTML = 'y = −<b>' + aStr + '</b>(x − <b>' + hStr + '</b>)² + <b>' + kStr + '</b>';

    roVertex.textContent = '(' + hStr + ', ' + kStr + ')';
    roOpen.textContent = '向下';
    roMax.textContent = kStr;
    roDist.textContent = geom.dist.toFixed(2);
  }

  aRange.addEventListener('input', function () {
    params.a = +this.value / 100;
    applyParams();
    syncUI();
    sndBlip(240 + params.a * 320);
  });

  hRange.addEventListener('input', function () {
    params.h = +this.value / 10;
    applyParams();
    syncUI();
    sndBlip(320 + params.h * 42);
  });

  kRange.addEventListener('input', function () {
    params.k = +this.value / 100;
    applyParams();
    syncUI();
    sndBlip(420 + params.k * 130);
  });

  document.getElementById('btnJump').addEventListener('click', function () {
    ensureAudio();
    startJump();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    params.a = 0.60; params.h = 6.0; params.k = 2.20;
    aRange.value = 60; hRange.value = 60; kRange.value = 220;
    applyParams();
    syncUI();
    tone(520, 0.12, 'sine', 0.06);
    tone(780, 0.14, 'sine', 0.05, 0.08);
  });

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    if (jump.resting) {
      startJump();
    } else {
      // 空中点击：给一点小加速感 + 吱声
      tone(900, 0.09, 'sine', 0.05, 0, 1400);
    }
  });

  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function () {
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    if (!muted) { ensureAudio(); tone(660, 0.1, 'sine', 0.06); }
  });

  /* ============================================================
     启动
  ============================================================ */
  resizeCanvas();
  syncUI();
  requestAnimationFrame(loop);

  window.addEventListener('pointerdown', function once() {
    ensureAudio();
    window.removeEventListener('pointerdown', once);
  });

})();
</script>
</body>
</html>
