<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极坐标孔雀开屏 · Polar Peacock</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: linear-gradient(160deg, #f3f0ff 0%, #e4eefb 42%, #dff5ee 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #2a3550;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding: 22px;
    display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap;
  }
  .stage {
    flex: 1 1 580px; min-width: 300px;
    position: relative;
    aspect-ratio: 760 / 520;
    border-radius: 26px;
    overflow: hidden;
    background: #f4f6ff;
    box-shadow: 0 22px 48px -22px rgba(60, 70, 140, .55),
                0 0 0 1px rgba(255, 255, 255, .8) inset;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  .sound-toggle {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    background: rgba(255, 255, 255, .9);
    box-shadow: 0 5px 14px -5px rgba(70, 80, 160, .5);
    transition: transform .12s;
    z-index: 3;
  }
  .sound-toggle:active { transform: scale(.92); }

  .panel {
    flex: 0 1 350px; min-width: 292px;
    background: rgba(255, 255, 255, .78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 26px;
    padding: 22px 22px 18px;
    box-shadow: 0 20px 46px -24px rgba(60, 70, 140, .5),
                0 0 0 1px rgba(255, 255, 255, .85) inset;
    display: flex; flex-direction: column; gap: 13px;
  }
  h1 {
    font-size: 21px; margin: 0; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
  }
  h1 .emoji { font-size: 24px; }

  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 18.5px; text-align: center;
    padding: 11px 10px; border-radius: 15px;
    background: linear-gradient(135deg, #f0ecff, #e2e6fb);
    color: #4a3d94;
    letter-spacing: .5px;
    box-shadow: 0 0 0 1px rgba(200, 195, 245, .85) inset;
    line-height: 1.6;
  }
  .formula b { color: #9a4fd1; font-weight: 700; }
  .formula .sub { font-size: 13px; color: #7a72a8; }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    color: #454f78;
  }
  .field .val {
    color: #6a4fd1; font-variant-numeric: tabular-nums; font-size: 13.5px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #c2b6f5, #6f8ae8);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: #fff; border: 3.5px solid #6f8ae8;
    box-shadow: 0 2px 7px rgba(70, 80, 160, .4);
    transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; border: 3.5px solid #6f8ae8;
    box-shadow: 0 2px 7px rgba(70, 80, 160, .4);
  }
  input[type=range]::-moz-range-track {
    height: 7px; border-radius: 99px;
    background: linear-gradient(90deg, #c2b6f5, #6f8ae8);
  }

  .modes { display: flex; gap: 8px; }
  .modes button {
    flex: 1; padding: 9px 6px; border-radius: 13px; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    border: none; letter-spacing: .3px;
    background: rgba(255, 255, 255, .95);
    color: #6a6a95;
    box-shadow: 0 0 0 1.5px #d9d6f0 inset;
    transition: all .15s;
  }
  .modes button.on {
    background: linear-gradient(180deg, #8f7ae8, #6a5ad0);
    color: #fff;
    box-shadow: 0 7px 15px -7px rgba(100, 80, 200, .95);
  }

  .btns { display: flex; gap: 10px; }
  button.main {
    flex: 1; padding: 11px 8px; border: none; border-radius: 14px;
    font-size: 14.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: .4px;
    background: linear-gradient(180deg, #8f7ae8, #6a5ad0);
    color: #fff;
    box-shadow: 0 7px 15px -7px rgba(100, 80, 200, .95);
    transition: transform .12s, filter .12s;
  }
  button.main:hover { filter: brightness(1.07); }
  button.main:active { transform: translateY(2px) scale(.98); }
  button.ghost {
    flex: 0 0 auto; padding: 11px 18px;
    background: rgba(255, 255, 255, .95);
    color: #6a5ad0;
    box-shadow: 0 5px 13px -7px rgba(100, 80, 200, .7),
                0 0 0 1.5px #d9d3f5 inset;
  }

  .hint {
    margin: 0; font-size: 12.5px; line-height: 1.65; color: #7a82a8;
    text-align: center;
  }
  .hint kbd {
    background: #eeebff; border-radius: 5px; padding: 1px 5px;
    font-family: inherit; font-size: 11.5px; color: #6a5ad0;
    box-shadow: 0 0 0 1px #d8d2f5 inset;
  }
  @media (max-width: 740px) {
    .wrap { padding: 14px; gap: 16px; }
    .panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
  </div>

  <div class="panel">
    <h1><span class="emoji">🦚</span> 极坐标孔雀开屏</h1>

    <div class="formula" id="eqText">
      r = L · sin(kθ) <span class="sub">（玫瑰花瓣）</span>
    </div>

    <div class="modes">
      <button id="modeRose" class="on">玫瑰曲线</button>
      <button id="modeSpiral">对数螺线</button>
    </div>

    <div class="field">
      <div class="row"><span>屏羽数量 N</span><span class="val" id="nVal">26</span></div>
      <input type="range" id="nRange" min="8" max="48" step="1" value="26">
    </div>

    <div class="field">
      <div class="row"><span>花瓣参数 k</span><span class="val" id="kVal">3.4</span></div>
      <input type="range" id="kRange" min="16" max="90" step="1" value="34">
    </div>

    <div class="field">
      <div class="row"><span>屏羽长度 L</span><span class="val" id="lVal">230</span></div>
      <input type="range" id="lRange" min="120" max="280" step="1" value="230">
    </div>

    <div class="field">
      <div class="row"><span>开屏角度</span><span class="val" id="sVal">126°</span></div>
      <input type="range" id="sRange" min="45" max="160" step="1" value="126">
    </div>

    <div class="field">
      <div class="row"><span>色调偏移</span><span class="val" id="hVal">165°</span></div>
      <input type="range" id="hRange" min="0" max="300" step="1" value="165">
    </div>

    <div class="btns">
      <button class="main" id="btnOpen">重新开屏</button>
      <button class="main ghost" id="btnReset">重置</button>
    </div>

    <p class="hint">
      拖动滑杆设计属于你的开屏图案 · <kbd>点击画面</kbd> 让孔雀抖一抖
    </p>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     画布
  ============================================================ */
  const CW = 760, CH = 520;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resizeCanvas() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.max(1, Math.round(rect.width  * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
  }
  window.addEventListener('resize', resizeCanvas);

  /* ============================================================
     音频
  ============================================================ */
  let actx = null, muted = false;

  function ensureAudio() {
    if (muted) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, dur, type, vol, delay, freqEnd) {
    const ac = ensureAudio(); if (!ac) return;
    type = type || 'sine'; vol = vol || 0.07; delay = delay || 0;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }

  /** 开屏：五声音阶上行琶音 */
  const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];
  function playOpenSound(n) {
    const detune = 1 + (n - 26) * 0.003;
    for (let i = 0; i < SCALE.length; i++) {
      tone(SCALE[i] * detune, 0.42, 'sine', 0.038, i * 0.042);
      tone(SCALE[i] * detune * 2, 0.3, 'triangle', 0.012, i * 0.042 + 0.01);
    }
  }

  /** 抖动：带通噪声 */
  function playShiverSound() {
    const ac = ensureAudio(); if (!ac) return;
    const dur = 0.34, sr = ac.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = ac.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 3.2;
    const t0 = ac.currentTime;
    bp.frequency.setValueAtTime(2400, t0);
    bp.frequency.exponentialRampToValueAtTime(700, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.11, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(t0);
  }

  let lastBlip = 0;
  function sndBlip(freq) {
    const now = performance.now();
    if (now - lastBlip < 68) return;
    lastBlip = now;
    tone(freq, 0.055, 'sine', 0.04);
  }

  /* ============================================================
     参数与状态
  ============================================================ */
  const P = {
    n: 26,
    k: 3.4,
    len: 230,
    spreadDeg: 126,
    hueBase: 165,
    mode: 'rose'
  };

  const S = {
    time: 0,
    open: 0,          // 0..1 开屏进度
    shiver: 0,        // 抖动强度 0..1
    shiverT: 0
  };

  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;

  /* ============================================================
     更新
  ============================================================ */
  function update(dt) {
    S.time += dt;

    // 开屏动画
    if (S.open < 1) {
      S.open = Math.min(1, S.open + dt * 0.95);
    }

    // 抖动衰减
    if (S.shiver > 0) {
      S.shiverT += dt;
      S.shiver *= Math.exp(-dt * 3.4);
      if (S.shiver < 0.002) S.shiver = 0;
    }
  }

  /* ============================================================
     绘制：背景
  ============================================================ */
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, CH);
    g.addColorStop(0, '#f7f6ff');
    g.addColorStop(0.45, '#eaf1fb');
    g.addColorStop(1, '#e2f4ee');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CW, CH);

    // 中央柔光
    const cx = 380, cy = 330;
    const rg = ctx.createRadialGradient(cx, cy, 30, cx, cy, 400);
    rg.addColorStop(0, 'rgba(255,255,255,0.9)');
    rg.addColorStop(0.5, 'rgba(240,240,255,0.4)');
    rg.addColorStop(1, 'rgba(230,240,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, CW, CH);

    // 装饰星点
    ctx.fillStyle = 'rgba(150, 160, 220, 0.28)';
    for (let i = 0; i < 34; i++) {
      const x = (i * 137.5) % CW;
      const y = (i * 89.7) % (CH * 0.75);
      const r = 0.8 + (i % 3) * 0.7;
      const tw = 0.6 + 0.4 * Math.sin(S.time * 2 + i);
      ctx.globalAlpha = 0.28 * tw;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     绘制：单根屏羽
  ============================================================ */
  const STEPS = 34;

  function featherPath(cx, cy, psi, L, mode, k) {
    ctx.beginPath();

    if (mode === 'rose') {
      // 玫瑰线单片花瓣：r = L·sin(kθ), θ ∈ [0, π/k]
      const Theta = Math.PI / k;
      const rot = psi - Theta / 2;
      for (let j = 0; j <= STEPS; j++) {
        const s = j / STEPS;
        const th = s * Theta;
        const r = L * Math.sin(Math.PI * s);
        const a = rot + th;
        const px = cx + r * Math.cos(a);
        const py = cy + r * Math.sin(a);
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
    } else {
      // 对数螺线：r = L(e^{bθ}−1)/(e^{bΘ}−1)
      const Theta = 1.85;
      const b = k * 0.24;
      const norm = Math.exp(b * Theta) - 1;
      const rot = psi - Theta / 2;
      for (let j = 0; j <= STEPS; j++) {
        const s = j / STEPS;
        const th = s * Theta;
        const r = L * (Math.exp(b * th) - 1) / norm;
        const a = rot + th;
        const px = cx + r * Math.cos(a);
        const py = cy + r * Math.sin(a);
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
    }
    ctx.closePath();
  }

  /* ============================================================
     绘制：整个尾屏
  ============================================================ */
  function drawTail(cx, cy) {
    const N = P.n;
    const k = P.k;
    const mode = P.mode;
    const spread = P.spreadDeg * Math.PI / 180;
    const baseLen = P.len;

    // 屏后柔光
    const halo = ctx.createRadialGradient(cx, cy - 40, 20, cx, cy - 40, baseLen * 1.5);
    halo.addColorStop(0, 'rgba(190, 200, 255, 0.30)');
    halo.addColorStop(0.6, 'rgba(200, 220, 255, 0.10)');
    halo.addColorStop(1, 'rgba(220, 240, 255, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy - 40, baseLen * 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.lineJoin = 'round';

    for (let i = 0; i < N; i++) {
      const t = N > 1 ? i / (N - 1) : 0.5;         // 0..1 横向位置
      const d = Math.abs(t - 0.5) * 2;              // 距中心 0..1

      // 错开开屏：中心先展开
      const oi = clamp01((S.open - d * 0.22) / 0.78);
      if (oi <= 0.001) continue;
      const eo = easeOut(oi);

      // 角度
      let psi = -Math.PI / 2 + (t - 0.5) * spread * eo;

      // 微摆动
      psi += Math.sin(S.time * 1.5 + i * 0.55) * 0.022 * S.open;
      // 抖动脉冲
      if (S.shiver > 0) {
        psi += Math.sin(S.shiverT * 34 + i * 1.9) * 0.05 * S.shiver;
      }

      // 长度
      const lenVar = 0.9 + 0.1 * Math.sin(i * 1.31 + 0.7);
      let L = baseLen * lenVar * (0.22 + 0.78 * eo);
      if (S.shiver > 0) {
        L *= 1 + Math.sin(S.shiverT * 26 + i * 1.3) * 0.06 * S.shiver;
      }

      // 色彩：随角度渐变
      const hue = (P.hueBase + t * 132) % 360;
      const hue2 = (hue + 26) % 360;

      // 渐变
      const tipX = cx + L * Math.cos(psi);
      const tipY = cy + L * Math.sin(psi);
      const grad = ctx.createLinearGradient(cx, cy, tipX, tipY);
      grad.addColorStop(0.00, 'hsla(' + hue + ', 62%, 30%, 0.92)');
      grad.addColorStop(0.32, 'hsla(' + hue + ', 78%, 46%, 0.94)');
      grad.addColorStop(0.68, 'hsla(' + hue2 + ', 86%, 62%, 0.92)');
      grad.addColorStop(1.00, 'hsla(' + ((hue2 + 18) % 360) + ', 92%, 76%, 0.88)');

      // 路径
      featherPath(cx, cy, psi, L, mode, k);

      // 发光
      ctx.save();
      ctx.shadowColor = 'hsla(' + hue2 + ', 90%, 62%, 0.55)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();

      // 边缘描边
      ctx.strokeStyle = 'hsla(' + ((hue + 40) % 360) + ', 95%, 82%, 0.55)';
      ctx.lineWidth = Math.max(0.6, 0.9 + L * 0.0032);
      ctx.stroke();

      // 中心亮脉
      if (mode === 'rose') {
        const Theta = Math.PI / k;
        const rot = psi - Theta / 2;
        ctx.beginPath();
        for (let j = 0; j <= 14; j++) {
          const s = j / 14;
          const th = s * Theta;
          const r = L * Math.sin(Math.PI * s) * 0.97;
          const a = rot + th;
          const px = cx + r * Math.cos(a);
          const py = cy + r * Math.sin(a);
          if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = 'hsla(' + ((hue + 50) % 360) + ', 100%, 88%, ' + (0.22 * eo) + ')';
        ctx.lineWidth = Math.max(0.5, L * 0.012);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  /* ============================================================
     绘制：孔雀身体
  ============================================================ */
  function drawBody(cx, cy) {
    // 身体阴影
    ctx.beginPath();
    ctx.ellipse(cx, 496, 56, 11, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(70, 80, 130, 0.20)';
    ctx.fill();

    // 身体
    const bg = ctx.createLinearGradient(cx - 40, cy, cx + 40, 500);
    bg.addColorStop(0, '#2f6fbd');
    bg.addColorStop(0.55, '#1d4f9c');
    bg.addColorStop(1, '#123571');

    ctx.beginPath();
    ctx.ellipse(cx, 458, 37, 44, 0, 0, Math.PI * 2);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(20, 40, 90, 0.6)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // 腹部亮部
    ctx.beginPath();
    ctx.ellipse(cx - 8, 470, 20, 27, -0.15, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(120, 190, 240, 0.28)';
    ctx.fill();

    // 翅膀
    ctx.beginPath();
    ctx.moveTo(cx - 30, 440);
    ctx.quadraticCurveTo(cx - 58, 462, cx - 42, 492);
    ctx.quadraticCurveTo(cx - 26, 476, cx - 22, 452);
    ctx.closePath();
    const wg = ctx.createLinearGradient(cx - 58, 440, cx - 22, 492);
    wg.addColorStop(0, '#2560a8');
    wg.addColorStop(1, '#153f7d');
    ctx.fillStyle = wg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(15, 35, 80, 0.55)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // 颈部
    ctx.beginPath();
    ctx.moveTo(cx + 4, 425);
    ctx.bezierCurveTo(cx + 16, 408, cx + 24, 396, cx + 26, 382);
    ctx.lineTo(cx + 40, 388);
    ctx.bezierCurveTo(cx + 36, 404, cx + 30, 420, cx + 22, 436);
    ctx.closePath();
    const ng = ctx.createLinearGradient(cx, 382, cx + 40, 436);
    ng.addColorStop(0, '#3e86c9');
    ng.addColorStop(1, '#1c4d94');
    ctx.fillStyle = ng;
    ctx.fill();

    // 头部
    const hx = cx + 38, hy = 372;
    ctx.beginPath();
    ctx.ellipse(hx, hy, 17, 15.5, 0.12, 0, Math.PI * 2);
    const hg = ctx.createRadialGradient(hx - 5, hy - 5, 2, hx, hy, 22);
    hg.addColorStop(0, '#5aa3dc');
    hg.addColorStop(1, '#1f4f95');
    ctx.fillStyle = hg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(15, 40, 85, 0.55)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    // 冠羽
    ctx.strokeStyle = '#2f6fbd';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i - 1) * 0.32;
      const bx = hx + Math.cos(a) * 15;
      const by = hy + Math.sin(a) * 15;
      const tx = hx + Math.cos(a) * 27;
      const ty = hy + Math.sin(a) * 27;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo((bx + tx) / 2 + 2, (by + ty) / 2, tx, ty);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(tx, ty, 2.8, 0, Math.PI * 2);
      ctx.fillStyle = '#7fd4f0';
      ctx.fill();
    }

    // 喙
    ctx.beginPath();
    ctx.moveTo(hx + 14, hy - 2);
    ctx.lineTo(hx + 30, hy + 2);
    ctx.lineTo(hx + 14, hy + 7);
    ctx.closePath();
    ctx.fillStyle = '#f0b24a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(170, 110, 20, 0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 眼睛
    ctx.beginPath();
    ctx.arc(hx + 5, hy - 3, 3.6, 0, Math.PI * 2);
    ctx.fillStyle = '#12213d';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx + 4, hy - 4.2, 1.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();

    // 眼下白斑
    ctx.beginPath();
    ctx.ellipse(hx + 1, hy + 6, 5.5, 3.2, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.fill();

    // 脚
    ctx.strokeStyle = '#c8933a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    [-12, 12].forEach(function (ox) {
      ctx.beginPath();
      ctx.moveTo(cx + ox, 496);
      ctx.lineTo(cx + ox, 508);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + ox - 7, 511);
      ctx.lineTo(cx + ox + 7, 511);
      ctx.stroke();
    });
  }

  /* ============================================================
     渲染
  ============================================================ */
  function render() {
    const kx = cv.width / CW;
    const ky = cv.height / CH;
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
    ctx.clearRect(0, 0, CW, CH);

    drawSky();

    const cx = 380, cy = 424;
    drawTail(cx, cy);

    // 地面
    const gg = ctx.createLinearGradient(0, 496, 0, CH);
    gg.addColorStop(0, 'rgba(150, 195, 175, 0.55)');
    gg.addColorStop(1, 'rgba(150, 195, 175, 0)');
    ctx.fillStyle = gg;
    ctx.fillRect(0, 496, CW, CH - 496);

    drawBody(cx, cy);

    // 左上角公式
    ctx.font = '600 13px -apple-system, "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(90, 95, 160, 0.55)';
    const label = P.mode === 'rose'
      ? 'r = L·sin(kθ)   θ ∈ [0, π/k]'
      : 'r = L·(e^(bθ) − 1)/(e^(bΘ) − 1)';
    ctx.fillText(label, 22, 32);
  }

  /* ============================================================
     主循环
  ============================================================ */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     UI
  ============================================================ */
  const nRange = document.getElementById('nRange');
  const kRange = document.getElementById('kRange');
  const lRange = document.getElementById('lRange');
  const sRange = document.getElementById('sRange');
  const hRange = document.getElementById('hRange');
  const nVal = document.getElementById('nVal');
  const kVal = document.getElementById('kVal');
  const lVal = document.getElementById('lVal');
  const sVal = document.getElementById('sVal');
  const hVal = document.getElementById('hVal');
  const eqText = document.getElementById('eqText');
  const modeRose = document.getElementById('modeRose');
  const modeSpiral = document.getElementById('modeSpiral');

  function syncEquation() {
    if (P.mode === 'rose') {
      eqText.innerHTML = 'r = <b>' + P.len + '</b> · sin(<b>' + P.k.toFixed(1) +
        '</b>θ) <span class="sub">（玫瑰曲线）</span>';
    } else {
      eqText.innerHTML = 'r = <b>' + P.len + '</b> · (e<sup><b>' +
        (P.k * 0.24).toFixed(2) + '</b>θ</sup> − 1) <span class="sub">（对数螺线）</span>';
    }
  }

  nRange.addEventListener('input', function () {
    P.n = +this.value;
    nVal.textContent = P.n;
    sndBlip(260 + P.n * 9);
  });

  kRange.addEventListener('input', function () {
    P.k = +this.value / 10;
    kVal.textContent = P.k.toFixed(1);
    syncEquation();
    sndBlip(300 + P.k * 55);
  });

  lRange.addEventListener('input', function () {
    P.len = +this.value;
    lVal.textContent = P.len;
    syncEquation();
    sndBlip(340 + P.len * 1.1);
  });

  sRange.addEventListener('input', function () {
    P.spreadDeg = +this.value;
    sVal.textContent = P.spreadDeg + '°';
    sndBlip(380 + P.spreadDeg * 1.6);
  });

  hRange.addEventListener('input', function () {
    P.hueBase = +this.value;
    hVal.textContent = P.hueBase + '°';
    sndBlip(420 + P.hueBase * 1.2);
  });

  modeRose.addEventListener('click', function () {
    P.mode = 'rose';
    modeRose.classList.add('on');
    modeSpiral.classList.remove('on');
    syncEquation();
    tone(520, 0.1, 'sine', 0.055);
    tone(780, 0.13, 'sine', 0.045, 0.07);
  });

  modeSpiral.addEventListener('click', function () {
    P.mode = 'spiral';
    modeSpiral.classList.add('on');
    modeRose.classList.remove('on');
    syncEquation();
    tone(440, 0.1, 'triangle', 0.055);
    tone(660, 0.13, 'triangle', 0.045, 0.07);
  });

  document.getElementById('btnOpen').addEventListener('click', function () {
    ensureAudio();
    S.open = 0;
    playOpenSound(P.n);
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    P.n = 26; P.k = 3.4; P.len = 230; P.spreadDeg = 126; P.hueBase = 165; P.mode = 'rose';
    nRange.value = 26; kRange.value = 34; lRange.value = 230;
    sRange.value = 126; hRange.value = 165;
    nVal.textContent = '26'; kVal.textContent = '3.4'; lVal.textContent = '230';
    sVal.textContent = '126°'; hVal.textContent = '165°';
    modeRose.classList.add('on');
    modeSpiral.classList.remove('on');
    syncEquation();
    S.open = 0;
    playOpenSound(P.n);
  });

  /* ---------- 点击画面：抖动 ---------- */
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    S.shiver = 1;
    S.shiverT = 0;
    playShiverSound();
    tone(880, 0.09, 'sine', 0.045, 0.05);
  });

  /* ---------- 音效开关 ---------- */
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function () {
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    if (!muted) { ensureAudio(); tone(660, 0.1, 'sine', 0.06); }
  });

  /* ============================================================
     启动
  ============================================================ */
  resizeCanvas();
  syncEquation();
  requestAnimationFrame(loop);

  // 首屏自动开屏（延迟一点，让用户看到动画）
  setTimeout(function () {
    S.open = 0;
  }, 60);
  S.open = 0;

  window.addEventListener('pointerdown', function once() {
    ensureAudio();
    window.removeEventListener('pointerdown', once);
  });

})();
</script>
</body>
</html>
