<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哥德尔不完备定理 · 形式系统的边界</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* 顶部启迪文字 */
  #topText{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    width:min(1120px,84vw);
    text-align:center;
    font-size:clamp(13px,1.72vw,22px);
    line-height:1.8;
    letter-spacing:.055em;
    font-weight:500;
    color:#dcecff;
    text-shadow:0 0 14px rgba(140,200,255,.9),0 0 40px rgba(60,120,255,.5),0 0 80px rgba(255,60,90,.25);
    pointer-events:none;z-index:12;
  }
  #topText span{display:inline-block;will-change:opacity}

  /* 边缘公式 */
  .formula{
    position:fixed;z-index:12;pointer-events:none;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    font-size:clamp(10px,0.98vw,15px);
    color:#9dc4e8;opacity:.72;letter-spacing:.04em;line-height:2.0;
    text-shadow:0 0 10px rgba(120,180,255,.85),0 0 26px rgba(50,110,255,.5);
  }
  .tl{top:16px;left:20px}
  .bl{bottom:88px;left:20px}
  .tr{top:16px;right:20px;text-align:right}
  .br{bottom:88px;right:20px;text-align:right}
  .formula .dim{opacity:.55;font-size:.9em}
  .formula .red{color:#ff6b88;text-shadow:0 0 12px rgba(255,60,100,.95)}
  .formula .cy{color:#6fe3ff;text-shadow:0 0 12px rgba(90,220,255,.95)}

  /* 控制面板 */
  #ui{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;
    padding:12px 24px;border-radius:16px;
    background:rgba(8,14,30,.62);
    border:1px solid rgba(120,180,255,.22);
    backdrop-filter:blur(10px);
    box-shadow:0 0 40px rgba(40,70,160,.35),inset 0 0 26px rgba(90,160,255,.06);
  }
  #ui .row{display:flex;gap:11px;align-items:center}
  #ui label{font-size:12.5px;color:#9db8d8;letter-spacing:.06em;white-space:nowrap}
  #ui .val{color:#7fe3ff;font-weight:700;min-width:40px;text-align:center;
    text-shadow:0 0 12px rgba(90,220,255,.95);font-variant-numeric:tabular-nums}
  #ui .hint{font-size:11px;color:#6d86a8;letter-spacing:.04em}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:230px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,#1d2f55,#3a7fd5,#7fe3ff);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#eaf6ff;border:1px solid #7fe3ff;
    box-shadow:0 0 16px rgba(110,220,255,.95);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:#eaf6ff;box-shadow:0 0 16px rgba(110,220,255,.95);cursor:pointer;
  }

  /* 自指标签 */
  #gLabel{
    position:fixed;z-index:14;pointer-events:none;
    padding:7px 14px;border-radius:9px;
    background:rgba(40,6,16,.78);
    border:1px solid rgba(255,60,90,.55);
    color:#ff8ba3;font-size:13px;letter-spacing:.06em;
    font-family:"Cambria Math",Georgia,serif;
    box-shadow:0 0 28px rgba(255,40,80,.5);
    opacity:0;transition:opacity .35s;
    white-space:nowrap;
    transform:translate(-50%,-50%);
  }

  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:8;
    background:radial-gradient(ellipse at 50% 46%,transparent 32%,rgba(0,0,0,.78) 100%);
  }
  @media (max-width:700px){
    #ui{padding:9px 13px;gap:5px}
    input[type=range]{width:140px}
    .formula{font-size:9px}
    .bl,.br{bottom:118px}
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="vignette"></div>
<div id="topText"></div>
<div id="gLabel">G : 本命题不可证 — 不可判定</div>

<!-- 边缘公式 -->
<div class="formula tl">
  G : “本命题不可证”<br>
  <span class="dim">G ↔ ¬Prov(⌜G⌝)</span>
</div>
<div class="formula tr">
  若系统一致 → <span class="cy">G 真</span> 且 <span class="red">G 不可证</span><br>
  <span class="dim">F ⊬ G 且 F ⊬ ¬G</span>
</div>
<div class="formula bl">
  哥德尔数编码 &nbsp;⌜φ⌝ ∈ ℕ<br>
  <span class="dim">语法 ⟶ 算术 · 自指构造</span>
</div>
<div class="formula br">
  一致性 Con(F) &nbsp;·&nbsp; 完备性<br>
  <span class="dim">二者不可兼得</span>
</div>

<!-- 控制面板 -->
<div id="ui">
  <div class="row">
    <label>公理数量</label>
    <input id="axRange" type="range" min="0" max="100" value="0" step="1">
    <span class="val" id="axVal">0</span>
  </div>
  <div class="row">
    <span class="hint">拖拽旋转 · 滚轮缩放 · 点击红色自指节点</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   常量
============================================================ */
const CYCLE = 30;                 // 循环时长（秒）
const NNODE = 116;                // 网络节点数
const R_NET = 8.2;                // 网络半径

/* ============================================================
   渲染器 / 场景 / 相机
============================================================ */
const host = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x02030a, 0.0145);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 4000);
const camTarget = new THREE.Vector3(0, 0, 0);
let camPhi  = 1.02;
let camDist = 24;
let dragTheta = 0;

/* ============================================================
   光斑贴图
============================================================ */
function makeGlow(){
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0,    'rgba(255,255,255,1)');
  g.addColorStop(0.16, 'rgba(255,255,255,0.70)');
  g.addColorStop(0.48, 'rgba(255,255,255,0.18)');
  g.addColorStop(1,    'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const GLOW = makeGlow();

/* ============================================================
   灯光
============================================================ */
scene.add(new THREE.AmbientLight(0x2a3d5e, 1.0));

const key = new THREE.DirectionalLight(0xcfe6ff, 1.3);
key.position.set(-10, 16, 14);
scene.add(key);

const l1 = new THREE.PointLight(0x3f8bff, 340, 90); l1.position.set( 12,  9,  9); scene.add(l1);
const l2 = new THREE.PointLight(0xff3b5c, 180, 60); l2.position.set(-8, -4, -6); scene.add(l2);
const l3 = new THREE.PointLight(0x00e5ff, 160, 70); l3.position.set( 0, 14, -8); scene.add(l3);

/* ============================================================
   网络节点生成（斐波那契球分布 + 抖动）
============================================================ */
const GOLD = Math.PI * (3 - Math.sqrt(5));
const rawNodes = [];

for (let i = 0; i < NNODE; i++){
  const y = 1 - (i / (NNODE - 1)) * 2;
  const r = Math.sqrt(Math.max(0, 1 - y*y));
  const th = GOLD * i;
  const rad = R_NET * (0.72 + Math.random() * 0.36);
  const squash = 0.82;

  rawNodes.push(new THREE.Vector3(
    Math.cos(th) * r * rad,
    y * rad * squash,
    Math.sin(th) * r * rad
  ));
}

/* ---- 建边（近邻连接） ---- */
const edgeSet = new Set();
const edges = [];
function addEdge(a, b){
  if (a === b) return;
  const k = Math.min(a,b) + '_' + Math.max(a,b);
  if (edgeSet.has(k)) return;
  edgeSet.add(k);
  edges.push([Math.min(a,b), Math.max(a,b)]);
}

for (let i = 0; i < NNODE; i++){
  const ds = [];
  for (let j = 0; j < NNODE; j++){
    if (i === j) continue;
    ds.push({ j, d: rawNodes[i].distanceToSquared(rawNodes[j]) });
  }
  ds.sort((a,b) => a.d - b.d);
  const k = 2 + (i % 3);
  for (let m = 0; m < k && m < ds.length; m++) addEdge(i, ds[m].j);
}

/* ---- BFS 层级（公理为第 0 层） ---- */
const adj = Array.from({ length: NNODE }, () => []);
for (const [a,b] of edges){ adj[a].push(b); adj[b].push(a); }

const ROOTS = [0, 41, 78];
const level = new Array(NNODE).fill(Infinity);
const q = [];
for (const r of ROOTS){ level[r] = 0; q.push(r); }
for (let h = 0; h < q.length; h++){
  const u = q[h];
  for (const v of adj[u]){
    if (level[v] === Infinity){ level[v] = level[u] + 1; q.push(v); }
  }
}
let maxLevel = 0;
for (let i = 0; i < NNODE; i++) if (level[i] !== Infinity) maxLevel = Math.max(maxLevel, level[i]);
// 孤立点兜底
for (let i = 0; i < NNODE; i++) if (level[i] === Infinity) level[i] = maxLevel + 1;

/* ---- 自指节点 G ---- */
const G_INDEX = NNODE - 1;   // 最后一个节点作为 G
const gPos = rawNodes[G_INDEX];
// 把 G 稍微推到外沿，更醒目
gPos.multiplyScalar(1.12);

/* ============================================================
   构建节点网格
============================================================ */
const netGroup = new THREE.Group();
scene.add(netGroup);

const nodeGeo = new THREE.SphereGeometry(0.155, 12, 9);
const nodeMeshes = [];

const COL_RAW   = new THREE.Color(0x2b3f5e);   // 未证明
const COL_PROOF = new THREE.Color(0x6fe0ff);   // 已证明
const COL_AXIOM = new THREE.Color(0xbcd8ff);   // 公理
const COL_G     = new THREE.Color(0xff2d55);   // 自指

for (let i = 0; i < NNODE; i++){
  const isG = (i === G_INDEX);
  const isRoot = ROOTS.includes(i);

  const baseColor = isG ? COL_G : (isRoot ? COL_AXIOM : COL_RAW);

  const mat = new THREE.MeshStandardMaterial({
    color: baseColor.clone(),
    emissive: baseColor.clone().multiplyScalar(0.55),
    emissiveIntensity: isG ? 1.5 : 0.6,
    metalness: 0.62,
    roughness: 0.30,
    transparent: true,
    opacity: 0.96
  });

  const mesh = new THREE.Mesh(nodeGeo, mat);
  mesh.position.copy(rawNodes[i]);
  mesh.userData = {
    index: i,
    isG,
    isRoot,
    level: level[i],
    phase: Math.random() * Math.PI * 2,
    proof: 0            // 0..1 当前点亮程度
  };
  netGroup.add(mesh);
  nodeMeshes.push(mesh);

  // 公理节点加光晕
  if (isRoot){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW, color: 0xbcd8ff, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    s.scale.set(1.5, 1.5, 1);
    mesh.add(s);
    mesh.userData.halo = s;
  }
}

/* ============================================================
   构建边（顶点着色）
============================================================ */
const ePos = new Float32Array(edges.length * 2 * 3);
const eCol = new Float32Array(edges.length * 2 * 3);

for (let i = 0; i < edges.length; i++){
  const [a,b] = edges[i];
  const pa = rawNodes[a], pb = rawNodes[b];
  ePos[i*6]     = pa.x; ePos[i*6+1] = pa.y; ePos[i*6+2] = pa.z;
  ePos[i*6 + 3] = pb.x; ePos[i*6+4] = pb.y; ePos[i*6+5] = pb.z;
}
const eGeo = new THREE.BufferGeometry();
eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
eGeo.setAttribute('color',    new THREE.BufferAttribute(eCol, 3));
const eMat = new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.52,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const edgeLines = new THREE.LineSegments(eGeo, eMat);
netGroup.add(edgeLines);

/* ============================================================
   自指回路 G（红色光环 + 脉冲）
============================================================ */
const gGroup = new THREE.Group();
gGroup.position.copy(gPos);
netGroup.add(gGroup);

// 自指环
const gRing1 = new THREE.Mesh(
  new THREE.TorusGeometry(0.62, 0.030, 8, 44),
  new THREE.MeshBasicMaterial({
    color: 0xff2d55, transparent: true, opacity: 0.92,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
gGroup.add(gRing1);

const gRing2 = new THREE.Mesh(
  new THREE.TorusGeometry(0.92, 0.016, 8, 44),
  new THREE.MeshBasicMaterial({
    color: 0xff7a96, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
gGroup.add(gRing2);

// 自指环内的脉冲光晕
const gHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: GLOW, color: 0xff3b5c, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
gHalo.scale.set(2.4, 2.4, 1);
gGroup.add(gHalo);

// G 节点本体（略大）
const gCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.26, 16, 12),
  new THREE.MeshStandardMaterial({
    color: 0xff2d55,
    emissive: 0xff2d55,
    emissiveIntensity: 2.2,
    metalness: 0.4,
    roughness: 0.25
  })
);
gGroup.add(gCore);

/* ============================================================
   漂浮公式粒子
============================================================ */
function makeTextSprite(text, color){
  const cv = document.createElement('canvas');
  let ctx = cv.getContext('2d');
  const FS = 56;
  ctx.font = `500 ${FS}px "Cambria Math", Georgia, serif`;
  const w = Math.ceil(ctx.measureText(text).width) + 60;
  const h = Math.ceil(FS * 1.9);
  cv.width = w; cv.height = h;
  ctx = cv.getContext('2d');
  ctx.font = `500 ${FS}px "Cambria Math", Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = 20;
  ctx.fillStyle = color;
  ctx.fillText(text, w/2, h/2);
  ctx.fillText(text, w/2, h/2);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, opacity: 0.62,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const sp = new THREE.Sprite(mat);
  const k = 0.0112;
  sp.scale.set(w * k, h * k, 1);
  return sp;
}

const F_TEXTS = [
  ['G ↔ ¬Prov(⌜G⌝)', '#ff6b88'],
  ['⌜G⌝ ∈ ℕ',        '#9fd8ff'],
  ['Con(F) → G ∧ ¬Prov(⌜G⌝)', '#7fe3ff'],
  ['¬Prov(x)',        '#9fd8ff'],
  ['F ⊬ G',           '#ff8ba3'],
  ['∀x (Prov(x) → φ)', '#9fd8ff'],
  ['⌜φ⌝ ↦ ⌜¬φ⌝',      '#7fe3ff'],
  ['1 ≠ 0',           '#bcd8ff'],
  ['Bew(⌜G⌝) → ⊥',    '#ff6b88'],
  ['F ⊬ ¬G',          '#ff8ba3'],
  ['Th(F) ⊊ Tr(ℕ)',   '#7fe3ff'],
  ['∃φ (φ ∧ ¬Prov(⌜φ⌝))', '#9fd8ff']
];

const floaters = [];
for (let i = 0; i < F_TEXTS.length; i++){
  const [txt, col] = F_TEXTS[i];
  const sp = makeTextSprite(txt, col);
  const ang = Math.random() * Math.PI * 2;
  const rad = 6.5 + Math.random() * 8.5;
  sp.position.set(
    Math.cos(ang) * rad,
    (Math.random() - 0.5) * 13,
    Math.sin(ang) * rad
  );
  sp.userData = {
    baseY: sp.position.y,
    spd: 0.18 + Math.random() * 0.30,
    ph: Math.random() * Math.PI * 2,
    amp: 0.6 + Math.random() * 1.1,
    rot: (Math.random() - 0.5) * 0.5
  };
  scene.add(sp);
  floaters.push(sp);
}

/* ============================================================
   背景星尘
============================================================ */
const PCOUNT = 620;
const pPos = new Float32Array(PCOUNT * 3);
const pCol = new Float32Array(PCOUNT * 3);
const tc = new THREE.Color();
for (let i = 0; i < PCOUNT; i++){
  pPos[i*3]     = (Math.random() - 0.5) * 120;
  pPos[i*3 + 1] = (Math.random() - 0.5) * 90;
  pPos[i*3 + 2] = (Math.random() - 0.5) * 120;

  tc.setHSL(0.58 + Math.random() * 0.08, 0.7, 0.66);
  if (Math.random() < 0.12) tc.setHSL(0.97, 0.85, 0.66);
  pCol[i*3] = tc.r; pCol[i*3+1] = tc.g; pCol[i*3+2] = tc.b;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
const stars = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.34, map: GLOW, vertexColors: true, transparent: true, opacity: 0.62,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
scene.add(stars);

/* ============================================================
   后处理
============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.78, 0.66, 0.05
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   顶部文字
============================================================ */
const TEXT = '哥德尔定理揭示任何足够强的形式系统都存在不可判定的真命题——数学的完备性与一致性不可兼得，启示我们任何体系都有其内在边界。';
const topEl = document.getElementById('topText');
const spans = [...TEXT].map(ch => {
  const s = document.createElement('span');
  s.textContent = ch;
  s.style.opacity = '0';
  topEl.appendChild(s);
  return s;
});
const CPS = 2.55;   // 每秒浮现字数（约 22 秒铺满）

/* ============================================================
   交互
============================================================ */
let dragging = false, lastX = 0, lastY = 0;
let downX = 0, downY = 0, moved = 0;
const el = renderer.domElement;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

el.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  downX = e.clientX; downY = e.clientY; moved = 0;
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  dragTheta -= dx * 0.0052;
  camPhi = Math.min(1.50, Math.max(0.16, camPhi - dy * 0.0042));
});
const endDrag = e => {
  if (dragging && moved < 6){
    // 视作点击
    const r = el.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);

    // 检测 G 环 / G 核心
    const hits = raycaster.intersectObjects([gCore, gRing1, gRing2, gHalo], false);
    if (hits.length > 0){
      gClicked = !gClicked;
      gClickedTime = clock.elapsedTime;
    } else {
      gClicked = false;
    }
  }
  dragging = false;
  try { el.releasePointerCapture(e.pointerId); } catch(_){}
};
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);

el.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.min(70, Math.max(9, camDist * (1 + Math.sign(e.deltaY) * 0.085)));
}, { passive: false });

/* ---- 滑块 ---- */
const axRange = document.getElementById('axRange');
const axValEl = document.getElementById('axVal');
let proofTarget = 0;
let proofLevel  = 0;
let autoMode    = true;

axRange.addEventListener('input', () => {
  autoMode = false;
  proofTarget = parseFloat(axRange.value) / 100;
  axValEl.textContent = axRange.value;
});

let gClicked = false;
let gClickedTime = -99;

/* ---- G 标签跟随 ---- */
const gLabelEl = document.getElementById('gLabel');
const tmpV = new THREE.Vector3();

/* ============================================================
   主循环
============================================================ */
const clock = new THREE.Clock();
let prevCycleT = 0;

function smoothstep(a, b, x){
  const k = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return k * k * (3 - 2 * k);
}

function tick(){
  requestAnimationFrame(tick);

  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;
  const t = elapsed % CYCLE;

  /* ---- 循环重置 ---- */
  if (t < prevCycleT){
    for (const s of spans){ s.style.opacity = '0'; s._last = -1; }
    if (autoMode){
      axRange.value = 0;
      axValEl.textContent = '0';
    }
  }
  prevCycleT = t;

  /* ---- 证明进度 ---- */
  if (autoMode){
    // 4s → 24s 内从 0 增长到 1
    proofTarget = smoothstep(4, 24, t);
    axRange.value = Math.round(proofTarget * 100);
    axValEl.textContent = axRange.value;
  }
  proofLevel += (proofTarget - proofLevel) * Math.min(1, dt * 3.2);

  /* ---- 网络整体出现 ---- */
  const appear = smoothstep(0, 2.4, t) * (1 - smoothstep(CYCLE - 2.2, CYCLE, t));

  /* ---- 网络整体旋转 ---- */
  netGroup.rotation.y = elapsed * 0.055 + dragTheta * 0.35;
  netGroup.rotation.x = Math.sin(elapsed * 0.08) * 0.10;

  /* ---- 节点状态更新 ---- */
  // 阈值：level <= threshold 的节点被点亮
  const lv = proofLevel * (maxLevel + 1);
  const eColArr = eGeo.attributes.color.array;

  for (let i = 0; i < NNODE; i++){
    const mesh = nodeMeshes[i];
    const ud = mesh.userData;
    const isG = ud.isG;
    const isRoot = ud.isRoot;

    let target;
    if (isG)      target = 0;                    // G 永不可证
    else if (isRoot) target = 1;                 // 公理恒亮
    else {
      // level 越接近 0 越先亮
      const nl = (ud.level + 0.001) / (maxLevel + 1);
      const thr = proofLevel;
      target = nl <= thr ? 1 : Math.max(0, 1 - (nl - thr) * 9);
    }

    // 平滑
    ud.proof += (target - ud.proof) * Math.min(1, dt * 3.0);
    const p = Math.max(0, Math.min(1, ud.proof));

    const pulse = 0.85 + 0.15 * Math.sin(elapsed * 2.2 + ud.phase);

    if (isG){
      // G 节点本体由 gGroup 处理，这里只是让 mesh 隐形/暗淡
      mesh.material.opacity = 0.0;
      mesh.material.emissiveIntensity = 0;
    } else {
      const cRaw = isRoot ? COL_AXIOM : COL_RAW;
      const cTgt = isRoot ? COL_AXIOM : COL_PROOF;

      const r = cRaw.r + (cTgt.r - cRaw.r) * p;
      const g = cRaw.g + (cTgt.g - cRaw.g) * p;
      const b = cRaw.b + (cTgt.b - cRaw.b) * p;

      mesh.material.color.setRGB(r, g, b);
      mesh.material.emissive.setRGB(r * 0.9, g * 0.9, b * 0.9);
      mesh.material.emissiveIntensity = (0.35 + 1.7 * p) * pulse;
      mesh.material.opacity = (0.35 + 0.65 * p) * appear;
      mesh.scale.setScalar((0.85 + 0.45 * p) * (0.6 + 0.4 * appear));

      if (ud.halo){
        ud.halo.material.opacity = (0.30 + 0.45 * p) * appear;
        const hs = 1.2 + 0.6 * p;
        ud.halo.scale.set(hs, hs, 1);
      }
    }

    // 边颜色（写入两端顶点）
  }

  // 更新边颜色
  for (let i = 0; i < edges.length; i++){
    const [a, b] = edges[i];
    const pa = Math.max(0, Math.min(1, nodeMeshes[a].userData.proof));
    const pb = Math.max(0, Math.min(1, nodeMeshes[b].userData.proof));
    const ga = nodeMeshes[a].userData.isG ? 0 : pa;
    const gb = nodeMeshes[b].userData.isG ? 0 : pb;

    // 未证明：暗蓝；已证明：青白
    const ra = 0.10 + 0.32 * ga, gg = 0.16 + 0.68 * ga, ba = 0.30 + 0.62 * ga;
    const rb = 0.10 + 0.32 * gb, gh = 0.16 + 0.68 * gb, bb = 0.30 + 0.62 * gb;

    eColArr[i*6]     = ra * appear;
    eColArr[i*6 + 1] = gg * appear;
    eColArr[i*6 + 2] = ba * appear;
    eColArr[i*6 + 3] = rb * appear;
    eColArr[i*6 + 4] = gh * appear;
    eColArr[i*6 + 5] = bb * appear;
  }
  eGeo.attributes.color.needsUpdate = true;
  eMat.opacity = 0.55 * appear;

  /* ---- 自指回路动画 ---- */
  {
    const pulse = 0.82 + 0.18 * Math.sin(elapsed * 3.4);
    gRing1.rotation.z = elapsed * 1.5;
    gRing1.rotation.y = elapsed * 0.9;
    gRing2.rotation.z = -elapsed * 1.1;
    gRing2.rotation.x = elapsed * 0.7;

    const bs = 1 + (0.08 + 0.10 * Math.sin(elapsed * 3.4)) * (1 + (gClicked ? 0.7 : 0));
    gRing1.scale.set(bs, bs, bs);
    gRing2.scale.set(bs, bs, bs);

    gHalo.scale.setScalar(2.2 + 0.5 * Math.sin(elapsed * 3.0) + (gClicked ? 0.9 : 0));
    gHalo.material.opacity = (0.65 + 0.25 * Math.sin(elapsed * 3.4)) * appear;

    gCore.material.emissiveIntensity = (1.8 + 0.8 * Math.sin(elapsed * 4.0)) * appear;
    gCore.scale.setScalar(1 + 0.10 * Math.sin(elapsed * 4.0) + (gClicked ? 0.15 : 0));

    // 面向相机的朝向
    gGroup.lookAt(camera.position);
  }

  /* ---- 漂浮公式 ---- */
  for (const sp of floaters){
    const ud = sp.userData;
    sp.position.y = ud.baseY + Math.sin(elapsed * ud.spd + ud.ph) * ud.amp;
    sp.material.opacity = (0.42 + 0.25 * Math.sin(elapsed * 0.9 + ud.ph)) * appear;
    sp.rotation.z = ud.rot * Math.sin(elapsed * 0.35 + ud.ph);
  }

  /* ---- 背景星尘 ---- */
  stars.rotation.y += 0.00020;
  stars.rotation.x  = Math.sin(elapsed * 0.04) * 0.045;

  /* ---- 相机 ---- */
  const autoTheta = Math.sin(elapsed * 0.105) * 0.55;
  const th = autoTheta + dragTheta;
  const sp2 = Math.sin(camPhi), cp2 = Math.cos(camPhi);
  camera.position.set(
    camTarget.x + camDist * sp2 * Math.sin(th),
    camTarget.y + camDist * cp2,
    camTarget.z + camDist * sp2 * Math.cos(th)
  );
  camera.lookAt(camTarget);

  /* ---- G 标签跟随 ---- */
  if (gClicked){
    tmpV.copy(gPos);
    netGroup.localToWorld(tmpV);
    tmpV.project(camera);
    const sx = (tmpV.x * 0.5 + 0.5) * innerWidth;
    const sy = (-tmpV.y * 0.5 + 0.5) * innerHeight;
    gLabelEl.style.left = sx + 'px';
    gLabelEl.style.top  = (sy - 42) + 'px';
    gLabelEl.style.opacity = appear > 0.3 ? '1' : '0';
  } else {
    gLabelEl.style.opacity = '0';
  }

  /* ---- 顶部文字逐字浮现 ---- */
  const shown = t * CPS;
  for (let i = 0; i < spans.length; i++){
    const o = Math.min(1, Math.max(0, shown - i));
    const s = spans[i];
    if (s._last !== o){
      s._last = o;
      s.style.opacity = o.toFixed(3);
    }
  }

  /* ---- 渲染 ---- */
  composer.render();
}

/* ============================================================
   自适应
============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

/* 启动 */
axValEl.textContent = '0';
tick();
</script>
</body>
</html>
