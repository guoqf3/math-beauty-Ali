<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>斯托克斯定理 · 环量与旋度</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;background:#02040a;color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;z-index:1;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}

  #title{
    position:absolute;top:0;left:0;
    padding:26px 34px;opacity:0;
    animation:fade 1.6s 0.3s ease forwards;
  }
  #title .en{
    font-size:9px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(120,200,255,.36);font-weight:300;margin-bottom:9px;
  }
  #title h1{
    font-size:clamp(17px,2.4vw,28px);
    font-weight:200;letter-spacing:.28em;text-indent:.28em;
    background:linear-gradient(96deg,#5ee0ff 0%,#7ab8ff 38%,#c090ff 72%,#ffd080 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:9px;
    filter:drop-shadow(0 0 26px rgba(100,180,255,.42));
  }
  #title .formula{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(10px,1.3vw,13px);
    letter-spacing:.10em;
    color:rgba(200,220,255,.58);
    line-height:1.9;
  }
  #title .formula .hl1{color:#ffd080;}
  #title .formula .hl2{color:#a890ff;}
  #title .formula .hl3{color:#5ee0ff;}

  #stats{
    position:absolute;top:0;right:0;
    padding:26px 34px;text-align:right;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:9.5px;letter-spacing:.10em;line-height:2.0;
    color:rgba(170,200,250,.34);
    opacity:0;animation:fade 1.6s 1.0s ease forwards;
  }
  #stats .lab{
    display:block;font-size:7.5px;letter-spacing:.42em;
    color:rgba(140,190,255,.26);margin-bottom:6px;
  }
  #stats .k{color:rgba(190,205,255,.52);}
  #stats .v1{color:rgba(255,210,130,.94);font-weight:600;}
  #stats .v2{color:rgba(180,150,255,.94);font-weight:600;}
  #stats .vdiff{
    font-size:clamp(16px,2vw,22px);
    font-weight:300;
    color:rgba(140,240,200,.94);
    display:block;line-height:1;
    margin:6px 0;
    letter-spacing:.04em;
    filter:drop-shadow(0 0 12px rgba(120,240,190,.42));
  }

  #compare{
    position:absolute;bottom:0;left:0;right:0;
    padding:0 34px 28px;
    opacity:0;animation:fade 1.6s 1.3s ease forwards;
    display:flex;gap:34px;
    align-items:flex-end;
    pointer-events:none;
  }
  .cmp-col{
    flex:1;
    max-width:340px;
  }
  .cmp-col .lab{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8px;letter-spacing:.34em;
    margin-bottom:8px;
  }
  .cmp-col.left .lab{color:rgba(255,200,120,.62);}
  .cmp-col.right .lab{color:rgba(180,150,255,.62);}
  .cmp-val{
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:clamp(16px,2vw,22px);
    font-weight:300;
    letter-spacing:.04em;
    margin-bottom:8px;
  }
  .cmp-col.left .cmp-val{color:rgba(255,215,150,.95);}
  .cmp-col.right .cmp-val{color:rgba(200,180,255,.95);}
  .cmp-bar{
    width:100%;height:5px;
    background:rgba(120,155,240,.14);
    border-radius:3px;overflow:hidden;
    position:relative;
  }
  .cmp-fill{
    position:absolute;left:0;top:0;height:100%;
    width:0%;
    border-radius:3px;
    transition:width .1s linear;
  }
  .cmp-col.left .cmp-fill{
    background:linear-gradient(90deg,#ffb060,#ffd8a0);
    box-shadow:0 0 10px rgba(255,180,100,.65);
  }
  .cmp-col.right .cmp-fill{
    background:linear-gradient(90deg,#a890ff,#d8c0ff);
    box-shadow:0 0 10px rgba(180,150,255,.65);
  }

  #matchBadge{
    position:absolute;
    bottom:0;left:50%;transform:translateX(-50%);
    padding-bottom:88px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:10px;letter-spacing:.28em;
    color:rgba(140,240,200,.95);
    opacity:0;
    transition:opacity .5s, transform .5s;
    text-shadow:0 0 16px rgba(120,240,190,.72);
    white-space:nowrap;
  }
  #matchBadge.on{
    opacity:1;
    animation:matchPulse 2s ease-in-out infinite;
  }
  @keyframes matchPulse{
    0%,100%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(1.06);}
  }

  #audioDot{
    position:absolute;bottom:0;right:0;
    padding:0 34px 28px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:8.5px;letter-spacing:.22em;
    color:rgba(160,200,240,.30);
    opacity:0;animation:fade 1.6s 1.6s ease forwards;
    display:flex;align-items:center;gap:7px;
    justify-content:flex-end;
    pointer-events:none;
  }
  #audioDot .dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(160,150,230,.24);
    transition:background .4s,box-shadow .4s;
  }
  #audioDot.on .dot{
    background:rgba(140,240,200,.92);
    box-shadow:0 0 9px rgba(140,240,200,.85);
  }

  @keyframes fade{to{opacity:1;}}

  @media (max-width:720px){
    #title{padding:14px 16px;}
    #title .formula{font-size:10px;}
    #stats{padding:14px 16px;font-size:8.5px;}
    #compare{padding:0 16px 60px;gap:14px;}
    .cmp-val{font-size:14px;}
    #matchBadge{padding-bottom:56px;font-size:9px;}
    #audioDot{display:none;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    <div class="en">STOKES' THEOREM · CIRCULATION = FLUX</div>
    <h1>斯托克斯定理</h1>
    <div class="formula">
      <span class="hl1">∮_C F·dr</span> =
      <span class="hl2">∬_S (∇×F)·dS</span>
    </div>
  </div>

  <div id="stats">
    <span class="lab">LIVE COMPARISON</span>
    <div><span class="k">环量 </span><span class="v1" id="vCirc">0.000</span></div>
    <div><span class="k">通量 </span><span class="v2" id="vFlux">0.000</span></div>
    <span class="vdiff" id="vDiff">差 0.000</span>
    <div><span class="k">进度 </span><span class="k" id="vProg">0%</span></div>
  </div>

  <div id="compare">
    <div class="cmp-col left">
      <div class="lab">∮_C F·dr · 环量积分</div>
      <div class="cmp-val" id="cVal">0.000</div>
      <div class="cmp-bar"><div class="cmp-fill" id="cFill"></div></div>
    </div>
    <div class="cmp-col right">
      <div class="lab">∬_S (∇×F)·dS · 曲面积分</div>
      <div class="cmp-val" id="fVal">0.000</div>
      <div class="cmp-bar"><div class="cmp-fill" id="fFill"></div></div>
    </div>
  </div>

  <div id="matchBadge">✓ 两者相等 · 斯托克斯定理</div>

  <div id="audioDot">
    <span class="dot"></span>
    <span>环绕音 · 匹配音</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   画布
   ========================================================= */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, SCALE = 200;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.48;
  SCALE = Math.min(W * 0.32, H * 0.32);
}
window.addEventListener('resize', resize);

/* =========================================================
   相机
   ========================================================= */
let yaw = 0.5;
let pitch = 0.38;
let camDist = 4.5;
let autoRotate = true;

let dragging = false;
let lastMX = 0, lastMY = 0;
let dragVX = 0, dragVY = 0;

function rotate3(x, y, z){
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);

  const x1 =  x * cy + z * sy;
  const z1 = -x * sy + z * cy;
  const y1 = y;

  const y2 = y1 * cp - z1 * sp;
  const z2 = y1 * sp + z1 * cp;

  return { x: x1, y: y2, z: z2 };
}

function project(x, y, z){
  const v = rotate3(x, y, z);
  const depth = camDist - v.z;
  if (depth < 0.6){
    return { x: CX, y: CY, depth: depth, s: 0, visible: false };
  }
  const s = camDist / depth;
  return {
    x: CX + v.x * s * SCALE,
    y: CY - v.y * s * SCALE,
    depth: depth,
    s: s,
    visible: true
  };
}

/* =========================================================
   曲面定义
   抛物面穹顶：y = K(1-u²)
   P(u,v) = (u cos v, K(1-u²), -u sin v)
   外法向：P_u × P_v = (2Ku² cos v, u, -2Ku² sin v)
   ========================================================= */
const K = 0.72;
const U_SEGS = 14;
const V_SEGS = 36;

function surfPoint(u, v){
  return {
    x: u * Math.cos(v),
    y: K * (1 - u * u),
    z: -u * Math.sin(v)
  };
}

function surfNormal(u, v){
  let nx = 2 * K * u * u * Math.cos(v);
  let ny = u;
  let nz = -2 * K * u * u * Math.sin(v);
  const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
  return { x: nx/len, y: ny/len, z: nz/len };
}

/* 边界圆：r(t) = (cos t, 0, -sin t) */
function borderPoint(t){
  return { x: Math.cos(t), y: 0, z: -Math.sin(t) };
}

/* =========================================================
   向量场 F = (z, 0, -x)，curl F = (0, 2, 0)
   环量 = 2π，通量 = 2π
   ========================================================= */
const TOTAL = 2 * Math.PI;

/* =========================================================
   预构建四边形
   ========================================================= */
const quads = [];

function buildQuads(){
  quads.length = 0;

  for (let i = 0; i < U_SEGS; i++){
    for (let j = 0; j < V_SEGS; j++){
      const u0 = i / U_SEGS;
      const u1 = (i + 1) / U_SEGS;
      const v0 = (j / V_SEGS) * TAU;
      const v1 = ((j + 1) / V_SEGS) * TAU;

      const p00 = surfPoint(u0, v0);
      const p01 = surfPoint(u0, v1);
      const p11 = surfPoint(u1, v1);
      const p10 = surfPoint(u1, v0);

      const uMid = (u0 + u1) * 0.5;
      const vMid = (v0 + v1) * 0.5;

      const cX = (p00.x + p01.x + p11.x + p10.x) * 0.25;
      const cY = (p00.y + p01.y + p11.y + p10.y) * 0.25;
      const cZ = (p00.z + p01.z + p11.z + p10.z) * 0.25;

      const nrm = surfNormal(uMid, vMid);

      /* 通量密度：2u （对应 (∇×F)·n dS / du dv） */
      const density = 2 * uMid;

      quads.push({
        pts: [p00, p01, p11, p10],
        cx: cX, cy: cY, cz: cZ,
        nx: nrm.x, ny: nrm.y, nz: nrm.z,
        uMid: uMid,
        vMid: vMid,
        density: density,
        /* 归一化密度用于着色：u ∈ [0,1] → [0, 1] */
        tNorm: uMid
      });
    }
  }
}

/* =========================================================
   动画状态
   ========================================================= */
let elapsed = 0;
const CYCLE = 9.0;
const BUILD_DUR = 5.0;   /* 累积时长 */
const FADE_IN = 0.8;
const HOLD_START = FADE_IN + BUILD_DUR;
const HOLD_DUR = 2.6;

let circProgress = 0;   /* 0 → 1，边界环量进度 */
let fluxProgress = 0;   /* 0 → 1，曲面积分进度 */

let circularValue = 0;
let fluxValue = 0;

let matchPlayed = false;

/* 粒子 */
const borderParticles = [];

function initParticles(){
  borderParticles.length = 0;
  for (let i = 0; i < 9; i++){
    borderParticles.push({
      offset: i / 9,
      size: 1.4 + Math.random() * 1.2,
      hue: 42 + Math.random() * 14
    });
  }
}
initParticles();

/* 屏幕爆发粒子 */
const sparks = [];

function spawnSparks(x, y, count, hue){
  for (let i = 0; i < count; i++){
    const a = Math.random() * TAU;
    const sp = 60 + Math.random() * 190;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.5 + Math.random() * 1.6,
      size: 1.0 + Math.random() * 2.2,
      hue: hue + (Math.random() - 0.5) * 24
    });
  }
}

function updateSparks(dt){
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= s.decay * dt;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.94;
    s.vy *= 0.94;
  }
}

function drawSparks(){
  if (sparks.length === 0) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < sparks.length; i++){
    const s = sparks[i];
    const a = s.life * s.life * 0.9;
    const r = s.size * s.life;
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4.5);
    g.addColorStop(0.00, 'hsla(' + s.hue + ',100%,92%,' + a + ')');
    g.addColorStop(0.42, 'hsla(' + s.hue + ',100%,72%,' + (a * 0.30) + ')');
    g.addColorStop(1.00, 'hsla(' + s.hue + ',100%,62%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   音频
   ========================================================= */
let ac = null;
let master = null;
let orbitOsc = null;
let orbitGain = null;
let orbitFilter = null;
let matchOsc = null;
let matchGain = null;
let audioReady = false;
let lastCircPitchT = 0;

function setAudioOn(on){
  const d = document.getElementById('audioDot');
  if (d) d.classList.toggle('on', on);
}

function initAudio(){
  if (audioReady){
    if (ac && ac.state === 'suspended'){
      ac.resume().then(function(){ setAudioOn(true); }).catch(function(){});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ return; }
  audioReady = true;

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.42, ac.currentTime, 1.8);

  /* 环绕音：缓慢摆动的锯齿波 + 低通 */
  orbitOsc = ac.createOscillator();
  orbitOsc.type = 'sawtooth';
  orbitOsc.frequency.value = 90;

  orbitFilter = ac.createBiquadFilter();
  orbitFilter.type = 'lowpass';
  orbitFilter.frequency.value = 520;
  orbitFilter.Q.value = 5.5;

  orbitGain = ac.createGain();
  orbitGain.gain.value = 0.022;

  orbitOsc.connect(orbitFilter);
  orbitFilter.connect(orbitGain);
  orbitGain.connect(master);
  orbitOsc.start();

  /* 环绕颤音 */
  const lfo = ac.createOscillator();
  lfo.frequency.value = 6.2;
  const lfoG = ac.createGain();
  lfoG.gain.value = 4.5;
  lfo.connect(lfoG);
  lfoG.connect(orbitOsc.frequency);
  lfo.start();

  /* 匹配音：纯和弦 */
  matchOsc = ac.createOscillator();
  matchOsc.type = 'sine';
  matchOsc.frequency.value = 528;

  matchGain = ac.createGain();
  matchGain.gain.value = 0;

  matchOsc.connect(matchGain);
  matchGain.connect(master);
  matchOsc.start();

  /* 轻背景垫音 */
  const pad = ac.createOscillator();
  pad.type = 'sine';
  pad.frequency.value = 110;
  const padG = ac.createGain();
  padG.gain.value = 0.008;
  pad.connect(padG);
  padG.connect(master);
  pad.start();

  if (ac.state === 'suspended'){
    ac.resume().then(function(){ setAudioOn(true); }).catch(function(){ audioReady = false; });
  } else {
    setAudioOn(true);
  }
}

/* 更新环绕音：随进度上升音高 */
function updateOrbitAudio(dt){
  if (!audioReady || !ac || ac.state !== 'running' || !orbitOsc) return;

  const t = ac.currentTime;
  const p = Math.max(circProgress, fluxProgress);
  const freq = 82 + p * 220;
  orbitOsc.frequency.setTargetAtTime(freq, t, 0.10);
  orbitFilter.frequency.setTargetAtTime(420 + p * 1200, t, 0.15);
  orbitGain.gain.setTargetAtTime(0.020 + p * 0.020, t, 0.15);

  /* 匹配音渐入 */
  if (matchGain){
    const target = matchPlayed ? 0.030 : 0;
    matchGain.gain.setTargetAtTime(target, t, 0.20);
  }
}

/* 匹配提示音 */
function playMatchChime(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
  for (let i = 0; i < notes.length; i++){
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = notes[i];

    const g = ac.createGain();
    const t0 = now + i * 0.07;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.038, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0002, t0 + 1.6);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + 1.7);
  }
}

/* 边界粒子通过时的滴答 */
function playBorderTick(){
  if (!audioReady || !ac || ac.state !== 'running') return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880 + Math.random() * 220, now);
  osc.frequency.exponentialRampToValueAtTime(520, now + 0.08);

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.018, now + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0002, now + 0.10);

  osc.connect(g);
  g.connect(master);
  osc.start(now);
  osc.stop(now + 0.12);
}

/* =========================================================
   绘制：曲面
   ========================================================= */
function drawSurface(){
  /* 构建屏幕四边形列表 */
  const list = [];

  for (let k = 0; k < quads.length; k++){
    const q = quads[k];

    const p0 = project(q.pts[0].x, q.pts[0].y, q.pts[0].z);
    const p1 = project(q.pts[1].x, q.pts[1].y, q.pts[1].z);
    const p2 = project(q.pts[2].x, q.pts[2].y, q.pts[2].z);
    const p3 = project(q.pts[3].x, q.pts[3].y, q.pts[3].z);

    if (!p0.visible || !p1.visible || !p2.visible || !p3.visible) continue;

    const depth = (p0.depth + p1.depth + p2.depth + p3.depth) * 0.25;
    const nv = rotate3(q.nx, q.ny, q.nz);
    const facing = nv.z > 0;

    list.push({
      screen: [p0, p1, p2, p3],
      depth: depth,
      facing: facing,
      q: q
    });
  }

  list.sort(function(a, b){ return b.depth - a.depth; });

  /* 先绘制背面 */
  for (let i = 0; i < list.length; i++){
    if (list[i].facing) continue;
    drawQuad(list[i], false);
  }

  /* 再绘制正面 */
  for (let i = 0; i < list.length; i++){
    if (!list[i].facing) continue;
    drawQuad(list[i], true);
  }
}

function drawQuad(item, front){
  const p = item.screen;
  const q = item.q;

  /* 是否已被扫描覆盖 */
  const swept = q.uMid <= fluxProgress;
  const nearEdge = swept ? Math.min(1, (fluxProgress - q.uMid) * 12 + 0.35) : 0;

  /* 颜色：基于密度 tNorm 与扫描状态 */
  let hue, sat, lig, alpha;

  if (swept){
    /* 已扫描：明亮通量色（青→紫） */
    const t = q.tNorm;
    hue = 200 - t * 110;      /* 200 → 90 */
    sat = 88;
    lig = 48 + t * 14;
    alpha = front ? (0.42 + t * 0.20) : 0.10;
  } else {
    /* 未扫描：暗色底 */
    const t = q.tNorm;
    hue = 215;
    sat = 62;
    lig = 18 + t * 8;
    alpha = front ? 0.16 : 0.06;
  }

  ctx.beginPath();
  ctx.moveTo(p[0].x, p[0].y);
  ctx.lineTo(p[1].x, p[1].y);
  ctx.lineTo(p[2].x, p[2].y);
  ctx.lineTo(p[3].x, p[3].y);
  ctx.closePath();

  /* 填充 */
  ctx.fillStyle = 'hsla(' + hue.toFixed(0) + ',' + sat + '%,' + lig + '%,' + alpha.toFixed(3) + ')';
  ctx.fill();

  /* 扫过边缘的高亮 */
  if (swept && front && q.uMid > fluxProgress - 0.14){
    ctx.fillStyle = 'hsla(' + (hue + 20) + ',100%,80%,' + (0.20 * nearEdge) + ')';
    ctx.fill();
  }

  /* 网格线 */
  ctx.strokeStyle = swept
    ? 'hsla(' + (hue + 15) + ',92%,78%,' + (0.42 * (front ? 1 : 0.4)) + ')'
    : 'rgba(120,160,230,' + (0.14 * (front ? 1 : 0.5)) + ')';
  ctx.lineWidth = swept ? 0.9 : 0.6;
  ctx.stroke();
}

/* =========================================================
   绘制：边界圆
   ========================================================= */
function drawBorder(){
  const SEGS = 140;

  /* 完整边界（暗底） */
  ctx.beginPath();
  for (let i = 0; i <= SEGS; i++){
    const t = (i / SEGS) * TAU;
    const p3 = borderPoint(t);
    const p = project(p3.x, p3.y, p3.z);
    if (!p.visible) continue;
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(180,210,255,0.22)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 已扫过的边界段 */
  const maxT = circProgress * TAU;
  if (maxT > 0.01){
    const N = Math.max(3, Math.ceil((maxT / TAU) * SEGS));

    ctx.beginPath();
    for (let i = 0; i <= N; i++){
      const t = (i / N) * maxT;
      const p3 = borderPoint(t);
      const p = project(p3.x, p3.y, p3.z);
      if (!p.visible) continue;
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }

    /* 外发光 */
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,200,110,0.30)';
    ctx.lineWidth = 7;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    /* 主描边 */
    ctx.strokeStyle = 'rgba(255,225,150,0.96)';
    ctx.lineWidth = 2.6;
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 边界粒子（沿圆环运动） */
  if (circProgress > 0.002 && circProgress < 1.001){
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < borderParticles.length; i++){
      const bp = borderParticles[i];
      const t = ((circProgress * bp.offset) % 1) * TAU;

      const p3 = borderPoint(t);
      const p = project(p3.x, p3.y, p3.z);
      if (!p.visible) continue;

      const sz = bp.size * p.s * 2.4;

      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, sz * 3.2);
      g.addColorStop(0.00, 'hsla(' + bp.hue + ',100%,92%,0.95)');
      g.addColorStop(0.42, 'hsla(' + bp.hue + ',100%,72%,0.35)');
      g.addColorStop(1.00, 'hsla(' + bp.hue + ',100%,62%,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, sz * 3.2, 0, TAU);
      ctx.fill();

      /* 核心 */
      ctx.fillStyle = 'hsla(' + bp.hue + ',100%,96%,0.94)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, sz * 0.62, 0, TAU);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 扫描尖端的光点 */
  if (circProgress > 0.005 && circProgress < 0.998){
    const tipT = circProgress * TAU;
    const p3 = borderPoint(tipT);
    const p = project(p3.x, p3.y, p3.z);

    if (p.visible){
      ctx.globalCompositeOperation = 'lighter';
      const r = 12 + 5 * Math.sin(elapsed * 6);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0.00, 'rgba(255,250,220,0.92)');
      g.addColorStop(0.42, 'rgba(255,200,110,0.42)');
      g.addColorStop(1.00, 'rgba(255,180,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

/* =========================================================
   绘制：旋度向量（外法向方向）
   ========================================================= */
function drawCurlVectors(){
  if (fluxProgress < 0.02) return;

  const STEPS_U = 5;
  const STEPS_V = 12;

  ctx.lineCap = 'round';

  for (let i = 0; i <= STEPS_U; i++){
    const u = i / STEPS_U;
    if (u > fluxProgress + 0.005) continue;

    for (let j = 0; j < STEPS_V; j++){
      const v = (j / STEPS_V) * TAU;

      const p3 = surfPoint(u, v);
      const n = surfNormal(u, v);

      /* 箭头长度：与通量密度正相关 */
      const len = 0.10 + u * 0.16;

      /* 摆动 */
      const pulse = 1 + 0.14 * Math.sin(elapsed * 3.4 + i * 0.7 + j * 0.6);

      const tip = {
        x: p3.x + n.x * len * pulse,
        y: p3.y + n.y * len * pulse,
        z: p3.z + n.z * len * pulse
      };

      const p0 = project(p3.x, p3.y, p3.z);
      const p1 = project(tip.x, tip.y, tip.z);

      if (!p0.visible || !p1.visible) continue;

      /* 仅显示朝向相机的 */
      const nv = rotate3(n.x, n.y, n.z);
      if (nv.z < -0.05) continue;

      /* 颜色：随 u 从青到紫 */
      const hue = 200 - u * 110;
      const alpha = 0.55 + u * 0.35;

      ctx.strokeStyle = 'hsla(' + hue.toFixed(0) + ',100%,76%,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();

      /* 箭头 */
      const dx = p1.x - p0.x;
      const dy = p1.y - p0.y;
      const dl = Math.sqrt(dx*dx + dy*dy);
      if (dl > 4){
        const ux = dx / dl, uy = dy / dl;
        const hs = Math.min(4.5, dl * 0.42);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p1.x - ux * hs + uy * hs * 0.55, p1.y - uy * hs - ux * hs * 0.55);
        ctx.lineTo(p1.x - ux * hs - uy * hs * 0.55, p1.y - uy * hs + ux * hs * 0.55);
        ctx.closePath();
        ctx.fillStyle = 'hsla(' + hue.toFixed(0) + ',100%,82%,' + alpha.toFixed(3) + ')';
        ctx.fill();
      }
    }
  }
}

/* =========================================================
   背景
   ========================================================= */
function drawBackground(){
  const bg = ctx.createRadialGradient(
    CX, CY * 0.9, 0,
    CX, CY, Math.max(W, H) * 0.88
  );
  bg.addColorStop(0.00, '#0a1226');
  bg.addColorStop(0.42, '#060c1a');
  bg.addColorStop(1.00, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = 0;
let uiTick = 0;

function update(dt){
  elapsed += dt;
  if (elapsed >= CYCLE) elapsed -= CYCLE;

  const t = elapsed;

  /* 计算进度 */
  let p = 0;
  if (t < FADE_IN){
    p = 0;
  } else if (t < FADE_IN + BUILD_DUR){
    p = (t - FADE_IN) / BUILD_DUR;
  } else {
    p = 1;
  }

  /* 平滑 */
  const easedP = p * p * (3 - 2 * p);

  circProgress = easedP;
  fluxProgress = easedP;

  /* 计算积分值 */
  circularValue = circProgress * TOTAL;
  fluxValue = fluxProgress * TOTAL;

  /* 匹配判定 */
  const diff = Math.abs(circularValue - fluxValue);

  if (!matchPlayed && circProgress > 0.995 && fluxProgress > 0.995){
    matchPlayed = true;
    playMatchChime();
    spawnSparks(CX, CY, 36, 165);
    spawnSparks(CX, CY, 24, 42);
  }

  if (elapsed < 0.1){
    /* 循环重置 */
    if (matchPlayed){
      matchPlayed = false;
    }
  }

  updateSparks(dt);
  updateOrbitAudio(dt);
}

/* =========================================================
   渲染
   ========================================================= */
function render(){
  drawBackground();

  drawSurface();
  drawBorder();
  drawCurlVectors();
  drawSparks();

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    CX, CY, Math.min(W, H) * 0.34,
    CX, CY, Math.max(W, H) * 0.88
  );
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2, 4, 10, 0.24)');
  vg.addColorStop(1.00, 'rgba(0, 1, 4, 0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   UI 更新
   ========================================================= */
function updateUI(){
  uiTick++;
  if (uiTick % 3 !== 0) return;

  const vC = document.getElementById('vCirc');
  const vF = document.getElementById('vFlux');
  const vD = document.getElementById('vDiff');
  const vP = document.getElementById('vProg');
  const cV = document.getElementById('cVal');
  const fV = document.getElementById('fVal');
  const cF = document.getElementById('cFill');
  const fF = document.getElementById('fFill');
  const mB = document.getElementById('matchBadge');

  const diff = Math.abs(circularValue - fluxValue);

  if (vC) vC.textContent = circularValue.toFixed(4);
  if (vF) vF.textContent = fluxValue.toFixed(4);
  if (vD) vD.textContent = '差 ' + diff.toFixed(4);
  if (vP) vP.textContent = Math.round(fluxProgress * 100) + '%';

  if (cV) cV.textContent = circularValue.toFixed(4);
  if (fV) fV.textContent = fluxValue.toFixed(4);
  if (cF) cF.style.width = (circProgress * 100).toFixed(1) + '%';
  if (fF) fF.style.width = (fluxProgress * 100).toFixed(1) + '%';

  if (mB){
    if (fluxProgress > 0.995 && Math.abs(circularValue - fluxValue) < 0.02){
      mB.classList.add('on');
    } else {
      mB.classList.remove('on');
    }
  }
}

/* =========================================================
   主循环
   ========================================================= */
function loop(now){
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  /* 自动旋转 */
  if (autoRotate && !dragging){
    yaw += dt * 0.16;
  }

  /* 惯性 */
  if (!dragging){
    yaw += dragVX * dt;
    pitch += dragVY * dt;
    dragVX *= Math.exp(-3.2 * dt);
    dragVY *= Math.exp(-3.2 * dt);
    if (pitch > 1.24) pitch = 1.24;
    if (pitch < -0.20) pitch = -0.20;
  }

  update(dt);
  render();
  updateUI();
}

/* =========================================================
   交互
   ========================================================= */
canvas.addEventListener('pointerdown', function(e){
  initAudio();
  dragging = true;
  autoRotate = false;
  lastMX = e.clientX;
  lastMY = e.clientY;
  dragVX = 0;
  dragVY = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
});

canvas.addEventListener('pointermove', function(e){
  if (!dragging) return;

  const dx = e.clientX - lastMX;
  const dy = e.clientY - lastMY;

  yaw += dx * 0.008;
  pitch += dy * 0.006;
  if (pitch > 1.24) pitch = 1.24;
  if (pitch < -0.20) pitch = -0.20;

  dragVX = dx * 0.14;
  dragVY = dy * 0.10;

  lastMX = e.clientX;
  lastMY = e.clientY;
});

function endDrag(e){
  dragging = false;
  if (e && e.pointerId !== undefined){
    try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
  }
  setTimeout(function(){
    if (!dragging) autoRotate = true;
  }, 2600);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* 滚轮缩放 */
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  initAudio();
  camDist += e.deltaY * 0.0035;
  if (camDist < 2.8) camDist = 2.8;
  if (camDist > 8.0) camDist = 8.0;
}, { passive: false });

/* 键盘 */
window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    initAudio();
    elapsed = 0;
    matchPlayed = false;
    sparks.length = 0;
  } else if (e.key === 'r' || e.key === 'R'){
    initAudio();
    yaw = 0.5;
    pitch = 0.38;
    camDist = 4.5;
    autoRotate = true;
  }
});

/* =========================================================
   启动
   ========================================================= */
resize();
buildQuads();
initParticles();
requestAnimationFrame(loop);

})();
</script>
