<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲面直纹编织 · 动态直纹几何</title>
    <style>
        :root { --bg: #060a14; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            width: 100vw; height: 100vh; height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 2.5vh; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.1rem, 2.5vw, 1.8rem); font-weight: 400;
            letter-spacing: 0.07em; color: rgba(215, 225, 245, 0.93);
            text-shadow: 0 0 45px rgba(160, 200, 255, 0.55), 0 0 85px rgba(130, 170, 240, 0.3);
            line-height: 1.3;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.6rem, 1.3vw, 0.85rem); letter-spacing: 0.12em;
            color: rgba(180, 195, 220, 0.72);
            text-shadow: 0 0 20px rgba(140, 180, 220, 0.35); margin-top: 0.3vh; font-style: italic;
        }
        #formula-overlay {
            position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #formula-overlay .formula {
            font-size: clamp(0.6rem, 1.3vw, 0.82rem); letter-spacing: 0.04em;
            color: rgba(190, 200, 225, 0.78); text-shadow: 0 0 30px rgba(150, 180, 220, 0.4);
            font-style: italic; background: rgba(8, 14, 26, 0.55);
            padding: 0.5vh 2vw; border-radius: 2rem;
            border: 1px solid rgba(120, 150, 200, 0.22);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            white-space: nowrap;
        }
        #formula-overlay .formula .highlight {
            color: rgba(255, 175, 95, 0.9); font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">双曲面直纹编织</div>
        <div class="subtitle">动态单叶双曲面 · 直纹母线交织</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="highlight">x</span> = a cos u ± v sin u 
            <span class="highlight">y</span> = a sin u ∓ v cos u 
            <span class="highlight">z</span> = c v | a,c∝sin(ωᵢt)
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.157.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- DOM 容器 ---
        const container = document.getElementById('canvas-container');

        // --- 场景初始化 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.1, 18);
        camera.position.set(4.5, 0.9, 4.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x060a14, 1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // --- 星空背景 ---
        const starCount = 600;
        const starGeom = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        const starSize = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 7.2 + Math.random() * 9;
            starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            starPos[i*3+2] = r * Math.cos(phi);
            starSize[i] = Math.random() * 1.4 + 0.15;
        }
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeom.setAttribute('size', new THREE.BufferAttribute(starSize, 1));
        const stars = new THREE.Points(starGeom, new THREE.PointsMaterial({
            color: 0x7d8eb5, size: 0.009, transparent: true, opacity: 0.55,
            blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
        }));
        scene.add(stars);

        // --- 颜色定义 ---
        const COLORS = [
            new THREE.Color('#00c8f0'), // 青色 - 第一族直纹
            new THREE.Color('#f0a040'), // 金色 - 第二族直纹
            new THREE.Color('#f05078')  // 品红 - 椭圆（横向纬线）
        ];

        // --- 线条参数 ---
        const NUM_LINES_PER_FAMILY = 32;
        const POINTS_PER_LINE = 220;
        const V_RANGE = 2.5;   // v 范围 -V_RANGE 到 V_RANGE
        const U_COUNT = NUM_LINES_PER_FAMILY;

        // 线条元数据
        const lineMetas = [];
        
        // 第一族直纹 (固定u, 变化v) 青色
        const uValues1 = [];
        for (let i = 0; i < NUM_LINES_PER_FAMILY; i++) {
            uValues1.push((i / NUM_LINES_PER_FAMILY) * Math.PI * 2);
        }
        // 第二族直纹 (固定v, 变化u) 金色
        const vValues2 = [];
        for (let i = 0; i < NUM_LINES_PER_FAMILY; i++) {
            vValues2.push(-V_RANGE + (i / (NUM_LINES_PER_FAMILY-1)) * 2 * V_RANGE);
        }
        // 第三族椭圆 (固定z截面, v固定，u变化) 品红
        const zLevels = [];
        for (let i = 0; i < NUM_LINES_PER_FAMILY; i++) {
            zLevels.push(-V_RANGE + (i / (NUM_LINES_PER_FAMILY-1)) * 2 * V_RANGE);
        }

        // 将三族信息存入数组
        for (let i = 0; i < NUM_LINES_PER_FAMILY; i++) {
            lineMetas.push({ family: 0, u: uValues1[i] });
        }
        for (let i = 0; i < NUM_LINES_PER_FAMILY; i++) {
            lineMetas.push({ family: 1, v: vValues2[i] });
        }
        for (let i = 0; i < NUM_LINES_PER_FAMILY; i++) {
            lineMetas.push({ family: 2, z: zLevels[i] });
        }

        // --- 创建线条BufferGeometry ---
        const lineObjects = [];
        for (let i = 0; i < lineMetas.length; i++) {
            const positions = new Float32Array(POINTS_PER_LINE * 3);
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setDrawRange(0, POINTS_PER_LINE);
            const mat = new THREE.LineBasicMaterial({
                color: COLORS[lineMetas[i].family],
                linewidth: 1,
                transparent: true,
                opacity: 0.82,
                depthTest: true,
                depthWrite: true,
                blending: THREE.NormalBlending
            });
            const line = new THREE.Line(geom, mat);
            line.frustumCulled = false;
            scene.add(line);
            lineObjects.push({ geom, positions, meta: lineMetas[i] });
        }

        // --- 双曲面参数 ---
        let a = 2.0;
        let c = 1.8;
        const A0 = 2.0, C0 = 1.8;
        const AMP_A = 0.3, AMP_C = 0.25;
        const OMEGA_A = 0.33, OMEGA_C = 0.33 * Math.SQRT2;

        // --- 更新双曲面参数 ---
        function updateParams(globalTime) {
            a = A0 + AMP_A * Math.sin(OMEGA_A * globalTime);
            c = C0 + AMP_C * Math.cos(OMEGA_C * globalTime);
        }

        // --- 家庭0: 第一族直纹 (u固定, v变化) ---
        function computeLineFamily0(u, positions) {
            const vStep = 2 * V_RANGE / (POINTS_PER_LINE - 1);
            for (let j = 0; j < POINTS_PER_LINE; j++) {
                const v = -V_RANGE + j * vStep;
                const cosU = Math.cos(u);
                const sinU = Math.sin(u);
                const x = a * cosU + v * sinU;
                const y = a * sinU - v * cosU;
                const z = c * v;
                const idx = j * 3;
                positions[idx]   = x;
                positions[idx+1] = y;
                positions[idx+2] = z;
            }
        }

        // --- 家庭1: 第二族直纹 (固定v, 变化u) ---
        function computeLineFamily1(v, positions) {
            const uStep = (Math.PI * 2) / (POINTS_PER_LINE - 1);
            for (let j = 0; j < POINTS_PER_LINE; j++) {
                const u = j * uStep;
                const cosU = Math.cos(u);
                const sinU = Math.sin(u);
                // 第二族参数: x = a cos u - v sin u, y = a sin u + v cos u, z = c v
                const x = a * cosU - v * sinU;
                const y = a * sinU + v * cosU;
                const z = c * v;
                const idx = j * 3;
                positions[idx]   = x;
                positions[idx+1] = y;
                positions[idx+2] = z;
            }
        }

        // --- 家庭2: 横向椭圆 (固定v, 变化u), v = z/c ---
        function computeLineFamily2(zVal, positions) {
            const v = zVal / c; // 由z反推v
            const uStep = (Math.PI * 2) / (POINTS_PER_LINE - 1);
            for (let j = 0; j < POINTS_PER_LINE; j++) {
                const u = j * uStep;
                const cosU = Math.cos(u);
                const sinU = Math.sin(u);
                // 使用第一族公式，v固定生成椭圆
                const x = a * cosU + v * sinU;
                const y = a * sinU - v * cosU;
                const z = c * v; // 等于zVal
                const idx = j * 3;
                positions[idx]   = x;
                positions[idx+1] = y;
                positions[idx+2] = z;
            }
        }

        // --- 更新全部线条 ---
        function updateAllLines() {
            for (let i = 0; i < lineObjects.length; i++) {
                const obj = lineObjects[i];
                const meta = obj.meta;
                const positions = obj.positions;
                if (meta.family === 0) {
                    computeLineFamily0(meta.u, positions);
                } else if (meta.family === 1) {
                    computeLineFamily1(meta.v, positions);
                } else {
                    computeLineFamily2(meta.z, positions);
                }
                obj.geom.attributes.position.needsUpdate = true;
            }
        }

        // --- 动画状态 ---
        let globalTime = 0;
        let animId = null;
        let lastTimestamp = performance.now();
        let frameCount = 0;

        function animate(now) {
            animId = requestAnimationFrame(animate);
            let dt = (now - lastTimestamp) / 1000;
            if (dt <= 0) dt = 0.016;
            if (dt > 0.2) dt = 0.2;
            lastTimestamp = now;
            globalTime += dt;

            updateParams(globalTime);
            try {
                updateAllLines();
            } catch (e) { console.error(e); }

            // 相机环绕
            const camAngle = globalTime * 0.13 + 0.5;
            const camRadius = 5.0;
            const camY = 1.0 + 0.5 * Math.sin(0.27 * globalTime + 2.0);
            camera.position.set(
                camRadius * Math.sin(camAngle),
                camY,
                camRadius * Math.cos(camAngle)
            );
            camera.lookAt(0, 0, 0);

            stars.rotation.y += dt * 0.025;
            stars.rotation.x += dt * 0.012;
            renderer.render(scene, camera);
            frameCount++;
        }

        // --- 初始帧渲染 ---
        function renderFirstFrame() {
            updateParams(0);
            updateAllLines();
            camera.position.set(4.5, 0.9, 4.5);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        // --- 看门狗 ---
        let lastWatchFrame = 0;
        setInterval(() => {
            if (frameCount === lastWatchFrame && frameCount > 5) {
                console.warn('检测到停滞，重启动画...');
                if (animId) cancelAnimationFrame(animId);
                lastTimestamp = performance.now();
                animId = requestAnimationFrame(animate);
            }
            lastWatchFrame = frameCount;
        }, 2000);

        // --- 窗口调整 ---
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // --- 启动 ---
        renderFirstFrame();
        setTimeout(() => {
            lastTimestamp = performance.now();
            animId = requestAnimationFrame(animate);
        }, 80);

        console.log('双曲面直纹编织动画已启动，线条总数:', lineMetas.length);
    </script>
</body>
</html>
