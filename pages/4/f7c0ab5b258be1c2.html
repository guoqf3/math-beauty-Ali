<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学曲线之美 — 谐波花园</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --text: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            left: 0;
            right: 0;
            text-align: center;
        }

        #title-overlay {
            top: clamp(16px, 4vh, 40px);
        }

        #title-overlay h1 {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.06em;
            color: #f0e6d3;
            text-shadow: 0 0 30px rgba(200, 170, 130, 0.5), 0 0 80px rgba(180, 150, 110, 0.25);
            margin: 0;
            line-height: 1.3;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.7rem, 1.3vw, 0.9rem);
            font-weight: 300;
            letter-spacing: 0.1em;
            color: #c4b89a;
            text-shadow: 0 0 15px rgba(180, 150, 110, 0.4);
            margin-top: 4px;
            opacity: 0.8;
        }

        #formula-overlay {
            bottom: clamp(20px, 5vh, 48px);
        }

        #formula-overlay .formula-container {
            display: inline-block;
            background: rgba(20, 18, 14, 0.7);
            border: 1px solid rgba(180, 150, 110, 0.35);
            border-radius: 14px;
            padding: clamp(10px, 2vh, 18px) clamp(18px, 3vw, 32px);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: opacity 0.8s ease;
        }

        #formula-overlay .formula-line {
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            color: #d4c8aa;
            letter-spacing: 0.04em;
            line-height: 1.8;
            font-style: italic;
            white-space: nowrap;
        }

        #formula-overlay .formula-line .fn {
            color: #e8c97a;
            font-style: normal;
            font-weight: bold;
        }
        #formula-overlay .formula-line .paren {
            color: #c4a870;
            font-style: normal;
        }
        #formula-overlay .formula-line .op {
            color: #b8956e;
            font-style: normal;
        }

        @media (max-width: 600px) {
            #formula-overlay .formula-line {
                font-size: 0.7rem;
                letter-spacing: 0.02em;
            }
            #formula-overlay .formula-container {
                padding: 10px 14px;
                border-radius: 10px;
            }
            #title-overlay h1 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="overlay" id="title-overlay">
        <h1>数学曲线之美</h1>
        <div class="subtitle">谐波花园 · Harmonic Garden</div>
    </div>

    <div class="overlay" id="formula-overlay">
        <div class="formula-container">
            <div class="formula-line">
                <span class="fn">x</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="fn">cos</span><span class="paren">(</span>3t<span class="paren">)</span> <span class="op">·</span> <span class="paren">(</span>1.5 <span class="op">+</span> <span class="fn">cos</span><span class="paren">(</span>5t<span class="paren">)</span><span class="paren">)</span>
            </div>
            <div class="formula-line">
                <span class="fn">y</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="fn">sin</span><span class="paren">(</span>2t<span class="paren">)</span> <span class="op">·</span> <span class="paren">(</span>1.5 <span class="op">+</span> <span class="fn">sin</span><span class="paren">(</span>4t<span class="paren">)</span><span class="paren">)</span>
            </div>
            <div class="formula-line">
                <span class="fn">z</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="fn">sin</span><span class="paren">(</span>7t<span class="paren">)</span>
                &nbsp;&nbsp;<span style="color:#b8956e;font-style:normal;">t ∈ [0, 2π]</span>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============ DOM 元素 ============
        const container = document.getElementById('canvas-container');
        const formulaContainer = document.querySelector('#formula-overlay .formula-container');

        // ============ 场景初始化 ============
        const scene = new THREE.Scene();

        // 相机
        const camera = new THREE.PerspectiveCamera(
            52,
            container.clientWidth / container.clientHeight,
            0.5,
            40
        );
        camera.position.set(5.5, 2.8, 8.5);
        camera.lookAt(0, 0, 0);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setClearColor(0x0a0a0f, 1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ============ 光照（线条不需要，但保留以备扩展） ============
        scene.fog = new THREE.FogExp2(0x0a0a0f, 0.00015);

        // ============ 背景星场 ============
        const starsCount = 280;
        const starsGeometry = new THREE.BufferGeometry();
        const starsPositions = new Float32Array(starsCount * 3);
        const starsSizes = new Float32Array(starsCount);

        for (let i = 0; i < starsCount; i++) {
            // 在大球壳内随机分布
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const radius = 14 + Math.random() * 10;
            starsPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starsPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starsPositions[i * 3 + 2] = radius * Math.cos(phi);
            starsSizes[i] = Math.random() * 1.8 + 0.3;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        starsGeometry.setAttribute('size', new THREE.BufferAttribute(starsSizes, 1));

        const starsMaterial = new THREE.PointsMaterial({
            color: 0xc8c0b8,
            size: 0.025,
            transparent: true,
            opacity: 0.55,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });

        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // ============ 曲线参数 ============
        const TOTAL_VERTICES = 3200;
        const NUM_CURVES = 5;
        const TOTAL_DURATION = 31.5; // 15 + 1.5 + 15
        const GROW_DURATION = 15.0;
        const PAUSE_DURATION = 1.5;
        const SHRINK_DURATION = 15.0;

        // 基础色相（五重对称，均匀分布）
        const baseHues = [0.08, 0.20, 0.36, 0.55, 0.72]; // 金、琥珀、绿松、蓝紫、玫瑰

        // ============ 生成曲线顶点 ============
        function generateCurveVertices(offsetAngle = 0) {
            const positions = new Float32Array(TOTAL_VERTICES * 3);
            const colors = new Float32Array(TOTAL_VERTICES * 3);

            for (let i = 0; i < TOTAL_VERTICES; i++) {
                const t = (i / (TOTAL_VERTICES - 1)) * Math.PI * 2;

                // 核心3D谐波参数方程
                const cos3t = Math.cos(3 * t);
                const sin2t = Math.sin(2 * t);
                const cos5t = Math.cos(5 * t);
                const sin4t = Math.sin(4 * t);
                const sin7t = Math.sin(7 * t);

                const x = cos3t * (1.5 + cos5t);
                const y = sin2t * (1.5 + sin4t);
                const z = sin7t;

                // 应用绕Y轴的旋转（用于不同曲线副本的初始偏移）
                const cosA = Math.cos(offsetAngle);
                const sinA = Math.sin(offsetAngle);
                const rx = x * cosA - z * sinA;
                const rz = x * sinA + z * cosA;
                const ry = y;

                positions[i * 3] = rx;
                positions[i * 3 + 1] = ry;
                positions[i * 3 + 2] = rz;
            }

            return positions;
        }

        function generateCurveColors(baseHue) {
            const colors = new Float32Array(TOTAL_VERTICES * 3);

            for (let i = 0; i < TOTAL_VERTICES; i++) {
                const t = (i / (TOTAL_VERTICES - 1)) * Math.PI * 2;
                const progress = i / (TOTAL_VERTICES - 1);

                // 色相随t微妙变化（±0.03）
                const hueShift = Math.sin(t * 3.7) * 0.025 + Math.cos(t * 7.1) * 0.015;
                const hue = (baseHue + hueShift + 1) % 1;

                // 饱和度在0.65-0.9之间变化
                const saturation = 0.7 + Math.sin(t * 2.3 + baseHue * 10) * 0.15 + 0.08;

                // 亮度在0.45-0.7之间变化
                const lightness = 0.52 + Math.sin(t * 5.1 + baseHue * 7) * 0.12 + Math.cos(t * 8.3) * 0.06;

                const color = new THREE.Color();
                color.setHSL(hue, saturation, lightness);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            return colors;
        }

        // ============ 创建曲线组 ============
        const allCurveLines = [];
        const allCurveGeometries = [];
        const curvesParentGroup = new THREE.Group();
        scene.add(curvesParentGroup);

        for (let k = 0; k < NUM_CURVES; k++) {
            const offsetAngle = (k / NUM_CURVES) * Math.PI * 2;
            const baseHue = baseHues[k];

            // 生成顶点位置
            const positions = generateCurveVertices(offsetAngle);
            // 生成顶点颜色
            const vertexColors = generateCurveColors(baseHue);

            // 创建geometry
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(vertexColors, 3));
            geometry.setDrawRange(0, 0);

            // 创建material
            const material = new THREE.LineBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: 0.92,
                blending: THREE.NormalBlending,
                depthTest: true,
                depthWrite: true,
                linewidth: 1,
            });

            // 创建Line
            const line = new THREE.Line(geometry, material);
            line.renderOrder = k;
            line.material.depthFunc = THREE.LessEqualDepth;

            curvesParentGroup.add(line);
            allCurveLines.push(line);
            allCurveGeometries.push(geometry);
        }

        // ============ 光晕环（可选装饰） ============
        // 在曲线组中心添加微弱的参考光环
        const ringGeometry = new THREE.TorusGeometry(1.65, 0.012, 32, 180);
        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0x3a3530,
            transparent: true,
            opacity: 0.35,
            depthWrite: false,
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = Math.PI / 2;
        ring.renderOrder = 999;
        curvesParentGroup.add(ring);

        // 第二个更小的环
        const ring2Geometry = new THREE.TorusGeometry(1.15, 0.01, 24, 140);
        const ring2Material = new THREE.MeshBasicMaterial({
            color: 0x4a4238,
            transparent: true,
            opacity: 0.28,
            depthWrite: false,
        });
        const ring2 = new THREE.Mesh(ring2Geometry, ring2Material);
        ring2.rotation.x = Math.PI / 3;
        ring2.rotation.y = Math.PI / 5;
        ring2.renderOrder = 998;
        curvesParentGroup.add(ring2);

        // ============ 动画状态管理 ============
        const clock = new THREE.Clock();
        let animationStartTime = performance.now() / 1000;
        let isFirstFrame = true;
        let lastDrawCount = -1;
        let currentPhase = 'grow'; // 'grow' | 'pause' | 'shrink'

        // ============ 缓动函数 ============
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function easeOutExpo(t) {
            return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
        }

        function easeInExpo(t) {
            return t <= 0 ? 0 : Math.pow(2, 10 * t - 10);
        }

        // ============ 渲染循环 ============
        function animate(timestamp) {
            requestAnimationFrame(animate);

            // 使用clock确保稳定的时间增量
            const elapsedTotal = clock.getElapsedTime();

            // 在31.5秒周期内的位置
            const cycleTime = elapsedTotal % TOTAL_DURATION;

            let progress; // 0到1，表示曲线的显示比例
            let phaseLabel;

            if (cycleTime < GROW_DURATION) {
                // 阶段1：从无到有 (0-15秒)
                const rawProgress = cycleTime / GROW_DURATION;
                progress = easeInOutCubic(rawProgress);
                phaseLabel = 'grow';
            } else if (cycleTime < GROW_DURATION + PAUSE_DURATION) {
                // 阶段2：停顿 (15-16.5秒)
                progress = 1.0;
                phaseLabel = 'pause';
            } else {
                // 阶段3：从有到无 (16.5-31.5秒)
                const shrinkElapsed = cycleTime - (GROW_DURATION + PAUSE_DURATION);
                const rawProgress = 1.0 - shrinkElapsed / SHRINK_DURATION;
                progress = easeInOutCubic(Math.max(0, Math.min(1, rawProgress)));
                phaseLabel = 'shrink';
            }

            // 确保progress在有效范围内
            progress = Math.max(0, Math.min(1, progress));
            currentPhase = phaseLabel;

            // 计算drawRange的count
            const drawCount = Math.max(0, Math.floor(progress * TOTAL_VERTICES));

            // 只在drawCount变化时更新（减少不必要的调用）
            if (drawCount !== lastDrawCount || isFirstFrame) {
                const effectiveCount = Math.max(0, drawCount);
                for (let k = 0; k < NUM_CURVES; k++) {
                    allCurveGeometries[k].setDrawRange(0, effectiveCount);
                }
                lastDrawCount = drawCount;
            }

            // 曲线组旋转（缓慢绕Y轴旋转）
            const rotationSpeed = 0.28; // 弧度/秒
            curvesParentGroup.rotation.y += rotationSpeed * 0.016; // 假设约60fps，使用固定小步长
            // 使用更稳定的旋转方式
            curvesParentGroup.rotation.y = elapsedTotal * rotationSpeed;
            curvesParentGroup.rotation.x = Math.sin(elapsedTotal * 0.18) * 0.2;
            curvesParentGroup.rotation.z = Math.cos(elapsedTotal * 0.22) * 0.12;

            // 星场微动
            stars.rotation.y += 0.0006;
            stars.rotation.x += 0.0003;

            // 光环微妙的呼吸效果
            const breathe = 1 + Math.sin(elapsedTotal * 0.7) * 0.04;
            ring.scale.setScalar(breathe);
            ring.material.opacity = 0.3 + Math.sin(elapsedTotal * 0.55) * 0.08;
            ring2.scale.setScalar(1 + Math.cos(elapsedTotal * 0.65) * 0.05);
            ring2.material.opacity = 0.24 + Math.cos(elapsedTotal * 0.6) * 0.07;

            // 公式面板透明度随阶段变化
            if (formulaContainer) {
                let panelOpacity;
                if (currentPhase === 'pause') {
                    panelOpacity = 0.95;
                } else if (currentPhase === 'grow' && progress > 0.6) {
                    panelOpacity = 0.7 + (progress - 0.6) * 0.6;
                } else if (currentPhase === 'shrink' && progress > 0.5) {
                    panelOpacity = 0.7 + (progress - 0.5) * 0.5;
                } else if (currentPhase === 'grow') {
                    panelOpacity = 0.4 + progress * 0.5;
                } else {
                    panelOpacity = 0.4 + progress * 0.5;
                }
                formulaContainer.style.opacity = Math.max(0.35, Math.min(1, panelOpacity));
            }

            // 渲染
            renderer.render(scene, camera);

            if (isFirstFrame) {
                isFirstFrame = false;
                // 强制第一帧后立即更新drawRange
                console.log('动画已启动 | 初始drawCount:', drawCount, '| 总顶点:', TOTAL_VERTICES);
            }
        }

        // ============ 响应式处理 ============
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(onResize, 150);
        });

        // ============ 启动动画 ============
        // 确保初始状态正确
        for (let k = 0; k < NUM_CURVES; k++) {
            allCurveGeometries[k].setDrawRange(0, 0);
        }
        lastDrawCount = 0;

        // 初始化时钟
        clock.start();
        animationStartTime = performance.now() / 1000;

        // 启动渲染循环
        requestAnimationFrame(animate);

        // ============ 控制台信息 ============
        console.log('%c🌿 谐波花园 · Harmonic Garden %c已就绪',
            'font-size:1.1em;color:#e8c97a;', 'color:#c4b89a;');
        console.log('%c五重对称3D谐波曲线 | 从无到有15秒 | 停顿1.5秒 | 从有到无15秒 | 循环',
            'color:#b8956e;font-size:0.9em;');
        console.log('%c曲线总数: ' + NUM_CURVES + ' | 每条顶点: ' + TOTAL_VERTICES +
            ' | 总顶点: ' + (NUM_CURVES * TOTAL_VERTICES) + ' | 完美闭合 ✓',
            'color:#9a8a6e;font-size:0.85em;');
    </script>
</body>
</html>
