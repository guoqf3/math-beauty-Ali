<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopf链环织 · 链接之美</title>
    <style>
        :root { --bg: #050513; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'KaiTi', '楷体', '华文楷体', '宋体', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }
        canvas { display: block; }
        .overlay { position: fixed; z-index: 10; pointer-events: none; text-align: center; left: 50%; transform: translateX(-50%); }
        #title-overlay { top: clamp(12px, 3.5vh, 36px); }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.0vw, 1.45rem); font-weight: 400; letter-spacing: 0.10em;
            color: rgba(235, 228, 220, 0.92);
            text-shadow: 0 0 24px rgba(190, 165, 140, 0.5), 0 0 6px rgba(170, 148, 125, 0.35);
            line-height: 1.4;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.60rem, 1.10vw, 0.76rem); font-weight: 300; letter-spacing: 0.06em;
            color: rgba(200, 192, 180, 0.7); margin-top: 0.2em;
            text-shadow: 0 0 13px rgba(155, 140, 120, 0.3);
        }
        #formula-overlay { bottom: clamp(14px, 3.5vh, 40px); }
        #formula-overlay .formula {
            font-size: clamp(0.42rem, 0.75vw, 0.60rem); font-style: italic; letter-spacing: 0.03em;
            color: rgba(222, 214, 204, 0.84);
            text-shadow: 0 0 20px rgba(155, 140, 125, 0.42), 0 0 5px rgba(165, 148, 130, 0.28);
            line-height: 1.6; background: rgba(10, 9, 16, 0.46); padding: 0.30em 1.0em;
            border-radius: 2em; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(145, 125, 105, 0.20);
        }
        @media (max-width: 600px) {
            #formula-overlay .formula { padding: 0.16em 0.40em; letter-spacing: 0.02em; font-size: 0.34rem; }
            #title-overlay .title { letter-spacing: 0.06em; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="overlay" id="title-overlay">
        <div class="title">Hopf链环织 · 链接之美</div>
        <div class="subtitle">Braided Hopf Links — A Woven Sphere</div>
    </div>
    <div class="overlay" id="formula-overlay">
        <div class="formula">
            L = { C<sub>i</sub>(t) = P<sub>i</sub> + R·(cos t·u<sub>i</sub> + sin t·v<sub>i</sub>) | i=1,2 }
            &emsp;|&emsp; lk(C<sub>1</sub>, C<sub>2</sub>) = 1
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 时间配置 ====================
        const DRAW_DURATION = 15.0;
        const HOLD_DURATION = 1.5;
        const ERASE_DURATION = 15.0;
        const CYCLE_DURATION = DRAW_DURATION + HOLD_DURATION + ERASE_DURATION;
        const DRAW_END = DRAW_DURATION;
        const ERASE_START = DRAW_END + HOLD_DURATION;
        const FADE_IN_DURATION = 2.5;
        const FADE_OUT_START = CYCLE_DURATION - 3.0;

        const CURVE_POINTS = 580;
        const TOTAL_VERTICES = CURVE_POINTS + 1;
        const LINK_RADIUS = 0.95;

        const COLOR_WARM_GOLD = new THREE.Color('#e8b86d');
        const COLOR_ROSE = new THREE.Color('#e8a0b8');
        const COLOR_CYAN = new THREE.Color('#7ec8e3');

        // 生成一个Hopf链环的两个圆（标准位置：中心在原点，相互垂直链接）
        function createHopfLink() {
            const circles = [];
            // 圆1：位于平面 xy，法向 z
            const circle1Positions = new Float32Array(TOTAL_VERTICES * 3);
            for (let i = 0; i <= CURVE_POINTS; i++) {
                const t = (i / CURVE_POINTS) * Math.PI * 2;
                circle1Positions[i * 3] = LINK_RADIUS * Math.cos(t);
                circle1Positions[i * 3 + 1] = LINK_RADIUS * Math.sin(t);
                circle1Positions[i * 3 + 2] = 0;
            }
            circles.push({ positions: circle1Positions, totalVertices: TOTAL_VERTICES });

            // 圆2：位于平面 xz，法向 y，整体偏移使两圆链接
            const circle2Positions = new Float32Array(TOTAL_VERTICES * 3);
            for (let i = 0; i <= CURVE_POINTS; i++) {
                const t = (i / CURVE_POINTS) * Math.PI * 2;
                circle2Positions[i * 3] = LINK_RADIUS * Math.cos(t) + LINK_RADIUS;
                circle2Positions[i * 3 + 1] = 0;
                circle2Positions[i * 3 + 2] = LINK_RADIUS * Math.sin(t);
            }
            circles.push({ positions: circle2Positions, totalVertices: TOTAL_VERTICES });
            return circles;
        }

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050513, 0.00006);

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.4, 18);
        camera.position.set(0.6, 0.7, 4.0);
        camera.lookAt(0, 0.0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.18;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ==================== 星空背景粒子 ====================
        const starsGroup = new THREE.Group();
        mainGroup.add(starsGroup);
        const starCount = 220;
        const starPosArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phiA = Math.acos(2 * Math.random() - 1);
            const r = 3.8 + Math.random() * 5.0;
            starPosArr[i * 3] = Math.sin(phiA) * Math.cos(theta) * r;
            starPosArr[i * 3 + 1] = Math.sin(phiA) * Math.sin(theta) * r;
            starPosArr[i * 3 + 2] = Math.cos(phiA) * r;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xb6afc6, size: 0.009, transparent: true, opacity: 0.26, depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        starsGroup.add(new THREE.Points(starGeom, starMat));

        // ==================== 漂浮光点 ====================
        const glowGroup = new THREE.Group();
        mainGroup.add(glowGroup);
        const glowCount = 85;
        const glowArr = new Float32Array(glowCount * 3);
        const phiGold = Math.PI * (3 - Math.sqrt(5));
        const SPHERE_R = 1.85;
        for (let i = 0; i < glowCount; i++) {
            const y = 1 - (i / (glowCount - 1)) * 2;
            const rAtY = Math.sqrt(1 - y * y);
            const theta = phiGold * i;
            glowArr[i * 3] = Math.cos(theta) * rAtY * SPHERE_R;
            glowArr[i * 3 + 1] = y * SPHERE_R;
            glowArr[i * 3 + 2] = Math.sin(theta) * rAtY * SPHERE_R;
        }
        const glowGeom = new THREE.BufferGeometry();
        glowGeom.setAttribute('position', new THREE.BufferAttribute(glowArr, 3));
        const glowMat = new THREE.PointsMaterial({
            color: 0xf0e4cc, size: 0.019, transparent: true, opacity: 0.45, depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        glowGroup.add(new THREE.Points(glowGeom, glowMat));

        // ==================== 参考球体线框 ====================
        const sphereWireGroup = new THREE.Group();
        mainGroup.add(sphereWireGroup);
        const sphereWireMats = [];
        function createLatLine(phiVal) {
            const pts = [];
            const r = Math.sin(phiVal) * SPHERE_R;
            const y = Math.cos(phiVal) * SPHERE_R;
            for (let i = 0; i <= 240; i++) {
                const th = (i / 240) * Math.PI * 2;
                pts.push(new THREE.Vector3(r * Math.cos(th), y, r * Math.sin(th)));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({ color: 0x3a3650, transparent: true, opacity: 0.12, depthWrite: false });
            sphereWireMats.push(m);
            return new THREE.Line(g, m);
        }
        function createLongLine(theta) {
            const pts = [];
            for (let i = 0; i <= 200; i++) {
                const phiVal = (i / 200) * Math.PI;
                pts.push(new THREE.Vector3(
                    Math.sin(phiVal) * Math.cos(theta) * SPHERE_R,
                    Math.cos(phiVal) * SPHERE_R,
                    Math.sin(phiVal) * Math.sin(theta) * SPHERE_R));
            }
            const g = new THREE.BufferGeometry().setFromPoints(pts);
            const m = new THREE.LineBasicMaterial({ color: 0x3a3650, transparent: true, opacity: 0.12, depthWrite: false });
            sphereWireMats.push(m);
            return new THREE.Line(g, m);
        }
        for (let i = 1; i <= 9; i++) sphereWireGroup.add(createLatLine((i / 10) * Math.PI));
        for (let i = 0; i < 18; i++) sphereWireGroup.add(createLongLine((i / 18) * Math.PI * 2));
        {
            const eqPts = [];
            for (let i = 0; i <= 280; i++) {
                const th = (i / 280) * Math.PI * 2;
                eqPts.push(new THREE.Vector3(Math.cos(th) * SPHERE_R, 0, Math.sin(th) * SPHERE_R));
            }
            const eqG = new THREE.BufferGeometry().setFromPoints(eqPts);
            const eqM = new THREE.LineBasicMaterial({ color: 0x58527a, transparent: true, opacity: 0.17, depthWrite: false });
            sphereWireMats.push(eqM);
            sphereWireGroup.add(new THREE.Line(eqG, eqM));
        }

        // ==================== Hopf链环织生成 ====================
        const curvesGroup = new THREE.Group();
        mainGroup.add(curvesGroup);
        const allCurveData = [];

        // 生成9个Hopf链环，放置在斐波那契球面上，赋予随机方向
        const numLinks = 9;
        const directions = [];
        const phiGolden2 = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < numLinks; i++) {
            const yNorm = 1 - (i / (numLinks - 0.999)) * 2;
            const rAtY = Math.sqrt(1 - yNorm * yNorm);
            const theta = phiGolden2 * i;
            directions.push(new THREE.Vector3(Math.cos(theta) * rAtY, yNorm, Math.sin(theta) * rAtY).normalize());
        }

        for (let s = 0; s < numLinks; s++) {
            const baseLink = createHopfLink();
            const zAxis = new THREE.Vector3(0, 0, 1);
            const quat = new THREE.Quaternion().setFromUnitVectors(zAxis, directions[s]);
            const invQuat = quat.clone().invert();

            // 为每个链环分配两种颜色（对1：金+玫瑰粉，对2：金+青蓝，交替）
            const colorPair = s % 2 === 0 
                ? [COLOR_WARM_GOLD, COLOR_ROSE] 
                : [COLOR_WARM_GOLD, COLOR_CYAN];

            for (let i = 0; i < 2; i++) {
                const { positions, totalVertices } = baseLink[i];
                const rotatedPositions = new Float32Array(positions.length);
                const vec = new THREE.Vector3();
                for (let j = 0; j < positions.length; j += 3) {
                    vec.set(positions[j], positions[j + 1], positions[j + 2]);
                    vec.applyQuaternion(quat);
                    rotatedPositions[j] = vec.x;
                    rotatedPositions[j + 1] = vec.y;
                    rotatedPositions[j + 2] = vec.z;
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(rotatedPositions, 3));
                geometry.setDrawRange(0, 0);

                const material = new THREE.LineBasicMaterial({
                    color: colorPair[i], transparent: true, opacity: 0.82, depthWrite: false,
                });
                const line = new THREE.Line(geometry, material);
                curvesGroup.add(line);
                allCurveData.push({ geometry, totalVertices });
            }
        }

        const curveCount = allCurveData.length; // 应为18

        // ==================== 动画循环 ====================
        let animationStartTime = performance.now() / 1000;

        function getCycleTime() {
            return (performance.now() / 1000 - animationStartTime) % CYCLE_DURATION;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const cycleTime = getCycleTime();
            const dt = Math.min(0.15, 1 / 60); // 平滑的帧步长

            mainGroup.rotation.y += 0.25 * dt;
            mainGroup.rotation.x += 0.06 * dt;
            mainGroup.rotation.z += 0.014 * Math.sin(cycleTime * 0.56) * dt;

            const sway = 0.09 * Math.sin(cycleTime * (Math.PI * 2 / 35));
            camera.position.y = 0.7 + sway;
            camera.lookAt(0, 0.0, 0);

            let fraction;
            if (cycleTime < DRAW_END) {
                fraction = easeInOutCubic(cycleTime / DRAW_DURATION);
            } else if (cycleTime < ERASE_START) {
                fraction = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                const elapsed = cycleTime - ERASE_START;
                fraction = 1.0 - easeInOutCubic(elapsed / ERASE_DURATION);
                fraction = Math.max(0, fraction);
            } else {
                fraction = 0;
            }

            for (const data of allCurveData) {
                const count = Math.round(fraction * data.totalVertices);
                data.geometry.setDrawRange(0, Math.max(0, Math.min(data.totalVertices, count)));
            }

            let bgOp;
            if (cycleTime < FADE_IN_DURATION) {
                bgOp = cycleTime / FADE_IN_DURATION;
            } else if (cycleTime < FADE_OUT_START) {
                bgOp = 1.0;
            } else if (cycleTime < CYCLE_DURATION) {
                bgOp = 1.0 - (cycleTime - FADE_OUT_START) / (CYCLE_DURATION - FADE_OUT_START);
            } else {
                bgOp = 0;
            }
            bgOp = Math.max(0, Math.min(1, bgOp));

            starMat.opacity = 0.26 * bgOp;
            glowMat.opacity = 0.45 * bgOp;
            for (const mat of sphereWireMats) {
                mat.opacity = (mat.opacity ?? 0.12) * bgOp;
            }

            glowGroup.position.y = Math.sin(cycleTime * 1.05) * 0.04;
            starsGroup.rotation.y += dt * 0.015;
            starsGroup.rotation.x += dt * 0.010;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                animationStartTime = performance.now() / 1000;
                for (const data of allCurveData) {
                    data.geometry.setDrawRange(0, 0);
                }
                mainGroup.rotation.set(0, 0, 0);
            }
        });

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        console.log('🔗 Hopf链环织动画已启动');
        console.log(`   - ${curveCount} 条闭合曲线 (${numLinks} 组链环 × 2 色)`);
        console.log('   - 链接数：lk(C1, C2) = 1');
        console.log(`   - 周期：${CYCLE_DURATION.toFixed(1)}秒`);
        console.log('   - 按 R 键可重置');
    </script>
</body>
</html>
