<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rössler吸引子 · 混沌之舞</title>
    <style>
        :root {
            --bg: #02010d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: clamp(16px, 3.5vh, 42px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #title-overlay h1 {
            color: #e1d0b5;
            font-size: clamp(1.2rem, 2.3vw, 1.9rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 28px rgba(215, 180, 130, 0.55), 0 0 75px rgba(190, 150, 100, 0.25);
            margin: 0;
        }
        #title-overlay .subtitle {
            color: #bda78c;
            font-size: clamp(0.68rem, 1.15vw, 0.92rem);
            letter-spacing: 0.06em;
            margin-top: 0.28em;
            text-shadow: 0 0 14px rgba(180, 140, 100, 0.4);
        }

        #formula-overlay {
            position: fixed;
            bottom: clamp(24px, 4.5vh, 54px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(15, 11, 20, 0.72);
            border: 1px solid rgba(170, 145, 115, 0.28);
            border-radius: 12px;
            padding: clamp(10px, 1.4vh, 16px) clamp(16px, 3vw, 28px);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        #formula-overlay .formula-main {
            color: #f2dec5;
            font-size: clamp(0.72rem, 1.22vw, 1.05rem);
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a6947c;
            font-size: clamp(0.55rem, 0.8vw, 0.72rem);
            letter-spacing: 0.03em;
            margin-top: 0.22em;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.05em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>Rössler吸引子</h1>
        <div class="subtitle">Chaotic Attractor · 确定性混沌之美</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                dx/dt = −y − z<br>
                dy/dt = x + a y<br>
                dz/dt = b + z (x − c)
            </div>
            <div class="formula-detail">
                a = 0.2 b = 0.2 c = 5.7 | (x₀,y₀,z₀) = (0.1, 1.0, 0.1)
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02010d');
        scene.fog = new THREE.Fog('#02010d', 7, 22);

        const camera = new THREE.PerspectiveCamera(
            46,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            28
        );
        camera.position.set(0, 0.5, 8.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight('#1e1e3a', 0.4));

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const totalPoints = 2500;   // 轨迹点数
        let trajectoryLine = null;  // 单条曲线

        // Rössler 系统参数
        const a = 0.2;
        const b = 0.2;
        const c = 5.7;

        // 初始条件
        let x0 = 0.1, y0 = 1.0, z0 = 0.1;

        // 积分步长与总时长
        const dt = 0.04;
        const totalTime = totalPoints * dt; // ≈100

        // 使用4阶Runge-Kutta积分生成轨迹
        function generateRosslerTrajectory() {
            const vertices = new Float32Array(totalPoints * 3);
            let x = x0, y = y0, z = z0;

            // 先进行少量预积分以消除瞬态（可选）
            const preSteps = 500;
            for (let i = 0; i < preSteps; i++) {
                const [dx1, dy1, dz1] = rosslerDeriv(x, y, z, a, b, c);
                const k1x = dt * dx1; const k1y = dt * dy1; const k1z = dt * dz1;
                const [dx2, dy2, dz2] = rosslerDeriv(x + k1x/2, y + k1y/2, z + k1z/2, a, b, c);
                const k2x = dt * dx2; const k2y = dt * dy2; const k2z = dt * dz2;
                const [dx3, dy3, dz3] = rosslerDeriv(x + k2x/2, y + k2y/2, z + k2z/2, a, b, c);
                const k3x = dt * dx3; const k3y = dt * dy3; const k3z = dt * dz3;
                const [dx4, dy4, dz4] = rosslerDeriv(x + k3x, y + k3y, z + k3z, a, b, c);
                const k4x = dt * dx4; const k4y = dt * dy4; const k4z = dt * dz4;
                x += (k1x + 2*k2x + 2*k3x + k4x) / 6;
                y += (k1y + 2*k2y + 2*k3y + k4y) / 6;
                z += (k1z + 2*k2z + 2*k3z + k4z) / 6;
            }

            // 重置到用于绘图的初始值
            x = x0; y = y0; z = z0;
            // 也可以从预积分结束的状态开始，更平滑
            // 此处选择从初始点开始，但为了美观，使用预积分后的状态作为起点
            // 重新预积分并存储状态
            x = 0.1; y = 1.0; z = 0.1;
            for (let i = 0; i < preSteps; i++) {
                const [dx1, dy1, dz1] = rosslerDeriv(x, y, z, a, b, c);
                const k1x = dt * dx1; const k1y = dt * dy1; const k1z = dt * dz1;
                const [dx2, dy2, dz2] = rosslerDeriv(x + k1x/2, y + k1y/2, z + k1z/2, a, b, c);
                const k2x = dt * dx2; const k2y = dt * dy2; const k2z = dt * dz2;
                const [dx3, dy3, dz3] = rosslerDeriv(x + k2x/2, y + k2y/2, z + k2z/2, a, b, c);
                const k3x = dt * dx3; const k3y = dt * dy3; const k3z = dt * dz3;
                const [dx4, dy4, dz4] = rosslerDeriv(x + k3x, y + k3y, z + k3z, a, b, c);
                const k4x = dt * dx4; const k4y = dt * dy4; const k4z = dt * dz4;
                x += (k1x + 2*k2x + 2*k3x + k4x) / 6;
                y += (k1y + 2*k2y + 2*k3y + k4y) / 6;
                z += (k1z + 2*k2z + 2*k3z + k4z) / 6;
            }

            // 记录轨迹
            for (let i = 0; i < totalPoints; i++) {
                // 存储当前点
                vertices[i * 3] = x;
                vertices[i * 3 + 1] = y;
                vertices[i * 3 + 2] = z;

                // 积分一步
                const [dx1, dy1, dz1] = rosslerDeriv(x, y, z, a, b, c);
                const k1x = dt * dx1; const k1y = dt * dy1; const k1z = dt * dz1;
                const [dx2, dy2, dz2] = rosslerDeriv(x + k1x/2, y + k1y/2, z + k1z/2, a, b, c);
                const k2x = dt * dx2; const k2y = dt * dy2; const k2z = dt * dz2;
                const [dx3, dy3, dz3] = rosslerDeriv(x + k2x/2, y + k2y/2, z + k2z/2, a, b, c);
                const k3x = dt * dx3; const k3y = dt * dy3; const k3z = dt * dz3;
                const [dx4, dy4, dz4] = rosslerDeriv(x + k3x, y + k3y, z + k3z, a, b, c);
                const k4x = dt * dx4; const k4y = dt * dy4; const k4z = dt * dz4;
                x += (k1x + 2*k2x + 2*k3x + k4x) / 6;
                y += (k1y + 2*k2y + 2*k3y + k4y) / 6;
                z += (k1z + 2*k2z + 2*k3z + k4z) / 6;
            }
            return vertices;
        }

        function rosslerDeriv(x, y, z, a, b, c) {
            return [
                -y - z,
                x + a * y,
                b + z * (x - c)
            ];
        }

        // 计算轨迹的包围盒，用于自动缩放
        function computeBounds(vertices) {
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;
            for (let i = 0; i < vertices.length; i += 3) {
                const vx = vertices[i];
                const vy = vertices[i + 1];
                const vz = vertices[i + 2];
                if (vx < minX) minX = vx;
                if (vx > maxX) maxX = vx;
                if (vy < minY) minY = vy;
                if (vy > maxY) maxY = vy;
                if (vz < minZ) minZ = vz;
                if (vz > maxZ) maxZ = vz;
            }
            return { minX, maxX, minY, maxY, minZ, maxZ };
        }

        // 生成轨迹并应用自适应缩放
        const rawVertices = generateRosslerTrajectory();
        const bounds = computeBounds(rawVertices);
        const centerX = (bounds.minX + bounds.maxX) / 2;
        const centerY = (bounds.minY + bounds.maxY) / 2;
        const centerZ = (bounds.minZ + bounds.maxZ) / 2;
        const rangeX = bounds.maxX - bounds.minX;
        const rangeY = bounds.maxY - bounds.maxY;
        const rangeZ = bounds.maxZ - bounds.minZ;
        const maxRange = Math.max(rangeX, rangeY, rangeZ, 1);
        const targetScale = 4.5 / maxRange; // 使最大范围映射到约4.5单位

        // 将顶点居中并缩放
        const vertices = new Float32Array(totalPoints * 3);
        for (let i = 0; i < totalPoints; i++) {
            vertices[i * 3] = (rawVertices[i * 3] - centerX) * targetScale;
            vertices[i * 3 + 1] = (rawVertices[i * 3 + 1] - centerY) * targetScale;
            vertices[i * 3 + 2] = (rawVertices[i * 3 + 2] - centerZ) * targetScale;
        }

        // 创建线条几何体
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        geometry.setDrawRange(0, 0); // 初始完全不可见

        const material = new THREE.LineBasicMaterial({
            color: new THREE.Color().setHSL(0.1, 0.92, 0.65),
            transparent: true,
            opacity: 0.85,
            linewidth: 1,
            blending: THREE.AdditiveBlending,
            depthWrite: true,
            depthTest: true,
        });

        trajectoryLine = new THREE.Line(geometry, material);
        trajectoryLine.visible = false;
        trajectoryLine.frustumCulled = false;
        mainGroup.add(trajectoryLine);

        console.log('✅ Rössler吸引子轨迹已生成，采样点数:', totalPoints);

        // ==================== 动画状态机 ====================
        const APPEAR_TIME = 5.0;
        const PAUSE_TIME = 1.5;
        const DISAPPEAR_TIME = 5.0;
        const CYCLE_TOTAL = APPEAR_TIME + PAUSE_TIME + DISAPPEAR_TIME;

        let animationStartTime = null;
        let firstFrameDone = false;

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInCubic(t) { return t * t * t; }

        function getProgress(elapsedSeconds) {
            const cycle = elapsedSeconds % CYCLE_TOTAL;
            if (cycle < APPEAR_TIME) {
                const t = cycle / APPEAR_TIME;
                return { progress: easeOutCubic(t), phase: 'appear' };
            } else if (cycle < APPEAR_TIME + PAUSE_TIME) {
                return { progress: 1.0, phase: 'pause' };
            } else {
                const t = (cycle - APPEAR_TIME - PAUSE_TIME) / DISAPPEAR_TIME;
                return { progress: 1.0 - easeInCubic(t), phase: 'disappear' };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            if (animationStartTime === null) {
                animationStartTime = timestamp;
                if (trajectoryLine) {
                    trajectoryLine.visible = false;
                    trajectoryLine.geometry.setDrawRange(0, 0);
                }
                renderer.render(scene, camera);
                firstFrameDone = true;
                return;
            }

            const elapsed = (timestamp - animationStartTime) / 1000;
            const { progress } = getProgress(elapsed);
            const drawCount = Math.floor(progress * totalPoints);
            const shouldBeVisible = drawCount >= 2;

            if (trajectoryLine && trajectoryLine.geometry) {
                const lineDraw = Math.min(drawCount, totalPoints);
                if (shouldBeVisible && lineDraw >= 2) {
                    trajectoryLine.visible = true;
                    trajectoryLine.geometry.setDrawRange(0, lineDraw);
                } else {
                    trajectoryLine.visible = false;
                    trajectoryLine.geometry.setDrawRange(0, 0);
                }
            }

            // 整体缓慢旋转，展现混沌结构
            const rotY = elapsed * 0.06;
            const rotX = Math.sin(elapsed * 0.12) * 0.04;
            const rotZ = Math.cos(elapsed * 0.16) * 0.03;
            mainGroup.rotation.set(rotX, rotY, rotZ);

            camera.position.x = Math.sin(elapsed * 0.11) * 0.18;
            camera.position.y = 0.5 + Math.cos(elapsed * 0.15) * 0.15;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (h <= 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 Rössler吸引子动画启动');
        console.log(`   - 轨迹点数: ${totalPoints}`);
        console.log(`   - 动画周期: ${CYCLE_TOTAL}s (生长${APPEAR_TIME}s + 停顿${PAUSE_TIME}s + 消散${DISAPPEAR_TIME}s)`);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
