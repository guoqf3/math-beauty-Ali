<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>维里定理 · 束缚系统平均动能势能关系</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03040e}
  body{
    font-family:"SF Mono","Consolas","Menlo","Courier New",monospace;
    color:#bfe9ff;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;display:block;z-index:0;touch-action:none}

  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(0,0,0,.78) 100%);
  }

  /* 顶部人生启迪 */
  .quote{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    z-index:3;pointer-events:none;
    font-size:17px;letter-spacing:3px;white-space:nowrap;
    color:#eaf6ff;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    text-shadow:
      0 0 10px rgba(255,225,160,.9),
      0 0 26px rgba(255,170,80,.6),
      0 0 52px rgba(110,170,255,.45);
    animation:qglow 5s ease-in-out infinite;
  }
  @keyframes qglow{
    0%,100%{opacity:.86;text-shadow:0 0 10px rgba(255,225,160,.85),0 0 26px rgba(255,170,80,.55),0 0 52px rgba(110,170,255,.4)}
    50%{opacity:1;text-shadow:0 0 16px rgba(255,248,215,1),0 0 38px rgba(255,195,110,.9),0 0 70px rgba(140,190,255,.6)}
  }

  /* 边缘公式面板 */
  .panel{
    position:fixed;top:50%;transform:translateY(-50%);
    z-index:3;pointer-events:none;
    font-size:12px;line-height:2.0;letter-spacing:.5px;
    color:rgba(150,225,255,.5);
    text-shadow:0 0 9px rgba(0,180,255,.45);
  }
  .panel .line{white-space:nowrap}
  .panel .hl{color:rgba(255,238,200,.95);text-shadow:0 0 12px rgba(255,200,110,.9)}
  .panel .dim{color:rgba(150,170,230,.4);font-size:11px}
  .panel.left{left:22px;text-align:left}
  .panel.right{right:22px;text-align:right}

  /* 底部控制 */
  .controls{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    z-index:4;display:flex;align-items:center;gap:16px;
    padding:10px 20px;border-radius:44px;
    background:rgba(8,14,32,.68);
    border:1px solid rgba(90,200,255,.25);
    box-shadow:0 0 26px rgba(0,120,255,.22),inset 0 0 22px rgba(0,100,200,.12);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:11px;letter-spacing:.4px;white-space:nowrap;
  }
  .controls label{display:flex;align-items:center;gap:8px;color:rgba(160,230,255,.85)}
  .tval{color:#ffe9b8;text-shadow:0 0 10px rgba(255,200,110,.9);min-width:56px;display:inline-block;text-align:right}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:118px;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,rgba(60,220,255,.9),rgba(160,120,255,.9));
    box-shadow:0 0 12px rgba(60,200,255,.55);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#5fe6ff 55%,#2a6cff);
    box-shadow:0 0 14px rgba(90,230,255,.95),0 0 26px rgba(80,170,255,.6);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffffff,#5fe6ff 55%,#2a6cff);
    box-shadow:0 0 14px rgba(90,230,255,.95);cursor:pointer;
  }
  .toggle{
    cursor:pointer;user-select:none;
    padding:5px 13px;border-radius:20px;
    border:1px solid rgba(90,200,255,.28);
    background:rgba(18,42,82,.32);
    color:rgba(160,225,255,.7);
    transition:all .25s ease;
  }
  .toggle:hover{border-color:rgba(140,235,255,.6);color:#ddf6ff}
  .toggle.on{
    background:rgba(90,200,255,.18);
    border-color:rgba(150,240,255,.85);
    color:#eafdff;
    box-shadow:0 0 16px rgba(90,210,255,.55),inset 0 0 12px rgba(90,210,255,.22);
  }

  @media (max-width:900px){
    .panel{display:none}
    .quote{font-size:13px;letter-spacing:1.5px;top:12px}
    .controls{gap:9px;padding:8px 12px;font-size:10px;bottom:10px}
    input[type=range]{width:76px}
    .tval{min-width:42px}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="quote">动能与势能各半，束缚的轨道才能长久安稳</div>

<div class="panel left">
  <div class="line">2⟨T⟩ = −⟨V⟩</div>
  <div class="line">⟨K⟩ = −½⟨V⟩</div>
  <div class="line">E = ⟨T⟩ + ⟨V⟩ = −⟨T⟩</div>
  <div class="line">m·v²/r = GMm/r²</div>
  <div class="line dim" style="margin-top:8px">E &lt; 0 ⇒ 引力束缚态</div>
</div>

<div class="panel right">
  <div class="line">a = <span class="hl" id="vA">1.00</span> AU</div>
  <div class="line">e = <span class="hl" id="vE">0.500</span></div>
  <div class="line">r = <span class="hl" id="vR">1.00</span> AU</div>
  <div class="line">v = <span class="hl" id="vV">29.8</span> km/s</div>
  <div class="line">v_esc = <span id="vEsc">42.1</span> km/s</div>
  <div class="line" style="margin-top:6px">2K/(−V) = <span class="hl" id="vRatio">1.00</span></div>
  <div class="line">2⟨K⟩/(−⟨V⟩) = <span class="hl" id="vAvg">1.00</span></div>
  <div class="line dim" style="margin-top:6px">点击行星查看能量仪表</div>
</div>

<div class="controls">
  <label>a
    <input type="range" id="aSlider" min="0.5" max="1.5" step="0.01" value="1.00">
  </label>
  <span class="tval" id="aLabel">1.00 AU</span>
  <label>e
    <input type="range" id="eSlider" min="0" max="0.80" step="0.01" value="0.50">
  </label>
  <span class="tval" id="eLabel">0.50</span>
  <div class="toggle on" id="btnVec">矢量</div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   常量
============================================================ */
const GM = 1.32712440018e11;   // km³/s²  太阳引力常数
const AU = 1.495978707e8;      // km

/* ============================================================
   画布
============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let stars = [];

function buildStars(){
  stars = [];
  const n = Math.round(W * H / 7000);
  for(let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.25,
      ph: Math.random() * Math.PI * 2,
      sp: 0.3 + Math.random() * 1.5,
      hue: 190 + Math.random() * 90
    });
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   状态
============================================================ */
const st = {
  aAU: 1.00,
  e: 0.50,
  M: 0,
  E: 0,
  time: 0,
  trail: [],
  ratioInst: 1,
  ratioAvg: 1,
  K: 0, V: 0, Em: 0,
  rAU: 1, vkm: 0,
  showVec: true,
  showProbe: false,
  probeX: 0, probeY: 0,
  starX: 0, starY: 0
};

const TRAIL_LIFE = 1.55;   // 拖尾存活秒数
const TILT = -0.48;        // 轨道倾角（视觉）

/* ============================================================
   DOM
============================================================ */
const aSlider = document.getElementById('aSlider');
const eSlider = document.getElementById('eSlider');
const aLabel  = document.getElementById('aLabel');
const eLabel  = document.getElementById('eLabel');
const btnVec  = document.getElementById('btnVec');

const elA    = document.getElementById('vA');
const elE    = document.getElementById('vE');
const elR    = document.getElementById('vR');
const elV    = document.getElementById('vV');
const elEsc  = document.getElementById('vEsc');
const elRatio= document.getElementById('vRatio');
const elAvg  = document.getElementById('vAvg');

aSlider.addEventListener('input', function(e){
  st.aAU = parseFloat(e.target.value);
  aLabel.textContent = st.aAU.toFixed(2) + ' AU';
});
eSlider.addEventListener('input', function(e){
  st.e = parseFloat(e.target.value);
  eLabel.textContent = st.e.toFixed(2);
});
btnVec.addEventListener('click', function(){
  st.showVec = !st.showVec;
  btnVec.classList.toggle('on', st.showVec);
});

canvas.addEventListener('pointerdown', function(e){
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const d = Math.hypot(mx - st.probeX, my - st.probeY);
  if(d < 58){
    st.showProbe = !st.showProbe;
  } else if(st.showProbe){
    st.showProbe = false;
  }
});

/* ============================================================
   物理更新
============================================================ */
function update(dt){
  const aAU = st.aAU;
  const e = st.e;

  /* 视觉角速度 n ∝ a^(-3/2)  —— 开普勒第三定律 */
  const nVis = 1.55 / Math.pow(aAU, 1.5);

  st.M += nVis * dt;
  if(st.M > Math.PI * 2) st.M -= Math.PI * 2;

  /* 解开普勒方程 M = E - e·sinE （牛顿迭代） */
  let E = st.M;
  for(let i = 0; i < 5; i++){
    const f  = E - e * Math.sin(E) - st.M;
    const fp = 1 - e * Math.cos(E);
    E -= f / fp;
  }
  st.E = E;

  /* 真实物理量 */
  const A_km = aAU * AU;
  const r_km = A_km * (1 - e * Math.cos(E));
  const v_km = Math.sqrt(GM * (2 / r_km - 1 / A_km));

  st.rAU = r_km / AU;
  st.vkm = v_km;
  st.K = v_km * v_km / 2;      // MJ/kg  (1 km²/s² = 1 MJ/kg)
  st.V = -GM / r_km;           // MJ/kg
  st.Em = st.K + st.V;

  /* 维里比 2K/(-V) = v²r/GM */
  const ratio = (v_km * v_km * r_km) / GM;
  st.ratioInst = ratio;
  st.ratioAvg += (ratio - st.ratioAvg) * Math.min(1, dt * 0.25);
}

/* ============================================================
   绘制工具
============================================================ */
function drawStars(t){
  ctx.globalCompositeOperation = 'lighter';
  for(let i = 0; i < stars.length; i++){
    const s = stars[i];
    const tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
    ctx.fillStyle = 'hsla(' + s.hue + ',70%,' + (70 + 22 * tw) + '%,' + (0.10 + 0.55 * tw * tw) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function arrow(x0, y0, x1, y1, color, label){
  const ang = Math.atan2(y1 - y0, x1 - x0);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - 11 * Math.cos(ang - 0.40), y1 - 11 * Math.sin(ang - 0.40));
  ctx.lineTo(x1 - 11 * Math.cos(ang + 0.40), y1 - 11 * Math.sin(ang + 0.40));
  ctx.closePath();
  ctx.fill();

  if(label){
    ctx.shadowBlur = 6;
    ctx.font = '11px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = color;
    ctx.fillText(label, x1 + 8, y1 + 4);
  }
  ctx.restore();
}

/* ============================================================
   主渲染
============================================================ */
function render(){
  const t = st.time;
  /* 30 秒慢循环色相 */
  const hShift = 34 * Math.sin(t * Math.PI * 2 / 30);

  /* ---------- 背景 ---------- */
  ctx.fillStyle = '#03040e';
  ctx.fillRect(0, 0, W, H);

  const bgCX = W / 2, bgCY = H * 0.45;
  let g = ctx.createRadialGradient(bgCX, bgCY, 0, bgCX, bgCY, Math.max(W, H) * 0.72);
  g.addColorStop(0,   'hsla(' + (228 + hShift) + ',70%,17%,0.55)');
  g.addColorStop(0.48,'hsla(' + (268 + hShift) + ',72%,10%,0.24)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  drawStars(t);

  /* ---------- 几何参数 ---------- */
  const minDim = Math.min(W, H);
  const lim = minDim * 0.42;
  const PX = Math.min(
    minDim * 0.16,
    lim / (st.aAU * (1 + st.e))
  );

  const A_px = st.aAU * PX;
  const B_px = A_px * Math.sqrt(Math.max(0, 1 - st.e * st.e));
  const ct = Math.cos(TILT);
  const sn = Math.sin(TILT);

  const centerX = W / 2;
  const centerY = H * 0.45;

  /* 恒星（焦点）位于椭圆中心偏移处 */
  const starX = centerX + A_px * st.e * ct;
  const starY = centerY + A_px * st.e * sn;
  st.starX = starX;
  st.starY = starY;

  function toScreen(xl, yl){
    return {
      x: starX + xl * ct - yl * sn,
      y: starY + xl * sn + yl * ct
    };
  }

  /* ---------- 椭圆轨道 ---------- */
  const N = 170;
  const pts = [];
  for(let i = 0; i <= N; i++){
    const E = i / N * Math.PI * 2;
    pts.push(toScreen(A_px * (Math.cos(E) - st.e), B_px * Math.sin(E)));
  }

  ctx.globalCompositeOperation = 'lighter';

  /* 外发光 */
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.strokeStyle = 'hsla(' + (205 + hShift) + ',100%,62%,0.085)';
  ctx.lineWidth = 11;
  ctx.lineJoin = 'round';
  ctx.stroke();

  /* 主轨道线 */
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.strokeStyle = 'hsla(' + (192 + hShift) + ',100%,70%,0.42)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 虚线叠层 */
  ctx.save();
  ctx.setLineDash([5, 10]);
  ctx.strokeStyle = 'hsla(' + (278 + hShift) + ',100%,74%,0.30)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  ctx.globalCompositeOperation = 'source-over';

  /* ---------- 恒星 → 行星 连线 ---------- */
  const E = st.E;
  const xl = A_px * (Math.cos(E) - st.e);
  const yl = B_px * Math.sin(E);
  const p = toScreen(xl, yl);
  st.probeX = p.x;
  st.probeY = p.y;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.setLineDash([3, 7]);
  ctx.strokeStyle = 'hsla(' + (42 + hShift) + ',100%,72%,0.30)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(starX, starY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  ctx.restore();

  /* ---------- 恒星 ---------- */
  drawStar(starX, starY, t);

  /* ---------- 行星拖尾 ---------- */
  const last = st.trail[st.trail.length - 1];
  if(!last || Math.hypot(p.x - last.x, p.y - last.y) > 2.4 || t - last.t > 0.05){
    st.trail.push({ x: p.x, y: p.y, t: t });
  }
  while(st.trail.length && t - st.trail[0].t > TRAIL_LIFE) st.trail.shift();
  if(st.trail.length > 170) st.trail.splice(0, st.trail.length - 170);

  const tr = st.trail;

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  /* 宽光晕层 */
  for(let i = 1; i < tr.length; i += 2){
    const j = Math.min(i + 1, tr.length - 1);
    const a = tr[i - 1], b = tr[j];
    const age = (t - b.t) / TRAIL_LIFE;
    const al = Math.pow(1 - age, 2.3);
    if(al < 0.015) continue;
    const hue = 188 + 98 * (1 - age);
    ctx.strokeStyle = 'hsla(' + hue + ',100%,64%,' + (al * 0.15) + ')';
    ctx.lineWidth = 9 * al + 2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  /* 锐利芯层 */
  for(let i = 1; i < tr.length; i++){
    const a = tr[i - 1], b = tr[i];
    const age = (t - b.t) / TRAIL_LIFE;
    const al = Math.pow(1 - age, 1.4);
    if(al < 0.02) continue;
    const hue = 188 + 98 * (1 - age);
    ctx.strokeStyle = 'hsla(' + hue + ',100%,' + (62 + 30 * al) + '%,' + al + ')';
    ctx.lineWidth = 1 + 2.2 * al;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  /* ---------- 行星 ---------- */
  const puls = 1 + 0.12 * Math.sin(t * 5.5);
  g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 34 * puls);
  g.addColorStop(0,    'rgba(228,252,255,0.95)');
  g.addColorStop(0.18, 'rgba(100,232,255,0.62)');
  g.addColorStop(0.50, 'rgba(80,160,255,0.18)');
  g.addColorStop(1,    'rgba(100,80,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 34 * puls, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#eafcff';
  ctx.beginPath();
  ctx.arc(p.x, p.y, 3.3, 0, Math.PI * 2);
  ctx.fill();

  /* ---------- 矢量 ---------- */
  if(st.showVec){
    const dEdt = 1 / (1 - st.e * Math.cos(E));
    let vxl = -A_px * Math.sin(E) * dEdt;
    let vyl =  B_px * Math.cos(E) * dEdt;
    const vlen = Math.hypot(vxl, vyl) || 1;
    const ux = vxl / vlen, uy = vyl / vlen;
    const L = 48 + 26 * (st.vkm / 45);

    arrow(p.x, p.y, p.x + ux * L, p.y + uy * L, 'rgba(120,242,255,0.95)', 'v');

    /* 引力方向 */
    const gx = starX - p.x, gy = starY - p.y;
    const gl = Math.hypot(gx, gy) || 1;
    arrow(p.x, p.y, p.x + gx / gl * 36, p.y + gy / gl * 36, 'rgba(255,182,88,0.78)', 'g');
  }

  ctx.globalCompositeOperation = 'source-over';

  /* ---------- 探针卡片 ---------- */
  drawProbeCard(p.x, p.y);
}

/* ============================================================
   恒星绘制
============================================================ */
function drawStar(x, y, t){
  const R = Math.min(W, H) * 0.021;
  const puls = 1 + 0.07 * Math.sin(t * 2.2);

  ctx.globalCompositeOperation = 'lighter';

  /* 外层光晕 */
  let g = ctx.createRadialGradient(x, y, 0, x, y, R * 7.5 * puls);
  g.addColorStop(0,    'rgba(255,244,208,0.55)');
  g.addColorStop(0.12, 'rgba(255,212,124,0.26)');
  g.addColorStop(0.36, 'rgba(255,162,62,0.09)');
  g.addColorStop(1,    'rgba(255,120,30,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, R * 7.5 * puls, 0, Math.PI * 2);
  ctx.fill();

  /* 核心 */
  g = ctx.createRadialGradient(x - R * 0.15, y - R * 0.15, 0, x, y, R * 1.7);
  g.addColorStop(0,    'rgba(255,255,255,1)');
  g.addColorStop(0.38, 'rgba(255,246,214,0.95)');
  g.addColorStop(0.74, 'rgba(255,216,132,0.60)');
  g.addColorStop(1,    'rgba(255,180,70,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, R * 1.7, 0, Math.PI * 2);
  ctx.fill();

  /* 脉动环 */
  ctx.strokeStyle = 'rgba(255,220,150,' + (0.10 + 0.07 * Math.sin(t * 1.8)) + ')';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.arc(x, y, R * (2.6 + 0.45 * Math.sin(t * 1.4)), 0, Math.PI * 2);
  ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   探针卡片
============================================================ */
function drawProbeCard(px, py){
  if(!st.showProbe) return;

  const lines = [
    'K/m   = ' + st.K.toFixed(0)  + ' MJ/kg',
    'V/m   = ' + st.V.toFixed(0)  + ' MJ/kg',
    'E/m   = ' + st.Em.toFixed(0) + ' MJ/kg',
    '2K/(−V) = ' + st.ratioInst.toFixed(3)
  ];

  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.font = '11px ui-monospace, Consolas, monospace';

  let tw = 0;
  for(let i = 0; i < lines.length; i++){
    tw = Math.max(tw, ctx.measureText(lines[i]).width);
  }

  const pad = 11, lh = 16;
  const bw = tw + pad * 2;
  const bh = lines.length * lh + pad * 2 - 4;

  let bx = px + 28;
  let by = py - bh - 22;
  if(bx + bw > W - 12) bx = px - bw - 28;
  if(bx < 12) bx = 12;
  if(by < 12) by = py + 28;
  if(by + bh > H - 12) by = H - bh - 12;

  /* 连接线 */
  ctx.strokeStyle = 'rgba(120,230,255,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(bx < px ? bx + bw : bx, by + bh / 2);
  ctx.stroke();

  /* 卡片 */
  ctx.fillStyle = 'rgba(6,16,34,0.88)';
  ctx.strokeStyle = 'rgba(100,220,255,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 8);
  else ctx.rect(bx, by, bw, bh);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = 'left';
  for(let i = 0; i < lines.length; i++){
    ctx.fillStyle = i === 3 ? 'rgba(255,236,172,0.96)' : 'rgba(180,235,255,0.9)';
    ctx.fillText(lines[i], bx + pad, by + pad + (i + 1) * lh - 5);
  }

  ctx.restore();
}

/* ============================================================
   数值面板刷新
============================================================ */
function updateUI(){
  const vEsc = Math.sqrt(2 * GM / (st.rAU * AU));
  elA.textContent = st.aAU.toFixed(2);
  elE.textContent = st.e.toFixed(3);
  elR.textContent = st.rAU.toFixed(3);
  elV.textContent = st.vkm.toFixed(1);
  elEsc.textContent = vEsc.toFixed(1);
  elRatio.textContent = st.ratioInst.toFixed(3);
  elAvg.textContent = st.ratioAvg.toFixed(3);
}

/* ============================================================
   主循环
============================================================ */
let prevT = performance.now();
let uiTick = 0;

function frame(now){
  let dt = (now - prevT) / 1000;
  prevT = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  st.time += dt;

  update(dt);
  render();

  uiTick++;
  if(uiTick % 4 === 0) updateUI();

  requestAnimationFrame(frame);
}

updateUI();
requestAnimationFrame(frame);

})();
</script>
