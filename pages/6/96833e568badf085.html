<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指数谐振曲线簇 · 极坐标调制</title>
    <style>
        :root {
            --bg: #02010e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: clamp(16px, 3.5vh, 42px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #title-overlay h1 {
            color: #e0cfb4;
            font-size: clamp(1.1rem, 2.1vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-shadow: 0 0 28px rgba(210, 175, 130, 0.55), 0 0 75px rgba(185, 145, 100, 0.25);
            margin: 0;
        }
        #title-overlay .subtitle {
            color: #bca689;
            font-size: clamp(0.64rem, 1.1vw, 0.88rem);
            letter-spacing: 0.06em;
            margin-top: 0.28em;
            text-shadow: 0 0 14px rgba(180, 140, 100, 0.4);
        }

        #formula-overlay {
            position: fixed;
            bottom: clamp(24px, 4.5vh, 54px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }
        #formula-overlay .formula-box {
            display: inline-block;
            background: rgba(14, 10, 20, 0.72);
            border: 1px solid rgba(165, 140, 110, 0.28);
            border-radius: 12px;
            padding: clamp(10px, 1.4vh, 16px) clamp(16px, 3vw, 28px);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        #formula-overlay .formula-main {
            color: #f1ddc3;
            font-size: clamp(0.68rem, 1.15vw, 1.0rem);
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        #formula-overlay .formula-detail {
            color: #a59279;
            font-size: clamp(0.52rem, 0.75vw, 0.68rem);
            letter-spacing: 0.03em;
            margin-top: 0.22em;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            #title-overlay h1 {
                letter-spacing: 0.05em;
            }
            #formula-overlay .formula-box {
                padding: 10px 16px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>指数谐振曲线簇</h1>
        <div class="subtitle">Exponential Resonance · Polar Modulation Curves</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-box">
            <div class="formula-main">
                r(θ) = A₀ · e<sup>k·cos(mθ)</sup> · (1 + α·sin(nθ))<br>
                x = r·cos θ y = r·sin θ z = ε·sin(pθ+δ)
            </div>
            <div class="formula-detail">
                m,n,p ∈ ℕ | k,α ∈ ℝ⁺ | θ∈[0,2π] | 16 条闭合曲线
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02010e');
        scene.fog = new THREE.Fog('#02010e', 7, 22);

        const camera = new THREE.PerspectiveCamera(
            46,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            28
        );
        camera.position.set(0, 0.3, 7.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight('#1e1e3a', 0.4));

        // ==================== 主图案组 ====================
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const segmentCount = 2000; // 线段数量
        const vertexCountPerCurve = segmentCount + 1; // 首尾重合确保闭合
        const curveCount = 16;
        const allLines = [];

        const zEpsilon = 0.1; // z轴调制幅度
        const A0 = 1.8; // 基础振幅

        // ==================== 指数谐振曲线生成 ====================
        /**
         * 生成指数谐振闭合曲线
         * r(θ) = A₀ · exp(k·cos(mθ)) · (1 + α·sin(nθ))
         * @param {number} k 指数调制强度
         * @param {number} m 指数调制频率
         * @param {number} alpha 正弦调制幅度
         * @param {number} n 正弦调制频率
         * @param {number} p z轴调制频率
         * @param {number} delta z轴调制相位
         * @param {THREE.Euler} rotation 空间旋转
         */
        function generateExponentialCurve(k, m, alpha, n, p, delta, rotation) {
            const rotMatrix = new THREE.Matrix4().makeRotationFromEuler(rotation);
            const rawVerts = new Float32Array(vertexCountPerCurve * 3);

            // 首顶点 (θ=0)
            let theta0 = 0;
            let r0 = A0 * Math.exp(k * Math.cos(m * theta0)) * (1 + alpha * Math.sin(n * theta0));
            let x0 = r0 * Math.cos(theta0);
            let y0 = r0 * Math.sin(theta0);
            let z0 = zEpsilon * Math.sin(p * theta0 + delta);
            let vec0 = new THREE.Vector3(x0, y0, z0);
            vec0.applyMatrix4(rotMatrix);
            rawVerts[0] = vec0.x;
            rawVerts[1] = vec0.y;
            rawVerts[2] = vec0.z;

            // 中间顶点
            for (let i = 1; i < segmentCount; i++) {
                const theta = (i / segmentCount) * Math.PI * 2;
                const r = A0 * Math.exp(k * Math.cos(m * theta)) * (1 + alpha * Math.sin(n * theta));
                const x2d = r * Math.cos(theta);
                const y2d = r * Math.sin(theta);
                const z2d = zEpsilon * Math.sin(p * theta + delta);
                const vec = new THREE.Vector3(x2d, y2d, z2d);
                vec.applyMatrix4(rotMatrix);
                rawVerts[i * 3] = vec.x;
                rawVerts[i * 3 + 1] = vec.y;
                rawVerts[i * 3 + 2] = vec.z;
            }

            // 末顶点：显式复制首顶点，确保几何闭合
            const lastIdx = segmentCount * 3;
            rawVerts[lastIdx] = rawVerts[0];
            rawVerts[lastIdx + 1] = rawVerts[1];
            rawVerts[lastIdx + 2] = rawVerts[2];

            return rawVerts;
        }

        function createLine(scaledVerts, hue, opacity = 0.78) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(scaledVerts, 3));
            geometry.setDrawRange(0, 0); // 初始完全不可见

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(hue, 0.88, 0.62),
                transparent: true,
                opacity: opacity,
                linewidth: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: true,
                depthTest: true,
            });

            const line = new THREE.Line(geometry, material);
            line.visible = false;
            line.frustumCulled = false;
            return line;
        }

        // ==================== 参数配置（16条曲线各不相同） ====================
        const configs = [];
        // 手动设计16组参数，确保丰富的视觉变化
        const kValues = [0.12, 0.18, 0.22, 0.28, 0.15, 0.32, 0.20, 0.25, 0.35, 0.10, 0.30, 0.16, 0.38, 0.14, 0.26, 0.19];
        const mValues = [2, 3, 4, 5, 3, 6, 2, 4, 7, 3, 5, 2, 8, 4, 6, 3];
        const alphaValues = [0.22, 0.35, 0.28, 0.42, 0.18, 0.50, 0.30, 0.38, 0.45, 0.15, 0.48, 0.25, 0.55, 0.20, 0.33, 0.40];
        const nValues = [3, 5, 7, 9, 4, 11, 5, 7, 13, 3, 8, 6, 15, 5, 9, 7];
        const pValues = [3, 4, 5, 6, 4, 7, 3, 5, 8, 4, 6, 3, 9, 5, 7, 4];

        for (let j = 0; j < curveCount; j++) {
            const k = kValues[j];
            const m = mValues[j];
            const alpha = alphaValues[j];
            const n = nValues[j];
            const p = pValues[j];
            const delta = j * 0.5;
            // 空间旋转均匀覆盖
            const rotY = (j / curveCount) * Math.PI * 2;
            const rotX = (j * 0.62) % Math.PI;
            const rotZ = (j * 0.28) % (Math.PI * 0.35);
            const rotation = new THREE.Euler(rotX, rotY, rotZ);
            configs.push({ k, m, alpha, n, p, delta, rotation });
        }

        // 生成所有原始顶点
        const allRawVertices = [];
        for (const cfg of configs) {
            const rawVerts = generateExponentialCurve(
                cfg.k, cfg.m, cfg.alpha, cfg.n, cfg.p, cfg.delta, cfg.rotation
            );
            allRawVertices.push(rawVerts);
        }

        // ==================== 计算全局包围盒 ====================
        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let minZ = Infinity, maxZ = -Infinity;

        for (const rawVerts of allRawVertices) {
            for (let i = 0; i < rawVerts.length; i += 3) {
                const vx = rawVerts[i];
                const vy = rawVerts[i + 1];
                const vz = rawVerts[i + 2];
                if (vx < minX) minX = vx;
                if (vx > maxX) maxX = vx;
                if (vy < minY) minY = vy;
                if (vy > maxY) maxY = vy;
                if (vz < minZ) minZ = vz;
                if (vz > maxZ) maxZ = vz;
            }
        }

        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        const centerZ = (minZ + maxZ) / 2;
        const rangeX = maxX - minX;
        const rangeY = maxY - minY;
        const rangeZ = maxZ - minZ;
        const maxRange = Math.max(rangeX, rangeY, rangeZ, 0.1);
        const targetScale = 5.0 / maxRange;

        console.log('📐 包围盒:', { maxRange: maxRange.toFixed(3), targetScale: targetScale.toFixed(4) });

        // ==================== 缩放并创建线条 ====================
        for (let j = 0; j < curveCount; j++) {
            const rawVerts = allRawVertices[j];
            const scaledVerts = new Float32Array(vertexCountPerCurve * 3);
            for (let i = 0; i < vertexCountPerCurve; i++) {
                const idx = i * 3;
                scaledVerts[idx] = (rawVerts[idx] - centerX) * targetScale;
                scaledVerts[idx + 1] = (rawVerts[idx + 1] - centerY) * targetScale;
                scaledVerts[idx + 2] = (rawVerts[idx + 2] - centerZ) * targetScale;
            }
            const hue = (j / curveCount) * 0.82 + 0.06;
            const line = createLine(scaledVerts, hue % 1.0, 0.75);
            mainGroup.add(line);
            allLines.push(line);
        }

        console.log(`✅ 已生成 ${curveCount} 条指数谐振闭合曲线`);

        // ==================== 动画状态机 ====================
        const APPEAR_TIME = 8.0;
        const PAUSE_TIME = 1.5;
        const DISAPPEAR_TIME = 8.0;
        const CYCLE_TOTAL = APPEAR_TIME + PAUSE_TIME + DISAPPEAR_TIME; // 17.5秒

        let animationStartTime = null;
        let firstFrameDone = false;

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInCubic(t) { return t * t * t; }

        function getProgress(elapsedSeconds) {
            const cycle = elapsedSeconds % CYCLE_TOTAL;
            if (cycle < APPEAR_TIME) {
                const t = cycle / APPEAR_TIME;
                return { progress: easeOutCubic(t), phase: 'appear' };
            } else if (cycle < APPEAR_TIME + PAUSE_TIME) {
                return { progress: 1.0, phase: 'pause' };
            } else {
                const t = (cycle - APPEAR_TIME - PAUSE_TIME) / DISAPPEAR_TIME;
                return { progress: 1.0 - easeInCubic(t), phase: 'disappear' };
            }
        }

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            // 第一帧：强制空白，避免任何残留图形
            if (animationStartTime === null) {
                animationStartTime = timestamp;
                allLines.forEach(line => {
                    line.visible = false;
                    if (line.geometry) line.geometry.setDrawRange(0, 0);
                });
                renderer.render(scene, camera);
                firstFrameDone = true;
                return;
            }

            const elapsed = (timestamp - animationStartTime) / 1000;
            const { progress } = getProgress(elapsed);
            const drawCount = Math.floor(progress * vertexCountPerCurve);
            const shouldBeVisible = drawCount >= 2;

            for (let i = 0; i < allLines.length; i++) {
                const line = allLines[i];
                if (!line || !line.geometry) continue;
                const maxPts = line.geometry.attributes.position.count;
                const lineDraw = Math.min(drawCount, maxPts);
                if (shouldBeVisible && lineDraw >= 2) {
                    line.visible = true;
                    line.geometry.setDrawRange(0, lineDraw);
                } else {
                    line.visible = false;
                    line.geometry.setDrawRange(0, 0);
                }
            }

            // 整体缓慢旋转，展现空间曲线结构
            const rotY = elapsed * 0.04;
            const rotX = Math.sin(elapsed * 0.08) * 0.03;
            const rotZ = Math.cos(elapsed * 0.11) * 0.025;
            mainGroup.rotation.set(rotX, rotY, rotZ);

            // 相机轻柔晃动
            camera.position.x = Math.sin(elapsed * 0.07) * 0.22;
            camera.position.y = 0.3 + Math.cos(elapsed * 0.1) * 0.16;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (h <= 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        // ==================== 启动 ====================
        console.log('🚀 指数谐振曲线簇动画启动');
        console.log(`   - 曲线数量: ${curveCount}`);
        console.log(`   - 顶点数/曲线: ${vertexCountPerCurve}`);
        console.log(`   - 动画周期: ${CYCLE_TOTAL}s (生长${APPEAR_TIME}s + 停顿${PAUSE_TIME}s + 消散${DISAPPEAR_TIME}s)`);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
