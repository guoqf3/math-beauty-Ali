<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>数学曲线之美 · 乘积谐波织锦</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0c10;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', serif;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      left: 0;
      right: 0;
      text-align: center;
    }
    #title-overlay {
      top: clamp(16px, 4vh, 42px);
    }
    #title-overlay h1 {
      font-size: clamp(1.2rem, 2.8vw, 1.9rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #efe7d6;
      text-shadow: 0 0 28px rgba(210, 180, 140, 0.5), 0 0 80px rgba(160, 130, 90, 0.25);
      margin: 0;
      line-height: 1.3;
    }
    #title-overlay .subtitle {
      font-size: clamp(0.7rem, 1.4vw, 0.95rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: #b8aa90;
      text-shadow: 0 0 18px rgba(180, 150, 110, 0.35);
      margin-top: 6px;
    }
    #formula-overlay {
      bottom: clamp(20px, 5vh, 50px);
    }
    .formula-box {
      display: inline-block;
      background: rgba(18, 16, 12, 0.7);
      border: 1px solid rgba(180, 145, 100, 0.35);
      border-radius: 14px;
      padding: clamp(10px, 2vh, 18px) clamp(20px, 3.5vw, 36px);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      box-shadow: 0 10px 36px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
      transition: opacity 0.8s ease;
    }
    .formula-line {
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      color: #d4c8aa;
      letter-spacing: 0.05em;
      line-height: 1.9;
      font-style: italic;
      white-space: nowrap;
    }
    .fn { color: #e8c97a; font-style: normal; font-weight: bold; }
    .paren { color: #c4a870; font-style: normal; }
    .op { color: #b8956e; font-style: normal; }
    .param { color: #a09070; font-style: normal; }
    @media (max-width: 600px) {
      .formula-line { font-size: 0.7rem; letter-spacing: 0.02em; white-space: normal; }
      .formula-box { padding: 8px 12px; border-radius: 10px; }
      #title-overlay h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="overlay" id="title-overlay">
    <h1>数学曲线之美</h1>
    <div class="subtitle">乘积谐波织锦 · Harmonic Product Weave</div>
  </div>

  <div class="overlay" id="formula-overlay">
    <div class="formula-box">
      <div class="formula-line">
        <span class="fn">x</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="fn">cos</span><span class="paren">(</span>a t<span class="paren">)</span> <span class="fn">cos</span><span class="paren">(</span>b t<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">y</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="fn">sin</span><span class="paren">(</span>c t<span class="paren">)</span> <span class="fn">sin</span><span class="paren">(</span>d t<span class="paren">)</span>
      </div>
      <div class="formula-line">
        <span class="fn">z</span><span class="paren">(</span>t<span class="paren">)</span> <span class="op">=</span> <span class="fn">sin</span><span class="paren">(</span>e t<span class="paren">)</span> <span class="fn">cos</span><span class="paren">(</span>f t<span class="paren">)</span>
        &nbsp;&nbsp;<span class="param">a..f ∈ ℤ⁺</span>&nbsp;<span class="param">t ∈ [0,2π]</span>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // DOM 元素
    const container = document.getElementById('canvas-container');
    const formulaBox = document.querySelector('.formula-box');

    // 场景初始化
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b0c10, 0.00012);

    // 相机
    const camera = new THREE.PerspectiveCamera(
      50,
      container.clientWidth / container.clientHeight,
      0.5,
      30
    );
    camera.position.set(3.6, 1.7, 5.8);
    camera.lookAt(0, 0, 0);

    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x0b0c10);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // 背景星场
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 400;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 10 + Math.random() * 12;
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({
      color: 0xd0c9b8,
      size: 0.021,
      transparent: true,
      opacity: 0.55,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // 曲线参数
    const TOTAL_VERTICES = 3000;
    const CURVE_COUNT = 36;
    const GROW_DURATION = 15.0;
    const PAUSE_DURATION = 1.5;
    const SHRINK_DURATION = 15.0;
    const CYCLE_TOTAL = GROW_DURATION + PAUSE_DURATION + SHRINK_DURATION;

    // 生成整数频率组合 (a,b,c,d,e,f) ，范围2-7，确保曲线闭合且图案丰富
    function buildCurveParams(count) {
      const params = [];
      // 预定义一些有吸引力的组合
      const combos = [
        [2,3,4,5,3,7],
        [3,5,2,5,4,3],
        [4,3,5,2,5,6],
        [5,2,3,4,2,7],
        [3,7,4,5,6,3],
        [2,5,5,3,3,4],
        [4,5,2,7,4,5],
        [5,3,6,2,3,5],
        [6,2,3,5,2,4],
        [3,4,4,3,5,2],
        [2,7,3,5,6,3],
        [5,4,2,3,7,2],
        [4,2,6,3,3,5],
        [3,6,5,2,4,7],
        [2,5,6,4,3,6],
        [5,6,3,2,4,3],
        [6,3,2,5,5,2],
        [4,7,5,3,2,6],
        [7,2,4,6,3,4],
        [3,5,5,7,6,2],
        [2,4,7,3,5,4],
        [5,3,4,2,6,5],
        [4,6,2,5,3,7],
        [6,5,3,4,2,5],
        [3,2,5,6,4,3],
        [5,7,2,3,3,6],
        [7,3,6,2,5,4],
        [2,6,4,7,4,2],
        [4,5,3,6,2,3],
        [6,4,5,3,5,2],
        [3,6,2,4,6,5],
        [5,2,7,3,4,6],
        [2,3,5,2,3,5],
        [4,4,3,3,6,6],
        [3,5,6,6,2,4],
        [6,2,4,5,3,7]
      ];
      for (let i = 0; i < count; i++) {
        const combo = combos[i % combos.length];
        // 加入微小相位偏移，使相同频率组合的曲线错开起始点
        const phase = (i / count) * Math.PI * 2;
        params.push({
          a: combo[0], b: combo[1], c: combo[2],
          d: combo[3], e: combo[4], f: combo[5],
          phase
        });
      }
      return params;
    }
    const curveParamsList = buildCurveParams(CURVE_COUNT);

    // 为每条曲线分配色相
    const hues = Array.from({ length: CURVE_COUNT }, (_, k) => (k / CURVE_COUNT + 0.05) % 1);

    // 生成一条乘积谐波曲线的顶点
    function generateCurveData(params, hue) {
      const { a, b, c, d, e, f, phase } = params;
      const positions = new Float32Array(TOTAL_VERTICES * 3);
      const colors = new Float32Array(TOTAL_VERTICES * 3);
      for (let i = 0; i < TOTAL_VERTICES; i++) {
        const t = (i / (TOTAL_VERTICES - 1)) * Math.PI * 2 + phase;
        const x = Math.cos(a * t) * Math.cos(b * t);
        const y = Math.sin(c * t) * Math.sin(d * t);
        const z = Math.sin(e * t) * Math.cos(f * t);

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // 颜色微调
        const hueShift = Math.sin(t * 2.9 + hue * 12) * 0.02;
        const h = (hue + hueShift + 1) % 1;
        const s = 0.7 + Math.sin(t * 3.7 + hue * 9) * 0.13;
        const l = 0.5 + Math.cos(t * 5.2 + hue * 8) * 0.09;
        const color = new THREE.Color();
        color.setHSL(h, s, l);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      return { positions, colors };
    }

    // 创建所有曲线
    const curveGroup = new THREE.Group();
    scene.add(curveGroup);
    const allGeometries = [];

    curveParamsList.forEach((params, idx) => {
      const { positions, colors } = generateCurveData(params, hues[idx]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.setDrawRange(0, 0);

      const material = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.92,
        blending: THREE.NormalBlending,
        depthTest: true,
        depthWrite: true,
      });
      const line = new THREE.Line(geometry, material);
      line.renderOrder = idx;
      curveGroup.add(line);
      allGeometries.push(geometry);
    });

    // 装饰参考环
    const ringGeo = new THREE.TorusGeometry(1.05, 0.007, 32, 160);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x3d3730,
      transparent: true,
      opacity: 0.25,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.renderOrder = 999;
    curveGroup.add(ring);

    const ring2Geo = new THREE.TorusGeometry(0.85, 0.006, 24, 120);
    const ring2Mat = new THREE.MeshBasicMaterial({
      color: 0x4b443a,
      transparent: true,
      opacity: 0.2,
      depthWrite: false,
    });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    ring2.rotation.x = Math.PI / 3;
    ring2.rotation.y = Math.PI / 5;
    ring2.renderOrder = 998;
    curveGroup.add(ring2);

    // 动画状态
    const clock = new THREE.Clock();
    let lastDrawCount = -1;
    let currentPhase = 'grow';

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // 渲染循环
    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const cycleTime = elapsed % CYCLE_TOTAL;

      let progress;
      if (cycleTime < GROW_DURATION) {
        const raw = cycleTime / GROW_DURATION;
        progress = easeInOutCubic(raw);
        currentPhase = 'grow';
      } else if (cycleTime < GROW_DURATION + PAUSE_DURATION) {
        progress = 1.0;
        currentPhase = 'pause';
      } else {
        const shrinkElapsed = cycleTime - (GROW_DURATION + PAUSE_DURATION);
        const raw = 1.0 - shrinkElapsed / SHRINK_DURATION;
        progress = easeInOutCubic(Math.max(0, Math.min(1, raw)));
        currentPhase = 'shrink';
      }

      const drawCount = Math.max(0, Math.floor(progress * TOTAL_VERTICES));

      if (drawCount !== lastDrawCount) {
        allGeometries.forEach(geo => geo.setDrawRange(0, drawCount));
        lastDrawCount = drawCount;
      }

      // 曲线组缓慢旋转
      curveGroup.rotation.y += 0.0026;
      curveGroup.rotation.x = Math.sin(elapsed * 0.22) * 0.17;
      curveGroup.rotation.z = Math.cos(elapsed * 0.27) * 0.13;

      // 星场微动
      stars.rotation.y += 0.0003;
      stars.rotation.x += 0.00015;

      // 光环呼吸
      const breathe = 1 + Math.sin(elapsed * 0.7) * 0.04;
      ring.scale.setScalar(breathe);
      ring.material.opacity = 0.22 + Math.sin(elapsed * 0.55) * 0.06;
      ring2.scale.setScalar(1 + Math.cos(elapsed * 0.65) * 0.05);
      ring2.material.opacity = 0.18 + Math.cos(elapsed * 0.6) * 0.05;

      // 公式面板透明度
      if (formulaBox) {
        let op;
        if (currentPhase === 'pause') op = 0.95;
        else if (currentPhase === 'grow' && progress > 0.5) op = 0.5 + (progress - 0.5) * 0.9;
        else if (currentPhase === 'shrink' && progress < 0.5) op = 0.5 + progress * 0.9;
        else op = 0.55 + progress * 0.4;
        formulaBox.style.opacity = Math.max(0.35, Math.min(1, op));
      }

      renderer.render(scene, camera);
    }

    // 响应式处理
    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / Math.max(h, 1);
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }, 150);
    });

    // 启动动画
    allGeometries.forEach(geo => geo.setDrawRange(0, 0));
    lastDrawCount = 0;
    clock.start();
    requestAnimationFrame(animate);

    console.log('%c🧬 乘积谐波织锦 %c已启动', 'color:#e8c97a;font-size:1.1em;', 'color:#b8aa90;');
    console.log('%c'+CURVE_COUNT+'条乘积谐波曲线 | 从无到有15s → 停顿1.5s → 从有到无15s | 完美闭合',
      'color:#b8956e;font-size:0.9em;');
  </script>
</body>
</html>
