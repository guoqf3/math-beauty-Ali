<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲抛物面 · 三正交直纹编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>双曲抛物面 · 三正交直纹编织</h2>
        <div class="sub">Three orthogonal hyperbolic paraboloids · Ruled surface nets</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">HP₁: z = (x²−y²)/2</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">HP₂: x = (y²−z²)/2</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">HP₃: y = (z²−x²)/2</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.8, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.85;
        const U_RANGE = 2.8;
        const STEPS = 280;

        // ---- 双曲抛物面1: z = (x² - y²)/2 的直纹线 ----
        // 族A（金色）：固定y = y0, 变化x → 直线 (x, y0, (x²-y0²)/2) → 实际是抛物线（z是x的二次函数）
        // 双曲抛物面是直纹面！直纹线族：u族：固定参数v，直线方程 (x, y, z) = (v+t, v-t, 2vt)
        // 参数化：z = x·y，令 x = u+v, y = u-v，则 z = u²-v²
        // 重新设计：用标准直纹面参数化 z = xy
        // 令曲面为 z = x*y，直纹线为：固定y，变化x 或 固定x变化y，都是直线！

        // 重新定义三个正交双曲抛物面：
        // HP1（金，绕z轴）: z = x*y/c₁   → 直纹线: 固定y, 变化x → 直线 (x, y0, x*y0/c₁)
        // HP2（青，绕x轴）: x = y*z/c₂   → 直纹线: 固定z, 变化y → 直线 (y*z0/c₂, y, z0)
        // HP3（品红，绕y轴）: y = z*x/c₃ → 直纹线: 固定x, 变化z → 直线 (x0, z*x0/c₃, z)

        const C = 1.3;

        function hp1Point(x, y0) {
            return new THREE.Vector3(x, y0, x * y0 / C).multiplyScalar(SCALE);
        }
        function hp2Point(y, z0) {
            const p = new THREE.Vector3(y * z0 / C, y, z0).multiplyScalar(SCALE);
            return p;
        }
        function hp3Point(z, x0) {
            return new THREE.Vector3(x0, z * x0 / C, z).multiplyScalar(SCALE);
        }

        // 创建直线族
        function createLineFamily(fn, fixedValues, color, opacity, uMin, uMax, numPoints) {
            const group = new THREE.Group();
            const du = (uMax - uMin) / numPoints;
            for (const fv of fixedValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const u = uMin + i * du;
                    const p = fn(u, fv);
                    if (p.length() < 7.5) pts.push(p);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 族2：固定另一个变量，沿另一方向扫描
        function createOrthoFamily(fn, fixedValues, color, opacity, vMin, vMax, numPoints) {
            const group = new THREE.Group();
            const dv = (vMax - vMin) / numPoints;
            for (const fv of fixedValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const v = vMin + i * dv;
                    const p = fn(fv, v);
                    if (p.length() < 7.5) pts.push(p);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'tri-hp-weave';
        scene.add(rootGroup);

        const numLines = 24;
        const yVals = [];
        for (let i = 0; i < numLines; i++) yVals.push(-2.6 + i * 5.2 / (numLines - 1));
        const xVals = [];
        for (let i = 0; i < numLines; i++) xVals.push(-2.6 + i * 5.2 / (numLines - 1));
        const zVals = [];
        for (let i = 0; i < numLines; i++) zVals.push(-2.6 + i * 5.2 / (numLines - 1));

        // 金色族：HP1 固定y，变化x → z = x*y/C  (x方向直线)
        rootGroup.add(createLineFamily(hp1Point, yVals, COLOR_GOLD, 0.58, -U_RANGE, U_RANGE, STEPS));
        // 金色族补充：HP1 固定x，变化y → y方向直线
        rootGroup.add(createOrthoFamily(hp1Point, xVals, COLOR_GOLD, 0.45, -U_RANGE, U_RANGE, STEPS));

        // 青色族：HP2 固定z，变化y → x = y*z/C (y方向直线)
        rootGroup.add(createLineFamily(hp2Point, zVals, COLOR_CYAN, 0.58, -U_RANGE, U_RANGE, STEPS));
        // 青色族补充：HP2 固定y，变化z
        rootGroup.add(createOrthoFamily(hp2Point, yVals.map(y => y), COLOR_CYAN, 0.45, -U_RANGE, U_RANGE, STEPS));

        // 品红族：HP3 固定x，变化z → y = z*x/C (z方向直线)
        rootGroup.add(createLineFamily(hp3Point, xVals, COLOR_MAGENTA, 0.58, -U_RANGE, U_RANGE, STEPS));
        // 品红族补充：HP3 固定z，变化x
        rootGroup.add(createOrthoFamily(hp3Point, zVals, COLOR_MAGENTA, 0.45, -U_RANGE, U_RANGE, STEPS));

        // 辅助：立方体边界参考
        const boxSize = 2.55;
        const boxGeom = new THREE.BoxGeometry(boxSize * 2, boxSize * 2, boxSize * 2);
        const boxEdges = new THREE.EdgesGeometry(boxGeom);
        const boxLine = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.15, depthWrite: true, depthTest: true
        }));
        rootGroup.add(boxLine);

        console.log('三正交直纹编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.17;
            rootGroup.rotation.y = t * 0.28;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.9;
            const camAngle = t * 0.08;
            const camHeight = 2.9 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        scheduleFrame();

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 三正交双曲抛物面直纹编织动画已稳定运行');
    </script>
</body>
</html>
