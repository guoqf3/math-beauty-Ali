<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三向螺旋网络 · 空间编织交响</title>
    <style>
        :root {
            --bg: #04080d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 40px rgba(200, 180, 150, 0.5),
                0 0 72px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.55rem, 1.0vw, 0.7rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }

        #formula-overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 8, 13, 0.7);
            padding: 11px 23px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            max-width: 95vw;
        }

        #formula-overlay .formula {
            font-size: clamp(0.48rem, 0.85vw, 0.68rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.28);
            line-height: 1.6;
            white-space: nowrap;
        }

        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }

        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 12px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.4rem;
                white-space: normal;
                line-height: 1.4;
            }
            #title-overlay .title {
                font-size: 0.76rem;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="title-overlay">
        <div class="title">三向螺旋网络 · 空间编织交响</div>
        <div class="subtitle">TRIPLY ORTHOGONAL HELICAL NETWORK &nbsp;·&nbsp; SPATIAL WEAVE</div>
    </div>

    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">Γₓ:</span> (t,&nbsp;R·cos(ωₓt+φ),&nbsp;R·sin(ωₓt+φ))&nbsp;
            <span class="c2">Γᵧ:</span> (R·sin(ωᵧt+ψ),&nbsp;t,&nbsp;R·cos(ωᵧt+ψ))
            <br>
            <span class="c3">Γₙ:</span> (R·cos(ωₙt+χ),&nbsp;R·sin(ωₙt+χ),&nbsp;t)&nbsp;
            <span style="color:#9aa8b8;">t∈[−3,3]&nbsp;|&nbsp;R∈[0.9,2.5]&nbsp;|&nbsp;12×3=36线</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#04080d');
        scene.fog = new THREE.Fog('#04080d', 7, 20);

        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            26
        );
        camera.position.set(2.2, 1.6, 8.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色定义 ====================
        const COLOR_WARM_GOLD = '#d4885c';
        const COLOR_ICE_BLUE = '#5d9ec6';
        const COLOR_ROSE = '#c77d9f';
        const COLOR_FRAME = '#4a5868';
        const COLOR_CIRCLE = '#3d4d5d';
        const COLOR_GLINT = '#8898a8';

        // ==================== 常量 ====================
        const CUBE_HALF = 3.0;
        const T_MIN = -CUBE_HALF;
        const T_MAX = CUBE_HALF;
        const SAMPLES_PER_HELIX = 320;

        // ==================== 创建单条螺旋线的几何体 ====================
        function createHelixGeometry(axis, R, omega, phi, numSamples) {
            const positions = new Float32Array((numSamples + 1) * 3);
            const dt = (T_MAX - T_MIN) / numSamples;
            for (let i = 0; i <= numSamples; i++) {
                const t = T_MIN + i * dt;
                const cosVal = Math.cos(omega * t + phi);
                const sinVal = Math.sin(omega * t + phi);
                const idx = i * 3;
                if (axis === 'x') {
                    positions[idx] = t;
                    positions[idx + 1] = R * cosVal;
                    positions[idx + 2] = R * sinVal;
                } else if (axis === 'y') {
                    positions[idx] = R * sinVal;
                    positions[idx + 1] = t;
                    positions[idx + 2] = R * cosVal;
                } else if (axis === 'z') {
                    positions[idx] = R * cosVal;
                    positions[idx + 1] = R * sinVal;
                    positions[idx + 2] = t;
                }
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            return geometry;
        }

        // ==================== 创建一组螺旋线 ====================
        function createHelixGroup(axis, colorHex, numLines, omegaFast, omegaSlow, opacity) {
            const group = new THREE.Group();
            const radii = [];
            const halfN = Math.floor(numLines / 2);
            for (let k = 0; k < numLines; k++) {
                const R = 0.9 + (k / (numLines - 1)) * 1.6;
                radii.push(R);
            }
            for (let k = 0; k < numLines; k++) {
                const R = radii[k];
                const phi = (k / numLines) * Math.PI * 2;
                const omega = k < halfN ? omegaFast : omegaSlow;
                const geom = createHelixGeometry(axis, R, omega, phi, SAMPLES_PER_HELIX);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                const line = new THREE.Line(geom, mat);
                group.add(line);
            }
            group.userData = { axis, numLines };
            return group;
        }

        // ==================== 创建立方体线框 ====================
        function createCubeWireframe(half, colorHex, opacity) {
            const h = half;
            const corners = [
                new THREE.Vector3(-h, -h, -h),
                new THREE.Vector3(h, -h, -h),
                new THREE.Vector3(h, h, -h),
                new THREE.Vector3(-h, h, -h),
                new THREE.Vector3(-h, -h, h),
                new THREE.Vector3(h, -h, h),
                new THREE.Vector3(h, h, h),
                new THREE.Vector3(-h, h, h),
            ];
            const edges = [
                [0, 1],
                [1, 2],
                [2, 3],
                [3, 0],
                [4, 5],
                [5, 6],
                [6, 7],
                [7, 4],
                [0, 4],
                [1, 5],
                [2, 6],
                [3, 7]
            ];
            const group = new THREE.Group();
            for (const [i, j] of edges) {
                const geom = new THREE.BufferGeometry().setFromPoints([corners[i], corners[j]]);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            // 顶点光点（小十字）
            const starSize = 0.12;
            for (const v of corners) {
                const crossGroup = new THREE.Group();
                const pairs = [
                    [v.clone().add(new THREE.Vector3(-starSize, 0, 0)), v.clone().add(new THREE.Vector3(starSize, 0,
                        0))],
                    [v.clone().add(new THREE.Vector3(0, -starSize, 0)), v.clone().add(new THREE.Vector3(0, starSize,
                        0))],
                    [v.clone().add(new THREE.Vector3(0, 0, -starSize)), v.clone().add(new THREE.Vector3(0, 0,
                    starSize))],
                ];
                for (const [a, b] of pairs) {
                    const sg = new THREE.BufferGeometry().setFromPoints([a, b]);
                    const sm = new THREE.LineBasicMaterial({
                        color: new THREE.Color(COLOR_GLINT),
                        transparent: true,
                        opacity: 0.55,
                        depthWrite: true,
                    });
                    crossGroup.add(new THREE.Line(sg, sm));
                }
                group.add(crossGroup);
            }
            return group;
        }

        // ==================== 创建参考坐标圆 ====================
        function createReferenceCircles(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segments = 180;
            const circleDefs = [
                { plane: 'xy', gen: (a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0) },
                { plane: 'xz', gen: (a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius) },
                { plane: 'yz', gen: (a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius) },
            ];
            for (const def of circleDefs) {
                const pts = [];
                for (let i = 0; i <= segments; i++) {
                    const a = (i / segments) * Math.PI * 2;
                    pts.push(def.gen(a));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // ==================== 构建场景 ====================
        const rootGroup = new THREE.Group();
        scene.add(rootGroup);

        // 三个螺旋线子组
        const groupX = createHelixGroup('x', COLOR_WARM_GOLD, 12, 2.3, 1.6, 0.7);
        const groupY = createHelixGroup('y', COLOR_ICE_BLUE, 12, 1.9, 2.7, 0.68);
        const groupZ = createHelixGroup('z', COLOR_ROSE, 12, 2.1, 1.4, 0.72);

        rootGroup.add(groupX);
        rootGroup.add(groupY);
        rootGroup.add(groupZ);

        // 立方体框架
        const cubeFrame = createCubeWireframe(CUBE_HALF, COLOR_FRAME, 0.38);
        rootGroup.add(cubeFrame);

        // 参考坐标圆
        const refCircles = createReferenceCircles(CUBE_HALF, COLOR_CIRCLE, 0.25);
        rootGroup.add(refCircles);

        console.log('螺旋线总数:', groupX.userData.numLines + groupY.userData.numLines + groupZ.userData.numLines);
        console.log('每组螺旋线采样点数:', SAMPLES_PER_HELIX + 1);

        // ==================== 动画循环（绝对时间基准） ====================
        const startTime = performance.now();
        let frameCount = 0;
        let lastLogTime = 0;
        let currentTime = 0;

        // 旋转速度（弧度/秒）
        const rootSpeedY = 0.28;
        const rootSpeedX = 0.12;
        const speedGroupX = 0.38;
        const speedGroupY = -0.34;
        const speedGroupZ = 0.30;

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const elapsed = (timestamp - startTime) / 1000;
            if (elapsed <= 0) {
                renderer.render(scene, camera);
                return;
            }
            currentTime = elapsed;
            frameCount++;

            if (timestamp - lastLogTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${currentTime.toFixed(2)}s`);
                lastLogTime = timestamp;
            }

            // 根组绕对角线旋转
            rootGroup.rotation.y = currentTime * rootSpeedY;
            rootGroup.rotation.x = currentTime * rootSpeedX;
            rootGroup.rotation.z = Math.sin(currentTime * 0.22) * 0.35;

            // 三个子组绕各自主轴旋转
            groupX.rotation.x = currentTime * speedGroupX + Math.sin(currentTime * 0.31) * 0.3;
            groupY.rotation.y = currentTime * speedGroupY + Math.cos(currentTime * 0.27) * 0.28;
            groupZ.rotation.z = currentTime * speedGroupZ + Math.sin(currentTime * 0.34) * 0.32;

            // 参考框架微动
            refCircles.rotation.y += 0.0012;
            refCircles.rotation.x += 0.0008;

            // 相机柔和游走
            const camX = 2.2 + Math.sin(currentTime * 0.14) * 0.6;
            const camY = 1.6 + Math.cos(currentTime * 0.18) * 0.5;
            const camZ = 8.5 + Math.sin(currentTime * 0.11) * 0.55;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

        // ==================== 启动 ====================
        console.log('=== 三向螺旋网络 · 空间编织交响 ===');
        console.log('暖金螺旋线(x轴):', groupX.userData.numLines);
        console.log('冰蓝螺旋线(y轴):', groupY.userData.numLines);
        console.log('玫瑰粉螺旋线(z轴):', groupZ.userData.numLines);
        console.log('总螺旋线数:', groupX.userData.numLines + groupY.userData.numLines + groupZ.userData.numLines);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        // 预热渲染
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
