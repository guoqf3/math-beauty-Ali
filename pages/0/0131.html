<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪球面渐近线网 · Bäcklund变换 · 双曲空间等距</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d6a745;
            --cyan: #3cbca4;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.6vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.62rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.85rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.54rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3cbca4;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <h1>伪球面渐近线网 · Bäcklund变换 · 双曲空间等距</h1>
        <div class="subtitle">Tractricoid 渐近线族 &nbsp;·&nbsp; Bäcklund参数演化 &nbsp;·&nbsp; 球极逆投影编织</div>
    </div>
    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">K = −1/c²</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">Bäcklund: ∂<sub>ξ</sub>θ = sin(θ)cos(θ)/c</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">π<sup>−1</sup>: ℝ³⊃Σ → S²</span>
        </div>
        <div class="formula-detail">
            伪球面(Tractricoid)常负曲率 &nbsp;·&nbsp; Bäcklund变换生成渐近线网 &nbsp;·&nbsp; 坐标球极逆投影
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.5, 32);
        camera.position.set(2.3, 1.4, 7.7);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3cbca4');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.8;

        // ---------- 背景星点 ----------
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 150;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.3 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSizes[i] = Math.random() * 1.6 + 0.22;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.018,
            transparent: true,
            opacity: 0.46,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 50, 34);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.07, depthWrite: false })
        );
        scene.add(refSphereWire);

        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 28);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.06, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- 伪球面工具 ----------
        // 伪球面参数化: x = c * sech(u/c) * cos(v), y = c * sech(u/c) * sin(v), z = c * (u/c - tanh(u/c))
        // 常负曲率 K = -1/c^2, 这里c=1简化
        const C = 1.0;
        function pseudoSphere(u, v) {
            const sech = 1 / Math.cosh(u / C);
            const x = C * sech * Math.cos(v);
            const y = C * sech * Math.sin(v);
            const z = C * (u / C - Math.tanh(u / C));
            return [x, y, z];
        }

        // 逆球极投影: 将3D点投影到半径2.4的球面上，然后钳制。实际上直接将伪球面点映射到球面上：dx, dy, dz 归一化到半径2.4
        function toSpherePt(p) {
            const r = Math.sqrt(p[0] ** 2 + p[1] ** 2 + p[2] ** 2);
            if (r < 0.001) return [0, 0, 0];
            const scale = 2.5 / r;
            return [p[0] * scale, p[1] * scale, p[2] * scale];
        }

        function clampPt(p) {
            const r = Math.sqrt(p[0] ** 2 + p[1] ** 2 + p[2] ** 2);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const s = CLAMP_RADIUS / r;
                return [p[0] * s, p[1] * s, p[2] * s];
            }
            return p;
        }

        // Bäcklund 变换生成渐近线：给定一条曲线（可以是经线或斜线），通过求解微分方程得到另一条渐近线。
        // 这里直接生成一族渐近线：参数化 (u, v) 满足 v = const + arcsinh(sinh(u/c)*tan(alpha))? 简化：直接使用直线在(u,v)平面上的投影作为渐近线近似。
        // 更准确地，伪球面上的渐近线对应于切平面与曲面交线。可以直接在参数域取直线 v = a*u + b，然后映射到伪球面，这会产生测地线/渐近线？实际上伪球面的渐近线是那些满足 du/dv = ±sinh(u) 的曲线。所以可以积分 du/dv = ±sinh(u) 获得。

        // 积分 du/dv = sinh(u) 得到 v = ∫ du/sinh(u) = ln|tanh(u/2)| + C，或 du/dv = -sinh(u) 得到 v = -ln|tanh(u/2)| + C。
        // 所以渐近线方程：v = ±ln(tanh(u/2)) + const。这提供丰富的u参数曲线。

        const LINE_POINTS = 100;
        function generateAsymptotic(uMin, uMax, sign, vShift) {
            const pts = [];
            const uStep = (uMax - uMin) / (LINE_POINTS - 1);
            for (let i = 0; i < LINE_POINTS; i++) {
                const u = uMin + i * uStep;
                const tanhHalf = Math.tanh(u / 2);
                if (tanhHalf <= 0) {
                    pts.push(null);
                    continue;
                }
                const v = sign * Math.log(tanhHalf) + vShift;
                if (!isFinite(v)) { pts.push(null); continue; }
                const p = pseudoSphere(u, v);
                if (!p || p.some(x => !isFinite(x))) { pts.push(null); continue; }
                pts.push(p);
            }
            return pts;
        }

        // 创建曲线
        const allCurves = [];
        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(LINE_POINTS * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({ color, linewidth: 1, transparent: true, opacity: 0.83,
                depthTest: true, depthWrite: true });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geom, positions, updateFn: null };
            allCurves.push(obj);
            return obj;
        }

        // 生成三族曲线：金色族 (sign=+1, vShift范围), 青色族 (sign=-1, vShift范围), 玫瑰族 (加入额外的u位移)
        const uMin = 0.15, uMax = 2.8;
        const goldShifts = [];
        const cyanShifts = [];
        const roseShifts = [];
        for (let s = -4; s <= 4; s += 0.45) {
            goldShifts.push(s);
            cyanShifts.push(s + 0.2);
        }
        for (let s = -3.5; s <= 3.5; s += 0.5) roseShifts.push(s);

        function buildCurveGroup(shifts, sign, color) {
            for (const vShift of shifts) {
                const curve = createCurve(color);
                curve.updateFn = (t) => {
                    // 加入动态u范围变化或旋转？可以对伪球面进行整体SO(3)旋转。
                    const positions = curve.positions;
                    const angle = t * 0.25;
                    const rotAxis = [Math.cos(t * 0.17), Math.sin(t * 0.13), Math.cos(t * 0.19 + 1.3)];
                    const axNorm = Math.sqrt(rotAxis[0] ** 2 + rotAxis[1] ** 2 + rotAxis[2] ** 2) || 1;
                    const ux = rotAxis[0] / axNorm, uy = rotAxis[1] / axNorm, uz = rotAxis[2] / axNorm;
                    const c = Math.cos(angle), s = Math.sin(angle), t1 = 1 - c;
                    const R = [
                        c + ux * ux * t1, ux * uy * t1 - uz * s, ux * uz * t1 + uy * s,
                        uy * ux * t1 + uz * s, c + uy * uy * t1, uy * uz * t1 - ux * s,
                        uz * ux * t1 - uy * s, uz * uy * t1 + ux * s, c + uz * uz * t1,
                    ];
                    const pts = generateAsymptotic(uMin, uMax, sign, vShift);
                    for (let i = 0; i < LINE_POINTS; i++) {
                        let p = pts[i];
                        if (!p) p = [0, 0, 0];
                        // 映射到球面
                        p = toSpherePt(p);
                        // 旋转
                        const rx = R[0] * p[0] + R[1] * p[1] + R[2] * p[2];
                        const ry = R[3] * p[0] + R[4] * p[1] + R[5] * p[2];
                        const rz = R[6] * p[0] + R[7] * p[1] + R[8] * p[2];
                        p = clampPt([rx, ry, rz]);
                        positions[i * 3] = p[0];
                        positions[i * 3 + 1] = p[1];
                        positions[i * 3 + 2] = p[2];
                    }
                    curve.geom.attributes.position.needsUpdate = true;
                };
            }
        }
        buildCurveGroup(goldShifts, 1, colorGold);
        buildCurveGroup(cyanShifts, -1, colorCyan);
        // 玫瑰族: 混合sign和额外动态
        for (const vShift of roseShifts) {
            const curve = createCurve(colorRose);
            curve.updateFn = (t) => {
                const positions = curve.positions;
                const angle = t * 0.22;
                const rotAxis = [Math.sin(t * 0.2), Math.cos(t * 0.15), Math.sin(t * 0.25)];
                const axNorm = Math.sqrt(rotAxis[0] ** 2 + rotAxis[1] ** 2 + rotAxis[2] ** 2) || 1;
                const ux = rotAxis[0] / axNorm,
                    uy = rotAxis[1] / axNorm,
                    uz = rotAxis[2] / axNorm;
                const cs = Math.cos(angle),
                    sn = Math.sin(angle),
                    t1 = 1 - cs;
                const R = [
                    cs + ux * ux * t1, ux * uy * t1 - uz * sn, ux * uz * t1 + uy * sn,
                    uy * ux * t1 + uz * sn, cs + uy * uy * t1, uy * uz * t1 - ux * sn,
                    uz * ux * t1 - uy * sn, uz * uy * t1 + ux * sn, cs + uz * uz * t1,
                ];
                const sign = (vShift % 1 > 0.5) ? 1 : -1; // 交替符号
                const pts = generateAsymptotic(uMin, uMax, sign, vShift);
                for (let i = 0; i < LINE_POINTS; i++) {
                    let p = pts[i];
                    if (!p) p = [0, 0, 0];
                    p = toSpherePt(p);
                    const rx = R[0] * p[0] + R[1] * p[1] + R[2] * p[2];
                    const ry = R[3] * p[0] + R[4] * p[1] + R[5] * p[2];
                    const rz = R[6] * p[0] + R[7] * p[1] + R[8] * p[2];
                    p = clampPt([rx, ry, rz]);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geom.attributes.position.needsUpdate = true;
            };
        }

        console.log(`曲线总数: ${allCurves.length} (金${goldShifts.length}, 青${cyanShifts.length}, 玫红${roseShifts.length})`);

        // ---------- 流动粒子 ----------
        const particleCount = 18;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                curveIndex: i % allCurves.length,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0025,
            });
            let col;
            if (i < 6) col = colorGold.clone();
            else if (i < 12) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.048,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const curveObj = allCurves[pd.curveIndex];
                if (!curveObj || !curveObj.positions) continue;
                const posArr = curveObj.positions;
                const floatIdx = pd.progress * (LINE_POINTS - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, LINE_POINTS - 1);
                const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                const i0 = idx0 * 3,
                    i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        function safeUpdateCurves(t) {
            for (const curve of allCurves) {
                try { if (curve.updateFn) curve.updateFn(t); } catch (e) {
                    console.warn('曲线更新异常:', e);
                }
            }
        }

        // ---------- 健壮的动画循环 ----------
        const clock = new THREE.Clock();
        let animTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animTime += dt;
                frameCount++;
                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${animTime.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }
                safeUpdateCurves(animTime);
                updateParticles();
                const breathe = 1 + 0.04 * Math.sin(animTime * 0.38) * Math.cos(animTime * 0.28);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.055;
                refSphereWire.rotation.y += dt * 0.045;
                refTorusWire.rotation.z += dt * 0.055;
                const torBreathe = 1 + 0.05 * Math.sin(animTime * 0.42) * Math.cos(animTime * 0.31);
                refTorusWire.scale.setScalar(torBreathe);
                const camH = animTime * 0.09;
                const camV = 0.33 + 0.17 * Math.sin(animTime * 0.14);
                const camD = 7.4 + 0.6 * Math.sin(animTime * 0.19) * Math.cos(animTime * 0.25);
                camera.position.set(camD * Math.cos(camV) * Math.sin(camH), camD * Math.sin(camV), camD * Math.cos(camV) *
                    Math.cos(camH));
                camera.lookAt(0.05 * Math.sin(animTime * 0.09), 0.03 * Math.cos(animTime * 0.12), 0);
                stars.rotation.y += dt * 0.013;
                stars.rotation.x += dt * 0.009;
                renderer.render(scene, camera);
            } catch (e) { console.error('动画循环异常:', e); }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') clock.getDelta();
        });

        // 启动
        console.log('🚀 伪球面渐近线网动画初始化...');
        safeUpdateCurves(0);
        updateParticles();
        renderer.render(scene, camera);
        clock.start();
        animTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环启动，伪球面渐近线网持续编织');
    </script>
</body>
</html>
