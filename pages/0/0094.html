<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面拟周期编织 · 椭圆模线</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>球面拟周期编织 · 椭圆模线</h2>
        <div class="sub">Quasiperiodic spherical braids · Jacobi‑like modulation</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">θ = a₁t + ε₁ sin(ω₁t)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">φ = a₂t + ε₂ cos(ω₂t)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">r(t) = (sinθ cosφ, sinθ sinφ, cosθ)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.3, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——彻底杜绝暂停
        let startTime = performance.now();
        let elapsed = 0;
        function tick() { elapsed = (performance.now() - startTime) * 0.001; return elapsed; }

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.9;
        const T_MAX = 12 * Math.PI;
        const POINTS = 600;

        // 球面曲线生成器
        function sphericalCurve(thetaFunc, phiFunc, tMax, steps) {
            const pts = [];
            const dt = tMax / steps;
            for (let i = 0; i <= steps; i++) {
                const t = i * dt;
                const theta = thetaFunc(t);
                const phi = phiFunc(t);
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(
                    SPHERE_R * st * Math.cos(phi),
                    SPHERE_R * st * Math.sin(phi),
                    SPHERE_R * Math.cos(theta)
                ));
            }
            return pts;
        }

        // 生成一族曲线（参数偏移）
        function createCurveFamily(baseTheta, basePhi, color, count, opacity) {
            const group = new THREE.Group();
            for (let k = 0; k < count; k++) {
                const phaseT = k * Math.PI / 7;
                const phaseF = k * Math.PI / 5;
                const amplT = 0.2 + k * 0.04;
                const amplF = 0.2 + k * 0.03;
                const freqT = 3.5 + k * 0.15;
                const freqF = 2.5 + k * 0.18;

                const thetaFn = t => baseTheta(t) + amplT * Math.sin(freqT * t + phaseT);
                const phiFn = t => basePhi(t) + amplF * Math.cos(freqF * t + phaseF);

                const pts = sphericalCurve(thetaFn, phiFn, T_MAX, POINTS);
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // 基础函数定义
        const goldBaseTheta = t => 2.0 * t;
        const goldBasePhi   = t => 3.1 * t;
        const cyanBaseTheta = t => 3.2 * t;
        const cyanBasePhi   = t => 1.8 * t;
        const magentaBaseTheta = t => 1.5 * t;
        const magentaBasePhi   = t => 4.3 * t;

        const rootGroup = new THREE.Group();
        rootGroup.name = 'spherical-braid';
        scene.add(rootGroup);

        rootGroup.add(createCurveFamily(goldBaseTheta, goldBasePhi, COLOR_GOLD, 45, 0.82));
        rootGroup.add(createCurveFamily(cyanBaseTheta, cyanBasePhi, COLOR_CYAN, 45, 0.82));
        rootGroup.add(createCurveFamily(magentaBaseTheta, magentaBasePhi, COLOR_MAGENTA, 45, 0.82));

        console.log('球面拟周期曲线总数:', rootGroup.children.length);

        // ---- 背景星点 ----
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            tick();
            const t = elapsed;
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.4 + Math.sin(t * 0.15) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保画面立即出现
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 球面拟周期椭圆模线动画已稳定运行');
    </script>
</body>
</html>
