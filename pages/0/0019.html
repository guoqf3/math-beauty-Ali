<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hénon‑Heiles编织 · 混沌轨道网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Hénon‑Heiles编织 · 混沌轨道网</h2>
        <div class="sub">Hénon‑Heiles potential · Poincaré sections · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">E∈[0.04,0.08] 规则区</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">E∈[0.08,0.12] 过渡区</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">E∈[0.12,0.16] 混沌区</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.3, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.65;
        const PROJ_D = 2.2;
        const SCALE_XY = 1.6;
        const DT = 0.025;
        const MAX_STEPS = 550;

        // 球极投影
        function stereographic(px, py) {
            const d = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / d,
                2 * PROJ_D * py / d,
                (px * px + py * py - PROJ_D * PROJ_D) / d
            ).multiplyScalar(SPHERE_R);
        }

        // Hénon-Heiles 向量场
        function henonHeilesFlow(x, y, vx, vy) {
            return {
                ax: -x - 2 * x * y,
                ay: -y - x * x + y * y,
                vx: vx,
                vy: vy
            };
        }

        // RK4 积分一步
        function rk4Step(state) {
            const f = (s) => {
                const acc = henonHeilesFlow(s.x, s.y, s.vx, s.vy);
                return { dx: s.vx, dy: s.vy, dvx: acc.ax, dvy: acc.ay };
            };
            const k1 = f(state);
            const s2 = { x: state.x + k1.dx * DT * 0.5, y: state.y + k1.dy * DT * 0.5, vx: state.vx + k1.dvx * DT * 0.5, vy: state.vy + k1.dvy * DT * 0.5 };
            const k2 = f(s2);
            const s3 = { x: state.x + k2.dx * DT * 0.5, y: state.y + k2.dy * DT * 0.5, vx: state.vx + k2.dvx * DT * 0.5, vy: state.vy + k2.dvy * DT * 0.5 };
            const k3 = f(s3);
            const s4 = { x: state.x + k3.dx * DT, y: state.y + k3.dy * DT, vx: state.vx + k3.dvx * DT, vy: state.vy + k3.dvy * DT };
            const k4 = f(s4);
            return {
                x: state.x + (k1.dx + 2*k2.dx + 2*k3.dx + k4.dx) * DT / 6,
                y: state.y + (k1.dy + 2*k2.dy + 2*k3.dy + k4.dy) * DT / 6,
                vx: state.vx + (k1.dvx + 2*k2.dvx + 2*k3.dvx + k4.dvx) * DT / 6,
                vy: state.vy + (k1.dvy + 2*k2.dvy + 2*k3.dvy + k4.dvy) * DT / 6
            };
        }

        // 能量计算
        function energy(x, y, vx, vy) {
            return 0.5 * (vx*vx + vy*vy) + 0.5 * (x*x + y*y) + x*x*y - y*y*y/3;
        }

        // 生成轨道
        function traceOrbit(x0, y0, vx0, vy0, maxSteps) {
            let s = { x: x0, y: y0, vx: vx0, vy: vy0 };
            const pts = [];
            for (let i = 0; i < maxSteps; i++) {
                const px = s.x * SCALE_XY;
                const py = s.y * SCALE_XY;
                if (Math.abs(px) < 8 && Math.abs(py) < 8) {
                    const sp = stereographic(px, py);
                    if (sp && sp.length() < 9.5) pts.push(sp);
                }
                s = rk4Step(s);
                if (Math.abs(s.x) > 6 || Math.abs(s.y) > 6) break;
            }
            return pts;
        }

        // 生成一族轨道
        function createOrbitFamily(energyRange, count, color, opacity) {
            const group = new THREE.Group();
            for (let i = 0; i < count; i++) {
                const targetE = energyRange[0] + Math.random() * (energyRange[1] - energyRange[0]);
                // 随机选择初始条件满足能量约束
                const x0 = (Math.random() - 0.5) * 0.6;
                const y0 = (Math.random() - 0.5) * 0.6;
                const pot = 0.5*(x0*x0 + y0*y0) + x0*x0*y0 - y0*y0*y0/3;
                const ke = targetE - pot;
                if (ke <= 0) { i--; continue; }
                const speed = Math.sqrt(2 * ke);
                const angle = Math.random() * 2 * Math.PI;
                const vx0 = speed * Math.cos(angle);
                const vy0 = speed * Math.sin(angle);

                const pts = traceOrbit(x0, y0, vx0, vy0, MAX_STEPS);
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'henon-heiles-weave';
        scene.add(rootGroup);

        // 金色族：低能量轨道（规则区）
        rootGroup.add(createOrbitFamily([0.04, 0.08], 32, COLOR_GOLD, 0.55));
        rootGroup.add(createOrbitFamily([0.05, 0.07], 12, COLOR_GOLD, 0.35));

        // 青色族：中等能量轨道（过渡区）
        rootGroup.add(createOrbitFamily([0.08, 0.12], 32, COLOR_CYAN, 0.55));
        rootGroup.add(createOrbitFamily([0.09, 0.11], 12, COLOR_CYAN, 0.35));

        // 品红族：高能量轨道（混沌区）
        rootGroup.add(createOrbitFamily([0.12, 0.16], 32, COLOR_MAGENTA, 0.55));
        rootGroup.add(createOrbitFamily([0.13, 0.15], 12, COLOR_MAGENTA, 0.35));

        console.log('Hénon-Heiles轨道总数:', rootGroup.children.length);

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 稳定动画循环（仅旋转，无需每帧更新几何体）
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.26;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.4 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Hénon-Heiles混沌轨道编织动画已稳定运行');
    </script>
</body>
</html>
