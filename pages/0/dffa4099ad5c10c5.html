<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRING · 琴弦粒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a14;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            right: 32px;
            z-index: 2;
            text-align: right;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(225, 220, 240, 0.8);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(140, 120, 210, 0.4);
        }

        .hint {
            color: rgba(180, 175, 205, 0.5);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
                right: 20px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.22em;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <div class="title">Strings</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            // ─── 画布初始化 ───────────────────────────────────────────────
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let strings = [];      // 每条弦的基本信息 {baseY, phase}
            let particles = [];    // 粒子对象
            let ripples = [];      // 波纹效果
            let mouse = { x: -9999, y: -9999, active: false };
            let time = 0;
            let colorShift = 0;   // 点击切换色相偏移

            // 性能参数
            const STRING_COUNT = () => Math.max(18, Math.min(40, Math.floor(H / 36)));
            const PARTICLES_PER_STRING = 7;
            const STRING_SAMPLE_POINTS = 70;  // 每条弦路径采样点数

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0a0a14';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 初始化弦 ───────────────────────────────────────────────
            function initStrings() {
                const count = STRING_COUNT();
                strings = [];
                for (let j = 0; j < count; j++) {
                    strings.push({
                        baseY: 30 + j * (H - 60) / (count - 1),
                        phase: Math.random() * Math.PI * 2,
                        amp1: 6 + Math.random() * 10,
                        amp2: 4 + Math.random() * 8,
                        freq1: 0.002 + Math.random() * 0.003,
                        freq2: 0.0015 + Math.random() * 0.002,
                        speed1: 0.5 + Math.random() * 0.8,
                        speed2: 0.3 + Math.random() * 0.7,
                    });
                }
            }

            // ─── 初始化粒子 ───────────────────────────────────────────────
            function initParticles() {
                particles = [];
                const count = strings.length;
                for (let j = 0; j < count; j++) {
                    for (let k = 0; k < PARTICLES_PER_STRING; k++) {
                        particles.push({
                            stringIndex: j,
                            t: Math.random(),  // 0-1 位置
                            speed: (0.15 + Math.random() * 0.3) * (Math.random() > 0.5 ? 1 : -1),
                            size: 1.8 + Math.random() * 2.5,
                            hueOffset: Math.random() * 60 - 30,
                            brightness: 0.7 + Math.random() * 0.3,
                        });
                    }
                }
            }

            // ─── 计算弦上某一点的Y坐标 ──────────────────────────────────
            function getStringY(stringIndex, x, t) {
                const s = strings[stringIndex];
                if (!s) return 0;

                let y = s.baseY;

                // 基础振动
                y += Math.sin(x * s.freq1 + t * s.speed1 + s.phase) * s.amp1;
                y += Math.cos(x * s.freq2 + t * s.speed2 + s.phase * 0.7) * s.amp2;

                // 鼠标扰动
                if (mouse.active) {
                    const dx = x - mouse.x;
                    const dy = s.baseY - mouse.y;
                    const distSq = dx * dx + dy * dy;
                    const influenceRadiusSq = 100 * 100;
                    if (distSq < influenceRadiusSq) {
                        const dist = Math.sqrt(distSq);
                        const falloff = 1 - dist / 100;
                        const mouseInfluence = falloff * falloff * 45;
                        y += mouseInfluence * (mouse.y > s.baseY ? 1 : -1);
                    }
                }

                // 波纹影响
                for (const r of ripples) {
                    const dx = x - r.x;
                    const dy = s.baseY - r.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const bandWidth = 50 + r.radius * 0.2;
                    const innerR = Math.max(0, r.radius - bandWidth);
                    const outerR = r.radius + bandWidth;
                    if (dist > innerR && dist < outerR) {
                        const intensity = (1 - Math.abs(dist - r.radius) / bandWidth) * r.strength;
                        y += Math.sin(dist * 0.03 - time * 2) * intensity * 25;
                    }
                }

                return y;
            }

            // ─── 创建波纹 ───────────────────────────────────────────────
            function createRipple(x, y) {
                ripples.push({
                    x: x,
                    y: y,
                    radius: 10,
                    maxRadius: Math.max(W, H) * 0.7,
                    strength: 1.2,
                    decay: 0.012,
                    growth: 4.0 + Math.random() * 2.0,
                });
                if (ripples.length > 6) ripples.shift();
            }

            function updateRipples(dt) {
                for (let i = ripples.length - 1; i >= 0; i--) {
                    const r = ripples[i];
                    r.radius += r.growth * dt;
                    r.strength -= r.decay * dt;
                    if (r.strength <= 0 || r.radius > r.maxRadius) {
                        ripples.splice(i, 1);
                    }
                }
            }

            // ─── 绘制弦 ───────────────────────────────────────────────
            function drawStrings(ctx) {
                const sampleCount = STRING_SAMPLE_POINTS;
                for (let j = 0; j < strings.length; j++) {
                    const s = strings[j];
                    ctx.beginPath();
                    for (let si = 0; si <= sampleCount; si++) {
                        const x = (si / sampleCount) * W;
                        const y = getStringY(j, x, time);
                        if (si === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    // 弦颜色：蓝紫基调，随时间微变
                    const hue = 210 + colorShift + Math.sin(time * 0.5 + s.phase) * 20;
                    const sat = 50 + Math.sin(time * 0.7 + j) * 15;
                    const light = 40 + Math.sin(time * 0.6 + j * 0.5) * 15;
                    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, 0.7)`;
                    ctx.lineWidth = 1.2;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
            }

            // ─── 更新粒子位置并绘制 ────────────────────────────────────
            function updateAndDrawParticles(ctx, dt) {
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.t += p.speed * dt * 0.06;  // 速度缩放
                    if (p.t > 1) p.t -= 1;
                    if (p.t < 0) p.t += 1;

                    const s = strings[p.stringIndex];
                    if (!s) continue;

                    const x = p.t * W;
                    const y = getStringY(p.stringIndex, x, time);

                    // 粒子颜色：较亮，随位置和时间变化
                    const hue = (225 + colorShift + p.hueOffset + Math.sin(p.t * 10 + time) * 25) % 360;
                    const sat = 70 + Math.sin(p.t * 15 + time * 0.8) * 20;
                    const light = 60 + p.brightness * 20;
                    const alpha = 0.8;

                    // 光晕
                    const glowSize = p.size * 3.5;
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, glowSize);
                    gradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 10}%, ${alpha * 0.6})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(x, y, glowSize, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心亮点
                    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light + 15}%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(x, y, p.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 绘制波纹圆环 ───────────────────────────────────────────
            function drawRipples(ctx) {
                for (const r of ripples) {
                    const alpha = r.strength * 0.25;
                    const hue = 220 + colorShift + Math.sin(r.radius * 0.05) * 30;
                    ctx.strokeStyle = `hsla(${hue}, 65%, 75%, ${alpha})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 60;
                const hue = 230 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 65%, 75%, 0.08)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 55%, 70%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    updateRipples(fixedStep / 1000 * 60);
                }

                // 清除画布
                ctx.fillStyle = '#0a0a14';
                ctx.fillRect(0, 0, W, H);

                // 绘制弦
                drawStrings(ctx);

                // 更新并绘制粒子
                updateAndDrawParticles(ctx, dt);

                // 绘制波纹圆环
                drawRipples(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createRipple(mouse.x, mouse.y);
                // 切换色彩偏移
                colorShift += 35 + Math.random() * 30;
                if (colorShift > 140) colorShift = -30;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createRipple(mouse.x, mouse.y);
                    colorShift += 35 + Math.random() * 30;
                    if (colorShift > 140) colorShift = -30;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                setupCanvas();
                initStrings();
                initParticles();
                ripples = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initStrings();
                initParticles();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 确保初始背景填充
            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0a0a14';
                    ctx.fillRect(0, 0, W, H);
                }
            });

        })();
    </script>
</body>
</html>
