<body>

    <div class="sub">u ∈ [0, 2π] · v ∈ [0, 2π]</div>

    </div>

    <div class="ro-row"><span>坐标 y</span><b id="roY">—</b></div>
    <div class="ro-row hi"><span>坐标 z</span><b id="roZ">—</b></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0. 常量与全局状态
   ========================================================= */
const NU = 280;          // u 方向采样数（不含接缝）
const NV = 90;           // v 方向采样数

const state = {
  a: 2.00,               // 瓶体粗细
  c: 1.00,               // 瓶颈长度
  b: 1.00,               // 扭曲程度
  hoverPos: new THREE.Vector3(),
  hoverStrength: 0,
  hoverTarget: 0,
};

/* =========================================================
   1. 克莱因瓶参数方程
   ---------------------------------------------------------
   r = a + b·cos(u/2)sin(v) − b·sin(u/2)sin(2v)
   x = r·cos(u)
   y = r·sin(u)
   z = c·(sin(u/2)sin(v) + cos(u/2)sin(2v))
   ---------------------------------------------------------
   u ∈ [0, 2π] 时曲面通过 v → −v 翻转闭合，构成克莱因瓶。
   ========================================================= */
function kleinPoint(u, v, a, b, c) {
  const cu2 = Math.cos(u * 0.5);
  const su2 = Math.sin(u * 0.5);
  const sv  = Math.sin(v);
  const s2v = Math.sin(2 * v);

  const r = a + b * cu2 * sv - b * su2 * s2v;

  return [
    r * Math.cos(u),
    r * Math.sin(u),
    c * (su2 * sv + cu2 * s2v),
  ];
}

/* =========================================================
   2. 构建 BufferGeometry（逐顶点采样 + 接缝 v 翻转）
   ========================================================= */
function buildKleinGeometry(a, b, c) {
  const count = NU * NV;

  const positions = new Float32Array(count * 3);
  const uvs       = new Float32Array(count * 2);

  let p = 0;
  for (let i = 0; i < NU; i++) {
    const u = (i / NU) * Math.PI * 2;
    for (let j = 0; j < NV; j++) {
      const v = (j / NV) * Math.PI * 2;
      const [x, y, z] = kleinPoint(u, v, a, b, c);

      positions[p * 3]     = x;
      positions[p * 3 + 1] = y;
      positions[p * 3 + 2] = z;

      uvs[p * 2]     = i / NU;
      uvs[p * 2 + 1] = j / NV;

      p++;
    }
  }

  /* ---- 索引：接缝处 v 索引翻转 ---- */
  const indices = [];
  for (let i = 0; i < NU; i++) {
    for (let j = 0; j < NV; j++) {
      const jp1 = (j + 1) % NV;

      let A, B, C, D;

      if (i < NU - 1) {
        A = i * NV + j;
        B = (i + 1) * NV + j;
        C = (i + 1) * NV + jp1;
        D = i * NV + jp1;
      } else {
        /* u = 2π 处：(2π, v_j) ≡ (0, 2π − v_j) */
        const jB = (NV - j) % NV;
        const jC = (NV - j - 1 + NV) % NV;

        A = (NU - 1) * NV + j;
        B = jB;
        C = jC;
        D = (NU - 1) * NV + jp1;
      }

      indices.push(A, B, C);
      indices.push(A, C, D);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  geo.computeBoundingSphere();

  return geo;
}

/* =========================================================
   3. 场景 / 相机 / 渲染器
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050408);
scene.fog = new THREE.FogExp2(0x050408, 0.020);

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);
camera.position.set(6.2, 4.6, 6.8);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.062;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.95;
controls.panSpeed = 0.7;
controls.minDistance = 1.4;
controls.maxDistance = 42;
controls.target.set(0, 0, 0);

/* =========================================================
   4. 自定义着色器材质
   ========================================================= */
const uniforms = {
  uTime:          { value: 0 },
  uCamPos:        { value: new THREE.Vector3() },
  uHoverPos:      { value: new THREE.Vector3(0, 0, 0) },
  uHoverStrength: { value: 0 },
};

const vertexShader = /* glsl */`
  precision highp float;

  varying vec3 vWorldPos;
  varying vec3 vNormal;
  varying vec2 vUv;

  void main() {
    vUv = uv;

    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;

    mat3 m3 = mat3(
      modelMatrix[0].xyz,
      modelMatrix[1].xyz,
      modelMatrix[2].xyz
    );
    vNormal = normalize(m3 * normal);

    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const fragmentShader = /* glsl */`
  precision highp float;

  varying vec3 vWorldPos;
  varying vec3 vNormal;
  varying vec2 vUv;

  uniform float uTime;
  uniform vec3  uCamPos;
  uniform vec3  uHoverPos;
  uniform float uHoverStrength;

  vec3 hsv2rgb(vec3 c) {
    vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
    vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
    return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
  }

  void main() {
    vec3 N = normalize(vNormal);
    vec3 V = normalize(uCamPos - vWorldPos);

    /* 双面渲染：始终面向观察者 */
    if (dot(N, V) < 0.0) N = -N;

    float ndv  = clamp(dot(N, V), 0.0, 1.0);
    float fres = pow(1.0 - ndv, 2.35);

    /* ---- 虹彩基色 ---- */
    float hue = fract(
      vUv.x * 0.88 + vUv.y * 0.34 +
      fres * 0.32 + uTime * 0.016
    );
    vec3 base = hsv2rgb(vec3(hue, 0.66, 1.0));

    /* ---- 三向布光 ---- */
    vec3 L1 = normalize(vec3( 0.62,  0.95,  0.50));
    vec3 L2 = normalize(vec3(-0.60,  0.35, -0.78));
    vec3 L3 = normalize(vec3( 0.15, -0.92,  0.35));

    float d1 = max(dot(N, L1), 0.0);
    float d2 = max(dot(N, L2), 0.0);
    float d3 = max(dot(N, L3), 0.0);

    vec3 col = base * (0.40 + 0.62 * d1);
    col += base * vec3(0.46, 0.70, 1.00) * d2 * 0.58;
    col += base * vec3(1.00, 0.66, 0.86) * d3 * 0.42;

    /* ---- 高光 ---- */
    vec3 H1 = normalize(L1 + V);
    float spec1 = pow(max(dot(N, H1), 0.0), 110.0);
    col += vec3(1.0) * spec1 * 1.05;

    vec3 H2 = normalize(L2 + V);
    float spec2 = pow(max(dot(N, H2), 0.0), 55.0);
    col += vec3(0.90, 0.72, 1.00) * spec2 * 0.48;

    /* ---- 菲涅尔边缘辉光 ---- */
    col += vec3(0.48, 0.74, 1.00) * fres * 1.55;

    /* ---- 悬停高亮 ---- */
    float hd = distance(vWorldPos, uHoverPos);
    float hover = smoothstep(0.55, 0.06, hd) * uHoverStrength;
    col += vec3(1.00, 0.90, 0.62) * hover * (0.34 + 0.82 * fres);
    col = mix(col, col * 1.28 + vec3(0.24, 0.16, 0.04), hover * 0.48);

    gl_FragColor = vec4(col, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  side: THREE.DoubleSide,
  transparent: false,
});

/* =========================================================
   5. 网格
   ========================================================= */
const mesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
mesh.frustumCulled = false;
scene.add(mesh);

function rebuild() {
  const old = mesh.geometry;
  mesh.geometry = buildKleinGeometry(state.a, state.b, state.c);
  if (old) old.dispose();
}
rebuild();

/* =========================================================
   6. 背景星尘
   ========================================================= */
(function makeStars() {
  const N = 640;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();

  for (let i = 0; i < N; i++) {
    const r = 14 + Math.random() * 26;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);

    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = (Math.random() - 0.3) * 22;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);

    c.setHSL(0.72 + Math.random() * 0.18, 0.70, 0.55 + Math.random() * 0.3);
    col[i * 3] = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const m = new THREE.PointsMaterial({
    size: 0.06,
    vertexColors: true,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  const pts = new THREE.Points(g, m);
  scene.add(pts);
  window.__stars = pts;
})();

/* =========================================================
   7. 音频引擎
   ========================================================= */
let actx = null;
let masterGain = null;
let audioReady = false;

/* 环绕氛围 */
let ambientGain = null;
let ambientFilter = null;
let ambientOscs = [];
let ambientDelay = null;
let ambientFeedback = null;

function makeImpulse(ctx, seconds, decay) {
  const rate = ctx.sampleRate;
  const len = Math.floor(rate * seconds);
  const buf = ctx.createBuffer(2, len, rate);

  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

function initAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { actx = new AC(); } catch (e) { return; }
  if (actx.state === 'suspended') actx.resume();

  masterGain = actx.createGain();
  masterGain.gain.value = 0.48;
  masterGain.connect(actx.destination);

  /* ---- 空灵环绕：多正弦叠加 + 低通 + 反馈延迟 ---- */
  ambientGain = actx.createGain();
  ambientGain.gain.value = 0.0001;

  ambientFilter = actx.createBiquadFilter();
  ambientFilter.type = 'lowpass';
  ambientFilter.frequency.value = 720;
  ambientFilter.Q.value = 4.5;

  const baseFreqs = [55, 82.41, 110, 164.81, 220, 329.63];
  baseFreqs.forEach((f, i) => {
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    osc.detune.value = (i - 2.5) * 7;

    const g = actx.createGain();
    g.gain.value = 0.9 / (i + 1.2);

    osc.connect(g).connect(ambientFilter);
    osc.start();
    ambientOscs.push({ osc, gain: g });
  });

  /* 缓慢 LFO 调制滤波器 */
  const lfo = actx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.07;

  const lfoGain = actx.createGain();
  lfoGain.gain.value = 320;

  lfo.connect(lfoGain).connect(ambientFilter.frequency);
  lfo.start();

  /* 反馈延迟 —— 空间环绕感 */
  ambientDelay = actx.createDelay(1.2);
  ambientDelay.delayTime.value = 0.42;

  ambientFeedback = actx.createGain();
  ambientFeedback.gain.value = 0.42;

  const wetGain = actx.createGain();
  wetGain.gain.value = 0.48;

  ambientFilter.connect(ambientDelay);
  ambientDelay.connect(ambientFeedback);
  ambientFeedback.connect(ambientDelay);
  ambientDelay.connect(wetGain);
  wetGain.connect(ambientGain);
  ambientFilter.connect(ambientGain);

  ambientGain.connect(masterGain);

  audioReady = true;
}

/* ---- 点击瓶身：玻璃轻碰清脆音 ---- */
function playGlassClick() {
  if (!audioReady) return;
  const t = actx.currentTime;

  const base = 1680 + Math.random() * 920;

  const partials = [1.0, 2.37, 3.82, 5.21, 7.44, 9.87];
  const amps     = [0.42, 0.26, 0.16, 0.10, 0.06, 0.035];

  partials.forEach((ratio, i) => {
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(base * ratio, t);
    osc.frequency.exponentialRampToValueAtTime(base * ratio * 0.994, t + 0.6);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amps[i], t + 0.0025);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38 + i * 0.09);

    osc.connect(g).connect(masterGain);
    osc.start(t);
    osc.stop(t + 1.1);
  });

  /* 初始瞬态 */
  const tr = actx.createOscillator();
  tr.type = 'square';
  tr.frequency.setValueAtTime(base * 5.2, t);
  tr.frequency.exponentialRampToValueAtTime(base * 2.6, t + 0.018);

  const tg = actx.createGain();
  tg.gain.setValueAtTime(0.0001, t);
  tg.gain.exponentialRampToValueAtTime(0.055, t + 0.001);
  tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);

  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 3800;
  bp.Q.value = 2.2;

  tr.connect(bp).connect(tg).connect(masterGain);
  tr.start(t);
  tr.stop(t + 0.1);
}

/* ---- 调节粗细：电子滑音，音高随值增大而降低 ---- */
function playThicknessGlide(value, ascending) {
  if (!audioReady) return;
  const t = actx.currentTime;

  /* value ∈ [1.2, 3.0] → 频率与 value 成反比 */
  const baseFreq = 660 * (2.0 / value);

  const f0 = ascending ? baseFreq * 0.62 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.62;

  const osc1 = actx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(f0, t);
  osc1.frequency.exponentialRampToValueAtTime(f1, t + 0.16);

  const osc2 = actx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(f0 * 2.01, t);
  osc2.frequency.exponentialRampToValueAtTime(f1 * 2.01, t + 0.16);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1600 + 900 / value, t);
  lp.frequency.exponentialRampToValueAtTime(500 + 400 / value, t + 0.28);
  lp.Q.value = 6.5;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

  osc1.connect(lp);
  osc2.connect(g2).connect(lp);
  lp.connect(g).connect(masterGain);

  osc1.start(t); osc2.start(t);
  osc1.stop(t + 0.42); osc2.stop(t + 0.28);
}

/* ---- 调节瓶颈长度 / 扭曲程度：较柔和的电子滑音 ---- */
function playParamGlide(value, ascending, isNeck) {
  if (!audioReady) return;
  const t = actx.currentTime;

  const baseFreq = isNeck
    ? 220 + value * 180
    : 160 + value * 220;

  const f0 = ascending ? baseFreq * 0.78 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.78;

  const osc = actx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + 0.15);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2400, t);
  lp.frequency.exponentialRampToValueAtTime(700, t + 0.26);
  lp.Q.value = 5;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.115, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);

  osc.connect(lp).connect(g).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.36);
}

/* ---- 旋转环绕音调制 ---- */
const _prevCam = new THREE.Vector3().copy(camera.position);

function updateAmbient(dt) {
  if (!audioReady) return;

  const speed = camera.position.distanceTo(_prevCam) / Math.max(dt, 0.001);
  _prevCam.copy(camera.position);

  const n = Math.min(speed / 5.5, 1);
  const now = actx.currentTime;

  ambientGain.gain.setTargetAtTime(0.0001 + n * n * 0.14, now, 0.08);
  ambientFilter.frequency.setTargetAtTime(420 + n * 1500, now, 0.12);

  /* 延迟反馈随速度轻微上扬 */
  if (ambientFeedback) {
    ambientFeedback.gain.setTargetAtTime(0.36 + n * 0.16, now, 0.15);
  }
}

/* =========================================================
   8. 拾取与悬停
   ========================================================= */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(-10, -10);
const pointerScreen = { x: -1000, y: -1000 };

let isDragging = false;
let downPos = { x: 0, y: 0 };
let downTime = 0;

const el = renderer.domElement;

el.addEventListener('pointermove', (e) => {
  const rect = el.getBoundingClientRect();
  pointerScreen.x = e.clientX;
  pointerScreen.y = e.clientY;
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
});

el.addEventListener('pointerleave', () => {
  pointerNDC.set(-10, -10);
  state.hoverTarget = 0;
  clearReadout();
});

el.addEventListener('pointerdown', (e) => {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  isDragging = true;
  downPos.x = e.clientX;
  downPos.y = e.clientY;
  downTime = performance.now();
});

el.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const elapsed = performance.now() - downTime;
  isDragging = false;

  if (moved < 7 && elapsed < 650) {
    ensureAudio();

    const rect = el.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(mesh, false);
    if (hits.length > 0) {
      playGlassClick();
    }
  }
});

/* ---- 读数 DOM ---- */
const roU = document.getElementById('roU');
const roV = document.getElementById('roV');
const roX = document.getElementById('roX');
const roY = document.getElementById('roY');
const roZ = document.getElementById('roZ');

function clearReadout() {
  roU.textContent = '—';
  roV.textContent = '—';
  roX.textContent = '—';
  roY.textContent = '—';
  roZ.textContent = '—';
}

let pickCounter = 0;

function updateHover() {
  if (isDragging) {
    state.hoverTarget = 0;
    return;
  }

  pickCounter++;
  if (pickCounter % 3 !== 0) return;

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(mesh, false);

  if (hits.length === 0) {
    state.hoverTarget = 0;
    clearReadout();
    return;
  }

  const hit = hits[0];
  state.hoverTarget = 1;
  state.hoverPos.copy(hit.point);

  const p = hit.point;
  const rho = Math.hypot(p.x, p.y);

  /* 从坐标反推 u、v */
  let u = Math.atan2(p.y, p.x);
  if (u < 0) u += Math.PI * 2;

  roU.textContent = u.toFixed(3);
  roV.textContent = hit.uv
    ? (hit.uv.y * Math.PI * 2).toFixed(3)
    : '—';
  roX.textContent = p.x.toFixed(3);
  roY.textContent = p.y.toFixed(3);
  roZ.textContent = p.z.toFixed(3);
}

function ensureAudio() {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
}

/* =========================================================
   9. UI 绑定
   ========================================================= */
const sliderA = document.getElementById('sliderA');
const sliderC = document.getElementById('sliderC');
const sliderB = document.getElementById('sliderB');
const valA = document.getElementById('valA');
const valC = document.getElementById('valC');
const valB = document.getElementById('valB');

let lastA = state.a;
let lastC = state.c;
let lastB = state.b;

let rebuildTimer = 0;

function scheduleRebuild() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(rebuild, 16);
}

sliderA.addEventListener('input', () => {
  ensureAudio();
  const v = parseFloat(sliderA.value);
  const asc = v > lastA;
  playThicknessGlide(v, asc);
  lastA = v;

  state.a = v;
  valA.textContent = v.toFixed(2);
  scheduleRebuild();
});

sliderC.addEventListener('input', () => {
  ensureAudio();
  const v = parseFloat(sliderC.value);
  const asc = v > lastC;
  playParamGlide(v, asc, true);
  lastC = v;

  state.c = v;
  valC.textContent = v.toFixed(2);
  scheduleRebuild();
});

sliderB.addEventListener('input', () => {
  ensureAudio();
  const v = parseFloat(sliderB.value);
  const asc = v > lastB;
  playParamGlide(v, asc, false);
  lastB = v;

  state.b = v;
  valB.textContent = v.toFixed(2);
  scheduleRebuild();
});

/* =========================================================
   10. 尺寸自适应
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* =========================================================
   11. 主循环
   ========================================================= */
let lastT = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;

  controls.update();

  uniforms.uTime.value += dt;
  uniforms.uCamPos.value.copy(camera.position);

  /* 悬停强度缓动 */
  state.hoverStrength += (state.hoverTarget - state.hoverStrength) * Math.min(1, dt * 10);
  uniforms.uHoverStrength.value = state.hoverStrength;
  uniforms.uHoverPos.value.copy(state.hoverPos);

  updateHover();
  updateAmbient(dt);

  if (window.__stars) {
    window.__stars.rotation.y += dt * 0.012;
    window.__stars.rotation.x += dt * 0.004;
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

/* =========================================================
   12. 首次手势解锁音频
   ========================================================= */
['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, () => {
    ensureAudio();
  }, { once: true });
});
</script>
