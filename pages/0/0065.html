<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维正交编织 · 调和纤维网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>三维正交编织 · 调和纤维网</h2>
        <div class="sub">Tri‑orthogonal harmonic line bundles · Spatial 3D weave</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">Φ₁: x=t, y=a sin(ω₁t+φ), z=b sin(ω₂t+ψ)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">Φ₂: y=t, z=c sin(ω₃t+θ), x=d sin(ω₄t+χ)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">Φ₃: z=t, x=e sin(ω₅t+η), y=f sin(ω₆t+γ)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(4.2, 3.0, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPAN = 3.5;
        const POINTS_PER_LINE = 550;

        // ---------- 正交纤维族生成 ----------
        // 金色族：主方向沿x轴，在y和z方向做正弦调制
        function createXBundle(numLines, color, opacity) {
            const group = new THREE.Group();
            const dt = 2 * SPAN / POINTS_PER_LINE;
            for (let k = 0; k < numLines; k++) {
                const phiY = k * 2 * Math.PI / numLines;
                const phiZ = k * 2 * Math.PI / (numLines * 1.3) + 1.2;
                const ampY = 0.25 + 0.12 * Math.sin(k * 0.7);
                const ampZ = 0.28 + 0.10 * Math.cos(k * 0.9);
                const freqY = 2.1 + 0.3 * Math.cos(k * 0.35);
                const freqZ = 1.7 + 0.4 * Math.sin(k * 0.55);
                const pts = [];
                for (let i = 0; i <= POINTS_PER_LINE; i++) {
                    const x = -SPAN + i * dt;
                    const y = ampY * Math.sin(freqY * x + phiY);
                    const z = ampZ * Math.sin(freqZ * x + phiZ);
                    pts.push(new THREE.Vector3(x, y, z));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 青色族：主方向沿y轴，在z和x方向做正弦调制
        function createYBundle(numLines, color, opacity) {
            const group = new THREE.Group();
            const dt = 2 * SPAN / POINTS_PER_LINE;
            for (let k = 0; k < numLines; k++) {
                const phiZ = k * 2 * Math.PI / numLines + 0.8;
                const phiX = k * 2 * Math.PI / (numLines * 1.4) + 2.1;
                const ampZ = 0.27 + 0.11 * Math.cos(k * 0.8);
                const ampX = 0.30 + 0.09 * Math.sin(k * 0.6);
                const freqZ = 1.9 + 0.35 * Math.sin(k * 0.45);
                const freqX = 2.3 + 0.25 * Math.cos(k * 0.65);
                const pts = [];
                for (let i = 0; i <= POINTS_PER_LINE; i++) {
                    const y = -SPAN + i * dt;
                    const z = ampZ * Math.sin(freqZ * y + phiZ);
                    const x = ampX * Math.sin(freqX * y + phiX);
                    pts.push(new THREE.Vector3(x, y, z));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 品红族：主方向沿z轴，在x和y方向做正弦调制
        function createZBundle(numLines, color, opacity) {
            const group = new THREE.Group();
            const dt = 2 * SPAN / POINTS_PER_LINE;
            for (let k = 0; k < numLines; k++) {
                const phiX = k * 2 * Math.PI / numLines + 1.5;
                const phiY = k * 2 * Math.PI / (numLines * 1.2) + 0.4;
                const ampX = 0.29 + 0.13 * Math.sin(k * 0.75);
                const ampY = 0.26 + 0.11 * Math.cos(k * 0.85);
                const freqX = 2.0 + 0.28 * Math.cos(k * 0.5);
                const freqY = 1.8 + 0.32 * Math.sin(k * 0.4);
                const pts = [];
                for (let i = 0; i <= POINTS_PER_LINE; i++) {
                    const z = -SPAN + i * dt;
                    const x = ampX * Math.sin(freqX * z + phiX);
                    const y = ampY * Math.sin(freqY * z + phiY);
                    pts.push(new THREE.Vector3(x, y, z));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'tri-orthogonal-weave';
        scene.add(rootGroup);

        const linesPerDirection = 36;

        // 金色族：x方向纤维
        const goldBundle = createXBundle(linesPerDirection, COLOR_GOLD, 0.55);
        rootGroup.add(goldBundle);

        // 青色族：y方向纤维
        const cyanBundle = createYBundle(linesPerDirection, COLOR_CYAN, 0.55);
        rootGroup.add(cyanBundle);

        // 品红族：z方向纤维
        const magentaBundle = createZBundle(linesPerDirection, COLOR_MAGENTA, 0.55);
        rootGroup.add(magentaBundle);

        // 额外增加密度：反向调制线（轻微偏移相位）
        const goldExtra = createXBundle(Math.floor(linesPerDirection * 0.6), COLOR_GOLD, 0.38);
        rootGroup.add(goldExtra);
        const cyanExtra = createYBundle(Math.floor(linesPerDirection * 0.6), COLOR_CYAN, 0.38);
        rootGroup.add(cyanExtra);
        const magentaExtra = createZBundle(Math.floor(linesPerDirection * 0.6), COLOR_MAGENTA, 0.38);
        rootGroup.add(magentaExtra);

        // 辅助：立方体边界框架（极淡）
        function createCubeEdges(color, opacity) {
            const group = new THREE.Group();
            const s = SPAN;
            const corners = [
                [-s, -s, -s], [s, -s, -s], [s, s, -s], [-s, s, -s],
                [-s, -s, s], [s, -s, s], [s, s, s], [-s, s, s]
            ];
            const edgeIndices = [
                [0, 1], [1, 2], [2, 3], [3, 0],
                [4, 5], [5, 6], [6, 7], [7, 4],
                [0, 4], [1, 5], [2, 6], [3, 7]
            ];
            edgeIndices.forEach(([a, b]) => {
                const pts = [
                    new THREE.Vector3(...corners[a]),
                    new THREE.Vector3(...corners[b])
                ];
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            });
            return group;
        }
        rootGroup.add(createCubeEdges(0x504030, 0.14));

        // 辅助：三个坐标平面参考网格（极淡）
        function createPlaneGrid(normal, color, opacity, gridCount, span) {
            const group = new THREE.Group();
            let u1, u2;
            if (Math.abs(normal.x) < 0.9) {
                u1 = new THREE.Vector3(1, 0, 0).cross(normal).normalize();
            } else {
                u1 = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
            }
            u2 = normal.clone().cross(u1).normalize();
            const dMin = -span * 0.9;
            const dMax = span * 0.9;
            for (let i = 0; i < gridCount; i++) {
                const d = dMin + i * (dMax - dMin) / (gridCount - 1);
                // 沿u1方向的线
                const pts1 = [];
                for (let j = 0; j <= 200; j++) {
                    const t = -span + j * 2 * span / 200;
                    pts1.push(normal.clone().multiplyScalar(d).add(u2.clone().multiplyScalar(t)));
                }
                const geom1 = new THREE.BufferGeometry().setFromPoints(pts1);
                group.add(new THREE.Line(geom1, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
                })));
                // 沿u2方向的线
                const pts2 = [];
                for (let j = 0; j <= 200; j++) {
                    const t = -span + j * 2 * span / 200;
                    pts2.push(normal.clone().multiplyScalar(d).add(u1.clone().multiplyScalar(t)));
                }
                const geom2 = new THREE.BufferGeometry().setFromPoints(pts2);
                group.add(new THREE.Line(geom2, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }
        rootGroup.add(createPlaneGrid(new THREE.Vector3(1, 0, 0), 0x504030, 0.07, 10, SPAN));
        rootGroup.add(createPlaneGrid(new THREE.Vector3(0, 1, 0), 0x504030, 0.07, 10, SPAN));
        rootGroup.add(createPlaneGrid(new THREE.Vector3(0, 0, 1), 0x504030, 0.07, 10, SPAN));

        console.log('三维正交编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---------- 健壮的动画循环 ----------
        function animate() {
            const t = getElapsed();

            // 三族纤维各自绕其主方向轴旋转
            goldBundle.rotation.x = t * 0.25;
            cyanBundle.rotation.y = t * 0.30;
            magentaBundle.rotation.z = t * 0.22;
            goldExtra.rotation.x = t * 0.25;
            cyanExtra.rotation.y = t * 0.30;
            magentaExtra.rotation.z = t * 0.22;

            // 整体绕对角线轴缓慢旋转
            rootGroup.rotation.x = t * 0.12;
            rootGroup.rotation.y = t * 0.16;
            rootGroup.rotation.z = t * 0.08;

            // 背景星点旋转
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            // 相机环绕
            const camRadius = 7.8;
            const camAngle = t * 0.08;
            const camHeight = 3.1 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式处理
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 三维正交编织动画已稳定运行');
    </script>
</body>
</html>
