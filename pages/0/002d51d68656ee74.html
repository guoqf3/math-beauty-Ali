<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLTEN · 液态金属</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d1a;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            right: 32px;
            z-index: 2;
            text-align: right;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(245, 220, 200, 0.8);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(220, 150, 90, 0.5);
        }

        .hint {
            color: rgba(210, 185, 160, 0.5);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
                right: 20px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.22em;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <div class="title">Molten</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            // ─── 画布初始化 ───────────────────────────────────────────────
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let particles = [];       // 液态粒子
            let mouse = { x: -9999, y: -9999, active: false, px: -9999, py: -9999, speed: 0 };
            let time = 0;
            let colorShift = 0;       // 点击切换金属色调
            let burstParticles = [];  // 喷发粒子
            let glowPoints = [];      // 光晕点

            // ─── 性能参数 ───────────────────────────────────────────────
            const MAX_PARTICLES = 350;
            const MAX_BURST = 180;

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0d0d1a';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 金属色调调色板 ───────────────────────────────────────
            const metalPalettes = [
                { hueBase: 25, sat: 85, light: 58 },    // 熔岩金
                { hueBase: 350, sat: 80, light: 60 },   // 赤铜
                { hueBase: 190, sat: 75, light: 62 },   // 冷铂
                { hueBase: 280, sat: 70, light: 60 },   // 紫金
                { hueBase: 45, sat: 90, light: 55 },    // 黄铜
            ];
            let paletteIndex = 0;

            // ─── 液态粒子类 ─────────────────────────────────────────────
            class LiquidParticle {
                constructor(x, y, hue) {
                    this.x = x;
                    this.y = y;
                    this.px = x;
                    this.py = y;
                    this.vx = (Math.random() - 0.5) * 1.2;
                    this.vy = (Math.random() - 0.5) * 1.2;
                    this.hue = hue || metalPalettes[paletteIndex].hueBase + Math.random() * 30 - 15;
                    this.saturation = 70 + Math.random() * 25;
                    this.lightness = 50 + Math.random() * 25;
                    this.size = 1.8 + Math.random() * 3.5;
                    this.alpha = 0.35 + Math.random() * 0.4;
                    this.mass = 0.8 + Math.random() * 1.2;
                    this.viscosity = 0.92 + Math.random() * 0.05;
                    this.shine = Math.random() * 0.8 + 0.2;
                    this.life = 0;
                }

                update(dt, mouse) {
                    this.life++;
                    this.px = this.x;
                    this.py = this.y;

                    // 粘度（流体阻力）
                    this.vx *= this.viscosity;
                    this.vy *= this.viscosity;

                    // 重力微小下沉
                    this.vy += 0.012 * dt;

                    // 鼠标吸引
                    if (mouse.active) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const distSq = dx * dx + dy * dy;
                        const attractRadius = 180;
                        const attractSq = attractRadius * attractRadius;
                        if (distSq < attractSq && distSq > 0.01) {
                            const dist = Math.sqrt(distSq);
                            const force = (1 - dist / attractRadius) * 0.35;
                            this.vx += (dx / dist) * force * this.mass;
                            this.vy += (dy / dist) * force * this.mass;
                            // 靠近鼠标时变亮
                            this.lightness = Math.min(85, this.lightness + 0.08);
                        } else {
                            this.lightness = Math.max(45, this.lightness * 0.998);
                        }
                    }

                    // 粒子间轻微排斥（避免堆积）
                    const repulsionRadius = 12;
                    const repulsionSq = repulsionRadius * repulsionRadius;
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const other = particles[i];
                        if (other === this) continue;
                        const dx = this.x - other.x;
                        const dy = this.y - other.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < repulsionSq && distSq > 0.001) {
                            const dist = Math.sqrt(distSq);
                            const force = 0.08 * (1 - dist / repulsionRadius);
                            this.vx += (dx / dist) * force;
                            this.vy += (dy / dist) * force;
                        }
                    }

                    // 速度限制
                    const maxSpeed = 6;
                    const speedSq = this.vx * this.vx + this.vy * this.vy;
                    if (speedSq > maxSpeed * maxSpeed) {
                        const speed = Math.sqrt(speedSq);
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界回弹（温和）
                    const margin = 25;
                    if (this.x < margin) this.vx += 0.2;
                    if (this.x > W - margin) this.vx -= 0.2;
                    if (this.y < margin) this.vy += 0.2;
                    if (this.y > H - margin) this.vy -= 0.2;

                    // 超出边界则回收
                    if (this.x < -50 || this.x > W + 50 || this.y < -50 || this.y > H + 50) {
                        this.x = Math.random() * W;
                        this.y = Math.random() * H;
                        this.vx = 0;
                        this.vy = 0;
                        this.life = 0;
                    }
                }

                draw(ctx) {
                    const palette = metalPalettes[paletteIndex];
                    const hue = this.hue + colorShift + Math.sin(this.life * 0.05 + this.shine * 3) * 8;
                    const sat = this.saturation + Math.sin(this.x * 0.01 + this.y * 0.015) * 12;
                    const light = this.lightness + Math.cos(this.shine * 5 + time * 0.5) * 15;
                    const alpha = this.alpha * Math.min(1, this.life / 10);

                    // 金属光泽粒子
                    const size = this.size * (0.85 + 0.3 * Math.sin(time * 3 + this.shine));

                    // 径向渐变模拟金属反射
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, size * 2.2);
                    gradient.addColorStop(0, `hsla(${hue}, ${sat}%, ${Math.min(90, light + 20)}%, ${alpha})`);
                    gradient.addColorStop(0.4, `hsla(${hue}, ${sat - 5}%, ${light}%, ${alpha * 0.7})`);
                    gradient.addColorStop(0.8, `hsla(${hue}, ${sat - 10}%, ${Math.max(35, light - 15)}%, ${alpha * 0.4})`);
                    gradient.addColorStop(1, 'transparent');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size * 2.2, 0, Math.PI * 2);
                    ctx.fill();

                    // 高光点
                    if (size > 2.5) {
                        const highlightX = this.x - size * 0.3;
                        const highlightY = this.y - size * 0.3;
                        const highlightSize = size * 0.4;
                        ctx.fillStyle = `hsla(${hue}, ${sat + 10}%, ${Math.min(95, light + 30)}%, ${alpha * 0.5})`;
                        ctx.beginPath();
                        ctx.arc(highlightX, highlightY, highlightSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ─── 喷发粒子类 ─────────────────────────────────────────────
            class BurstParticle {
                constructor(x, y, hue, angle, speed) {
                    this.x = x;
                    this.y = y;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.hue = hue;
                    this.life = 0.8 + Math.random() * 0.7;
                    this.maxLife = this.life;
                    this.size = 1.5 + Math.random() * 3;
                    this.alpha = 0.8;
                }

                update(dt) {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.vx *= 0.96;
                    this.vy *= 0.96;
                    this.vy += 0.02;
                    this.life -= 0.018 * dt;
                }

                draw(ctx) {
                    const alpha = (this.life / this.maxLife) * this.alpha;
                    const size = this.size * (this.life / this.maxLife);
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 65%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 光晕点 ───────────────────────────────────────────────
            class GlowPoint {
                constructor(x, y, hue) {
                    this.x = x;
                    this.y = y;
                    this.hue = hue;
                    this.radius = 10;
                    this.maxRadius = 30 + Math.random() * 25;
                    this.life = 0;
                    this.decay = 0.03 + Math.random() * 0.02;
                }

                update() {
                    this.life += this.decay;
                    this.radius = this.maxRadius * (1 - Math.exp(-this.life * 2));
                    return this.life < 1.5;
                }

                draw(ctx) {
                    const alpha = Math.max(0, 0.4 * (1 - this.life / 1.5));
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                    gradient.addColorStop(0, `hsla(${this.hue}, 75%, 75%, ${alpha})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 创建液态粒子 ───────────────────────────────────────────
            function createLiquidParticle(x, y) {
                if (particles.length >= MAX_PARTICLES) {
                    // 替换最老的粒子
                    const oldest = particles.reduce((a, b) => a.life > b.life ? a : b);
                    particles.splice(particles.indexOf(oldest), 1);
                }
                const palette = metalPalettes[paletteIndex];
                const hue = palette.hueBase + Math.random() * 35 - 17.5;
                particles.push(new LiquidParticle(x, y, hue));
            }

            // ─── 触发喷发 ───────────────────────────────────────────────
            function triggerEruption(x, y) {
                const palette = metalPalettes[paletteIndex];
                const count = 18 + Math.floor(Math.random() * 15);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 6;
                    const hue = palette.hueBase + Math.random() * 40 - 20;
                    if (burstParticles.length >= MAX_BURST) burstParticles.shift();
                    burstParticles.push(new BurstParticle(x, y, hue, angle, speed));
                }
                // 光晕
                glowPoints.push(new GlowPoint(x, y, palette.hueBase));
            }

            // ─── 更新喷发粒子 ───────────────────────────────────────────
            function updateBurstParticles(dt) {
                for (let i = burstParticles.length - 1; i >= 0; i--) {
                    burstParticles[i].update(dt);
                    if (burstParticles[i].life <= 0) {
                        burstParticles.splice(i, 1);
                    }
                }
            }

            // ─── 更新光晕 ───────────────────────────────────────────────
            function updateGlowPoints() {
                for (let i = glowPoints.length - 1; i >= 0; i--) {
                    if (!glowPoints[i].update()) {
                        glowPoints.splice(i, 1);
                    }
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const palette = metalPalettes[paletteIndex];
                const radius = 50 + mouse.speed * 5;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${palette.hueBase + colorShift}, 70%, 75%, 0.08)`);
                gradient.addColorStop(0.7, `hsla(${palette.hueBase + colorShift}, 60%, 70%, 0.03)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();

                // 细环
                ctx.strokeStyle = `hsla(${palette.hueBase + colorShift}, 65%, 80%, 0.2)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 12, 0, Math.PI * 2);
                ctx.stroke();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    const dtNorm = fixedStep / 1000 * 60;

                    // 鼠标移动时生成液态粒子
                    if (mouse.active) {
                        const dx = mouse.x - mouse.px;
                        const dy = mouse.y - mouse.py;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        mouse.speed = Math.min(20, dist);
                        const spawnCount = Math.min(4, Math.ceil(dist / 5));
                        for (let i = 0; i < spawnCount; i++) {
                            const tx = mouse.x + (Math.random() - 0.5) * 8;
                            const ty = mouse.y + (Math.random() - 0.5) * 8;
                            createLiquidParticle(tx, ty);
                        }
                    }

                    // 更新粒子
                    for (const p of particles) {
                        p.update(dtNorm, mouse);
                    }
                    updateBurstParticles(dtNorm);
                    updateGlowPoints();
                }

                // 拖尾效果
                ctx.fillStyle = 'rgba(13, 13, 26, 0.06)';
                ctx.fillRect(0, 0, W, H);

                // 绘制光晕点
                for (const g of glowPoints) {
                    g.draw(ctx);
                }

                // 绘制液态粒子
                for (const p of particles) {
                    p.draw(ctx);
                }

                // 绘制喷发粒子
                for (const p of burstParticles) {
                    p.draw(ctx);
                }

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.px = mouse.x;
                mouse.py = mouse.y;
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.px = -9999;
                mouse.py = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                // 喷发
                triggerEruption(mouse.x, mouse.y);
                // 切换金属色调
                paletteIndex = (paletteIndex + 1) % metalPalettes.length;
                // 颜色偏移
                colorShift += 10 + Math.random() * 20;
                if (colorShift > 60) colorShift = -20;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.px = mouse.x;
                    mouse.py = mouse.y;
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    triggerEruption(mouse.x, mouse.y);
                    paletteIndex = (paletteIndex + 1) % metalPalettes.length;
                    colorShift += 10 + Math.random() * 20;
                    if (colorShift > 60) colorShift = -20;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.px = -9999;
                mouse.py = -9999;
            }

            function onResize() {
                setupCanvas();
                // 清理粒子，重新开始
                particles = [];
                burstParticles = [];
                glowPoints = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.px = -9999;
                mouse.py = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();

                // 初始粒子
                for (let i = 0; i < 50; i++) {
                    createLiquidParticle(Math.random() * W, Math.random() * H);
                }

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 确保初始背景填充
            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0d0d1a';
                    ctx.fillRect(0, 0, W, H);
                }
            });

        })();
    </script>
</body>
</html>
