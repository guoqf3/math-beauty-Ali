<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julia集射线 · 复动力编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Julia集射线 · 复动力编织</h2>
        <div class="sub">External rays of z²+c · Three distinct Julia sets · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">c₁ = −0.75</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">c₂ = −0.12+0.75i</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">c₃ = 0.3+0.55i</span>
            <span class="formula-sep">‖</span>
            z₀ = R·e^{iθ}, zₙ₊₁ = zₙ² + c
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.4, 2.3, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.3;

        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // 对给定的c值，从初始点追踪逃逸轨道
        function traceExternalRay(cRe, cIm, theta, maxIter, maxR) {
            const pts = [];
            const R0 = 2.5;
            let zRe = R0 * Math.cos(theta);
            let zIm = R0 * Math.sin(theta);
            pts.push({ re: zRe, im: zIm });

            for (let i = 0; i < maxIter; i++) {
                const x2 = zRe * zRe;
                const y2 = zIm * zIm;
                if (x2 + y2 > maxR * maxR) break;
                const newRe = x2 - y2 + cRe;
                const newIm = 2 * zRe * zIm + cIm;
                zRe = newRe;
                zIm = newIm;
                if (Math.abs(zRe) < 40 && Math.abs(zIm) < 40) {
                    pts.push({ re: zRe, im: zIm });
                }
            }
            return pts;
        }

        // 生成一族外部射线
        function createRayFamily(cRe, cIm, numRays, maxIter, maxR, color, opacity) {
            const group = new THREE.Group();
            for (let k = 0; k < numRays; k++) {
                const theta = k * 2 * Math.PI / numRays;
                const rawPts = traceExternalRay(cRe, cIm, theta, maxIter, maxR);
                if (rawPts.length < 2) continue;
                const pts3D = rawPts.map(p => stereographic(p.re, p.im));
                const valid = pts3D.filter(p => p && p.length() < 9.5);
                if (valid.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(valid);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'julia-rays';
        scene.add(rootGroup);

        const maxIter = 120;
        const maxR = 18;

        // 金色族：c=-0.75（实Julia集，树突结构）
        rootGroup.add(createRayFamily(-0.75, 0, 48, maxIter, maxR, COLOR_GOLD, 0.55));
        rootGroup.add(createRayFamily(-0.75, 0, 28, maxIter, maxR * 0.7, COLOR_GOLD, 0.38));

        // 青色族：c=-0.12+0.75i（兔子Julia集）
        rootGroup.add(createRayFamily(-0.12, 0.75, 48, maxIter, maxR, COLOR_CYAN, 0.55));
        rootGroup.add(createRayFamily(-0.12, 0.75, 28, maxIter, maxR * 0.7, COLOR_CYAN, 0.38));

        // 品红族：c=0.3+0.55i（螺旋Julia集）
        rootGroup.add(createRayFamily(0.3, 0.55, 48, maxIter, maxR, COLOR_MAGENTA, 0.55));
        rootGroup.add(createRayFamily(0.3, 0.55, 28, maxIter, maxR * 0.7, COLOR_MAGENTA, 0.38));

        // 额外：更细的射线密度
        const extraRays = 16;
        const extraIter = 80;
        rootGroup.add(createRayFamily(-0.75, 0, extraRays, extraIter, maxR * 0.5, COLOR_GOLD, 0.30));
        rootGroup.add(createRayFamily(-0.12, 0.75, extraRays, extraIter, maxR * 0.5, COLOR_CYAN, 0.30));
        rootGroup.add(createRayFamily(0.3, 0.55, extraRays, extraIter, maxR * 0.5, COLOR_MAGENTA, 0.30));

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        console.log('Julia集射线编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.23;
            rootGroup.rotation.z = t * 0.09;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.4 + Math.sin(t * 0.15) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Julia集外部射线编织动画已稳定运行');
    </script>
</body>
</html>
