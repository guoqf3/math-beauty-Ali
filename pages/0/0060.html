<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庞塞莱编织 · 双椭圆反射网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>庞塞莱编织 · 双椭圆反射网</h2>
        <div class="sub">Poncelet porism · Tangent chains between ellipses</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">E₁: x²/3²+y²/2.5²=1</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">E₂: x²/1.8²+y²/1.2²=1</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">切弦链：P₀→T→P₁→…</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.2, 2.2, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.65;
        const PROJ_D = 2.2;

        // 球极投影
        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // 椭圆参数
        const a1 = 3.0, b1 = 2.5;
        const a2 = 1.8, b2 = 1.2;

        // 求从点p到内椭圆的切线：解方程
        function tangentPointsToInner(p) {
            const x0 = p.x, y0 = p.y;
            // 切线满足 (xx0/a² + yy0/b² - 1)² = (x²/a² + y²/b² - 1)(x0²/a² + y0²/b² - 1)
            // 但直接解二次方程更简单：设切线方向向量 (dx,dy) 使得直线 p + t*(dx,dy) 与椭圆相切
            // 直线参数化：x = x0 + t*dx, y = y0 + t*dy，代入椭圆得二次方程，判别式=0
            // 为避免参数化方向，使用极坐标形式：设切点为 (a2*cosθ, b2*sinθ)，切线方程为 x*cosθ/a2 + y*sinθ/b2 = 1
            // 点p在切线上：x0*cosθ/a2 + y0*sinθ/b2 = 1。解出θ。
            for (let k = 0; k < 360; k++) {
                const ang = k * Math.PI / 180;
                const val = x0 * Math.cos(ang) / a2 + y0 * Math.sin(ang) / b2;
                if (Math.abs(val - 1) < 0.15) { // 粗略种子
                    // 牛顿法求精
                    let theta = ang;
                    for (let iter = 0; iter < 10; iter++) {
                        const cos = Math.cos(theta), sin = Math.sin(theta);
                        const f = x0 * cos / a2 + y0 * sin / b2 - 1;
                        const df = -x0 * sin / a2 + y0 * cos / b2;
                        if (Math.abs(df) < 1e-12) break;
                        theta -= f / df;
                    }
                    // 验证
                    const cosT = Math.cos(theta), sinT = Math.sin(theta);
                    const check = x0 * cosT / a2 + y0 * sinT / b2;
                    if (Math.abs(check - 1) < 1e-6) {
                        const tx = a2 * cosT, ty = b2 * sinT;
                        return new THREE.Vector2(tx, ty);
                    }
                }
            }
            return null;
        }

        // 直线与椭圆E1的交点（已知一个交点p，求另一个）
        function nextIntersectionWithOuter(p, dir) {
            // 直线 p + t*dir 与椭圆 x²/a1² + y²/b1² = 1 相交
            // 二次方程 at² + bt + c = 0, t=0 为一个根，求另一根
            const dx = dir.x, dy = dir.y;
            const a = dx*dx/(a1*a1) + dy*dy/(b1*b1);
            const b = 2*(p.x*dx/(a1*a1) + p.y*dy/(b1*b1));
            const c = p.x*p.x/(a1*a1) + p.y*p.y/(b1*b1) - 1;
            const disc = b*b - 4*a*c;
            if (disc < 0) return null;
            const sqrtD = Math.sqrt(disc);
            const t1 = (-b + sqrtD)/(2*a);
            const t2 = (-b - sqrtD)/(2*a);
            let t;
            if (Math.abs(t1) < 1e-8 && Math.abs(t2) > 1e-8) t = t2;
            else if (Math.abs(t2) < 1e-8 && Math.abs(t1) > 1e-8) t = t1;
            else if (Math.abs(t1) > 1e-8) t = t1;
            else return null;
            return new THREE.Vector2(p.x + t*dx, p.y + t*dy);
        }

        // 生成一条庞塞莱链
        function generatePonceletChain(startAngle, maxIters) {
            const points = [];
            // 起始点在外椭圆上
            let p = new THREE.Vector2(a1 * Math.cos(startAngle), b1 * Math.sin(startAngle));
            let iter = 0;
            while (iter < maxIters) {
                const tp = tangentPointsToInner(p);
                if (!tp) break;
                const dir = tp.clone().sub(p);
                if (dir.lengthSq() < 1e-12) break;
                const nextP = nextIntersectionWithOuter(p, dir);
                if (!nextP) break;
                points.push(nextP.clone());
                p = nextP;
                iter++;
            }
            return points;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'poncelet-weave';
        scene.add(rootGroup);

        const maxIters = 120;
        const numSeeds = 32;

        // 金色种子
        const goldAngles = [];
        for (let i = 0; i < Math.floor(numSeeds/3); i++) goldAngles.push(i * 2*Math.PI / Math.floor(numSeeds/3));
        // 青色种子
        const cyanAngles = [];
        for (let i = 0; i < Math.floor(numSeeds/3); i++) cyanAngles.push(i * 2*Math.PI / Math.floor(numSeeds/3) + 0.6);
        // 品红种子
        const magentaAngles = [];
        for (let i = 0; i < Math.floor(numSeeds/3); i++) magentaAngles.push(i * 2*Math.PI / Math.floor(numSeeds/3) + 1.3);

        function addChainGroup(angles, color, opacity) {
            const group = new THREE.Group();
            for (const ang of angles) {
                const chain = generatePonceletChain(ang, maxIters);
                if (chain.length < 2) continue;
                const pts3 = chain.map(p => stereographic(p.x, p.y));
                if (pts3.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts3);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity,
                    depthWrite: true, depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        rootGroup.add(addChainGroup(goldAngles, COLOR_GOLD, 0.58));
        rootGroup.add(addChainGroup(cyanAngles, COLOR_CYAN, 0.58));
        rootGroup.add(addChainGroup(magentaAngles, COLOR_MAGENTA, 0.58));

        // 增加密集度：额外种子
        const extraGold = [];
        for (let i = 0; i < 8; i++) extraGold.push(Math.random() * 2*Math.PI);
        rootGroup.add(addChainGroup(extraGold, COLOR_GOLD, 0.45));
        const extraCyan = [];
        for (let i = 0; i < 8; i++) extraCyan.push(Math.random() * 2*Math.PI);
        rootGroup.add(addChainGroup(extraCyan, COLOR_CYAN, 0.45));
        const extraMagenta = [];
        for (let i = 0; i < 8; i++) extraMagenta.push(Math.random() * 2*Math.PI);
        rootGroup.add(addChainGroup(extraMagenta, COLOR_MAGENTA, 0.45));

        // 参考椭圆轮廓（极淡）
        function ellipsePoints(a, b) {
            const pts = [];
            for (let i = 0; i <= 300; i++) {
                const ang = i * 2*Math.PI / 300;
                pts.push(stereographic(a * Math.cos(ang), b * Math.sin(ang)));
            }
            return pts;
        }
        const e1Pts = ellipsePoints(a1, b1);
        const e2Pts = ellipsePoints(a2, b2);
        const addEllipse = (pts, color, op) => {
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color, transparent: true, opacity: op, depthWrite: true, depthTest: true
            })));
        };
        addEllipse(e1Pts, 0x605040, 0.16);
        addEllipse(e2Pts, 0x504030, 0.14);

        console.log('庞塞莱编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i*3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i*3+1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i*3+2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.5, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.26;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 庞塞莱编织动画已稳定运行');
    </script>
</body>
</html>
