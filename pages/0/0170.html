<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维Hilbert曲线 · 空间填充分形交织</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.46rem, 0.82vw, 0.62rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.18);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.36rem, 0.68vw, 0.54rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">三维Hilbert曲线 · 空间填充分形交织</div>
        <div class="subtitle">3D HILBERT CURVE &nbsp;·&nbsp; SPACE‑FILLING FRACTAL WEAVE</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">ℋ₀°:</span> 3阶Hilbert曲线绕恒等旋转 &nbsp;
            <span class="c2">ℋ₁₂₀°:</span> 绕对角线旋转120° &nbsp;
            <span class="c3">ℋ₂₄₀°:</span> 绕对角线旋转240°
            <br>
            <span style="color:#9aa8b8;">3阶=512顶点·511段×3=1533线段 &nbsp;|&nbsp; 球半径R=2.55 &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 9, 23);

        const camera = new THREE.PerspectiveCamera(
            50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 26
        );
        camera.position.set(1.2, 0.6, 7.4);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_REF = '#3a4a5c', C_GLINT = '#8898aa';
        const R = 2.55;
        const SCALE = 2.85;

        // ==================== 3D Hilbert曲线生成 ====================
        function generateHilbert3D(level) {
            const N = 1 << level; // 每边2^level个顶点
            const totalVerts = N * N * N;
            const pts = new Array(totalVerts);

            // 3D Hilbert曲线的Gray码生成法
            // 使用位操作计算每个索引i对应的三维坐标
            for (let i = 0; i < totalVerts; i++) {
                let x = 0, y = 0, z = 0;
                let t = i;
                for (let b = 0; b < level; b++) {
                    const pow2b = 1 << b;
                    const pow2b3 = 1 << (3 * b);
                    const r = (t >> (3 * b)) & 7;
                    // 将3位Gray码解码为子立方体索引
                    const g = r ^ (r >> 1);
                    let sx = (g >> 2) & 1;
                    let sy = (g >> 1) & 1;
                    let sz = g & 1;

                    // 根据更高位的奇偶性交换轴
                    const mask = t >> (3 * (b + 1));
                    if (mask & 1) { const tmp = sx; sx = sy; sy = tmp; }
                    if (mask & 2) { const tmp = sy; sy = sz; sz = tmp; }
                    if (mask & 4) { const tmp = sz; sz = sx; sx = tmp; }

                    x |= sx << b;
                    y |= sy << b;
                    z |= sz << b;
                }
                pts[i] = new THREE.Vector3(x, y, z);
            }
            return pts;
        }

        // 将顶点居中缩放
        function normalizeHilbert(pts, level) {
            const N = 1 << level;
            const maxVal = N - 1;
            const half = maxVal / 2;
            return pts.map(p => new THREE.Vector3(
                (p.x - half) / half * SCALE,
                (p.y - half) / half * SCALE,
                (p.z - half) / half * SCALE
            ));
        }

        // 软钳制
        function softClamp(vec) {
            const len = vec.length();
            if (len > R && len > 0.001) {
                const excess = len - R;
                vec.normalize().multiplyScalar(R + Math.log(1 + excess) * 0.8);
            }
            return vec;
        }

        // 生成曲线线段
        function createHilbertLine(pts, colorHex, opacity) {
            const clamped = pts.map(p => softClamp(p.clone()));
            const geom = new THREE.BufferGeometry().setFromPoints(clamped);
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true, opacity: opacity, depthWrite: true
            });
            return new THREE.Line(geom, mat);
        }

        // 绕任意轴旋转点集
        function rotatePoints(pts, axis, angle) {
            const q = new THREE.Quaternion().setFromAxisAngle(
                new THREE.Vector3(axis[0], axis[1], axis[2]).normalize(), angle
            );
            return pts.map(p => p.clone().applyQuaternion(q));
        }

        console.log('生成3阶3D Hilbert曲线...');
        const level = 3;
        const hilbertPts = normalizeHilbert(generateHilbert3D(level), level);
        console.log('顶点数:', hilbertPts.length, '线段数:', hilbertPts.length - 1);

        // 对角线方向
        const diagAxis = [1, 1, 1];

        // 三族曲线：绕对角线旋转0°、120°、240°
        const ptsA = hilbertPts;
        const ptsB = rotatePoints(hilbertPts, diagAxis, Math.PI * 2 / 3);
        const ptsC = rotatePoints(hilbertPts, diagAxis, Math.PI * 4 / 3);

        const lineA = createHilbertLine(ptsA, C1, 0.62);
        const lineB = createHilbertLine(ptsB, C2, 0.58);
        const lineC = createHilbertLine(ptsC, C3, 0.6);

        const mainGroup = new THREE.Group();
        mainGroup.add(lineA);
        mainGroup.add(lineB);
        mainGroup.add(lineC);
        scene.add(mainGroup);

        // ==================== 参考球面线框 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 180;
            const gen = (f) => {
                const pts = [];
                for (let i = 0; i <= segs; i++) pts.push(f((i / segs) * Math.PI * 2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            };
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
            gen((a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius));
            const addLat = (zVal) => {
                const r = Math.sqrt(Math.max(0.001, radius * radius - zVal * zVal));
                const pts = [];
                for (let i = 0; i <= segs; i++) {
                    const a = (i / segs) * Math.PI * 2;
                    pts.push(new THREE.Vector3(Math.cos(a) * r, zVal, Math.sin(a) * r));
                }
                const g = new THREE.BufferGeometry().setFromPoints(pts);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity * 0.65, depthWrite: true
                });
                group.add(new THREE.Line(g, m));
            };
            addLat(radius * 0.52);
            addLat(-radius * 0.52);
            return group;
        }
        const sphereRef = createSphereWireframe(R, C_REF, 0.22);
        scene.add(sphereRef);

        // ==================== 轴端点光点 ====================
        (() => {
            const sz = 0.06;
            const axes = [[R, 0, 0], [-R, 0, 0], [0, R, 0], [0, -R, 0], [0, 0, R], [0, 0, -R]];
            const gGroup = new THREE.Group();
            axes.forEach(([ax, ay, az]) => {
                const pt = new THREE.Vector3(ax, ay, az);
                [[-sz, 0, 0], [sz, 0, 0], [0, -sz, 0], [0, sz, 0], [0, 0, -sz], [0, 0, sz]].forEach(
                ([dx, dy, dz]) => {
                    const g = new THREE.BufferGeometry().setFromPoints([
                        pt.clone().add(new THREE.Vector3(dx, dy, dz)), pt
                    ]);
                    const m = new THREE.LineBasicMaterial({
                        color: new THREE.Color(C_GLINT),
                        transparent: true, opacity: 0.5, depthWrite: true
                    });
                    gGroup.add(new THREE.Line(g, m));
                });
            });
            mainGroup.add(gGroup);
        })();

        // ==================== 原点光点 ====================
        (() => {
            const sz = 0.08;
            const g = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0),
                new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0),
                new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)
            ]);
            const m = new THREE.LineBasicMaterial({
                color: new THREE.Color(C_GLINT),
                transparent: true, opacity: 0.72, depthWrite: true
            });
            scene.add(new THREE.LineSegments(g, m));
        })();

        // ==================== 球面顶点参考光点 ====================
        (() => {
            const dGroup = new THREE.Group();
            const sz = 0.04;
            // 正二十面体顶点方向作参考
            const phi = (1 + Math.sqrt(5)) / 2;
            const perms = [[0, 1, 2], [2, 0, 1], [1, 2, 0]];
            const dirs = [];
            for (const [i, j, k] of perms) {
                for (let si = -1; si <= 1; si += 2) {
                    for (let sj = -1; sj <= 1; sj += 2) {
                        const v = [0, 0, 0];
                        v[i] = 0;
                        v[j] = si;
                        v[k] = sj * phi;
                        dirs.push(new THREE.Vector3(...v).normalize());
                    }
                }
            }
            for (const dir of dirs) {
                const pt = dir.multiplyScalar(R);
                [
                    [-sz, 0, 0],
                    [sz, 0, 0],
                    [0, -sz, 0],
                    [0, sz, 0]
                ].forEach(([dx, dy, dz]) => {
                    const g = new THREE.BufferGeometry().setFromPoints([
                        pt.clone().add(new THREE.Vector3(dx, dy, dz)), pt
                    ]);
                    const m = new THREE.LineBasicMaterial({
                        color: new THREE.Color(C_REF),
                        transparent: true, opacity: 0.4, depthWrite: true
                    });
                    dGroup.add(new THREE.Line(g, m));
                });
            }
            mainGroup.add(dGroup);
        })();

        // ==================== 动画循环（绝对时间） ====================
        const startTime = performance.now();
        let frameCount = 0;
        let currentTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            const elapsed = (now - startTime) / 1000;
            if (elapsed <= 0) {
                renderer.render(scene, camera);
                return;
            }
            currentTime = elapsed;
            frameCount++;
            if (frameCount === 1 || frameCount % 180 === 0) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${currentTime.toFixed(2)}s 线段:${(hilbertPts.length-1)*3}`);
            }

            // 主结构绕对角线旋转
            mainGroup.rotation.y = currentTime * 0.26;
            mainGroup.rotation.x = currentTime * 0.14 + Math.sin(currentTime * 0.23) * 0.18;
            mainGroup.rotation.z = Math.cos(currentTime * 0.18) * 0.12;

            // 参考球面同步旋转
            sphereRef.rotation.copy(mainGroup.rotation);

            // 相机轻柔游走
            const camX = 1.2 + Math.sin(currentTime * 0.14) * 0.55;
            const camY = 0.6 + Math.cos(currentTime * 0.17) * 0.48;
            const camZ = 7.4 + Math.sin(currentTime * 0.11) * 0.48;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== 三维Hilbert曲线 · 空间填充分形交织 ===');
        console.log('3阶Hilbert曲线顶点:', hilbertPts.length, '线段:', hilbertPts.length - 1);
        console.log('三条旋转副本总线段:', (hilbertPts.length - 1) * 3);
        console.log('球体半径:', R, '| 缩放因子:', SCALE);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
