<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>波动粒子海洋 · Three.js</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 50% 36%, #062036 0%, #02101c 46%, #00060c 100%);
    color: #cfeaff;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #container { position: fixed; inset: 0; }
  canvas { display: block; }

  #glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(circle at 50% 44%, transparent 34%, rgba(0,6,14,0.68) 100%);
  }

  .panel {
    position: fixed; z-index: 10;
    background: rgba(6, 26, 44, 0.52);
    border: 1px solid rgba(80, 200, 255, 0.20);
    border-radius: 16px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 12px 48px rgba(0, 90, 160, 0.26),
                inset 0 1px 0 rgba(160, 230, 255, 0.10);
    padding: 16px 20px;
  }

  /* ---- 信息 ---- */
  .info { top: 22px; left: 22px; max-width: 316px; }
  .info h1 {
    font-size: 16.5px; font-weight: 600; letter-spacing: 1.8px;
    background: linear-gradient(92deg, #38d0ff, #7fe8ff 44%, #c8f4ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 9px;
  }
  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 14px; font-style: italic; color: #6fd0f5;
    letter-spacing: 0.3px; margin-bottom: 9px; line-height: 1.65;
    text-shadow: 0 0 22px rgba(70, 190, 255, 0.62);
  }
  .hint {
    font-size: 11.5px; color: rgba(150, 210, 240, 0.5);
    line-height: 1.75; letter-spacing: 0.2px;
  }
  .hint b { color: rgba(160, 225, 255, 0.9); font-weight: 500; }

  /* ---- 控制 ---- */
  .controls {
    bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 12px;
    padding: 17px 24px; min-width: 460px;
  }
  .row { display: flex; align-items: center; gap: 13px; }
  .row .lbl {
    font-size: 12px; width: 84px; flex-shrink: 0;
    color: rgba(150, 210, 245, 0.78); letter-spacing: 0.6px;
  }
  .row .val {
    font-size: 12px; width: 70px; text-align: right; flex-shrink: 0;
    font-variant-numeric: tabular-nums; font-weight: 600;
    color: #52c8ff;
    text-shadow: 0 0 14px rgba(80, 200, 255, 0.85);
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px; border-radius: 4px; outline: none; cursor: pointer;
    background: linear-gradient(90deg, #0a3a5a 0%, #3fa8e8 58%, #7fe8ff 100%);
    box-shadow: 0 0 14px rgba(70, 180, 240, 0.42);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #eaf8ff; cursor: pointer; border: none;
    box-shadow: 0 0 10px #52c8ff, 0 0 24px rgba(82, 200, 255, 0.9);
    transition: transform 0.14s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.26); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border: none; border-radius: 50%;
    background: #eaf8ff; cursor: pointer;
    box-shadow: 0 0 10px #52c8ff, 0 0 24px rgba(82, 200, 255, 0.9);
  }
  input[type=range]::-moz-range-track {
    height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, #0a3a5a 0%, #3fa8e8 58%, #7fe8ff 100%);
  }

  .drop {
    width: 11px; height: 11px; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg); flex-shrink: 0;
    background: radial-gradient(circle at 35% 35%, #d8f4ff, #52c8ff 58%, #1a5a8a);
    box-shadow: 0 0 10px #52c8ff, 0 0 20px rgba(82, 200, 255, 0.55);
    transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
  }

  @media (max-width: 760px) {
    .controls { min-width: 0; width: calc(100% - 24px); padding: 13px 14px; gap: 9px; }
    .row .lbl { width: 64px; font-size: 10.5px; }
    .row .val { width: 56px; font-size: 10.5px; }
    .info { max-width: 224px; padding: 12px 14px; top: 14px; left: 14px; }
    .info h1 { font-size: 14px; }
    .formula { font-size: 11.5px; }
    .hint { font-size: 10px; }
  }
</style>
</head>
<body>

<div id="container"></div>
<div id="glow"></div>

<div class="panel info">
  <h1>波动粒子海洋</h1>
  <p class="formula">
    h(x,z,t) = Σ A<sub>i</sub> · sin(k<sub>i</sub>·(x·cosα<sub>i</sub> + z·sinα<sub>i</sub>) − ω<sub>i</sub>t + φ<sub>i</sub>)
  </p>
  <p class="hint">
    七组正弦波叠加驱动粒子起伏<br>
    <b>拖拽</b> 旋转视角 · <b>滚轮</b> 缩放 · <b>点击海面</b> 溅落
  </p>
</div>

<div class="panel controls">
  <div class="row">
    <div class="drop" id="dropDot"></div>
    <label class="lbl">波高</label>
    <input type="range" id="hSlider" min="0.20" max="3.20" step="0.01" value="1.15" />
    <span class="val" id="hVal">1.15</span>
  </div>
  <div class="row">
    <label class="lbl">波长</label>
    <input type="range" id="lSlider" min="0.45" max="2.60" step="0.01" value="1.00" />
    <span class="val" id="lVal">1.00</span>
  </div>
  <div class="row">
    <label class="lbl">粒子密度</label>
    <input type="range" id="dSlider" min="1" max="6" step="1" value="3" />
    <span class="val" id="dVal">3 / 6</span>
  </div>
  <div class="row">
    <label class="lbl">音量</label>
    <input type="range" id="volSlider" min="0" max="100" step="1" value="52" />
    <span class="val" id="volVal">52%</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   1. 场景 / 相机 / 渲染器
   ================================================================ */
const container = document.getElementById('container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02060c);
scene.fog = new THREE.FogExp2(0x03080f, 0.026);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.5, 400
);
camera.position.set(0, 13, 28);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.062;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.minPolarAngle = 0.06;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.target.set(0, 0, 0);
controls.autoRotate = false;

/* ================================================================
   2. 波浪参数
   ================================================================ */
const WORLD_SIZE = 70;      // 海面世界尺寸
const WORLD_RADIUS = WORLD_SIZE * 0.5;

let currentDensity = 3;
let currentWaveHeight = 1.15;
let currentWaveLength = 1.00;

/* ================================================================
   3. 着色器
   ================================================================ */
const VERT = `
precision highp float;

attribute float aRandom;

uniform float uTime;
uniform float uWaveHeight;
uniform float uWaveLength;
uniform float uPixelRatio;
uniform float uSize;
uniform float uWorldRadius;

varying float vHeightNorm;
varying float vAlpha;

/* ---- 七组正弦波叠加 ---- */
float waveHeight(vec2 p, float t) {
  float L = uWaveLength;
  float h = 0.0;
  h += sin((p.x *  0.32 + p.y *  0.12) / L + t * 1.15) * 0.55;
  h += sin((p.x * -0.22 + p.y *  0.38) / L + t * 0.92) * 0.38;
  h += sin((p.x *  0.48 + p.y * -0.28) / L + t * 1.55) * 0.26;
  h += sin((p.x * -0.52 + p.y * -0.32) / L + t * 0.72) * 0.32;
  h += sin((p.x *  0.18 + p.y *  0.62) / L + t * 2.05) * 0.15;
  h += sin((p.x *  0.78 + p.y *  0.42) / L + t * 2.45) * 0.09;
  h += sin((p.x * -0.68 + p.y *  0.18) / L + t * 1.85) * 0.12;
  return h * uWaveHeight;
}

void main() {
  vec3 pos = position;
  float h = waveHeight(pos.xz, uTime);
  pos.y = h;

  /* ---- 高度归一化 ---- */
  float norm = h / max(uWaveHeight * 1.90, 0.001) * 0.5 + 0.5;
  vHeightNorm = clamp(norm, 0.0, 1.0);

  vec4 mv = modelViewMatrix * vec4(pos, 1.0);
  float dist = -mv.z;

  /* ---- 远景雾化 ---- */
  float fogFade = 1.0 - smoothstep(20.0, 42.0, dist);

  /* ---- 圆形边界淡出 ---- */
  float r = length(pos.xz);
  float edgeFade = 1.0 - smoothstep(uWorldRadius * 0.70,
                                    uWorldRadius * 0.99, r);

  vAlpha = fogFade * edgeFade;

  /* ---- 粒子尺寸：近大远小 ---- */
  float sizeVariation = 0.80 + aRandom * 0.55;
  gl_PointSize = uSize * uPixelRatio * sizeVariation *
                 (440.0 / max(dist, 5.0));
  gl_PointSize = clamp(gl_PointSize, 0.6, 16.0);

  gl_Position = projectionMatrix * mv;
}`;

const FRAG = `
precision highp float;

uniform vec3  uDeepColor;
uniform vec3  uMidColor;
uniform vec3  uCrestColor;
uniform float uTime;

varying float vHeightNorm;
varying float vAlpha;

void main() {
  /* ---- 圆形软粒子 ---- */
  vec2 c = gl_PointCoord - 0.5;
  float d = length(c);
  if (d > 0.5) discard;
  float soft = smoothstep(0.5, 0.06, d);

  /* ---- 三段式色彩渐变：深海 → 中层 → 波峰 ---- */
  vec3 col;
  if (vHeightNorm < 0.5) {
    col = mix(uDeepColor, uMidColor, vHeightNorm * 2.0);
  } else {
    col = mix(uMidColor, uCrestColor, (vHeightNorm - 0.5) * 2.0);
  }

  /* ---- 波峰泡沫白 ---- */
  float foam = smoothstep(0.76, 1.00, vHeightNorm);
  col += vec3(0.55, 0.82, 0.95) * foam * 0.65;

  /* ---- 微妙闪烁 ---- */
  float flick = 0.88 + 0.12 * sin(uTime * 3.0 + vHeightNorm * 42.0);
  col *= flick;

  float alpha = vAlpha * soft * (0.22 + 0.78 * vHeightNorm);
  gl_FragColor = vec4(col, alpha);
}`;

/* ================================================================
   4. 材质
   ================================================================ */
const oceanMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime:          { value: 0 },
    uWaveHeight:    { value: currentWaveHeight },
    uWaveLength:    { value: currentWaveLength },
    uPixelRatio:    { value: Math.min(window.devicePixelRatio, 2) },
    uSize:          { value: 0.30 },
    uWorldRadius:   { value: WORLD_RADIUS },
    uDeepColor:     { value: new THREE.Color(0.010, 0.045, 0.115) },
    uMidColor:      { value: new THREE.Color(0.055, 0.320, 0.600) },
    uCrestColor:    { value: new THREE.Color(0.300, 0.780, 0.960) },
  },
  vertexShader: VERT,
  fragmentShader: FRAG,
  transparent: true,
  depthWrite: false,
  depthTest: true,
  blending: THREE.NormalBlending,
});

/* ================================================================
   5. 构建粒子海洋
   ================================================================ */
let oceanPoints = null;
let oceanGeometry = null;

function buildOcean(densityLevel) {
  /* ---- 清理旧几何体 ---- */
  if (oceanPoints) {
    scene.remove(oceanPoints);
    oceanGeometry.dispose();
  }

  /* ---- 网格分辨率：170² ≈ 29k → 470² ≈ 221k ---- */
  const gridSize = Math.round(110 + densityLevel * 60);
  const count = gridSize * gridSize;

  const positions = new Float32Array(count * 3);
  const randoms   = new Float32Array(count);

  const step = WORLD_SIZE / (gridSize - 1);
  const half = WORLD_SIZE * 0.5;

  let ptr = 0;
  for (let i = 0; i < gridSize; i++) {
    const z = -half + i * step;
    for (let j = 0; j < gridSize; j++) {
      const x = -half + j * step;
      positions[ptr]     = x;
      positions[ptr + 1] = 0;   // 高度由着色器计算
      positions[ptr + 2] = z;
      randoms[i * gridSize + j] = Math.random();
      ptr += 3;
    }
  }

  oceanGeometry = new THREE.BufferGeometry();
  oceanGeometry.setAttribute('position',
    new THREE.BufferAttribute(positions, 3));
  oceanGeometry.setAttribute('aRandom',
    new THREE.BufferAttribute(randoms, 1));

  /* 手动设置大包围球，避免视锥剔除误判 */
  oceanGeometry.boundingSphere =
    new THREE.Sphere(new THREE.Vector3(0, 0, 0), WORLD_SIZE);

  /* ---- 粒子尺寸随密度自动缩放 ---- */
  oceanMaterial.uniforms.uSize.value = 5.0 / Math.sqrt(gridSize);

  oceanPoints = new THREE.Points(oceanGeometry, oceanMaterial);
  oceanPoints.frustumCulled = false;
  scene.add(oceanPoints);

  return count;
}

/* ================================================================
   6. 拾取平面（用于点击海面定位）
   ================================================================ */
const pickPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_SIZE * 1.5, WORLD_SIZE * 1.5),
  new THREE.MeshBasicMaterial({ visible: false })
);
pickPlane.rotation.x = -Math.PI / 2;
scene.add(pickPlane);

/* ================================================================
   7. 音频引擎
   ================================================================ */
let audioCtx = null;
let masterGain = null;
let seaGain = null;
let seaFilter = null;
let seaReady = false;
let audioReady = false;
let currentVolume = 0.52;

function initAudio() {
  if (audioReady) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { audioCtx = new AC(); } catch (e) { return; }

  masterGain = audioCtx.createGain();
  masterGain.gain.value = currentVolume;

  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.knee.value = 22;
  comp.ratio.value = 6;
  comp.attack.value = 0.004;
  comp.release.value = 0.26;

  masterGain.connect(comp);
  comp.connect(audioCtx.destination);

  /* ============================================================
     持续海浪声：棕噪声 → 带通滤波 → 慢速 LFO 起伏
     ============================================================ */
  const bufSize = Math.floor(audioCtx.sampleRate * 4);
  const nBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const nd = nBuf.getChannelData(0);

  let last = 0;
  for (let i = 0; i < bufSize; i++) {
    const w = Math.random() * 2 - 1;
    /* 棕噪声积分器：比白噪声更接近海浪的"厚重"感 */
    last = (last + 0.021 * w) / 1.021;
    nd[i] = last * 3.8;
  }

  const seaSrc = audioCtx.createBufferSource();
  seaSrc.buffer = nBuf;
  seaSrc.loop = true;

  /* 高通：滤掉过低的隆隆声 */
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 130;

  /* 带通：海浪的主体频段 */
  seaFilter = audioCtx.createBiquadFilter();
  seaFilter.type = 'bandpass';
  seaFilter.frequency.value = 620;
  seaFilter.Q.value = 0.72;

  /* 低通：去除刺耳高频 */
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 2800;

  seaGain = audioCtx.createGain();
  seaGain.gain.value = 0.0;

  seaSrc.connect(hp);
  hp.connect(seaFilter);
  seaFilter.connect(lp);
  lp.connect(seaGain);
  seaGain.connect(masterGain);

  /* ---- LFO 1：滤波中心频率起伏（潮汐感） ---- */
  const lfo1 = audioCtx.createOscillator();
  lfo1.type = 'sine';
  lfo1.frequency.value = 0.16;
  const lfo1Gain = audioCtx.createGain();
  lfo1Gain.gain.value = 260;
  lfo1.connect(lfo1Gain);
  lfo1Gain.connect(seaFilter.frequency);
  lfo1.start(0);

  /* ---- LFO 2：音量起伏（浪涌感） ---- */
  const lfo2 = audioCtx.createOscillator();
  lfo2.type = 'sine';
  lfo2.frequency.value = 0.11;
  const lfo2Gain = audioCtx.createGain();
  lfo2Gain.gain.value = 0.28;
  lfo2.connect(lfo2Gain);
  lfo2Gain.connect(seaGain.gain);
  lfo2.start(0);

  /* ---- LFO 3：更慢的呼吸 ---- */
  const lfo3 = audioCtx.createOscillator();
  lfo3.type = 'sine';
  lfo3.frequency.value = 0.055;
  const lfo3Gain = audioCtx.createGain();
  lfo3Gain.gain.value = 0.16;
  lfo3.connect(lfo3Gain);
  lfo3Gain.connect(seaGain.gain);
  lfo3.start(0);

  seaSrc.start(0);

  seaReady = true;
  audioReady = true;

  updateSeaAudio();
}

/* ---- 海浪声强度随波高变化 ---- */
function updateSeaAudio() {
  if (!seaReady) return;
  const t = audioCtx.currentTime;

  /* 波高越大 → 海浪声越强、频带越宽 */
  const norm = Math.min(Math.max(
    (currentWaveHeight - 0.20) / (3.20 - 0.20), 0, 1), 1);

  const targetGain = 0.10 + norm * 0.34;
  seaGain.gain.setTargetAtTime(targetGain, t, 0.6);

  const fCenter = 480 + norm * 520;
  seaFilter.frequency.setTargetAtTime(fCenter, t, 0.6);
  seaFilter.Q.setTargetAtTime(0.62 + norm * 0.30, t, 0.6);
}

/* ---- ① 点击海面：水花溅落 ---- */
function playSplash(pan = 0) {
  if (!audioReady) return;
  const t = audioCtx.currentTime;

  /* ---- 主溅落：宽带噪声快速衰减 ---- */
  const dur = 0.42;
  const nLen = Math.floor(audioCtx.sampleRate * dur);
  const nBuf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const nd = nBuf.getChannelData(0);

  for (let i = 0; i < nLen; i++) {
    const env = Math.pow(1 - i / nLen, 2.2);
    nd[i] = (Math.random() * 2 - 1) * env;
  }

  const nSrc = audioCtx.createBufferSource();
  nSrc.buffer = nBuf;

  /* 立体声定位（左右） */
  const panner = audioCtx.createStereoPanner();
  panner.pan.value = Math.max(-1, Math.min(1, pan));

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(4200, t);
  bp.frequency.exponentialRampToValueAtTime(700, t + dur);
  bp.Q.value = 0.85;

  const nG = audioCtx.createGain();
  nG.gain.setValueAtTime(0.0001, t);
  nG.gain.exponentialRampToValueAtTime(0.34, t + 0.012);
  nG.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  nSrc.connect(bp);
  bp.connect(nG);
  nG.connect(panner);
  panner.connect(masterGain);
  nSrc.start(t);

  /* ---- 水滴音：高频快速下滑 ---- */
  const drips = 3;
  for (let k = 0; k < drips; k++) {
    const dt = t + 0.03 + k * 0.045 + Math.random() * 0.03;
    const f0 = 1400 + Math.random() * 900;
    const f1 = f0 * 0.42;

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f0, dt);
    osc.frequency.exponentialRampToValueAtTime(f1, dt + 0.09);

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, dt);
    g.gain.exponentialRampToValueAtTime(0.055 / (k + 1), dt + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, dt + 0.11);

    osc.connect(g);
    g.connect(panner);
    osc.start(dt);
    osc.stop(dt + 0.13);
  }

  /* ---- 次声"咕咚"：落水瞬间的低频冲击 ---- */
  const sub = audioCtx.createOscillator();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(240, t);
  sub.frequency.exponentialRampToValueAtTime(72, t + 0.16);

  const subG = audioCtx.createGain();
  subG.gain.setValueAtTime(0.0001, t);
  subG.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
  subG.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);

  sub.connect(subG);
  subG.connect(masterGain);
  sub.start(t);
  sub.stop(t + 0.22);
}

/* ---- ② 调节波高：电子滑音（波高越大音高越高） ---- */
let lastPitchTime = 0;
function playWavePitch(h) {
  if (!audioReady) return;
  const now = performance.now();
  if (now - lastPitchTime < 95) return;
  lastPitchTime = now;

  const t = audioCtx.currentTime;
  const norm = Math.min(Math.max((h - 0.20) / (3.20 - 0.20), 0, 1), 1);

  /* 波幅越大 → 音高越高 */
  const fTarget = 220 + norm * 980;   // 220 → 1200 Hz
  const fStart  = fTarget * 0.62;

  /* ---- 主滑音：三角波，明亮但不刺耳 ---- */
  const osc = audioCtx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(fStart, t);
  osc.frequency.exponentialRampToValueAtTime(fTarget, t + 0.20);

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.Q.value = 5.5;
  lp.frequency.setValueAtTime(3400, t);
  lp.frequency.exponentialRampToValueAtTime(900, t + 0.26);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.072, t + 0.016);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);

  osc.connect(lp);
  lp.connect(g);
  g.connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.34);

  /* ---- 高八度叠音，增加"水光"的通透感 ---- */
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(fStart * 2.0, t);
  osc2.frequency.exponentialRampToValueAtTime(fTarget * 2.0, t + 0.20);

  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.026, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);

  osc2.connect(g2);
  g2.connect(masterGain);
  osc2.start(t);
  osc2.stop(t + 0.20);
}

/* ================================================================
   8. UI 绑定
   ================================================================ */
const hSlider   = document.getElementById('hSlider');
const lSlider   = document.getElementById('lSlider');
const dSlider   = document.getElementById('dSlider');
const volSlider = document.getElementById('volSlider');
const hVal      = document.getElementById('hVal');
const lVal      = document.getElementById('lVal');
const dVal      = document.getElementById('dVal');
const volVal    = document.getElementById('volVal');
const dropDot   = document.getElementById('dropDot');

let dropTimer = null;
function flashDrop() {
  dropDot.style.transform = 'rotate(-45deg) scale(2.2)';
  dropDot.style.boxShadow =
    '0 0 20px #9ae8ff, 0 0 40px rgba(154,232,255,0.95)';
  clearTimeout(dropTimer);
  dropTimer = setTimeout(() => {
    dropDot.style.transform = 'rotate(-45deg) scale(1)';
    dropDot.style.boxShadow =
      '0 0 10px #52c8ff, 0 0 20px rgba(82,200,255,0.55)';
  }, 130);
}

hSlider.addEventListener('input', (e) => {
  initAudio();
  currentWaveHeight = parseFloat(e.target.value);
  hVal.textContent = currentWaveHeight.toFixed(2);
  oceanMaterial.uniforms.uWaveHeight.value = currentWaveHeight;
  playWavePitch(currentWaveHeight);
  updateSeaAudio();
  flashDrop();
});

lSlider.addEventListener('input', (e) => {
  initAudio();
  currentWaveLength = parseFloat(e.target.value);
  lVal.textContent = currentWaveLength.toFixed(2);
  oceanMaterial.uniforms.uWaveLength.value = currentWaveLength;
});

dSlider.addEventListener('input', (e) => {
  initAudio();
  currentDensity = parseInt(e.target.value, 10);
  dVal.textContent = currentDensity + ' / 6';
  buildOcean(currentDensity);
  flashDrop();
});

volSlider.addEventListener('input', (e) => {
  initAudio();
  currentVolume = parseInt(e.target.value, 10) / 100;
  volVal.textContent = e.target.value + '%';
  if (masterGain) {
    masterGain.gain.setTargetAtTime(
      currentVolume, audioCtx.currentTime, 0.02);
  }
});

/* ================================================================
   9. 鼠标交互
   ================================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

let pointerDownPos = null;
let isDragging = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  initAudio();
  pointerDownPos = { x: e.clientX, y: e.clientY };
  isDragging = true;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownPos) { isDragging = false; return; }
  const moved = Math.hypot(
    e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  pointerDownPos = null;
  isDragging = false;

  if (moved > 8) return;   // 拖拽，不算点击

  /* ---- 射线命中水平面，得到点击处的世界坐标 ---- */
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);

  const hits = raycaster.intersectObject(pickPlane, false);
  if (hits.length > 0) {
    const p = hits[0].point;
    const r = Math.hypot(p.x, p.z);

    /* 只在海面范围内响应 */
    if (r < WORLD_RADIUS * 1.05) {
      /* 左右声道随点击位置偏移 */
      const pan = Math.max(-1, Math.min(1, p.x / (WORLD_RADIUS * 0.7)));
      playSplash(pan);
      flashDrop();

      /* 视觉：落点处短暂高亮 */
      splashGlow.position.set(p.x, 0.6, p.z);
      splashGlow.visible = true;
      splashGlowTimer = 1.0;
    }
  }
});

renderer.domElement.addEventListener('pointercancel', () => {
  pointerDownPos = null;
  isDragging = false;
});

/* ================================================================
   10. 落水视觉高亮
   ================================================================ */
const splashGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.4, 16, 12),
  new THREE.MeshBasicMaterial({
    color: 0x7fe8ff,
    transparent: true,
    opacity: 0.0,
    depthWrite: false,
  })
);
splashGlow.visible = false;
scene.add(splashGlow);

let splashGlowTimer = 0;

/* ================================================================
   11. 渲染循环
   ================================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* ---- 波浪推进 ---- */
  oceanMaterial.uniforms.uTime.value = elapsed;

  /* ---- 落水高亮衰减 ---- */
  if (splashGlowTimer > 0) {
    splashGlowTimer = Math.max(0, splashGlowTimer - dt * 2.4);
    splashGlow.material.opacity = splashGlowTimer * 0.55;
    splashGlow.scale.setScalar(
      1 + (1 - splashGlowTimer) * 1.4
    );
    if (splashGlowTimer <= 0) splashGlow.visible = false;
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ================================================================
   12. 自适应 & 启动
   ================================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  oceanMaterial.uniforms.uPixelRatio.value =
    Math.min(window.devicePixelRatio, 2);
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta();
});

/* ---- 初始化 ---- */
hVal.textContent = currentWaveHeight.toFixed(2);
lVal.textContent = currentWaveLength.toFixed(2);
dVal.textContent = currentDensity + ' / 6';

const particleCount = buildOcean(currentDensity);
console.log(`[波动粒子海洋] 已生成 ${particleCount.toLocaleString()} 颗粒子`);

camera.position.set(0, 13, 28);
controls.target.set(0, 0, 0);

animate();
</script>
