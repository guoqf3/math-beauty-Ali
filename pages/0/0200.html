<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四维正二十四胞体 · 自对偶线网</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.08em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 72px rgba(170,150,130,0.22);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.85vw, 0.64rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 16px rgba(155,145,125,0.32);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.16);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.38rem, 0.7vw, 0.56rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.55; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">四维正二十四胞体 · 自对偶线网</div>
        <div class="subtitle">24‑CELL PROJECTION &nbsp;·&nbsp; 24 VERTICES &nbsp;·&nbsp; 96 EDGES</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">短边:</span> 投影长度<1/3分位 &nbsp;
            <span class="c2">中边:</span> 1/3≤长度<2/3分位 &nbsp;
            <span class="c3">长边:</span> 长度≥2/3分位
            <br>
            <span style="color:#9aa8b8;">顶点: (±1,±1,0,0)所有偶排列 &nbsp;|&nbsp; SO(4)双旋转+正交投影</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 22);

        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            24
        );
        camera.position.set(0.7, 0.4, 7.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c'; // 暖金 – 短边
        const C2 = '#5d9ec6'; // 冰蓝 – 中边
        const C3 = '#c77d9f'; // 玫瑰粉 – 长边
        const C_SPHERE = '#3a4a5c';
        const C_GLINT = '#8898aa';

        const VIEW_RADIUS = 2.5;

        // ==================== 24-cell顶点生成 ====================
        function generate24CellVertices() {
            const verts = [];
            // 坐标为 (±1, ±1, 0, 0) 的所有偶排列
            const base = [1, 1, 0, 0];
            // 偶排列指排列的奇偶性为偶，即置换符号为+1
            const evenPerms = [
                [0,1,2,3], [0,2,3,1], [0,3,1,2],
                [1,0,3,2], [1,2,0,3], [1,3,2,0],
                [2,0,1,3], [2,1,3,0], [2,3,0,1],
                [3,0,2,1], [3,1,0,2], [3,2,1,0]
            ];
            for (const p of evenPerms) {
                for (let s0 = -1; s0 <= 1; s0 += 2) {
                    for (let s1 = -1; s1 <= 1; s1 += 2) {
                        // s2, s3 只能是 ±1? 但 base[2]和base[3]是0，符号不影响，所以只取s0,s1
                        const v = [0,0,0,0];
                        v[0] = s0 * base[p[0]];
                        v[1] = s1 * base[p[1]];
                        v[2] = base[p[2]]; // 0
                        v[3] = base[p[3]]; // 0
                        // 归一化到单位球面
                        const len = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]+v[3]*v[3]);
                        if (len < 0.01) continue;
                        verts.push([v[0]/len, v[1]/len, v[2]/len, v[3]/len]);
                    }
                }
            }
            return verts;
        }

        const verts4D = generate24CellVertices();
        console.log('24-cell顶点数:', verts4D.length);

        // ==================== 生成边 ====================
        function buildEdges(verts) {
            const n = verts.length;
            let minDist = Infinity;
            for (let i=0; i<n; i++) {
                for (let j=i+1; j<n; j++) {
                    const dx = verts[i][0]-verts[j][0], dy = verts[i][1]-verts[j][1],
                          dz = verts[i][2]-verts[j][2], dw = verts[i][3]-verts[j][3];
                    const d = Math.sqrt(dx*dx+dy*dy+dz*dz+dw*dw);
                    if (d > 0.001 && d < minDist) minDist = d;
                }
            }
            const thresh = minDist * 1.05;
            const edges = [];
            for (let i=0; i<n; i++) {
                for (let j=i+1; j<n; j++) {
                    const dx = verts[i][0]-verts[j][0], dy = verts[i][1]-verts[j][1],
                          dz = verts[i][2]-verts[j][2], dw = verts[i][3]-verts[j][3];
                    const d = Math.sqrt(dx*dx+dy*dy+dz*dz+dw*dw);
                    if (d <= thresh) edges.push([i, j]);
                }
            }
            return { edges, minDist };
        }

        const { edges, minDist } = buildEdges(verts4D);
        console.log('边数:', edges.length, '最小边长:', minDist);

        // ==================== 投影与旋转工具 ====================
        function rotate4D(x1, x2, x3, x4, alpha, beta) {
            const cA = Math.cos(alpha), sA = Math.sin(alpha);
            const cB = Math.cos(beta), sB = Math.sin(beta);
            const y1 = x1*cA - x2*sA;
            const y2 = x1*sA + x2*cA;
            const y3 = x3*cB - x4*sB;
            const y4 = x3*sB + x4*cB;
            return [y1, y2, y3, y4];
        }

        function project(v4) {
            // 正交投影：取前三个坐标，缩放
            const scale = 2.4;
            return new THREE.Vector3(v4[0]*scale, v4[1]*scale, v4[2]*scale);
        }

        function softClamp(vec, maxDist) {
            const len = vec.length();
            if (len > maxDist && len > 0.001) {
                const excess = len - maxDist;
                const clamped = maxDist + Math.log(1 + excess) * 1.1;
                vec.normalize().multiplyScalar(Math.min(clamped, maxDist * 1.25));
            }
            return vec;
        }

        // ==================== 创建三个动态线段几何体 ====================
        function createDynamicLineSegments(colorHex, opacity) {
            const geom = new THREE.BufferGeometry();
            const positionsArr = new Float32Array(0);
            geom.setAttribute('position', new THREE.BufferAttribute(positionsArr, 3));
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            const lines = new THREE.LineSegments(geom, mat);
            lines.userData = { positionsArr };
            return lines;
        }

        const linesShort = createDynamicLineSegments(C1, 0.72);
        const linesMid = createDynamicLineSegments(C2, 0.68);
        const linesLong = createDynamicLineSegments(C3, 0.7);

        const mainGroup = new THREE.Group();
        mainGroup.add(linesShort);
        mainGroup.add(linesMid);
        mainGroup.add(linesLong);
        scene.add(mainGroup);

        // ==================== 更新函数 ====================
        function updateEdgesDynamic(alpha, beta) {
            const projPts = verts4D.map(v => {
                const rot = rotate4D(v[0], v[1], v[2], v[3], alpha, beta);
                let proj = project(rot);
                proj = softClamp(proj, VIEW_RADIUS);
                return proj;
            });

            const edgeLengths = edges.map(([i,j]) => projPts[i].distanceTo(projPts[j]));
            const indices = edgeLengths.map((_, idx) => idx);
            indices.sort((a,b) => edgeLengths[a] - edgeLengths[b]);

            const total = edges.length;
            const third = Math.floor(total / 3);
            const groups = [
                indices.slice(0, third),
                indices.slice(third, 2*third),
                indices.slice(2*third)
            ];

            const lineObjs = [linesShort, linesMid, linesLong];
            lineObjs.forEach((lineObj, gIdx) => {
                const idxList = groups[gIdx];
                const numEdges = idxList.length;
                const arr = new Float32Array(numEdges * 6);
                for (let k=0; k<numEdges; k++) {
                    const [i, j] = edges[idxList[k]];
                    const a = projPts[i], b = projPts[j];
                    const off = k * 6;
                    arr[off] = a.x; arr[off+1] = a.y; arr[off+2] = a.z;
                    arr[off+3] = b.x; arr[off+4] = b.y; arr[off+5] = b.z;
                }
                const geom = lineObj.geometry;
                geom.setAttribute('position', new THREE.BufferAttribute(arr, 3));
                geom.attributes.position.needsUpdate = true;
            });
        }

        // ==================== 参考球面线框 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 170;
            const circles = [
                (a) => new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0),
                (a) => new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius),
                (a) => new THREE.Vector3(0, Math.cos(a)*radius, Math.sin(a)*radius),
            ];
            for (const gen of circles) {
                const pts = [];
                for (let i=0; i<=segs; i++) pts.push(gen((i/segs)*Math.PI*2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(VIEW_RADIUS, C_SPHERE, 0.2);
        scene.add(sphereRef);

        // ==================== 原点光点 ====================
        function originGlint() {
            const group = new THREE.Group();
            const sz = 0.08;
            const pairs = [
                [new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0)],
                [new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0)],
                [new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)],
            ];
            for (const [a,b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true, opacity: 0.7, depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(originGlint());

        // ==================== 动画循环（绝对时间） ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s`);
                logTime = now;
            }

            const alpha = time * 0.38;
            const beta = time * 0.52;

            updateEdgesDynamic(alpha, beta);

            mainGroup.rotation.y += 0.0018;
            mainGroup.rotation.x += 0.001;
            sphereRef.rotation.copy(mainGroup.rotation);

            const camX = Math.sin(time * 0.14) * 0.55;
            const camY = Math.cos(time * 0.18) * 0.45;
            camera.position.set(camX, camY, 7.5);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // 窗口调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== 四维正二十四胞体 · 自对偶线网 ===');
        console.log('顶点数:', verts4D.length, '边数:', edges.length);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        updateEdgesDynamic(0, 0);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
