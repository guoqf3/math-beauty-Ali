<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调和场流线编织 · 时变向量场网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>调和场流线编织 · 时变向量场网</h2>
        <div class="sub">Gradient · Curl · Harmonic · Time‑modulated streamlines</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">V₁=∇(sinx·siny·cosz)·cos(√2t)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">V₂=(∇×F)·cos(√3t), F=(siny,sinz,sinx)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">V₃=(cos(y+z),cos(z+x),cos(x+y))·cos(πt)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.6, 2.5, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.58;
        const DT = 0.04;
        const MAX_STEPS = 500;
        const STEPS_PER_FRAME = 3;
        const MAX_RADIUS = 7.5;
        const UPDATE_INTERVAL = 0.14;
        const TOTAL_SEEDS = 72;

        // ---- 时变向量场 ----
        function fieldGradient(p, t) {
            const x = p.x, y = p.y, z = p.z;
            const sx = Math.sin(x + 0.12 * t), cx = Math.cos(x + 0.12 * t);
            const sy = Math.sin(y + 0.18 * t), cy = Math.cos(y + 0.18 * t);
            const sz = Math.sin(z + 0.22 * t), cz = Math.cos(z + 0.22 * t);
            const mod = Math.cos(Math.sqrt(2) * t);
            return new THREE.Vector3(
                cx * sy * cz * mod,
                sx * cy * cz * mod,
                -sx * sy * sz * mod
            );
        }

        function fieldCurl(p, t) {
            const x = p.x, y = p.y, z = p.z;
            const mod = Math.cos(Math.sqrt(3) * t);
            return new THREE.Vector3(
                (Math.cos(z + 0.5 * t) - Math.cos(y + 0.3 * t)) * mod,
                (Math.cos(x + 0.7 * t) - Math.cos(z + 0.4 * t)) * mod,
                (Math.cos(y + 0.6 * t) - Math.cos(x + 0.2 * t)) * mod
            );
        }

        function fieldHarmonic(p, t) {
            const x = p.x, y = p.y, z = p.z;
            const mod = Math.cos(Math.PI * t);
            return new THREE.Vector3(
                Math.cos(y + z + 0.4 * t) * mod,
                Math.cos(z + x + 0.6 * t) * mod,
                Math.cos(x + y + 0.5 * t) * mod
            );
        }

        function rk4Step(p, t, fieldFn, ds) {
            const f = (pos) => fieldFn(pos, t);
            const k1 = f(p);
            const pm2 = p.clone().add(k1.clone().multiplyScalar(ds * 0.5));
            const k2 = f(pm2);
            const pm3 = p.clone().add(k2.clone().multiplyScalar(ds * 0.5));
            const k3 = f(pm3);
            const pm4 = p.clone().add(k3.clone().multiplyScalar(ds));
            const k4 = f(pm4);
            return k1.add(k2.multiplyScalar(2)).add(k3.multiplyScalar(2)).add(k4).multiplyScalar(ds / 6);
        }

        // ---- 种子生成 ----
        function generateSeeds() {
            const seeds = [];
            const phi_g = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < TOTAL_SEEDS; i++) {
                const y = 1 - (2 * i + 1) / TOTAL_SEEDS;
                const rAtY = Math.sqrt(1 - y * y);
                const theta = phi_g * i;
                const dist = 0.4 + Math.random() * 2.2;
                seeds.push(new THREE.Vector3(
                    dist * rAtY * Math.cos(theta),
                    dist * y,
                    dist * rAtY * Math.sin(theta)
                ));
            }
            return seeds;
        }

        const seeds = generateSeeds();
        const orbits = [];
        const lines = [];

        for (let i = 0; i < seeds.length; i++) {
            const color = i % 3 === 0 ? COLOR_GOLD : (i % 3 === 1 ? COLOR_CYAN : COLOR_MAGENTA);
            const fieldFn = i % 3 === 0 ? fieldGradient : (i % 3 === 1 ? fieldCurl : fieldHarmonic);
            const initPts = [seeds[i].clone().multiplyScalar(SCALE)];
            const geom = new THREE.BufferGeometry().setFromPoints(initPts);
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity: 0.42, depthWrite: true, depthTest: true,
            });
            const line = new THREE.Line(geom, mat);
            lines.push(line);
            orbits.push({
                pos: seeds[i].clone(),
                color,
                fieldFn,
                points: initPts,
                stepCount: 0,
            });
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'harmonic-field-weave';
        lines.forEach(l => rootGroup.add(l));
        scene.add(rootGroup);

        // 预推进初始步数
        for (let i = 0; i < orbits.length; i++) {
            const o = orbits[i];
            for (let s = 0; s < 12; s++) {
                const dp = rk4Step(o.pos, 0, o.fieldFn, DT);
                o.pos.add(dp);
                if (o.pos.length() > MAX_RADIUS) break;
                o.points.push(o.pos.clone().multiplyScalar(SCALE));
                o.stepCount++;
            }
            if (o.points.length >= 2) {
                lines[i].geometry.dispose();
                lines[i].geometry = new THREE.BufferGeometry().setFromPoints(o.points);
            }
        }

        // 辅助球面参考
        const refGeom = new THREE.SphereGeometry(3.2, 40, 24);
        const refWire = new THREE.LineSegments(
            new THREE.EdgesGeometry(refGeom),
            new THREE.LineBasicMaterial({ color: 0x403830, transparent: true, opacity: 0.10, depthWrite: true, depthTest: true })
        );
        rootGroup.add(refWire);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const sc = 550;
        const sp = new Float32Array(sc * 3);
        for (let i = 0; i < sc; i++) {
            const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), d = 6.5 + Math.random() * 10;
            sp[i * 3] = d * Math.sin(ph) * Math.cos(th);
            sp[i * 3 + 1] = d * Math.sin(ph) * Math.sin(th);
            sp[i * 3 + 2] = d * Math.cos(ph);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(sp, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        })));
        scene.add(starsGroup);

        console.log('调和场流线种子数:', orbits.length);

        // ---- 动画循环 ----
        let lastUpdate = -10, animId;
        function loop() {
            const t = getElapsed();
            let needUpdate = false;
            if (t - lastUpdate > UPDATE_INTERVAL) {
                for (let i = 0; i < orbits.length; i++) {
                    const o = orbits[i];
                    if (o.stepCount >= MAX_STEPS) continue;
                    for (let s = 0; s < STEPS_PER_FRAME; s++) {
                        if (o.stepCount >= MAX_STEPS) break;
                        const dp = rk4Step(o.pos, t, o.fieldFn, DT);
                        o.pos.add(dp);
                        if (o.pos.length() > MAX_RADIUS) { o.stepCount = MAX_STEPS; break; }
                        o.points.push(o.pos.clone().multiplyScalar(SCALE));
                        o.stepCount++;
                    }
                    if (o.points.length >= 2) {
                        lines[i].geometry.dispose();
                        lines[i].geometry = new THREE.BufferGeometry().setFromPoints(o.points);
                    }
                }
                lastUpdate = t;
                needUpdate = true;
            }

            rootGroup.rotation.x = t * 0.11;
            rootGroup.rotation.y = t * 0.17;
            rootGroup.rotation.z = t * 0.07;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const cr = 7.6, ca = t * 0.08, ch = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        function schedule() {
            animId = requestAnimationFrame(() => { try { loop(); } catch (e) { console.warn(e); } schedule(); });
        }
        const backup = setInterval(() => { if (animId !== undefined) { cancelAnimationFrame(animId);
                schedule(); } }, 3000);

        renderer.render(scene, camera);
        schedule();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }, 120));
        console.log('✅ 调和场流线时变编织动画已稳定运行');
    </script>
</body>
</html>
