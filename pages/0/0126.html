<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无理频率编织 · 空间曲线交响 · 三维数学动画</title>
    <style>
        :root {
            --bg: #04040e;
            --gold: #d6a745;
            --cyan: #3dbca5;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.6vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.62rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 14, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.85rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.54rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3dbca5;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <h1>无理频率编织 · 空间曲线交响 · 拓扑投影</h1>
        <div class="subtitle">x=sin(ω₁t)·cos(ω₂t) 等 &nbsp;·&nbsp; 非线性耦合 &nbsp;·&nbsp; 球极逆投影</div>
    </div>
    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">x̃(s)=Σ Aₙ sin(αₙ s+φₙ)</span>
            ⊗ <span class="accent-cyan">ỹ(s)=Σ Bₙ cos(βₙ s+ψₙ)</span>
            ⊗ <span class="accent-rose">z̃(s)=Σ Cₙ sin(γₙ s+δₙ)</span>
        </div>
        <div class="formula-detail">
            多频率Lissajous曲线族 &nbsp;·&nbsp; 无理数频率比值 &nbsp;·&nbsp; 球面映射 &nbsp;·&nbsp; SO(3)旋转
        </div>
    </div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.3, 1.4, 7.8);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3dbca5');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // 背景星点
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 130;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.3 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSizes[i] = Math.random() * 1.5 + 0.2;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.017,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 50, 34);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.06, depthWrite: false })
        );
        scene.add(refSphereWire);
        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 28);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.05, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- 工具 ----------
        function clampPt(p) {
            let [x, y, z] = p;
            if (!Number.isFinite(x)) x = 0;
            if (!Number.isFinite(y)) y = 0;
            if (!Number.isFinite(z)) z = 0;
            const r = Math.sqrt(x * x + y * y + z * z);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const s = CLAMP_RADIUS / r;
                return [x * s, y * s, z * s];
            }
            return [x, y, z];
        }

        function so3Matrix(t) {
            const angle = t * 0.28;
            const ax = Math.cos(t * 0.17) * 0.55;
            const ay = Math.sin(t * 0.13) * 0.45;
            const az = Math.cos(t * 0.19 + 1.3) * 0.5;
            const n = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
            const ux = ax / n, uy = ay / n, uz = az / n;
            const c = Math.cos(angle), s = Math.sin(angle), t1 = 1 - c;
            return [
                c + ux * ux * t1, ux * uy * t1 - uz * s, ux * uz * t1 + uy * s,
                uy * ux * t1 + uz * s, c + uy * uy * t1, uy * uz * t1 - ux * s,
                uz * ux * t1 - uy * s, uz * uy * t1 + ux * s, c + uz * uz * t1,
            ];
        }

        function applyRot(pt, R) {
            return [
                R[0] * pt[0] + R[1] * pt[1] + R[2] * pt[2],
                R[3] * pt[0] + R[4] * pt[1] + R[5] * pt[2],
                R[6] * pt[0] + R[7] * pt[1] + R[8] * pt[2],
            ];
        }

        // 球极逆投影
        function stereoInv(x, y, z) {
            const r2 = x * x + y * y + z * z;
            const s = 2.5;
            const d = 1 + r2 / (s * s);
            return [(2 * x) / d, (2 * y) / d, ((1 - r2 / (s * s)) * s) / d];
        }

        // ---------- 曲线系统 ----------
        const POINTS_PER_CURVE = 130;
        const allCurves = [];

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.8,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geom, positions, updateFn: null };
            allCurves.push(obj);
            return obj;
        }

        // 生成Lissajous-耦合曲线族
        function randomInRange(a, b) { return a + Math.random() * (b - a); }

        for (let k = 0; k < 70; k++) {
            // 随机选择颜色
            const col = k % 3 === 0 ? colorGold : (k % 3 === 1 ? colorCyan : colorRose);
            const curve = createCurve(col);

            // 随机频率和幅值（无理数相近）
            const ax = randomInRange(0.7, 1.8);
            const ay = randomInRange(0.8, 1.6);
            const az = randomInRange(0.9, 1.7);
            const bx = randomInRange(0.3, 1.2);
            const by = randomInRange(0.4, 1.3);
            const bz = randomInRange(0.2, 1.0);
            const phx = randomInRange(0, Math.PI * 2);
            const phy = randomInRange(0, Math.PI * 2);
            const phz = randomInRange(0, Math.PI * 2);
            const ky = randomInRange(0.7, 1.4);
            const kz = randomInRange(0.8, 1.3);

            curve.updateFn = (t) => {
                const positions = curve.positions;
                const R = so3Matrix(t);
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    const s = (i / (POINTS_PER_CURVE - 1)) * 6.5;
                    const x0 = Math.sin(ax * s + phx + t * 0.2) * Math.cos(bx * s + t * 0.15);
                    const y0 = Math.cos(ay * s + phy + t * 0.25) * Math.sin(by * s + t * 0.18);
                    const z0 = Math.sin(az * s + phz + t * 0.22) * Math.cos(bz * s + t * 0.1) * ky + Math.cos(ky * s + t * 0.3) * kz;
                    // 球极逆投影
                    let p = stereoInv(x0, y0, z0);
                    p = applyRot(p, R);
                    p = clampPt(p);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geom.attributes.position.needsUpdate = true;
            };
        }

        console.log('曲线总数：' + allCurves.length);

        // ---------- 流动粒子 ----------
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                curveIndex: i % allCurves.length,
                progress: Math.random(),
                speed: 0.0006 + Math.random() * 0.0022,
            });
            const col = i < 7 ? colorGold : i < 14 ? colorCyan : colorRose;
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.045,
            vertexColors: true,
            transparent: true,
            opacity: 0.82,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1;
                if (pd.progress < 0) pd.progress += 1;
                const cObj = allCurves[pd.curveIndex];
                if (!cObj || !cObj.positions) continue;
                const posArr = cObj.positions;
                const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                const i0 = idx0 * 3, i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // ---------- 健壮的动画循环（绝对时间） ----------
        const startTime = performance.now();
        let frameCount = 0,
            lastLogTime = startTime;

        function animate(nowTS) {
            requestAnimationFrame(animate);
            try {
                const now = nowTS || performance.now();
                const elapsed = (now - startTime) / 1000;
                frameCount++;
                if (now - lastLogTime > 5000) {
                    console.log(`🔄 运行中 | FPS:${Math.round(frameCount/((now-lastLogTime)/1000))} | 时间:${elapsed.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }

                // 逐条安全更新
                for (const curve of allCurves) {
                    try { if (curve.updateFn) curve.updateFn(elapsed); } catch (e) { }
                }
                updateParticles();

                const breathe = 1 + 0.04 * Math.sin(elapsed * 0.4);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += 0.0008;
                refSphereWire.rotation.y += 0.0007;
                refTorusWire.rotation.z += 0.0008;
                refTorusWire.scale.setScalar(1 + 0.05 * Math.sin(elapsed * 0.45));

                const camH = elapsed * 0.1;
                const camV = 0.33 + 0.17 * Math.sin(elapsed * 0.14);
                const camD = 7.4 + 0.6 * Math.sin(elapsed * 0.18);
                camera.position.set(camD * Math.cos(camV) * Math.sin(camH), camD * Math.sin(camV), camD * Math.cos(camV) * Math.cos(camH));
                camera.lookAt(0, 0, 0);
                stars.rotation.y += 0.0002;
                renderer.render(scene, camera);
            } catch (e) { console.error('动画循环错误', e); }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });

        // 启动
        console.log('🚀 无理频率编织动画初始化...');
        for (const curve of allCurves) { try { if (curve.updateFn) curve.updateFn(0); } catch (e) { } }
        updateParticles();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动（绝对时间+独立曲线防御）');
    </script>
</body>
</html>
