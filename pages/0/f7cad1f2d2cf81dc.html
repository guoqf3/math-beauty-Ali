<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATTICE · 晶格矩阵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a18;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.7s ease;
            mix-blend-mode: screen;
        }
        .overlay:hover {
            opacity: 0.85;
        }
        .title {
            color: rgba(220, 230, 255, 0.7);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(120, 150, 250, 0.5);
        }
        .hint {
            color: rgba(170, 185, 220, 0.45);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            .overlay { bottom: 18px; }
            .title { font-size: 8px; letter-spacing: 0.45em; }
            .hint { font-size: 6px; letter-spacing: 0.22em; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">Lattice</div>
        <div class="hint">move · click</div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let nodes = [];          // 3D节点 {x, y, z}
            let projected = [];      // 投影后的2D坐标
            let edges = [];          // 边索引对
            let mouse = { x: -9999, y: -9999, active: false };
            let time = 0;
            let colorShift = 0;
            let rotationX = 0;
            let rotationY = 0;
            let rotationZ = 0;
            let targetRotX = 0;
            let targetRotY = 0;
            let autoRotSpeed = 0.25;
            let latticeSize = 4;     // 每维度节点数
            let nodeSpacing = 75;    // 节点间距
            let burstParticles = [];

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#0a0a18';
                ctx.fillRect(0, 0, W, H);
                // 根据屏幕调整节点间距
                const minDim = Math.min(W, H);
                nodeSpacing = Math.max(50, Math.min(110, minDim / 6.5));
            }

            // ─── 初始化晶格 ─────────────────────────────────────────────
            function initLattice() {
                nodes = [];
                projected = [];
                edges = [];
                const size = latticeSize;
                const offset = (size - 1) * nodeSpacing / 2;
                const centerX = W / 2;
                const centerY = H / 2;

                for (let z = 0; z < size; z++) {
                    for (let y = 0; y < size; y++) {
                        for (let x = 0; x < size; x++) {
                            nodes.push({
                                x: x * nodeSpacing - offset,
                                y: y * nodeSpacing - offset,
                                z: z * nodeSpacing - offset,
                            });
                            projected.push({ x: 0, y: 0, scale: 1, alpha: 0 });
                        }
                    }
                }

                // 生成边：连接相邻节点（距离为nodeSpacing）
                const idx = (x, y, z) => z * size * size + y * size + x;
                for (let z = 0; z < size; z++) {
                    for (let y = 0; y < size; y++) {
                        for (let x = 0; x < size; x++) {
                            const current = idx(x, y, z);
                            if (x + 1 < size) edges.push([current, idx(x + 1, y, z)]);
                            if (y + 1 < size) edges.push([current, idx(x, y + 1, z)]);
                            if (z + 1 < size) edges.push([current, idx(x, y, z + 1)]);
                        }
                    }
                }
            }

            // ─── 3D旋转与投影 ───────────────────────────────────────────
            function projectNodes() {
                const size = latticeSize;
                const totalNodes = nodes.length;
                const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);
                const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
                const cosZ = Math.cos(rotationZ), sinZ = Math.sin(rotationZ);
                const centerX = W / 2;
                const centerY = H / 2;

                for (let i = 0; i < totalNodes; i++) {
                    const n = nodes[i];
                    let x = n.x;
                    let y = n.y;
                    let z = n.z;

                    // 绕Y轴旋转
                    let x1 = x * cosY + z * sinY;
                    let z1 = -x * sinY + z * cosY;
                    // 绕X轴旋转
                    let y1 = y * cosX - z1 * sinX;
                    let z2 = y * sinX + z1 * cosX;
                    // 绕Z轴旋转
                    let x2 = x1 * cosZ - y1 * sinZ;
                    let y2 = x1 * sinZ + y1 * cosZ;

                    // 透视投影
                    const perspective = 900;
                    const depth = z2 + 350;
                    const scale = perspective / depth;
                    const screenX = x2 * scale + centerX;
                    const screenY = y2 * scale + centerY;

                    projected[i].x = screenX;
                    projected[i].y = screenY;
                    projected[i].scale = scale;
                    projected[i].alpha = Math.max(0.15, Math.min(1, scale * 0.65));
                }
            }

            // ─── 绘制晶格 ───────────────────────────────────────────────
            function drawLattice() {
                // 绘制边
                ctx.lineCap = 'round';
                const edgeCount = edges.length;
                for (let i = 0; i < edgeCount; i++) {
                    const [idx1, idx2] = edges[i];
                    const p1 = projected[idx1];
                    const p2 = projected[idx2];
                    const alpha = Math.min(p1.alpha, p2.alpha) * 0.3;
                    if (alpha < 0.02) continue;
                    
                    const avgScale = (p1.scale + p2.scale) / 2;
                    const hue = 220 + colorShift + avgScale * 30;
                    const light = 45 + avgScale * 30;
                    ctx.strokeStyle = `hsla(${hue}, 55%, ${light}%, ${alpha})`;
                    ctx.lineWidth = 0.6 + avgScale * 0.3;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }

                // 绘制节点
                for (let i = 0; i < projected.length; i++) {
                    const p = projected[i];
                    if (p.alpha < 0.1) continue;
                    const hue = 220 + colorShift + p.scale * 25;
                    const size = 1.5 + p.scale * 2.8;
                    const alpha = p.alpha * 0.7;

                    // 发光节点
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
                    gradient.addColorStop(0, `hsla(${hue}, 65%, 75%, ${alpha})`);
                    gradient.addColorStop(0.5, `hsla(${hue}, 60%, 65%, ${alpha * 0.5})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心
                    ctx.fillStyle = `hsla(${hue}, 70%, 85%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 爆发粒子 ───────────────────────────────────────────────
            function createBurst(x, y) {
                const count = 30 + Math.floor(Math.random() * 20);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 5;
                    burstParticles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 0.7 + Math.random() * 0.6,
                        maxLife: 1.3,
                        size: 1.2 + Math.random() * 2.5,
                        hue: 220 + colorShift + Math.random() * 60 - 30,
                        alpha: 0.8,
                    });
                }
                if (burstParticles.length > 180) {
                    burstParticles.splice(0, burstParticles.length - 180);
                }
            }

            function updateBurstParticles(dt) {
                for (let i = burstParticles.length - 1; i >= 0; i--) {
                    const p = burstParticles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                    p.life -= 0.022 * dt;
                    if (p.life <= 0) burstParticles.splice(i, 1);
                }
            }

            function drawBurstParticles(ctx) {
                for (const p of burstParticles) {
                    const alpha = p.life * p.alpha;
                    const size = p.size * p.life;
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
                    gradient.addColorStop(0, `hsla(${p.hue}, 70%, 75%, ${alpha})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 60;
                const hue = 220 + colorShift;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 60%, 75%, 0.05)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 50%, 70%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.016;
                    const dtNorm = fixedStep / 1000 * 60;

                    // 自动旋转
                    rotationY += autoRotSpeed * 0.01 * dtNorm;
                    rotationX += Math.sin(time * 0.4) * 0.002 * dtNorm;

                    // 鼠标影响旋转目标
                    if (mouse.active) {
                        const nx = mouse.x / W - 0.5;
                        const ny = mouse.y / H - 0.5;
                        targetRotX = ny * 0.8;
                        targetRotY = nx * 0.8;
                    } else {
                        targetRotX = Math.sin(time * 0.35) * 0.3;
                        targetRotY = time * 0.15;
                    }

                    // 平滑插值旋转
                    rotationX += (targetRotX - rotationX) * 0.02;
                    rotationY += (targetRotY - rotationY) * 0.02;

                    // 投影节点
                    projectNodes();
                    updateBurstParticles(dtNorm);
                }

                // 清除画布
                ctx.fillStyle = '#0a0a18';
                ctx.fillRect(0, 0, W, H);

                // 绘制晶格
                drawLattice();

                // 绘制爆发粒子
                drawBurstParticles(ctx);

                // 鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createBurst(mouse.x, mouse.y);
                colorShift += 30 + Math.random() * 30;
                if (colorShift > 150) colorShift = -30;
                // 随机调整晶格
                latticeSize = 3 + Math.floor(Math.random() * 2); // 3或4
                if (Math.random() < 0.3) latticeSize = 5;
                initLattice();
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createBurst(mouse.x, mouse.y);
                    colorShift += 30 + Math.random() * 30;
                    if (colorShift > 150) colorShift = -30;
                    latticeSize = 3 + Math.floor(Math.random() * 2);
                    if (Math.random() < 0.3) latticeSize = 5;
                    initLattice();
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            function onResize() {
                setupCanvas();
                initLattice();
                burstParticles = [];
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initLattice();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0a0a18';
                    ctx.fillRect(0, 0, W, H);
                }
            });
        })();
    </script>
</body>
</html>
