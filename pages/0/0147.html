<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>克莱因瓶 · 莫比乌斯 · 李群轨道</title>
    <style>
        :root {
            --bg: #07070e;
            --gold: #e0b664;
            --cyan: #3ebfb4;
            --rose: #e04060;
            --text: #cfc2a6;
            --text-dim: #90806a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 2.1vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1.05rem, 2.3vw, 1.6rem);
            font-weight: 400;
            letter-spacing: 0.22em;
            color: #e5d4ab;
            text-shadow: 0 0 35px rgba(224, 182, 100, 0.4), 0 0 75px rgba(224, 182, 100, 0.15);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 1.05vw, 0.7rem);
            letter-spacing: 0.25em;
            color: #a69278;
            opacity: 0.65;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(7, 7, 14, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(150, 130, 105, 0.2);
            border-radius: 18px;
            padding: 1.1vh 2.6vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.7rem, 1.45vw, 1rem);
            color: #cfbfa0;
            letter-spacing: 0.08em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.48rem, 0.9vw, 0.65rem);
            color: #8c7d68;
            letter-spacing: 0.1em;
            margin-top: 0.3vh;
            opacity: 0.75;
        }

        .accent-gold {
            color: #e0b664;
        }
        .accent-cyan {
            color: #3ebfb4;
        }
        .accent-rose {
            color: #e04060;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.6s ease-out 0.3s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>克莱因瓶 · 莫比乌斯变换 · 李群轨道</h1>
        <div class="subtitle">浸入曲面 &nbsp;·&nbsp; ruling扫描 &nbsp;·&nbsp; so(3)指数映射织网</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">𝒦(u,v) ⊂ ℝ³</span>
            &nbsp;⊕&nbsp;
            <span class="accent-cyan">ℳ = {c(u)+v·d(u)}</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">γ(s)=exp(s·A)·v₀</span>
        </div>
        <div class="formula-detail">
            克莱因瓶浸入 &nbsp;·&nbsp; 莫比乌斯带直纹线族 &nbsp;·&nbsp; 李代数so(3)轨道 &nbsp;·&nbsp; 拓扑编织
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x07070e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(
            55,
            window.innerWidth / window.innerHeight,
            0.5,
            30
        );
        camera.position.set(3.1, 1.7, 7.4);
        camera.lookAt(0, 0, 0);

        // ==================== 颜色定义 ====================
        const colorGold = new THREE.Color('#e0b664');
        const colorCyan = new THREE.Color('#3ebfb4');
        const colorRose = new THREE.Color('#e04060');

        // ==================== 背景星点 ====================
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 250;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 5.5 + Math.random() * 8.5;
            starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            starPos[i * 3 + 2] = r * Math.cos(phi);
            starSizes[i] = Math.random() * 1.9 + 0.3;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x322a20,
            size: 0.023,
            transparent: true,
            opacity: 0.48,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        // 极淡参考结构：大球壳线框
        const refSphereGeom = new THREE.SphereGeometry(2.85, 52, 38);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({
                color: 0x1a1814,
                transparent: true,
                opacity: 0.11,
                depthWrite: false,
            })
        );
        scene.add(refSphereWire);

        // 极淡参考环面
        const refTorusGeom = new THREE.TorusGeometry(2.25, 0.7, 12, 34);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({
                color: 0x141b1e,
                transparent: true,
                opacity: 0.1,
                depthWrite: false,
            })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ==================== 曲线系统 ====================
        const allCurves = [];
        const POINTS_PER_CURVE = 540;

        /**
         * 创建一条动态更新的曲线
         * @param {THREE.Color} color
         * @param {Function} updateFn - (t, i, total, positionsArray) => void
         */
        function createCurve(color, updateFn) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            // 初始随机填充避免空视口
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.01;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.01;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.01;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.86,
                depthTest: true,
                depthWrite: true,
            });

            const line = new THREE.Line(geometry, material);
            scene.add(line);

            const curveObj = { line, geometry, positions, updateFn };
            allCurves.push(curveObj);
            return curveObj;
        }

        // ==================== 组1：克莱因瓶上的缠绕组 (金色) ====================
        const kleinCount = 9;
        for (let k = 0; k < kleinCount; k++) {
            const vBase = (k / kleinCount) * Math.PI * 2; // 基本v参数偏移
            const nFreq = 1.7 + k * 0.25; // u的变化速率倍率
            const ampV = 0.55 + k * 0.05; // v的调制幅度
            const phaseK = k * 0.9;
            const rotXBase = k * 0.7;
            const rotYBase = k * 0.95;
            const rotZBase = k * 0.45;

            createCurve(colorGold, (t, i, total, arr) => {
                const idx = i * 3;
                // u 从 0 到 4π 充分展示克莱因瓶的自交结构
                const u = (i / total) * Math.PI * 4;
                // v 在基值上随时间和u波动，形成瓶面上舞动的曲线
                const v = vBase + ampV * Math.sin(nFreq * u + t * 0.7 + phaseK)
                         + 0.18 * Math.cos(2.3 * u - t * 0.5 + phaseK * 1.2);

                // 克莱因瓶浸入方程 (标准参数化，缩放系数调整大小)
                const a = 2.0;
                const cosU2 = Math.cos(u / 2);
                const sinU2 = Math.sin(u / 2);
                const sinV = Math.sin(v);
                const sin2V = Math.sin(2 * v);

                const bracket = a + cosU2 * sinV - sinU2 * sin2V;
                const cosU = Math.cos(u);
                const sinU = Math.sin(u);

                let x0 = bracket * cosU * 0.55;
                let y0 = bracket * sinU * 0.55;
                let z0 = (sinU2 * sinV + cosU2 * sin2V) * 0.55;

                // 应用三维旋转，增加视觉复杂度
                const rx = rotXBase + t * 0.14;
                const ry = rotYBase + t * 0.18;
                const rz = rotZBase + t * 0.11;
                const cx = Math.cos(rx), sx = Math.sin(rx);
                const cy = Math.cos(ry), sy = Math.sin(ry);
                const cz = Math.cos(rz), sz = Math.sin(rz);

                const x1 = x0 * cz - y0 * sz;
                const y1 = x0 * sz + y0 * cz;
                const z1 = z0;
                const y2 = y1 * cx - z1 * sx;
                const z2 = y1 * sx + z1 * cx;
                const x2 = x1;
                const x3 = x2 * cy + z2 * sy;
                const z3 = -x2 * sy + z2 * cy;
                const y3 = y2;

                arr[idx] = x3;
                arr[idx + 1] = y3;
                arr[idx + 2] = z3;
            });
        }

        // ==================== 组2：莫比乌斯直纹线族的动态扫描 (青色) ====================
        const mobiusCount = 9;
        for (let k = 0; k < mobiusCount; k++) {
            // v0 决定了在莫比乌斯带上的位置（从 -width 到 +width）
            const width = 0.65;
            const baseV = (k / (mobiusCount - 1)) * 2 - 1; // [-1, 1]
            const v0 = baseV * width;
            const modAmp = 0.22;
            const modFreq = 2.2 + k * 0.3;
            const phaseM = k * 1.1;
            const rotXM = k * 0.65;
            const rotYM = k * 0.85;

            createCurve(colorCyan, (t, i, total, arr) => {
                const idx = i * 3;
                const u = (i / total) * Math.PI * 2;
                // v 在基础值上随时间小幅振动，使线条在带面上温柔扫描
                const v = v0 + modAmp * Math.sin(modFreq * u + t * 0.65 + phaseM);

                // 莫比乌斯带中心线 (单位圆在xy平面)
                const cosU = Math.cos(u);
                const sinU = Math.sin(u);
                // 直纹方向向量 (扭转)
                const halfU = u / 2;
                const dX = -Math.sin(halfU) * cosU;
                const dY = -Math.sin(halfU) * sinU;
                const dZ = Math.cos(halfU);

                // 带上的三维点
                let x0 = cosU + v * dX;
                let y0 = sinU + v * dY;
                let z0 = v * dZ;

                // 整体缩放，使线条占据合理的空间范围
                const scale = 1.65;
                x0 *= scale;
                y0 *= scale;
                z0 *= scale;

                // 全局旋转
                const rx = rotXM + t * 0.15;
                const ry = rotYM + t * 0.19;
                const cx = Math.cos(rx), sx = Math.sin(rx);
                const cy = Math.cos(ry), sy = Math.sin(ry);

                const y1 = y0 * cx - z0 * sx;
                const z1 = y0 * sx + z0 * cx;
                const x1 = x0;
                const x2 = x1 * cy + z1 * sy;
                const z2 = -x1 * sy + z1 * cy;
                const y2 = y1;

                arr[idx] = x2;
                arr[idx + 1] = y2;
                arr[idx + 2] = z2;
            });
        }

        // ==================== 组3：李群SO(3)轨道 (玫红) ====================
        const lieCount = 8;
        // 预设一些李代数元素（轴）和初始向量，保证多样性
        const lieParams = [
            { axis: [0.8, 0.5, 0.3], v0: [1.2, 0.5, 0.7] },
            { axis: [0.3, -0.7, 0.6], v0: [-0.8, 1.0, 0.4] },
            { axis: [-0.5, 0.2, 0.85], v0: [0.5, -0.9, 0.6] },
            { axis: [0.65, -0.4, -0.5], v0: [-0.6, -0.7, 0.8] },
            { axis: [0.1, 0.9, 0.4], v0: [0.9, 0.3, -0.55] },
            { axis: [-0.7, -0.3, 0.55], v0: [0.4, 0.85, -0.5] },
            { axis: [0.45, 0.65, -0.5], v0: [-0.7, 0.4, 0.55] },
            { axis: [-0.4, 0.55, 0.7], v0: [0.55, -0.6, -0.5] },
        ];

        for (let k = 0; k < lieCount; k++) {
            const param = lieParams[k];
            // 归一化轴
            const aLen = Math.sqrt(param.axis[0]**2 + param.axis[1]**2 + param.axis[2]**2);
            const ax = param.axis[0] / aLen;
            const ay = param.axis[1] / aLen;
            const az = param.axis[2] / aLen;
            const v0x = param.v0[0];
            const v0y = param.v0[1];
            const v0z = param.v0[2];

            createCurve(colorRose, (t, i, total, arr) => {
                const idx = i * 3;
                // 参数 s 范围较大，以展现完整的旋转轨道
                const s = (i / total) * Math.PI * 2.5 - Math.PI * 1.25;

                // 轴可以随时间有微小扰动，使轨道不断变形
                const eps = 0.07;
                const axT = ax + eps * Math.sin(t * 0.4 + k);
                const ayT = ay + eps * Math.cos(t * 0.55 + k * 1.3);
                const azT = az + eps * Math.sin(t * 0.45 + k * 0.8);
                const normT = Math.sqrt(axT*axT + ayT*ayT + azT*azT);
                const nax = axT / normT;
                const nay = ayT / normT;
                const naz = azT / normT;

                // 旋转角度就是参数 s
                const cosS = Math.cos(s);
                const sinS = Math.sin(s);

                // 罗德里格斯旋转公式 R = I + sin(s)*K + (1-cos(s))*K^2
                // 其中 K 是叉积矩阵
                const k11 = 0, k12 = -naz, k13 = nay;
                const k21 = naz, k22 = 0, k23 = -nax;
                const k31 = -nay, k32 = nax, k33 = 0;

                // 计算 K^2
                const k2_11 = -naz*naz - nay*nay;
                const k2_12 = nax*nay;
                const k2_13 = nax*naz;
                const k2_21 = nax*nay;
                const k2_22 = -naz*naz - nax*nax;
                const k2_23 = nay*naz;
                const k2_31 = nax*naz;
                const k2_32 = nay*naz;
                const k2_33 = -nay*nay - nax*nax;

                // R * v0
                const omc = 1 - cosS;
                const x0 = v0x + sinS*(k11*v0x + k12*v0y + k13*v0z) + omc*(k2_11*v0x + k2_12*v0y + k2_13*v0z);
                const y0 = v0y + sinS*(k21*v0x + k22*v0y + k23*v0z) + omc*(k2_21*v0x + k2_22*v0y + k2_23*v0z);
                const z0 = v0z + sinS*(k31*v0x + k32*v0y + k33*v0z) + omc*(k2_31*v0x + k2_32*v0y + k2_33*v0z);

                // 整体缩放并轻微位移，分散轨道位置
                const sc = 1.5;
                arr[idx] = x0 * sc + 0.1;
                arr[idx + 1] = y0 * sc - 0.1;
                arr[idx + 2] = z0 * sc;
            });
        }

        // ==================== 额外：拓扑三叶结变体 (混合颜色) ====================
        const extraCount = 3;
        const extraColors = [colorCyan, colorRose, colorGold];
        for (let k = 0; k < extraCount; k++) {
            const col = extraColors[k];
            const rTrefoil = 1.35 + k * 0.3;
            const aTrefoil = 0.55 + k * 0.15;
            const freqT = 1.7 + k * 0.25;
            const phaseT = k * 1.8;

            createCurve(col, (t, i, total, arr) => {
                const idx = i * 3;
                const s = (i / total) * Math.PI * 2;
                // 三叶结参数方程，加入时间扰动
                const inner = s * freqT + t * 0.6 + phaseT;
                const x0 = rTrefoil * (Math.sin(inner) + 2 * Math.sin(2 * inner)) * 0.6;
                const y0 = rTrefoil * (Math.cos(inner) - 2 * Math.cos(2 * inner)) * 0.6;
                const z0 = aTrefoil * Math.sin(3 * inner) * 1.3;
                arr[idx] = x0;
                arr[idx + 1] = y0;
                arr[idx + 2] = z0;
            });
        }

        console.log(
            `✅ 曲线系统: ${allCurves.length}条 (金:${kleinCount}, 青:${mobiusCount}, 玫红:${lieCount}, 额外:${extraCount}), 每条${POINTS_PER_CURVE}顶点`
        );

        // ==================== 流动粒子系统 ====================
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];

        for (let i = 0; i < particleCount; i++) {
            const ci = i % allCurves.length;
            particleData.push({
                curveIndex: ci,
                progress: Math.random(),
                speed: 0.0007 + Math.random() * 0.0024,
            });
            let col;
            if (i < 7) col = colorGold.clone();
            else if (i < 14) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = 0;
            particlePosArr[i * 3 + 1] = 0;
            particlePosArr[i * 3 + 2] = 0;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.055,
            vertexColors: true,
            transparent: true,
            opacity: 0.88,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        // ==================== 动画循环 ====================
        let animationTime = 0;
        let lastTime = performance.now() / 1000;
        let frameCount = 0;
        let lastLogTime = lastTime;

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const now = timestamp / 1000;
            let dt = now - lastTime;
            lastTime = now;

            // 防止大帧跳跃（如标签页隐藏后恢复）
            if (dt <= 0 || dt > 0.2) dt = 0.016;
            animationTime += dt;
            frameCount++;

            // 每8秒输出状态
            if (now - lastLogTime > 8) {
                const fps = Math.round(frameCount / (now - lastLogTime));
                console.log(`🔄 运行中 | FPS: ${fps} | 时间: ${animationTime.toFixed(1)}s`);
                frameCount = 0;
                lastLogTime = now;
            }

            // 更新所有曲线顶点
            for (const curveObj of allCurves) {
                const { positions, updateFn } = curveObj;
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    updateFn(animationTime, i, POINTS_PER_CURVE, positions);
                }
                curveObj.geometry.attributes.position.needsUpdate = true;
            }

            // 更新流动粒子
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;

                const curveObj = allCurves[pd.curveIndex];
                const posArr = curveObj.positions;
                const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                const frac = floatIdx - idx0;
                const i0 = idx0 * 3, i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;

            // 参考结构微动
            const breathe = 1 + 0.05 * Math.sin(animationTime * 0.4) * Math.cos(animationTime * 0.3);
            refSphereWire.scale.setScalar(breathe);
            refSphereWire.rotation.x += dt * 0.07;
            refSphereWire.rotation.y += dt * 0.06;

            refTorusWire.rotation.z += dt * 0.07;
            const torBreathe = 1 + 0.06 * Math.sin(animationTime * 0.48) * Math.cos(animationTime * 0.35);
            refTorusWire.scale.setScalar(torBreathe);

            // 相机环绕
            const camHAngle = animationTime * 0.11;
            const camVAngle = 0.33 + 0.17 * Math.sin(animationTime * 0.17);
            const camDist = 7.1 + 0.65 * Math.sin(animationTime * 0.23) * Math.cos(animationTime * 0.29);
            camera.position.set(
                camDist * Math.cos(camVAngle) * Math.sin(camHAngle),
                camDist * Math.sin(camVAngle),
                camDist * Math.cos(camVAngle) * Math.cos(camHAngle)
            );
            camera.lookAt(0.06 * Math.sin(animationTime * 0.12), 0.03 * Math.cos(animationTime * 0.15), 0);

            stars.rotation.y += dt * 0.016;
            stars.rotation.x += dt * 0.012;

            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150), { passive: true });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                lastTime = performance.now() / 1000;
            }
        });

        // ==================== 启动预渲染与循环 ====================
        console.log('🚀 克莱因瓶·莫比乌斯·李群轨道 动画初始化...');
        console.log(`   曲线: ${allCurves.length}条, 粒子: ${particleCount}个, 顶点/曲线: ${POINTS_PER_CURVE}`);

        // 初始化第一帧顶点
        for (const curveObj of allCurves) {
            const { positions, updateFn } = curveObj;
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                updateFn(0, i, POINTS_PER_CURVE, positions);
            }
            curveObj.geometry.attributes.position.needsUpdate = true;
        }
        renderer.render(scene, camera);

        // 启动动画循环
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动，画面持续运动中');
    </script>
</body>
</html>
