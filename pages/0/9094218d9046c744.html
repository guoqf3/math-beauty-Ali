<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>球谐函数球面云</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#050310}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:#e8dcff;-webkit-font-smoothing:antialiased;
  }
  #glcanvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}

  .panel{
    position:absolute;
    background:rgba(14,8,28,.62);
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(170,120,255,.20);
    border-radius:18px;
    padding:16px 18px;
    pointer-events:auto;
    box-shadow:0 16px 48px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---- 标题 ---- */
  #info{top:22px;left:22px}
  #info h1{
    font-size:17px;letter-spacing:5px;font-weight:600;
    background:linear-gradient(92deg,#b98aff 0%,#6ec8ff 50%,#ff9ed8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 32px rgba(150,100,255,.35);
  }
  #info .formula{
    margin-top:9px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;color:#b8a0e8;letter-spacing:.8px;line-height:1.7;
  }
  #info .formula em{color:#6ec8ff;font-style:normal}
  #info .hint{
    margin-top:10px;font-size:10.5px;color:#66588a;letter-spacing:.6px;
  }

  /* ---- 控制面板 ---- */
  #controls{left:22px;bottom:22px;width:268px}
  .ctrl{margin-bottom:15px}
  .ctrl:last-child{margin-bottom:0}
  .ctrl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:#b8a8d8;margin-bottom:9px;letter-spacing:.8px;
  }
  .ctrl label span{
    color:#b98aff;font-family:ui-monospace,monospace;font-size:12px;
    text-shadow:0 0 12px rgba(185,138,255,.7);
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#b98aff,#6ec8ff,#ff9ed8);
    outline:none;cursor:pointer;
    box-shadow:0 0 12px rgba(150,100,255,.4);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#b98aff 58%,#5a2fa0);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(185,138,255,1);
    cursor:pointer;transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22)}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#b98aff 58%,#5a2fa0);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(185,138,255,1);
    cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    height:4px;border-radius:3px;
    background:linear-gradient(90deg,#b98aff,#6ec8ff,#ff9ed8);
  }

  /* ---- 读数 ---- */
  #readout{top:22px;right:22px;width:224px}
  #readout .ttl{
    font-size:10.5px;color:#66588a;letter-spacing:2px;
    margin-bottom:10px;text-transform:uppercase;
  }
  .ro-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;padding:5px 0;
    border-bottom:1px dashed rgba(170,120,255,.14);
  }
  .ro-row:last-child{border-bottom:none}
  .ro-row>span{color:#8f7eb0;letter-spacing:.6px}
  .ro-row>b{
    font-family:ui-monospace,monospace;font-weight:500;
    color:#cfb0ff;font-size:12px;
  }
  .ro-row.hi>b{color:#6ec8ff;text-shadow:0 0 12px rgba(110,200,255,.75)}

  @media(max-width:720px){
    #info h1{font-size:14px;letter-spacing:3px}
    #info .hint{display:none}
    #controls{width:206px;padding:12px 14px}
    #readout{width:172px;padding:12px 13px}
    .ro-row{font-size:10.5px}
    .ro-row>b{font-size:11px}
  }
</style>
</head>
<body>

<canvas id="glcanvas"></canvas>

<div id="ui">
  <div class="panel" id="info">
    <h1>球谐函数球面云</h1>
    <div class="formula">
      r(θ,φ) = 1 + <em>A</em>·Y<sub>lm</sub>(θ,φ) + 叠加谐波
    </div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击云面</div>
  </div>

  <div class="panel" id="controls">
    <div class="ctrl">
      <label>阶数 l<span id="valL">4</span></label>
      <input type="range" id="sliderL" min="1" max="8" step="1" value="4">
    </div>
    <div class="ctrl">
      <label>磁量子数 m<span id="valM">2</span></label>
      <input type="range" id="sliderM" min="-4" max="4" step="1" value="2">
    </div>
    <div class="ctrl">
      <label>振幅 A<span id="valA">0.55</span></label>
      <input type="range" id="sliderA" min="0.10" max="1.20" step="0.01" value="0.55">
    </div>
    <div class="ctrl">
      <label>叠加层数<span id="valLayers">2</span></label>
      <input type="range" id="sliderLayers" min="1" max="4" step="1" value="2">
    </div>
  </div>

  <div class="panel" id="readout">
    <div class="ttl">云面读数</div>
    <div class="ro-row"><span>极角 θ</span><b id="roTheta">—</b></div>
    <div class="ro-row"><span>方位 φ</span><b id="roPhi">—</b></div>
    <div class="ro-row"><span>径向 r</span><b id="roR">—</b></div>
    <div class="ro-row"><span>Y<sub>lm</sub> 值</span><b id="roY">—</b></div>
    <div class="ro-row hi"><span>模式</span><b id="roMode">l=4, m=2</b></div>
  </div>
</div>

<script>
(function () {
'use strict';

/* =========================================================
   0. 数学：球谐函数
   ========================================================= */
const LOG_FACT = [0];
function logFactorial(n) {
  for (let i = LOG_FACT.length; i <= n; i++) {
    LOG_FACT[i] = LOG_FACT[i - 1] + Math.log(i);
  }
  return LOG_FACT[n];
}

/* 连带勒让德多项式 P_l^m(x)，含 Condon–Shortley 相位 */
function plgndr(l, m, x) {
  const am = Math.abs(m);
  if (am > l) return 0;

  let pmm = 1;
  if (am > 0) {
    const somx2 = Math.sqrt(Math.max(0, 1 - x * x));
    let fact = 1;
    for (let i = 1; i <= am; i++) {
      pmm *= -fact * somx2;
      fact += 2;
    }
  }

  if (l === am) return pmm;

  let pmmp1 = x * (2 * am + 1) * pmm;
  if (l === am + 1) return pmmp1;

  let pll = 0;
  for (let ll = am + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + am - 1) * pmm) / (ll - am);
    pmm = pmmp1;
    pmmp1 = pll;
  }
  return pll;
}

/* 实球谐函数 Y_lm(θ, φ)（标准归一化） */
function sphHarm(l, m, theta, phi) {
  const am = Math.abs(m);
  if (am > l) return 0;

  const x = Math.cos(theta);
  const P = plgndr(l, am, x);

  const logK = 0.5 * (
    Math.log((2 * l + 1) / (4 * Math.PI)) +
    logFactorial(l - am) - logFactorial(l + am)
  );
  const K = Math.exp(logK);

  if (m > 0)  return Math.SQRT2 * K * Math.cos(m * phi) * P;
  if (m < 0)  return Math.SQRT2 * K * Math.sin(am * phi) * P;
  return K * P;
}

/* =========================================================
   1. 全局状态
   ========================================================= */
const state = {
  l: 4,
  m: 2,
  amp: 0.55,
  layers: 2,
};

let needsRebuild = true;

/* =========================================================
   2. 径向扰动函数
   ========================================================= */
function computeY(l, m, theta, phi, layers) {
  let sum = sphHarm(l, m, theta, phi);

  if (layers >= 2) {
    sum += 0.62 * sphHarm(2, 0, theta, phi);
    sum += 0.48 * sphHarm(3, 2, theta, phi);
  }
  if (layers >= 3) {
    sum += 0.36 * sphHarm(4, -2, theta, phi);
    sum += 0.28 * sphHarm(5, 3, theta, phi);
  }
  if (layers >= 4) {
    sum += 0.22 * sphHarm(6, -4, theta, phi);
    sum += 0.18 * sphHarm(7, 5, theta, phi);
  }
  return sum;
}

function radiusAt(theta, phi) {
  const y = computeY(state.l, state.m, theta, phi, state.layers);
  return 1 + state.amp * y;
}

/* =========================================================
   3. WebGL 初始化
   ========================================================= */
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl', {
  antialias: true,
  alpha: false,
  depth: true,
  powerPreference: 'high-performance',
}) || canvas.getContext('experimental-webgl');

if (!gl) {
  document.body.innerHTML = '<div style="padding:40px;color:#b98aff;font-size:14px">' +
    '当前环境不支持 WebGL，请更换浏览器或开启硬件加速。</div>';
  return;
}

/* =========================================================
   4. 着色器
   ========================================================= */
const VS_SRC = `
precision highp float;

attribute vec3 aPos;
attribute vec3 aNormal;
attribute float aDisp;

uniform mat4 uProj;
uniform mat4 uView;

varying vec3  vWorldPos;
varying vec3  vNormal;
varying float vDisp;

void main() {
  vWorldPos = aPos;
  vNormal   = aNormal;
  vDisp     = aDisp;

  gl_Position = uProj * uView * vec4(aPos, 1.0);
}
`;

const FS_SRC = `
precision highp float;

uniform vec3  uCamPos;
uniform float uTime;
uniform vec3  uHoverPos;
uniform float uHoverStrength;

varying vec3  vWorldPos;
varying vec3  vNormal;
varying float vDisp;

void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCamPos - vWorldPos);

  /* 双面渲染：法线始终朝向观察者 */
  if (dot(N, V) < 0.0) N = -N;

  float ndv  = clamp(dot(N, V), 0.0, 1.0);
  float fres = pow(1.0 - ndv, 2.6);

  /* ---- 位移归一化到 0..1 ---- */
  float t = clamp(vDisp * 0.5 + 0.5, 0.0, 1.0);

  /* ---- 空灵星系调色板 ---- */
  vec3 colDeep  = vec3(0.055, 0.025, 0.180);
  vec3 colMid   = vec3(0.180, 0.480, 0.920);
  vec3 colHigh  = vec3(0.960, 0.520, 0.900);
  vec3 colPeak  = vec3(1.000, 0.880, 0.640);

  vec3 base = mix(colDeep, colMid, smoothstep(0.05, 0.55, t));
  base = mix(base, colHigh, smoothstep(0.55, 0.88, t));
  base = mix(base, colPeak, smoothstep(0.88, 1.0, t));

  /* ---- 三向布光 ---- */
  vec3 L1 = normalize(vec3( 0.58,  1.00,  0.48));
  vec3 L2 = normalize(vec3(-0.72,  0.28, -0.60));
  vec3 L3 = normalize(vec3( 0.10, -0.88,  0.44));

  float d1 = max(dot(N, L1), 0.0);
  float d2 = max(dot(N, L2), 0.0);
  float d3 = max(dot(N, L3), 0.0);

  vec3 col = base * (0.26 + 0.82 * d1);
  col += base * vec3(0.46, 0.70, 1.00) * d2 * 0.58;
  col += base * vec3(1.00, 0.68, 0.88) * d3 * 0.42;

  /* ---- 主高光 ---- */
  vec3 H1 = normalize(L1 + V);
  float spec1 = pow(max(dot(N, H1), 0.0), 120.0);
  col += vec3(1.00, 0.98, 0.95) * spec1 * 1.25;

  /* ---- 次高光 ---- */
  vec3 H2 = normalize(L2 + V);
  float spec2 = pow(max(dot(N, H2), 0.0), 56.0);
  col += vec3(0.80, 0.92, 1.00) * spec2 * 0.48;

  /* ---- 菲涅尔边缘辉光 ---- */
  col += vec3(0.50, 0.78, 1.00) * fres * 1.15;

  /* ---- 星点闪烁：基于世界坐标的细节噪声 ---- */
  float sp1 = sin(vWorldPos.x * 26.0 + uTime * 2.4)
            * cos(vWorldPos.y * 22.0 - uTime * 1.9)
            * sin(vWorldPos.z * 24.0 + uTime * 2.1);
  float sparkle = smoothstep(0.55, 1.0, sp1);
  col += vec3(1.00, 0.96, 0.88) * sparkle * 0.16 * (0.4 + 0.6 * fres);

  /* ---- 悬停高亮 ---- */
  float hd = distance(vWorldPos, uHoverPos);
  float hover = smoothstep(0.55, 0.10, hd) * uHoverStrength;
  col += vec3(0.80, 1.00, 0.92) * hover * 0.65;
  col = mix(col, col * 1.28 + vec3(0.10, 0.16, 0.12), hover * 0.45);

  /* ---- 软压缩：防止高光死白 ---- */
  col = 1.0 - exp(-col * 1.25);

  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s), src);
    throw new Error('shader compile error');
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS_SRC));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS_SRC));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(prog));
  throw new Error('program link error');
}
gl.useProgram(prog);

const LOC = {
  aPos:    gl.getAttribLocation(prog, 'aPos'),
  aNormal: gl.getAttribLocation(prog, 'aNormal'),
  aDisp:   gl.getAttribLocation(prog, 'aDisp'),
  uProj:   gl.getUniformLocation(prog, 'uProj'),
  uView:   gl.getUniformLocation(prog, 'uView'),
  uCamPos: gl.getUniformLocation(prog, 'uCamPos'),
  uTime:   gl.getUniformLocation(prog, 'uTime'),
  uHoverPos: gl.getUniformLocation(prog, 'uHoverPos'),
  uHoverStrength: gl.getUniformLocation(prog, 'uHoverStrength'),
};

/* =========================================================
   5. 球面几何构建
   ========================================================= */
const N_T = 80;
const N_P = 160;

let posBuf = null, nrmBuf = null, dispBuf = null, idxBuf = null;
let indexCount = 0;
let vertexCount = 0;
let vertexPositions = null;

function buildGeometry() {
  const rows = N_T + 1;
  const cols = N_P + 1;
  const count = rows * cols;

  const positions = new Float32Array(count * 3);
  const normals   = new Float32Array(count * 3);
  const disps     = new Float32Array(count);

  let idx = 0;
  for (let j = 0; j <= N_T; j++) {
    const theta = Math.PI * j / N_T;
    const sinT = Math.sin(theta);
    const cosT = Math.cos(theta);

    for (let i = 0; i <= N_P; i++) {
      const phi = 2 * Math.PI * i / N_P;

      const y = computeY(state.l, state.m, theta, phi, state.layers);
      const r = 1 + state.amp * y;

      positions[idx * 3]     = r * sinT * Math.cos(phi);
      positions[idx * 3 + 1] = r * cosT;
      positions[idx * 3 + 2] = r * sinT * Math.sin(phi);

      disps[idx] = y;
      idx++;
    }
  }

  /* ---- 用网格邻接关系计算法线 ---- */
  const at = (i, j) => j * cols + i;

  for (let j = 0; j <= N_T; j++) {
    for (let i = 0; i <= N_P; i++) {
      const c = at(i, j);

      let iL = i - 1, iR = i + 1;
      let jU = j - 1, jD = j + 1;

      if (iL < 0) iL = N_P;
      if (iR > N_P) iR = 0;
      if (jU < 0) jU = 0;
      if (jD > N_T) jD = N_T;

      const A = at(iL, j);
      const B = at(iR, j);
      const C = at(i, jU);
      const D = at(i, jD);

      const ax = positions[B * 3]     - positions[A * 3];
      const ay = positions[B * 3 + 1] - positions[A * 3 + 1];
      const az = positions[B * 3 + 2] - positions[A * 3 + 2];

      const bx = positions[D * 3]     - positions[C * 3];
      const by = positions[D * 3 + 1] - positions[C * 3 + 1];
      const bz = positions[D * 3 + 2] - positions[C * 3 + 2];

      /* N = T_phi × T_theta */
      let nx = ay * bz - az * by;
      let ny = az * bx - ax * bz;
      let nz = ax * by - ay * bx;

      let len = Math.sqrt(nx * nx + ny * ny + nz * nz);

      if (len < 1e-8) {
        /* 极点退化：直接用径向 */
        nx = positions[c * 3];
        ny = positions[c * 3 + 1];
        nz = positions[c * 3 + 2];
        len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      }

      normals[c * 3]     = nx / len;
      normals[c * 3 + 1] = ny / len;
      normals[c * 3 + 2] = nz / len;
    }
  }

  /* ---- 索引 ---- */
  const indices = new Uint16Array(N_T * N_P * 6);
  let k = 0;
  for (let j = 0; j < N_T; j++) {
    for (let i = 0; i < N_P; i++) {
      const a = j * cols + i;
      const b = a + 1;
      const c = (j + 1) * cols + i;
      const d = c + 1;

      indices[k++] = a; indices[k++] = c; indices[k++] = b;
      indices[k++] = b; indices[k++] = c; indices[k++] = d;
    }
  }

  /* ---- 上传 GPU ---- */
  if (!posBuf)  posBuf  = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

  if (!nrmBuf)  nrmBuf  = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, nrmBuf);
  gl.bufferData(gl.ARRAY_BUFFER, normals, gl.STATIC_DRAW);

  if (!dispBuf) dispBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, dispBuf);
  gl.bufferData(gl.ARRAY_BUFFER, disps, gl.STATIC_DRAW);

  if (!idxBuf)  idxBuf  = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

  vertexCount = count;
  indexCount = indices.length;
  vertexPositions = positions;
}

/* =========================================================
   6. 相机（球坐标轨道）
   ========================================================= */
const cam = {
  theta: Math.PI * 0.62,
  phi: Math.PI * 0.42,
  dist: 4.6,
  tx: 0, ty: 0, tz: 0,
};
const camT = Object.assign({}, cam);

function eyePosition(out) {
  const sp = Math.sin(cam.phi);
  out[0] = cam.tx + cam.dist * sp * Math.cos(cam.theta);
  out[1] = cam.ty + cam.dist * Math.cos(cam.phi);
  out[2] = cam.tz + cam.dist * sp * Math.sin(cam.theta);
  return out;
}

/* =========================================================
   7. 矩阵工具
   ========================================================= */
function mat4Perspective(out, fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy / 2);
  const nf = 1.0 / (near - far);
  out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
  out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
  out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
  out[12] = 0; out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
  return out;
}

function mat4LookAt(out, eye, center, up) {
  let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
  let l = Math.hypot(zx, zy, zz) || 1;
  zx /= l; zy /= l; zz /= l;

  let xx = up[1] * zz - up[2] * zy;
  let xy = up[2] * zx - up[0] * zz;
  let xz = up[0] * zy - up[1] * zx;
  l = Math.hypot(xx, xy, xz);
  if (l < 1e-6) { xx = 1; xy = 0; xz = 0; } else { xx /= l; xy /= l; xz /= l; }

  const yx = zy * xz - zz * xy;
  const yy = zz * xx - zx * xz;
  const yz = zx * xy - zy * xx;

  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
  out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
  out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
  out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
  out[15] = 1;
  return out;
}

/* =========================================================
   8. 音频引擎
   ========================================================= */
let actx = null;
let masterGain = null;
let audioReady = false;

let ambOscs = [];
let ambGain = null;
let ambFilter = null;
let ambDelay = null;
let ambFeedback = null;

function makeImpulse(ctx, seconds, decay) {
  const rate = ctx.sampleRate;
  const len = Math.floor(rate * seconds);
  const buf = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

function initAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { actx = new AC(); } catch (e) { return; }
  if (actx.state === 'suspended') actx.resume();

  masterGain = actx.createGain();
  masterGain.gain.value = 0.50;
  masterGain.connect(actx.destination);

  /* ---- 空灵环绕氛围：多个失谐正弦 + 低通 + 反馈延迟 ---- */
  ambFilter = actx.createBiquadFilter();
  ambFilter.type = 'lowpass';
  ambFilter.frequency.value = 620;
  ambFilter.Q.value = 3.8;

  const baseFreqs = [55, 82.41, 110, 164.81, 220, 329.63, 440];
  baseFreqs.forEach((f, i) => {
    const osc = actx.createOscillator();
    osc.type = (i % 3 === 0) ? 'sine' : 'triangle';
    osc.frequency.value = f;
    osc.detune.value = (i - 3) * 6;

    const g = actx.createGain();
    g.gain.value = 0.85 / (i + 1.4);

    osc.connect(g).connect(ambFilter);
    osc.start();
    ambOscs.push({ osc, gain: g });
  });

  /* 慢速 LFO 调制滤波器，制造飘渺感 */
  const lfo = actx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.065;

  const lfoGain = actx.createGain();
  lfoGain.gain.value = 280;

  lfo.connect(lfoGain).connect(ambFilter.frequency);
  lfo.start();

  /* 反馈延迟 */
  ambDelay = actx.createDelay(1.5);
  ambDelay.delayTime.value = 0.46;

  ambFeedback = actx.createGain();
  ambFeedback.gain.value = 0.44;

  const wet = actx.createGain();
  wet.gain.value = 0.52;

  ambFilter.connect(ambDelay);
  ambDelay.connect(ambFeedback);
  ambFeedback.connect(ambDelay);
  ambDelay.connect(wet);

  ambGain = actx.createGain();
  ambGain.gain.value = 0.0001;

  wet.connect(ambGain);
  ambFilter.connect(ambGain);
  ambGain.connect(masterGain);

  audioReady = true;
}

/* ---- 旋转环绕音：随相机速度增强 ---- */
function updateAmbient(speed) {
  if (!audioReady) return;
  const t = actx.currentTime;
  const n = Math.min(speed / 6.0, 1);

  ambGain.gain.setTargetAtTime(0.0001 + n * n * 0.135, t, 0.09);
  ambFilter.frequency.setTargetAtTime(440 + n * 1600, t, 0.13);
  ambFeedback.gain.setTargetAtTime(0.38 + n * 0.16, t, 0.16);
}

/* ---- 点击云面：星点闪烁的清脆音 ---- */
function playStarBlink() {
  if (!audioReady) return;
  const t = actx.currentTime;
  const base = 1320 + Math.random() * 1100;

  /* 主音：高频正弦快速衰减 */
  const partials = [1.0, 1.52, 2.31, 3.42, 5.06];
  const amps     = [0.26, 0.15, 0.095, 0.055, 0.030];

  partials.forEach((ratio, i) => {
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(base * ratio, t);
    osc.frequency.exponentialRampToValueAtTime(base * ratio * 0.992, t + 0.35);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amps[i], t + 0.0022);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30 + i * 0.075);

    osc.connect(g).connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.9);
  });

  /* 高频瞬态：像星星一闪 */
  const tr = actx.createOscillator();
  tr.type = 'square';
  tr.frequency.setValueAtTime(base * 4.6, t);
  tr.frequency.exponentialRampToValueAtTime(base * 1.8, t + 0.022);

  const tg = actx.createGain();
  tg.gain.setValueAtTime(0.0001, t);
  tg.gain.exponentialRampToValueAtTime(0.045, t + 0.0012);
  tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);

  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 5200;
  bp.Q.value = 2.6;

  tr.connect(bp).connect(tg).connect(masterGain);
  tr.start(t);
  tr.stop(t + 0.12);
}

/* ---- 调节 l 阶数：电子音阶，音高随复杂度上升 ---- */
function playLStep(l, ascending) {
  if (!audioReady) return;
  const t = actx.currentTime;

  /* l ∈ [1, 8] → 半音音阶递增 */
  const scale = [0, 2, 4, 5, 7, 9, 11, 12];
  const semi = scale[Math.max(0, Math.min(7, l - 1))];
  const baseFreq = 261.63 * Math.pow(2, semi / 12);

  const f0 = ascending ? baseFreq * 0.72 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.72;

  const osc1 = actx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(f0, t);
  osc1.frequency.exponentialRampToValueAtTime(f1, t + 0.15);

  const osc2 = actx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(f0 * 2, t);
  osc2.frequency.exponentialRampToValueAtTime(f1 * 2, t + 0.15);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(420, t);
  lp.frequency.exponentialRampToValueAtTime(2400 + l * 280, t + 0.10);
  lp.frequency.exponentialRampToValueAtTime(640, t + 0.34);
  lp.Q.value = 8.5;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.118, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.048, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

  osc1.connect(lp);
  osc2.connect(g2).connect(lp);
  lp.connect(g).connect(masterGain);

  osc1.start(t); osc2.start(t);
  osc1.stop(t + 0.42); osc2.stop(t + 0.28);
}

/* ---- 调节 m 磁量子数：柔和滑音 ---- */
function playMGlide(value, ascending) {
  if (!audioReady) return;
  const t = actx.currentTime;

  const baseFreq = 220 + Math.abs(value) * 95;

  const f0 = ascending ? baseFreq * 0.80 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.80;

  const osc = actx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + 0.13);

  const osc2 = actx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(f0 * 1.5, t);
  osc2.frequency.exponentialRampToValueAtTime(f1 * 1.5, t + 0.13);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2200, t);
  lp.frequency.exponentialRampToValueAtTime(680, t + 0.28);
  lp.Q.value = 5;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.10, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.035, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);

  osc.connect(lp);
  osc2.connect(g2).connect(lp);
  lp.connect(g).connect(masterGain);

  osc.start(t); osc2.start(t);
  osc.stop(t + 0.36); osc2.stop(t + 0.24);
}

/* ---- 调节振幅 / 层数：轻盈电子音 ---- */
function playParamGlide(value, ascending, isLayers) {
  if (!audioReady) return;
  const t = actx.currentTime;

  const baseFreq = isLayers
    ? 200 + value * 130
    : 180 + value * 780;

  const f0 = ascending ? baseFreq * 0.78 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.78;

  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + 0.13);

  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(baseFreq * 1.6, t);
  bp.Q.value = 4.5;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.085, t + 0.011);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

  osc.connect(bp).connect(g).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.34);
}

/* =========================================================
   9. 交互
   ========================================================= */
const pointerNDC = { x: -10, y: -10 };
const pointerScreen = { x: -1000, y: -1000 };

let isDragging = false;
let dragBtn = -1;
let lastX = 0, lastY = 0;
let dragDist = 0;
let downTime = 0;

let hoverPoint = [0, 0, 0];
let hoverStrength = 0;
let hoverTarget = 0;

canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  canvas.setPointerCapture(e.pointerId);
  isDragging = true;
  dragBtn = e.button;
  lastX = e.clientX;
  lastY = e.clientY;
  dragDist = 0;
  downTime = performance.now();
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('pointermove', (e) => {
  pointerScreen.x = e.clientX;
  pointerScreen.y = e.clientY;
  const rect = canvas.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (!isDragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  dragDist += Math.abs(dx) + Math.abs(dy);

  if (dragBtn === 2 || e.shiftKey) {
    /* 平移 */
    const s = camT.dist * 0.0016;
    const cp = Math.cos(camT.phi);
    const sp = Math.sin(camT.phi);
    const ct = Math.cos(camT.theta);
    const st = Math.sin(camT.theta);

    /* 相机右向量与上向量 */
    const rx = -st, ry = 0, rz = ct;
    const ux = -cp * ct, uy = sp, uz = -cp * st;

    camT.tx -= (rx * dx - ux * dy) * s;
    camT.ty -= (ry * dx - uy * dy) * s;
    camT.tz -= (rz * dx - uz * dy) * s;
  } else {
    /* 旋转 */
    camT.theta += dx * 0.0072;
    camT.phi   -= dy * 0.0072;
    camT.phi = Math.max(0.08, Math.min(Math.PI - 0.08, camT.phi));
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (!isDragging) return;
  canvas.style.cursor = 'grab';

  const elapsed = performance.now() - downTime;

  if (dragDist < 7 && elapsed < 600) {
    /* 点击 → 检测是否命中云面 */
    if (raySphereHit()) {
      playStarBlink();
    }
  }

  isDragging = false;
  dragBtn = -1;
});

canvas.addEventListener('pointercancel', () => {
  isDragging = false;
  canvas.style.cursor = 'grab';
});

canvas.addEventListener('pointerleave', () => {
  pointerNDC.x = -10;
  pointerNDC.y = -10;
  hoverTarget = 0;
  clearReadout();
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  initAudio();
  camT.dist *= Math.exp(e.deltaY * 0.0012);
  camT.dist = Math.max(1.8, Math.min(20, camT.dist));
}, { passive: false });

/* ---- 射线与包围球求交（用于点击检测） ---- */
let currentProjView = new Float32Array(16);

function raySphereHit() {
  const eye = eyePosition([0, 0, 0]);

  /* 屏幕坐标 → NDC → 相机空间射线方向 */
  const rect = canvas.getBoundingClientRect();
  const ndcX = ((pointerScreen.x - rect.left) / rect.width) * 2 - 1;
  const ndcY = -((pointerScreen.y - rect.top) / rect.height) * 2 + 1;

  /* 逆投影：用近远平面两点还原射线 */
  const invProjView = invert4x4(currentProjView);
  if (!invProjView) return false;

  const pNear = unproject(ndcX, ndcY, -1, invProjView);
  const pFar  = unproject(ndcX, ndcY,  1, invProjView);

  if (!pNear || !pFar) return false;

  const dir = [
    pFar[0] - pNear[0],
    pFar[1] - pNear[1],
    pFar[2] - pNear[2],
  ];
  const dl = Math.hypot(dir[0], dir[1], dir[2]) || 1;
  dir[0] /= dl; dir[1] /= dl; dir[2] /= dl;

  /* 包围球半径 */
  const R = 1 + state.amp * 1.8;

  const ox = pNear[0] - 0, oy = pNear[1] - 0, oz = pNear[2] - 0;

  const b = ox * dir[0] + oy * dir[1] + oz * dir[2];
  const c = ox * ox + oy * oy + oz * oz - R * R;
  const disc = b * b - c;

  return disc >= 0;
}

function invert4x4(m) {
  const inv = new Float32Array(16);
  const a00 = m[0],  a01 = m[1],  a02 = m[2],  a03 = m[3];
  const a10 = m[4],  a11 = m[5],  a12 = m[6],  a13 = m[7];
  const a20 = m[8],  a21 = m[9],  a22 = m[10], a23 = m[11];
  const a30 = m[12], a31 = m[13], a32 = m[14], a33 = m[15];

  const b00 = a00 * a11 - a01 * a10;
  const b01 = a00 * a12 - a02 * a10;
  const b02 = a00 * a13 - a03 * a10;
  const b03 = a01 * a12 - a02 * a11;
  const b04 = a01 * a13 - a03 * a11;
  const b05 = a02 * a13 - a03 * a12;
  const b06 = a20 * a31 - a21 * a30;
  const b07 = a20 * a32 - a22 * a30;
  const b08 = a20 * a33 - a23 * a30;
  const b09 = a21 * a32 - a22 * a31;
  const b10 = a21 * a33 - a23 * a31;
  const b11 = a22 * a33 - a23 * a32;

  let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
  if (Math.abs(det) < 1e-10) return null;
  det = 1.0 / det;

  inv[0]  = ( a11 * b11 - a12 * b10 + a13 * b09) * det;
  inv[1]  = (-a01 * b11 + a02 * b10 - a03 * b09) * det;
  inv[2]  = ( a31 * b05 - a32 * b04 + a33 * b03) * det;
  inv[3]  = (-a21 * b05 + a22 * b04 - a23 * b03) * det;
  inv[4]  = (-a10 * b11 + a12 * b08 - a13 * b07) * det;
  inv[5]  = ( a00 * b11 - a02 * b08 + a03 * b07) * det;
  inv[6]  = (-a30 * b05 + a32 * b02 - a33 * b01) * det;
  inv[7]  = ( a20 * b05 - a22 * b02 + a23 * b01) * det;
  inv[8]  = ( a10 * b10 - a11 * b08 + a13 * b06) * det;
  inv[9]  = (-a00 * b10 + a01 * b08 - a03 * b06) * det;
  inv[10] = ( a30 * b04 - a31 * b02 + a33 * b00) * det;
  inv[11] = (-a20 * b04 + a21 * b02 - a23 * b00) * det;
  inv[12] = (-a10 * b09 + a11 * b07 - a12 * b06) * det;
  inv[13] = ( a00 * b09 - a01 * b07 + a02 * b06) * det;
  inv[14] = (-a30 * b03 + a31 * b01 - a32 * b00) * det;
  inv[15] = ( a20 * b03 - a21 * b01 + a22 * b00) * det;

  return inv;
}

function unproject(x, y, z, invPV) {
  const v = [x, y, z, 1];
  const r = [0, 0, 0, 0];

  for (let i = 0; i < 4; i++) {
    r[i] = invPV[0 * 4 + i] * v[0] +
           invPV[1 * 4 + i] * v[1] +
           invPV[2 * 4 + i] * v[2] +
           invPV[3 * 4 + i] * v[3];
  }

  if (Math.abs(r[3]) < 1e-10) return null;
  return [r[0] / r[3], r[1] / r[3], r[2] / r[3]];
}

/* ---- 悬停拾取 ---- */
let hoverTick = 0;

function updateHover() {
  if (isDragging) {
    hoverTarget = 0;
    return;
  }

  hoverTick++;
  if (hoverTick % 3 !== 0) return;

  if (!raySphereHit()) {
    hoverTarget = 0;
    clearReadout();
    return;
  }

  /* 命中球体后，取最近点作为悬停位置 */
  const eye = eyePosition([0, 0, 0]);

  /* 从相机到原点方向上的最近点 */
  const len = Math.hypot(eye[0], eye[1], eye[2]) || 1;
  const dirx = -eye[0] / len;
  const diry = -eye[1] / len;
  const dirz = -eye[2] / len;

  /* 用当前 (θ, φ) 反推参数 */
  const px = eye[0] + dirx * (len - 1.0);
  const py = eye[1] + diry * (len - 1.0);
  const pz = eye[2] + dirz * (len - 1.0);

  const r = Math.hypot(px, py, pz) || 1;
  const theta = Math.acos(Math.max(-1, Math.min(1, py / r)));
  let phi = Math.atan2(pz, px);
  if (phi < 0) phi += Math.PI * 2;

  const yVal = computeY(state.l, state.m, theta, phi, state.layers);
  const rReal = 1 + state.amp * yVal;

  hoverPoint[0] = rReal * Math.sin(theta) * Math.cos(phi);
  hoverPoint[1] = rReal * Math.cos(theta);
  hoverPoint[2] = rReal * Math.sin(theta) * Math.sin(phi);

  hoverTarget = 1;

  roTheta.textContent = theta.toFixed(3);
  roPhi.textContent = phi.toFixed(3);
  roR.textContent = rReal.toFixed(4);
  roY.textContent = yVal.toFixed(4);
}

  initAudio();
  const v = parseInt(sliderL.value, 10);
  const asc = v > lastL;
  if (v !== lastL) {
    playLStep(v, asc);
    lastL = v;
  }
  state.l = v;
  valL.textContent = String(v);

  /* 同步 m 的范围 */
  sliderM.min = -v;
  sliderM.max = v;
  if (state.m > v)  { state.m = v;  sliderM.value = v;  valM.textContent = v; }
  if (state.m < -v) { state.m = -v; sliderM.value = -v; valM.textContent = -v; }

  updateModeLabel();
  needsRebuild = true;
});

sliderM.addEventListener('input', () => {
  initAudio();
  const v = parseInt(sliderM.value, 10);
  const asc = v > lastM;
  if (v !== lastM) {
    playMGlide(v, asc);
    lastM = v;
  }
  state.m = v;
  valM.textContent = String(v);
  updateModeLabel();
  needsRebuild = true;
});

  const v = parseFloat(sliderA.value);
  const asc = v > lastA;

    playParamGlide(v, asc, false);
    lastA = v;

  state.amp = v;
  valA.textContent = v.toFixed(2);
  needsRebuild = true;
});

  initAudio();
  const v = parseInt(sliderLayers.value, 10);
  const asc = v > lastLayers;
  if (v !== lastLayers) {
    playParamGlide(v, asc, true);
    lastLayers = v;
  }
  state.layers = v;
  valLayers.textContent = String(v);
  needsRebuild = true;
});

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));

  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   13. 主循环
   ========================================================= */
const projMat = new Float32Array(16);
const viewMat = new Float32Array(16);
const projViewMat = new Float32Array(16);
const eyePos = new Float32Array(3);
const prevEye = new Float32Array([0, 0, 0]);

let lastT = performance.now();
let timeAcc = 0;

function frame(now) {
  requestAnimationFrame(frame);

  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  timeAcc += dt;

  /* ---- 重建 ---- */
  if (needsRebuild) {
    needsRebuild = false;
    buildGeometry();
  }

  /* ---- 相机缓动 ---- */
  const ease = 1 - Math.pow(0.001, dt);
  cam.theta += (camT.theta - cam.theta) * ease;
  cam.phi   += (camT.phi   - cam.phi)   * ease;
  cam.dist  += (camT.dist  - cam.dist)  * Math.min(1, dt * 8);
  cam.tx    += (camT.tx    - cam.tx)    * ease;
  cam.ty    += (camT.ty    - cam.ty)    * ease;
  cam.tz    += (camT.tz    - cam.tz)    * ease;

  eyePosition(eyePos);

  /* ---- 相机速度 → 环绕音 ---- */
  if (prevEye[0] !== 0 || prevEye[1] !== 0 || prevEye[2] !== 0) {
    const dx = eyePos[0] - prevEye[0];
    const dy = eyePos[1] - prevEye[1];
    const dz = eyePos[2] - prevEye[2];
    const speed = Math.sqrt(dx * dx + dy * dy + dz * dz) / Math.max(dt, 0.001);
    updateAmbient(speed);
  }
  prevEye[0] = eyePos[0];
  prevEye[1] = eyePos[1];
  prevEye[2] = eyePos[2];

  /* ---- 矩阵 ---- */
  const aspect = canvas.width / canvas.height;
  mat4Perspective(projMat, Math.PI / 4.5, aspect, 0.05, 100);
  mat4LookAt(viewMat, eyePos, [cam.tx, cam.ty, cam.tz], [0, 1, 0]);

  /* projView = proj * view */
  for (let col = 0; col < 4; col++) {
    for (let row = 0; row < 4; row++) {
      let sum = 0;
      for (let k = 0; k < 4; k++) {
        sum += projMat[k * 4 + row] * viewMat[col * 4 + k];
      }
      projViewMat[col * 4 + row] = sum;
    }
  }
  currentProjView.set(projViewMat);

  /* ---- 悬停 ---- */
  updateHover();
  hoverStrength += (hoverTarget - hoverStrength) * Math.min(1, dt * 10);

  /* ---- 清屏 ---- */
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.020, 0.012, 0.055, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.BLEND);

  /* ---- 绑定属性 ---- */
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.enableVertexAttribArray(LOC.aPos);
  gl.vertexAttribPointer(LOC.aPos, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, nrmBuf);
  gl.enableVertexAttribArray(LOC.aNormal);
  gl.vertexAttribPointer(LOC.aNormal, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, dispBuf);
  gl.enableVertexAttribArray(LOC.aDisp);
  gl.vertexAttribPointer(LOC.aDisp, 1, gl.FLOAT, false, 0, 0);

  /* ---- uniform ---- */
  gl.uniformMatrix4fv(LOC.uProj, false, projMat);
  gl.uniformMatrix4fv(LOC.uView, false, viewMat);
  gl.uniform3fv(LOC.uCamPos, eyePos);
  gl.uniform1f(LOC.uTime, timeAcc);
  gl.uniform3f(LOC.uHoverPos, hoverPoint[0], hoverPoint[1], hoverPoint[2]);
  gl.uniform1f(LOC.uHoverStrength, hoverStrength);

  /* ---- 绘制 ---- */
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
}

requestAnimationFrame(frame);

/* =========================================================
   14. 首次手势解锁音频
   ========================================================= */
['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, () => {
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
  }, { once: true });
});

})();
</script>
</body>
