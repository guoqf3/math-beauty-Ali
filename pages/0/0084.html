<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面等角航线 · 恒方位编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>球面等角航线 · 恒方位编织</h2>
        <div class="sub">Loxodromic network on S² · Rhumb line foliations</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">λ = tan α·ln(tan(φ/2+π/4)) + λ₀</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">cot α = dφ/dλ · cos φ</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">α = 30°, 45°, 60°, 75°</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.2, 2.2, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const RADIUS = 2.8;

        // 球面点 from lat (φ) and lon (λ)
        function spherePoint(lat, lon) {
            const cosLat = Math.cos(lat);
            return new THREE.Vector3(
                RADIUS * cosLat * Math.cos(lon),
                RADIUS * Math.sin(lat),
                RADIUS * cosLat * Math.sin(lon)
            );
        }

        // 生成等角航线：纬度范围 latMin..latMax，固定方位角α (弧度)，经度偏移lon0
        function loxodromePoints(lon0, alpha, latMin, latMax, steps) {
            const pts = [];
            const tanAlpha = Math.tan(alpha);
            const dLat = (latMax - latMin) / steps;
            for (let i = 0; i <= steps; i++) {
                const lat = latMin + i * dLat;
                // λ = tanα * ln(tan(lat/2 + π/4)) + lon0
                const gd = Math.log(Math.tan(lat / 2 + Math.PI / 4));
                const lon = tanAlpha * gd + lon0;
                pts.push(spherePoint(lat, lon));
            }
            return pts;
        }

        // 创建一族等角航线
        function createLoxodromeFamily(alpha, lonOffsets, color, opacity, latMin, latMax, steps) {
            const group = new THREE.Group();
            for (const lon0 of lonOffsets) {
                const pts = loxodromePoints(lon0, alpha, latMin, latMax, steps);
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const latMin = -1.45;  // 避免奇点
        const latMax = 1.45;
        const steps = 400;
        const lonOffsetsCount = 16;

        const rootGroup = new THREE.Group();
        rootGroup.name = 'loxodromes';
        scene.add(rootGroup);

        // 金色：α = 30° (0.5236 rad)
        const alphaGold = Math.PI / 6;
        const goldLons = Array.from({ length: lonOffsetsCount }, (_, i) => i * 2 * Math.PI / lonOffsetsCount);
        rootGroup.add(createLoxodromeFamily(alphaGold, goldLons, COLOR_GOLD, 0.65, latMin, latMax, steps));

        // 青色：α = 45° (0.7854 rad)
        const alphaCyan = Math.PI / 4;
        const cyanLons = Array.from({ length: lonOffsetsCount }, (_, i) => i * 2 * Math.PI / lonOffsetsCount + 0.5);
        rootGroup.add(createLoxodromeFamily(alphaCyan, cyanLons, COLOR_CYAN, 0.65, latMin, latMax, steps));

        // 品红：α = 60° (1.0472 rad)
        const alphaMagenta = Math.PI / 3;
        const magentaLons = Array.from({ length: lonOffsetsCount }, (_, i) => i * 2 * Math.PI / lonOffsetsCount + 1.0);
        rootGroup.add(createLoxodromeFamily(alphaMagenta, magentaLons, COLOR_MAGENTA, 0.65, latMin, latMax, steps));

        // 额外加一些更陡峭的航线 (75°) 品红
        const alphaSteep = 75 * Math.PI / 180;
        const steepLons = Array.from({ length: 12 }, (_, i) => i * 2 * Math.PI / 12);
        rootGroup.add(createLoxodromeFamily(alphaSteep, steepLons, COLOR_MAGENTA, 0.55, latMin, latMax, steps));

        console.log('等角航线总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 稳定动画循环 (手动 requestAnimationFrame)
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.4;
            const camAngle = t * 0.09;
            const camHeight = 2.4 + Math.sin(t * 0.17) * 0.8;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 球面等角航线动画已启动');
    </script>
</body>
</html>
