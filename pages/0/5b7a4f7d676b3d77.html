<style>

<body>
<canvas id="gl"></canvas>

<div class="title">悬 链 曲 面 垂 幕</div>
<div class="subtitle">CATENOID · MINIMAL SURFACE</div>

<!-- ============ 参数方程面板 ============ -->
<div class="formula">
  <div class="ftitle">参数方程 · PARAMETRIC</div>
  <div class="eq">
    <i>x</i><span class="op">=</span><i>W</i><span class="op">·</span><span class="fn">cosh</span>(<i>u</i>)<span class="op">·</span><span class="fn">cos</span>(<i>v</i>)<br>
    <i>y</i><span class="op">=</span><i>H</i><span class="op">·</span><i>u</i><br>
    <i>z</i><span class="op">=</span><i>W</i><span class="op">·</span><span class="fn">cosh</span>(<i>u</i>)<span class="op">·</span><span class="fn">sin</span>(<i>v</i>)
  </div>
  <div class="domain">
    <i>u</i> ∈ [−1, 1] &nbsp;,&nbsp; <i>v</i> ∈ [0, 2π]
  </div>
  <div class="vals">
    <i>W</i> = <b id="fW">1.20</b> &nbsp;&nbsp; <i>H</i> = <b id="fH">1.40</b>
  </div>
</div>

<div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 点击幕面</div>

<div class="panel">
  <div class="ctrl">
    <label>开口宽度</label>
    <input type="range" id="sWidth" min="0.50" max="2.50" step="0.01" value="1.20">
    <span class="val" id="vWidth">1.20</span>
  </div>
  <div class="ctrl">
    <label>垂幕高度</label>
    <input type="range" id="sHeight" min="0.60" max="2.20" step="0.01" value="1.40">
    <span class="val" id="vHeight">1.40</span>
  </div>
  <button id="btnMode">◈ 实体模式</button>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   0. 基础设置
   ============================================================ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', {
  antialias: true,
  alpha: false,
  preserveDrawingBuffer: true,
  premultipliedAlpha: false
}) || canvas.getContext('experimental-webgl');

if (!gl) {
  document.body.innerHTML =
    '<p style="color:#9dc4ea;font-family:sans-serif;padding:3rem;text-align:center">' +
    '当前浏览器不支持 WebGL</p>';
  return;
}

/* ============================================================
   1. 着色器
   ============================================================ */
const VERT_SRC = `
attribute vec3 aPos;
attribute vec3 aNrm;

uniform mat4 uProj;
uniform mat4 uView;

varying vec3 vN;
varying vec3 vWorld;
varying float vY;

void main() {
  vec4 wp = vec4(aPos, 1.0);
  vWorld = wp.xyz;
  vN = aNrm;
  vY = aPos.y;
  gl_Position = uProj * uView * wp;
}
`;

const FRAG_SRC = `
precision highp float;

varying vec3 vN;
varying vec3 vWorld;
varying float vY;

uniform float uWire;
uniform float uHalfH;
uniform vec3  uCam;
uniform vec3  uColorA;
uniform vec3  uColorB;
uniform vec3  uWireCol;

void main() {
  if (uWire > 0.5) {
    float t = clamp((vY + uHalfH) / (2.0 * uHalfH + 1e-5), 0.0, 1.0);
    vec3 c = mix(uWireCol * 0.55, uWireCol, t);
    c += vec3(0.12, 0.28, 0.42) * pow(t, 3.0);
    gl_FragColor = vec4(c, 1.0);
    return;
  }

  vec3 N = normalize(vN);
  vec3 V = normalize(uCam - vWorld);
  if (dot(N, V) < 0.0) N = -N;

  vec3 L1 = normalize(vec3( 0.55,  0.85,  0.62));
  vec3 L2 = normalize(vec3(-0.70, -0.25, -0.55));

  float d1 = max(dot(N, L1), 0.0);
  float d2 = max(dot(N, L2), 0.0);
  float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);

  float t = clamp((vY + uHalfH) / (2.0 * uHalfH + 1e-5), 0.0, 1.0);
  vec3 base = mix(uColorA, uColorB, t);
  base = mix(base, base * 1.25, t * t);

  vec3 col = base * (0.22 + d1 * 0.92 + d2 * 0.30);

  vec3 H = normalize(L1 + V);
  float spec = pow(max(dot(N, H), 0.0), 52.0);
  col += vec3(0.85, 0.96, 1.0) * spec * 0.62;

  col += vec3(0.30, 0.70, 1.0) * fres * 0.55;

  col *= 0.90 + 0.10 * smoothstep(0.0, 0.18, t);

  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s) || 'shader error');
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT_SRC));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG_SRC));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(prog) || 'link error');
}
gl.useProgram(prog);

const U = {
  aPos:    gl.getAttribLocation(prog, 'aPos'),
  aNrm:    gl.getAttribLocation(prog, 'aNrm'),
  uProj:   gl.getUniformLocation(prog, 'uProj'),
  uView:   gl.getUniformLocation(prog, 'uView'),
  uCam:    gl.getUniformLocation(prog, 'uCam'),
  uWire:   gl.getUniformLocation(prog, 'uWire'),
  uHalfH:  gl.getUniformLocation(prog, 'uHalfH'),
  uColorA: gl.getUniformLocation(prog, 'uColorA'),
  uColorB: gl.getUniformLocation(prog, 'uColorB'),
  uWireCol:gl.getUniformLocation(prog, 'uWireCol')
};

/* ============================================================
   2. 几何体构建
   ------------------------------------------------------------
   悬链面参数方程：
     x = W·cosh(u)·cos(v)
     y = H·u
     z = W·cosh(u)·sin(v)
   u ∈ [-1, 1]  ,  v ∈ [0, 2π]
   ============================================================ */
const NU = 40;
const NV = 60;
const VCOUNT = (NU + 1) * (NV + 1);

let openW = 1.20;
let halfH = 1.40;

const posArr = new Float32Array(VCOUNT * 3);
const nrmArr = new Float32Array(VCOUNT * 3);

const posBuf  = gl.createBuffer();
const nrmBuf  = gl.createBuffer();
const triBuf  = gl.createBuffer();
const lineBuf = gl.createBuffer();

const triIdx  = new Uint16Array(NU * NV * 6);
const lineIdx = new Uint16Array(NU * NV * 4);

(function buildIndices() {
  let t = 0;
  for (let i = 0; i < NU; i++) {
    for (let j = 0; j < NV; j++) {
      const a = i * (NV + 1) + j;
      const b = a + 1;
      const c = a + (NV + 1);
      const d = c + 1;
      triIdx[t++] = a; triIdx[t++] = c; triIdx[t++] = b;
      triIdx[t++] = b; triIdx[t++] = c; triIdx[t++] = d;
    }
  }
  let l = 0;
  for (let i = 0; i < NU; i++) {
    for (let j = 0; j < NV; j++) {
      const a = i * (NV + 1) + j;
      lineIdx[l++] = a; lineIdx[l++] = a + 1;
      lineIdx[l++] = a; lineIdx[l++] = a + (NV + 1);
    }
  }

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, triBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, triIdx, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, lineIdx, gl.STATIC_DRAW);
})();

function buildGeometry() {
  let p = 0;
  const W2 = openW * openW;

  for (let i = 0; i <= NU; i++) {
    const u = -1 + 2 * i / NU;
    const chu = Math.cosh(u);
    const shu = Math.sinh(u);
    const r = openW * chu;
    const y = halfH * u;

    for (let j = 0; j <= NV; j++) {
      const v = (Math.PI * 2 * j) / NV;
      const cv = Math.cos(v);
      const sv = Math.sin(v);

      posArr[p]     = r * cv;
      posArr[p + 1] = y;
      posArr[p + 2] = r * sv;

      let nx =  halfH * openW * chu * cv;
      let ny = -W2 * shu * chu;
      let nz =  halfH * openW * chu * sv;

      const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nrmArr[p]     = nx / len;
      nrmArr[p + 1] = ny / len;
      nrmArr[p + 2] = nz / len;

      p += 3;
    }
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, posArr, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, nrmBuf);
  gl.bufferData(gl.ARRAY_BUFFER, nrmArr, gl.DYNAMIC_DRAW);
}

buildGeometry();

/* ============================================================
   3. 矩阵工具
   ============================================================ */
const projMat = new Float32Array(16);
const viewMat = new Float32Array(16);

function perspective(out, fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy / 2);
  const nf = 1 / (near - far);
  out[0] = f / aspect; out[1] = 0; out[2] = 0;                     out[3] = 0;
  out[4] = 0;          out[5] = f; out[6] = 0;                     out[7] = 0;
  out[8] = 0;          out[9] = 0; out[10] = (far + near) * nf;    out[11] = -1;
  out[12] = 0;         out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
  return out;
}

function lookAt(out, eye, center, up) {
  let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
  let len = Math.hypot(z0, z1, z2) || 1;
  z0 /= len; z1 /= len; z2 /= len;

  let x0 = up[1] * z2 - up[2] * z1;
  let x1 = up[2] * z0 - up[0] * z2;
  let x2 = up[0] * z1 - up[1] * z0;
  len = Math.hypot(x0, x1, x2);
  if (len < 1e-6) { x0 = 1; x1 = 0; x2 = 0; } else { x0 /= len; x1 /= len; x2 /= len; }

  const y0 = z1 * x2 - z2 * x1;
  const y1 = z2 * x0 - z0 * x2;
  const y2 = z0 * x1 - z1 * x0;

  out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
  out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
  out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
  out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
  out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
  out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
  out[15] = 1;
  return out;
}

/* ============================================================
   4. 相机状态
   ============================================================ */
let theta = 0.60;
let phi   = 0.26;
let dist  = 9.0;
let wireframe = false;

const eyeVec = new Float32Array(3);

/* ============================================================
   5. 音频引擎
   ============================================================ */
let actx = null;
let master = null;
let noiseBuf = null;

let spinNodes = null;
let spinDrop = 0;

function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { actx = new AC(); } catch (e) { return; }

  master = actx.createGain();
  master.gain.value = 0.5;
  master.connect(actx.destination);

  const len = Math.max(1, Math.floor(actx.sampleRate * 0.7));
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}

function ensureAudio() {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
}

/* ---------- 5.1 旋转时：轻柔下垂滑动音 ---------- */
function startSpin() {
  if (!actx || spinNodes) return;
  const t = actx.currentTime;

  const osc1 = actx.createOscillator();
  osc1.type = 'sine';
  osc1.frequency.value = 300;

  const osc2 = actx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.value = 300 * 1.5;

  const g2 = actx.createGain();
  g2.gain.value = 0.18;
  osc2.connect(g2);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 950;
  lp.Q.value = 0.6;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.075, t + 0.22);

  osc1.connect(lp);
  g2.connect(lp);
  lp.connect(g);
  g.connect(master);

  osc1.start(t);
  osc2.start(t);

  spinNodes = { osc1, osc2, g };
}

function stopSpin() {
  if (!spinNodes || !actx) return;
  const { osc1, osc2, g } = spinNodes;
  const t = actx.currentTime;

  try {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.38);
    osc1.stop(t + 0.45);
    osc2.stop(t + 0.45);
  } catch (e) { /* ignore */ }

  spinNodes = null;
}

/* ---------- 5.2 点击幕面：丝绸轻拂确认音 ---------- */
function playSilk() {
  if (!actx) return;
  const t = actx.currentTime;

  if (noiseBuf) {
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;

    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(520, t);
    bp.frequency.exponentialRampToValueAtTime(3400, t + 0.16);
    bp.frequency.exponentialRampToValueAtTime(1100, t + 0.46);

    const ng = actx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.linearRampToValueAtTime(0.20, t + 0.028);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.50);

    src.connect(bp); bp.connect(ng); ng.connect(master);
    src.start(t); src.stop(t + 0.55);
  }

  const freqs = [784, 1176, 1568];
  const amps  = [0.055, 0.028, 0.014];
  freqs.forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * 1.01, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.10);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amps[i], t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.62 + i * 0.08);

    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.75 + i * 0.08);
  });
}

/* ---------- 5.3 开口宽度滑音：越宽音越低 ---------- */
let lastWidthSoundT = 0;

function playWidthSound(norm) {
  if (!actx) return;
  const now = performance.now();
  if (now - lastWidthSoundT < 68) return;
  lastWidthSoundT = now;

  const t = actx.currentTime;
  const freq = 780 - 520 * Math.max(0, Math.min(1, norm));

  const osc = actx.createOscillator();
  osc.type = 'sawtooth';

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(freq * 5.5, t);
  lp.frequency.exponentialRampToValueAtTime(freq * 2.2, t + 0.22);
  lp.Q.value = 5.5;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.085, t + 0.018);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);

  osc.frequency.setValueAtTime(freq * 1.35, t);
  osc.frequency.exponentialRampToValueAtTime(freq, t + 0.085);

  osc.connect(lp); lp.connect(g); g.connect(master);
  osc.start(t); osc.stop(t + 0.30);
}

/* ============================================================
   6. 渲染
   ============================================================ */
const BG = [0.035, 0.045, 0.078, 1.0];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
    canvas.width = w;
    canvas.height = h;
  }
}

function render() {
  resize();
  const w = canvas.width, h = canvas.height;
  if (w === 0 || h === 0) return;

  gl.viewport(0, 0, w, h);
  gl.clearColor(BG[0], BG[1], BG[2], BG[3]);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.BLEND);

  const cp = Math.cos(phi), sp = Math.sin(phi);
  eyeVec[0] = dist * cp * Math.sin(theta);
  eyeVec[1] = dist * sp;
  eyeVec[2] = dist * cp * Math.cos(theta);

  perspective(projMat, Math.PI / 4, w / h, 0.1, 200);
  lookAt(viewMat, eyeVec, [0, 0, 0], [0, 1, 0]);

  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.uProj, false, projMat);
  gl.uniformMatrix4fv(U.uView, false, viewMat);
  gl.uniform3fv(U.uCam, eyeVec);
  gl.uniform1f(U.uHalfH, halfH);

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.enableVertexAttribArray(U.aPos);
  gl.vertexAttribPointer(U.aPos, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, nrmBuf);
  gl.enableVertexAttribArray(U.aNrm);
  gl.vertexAttribPointer(U.aNrm, 3, gl.FLOAT, false, 0, 0);

  if (wireframe) {
    gl.uniform1f(U.uWire, 1.0);
    gl.uniform3f(U.uWireCol, 0.42, 0.83, 1.0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineBuf);
    gl.drawElements(gl.LINES, lineIdx.length, gl.UNSIGNED_SHORT, 0);
  } else {
    gl.uniform1f(U.uWire, 0.0);
    gl.uniform3f(U.uColorA, 0.075, 0.155, 0.40);
    gl.uniform3f(U.uColorB, 0.44,  0.88,  1.00);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, triBuf);
    gl.drawElements(gl.TRIANGLES, triIdx.length, gl.UNSIGNED_SHORT, 0);
  }
}

/* ============================================================
   7. 主循环
   ============================================================ */
function loop() {
  if (spinNodes) {
    spinDrop *= 0.93;
    if (spinDrop < 0.4) spinDrop = 0;
    const f = 300 - spinDrop;
    if (actx) {
      const t = actx.currentTime;
      spinNodes.osc1.frequency.setTargetAtTime(f, t, 0.04);
      spinNodes.osc2.frequency.setTargetAtTime(f * 1.5, t, 0.04);
    }
  }

  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   8. 交互
   ============================================================ */
let dragging = false;
let lastX = 0, lastY = 0;
let travel = 0;

canvas.addEventListener('pointerdown', (e) => {
  ensureAudio();

  dragging = true;
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);

  lastX = e.clientX;
  lastY = e.clientY;
  travel = 0;

  startSpin();
  hideHint();
}, { passive: true });

canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;

  travel += Math.abs(dx) + Math.abs(dy);

  theta -= dx * 0.0068;
  phi = Math.max(-1.34, Math.min(1.34, phi + dy * 0.0052));

  const speed = Math.min(1, Math.hypot(dx, dy) * 0.055);
  spinDrop = Math.min(spinDrop + speed * 16, 145);
}, { passive: true });

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  stopSpin();

  if (travel < 7 && e && e.clientX !== undefined) {
    if (hitSurface(e.clientX, e.clientY)) playSilk();
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  dist *= Math.exp(e.deltaY * 0.00115);
  dist = Math.max(3.2, Math.min(34, dist));
}, { passive: false });

const pixel = new Uint8Array(4);
function hitSurface(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const px = Math.round((clientX - rect.left) * canvas.width / rect.width);
  const py = Math.round((clientY - rect.top) * canvas.height / rect.height);

  if (px < 0 || py < 0 || px >= canvas.width || py >= canvas.height) return false;

  try {
    gl.readPixels(px, canvas.height - py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
  } catch (err) {
    return true;
  }

  const br = Math.round(BG[0] * 255);
  const bg = Math.round(BG[1] * 255);
  const bb = Math.round(BG[2] * 255);

  const diff = Math.abs(pixel[0] - br) +
               Math.abs(pixel[1] - bg) +
               Math.abs(pixel[2] - bb);

  return diff > 26;
}

/* ============================================================
   9. UI 控件
   ============================================================ */
const sWidth  = document.getElementById('sWidth');
const sHeight = document.getElementById('sHeight');
const vWidth  = document.getElementById('vWidth');
const vHeight = document.getElementById('vHeight');
const btnMode = document.getElementById('btnMode');
const hintEl  = document.getElementById('hint');

/* 公式面板中的实时数值 */
const fW = document.getElementById('fW');
const fH = document.getElementById('fH');

sWidth.addEventListener('input', () => {
  ensureAudio();

  openW = parseFloat(sWidth.value);
  vWidth.textContent = openW.toFixed(2);
  fW.textContent = openW.toFixed(2);

  buildGeometry();

  const norm = (openW - 0.50) / (2.50 - 0.50);
  playWidthSound(norm);

  hideHint();
});

sHeight.addEventListener('input', () => {
  halfH = parseFloat(sHeight.value);
  vHeight.textContent = halfH.toFixed(2);
  fH.textContent = halfH.toFixed(2);

  buildGeometry();
  hideHint();
});

btnMode.addEventListener('click', () => {
  wireframe = !wireframe;
  btnMode.textContent = wireframe ? '◇ 线框模式' : '◈ 实体模式';
  ensureAudio();
  hideHint();
});

let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  hintEl.style.opacity = '0';
  setTimeout(() => { hintEl.style.display = 'none'; }, 900);
}
setTimeout(hideHint, 9000);

/* ============================================================
   10. 启动
   ============================================================ */
vWidth.textContent  = openW.toFixed(2);
vHeight.textContent = halfH.toFixed(2);
fW.textContent = openW.toFixed(2);
fH.textContent = halfH.toFixed(2);

requestAnimationFrame(loop);

})();
</script>
