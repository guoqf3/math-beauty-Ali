<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seifert纤维化 · 双叶圆编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Seifert纤维化 · 双叶圆编织</h2>
        <div class="sub">Seifert fibration over S² · Two families of circular fibers</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">Fiber₁: q↦e^{iαt}·q , α=2π/3</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">Fiber₂: q↦q·e^{jβt} , β=2π/5</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">Dual: q↦e^{iγt}·q·e^{jδt}</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.3, 7.4);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 2.65;
        const PROJ_W = 2.4;

        // 球极投影
        function stereographic(qx, qy, qz, qw) {
            const denom = PROJ_W - qw;
            if (Math.abs(denom) < 0.03) return null;
            const f = SCALE / denom;
            return new THREE.Vector3(qx * f, qy * f, qz * f);
        }

        // 在S³上生成一个纤维圆（由四元数左乘/右乘单位复数的轨道）
        function generateFiberCircle(seedQ, axisQ, isLeft, steps) {
            const pts = [];
            const dAngle = 2 * Math.PI / steps;
            for (let i = 0; i <= steps; i++) {
                const angle = i * dAngle;
                const rotQ = new THREE.Quaternion(
                    Math.cos(angle / 2),
                    axisQ.x * Math.sin(angle / 2),
                    axisQ.y * Math.sin(angle / 2),
                    axisQ.z * Math.sin(angle / 2)
                );
                let resultQ;
                if (isLeft) {
                    resultQ = rotQ.clone().multiply(seedQ);
                } else {
                    resultQ = seedQ.clone().multiply(rotQ);
                }
                const proj = stereographic(resultQ.x, resultQ.y, resultQ.z, resultQ.w);
                if (proj && proj.length() < 9.5) pts.push(proj);
            }
            return pts;
        }

        // 生成一族纤维圆
        function createFiberFamily(axisQ, isLeft, color, opacity, numSeeds, steps) {
            const group = new THREE.Group();
            // 使用均匀分布的种子四元数
            const phi_golden = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < numSeeds; i++) {
                const y = 1 - (2 * i + 1) / numSeeds;
                const rAtY = Math.sqrt(1 - y * y);
                const theta = phi_golden * i;
                const seedQ = new THREE.Quaternion(
                    Math.cos(theta * 0.5) * rAtY,
                    Math.sin(theta * 0.5) * rAtY,
                    y,
                    0
                ).normalize();
                const pts = generateFiberCircle(seedQ, axisQ, isLeft, steps);
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    depthWrite: true,
                    depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 生成双参数纤维族：同时左乘和右乘
        function createDualFiberFamily(axis1, axis2, ratio1, ratio2, color, opacity, numSeeds, steps) {
            const group = new THREE.Group();
            const phi_golden = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < numSeeds; i++) {
                const y = 1 - (2 * i + 1) / numSeeds;
                const rAtY = Math.sqrt(1 - y * y);
                const theta = phi_golden * i;
                const seedQ = new THREE.Quaternion(
                    Math.cos(theta * 0.5) * rAtY,
                    Math.sin(theta * 0.5) * rAtY,
                    y,
                    0
                ).normalize();
                const pts = [];
                const tMax = 12 * Math.PI;
                const dT = tMax / steps;
                for (let j = 0; j <= steps; j++) {
                    const t = j * dT;
                    const rotL = new THREE.Quaternion(
                        Math.cos(ratio1 * t / 2),
                        axis1.x * Math.sin(ratio1 * t / 2),
                        axis1.y * Math.sin(ratio1 * t / 2),
                        axis1.z * Math.sin(ratio1 * t / 2)
                    );
                    const rotR = new THREE.Quaternion(
                        Math.cos(ratio2 * t / 2),
                        axis2.x * Math.sin(ratio2 * t / 2),
                        axis2.y * Math.sin(ratio2 * t / 2),
                        axis2.z * Math.sin(ratio2 * t / 2)
                    );
                    const resultQ = rotL.clone().multiply(seedQ).multiply(rotR);
                    const proj = stereographic(resultQ.x, resultQ.y, resultQ.z, resultQ.w);
                    if (proj && proj.length() < 9.5) pts.push(proj);
                }
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    depthWrite: true,
                    depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'seifert-fibration';
        scene.add(rootGroup);

        // 轴四元数（纯虚单位四元数）
        const axisI = new THREE.Quaternion(0, 1, 0, 0);
        const axisJ = new THREE.Quaternion(0, 0, 1, 0);
        const axisK = new THREE.Quaternion(0, 0, 0, 1);
        const axisMix = new THREE.Quaternion(0, 0.6, 0.8, 0).normalize();

        const steps = 200;

        // 金色纤维族：左乘i轴旋转（周期2π/3 → 3重对称）
        rootGroup.add(createFiberFamily(axisI, true, COLOR_GOLD, 0.62, 35, steps));
        rootGroup.add(createFiberFamily(axisMix, true, COLOR_GOLD, 0.50, 18, steps));

        // 青色纤维族：右乘j轴旋转（周期2π/5 → 5重对称）
        rootGroup.add(createFiberFamily(axisJ, false, COLOR_CYAN, 0.60, 30, steps));
        rootGroup.add(createFiberFamily(new THREE.Quaternion(0, 0.3, 0.95, 0).normalize(), false, COLOR_CYAN, 0.48, 16, steps));

        // 品红双参数纤维：同时左乘和右乘
        rootGroup.add(createDualFiberFamily(axisI, axisK, 1.7, 1.3, COLOR_MAGENTA, 0.55, 28, 400));
        rootGroup.add(createDualFiberFamily(axisJ, axisI, 1.1, 1.9, COLOR_MAGENTA, 0.45, 18, 380));

        // 辅助参考球面（极淡的线框）
        const refCircleCount = 9;
        for (let i = 0; i < refCircleCount; i++) {
            const phi = i * Math.PI / refCircleCount;
            const pts = [];
            const dTheta = 2 * Math.PI / 200;
            const r = SCALE * Math.sin(phi);
            const z = SCALE * Math.cos(phi);
            for (let j = 0; j <= 200; j++) {
                const theta = j * dTheta;
                pts.push(new THREE.Vector3(r * Math.cos(theta), z, r * Math.sin(theta)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x403830,
                transparent: true,
                opacity: 0.13,
                depthWrite: true,
                depthTest: true,
            });
            rootGroup.add(new THREE.Line(geom, mat));
        }

        console.log('Seifert纤维化线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.5;
            const camAngle = t * 0.08;
            const camHeight = 2.4 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Seifert纤维化双叶编织动画已稳定运行');
    </script>
</body>
</html>
