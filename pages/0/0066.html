<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正交圆网 · 球面编织谱</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>正交圆网 · 球面编织谱</h2>
        <div class="sub">Three orthogonal parallel‑plane sections · Circle‑weave on S²</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">Π₁: x = dₖ, |dₖ|<R</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">Π₂: y = dₖ, |dₖ|<R</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">Π₃: z = dₖ, |dₖ|<R</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const RADIUS = 2.7;

        // 生成一个空间圆：圆心在center，两个正交方向u、v，半径r
        function generateCircle3D(center, u, v, radius, numPoints = 260) {
            const pts = [];
            const dTheta = 2 * Math.PI / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const theta = i * dTheta;
                const pt = center.clone()
                    .add(u.clone().multiplyScalar(radius * Math.cos(theta)))
                    .add(v.clone().multiplyScalar(radius * Math.sin(theta)));
                pts.push(pt);
            }
            return pts;
        }

        // 生成平行平面族截球面的圆族
        function createParallelCircleFamily(normal, color, opacity, numPlanes, radius, numPoints) {
            const group = new THREE.Group();
            // 构造两个正交于normal的切向量
            let u, v;
            if (Math.abs(normal.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(normal).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
            }
            v = normal.clone().cross(u).normalize();

            // 平面距离从 -0.92R 到 0.92R 均匀分布
            const dMin = -radius * 0.88;
            const dMax = radius * 0.88;
            for (let k = 0; k < numPlanes; k++) {
                const d = dMin + k * (dMax - dMin) / (numPlanes - 1);
                const absD = Math.abs(d);
                if (absD >= radius) continue;
                const cirRadius = Math.sqrt(radius * radius - d * d);
                const center = normal.clone().multiplyScalar(d);
                const pts = generateCircle3D(center, u, v, cirRadius, numPoints);
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity,
                        depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 球面经纬线参考
        function createSphereGrid(color, opacity, numMeridians, numParallels, radius, numPoints) {
            const group = new THREE.Group();
            // 纬线（水平圆）
            for (let i = 0; i < numParallels; i++) {
                const lat = -Math.PI / 2 + 0.1 + i * (Math.PI - 0.2) / (numParallels - 1);
                const r = radius * Math.cos(lat);
                const z = radius * Math.sin(lat);
                const pts = [];
                const dPhi = 2 * Math.PI / numPoints;
                for (let j = 0; j <= numPoints; j++) {
                    const phi = j * dPhi;
                    pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            // 经线（大圆）
            for (let i = 0; i < numMeridians; i++) {
                const phi = i * Math.PI / numMeridians;
                const pts = [];
                const dTheta = (Math.PI - 0.1) / numPoints;
                for (let j = 0; j <= numPoints; j++) {
                    const theta = 0.05 + j * dTheta;
                    const st = Math.sin(theta);
                    pts.push(new THREE.Vector3(
                        radius * st * Math.cos(phi),
                        radius * Math.cos(theta),
                        radius * st * Math.sin(phi)
                    ));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'orthogonal-circle-weave';
        scene.add(rootGroup);

        const numPlanes = 28;
        const circlePoints = 280;

        // 金色族：法向量沿x轴（yz平面族截球面）
        const nx = new THREE.Vector3(1, 0, 0);
        const goldCircles = createParallelCircleFamily(nx, COLOR_GOLD, 0.62, numPlanes, RADIUS, circlePoints);
        rootGroup.add(goldCircles);

        // 青色族：法向量沿y轴（xz平面族截球面）
        const ny = new THREE.Vector3(0, 1, 0);
        const cyanCircles = createParallelCircleFamily(ny, COLOR_CYAN, 0.62, numPlanes, RADIUS, circlePoints);
        rootGroup.add(cyanCircles);

        // 品红族：法向量沿z轴（xy平面族截球面）
        const nz = new THREE.Vector3(0, 0, 1);
        const magentaCircles = createParallelCircleFamily(nz, COLOR_MAGENTA, 0.62, numPlanes, RADIUS, circlePoints);
        rootGroup.add(magentaCircles);

        // 再加一组倾斜轴的小圆族来增加密度：法向量沿(1,1,1)/√3方向
        const nD = new THREE.Vector3(1, 1, 1).normalize();
        // 倾斜轴混合颜色
        const diagGold = createParallelCircleFamily(nD, COLOR_GOLD, 0.35, 18, RADIUS, circlePoints);
        rootGroup.add(diagGold);
        const nD2 = new THREE.Vector3(1, -1, 0.6).normalize();
        const diagCyan = createParallelCircleFamily(nD2, COLOR_CYAN, 0.35, 18, RADIUS, circlePoints);
        rootGroup.add(diagCyan);
        const nD3 = new THREE.Vector3(0.5, 1, -1).normalize();
        const diagMagenta = createParallelCircleFamily(nD3, COLOR_MAGENTA, 0.35, 18, RADIUS, circlePoints);
        rootGroup.add(diagMagenta);

        // 球面经纬线参考
        rootGroup.add(createSphereGrid(0x403830, 0.10, 10, 10, RADIUS, 240));

        console.log('正交圆网线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 健壮的动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.26;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 正交圆网球面编织动画已稳定运行');
    </script>
</body>
</html>
