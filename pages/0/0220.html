<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共形反演网格 · 球面反演空间</title>
    <style>
        :root {
            --bg: #03060a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 40px rgba(200, 180, 150, 0.5), 0 0 72px rgba(170, 150, 130, 0.2);
            line-height: 1.4;
            white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.55rem, 1.0vw, 0.7rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }
        #formula-overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(3, 6, 10, 0.72);
            padding: 11px 23px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.46rem, 0.82vw, 0.66rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.28);
            line-height: 1.6;
            white-space: nowrap;
        }
        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }
        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 12px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.4rem;
                white-space: normal;
                line-height: 1.4;
            }
            #title-overlay .title {
                font-size: 0.76rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">共形反演网格 · 球面反演空间</div>
        <div class="subtitle">CONFORMAL INVERSION GRID &nbsp;·&nbsp; SPHERICAL INVERSION SPACE</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">Γₓ:</span> f(t,y₀,z₀)=R²·(t,y₀,z₀)/(t²+y₀²+z₀²)&nbsp;
            <span class="c2">Γᵧ:</span> f(x₀,t,z₀)=R²·(x₀,t,z₀)/(x₀²+t²+z₀²)
            <br>
            <span class="c3">Γ₂:</span> f(x₀,y₀,t)=R²·(x₀,y₀,t)/(x₀²+y₀²+t²)&nbsp;
            <span style="color:#9aa8b8;">x₀,y₀,z₀∈[−3,3]&nbsp;步长0.55&nbsp;R=2.7&nbsp;共形保角</span>
        </div>
    </div>

    <script type="importmap">
        {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#03060a');
        scene.fog = new THREE.Fog('#03060a', 5, 16);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / Math.max(container.clientHeight, 1), 0.25, 22);
        camera.position.set(1.8, 1.2, 7.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        const COLOR_X = '#d4885c';
        const COLOR_Y = '#5d9ec6';
        const COLOR_Z = '#c77d9f';
        const COLOR_SPHERE = '#3a4a5a';
        const COLOR_GLINT = '#8898aa';

        const R_INV = 2.7;
        const R2 = R_INV * R_INV;
        const MAX_DIST = 7.5;
        const GRID_HALF = 3.0;
        const GRID_STEP = 0.55;
        const T_SAMPLE = 10.0;
        const NUM_SAMPLES = 480;
        const DT = (2 * T_SAMPLE) / NUM_SAMPLES;

        const gridPositions = [];
        for (let v = -GRID_HALF; v <= GRID_HALF + 0.001; v += GRID_STEP) {
            gridPositions.push(parseFloat(v.toFixed(10)));
        }
        const nGrid = gridPositions.length;
        console.log('网格线密度（每方向）:', nGrid, '×', nGrid);

        function softClamp(vec, maxDist) {
            const len = vec.length();
            if (len > maxDist && len > 0.001) {
                const clamped = maxDist + Math.log(1 + len - maxDist) * 1.2;
                vec.normalize().multiplyScalar(Math.min(clamped, maxDist * 1.3));
            }
            return vec;
        }

        function invertPoint(px, py, pz) {
            const distSq = px * px + py * py + pz * pz;
            if (distSq < 1e-8) {
                return new THREE.Vector3(0, 0, 0);
            }
            const scale = R2 / distSq;
            const v = new THREE.Vector3(px * scale, py * scale, pz * scale);
            return softClamp(v, MAX_DIST);
        }

        function createInvertedLinesGroup(axis, colorHex) {
            const allPositions = [];
            const segmentIndices = [];
            let vertexCount = 0;

            for (let i = 0; i < nGrid; i++) {
                for (let j = 0; j < nGrid; j++) {
                    const lineVerts = [];
                    const v1 = gridPositions[i];
                    const v2 = gridPositions[j];

                    for (let s = 0; s <= NUM_SAMPLES; s++) {
                        const t = -T_SAMPLE + s * DT;
                        let px, py, pz;
                        if (axis === 'x') {
                            px = t;
                            py = v1;
                            pz = v2;
                        } else if (axis === 'y') {
                            px = v1;
                            py = t;
                            pz = v2;
                        } else {
                            px = v1;
                            py = v2;
                            pz = t;
                        }
                        const inv = invertPoint(px, py, pz);
                        lineVerts.push(inv);
                    }

                    let segStart = 0;
                    for (let s = 1; s <= NUM_SAMPLES; s++) {
                        const d = lineVerts[s].distanceTo(lineVerts[s - 1]);
                        if (d > 2.5 && segStart < s - 1) {
                            for (let k = segStart; k < s; k++) {
                                const v = lineVerts[k];
                                allPositions.push(v.x, v.y, v.z);
                                segmentIndices.push(vertexCount++);
                            }
                            vertexCount = allPositions.length / 3;
                            segStart = s;
                        } else if (d > 2.5) {
                            segStart = s;
                        }
                    }
                    if (segStart < NUM_SAMPLES) {
                        for (let k = segStart; k <= NUM_SAMPLES; k++) {
                            const v = lineVerts[k];
                            allPositions.push(v.x, v.y, v.z);
                            segmentIndices.push(vertexCount++);
                        }
                        vertexCount = allPositions.length / 3;
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(allPositions, 3));
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: 0.68,
                depthWrite: true,
            });
            const lineSegments = new THREE.Line(geometry, material);
            return lineSegments;
        }

        console.log('正在生成反演网格...');
        const groupX = createInvertedLinesGroup('x', COLOR_X);
        const groupY = createInvertedLinesGroup('y', COLOR_Y);
        const groupZ = createInvertedLinesGroup('z', COLOR_Z);
        console.log('反演网格生成完成');

        const mainGroup = new THREE.Group();
        mainGroup.add(groupX);
        mainGroup.add(groupY);
        mainGroup.add(groupZ);
        scene.add(mainGroup);

        function createInversionSphereWire(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 180;
            const circleDefs = [
                (a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0),
                (a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius),
                (a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius),
            ];
            for (const gen of circleDefs) {
                const pts = [];
                for (let i = 0; i <= segs; i++) {
                    pts.push(gen((i / segs) * Math.PI * 2));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            for (const z of [-radius * 0.55, radius * 0.55]) {
                const r = Math.sqrt(Math.max(0, radius * radius - z * z));
                const pts = [];
                for (let i = 0; i <= segs; i++) {
                    const a = (i / segs) * Math.PI * 2;
                    pts.push(new THREE.Vector3(Math.cos(a) * r, z, Math.sin(a) * r));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity * 0.6,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createInversionSphereWire(R_INV, COLOR_SPHERE, 0.28);
        scene.add(sphereRef);

        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.16;
            const pairs = [
                [new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0)],
                [new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0)],
                [new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)],
            ];
            for (const [a, b] of pairs) {
                const geom = new THREE.BufferGeometry().setFromPoints([a, b]);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(COLOR_GLINT),
                    transparent: true,
                    opacity: 0.7,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const originGlint = createOriginGlint();
        scene.add(originGlint);

        const startTime = performance.now();
        let frameCount = 0;
        let lastLogTime = 0;
        let currentTime = 0;

        function animate(timestamp) {
            requestAnimationFrame(animate);
            const elapsed = (timestamp - startTime) / 1000;
            if (elapsed <= 0) {
                renderer.render(scene, camera);
                return;
            }
            currentTime = elapsed;
            frameCount++;
            if (timestamp - lastLogTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${currentTime.toFixed(2)}s`);
                lastLogTime = timestamp;
            }

            mainGroup.rotation.y = currentTime * 0.26;
            mainGroup.rotation.x = currentTime * 0.13 + Math.sin(currentTime * 0.24) * 0.2;
            mainGroup.rotation.z = Math.sin(currentTime * 0.18) * 0.25;

            sphereRef.rotation.y += 0.0015;
            sphereRef.rotation.x += 0.001;
            sphereRef.rotation.z += 0.0007;

            const camX = 1.8 + Math.sin(currentTime * 0.15) * 0.55;
            const camY = 1.2 + Math.cos(currentTime * 0.19) * 0.45;
            const camZ = 7.5 + Math.sin(currentTime * 0.12) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function onResize() {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

        console.log('=== 共形反演网格 · 球面反演空间 ===');
        console.log('网格线密度:', nGrid, '×', nGrid, '每方向');
        console.log('总线条数:', nGrid * nGrid * 3);
        console.log('反演半径R:', R_INV, '钳制距离:', MAX_DIST);
        console.log('每条线采样点数:', NUM_SAMPLES + 1);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
