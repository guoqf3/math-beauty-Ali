<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERRAIN · 声波地形</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a18;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.6s ease;
            mix-blend-mode: screen;
        }

        .overlay:hover {
            opacity: 0.9;
        }

        .title {
            color: rgba(220, 210, 250, 0.75);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(130, 100, 220, 0.4);
        }

        .hint {
            color: rgba(170, 160, 200, 0.45);
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .overlay {
                bottom: 18px;
            }
            .title {
                font-size: 8px;
                letter-spacing: 0.45em;
            }
            .hint {
                font-size: 6px;
                letter-spacing: 0.22em;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <div class="title">Terrain</div>
        <div class="hint">move · click</div>
    </div>

    <script>
        (function() {
            // ─── 画布初始化 ───────────────────────────────────────────────
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let W, H, DPR;
            let grid = [];          // 网格点数据 {x, y, z, vx, vy, vz}
            let cols = 0;
            let rows = 0;
            let spacing = 32;      // 网格间距，动态计算
            let ripples = [];      // 点击涟漪
            let mouse = { x: -9999, y: -9999, active: false, lastX: -9999, lastY: -9999 };
            let time = 0;
            let colorShift = 0;    // 颜色偏移
            let autoWaveAmp = 18;  // 自动波动振幅

            function setupCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

                // 深色背景，杜绝白屏
                ctx.fillStyle = '#0a0a18';
                ctx.fillRect(0, 0, W, H);
            }

            // ─── 初始化网格 ───────────────────────────────────────────────
            function initGrid() {
                const targetPoints = 1400;
                const area = W * H;
                spacing = Math.sqrt(area / targetPoints);
                spacing = Math.max(18, Math.min(46, spacing));

                cols = Math.ceil(W / spacing) + 1;
                rows = Math.ceil(H / spacing) + 1;

                // 限制网格点数量，保证性能
                if (cols * rows > 2200) {
                    const scale = Math.sqrt(2200 / (cols * rows));
                    spacing *= (1 / scale);
                    cols = Math.ceil(W / spacing) + 1;
                    rows = Math.ceil(H / spacing) + 1;
                }

                grid = [];
                for (let j = 0; j < rows; j++) {
                    for (let i = 0; i < cols; i++) {
                        const x = i * spacing;
                        const y = j * spacing;
                        grid.push({
                            x: x,
                            y: y,
                            z: 0,
                            vz: 0,
                            baseX: x,
                            baseY: y,
                        });
                    }
                }
            }

            // ─── 获取网格点索引 ──────────────────────────────────────────
            function getGridIndex(col, row) {
                if (col < 0 || col >= cols || row < 0 || row >= rows) return -1;
                return row * cols + col;
            }

            // ─── 更新网格（物理模拟） ───────────────────────────────────
            function updateGrid(dt) {
                // 自动波动
                const waveAmp = autoWaveAmp * (0.7 + 0.3 * Math.sin(time * 0.2));
                const waveFreqX = 0.006;
                const waveFreqY = 0.005;
                const waveSpeed = 0.9;

                // 鼠标影响半径
                const mouseRadius = 130;
                const mouseRadiusSq = mouseRadius * mouseRadius;

                for (let j = 0; j < rows; j++) {
                    for (let i = 0; i < cols; i++) {
                        const idx = j * cols + i;
                        const p = grid[idx];
                        const origZ = Math.sin(i * spacing * waveFreqX + time * waveSpeed) * waveAmp * 0.7 +
                            Math.cos(j * spacing * waveFreqY + time * waveSpeed * 0.8) * waveAmp * 0.7 +
                            Math.sin((i + j) * spacing * 0.003 + time * 0.5) * waveAmp * 0.4;

                        // 鼠标影响：像手指在沙子上划过，推高地形
                        let mouseInfluence = 0;
                        if (mouse.active) {
                            const dx = p.x - mouse.x;
                            const dy = p.y - mouse.y;
                            const distSq = dx * dx + dy * dy;
                            if (distSq < mouseRadiusSq) {
                                const dist = Math.sqrt(distSq);
                                mouseInfluence = (1 - dist / mouseRadius) * 45;
                                // 鼠标移动方向影响
                                const mx = mouse.x - mouse.lastX;
                                const my = mouse.y - mouse.lastY;
                                if (Math.abs(mx) > 0 || Math.abs(my) > 0) {
                                    const mag = Math.sqrt(mx * mx + my * my);
                                    const normMx = mx / (mag || 1);
                                    const normMy = my / (mag || 1);
                                    mouseInfluence *= (0.4 + 0.6 * (1 - Math.abs(normMx * dx / (dist || 1) + normMy * dy / (dist || 1))));
                                }
                            }
                        }

                        // 涟漪影响
                        let rippleInfluence = 0;
                        for (const r of ripples) {
                            const dx = p.x - r.x;
                            const dy = p.y - r.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            const bandWidth = 45 + r.radius * 0.15;
                            const innerR = Math.max(0, r.radius - bandWidth);
                            const outerR = r.radius + bandWidth;
                            if (dist > innerR && dist < outerR) {
                                const intensity = (1 - Math.abs(dist - r.radius) / bandWidth) * r.strength;
                                rippleInfluence += intensity;
                            }
                        }

                        const targetZ = origZ + mouseInfluence + rippleInfluence;

                        // 弹簧模型：z趋向目标值
                        const springForce = (targetZ - p.z) * 0.12;
                        p.vz += springForce;
                        p.vz *= 0.88;
                        p.z += p.vz;

                        // 阻尼，防止过度振荡
                        if (Math.abs(p.z) < 0.01 && Math.abs(p.vz) < 0.01) {
                            p.z = 0;
                            p.vz = 0;
                        }
                    }
                }
            }

            // ─── 创建涟漪 ───────────────────────────────────────────────
            function createRipple(x, y) {
                ripples.push({
                    x: x,
                    y: y,
                    radius: 5,
                    maxRadius: Math.max(W, H) * 0.6,
                    strength: 38 + Math.random() * 15,
                    decay: 0.55,
                    growth: 3.5 + Math.random() * 1.5,
                });
                if (ripples.length > 6) ripples.shift();
            }

            function updateRipples(dt) {
                for (let i = ripples.length - 1; i >= 0; i--) {
                    const r = ripples[i];
                    r.radius += r.growth * dt;
                    r.strength *= (1 - 0.012 * dt);
                    if (r.strength < 1 || r.radius > r.maxRadius) {
                        ripples.splice(i, 1);
                    }
                }
            }

            // ─── 绘制网格 ───────────────────────────────────────────────
            function drawGrid(ctx) {
                const zMax = 65;
                const zMin = -50;

                // 绘制连接线（先绘制底部线条，再绘制点，形成层次）
                ctx.lineWidth = 0.7;
                ctx.lineCap = 'round';

                // 水平线
                for (let j = 0; j < rows; j++) {
                    for (let i = 0; i < cols - 1; i++) {
                        const idx1 = j * cols + i;
                        const idx2 = j * cols + i + 1;
                        const p1 = grid[idx1];
                        const p2 = grid[idx2];
                        const avgZ = (p1.z + p2.z) / 2;
                        const normalized = (avgZ - zMin) / (zMax - zMin);
                        const clamped = Math.max(0, Math.min(1, normalized));
                        const alpha = 0.2 + clamped * 0.5;
                        const hue = 230 + colorShift - clamped * 70;
                        const light = 40 + clamped * 35;
                        ctx.strokeStyle = `hsla(${hue}, 60%, ${light}%, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }

                // 垂直线
                for (let j = 0; j < rows - 1; j++) {
                    for (let i = 0; i < cols; i++) {
                        const idx1 = j * cols + i;
                        const idx2 = (j + 1) * cols + i;
                        const p1 = grid[idx1];
                        const p2 = grid[idx2];
                        const avgZ = (p1.z + p2.z) / 2;
                        const normalized = (avgZ - zMin) / (zMax - zMin);
                        const clamped = Math.max(0, Math.min(1, normalized));
                        const alpha = 0.2 + clamped * 0.5;
                        const hue = 230 + colorShift - clamped * 70;
                        const light = 40 + clamped * 35;
                        ctx.strokeStyle = `hsla(${hue}, 60%, ${light}%, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }

                // 绘制点（只绘制高度显著的点和鼠标附近的点）
                const mouseRadius = 150;
                const mouseRadiusSq = mouseRadius * mouseRadius;
                const pointDrawThreshold = 0.12;

                for (let j = 0; j < rows; j++) {
                    for (let i = 0; i < cols; i++) {
                        const idx = j * cols + i;
                        const p = grid[idx];
                        const normalized = (p.z - zMin) / (zMax - zMin);
                        const clamped = Math.max(0, Math.min(1, normalized));

                        let shouldDraw = clamped > pointDrawThreshold;
                        if (!shouldDraw && mouse.active) {
                            const dx = p.x - mouse.x;
                            const dy = p.y - mouse.y;
                            if (dx * dx + dy * dy < mouseRadiusSq) {
                                shouldDraw = true;
                            }
                        }

                        if (!shouldDraw) continue;

                        const hue = 230 + colorShift - clamped * 75;
                        const sat = 65 + clamped * 30;
                        const light = 45 + clamped * 40;
                        const size = 1.2 + clamped * 3.5;
                        const alpha = 0.4 + clamped * 0.6;

                        ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                        ctx.fill();

                        // 高亮点发光
                        if (clamped > 0.55) {
                            const glowAlpha = (clamped - 0.55) * 0.8;
                            ctx.fillStyle = `hsla(${hue}, 80%, 80%, ${glowAlpha})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, size * 0.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }

            // ─── 绘制涟漪线 ─────────────────────────────────────────────
            function drawRipples(ctx) {
                for (const r of ripples) {
                    const alpha = Math.min(0.3, r.strength * 0.005);
                    const hue = 230 + colorShift;
                    ctx.strokeStyle = `hsla(${hue}, 60%, 70%, ${alpha})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ─── 鼠标光晕 ───────────────────────────────────────────────
            function drawCursorGlow(ctx) {
                if (!mouse.active) return;
                const radius = 90;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
                const hue = 230 + colorShift;
                gradient.addColorStop(0, `hsla(${hue}, 60%, 75%, 0.06)`);
                gradient.addColorStop(0.7, `hsla(${hue}, 55%, 65%, 0.02)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // ─── 主循环 ─────────────────────────────────────────────────
            let lastTime = 0;
            let accumulator = 0;
            const fixedStep = 1000 / 60;

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                if (dt < 1) dt = 1;

                accumulator += dt;
                const steps = Math.min(Math.floor(accumulator / fixedStep), 3);
                accumulator -= steps * fixedStep;

                for (let s = 0; s < steps; s++) {
                    time += 0.014;
                    updateRipples(fixedStep / 1000 * 60);
                    updateGrid(fixedStep / 1000 * 60);
                }

                // 清除画布
                ctx.fillStyle = '#0a0a18';
                ctx.fillRect(0, 0, W, H);

                // 绘制网格
                drawGrid(ctx);

                // 绘制涟漪
                drawRipples(ctx);

                // 绘制鼠标光晕
                drawCursorGlow(ctx);

                requestAnimationFrame(animate);
            }

            // ─── 交互事件 ───────────────────────────────────────────────
            function onMouseMove(e) {
                mouse.lastX = mouse.x;
                mouse.lastY = mouse.y;
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function onMouseLeave() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
            }

            function onMouseDown(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
                createRipple(mouse.x, mouse.y);
                // 切换颜色偏移
                colorShift += 25 + Math.random() * 25;
                if (colorShift > 90) colorShift = -25;
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.lastX = mouse.x;
                    mouse.lastY = mouse.y;
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                }
            }

            function onTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    mouse.x = touch.clientX;
                    mouse.y = touch.clientY;
                    mouse.active = true;
                    createRipple(mouse.x, mouse.y);
                    colorShift += 25 + Math.random() * 25;
                    if (colorShift > 90) colorShift = -25;
                }
            }

            function onTouchEnd() {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
                mouse.lastX = -9999;
                mouse.lastY = -9999;
            }

            function onResize() {
                setupCanvas();
                initGrid();
                ripples = [];
                // 重置鼠标位置
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            }

            // ─── 启动 ───────────────────────────────────────────────────
            function init() {
                setupCanvas();
                initGrid();

                canvas.addEventListener('mousemove', onMouseMove, { passive: true });
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mouseleave', onMouseLeave);
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: true });
                canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

                window.addEventListener('resize', onResize);

                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 确保初始背景填充
            window.addEventListener('load', () => {
                if (ctx) {
                    ctx.fillStyle = '#0a0a18';
                    ctx.fillRect(0, 0, W, H);
                }
            });

        })();
    </script>
</body>
</html>
