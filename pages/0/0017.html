<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正切保角编织 · 复变函数网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>正切保角编织 · 复变函数网</h2>
        <div class="sub">w = tan(z) conformal map · Orthogonal grid on S² via stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">水平线 y=y₀</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">垂直线 x=x₀</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">对角线 x±y=c</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.4, 2.2, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.65;
        const PROJ_D = 2.15;
        const CURVE_POINTS = 420;

        // 球极投影
        function stereographic(px, py) {
            const d = px * px + py * py + PROJ_D * PROJ_D;
            const f = 2 * PROJ_D * SPHERE_R / d;
            return new THREE.Vector3(px * f, py * f, (px * px + py * py - PROJ_D * PROJ_D) / d * SPHERE_R);
        }

        // w = tan(z) = sin(2x)/(cos(2x)+cosh(2y)) + i·sinh(2y)/(cos(2x)+cosh(2y))
        function tanZ(x, y) {
            const cos2x = Math.cos(2 * x);
            const cosh2y = Math.cosh(2 * y);
            const denom = cos2x + cosh2y;
            if (Math.abs(denom) < 1e-4) return null;
            return {
                u: Math.sin(2 * x) / denom,
                v: Math.sinh(2 * y) / denom
            };
        }

        // 从z平面点生成3D投影点
        function projectPoint(x, y) {
            const w = tanZ(x, y);
            if (!w) return null;
            if (Math.abs(w.u) > 14 || Math.abs(w.v) > 14) return null;
            const sp = stereographic(w.u, w.v);
            return (sp && sp.length() < 9.5) ? sp : null;
        }

        // 创建一族曲线
        function createCurveFamily(curveDefs, color, opacity) {
            const group = new THREE.Group();
            for (const def of curveDefs) {
                const pts3D = [];
                const dt = (def.tEnd - def.tStart) / CURVE_POINTS;
                for (let i = 0; i <= CURVE_POINTS; i++) {
                    const t = def.tStart + i * dt;
                    const xy = def.xyFn(t);
                    const sp = projectPoint(xy.x, xy.y);
                    if (sp) pts3D.push(sp);
                }
                if (pts3D.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts3D);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'tan-weave';
        scene.add(rootGroup);

        const xRange = 1.32;
        const yRange = 1.05;

        // 金色族：水平线 (y=const, x变化)
        const goldDefs = [];
        const yCount = 28;
        for (let i = 0; i < yCount; i++) {
            const y = -yRange + i * 2 * yRange / (yCount - 1);
            goldDefs.push({ tStart: -xRange, tEnd: xRange, xyFn: t => ({ x: t, y }) });
        }
        rootGroup.add(createCurveFamily(goldDefs, COLOR_GOLD, 0.58));

        // 青色族：垂直线 (x=const, y变化)
        const cyanDefs = [];
        const xCount = 28;
        for (let i = 0; i < xCount; i++) {
            const x = -xRange + i * 2 * xRange / (xCount - 1);
            cyanDefs.push({ tStart: -yRange, tEnd: yRange, xyFn: t => ({ x, y: t }) });
        }
        rootGroup.add(createCurveFamily(cyanDefs, COLOR_CYAN, 0.58));

        // 品红族：对角线 (x+y=c 和 x-y=c)
        const magentaDefs = [];
        const diagCount = 32;
        const diagMin = -xRange - yRange;
        const diagMax = xRange + yRange;
        for (let i = 0; i < diagCount; i++) {
            const c = diagMin + i * (diagMax - diagMin) / (diagCount - 1);
            // x+y = c → y = c-x
            const tMin1 = Math.max(-xRange, c - yRange);
            const tMax1 = Math.min(xRange, c + yRange);
            if (tMax1 > tMin1 + 0.08) {
                magentaDefs.push({ tStart: tMin1, tEnd: tMax1, xyFn: t => ({ x: t, y: c - t }) });
            }
            // x-y = c → y = x-c
            const tMin2 = Math.max(-xRange, -yRange + c);
            const tMax2 = Math.min(xRange, yRange + c);
            if (tMax2 > tMin2 + 0.08) {
                magentaDefs.push({ tStart: tMin2, tEnd: tMax2, xyFn: t => ({ x: t, y: t - c }) });
            }
        }
        rootGroup.add(createCurveFamily(magentaDefs, COLOR_MAGENTA, 0.55));

        // 额外稀疏层增加密度
        const extraGold = [];
        for (let i = 0; i < 16; i++) {
            const y = -yRange + 0.04 + i * 2 * yRange / 15;
            extraGold.push({ tStart: -xRange, tEnd: xRange, xyFn: t => ({ x: t, y }) });
        }
        rootGroup.add(createCurveFamily(extraGold, COLOR_GOLD, 0.35));
        const extraCyan = [];
        for (let i = 0; i < 16; i++) {
            const x = -xRange + 0.04 + i * 2 * xRange / 15;
            extraCyan.push({ tStart: -yRange, tEnd: yRange, xyFn: t => ({ x, y: t }) });
        }
        rootGroup.add(createCurveFamily(extraCyan, COLOR_CYAN, 0.35));
        const extraMagenta = [];
        for (let i = 0; i < 18; i++) {
            const c = diagMin + 0.06 + i * (diagMax - diagMin) / 17;
            const tMin1 = Math.max(-xRange, c - yRange);
            const tMax1 = Math.min(xRange, c + yRange);
            if (tMax1 > tMin1 + 0.06) {
                extraMagenta.push({ tStart: tMin1, tEnd: tMax1, xyFn: t => ({ x: t, y: c - t }) });
            }
            const tMin2 = Math.max(-xRange, -yRange + c);
            const tMax2 = Math.min(xRange, yRange + c);
            if (tMax2 > tMin2 + 0.06) {
                extraMagenta.push({ tStart: tMin2, tEnd: tMax2, xyFn: t => ({ x: t, y: t - c }) });
            }
        }
        rootGroup.add(createCurveFamily(extraMagenta, COLOR_MAGENTA, 0.32));

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        console.log('正切保角编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 正切保角编织动画已稳定运行');
    </script>
</body>
</html>
