<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas吸引子 · 混沌编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Thomas吸引子 · 混沌编织</h2>
        <div class="sub">Cyclically symmetric chaotic attractor · ẋ = sin y − bx</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">ẋ = sin y − bx</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">ẏ = sin z − by</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">ż = sin x − bz</span>
            <span class="formula-sep">‖</span>
            b = 0.18
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.35;
        const DT = 0.04;
        const MAX_STEPS = 380;

        // Thomas系统向量场
        function thomasFlow(x, y, z, b) {
            return new THREE.Vector3(
                Math.sin(y) - b * x,
                Math.sin(z) - b * y,
                Math.sin(x) - b * z
            );
        }

        // RK4积分
        function rk4Step(p, b) {
            const f = (pos) => thomasFlow(pos.x, pos.y, pos.z, b);
            const k1 = f(p);
            const pm2 = p.clone().add(k1.clone().multiplyScalar(DT * 0.5));
            const k2 = f(pm2);
            const pm3 = p.clone().add(k2.clone().multiplyScalar(DT * 0.5));
            const k3 = f(pm3);
            const pm4 = p.clone().add(k3.clone().multiplyScalar(DT));
            const k4 = f(pm4);
            return k1.add(k2.multiplyScalar(2)).add(k3.multiplyScalar(2)).add(k4).multiplyScalar(DT / 6);
        }

        function traceOrbit(seed, b, steps, maxRadius) {
            const pts = [];
            let p = seed.clone();
            pts.push(p.clone());
            for (let i = 0; i < steps; i++) {
                const dp = rk4Step(p, b);
                p.add(dp);
                if (p.length() > maxRadius) break;
                pts.push(p.clone());
            }
            return pts;
        }

        function createThomasFamily(b, seeds, color, opacity, steps, maxRadius) {
            const group = new THREE.Group();
            for (const seed of seeds) {
                const raw = traceOrbit(seed, b, steps, maxRadius);
                if (raw.length < 2) continue;
                const scaled = raw.map(pt => pt.clone().multiplyScalar(SCALE));
                const geom = new THREE.BufferGeometry().setFromPoints(scaled);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 生成种子点
        function generateSeeds(basePoint, delta, count) {
            const seeds = [];
            for (let i = 0; i < count; i++) {
                const x = basePoint.x + (Math.random() - 0.5) * delta;
                const y = basePoint.y + (Math.random() - 0.5) * delta;
                const z = basePoint.z + (Math.random() - 0.5) * delta;
                seeds.push(new THREE.Vector3(x, y, z));
            }
            return seeds;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'thomas-weave';
        scene.add(rootGroup);

        const b = 0.18;
        const maxRadius = 18;

        // 金色族：从不同象限出发
        const goldSeeds = [
            ...generateSeeds(new THREE.Vector3(1.5, 0.5, 0.5), 0.4, 10),
            ...generateSeeds(new THREE.Vector3(2.5, -1.5, 1.0), 0.5, 8),
            ...generateSeeds(new THREE.Vector3(-2.0, 2.0, -0.5), 0.4, 8),
            ...generateSeeds(new THREE.Vector3(0.8, -2.2, 1.8), 0.3, 6),
        ];
        rootGroup.add(createThomasFamily(b, goldSeeds, COLOR_GOLD, 0.58, MAX_STEPS, maxRadius));

        // 青色族：从中心附近出发
        const cyanSeeds = [
            ...generateSeeds(new THREE.Vector3(0.3, 0.2, -0.1), 0.2, 12),
            ...generateSeeds(new THREE.Vector3(-0.5, 0.8, 0.3), 0.3, 10),
            ...generateSeeds(new THREE.Vector3(0.6, -0.4, 0.9), 0.25, 10),
        ];
        rootGroup.add(createThomasFamily(b, cyanSeeds, COLOR_CYAN, 0.58, MAX_STEPS, maxRadius));

        // 品红族：从远点出发
        const magentaSeeds = [
            ...generateSeeds(new THREE.Vector3(3.0, 2.5, -2.0), 0.6, 10),
            ...generateSeeds(new THREE.Vector3(-3.0, -1.0, 2.5), 0.5, 10),
            ...generateSeeds(new THREE.Vector3(-1.5, 3.0, 1.5), 0.5, 8),
            ...generateSeeds(new THREE.Vector3(2.0, -3.0, -1.0), 0.4, 8),
        ];
        rootGroup.add(createThomasFamily(b, magentaSeeds, COLOR_MAGENTA, 0.58, MAX_STEPS, maxRadius));

        // 额外小密度轨道
        const extraSmall = [
            ...generateSeeds(new THREE.Vector3(0.15, 0.1, 0.05), 0.1, 6),
            ...generateSeeds(new THREE.Vector3(-0.2, 0.3, 0.15), 0.1, 6),
            ...generateSeeds(new THREE.Vector3(0.1, -0.2, 0.4), 0.1, 6),
        ];
        rootGroup.add(createThomasFamily(b, extraSmall, COLOR_CYAN, 0.40, Math.floor(MAX_STEPS * 0.7), maxRadius * 0.7));

        // 辅助：球面参考网格
        const refR = 4.0;
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = refR * Math.sin(lat);
            const z = refR * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(refR * st * Math.cos(phi), refR * Math.cos(theta), refR * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        console.log('Thomas吸引子编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.27;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }, 120));

        console.log('✅ Thomas吸引子混沌编织动画已稳定运行');
    </script>
</body>
</html>
