<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Möbius带参数曲线网 · 扭曲拓扑交织</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.85vw, 0.64rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.18);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.36rem, 0.68vw, 0.54rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">Möbius带参数曲线网 · 扭曲拓扑交织</div>
        <div class="subtitle">MÖBIUS STRIP PARAMETRIC LINES &nbsp;·&nbsp; s-LINES · t-LINES · SKEW CURVES</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">s‑线:</span> 固定t, s∈[−0.5,0.5] &nbsp;
            <span class="c2">t‑线:</span> 固定s, t∈[0,2π] &nbsp;
            <span class="c3">斜线:</span> s=0.5·cos(k·t)
            <br>
            <span style="color:#9aa8b8;">x=(R+s·cos(t/2))·cos(t) &nbsp; y=(R+s·cos(t/2))·sin(t) &nbsp; z=s·sin(t/2) &nbsp; R=2.5 &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 9, 24);

        const camera = new THREE.PerspectiveCamera(
            50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 26
        );
        camera.position.set(1.0, 0.55, 7.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色常量 ====================
        const C1 = '#d4885c'; // 暖金 – s线
        const C2 = '#5d9ec6'; // 冰蓝 – t线
        const C3 = '#c77d9f'; // 玫瑰粉 – 斜线
        const C_REF = '#3a4a5c';
        const C_GLINT = '#8898aa';

        const R_MOBIUS = 2.5;
        const S_MAX = 0.5;
        const NUM_S = 36; // 固定s的t线数量
        const NUM_T = 36; // 固定t的s线数量
        const NUM_SKEW = 24; // 斜线数量
        const SAMPLES = 300;

        // ==================== Möbius参数方程 ====================
        function mobiusPoint(t, s) {
            const cosT = Math.cos(t);
            const sinT = Math.sin(t);
            const cosT2 = Math.cos(t / 2);
            const sinT2 = Math.sin(t / 2);
            const r = R_MOBIUS + s * cosT2;
            const x = r * cosT;
            const y = r * sinT;
            const z = s * sinT2;
            return new THREE.Vector3(x, y, z);
        }

        // ==================== 生成s线（固定t，变化s） ====================
        function generateSLines() {
            const curves = [];
            const tValues = [];
            for (let i = 0; i < NUM_T; i++) {
                tValues.push((i / NUM_T) * Math.PI * 2);
            }
            const ds = (2 * S_MAX) / SAMPLES;
            for (const t of tValues) {
                const pts = [];
                for (let j = 0; j <= SAMPLES; j++) {
                    const s = -S_MAX + j * ds;
                    pts.push(mobiusPoint(t, s));
                }
                curves.push(pts);
            }
            return curves;
        }

        // ==================== 生成t线（固定s，变化t） ====================
        function generateTLines() {
            const curves = [];
            const sValues = [];
            for (let i = 0; i < NUM_S; i++) {
                sValues.push(-S_MAX + (i / (NUM_S - 1)) * 2 * S_MAX);
            }
            const dt = (Math.PI * 2) / SAMPLES;
            for (const s of sValues) {
                const pts = [];
                for (let j = 0; j <= SAMPLES; j++) {
                    const t = j * dt;
                    pts.push(mobiusPoint(t, s));
                }
                curves.push(pts);
            }
            return curves;
        }

        // ==================== 生成斜线 ====================
        function generateSkewLines() {
            const curves = [];
            const ks = [0.5, 0.7, 0.9, 1.1, 1.3, 1.5];
            const phaseOffsets = [];
            for (let i = 0; i < NUM_SKEW; i++) {
                phaseOffsets.push((i / NUM_SKEW) * Math.PI * 2);
            }
            for (const offset of phaseOffsets) {
                const k = ks[Math.floor(Math.random() * ks.length)];
                const pts = [];
                const dt = (Math.PI * 2) / SAMPLES;
                for (let j = 0; j <= SAMPLES; j++) {
                    const t = j * dt + offset;
                    const s = S_MAX * Math.cos(k * t);
                    pts.push(mobiusPoint(t, s));
                }
                curves.push(pts);
            }
            return curves;
        }

        const sCurves = generateSLines();
        const tCurves = generateTLines();
        const skewCurves = generateSkewLines();
        console.log('s线:', sCurves.length, 't线:', tCurves.length, '斜线:', skewCurves.length);

        function createGroup(curves, colorHex, opacity) {
            const group = new THREE.Group();
            for (const pts of curves) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const sGroup = createGroup(sCurves, C1, 0.6);
        const tGroup = createGroup(tCurves, C2, 0.55);
        const skewGroup = createGroup(skewCurves, C3, 0.5);
        const mainGroup = new THREE.Group();
        mainGroup.add(sGroup);
        mainGroup.add(tGroup);
        mainGroup.add(skewGroup);
        scene.add(mainGroup);

        // ==================== 参考球面线框 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 180;
            const gen = (f) => {
                const pts = [];
                for (let i = 0; i <= segs; i++) pts.push(f((i / segs) * Math.PI * 2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            };
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
            gen((a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius));
            gen((a) => {
                const z = radius * 0.5, r = Math.sqrt(radius * radius - z * z);
                return new THREE.Vector3(Math.cos(a) * r, z, Math.sin(a) * r);
            });
            gen((a) => {
                const z = -radius * 0.5, r = Math.sqrt(radius * radius - z * z);
                return new THREE.Vector3(Math.cos(a) * r, z, Math.sin(a) * r);
            });
            return group;
        }
        const sphereRef = createSphereWireframe(R_MOBIUS + S_MAX + 0.3, C_REF, 0.22);
        scene.add(sphereRef);

        // ==================== 边界光点 ====================
        (() => {
            const sz = 0.06;
            const R = R_MOBIUS + S_MAX + 0.3;
            const axes = [[R,0,0],[-R,0,0],[0,R,0],[0,-R,0],[0,0,R],[0,0,-R]];
            const glintGroup = new THREE.Group();
            axes.forEach(([x,y,z]) => {
                const pt = new THREE.Vector3(x, y, z);
                [[-sz,0,0],[sz,0,0],[0,-sz,0],[0,sz,0],[0,0,-sz],[0,0,sz]].forEach(([dx,dy,dz]) => {
                    const g = new THREE.BufferGeometry().setFromPoints([pt.clone().add(new THREE.Vector3(dx,dy,dz)), pt]);
                    const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent:true, opacity:0.5, depthWrite:true });
                    glintGroup.add(new THREE.Line(g, m));
                });
            });
            mainGroup.add(glintGroup);
        })();

        // ==================== 原点光点 ====================
        (() => {
            const sz = 0.08;
            const g = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0),
                new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0),
                new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)
            ]);
            const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent:true, opacity:0.7, depthWrite:true });
            scene.add(new THREE.LineSegments(g, m));
        })();

        // ==================== 动画循环（绝对时间） ====================
        let time = 0, lastTime = performance.now(), frameCount = 0;
        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;

            mainGroup.rotation.y = time * 0.28;
            mainGroup.rotation.x = time * 0.15 + Math.sin(time * 0.23) * 0.2;
            mainGroup.rotation.z = Math.cos(time * 0.18) * 0.12;
            sphereRef.rotation.copy(mainGroup.rotation);

            camera.position.set(
                1.0 + Math.sin(time * 0.14) * 0.55,
                0.55 + Math.cos(time * 0.17) * 0.45,
                7.5 + Math.sin(time * 0.11) * 0.45
            );
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        console.log('=== Möbius带参数曲线网 · 扭曲拓扑交织 ===');
        console.log('总曲线数:', sCurves.length + tCurves.length + skewCurves.length);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
