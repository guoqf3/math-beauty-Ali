<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辫子群 · 三维编织空间</title>
    <style>
        :root {
            --bg: #05080d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay .title {
            font-size: clamp(1.05rem, 2.2vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 40px rgba(200, 180, 150, 0.5),
                0 0 72px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.55rem, 1.0vw, 0.72rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }

        #formula-overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 8, 13, 0.7);
            padding: 11px 22px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            max-width: 95vw;
        }

        #formula-overlay .formula {
            font-size: clamp(0.52rem, 0.95vw, 0.72rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.28);
            line-height: 1.6;
            white-space: nowrap;
        }

        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }

        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 12px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.48rem;
                white-space: normal;
                line-height: 1.45;
            }
            #title-overlay .title {
                font-size: 0.82rem;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="title-overlay">
        <div class="title">辫子群 · 三维编织空间</div>
        <div class="subtitle">BRAID GROUP &nbsp;·&nbsp; 3D WEAVING SPACE</div>
    </div>

    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">pₖ:</span> (R₁·cos(ω₁z+φₖ+θ₁),&nbsp;R₁·sin(ω₁z+φₖ+θ₁),&nbsp;z)
            &nbsp;
            <span class="c2">qₖ:</span> (R₂·cos(ω₂z+ψₖ+θ₂),&nbsp;…)
            <br>
            <span class="c3">Bₙ=⟨σ₁,…,σₙ₋₁|σᵢσⱼ=σⱼσᵢ(|i−j|>1),σᵢσᵢ₊₁σᵢ=σᵢ₊₁σᵢσᵢ₊₁⟩</span>
            <span style="color:#9aa8b8;">&nbsp;z∈[−3.5,3.5]&nbsp;θ̇₁≠θ̇₂≠θ̇₃</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#05080d');
        scene.fog = new THREE.Fog('#05080d', 10, 30);

        const camera = new THREE.PerspectiveCamera(
            52,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.35,
            44
        );
        camera.position.set(2.6, 1.7, 9.2);
        camera.lookAt(0, -0.1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色定义 ====================
        const COLOR_WARM_GOLD = '#d4885c';
        const COLOR_ICE_BLUE = '#5d9ec6';
        const COLOR_ROSE = '#c77d9f';
        const COLOR_REF_GRID = '#6b7a8c';

        // ==================== 根旋转组 ====================
        const rootGroup = new THREE.Group();
        scene.add(rootGroup);

        // ==================== 参考网格：横向圆环 + 纵向经线 ====================
        const refGridGroup = new THREE.Group();
        rootGroup.add(refGridGroup);

        const refRadius = 3.05;
        const zMin = -3.5;
        const zMax = 3.5;

        // 横向圆环（纬线）
        const numLatCircles = 18;
        for (let i = 0; i < numLatCircles; i++) {
            const z = zMin + (i / (numLatCircles - 1)) * (zMax - zMin);
            const circleSegments = 150;
            const circlePoints = [];
            for (let j = 0; j <= circleSegments; j++) {
                const angle = (j / circleSegments) * Math.PI * 2;
                circlePoints.push(new THREE.Vector3(
                    refRadius * Math.cos(angle),
                    z,
                    refRadius * Math.sin(angle)
                ));
            }
            const circleGeom = new THREE.BufferGeometry().setFromPoints(circlePoints);
            const circleMat = new THREE.LineBasicMaterial({
                color: new THREE.Color(COLOR_REF_GRID),
                transparent: true,
                opacity: 0.3,
                depthWrite: true,
            });
            const circleLine = new THREE.Line(circleGeom, circleMat);
            refGridGroup.add(circleLine);
        }

        // 纵向经线
        const numLongLines = 14;
        for (let i = 0; i < numLongLines; i++) {
            const phi = (i / numLongLines) * Math.PI * 2;
            const x = refRadius * Math.cos(phi);
            const z = refRadius * Math.sin(phi);
            const longPoints = [
                new THREE.Vector3(x, zMin, z),
                new THREE.Vector3(x, zMax, z),
            ];
            const longGeom = new THREE.BufferGeometry().setFromPoints(longPoints);
            const longMat = new THREE.LineBasicMaterial({
                color: new THREE.Color(COLOR_REF_GRID),
                transparent: true,
                opacity: 0.32,
                depthWrite: true,
            });
            const longLine = new THREE.Line(longGeom, longMat);
            refGridGroup.add(longLine);
        }

        // 顶部和底部端点圆环（稍亮）
        function createEndRing(z, colorHex, opacity) {
            const segs = 180;
            const pts = [];
            for (let j = 0; j <= segs; j++) {
                const a = (j / segs) * Math.PI * 2;
                pts.push(new THREE.Vector3(refRadius * Math.cos(a), z, refRadius * Math.sin(a)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            return new THREE.Line(geom, mat);
        }
        refGridGroup.add(createEndRing(zMin, '#8a95a5', 0.55));
        refGridGroup.add(createEndRing(zMax, '#8a95a5', 0.55));

        // ==================== 辫子线创建函数 ====================
        /**
         * 创建一组辫子线
         * @param {number} R - 圆柱半径
         * @param {number} omega - 螺距参数
         * @param {number} numLines - 线条数量
         * @param {number} numPoints - 每条线采样点数
         * @param {string} colorHex - 颜色
         * @param {number} opacity - 不透明度
         * @returns {THREE.Group} 包含所有辫子线的组
         */
        function createBraidGroup(R, omega, numLines, numPoints, colorHex, opacity) {
            const group = new THREE.Group();
            const lines = [];
            const dz = (zMax - zMin) / numPoints;

            for (let k = 0; k < numLines; k++) {
                const phiK = (k / numLines) * Math.PI * 2;
                const positions = new Float32Array((numPoints + 1) * 3);

                // 初始填充 (theta=0)
                for (let i = 0; i <= numPoints; i++) {
                    const z = zMin + i * dz;
                    const angle = omega * z + phiK;
                    const idx = i * 3;
                    positions[idx] = R * Math.cos(angle);
                    positions[idx + 1] = z;
                    positions[idx + 2] = R * Math.sin(angle);
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const material = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                const line = new THREE.Line(geometry, material);
                line.userData = {
                    R,
                    omega,
                    phiK,
                    numPoints,
                    zMin,
                    zMax,
                    positions,
                };
                group.add(line);
                lines.push(line);
            }

            group.userData = { lines, R, omega, numLines };
            return group;
        }

        /**
         * 更新一组辫子线的顶点（基于当前theta）
         */
        function updateBraidGroup(group, theta) {
            const lines = group.userData.lines;
            for (const line of lines) {
                const { R, omega, phiK, numPoints, zMin, zMax, positions } = line.userData;
                const dz = (zMax - zMin) / numPoints;
                for (let i = 0; i <= numPoints; i++) {
                    const z = zMin + i * dz;
                    const angle = omega * z + phiK + theta;
                    const idx = i * 3;
                    positions[idx] = R * Math.cos(angle);
                    positions[idx + 1] = z;
                    positions[idx + 2] = R * Math.sin(angle);
                }
                line.geometry.attributes.position.needsUpdate = true;
            }
        }

        // ==================== 构建三组辫子 ====================
        // 暖金组 - 内层，细密螺旋
        const braidGroup1 = createBraidGroup(1.45, 2.1, 11, 280, COLOR_WARM_GOLD, 0.8);
        // 冰蓝组 - 中层，反向螺旋
        const braidGroup2 = createBraidGroup(2.05, -1.55, 13, 280, COLOR_ICE_BLUE, 0.78);
        // 玫瑰粉组 - 外层，较宽松螺旋
        const braidGroup3 = createBraidGroup(2.65, 1.15, 10, 300, COLOR_ROSE, 0.76);

        rootGroup.add(braidGroup1);
        rootGroup.add(braidGroup2);
        rootGroup.add(braidGroup3);

        // ==================== 动画状态 ====================
        const startTime = performance.now();
        let frameCount = 0;
        let lastLogTime = 0;
        let currentTime = 0;

        // 三组辫子各自的相位旋转速度
        const thetaSpeed1 = 0.55;
        const thetaSpeed2 = -0.68;
        const thetaSpeed3 = 0.42;

        // ==================== 动画循环（绝对时间基准） ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            const elapsed = (timestamp - startTime) / 1000;
            if (elapsed <= 0) {
                renderer.render(scene, camera);
                return;
            }
            currentTime = elapsed;
            frameCount++;

            if (timestamp - lastLogTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${currentTime.toFixed(2)}s`);
                lastLogTime = timestamp;
            }

            // 计算各组相位
            const theta1 = currentTime * thetaSpeed1;
            const theta2 = currentTime * thetaSpeed2;
            const theta3 = currentTime * thetaSpeed3;

            // 更新辫子线顶点
            updateBraidGroup(braidGroup1, theta1);
            updateBraidGroup(braidGroup2, theta2);
            updateBraidGroup(braidGroup3, theta3);

            // 根组绕Y轴旋转
            rootGroup.rotation.y += 0.0045;
            // 微小的X轴摆动
            rootGroup.rotation.x += Math.sin(currentTime * 0.22) * 0.0012;
            rootGroup.rotation.z += Math.cos(currentTime * 0.26) * 0.001;

            // 参考网格组独立微动（相对于根组）
            refGridGroup.rotation.y += 0.0012;

            // 相机缓慢游走
            const camX = 2.6 + Math.sin(currentTime * 0.15) * 0.55;
            const camY = 1.7 + Math.cos(currentTime * 0.19) * 0.45;
            const camZ = 9.2 + Math.sin(currentTime * 0.12) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, -0.1, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

        // ==================== 启动流程 ====================
        console.log('=== 辫子群 · 三维编织空间 ===');
        console.log('暖金辫子线数:', braidGroup1.userData.lines.length);
        console.log('冰蓝辫子线数:', braidGroup2.userData.lines.length);
        console.log('玫瑰粉辫子线数:', braidGroup3.userData.lines.length);
        console.log('总辫子线数:',
            braidGroup1.userData.lines.length +
            braidGroup2.userData.lines.length +
            braidGroup3.userData.lines.length
        );
        console.log('正在预热初始帧...');

        // 预热：以t=0初始化所有辫子线
        updateBraidGroup(braidGroup1, 0);
        updateBraidGroup(braidGroup2, 0);
        updateBraidGroup(braidGroup3, 0);
        renderer.render(scene, camera);

        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');
        requestAnimationFrame(animate);
    </script>
</body>
</html>
