<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyroid截面编织 · 极小曲面切层网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Gyroid截面编织 · 极小曲面切层网</h2>
        <div class="sub">sin x·cos y + sin y·cos z + sin z·cos x = 0 · Three slicing families</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">z=zₖ截面: sin x·cos y + sin y·Cₖ + Sₖ·cos x = 0</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">x=xₖ截面: Cₖ·cos y + sin y·cos z + sin z·Sₖ = 0</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">y=yₖ截面: sin x·Cₖ + Sₖ·cos z + sin z·cos x = 0</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(4.0, 2.8, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.62;
        const RANGE = 4.0;
        const GRID_RES = 90; // 大幅降低分辨率以保证性能
        const STEP = 2 * RANGE / GRID_RES;

        // Gyroid函数
        function gyroid(x, y, z) {
            return Math.sin(x) * Math.cos(y) + Math.sin(y) * Math.cos(z) + Math.sin(z) * Math.cos(x);
        }

        // 在2D网格上追踪等值线（优化版）
        function traceIsoCurves2D(coordType, numSlices, color, opacity) {
            const group = new THREE.Group();
            const gridN = GRID_RES;
            const h = STEP;
            const totalCells = gridN * gridN;
            const bufSize = totalCells * 4; // 预分配缓冲区
            const positions = new Float32Array(bufSize * 3);
            let vertIdx = 0;

            for (let s = 0; s < numSlices; s++) {
                const slicePos = -RANGE + (s + 0.5) * 2 * RANGE / numSlices;

                for (let i = 0; i < gridN; i++) {
                    const u1 = -RANGE + i * h;
                    const u2 = u1 + h;
                    for (let j = 0; j < gridN; j++) {
                        const v1 = -RANGE + j * h;
                        const v2 = v1 + h;
                        let f11, f12, f21, f22;
                        if (coordType === 'z') {
                            f11 = gyroid(u1, v1, slicePos);
                            f12 = gyroid(u1, v2, slicePos);
                            f21 = gyroid(u2, v1, slicePos);
                            f22 = gyroid(u2, v2, slicePos);
                        } else if (coordType === 'x') {
                            f11 = gyroid(slicePos, v1, u1);
                            f12 = gyroid(slicePos, v2, u1);
                            f21 = gyroid(slicePos, v1, u2);
                            f22 = gyroid(slicePos, v2, u2);
                        } else {
                            f11 = gyroid(v1, slicePos, u1);
                            f12 = gyroid(v2, slicePos, u1);
                            f21 = gyroid(v1, slicePos, u2);
                            f22 = gyroid(v2, slicePos, u2);
                        }
                        const hasPos = f11 > 0 || f12 > 0 || f21 > 0 || f22 > 0;
                        const hasNeg = f11 < 0 || f12 < 0 || f21 < 0 || f22 < 0;
                        if (!hasPos || !hasNeg) continue;

                        // 收集边上零点
                        const pts = [];
                        if (f11 * f21 < 0) {
                            const t = Math.abs(f11) / (Math.abs(f11) + Math.abs(f21));
                            pts.push([u1 + t * h, v1]);
                        }
                        if (f11 * f12 < 0) {
                            const t = Math.abs(f11) / (Math.abs(f11) + Math.abs(f12));
                            pts.push([u1, v1 + t * h]);
                        }
                        if (f21 * f22 < 0) {
                            const t = Math.abs(f21) / (Math.abs(f21) + Math.abs(f22));
                            pts.push([u2, v1 + t * h]);
                        }
                        if (f12 * f22 < 0) {
                            const t = Math.abs(f12) / (Math.abs(f12) + Math.abs(f22));
                            pts.push([u1 + t * h, v2]);
                        }
                        if (pts.length >= 2) {
                            for (let k = 0; k < pts.length - 1; k++) {
                                let p1, p2;
                                const a = pts[k], b = pts[k + 1];
                                if (coordType === 'z') {
                                    p1 = new THREE.Vector3(a[0], a[1], slicePos).multiplyScalar(SCALE);
                                    p2 = new THREE.Vector3(b[0], b[1], slicePos).multiplyScalar(SCALE);
                                } else if (coordType === 'x') {
                                    p1 = new THREE.Vector3(slicePos, a[0], a[1]).multiplyScalar(SCALE);
                                    p2 = new THREE.Vector3(slicePos, b[0], b[1]).multiplyScalar(SCALE);
                                } else {
                                    p1 = new THREE.Vector3(a[0], slicePos, a[1]).multiplyScalar(SCALE);
                                    p2 = new THREE.Vector3(b[0], slicePos, b[1]).multiplyScalar(SCALE);
                                }
                                if (p1.length() < 6 && p2.length() < 6) {
                                    if (vertIdx + 6 <= bufSize * 3) {
                                        positions[vertIdx++] = p1.x; positions[vertIdx++] = p1.y; positions[vertIdx++] = p1.z;
                                        positions[vertIdx++] = p2.x; positions[vertIdx++] = p2.y; positions[vertIdx++] = p2.z;
                                    }
                                }
                            }
                        }
                    }
                }
            }
            if (vertIdx >= 6) {
                const geom = new THREE.BufferGeometry();
                geom.setAttribute('position', new THREE.BufferAttribute(positions.slice(0, vertIdx), 3));
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true,
                });
                group.add(new THREE.LineSegments(geom, mat));
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'gyroid-weave';
        scene.add(rootGroup);

        console.log('开始生成Gyroid截面...');
        const t0 = performance.now();

        // 金色族：z截面 (20片)
        rootGroup.add(traceIsoCurves2D('z', 20, COLOR_GOLD, 0.55));
        // 青色族：x截面 (20片)
        rootGroup.add(traceIsoCurves2D('x', 20, COLOR_CYAN, 0.55));
        // 品红族：y截面 (20片)
        rootGroup.add(traceIsoCurves2D('y', 20, COLOR_MAGENTA, 0.55));
        // 额外稀疏截面
        rootGroup.add(traceIsoCurves2D('z', 12, COLOR_GOLD, 0.30));
        rootGroup.add(traceIsoCurves2D('x', 12, COLOR_CYAN, 0.30));
        rootGroup.add(traceIsoCurves2D('y', 12, COLOR_MAGENTA, 0.30));

        const t1 = performance.now();
        console.log('Gyroid截面生成耗时:', (t1 - t0).toFixed(0), 'ms');
        console.log('Gyroid截面组子元素:', rootGroup.children.length);

        // 辅助立方体参考框架
        const boxSize = RANGE * SCALE;
        const boxGeom = new THREE.BoxGeometry(boxSize * 2, boxSize * 2, boxSize * 2);
        const boxEdges = new THREE.EdgesGeometry(boxGeom);
        rootGroup.add(new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.14, depthWrite: true, depthTest: true
        })));

        // 辅助：三个坐标平面参考网格
        function createPlaneGrid(normal, color, opacity) {
            const group = new THREE.Group();
            let u1, u2;
            if (Math.abs(normal.x) < 0.9) {
                u1 = new THREE.Vector3(1, 0, 0).cross(normal).normalize();
            } else {
                u1 = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
            }
            u2 = normal.clone().cross(u1).normalize();
            const s = RANGE * SCALE;
            for (let i = 0; i < 6; i++) {
                const d = -s * 0.78 + i * 2 * s * 0.78 / 5;
                const pts1 = [], pts2 = [];
                for (let j = 0; j <= 100; j++) {
                    const t = -s + j * 2 * s / 100;
                    pts1.push(normal.clone().multiplyScalar(d).add(u2.clone().multiplyScalar(t)));
                    pts2.push(normal.clone().multiplyScalar(d).add(u1.clone().multiplyScalar(t)));
                }
                const g1 = new THREE.BufferGeometry().setFromPoints(pts1);
                group.add(new THREE.Line(g1, new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: true,
                    depthTest: true })));
                const g2 = new THREE.BufferGeometry().setFromPoints(pts2);
                group.add(new THREE.Line(g2, new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: true,
                    depthTest: true })));
            }
            return group;
        }
        rootGroup.add(createPlaneGrid(new THREE.Vector3(1, 0, 0), 0x504030, 0.05));
        rootGroup.add(createPlaneGrid(new THREE.Vector3(0, 1, 0), 0x504030, 0.05));
        rootGroup.add(createPlaneGrid(new THREE.Vector3(0, 0, 1), 0x504030, 0.05));

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环（纯手动，确保永不停止） ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.13;
            rootGroup.rotation.y = t * 0.22;
            rootGroup.rotation.z = t * 0.09;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.9;
            const camAngle = t * 0.08;
            const camHeight = 2.9 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧并立即启动循环
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }, 120));

        console.log('✅ Gyroid极小曲面截面编织动画已稳定运行');
    </script>
</body>
</html>
