<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热带编织 · Max‑Plus几何</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>热带编织 · Max‑Plus几何</h2>
        <div class="sub">Tropical hypersurface edges · Piecewise‑linear braiding</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">x⊕y = max(x,y)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">x⊙y = x+y</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">f = ⊕ₖ (aₖ⊙x ⊕ bₖ⊙y ⊕ cₖ⊙z)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(4.0, 2.8, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const CUBE_HALF = 3.2;

        // 裁剪直线与立方体
        function clipLineToCube(p0, dir, outPts) {
            const tMin = -1e5, tMax = 1e5;
            let t0 = -1e5, t1 = 1e5;
            const eps = 1e-6;
            const dims = ['x','y','z'];
            const bounds = [-CUBE_HALF, CUBE_HALF];
            for (let d = 0; d < 3; d++) {
                const coord = d === 0 ? 'x' : (d === 1 ? 'y' : 'z');
                const v = dir[coord];
                const p = p0[coord];
                if (Math.abs(v) < eps) {
                    if (p < bounds[0] || p > bounds[1]) return 0;
                } else {
                    let tA = (bounds[0] - p) / v;
                    let tB = (bounds[1] - p) / v;
                    if (tA > tB) [tA, tB] = [tB, tA];
                    t0 = Math.max(t0, tA);
                    t1 = Math.min(t1, tB);
                    if (t0 > t1 + eps) return 0;
                }
            }
            if (t0 > t1) return 0;
            outPts.push(p0.x + dir.x * t0, p0.y + dir.y * t0, p0.z + dir.z * t0);
            outPts.push(p0.x + dir.x * t1, p0.y + dir.y * t1, p0.z + dir.z * t1);
            return 1;
        }

        // 热带多项式： max(L1,...,LK) 的各项系数（方向固定，偏移随时间变化）
        const NUM_POLYNOMIALS = 18; // 每种颜色多项式数量
        const TERMS = 5;            // 每个多项式5项
        const poolDirections = [];
        // 生成随机单位方向向量池
        for (let i = 0; i < 80; i++) {
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            poolDirections.push(new THREE.Vector3(
                Math.sin(phi) * Math.cos(theta),
                Math.sin(phi) * Math.sin(theta),
                Math.cos(phi)
            ));
        }

        function createPolynomial() {
            const terms = [];
            for (let t = 0; t < TERMS; t++) {
                const dir = poolDirections[Math.floor(Math.random() * poolDirections.length)];
                const baseOffset = (Math.random() - 0.5) * 0.8;
                const amp = 0.15 + Math.random() * 0.25;
                const freq = 0.7 + Math.random() * 0.9;
                const phase = Math.random() * 2 * Math.PI;
                terms.push({ dir, baseOffset, amp, freq, phase });
            }
            return terms;
        }

        const goldPolys = Array.from({ length: NUM_POLYNOMIALS }, createPolynomial);
        const cyanPolys = Array.from({ length: NUM_POLYNOMIALS }, createPolynomial);
        const magentaPolys = Array.from({ length: NUM_POLYNOMIALS }, createPolynomial);

        // 计算项在时间t时的偏移
        function termValue(term, t) {
            return term.baseOffset + term.amp * Math.sin(term.freq * t + term.phase);
        }

        // 计算两平面交线的方向向量 (L1-L2=0 和 L2-L3=0)
        function computeLineDirection(t1, t2, t3) {
            const a1 = t1.dir.x, b1 = t1.dir.y, c1 = t1.dir.z;
            const a2 = t2.dir.x, b2 = t2.dir.y, c2 = t2.dir.z;
            const a3 = t3.dir.x, b3 = t3.dir.y, c3 = t3.dir.z;
            const A1 = a1 - a2, B1 = b1 - b2, C1 = c1 - c2;
            const A2 = a2 - a3, B2 = b2 - b3, C2 = c2 - c3;
            // 叉积得到方向
            const x = B1 * C2 - C1 * B2;
            const y = C1 * A2 - A1 * C2;
            const z = A1 * B2 - B1 * A2;
            return new THREE.Vector3(x, y, z);
        }

        // 找到直线上一点（解两平面方程，再设某一坐标为零求特解）
        function findPointOnLine(t1, t2, t3, time) {
            const d1 = termValue(t1, time);
            const d2 = termValue(t2, time);
            const d3 = termValue(t3, time);
            // 方程: (a1-a2)x + (b1-b2)y + (c1-c2)z = d2 - d1
            //       (a2-a3)x + (b2-b3)y + (c2-c3)z = d3 - d2
            const a11 = t1.dir.x - t2.dir.x, a12 = t1.dir.y - t2.dir.y, a13 = t1.dir.z - t2.dir.z;
            const a21 = t2.dir.x - t3.dir.x, a22 = t2.dir.y - t3.dir.y, a23 = t2.dir.z - t3.dir.z;
            const b1c = d2 - d1;
            const b2c = d3 - d2;
            // 高斯消元求特解
            // 寻找主元
            let pivot;
            if (Math.abs(a11) > 1e-6) {
                pivot = 'x';
            } else if (Math.abs(a12) > 1e-6) {
                pivot = 'y';
            } else {
                pivot = 'z';
            }
            let x0 = 0, y0 = 0, z0 = 0;
            // 尝试设z=0
            const det = a11 * a22 - a12 * a21;
            if (Math.abs(det) > 1e-8) {
                x0 = (b1c * a22 - a12 * b2c) / det;
                y0 = (a11 * b2c - b1c * a21) / det;
                return new THREE.Vector3(x0, y0, 0);
            } else {
                // 设x=0
                const det2 = a12 * a23 - a13 * a22;
                if (Math.abs(det2) > 1e-6) {
                    y0 = (b1c * a23 - a13 * b2c) / det2;
                    z0 = (a12 * b2c - b1c * a22) / det2;
                    return new THREE.Vector3(0, y0, z0);
                } else {
                    return new THREE.Vector3(0, 0, 0);
                }
            }
        }

        // 分配线段缓冲区
        const MAX_LINES = 3000;
        const goldBuffer = new Float32Array(MAX_LINES * 2 * 3);
        const cyanBuffer = new Float32Array(MAX_LINES * 2 * 3);
        const magentaBuffer = new Float32Array(MAX_LINES * 2 * 3);
        let goldCount = 0, cyanCount = 0, magentaCount = 0;

        function collectPolynomialLines(polys, bufferArr, countObj, time) {
            let idx = 0;
            for (const poly of polys) {
                // 遍历所有三元组
                for (let i = 0; i < TERMS; i++) {
                    for (let j = i + 1; j < TERMS; j++) {
                        for (let k = j + 1; k < TERMS; k++) {
                            const t1 = poly[i], t2 = poly[j], t3 = poly[k];
                            const dir = computeLineDirection(t1, t2, t3);
                            if (dir.lengthSq() < 1e-12) continue;
                            const p0 = findPointOnLine(t1, t2, t3, time);
                            const pts = [];
                            const added = clipLineToCube(p0, dir.normalize(), pts);
                            if (added && idx + 6 <= bufferArr.length) {
                                bufferArr[idx++] = pts[0];
                                bufferArr[idx++] = pts[1];
                                bufferArr[idx++] = pts[2];
                                bufferArr[idx++] = pts[3];
                                bufferArr[idx++] = pts[4];
                                bufferArr[idx++] = pts[5];
                            }
                        }
                    }
                }
            }
            countObj.count = idx / 6;
        }

        // 创建LineSegments
        function createLineSegments(bufferArr, color, opacity) {
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(bufferArr, 3));
            geom.setDrawRange(0, 0);
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            return new THREE.LineSegments(geom, mat);
        }

        const goldSegments = createLineSegments(goldBuffer, COLOR_GOLD, 0.55);
        const cyanSegments = createLineSegments(cyanBuffer, COLOR_CYAN, 0.55);
        const magentaSegments = createLineSegments(magentaBuffer, COLOR_MAGENTA, 0.55);

        const rootGroup = new THREE.Group();
        rootGroup.name = 'tropical-weave';
        rootGroup.add(goldSegments);
        rootGroup.add(cyanSegments);
        rootGroup.add(magentaSegments);
        scene.add(rootGroup);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.5, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 辅助立方体边框
        const boxGeom = new THREE.BoxGeometry(CUBE_HALF * 2, CUBE_HALF * 2, CUBE_HALF * 2);
        const boxEdges = new THREE.EdgesGeometry(boxGeom);
        const boxLine = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.2,
        }));
        rootGroup.add(boxLine);

        function animate() {
            const t = getElapsed();

            const goldCountObj = { count: 0 };
            const cyanCountObj = { count: 0 };
            const magentaCountObj = { count: 0 };

            collectPolynomialLines(goldPolys, goldBuffer, goldCountObj, t);
            collectPolynomialLines(cyanPolys, cyanBuffer, cyanCountObj, t);
            collectPolynomialLines(magentaPolys, magentaBuffer, magentaCountObj, t);

            goldSegments.geometry.setDrawRange(0, goldCountObj.count * 2);
            goldSegments.geometry.attributes.position.needsUpdate = true;
            cyanSegments.geometry.setDrawRange(0, cyanCountObj.count * 2);
            cyanSegments.geometry.attributes.position.needsUpdate = true;
            magentaSegments.geometry.setDrawRange(0, magentaCountObj.count * 2);
            magentaSegments.geometry.attributes.position.needsUpdate = true;

            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.23;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.8;
            const camAngle = t * 0.08;
            const camHeight = 2.9 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染一帧并启动循环
        goldSegments.geometry.attributes.position.needsUpdate = true;
        cyanSegments.geometry.attributes.position.needsUpdate = true;
        magentaSegments.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 热带编织动画已稳定运行');
    </script>
</body>
</html>
