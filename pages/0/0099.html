<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲抛物面 · 直纹渐近网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>双曲抛物面 · 直纹渐近网</h2>
        <div class="sub">Hyperbolic paraboloid · Asymptotic rulings</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">y-直纹 (x变，y=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">x-直纹 (y变，x=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">渐近线 x±y = const</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 场景初始化
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.8, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟
        let startTime = performance.now();
        let elapsed = 0;
        function tick() { elapsed = (performance.now() - startTime) * 0.001; return elapsed; }

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        const SCALE = 0.52;
        const XYRange = 2.0;

        // 双曲抛物面 z = x² - y²
        function hpPoint(x, y) {
            return new THREE.Vector3(x, y, (x * x - y * y)).multiplyScalar(SCALE);
        }

        // 生成 y-const 曲线（金色）
        function createYConstCurves(color, count, numPoints = 240) {
            const group = new THREE.Group();
            const dx = 2 * XYRange / numPoints;
            for (let i = 0; i < count; i++) {
                const y = -XYRange + i * 2 * XYRange / (count - 1);
                const pts = [];
                for (let j = 0; j <= numPoints; j++) {
                    const x = -XYRange + j * dx;
                    pts.push(hpPoint(x, y));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.8, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // 生成 x-const 曲线（青色）
        function createXConstCurves(color, count, numPoints = 240) {
            const group = new THREE.Group();
            const dy = 2 * XYRange / numPoints;
            for (let i = 0; i < count; i++) {
                const x = -XYRange + i * 2 * XYRange / (count - 1);
                const pts = [];
                for (let j = 0; j <= numPoints; j++) {
                    const y = -XYRange + j * dy;
                    pts.push(hpPoint(x, y));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.8, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // 生成渐近线族（品红）：x+y = const 和 x-y = const
        function createAsymptoticLines(color, constStep, numPoints = 280) {
            const group = new THREE.Group();
            const constMin = -2.8, constMax = 2.8;
            for (let c = constMin; c <= constMax; c += constStep) {
                // 渐近线 x+y = c
                let pts1 = [], pts2 = [];
                const dt = 4.0 / numPoints;
                for (let i = 0; i <= numPoints; i++) {
                    const t = -2.0 + i * dt;
                    const x = t, y1 = c - t, y2 = t - c;
                    if (Math.abs(x) <= XYRange && Math.abs(y1) <= XYRange) pts1.push(hpPoint(x, y1));
                    if (Math.abs(x) <= XYRange && Math.abs(y2) <= XYRange) pts2.push(hpPoint(x, y2));
                }
                if (pts1.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts1);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.68, depthWrite: true, depthTest: true
                    })));
                }
                if (pts2.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts2);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.68, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'hp-system';
        scene.add(rootGroup);

        // 金色：y-const 线 28条
        rootGroup.add(createYConstCurves(COLOR_GOLD, 28));
        // 青色：x-const 线 28条
        rootGroup.add(createXConstCurves(COLOR_CYAN, 28));
        // 品红：渐近线
        rootGroup.add(createAsymptoticLines(COLOR_MAGENTA, 0.09));

        console.log('双曲抛物面线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 11;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        })));
        scene.add(starsGroup);

        // 动画循环
        function animate() {
            tick();
            const t = elapsed;

            rootGroup.rotation.x = t * 0.18;
            rootGroup.rotation.y = t * 0.29;
            rootGroup.rotation.z = t * 0.13;

            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 7.4;
            const camAngle = t * 0.09;
            const camHeight = 2.9 + Math.sin(t * 0.17) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 双曲抛物面直纹渐近网动画已稳定运行');
    </script>
</body>
</html>
