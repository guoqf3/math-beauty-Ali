<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学·几何·拓扑·空间 - 交织融汇</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --gold: #d4a056;
            --cyan: #4ecdc4;
            --magenta: #e887a3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        /* 标题覆盖层 */
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 24px 20px 10px;
            text-align: center;
            background: linear-gradient(180deg,
                    rgba(10, 10, 15, 0.95) 0%,
                    rgba(10, 10, 15, 0.85) 50%,
                    rgba(10, 10, 15, 0) 100%);
        }
        .overlay-title h1 {
            font-size: clamp(1.2rem, 2.4vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 160, 86, 0.5), 0 0 60px rgba(212, 160, 86, 0.2);
            margin: 0;
            line-height: 1.4;
        }
        .overlay-title .subtitle {
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            letter-spacing: 0.2em;
            color: rgba(200, 180, 150, 0.7);
            margin-top: 2px;
        }

        /* 公式覆盖层 */
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 10px 20px 20px;
            text-align: center;
            background: linear-gradient(0deg,
                    rgba(10, 10, 15, 0.95) 0%,
                    rgba(10, 10, 15, 0.85) 55%,
                    rgba(10, 10, 15, 0) 100%);
        }
        .overlay-formula .formula-line {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            color: rgba(200, 190, 170, 0.8);
            letter-spacing: 0.04em;
            line-height: 1.7;
            font-style: italic;
        }
        .overlay-formula .formula-line .highlight-gold {
            color: #d4a056;
            font-style: normal;
            font-weight: bold;
        }
        .overlay-formula .formula-line .highlight-cyan {
            color: #4ecdc4;
            font-style: normal;
            font-weight: bold;
        }
        .overlay-formula .formula-line .highlight-magenta {
            color: #e887a3;
            font-style: normal;
            font-weight: bold;
        }
        .formula-separator {
            display: inline-block;
            margin: 0 18px;
            color: rgba(150, 140, 130, 0.4);
            font-style: normal;
        }
    </style>
</head>
<body>

    <div class="overlay-title">
        <h1>拓扑流形 · 几何交织 · 空间交响</h1>
        <div class="subtitle">Torus Knots &nbsp;·&nbsp; Lorenz Attractor &nbsp;·&nbsp; Spherical Geodesics</div>
    </div>

    <div class="overlay-formula" id="formula-overlay">
        <div class="formula-line">
            <span class="highlight-gold">r(θ)</span> = ((R+r·cos(qθ))·cos(pθ),
            &nbsp;(R+r·cos(qθ))·sin(pθ),
            &nbsp;r·sin(qθ))
            <span class="formula-separator">‖</span>
            <span class="highlight-cyan">ẋ</span>=σ(y−x)&nbsp;
            <span class="highlight-cyan">ẏ</span>=x(ρ−z)−y&nbsp;
            <span class="highlight-magenta">ż</span>=xy−βz
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // 相机
        const camera = new THREE.PerspectiveCamera(52, container.clientWidth / container.clientHeight, 0.5, 40);
        camera.position.set(1.8, 2.6, 9.5);
        camera.lookAt(0, 0, 0);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x0a0a0f, 1);
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // 时钟 - 确保动画持续运行
        const clock = new THREE.Clock();

        // ==================== 颜色定义 ====================
        const COLOR_GOLD = 0xd4a056;
        const COLOR_CYAN = 0x4ecdc4;
        const COLOR_MAGENTA = 0xe887a3;
        const COLOR_GOLD_DIM = 0xb8893e;
        const COLOR_CYAN_DIM = 0x3aada5;
        const COLOR_MAGENTA_DIM = 0xc96d88;

        // ==================== 辅助函数 ====================
        /** 生成环面纽结的点数组 */
        function generateTorusKnotPoints(p, q, R, r, numPoints = 2000) {
            const points = [];
            for (let i = 0; i <= numPoints; i++) {
                const theta = (i / numPoints) * Math.PI * 2;
                const rho = R + r * Math.cos(q * theta);
                const x = rho * Math.cos(p * theta);
                const y = rho * Math.sin(p * theta);
                const z = r * Math.sin(q * theta);
                points.push(new THREE.Vector3(x, y, z));
            }
            return points;
        }

        /** 从点数组创建Line */
        function createLineFromPoints(points, color, lineWidth = 1) {
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: color,
                linewidth: lineWidth,
                transparent: true,
                opacity: 0.88,
                depthWrite: true,
                depthTest: true,
            });
            const line = new THREE.Line(geometry, material);
            return line;
        }

        /** 生成球面大圆上的点 */
        function generateGreatCirclePoints(normal, sphereRadius, numPoints = 500) {
            const n = normal.clone().normalize();
            // 选择两个正交的切向量
            let u, v;
            if (Math.abs(n.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(n).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(n).normalize();
            }
            v = n.clone().cross(u).normalize();

            const points = [];
            for (let i = 0; i <= numPoints; i++) {
                const t = (i / numPoints) * Math.PI * 2;
                const pt = u.clone().multiplyScalar(Math.cos(t))
                    .add(v.clone().multiplyScalar(Math.sin(t)))
                    .normalize()
                    .multiplyScalar(sphereRadius);
                points.push(pt);
            }
            return points;
        }

        /** 使用斐波那契球分布生成均匀的法向量 */
        function fibonacciSphereNormals(count) {
            const normals = [];
            const phi_golden = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < count; i++) {
                const y = 1 - (2 * i + 1) / count;
                const radiusAtY = Math.sqrt(1 - y * y);
                const theta = phi_golden * i;
                normals.push(new THREE.Vector3(
                    Math.cos(theta) * radiusAtY,
                    y,
                    Math.sin(theta) * radiusAtY
                ).normalize());
            }
            return normals;
        }

        /** RK4积分一步（洛伦兹系统） */
        function lorenzRK4(x, y, z, sigma, rho, beta, h) {
            const dx = (sx, sy, sz) => sigma * (sy - sx);
            const dy = (sx, sy, sz) => sx * (rho - sz) - sy;
            const dz = (sx, sy, sz) => sx * sy - beta * sz;

            const k1x = dx(x, y, z);
            const k1y = dy(x, y, z);
            const k1z = dz(x, y, z);

            const k2x = dx(x + 0.5 * h * k1x, y + 0.5 * h * k1y, z + 0.5 * h * k1z);
            const k2y = dy(x + 0.5 * h * k1x, y + 0.5 * h * k1y, z + 0.5 * h * k1z);
            const k2z = dz(x + 0.5 * h * k1x, y + 0.5 * h * k1y, z + 0.5 * h * k1z);

            const k3x = dx(x + 0.5 * h * k2x, y + 0.5 * h * k2y, z + 0.5 * h * k2z);
            const k3y = dy(x + 0.5 * h * k2x, y + 0.5 * h * k2y, z + 0.5 * h * k2z);
            const k3z = dz(x + 0.5 * h * k2x, y + 0.5 * h * k2y, z + 0.5 * h * k2z);

            const k4x = dx(x + h * k3x, y + h * k3y, z + h * k3z);
            const k4y = dy(x + h * k3x, y + h * k3y, z + h * k3z);
            const k4z = dz(x + h * k3x, y + h * k3y, z + h * k3z);

            return [
                x + (h / 6) * (k1x + 2 * k2x + 2 * k3x + k4x),
                y + (h / 6) * (k1y + 2 * k2y + 2 * k3y + k4y),
                z + (h / 6) * (k1z + 2 * k2z + 2 * k3z + k4z),
            ];
        }

        /** 生成洛伦兹吸引子轨迹 */
        function generateLorenzTrajectory(initialX, initialY, initialZ, sigma, rho, beta, h, totalSteps, discardSteps) {
            let x = initialX,
                y = initialY,
                z = initialZ;
            const rawPoints = [];

            for (let i = 0; i < totalSteps; i++) {
                [x, y, z] = lorenzRK4(x, y, z, sigma, rho, beta, h);
                if (i >= discardSteps) {
                    rawPoints.push(new THREE.Vector3(x, y, z));
                }
            }
            return rawPoints;
        }

        // ==================== 构建场景元素 ====================

        // --- 组1：金色纽结组 ---
        const groupGold = new THREE.Group();
        groupGold.name = 'gold-knots';
        scene.add(groupGold);

        const goldKnotDefs = [
            { p: 2, q: 3, R: 1.75, r: 0.48, color: COLOR_GOLD },
            { p: 3, q: 5, R: 2.15, r: 0.42, color: COLOR_GOLD_DIM },
            { p: 2, q: 7, R: 2.55, r: 0.38, color: COLOR_GOLD },
        ];

        goldKnotDefs.forEach(def => {
            const pts = generateTorusKnotPoints(def.p, def.q, def.R, def.r, 2200);
            const line = createLineFromPoints(pts, def.color);
            groupGold.add(line);
        });

        // --- 组2：青色纽结组 + 洛伦兹吸引子 ---
        const groupCyan = new THREE.Group();
        groupCyan.name = 'cyan-knots';
        scene.add(groupCyan);

        const cyanKnotDefs = [
            { p: 3, q: 7, R: 2.0, r: 0.46, color: COLOR_CYAN },
            { p: 4, q: 5, R: 2.4, r: 0.40, color: COLOR_CYAN_DIM },
            { p: 5, q: 8, R: 2.7, r: 0.36, color: COLOR_CYAN },
        ];

        cyanKnotDefs.forEach(def => {
            const pts = generateTorusKnotPoints(def.p, def.q, def.R, def.r, 2200);
            const line = createLineFromPoints(pts, def.color);
            groupCyan.add(line);
        });

        // 洛伦兹吸引子1（青色组）
        const lorenzRaw1 = generateLorenzTrajectory(1.0, 1.0, 1.0, 10.0, 28.0, 8.0 / 3.0, 0.004, 28000, 7000);
        const scaleLorenz = 0.072;
        const lorenzPts1 = lorenzRaw1.map(p => new THREE.Vector3(p.x * scaleLorenz, p.z * scaleLorenz - 1.6, p.y *
            scaleLorenz));
        const lorenzLine1 = createLineFromPoints(lorenzPts1, COLOR_CYAN_DIM);
        lorenzLine1.material.opacity = 0.7;
        groupCyan.add(lorenzLine1);

        // --- 组3：品红纽结组 + 洛伦兹吸引子 ---
        const groupMagenta = new THREE.Group();
        groupMagenta.name = 'magenta-knots';
        scene.add(groupMagenta);

        const magentaKnotDefs = [
            { p: 4, q: 7, R: 1.9, r: 0.44, color: COLOR_MAGENTA },
            { p: 5, q: 7, R: 2.35, r: 0.40, color: COLOR_MAGENTA_DIM },
            { p: 3, q: 8, R: 2.65, r: 0.37, color: COLOR_MAGENTA },
        ];

        magentaKnotDefs.forEach(def => {
            const pts = generateTorusKnotPoints(def.p, def.q, def.R, def.r, 2200);
            const line = createLineFromPoints(pts, def.color);
            groupMagenta.add(line);
        });

        // 洛伦兹吸引子2（品红组，不同初始条件）
        const lorenzRaw2 = generateLorenzTrajectory(1.0002, 1.0, 1.0, 10.0, 28.0, 8.0 / 3.0, 0.004, 28000, 7000);
        const lorenzPts2 = lorenzRaw2.map(p => new THREE.Vector3(p.x * scaleLorenz, p.z * scaleLorenz - 1.6, p.y *
            scaleLorenz));
        const lorenzLine2 = createLineFromPoints(lorenzPts2, COLOR_MAGENTA_DIM);
        lorenzLine2.material.opacity = 0.7;
        groupMagenta.add(lorenzLine2);

        // --- 组4：球面几何大圆 ---
        const groupSphere = new THREE.Group();
        groupSphere.name = 'sphere-geodesics';
        scene.add(groupSphere);

        const sphereRadius = 3.15;
        const greatCircleCount = 22;
        const normalVectors = fibonacciSphereNormals(greatCircleCount);

        normalVectors.forEach((normal, index) => {
            const pts = generateGreatCirclePoints(normal, sphereRadius, 520);
            // 混合使用三种颜色，根据法向量方向分配
            let color;
            const dotY = Math.abs(normal.y);
            const dotX = Math.abs(normal.x);
            if (dotY > 0.55) {
                color = COLOR_GOLD_DIM;
            } else if (dotX > 0.5) {
                color = COLOR_CYAN_DIM;
            } else {
                color = COLOR_MAGENTA_DIM;
            }
            const line = createLineFromPoints(pts, color);
            line.material.opacity = 0.55;
            groupSphere.add(line);
        });

        // --- 额外：球面Clelia曲线（增添几何美感） ---
        const groupClelia = new THREE.Group();
        groupClelia.name = 'clelia-curves';
        scene.add(groupClelia);

        function generateCleliaPoints(n, radius, numPoints = 1800) {
            const points = [];
            for (let i = 0; i <= numPoints; i++) {
                const t = (i / numPoints) * Math.PI * 2;
                const phi = t;
                const theta = Math.asin(Math.sin(n * t));
                // 转换到笛卡尔坐标
                const x = radius * Math.cos(theta) * Math.cos(phi);
                const y = radius * Math.cos(theta) * Math.sin(phi);
                const z = radius * Math.sin(theta);
                points.push(new THREE.Vector3(x, y, z));
            }
            return points;
        }

        // 添加几条Clelia曲线
        const cleliaDefs = [
            { n: 3, r: 2.9, color: COLOR_GOLD },
            { n: 5, r: 3.0, color: COLOR_CYAN },
            { n: 7, r: 3.05, color: COLOR_MAGENTA },
        ];

        cleliaDefs.forEach(def => {
            const pts = generateCleliaPoints(def.n, def.r, 2000);
            const line = createLineFromPoints(pts, def.color);
            line.material.opacity = 0.5;
            groupClelia.add(line);
        });

        // --- 组5：额外的交错纽结（混合在中心区域） ---
        const groupExtra = new THREE.Group();
        groupExtra.name = 'extra-interlaced';
        scene.add(groupExtra);

        // 一个小型的(5,3)纽结在中心
        const extraKnotPts = generateTorusKnotPoints(5, 3, 1.3, 0.32, 2000);
        const extraLine = createLineFromPoints(extraKnotPts, COLOR_GOLD);
        extraLine.material.opacity = 0.75;
        groupExtra.add(extraLine);

        // 一个小型(7,2)纽结
        const extraKnotPts2 = generateTorusKnotPoints(7, 2, 1.45, 0.28, 2000);
        const extraLine2 = createLineFromPoints(extraKnotPts2, COLOR_MAGENTA);
        extraLine2.material.opacity = 0.7;
        groupExtra.add(extraLine2);

        // ==================== 粒子装饰（沿某些纽结移动的光点） ====================
        const particleGroup = new THREE.Group();
        particleGroup.name = 'particles';
        scene.add(particleGroup);

        // 创建一些发光小球，它们将在动画中沿纽结移动
        const particleGeom = new THREE.SphereGeometry(0.035, 8, 8);
        const particleMaterials = [
            new THREE.MeshBasicMaterial({ color: COLOR_GOLD, transparent: true, opacity: 0.9 }),
            new THREE.MeshBasicMaterial({ color: COLOR_CYAN, transparent: true, opacity: 0.9 }),
            new THREE.MeshBasicMaterial({ color: COLOR_MAGENTA, transparent: true, opacity: 0.9 }),
            new THREE.MeshBasicMaterial({ color: COLOR_GOLD, transparent: true, opacity: 0.85 }),
            new THREE.MeshBasicMaterial({ color: COLOR_CYAN, transparent: true, opacity: 0.85 }),
            new THREE.MeshBasicMaterial({ color: COLOR_MAGENTA, transparent: true, opacity: 0.85 }),
        ];

        const particles = [];
        const particleKnotRefs = [
            { p: 2, q: 3, R: 1.75, r: 0.48, group: groupGold, matIndex: 0 },
            { p: 3, q: 5, R: 2.15, r: 0.42, group: groupGold, matIndex: 3 },
            { p: 3, q: 7, R: 2.0, r: 0.46, group: groupCyan, matIndex: 1 },
            { p: 4, q: 5, R: 2.4, r: 0.40, group: groupCyan, matIndex: 4 },
            { p: 4, q: 7, R: 1.9, r: 0.44, group: groupMagenta, matIndex: 2 },
            { p: 5, q: 7, R: 2.35, r: 0.40, group: groupMagenta, matIndex: 5 },
        ];

        particleKnotRefs.forEach(ref => {
            const mesh = new THREE.Mesh(particleGeom, particleMaterials[ref.matIndex]);
            mesh.userData = {
                knotRef: ref,
                phase: Math.random() * Math.PI * 2,
                speed: 0.25 + Math.random() * 0.7,
            };
            particleGroup.add(mesh);
            particles.push(mesh);
        });

        // ==================== 环境光粒子（微小的背景星点） ====================
        const starsGroup = new THREE.Group();
        starsGroup.name = 'background-stars';
        scene.add(starsGroup);

        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 300;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 5 + Math.random() * 8;
            starsPositions[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPositions[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPositions[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x888870,
            size: 0.018,
            transparent: true,
            opacity: 0.6,
            depthWrite: false,
        });
        const starsPoints = new THREE.Points(starsGeom, starsMat);
        starsGroup.add(starsPoints);

        // ==================== 动画循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // 金色组：绕Y轴为主旋转，略带X轴摆动
            groupGold.rotation.y = elapsed * 0.28;
            groupGold.rotation.x = Math.sin(elapsed * 0.18) * 0.25;
            groupGold.rotation.z = Math.cos(elapsed * 0.22) * 0.18;

            // 青色组：绕X轴为主旋转，略带Z轴摆动
            groupCyan.rotation.x = elapsed * 0.33;
            groupCyan.rotation.z = Math.sin(elapsed * 0.21) * 0.3;
            groupCyan.rotation.y = Math.cos(elapsed * 0.19) * 0.22;

            // 品红组：绕Z轴为主旋转，略带Y轴摆动
            groupMagenta.rotation.z = elapsed * 0.30;
            groupMagenta.rotation.y = Math.sin(elapsed * 0.23) * 0.28;
            groupMagenta.rotation.x = Math.cos(elapsed * 0.20) * 0.2;

            // 球面几何组：缓慢绕倾斜轴旋转
            groupSphere.rotation.x = elapsed * 0.12;
            groupSphere.rotation.y = elapsed * 0.16;
            groupSphere.rotation.z = elapsed * 0.10;

            // Clelia曲线组
            groupClelia.rotation.x = elapsed * 0.14;
            groupClelia.rotation.y = elapsed * 0.19;
            groupClelia.rotation.z = elapsed * 0.11;

            // 额外纽结组
            groupExtra.rotation.x = elapsed * 0.38;
            groupExtra.rotation.y = elapsed * 0.35;
            groupExtra.rotation.z = elapsed * 0.25;

            // 背景星点缓慢旋转
            starsGroup.rotation.y = elapsed * 0.04;
            starsGroup.rotation.x = elapsed * 0.03;

            // 更新沿纽结移动的粒子
            particles.forEach(mesh => {
                const ud = mesh.userData;
                const ref = ud.knotRef;
                const effectiveTime = elapsed * ud.speed + ud.phase;
                const theta = (effectiveTime % (Math.PI * 2));
                const p = ref.p;
                const q = ref.q;
                const R = ref.R;
                const r = ref.r;
                const rho = R + r * Math.cos(q * theta);
                const lx = rho * Math.cos(p * theta);
                const ly = rho * Math.sin(p * theta);
                const lz = r * Math.sin(q * theta);

                // 将局部坐标转换到世界坐标（考虑其所属组的旋转）
                const localPt = new THREE.Vector3(lx, ly, lz);
                ref.group.localToWorld(localPt);
                mesh.position.copy(localPt);
            });

            // 相机轻微环绕运动
            const camAngle = elapsed * 0.08;
            const camRadius = 9.2;
            const camHeight = 2.4 + Math.sin(elapsed * 0.13) * 1.2;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口大小调整 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(onResize, 150);
        });

        // ==================== 启动 ====================
        // 初始调整
        onResize();

        // 启动动画循环（使用requestAnimationFrame的时间戳作为初始调用）
        requestAnimationFrame(animate);

        // ==================== 防止页面空白/卡顿的保障 ====================
        // 额外的心跳检测：如果3秒后场景似乎没在渲染，强制重新渲染
        setTimeout(() => {
            const testElapsed = clock.getElapsedTime();
            if (testElapsed < 0.01) {
                // 时钟可能没启动，手动触发
                clock.start();
            }
            renderer.render(scene, camera);
        }, 300);

        console.log('✅ 拓扑几何动画已就绪');
        console.log('   - 金色组：3个环面纽结 (p,q) = (2,3), (3,5), (2,7)');
        console.log('   - 青色组：3个环面纽结 + 洛伦兹吸引子');
        console.log('   - 品红组：3个环面纽结 + 洛伦兹吸引子');
        console.log('   - 球面几何：22个大圆 + 3条Clelia曲线');
        console.log('   - 6个沿纽结滑动的光点粒子');
        console.log('   - 相机自动环绕');
        console.log('   🎯 所有元素持续动画中...');
    </script>
</body>
