<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极光呼吸 · 流体星云</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .container {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.04);
            background: #0a0c14;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 600px;
            cursor: grab;
            background: radial-gradient(ellipse at 50% 50%, #11141f, #050609);
        }
        canvas:active {
            cursor: grabbing;
        }
        .credit {
            position: absolute;
            bottom: 20px;
            right: 28px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
            pointer-events: none;
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .hint {
            position: absolute;
            top: 20px;
            left: 28px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.5px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .hint i {
            font-style: normal;
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.9;
            }
        }
        @media (max-width: 1024px) {
            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1000 / 600;
            }
            .credit,
            .hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas" width="1000" height="600"></canvas>
        <div class="hint"><i>✦ 拖拽 · 星云随你而动</i></div>
        <div class="credit">vibe <span>·</span> code</div>
    </div>

    <script>
        // ============================================================
        //  极光呼吸 · 流体星云 (简易稳定版)
        //  核心逻辑：粒子沿轨道匀速旋转，鼠标产生吸引偏移，
        //  粒子间动态连线，形成星云效果。
        // ============================================================

        // 在控制台输出启动信息，方便检查脚本是否加载成功
        console.log('✅ 极光呼吸 · 流体星云 已加载');

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 如果 canvas 获取失败，直接抛出错误
        if (!canvas) {
            console.error('❌ 未找到 canvas 元素，请检查 HTML 结构');
            throw new Error('Canvas 元素不存在');
        }

        const W = 1000,
            H = 600;

        // ---------- 状态 ----------
        let mouse = { x: W / 2, y: H / 2, active: false };
        let time = 0;

        // ---------- 粒子参数 ----------
        const NUM_PARTICLES = 280;
        const CONNECT_RADIUS = 65; // 连线距离
        const ATTRACT_FORCE = 0.08; // 鼠标吸引强度

        // ---------- 初始化粒子 ----------
        let particles = [];
        for (let i = 0; i < NUM_PARTICLES; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 80 + Math.random() * 220; // 分布在半径 80~300 的环上
            particles.push({
                // 初始位置
                x: W / 2 + Math.cos(angle) * radius,
                y: H / 2 + Math.sin(angle) * radius,
                // 轨道参数
                angle: angle,
                radius: radius,
                speed: 0.003 + Math.random() * 0.008, // 公转速度
                // 颜色属性
                hue: 210 + Math.random() * 80, // 蓝紫到粉紫
                size: 1.8 + Math.random() * 2.5,
                // 记录上一帧位置用于拖尾
                prevX: 0,
                prevY: 0
            });
        }

        // ---------- 背景繁星 ----------
        let stars = [];
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: 0.3 + Math.random() * 1.0,
                phase: Math.random() * Math.PI * 2
            });
        }

        // ---------- 物理更新 ----------
        function updatePhysics() {
            for (let p of particles) {
                // 记录上一帧位置
                p.prevX = p.x;
                p.prevY = p.y;

                // 1. 轨道运动 (公转)
                p.angle += p.speed;

                // 2. 计算目标位置 (在轨道上)
                let targetX = W / 2 + Math.cos(p.angle) * p.radius;
                let targetY = H / 2 + Math.sin(p.angle) * p.radius;

                // 3. 鼠标吸引 (如果鼠标激活)
                if (mouse.active) {
                    const dx = mouse.x - p.x;
                    const dy = mouse.y - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 250 && dist > 1) {
                        // 越靠近鼠标，吸引力越强
                        const force = (1 - dist / 250) * ATTRACT_FORCE;
                        targetX += dx * force;
                        targetY += dy * force;
                    }
                }

                // 4. 平滑移动到目标 (弹性跟随)
                p.x += (targetX - p.x) * 0.06;
                p.y += (targetY - p.y) * 0.06;

                // 5. 边界安全处理 (防止粒子跑出视野)
                if (p.x < -50) p.x = W + 50;
                if (p.x > W + 50) p.x = -50;
                if (p.y < -50) p.y = H + 50;
                if (p.y > H + 50) p.y = -50;
            }
        }

        // ---------- 渲染 ----------
        function draw() {
            // 半透明背景，产生运动拖尾
            ctx.fillStyle = 'rgba(10, 12, 20, 0.15)';
            ctx.fillRect(0, 0, W, H);

            // ---- 1. 绘制粒子间的连线 ----
            for (let i = 0; i < NUM_PARTICLES; i++) {
                for (let j = i + 1; j < NUM_PARTICLES; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    // 计算实际距离
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < CONNECT_RADIUS) {
                        const alpha = (1 - dist / CONNECT_RADIUS) * 0.4;
                        // 使用两个粒子的平均色相
                        const hue = (p1.hue + p2.hue) / 2;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = `hsla(${hue}, 100%, 70%, ${alpha * 0.2})`;
                        ctx.strokeStyle = `hsla(${hue}, 80%, 65%, ${alpha})`;
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            ctx.shadowBlur = 0;

            // ---- 2. 绘制粒子主体 (带光晕和拖尾) ----
            for (let p of particles) {
                const speed = Math.sqrt(
                    Math.pow(p.x - p.prevX, 2) + Math.pow(p.y - p.prevY, 2)
                );
                const hue = p.hue + Math.sin(time * 0.01 + p.angle) * 10;
                const lightness = 55 + Math.min(speed * 5, 25);

                // 发光光晕
                const grad = ctx.createRadialGradient(
                    p.x - 1, p.y - 1, 0.5,
                    p.x, p.y, p.size * 2.5
                );
                grad.addColorStop(0, `hsla(${hue}, 100%, 85%, 0.9)`);
                grad.addColorStop(0.6, `hsla(${hue + 10}, 80%, 60%, 0.5)`);
                grad.addColorStop(1, `hsla(${hue + 20}, 70%, 40%, 0)`);

                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.3)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 1.4, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // 核心高光
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x - 0.5, p.y - 0.5, p.size * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(0, 0%, 100%, ${0.3 + speed * 0.04})`;
                ctx.fill();

                // 拖尾轨迹线 (连接前后位置)
                ctx.shadowBlur = 8;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.2)`;
                ctx.strokeStyle = `hsla(${hue}, 90%, ${lightness}%, 0.5)`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(p.prevX, p.prevY);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // ---- 3. 背景繁星闪烁 ----
            for (let star of stars) {
                const flicker = 0.5 + 0.5 * Math.sin(time * 0.02 + star.phase);
                const alpha = 0.15 + flicker * 0.3;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r * 0.7, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            }

            // ---- 4. 鼠标光晕 ----
            if (mouse.active) {
                const grad = ctx.createRadialGradient(
                    mouse.x, mouse.y, 0,
                    mouse.x, mouse.y, 200
                );
                grad.addColorStop(0, 'rgba(180, 200, 255, 0.04)');
                grad.addColorStop(0.5, 'rgba(100, 130, 255, 0.02)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 200, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ---------- 动画循环 ----------
        function animate(timestamp) {
            time = timestamp || 0;
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        // ---------- 鼠标事件 (带错误保护) ----------
        function handleMouseMove(e) {
            try {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                mouse.x = (e.clientX - rect.left) * scaleX;
                mouse.y = (e.clientY - rect.top) * scaleY;
                mouse.active = true;
            } catch (err) {
                console.warn('鼠标事件处理出错:', err);
            }
        }

        function handleMouseLeave() {
            mouse.active = false;
        }

        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseleave', handleMouseLeave);

        // 触摸支持
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouse.x = (touch.clientX - rect.left) * scaleX;
            mouse.y = (touch.clientY - rect.top) * scaleY;
            mouse.active = true;
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            mouse.active = false;
        });

        // ---------- 窗口自适应 ----------
        function resizeCanvas() {
            try {
                const container = canvas.parentElement;
                const maxW = window.innerWidth - 40;
                const maxH = window.innerHeight - 40;
                const ratio = canvas.width / canvas.height;
                let w = Math.min(1000, maxW);
                let h = w / ratio;
                if (h > maxH) {
                    h = maxH;
                    w = h * ratio;
                }
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            } catch (err) {
                console.warn('自适应调整出错:', err);
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ---------- 启动动画 ----------
        console.log('🚀 动画已启动，准备渲染...');
        animate(0);
        console.log('✨ 运行中，请尝试移动鼠标与星云互动');
    </script>
</body>
</html>
