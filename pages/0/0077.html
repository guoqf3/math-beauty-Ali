<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切触编织 · Legendre曲线网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>切触编织 · Legendre曲线网</h2>
        <div class="sub">Contact structure α = dz + x dy · Legendrian foliations</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">x=a cos(mt), y=b sin(nt)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">z=∫ x·dy = ∫ xẏ dt</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">Legendre: dz + x dy = 0</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.0, 2.2, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        const SCALE = 0.55;
        const MAX_PTS = 800;
        const T_MAX = 8 * Math.PI;

        // 生成Legendre曲线：满足 dz + x dy = 0
        // 给定 x(t), y(t)，则 z(t) = -∫₀ᵗ x(τ) y'(τ) dτ + z₀
        // 使用数值积分
        function generateLegendreCurve(xFn, yFn, z0, steps) {
            const pts = [];
            let z = z0;
            const dt = T_MAX / steps;
            for (let i = 0; i <= steps; i++) {
                const t = i * dt;
                const x = xFn(t);
                const y = yFn(t);
                pts.push(new THREE.Vector3(x, y, z).multiplyScalar(SCALE));
                if (i < steps) {
                    const tMid = t + dt * 0.5;
                    const yDot = (yFn(t + 0.001) - yFn(t - 0.001)) / 0.002;
                    const xMid = xFn(tMid);
                    z -= xMid * yDot * dt;
                }
            }
            return pts;
        }

        // 生成一族Legendre曲线
        function createLegendreFamily(xFn, yFn, zOffsets, color, opacity, steps) {
            const group = new THREE.Group();
            for (const z0 of zOffsets) {
                const pts = generateLegendreCurve(xFn, yFn, z0, steps);
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    depthWrite: true,
                    depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 定义多种函数对
        const goldDefs = [
            { fn: t => ({ x: 1.2 * Math.cos(1.7 * t), y: 0.9 * Math.sin(2.3 * t) }), label: 'G1' },
            { fn: t => ({ x: 1.5 * Math.cos(2.1 * t), y: 1.1 * Math.sin(1.5 * t) }), label: 'G2' },
            { fn: t => ({ x: 0.9 * Math.cos(3.0 * t + 0.5), y: 1.3 * Math.sin(2.0 * t) }), label: 'G3' },
            { fn: t => ({ x: 1.0 * Math.cos(1.3 * t), y: 1.6 * Math.sin(2.8 * t) }), label: 'G4' },
        ];
        const cyanDefs = [
            { fn: t => ({ x: 1.4 * Math.sin(2.0 * t), y: 1.0 * Math.cos(2.6 * t) }), label: 'C1' },
            { fn: t => ({ x: 0.8 * Math.sin(3.2 * t), y: 1.4 * Math.cos(1.8 * t) }), label: 'C2' },
            { fn: t => ({ x: 1.6 * Math.sin(1.4 * t), y: 0.8 * Math.cos(3.5 * t) }), label: 'C3' },
            { fn: t => ({ x: 1.1 * Math.sin(2.9 * t + 1.0), y: 1.2 * Math.cos(2.2 * t) }), label: 'C4' },
        ];
        const magentaDefs = [
            { fn: t => ({ x: 1.3 * Math.cos(2.4 * t), y: 1.3 * Math.sin(1.9 * t) }), label: 'M1' },
            { fn: t => ({ x: 1.7 * Math.cos(1.8 * t), y: 0.7 * Math.sin(3.3 * t) }), label: 'M2' },
            { fn: t => ({ x: 0.7 * Math.cos(3.6 * t), y: 1.5 * Math.sin(1.1 * t) }), label: 'M3' },
            { fn: t => ({ x: 1.2 * Math.cos(2.7 * t + 0.8), y: 1.0 * Math.sin(2.5 * t) }), label: 'M4' },
        ];

        const rootGroup = new THREE.Group();
        rootGroup.name = 'legendre-weave';
        scene.add(rootGroup);

        const zOffsetsCount = 10;
        const zRange = 3.5;

        // 金色曲线族
        goldDefs.forEach(def => {
            const offsets = Array.from({ length: zOffsetsCount }, (_, i) => i * zRange / zOffsetsCount - zRange / 2);
            rootGroup.add(createLegendreFamily(
                t => def.fn(t).x,
                t => def.fn(t).y,
                offsets,
                COLOR_GOLD,
                0.6,
                MAX_PTS
            ));
        });

        // 青色曲线族
        cyanDefs.forEach(def => {
            const offsets = Array.from({ length: zOffsetsCount }, (_, i) => i * zRange / zOffsetsCount - zRange / 2 + 0.3);
            rootGroup.add(createLegendreFamily(
                t => def.fn(t).x,
                t => def.fn(t).y,
                offsets,
                COLOR_CYAN,
                0.58,
                MAX_PTS
            ));
        });

        // 品红曲线族
        magentaDefs.forEach(def => {
            const offsets = Array.from({ length: zOffsetsCount }, (_, i) => i * zRange / zOffsetsCount - zRange / 2 + 0.6);
            rootGroup.add(createLegendreFamily(
                t => def.fn(t).x,
                t => def.fn(t).y,
                offsets,
                COLOR_MAGENTA,
                0.56,
                MAX_PTS
            ));
        });

        console.log('Legendre曲线总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 稳定动画循环
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.27;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧，确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 切触编织Legendre曲线网动画已稳定运行');
    </script>
</body>
</html>
