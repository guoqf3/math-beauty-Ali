<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环面无理测地线编织 · 稠密流形 · 共形投影</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d6a745;
            --cyan: #3cbca4;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.62rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.85rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.54rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3cbca4;
        }
        .accent-rose {
            color: #d94050;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>环面无理测地线编织 · 稠密流形 · 共形投影</h1>
        <div class="subtitle">T²上无理斜率测地线族 &nbsp;·&nbsp; 环面呼吸与旋转 &nbsp;·&nbsp; 球极逆投影织锦</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">u=α₁s, v=β₁s+v₀</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">u=α₂s, v=β₂s+v₀</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">u=α₃s, v=β₃s+v₀</span>
        </div>
        <div class="formula-detail">
            斜率√2、√3、φ 的无理测地线族 &nbsp;·&nbsp; 传统环面坐标 &nbsp;·&nbsp; 球面逆投影 &nbsp;·&nbsp; 三维编织不息
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.5, 32);
        camera.position.set(2.3, 1.4, 7.7);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3cbca4');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.8;

        // ---------- 背景星点 ----------
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 160;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.3 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSizes[i] = Math.random() * 1.6 + 0.22;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.018,
            transparent: true,
            opacity: 0.46,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 50, 34);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.07, depthWrite: false })
        );
        scene.add(refSphereWire);

        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 28);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.06, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- 环面映射 ----------
        // 标准环面参数化 (R + r*cos(v)) * cos(u), (R + r*cos(v)) * sin(u), r*sin(v)
        function torusPoint(u, v, R, r) {
            const cu = Math.cos(u);
            const su = Math.sin(u);
            const cv = Math.cos(v);
            const sv = Math.sin(v);
            return [
                (R + r * cv) * cu,
                (R + r * cv) * su,
                r * sv,
            ];
        }

        function inverseStereo(pt) {
            const x = pt[0],
                y = pt[1],
                z = pt[2];
            const r = Math.sqrt(x * x + y * y + z * z);
            if (r > 0.999 && r < 1.001) return pt; // 已在球面上
            const r2 = r * r;
            const denom = 1 + r2 / (2.5 * 2.5);
            const scale = 2.5 / Math.sqrt(r2);
            const s = Math.min(scale, 4.5);
            return [x * s, y * s, z * s];
        }

        function clampPoint(p) {
            const r = Math.sqrt(p[0] ** 2 + p[1] ** 2 + p[2] ** 2);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const sc = CLAMP_RADIUS / r;
                return [p[0] * sc, p[1] * sc, p[2] * sc];
            }
            return p;
        }

        // SO(3) 旋转矩阵生成
        function so3Matrix(t) {
            const angle = t * 0.24;
            const ax = Math.cos(t * 0.17) * 0.55;
            const ay = Math.sin(t * 0.13) * 0.45;
            const az = Math.cos(t * 0.19 + 1.3) * 0.5;
            const n = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
            const ux = ax / n,
                uy = ay / n,
                uz = az / n;
            const c = Math.cos(angle),
                s = Math.sin(angle),
                t1 = 1 - c;
            return [
                c + ux * ux * t1,
                ux * uy * t1 - uz * s,
                ux * uz * t1 + uy * s,
                uy * ux * t1 + uz * s,
                c + uy * uy * t1,
                uy * uz * t1 - ux * s,
                uz * ux * t1 - uy * s,
                uz * uy * t1 + ux * s,
                c + uz * uz * t1,
            ];
        }

        function applyRot(pt, Rmat) {
            return [
                Rmat[0] * pt[0] + Rmat[1] * pt[1] + Rmat[2] * pt[2],
                Rmat[3] * pt[0] + Rmat[4] * pt[1] + Rmat[5] * pt[2],
                Rmat[6] * pt[0] + Rmat[7] * pt[1] + Rmat[8] * pt[2],
            ];
        }

        // ---------- 曲线系统 ----------
        const POINTS_PER_CURVE = 160;
        const allCurves = [];

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.82,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geom, positions, updateFn: null };
            allCurves.push(obj);
            return obj;
        }

        // 生成一族无理测地线
        function buildGeodesicFamily(count, alpha, beta, color) {
            // v0 偏移在 [0, 2π] 均匀分布
            for (let k = 0; k < count; k++) {
                const v0 = (k / count) * Math.PI * 2;
                const curve = createCurve(color);
                curve.alpha = alpha;
                curve.beta = beta;
                curve.v0 = v0;
                curve.updateFn = (t, R, r, rotMat) => {
                    const positions = curve.positions;
                    const sMax = 4.5 * Math.PI; // 曲线长度
                    for (let i = 0; i < POINTS_PER_CURVE; i++) {
                        const s = (i / (POINTS_PER_CURVE - 1)) * sMax;
                        const u = alpha * s;
                        const v = beta * s + curve.v0;
                        let p = torusPoint(u, v, R, r);
                        // 球面逆投影映射（轻微扭曲）
                        p = inverseStereo(p);
                        // 应用全局旋转
                        p = applyRot(p, rotMat);
                        // 钳制到球内
                        p = clampPoint(p);
                        positions[i * 3] = p[0];
                        positions[i * 3 + 1] = p[1];
                        positions[i * 3 + 2] = p[2];
                    }
                    curve.geom.attributes.position.needsUpdate = true;
                };
            }
        }

        // 三组无理斜率：金 (√2), 青 (√3), 玫红 (φ)
        buildGeodesicFamily(20, 1, Math.sqrt(2), colorGold);
        buildGeodesicFamily(20, 1.3, Math.sqrt(3), colorCyan);
        const phi = (1 + Math.sqrt(5)) / 2;
        buildGeodesicFamily(20, 0.8, phi, colorRose);

        console.log(`测地线曲线总数: ${allCurves.length}`);

        // ---------- 流动粒子 ----------
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                curveIndex: i % allCurves.length,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0022,
            });
            let col;
            if (i < 7) col = colorGold.clone();
            else if (i < 14) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.048,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const curveObj = allCurves[pd.curveIndex];
                if (!curveObj || !curveObj.positions) continue;
                const posArr = curveObj.positions;
                const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                const i0 = idx0 * 3,
                    i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // 统一更新所有曲线
        function safeUpdateCurves(t) {
            // 环面参数随时间呼吸变化
            const R = 1.9 + 0.3 * Math.sin(t * 0.35) * Math.cos(t * 0.28);
            const r = 0.55 + 0.18 * Math.cos(t * 0.42) * Math.sin(t * 0.3);
            const rotMat = so3Matrix(t);
            for (const curve of allCurves) {
                try {
                    if (curve.updateFn) curve.updateFn(t, R, r, rotMat);
                } catch (e) {
                    console.warn('曲线更新异常', e);
                }
            }
        }

        // ---------- 健壮的动画循环 ----------
        const clock = new THREE.Clock();
        let animTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animTime += dt;
                frameCount++;
                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${animTime.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }
                safeUpdateCurves(animTime);
                updateParticles();

                const breathe = 1 + 0.04 * Math.sin(animTime * 0.38) * Math.cos(animTime * 0.28);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.055;
                refSphereWire.rotation.y += dt * 0.045;

                refTorusWire.rotation.z += dt * 0.055;
                const torBreathe = 1 + 0.05 * Math.sin(animTime * 0.42) * Math.cos(animTime * 0.31);
                refTorusWire.scale.setScalar(torBreathe);

                const camH = animTime * 0.09;
                const camV = 0.33 + 0.17 * Math.sin(animTime * 0.14);
                const camD = 7.4 + 0.6 * Math.sin(animTime * 0.19) * Math.cos(animTime * 0.25);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.05 * Math.sin(animTime * 0.09), 0.03 * Math.cos(animTime * 0.12), 0);

                stars.rotation.y += dt * 0.013;
                stars.rotation.x += dt * 0.009;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环异常:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') clock.getDelta();
        });

        // 启动
        console.log('🚀 环面无理测地线动画初始化...');
        safeUpdateCurves(0);
        updateParticles();
        renderer.render(scene, camera);
        clock.start();
        animTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环启动，60条无理测地线持续编织');
    </script>
</body>
</html>
