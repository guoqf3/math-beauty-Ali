<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时变球面编织 · 大圆动态网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>时变球面编织 · 大圆动态网</h2>
        <div class="sub">Time‑evolving great circles · SO(3) irrational flows · Spherical weaving</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">n̂₁(t)=Rz(√2·t)·x̂</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">n̂₂(t)=Rx(√3·t)·ŷ</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">n̂₃(t)=Ry(π·t)·ẑ</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.6, 2.5, 7.4);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const RADIUS = 2.7;
        const GREAT_CIRCLE_POINTS = 360;
        const PARALLELS_PER_FAMILY = 22;
        const EXTRA_PARALLELS = 12;
        const UPDATE_INTERVAL = 0.08;

        // 从极点生成大圆族：以单位向量n为极点的大圆，偏移角度在[offsetMin, offsetMax]
        function generateParallelCircles(pole, offsetCount, offsetMin, offsetMax) {
            const ptsArray = [];
            let u, v;
            if (Math.abs(pole.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(pole).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(pole).normalize();
            }
            v = pole.clone().cross(u).normalize();

            for (let i = 0; i < offsetCount; i++) {
                const offset = offsetMin + i * (offsetMax - offsetMin) / (offsetCount - 1);
                const cosOff = Math.cos(offset);
                const sinOff = Math.sin(offset);

                const circleRadius = RADIUS * Math.abs(sinOff);
                const centerDist = RADIUS * cosOff;
                const center = pole.clone().multiplyScalar(centerDist);

                const pts = [];
                const dAngle = 2 * Math.PI / GREAT_CIRCLE_POINTS;
                for (let j = 0; j <= GREAT_CIRCLE_POINTS; j++) {
                    const angle = j * dAngle;
                    const pt = center.clone()
                        .add(u.clone().multiplyScalar(circleRadius * Math.cos(angle)))
                        .add(v.clone().multiplyScalar(circleRadius * Math.sin(angle)));
                    pts.push(pt);
                }
                ptsArray.push(pts);
            }
            return ptsArray;
        }

        // 创建/更新一族圆的LineSegments
        function createFamilySegments(color, opacity, totalCircles) {
            const totalVerts = totalCircles * (GREAT_CIRCLE_POINTS + 1);
            const posArray = new Float32Array(totalVerts * 3);
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            const lineSegs = new THREE.LineSegments(geom, mat);
            lineSegs.userData = { posArray, totalCircles, circlePoints: GREAT_CIRCLE_POINTS + 1 };
            return lineSegs;
        }

        function updateFamilySegments(lineSegs, circlesData) {
            const { posArray, circlePoints } = lineSegs.userData;
            let idx = 0;
            for (const pts of circlesData) {
                for (let i = 0; i < pts.length - 1; i++) {
                    const a = pts[i], b = pts[i + 1];
                    posArray[idx++] = a.x; posArray[idx++] = a.y; posArray[idx++] = a.z;
                    posArray[idx++] = b.x; posArray[idx++] = b.y; posArray[idx++] = b.z;
                }
            }
            lineSegs.geometry.attributes.position.needsUpdate = true;
            lineSegs.geometry.setDrawRange(0, idx / 3);
        }

        // 三个族
        const totalCirclesGold = PARALLELS_PER_FAMILY + EXTRA_PARALLELS;
        const totalCirclesCyan = PARALLELS_PER_FAMILY + EXTRA_PARALLELS;
        const totalCirclesMagenta = PARALLELS_PER_FAMILY + EXTRA_PARALLELS;

        const goldSegments = createFamilySegments(COLOR_GOLD, 0.55, totalCirclesGold);
        const cyanSegments = createFamilySegments(COLOR_CYAN, 0.55, totalCirclesCyan);
        const magentaSegments = createFamilySegments(COLOR_MAGENTA, 0.55, totalCirclesMagenta);

        const rootGroup = new THREE.Group();
        rootGroup.name = 'time-varying-sphere';
        rootGroup.add(goldSegments);
        rootGroup.add(cyanSegments);
        rootGroup.add(magentaSegments);
        scene.add(rootGroup);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 辅助球面参考线
        const refWireGeom = new THREE.SphereGeometry(RADIUS * 0.995, 40, 24);
        const refEdges = new THREE.EdgesGeometry(refWireGeom);
        const refWire = new THREE.LineSegments(refEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.10, depthWrite: true, depthTest: true
        }));
        rootGroup.add(refWire);

        // ---- 稳定动画循环 ----
        let animFrameId;
        let lastUpdateT = -10;

        function mainLoop() {
            const t = getElapsed();

            if (t - lastUpdateT > UPDATE_INTERVAL) {
                try {
                    // 计算三个时变极点
                    const cosRt2 = Math.cos(Math.sqrt(2) * t);
                    const sinRt2 = Math.sin(Math.sqrt(2) * t);
                    const poleGold = new THREE.Vector3(cosRt2, sinRt2, 0).normalize();

                    const cosRt3 = Math.cos(Math.sqrt(3) * t);
                    const sinRt3 = Math.sin(Math.sqrt(3) * t);
                    const poleCyan = new THREE.Vector3(0, cosRt3, sinRt3).normalize();

                    const cosPi = Math.cos(Math.PI * t);
                    const sinPi = Math.sin(Math.PI * t);
                    const poleMagenta = new THREE.Vector3(sinPi, 0, cosPi).normalize();

                    // 生成圆族数据
                    const goldCircles = generateParallelCircles(poleGold, PARALLELS_PER_FAMILY, 0.05, Math.PI - 0.05);
                    const goldExtra = generateParallelCircles(poleGold, EXTRA_PARALLELS, 0.03, Math.PI * 0.8);
                    const cyanCircles = generateParallelCircles(poleCyan, PARALLELS_PER_FAMILY, 0.05, Math.PI - 0.05);
                    const cyanExtra = generateParallelCircles(poleCyan, EXTRA_PARALLELS, 0.04, Math.PI * 0.82);
                    const magentaCircles = generateParallelCircles(poleMagenta, PARALLELS_PER_FAMILY, 0.05, Math.PI - 0.05);
                    const magentaExtra = generateParallelCircles(poleMagenta, EXTRA_PARALLELS, 0.035, Math.PI * 0.78);

                    updateFamilySegments(goldSegments, [...goldCircles, ...goldExtra]);
                    updateFamilySegments(cyanSegments, [...cyanCircles, ...cyanExtra]);
                    updateFamilySegments(magentaSegments, [...magentaCircles, ...magentaExtra]);

                    lastUpdateT = t;
                } catch (e) {
                    console.warn('更新几何体错误:', e);
                }
            }

            rootGroup.rotation.x = t * 0.10;
            rootGroup.rotation.y = t * 0.15;
            rootGroup.rotation.z = t * 0.06;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.5;
            const camAngle = t * 0.08;
            const camHeight = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 初始化首帧
        const poleGold0 = new THREE.Vector3(1, 0, 0);
        const poleCyan0 = new THREE.Vector3(0, 1, 0);
        const poleMagenta0 = new THREE.Vector3(0, 0, 1);
        updateFamilySegments(goldSegments, [
            ...generateParallelCircles(poleGold0, PARALLELS_PER_FAMILY, 0.05, Math.PI - 0.05),
            ...generateParallelCircles(poleGold0, EXTRA_PARALLELS, 0.03, Math.PI * 0.8)
        ]);
        updateFamilySegments(cyanSegments, [
            ...generateParallelCircles(poleCyan0, PARALLELS_PER_FAMILY, 0.05, Math.PI - 0.05),
            ...generateParallelCircles(poleCyan0, EXTRA_PARALLELS, 0.04, Math.PI * 0.82)
        ]);
        updateFamilySegments(magentaSegments, [
            ...generateParallelCircles(poleMagenta0, PARALLELS_PER_FAMILY, 0.05, Math.PI - 0.05),
            ...generateParallelCircles(poleMagenta0, EXTRA_PARALLELS, 0.035, Math.PI * 0.78)
        ]);
        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 时变球面大圆动态编织动画已稳定运行');
    </script>
</body>
</html>
