<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正交圆柱编织 · 调和螺旋网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>正交圆柱编织 · 调和螺旋网</h2>
        <div class="sub">Helices on three orthogonal cylinders · Harmonic modulation</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">x=t, y=R₁cos(ω₁t), z=R₁sin(ω₁t)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">y=t, z=R₂cos(ω₂t), x=R₂sin(ω₂t)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">z=t, x=R₃cos(ω₃t), y=R₃sin(ω₃t)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(4.0, 2.8, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPAN = 3.2;
        const POINTS = 600;

        // 螺旋线点生成
        function generateHelix(R, omega, tMin, tMax, phi0, numPoints) {
            const pts = [];
            const dt = (tMax - tMin) / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const t = tMin + i * dt;
                const angle = omega * t + phi0;
                pts.push(new THREE.Vector3(t, R * Math.cos(angle), R * Math.sin(angle)));
            }
            return pts;
        }

        // 生成一族螺旋线
        function createHelixFamily(R, omega, tMin, tMax, numLines, color, opacity) {
            const group = new THREE.Group();
            for (let k = 0; k < numLines; k++) {
                const phi0 = k * 2 * Math.PI / numLines;
                const pts = generateHelix(R, omega, tMin, tMax, phi0, POINTS);
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 生成圆柱面上的环线（横截面）
        function createCylinderRing(R, tPos, color, opacity, numPoints) {
            const pts = [];
            const dAngle = 2 * Math.PI / numPoints;
            for (let j = 0; j <= numPoints; j++) {
                const ang = j * dAngle;
                pts.push(new THREE.Vector3(tPos, R * Math.cos(ang), R * Math.sin(ang)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        // 生成沿轴向的参考线
        function createAxialLine(angle, R, tMin, tMax, color, opacity, numPoints) {
            const pts = [];
            const dt = (tMax - tMin) / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const t = tMin + i * dt;
                pts.push(new THREE.Vector3(t, R * Math.cos(angle), R * Math.sin(angle)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'ortho-cylinders';
        scene.add(rootGroup);

        const tMin = -SPAN, tMax = SPAN;
        const numLines = 32;

        // 金色族：沿x轴的圆柱，螺旋线绕y-z平面
        const goldGroup = new THREE.Group();
        goldGroup.name = 'gold-x-axis';
        goldGroup.add(createHelixFamily(1.25, 4.0, tMin, tMax, numLines, COLOR_GOLD, 0.60));
        goldGroup.add(createHelixFamily(1.25, 3.2, tMin, tMax, Math.floor(numLines * 0.6), COLOR_GOLD, 0.40));
        // 添加环参考线
        for (let i = 0; i <= 14; i++) {
            const t = tMin + i * (tMax - tMin) / 14;
            goldGroup.add(createCylinderRing(1.25, t, COLOR_GOLD, 0.16, 180));
        }
        rootGroup.add(goldGroup);

        // 青色族：沿y轴的圆柱
        const cyanGroup = new THREE.Group();
        cyanGroup.name = 'cyan-y-axis';
        // 沿y轴的螺旋线：(y=t, z=Rcos, x=Rsin)
        function generateHelixY(R, omega, tMin, tMax, phi0, numPoints) {
            const pts = [];
            const dt = (tMax - tMin) / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const t = tMin + i * dt;
                const angle = omega * t + phi0;
                pts.push(new THREE.Vector3(R * Math.sin(angle), t, R * Math.cos(angle)));
            }
            return pts;
        }
        function createHelixFamilyY(R, omega, tMin, tMax, numLines, color, opacity) {
            const group = new THREE.Group();
            for (let k = 0; k < numLines; k++) {
                const phi0 = k * 2 * Math.PI / numLines;
                const pts = generateHelixY(R, omega, tMin, tMax, phi0, POINTS);
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }
        cyanGroup.add(createHelixFamilyY(1.45, 3.5, tMin, tMax, numLines, COLOR_CYAN, 0.60));
        cyanGroup.add(createHelixFamilyY(1.45, 2.8, tMin, tMax, Math.floor(numLines * 0.6), COLOR_CYAN, 0.40));
        rootGroup.add(cyanGroup);

        // 品红族：沿z轴的圆柱
        const magentaGroup = new THREE.Group();
        magentaGroup.name = 'magenta-z-axis';
        function generateHelixZ(R, omega, tMin, tMax, phi0, numPoints) {
            const pts = [];
            const dt = (tMax - tMin) / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const t = tMin + i * dt;
                const angle = omega * t + phi0;
                pts.push(new THREE.Vector3(R * Math.cos(angle), R * Math.sin(angle), t));
            }
            return pts;
        }
        function createHelixFamilyZ(R, omega, tMin, tMax, numLines, color, opacity) {
            const group = new THREE.Group();
            for (let k = 0; k < numLines; k++) {
                const phi0 = k * 2 * Math.PI / numLines;
                const pts = generateHelixZ(R, omega, tMin, tMax, phi0, POINTS);
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }
        magentaGroup.add(createHelixFamilyZ(1.65, 2.9, tMin, tMax, numLines, COLOR_MAGENTA, 0.60));
        magentaGroup.add(createHelixFamilyZ(1.65, 2.3, tMin, tMax, Math.floor(numLines * 0.6), COLOR_MAGENTA, 0.40));
        rootGroup.add(magentaGroup);

        // 辅助：立方体边框参考
        const boxSize = SPAN;
        const boxGeom = new THREE.BoxGeometry(boxSize * 2, boxSize * 2, boxSize * 2);
        const boxEdges = new THREE.EdgesGeometry(boxGeom);
        rootGroup.add(new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.15, depthWrite: true, depthTest: true
        })));

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        console.log('正交圆柱编织线条总数:', rootGroup.children.length);

        // 稳定动画循环
        function animate() {
            const t = getElapsed();
            // 三个圆柱族各自绕其主轴旋转
            goldGroup.rotation.x = t * 0.32;
            cyanGroup.rotation.y = t * 0.38;
            magentaGroup.rotation.z = t * 0.28;
            rootGroup.rotation.x = t * 0.10;
            rootGroup.rotation.y = t * 0.14;
            rootGroup.rotation.z = t * 0.06;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.8;
            const camAngle = t * 0.08;
            const camHeight = 2.9 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 正交圆柱调和螺旋编织动画已稳定运行');
    </script>
</body>
</html>
