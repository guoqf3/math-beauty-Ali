<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC流编织 · Beltrami混沌对流 · 空间拓扑流线</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d8a648;
            --cyan: #3bbfa6;
            --rose: #da3f50;
            --text: #cfbe8e;
            --text-dim: #8a7b5a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.6vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.2vw, 1.6rem);
            font-weight: 400;
            letter-spacing: 0.18em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(216, 166, 72, 0.45), 0 0 78px rgba(216, 166, 72, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.96vw, 0.68rem);
            letter-spacing: 0.24em;
            color: #a08e6c;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.2vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.66);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.18);
            border-radius: 16px;
            padding: 1vh 2.4vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.62rem, 1.3vw, 0.92rem);
            color: #ceb988;
            letter-spacing: 0.07em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.42rem, 0.8vw, 0.58rem);
            color: #8a7b5b;
            letter-spacing: 0.1em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d8a648;
        }
        .accent-cyan {
            color: #3bbfa6;
        }
        .accent-rose {
            color: #da3f50;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.5s ease-out 0.3s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>ABC流编织 · Beltrami混沌对流 · 空间拓扑流线</h1>
        <div class="subtitle">Arnol'd-Beltrami-Childress流 &nbsp;·&nbsp; 不可压缩向量场 &nbsp;·&nbsp; 规则-混沌交织</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">ẋ = A sin z + C cos y</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">ẏ = B sin x + A cos z</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">ż = C sin y + B cos x</span>
        </div>
        <div class="formula-detail">
            A, B, C 周期性扰动 &nbsp;·&nbsp; 流线在球体内编织 &nbsp;·&nbsp; 三维 Beltrami 特征向量的拓扑结构
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 30);
        camera.position.set(2.5, 1.5, 7.6);
        camera.lookAt(0, 0, 0);

        // 颜色定义
        const colorGold = new THREE.Color('#d8a648');
        const colorCyan = new THREE.Color('#3bbfa6');
        const colorRose = new THREE.Color('#da3f50');

        // ==================== 背景星点 ====================
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 220;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const rad = 5.5 + Math.random() * 9;
            starPos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
            starPos[i * 3 + 2] = rad * Math.cos(phi);
            starSizes[i] = Math.random() * 1.9 + 0.25;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.02,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        // 极淡参考球壳
        const refSphereGeom = new THREE.SphereGeometry(2.8, 54, 38);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x18130d, transparent: true, opacity: 0.08, depthWrite: false })
        );
        scene.add(refSphereWire);

        // 极淡参考环面
        const refTorusGeom = new THREE.TorusGeometry(2.1, 0.62, 12, 32);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x101618, transparent: true, opacity: 0.07, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ==================== ABC流场积分 (RK4) ====================
        function abcFlow(state, A, B, C) {
            const x = state[0];
            const y = state[1];
            const z = state[2];
            return [
                A * Math.sin(z) + C * Math.cos(y),
                B * Math.sin(x) + A * Math.cos(z),
                C * Math.sin(y) + B * Math.cos(x),
            ];
        }

        function rk4Step(state, h, A, B, C) {
            const k1 = abcFlow(state, A, B, C);
            const s2 = [state[0] + 0.5 * h * k1[0], state[1] + 0.5 * h * k1[1], state[2] + 0.5 * h * k1[2]];
            const k2 = abcFlow(s2, A, B, C);
            const s3 = [state[0] + 0.5 * h * k2[0], state[1] + 0.5 * h * k2[1], state[2] + 0.5 * h * k2[2]];
            const k3 = abcFlow(s3, A, B, C);
            const s4 = [state[0] + h * k3[0], state[1] + h * k3[1], state[2] + h * k3[2]];
            const k4 = abcFlow(s4, A, B, C);
            return [
                state[0] + (h / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
                state[1] + (h / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]),
                state[2] + (h / 6) * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]),
            ];
        }

        // ==================== 曲线系统 ====================
        const allCurves = [];
        const POINTS_PER_CURVE = 200; // 每条流线的点数
        const CLAMP_RADIUS = 2.85;
        const H_STEP = 0.04; // 积分步长

        function createCurve(color, updateFn) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.4;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.4;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.84,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, material);
            scene.add(line);
            const obj = { line, geometry: geom, positions, updateFn };
            allCurves.push(obj);
            return obj;
        }

        // 生成种子点：在球体内均匀分布，或表面附近
        function seedPoint(k, total) {
            // 使用球体表面均匀分布 + 小随机扰动进入内部
            const phi = Math.acos(2 * (k / total) - 1);
            const theta = (k * 2.39996) % (Math.PI * 2); // 黄金角
            const r = 1.8 + Math.random() * 0.8; // 内部
            return [
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi),
            ];
        }

        // 生成ABC流线族 (金色组, 青色组, 玫红组)
        const totalStreamlines = 48; // 每组16条
        const colors = [colorGold, colorCyan, colorRose];

        for (let g = 0; g < 3; g++) {
            const col = colors[g];
            for (let k = 0; k < 16; k++) {
                const seed = seedPoint(k + g * 16, totalStreamlines);
                const direction = (g === 0) ? 1 : (g === 1) ? -1 : 1; // 正反向积分混合
                // 每条曲线独立更新函数
                createCurve(col, (t, i, total, arr) => {
                    const idx = i * 3;
                    // 参数 A, B, C 随时间在典型值附近振荡
                    const A = 1.2 + 0.4 * Math.sin(t * 0.37 + g * 1.2);
                    const B = 1.0 + 0.5 * Math.cos(t * 0.43 + g * 0.8 + 1.5);
                    const C = 0.9 + 0.45 * Math.sin(t * 0.31 + g * 2.1 + 2.0);
                    // 积分步数：从中心点 i=100 向前后积分
                    const midIndex = Math.floor(total / 2);
                    let position;
                    if (i === midIndex) {
                        // 种子点
                        position = [seed[0], seed[1], seed[2]];
                    } else if (i < midIndex) {
                        // 反向积分
                        const stepsBack = (midIndex - i) * H_STEP;
                        let state = [seed[0], seed[1], seed[2]];
                        for (let s = 0; s < stepsBack / H_STEP; s++) {
                            state = rk4Step(state, -H_STEP, A, B, C);
                            // 钳制到球内
                            const r = Math.sqrt(state[0] ** 2 + state[1] ** 2 + state[2] ** 2);
                            if (r > CLAMP_RADIUS && r > 0) {
                                const sc = CLAMP_RADIUS / r;
                                state[0] *= sc;
                                state[1] *= sc;
                                state[2] *= sc;
                            }
                        }
                        position = state;
                    } else {
                        // 正向积分
                        const stepsFwd = (i - midIndex) * H_STEP;
                        let state = [seed[0], seed[1], seed[2]];
                        for (let s = 0; s < stepsFwd / H_STEP; s++) {
                            state = rk4Step(state, H_STEP, A, B, C);
                            const r = Math.sqrt(state[0] ** 2 + state[1] ** 2 + state[2] ** 2);
                            if (r > CLAMP_RADIUS && r > 0) {
                                const sc = CLAMP_RADIUS / r;
                                state[0] *= sc;
                                state[1] *= sc;
                                state[2] *= sc;
                            }
                        }
                        position = state;
                    }
                    arr[idx] = position[0];
                    arr[idx + 1] = position[1];
                    arr[idx + 2] = position[2];
                });
            }
        }

        // 额外添加8条环绕结的点缀 (混合色)
        for (let k = 0; k < 8; k++) {
            const col = [colorCyan, colorRose, colorGold, colorCyan][k % 4];
            const amp = 1.3 + k * 0.12;
            const freq = 1.9 + k * 0.25;
            createCurve(col, (t, i, total, arr) => {
                const idx = i * 3;
                const s = (i / total) * Math.PI * 2;
                const inner = s * freq + t * 0.5 + k * 1.3;
                const x0 = amp * (Math.sin(inner) + 0.5 * Math.sin(3 * inner)) * 0.85;
                const y0 = amp * (Math.cos(inner) - 0.4 * Math.cos(2 * inner)) * 0.85;
                const z0 = amp * 0.65 * Math.sin(2 * inner + t * 0.3);
                arr[idx] = x0;
                arr[idx + 1] = y0;
                arr[idx + 2] = z0;
            });
        }

        console.log(`✅ 曲线总数: ${allCurves.length} (ABC流线:48, 额外:8)`);

        // ==================== 流动粒子 ====================
        const particleCount = 22;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            const ci = i % allCurves.length;
            particleData.push({
                curveIndex: ci,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0022,
            });
            let col;
            if (i < 8) col = colorGold.clone();
            else if (i < 16) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 1] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.86,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        // ==================== 极度健壮的动画循环 ====================
        const clock = new THREE.Clock();
        let animationTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function safeUpdateCurves(t) {
            for (let c = 0; c < allCurves.length; c++) {
                try {
                    const curve = allCurves[c];
                    const { positions, updateFn } = curve;
                    for (let i = 0; i < POINTS_PER_CURVE; i++) {
                        updateFn(t, i, POINTS_PER_CURVE, positions);
                    }
                    curve.geometry.attributes.position.needsUpdate = true;
                } catch (e) {
                    console.warn(`曲线${c}更新异常, 已跳过`, e);
                }
            }
        }

        function safeUpdateParticles() {
            try {
                for (let p = 0; p < particleCount; p++) {
                    const pd = particleData[p];
                    pd.progress += pd.speed;
                    if (pd.progress >= 1.0) pd.progress -= 1.0;
                    if (pd.progress < 0) pd.progress += 1.0;
                    const curveObj = allCurves[pd.curveIndex];
                    if (!curveObj || !curveObj.positions) continue;
                    const posArr = curveObj.positions;
                    const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                    const idx0 = Math.floor(floatIdx);
                    const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                    const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                    const i0 = idx0 * 3,
                        i1 = idx1 * 3;
                    particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                    particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                    particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
                }
                particlesGeom.attributes.position.needsUpdate = true;
            } catch (e) {
                console.warn('粒子更新异常, 已跳过', e);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animationTime += dt;
                frameCount++;

                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const elapsed = (now - lastLogTime) / 1000;
                    const fps = Math.round(frameCount / elapsed);
                    console.log(
                        `🔄 运行中 | FPS: ${fps} | 时间: ${animationTime.toFixed(1)}s | dt: ${(dt * 1000).toFixed(1)}ms`
                    );
                    frameCount = 0;
                    lastLogTime = now;
                }

                safeUpdateCurves(animationTime);
                safeUpdateParticles();

                const breathe = 1 + 0.05 * Math.sin(animationTime * 0.41) * Math.cos(animationTime * 0.3);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.06;
                refSphereWire.rotation.y += dt * 0.05;

                refTorusWire.rotation.z += dt * 0.062;
                const torBreathe = 1 + 0.06 * Math.sin(animationTime * 0.44) * Math.cos(animationTime * 0.33);
                refTorusWire.scale.setScalar(torBreathe);

                const camH = animationTime * 0.1;
                const camV = 0.33 + 0.18 * Math.sin(animationTime * 0.15);
                const camD = 7.3 + 0.65 * Math.sin(animationTime * 0.2) * Math.cos(animationTime * 0.26);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.06 * Math.sin(animationTime * 0.1), 0.03 * Math.cos(animationTime * 0.13), 0);

                stars.rotation.y += dt * 0.014;
                stars.rotation.x += dt * 0.01;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画主循环异常, 循环仍继续:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                clock.getDelta();
            }
        });

        // 启动
        console.log('🚀 ABC流编织动画初始化... 预渲染第一帧');
        safeUpdateCurves(0);
        safeUpdateParticles();
        renderer.render(scene, camera);
        clock.start();
        animationTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动，56条流线在空间混沌与规则间编织永动');
    </script>
</body>
</html>
