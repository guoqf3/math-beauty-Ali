<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>莫比乌斯环流光</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03060d}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:#dfe9ff;-webkit-font-smoothing:antialiased;
  }
  #glcanvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}

  .panel{
    position:absolute;
    background:rgba(9,17,32,.58);
    backdrop-filter:blur(18px) saturate(1.35);
    -webkit-backdrop-filter:blur(18px) saturate(1.35);
    border:1px solid rgba(95,200,255,.16);
    border-radius:16px;
    padding:15px 17px;
    pointer-events:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---- 标题 ---- */
  #info{top:20px;left:20px}
  #info h1{
    font-size:16px;letter-spacing:4px;font-weight:600;
    background:linear-gradient(92deg,#4fd4ff 0%,#7aa8ff 45%,#c07aff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 28px rgba(80,180,255,.30);
  }
  #info .formula{
    margin-top:9px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;color:#8fd8ff;letter-spacing:.8px;line-height:1.7;
  }
  #info .formula em{color:#c9a3ff;font-style:normal}
  #info .hint{
    margin-top:10px;font-size:10.5px;color:#5f7691;letter-spacing:.6px;
  }

  /* ---- 控制面板 ---- */
  #controls{left:20px;bottom:20px;width:256px}
  .ctrl{margin-bottom:15px}
  .ctrl:last-child{margin-bottom:0}
  .ctrl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:#a9c2dd;margin-bottom:8px;letter-spacing:.8px;
  }
  .ctrl label span{
    color:#5fd8ff;font-family:ui-monospace,monospace;font-size:12px;
    text-shadow:0 0 12px rgba(95,216,255,.65);
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:3px;border-radius:3px;
    background:linear-gradient(90deg,#2f7fff,#5fd8ff,#b070ff);
    outline:none;cursor:pointer;display:block;
    box-shadow:0 0 12px rgba(70,170,255,.35);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#ffffff,#5fd8ff 58%,#2a6fd0);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 14px rgba(95,216,255,.95);
    cursor:pointer;transition:transform .15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22)}
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.7);
    background:radial-gradient(circle at 34% 28%,#ffffff,#5fd8ff 58%,#2a6fd0);
    box-shadow:0 0 14px rgba(95,216,255,.95);cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    height:3px;border-radius:3px;
    background:linear-gradient(90deg,#2f7fff,#5fd8ff,#b070ff);
  }

  /* ---- 读数 ---- */
  #readout{top:20px;right:20px;width:214px}
  #readout .ttl{
    font-size:10.5px;color:#5f7691;letter-spacing:2px;margin-bottom:10px;
    text-transform:uppercase;
  }
  .ro-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;padding:5px 0;
    border-bottom:1px dashed rgba(95,180,255,.13);
  }
  .ro-row:last-child{border-bottom:none}
  .ro-row>span{color:#8ba3bd;letter-spacing:.6px}
  .ro-row>b{
    font-family:ui-monospace,monospace;font-weight:500;
    color:#9fdcff;font-size:12px;
  }
  .ro-row.hi>b{color:#c9a3ff;text-shadow:0 0 12px rgba(180,120,255,.7)}

  @media(max-width:720px){
    #info h1{font-size:14px;letter-spacing:2px}
    #info .hint{display:none}
    #controls{width:194px;padding:12px 14px}
    #readout{width:162px;padding:12px 13px}
    .ro-row{font-size:10.5px}
    .ro-row>b{font-size:11px}
  }
</style>
</head>
<body>

<canvas id="glcanvas"></canvas>

<div id="ui">
  <div class="panel" id="info">
    <h1>莫比乌斯环流光</h1>
    <div class="formula">
      x = (R + v·cos(k·u/2))·cos u<br>
      y = v·sin(k·u/2)<br>
      z = (R + v·cos(k·u/2))·sin u
    </div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键/Shift 平移 · 点击环面</div>
  </div>

  <div class="panel" id="controls">
    <div class="ctrl">
      <label>环半径 R<span id="valR">1.50</span></label>
      <input type="range" id="sliderR" min="1.00" max="2.40" step="0.01" value="1.50">
    </div>
    <div class="ctrl">
      <label>带宽 v<span id="valW">0.42</span></label>
      <input type="range" id="sliderW" min="0.05" max="0.85" step="0.01" value="0.42">
    </div>
    <div class="ctrl">
      <label>扭转圈数 k<span id="valK">1</span></label>
      <input type="range" id="sliderK" min="1" max="8" step="1" value="1">
    </div>
  </div>

  <div class="panel" id="readout">
    <div class="ttl">曲面状态</div>
    <div class="ro-row"><span>环半径 R</span><b id="roR">1.50</b></div>
    <div class="ro-row"><span>带宽 v</span><b id="roW">0.42</b></div>
    <div class="ro-row"><span>半扭转 k</span><b id="roK">1</b></div>
    <div class="ro-row hi"><span>曲面性质</span><b id="roType">单侧·不可定向</b></div>
  </div>
</div>

<script>
(function () {
'use strict';

/* =========================================================
   0. WebGL 初始化
   ========================================================= */
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl', {
  antialias: true, alpha: false, depth: true,
  powerPreference: 'high-performance', preserveDrawingBuffer: false
}) || canvas.getContext('experimental-webgl');

if (!gl) {
  document.body.innerHTML = '<div style="padding:40px;color:#8fd8ff;font-size:14px">' +
    '当前环境不支持 WebGL，请更换浏览器或开启硬件加速。</div>';
  return;
}

/* =========================================================
   1. 着色器
   ========================================================= */
const VS_SRC = `
precision highp float;

attribute vec2 aParam;          // x = u ∈ [0, 2π], y = v ∈ [-1, 1]

uniform mat4  uProj;
uniform mat4  uView;
uniform float uR;               // 环半径
uniform float uHalfW;           // 半带宽
uniform float uK;               // 半扭转次数

varying vec3  vWorld;
varying vec3  vNormal;
varying vec2  vUV;

const float INV_TWO_PI = 0.15915494309;

void main() {
  float u  = aParam.x;
  float vv = aParam.y * uHalfW;

  float halfK = uK * 0.5;
  float a  = halfK * u;
  float ca = cos(a);
  float sa = sin(a);

  float rad = uR + vv * ca;

  vec3 pos = vec3(rad * cos(u), vv * sa, rad * sin(u));

  /* ---- 解析切向量 ---- */
  float drad = -vv * sa * halfK;

  vec3 dPdu = vec3(
    drad * cos(u) - rad * sin(u),
    vv * ca * halfK,
    drad * sin(u) + rad * cos(u)
  );

  vec3 dPdv = vec3(ca * cos(u), sa, ca * sin(u));

  vec3 n = normalize(cross(dPdu, dPdv));

  vWorld  = pos;
  vNormal = n;
  vUV     = vec2(u * INV_TWO_PI, aParam.y * 0.5 + 0.5);

  gl_Position = uProj * uView * vec4(pos, 1.0);
}
`;

/* ---------------------------------------------------------
   片元着色器 —— 亮度再翻一倍 + 网格亮线 + 高光压缩
   --------------------------------------------------------- */
const FS_SRC = `
precision highp float;

uniform float uTime;
uniform vec3  uCamPos;
uniform float uPickMode;

varying vec3 vWorld;
varying vec3 vNormal;
varying vec2 vUV;

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

void main() {
  /* ---- 拾取通道 ---- */
  if (uPickMode > 0.5) {
    gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);
    return;
  }

  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCamPos - vWorld);
  if (dot(N, V) < 0.0) N = -N;

  float ndv  = clamp(dot(N, V), 0.0, 1.0);
  float fres = pow(1.0 - ndv, 1.85);

  /* ---- 虹彩基色（明度拉满） ---- */
  float hue = fract(0.55 + vUV.x * 0.95 + vUV.y * 0.22 + fres * 0.26 + uTime * 0.030);
  vec3 base = hsv2rgb(vec3(hue, 0.72, 1.0));

  /* ---- 三向布光（环境光拉满，整环均匀发亮） ---- */
  vec3 L1 = normalize(vec3( 0.55,  1.00,  0.45));
  vec3 L2 = normalize(vec3(-0.75,  0.25, -0.60));
  vec3 L3 = normalize(vec3( 0.10, -0.85,  0.85));

  float d1 = max(dot(N, L1), 0.0);
  float d2 = max(dot(N, L2), 0.0);
  float d3 = max(dot(N, L3), 0.0);

  /* 环境项提升到 1.05，叠加增强的漫反射，整体亮度较前一版再翻一倍 */
  vec3 col = base * (1.05 + 1.10 * d1);
  col += base * vec3(0.62, 0.56, 1.00) * d2 * 1.05;
  col += base * vec3(1.00, 0.78, 0.50) * d3 * 0.85;

  /* ---- 高光 ---- */
  vec3 H = normalize(L1 + V);
  float spec = pow(max(dot(N, H), 0.0), 74.0);
  col += vec3(1.0) * spec * 1.80;

  /* ---- 边缘辉光（大幅加强） ---- */
  col += vec3(0.60, 0.90, 1.00) * fres * 2.10;

  /* ---- 网格亮线：让环带结构一目了然 ---- */
  vec2 g = abs(fract(vUV * vec2(64.0, 16.0)) - 0.5);
  float line = 1.0 - smoothstep(0.0, 0.055, min(g.x, g.y));
  col += vec3(0.95, 1.00, 1.00) * line * 1.15;

  /* 经线额外描边，强化“线条感” */
  float meridian = 1.0 - smoothstep(0.0, 0.032, g.x);
  col += vec3(1.00, 0.94, 1.00) * meridian * 0.55;

  /* ---- 沿环流动的流光 ---- */
  float flow = sin(vUV.x * 43.9822972 - uTime * 1.90 + vUV.y * 6.2831853);
  col += base * smoothstep(0.70, 1.0, flow) * 1.35;

  float flow2 = sin(vUV.x * -25.1327412 + uTime * 1.25 + vUV.y * 6.2831853);
  col += vec3(0.98, 0.72, 1.00) * smoothstep(0.80, 1.0, flow2) * 0.62;

  /* ---- 软压缩：防止高光死白，同时整体亮度再翻一倍 ---- */
  col = 1.0 - exp(-col * 1.10);

  gl_FragColor = vec4(col, 1.0);
}
`;

/* ---- 编译工具 ---- */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s), src);
    throw new Error('shader compile error');
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS_SRC));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS_SRC));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(prog));
  throw new Error('program link error');
}
gl.useProgram(prog);

const LOC = {
  aParam:   gl.getAttribLocation(prog,  'aParam'),
  uProj:    gl.getUniformLocation(prog, 'uProj'),
  uView:    gl.getUniformLocation(prog, 'uView'),
  uR:       gl.getUniformLocation(prog, 'uR'),
  uHalfW:   gl.getUniformLocation(prog, 'uHalfW'),
  uK:       gl.getUniformLocation(prog, 'uK'),
  uTime:    gl.getUniformLocation(prog, 'uTime'),
  uCamPos:  gl.getUniformLocation(prog, 'uCamPos'),
  uPickMode:gl.getUniformLocation(prog, 'uPickMode'),
};

/* =========================================================
   2. 几何：参数网格（逐顶点在 GPU 上计算扭转）
   ========================================================= */
const U_SEG = 420;            // 沿 u 方向分段
const V_SEG = 34;             // 沿 v 方向分段（三角带条数）
const VPR   = U_SEG + 1;      // 每条带顶点数
const ROWS  = V_SEG + 1;
const TOTAL = VPR * ROWS;

const paramData = new Float32Array(TOTAL * 2);
{
  let p = 0;
  for (let j = 0; j < ROWS; j++) {
    const v = -1 + 2 * j / V_SEG;
    for (let i = 0; i < VPR; i++) {
      paramData[p++] = (i / U_SEG) * Math.PI * 2;   // u
      paramData[p++] = v;                            // v
    }
  }
}

const paramBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, paramBuf);
gl.bufferData(gl.ARRAY_BUFFER, paramData, gl.STATIC_DRAW);

gl.enableVertexAttribArray(LOC.aParam);
gl.vertexAttribPointer(LOC.aParam, 2, gl.FLOAT, false, 0, 0);

/* ---- 绘制（每条 v 带一个 TRIANGLE_STRIP） ---- */
function drawMesh() {
  for (let j = 0; j < V_SEG; j++) {
    gl.drawArrays(gl.TRIANGLE_STRIP, j * VPR, VPR);
  }
}

/* =========================================================
   3. 矩阵工具
   ========================================================= */
function mat4Perspective(out, fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy / 2);
  const nf = 1.0 / (near - far);
  out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
  out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
  out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
  out[12] = 0; out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
  return out;
}

function mat4LookAt(out, eye, center, up) {
  let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
  let l = Math.hypot(zx, zy, zz) || 1;
  zx /= l; zy /= l; zz /= l;

  let xx = up[1] * zz - up[2] * zy;
  let xy = up[2] * zx - up[0] * zz;
  let xz = up[0] * zy - up[1] * zx;
  l = Math.hypot(xx, xy, xz);
  if (l < 1e-6) { xx = 1; xy = 0; xz = 0; } else { xx /= l; xy /= l; xz /= l; }

  const yx = zy * xz - zz * xy;
  const yy = zz * xx - zx * xz;
  const yz = zx * xy - zy * xx;

  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
  out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
  out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
  out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
  out[15] = 1;
  return out;
}

/* =========================================================
   4. 相机（轨道 + 平移）
   ========================================================= */
const cam = {
  theta: 0.92,
  phi:   1.14,
  dist:  5.4,
  tx: 0, ty: 0, tz: 0
};
const camT = Object.assign({}, cam);

/* =========================================================
   5. 音频引擎
   ========================================================= */
let actx = null, masterGain = null;
let audioReady = false;

let spinGain = null, spinLP = null, spinHP = null;
let spinOscGain = null, spinOsc = null;

function makePinkNoise(ctx, seconds) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.22;
  }
  return buf;
}

function initAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { actx = new AC(); } catch (e) { return; }
  if (actx.state === 'suspended') actx.resume();

  masterGain = actx.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(actx.destination);

  /* ---- 低沉环形滑动音：粉噪声 + 低频嗡鸣 ---- */
  const src = actx.createBufferSource();
  src.buffer = makePinkNoise(actx, 3.0);
  src.loop = true;

  spinHP = actx.createBiquadFilter();
  spinHP.type = 'highpass';
  spinHP.frequency.value = 55;

  spinLP = actx.createBiquadFilter();
  spinLP.type = 'lowpass';
  spinLP.frequency.value = 260;
  spinLP.Q.value = 3.2;

  spinGain = actx.createGain();
  spinGain.gain.value = 0.0001;

  src.connect(spinHP).connect(spinLP).connect(spinGain).connect(masterGain);
  src.start();

  /* 低频嗡鸣 */
  spinOsc = actx.createOscillator();
  spinOsc.type = 'sine';
  spinOsc.frequency.value = 47;

  spinOscGain = actx.createGain();
  spinOscGain.gain.value = 0.0001;

  const oLp = actx.createBiquadFilter();
  oLp.type = 'lowpass';
  oLp.frequency.value = 140;

  spinOsc.connect(oLp).connect(spinOscGain).connect(masterGain);
  spinOsc.start();

  audioReady = true;
}

/* ---- 点击环面：魔法感短促回旋音 ---- */
const SPARKLE_SCALE = [0, 3, 5, 7, 10, 12, 15, 19];

function playSparkle() {
  if (!audioReady) return;
  const t0 = actx.currentTime;
  const root = 523.2511;

  for (let i = 0; i < 6; i++) {
    const t = t0 + i * 0.042;
    const semis = SPARKLE_SCALE[i % SPARKLE_SCALE.length];
    const f = root * Math.pow(2, semis / 12);

    const o = actx.createOscillator();
    o.type = (i % 2 === 0) ? 'sine' : 'triangle';
    o.frequency.setValueAtTime(f * 1.03, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.055);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.175, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);

    o.connect(g).connect(masterGain);
    o.start(t);
    o.stop(t + 0.62);
  }

  const o2 = actx.createOscillator();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(root * 4, t0 + 0.25);
  o2.frequency.exponentialRampToValueAtTime(root * 1.42, t0 + 0.78);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t0 + 0.25);
  g2.gain.exponentialRampToValueAtTime(0.095, t0 + 0.285);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.82);

  o2.connect(g2).connect(masterGain);
  o2.start(t0 + 0.25);
  o2.stop(t0 + 0.88);

  const o3 = actx.createOscillator();
  o3.type = 'square';
  o3.frequency.setValueAtTime(root * 6.02, t0);
  o3.frequency.exponentialRampToValueAtTime(root * 3.01, t0 + 0.12);

  const g3 = actx.createGain();
  g3.gain.setValueAtTime(0.0001, t0);
  g3.gain.exponentialRampToValueAtTime(0.032, t0 + 0.006);
  g3.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);

  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 3400;
  bp.Q.value = 2.4;

  o3.connect(bp).connect(g3).connect(masterGain);
  o3.start(t0);
  o3.stop(t0 + 0.2);
}

/* ---- 扭转圈数变化：递增 / 递减电子音阶 ---- */
function playTwistTone(k, ascending) {
  if (!audioReady) return;
  const t = actx.currentTime;

  const semi = (k - 1) * 2.5;
  const fBase = 174.6141 * Math.pow(2, semi / 12);

  const f0 = ascending ? fBase * 0.82 : fBase;
  const f1 = ascending ? fBase : fBase * 0.82;

  const o1 = actx.createOscillator();
  o1.type = 'sawtooth';
  o1.frequency.setValueAtTime(f0, t);
  o1.frequency.exponentialRampToValueAtTime(f1, t + 0.19);

  const o2 = actx.createOscillator();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(f0 * 2, t);
  o2.frequency.exponentialRampToValueAtTime(f1 * 2, t + 0.19);

  const o3 = actx.createOscillator();
  o3.type = 'triangle';
  const detune = 1 + 0.011 * (k - 1);
  o3.frequency.setValueAtTime(f0 * detune, t);
  o3.frequency.exponentialRampToValueAtTime(f1 * detune, t + 0.19);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(380 + k * 420, t);
  lp.frequency.exponentialRampToValueAtTime(260 + k * 330, t + 0.3);
  lp.Q.value = 5.0 + k * 1.15;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.15, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);

  const gs = actx.createGain();
  gs.gain.setValueAtTime(0.0001, t);
  gs.gain.exponentialRampToValueAtTime(0.075, t + 0.014);
  gs.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);

  o1.connect(lp);
  o2.connect(gs).connect(lp);
  o3.connect(lp);
  lp.connect(g).connect(masterGain);

  o1.start(t); o2.start(t); o3.start(t);
  o1.stop(t + 0.5); o2.stop(t + 0.36); o3.stop(t + 0.5);
}

/* ---- 旋转沙沙声调制 ---- */
const _prev = { theta: null, phi: null };

function updateSpinSound(dt) {
  if (!audioReady) return;

  if (_prev.theta !== null) {
    let dT = cam.theta - _prev.theta;
    if (dT > Math.PI) dT -= Math.PI * 2;
    if (dT < -Math.PI) dT += Math.PI * 2;
    const dP = cam.phi - _prev.phi;

    const safe = Math.max(dt, 0.001);
    const speed = (Math.abs(dT) + Math.abs(dP)) / safe;
    const n = Math.min(speed / 4.5, 1);

    const now = actx.currentTime;
    const target = n * n * 0.16;

    spinGain.gain.setTargetAtTime(target, now, 0.06);
    spinLP.frequency.setTargetAtTime(180 + n * 900, now, 0.09);
    spinHP.frequency.setTargetAtTime(45 + n * 260, now, 0.09);

    spinOscGain.gain.setTargetAtTime(n * 0.055, now, 0.08);
    spinOsc.frequency.setTargetAtTime(43 + n * 26, now, 0.12);
  }

  _prev.theta = cam.theta;
  _prev.phi = cam.phi;
}

/* =========================================================
   6. 拾取帧缓冲
   ========================================================= */
let pickFBO = null, pickTex = null, pickRBO = null;
let pickW = 0, pickH = 0;

function ensurePickTarget(w, h) {
  if (pickFBO && pickW === w && pickH === h) return;

  if (pickFBO) {
    gl.deleteFramebuffer(pickFBO);
    gl.deleteTexture(pickTex);
    gl.deleteRenderbuffer(pickRBO);
  }

  pickTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, pickTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  pickRBO = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, pickRBO);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);

  pickFBO = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, pickFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pickTex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, pickRBO);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  pickW = w; pickH = h;
}

/* =========================================================
   7. 全局状态
   ========================================================= */
const state = { R: 1.50, W: 0.42, K: 1 };

const projMat = new Float32Array(16);
const viewMat = new Float32Array(16);
const eyePos  = new Float32Array(3);

/* =========================================================
   8. 尺寸
   ========================================================= */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    pickW = 0;
  }
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   9. 交互
   ========================================================= */
let dragging = false;
let dragBtn = -1;
let lastX = 0, lastY = 0;
let dragDist = 0;

canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  canvas.setPointerCapture(e.pointerId);
  dragging = true;
  dragBtn = e.button;
  lastX = e.clientX;
  lastY = e.clientY;
  dragDist = 0;
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  dragDist += Math.abs(dx) + Math.abs(dy);

  if (dragBtn === 2 || e.shiftKey) {
    const s = cam.dist * 0.0017;
    const rightX = Math.sin(cam.theta);
    const rightZ = -Math.cos(cam.theta);
    const upX = -Math.cos(cam.theta) * Math.cos(cam.phi);
    const upY = Math.sin(cam.phi);
    const upZ = -Math.sin(cam.theta) * Math.cos(cam.phi);

    camT.tx -= rightX * dx * s;
    camT.tz -= rightZ * dx * s;

    camT.tx += upX * dy * s;
    camT.ty += upY * dy * s;
    camT.tz += upZ * dy * s;
  } else {
    camT.theta -= dx * 0.0075;
    camT.phi   -= dy * 0.0075;
    camT.phi = Math.max(0.10, Math.min(Math.PI - 0.10, camT.phi));
  }
});

function endDrag(e) {
  if (!dragging) return;
  canvas.style.cursor = 'grab';

  if (dragDist < 8) {
    doPick(e);
  }
  dragging = false;
  dragBtn = -1;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', () => { dragging = false; canvas.style.cursor = 'grab'; });

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  initAudio();
  camT.dist *= Math.exp(e.deltaY * 0.0012);
  camT.dist = Math.max(1.7, Math.min(18, camT.dist));
}, { passive: false });

/* ---- 点击拾取 ---- */
function doPick(e) {
  const rect = canvas.getBoundingClientRect();
  const px = Math.floor((e.clientX - rect.left) / rect.width * canvas.width);
  const py = Math.floor((1.0 - (e.clientY - rect.top) / rect.height) * canvas.height);

  if (px < 0 || py < 0 || px >= canvas.width || py >= canvas.height) return;

  ensurePickTarget(canvas.width, canvas.height);

  gl.bindFramebuffer(gl.FRAMEBUFFER, pickFBO);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.uniform1f(LOC.uPickMode, 1.0);
  drawMesh();
  gl.uniform1f(LOC.uPickMode, 0.0);

  const px1 = new Uint8Array(4);
  gl.readPixels(px, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px1);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);

  if (px1[0] > 128) {
    playSparkle();
  }
}

/* =========================================================
   10. UI 绑定
   ========================================================= */
const slR = document.getElementById('sliderR');
const slW = document.getElementById('sliderW');
const slK = document.getElementById('sliderK');
const vlR = document.getElementById('valR');
const vlW = document.getElementById('valW');
const vlK = document.getElementById('valK');
const roR = document.getElementById('roR');
const roW = document.getElementById('roW');
const roK = document.getElementById('roK');
const roType = document.getElementById('roType');

let lastK = state.K;

function updateTypeLabel() {
  roType.textContent = (state.K % 2 === 1) ? '单侧·不可定向' : '双侧·可定向';
}

slR.addEventListener('input', () => {
  initAudio();
  state.R = parseFloat(slR.value);
  vlR.textContent = state.R.toFixed(2);
  roR.textContent = state.R.toFixed(2);
});

slW.addEventListener('input', () => {
  initAudio();
  state.W = parseFloat(slW.value);
  vlW.textContent = state.W.toFixed(2);
  roW.textContent = state.W.toFixed(2);
});

slK.addEventListener('input', () => {
  initAudio();
  const nk = parseInt(slK.value, 10);
  const asc = nk > lastK;
  if (nk !== lastK) {
    playTwistTone(nk, asc);
    lastK = nk;
  }
  state.K = nk;
  vlK.textContent = String(nk);
  roK.textContent = String(nk);
  updateTypeLabel();
});

updateTypeLabel();

/* =========================================================
   11. 主循环
   ========================================================= */
let lastT = performance.now();
let timeAcc = 0;

function frame(now) {
  requestAnimationFrame(frame);

  const dt = Math.min((now - lastT) / 1000, 0.08);
  lastT = now;
  timeAcc += dt;

  /* ---- 相机缓动 ---- */
  const ease = 1 - Math.pow(0.001, dt);
  cam.theta += (camT.theta - cam.theta) * ease;
  cam.phi   += (camT.phi   - cam.phi)   * ease;
  cam.dist  += (camT.dist  - cam.dist)  * Math.min(1, dt * 8);
  cam.tx    += (camT.tx    - cam.tx)    * ease;
  cam.ty    += (camT.ty    - cam.ty)    * ease;
  cam.tz    += (camT.tz    - cam.tz)    * ease;

  /* ---- 视口 ---- */
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.011, 0.023, 0.050, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  /* ---- 矩阵 ---- */
  const aspect = canvas.width / canvas.height;
  mat4Perspective(projMat, Math.PI / 4.1, aspect, 0.05, 120);

  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  eyePos[0] = cam.tx + cam.dist * sp * Math.cos(cam.theta);
  eyePos[1] = cam.ty + cam.dist * cp;
  eyePos[2] = cam.tz + cam.dist * sp * Math.sin(cam.theta);

  mat4LookAt(viewMat, eyePos, [cam.tx, cam.ty, cam.tz], [0, 1, 0]);

  /* ---- uniform ---- */
  gl.useProgram(prog);
  gl.uniformMatrix4fv(LOC.uProj, false, projMat);
  gl.uniformMatrix4fv(LOC.uView, false, viewMat);
  gl.uniform1f(LOC.uR, state.R);
  gl.uniform1f(LOC.uHalfW, state.W);
  gl.uniform1f(LOC.uK, state.K);
  gl.uniform1f(LOC.uTime, timeAcc);
  gl.uniform3fv(LOC.uCamPos, eyePos);
  gl.uniform1f(LOC.uPickMode, 0.0);

  /* ---- 绘制 ---- */
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.BLEND);

  gl.bindBuffer(gl.ARRAY_BUFFER, paramBuf);
  gl.enableVertexAttribArray(LOC.aParam);
  gl.vertexAttribPointer(LOC.aParam, 2, gl.FLOAT, false, 0, 0);

  drawMesh();

  /* ---- 声音 ---- */
  updateSpinSound(dt);
}

requestAnimationFrame(frame);

/* =========================================================
   12. 首次手势解锁音频
   ========================================================= */
['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
  window.addEventListener(ev, function () {
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
  }, { once: true });
});

canvas.style.cursor = 'grab';

})();
</script>
