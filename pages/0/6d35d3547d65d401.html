<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>双曲抛物面 · 马鞍面</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#07050c}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:#f0e8ff;-webkit-font-smoothing:antialiased;
  }
  #c{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}

  .panel{
    position:absolute;
    background:rgba(16,10,28,.62);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(180,120,255,.18);
    border-radius:16px;
    padding:15px 17px;
    pointer-events:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---- 标题 ---- */
  #info{top:20px;left:20px}
  #info h1{
    font-size:16px;letter-spacing:4px;font-weight:600;
    background:linear-gradient(92deg,#b98aff 0%,#6ec8ff 50%,#ffd166 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(150,100,255,.35);
  }
  #info .formula{
    margin-top:9px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;color:#c8a8ff;letter-spacing:.8px;
  }
  #info .formula em{color:#ffd166;font-style:normal}
  #info .hint{
    margin-top:10px;font-size:10.5px;color:#6b5a88;letter-spacing:.6px;
  }

  /* ---- 控制面板 ---- */
  #controls{left:20px;bottom:20px;width:262px}
  .ctrl{margin-bottom:17px}
  .ctrl:last-child{margin-bottom:0}
  .ctrl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:#c0aedc;margin-bottom:9px;letter-spacing:.8px;
  }
  .ctrl label span{
    color:#b98aff;font-family:ui-monospace,monospace;font-size:12px;
    text-shadow:0 0 12px rgba(185,138,255,.7);
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#b98aff,#6ec8ff,#ffd166);
    outline:none;cursor:pointer;
    box-shadow:0 0 12px rgba(150,100,255,.4);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#b98aff 58%,#6a3cc0);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(185,138,255,1);
    cursor:pointer;transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22)}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#b98aff 58%,#6a3cc0);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(185,138,255,1);
    cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    height:4px;border-radius:3px;
    background:linear-gradient(90deg,#b98aff,#6ec8ff,#ffd166);
  }

  /* ---- 模式按钮 ---- */
  .modes{display:flex;gap:6px;margin-top:4px}
  .modes button{
    flex:1;
    background:rgba(60,36,100,.55);
    border:1px solid rgba(180,120,255,.28);
    border-radius:9px;
    color:#c8b0e8;
    font-size:11px;
    padding:7px 4px;
    cursor:pointer;
    letter-spacing:.5px;
    font-family:inherit;
    transition:all .18s;
  }
  .modes button:hover{
    background:rgba(90,56,150,.7);
    border-color:rgba(200,150,255,.55);
    color:#f0e0ff;
  }
  .modes button.on{
    background:linear-gradient(135deg,rgba(150,80,255,.9),rgba(90,180,255,.9));
    border-color:rgba(255,255,255,.5);
    color:#fff;
    box-shadow:0 0 18px rgba(150,100,255,.7);
  }

  /* ---- 读数 ---- */
  #readout{top:20px;right:20px;width:216px}
  #readout .ttl{
    font-size:10.5px;color:#6b5a88;letter-spacing:2px;
    margin-bottom:10px;text-transform:uppercase;
  }
  .ro-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;padding:5px 0;
    border-bottom:1px dashed rgba(180,120,255,.14);
  }
  .ro-row:last-child{border-bottom:none}
  .ro-row>span{color:#9686b0;letter-spacing:.6px}
  .ro-row>b{
    font-family:ui-monospace,monospace;font-weight:500;
    color:#d4bcff;font-size:12px;
  }
  .ro-row.hi>b{color:#ffd166;text-shadow:0 0 12px rgba(255,200,100,.75)}

  @media(max-width:720px){
    #info h1{font-size:14px;letter-spacing:2px}
    #info .hint{display:none}
    #controls{width:208px;padding:12px 14px}
    #readout{width:168px;padding:12px 13px}
    .ro-row{font-size:10.5px}
    .ro-row>b{font-size:11px}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div class="panel" id="info">
    <h1>双曲抛物面 · 马鞍面</h1>
    <div class="formula">z = x²/<em>a²</em> − y²/<em>b²</em></div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击鞍点</div>
  </div>

  <div class="panel" id="controls">
    <div class="ctrl">
      <label>x 向弯曲 a<span id="valA">1.20</span></label>
      <input type="range" id="sliderA" min="0.60" max="2.40" step="0.01" value="1.20">
    </div>
    <div class="ctrl">
      <label>y 向弯曲 b<span id="valB">1.20</span></label>
      <input type="range" id="sliderB" min="0.60" max="2.40" step="0.01" value="1.20">
    </div>
    <div class="ctrl">
      <label>网格密度 N<span id="valN">40</span></label>
      <input type="range" id="sliderN" min="8" max="72" step="1" value="40">
    </div>
    <div class="ctrl">
      <label>显示模式</label>
      <div class="modes">
        <button id="btnSolid" class="on">实体</button>
        <button id="btnWire">线框</button>
        <button id="btnBoth">叠加</button>
      </div>
    </div>
  </div>

  <div class="panel" id="readout">
    <div class="ttl">曲面读数</div>
    <div class="ro-row"><span>坐标 x</span><b id="roX">—</b></div>
    <div class="ro-row"><span>坐标 y</span><b id="roY">—</b></div>
    <div class="ro-row"><span>高度 z</span><b id="roZ">—</b></div>
    <div class="ro-row"><span>高斯曲率 K</span><b id="roK">—</b></div>
    <div class="ro-row hi"><span>曲面类型</span><b id="roType">负曲率·双曲</b></div>
  </div>
</div>

<script>
(function () {
'use strict';

/* =========================================================
   0. 常量
   ========================================================= */
const EXT = 1.6;

const state = {
  a: 1.20,
  b: 1.20,
  density: 40,
  mode: 1,
  hoverIdx: -1,
  hoverStrength: 0,
  hoverTarget: 0,
};

/* =========================================================
   1. 矩阵工具
   ========================================================= */
function mat4Perspective(out, fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy / 2);
  const nf = 1.0 / (near - far);
  out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
  out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
  out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
  out[12] = 0; out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
  return out;
}

function mat4LookAt(out, eye, center, up) {
  let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
  let l = Math.hypot(zx, zy, zz) || 1;
  zx /= l; zy /= l; zz /= l;

  let xx = up[1] * zz - up[2] * zy;
  let xy = up[2] * zx - up[0] * zz;
  let xz = up[0] * zy - up[1] * zx;
  l = Math.hypot(xx, xy, xz);
  if (l < 1e-6) { xx = 1; xy = 0; xz = 0; } else { xx /= l; xy /= l; xz /= l; }

  const yx = zy * xz - zz * xy;
  const yy = zz * xx - zx * xz;
  const yz = zx * xy - zy * xx;

  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
  out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
  out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
  out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
  out[15] = 1;
  return out;
}

function mat4Multiply(out, a, b) {
  for (let col = 0; col < 4; col++) {
    for (let row = 0; row < 4; row++) {
      let sum = 0;
      for (let k = 0; k < 4; k++) {
        sum += a[k * 4 + row] * b[col * 4 + k];
      }
      out[col * 4 + row] = sum;
    }
  }
  return out;
}

/* =========================================================
   2. WebGL 初始化
   ========================================================= */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', {
  antialias: true,
  alpha: false,
  depth: true,
  powerPreference: 'high-performance',
}) || canvas.getContext('experimental-webgl');

if (!gl) {
  document.body.innerHTML = '<div style="padding:40px;color:#c8a8ff;font-size:14px">' +
    '当前环境不支持 WebGL，请更换浏览器或开启硬件加速。</div>';
  return;
}

/* =========================================================
   3. 着色器
   ========================================================= */
const SOLID_VS = `
precision highp float;

attribute vec3 aPos;
attribute vec3 aNormal;

uniform mat4 uProjView;

varying vec3 vWorldPos;
varying vec3 vNormal;

void main() {
  vWorldPos = aPos;
  vNormal   = aNormal;
  gl_Position = uProjView * vec4(aPos, 1.0);
}
`;

const SOLID_FS = `
precision highp float;

uniform vec3  uCamPos;
uniform float uTime;
uniform vec3  uHoverPos;
uniform float uHoverStrength;

varying vec3 vWorldPos;
varying vec3 vNormal;

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCamPos - vWorldPos);

  if (dot(N, V) < 0.0) N = -N;

  float ndv  = clamp(dot(N, V), 0.0, 1.0);
  float fres = pow(1.0 - ndv, 2.15);

  float hue = fract(
    0.58 + vWorldPos.x * 0.13 + vWorldPos.z * 0.13 + uTime * 0.024
  );
  vec3 base = hsv2rgb(vec3(hue, 0.62, 1.0));

  vec3 L1 = normalize(vec3( 0.60,  1.00,  0.50));
  vec3 L2 = normalize(vec3(-0.72,  0.30, -0.62));
  vec3 L3 = normalize(vec3( 0.10, -0.90,  0.42));

  float d1 = max(dot(N, L1), 0.0);
  float d2 = max(dot(N, L2), 0.0);
  float d3 = max(dot(N, L3), 0.0);

  vec3 col = base * (0.34 + 0.78 * d1);
  col += base * vec3(0.48, 0.68, 1.00) * d2 * 0.56;
  col += base * vec3(1.00, 0.66, 0.86) * d3 * 0.44;

  vec3 H1 = normalize(L1 + V);
  float spec1 = pow(max(dot(N, H1), 0.0), 96.0);
  col += vec3(1.0) * spec1 * 1.05;

  vec3 H2 = normalize(L2 + V);
  float spec2 = pow(max(dot(N, H2), 0.0), 46.0);
  col += vec3(0.94, 0.80, 1.00) * spec2 * 0.42;

  col += vec3(0.52, 0.82, 1.00) * fres * 1.40;

  float hd = distance(vWorldPos, uHoverPos);
  float hover = smoothstep(0.55, 0.10, hd) * uHoverStrength;
  col += vec3(1.00, 0.90, 0.55) * hover * 0.85;
  col = mix(col, col * 1.30 + vec3(0.22, 0.14, 0.05), hover * 0.50);

  gl_FragColor = vec4(col, 1.0);
}
`;

const WIRE_VS = `
precision highp float;

attribute vec3 aPos;
attribute vec3 aNormal;

uniform mat4 uProjView;

varying vec3 vWorldPos;
varying vec3 vNormal;

void main() {
  vec3 p = aPos + aNormal * 0.006;

  vWorldPos = p;
  vNormal   = aNormal;
  gl_Position = uProjView * vec4(p, 1.0);
}
`;

const WIRE_FS = `
precision highp float;

uniform vec3  uCamPos;
uniform float uTime;

varying vec3 vWorldPos;
varying vec3 vNormal;

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCamPos - vWorldPos);
  float fres = pow(1.0 - abs(dot(N, V)), 1.6);

  float hue = fract(
    0.54 + vWorldPos.x * 0.20 + vWorldPos.z * 0.20 + uTime * 0.030
  );
  vec3 col = hsv2rgb(vec3(hue, 0.70, 1.0));

  col *= 0.72 + fres * 0.85;
  col += vec3(0.30, 0.45, 0.75) * fres * 0.55;

  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s), src);
    throw new Error('shader compile error');
  }
  return s;
}

function makeProgram(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    throw new Error('program link error');
  }
  return p;
}

const progSolid = makeProgram(SOLID_VS, SOLID_FS);
const progWire  = makeProgram(WIRE_VS, WIRE_FS);

const SL = {
  aPos:    gl.getAttribLocation(progSolid, 'aPos'),
  aNormal: gl.getAttribLocation(progSolid, 'aNormal'),
  uProjView: gl.getUniformLocation(progSolid, 'uProjView'),
  uCamPos:   gl.getUniformLocation(progSolid, 'uCamPos'),
  uTime:     gl.getUniformLocation(progSolid, 'uTime'),
  uHoverPos: gl.getUniformLocation(progSolid, 'uHoverPos'),
  uHoverStrength: gl.getUniformLocation(progSolid, 'uHoverStrength'),
};

const WL = {
  aPos:    gl.getAttribLocation(progWire, 'aPos'),
  aNormal: gl.getAttribLocation(progWire, 'aNormal'),
  uProjView: gl.getUniformLocation(progWire, 'uProjView'),
  uCamPos:   gl.getUniformLocation(progWire, 'uCamPos'),
  uTime:     gl.getUniformLocation(progWire, 'uTime'),
};

/* =========================================================
   4. 几何体
   ========================================================= */
let posBuf = null;
let nrmBuf = null;
let solidIdxBuf = null;
let wireIdxBuf = null;
let solidIndexCount = 0;
let wireIndexCount = 0;
let vertexCount = 0;
let vertexPositions = null;

function rebuild() {
  const N = state.density;
  const a = state.a;
  const b = state.b;

  const count = (N + 1) * (N + 1);
  vertexCount = count;

  const positions = new Float32Array(count * 3);
  const normals   = new Float32Array(count * 3);

  const a2 = a * a;
  const b2 = b * b;

  let p = 0;
  for (let j = 0; j <= N; j++) {
    const my = -EXT + 2 * EXT * j / N;
    for (let i = 0; i <= N; i++) {
      const mx = -EXT + 2 * EXT * i / N;
      const mz = (mx * mx) / a2 - (my * my) / b2;

      /* 数学 (mx, my, mz) → WebGL (mx, mz, my) */
      positions[p * 3]     = mx;
      positions[p * 3 + 1] = mz;
      positions[p * 3 + 2] = my;

      let nx = -2 * mx / a2;
      let ny = 1;
      let nz = 2 * my / b2;
      const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= nl; ny /= nl; nz /= nl;

      normals[p * 3]     = nx;
      normals[p * 3 + 1] = nz;
      normals[p * 3 + 2] = ny;

      p++;
    }
  }

  vertexPositions = positions;

  /* ---- 实体索引 ---- */
  const solidIdx = [];
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const i00 = j * (N + 1) + i;
      const i01 = j * (N + 1) + i + 1;
      const i10 = (j + 1) * (N + 1) + i;
      const i11 = (j + 1) * (N + 1) + i + 1;

      solidIdx.push(i00, i10, i01);
      solidIdx.push(i01, i10, i11);
    }
  }

  /* ---- 线框索引 ---- */
  const wireIdx = [];
  for (let j = 0; j <= N; j++) {
    for (let i = 0; i < N; i++) {
      wireIdx.push(j * (N + 1) + i, j * (N + 1) + i + 1);
    }
  }
  for (let i = 0; i <= N; i++) {
    for (let j = 0; j < N; j++) {
      wireIdx.push(j * (N + 1) + i, (j + 1) * (N + 1) + i);
    }
  }

  solidIndexCount = solidIdx.length;
  wireIndexCount  = wireIdx.length;

  /* ---- 上传 GPU ---- */
  if (!posBuf) posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

  if (!nrmBuf) nrmBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, nrmBuf);
  gl.bufferData(gl.ARRAY_BUFFER, normals, gl.STATIC_DRAW);

  const solidArr = new Uint16Array(solidIdx);
  const wireArr  = new Uint16Array(wireIdx);

  if (!solidIdxBuf) solidIdxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, solidIdxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, solidArr, gl.STATIC_DRAW);

  if (!wireIdxBuf) wireIdxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, wireIdxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, wireArr, gl.STATIC_DRAW);

  updateInfo();
}

/* =========================================================
   5. 读数
   ========================================================= */
const roX = document.getElementById('roX');
const roY = document.getElementById('roY');
const roZ = document.getElementById('roZ');
const roK = document.getElementById('roK');
const roType = document.getElementById('roType');

function updateInfo() {
  roK.textContent = (state.a * state.b).toFixed(3);
}

function clearReadout() {
  roX.textContent = '—';
  roY.textContent = '—';
  roZ.textContent = '—';
}

/* =========================================================
   6. 相机
   ========================================================= */
const cam  = { theta: 0.72, phi: 0.46, dist: 5.2, tx: 0, ty: 0, tz: 0 };
const camT = { theta: 0.72, phi: 0.46, dist: 5.2, tx: 0, ty: 0, tz: 0 };

/* =========================================================
   7. 音频引擎
   ========================================================= */
let actx = null;
let masterGain = null;
let audioReady = false;

let spinOsc = null, spinOsc2 = null, spinGain = null, spinFilter = null;
let spinLfo = null, spinLfoGain = null;

function initAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { actx = new AC(); } catch (e) { return; }
  if (actx.state === 'suspended') actx.resume();

  masterGain = actx.createGain();
  masterGain.gain.value = 0.50;
  masterGain.connect(actx.destination);

  spinFilter = actx.createBiquadFilter();
  spinFilter.type = 'bandpass';
  spinFilter.frequency.value = 520;
  spinFilter.Q.value = 3.6;

  spinOsc = actx.createOscillator();
  spinOsc.type = 'sine';
  spinOsc.frequency.value = 160;

  spinOsc2 = actx.createOscillator();
  spinOsc2.type = 'triangle';
  spinOsc2.frequency.value = 240;

  const g2 = actx.createGain();
  g2.gain.value = 0.42;

  spinLfo = actx.createOscillator();
  spinLfo.type = 'sine';
  spinLfo.frequency.value = 0.42;

  spinLfoGain = actx.createGain();
  spinLfoGain.gain.value = 72;

  spinLfo.connect(spinLfoGain).connect(spinOsc.frequency);
  spinLfo.start();

  spinGain = actx.createGain();
  spinGain.gain.value = 0.0001;

  spinOsc.connect(spinFilter);
  spinOsc2.connect(g2).connect(spinFilter);
  spinFilter.connect(spinGain).connect(masterGain);

  spinOsc.start();
  spinOsc2.start();

  audioReady = true;
}

function updateSpinSound(speed) {
  if (!audioReady) return;
  const t = actx.currentTime;
  const n = Math.min(speed / 6.0, 1);

  spinGain.gain.setTargetAtTime(n * n * 0.13, t, 0.09);
  spinFilter.frequency.setTargetAtTime(360 + n * 1500, t, 0.13);
  spinOsc.frequency.setTargetAtTime(130 + n * 170, t, 0.13);
  spinOsc2.frequency.setTargetAtTime(200 + n * 260, t, 0.13);
  spinLfoGain.gain.setTargetAtTime(52 + n * 90, t, 0.15);
}

function playHoofClick() {
  if (!audioReady) return;
  const t = actx.currentTime;

  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(118, t);
  osc.frequency.exponentialRampToValueAtTime(52, t + 0.16);

  const og = actx.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.34, t + 0.006);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

  osc.connect(og).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.34);

  const osc2 = actx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(64, t);
  osc2.frequency.exponentialRampToValueAtTime(36, t + 0.2);

  const og2 = actx.createGain();
  og2.gain.setValueAtTime(0.0001, t);
  og2.gain.exponentialRampToValueAtTime(0.16, t + 0.008);
  og2.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);

  osc2.connect(og2).connect(masterGain);
  osc2.start(t);
  osc2.stop(t + 0.4);

  const len = Math.floor(actx.sampleRate * 0.08);
  const nb = actx.createBuffer(1, len, actx.sampleRate);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < len; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
  }

  const ns = actx.createBufferSource();
  ns.buffer = nb;

  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 420;
  nf.Q.value = 1.6;

  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.11, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);

  ns.connect(nf).connect(ng).connect(masterGain);
  ns.start(t);
}

function playCurvatureTone(value, ascending) {
  if (!audioReady) return;
  const t = actx.currentTime;

  const baseFreq = 180 + value * 220;

  const f0 = ascending ? baseFreq * 0.78 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.78;

  const osc1 = actx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(f0, t);
  osc1.frequency.exponentialRampToValueAtTime(f1, t + 0.14);

  const osc2 = actx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(f0 * 2, t);
  osc2.frequency.exponentialRampToValueAtTime(f1 * 2, t + 0.14);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(400, t);
  lp.frequency.exponentialRampToValueAtTime(2200 + value * 480, t + 0.09);
  lp.frequency.exponentialRampToValueAtTime(620, t + 0.3);
  lp.Q.value = 8;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.12, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.05, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);

  osc1.connect(lp);
  osc2.connect(g2).connect(lp);
  lp.connect(g).connect(masterGain);

  osc1.start(t); osc2.start(t);
  osc1.stop(t + 0.38); osc2.stop(t + 0.26);
}

function playDensityTick(value, ascending) {
  if (!audioReady) return;
  const t = actx.currentTime;

  const baseFreq = 620 + (72 - value) * 6;

  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(ascending ? baseFreq * 0.85 : baseFreq, t);
  osc.frequency.exponentialRampToValueAtTime(ascending ? baseFreq : baseFreq * 0.85, t + 0.08);

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.055, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);

  osc.connect(g).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.18);
}

/* =========================================================
   8. 交互
   ========================================================= */
const pointerNDC = { x: -10, y: -10 };
const pointerScreen = { x: -1000, y: -1000 };

let isDragging = false;
let dragBtn = -1;
let lastX = 0, lastY = 0;
let dragDist = 0;
let downTime = 0;

canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  canvas.setPointerCapture(e.pointerId);
  isDragging = true;
  dragBtn = e.button;
  lastX = e.clientX;
  lastY = e.clientY;
  dragDist = 0;
  downTime = performance.now();
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  pointerScreen.x = e.clientX;
  pointerScreen.y = e.clientY;
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (!isDragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  dragDist += Math.abs(dx) + Math.abs(dy);

  if (dragBtn === 2 || e.shiftKey) {
    const s = camT.dist * 0.0016;
    const rx = Math.sin(camT.theta);
    const rz = -Math.cos(camT.theta);
    const ux = -Math.cos(camT.theta) * Math.cos(camT.phi);
    const uy = Math.sin(camT.phi);
    const uz = -Math.sin(camT.theta) * Math.cos(camT.phi);

    camT.tx -= rx * dx * s;
    camT.tz -= rz * dx * s;
    camT.tx += ux * dy * s;
    camT.ty += uy * dy * s;
    camT.tz += uz * dy * s;
  } else {
    camT.theta -= dx * 0.0072;
    camT.phi   -= dy * 0.0072;
    camT.phi = Math.max(-1.45, Math.min(1.45, camT.phi));
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (!isDragging) return;
  canvas.style.cursor = 'grab';

  const elapsed = performance.now() - downTime;
  const moved = Math.hypot(e.clientX - pointerScreen.x, e.clientY - pointerScreen.y);

  if (dragDist < 7 && elapsed < 600) {
    const rect = canvas.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    if (hitTest()) {
      playHoofClick();
    }
  }

  isDragging = false;
  dragBtn = -1;
});

canvas.addEventListener('pointercancel', () => {
  isDragging = false;
  canvas.style.cursor = 'grab';
});

canvas.addEventListener('pointerleave', () => {
  pointerNDC.x = -10;
  pointerNDC.y = -10;
  state.hoverTarget = 0;
  clearReadout();
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  initAudio();
  camT.dist *= Math.exp(e.deltaY * 0.0012);
  camT.dist = Math.max(1.6, Math.min(22, camT.dist));
}, { passive: false });

/* ---- 屏幕空间最近顶点检测 ---- */
let lastProjView = new Float32Array(16);
let lastViewport = { w: 1, h: 1 };

function hitTest() {
  if (!vertexPositions) return false;

  const mvp = lastProjView;
  const w = lastViewport.w;
  const h = lastViewport.h;

  const mx = pointerScreen.x * (w / window.innerWidth);
  const my = pointerScreen.y * (h / window.innerHeight);

  const threshold = Math.max(w, h) * 0.035;
  const th2 = threshold * threshold;

  let best = -1;
  let bestD = th2;

  const total = vertexCount;
  for (let i = 0; i < total; i++) {
    const vx = vertexPositions[i * 3];
    const vy = vertexPositions[i * 3 + 1];
    const vz = vertexPositions[i * 3 + 2];

    const cx = mvp[0] * vx + mvp[4] * vy + mvp[8] * vz + mvp[12];
    const cy = mvp[1] * vx + mvp[5] * vy + mvp[9] * vz + mvp[13];
    const cw = mvp[3] * vx + mvp[7] * vy + mvp[11] * vz + mvp[15];

    if (cw <= 0.0001) continue;

    const sx = (cx / cw * 0.5 + 0.5) * w;
    const sy = (1.0 - (cy / cw * 0.5 + 0.5)) * h;

    const ddx = sx - mx;
    const ddy = sy - my;
    const d2 = ddx * ddx + ddy * ddy;

    if (d2 < bestD) {
      bestD = d2;
      best = i;
    }
  }

  if (best >= 0) {
    state.hoverIdx = best;
    return true;
  }
  return false;
}

/* ---- 悬停检测 ---- */
let hoverTick = 0;

function updateHover() {
  if (isDragging || !vertexPositions) {
    state.hoverTarget = 0;
    return;
  }

  hoverTick++;
  if (hoverTick % 3 !== 0) return;

  const mvp = lastProjView;
  const w = lastViewport.w;
  const h = lastViewport.h;

  const mx = pointerScreen.x * (w / window.innerWidth);
  const my = pointerScreen.y * (h / window.innerHeight);

  const threshold = Math.max(w, h) * 0.030;
  const th2 = threshold * threshold;

  let best = -1;
  let bestD = th2;

  const total = vertexCount;

  for (let i = 0; i < total; i++) {
    const vx = vertexPositions[i * 3];
    const vy = vertexPositions[i * 3 + 1];
    const vz = vertexPositions[i * 3 + 2];

    const cx = mvp[0] * vx + mvp[4] * vy + mvp[8] * vz + mvp[12];
    const cy = mvp[1] * vx + mvp[5] * vy + mvp[9] * vz + mvp[13];
    const cw = mvp[3] * vx + mvp[7] * vy + mvp[11] * vz + mvp[15];

    if (cw <= 0.0001) continue;

    const sx = (cx / cw * 0.5 + 0.5) * w;
    const sy = (1.0 - (cy / cw * 0.5 + 0.5)) * h;

    const ddx = sx - mx;
    const ddy = sy - my;
    const d2 = ddx * ddx + ddy * ddy;

    if (d2 < bestD) {
      bestD = d2;
      best = i;
    }
  }

  if (best >= 0) {
    state.hoverIdx = best;
    state.hoverTarget = 1;

    const px = vertexPositions[best * 3];
    const py = vertexPositions[best * 3 + 1];
    const pz = vertexPositions[best * 3 + 2];

    roX.textContent = px.toFixed(3);
    roY.textContent = pz.toFixed(3);
    roZ.textContent = py.toFixed(3);
  } else {
    state.hoverTarget = 0;
    clearReadout();
  }
}

/* =========================================================
   9. UI 绑定
   ========================================================= */
const sliderA = document.getElementById('sliderA');
const sliderB = document.getElementById('sliderB');
const sliderN = document.getElementById('sliderN');
const valA = document.getElementById('valA');
const valB = document.getElementById('valB');
const valN = document.getElementById('valN');

const btnSolid = document.getElementById('btnSolid');
const btnWire  = document.getElementById('btnWire');
const btnBoth  = document.getElementById('btnBoth');

let lastA = state.a;
let lastB = state.b;
let lastN = state.density;

let rebuildPending = false;
function requestRebuild() {
  if (rebuildPending) return;
  rebuildPending = true;
  requestAnimationFrame(() => {
    rebuildPending = false;
    rebuild();
  });
}

function setMode(m) {
  state.mode = m;
  btnSolid.classList.toggle('on', m === 1);
  btnWire.classList.toggle('on', m === 0);
  btnBoth.classList.toggle('on', m === 2);
}

btnSolid.addEventListener('click', () => { initAudio(); setMode(1); });
btnWire.addEventListener('click', () => { initAudio(); setMode(0); });
btnBoth.addEventListener('click', () => { initAudio(); setMode(2); });

sliderA.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderA.value);
  if (v !== lastA) {
    playCurvatureTone(v, v > lastA);
    lastA = v;
  }
  state.a = v;
  valA.textContent = v.toFixed(2);
  requestRebuild();
});

sliderB.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderB.value);
  if (v !== lastB) {
    playCurvatureTone(v, v > lastB);
    lastB = v;
  }
  state.b = v;
  valB.textContent = v.toFixed(2);
  requestRebuild();
});

sliderN.addEventListener('input', () => {
  initAudio();
  const v = parseInt(sliderN.value, 10);
  if (v !== lastN) {
    playDensityTick(v, v > lastN);
    lastN = v;
  }
  state.density = v;
  valN.textContent = String(v);
  requestRebuild();
});

/* =========================================================
   10. 尺寸自适应
   ========================================================= */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));

  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ★★★ 修复：启动时执行一次初始构建，让页面一打开就显示默认马鞍面 ★★★ */
rebuild();

/* =========================================================
   11. 主循环
   ========================================================= */
const projMat = new Float32Array(16);
const viewMat = new Float32Array(16);
const projViewMat = new Float32Array(16);
const eyePos = new Float32Array(3);

let lastT = performance.now();
let timeAcc = 0;

const prevEye = new Float32Array(3);

function frame(now) {
  requestAnimationFrame(frame);

  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  timeAcc += dt;

  /* ---- 相机缓动 ---- */
  const ease = 1 - Math.pow(0.001, dt);
  cam.theta += (camT.theta - cam.theta) * ease;
  cam.phi   += (camT.phi   - cam.phi)   * ease;
  cam.dist  += (camT.dist  - cam.dist)  * Math.min(1, dt * 8);
  cam.tx    += (camT.tx    - cam.tx)    * ease;
  cam.ty    += (camT.ty    - cam.ty)    * ease;
  cam.tz    += (camT.tz    - cam.tz)    * ease;

  /* ---- 相机位置 ---- */
  const cp = Math.cos(cam.phi);
  const sp = Math.sin(cam.phi);
  const ct = Math.cos(cam.theta);
  const st = Math.sin(cam.theta);

  eyePos[0] = cam.tx + cam.dist * cp * st;
  eyePos[1] = cam.ty + cam.dist * sp;
  eyePos[2] = cam.tz + cam.dist * cp * ct;

  /* ---- 相机运动速度 → 旋转音 ---- */
  if (prevEye[0] !== 0 || prevEye[1] !== 0 || prevEye[2] !== 0) {
    const dx = eyePos[0] - prevEye[0];
    const dy = eyePos[1] - prevEye[1];
    const dz = eyePos[2] - prevEye[2];
    const speed = Math.sqrt(dx * dx + dy * dy + dz * dz) / Math.max(dt, 0.001);
    updateSpinSound(speed);
  }
  prevEye[0] = eyePos[0];
  prevEye[1] = eyePos[1];
  prevEye[2] = eyePos[2];

  /* ---- 矩阵 ---- */
  const aspect = canvas.width / canvas.height;
  mat4Perspective(projMat, Math.PI / 4.2, aspect, 0.05, 120);
  mat4LookAt(viewMat, eyePos, [cam.tx, cam.ty, cam.tz], [0, 1, 0]);
  mat4Multiply(projViewMat, projMat, viewMat);

  lastProjView.set(projViewMat);
  lastViewport.w = canvas.width;
  lastViewport.h = canvas.height;

  /* ---- 悬停 ---- */
  updateHover();
  state.hoverStrength += (state.hoverTarget - state.hoverStrength) * Math.min(1, dt * 10);

  let hx = 0, hy = 0, hz = 0;
  if (state.hoverIdx >= 0 && state.hoverIdx < vertexCount && vertexPositions) {
    hx = vertexPositions[state.hoverIdx * 3];
    hy = vertexPositions[state.hoverIdx * 3 + 1];
    hz = vertexPositions[state.hoverIdx * 3 + 2];
  }

  /* ---- 绘制 ---- */
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.027, 0.020, 0.047, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.BLEND);
  gl.disable(gl.CULL_FACE);

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bindBuffer(gl.ARRAY_BUFFER, nrmBuf);

  /* ============ 实体 ============ */
  if (state.mode === 1 || state.mode === 2) {
    gl.useProgram(progSolid);

    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.enableVertexAttribArray(SL.aPos);
    gl.vertexAttribPointer(SL.aPos, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, nrmBuf);
    gl.enableVertexAttribArray(SL.aNormal);
    gl.vertexAttribPointer(SL.aNormal, 3, gl.FLOAT, false, 0, 0);

    gl.uniformMatrix4fv(SL.uProjView, false, projViewMat);
    gl.uniform3fv(SL.uCamPos, eyePos);
    gl.uniform1f(SL.uTime, timeAcc);
    gl.uniform3f(SL.uHoverPos, hx, hy, hz);
    gl.uniform1f(SL.uHoverStrength, state.hoverStrength);

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, solidIdxBuf);
    gl.drawElements(gl.TRIANGLES, solidIndexCount, gl.UNSIGNED_SHORT, 0);
  }

  /* ============ 线框 ============ */
  if (state.mode === 0 || state.mode === 2) {
    gl.useProgram(progWire);

    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.enableVertexAttribArray(WL.aPos);
    gl.vertexAttribPointer(WL.aPos, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, nrmBuf);
    gl.enableVertexAttribArray(WL.aNormal);
    gl.vertexAttribPointer(WL.aNormal, 3, gl.FLOAT, false, 0, 0);

    gl.uniformMatrix4fv(WL.uProjView, false, projViewMat);
    gl.uniform3fv(WL.uCamPos, eyePos);
    gl.uniform1f(WL.uTime, timeAcc);

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, wireIdxBuf);
    gl.drawElements(gl.LINES, wireIndexCount, gl.UNSIGNED_SHORT, 0);
  }
}

requestAnimationFrame(frame);

/* =========================================================
   12. 首次手势解锁音频
   ========================================================= */
['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, () => {
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
  }, { once: true });
});

})();
</script>
