<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford圆切触网 · 上半平面双曲射影 · 数论几何</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d6a745;
            --cyan: #3cbca4;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.6vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.62rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.85rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.54rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3cbca4;
        }
        .accent-rose {
            color: #d94050;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>Ford圆切触网 · 上半平面双曲射影 · 数论几何</h1>
        <div class="subtitle">Farey序列 &nbsp;·&nbsp; Ford圆相切 &nbsp;·&nbsp; Cayley变换 &nbsp;·&nbsp; 球极投影</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">C(p/q): |z − p/q| = 1/(2q²)</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">w = (z−i)/(z+i)</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">π⁻¹(w) ∈ S²</span>
        </div>
        <div class="formula-detail">
            上半平面Ford圆网络 &nbsp;·&nbsp; Möbius变换到单位圆盘 &nbsp;·&nbsp; 逆球极投影至三维球面 &nbsp;·&nbsp; 数论与双曲几何交汇
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 30);
        camera.position.set(2.3, 1.4, 7.7);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3cbca4');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // ==================== 背景星点 ====================
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 170;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.3 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSizes[i] = Math.random() * 1.6 + 0.22;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.018,
            transparent: true,
            opacity: 0.46,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 50, 34);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.07, depthWrite: false })
        );
        scene.add(refSphereWire);

        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 28);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.06, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ==================== 变换工具函数 ====================
        function cayleyTransform(z) {
            // z = x + iy (上半平面 y>0)
            // w = (z - i) / (z + i) 映射到单位圆盘
            const denom = (z[0] ** 2 + (z[1] + 1) ** 2);
            const x = (z[0] ** 2 + z[1] ** 2 - 1) / denom;
            const y = (2 * z[0]) / denom;
            return [x, y];
        }

        function inverseStereographic(p) {
            const x = p[0],
                y = p[1];
            const r2 = x * x + y * y;
            const denom = 1 + r2;
            return [(2 * x) / denom, (2 * y) / denom, (1 - r2) / denom];
        }

        function clampToSphere(pt) {
            const r = Math.sqrt(pt[0] ** 2 + pt[1] ** 2 + pt[2] ** 2);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const s = CLAMP_RADIUS / r;
                return [pt[0] * s, pt[1] * s, pt[2] * s];
            }
            return pt;
        }

        // ==================== Ford圆生成 ====================
        function gcd(a, b) {
            while (b) {
                [a, b] = [b, a % b];
            }
            return a;
        }

        function generateFordCircles(maxDenom) {
            const circles = []; // {cx, cy, r, q, colorIndex}
            for (let q = 1; q <= maxDenom; q++) {
                for (let p = 0; p <= q; p++) {
                    if (gcd(p, q) !== 1) continue;
                    const cx = p / q;
                    const cy = 1 / (2 * q * q);
                    const r = cy;
                    const colorIndex = q % 3; // 0:gold, 1:cyan, 2:rose
                    circles.push({ cx, cy, r, q, colorIndex });
                }
            }
            return circles;
        }

        // ==================== 线段几何体创建 ====================
        const SEGMENTS_PER_CIRCLE = 72; // 每个圆采样线段数
        // 预分配最大可能的圆数量 (maxDenom最大约为27，大约443个圆)
        const MAX_CIRCLES = 500;
        const MAX_SEGMENTS = MAX_CIRCLES * SEGMENTS_PER_CIRCLE;

        function createColorGeom(color) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(MAX_SEGMENTS * 6); // 每条线段2个点*3
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.83,
                depthTest: true,
                depthWrite: true,
            });
            const lines = new THREE.LineSegments(geometry, material);
            scene.add(lines);
            return { lines, geometry, positions };
        }

        const goldGeom = createColorGeom(colorGold);
        const cyanGeom = createColorGeom(colorCyan);
        const roseGeom = createColorGeom(colorRose);

        // 当前活跃圆的列表（缓存）
        let currentCircles = [];
        let segCounts = [0, 0, 0]; // 各颜色实际使用的线段数

        function updateAllCircles(t) {
            // 动态决定最大分母N，随时间在12~27之间振荡
            const maxDenom = Math.round(12 + 15 * (Math.sin(t * 0.35) * 0.5 + 0.5));
            const circles = generateFordCircles(maxDenom);

            // 重置计数
            segCounts = [0, 0, 0];
            // 存储圆数据用于粒子
            currentCircles = circles;

            // 准备写入数组
            const goldPos = goldGeom.positions;
            const cyanPos = cyanGeom.positions;
            const rosePos = roseGeom.positions;

            for (const circle of circles) {
                const { cx, cy, r, colorIndex } = circle;
                const positionsArr = colorIndex === 0 ? goldPos : (colorIndex === 1 ? cyanPos : rosePos);
                const segOffset = segCounts[colorIndex];
                // 采样圆上的点并映射
                for (let s = 0; s < SEGMENTS_PER_CIRCLE; s++) {
                    const angle1 = (s / SEGMENTS_PER_CIRCLE) * Math.PI * 2;
                    const angle2 = ((s + 1) / SEGMENTS_PER_CIRCLE) * Math.PI * 2;
                    const z1 = [cx + r * Math.cos(angle1), cy + r * Math.sin(angle1)];
                    const z2 = [cx + r * Math.cos(angle2), cy + r * Math.sin(angle2)];

                    // Cayley变换到单位圆盘
                    const w1 = cayleyTransform(z1);
                    const w2 = cayleyTransform(z2);

                    // 逆球极投影到3D
                    let p1 = inverseStereographic(w1);
                    let p2 = inverseStereographic(w2);

                    // 缩放并钳制
                    p1 = clampToSphere([p1[0] * 2.5, p1[1] * 2.5, p1[2] * 2.5]);
                    p2 = clampToSphere([p2[0] * 2.5, p2[1] * 2.5, p2[2] * 2.5]);

                    const idx = (segOffset + s) * 6;
                    positionsArr[idx] = p1[0];
                    positionsArr[idx + 1] = p1[1];
                    positionsArr[idx + 2] = p1[2];
                    positionsArr[idx + 3] = p2[0];
                    positionsArr[idx + 4] = p2[1];
                    positionsArr[idx + 5] = p2[2];
                }
                segCounts[colorIndex] += SEGMENTS_PER_CIRCLE;
            }

            // 更新几何体，将未使用的部分置零（不绘制即可，或设置drawRange）
            goldGeom.geometry.setDrawRange(0, segCounts[0] * 2);
            goldGeom.geometry.attributes.position.needsUpdate = true;
            cyanGeom.geometry.setDrawRange(0, segCounts[1] * 2);
            cyanGeom.geometry.attributes.position.needsUpdate = true;
            roseGeom.geometry.setDrawRange(0, segCounts[2] * 2);
            roseGeom.geometry.attributes.position.needsUpdate = true;

            // 将剩余缓冲区清零以避免残留线段
            for (let i = segCounts[0] * 6; i < MAX_SEGMENTS * 6; i++) goldPos[i] = 0;
            for (let i = segCounts[1] * 6; i < MAX_SEGMENTS * 6; i++) cyanPos[i] = 0;
            for (let i = segCounts[2] * 6; i < MAX_SEGMENTS * 6; i++) rosePos[i] = 0;
        }

        // ==================== 流动粒子 ====================
        const particleCount = 16;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];

        function initParticles() {
            for (let i = 0; i < particleCount; i++) {
                particleData.push({
                    progress: Math.random(),
                    speed: 0.0008 + Math.random() * 0.003,
                    circleIndex: -1, // 将在更新时分配
                });
                let col;
                if (i < 6) col = colorGold.clone();
                else if (i < 11) col = colorCyan.clone();
                else col = colorRose.clone();
                particleColArr[i * 3] = col.r;
                particleColArr[i * 3 + 1] = col.g;
                particleColArr[i * 3 + 2] = col.b;
            }
            particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
            particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        }
        initParticles();

        const particlesMat = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            const circles = currentCircles;
            if (circles.length === 0) return;
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;

                // 每个粒子关联到一个圆（随机或循环）
                if (pd.circleIndex < 0 || pd.circleIndex >= circles.length) {
                    pd.circleIndex = Math.floor(Math.random() * circles.length);
                }
                const circle = circles[pd.circleIndex];
                const angle = pd.progress * Math.PI * 2;
                const z = [circle.cx + circle.r * Math.cos(angle), circle.cy + circle.r * Math.sin(angle)];
                const w = cayleyTransform(z);
                let pt = inverseStereographic(w);
                pt = clampToSphere([pt[0] * 2.5, pt[1] * 2.5, pt[2] * 2.5]);
                particlePosArr[p * 3] = pt[0];
                particlePosArr[p * 3 + 1] = pt[1];
                particlePosArr[p * 3 + 2] = pt[2];
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // ==================== 极度健壮的动画循环 ====================
        const clock = new THREE.Clock();
        let animTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animTime += dt;
                frameCount++;

                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${animTime.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }

                // 更新Ford圆网络
                updateAllCircles(animTime);
                // 更新粒子
                updateParticles();

                // 参考结构运动
                const breathe = 1 + 0.04 * Math.sin(animTime * 0.38) * Math.cos(animTime * 0.28);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.055;
                refSphereWire.rotation.y += dt * 0.045;

                refTorusWire.rotation.z += dt * 0.055;
                const torBreathe = 1 + 0.05 * Math.sin(animTime * 0.42) * Math.cos(animTime * 0.31);
                refTorusWire.scale.setScalar(torBreathe);

                // 相机缓慢旋转
                const camH = animTime * 0.09;
                const camV = 0.33 + 0.17 * Math.sin(animTime * 0.14);
                const camD = 7.4 + 0.6 * Math.sin(animTime * 0.19) * Math.cos(animTime * 0.25);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.05 * Math.sin(animTime * 0.09), 0.03 * Math.cos(animTime * 0.12), 0);

                stars.rotation.y += dt * 0.013;
                stars.rotation.x += dt * 0.009;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环异常:', e);
            }
        }

        // 响应式处理
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') clock.getDelta();
        });

        // ==================== 启动 ====================
        console.log('🚀 Ford圆切触网动画初始化...');
        updateAllCircles(0);
        updateParticles();
        renderer.render(scene, camera);
        clock.start();
        animTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环启动，Ford圆网络持续编织中');
    </script>
</body>
</html>
