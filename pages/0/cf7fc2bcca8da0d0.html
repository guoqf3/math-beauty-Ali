<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>涡旋星云</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030308;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="vortexCanvas"></canvas>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('vortexCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // ---------- 配置参数 ----------
            const CONFIG = {
                particleCount: 170,         // 粒子数量
                mouseAttractRadius: 240,    // 鼠标吸引半径
                centripetalForce: 0.06,     // 向心力强度
                tangentialForce: 0.12,      // 切向力强度（产生旋转）
                damping: 0.95,              // 速度阻尼
                maxSpeed: 4.5,              // 最大速度
                clickRepelRadius: 300,      // 点击冲击波半径
                clickRepelStrength: 32,     // 冲击波强度
                backgroundFade: 0.15,       // 背景拖尾强度
                glowFactor: 3.5,            // 光晕因子
                hueBase: 215,               // 基础色相
                hueVariation: 45,           // 色相变化范围
                saturation: 85,
                lightness: 65,
                particleSizeMin: 1.0,       // 粒子最小尺寸
                particleSizeMax: 2.5,       // 粒子最大尺寸
            };

            let width = 0;
            let height = 0;
            let dpr = 1;
            let particles = [];
            let mouseX = -9999;
            let mouseY = -9999;
            let mouseActive = false;
            let targetMouseX = -9999;
            let targetMouseY = -9999;
            let smoothMouseX = -9999;
            let smoothMouseY = -9999;
            let animationId = null;
            let lastTime = 0;
            let time = 0;

            // ---------- 粒子类 ----------
            class VortexParticle {
                constructor(w, h) {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * (CONFIG.particleSizeMax - CONFIG.particleSizeMin) + CONFIG
                        .particleSizeMin;
                    this.hue = (CONFIG.hueBase + Math.random() * CONFIG.hueVariation) % 360;
                    this.saturation = CONFIG.saturation + Math.random() * 10;
                    this.lightness = CONFIG.lightness + Math.random() * 15;
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 1.2 + 0.4;
                }

                update(dt, now, time) {
                    // 鼠标吸引力 + 切向力（产生涡旋）
                    if (mouseActive && smoothMouseX > -1000) {
                        const dx = smoothMouseX - this.x;
                        const dy = smoothMouseY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < CONFIG.mouseAttractRadius && dist > 0.1) {
                            // 向心力（指向鼠标）
                            const centriFactor = (CONFIG.mouseAttractRadius - dist) / CONFIG.mouseAttractRadius;
                            const centriStrength = CONFIG.centripetalForce * centriFactor;

                            // 切向力（垂直于鼠标方向，产生旋转）
                            const tangentStrength = CONFIG.tangentialForce * centriFactor;
                            // 切向向量：(-dy/dist, dx/dist) 逆时针
                            const tx = -dy / dist;
                            const ty = dx / dist;

                            this.vx += (dx / dist) * centriStrength * dt + tx * tangentStrength * dt;
                            this.vy += (dy / dist) * centriStrength * dt + ty * tangentStrength * dt;
                        }
                    }

                    // 阻尼
                    this.vx *= CONFIG.damping;
                    this.vy *= CONFIG.damping;

                    // 限制速度
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > CONFIG.maxSpeed) {
                        this.vx = (this.vx / speed) * CONFIG.maxSpeed;
                        this.vy = (this.vy / speed) * CONFIG.maxSpeed;
                    }
                    // 维持最小运动
                    if (speed < 0.2 && speed > 0.01) {
                        this.vx = (this.vx / speed) * 0.2;
                        this.vy = (this.vy / speed) * 0.2;
                    }

                    // 更新位置
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // 边界处理（循环）
                    const margin = 30;
                    if (this.x < -margin) this.x = width + margin;
                    else if (this.x > width + margin) this.x = -margin;
                    if (this.y < -margin) this.y = height + margin;
                    else if (this.y > height + margin) this.y = -margin;
                }

                // 获取当前亮度
                getLightness() {
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    const speedFactor = Math.min(1, speed / CONFIG.maxSpeed);
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 5;
                    return Math.max(40, Math.min(90, this.lightness + speedFactor * 12 + pulse * 0.3));
                }

                // 获取当前大小
                getSize() {
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase) * 0.3;
                    return Math.max(0.6, this.size + pulse);
                }
            }

            // ---------- 初始化粒子 ----------
            function initParticles() {
                particles = [];
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    particles.push(new VortexParticle(width, height));
                }
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#030308';
                ctx.fillRect(0, 0, width, height);
                initParticles();
                // 立即绘制一帧
                drawScene(performance.now());
            }

            // ---------- 绘制场景 ----------
            function drawScene(now) {
                // 背景拖尾
                ctx.fillStyle = 'rgba(3, 3, 8, ' + CONFIG.backgroundFade + ')';
                ctx.fillRect(0, 0, width, height);

                // 平滑鼠标位置
                if (mouseActive) {
                    smoothMouseX += (targetMouseX - smoothMouseX) * 0.2;
                    smoothMouseY += (targetMouseY - smoothMouseY) * 0.2;
                }

                // 开启混合模式
                ctx.globalCompositeOperation = 'lighter';

                // 绘制鼠标光晕（涡旋中心）
                if (mouseActive && smoothMouseX > -1000) {
                    const glowRadius = 100;
                    const grad = ctx.createRadialGradient(smoothMouseX, smoothMouseY, 0, smoothMouseX, smoothMouseY,
                        glowRadius);
                    grad.addColorStop(0, 'rgba(130, 170, 255, 0.12)');
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(smoothMouseX, smoothMouseY, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制所有粒子
                for (const p of particles) {
                    const lightness = p.getLightness();
                    const size = p.getSize();
                    const glowRadius = size * CONFIG.glowFactor;

                    // 光晕
                    const glowGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowRadius);
                    glowGrad.addColorStop(0, `hsla(${p.hue}, ${p.saturation}%, ${lightness}%, 0.5)`);
                    glowGrad.addColorStop(0.5, `hsla(${p.hue}, ${p.saturation}%, ${lightness}%, 0.2)`);
                    glowGrad.addColorStop(1, `hsla(${p.hue}, ${p.saturation}%, ${lightness}%, 0)`);
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, glowRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心亮点
                    ctx.fillStyle = `hsla(${p.hue}, 100%, ${lightness + 8}%, 0.85)`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 恢复混合模式
                ctx.globalCompositeOperation = 'source-over';
            }

            // ---------- 更新粒子 ----------
            function updateParticles(now) {
                const dt = Math.min(2, (now - lastTime) / 16.67) || 1;
                time = now * 0.001;

                for (const p of particles) {
                    p.update(dt, now, time);
                }
            }

            // ---------- 动画循环 ----------
            function animate(timestamp) {
                const now = performance.now();
                if (lastTime === 0) lastTime = now;
                const dt = now - lastTime;
                if (dt > 100) {
                    lastTime = now - 16;
                } else {
                    lastTime = now;
                }

                updateParticles(now);
                drawScene(now);

                animationId = requestAnimationFrame(animate);
            }

            // ---------- 交互事件 ----------
            function updateMousePosition(clientX, clientY) {
                targetMouseX = clientX;
                targetMouseY = clientY;
                if (!mouseActive) {
                    mouseActive = true;
                    smoothMouseX = targetMouseX;
                    smoothMouseY = targetMouseY;
                }
            }

            function handleClick(clientX, clientY) {
                // 释放冲击波，向外推开粒子
                for (const p of particles) {
                    const dx = p.x - clientX;
                    const dy = p.y - clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.clickRepelRadius && dist > 0.01) {
                        const force = (1 - dist / CONFIG.clickRepelRadius) * CONFIG.clickRepelStrength;
                        p.vx += (dx / dist) * force;
                        p.vy += (dy / dist) * force;
                    }
                }
            }

            function setupEvents() {
                window.addEventListener('mousemove', (e) => {
                    updateMousePosition(e.clientX, e.clientY);
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('mousedown', (e) => {
                    handleClick(e.clientX, e.clientY);
                });

                window.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                        handleClick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        updateMousePosition(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    mouseActive = false;
                    smoothMouseX = -9999;
                    smoothMouseY = -9999;
                });

                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                        lastTime = 0;
                    } else {
                        if (!animationId) {
                            lastTime = 0;
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                resizeCanvas();
                setupEvents();
                lastTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__vortexNebula = {
                config: CONFIG,
                particles: particles,
            };
        })();
    </script>
</body>
</html>
