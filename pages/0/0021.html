<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对数螺线编织 · 球极投影网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>对数螺线编织 · 球极投影网</h2>
        <div class="sub">Logarithmic spirals r=a·e^{bθ} · Stereographic projection · Equiangular braiding</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">b∈[0.25,0.90] 慢缠绕</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">b∈[0.55,1.60] 中等缠绕</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">b∈[1.10,2.50] 快速缠绕</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.3;
        const MAX_R_PLANE = 7.5;
        const CURVE_POINTS = 480;

        // 球极投影（平面→球面）
        function stereographic(px, py) {
            const d = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / d,
                2 * PROJ_D * py / d,
                (px * px + py * py - PROJ_D * PROJ_D) / d
            ).multiplyScalar(SPHERE_R);
        }

        // 生成对数螺线：r = a * exp(b * θ)
        function logarithmicSpiral(a, b, thetaStart, thetaEnd, steps) {
            const pts = [];
            const dTheta = (thetaEnd - thetaStart) / steps;
            for (let i = 0; i <= steps; i++) {
                const theta = thetaStart + i * dTheta;
                const r = a * Math.exp(b * theta);
                if (r < 0.008 || r > MAX_R_PLANE) continue;
                const px = r * Math.cos(theta);
                const py = r * Math.sin(theta);
                const sp = stereographic(px, py);
                if (sp && sp.length() < 9.5) pts.push(sp);
            }
            return pts;
        }

        // 创建一族螺线
        function createSpiralFamily(aValues, bValues, phaseCount, color, opacity) {
            const group = new THREE.Group();
            for (const a of aValues) {
                for (const b of bValues) {
                    for (let p = 0; p < phaseCount; p++) {
                        const phaseOff = p * 2 * Math.PI / phaseCount;
                        // 正向缠绕（θ从0增长）
                        let pts = logarithmicSpiral(a, b, phaseOff, phaseOff + 10.5, CURVE_POINTS);
                        if (pts.length >= 2) {
                            const geom = new THREE.BufferGeometry().setFromPoints(pts);
                            const mat = new THREE.LineBasicMaterial({
                                color, transparent: true, opacity, depthWrite: true, depthTest: true,
                            });
                            group.add(new THREE.Line(geom, mat));
                        }
                        // 反向缠绕
                        pts = logarithmicSpiral(a, -b, phaseOff, phaseOff - 9.0, CURVE_POINTS);
                        if (pts.length >= 2) {
                            const geom = new THREE.BufferGeometry().setFromPoints(pts);
                            const mat = new THREE.LineBasicMaterial({
                                color, transparent: true, opacity: opacity * 0.7, depthWrite: true, depthTest: true,
                            });
                            group.add(new THREE.Line(geom, mat));
                        }
                    }
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'log-spiral-weave';
        scene.add(rootGroup);

        const phaseCount = 22;

        // 金色族：慢缠绕（b小），a较大
        const goldB = [0.25, 0.35, 0.48, 0.62, 0.78, 0.90];
        const goldA = [0.09, 0.13];
        rootGroup.add(createSpiralFamily(goldA, goldB, phaseCount, COLOR_GOLD, 0.62));
        // 额外稀疏层
        rootGroup.add(createSpiralFamily([0.07], goldB.slice(0, 4), Math.floor(phaseCount * 0.55), COLOR_GOLD, 0.38));

        // 青色族：中等缠绕
        const cyanB = [0.55, 0.72, 0.90, 1.10, 1.35, 1.60];
        const cyanA = [0.06, 0.10];
        rootGroup.add(createSpiralFamily(cyanA, cyanB, phaseCount, COLOR_CYAN, 0.62));
        rootGroup.add(createSpiralFamily([0.05], cyanB.slice(0, 4), Math.floor(phaseCount * 0.55), COLOR_CYAN, 0.38));

        // 品红族：快速缠绕（b大），a较小
        const magentaB = [1.10, 1.40, 1.75, 2.10, 2.50];
        const magentaA = [0.04, 0.07];
        rootGroup.add(createSpiralFamily(magentaA, magentaB, phaseCount, COLOR_MAGENTA, 0.62));
        rootGroup.add(createSpiralFamily([0.03], magentaB.slice(0, 3), Math.floor(phaseCount * 0.55), COLOR_MAGENTA, 0.38));

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        console.log('对数螺线编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.27;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 对数螺线球极投影编织动画已稳定运行');
    </script>
</body>
</html>
