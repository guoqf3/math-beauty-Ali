<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villarceau圆 · 环面几何交响</title>
    <style>
        :root {
            --bg: #020408;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 42px rgba(200, 180, 150, 0.5), 0 0 72px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 0.9vw, 0.66rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }
        #formula-overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(2, 4, 8, 0.7);
            padding: 11px 23px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.44rem, 0.8vw, 0.64rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.27);
            line-height: 1.55;
            white-space: nowrap;
        }
        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }
        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 12px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.38rem;
                white-space: normal;
                line-height: 1.35;
            }
            #title-overlay .title {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">Villarceau圆 · 环面几何交响</div>
        <div class="subtitle">VILLARCEAU CIRCLES &nbsp;·&nbsp; TORUS GEOMETRY</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">族A:</span> cos(φ−φ₀)=R·cosθ/(R+r·cosθ)&nbsp;
            <span class="c2">族B:</span> cos(φ−φ₀)=−R·cosθ/(R+r·cosθ)
            <br>
            <span class="c3">环面:</span> (√(x²+y²)−R)²+z²=r²&nbsp;|&nbsp;R=2.2&nbsp;r=0.85&nbsp;|&nbsp;双切平面截面
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#020408');
        scene.fog = new THREE.Fog('#020408', 7, 18);

        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            24
        );
        camera.position.set(1.3, 0.65, 7.0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色定义 ====================
        const C1 = '#d4885c'; // 暖金 – Villarceau族A
        const C2 = '#5d9ec6'; // 冰蓝 – Villarceau族B
        const C3 = '#c77d9f'; // 玫瑰粉 – 环面经线/纬线
        const C_FRAME = '#3a4a5c';
        const C_GLINT = '#8898aa';

        // ==================== 环面参数 ====================
        const R = 2.2; // 大半径
        const r = 0.85; // 小半径
        const NUM_VILLARCEAU_SAMPLES = 280;

        // ==================== Villarceau圆生成 ====================
        /**
         * 在环面上生成Villarceau圆的三维点
         * @param {number} phi0 - 偏移相位
         * @param {boolean} familyA - true为族A（正号），false为族B（负号）
         * @returns {THREE.Vector3[]}
         */
        function villarceauCirclePoints(phi0, familyA) {
            const points = [];
            const cosThetaMin = -R / (R + r);
            const thetaMax = Math.acos(cosThetaMin);
            // θ从 -thetaMax 到 thetaMax，然后再返回，形成闭合圆
            const halfSamples = Math.floor(NUM_VILLARCEAU_SAMPLES / 2);
            const dTheta = (2 * thetaMax) / halfSamples;

            for (let i = 0; i <= halfSamples; i++) {
                const theta = -thetaMax + i * dTheta;
                const cosTheta = Math.cos(theta);
                const rhs = (R * cosTheta) / (R + r * cosTheta);
                const clamped = Math.max(-1, Math.min(1, rhs));
                const delta = Math.acos(clamped);
                const phi = familyA ? (phi0 + delta) : (phi0 - delta);

                const x = (R + r * cosTheta) * Math.cos(phi);
                const y = (R + r * cosTheta) * Math.sin(phi);
                const z = r * Math.sin(theta);
                points.push(new THREE.Vector3(x, y, z));
            }
            // 返回路径（θ从thetaMax回到-thetaMax，另一支）
            for (let i = halfSamples; i >= 0; i--) {
                const theta = -thetaMax + i * dTheta;
                const cosTheta = Math.cos(theta);
                const rhs = (R * cosTheta) / (R + r * cosTheta);
                const clamped = Math.max(-1, Math.min(1, rhs));
                const delta = Math.acos(clamped);
                const phi = familyA ? (phi0 - delta) : (phi0 + delta);

                const x = (R + r * cosTheta) * Math.cos(phi);
                const y = (R + r * cosTheta) * Math.sin(phi);
                const z = r * Math.sin(theta);
                points.push(new THREE.Vector3(x, y, z));
            }
            return points;
        }

        function createVillarceauLinesGroup(phiOffsets, familyA, colorHex, opacity) {
            const group = new THREE.Group();
            for (const phi0 of phiOffsets) {
                const pts = villarceauCirclePoints(phi0, familyA);
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 族A：12条，φ₀均匀分布
        const phiOffsetsA = [];
        for (let k = 0; k < 14; k++) {
            phiOffsetsA.push((k / 14) * Math.PI * 2);
        }
        // 族B：14条，φ₀偏移π/14
        const phiOffsetsB = [];
        for (let k = 0; k < 14; k++) {
            phiOffsetsB.push((k / 14) * Math.PI * 2 + Math.PI / 14);
        }

        console.log('生成Villarceau圆族A...');
        const villarceauGroupA = createVillarceauLinesGroup(phiOffsetsA, true, C1, 0.62);
        console.log('生成Villarceau圆族B...');
        const villarceauGroupB = createVillarceauLinesGroup(phiOffsetsB, false, C2, 0.6);

        // ==================== 环面经线和纬线（玫瑰粉） ====================
        function createTorusMeridianLines(numMeridians, colorHex, opacity) {
            const group = new THREE.Group();
            const numSamples = 200;
            for (let k = 0; k < numMeridians; k++) {
                const phi = (k / numMeridians) * Math.PI * 2;
                const pts = [];
                for (let i = 0; i <= numSamples; i++) {
                    const theta = (i / numSamples) * Math.PI * 2;
                    const x = (R + r * Math.cos(theta)) * Math.cos(phi);
                    const y = (R + r * Math.cos(theta)) * Math.sin(phi);
                    const z = r * Math.sin(theta);
                    pts.push(new THREE.Vector3(x, y, z));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        function createTorusLatitudeLines(numLatitudes, colorHex, opacity) {
            const group = new THREE.Group();
            const numSamples = 220;
            for (let k = 1; k < numLatitudes - 1; k++) {
                const theta = (k / (numLatitudes - 1)) * Math.PI * 2;
                const pts = [];
                const radius = R + r * Math.cos(theta);
                const z = r * Math.sin(theta);
                for (let i = 0; i <= numSamples; i++) {
                    const phi = (i / numSamples) * Math.PI * 2;
                    pts.push(new THREE.Vector3(radius * Math.cos(phi), radius * Math.sin(phi), z));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const meridianGroup = createTorusMeridianLines(10, C3, 0.55);
        const latitudeGroup = createTorusLatitudeLines(7, C3, 0.5);

        // ==================== 环面参考线框（灰色） ====================
        function createTorusWireframe(colorHex, opacity) {
            const group = new THREE.Group();
            const numSamples = 180;
            // 3条经线
            for (let k = 0; k < 3; k++) {
                const phi = (k / 3) * Math.PI * 2;
                const pts = [];
                for (let i = 0; i <= numSamples; i++) {
                    const theta = (i / numSamples) * Math.PI * 2;
                    pts.push(new THREE.Vector3(
                        (R + r * Math.cos(theta)) * Math.cos(phi),
                        (R + r * Math.cos(theta)) * Math.sin(phi),
                        r * Math.sin(theta)
                    ));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            // 3条纬线
            for (const theta of [-Math.PI / 2, 0, Math.PI / 2]) {
                const radius = R + r * Math.cos(theta);
                const z = r * Math.sin(theta);
                const pts = [];
                for (let i = 0; i <= numSamples; i++) {
                    const phi = (i / numSamples) * Math.PI * 2;
                    pts.push(new THREE.Vector3(radius * Math.cos(phi), radius * Math.sin(phi), z));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const torusWire = createTorusWireframe(C_FRAME, 0.3);
        const torusWireOuter = createTorusWireframe(C_FRAME, 0.24);

        // ==================== 组装场景 ====================
        const mainGroup = new THREE.Group();
        mainGroup.add(villarceauGroupA);
        mainGroup.add(villarceauGroupB);
        mainGroup.add(meridianGroup);
        mainGroup.add(latitudeGroup);
        mainGroup.add(torusWire);
        scene.add(mainGroup);

        // 第二个参考线框独立旋转
        const torusWire2 = createTorusWireframe(C_FRAME, 0.2);
        scene.add(torusWire2);

        // ==================== 原点光点 ====================
        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.1;
            const pairs = [
                [new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0)],
                [new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0)],
                [new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)],
            ];
            for (const [a, b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true,
                    opacity: 0.7,
                    depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(createOriginGlint());

        // ==================== 动画循环（绝对时间） ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s`);
                logTime = now;
            }

            // 主组绕对角线旋转
            mainGroup.rotation.y = time * 0.3;
            mainGroup.rotation.x = time * 0.16 + Math.sin(time * 0.23) * 0.2;
            mainGroup.rotation.z = Math.cos(time * 0.19) * 0.16;

            // 第二参考线框反向微动
            torusWire2.rotation.y = -time * 0.14;
            torusWire2.rotation.x = -time * 0.08;
            torusWire2.rotation.z = Math.sin(time * 0.21) * 0.12;

            // 相机轻柔游走
            const camX = 1.3 + Math.sin(time * 0.15) * 0.55;
            const camY = 0.65 + Math.cos(time * 0.18) * 0.5;
            const camZ = 7.0 + Math.sin(time * 0.11) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        // ==================== 启动 ====================
        console.log('=== Villarceau圆 · 环面几何交响 ===');
        console.log('Villarceau圆族A:', phiOffsetsA.length, '条');
        console.log('Villarceau圆族B:', phiOffsetsB.length, '条');
        console.log('环面经线:', 10, '条, 纬线:', 5, '条');
        console.log('总线条数:', phiOffsetsA.length + phiOffsetsB.length + 10 + 5 + 6 + 6);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
