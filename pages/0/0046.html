<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摆线编织 · 球极投影族</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>摆线编织 · 球极投影族</h2>
        <div class="sub">Epicycloid · Hypocycloid · Trochoid families on S²</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">外摆线: R=2.4, r=0.8</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">内摆线: R=2.8, r=0.7</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">长幅摆线: R=3.0, r=0.6, d=0.35</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.6, 2.5, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.65;
        const PROJ_D = 2.3;

        // 球极投影（平面→球面）
        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // 平面摆线参数方程
        function epitrochoid(R, r, d, phase, t) {
            const angle = (R / r) * t;
            const x = (R + r) * Math.cos(t) - d * Math.cos(angle + t);
            const y = (R + r) * Math.sin(t) - d * Math.sin(angle + t);
            return { x, y };
        }

        function hypotrochoid(R, r, d, phase, t) {
            const angle = (R / r) * t;
            const x = (R - r) * Math.cos(t) + d * Math.cos(angle - t);
            const y = (R - r) * Math.sin(t) - d * Math.sin(angle - t);
            return { x, y };
        }

        // 创建一个曲线族的球面投影
        function createCycloidFamily(R, r, d, numCurves, color, opacity, tMax, numPoints, isEpi = true) {
            const group = new THREE.Group();
            for (let k = 0; k < numCurves; k++) {
                const phase = k * 2 * Math.PI / numCurves;
                const pts = [];
                const dt = tMax / numPoints;
                for (let i = 0; i <= numPoints; i++) {
                    const t = i * dt + phase;
                    let xy;
                    if (isEpi) {
                        xy = epitrochoid(R, r, d, 0, t);
                    } else {
                        xy = hypotrochoid(R, r, d, 0, t);
                    }
                    const sp = stereographic(xy.x, xy.y);
                    if (sp && sp.length() < 9.5) pts.push(sp);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'cycloid-weave';
        scene.add(rootGroup);

        const tMax = 20 * Math.PI;
        const curvePoints = 600;

        // 金色族：外摆线（d=r为经典摆线），改变r产生多族
        const goldR = 2.4;
        const goldRValues = [0.9, 0.8, 0.72, 0.65, 0.58, 0.52, 0.48, 0.44];
        goldRValues.forEach(r => {
            rootGroup.add(createCycloidFamily(goldR, r, r, 8, COLOR_GOLD, 0.58, tMax, curvePoints, true));
        });

        // 青色族：内摆线，改变r
        const cyanR = 2.8;
        const cyanRValues = [0.7, 0.62, 0.56, 0.50, 0.45, 0.40, 0.36, 0.33];
        cyanRValues.forEach(r => {
            rootGroup.add(createCycloidFamily(cyanR, r, r, 8, COLOR_CYAN, 0.58, tMax, curvePoints, false));
        });

        // 品红族：长幅摆线（d≠r），混合内外
        const magentaR = 3.0;
        const magentaParams = [
            { r: 0.65, d: 0.3, epi: true },
            { r: 0.60, d: 0.35, epi: true },
            { r: 0.55, d: 0.38, epi: true },
            { r: 0.50, d: 0.42, epi: true },
            { r: 0.70, d: 0.32, epi: false },
            { r: 0.65, d: 0.36, epi: false },
            { r: 0.58, d: 0.40, epi: false },
            { r: 0.52, d: 0.45, epi: false },
        ];
        magentaParams.forEach(({ r, d, epi }) => {
            rootGroup.add(createCycloidFamily(magentaR, r, d, 7, COLOR_MAGENTA, 0.56, tMax, curvePoints, epi));
        });

        // 额外密度：更多小圆半径的变体
        const extraGoldR = [0.85, 0.78, 0.70, 0.62, 0.55];
        extraGoldR.forEach(r => {
            rootGroup.add(createCycloidFamily(goldR, r, r * 0.95, 5, COLOR_GOLD, 0.40, tMax * 0.8, Math.floor(curvePoints * 0.8), true));
        });
        const extraCyanR = [0.66, 0.60, 0.54, 0.48, 0.42];
        extraCyanR.forEach(r => {
            rootGroup.add(createCycloidFamily(cyanR, r, r * 0.92, 5, COLOR_CYAN, 0.40, tMax * 0.8, Math.floor(curvePoints * 0.8), false));
        });

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const phi = j * 2 * Math.PI / 240;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const theta = 0.02 + j * Math.PI / 240;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        console.log('摆线编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        scheduleFrame();

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 摆线族球极投影编织动画已稳定运行');
    </script>
</body>
</html>
