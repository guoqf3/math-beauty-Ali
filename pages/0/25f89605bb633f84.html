<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>雪花晶体</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #hint {
            position: fixed;
            bottom: 20px;
            left: 24px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease;
            font-weight: 300;
        }
        #fps-badge {
            position: fixed;
            top: 16px;
            right: 18px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="fps-badge"></div>
    <div id="hint">移动旋转 · 点击呼吸</div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─── 性能与安全检查 ───
            if (!window.PIXI) {
                console.warn('PixiJS 加载失败');
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">需要WebGL支持</div>';
                return;
            }

            // ─── 常量定义 ───
            const FOCAL_LENGTH = 1000;
            const BASE_SCALE = 0.085;
            const AUTO_ROTATE_SPEED = 0.3;
            const VIEW_SENSITIVITY_X = 0.6;
            const VIEW_SENSITIVITY_Y = 0.45;
            const PARTICLE_SPEED_FACTOR = 1.2; // 粒子沿分支流动速度
            const BRANCH_LENGTH = 220;          // 主分支长度
            const SUB_BRANCH_LENGTH = 100;      // 次级分支长度
            const SUB_BRANCH_COUNT = 4;         // 每个主分支上的次级分支数
            const PARTICLES_PER_MAIN = 18;      // 每个主分支粒子数
            const PARTICLES_PER_SUB = 7;        // 每个次级分支粒子数

            // ─── 颜色主题 ───
            const COLOR_THEMES = [
                // 冰晶蓝
                [0x7CD4FF, 0x4D9FFF, 0xB0E0FF, 0x9AD8FF, 0xCCEEFF],
                // 极光紫
                [0xB06BFF, 0x9B4DFF, 0xD9B0FF, 0xC48FFF, 0xE0CCFF],
                // 霜白
                [0xEEEEFF, 0xCCCCFF, 0xDDDDFF, 0xBBCCFF, 0xFFFFFF],
                // 薄荷绿
                [0x6BFFD9, 0x4DFFD9, 0xB0FFEE, 0x8DFFE0, 0xCCFFF5],
                // 粉红冰
                [0xFFB0D9, 0xFF9DCC, 0xFFC8E0, 0xFFBBDD, 0xFFE0F0],
            ];
            let currentThemeIndex = 0;

            // ─── DOM 元素 ───
            const fpsBadge = document.getElementById('fps-badge');
            const hintEl = document.getElementById('hint');

            // ─── PixiJS 应用初始化 ───
            let app;
            try {
                app = new PIXI.Application({
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0x050510,
                    antialias: false,
                    autoDensity: true,
                    resolution: Math.min(window.devicePixelRatio || 1, 2),
                    powerPreference: 'high-performance',
                    forceCanvas: !isWebGLAvailable(),
                });
            } catch (err) {
                console.error('PixiJS 初始化失败:', err);
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">初始化失败</div>';
                return;
            }

            function isWebGLAvailable() {
                try {
                    const canvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext &&
                        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
                } catch (e) { return false; }
            }

            document.body.appendChild(app.view);

            // ─── 创建发光纹理 ───
            function createGlowTexture(size) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const half = size / 2;
                const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
                gradient.addColorStop(0.0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.1, 'rgba(255,255,255,0.95)');
                gradient.addColorStop(0.35, 'rgba(255,255,255,0.6)');
                gradient.addColorStop(0.65, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                const tex = PIXI.Texture.from(c);
                tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
                return tex;
            }

            const glowTex64 = createGlowTexture(64);
            const glowTex128 = createGlowTexture(128);

            // ─── 构建雪花分支线段 ───
            // 返回线段数组 [{x1,y1,z1, x2,y2,z2, length}]
            function buildSnowflakeSegments() {
                const segments = [];
                const mainCount = 6;
                const angleStep = (Math.PI * 2) / mainCount;
                // 主分支
                for (let i = 0; i < mainCount; i++) {
                    const angle = i * angleStep;
                    const dx = Math.cos(angle);
                    const dy = Math.sin(angle);
                    segments.push({
                        x1: 0, y1: 0, z1: 0,
                        x2: dx * BRANCH_LENGTH, y2: dy * BRANCH_LENGTH, z2: 0,
                        length: BRANCH_LENGTH,
                        type: 'main',
                        angle: angle,
                    });
                    // 次级分支：从主分支的1/3到2/3处伸出
                    for (let j = 1; j <= SUB_BRANCH_COUNT; j++) {
                        const t = j / (SUB_BRANCH_COUNT + 1);
                        const sx = dx * BRANCH_LENGTH * t;
                        const sy = dy * BRANCH_LENGTH * t;
                        // 次级分支方向：与主分支夹角约45度，左右各一条
                        const subAngle = angle + Math.PI / 4;
                        const subDx = Math.cos(subAngle);
                        const subDy = Math.sin(subAngle);
                        segments.push({
                            x1: sx, y1: sy, z1: 0,
                            x2: sx + subDx * SUB_BRANCH_LENGTH,
                            y2: sy + subDy * SUB_BRANCH_LENGTH,
                            z2: 0,
                            length: SUB_BRANCH_LENGTH,
                            type: 'sub',
                            angle: angle,
                        });
                        // 另一侧
                        const subAngle2 = angle - Math.PI / 4;
                        const subDx2 = Math.cos(subAngle2);
                        const subDy2 = Math.sin(subAngle2);
                        segments.push({
                            x1: sx, y1: sy, z1: 0,
                            x2: sx + subDx2 * SUB_BRANCH_LENGTH,
                            y2: sy + subDy2 * SUB_BRANCH_LENGTH,
                            z2: 0,
                            length: SUB_BRANCH_LENGTH,
                            type: 'sub',
                            angle: angle,
                        });
                    }
                }
                return segments;
            }

            const segments = buildSnowflakeSegments();
            console.log('雪花线段数:', segments.length);

            // 计算总粒子数
            const mainSegments = segments.filter(s => s.type === 'main');
            const subSegments = segments.filter(s => s.type === 'sub');
            const totalParticles = mainSegments.length * PARTICLES_PER_MAIN + subSegments.length * PARTICLES_PER_SUB;
            console.log('总粒子数:', totalParticles);

            // ─── 粒子容器 ───
            const particleContainer = new PIXI.ParticleContainer(totalParticles, {
                position: true,
                scale: true,
                tint: true,
                alpha: true,
            }, totalParticles, true);
            particleContainer.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(particleContainer);

            // ─── 中心光晕 ───
            const centerGlow = new PIXI.Sprite(glowTex128);
            centerGlow.anchor.set(0.5);
            centerGlow.tint = 0xFFFFFF;
            centerGlow.alpha = 0.3;
            centerGlow.scale.set(1.2);
            centerGlow.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerGlow);

            const centerCore = new PIXI.Sprite(glowTex64);
            centerCore.anchor.set(0.5);
            centerCore.tint = 0xFFFFFF;
            centerCore.alpha = 0.7;
            centerCore.scale.set(0.28);
            centerCore.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerCore);

            // ─── 粒子数据结构 ───
            const sprites = [];
            const particles = [];

            let mouseX = 0;
            let mouseY = 0;
            let smoothMouseX = 0;
            let smoothMouseY = 0;
            let autoRotateY = 0;
            let time = 0;
            let frameCount = 0;
            let fpsLastTime = 0;
            let breathEnergy = 0;

            // ─── 音频上下文 ───
            let audioCtx = null;
            function ensureAudio() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        audioCtx = new AudioContext();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            // 呼吸音效：低频振荡器模拟风声
            function playBreathSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const duration = 0.55;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + duration);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);

                // 第二个振荡器：轻柔的谐波
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(400, now);
                osc2.frequency.exponentialRampToValueAtTime(100, now + duration * 0.7);
                gain2.gain.setValueAtTime(0.12, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.8);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.03);
                osc2.stop(now + duration);
            }

            // ─── 初始化粒子 ───
            function initParticles() {
                for (const seg of segments) {
                    const count = seg.type === 'main' ? PARTICLES_PER_MAIN : PARTICLES_PER_SUB;
                    for (let i = 0; i < count; i++) {
                        const sprite = new PIXI.Sprite(glowTex64);
                        sprite.anchor.set(0.5);
                        const colorIdx = Math.floor(Math.random() * COLOR_THEMES[0].length);
                        sprite.tint = COLOR_THEMES[0][colorIdx];
                        sprite.alpha = 0.8 + Math.random() * 0.2;
                        sprite.scale.set(BASE_SCALE * (0.8 + Math.random() * 0.4));

                        // 粒子相位随机分布
                        const phase = Math.random();
                        const speed = (0.6 + Math.random() * 0.8) * PARTICLE_SPEED_FACTOR;
                        const flowDir = Math.random() > 0.5 ? 1 : -1;
                        const data = {
                            seg: seg,
                            phase: phase,
                            speed: speed * flowDir,
                            colorIdx: colorIdx,
                            baseAlpha: 0.75 + Math.random() * 0.2,
                        };
                        particles.push(data);
                        sprites.push(sprite);
                        particleContainer.addChild(sprite);
                    }
                }
                console.log('粒子初始化完成，数量:', sprites.length);
            }

            // ─── 3D 旋转与投影 ───
            function rotatePoint(x, y, z, viewX, viewY) {
                let cosY = Math.cos(viewY);
                let sinY = Math.sin(viewY);
                let x1 = x * cosY + z * sinY;
                let z1 = -x * sinY + z * cosY;
                let y1 = y;
                let cosX = Math.cos(viewX);
                let sinX = Math.sin(viewX);
                let y2 = y1 * cosX - z1 * sinX;
                let z2 = y1 * sinX + z1 * cosX;
                let x2 = x1;
                return { x: x2, y: y2, z: z2 };
            }

            function projectPoint(p, centerX, centerY) {
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + p.z);
                return {
                    sx: p.x * scale + centerX,
                    sy: p.y * scale + centerY,
                    scale: scale
                };
            }

            // ─── 更新粒子 ───
            function updateParticles(delta, viewX, viewY, centerX, centerY) {
                if (breathEnergy > 0) {
                    breathEnergy = Math.max(0, breathEnergy - delta * 2.5);
                }

                for (let i = 0; i < sprites.length; i++) {
                    const data = particles[i];
                    const sprite = sprites[i];
                    const seg = data.seg;

                    // 更新相位
                    data.phase += data.speed * delta * 0.65;
                    if (data.phase > 1.0) data.phase -= 1.0;
                    if (data.phase < 0.0) data.phase += 1.0;

                    // 在线段上插值
                    const t = data.phase;
                    const x = seg.x1 + (seg.x2 - seg.x1) * t;
                    const y = seg.y1 + (seg.y2 - seg.y1) * t;
                    const z = seg.z1 + (seg.z2 - seg.z1) * t;

                    // 呼吸能量影响：粒子沿线段轻微偏移
                    const breathOffset = breathEnergy > 0 ? breathEnergy * 12 * Math.sin(data.phase * Math.PI * 2 + time * 3) : 0;
                    const rp = rotatePoint(x, y, z + breathOffset, viewX, viewY);
                    const proj = projectPoint(rp, centerX, centerY);

                    const depthFactor = proj.scale;
                    const pulseGlow = 1 + 0.08 * Math.sin(time * 2.5 + i * 0.1) + breathEnergy * 0.4;
                    const alphaMod = 0.85 + 0.15 * Math.sin(time * 2.0 + i * 0.08);

                    sprite.position.set(proj.sx, proj.sy);
                    sprite.scale.set(BASE_SCALE * depthFactor * pulseGlow);
                    sprite.alpha = Math.max(0.05, Math.min(1, data.baseAlpha * depthFactor * alphaMod + breathEnergy * 0.2));
                }
            }

            // ─── 更新中心光晕 ───
            function updateCenterGlow(centerX, centerY) {
                const pulse = 0.25 + 0.1 * Math.sin(time * 1.6) + 0.05 * Math.sin(time * 3.5);
                const breathPulse = breathEnergy > 0 ? breathEnergy * 0.6 : 0;
                centerGlow.position.set(centerX, centerY);
                centerGlow.alpha = Math.max(0.15, Math.min(0.55, pulse + breathPulse));
                centerGlow.scale.set(1.1 + 0.3 * Math.sin(time * 1.2) + breathEnergy * 0.5);
                centerCore.position.set(centerX, centerY);
                centerCore.scale.set(0.26 + 0.05 * Math.sin(time * 2.0) + breathEnergy * 0.2);
                centerCore.alpha = 0.6 + 0.2 * Math.sin(time * 1.5) + breathEnergy * 0.4;
            }

            // ─── 切换颜色主题 ───
            function switchTheme() {
                currentThemeIndex = (currentThemeIndex + 1) % COLOR_THEMES.length;
                const theme = COLOR_THEMES[currentThemeIndex];
                for (let i = 0; i < sprites.length; i++) {
                    const data = particles[i];
                    const color = theme[data.colorIdx % theme.length];
                    sprites[i].tint = color;
                }
                centerCore.tint = theme[0];
                centerGlow.tint = theme[1] || theme[0];
            }

            // ─── 触发呼吸脉冲 ───
            function triggerBreath() {
                breathEnergy = 1.0;
                switchTheme();
                playBreathSound();
            }

            // ─── 主循环 ───
            app.ticker.add((delta) => {
                const dt = Math.min(delta / 60, 0.05);
                time += dt;
                frameCount++;

                const w = window.innerWidth;
                const h = window.innerHeight;
                const cx = w / 2;
                const cy = h / 2;

                smoothMouseX += (mouseX - smoothMouseX) * 0.065;
                smoothMouseY += (mouseY - smoothMouseY) * 0.065;

                autoRotateY += AUTO_ROTATE_SPEED * dt;

                const normX = (smoothMouseX / w) * 2 - 1;
                const normY = (smoothMouseY / h) * 2 - 1;
                const viewY = autoRotateY + normX * VIEW_SENSITIVITY_X;
                const viewX = normY * VIEW_SENSITIVITY_Y;

                updateParticles(dt, viewX, viewY, cx, cy);
                updateCenterGlow(cx, cy);

                if (time - fpsLastTime > 0.5) {
                    const fps = Math.round(frameCount / (time - fpsLastTime));
                    fpsBadge.textContent = fps + ' fps';
                    frameCount = 0;
                    fpsLastTime = time;
                }
            });

            // ─── 交互事件 ───
            function getCanvasCoords(e) {
                const rect = app.view.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function onPointerMove(e) {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
            }

            function onPointerDown(e) {
                e.preventDefault();
                ensureAudio();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
                triggerBreath();
            }

            function onPointerLeave() {
                mouseX = window.innerWidth / 2;
                mouseY = window.innerHeight / 2;
            }

            app.view.addEventListener('mousemove', onPointerMove);
            app.view.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mouseleave', onPointerLeave);

            app.view.addEventListener('touchmove', onPointerMove, { passive: true });
            app.view.addEventListener('touchstart', onPointerDown, { passive: false });

            // ─── 窗口调整 ───
            function handleResize() {
                app.renderer.resize(window.innerWidth, window.innerHeight);
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(handleResize, 300);
            });

            // ─── 键盘交互 ───
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    ensureAudio();
                    triggerBreath();
                }
            });

            // ─── 启动 ───
            initParticles();

            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
            smoothMouseX = mouseX;
            smoothMouseY = mouseY;

            setTimeout(() => {
                if (hintEl) {
                    hintEl.style.opacity = '0';
                    setTimeout(() => {
                        if (hintEl) hintEl.style.display = 'none';
                    }, 1600);
                }
            }, 3200);

            handleResize();
            console.log('✨ 雪花晶体已启动 — 粒子数:', sprites.length);
        })();
    </script>
</body>
</html>
