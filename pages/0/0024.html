<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chladni节点编织 · 振动模干涉网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Chladni节点编织 · 振动模干涉网</h2>
        <div class="sub">Nodal lines of sin(mx)sin(ny)sin(kz)cos(ωt) · Three orthogonal slicing families</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">z‑截面: sin2x·sin3y·cos(ω₁t)=0</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">x‑截面: sin2y·sin3z·cos(ω₂t)=0</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">y‑截面: sin2z·sin3x·cos(ω₃t)=0</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.8, 2.6, 7.4);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.58;
        const RANGE = 3.8;
        const GRID_N = 60;
        const H = 2 * RANGE / GRID_N;
        const SLICES = 15;
        const UPDATE_MS = 120;

        // 三族振动函数
        function chladniGold(x, y, t) { return Math.sin(2 * x) * Math.sin(3 * y) * Math.cos(Math.sqrt(2) * t); }
        function chladniCyan(y, z, t) { return Math.sin(2 * y) * Math.sin(3 * z) * Math.cos(Math.sqrt(3) * t); }
        function chladniMagenta(z, x, t) { return Math.sin(2 * z) * Math.sin(3 * x) * Math.cos(Math.PI * t); }

        function traceZeroSegments(coordType, slicePos, t, fn) {
            const segs = [];
            for (let i = 0; i < GRID_N; i++) {
                const u1 = -RANGE + i * H, u2 = u1 + H;
                for (let j = 0; j < GRID_N; j++) {
                    const v1 = -RANGE + j * H, v2 = v1 + H;
                    let f11, f12, f21, f22;
                    if (coordType === 'z') { f11 = fn(u1, v1, t);
                        f12 = fn(u1, v2, t);
                        f21 = fn(u2, v1, t);
                        f22 = fn(u2, v2, t); } else if (coordType === 'x') { f11 = fn(v1, u1, t);
                        f12 = fn(v2, u1, t);
                        f21 = fn(v1, u2, t);
                        f22 = fn(v2, u2, t); } else { f11 = fn(v1, slicePos, t);
                        f12 = fn(v2, slicePos, t);
                        f21 = fn(v1, slicePos, t);
                        f22 = fn(v2, slicePos, t); }
                    const hp = f11 > 0 || f12 > 0 || f21 > 0 || f22 > 0;
                    const hn = f11 < 0 || f12 < 0 || f21 < 0 || f22 < 0;
                    if (!hp || !hn) continue;
                    const pts = [];
                    if (f11 * f21 < 0) { const r = Math.abs(f11) / (Math.abs(f11) + Math.abs(f21));
                        pts.push([u1 + r * H, v1]); }
                    if (f11 * f12 < 0) { const r = Math.abs(f11) / (Math.abs(f11) + Math.abs(f12));
                        pts.push([u1, v1 + r * H]); }
                    if (f21 * f22 < 0) { const r = Math.abs(f21) / (Math.abs(f21) + Math.abs(f22));
                        pts.push([u2, v1 + r * H]); }
                    if (f12 * f22 < 0) { const r = Math.abs(f12) / (Math.abs(f12) + Math.abs(f22));
                        pts.push([u1 + r * H, v2]); }
                    if (pts.length >= 2) for (let k = 0; k < pts.length - 1; k++) {
                        const [ax, ay] = pts[k],
                            [bx, by] = pts[k + 1];
                        let p1, p2;
                        if (coordType === 'z') { p1 = [ax, ay, slicePos];
                            p2 = [bx, by, slicePos]; } else if (coordType === 'x') { p1 = [slicePos, ax, ay];
                            p2 = [slicePos, bx, by]; } else { p1 = [ax, slicePos, ay];
                            p2 = [bx, slicePos, by]; }
                        segs.push([p1, p2]);
                    }
                }
            }
            return segs;
        }

        const MAX_SEGS = 28000;
        function createSegments(color, opacity) {
            const arr = new Float32Array(MAX_SEGS * 2 * 3);
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
            const m = new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: true, depthTest: true });
            const s = new THREE.LineSegments(g, m);
            s.userData = { arr };
            return s;
        }

        const goldSeg = createSegments(COLOR_GOLD, 0.52);
        const cyanSeg = createSegments(COLOR_CYAN, 0.52);
        const magentaSeg = createSegments(COLOR_MAGENTA, 0.52);

        const rootGroup = new THREE.Group();
        rootGroup.name = 'chladni-weave';
        rootGroup.add(goldSeg);
        rootGroup.add(cyanSeg);
        rootGroup.add(magentaSeg);
        scene.add(rootGroup);

        function updateSegments(seg, coordType, t, fn) {
            const arr = seg.userData.arr;
            let idx = 0;
            for (let s = 0; s < SLICES; s++) {
                const pos = -RANGE + (s + 0.5) * 2 * RANGE / SLICES;
                const segs = traceZeroSegments(coordType, pos, t, fn);
                for (const [p1, p2] of segs) {
                    if (idx + 6 > arr.length) break;
                    const a = new THREE.Vector3(...p1).multiplyScalar(SCALE);
                    const b = new THREE.Vector3(...p2).multiplyScalar(SCALE);
                    if (a.length() < 7 && b.length() < 7) {
                        arr[idx++] = a.x;
                        arr[idx++] = a.y;
                        arr[idx++] = a.z;
                        arr[idx++] = b.x;
                        arr[idx++] = b.y;
                        arr[idx++] = b.z;
                    }
                }
            }
            seg.geometry.setDrawRange(0, idx / 3);
            seg.geometry.attributes.position.needsUpdate = true;
        }

        // 立方体边框
        const box = new THREE.BoxGeometry(RANGE * SCALE * 2, RANGE * SCALE * 2, RANGE * SCALE * 2);
        rootGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(box), new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.14, depthWrite: true, depthTest: true
        })));

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const sc = 500;
        const sp = new Float32Array(sc * 3);
        for (let i = 0; i < sc; i++) {
            const th = Math.random() * Math.PI * 2,
                ph = Math.acos(2 * Math.random() - 1),
                d = 6.5 + Math.random() * 10;
            sp[i * 3] = d * Math.sin(ph) * Math.cos(th);
            sp[i * 3 + 1] = d * Math.sin(ph) * Math.sin(th);
            sp[i * 3 + 2] = d * Math.cos(ph);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(sp, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        })));
        scene.add(starsGroup);

        console.log('Chladni节点编织已就绪');

        let lastUpdate = -10,
            animId;
        function loop() {
            const t = getElapsed();
            if (t - lastUpdate > UPDATE_MS / 1000) {
                try {
                    updateSegments(goldSeg, 'z', t, chladniGold);
                    updateSegments(cyanSeg, 'x', t, chladniCyan);
                    updateSegments(magentaSeg, 'y', t, chladniMagenta);
                    lastUpdate = t;
                } catch (e) { console.warn(e); }
            }
            rootGroup.rotation.x = t * 0.12;
            rootGroup.rotation.y = t * 0.19;
            rootGroup.rotation.z = t * 0.07;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;
            const cr = 7.5,
                ca = t * 0.08,
                ch = 2.7 + Math.sin(t * 0.16) * 0.7;
            camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        function schedule() {
            animId = requestAnimationFrame(() => { try { loop(); } catch (e) { console.warn(e); } schedule(); });
        }
        const backup = setInterval(() => { if (animId !== undefined) { cancelAnimationFrame(animId);
                schedule(); } }, 3000);
        updateSegments(goldSeg, 'z', 0, chladniGold);
        updateSegments(cyanSeg, 'x', 0, chladniCyan);
        updateSegments(magentaSeg, 'y', 0, chladniMagenta);
        renderer.render(scene, camera);
        schedule();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }, 120));
        console.log('✅ Chladni振动模节点编织动画已稳定运行');
    </script>
</body>
</html>
