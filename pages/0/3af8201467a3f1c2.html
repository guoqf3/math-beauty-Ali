<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲螺旋编织 · 球面调和调制</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>双曲螺旋编织 · 球面调和调制</h2>
        <div class="sub">Hyperbolic spiral · Spherical harmonic modulation · Tri‑color braiding</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">r₁=a/θ, θ∈[θ₀,θ₁], Δφ=ω₁θ</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">r₂=b/(θ+π), Δφ=ω₂θ+δ</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">r₃=c/(θ+2π), Yₗᵐ调制</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.2, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;

        // 球极投影（平面→球面）
        function stereographic(px, py, projD = 2.2) {
            const denom = px * px + py * py + projD * projD;
            return new THREE.Vector3(
                2 * projD * px / denom,
                2 * projD * py / denom,
                (px * px + py * py - projD * projD) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // 球面上的点（经纬度→笛卡尔）
        function spherePoint(theta, phi) {
            const st = Math.sin(theta);
            return new THREE.Vector3(
                SPHERE_R * st * Math.cos(phi),
                SPHERE_R * Math.cos(theta),
                SPHERE_R * st * Math.sin(phi)
            );
        }

        // 生成一族双曲螺线（在平面上），然后投影到球面
        function createHyperbolicSpiralFamily(params, color, opacity, numSpirals, steps) {
            const group = new THREE.Group();
            const { a, b, omega, phaseOffset, thetaMin, thetaMax } = params;

            for (let k = 0; k < numSpirals; k++) {
                const phi0 = k * 2 * Math.PI / numSpirals + phaseOffset;
                const pts = [];
                const dTheta = (thetaMax - thetaMin) / steps;

                for (let i = 0; i <= steps; i++) {
                    const theta = thetaMin + i * dTheta;
                    // 双曲螺线：ρ = a/(θ + b)
                    const rho = a / (theta + b);
                    // 角度随 theta 线性增加，但带有调制
                    const phi = omega * theta + phi0 + 0.15 * Math.sin(2.5 * theta + phi0);
                    // 转换为笛卡尔坐标
                    const px = rho * Math.cos(phi);
                    const py = rho * Math.sin(phi);
                    // 球极投影到球面
                    const sp = stereographic(px, py);
                    if (sp && sp.length() < 9.0) pts.push(sp);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity,
                        depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 生成球面上直接定义的正交曲线族（纬线方向螺旋与经线方向螺旋）
        function createSphericalBraid(params, color, opacity, numCurves, steps) {
            const group = new THREE.Group();
            const { freqTheta, freqPhi, modAmp, modFreq } = params;

            for (let k = 0; k < numCurves; k++) {
                const phase = k * 2 * Math.PI / numCurves;
                const pts = [];
                const tMax = 6 * Math.PI;
                const dt = tMax / steps;

                for (let i = 0; i <= steps; i++) {
                    const t = i * dt;
                    // 球面坐标：θ从近北极到近南极，φ绕行多圈
                    const theta = 0.08 + (Math.PI - 0.16) * (t / tMax);
                    const phi = freqPhi * t + phase + modAmp * Math.sin(modFreq * t + phase);
                    // 添加波动调制到θ
                    const thetaMod = theta + 0.12 * Math.cos(freqTheta * t + phase * 2.3);
                    const clampedTheta = Math.max(0.02, Math.min(Math.PI - 0.02, thetaMod));
                    pts.push(spherePoint(clampedTheta, phi));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity,
                        depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'hyperbolic-braid';
        scene.add(rootGroup);

        const steps = 500;
        const spiralCount = 28;

        // 金色族：平面双曲螺线，投影到球面
        rootGroup.add(createHyperbolicSpiralFamily({
            a: 1.8, b: 0.15, omega: 3.2, phaseOffset: 0, thetaMin: 0.18, thetaMax: 5.5
        }, COLOR_GOLD, 0.62, spiralCount, steps));

        rootGroup.add(createHyperbolicSpiralFamily({
            a: 2.0, b: 0.25, omega: 2.8, phaseOffset: 1.0, thetaMin: 0.2, thetaMax: 5.2
        }, COLOR_GOLD, 0.55, Math.floor(spiralCount * 0.7), steps));

        // 青色族：不同参数的双曲螺线
        rootGroup.add(createHyperbolicSpiralFamily({
            a: 1.6, b: 0.35, omega: 3.8, phaseOffset: 2.0, thetaMin: 0.22, thetaMax: 5.8
        }, COLOR_CYAN, 0.62, spiralCount, steps));

        rootGroup.add(createHyperbolicSpiralFamily({
            a: 1.9, b: 0.20, omega: 3.0, phaseOffset: 0.7, thetaMin: 0.19, thetaMax: 5.3
        }, COLOR_CYAN, 0.55, Math.floor(spiralCount * 0.7), steps));

        // 品红族：球面直接定义的螺旋编织
        rootGroup.add(createSphericalBraid({
            freqTheta: 3.5, freqPhi: 2.8, modAmp: 0.35, modFreq: 2.2
        }, COLOR_MAGENTA, 0.62, 26, 520));

        rootGroup.add(createSphericalBraid({
            freqTheta: 2.9, freqPhi: 3.5, modAmp: 0.40, modFreq: 1.8
        }, COLOR_MAGENTA, 0.55, 22, 500));

        // 额外交叉编织：平面阿基米德螺线投影
        function createArchimedeanSpiralFamily(color, opacity, count, steps) {
            const group = new THREE.Group();
            for (let k = 0; k < count; k++) {
                const phi0 = k * 2 * Math.PI / count;
                const pts = [];
                const thetaMax = 7 * Math.PI;
                const dTheta = thetaMax / steps;
                for (let i = 0; i <= steps; i++) {
                    const theta = 0.05 + i * dTheta;
                    const rho = 0.25 * theta;
                    const phi = 1.6 * theta + phi0;
                    const px = rho * Math.cos(phi);
                    const py = rho * Math.sin(phi);
                    const sp = stereographic(px, py);
                    if (sp && sp.length() < 8.5) pts.push(sp);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity,
                        depthWrite: true, depthTest: true,
                    })));
                }
            }
            return group;
        }
        rootGroup.add(createArchimedeanSpiralFamily(COLOR_GOLD, 0.45, 18, 480));
        rootGroup.add(createArchimedeanSpiralFamily(COLOR_CYAN, 0.42, 16, 460));
        rootGroup.add(createArchimedeanSpiralFamily(COLOR_MAGENTA, 0.40, 14, 440));

        // 辅助球面参考网格（极淡）
        for (let i = 0; i < 8; i++) {
            const lat = (i + 0.5) * Math.PI / 8;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.09, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 6; k++) {
            const phi = k * Math.PI / 3;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }

        console.log('双曲螺旋编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.5, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.5;
            const camAngle = t * 0.08;
            const camHeight = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        // 预渲染首帧，确保立即显示
        renderer.render(scene, camera);
        scheduleFrame();

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 双曲螺旋编织动画已稳定运行');
    </script>
</body>
</html>
