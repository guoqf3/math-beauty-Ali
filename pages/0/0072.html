<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等势射线正交网 · 复动力学编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>等势射线正交网 · 复动力学编织</h2>
        <div class="sub">Böttcher external rays · Equipotential lines · Julia set foils</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">c₁=−0.6+0.5i</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">c₂=0.3+0.55i</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">c₃=−0.1−0.75i</span>
            <span class="formula-sep">‖</span>
            f(z)=z²+c
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.2, 2.0, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.6;
        const PROJ_D = 2.2;
        const INITIAL_R = 2.4;
        const INV_STEPS = 18;
        const ANGLE_COUNT = 40;

        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // 复平方根（选择辐角连续的分支）
        function complexSqrt(re, im, preferAngle) {
            const mod = Math.sqrt(Math.sqrt(re * re + im * im));
            let halfAngle = Math.atan2(im, re) * 0.5;
            // 选择与preferAngle最接近的分支（±π）
            const alt = halfAngle + Math.PI;
            if (preferAngle !== undefined) {
                const d1 = Math.abs(halfAngle - preferAngle);
                const d2 = Math.abs(alt - preferAngle);
                if (d2 < d1) halfAngle = alt;
            }
            return { re: mod * Math.cos(halfAngle), im: mod * Math.sin(halfAngle), angle: halfAngle };
        }

        // 生成外部射线与等势线
        function generateOrthogonalNet(cRe, cIm, color, opacityRays, opacityEqui) {
            const rayGroup = new THREE.Group();
            const equiGroup = new THREE.Group();

            // points[k][j]: 第k次逆迭代后，第j个角度
            const points = [];
            const angles = [];
            for (let j = 0; j < ANGLE_COUNT; j++) {
                const theta = j * 2 * Math.PI / ANGLE_COUNT;
                angles.push(theta);
            }

            // 初始点（大半径圆）
            const row0 = [];
            for (let j = 0; j < ANGLE_COUNT; j++) {
                const theta = angles[j];
                const zRe = INITIAL_R * Math.cos(theta);
                const zIm = INITIAL_R * Math.sin(theta);
                row0.push({ re: zRe, im: zIm, angle: theta });
            }
            points.push(row0);

            // 逆迭代
            for (let k = 1; k <= INV_STEPS; k++) {
                const prevRow = points[k - 1];
                const curRow = [];
                for (let j = 0; j < ANGLE_COUNT; j++) {
                    const prev = prevRow[j];
                    const wRe = prev.re - cRe;
                    const wIm = prev.im - cIm;
                    const sqrtResult = complexSqrt(wRe, wIm, prev.angle !== undefined ? prev.angle * 0.5 : undefined);
                    curRow.push(sqrtResult);
                }
                points.push(curRow);
            }

            // 构建外部射线（沿角度方向）
            for (let j = 0; j < ANGLE_COUNT; j++) {
                const pts3D = [];
                for (let k = 0; k <= INV_STEPS; k++) {
                    const p = points[k][j];
                    const sp = stereographic(p.re, p.im);
                    if (sp) pts3D.push(sp);
                }
                if (pts3D.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts3D);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: opacityRays,
                        depthWrite: true, depthTest: true,
                    });
                    rayGroup.add(new THREE.Line(geom, mat));
                }
            }

            // 构建等势线（沿层级方向）
            for (let k = 0; k <= INV_STEPS; k++) {
                const pts3D = [];
                const row = points[k];
                for (let j = 0; j <= ANGLE_COUNT; j++) {
                    const p = row[j % ANGLE_COUNT];
                    const sp = stereographic(p.re, p.im);
                    if (sp) pts3D.push(sp);
                }
                // 闭合曲线
                if (pts3D.length >= 2) {
                    pts3D.push(pts3D[0].clone());
                    const geom = new THREE.BufferGeometry().setFromPoints(pts3D);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: opacityEqui,
                        depthWrite: true, depthTest: true,
                    });
                    equiGroup.add(new THREE.Line(geom, mat));
                }
            }

            const combined = new THREE.Group();
            combined.add(rayGroup);
            combined.add(equiGroup);
            return combined;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'orthogonal-net';
        scene.add(rootGroup);

        // 三个c值，对应三种颜色
        const cConfigs = [
            { cRe: -0.6, cIm: 0.5, col: COLOR_GOLD, opR: 0.58, opE: 0.42 },
            { cRe: 0.3, cIm: 0.55, col: COLOR_CYAN, opR: 0.58, opE: 0.42 },
            { cRe: -0.1, cIm: -0.75, col: COLOR_MAGENTA, opR: 0.58, opE: 0.42 },
        ];

        cConfigs.forEach(({ cRe, cIm, col, opR, opE }) => {
            rootGroup.add(generateOrthogonalNet(cRe, cIm, col, opR, opE));
        });

        // 辅助球面参考线
        for (let i = 0; i < 6; i++) {
            const lat = (i + 0.5) * Math.PI / 6;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.10, depthWrite: true, depthTest: true
            })));
        }

        console.log('正交网线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.5, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.23;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.1 + Math.sin(t * 0.15) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 等势射线正交网动画已稳定运行');
    </script>
</body>
</html>
