<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锥面等角螺线 · 恒倾角编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>锥面等角螺线 · 恒倾角编织</h2>
        <div class="sub">Conical loxodromes · Constant‑angle spirals on a cone</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">母线: θ=const</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">纬线: s=const</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">等角螺线: s = s₀·exp((θ−θ₀)cotα·sinβ)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 21);
        camera.position.set(3.2, 3.0, 7.0);
        camera.lookAt(0, 0.5, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const BETA = Math.PI / 7;
        const SINB = Math.sin(BETA);
        const COSB = Math.cos(BETA);
        const S_MIN = 0.12;
        const S_MAX = 3.4;
        const SCALE = 0.85;

        // 锥面点
        function conePoint(s, theta) {
            const r = s * SINB;
            return new THREE.Vector3(r * Math.cos(theta), s * COSB * SCALE, r * Math.sin(theta)).multiplyScalar(SCALE);
        }

        // 金色母线：固定θ
        function createGenerators(thetaCount, color, opacity, numPoints) {
            const group = new THREE.Group();
            for (let k = 0; k < thetaCount; k++) {
                const theta = k * 2 * Math.PI / thetaCount;
                const pts = [];
                const ds = (S_MAX - S_MIN) / numPoints;
                for (let i = 0; i <= numPoints; i++) {
                    const s = S_MIN + i * ds;
                    pts.push(conePoint(s, theta));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // 青色纬线：固定s
        function createParallels(sCount, color, opacity, numPoints) {
            const group = new THREE.Group();
            for (let k = 0; k < sCount; k++) {
                const s = S_MIN + k * (S_MAX - S_MIN) / (sCount - 1);
                const pts = [];
                const dTheta = 2 * Math.PI / numPoints;
                for (let i = 0; i <= numPoints; i++) {
                    const theta = i * dTheta;
                    pts.push(conePoint(s, theta));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // 品红等角螺线：s = s₀·exp((θ-θ₀)·cot(α)·sinβ)
        function createLoxodromes(alphaValues, s0Values, color, opacity, numPoints) {
            const group = new THREE.Group();
            const thetaMax = 5 * Math.PI;
            for (const alpha of alphaValues) {
                const cotAlpha = 1 / Math.tan(alpha);
                const k = cotAlpha * SINB;
                for (const s0 of s0Values) {
                    const pts = [];
                    const dTheta = thetaMax / numPoints;
                    for (let i = 0; i <= numPoints; i++) {
                        const theta = i * dTheta;
                        const s = s0 * Math.exp(k * theta);
                        if (s >= S_MIN && s <= S_MAX) {
                            pts.push(conePoint(s, theta));
                        }
                    }
                    if (pts.length >= 2) {
                        const geom = new THREE.BufferGeometry().setFromPoints(pts);
                        group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                            color, transparent: true, opacity, depthWrite: true, depthTest: true
                        })));
                    }
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'conical-loxodromes';
        scene.add(rootGroup);

        const ptCount = 320;

        // 金色母线：24条
        rootGroup.add(createGenerators(24, COLOR_GOLD, 0.62, ptCount));
        rootGroup.add(createGenerators(14, COLOR_GOLD, 0.42, ptCount));

        // 青色纬线：26条
        rootGroup.add(createParallels(26, COLOR_CYAN, 0.60, ptCount));
        rootGroup.add(createParallels(15, COLOR_CYAN, 0.38, ptCount));

        // 品红等角螺线：多个倾斜角和初始半径
        const alphaValues = [Math.PI/6, Math.PI/4, Math.PI/3, Math.PI/5, Math.PI/2.5, Math.PI/3.5];
        const s0Values = [0.15, 0.25, 0.40, 0.55, 0.75, 1.0, 1.3, 1.7, 2.2];
        rootGroup.add(createLoxodromes(alphaValues, s0Values, COLOR_MAGENTA, 0.58, 550));
        // 反向缠绕的螺线
        const alphaRev = alphaValues.map(a => Math.PI - a);
        rootGroup.add(createLoxodromes(alphaRev, s0Values.map(s => s * 0.8), COLOR_MAGENTA, 0.45, 480));

        // 锥顶标记（微小圆环）
        const apexRingGeom = new THREE.TorusGeometry(0.06, 0.015, 8, 24);
        const apexRing = new THREE.Mesh(apexRingGeom, new THREE.MeshBasicMaterial({ color: 0x807060 }));
        apexRing.position.set(0, 0, 0);
        rootGroup.add(apexRing);

        console.log('锥面等角螺线编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.y = t * 0.28;
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.z = t * 0.09;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.2;
            const camAngle = t * 0.09;
            const camHeight = 3.1 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0.5 * SCALE, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 锥面等角螺线恒倾角编织动画已稳定运行');
    </script>
</body>
</html>
