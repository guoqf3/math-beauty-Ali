<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面正交弦网络 · 笛卡尔空间弦</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.46rem, 0.82vw, 0.62rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.72); padding: 10px 24px; border-radius: 34px;
            border: 1px solid rgba(175,155,135,0.18);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.36rem, 0.68vw, 0.54rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">球面正交弦网络 · 笛卡尔空间弦</div>
        <div class="subtitle">ORTHOGONAL CHORD NETWORK &nbsp;·&nbsp; CARTESIAN GRID WITHIN A SPHERE</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">𝒞ₓ:</span> {(x₀, y, z) | y²+z²=R²−x₀²} &nbsp;
            <span class="c2">𝒞ᵧ:</span> {(x, y₀, z) | x²+z²=R²−y₀²} &nbsp;
            <span class="c3">𝒞₂:</span> {(x, y, z₀) | x²+y²=R²−z₀²}
            <br>
            <span style="color:#9aa8b8;">R=2.6 &nbsp;|&nbsp; 步长0.40 &nbsp;|&nbsp; x₀,y₀,z₀∈[−2.4,2.4] &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 22);

        const camera = new THREE.PerspectiveCamera(
            50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 25
        );
        camera.position.set(0.9, 0.45, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 常量 ====================
        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_REF = '#3a4a5c', C_GLINT = '#8898aa';
        const R = 2.6;
        const R2 = R * R;
        const STEP = 0.40;
        const MAX_VAL = 2.4;
        const CIRCLE_SAMPLES = 240;

        const gridVals = [];
        for (let v = -MAX_VAL; v <= MAX_VAL + 0.001; v += STEP) {
            gridVals.push(parseFloat(v.toFixed(10)));
        }

        // ==================== 生成圆 ====================
        function generateCircleGroup(axis) {
            const group = new THREE.Group();
            for (const val of gridVals) {
                const r2 = R2 - val * val;
                if (r2 <= 0.005) continue;
                const r = Math.sqrt(r2);
                const pts = [];
                for (let i = 0; i <= CIRCLE_SAMPLES; i++) {
                    const angle = (i / CIRCLE_SAMPLES) * Math.PI * 2;
                    let pt;
                    if (axis === 'x') {
                        pt = new THREE.Vector3(val, r * Math.cos(angle), r * Math.sin(angle));
                    } else if (axis === 'y') {
                        pt = new THREE.Vector3(r * Math.cos(angle), val, r * Math.sin(angle));
                    } else {
                        pt = new THREE.Vector3(r * Math.cos(angle), r * Math.sin(angle), val);
                    }
                    pts.push(pt);
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const color = axis === 'x' ? C1 : (axis === 'y' ? C2 : C3);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(color),
                    transparent: true, opacity: 0.65, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        console.log('生成X方向圆族...');
        const groupX = generateCircleGroup('x');
        console.log('生成Y方向圆族...');
        const groupY = generateCircleGroup('y');
        console.log('生成Z方向圆族...');
        const groupZ = generateCircleGroup('z');
        console.log('X圆:', groupX.children.length, 'Y圆:', groupY.children.length, 'Z圆:', groupZ.children.length);

        const mainGroup = new THREE.Group();
        mainGroup.add(groupX);
        mainGroup.add(groupY);
        mainGroup.add(groupZ);
        scene.add(mainGroup);

        // ==================== 球面与坐标轴 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 200;
            const gen = (f) => {
                const pts = [];
                for (let i = 0; i <= segs; i++) pts.push(f((i / segs) * Math.PI * 2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(colorHex), transparent: true, opacity: opacity, depthWrite: true });
                group.add(new THREE.Line(geom, mat));
            };
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
            gen((a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius));

            const addLat = (zVal) => {
                const r = Math.sqrt(Math.max(0.001, radius * radius - zVal * zVal));
                const pts = [];
                for (let i = 0; i <= segs; i++) {
                    const a = (i / segs) * Math.PI * 2;
                    pts.push(new THREE.Vector3(Math.cos(a) * r, zVal, Math.sin(a) * r));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(colorHex), transparent: true, opacity: opacity * 0.65, depthWrite: true });
                group.add(new THREE.Line(geom, mat));
            };
            addLat(radius * 0.52);
            addLat(-radius * 0.52);
            return group;
        }
        const sphereRef = createSphereWireframe(R, C_REF, 0.26);
        scene.add(sphereRef);

        function createAxisLines() {
            const group = new THREE.Group();
            const d = R + 0.3;
            const addAxis = (p1, p2, color) => {
                const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(color), transparent: true, opacity: 0.5, depthWrite: true });
                group.add(new THREE.Line(geom, mat));
            };
            addAxis(new THREE.Vector3(-d, 0, 0), new THREE.Vector3(d, 0, 0), C1);
            addAxis(new THREE.Vector3(0, -d, 0), new THREE.Vector3(0, d, 0), C2);
            addAxis(new THREE.Vector3(0, 0, -d), new THREE.Vector3(0, 0, d), C3);
            return group;
        }
        const axisLines = createAxisLines();
        mainGroup.add(axisLines);

        // ==================== 光点 ====================
        function createGlints(radius, colorHex, sz) {
            const group = new THREE.Group();
            const axes = [[radius,0,0],[-radius,0,0],[0,radius,0],[0,-radius,0],[0,0,radius],[0,0,-radius]];
            axes.forEach(([ax,ay,az]) => {
                const pt = new THREE.Vector3(ax, ay, az);
                [[-sz,0,0],[sz,0,0],[0,-sz,0],[0,sz,0],[0,0,-sz],[0,0,sz]].forEach(([dx,dy,dz]) => {
                    const g = new THREE.BufferGeometry().setFromPoints([pt.clone().add(new THREE.Vector3(dx,dy,dz)), pt]);
                    const m = new THREE.LineBasicMaterial({ color: new THREE.Color(colorHex), transparent:true, opacity:0.6, depthWrite:true });
                    group.add(new THREE.Line(g, m));
                });
            });
            return group;
        }
        mainGroup.add(createGlints(R, C_GLINT, 0.06));

        (() => {
            const sz = 0.08;
            const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-sz,0,0),new THREE.Vector3(sz,0,0),new THREE.Vector3(0,-sz,0),new THREE.Vector3(0,sz,0),new THREE.Vector3(0,0,-sz),new THREE.Vector3(0,0,sz)]);
            const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent:true, opacity:0.8, depthWrite:true });
            scene.add(new THREE.LineSegments(g, m));
        })();

        // ==================== 动画循环（绝对时间） ====================
        const startTime = performance.now();
        let frameCount = 0;
        let currentTime = 0;
        const totalCircles = groupX.children.length + groupY.children.length + groupZ.children.length;

        function animate(now) {
            requestAnimationFrame(animate);
            const elapsed = (now - startTime) / 1000;
            if (elapsed <= 0) { renderer.render(scene, camera); return; }
            currentTime = elapsed;
            frameCount++;
            if (frameCount === 1 || frameCount % 150 === 0) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${currentTime.toFixed(2)}s 圆:${totalCircles}`);
            }

            mainGroup.rotation.y = currentTime * 0.28;
            mainGroup.rotation.x = currentTime * 0.15 + Math.sin(currentTime * 0.24) * 0.2;
            mainGroup.rotation.z = Math.cos(currentTime * 0.19) * 0.12;
            sphereRef.rotation.copy(mainGroup.rotation);

            const camX = 0.9 + Math.sin(currentTime * 0.14) * 0.55;
            const camY = 0.45 + Math.cos(currentTime * 0.17) * 0.48;
            camera.position.set(camX, camY, 7.2);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== 球面正交弦网络 · 笛卡尔空间弦 ===');
        console.log('X圆(暖金):', groupX.children.length, 'Y圆(冰蓝):', groupY.children.length, 'Z圆(玫瑰粉):', groupZ.children.length);
        console.log('总圆数:', totalCircles);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
