<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环面测地线族 · 三维编织曲面线网</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.85vw, 0.64rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.18);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.36rem, 0.68vw, 0.54rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">环面测地线族 · 三维编织曲面线网</div>
        <div class="subtitle">TORUS GEODESIC FAMILIES &nbsp;·&nbsp; MERIDIAN · PARALLEL · SKEW</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">经线:</span> φ=const, θ∈[0,2π] &nbsp;
            <span class="c2">纬线:</span> θ=const, φ∈[0,2π] &nbsp;
            <span class="c3">斜线:</span> θ=t, φ=k·t (k=√2/2)
            <br>
            <span style="color:#9aa8b8;">R=2.2, r=0.8 &nbsp;|&nbsp; 每族24条 &nbsp;|&nbsp; 环面测地线 &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 9, 22);

        const camera = new THREE.PerspectiveCamera(
            50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 25
        );
        camera.position.set(1.4, 0.8, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_SPHERE = '#3a4a5c', C_GLINT = '#8898aa';

        const RT = 2.2, Rr = 0.8; // 环面参数
        const NUM = 24; // 每族线条数
        const SAMPLES = 320;

        // 环面参数化
        function torusPoint(theta, phi) {
            const cosP = Math.cos(phi), sinP = Math.sin(phi);
            const cosT = Math.cos(theta), sinT = Math.sin(theta);
            const rr = RT + Rr * cosT;
            return new THREE.Vector3(
                rr * cosP,
                rr * sinP,
                Rr * sinT
            );
        }

        // 经线：固定φ，θ从0到2π
        function meridians(num) {
            const curves = [];
            for (let k = 0; k < num; k++) {
                const phi = (k / num) * Math.PI * 2;
                const pts = [];
                for (let i = 0; i <= SAMPLES; i++) {
                    const theta = (i / SAMPLES) * Math.PI * 2;
                    pts.push(torusPoint(theta, phi));
                }
                curves.push(pts);
            }
            return curves;
        }

        // 纬线：固定θ，φ从0到2π
        function parallels(num) {
            const curves = [];
            for (let k = 0; k < num; k++) {
                const theta = (k / num) * Math.PI * 2;
                const pts = [];
                for (let i = 0; i <= SAMPLES; i++) {
                    const phi = (i / SAMPLES) * Math.PI * 2;
                    pts.push(torusPoint(theta, phi));
                }
                curves.push(pts);
            }
            return curves;
        }

        // 斜测地线：θ=t, φ=k*t，其中k为无理数近似√2/2使曲线不闭合
        function skewGeodesics(num) {
            const curves = [];
            const k = Math.sqrt(2) / 2; // 无理数比值
            for (let n = 0; n < num; n++) {
                const phase = (n / num) * Math.PI * 2;
                const pts = [];
                const tMax = Math.PI * 2 * 14; // 足够多圈
                for (let i = 0; i <= SAMPLES; i++) {
                    const t = (i / SAMPLES) * tMax;
                    const theta = t + phase;
                    const phi = k * t;
                    pts.push(torusPoint(theta, phi));
                }
                curves.push(pts);
            }
            return curves;
        }

        const mCurves = meridians(NUM);
        const pCurves = parallels(NUM);
        const sCurves = skewGeodesics(NUM);
        console.log('经线:', mCurves.length, '纬线:', pCurves.length, '斜线:', sCurves.length);

        function createGroup(curves, color, opacity) {
            const group = new THREE.Group();
            for (const pts of curves) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(color),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const mGroup = createGroup(mCurves, C1, 0.6);
        const pGroup = createGroup(pCurves, C2, 0.57);
        const sGroup = createGroup(sCurves, C3, 0.5);
        const mainGroup = new THREE.Group();
        mainGroup.add(mGroup);
        mainGroup.add(pGroup);
        mainGroup.add(sGroup);
        scene.add(mainGroup);

        // 参考球面线框
        function createSphereWireframe(radius, color, opacity) {
            const group = new THREE.Group();
            const segs = 170;
            const gen = (f) => {
                const pts = [];
                for (let i=0; i<=segs; i++) pts.push(f(i/segs*Math.PI*2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(color),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            };
            gen((a)=>new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0));
            gen((a)=>new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
            gen((a)=>new THREE.Vector3(0, Math.cos(a)*radius, Math.sin(a)*radius));
            gen((a)=>{ const r=Math.sqrt(radius*radius-(radius*0.48)**2); return new THREE.Vector3(Math.cos(a)*r, radius*0.48, Math.sin(a)*r); });
            gen((a)=>{ const r=Math.sqrt(radius*radius-(radius*0.48)**2); return new THREE.Vector3(Math.cos(a)*r, -radius*0.48, Math.sin(a)*r); });
            return group;
        }
        const sphereRef = createSphereWireframe(RT + Rr + 0.25, C_SPHERE, 0.22);
        scene.add(sphereRef);

        // 轴端点光点
        (()=>{
            const sz = 0.06;
            const arr = [[RT+Rr+0.25,0,0],[-RT-Rr-0.25,0,0],[0,RT+Rr+0.25,0],[0,-RT-Rr-0.25,0],[0,0,RT+Rr+0.25],[0,0,-RT-Rr-0.25]];
            arr.forEach(p=>{
                const pt = new THREE.Vector3(p[0],p[1],p[2]);
                [[-sz,0,0],[sz,0,0],[0,-sz,0],[0,sz,0],[0,0,-sz],[0,0,sz]].forEach(([dx,dy,dz])=>{
                    const g = new THREE.BufferGeometry().setFromPoints([pt.clone().add(new THREE.Vector3(dx,dy,dz)), pt]);
                    const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent:true, opacity:0.5, depthWrite:true });
                    mainGroup.add(new THREE.Line(g,m));
                });
            });
        })();

        // 原点光点
        (()=>{
            const sz = 0.08;
            const g = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0),
                new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0),
                new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)
            ]);
            const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent:true, opacity:0.7, depthWrite:true });
            scene.add(new THREE.LineSegments(g,m));
        })();

        // 环面内外圆参考线
        (()=>{
            const rr = RT - Rr;
            const rR = RT + Rr;
            const segs = 180;
            const gen = (r, z) => {
                const pts = [];
                for (let i=0; i<=segs; i++) {
                    const a = (i/segs)*Math.PI*2;
                    pts.push(new THREE.Vector3(Math.cos(a)*r, Math.sin(a)*r, z));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(C_SPHERE), transparent:true, opacity:0.35, depthWrite:true });
                return new THREE.Line(geom, mat);
            };
            mainGroup.add(gen(rr, 0));
            mainGroup.add(gen(rR, 0));
            mainGroup.add(gen(RT, Rr));
            mainGroup.add(gen(RT, -Rr));
        })();

        let time = 0, lastTime = performance.now(), frameCount = 0;
        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime)/1000;
            if (delta <=0 || delta>0.5) delta=0.016;
            lastTime = now;
            time += delta;
            frameCount++;

            mainGroup.rotation.y = time * 0.28;
            mainGroup.rotation.x = time * 0.14 + Math.sin(time*0.23)*0.2;
            mainGroup.rotation.z = Math.cos(time*0.18)*0.12;
            sphereRef.rotation.copy(mainGroup.rotation);

            camera.position.set(
                1.4 + Math.sin(time*0.14)*0.5,
                0.8 + Math.cos(time*0.17)*0.45,
                7.2 + Math.sin(time*0.11)*0.45
            );
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', ()=>{
            const w = container.clientWidth, h = Math.max(container.clientHeight,1);
            camera.aspect = w/h;
            camera.updateProjectionMatrix();
            renderer.setSize(w,h);
        });

        console.log('=== 环面测地线族 · 三维编织曲面线网 ===');
        console.log('总曲线数:', NUM*3);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
