<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复对数螺线 · 黎曼曲面分支</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg,
                    rgba(6, 6, 12, 0.95) 0%,
                    rgba(6, 6, 12, 0.8) 55%,
                    rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg,
                    rgba(6, 6, 12, 0.95) 0%,
                    rgba(6, 6, 12, 0.82) 55%,
                    rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold {
            color: #d4a843;
            font-style: normal;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-style: normal;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-style: normal;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>复对数螺线 · 黎曼曲面分支</h2>
        <div class="sub">Complex power map · Logarithmic spirals · Riemann sheets</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">等温网: |z|<sup>α</sup> = const</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">对数螺线: arg(z) = β ln|z|</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">多叶覆盖: w = z<sup>p/q</sup></span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 25);
        camera.position.set(3.2, 2.5, 8.0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——彻底杜绝暂停
        let startTime = performance.now();
        let elapsed = 0;
        function tick() {
            elapsed = (performance.now() - startTime) * 0.001;
            return elapsed;
        }

        // 颜色
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        const SCALE = 1.0;
        const MAX_R = 3.8;

        // ---- 复幂函数映射 w = z^α 的多叶构造 ----
        // 在圆柱坐标 (r, θ, sheet) 中嵌入3D空间
        // 叶片参数：z平面上的点 (x,y) 映射到3D曲面上的点，不同叶片具有不同的z偏移
        function complexPowerMap(r, theta, alpha, sheetIndex, totalSheets) {
            const rAlpha = Math.pow(r, alpha);
            const phi = alpha * theta + sheetIndex * 2 * Math.PI / totalSheets;
            // 将极坐标 (rAlpha, phi) 映射回笛卡尔坐标，并在z方向偏移叶片
            const x = rAlpha * Math.cos(phi);
            const y = rAlpha * Math.sin(phi);
            const z = sheetIndex * 0.25 - (totalSheets - 1) * 0.125;
            return new THREE.Vector3(x, y, z);
        }

        // ---- 等温网生成：在z平面上取径向线和等角螺线 ----
        // 径向线族：固定θ，变化r
        function createRadialLines(alpha, totalSheets, thetaValues, color, numPoints = 300) {
            const group = new THREE.Group();
            for (let s = 0; s < totalSheets; s++) {
                for (const theta of thetaValues) {
                    const pts = [];
                    const dr = MAX_R / numPoints;
                    for (let i = 0; i <= numPoints; i++) {
                        const r = 0.02 + i * dr;
                        if (r > MAX_R) break;
                        const p = complexPowerMap(r, theta, alpha, s, totalSheets).multiplyScalar(SCALE);
                        pts.push(p);
                    }
                    if (pts.length < 2) continue;
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color,
                        transparent: true,
                        opacity: 0.72,
                        depthWrite: true,
                        depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 对数螺线族：固定螺线参数β，轨迹 r = exp((θ - θ0)/β)
        function createLogSpiralLines(alpha, totalSheets, betaValues, color, numPoints = 400) {
            const group = new THREE.Group();
            // 每条螺线从内到外缠绕多圈
            for (let s = 0; s < totalSheets; s++) {
                for (const beta of betaValues) {
                    // 生成等对数螺线的多个偏移版本
                    for (let offset = 0; offset < 4; offset++) {
                        const theta0 = offset * Math.PI / 2;
                        const pts = [];
                        const dt = 0.03;
                        const maxTheta = 8 * Math.PI;
                        for (let i = 0; i <= numPoints; i++) {
                            const theta = theta0 + i * dt;
                            if (theta > maxTheta) break;
                            const r = Math.exp((theta - theta0) / beta);
                            if (r < 0.02 || r > MAX_R) continue;
                            const p = complexPowerMap(r, theta, alpha, s, totalSheets).multiplyScalar(SCALE);
                            pts.push(p);
                        }
                        if (pts.length < 2) continue;
                        const geom = new THREE.BufferGeometry().setFromPoints(pts);
                        const mat = new THREE.LineBasicMaterial({
                            color,
                            transparent: true,
                            opacity: 0.62,
                            depthWrite: true,
                            depthTest: true,
                        });
                        group.add(new THREE.Line(geom, mat));
                    }
                }
            }
            return group;
        }

        // 同心圆族（r = const），经映射后变成特定曲线
        function createConcentricCircles(alpha, totalSheets, rValues, color, numPoints = 360) {
            const group = new THREE.Group();
            for (let s = 0; s < totalSheets; s++) {
                for (const r of rValues) {
                    const pts = [];
                    const dtheta = (2 * Math.PI) / numPoints;
                    for (let i = 0; i <= numPoints; i++) {
                        const theta = i * dtheta;
                        const p = complexPowerMap(r, theta, alpha, s, totalSheets).multiplyScalar(SCALE);
                        pts.push(p);
                    }
                    if (pts.length < 2) continue;
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color,
                        transparent: true,
                        opacity: 0.55,
                        depthWrite: true,
                        depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // ---- 构建主结构 ----
        const rootGroup = new THREE.Group();
        rootGroup.name = 'riemann-surfaces';
        scene.add(rootGroup);

        const alpha = 0.7; // 幂指数，小于1产生分支覆盖
        const totalSheets = 5;

        // 金色：径向线族（等温网的θ=const线）
        const thetaCount = 24;
        const thetaVals = [];
        for (let i = 0; i < thetaCount; i++) thetaVals.push(i * 2 * Math.PI / thetaCount);
        rootGroup.add(createRadialLines(alpha, totalSheets, thetaVals, COLOR_GOLD));

        // 青色：对数螺线族
        const betaCount = 10;
        const betaVals = [];
        for (let i = 0; i < betaCount; i++) betaVals.push(1.2 + i * 1.5);
        rootGroup.add(createLogSpiralLines(alpha, totalSheets, betaVals, COLOR_CYAN));

        // 品红：同心圆族
        const rCount = 16;
        const rVals = [];
        for (let i = 0; i < rCount; i++) rVals.push(0.1 + i * (MAX_R - 0.1) / (rCount - 1));
        rootGroup.add(createConcentricCircles(alpha, totalSheets, rVals, COLOR_MAGENTA));

        // 第二组叶片：不同α值的交错覆盖
        const alpha2 = 0.5;
        const totalSheets2 = 6;
        const thetaVals2 = [];
        for (let i = 0; i < 20; i++) thetaVals2.push(i * 2 * Math.PI / 20);
        rootGroup.add(createRadialLines(alpha2, totalSheets2, thetaVals2, COLOR_CYAN));

        const betaVals2 = [];
        for (let i = 0; i < 8; i++) betaVals2.push(0.8 + i * 2.0);
        rootGroup.add(createLogSpiralLines(alpha2, totalSheets2, betaVals2, COLOR_MAGENTA));

        const rVals2 = [];
        for (let i = 0; i < 14; i++) rVals2.push(0.15 + i * (MAX_R - 0.15) / 13);
        rootGroup.add(createConcentricCircles(alpha2, totalSheets2, rVals2, COLOR_GOLD));

        console.log('黎曼曲面线条总数:', rootGroup.children.length);

        // ---- 背景星点 ----
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 600;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 11;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            tick();
            const t = elapsed;

            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.28;
            rootGroup.rotation.z = t * 0.11;

            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 7.8;
            const camAngle = t * 0.08;
            const camHeight = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧，确保画面立即出现
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 复对数螺线·黎曼曲面分支动画已稳定运行');
    </script>
</body>
</html>
