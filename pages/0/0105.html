<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪球面 · 渐近线网络</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>伪球面 · 渐近线网络</h2>
        <div class="sub">Pseudo‑sphere · Asymptotic lines · Geodesic spray</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">x = sech u cos v , y = sech u sin v</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">z = u − tanh u</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">ds² = tanh²u du² + sech²u dv²</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 容器与渲染器
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 25);
        camera.position.set(3.0, 2.2, 7.0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时间系统，杜绝暂停
        let startTime = performance.now();
        let elapsed = 0;
        function tick() {
            elapsed = (performance.now() - startTime) * 0.001;
            return elapsed;
        }

        // 颜色
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // 伪球面点函数 (u ∈ [0, umax], v ∈ [0, 2π))
        const umax = 2.8;
        function pseudoSphere(u, v) {
            const sech = 1 / Math.cosh(u);
            return new THREE.Vector3(
                sech * Math.cos(v),
                sech * Math.sin(v),
                u - Math.tanh(u)
            );
        }

        // 生成 u-曲线 (固定v) – 金色
        function buildUCurves(vValues, color, numPoints = 280) {
            const group = new THREE.Group();
            const uMin = 0.02;
            const du = (umax - uMin) / numPoints;
            for (const v of vValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const u = uMin + i * du;
                    pts.push(pseudoSphere(u, v));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.7, depthWrite: true, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 生成 v-曲线 (固定u) – 青色
        function buildVCurves(uValues, color, numPoints = 320) {
            const group = new THREE.Group();
            const dv = (2 * Math.PI) / numPoints;
            for (const u of uValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const v = i * dv;
                    pts.push(pseudoSphere(u, v));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.7, depthWrite: true, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 生成测地流线 (从点(u0,v0)出发，沿初始方向(du,dv)) – 品红
        function geodesicSpray(startU, startV, color, count = 14, length = 1.4, steps = 130) {
            const group = new THREE.Group();
            for (let k = 0; k < count; k++) {
                const angle = (k / count) * Math.PI * 2;
                // 方向向量在参数平面 (du0, dv0) 上
                const du0 = Math.cos(angle) * 0.2;
                const dv0 = Math.sin(angle) * 0.2;
                // 数值积分测地线
                const pts = [];
                let u = startU, v = startV;
                let du = du0, dv = dv0;
                const dt = 0.015;
                for (let i = 0; i < steps; i++) {
                    if (u < 0.01 || u > umax - 0.01) break;
                    pts.push(pseudoSphere(u, v));
                    // 测地线方程（利用Christoffel符号简化）
                    const tanh = Math.tanh(u);
                    const sech = 1 / Math.cosh(u);
                    const ddu = -0.5 * sech * sech * tanh * dv * dv + 0.5 * (1 / (tanh * tanh)) * (1 - tanh * tanh) * du * du;
                    const ddv = (sech * sech / tanh) * du * dv;
                    du += ddu * dt;
                    dv += ddv * dt;
                    u += du * dt;
                    v += dv * dt;
                    if (v > 2 * Math.PI) v -= 2 * Math.PI;
                }
                if (pts.length < 2) continue;
                // 扩展对称：在三个对称位置复制曲线
                const angles = [0, 2 * Math.PI / 3, 4 * Math.PI / 3];
                for (const rot of angles) {
                    const rotated = pts.map(p => {
                        const r = Math.sqrt(p.x * p.x + p.y * p.y);
                        const theta = Math.atan2(p.y, p.x) + rot;
                        return new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), p.z);
                    });
                    const geom = new THREE.BufferGeometry().setFromPoints(rotated);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.55, depthWrite: true, depthTest: true
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'pseudosphere-system';
        scene.add(rootGroup);

        // 金色：u-曲线 (固定v)
        const numV = 24;
        const vList = [];
        for (let i = 0; i < numV; i++) vList.push(i * 2 * Math.PI / numV);
        rootGroup.add(buildUCurves(vList, COLOR_GOLD));

        // 青色：v-曲线 (固定u)
        const numU = 22;
        const uList = [];
        for (let i = 0; i < numU; i++) uList.push(0.1 + i * (umax - 0.1) / (numU - 1));
        rootGroup.add(buildVCurves(uList, COLOR_CYAN));

        // 品红：测地流线，从多个起点喷发
        const sprayStarts = [
            [0.5, 0], [0.8, Math.PI/2], [1.0, Math.PI], [1.2, 3*Math.PI/2],
            [0.6, Math.PI/3], [0.9, 5*Math.PI/4], [1.4, Math.PI/6]
        ];
        for (const [u0, v0] of sprayStarts) {
            rootGroup.add(geodesicSpray(u0, v0, COLOR_MAGENTA, 10, 1.5, 120));
        }

        console.log('伪球面元素数量:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 10;
            starsPos[i*3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i*3+1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i*3+2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.5,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 动画循环（手动，稳定）
        function animate() {
            tick();
            const t = elapsed;

            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.28;
            rootGroup.rotation.z = t * 0.10;

            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.4;
            const camAngle = t * 0.08;
            const camHeight = 2.3 + Math.sin(t * 0.15) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 启动
        requestAnimationFrame(animate);

        // 响应式调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✨ 伪球面渐近线网络动画已稳定运行');
    </script>
</body>
</html>
