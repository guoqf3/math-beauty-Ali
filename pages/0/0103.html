<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲空间 · 测地线网络</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold {
            color: #d4a843;
            font-style: normal;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-style: normal;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-style: normal;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>双曲空间 · 测地线网络</h2>
        <div class="sub">Hyperboloid model · Geodesic foliations · Horocycles</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">测地线族 XZ: z = coth α · x</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">测地线族 YZ: z = coth β · y</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">极限圆: z = const</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(2.5, 1.8, 6.5);
        camera.lookAt(0, 0, 0.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟系统
        let startTime = performance.now();
        let elapsed = 0;
        function tick() {
            elapsed = (performance.now() - startTime) * 0.001;
            return elapsed;
        }

        // 颜色
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        const SCALE = 0.55;
        const tauMax = 1.75;

        // 双曲面上叶点（仅用于验证）
        function hyperboloidPoint(x, y) {
            const zSq = 1 + x * x + y * y;
            return new THREE.Vector3(x, y, Math.sqrt(zSq));
        }

        // 生成XZ平面族测地线 (金色)
        function createXZGeodesic(alpha, color, numPoints = 300) {
            const sinhA = Math.sinh(alpha);
            const coshA = Math.cosh(alpha);
            const pts = [];
            const dTau = 2 * tauMax / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const tau = -tauMax + i * dTau;
                const coshT = Math.cosh(tau);
                const x = sinhA * coshT;
                const y = Math.sinh(tau);
                const z = coshA * coshT;
                pts.push(new THREE.Vector3(x, y, z).multiplyScalar(SCALE));
            }
            if (pts.length < 2) return null;
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color,
                transparent: true,
                opacity: 0.68,
                depthWrite: true,
                depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        // 生成YZ平面族测地线 (青色)
        function createYZGeodesic(beta, color, numPoints = 300) {
            const sinhB = Math.sinh(beta);
            const coshB = Math.cosh(beta);
            const pts = [];
            const dTau = 2 * tauMax / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const tau = -tauMax + i * dTau;
                const coshT = Math.cosh(tau);
                const x = Math.sinh(tau);
                const y = sinhB * coshT;
                const z = coshB * coshT;
                pts.push(new THREE.Vector3(x, y, z).multiplyScalar(SCALE));
            }
            if (pts.length < 2) return null;
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color,
                transparent: true,
                opacity: 0.68,
                depthWrite: true,
                depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        // 生成旋转后的测地线（品红）：将XZ测地线绕Z轴旋转angle
        function createRotatedGeodesic(alpha, rotAngle, color, numPoints = 300) {
            const sinhA = Math.sinh(alpha);
            const coshA = Math.cosh(alpha);
            const cosR = Math.cos(rotAngle);
            const sinR = Math.sin(rotAngle);
            const pts = [];
            const dTau = 2 * tauMax / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const tau = -tauMax + i * dTau;
                const coshT = Math.cosh(tau);
                const x0 = sinhA * coshT;
                const y0 = Math.sinh(tau);
                const z = coshA * coshT;
                const x = x0 * cosR - y0 * sinR;
                const y = x0 * sinR + y0 * cosR;
                pts.push(new THREE.Vector3(x, y, z).multiplyScalar(SCALE));
            }
            if (pts.length < 2) return null;
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color,
                transparent: true,
                opacity: 0.62,
                depthWrite: true,
                depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        // 生成水平极限圆 (z=const, 在双曲面上)
        function createHorocycle(zVal, color, numPoints = 260) {
            if (zVal < 1.0) return null;
            const r = Math.sqrt(zVal * zVal - 1);
            const pts = [];
            const dTheta = 2 * Math.PI / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const theta = i * dTheta;
                pts.push(new THREE.Vector3(
                    r * Math.cos(theta),
                    r * Math.sin(theta),
                    zVal
                ).multiplyScalar(SCALE));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color,
                transparent: true,
                opacity: 0.5,
                depthWrite: true,
                depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'hyperbolic-system';
        scene.add(rootGroup);

        // ---- 金色：XZ平面测地线族 ----
        const alphaValues = [];
        const alphaCount = 18;
        for (let i = 0; i < alphaCount; i++) {
            alphaValues.push(-1.5 + i * 3.0 / (alphaCount - 1));
        }
        for (const alpha of alphaValues) {
            const line = createXZGeodesic(alpha, COLOR_GOLD);
            if (line) rootGroup.add(line);
        }

        // ---- 青色：YZ平面测地线族 ----
        const betaValues = [];
        const betaCount = 18;
        for (let i = 0; i < betaCount; i++) {
            betaValues.push(-1.5 + i * 3.0 / (betaCount - 1));
        }
        for (const beta of betaValues) {
            const line = createYZGeodesic(beta, COLOR_CYAN);
            if (line) rootGroup.add(line);
        }

        // ---- 品红：旋转测地线族 (XZ测地线绕Z轴旋转30°和60°) ----
        const rotAngles = [Math.PI / 6, Math.PI / 3, -Math.PI / 6, -Math.PI / 3, Math.PI / 4, -Math.PI / 4];
        const alphaSubset = [];
        const alphaSubCount = 12;
        for (let i = 0; i < alphaSubCount; i++) {
            alphaSubset.push(-1.4 + i * 2.8 / (alphaSubCount - 1));
        }
        for (const rot of rotAngles) {
            for (const alpha of alphaSubset) {
                const line = createRotatedGeodesic(alpha, rot, COLOR_MAGENTA);
                if (line) rootGroup.add(line);
            }
        }

        // ---- 极限圆（三种颜色混合） ----
        const zLevels = [1.08, 1.2, 1.35, 1.55, 1.8, 2.1, 2.5, 3.0];
        const hColors = [COLOR_GOLD, COLOR_CYAN, COLOR_MAGENTA, COLOR_GOLD, COLOR_CYAN, COLOR_MAGENTA, COLOR_GOLD, COLOR_CYAN];
        for (let i = 0; i < zLevels.length; i++) {
            const line = createHorocycle(zLevels[i], hColors[i]);
            if (line) rootGroup.add(line);
        }

        console.log('双曲空间线条总数:', rootGroup.children.length);

        // ---- 背景星点 ----
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            tick();
            const t = elapsed;

            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.10;

            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 6.8;
            const camAngle = t * 0.08;
            const camHeight = 1.9 + Math.sin(t * 0.14) * 0.6;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0.8);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 启动前预渲染一帧，确保首帧有内容
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 双曲空间测地线网络动画已稳定运行');
    </script>
</body>
</html>
