<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>600-cell 正交投影 · 四维几何动画</title>
    <style>
        :root {
            --bg: #060a12;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 2.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.1rem, 2.4vw, 1.7rem);
            font-weight: 400;
            letter-spacing: 0.07em;
            color: rgba(210, 220, 240, 0.92);
            text-shadow: 0 0 40px rgba(160, 200, 255, 0.55), 0 0 80px rgba(140, 180, 240, 0.3);
            line-height: 1.3;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.6rem, 1.3vw, 0.85rem);
            letter-spacing: 0.12em;
            color: rgba(180, 195, 220, 0.7);
            text-shadow: 0 0 20px rgba(140, 180, 220, 0.35);
            margin-top: 0.3vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #formula-overlay .formula {
            font-size: clamp(0.68rem, 1.4vw, 0.92rem);
            letter-spacing: 0.04em;
            color: rgba(190, 200, 225, 0.75);
            text-shadow: 0 0 30px rgba(150, 180, 220, 0.4);
            font-style: italic;
            background: rgba(8, 14, 24, 0.55);
            padding: 0.5vh 2.2vw;
            border-radius: 2rem;
            border: 1px solid rgba(120, 150, 200, 0.22);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        #formula-overlay .formula .highlight {
            color: rgba(255, 180, 100, 0.88);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">600-胞体的正交投影</div>
        <div class="subtitle">正六百胞体 · 四维柏拉图立体</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="highlight">Schläfli</span> {3,3,5}&emsp;|&emsp;
            <span class="highlight">|V|</span>=120&emsp;
            <span class="highlight">|E|</span>=720&emsp;|&emsp;
            <span class="highlight">SO(4)</span> 双旋转
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== DOM ====================
        const container = document.getElementById('canvas-container');

        // ==================== 场景初始化 ====================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 20);
        camera.position.set(0, 0.1, 3.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x060a12, 1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ==================== 星空背景 ====================
        const starCount = 600;
        const starGeom = new THREE.BufferGeometry();
        const starPositionsArray = new Float32Array(starCount * 3);
        const starSizesArray = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 6.5 + Math.random() * 10;
            starPositionsArray[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starPositionsArray[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            starPositionsArray[i * 3 + 2] = r * Math.cos(phi);
            starSizesArray[i] = Math.random() * 1.6 + 0.15;
        }
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPositionsArray, 3));
        starGeom.setAttribute('size', new THREE.BufferAttribute(starSizesArray, 1));
        const starMat = new THREE.PointsMaterial({
            color: 0x7a8ab0,
            size: 0.008,
            transparent: true,
            opacity: 0.55,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starGeom, starMat);
        scene.add(stars);

        // ==================== 数学常量 ====================
        const PHI = (1 + Math.sqrt(5)) / 2; // φ ≈ 1.6180339887
        const INV_2PHI = 1 / (2 * PHI); // ≈ 0.30901699437

        // ==================== 生成600-cell顶点 (单位四元数) ====================
        function generate600CellVertices() {
            const verts = [];
            // 类型1: (±1, 0, 0, 0) 所有置换和符号 -> 8个顶点
            for (let i = 0; i < 4; i++) {
                for (let s = -1; s <= 1; s += 2) {
                    const v = [0, 0, 0, 0];
                    v[i] = s;
                    verts.push(v);
                }
            }
            // 类型2: (±1/2, ±1/2, ±1/2, ±1/2) -> 16个顶点
            for (let mask = 0; mask < 16; mask++) {
                const v = [
                    (mask & 1) ? 0.5 : -0.5,
                    (mask & 2) ? 0.5 : -0.5,
                    (mask & 4) ? 0.5 : -0.5,
                    (mask & 8) ? 0.5 : -0.5
                ];
                verts.push(v);
            }
            // 类型3: 所有偶置换和符号的 (φ/2, 1/2, 1/(2φ), 0)
            const baseVals = [PHI / 2, 0.5, INV_2PHI, 0];
            // 生成所有排列，筛选偶排列
            function permute(arr, permIndices) {
                return [arr[permIndices[0]], arr[permIndices[1]], arr[permIndices[2]], arr[permIndices[3]]];
            }
            function isEvenPermutation(p) {
                let inv = 0;
                for (let i = 0; i < 4; i++) {
                    for (let j = i + 1; j < 4; j++) {
                        if (p[i] > p[j]) inv++;
                    }
                }
                return inv % 2 === 0;
            }
            const allPerms = [];
            for (let a = 0; a < 4; a++) {
                for (let b = 0; b < 4; b++) {
                    if (b === a) continue;
                    for (let c = 0; c < 4; c++) {
                        if (c === a || c === b) continue;
                        const d = 6 - a - b - c; // 0+1+2+3=6
                        const p = [a, b, c, d];
                        if (isEvenPermutation(p)) {
                            allPerms.push(p);
                        }
                    }
                }
            }
            // 去重
            const uniquePerms = [];
            const seen = new Set();
            for (const p of allPerms) {
                const key = p.join(',');
                if (!seen.has(key)) {
                    seen.add(key);
                    uniquePerms.push(p);
                }
            }
            // 对于每个偶排列和每个符号组合 (2^3=8)
            for (const perm of uniquePerms) {
                for (let signMask = 0; signMask < 8; signMask++) {
                    const signs = [
                        (signMask & 1) ? 1 : -1,
                        (signMask & 2) ? 1 : -1,
                        (signMask & 4) ? 1 : -1,
                        1 // 第四个位置符号自然由前三决定？实际上baseVals[3]=0，符号无意义
                    ];
                    const v = permute(baseVals, perm).map((val, idx) => val * signs[idx]);
                    verts.push(v);
                }
            }
            // 移除重复点
            const tolerance = 1e-4;
            const uniqueVerts = [];
            for (const v of verts) {
                let found = false;
                for (const u of uniqueVerts) {
                    const dist = Math.sqrt((v[0]-u[0])**2 + (v[1]-u[1])**2 + (v[2]-u[2])**2 + (v[3]-u[3])**2);
                    if (dist < tolerance) {
                        found = true;
                        break;
                    }
                }
                if (!found) uniqueVerts.push(v);
            }
            return uniqueVerts;
        }

        const vertices4D = generate600CellVertices();
        console.log(`生成顶点数: ${vertices4D.length}`); // 应为120

        // ==================== 生成边 (内积 = φ/2) ====================
        function dot4D(a, b) {
            return a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];
        }
        const targetDot = PHI / 2;
        const epsilon = 1e-4;
        const edges = [];
        for (let i = 0; i < vertices4D.length; i++) {
            for (let j = i + 1; j < vertices4D.length; j++) {
                const d = dot4D(vertices4D[i], vertices4D[j]);
                if (Math.abs(d - targetDot) < epsilon) {
                    edges.push([i, j]);
                }
            }
        }
        console.log(`生成边数: ${edges.length}`); // 应为720

        // ==================== 按颜色分组边 ====================
        // 根据每条边第一个顶点的初始 x0 分量分类
        const colorGroups = [[], [], []];
        for (const [i, j] of edges) {
            const x0 = vertices4D[i][0];
            if (x0 < -0.3) {
                colorGroups[0].push([i, j]);
            } else if (x0 > 0.3) {
                colorGroups[2].push([i, j]);
            } else {
                colorGroups[1].push([i, j]);
            }
        }
        console.log('颜色分组边数:', colorGroups.map(g => g.length));

        // ==================== 颜色定义 ====================
        const COLOR_CYAN = new THREE.Color('#00c8f0');
        const COLOR_GOLD = new THREE.Color('#f0a040');
        const COLOR_MAGENTA = new THREE.Color('#f05078');
        const groupColors = [COLOR_CYAN, COLOR_GOLD, COLOR_MAGENTA];

        // ==================== 创建LineSegments对象 ====================
        const lineSegmentsGroups = [];
        const positionBuffers = [];
        const SCALE_3D = 1.65;

        for (let g = 0; g < 3; g++) {
            const edgeList = colorGroups[g];
            const numEdges = edgeList.length;
            if (numEdges === 0) continue;
            const positions = new Float32Array(numEdges * 2 * 3);
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setDrawRange(0, numEdges * 2);
            const mat = new THREE.LineBasicMaterial({
                color: groupColors[g],
                linewidth: 1,
                transparent: true,
                opacity: 0.82,
                depthTest: true,
                depthWrite: true,
                blending: THREE.NormalBlending,
            });
            const lineSegments = new THREE.LineSegments(geom, mat);
            lineSegments.frustumCulled = false;
            scene.add(lineSegments);
            lineSegmentsGroups.push({
                edgeList,
                positions,
                geom,
                numEdges,
            });
            positionBuffers.push(positions);
        }

        // ==================== 4D旋转与投影 ====================
        function rotateProject(v4, cosA, sinA, cosB, sinB) {
            let x0 = v4[0], x1 = v4[1], x2 = v4[2], x3 = v4[3];
            // 旋转平面0: x0-x1
            const r0 = x0 * cosA - x1 * sinA;
            const r1 = x0 * sinA + x1 * cosA;
            // 旋转平面1: x2-x3
            const r2 = x2 * cosB - x3 * sinB;
            const r3 = x2 * sinB + x3 * cosB;
            // 正交投影: 取前三个分量
            return {
                x: r0 * SCALE_3D,
                y: r1 * SCALE_3D,
                z: r2 * SCALE_3D,
            };
        }

        // ==================== 更新所有线条位置 ====================
        function updateLines(cosA, sinA, cosB, sinB) {
            for (let g = 0; g < 3; g++) {
                if (!lineSegmentsGroups[g]) continue;
                const { edgeList, positions, numEdges, geom } = lineSegmentsGroups[g];
                for (let e = 0; e < numEdges; e++) {
                    const [i, j] = edgeList[e];
                    const p1 = rotateProject(vertices4D[i], cosA, sinA, cosB, sinB);
                    const p2 = rotateProject(vertices4D[j], cosA, sinA, cosB, sinB);
                    const baseIdx = e * 6;
                    positions[baseIdx] = p1.x;
                    positions[baseIdx + 1] = p1.y;
                    positions[baseIdx + 2] = p1.z;
                    positions[baseIdx + 3] = p2.x;
                    positions[baseIdx + 4] = p2.y;
                    positions[baseIdx + 5] = p2.z;
                }
                geom.attributes.position.needsUpdate = true;
                geom.setDrawRange(0, numEdges * 2);
            }
        }

        // ==================== 动画状态 ====================
        const omega1 = 0.34;
        const omega2 = 0.34 * Math.sqrt(2.0);
        let alpha = 0.12;
        let beta = 0.55;
        let lastTime = performance.now();
        let frameCount = 0;
        let firstFrameRendered = false;

        // ==================== 渲染循环 ====================
        function animate(timestamp) {
            requestAnimationFrame(animate);

            let dt = (timestamp - lastTime) / 1000;
            if (dt <= 0) dt = 0.016;
            if (dt > 0.2) dt = 0.2;
            lastTime = timestamp;

            alpha += omega1 * dt;
            beta += omega2 * dt;
            // 保持角度在有限范围
            if (alpha > 1000) alpha -= 1000;
            if (beta > 1000) beta -= 1000;

            const cosA = Math.cos(alpha);
            const sinA = Math.sin(alpha);
            const cosB = Math.cos(beta);
            const sinB = Math.sin(beta);

            updateLines(cosA, sinA, cosB, sinB);

            // 星空缓慢旋转
            stars.rotation.y += dt * 0.035;
            stars.rotation.x += dt * 0.012;

            renderer.render(scene, camera);
            frameCount++;

            if (!firstFrameRendered && frameCount >= 2) {
                firstFrameRendered = true;
                console.log('首帧动画已稳定运行');
            }
        }

        // ==================== 初始帧强制渲染 ====================
        function renderInitialFrame() {
            const cosA = Math.cos(alpha);
            const sinA = Math.sin(alpha);
            const cosB = Math.cos(beta);
            const sinB = Math.sin(beta);
            updateLines(cosA, sinA, cosB, sinB);
            renderer.render(scene, camera);
            console.log('初始帧已绘制');
        }

        // ==================== 窗口调整 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 150));

        // ==================== 启动 ====================
        renderInitialFrame();
        setTimeout(() => {
            lastTime = performance.now();
            requestAnimationFrame(animate);
            console.log('动画循环启动');
        }, 100);

        // ==================== 停滞检测（看门狗） ====================
        let watchdogFrameCount = frameCount;
        let watchdogLastCheck = performance.now();
        setInterval(() => {
            const now = performance.now();
            const elapsed = now - watchdogLastCheck;
            if (elapsed > 1800 && watchdogFrameCount === frameCount && frameCount > 5) {
                console.warn('检测到可能停滞，尝试恢复...');
                alpha += 0.02;
                beta += 0.03;
                const cosA = Math.cos(alpha);
                const sinA = Math.sin(alpha);
                const cosB = Math.cos(beta);
                const sinB = Math.sin(beta);
                updateLines(cosA, sinA, cosB, sinB);
                renderer.render(scene, camera);
            }
            watchdogFrameCount = frameCount;
            watchdogLastCheck = now;
        }, 2500);

        console.log('600-cell 正交投影初始化完成');
        console.log('顶点数:', vertices4D.length, '边数:', edges.length);
        console.log('颜色分组:', colorGroups.map(g => g.length));
        console.log('双旋转角速度: ω1=', omega1.toFixed(3), 'ω2=', omega2.toFixed(3));
    </script>
</body>
</html>
