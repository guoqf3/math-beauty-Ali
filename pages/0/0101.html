<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dini曲面 · 螺旋常负曲率</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold {
            color: #d4a843;
            font-style: normal;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-style: normal;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-style: normal;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Dini曲面 · 螺旋常负曲率</h2>
        <div class="sub">Dini's surface · Helical asymptotic lines</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">u‑曲线 (v=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">v‑曲线 (u=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">螺旋线 u = k v</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 25);
        camera.position.set(3.8, 2.0, 8.0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——彻底杜绝暂停
        let startTime = performance.now();
        let elapsed = 0;
        function tick() {
            elapsed = (performance.now() - startTime) * 0.001;
            return elapsed;
        }

        // 颜色
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // Dini曲面参数
        const a = 0.65;
        const b = 0.2;
        const SCALE = 0.9;
        // u 曲线范围
        const uMin = -3.2;
        const uMax = 3.2;
        // v 曲线范围（避免奇异点 v>0）
        const vMin = 0.15;
        const vMax = Math.PI - 0.15;

        function diniPoint(u, v) {
            const sinV = Math.sin(v);
            const cosV = Math.cos(v);
            const x = a * Math.cos(u) * sinV;
            const y = a * Math.sin(u) * sinV;
            const z = a * (cosV + Math.log(Math.tan(v / 2))) + b * u;
            return new THREE.Vector3(x, y, z).multiplyScalar(SCALE);
        }

        // ---- 生成u-曲线 (固定v值) ----
        function createUCurves(vValues, color, numPoints = 300) {
            const group = new THREE.Group();
            const du = (uMax - uMin) / numPoints;
            for (const v of vValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const u = uMin + i * du;
                    pts.push(diniPoint(u, v));
                }
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity: 0.78,
                    depthWrite: true,
                    depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // ---- 生成v-曲线 (固定u值) ----
        function createVCurves(uValues, color, numPoints = 280) {
            const group = new THREE.Group();
            const dv = (vMax - vMin) / numPoints;
            for (const u of uValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const v = vMin + i * dv;
                    pts.push(diniPoint(u, v));
                }
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity: 0.78,
                    depthWrite: true,
                    depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // ---- 生成螺旋线 (u = k v + phase) ----
        function createHelicalLines(color, count, turns, numPoints = 360) {
            const group = new THREE.Group();
            for (let i = 0; i < count; i++) {
                const k = 0.5 + i * 0.35;
                const phase = i * Math.PI / 5;
                const pts = [];
                const tMax = 2 * Math.PI * turns;
                const dt = tMax / numPoints;
                for (let j = 0; j <= numPoints; j++) {
                    const t = j * dt;
                    const u = k * t + phase;
                    const v = vMin + (vMax - vMin) * (t / tMax);
                    if (u < uMin || u > uMax) continue;
                    pts.push(diniPoint(u, v));
                }
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity: 0.62,
                    depthWrite: true,
                    depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'dini-system';
        scene.add(rootGroup);

        // 金色：u-曲线 (v固定)
        const vCount = 26;
        const vValues = [];
        for (let i = 0; i < vCount; i++) {
            vValues.push(vMin + i * (vMax - vMin) / (vCount - 1));
        }
        rootGroup.add(createUCurves(vValues, COLOR_GOLD));

        // 青色：v-曲线 (u固定)
        const uCount = 24;
        const uValues = [];
        for (let i = 0; i < uCount; i++) {
            uValues.push(uMin + i * (uMax - uMin) / (uCount - 1));
        }
        rootGroup.add(createVCurves(uValues, COLOR_CYAN));

        // 品红：螺旋线
        rootGroup.add(createHelicalLines(COLOR_MAGENTA, 18, 8));

        // 第二组品红螺旋（反向扭转）
        function createReverseHelicalLines(color, count, turns, numPoints = 360) {
            const group = new THREE.Group();
            for (let i = 0; i < count; i++) {
                const k = -0.5 - i * 0.35;
                const phase = i * Math.PI / 5;
                const pts = [];
                const tMax = 2 * Math.PI * turns;
                const dt = tMax / numPoints;
                for (let j = 0; j <= numPoints; j++) {
                    const t = j * dt;
                    const u = k * t + phase;
                    const v = vMin + (vMax - vMin) * (t / tMax);
                    if (u < uMin || u > uMax) continue;
                    pts.push(diniPoint(u, v));
                }
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity: 0.58,
                    depthWrite: true,
                    depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        rootGroup.add(createReverseHelicalLines(COLOR_MAGENTA, 15, 7));

        console.log('Dini曲面线条总数:', rootGroup.children.length);

        // ---- 背景星点 ----
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 11;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            tick();
            const t = elapsed;

            rootGroup.rotation.x = t * 0.17;
            rootGroup.rotation.y = t * 0.29;
            rootGroup.rotation.z = t * 0.12;

            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 7.8;
            const camAngle = t * 0.08;
            const camHeight = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保画面立即出现
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Dini曲面动画已稳定运行');
    </script>
</body>
</html>
