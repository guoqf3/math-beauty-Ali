<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dirac磁单极子 · 电荷轨道编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Dirac磁单极子 · 电荷轨道编织</h2>
        <div class="sub">Monopole field on S² · Charged particle orbits · Chern class = n</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">B = n·sinθ dθ∧dφ (n=1)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">m·a = q v × B</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">F = dA , ∫ₛ²F = 4πn</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.2, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const RADIUS = 2.7;
        const MONOPOLE_CHARGE = 1.0;
        const PARTICLE_CHARGE = 1.5;

        function spherePoint(theta, phi) {
            const st = Math.sin(theta);
            return new THREE.Vector3(
                RADIUS * st * Math.cos(phi),
                RADIUS * Math.cos(theta),
                RADIUS * st * Math.sin(phi)
            );
        }

        // 球面上的磁单极子场：B = n * sinθ dθ ∧ dφ
        // 在球面切空间中，磁场是一个标量（2D体积形式），大小与sinθ成正比
        function magneticField(theta) {
            return MONOPOLE_CHARGE * Math.sin(theta);
        }

        // 数值积分带电粒子在球面上的轨道
        // 使用RK4在切空间中进行，然后重新投影到球面
        function integrateOrbit(theta0, phi0, energy, charge, tMax, steps) {
            const dt = tMax / steps;
            let theta = theta0;
            let phi = phi0;
            // 初始速度方向：在切空间中，给定能量E，选择初始方向角
            const speed = energy; // 速率 = sqrt(2E/m)，简化为energy参数
            // 初始速度角度（在切空间中，相对于∂/∂θ方向）
            const initAngle = Math.random() * 2 * Math.PI;
            let vTheta = speed * Math.cos(initAngle);
            let vPhi = speed * Math.sin(initAngle);

            const pts = [];
            pts.push(spherePoint(theta, phi));

            for (let i = 0; i < steps; i++) {
                const st = Math.sin(theta);
                const ct = Math.cos(theta);
                const B = magneticField(theta);

                // 球面上的运动方程（无量纲化）：加速度 = q * 速度 × 磁场
                // 在正交标架 (eθ, eφ) 中，B是标量，速度是(vθ, vφ)
                // 洛伦兹力：F = q * v × B，在二维中 (vθ, vφ) → q*B*(-vφ, vθ)
                const aTheta = -charge * B * vPhi;
                const aPhi = charge * B * vTheta;

                // 球面Christoffel符号修正（来自度规 ds² = dθ² + sin²θ dφ²）
                const gammaPhi = -st * ct * vPhi * vPhi;
                const gammaTheta = 2 * ct / Math.max(st, 1e-4) * vTheta * vPhi;

                // RK4半步
                const halfDt = dt * 0.5;
                // k1
                const k1vTheta = aTheta + gammaPhi;
                const k1vPhi = aPhi - gammaTheta;
                const k1theta = vTheta;
                const k1phi = vPhi / Math.max(st, 1e-4);

                // 中点估算
                let tMid = theta + k1theta * halfDt;
                let pMid = phi + k1phi * halfDt;
                tMid = Math.max(0.02, Math.min(Math.PI - 0.02, tMid));
                const stMid = Math.sin(tMid);
                const ctMid = Math.cos(tMid);
                const BMid = magneticField(tMid);
                const vThetaMid = vTheta + k1vTheta * halfDt;
                const vPhiMid = vPhi + k1vPhi * halfDt;
                const aThetaMid = -charge * BMid * vPhiMid;
                const aPhiMid = charge * BMid * vThetaMid;
                const gammaPhiMid = -stMid * ctMid * vPhiMid * vPhiMid;
                const gammaThetaMid = 2 * ctMid / Math.max(stMid, 1e-4) * vThetaMid * vPhiMid;

                const k2vTheta = aThetaMid + gammaPhiMid;
                const k2vPhi = aPhiMid - gammaThetaMid;
                const k2theta = vThetaMid;
                const k2phi = vPhiMid / Math.max(stMid, 1e-4);

                // 更新
                theta += k2theta * dt;
                phi += k2phi * dt;
                vTheta += k2vTheta * dt;
                vPhi += k2vPhi * dt;

                // 保持能量守恒（重新归一化速度）
                const currentSpeed = Math.sqrt(vTheta * vTheta + vPhi * vPhi * Math.sin(theta) * Math.sin(theta));
                if (currentSpeed > 0.01) {
                    vTheta *= speed / currentSpeed;
                    vPhi *= speed / currentSpeed;
                }

                // 边界处理
                theta = Math.max(0.03, Math.min(Math.PI - 0.03, theta));
                phi = ((phi % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

                pts.push(spherePoint(theta, phi));

                if (pts.length > steps * 1.2) break;
            }
            return pts;
        }

        // 生成一族轨道
        function createOrbitFamily(color, charge, energies, thetaSeeds, tMax, steps, opacity) {
            const group = new THREE.Group();
            for (const theta0 of thetaSeeds) {
                for (const energy of energies) {
                    const phi0 = Math.random() * 2 * Math.PI;
                    const pts = integrateOrbit(theta0, phi0, energy, charge, tMax, steps);
                    if (pts.length < 2) continue;
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color,
                        transparent: true,
                        opacity,
                        depthWrite: true,
                        depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'dirac-monopole';
        scene.add(rootGroup);

        const tMax = 6.0;
        const steps = 380;

        // 金色轨道族：从不同纬度出发，正电荷
        const thetaSeedsGold = [0.2, 0.5, 0.8, 1.1, 1.4, 1.7, 2.0, 2.3, 2.6, 2.9];
        const energiesGold = [0.7, 1.0, 1.3];
        rootGroup.add(createOrbitFamily(COLOR_GOLD, PARTICLE_CHARGE, energiesGold, thetaSeedsGold, tMax, steps, 0.55));

        // 青色轨道族：负电荷（反向旋转）
        const thetaSeedsCyan = [0.15, 0.45, 0.75, 1.05, 1.35, 1.65, 1.95, 2.25, 2.55, 2.85];
        const energiesCyan = [0.8, 1.1, 1.4];
        rootGroup.add(createOrbitFamily(COLOR_CYAN, -PARTICLE_CHARGE, energiesCyan, thetaSeedsCyan, tMax, steps, 0.52));

        // 品红轨道族：正电荷，不同能量
        const thetaSeedsMagenta = [0.25, 0.55, 0.85, 1.15, 1.45, 1.75, 2.05, 2.35, 2.65, 2.95];
        const energiesMagenta = [0.6, 0.9, 1.2, 1.5];
        rootGroup.add(createOrbitFamily(COLOR_MAGENTA, PARTICLE_CHARGE * 0.7, energiesMagenta, thetaSeedsMagenta, tMax, steps, 0.50));

        // 参考纬线（淡色辅助）
        const refThetaVals = [0.3, 0.8, 1.3, 1.8, 2.3, 2.8];
        refThetaVals.forEach(theta => {
            const pts = [];
            const dPhi = 2 * Math.PI / 300;
            for (let i = 0; i <= 300; i++) {
                pts.push(spherePoint(theta, i * dPhi));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x504030,
                transparent: true,
                opacity: 0.18,
                depthWrite: true,
                depthTest: true,
            });
            rootGroup.add(new THREE.Line(geom, mat));
        });

        // 参考经线
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            const dTheta = Math.PI / 300;
            for (let i = 0; i <= 300; i++) {
                const theta = 0.03 + i * dTheta;
                pts.push(spherePoint(theta, phi));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: 0x304050,
                transparent: true,
                opacity: 0.16,
                depthWrite: true,
                depthTest: true,
            });
            rootGroup.add(new THREE.Line(geom, mat));
        }

        console.log('磁单极子轨道总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.5,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.17;
            rootGroup.rotation.y = t * 0.28;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Dirac磁单极子电荷轨道动画已稳定运行');
    </script>
</body>
</html>
