<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无散场编织 · 时变流线网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
        }
        #canvas-container { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1; }
        canvas { display:block; }
        .overlay-title {
            position:fixed; top:0; left:0; right:0; z-index:10; pointer-events:none;
            padding:22px 20px 8px; text-align:center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight:400; letter-spacing:0.13em;
            color:#e8d5b0; text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin:0 0 2px; line-height:1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem); letter-spacing:0.22em; color:rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position:fixed; bottom:0; left:0; right:0; z-index:10; pointer-events:none;
            padding:8px 20px 18px; text-align:center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem); color:rgba(210,200,185,0.8); letter-spacing:0.03em; line-height:1.7;
        }
        .clr-gold { color:#d4a843; font-weight:bold; }
        .clr-cyan { color:#45b7aa; font-weight:bold; }
        .clr-magenta { color:#d4708a; font-weight:bold; }
        .formula-sep { display:inline-block; margin:0 14px; color:rgba(150,140,130,0.35); }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>无散场编织 · 时变流线网</h2>
        <div class="sub">Divergence‑free vector fields · Streamline integration · Irrational modulation</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">V₁=∇×[sin(x+t)cos(y)cos(z)]</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">V₂=∇×[cos(x)sin(y+t)cos(z)]</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">V₃=∇×[cos(x)cos(y)sin(z+t)]</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.6, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        const getElapsed = () => clock.getElapsedTime();

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.55;
        const DT = 0.04;
        const MAX_STEPS = 380;
        const STEPS_PER_UPDATE = 6;
        const UPDATE_MS = 130;
        const MAX_RADIUS = 8.5;
        const TOTAL_SEEDS = 78;
        const MAX_BUFFER = 140000;

        // ---- 三个时变散度自由场 ----
        function fieldGold(p, t) {
            const x = p.x, y = p.y, z = p.z;
            const sxt = Math.sin(x + t * 0.7);
            const cxt = Math.cos(x + t * 0.7);
            const cy = Math.cos(y);
            const sy = Math.sin(y);
            const cz = Math.cos(z);
            const sz = Math.sin(z);
            return new THREE.Vector3(
                cz * sxt * sy - cy * cxt * sz,
                cz * cy * sxt + cxt * sy * sz,
                -cxt * cz * sy
            );
        }

        function fieldCyan(p, t) {
            const x = p.x, y = p.y, z = p.z;
            const syt = Math.sin(y + t * 0.6);
            const cyt = Math.cos(y + t * 0.6);
            const cx = Math.cos(x);
            const sx = Math.sin(x);
            const cz = Math.cos(z);
            const sz = Math.sin(z);
            return new THREE.Vector3(
                -sx * cyt * sz,
                cx * cz * syt + sx * cyt * sz,
                cx * cyt * sz + sx * cz * syt
            );
        }

        function fieldMagenta(p, t) {
            const x = p.x, y = p.y, z = p.z;
            const szt = Math.sin(z + t * 0.55);
            const czt = Math.cos(z + t * 0.55);
            const cx = Math.cos(x);
            const sx = Math.sin(x);
            const cy = Math.cos(y);
            const sy = Math.sin(y);
            return new THREE.Vector3(
                cx * cy * szt + sx * sy * czt,
                -sx * cy * szt,
                -cx * sy * szt - sx * cy * czt
            );
        }

        function rk4Step(p, t, fieldFn, ds) {
            const f = (pos) => fieldFn(pos, t);
            const k1 = f(p);
            const pm2 = p.clone().add(k1.clone().multiplyScalar(ds * 0.5));
            const k2 = f(pm2);
            const pm3 = p.clone().add(k2.clone().multiplyScalar(ds * 0.5));
            const k3 = f(pm3);
            const pm4 = p.clone().add(k3.clone().multiplyScalar(ds));
            const k4 = f(pm4);
            return k1.add(k2.multiplyScalar(2)).add(k3.multiplyScalar(2)).add(k4).multiplyScalar(ds / 6);
        }

        // ---- 种子生成 ----
        function generateSeeds() {
            const seeds = [];
            const phi_g = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < TOTAL_SEEDS; i++) {
                const y = 1 - (2 * i + 1) / TOTAL_SEEDS;
                const rAtY = Math.sqrt(1 - y * y);
                const theta = phi_g * i;
                const dist = 0.3 + Math.random() * 2.8;
                const pos = new THREE.Vector3(
                    dist * rAtY * Math.cos(theta),
                    dist * y,
                    dist * rAtY * Math.sin(theta)
                );
                const color = i % 3 === 0 ? COLOR_GOLD : (i % 3 === 1 ? COLOR_CYAN : COLOR_MAGENTA);
                const fieldFn = i % 3 === 0 ? fieldGold : (i % 3 === 1 ? fieldCyan : fieldMagenta);
                seeds.push({ pos, color, fieldFn });
            }
            return seeds;
        }

        const seeds = generateSeeds();
        const rayPoints = seeds.map(seed => [seed.pos.clone().multiplyScalar(SCALE)]);

        // 初始推进
        seeds.forEach((seed, i) => {
            let p = seed.pos.clone();
            for (let s = 0; s < 15; s++) {
                const dp = rk4Step(p, 0, seed.fieldFn, DT);
                p.add(dp);
                if (p.length() > MAX_RADIUS) break;
                rayPoints[i].push(p.clone().multiplyScalar(SCALE));
            }
        });

        // ---- 创建三色LineSegments ----
        function createSegments(color, opacity) {
            const arr = new Float32Array(MAX_BUFFER * 3);
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(arr, 3));
            geom.setDrawRange(0, 0);
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            return new THREE.LineSegments(geom, mat);
        }

        const goldSeg = createSegments(COLOR_GOLD, 0.52);
        const cyanSeg = createSegments(COLOR_CYAN, 0.52);
        const magentaSeg = createSegments(COLOR_MAGENTA, 0.52);

        const rootGroup = new THREE.Group();
        rootGroup.name = 'divfree-weave';
        rootGroup.add(goldSeg);
        rootGroup.add(cyanSeg);
        rootGroup.add(magentaSeg);
        scene.add(rootGroup);

        function updateSegments() {
            const gArr = goldSeg.geometry.attributes.position.array;
            const cArr = cyanSeg.geometry.attributes.position.array;
            const mArr = magentaSeg.geometry.attributes.position.array;
            let gIdx = 0, cIdx = 0, mIdx = 0;
            for (let i = 0; i < seeds.length; i++) {
                const pts = rayPoints[i];
                if (pts.length < 2) continue;
                const col = seeds[i].color;
                let arr, idxObj;
                if (col === COLOR_GOLD) { arr = gArr; idxObj = { val: gIdx }; }
                else if (col === COLOR_CYAN) { arr = cArr; idxObj = { val: cIdx }; }
                else { arr = mArr; idxObj = { val: mIdx }; }
                for (let j = 0; j < pts.length - 1; j++) {
                    if (idxObj.val + 6 > arr.length) break;
                    const a = pts[j], b = pts[j+1];
                    arr[idxObj.val++] = a.x; arr[idxObj.val++] = a.y; arr[idxObj.val++] = a.z;
                    arr[idxObj.val++] = b.x; arr[idxObj.val++] = b.y; arr[idxObj.val++] = b.z;
                }
                if (col === COLOR_GOLD) gIdx = idxObj.val;
                else if (col === COLOR_CYAN) cIdx = idxObj.val;
                else mIdx = idxObj.val;
            }
            goldSeg.geometry.setDrawRange(0, gIdx / 3);
            goldSeg.geometry.attributes.position.needsUpdate = true;
            cyanSeg.geometry.setDrawRange(0, cIdx / 3);
            cyanSeg.geometry.attributes.position.needsUpdate = true;
            magentaSeg.geometry.setDrawRange(0, mIdx / 3);
            magentaSeg.geometry.attributes.position.needsUpdate = true;
        }
        updateSegments();

        // 辅助球面参考
        const refGeom = new THREE.SphereGeometry(3.4, 40, 24);
        const refWire = new THREE.LineSegments(
            new THREE.EdgesGeometry(refGeom),
            new THREE.LineBasicMaterial({ color: 0x403830, transparent: true, opacity: 0.10, depthWrite: true, depthTest: true })
        );
        rootGroup.add(refWire);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const sc = 500;
        const sp = new Float32Array(sc * 3);
        for (let i = 0; i < sc; i++) {
            const th = Math.random() * Math.PI * 2, ph = Math.acos(2*Math.random()-1), d = 6.5 + Math.random()*10;
            sp[i*3] = d * Math.sin(ph) * Math.cos(th);
            sp[i*3+1] = d * Math.sin(ph) * Math.sin(th);
            sp[i*3+2] = d * Math.cos(ph);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(sp, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        })));
        scene.add(starsGroup);

        console.log('无散场流线种子数:', seeds.length);

        // ---- 动画循环 ----
        let lastUpdate = -10;
        function animate() {
            const t = getElapsed();
            if (t - lastUpdate > UPDATE_MS / 1000) {
                try {
                    for (let i = 0; i < seeds.length; i++) {
                        const pts = rayPoints[i];
                        if (pts.length >= MAX_STEPS) continue;
                        const lastPt = pts[pts.length-1].clone().multiplyScalar(1/SCALE);
                        let p = lastPt.clone();
                        for (let s = 0; s < STEPS_PER_UPDATE; s++) {
                            const dp = rk4Step(p, t, seeds[i].fieldFn, DT);
                            p.add(dp);
                            if (p.length() > MAX_RADIUS) break;
                            pts.push(p.clone().multiplyScalar(SCALE));
                        }
                    }
                    updateSegments();
                    lastUpdate = t;
                } catch (e) { console.warn('更新异常:', e); }
            }

            rootGroup.rotation.x = t * 0.11;
            rootGroup.rotation.y = t * 0.16;
            rootGroup.rotation.z = t * 0.07;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const cr = 7.6, ca = t * 0.08, ch = 2.7 + Math.sin(t*0.16)*0.7;
            camera.position.set(Math.cos(ca)*cr, ch, Math.sin(ca)*cr);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);
        renderer.render(scene, camera);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }, 120));
        console.log('✅ 无散场时变流线编织动画已稳定运行');
    </script>
</body>
</html>
