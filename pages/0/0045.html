<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lissajous编织 · 球极投影网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Lissajous编织 · 球极投影网</h2>
        <div class="sub">Planar Lissajous curves · Stereographic projection · Rational & irrational beats</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">有理比: ω_x:ω_y ∈ {2:3,3:5,4:7,5:2}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">无理比: ω_x:ω_y ∈ {√2,√3,π,e,φ}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">调制: ω_y = ω_x·k + ε·sin(νt)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.6, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.2;

        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        function lissajousX(t, wx, phaseX, ax) { return ax * Math.cos(wx * t + phaseX); }
        function lissajousY(t, wy, phaseY, ay) { return ay * Math.sin(wy * t + phaseY); }

        function createLissajousFamily(wxValues, wyValues, ampValues, numPhases, color, opacity, tMax, numPoints) {
            const group = new THREE.Group();
            for (const wx of wxValues) {
                for (const wy of wyValues) {
                    const ax = ampValues[0] || 1.6;
                    const ay = ampValues[1] || 1.4;
                    for (let p = 0; p < numPhases; p++) {
                        const phaseX = p * 2 * Math.PI / numPhases;
                        const phaseY = p * 2 * Math.PI / (numPhases * 1.3) + 0.5;
                        const pts = [];
                        const dt = tMax / numPoints;
                        for (let i = 0; i <= numPoints; i++) {
                            const t = i * dt;
                            const px = lissajousX(t, wx, phaseX, ax);
                            const py = lissajousY(t, wy, phaseY, ay);
                            if (Math.abs(px) > 7 || Math.abs(py) > 7) continue;
                            const sp = stereographic(px, py);
                            if (sp && sp.length() < 9.5) pts.push(sp);
                        }
                        if (pts.length >= 2) {
                            const geom = new THREE.BufferGeometry().setFromPoints(pts);
                            const mat = new THREE.LineBasicMaterial({
                                color, transparent: true, opacity, depthWrite: true, depthTest: true,
                            });
                            group.add(new THREE.Line(geom, mat));
                        }
                    }
                }
            }
            return group;
        }

        function createModulatedLissajousFamily(wxValues, wyBase, modAmp, modFreq, ampValues, numPhases, color, opacity, tMax, numPoints) {
            const group = new THREE.Group();
            for (const wx of wxValues) {
                const ax = ampValues[0] || 1.5;
                const ay = ampValues[1] || 1.3;
                for (let p = 0; p < numPhases; p++) {
                    const phaseX = p * 2 * Math.PI / numPhases;
                    const phaseY = p * 2 * Math.PI / (numPhases * 1.2) + 0.7;
                    const pts = [];
                    const dt = tMax / numPoints;
                    for (let i = 0; i <= numPoints; i++) {
                        const t = i * dt;
                        const wyMod = wyBase + modAmp * Math.sin(modFreq * t + phaseY * 0.4);
                        const px = lissajousX(t, wx, phaseX, ax);
                        const py = lissajousY(t, wyMod, 0, ay);
                        if (Math.abs(px) > 7 || Math.abs(py) > 7) continue;
                        const sp = stereographic(px, py);
                        if (sp && sp.length() < 9.5) pts.push(sp);
                    }
                    if (pts.length >= 2) {
                        const geom = new THREE.BufferGeometry().setFromPoints(pts);
                        const mat = new THREE.LineBasicMaterial({
                            color, transparent: true, opacity, depthWrite: true, depthTest: true,
                        });
                        group.add(new THREE.Line(geom, mat));
                    }
                }
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'lissajous-weave';
        scene.add(rootGroup);

        const tMax = 14 * Math.PI;
        const numPoints = 580;
        const numPhases = 6;

        // 金色族：有理频率比
        const goldWx = [2, 3, 4, 5, 3, 7];
        const goldWy = [3, 5, 7, 2, 4, 5];
        rootGroup.add(createLissajousFamily(goldWx, goldWy, [1.5, 1.4], numPhases, COLOR_GOLD, 0.60, tMax, numPoints));
        // 额外金色（更多有理比）
        const goldWx2 = [1.5, 2.5, 3.5, 4.5, 5.5, 6.5];
        const goldWy2 = [2.5, 3.5, 4.5, 5.5, 1.5, 2.5];
        rootGroup.add(createLissajousFamily(goldWx2, goldWy2, [1.35, 1.25], 4, COLOR_GOLD, 0.42, tMax * 0.85, Math.floor(numPoints * 0.8)));

        // 青色族：无理频率比
        const cyanWx = [Math.sqrt(2), Math.sqrt(3), Math.PI, Math.E, (1 + Math.sqrt(5)) / 2, Math.sqrt(7)];
        const cyanWy = [Math.sqrt(3), Math.PI, Math.E, (1 + Math.sqrt(5)) / 2, Math.sqrt(2), Math.sqrt(5)];
        rootGroup.add(createLissajousFamily(cyanWx, cyanWy, [1.55, 1.45], numPhases, COLOR_CYAN, 0.60, tMax, numPoints));
        const cyanWx2 = [Math.sqrt(5), Math.sqrt(6), 2 * Math.PI, Math.log(2) + 1, Math.sqrt(10), Math.PI / 2];
        const cyanWy2 = [Math.sqrt(6), Math.sqrt(8), Math.log(3) + 1, Math.sqrt(11), Math.PI / 3, Math.sqrt(7)];
        rootGroup.add(createLissajousFamily(cyanWx2, cyanWy2, [1.38, 1.22], 4, COLOR_CYAN, 0.42, tMax * 0.85, Math.floor(numPoints * 0.8)));

        // 品红族：调制频率
        const magentaWx = [2.2, 3.3, 4.1, 5.2, 1.8, 6.0];
        rootGroup.add(createModulatedLissajousFamily(magentaWx, 2.8, 0.22, 1.7, [1.5, 1.35], numPhases, COLOR_MAGENTA, 0.58, tMax, numPoints));
        const magentaWx2 = [2.5, 3.8, 4.5, 5.5, 1.6, 6.8];
        rootGroup.add(createModulatedLissajousFamily(magentaWx2, 3.2, 0.18, 2.1, [1.32, 1.18], 4, COLOR_MAGENTA, 0.40, tMax * 0.85, Math.floor(numPoints * 0.8)));

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const phi = j * 2 * Math.PI / 240;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const theta = 0.02 + j * Math.PI / 240;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        console.log('Lissajous编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }, 120));

        console.log('✅ Lissajous球极投影编织动画已稳定运行');
    </script>
</body>
</html>
