<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时变矢量场编织 · 三维流线网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>时变矢量场编织 · 三维流线网</h2>
        <div class="sub">Time‑dependent vector fields · Streamline integration · Irrational modulation</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">V₁ = (sin(y+t), cos(z+0.5t), sin(x+0.3t))</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">V₂ = (cos(z−0.2t), sin(x+0.7t), cos(y+0.4t))</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">V₃ = (sin(x+0.6t), cos(y+0.1t), sin(z+0.9t))</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(4.0, 2.8, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.62;
        const DT = 0.035;
        const MAX_STEPS_TOTAL = 480;
        const STEPS_PER_FRAME = 2;
        const NUM_SEEDS = 48;
        const MAX_RADIUS = 7.0;

        // ---- 时变矢量场 ----
        function fieldGold(p, t) {
            const x = p.x, y = p.y, z = p.z;
            return new THREE.Vector3(
                Math.sin(y + t),
                Math.cos(z + 0.5 * t),
                Math.sin(x + 0.3 * t)
            );
        }
        function fieldCyan(p, t) {
            const x = p.x, y = p.y, z = p.z;
            return new THREE.Vector3(
                Math.cos(z - 0.2 * t),
                Math.sin(x + 0.7 * t),
                Math.cos(y + 0.4 * t)
            );
        }
        function fieldMagenta(p, t) {
            const x = p.x, y = p.y, z = p.z;
            return new THREE.Vector3(
                Math.sin(x + 0.6 * t),
                Math.cos(y + 0.1 * t),
                Math.sin(z + 0.9 * t)
            );
        }

        function rk4Step(p, t, fieldFn, ds) {
            const f = (pos) => fieldFn(pos, t);
            const k1 = f(p);
            const pm2 = p.clone().add(k1.clone().multiplyScalar(ds * 0.5));
            const k2 = f(pm2);
            const pm3 = p.clone().add(k2.clone().multiplyScalar(ds * 0.5));
            const k3 = f(pm3);
            const pm4 = p.clone().add(k3.clone().multiplyScalar(ds));
            const k4 = f(pm4);
            return k1.add(k2.multiplyScalar(2)).add(k3.multiplyScalar(2)).add(k4).multiplyScalar(ds / 6);
        }

        // 种子点
        function generateSeeds() {
            const seeds = [];
            const phi_g = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < NUM_SEEDS; i++) {
                const y = 1 - (2 * i + 1) / NUM_SEEDS;
                const rAtY = Math.sqrt(1 - y * y);
                const theta = phi_g * i;
                const dist = 0.5 + Math.random() * 1.8;
                seeds.push(new THREE.Vector3(
                    dist * rAtY * Math.cos(theta),
                    dist * y,
                    dist * rAtY * Math.sin(theta)
                ));
            }
            return seeds;
        }

        const seeds = generateSeeds();

        // 轨道状态
        const orbits = [];
        for (let i = 0; i < NUM_SEEDS; i++) {
            const color = i % 3 === 0 ? COLOR_GOLD : (i % 3 === 1 ? COLOR_CYAN : COLOR_MAGENTA);
            const fieldFn = i % 3 === 0 ? fieldGold : (i % 3 === 1 ? fieldCyan : fieldMagenta);
            orbits.push({
                pos: seeds[i].clone(),
                color,
                fieldFn,
                points: [seeds[i].clone().multiplyScalar(SCALE)],
                stepCount: 0,
            });
        }
        // 额外更远处的种子
        for (let i = 0; i < 16; i++) {
            const angle = Math.random() * 2 * Math.PI;
            const dist = 2.0 + Math.random() * 1.8;
            const seed = new THREE.Vector3(dist * Math.cos(angle), (Math.random() - 0.5) * 2.5, dist * Math.sin(angle));
            const color = i % 3 === 0 ? COLOR_GOLD : (i % 3 === 1 ? COLOR_CYAN : COLOR_MAGENTA);
            const fieldFn = i % 3 === 0 ? fieldGold : (i % 3 === 1 ? fieldCyan : fieldMagenta);
            orbits.push({
                pos: seed.clone(),
                color,
                fieldFn,
                points: [seed.clone().multiplyScalar(SCALE)],
                stepCount: 0,
            });
        }

        // 创建Line对象
        const lines = orbits.map(o => {
            const geom = new THREE.BufferGeometry().setFromPoints(o.points);
            const mat = new THREE.LineBasicMaterial({
                color: o.color, transparent: true, opacity: 0.45, depthWrite: true, depthTest: true,
            });
            return new THREE.Line(geom, mat);
        });

        const rootGroup = new THREE.Group();
        rootGroup.name = 'timefield-weave';
        lines.forEach(l => rootGroup.add(l));
        scene.add(rootGroup);

        // 辅助立方体参考框架
        const boxSize = 3.5;
        const boxGeom = new THREE.BoxGeometry(boxSize * 2, boxSize * 2, boxSize * 2);
        const boxEdges = new THREE.EdgesGeometry(boxGeom);
        rootGroup.add(new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.15, depthWrite: true, depthTest: true
        })));

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        console.log('时变矢量场流线数:', orbits.length);

        // ---- 稳定动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();

            // 推进所有轨道
            for (let i = 0; i < orbits.length; i++) {
                const o = orbits[i];
                if (o.stepCount >= MAX_STEPS_TOTAL) continue;
                for (let s = 0; s < STEPS_PER_FRAME; s++) {
                    if (o.stepCount >= MAX_STEPS_TOTAL) break;
                    const dp = rk4Step(o.pos, t, o.fieldFn, DT);
                    o.pos.add(dp);
                    if (o.pos.length() > MAX_RADIUS) { o.stepCount = MAX_STEPS_TOTAL; break; }
                    o.points.push(o.pos.clone().multiplyScalar(SCALE));
                    o.stepCount++;
                }
                // 更新几何体
                if (o.points.length >= 2) {
                    const line = lines[i];
                    line.geometry.dispose();
                    line.geometry = new THREE.BufferGeometry().setFromPoints(o.points);
                }
            }

            rootGroup.rotation.x = t * 0.12;
            rootGroup.rotation.y = t * 0.18;
            rootGroup.rotation.z = t * 0.07;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.9;
            const camAngle = t * 0.08;
            const camHeight = 2.9 + Math.sin(t * 0.15) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 时变矢量场流线编织动画已稳定运行');
    </script>
</body>
</html>
