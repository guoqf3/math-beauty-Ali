<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立方晶格多层连接 · 规则线网交织</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.08em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 72px rgba(170,150,130,0.22);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.85vw, 0.64rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 16px rgba(155,145,125,0.32);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.68); padding: 10px 20px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.16);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.38rem, 0.7vw, 0.56rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.55; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">立方晶格多层连接 · 规则线网交织</div>
        <div class="subtitle">CUBIC LATTICE MULTI‑LAYER &nbsp;·&nbsp; d=1 · d=√2 · d=√3</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">d=1:</span> 邻边连接 &nbsp;
            <span class="c2">d=√2:</span> 面对角线 &nbsp;
            <span class="c3">d=√3:</span> 体对角线
            <br>
            <span style="color:#9aa8b8;">SC节点: i,j,k∈[−3,3] ∩ℤ &nbsp;|&nbsp; 球半径R=2.9 &nbsp;|&nbsp; 约750边</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 9, 24);

        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.3,
            27
        );
        camera.position.set(1.2, 0.6, 7.0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 常数与颜色 ====================
        const R_SPHERE = 2.9;
        const RANGE = [-3, -2, -1, 0, 1, 2, 3];
        const C1 = '#d4885c'; // 暖金 – 近邻边 d=1
        const C2 = '#5d9ec6'; // 冰蓝 – 面对角线 d=√2
        const C3 = '#c77d9f'; // 玫瑰粉 – 体对角线 d=√3
        const C_SPHERE = '#3a4a5c';
        const C_GLINT = '#8898aa';

        // ==================== 生成SC节点 ====================
        const nodes = [];
        for (const i of RANGE) {
            for (const j of RANGE) {
                for (const k of RANGE) {
                    const d = Math.sqrt(i*i + j*j + k*k);
                    if (d <= R_SPHERE + 0.1) {
                        nodes.push(new THREE.Vector3(i, j, k));
                    }
                }
            }
        }
        console.log('SC节点数:', nodes.length);

        // ==================== 距离计算与分箱 ====================
        const edges1 = [], edges2 = [], edges3 = [];
        const d1Threshold = 1.02;
        const d2Low = 1.38;
        const d2High = 1.45;
        const d3Low = 1.70;
        const d3High = 1.76;

        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const d = nodes[i].distanceTo(nodes[j]);
                if (d <= d1Threshold) {
                    edges1.push([i, j]);
                } else if (d >= d2Low && d <= d2High) {
                    edges2.push([i, j]);
                } else if (d >= d3Low && d <= d3High) {
                    edges3.push([i, j]);
                }
            }
        }

        console.log('近邻边 d=1:', edges1.length);
        console.log('面对角线 d=√2:', edges2.length);
        console.log('体对角线 d=√3:', edges3.length);
        console.log('总边数:', edges1.length + edges2.length + edges3.length);

        // ==================== 创建线段 ====================
        function createLineSegments(edges, pts, colorHex, opacity) {
            if (edges.length === 0) return new THREE.Group();
            const verts = [];
            for (const [i, j] of edges) {
                const a = pts[i], b = pts[j];
                verts.push(a.x, a.y, a.z, b.x, b.y, b.z);
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            return new THREE.LineSegments(geom, mat);
        }

        const lines1 = createLineSegments(edges1, nodes, C1, 0.68);
        const lines2 = createLineSegments(edges2, nodes, C2, 0.62);
        const lines3 = createLineSegments(edges3, nodes, C3, 0.65);

        const mainGroup = new THREE.Group();
        mainGroup.add(lines1);
        mainGroup.add(lines2);
        mainGroup.add(lines3);
        scene.add(mainGroup);

        // ==================== 节点光点（球面附近） ====================
        function createNodeGlints(pts, colorHex, sz) {
            const group = new THREE.Group();
            for (const p of pts) {
                const d = p.length();
                if (d < R_SPHERE - 0.5) continue; // 只在外层显示光点
                const pairs = [
                    [p.clone().add(new THREE.Vector3(-sz,0,0)), p.clone().add(new THREE.Vector3(sz,0,0))],
                    [p.clone().add(new THREE.Vector3(0,-sz,0)), p.clone().add(new THREE.Vector3(0,sz,0))],
                    [p.clone().add(new THREE.Vector3(0,0,-sz)), p.clone().add(new THREE.Vector3(0,0,sz))],
                ];
                for (const [a,b] of pairs) {
                    const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                    const m = new THREE.LineBasicMaterial({
                        color: new THREE.Color(colorHex),
                        transparent: true, opacity: 0.45, depthWrite: true,
                    });
                    group.add(new THREE.Line(g, m));
                }
            }
            return group;
        }
        const glints = createNodeGlints(nodes, C_GLINT, 0.04);
        mainGroup.add(glints);

        // ==================== 参考球面线框 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 170;
            const circles = [
                (a) => new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius, 0),
                (a) => new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius),
                (a) => new THREE.Vector3(0, Math.cos(a)*radius, Math.sin(a)*radius),
            ];
            for (const gen of circles) {
                const pts = [];
                for (let i=0; i<=segs; i++) pts.push(gen((i/segs)*Math.PI*2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(R_SPHERE, C_SPHERE, 0.18);
        scene.add(sphereRef);

        // ==================== 原点光点 ====================
        function originGlint() {
            const group = new THREE.Group();
            const sz = 0.1;
            const pairs = [
                [new THREE.Vector3(-sz,0,0), new THREE.Vector3(sz,0,0)],
                [new THREE.Vector3(0,-sz,0), new THREE.Vector3(0,sz,0)],
                [new THREE.Vector3(0,0,-sz), new THREE.Vector3(0,0,sz)],
            ];
            for (const [a,b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a,b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true, opacity: 0.7, depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(originGlint());

        // ==================== 动画循环（绝对时间） ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s 边:${edges1.length+edges2.length+edges3.length}`);
                logTime = now;
            }

            mainGroup.rotation.y = time * 0.26;
            mainGroup.rotation.x = time * 0.14 + Math.sin(time * 0.22) * 0.18;
            mainGroup.rotation.z = Math.cos(time * 0.19) * 0.12;

            sphereRef.rotation.copy(mainGroup.rotation);

            const camX = 1.2 + Math.sin(time * 0.15) * 0.55;
            const camY = 0.6 + Math.cos(time * 0.18) * 0.48;
            const camZ = 7.0 + Math.sin(time * 0.12) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        console.log('=== 立方晶格多层连接 · 规则线网交织 ===');
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
