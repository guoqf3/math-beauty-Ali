<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环面Villarceau圆编织 · 球极投影几何 · 三族曲线</title>
    <style>
        :root {
            --bg: #04040e;
            --gold: #d6a745;
            --cyan: #3dbca5;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.3vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.11em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.41rem, 0.84vw, 0.56rem);
            letter-spacing: 0.18em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.22vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 1.8vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 14, 0.6);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            border: 1px solid rgba(140, 118, 84, 0.16);
            border-radius: 15px;
            padding: 0.9vh 2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.53rem, 1.14vw, 0.78rem);
            color: #cdb886;
            letter-spacing: 0.04em;
            line-height: 1.55;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.33rem, 0.67vw, 0.47rem);
            color: #8a7a58;
            letter-spacing: 0.07em;
            margin-top: 0.18vh;
            opacity: 0.68;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3dbca5;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.3s ease-out 0.2s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <h1>环面Villarceau圆编织 · 球极投影几何 · 三族曲线</h1>
        <div class="subtitle">经线 · 纬线 · Villarceau斜交圆族 · 动态环面呼吸</div>
    </div>
    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">ℓ_M: u=s, v=v₀</span>
            ⊗ <span class="accent-cyan">ℓ_P: v=s, u=u₀</span>
            ⊗ <span class="accent-rose">𝒱: tan(u/2)=ε·(r/A)·tan((v−v₀)/2)</span>
        </div>
        <div class="formula-detail">
            Villarceau圆条件 · A=√(R²−r²) · 族ε=±1 · 球极逆投影映射 · SO(3)旋转编织
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.3, 1.4, 7.8);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3dbca5');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // ---------- 背景星点 ----------
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 110;
        const starPos = new Float32Array(starCount * 3);
        const starSz = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.4 + Math.random() * 8;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSz[i] = Math.random() * 1.3 + 0.15;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSz, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.015,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 44, 28);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.05, depthWrite: false })
        );
        scene.add(refSphereWire);
        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.5, 10, 22);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.04, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- 环面工具 ----------
        function torusPoint(u, v, R, r) {
            const cu = Math.cos(u),
                su = Math.sin(u);
            const cv = Math.cos(v),
                sv = Math.sin(v);
            return [
                (R + r * cv) * cu,
                (R + r * cv) * su,
                r * sv,
            ];
        }

        function invStereo(x, y, z) {
            const r2 = x * x + y * y + z * z;
            const denom = 1 + r2 / (2.5 * 2.5);
            const inv = 1 / Math.max(denom, 1e-12);
            return [(2 * x) * inv, (2 * y) * inv, ((1 - r2 / (2.5 * 2.5)) * 2.5) * inv];
        }

        function clampPt(p) {
            let [x, y, z] = p;
            if (!Number.isFinite(x)) x = 0;
            if (!Number.isFinite(y)) y = 0;
            if (!Number.isFinite(z)) z = 0;
            const r = Math.sqrt(x * x + y * y + z * z);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const s = CLAMP_RADIUS / r;
                return [x * s, y * s, z * s];
            }
            return [x, y, z];
        }

        function so3Matrix(t) {
            const angle = t * 0.22;
            const ax = Math.cos(t * 0.15) * 0.5;
            const ay = Math.sin(t * 0.12) * 0.44;
            const az = Math.cos(t * 0.17 + 1.1) * 0.46;
            const n = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
            const ux = ax / n,
                uy = ay / n,
                uz = az / n;
            const c = Math.cos(angle),
                s = Math.sin(angle),
                t1 = 1 - c;
            return [
                c + ux * ux * t1,
                ux * uy * t1 - uz * s,
                ux * uz * t1 + uy * s,
                uy * ux * t1 + uz * s,
                c + uy * uy * t1,
                uy * uz * t1 - ux * s,
                uz * ux * t1 - uy * s,
                uz * uy * t1 + ux * s,
                c + uz * uz * t1,
            ];
        }

        function applyRot(pt, R) {
            return [
                R[0] * pt[0] + R[1] * pt[1] + R[2] * pt[2],
                R[3] * pt[0] + R[4] * pt[1] + R[5] * pt[2],
                R[6] * pt[0] + R[7] * pt[1] + R[8] * pt[2],
            ];
        }

        // ---------- 曲线定义 ----------
        const POINTS_PER_CURVE = 140;
        const allCurves = [];

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.81,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geom, positions, updateFn: null };
            allCurves.push(obj);
            return obj;
        }

        // 创建环面曲线的工厂函数
        function createTorusCurve(color, paramFn) {
            const curve = createCurve(color);
            curve.paramFn = paramFn;
            curve.updateFn = (R, r, A, R3) => {
                const positions = curve.positions;
                const pts = curve.paramFn(R, r, A, POINTS_PER_CURVE);
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    let p = pts[i] || [0, 0, 0];
                    p = invStereo(p[0], p[1], p[2]);
                    p = applyRot(p, R3);
                    p = clampPt(p);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geom.attributes.position.needsUpdate = true;
            };
            return curve;
        }

        // -- 金色族：经线 (固定v，变化u) --
        const goldCount = 22;
        for (let k = 0; k < goldCount; k++) {
            const v0 = (k / goldCount) * Math.PI * 2;
            createTorusCurve(colorGold, (R, r, A, n) => {
                const pts = [];
                for (let i = 0; i < n; i++) {
                    const u = (i / (n - 1)) * Math.PI * 2;
                    pts.push(torusPoint(u, v0, R, r));
                }
                return pts;
            });
        }

        // -- 青色族：纬线 (固定u，变化v) --
        const cyanCount = 28;
        for (let k = 0; k < cyanCount; k++) {
            const u0 = (k / cyanCount) * Math.PI * 2;
            createTorusCurve(colorCyan, (R, r, A, n) => {
                const pts = [];
                for (let i = 0; i < n; i++) {
                    const v = (i / (n - 1)) * Math.PI * 2;
                    pts.push(torusPoint(u0, v, R, r));
                }
                return pts;
            });
        }

        // -- 玫瑰族：Villarceau圆 (两族混合) --
        const roseCount = 28;
        for (let k = 0; k < roseCount; k++) {
            const v0 = (k / roseCount) * Math.PI * 2;
            const epsilon = k % 2 === 0 ? 1 : -1; // 交替使用两族
            createTorusCurve(colorRose, (R, r, A, n) => {
                const pts = [];
                if (A < 0.15) {
                    // Villarceau圆退化时返回纬线兜底
                    for (let i = 0; i < n; i++) {
                        const v = (i / (n - 1)) * Math.PI * 2;
                        pts.push(torusPoint(0, v, R, r));
                    }
                    return pts;
                }
                const kappa = r / A;
                const vMin = v0 + 0.015;
                const vMax = v0 + Math.PI * 2 - 0.015;
                for (let i = 0; i < n; i++) {
                    const v = vMin + (i / (n - 1)) * (vMax - vMin);
                    const halfDiff = (v - v0) / 2;
                    const sinHalf = Math.sin(halfDiff);
                    const cosHalf = Math.cos(halfDiff);
                    const u = 2 * Math.atan2(epsilon * kappa * sinHalf, cosHalf);
                    pts.push(torusPoint(u, v, R, r));
                }
                return pts;
            });
        }

        console.log(`✅ 曲线总数: ${allCurves.length} (金${goldCount}, 青${cyanCount}, 玫红${roseCount})`);

        // ---------- 流动粒子 ----------
        const particleCount = 24;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                curveIndex: i % allCurves.length,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0024,
            });
            const col = i < 8 ? colorGold : i < 16 ? colorCyan : colorRose;
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.044,
            vertexColors: true,
            transparent: true,
            opacity: 0.82,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const curveObj = allCurves[pd.curveIndex];
                if (!curveObj || !curveObj.positions) continue;
                const posArr = curveObj.positions;
                const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                const i0 = idx0 * 3,
                    i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // ---------- 统一更新 ----------
        function updateAll(elapsed) {
            const R3 = so3Matrix(elapsed);
            // 环面参数随时间呼吸变化
            const R = 1.95 + 0.35 * Math.sin(elapsed * 0.38) * Math.cos(elapsed * 0.26);
            const r = 0.62 + 0.2 * Math.cos(elapsed * 0.44) * Math.sin(elapsed * 0.3);
            const A = Math.sqrt(Math.max(0.01, R * R - r * r));

            for (const curve of allCurves) {
                try { if (curve.updateFn) curve.updateFn(R, r, A, R3); } catch (e) {}
            }
        }

        // ---------- 动画循环（绝对时间驱动） ----------
        const startTime = performance.now();
        let frameCount = 0,
            lastLogTime = startTime;

        function animate(nowTS) {
            requestAnimationFrame(animate);
            try {
                const now = nowTS || performance.now();
                const elapsed = (now - startTime) / 1000;
                frameCount++;
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${elapsed.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }
                updateAll(elapsed);
                updateParticles();

                const breathe = 1 + 0.04 * Math.sin(elapsed * 0.34);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += 0.0007;
                refSphereWire.rotation.y += 0.0006;
                refTorusWire.rotation.z += 0.0007;
                refTorusWire.scale.setScalar(1 + 0.05 * Math.sin(elapsed * 0.38));

                const camH = elapsed * 0.07;
                const camV = 0.32 + 0.18 * Math.sin(elapsed * 0.14);
                const camD = 7.5 + 0.6 * Math.sin(elapsed * 0.17);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0, 0, 0);
                stars.rotation.y += 0.00015;
                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环错误（已恢复）:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });

        // 启动
        console.log('🚀 环面Villarceau圆编织动画初始化...');
        updateAll(0);
        updateParticles();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动（环面三族曲线，绝对时间驱动，永不停止）');
    </script>
</body>
</html>
