<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>混沌吸引子 · 鞍面编织 · 极小曲面变形</title>
    <style>
        :root {
            --bg: #04040e;
            --gold: #d4a546;
            --cyan: #39b5a2;
            --rose: #d83e50;
            --text: #cdbc8c;
            --text-dim: #867a58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.6vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.17em;
            color: #e1cd98;
            text-shadow: 0 0 38px rgba(212, 165, 70, 0.44), 0 0 76px rgba(212, 165, 70, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.47rem, 0.93vw, 0.65rem);
            letter-spacing: 0.23em;
            color: #9e8c6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 14, 0.64);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            border: 1px solid rgba(135, 115, 82, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.6rem, 1.25vw, 0.88rem);
            color: #ccb782;
            letter-spacing: 0.07em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.4rem, 0.76vw, 0.55rem);
            color: #887958;
            letter-spacing: 0.1em;
            margin-top: 0.25vh;
            opacity: 0.68;
        }

        .accent-gold {
            color: #d4a546;
        }
        .accent-cyan {
            color: #39b5a2;
        }
        .accent-rose {
            color: #d83e50;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.2s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>混沌吸引子 · 鞍面编织 · 极小曲面变形</h1>
        <div class="subtitle">洛伦兹动力系统 &nbsp;·&nbsp; 双曲鞍面直纹 &nbsp;·&nbsp; Helicoid↔Catenoid</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">ẋ=σ(y−x) ẏ=x(ρ−z)−y ż=xy−βz</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">z=xy, K=−(1+x²+y²)⁻²</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">𝓧λ=cosλ·𝓧ₕ+sinλ·𝓧꜀</span>
        </div>
        <div class="formula-detail">
            奇异吸引子混沌轨道 &nbsp;·&nbsp; 负曲率直纹面网络 &nbsp;·&nbsp; 极小曲面等距变形 &nbsp;·&nbsp; 三维流形交织
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.7, 1.6, 7.4);
        camera.lookAt(0, 0, 0);

        // 颜色
        const colorGold = new THREE.Color('#d4a546');
        const colorCyan = new THREE.Color('#39b5a2');
        const colorRose = new THREE.Color('#d83e50');

        // ==================== 背景星点 ====================
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 230;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const rad = 5.4 + Math.random() * 8.8;
            starPos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
            starPos[i * 3 + 2] = rad * Math.cos(phi);
            starSizes[i] = Math.random() * 1.9 + 0.26;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.019,
            transparent: true,
            opacity: 0.48,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        // 极淡参考球壳
        const refSphereGeom = new THREE.SphereGeometry(2.75, 54, 38);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17130d, transparent: true, opacity: 0.09, depthWrite: false })
        );
        scene.add(refSphereWire);

        // 极淡参考环面
        const refTorusGeom = new THREE.TorusGeometry(2.08, 0.6, 12, 32);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1517, transparent: true, opacity: 0.07, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ==================== 洛伦兹积分 (RK4) ====================
        function lorenzRK4(x, y, z, sigma, rho, beta, h) {
            // k1
            const dx1 = sigma * (y - x);
            const dy1 = x * (rho - z) - y;
            const dz1 = x * y - beta * z;
            // k2
            const x2 = x + 0.5 * h * dx1;
            const y2 = y + 0.5 * h * dy1;
            const z2 = z + 0.5 * h * dz1;
            const dx2 = sigma * (y2 - x2);
            const dy2 = x2 * (rho - z2) - y2;
            const dz2 = x2 * y2 - beta * z2;
            // k3
            const x3 = x + 0.5 * h * dx2;
            const y3 = y + 0.5 * h * dy2;
            const z3 = z + 0.5 * h * dz2;
            const dx3 = sigma * (y3 - x3);
            const dy3 = x3 * (rho - z3) - y3;
            const dz3 = x3 * y3 - beta * z3;
            // k4
            const x4 = x + h * dx3;
            const y4 = y + h * dy3;
            const z4 = z + h * dz3;
            const dx4 = sigma * (y4 - x4);
            const dy4 = x4 * (rho - z4) - y4;
            const dz4 = x4 * y4 - beta * z4;

            return {
                x: x + (h / 6) * (dx1 + 2 * dx2 + 2 * dx3 + dx4),
                y: y + (h / 6) * (dy1 + 2 * dy2 + 2 * dy3 + dy4),
                z: z + (h / 6) * (dz1 + 2 * dz2 + 2 * dz3 + dz4),
            };
        }

        // ==================== 曲线系统 ====================
        const allCurves = [];
        const POINTS_PER_CURVE = 520;
        const CLAMP_RADIUS = 2.85;

        function createCurve(color, updateFn) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.38;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.38;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.38;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.84,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, material);
            scene.add(line);
            const obj = { line, geometry: geom, positions, updateFn };
            allCurves.push(obj);
            return obj;
        }

        // ---------- 组1：洛伦兹吸引子轨道 (金色) ----------
        const lorenzCount = 12;
        const lorenzInitials = [];
        for (let k = 0; k < lorenzCount; k++) {
            const angle = (k / lorenzCount) * Math.PI * 2;
            const r = 0.6 + Math.random() * 1.8;
            lorenzInitials.push({
                x: 1.0 + r * Math.cos(angle),
                y: 1.0 + r * Math.sin(angle),
                z: 20 + (Math.random() - 0.5) * 8,
            });
        }

        for (let k = 0; k < lorenzCount; k++) {
            const init = lorenzInitials[k];
            const rotBaseX = k * 0.55;
            const rotBaseY = k * 0.7;
            const rotBaseZ = k * 0.35;

            createCurve(colorGold, (t, i, total, arr) => {
                const idx = i * 3;
                // 参数ρ随时间缓慢变化，使吸引子在稳定/混沌之间呼吸
                const sigma = 10;
                const beta = 8 / 3;
                const rho = 28 + 4.5 * Math.sin(t * 0.28 + k * 0.7) * Math.cos(t * 0.19 + k);
                const h = 0.005;
                const stepsToSkip = Math.floor(0.06 / h); // 跳过前0.06时间以消除瞬态
                // 积分总步数
                const totalSteps = total;
                let x = init.x;
                let y = init.y;
                let z = init.z;
                // 先跳过瞬态
                for (let s = 0; s < stepsToSkip; s++) {
                    const n = lorenzRK4(x, y, z, sigma, rho, beta, h);
                    x = n.x;
                    y = n.y;
                    z = n.z;
                }
                // 积分到索引i的位置
                const stepsFromStart = Math.floor(i * 0.8);
                for (let s = 0; s < stepsFromStart; s++) {
                    const n = lorenzRK4(x, y, z, sigma, rho, beta, h);
                    x = n.x;
                    y = n.y;
                    z = n.z;
                }
                // 缩放洛伦兹坐标至可见球体范围（原始范围约±25, z 0-50）
                const scale = 0.095;
                let x0 = x * scale;
                let y0 = y * scale;
                let z0 = (z - 25) * scale;

                // 应用缓慢旋转
                const rx = rotBaseX + t * 0.09;
                const ry = rotBaseY + t * 0.11;
                const rz = rotBaseZ + t * 0.07;
                const cx = Math.cos(rx),
                    sx = Math.sin(rx);
                const cy = Math.cos(ry),
                    sy = Math.sin(ry);
                const cz = Math.cos(rz),
                    sz = Math.sin(rz);

                const x1 = x0 * cz - y0 * sz;
                const y1 = x0 * sz + y0 * cz;
                const z1 = z0;
                const y2 = y1 * cx - z1 * sx;
                const z2 = y1 * sx + z1 * cx;
                const x2 = x1;
                const x3 = x2 * cy + z2 * sy;
                const z3 = -x2 * sy + z2 * cy;
                const y3 = y2;

                // 钳制
                const rr = Math.sqrt(x3 * x3 + y3 * y3 + z3 * z3);
                const scl = rr > CLAMP_RADIUS ? CLAMP_RADIUS / rr : 1;
                arr[idx] = x3 * scl;
                arr[idx + 1] = y3 * scl;
                arr[idx + 2] = z3 * scl;
            });
        }

        // ---------- 组2：双曲鞍面直纹网络 (青色) ----------
        const saddleCount = 18; // 9条x常数 + 9条y常数
        const saddleLines = [];
        for (let k = 0; k < 9; k++) {
            saddleLines.push({ type: 'x', value: -2.2 + k * 0.55 }); // x常数线
        }
        for (let k = 0; k < 9; k++) {
            saddleLines.push({ type: 'y', value: -2.2 + k * 0.55 }); // y常数线
        }

        for (let k = 0; k < saddleCount; k++) {
            const lineDef = saddleLines[k];
            const rotSX = k * 0.35;
            const rotSY = k * 0.5;
            const rotSZ = k * 0.4;

            createCurve(colorCyan, (t, i, total, arr) => {
                const idx = i * 3;
                const param = (i / (total - 1)) * 5.0 - 2.5; // [-2.5, 2.5]
                const a = 0.55 + 0.1 * Math.sin(t * 0.35 + k * 0.6);
                let x0, y0, z0;
                if (lineDef.type === 'x') {
                    x0 = lineDef.value;
                    y0 = param;
                    z0 = a * x0 * y0;
                } else {
                    y0 = lineDef.value;
                    x0 = param;
                    z0 = a * x0 * y0;
                }
                // 缩放
                const sc = 1.15;
                x0 *= sc;
                y0 *= sc;
                z0 *= sc;
                // 旋转
                const rx = rotSX + t * 0.13;
                const ry = rotSY + t * 0.16;
                const rz = rotSZ + t * 0.1;
                const cx = Math.cos(rx),
                    sx = Math.sin(rx);
                const cy = Math.cos(ry),
                    sy = Math.sin(ry);
                const cz = Math.cos(rz),
                    sz = Math.sin(rz);
                const x1 = x0 * cz - y0 * sz;
                const y1 = x0 * sz + y0 * cz;
                const z1 = z0;
                const y2 = y1 * cx - z1 * sx;
                const z2 = y1 * sx + z1 * cx;
                const x2 = x1;
                const x3 = x2 * cy + z2 * sy;
                const z3 = -x2 * sy + z2 * cy;
                const y3 = y2;
                const rr = Math.sqrt(x3 * x3 + y3 * y3 + z3 * z3);
                const scl = rr > CLAMP_RADIUS ? CLAMP_RADIUS / rr : 1;
                arr[idx] = x3 * scl;
                arr[idx + 1] = y3 * scl;
                arr[idx + 2] = z3 * scl;
            });
        }

        // ---------- 组3：Helicoid-Catenoid等距变形 (玫红) ----------
        const hcCount = 12;
        for (let k = 0; k < hcCount; k++) {
            const vFixed = (k / hcCount) * Math.PI * 1.8 - Math.PI * 0.9;
            const rotHX = k * 0.5;
            const rotHY = k * 0.65;
            const rotHZ = k * 0.38;

            createCurve(colorRose, (t, i, total, arr) => {
                const idx = i * 3;
                const u = (i / (total - 1)) * 6.0 - 3.0; // [-3, 3]
                // λ在0(Helicoid)和π/2(Catenoid)之间振荡
                const lambda = (Math.PI / 4) * (1 + Math.sin(t * 0.32 + k * 0.7));
                const cl = Math.cos(lambda);
                const sl = Math.sin(lambda);
                const v = vFixed + 0.15 * Math.sin(t * 0.4 + k);
                const ch = 1.05; // helicoid pitch
                // Helicoid
                const xh = u * Math.cos(v);
                const yh = u * Math.sin(v);
                const zh = ch * v;
                // Catenoid
                const coshU = Math.cosh(u);
                const xc = coshU * Math.cos(v);
                const yc = coshU * Math.sin(v);
                const zc = u;
                // 插值
                const sc = 0.95;
                let x0 = (cl * xh + sl * xc) * sc;
                let y0 = (cl * yh + sl * yc) * sc;
                let z0 = (cl * zh + sl * zc) * sc;
                // 旋转
                const rx = rotHX + t * 0.14;
                const ry = rotHY + t * 0.17;
                const rz = rotHZ + t * 0.1;
                const cx = Math.cos(rx),
                    sx = Math.sin(rx);
                const cy = Math.cos(ry),
                    sy = Math.sin(ry);
                const cz = Math.cos(rz),
                    sz = Math.sin(rz);
                const x1 = x0 * cz - y0 * sz;
                const y1 = x0 * sz + y0 * cz;
                const z1 = z0;
                const y2 = y1 * cx - z1 * sx;
                const z2 = y1 * sx + z1 * cx;
                const x2 = x1;
                const x3 = x2 * cy + z2 * sy;
                const z3 = -x2 * sy + z2 * cy;
                const y3 = y2;
                const rr = Math.sqrt(x3 * x3 + y3 * y3 + z3 * z3);
                const scl = rr > CLAMP_RADIUS ? CLAMP_RADIUS / rr : 1;
                arr[idx] = x3 * scl;
                arr[idx + 1] = y3 * scl;
                arr[idx + 2] = z3 * scl;
            });
        }

        // ---------- 额外：三叶结变体点缀 (混合色) ----------
        const extraCount = 4;
        const extraColors = [colorCyan, colorRose, colorGold, colorCyan];
        for (let k = 0; k < extraCount; k++) {
            const col = extraColors[k];
            const amp = 1.25 + k * 0.3;
            const freq = 2.0 + k * 0.3;
            const ph = k * 1.4;
            createCurve(col, (t, i, total, arr) => {
                const idx = i * 3;
                const s = (i / total) * Math.PI * 2;
                const inner = s * freq + t * 0.5 + ph;
                const x0 = amp * (Math.sin(inner) + 0.55 * Math.sin(3 * inner)) * 0.8;
                const y0 = amp * (Math.cos(inner) - 0.45 * Math.cos(2 * inner)) * 0.8;
                const z0 = amp * 0.7 * Math.sin(2 * inner + t * 0.4);
                arr[idx] = x0;
                arr[idx + 1] = y0;
                arr[idx + 2] = z0;
            });
        }

        console.log(
            `✅ 曲线总数: ${allCurves.length} (金:${lorenzCount}, 青:${saddleCount}, 玫红:${hcCount}, 额外:${extraCount})`
        );

        // ==================== 流动粒子 ====================
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            const ci = i % allCurves.length;
            particleData.push({
                curveIndex: ci,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0024,
            });
            let col;
            if (i < 7) col = colorGold.clone();
            else if (i < 14) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 1] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        // ==================== 极度健壮的动画循环 ====================
        const clock = new THREE.Clock();
        let animationTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function safeUpdateCurves(t) {
            for (let c = 0; c < allCurves.length; c++) {
                try {
                    const curve = allCurves[c];
                    const { positions, updateFn } = curve;
                    for (let i = 0; i < POINTS_PER_CURVE; i++) {
                        updateFn(t, i, POINTS_PER_CURVE, positions);
                    }
                    curve.geometry.attributes.position.needsUpdate = true;
                } catch (e) {
                    console.warn(`曲线${c}更新异常, 已跳过`, e);
                }
            }
        }

        function safeUpdateParticles() {
            try {
                for (let p = 0; p < particleCount; p++) {
                    const pd = particleData[p];
                    pd.progress += pd.speed;
                    if (pd.progress >= 1.0) pd.progress -= 1.0;
                    if (pd.progress < 0) pd.progress += 1.0;
                    const curveObj = allCurves[pd.curveIndex];
                    if (!curveObj || !curveObj.positions) continue;
                    const posArr = curveObj.positions;
                    const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                    const idx0 = Math.floor(floatIdx);
                    const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                    const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                    const i0 = idx0 * 3,
                        i1 = idx1 * 3;
                    particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                    particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                    particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
                }
                particlesGeom.attributes.position.needsUpdate = true;
            } catch (e) {
                console.warn('粒子更新异常, 已跳过', e);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animationTime += dt;
                frameCount++;

                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const elapsed = (now - lastLogTime) / 1000;
                    const fps = Math.round(frameCount / elapsed);
                    console.log(
                        `🔄 运行中 | FPS: ${fps} | 时间: ${animationTime.toFixed(1)}s | dt: ${(dt * 1000).toFixed(1)}ms`
                    );
                    frameCount = 0;
                    lastLogTime = now;
                }

                safeUpdateCurves(animationTime);
                safeUpdateParticles();

                const breathe = 1 + 0.05 * Math.sin(animationTime * 0.4) * Math.cos(animationTime * 0.3);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.055;
                refSphereWire.rotation.y += dt * 0.048;

                refTorusWire.rotation.z += dt * 0.06;
                const torBreathe = 1 + 0.06 * Math.sin(animationTime * 0.44) * Math.cos(animationTime * 0.32);
                refTorusWire.scale.setScalar(torBreathe);

                const camH = animationTime * 0.1;
                const camV = 0.34 + 0.18 * Math.sin(animationTime * 0.14);
                const camD = 7.2 + 0.6 * Math.sin(animationTime * 0.19) * Math.cos(animationTime * 0.25);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.05 * Math.sin(animationTime * 0.09), 0.03 * Math.cos(animationTime * 0.12), 0);

                stars.rotation.y += dt * 0.014;
                stars.rotation.x += dt * 0.01;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画主循环异常, 循环仍继续:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                clock.getDelta();
            }
        });

        // ==================== 启动 ====================
        console.log('🚀 混沌吸引子·鞍面编织·极小曲面变形 动画初始化...');
        console.log(`   曲线总数: ${allCurves.length} | 顶点/曲线: ${POINTS_PER_CURVE}`);
        safeUpdateCurves(0);
        safeUpdateParticles();
        renderer.render(scene, camera);
        clock.start();
        animationTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动，46条曲线在三维空间中持续编织演化');
    </script>
</body>
</html>
