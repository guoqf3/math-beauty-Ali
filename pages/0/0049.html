<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joukowsky编织 · 正交椭圆双曲线网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Joukowsky编织 · 正交椭圆双曲线网</h2>
        <div class="sub">w = z + 1/z conformal map · Three rotated grids · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">网格0°：u+iv = (x+iy)+1/(x+iy)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">网格60°：旋转π/3后映射</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">网格120°：旋转2π/3后映射</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.3;

        // 球极投影（平面→球面）
        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // Joukowsky变换: w = z + 1/z
        function joukowsky(x, y) {
            const r2 = x * x + y * y;
            if (r2 < 0.003) return null; // 避免奇点
            const invR2 = 1 / r2;
            return { u: x + x * invR2, v: y - y * invR2 };
        }

        // 创建旋转网格的曲线族
        function createJoukowskyGrid(angle, constValues, isXConst, color, opacity, tMin, tMax, numPoints) {
            const group = new THREE.Group();
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);
            const dt = (tMax - tMin) / numPoints;

            for (const c of constValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const t = tMin + i * dt;
                    let x, y;
                    if (isXConst) {
                        // x'=c, y'=t → z = e^{iα}·(c + i·t)
                        x = c * cosA - t * sinA;
                        y = c * sinA + t * cosA;
                    } else {
                        // y'=c, x'=t → z = e^{iα}·(t + i·c)
                        x = t * cosA - c * sinA;
                        y = t * sinA + c * cosA;
                    }
                    const w = joukowsky(x, y);
                    if (!w) continue;
                    if (Math.abs(w.u) > 10 || Math.abs(w.v) > 10) continue;
                    const sp = stereographic(w.u, w.v);
                    if (sp && sp.length() < 9.5) pts.push(sp);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'joukowsky-weave';
        scene.add(rootGroup);

        const tRange = 2.8;
        const numPoints = 320;
        const lineCount = 22;

        // 生成常量值
        const constVals = [];
        for (let i = 0; i < lineCount; i++) {
            constVals.push(-tRange + i * 2 * tRange / (lineCount - 1));
        }
        const constValsExtra = [];
        for (let i = 0; i < 14; i++) {
            constValsExtra.push(-tRange + 0.06 + i * 2 * tRange / 13);
        }

        // 金色族：网格角度0°，x'=const 和 y'=const
        rootGroup.add(createJoukowskyGrid(0, constVals, true, COLOR_GOLD, 0.62, -tRange, tRange, numPoints));
        rootGroup.add(createJoukowskyGrid(0, constVals, false, COLOR_GOLD, 0.56, -tRange, tRange, numPoints));
        rootGroup.add(createJoukowskyGrid(0, constValsExtra, true, COLOR_GOLD, 0.40, -tRange, tRange, numPoints));
        rootGroup.add(createJoukowskyGrid(0, constValsExtra, false, COLOR_GOLD, 0.36, -tRange, tRange, numPoints));

        // 青色族：网格角度60°
        const angleCyan = Math.PI / 3;
        rootGroup.add(createJoukowskyGrid(angleCyan, constVals, true, COLOR_CYAN, 0.62, -tRange, tRange, numPoints));
        rootGroup.add(createJoukowskyGrid(angleCyan, constVals, false, COLOR_CYAN, 0.56, -tRange, tRange, numPoints));
        rootGroup.add(createJoukowskyGrid(angleCyan, constValsExtra, true, COLOR_CYAN, 0.40, -tRange, tRange, numPoints));
        rootGroup.add(createJoukowskyGrid(angleCyan, constValsExtra, false, COLOR_CYAN, 0.36, -tRange, tRange, numPoints));

        // 品红族：网格角度120°
        const angleMagenta = 2 * Math.PI / 3;
        rootGroup.add(createJoukowskyGrid(angleMagenta, constVals, true, COLOR_MAGENTA, 0.62, -tRange, tRange, numPoints));
        rootGroup.add(createJoukowskyGrid(angleMagenta, constVals, false, COLOR_MAGENTA, 0.56, -tRange, tRange, numPoints));
        rootGroup.add(createJoukowskyGrid(angleMagenta, constValsExtra, true, COLOR_MAGENTA, 0.40, -tRange, tRange, numPoints));
        rootGroup.add(createJoukowskyGrid(angleMagenta, constValsExtra, false, COLOR_MAGENTA, 0.36, -tRange, tRange, numPoints));

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const phi = j * 2 * Math.PI / 240;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.09, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const theta = 0.02 + j * Math.PI / 240;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }

        console.log('Joukowsky编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.24;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        scheduleFrame();

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Joukowsky变换正交椭圆双曲线网动画已稳定运行');
    </script>
</body>
</html>
