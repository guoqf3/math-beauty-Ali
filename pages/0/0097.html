<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锥面测地线 · 展开与缠绕</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-style: normal; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-style: normal; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-style: normal; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>锥面测地线 · 展开与缠绕</h2>
        <div class="sub">Cone geodesics · Unwrapping sector · Radial vs helical</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">母线: θ = const</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">纬线: s = const</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">测地线: s·cos(φ−φ₀) = d</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(2.5, 3.2, 6.8);
        camera.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        let elapsed = 0;
        function tick() {
            elapsed = (performance.now() - startTime) * 0.001;
            return elapsed;
        }

        // 颜色
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // ---- 锥面参数 ----
        const beta = Math.PI / 6;          // 半顶角30°，sinβ=0.5, cosβ=√3/2
        const sinBeta = Math.sin(beta);    // 0.5
        const cosBeta = Math.cos(beta);    // ~0.866
        const maxS = 3.2;                 // 最大斜高
        const SCALE = 0.95;

        // 锥面点函数：给定斜高s和角度θ (绕z轴)
        function conePoint(s, theta) {
            const x = s * sinBeta * Math.cos(theta);
            const y = s * sinBeta * Math.sin(theta);
            const z = s * cosBeta;
            return new THREE.Vector3(x, y, z).multiplyScalar(SCALE);
        }

        // ---- 母线 (金色) θ固定，s变化 ----
        function createGenerators(thetaValues, color, numPoints = 200) {
            const group = new THREE.Group();
            for (const theta of thetaValues) {
                const pts = [];
                for (let i = 0; i <= numPoints; i++) {
                    const s = (i / numPoints) * maxS;
                    pts.push(conePoint(s, theta));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.82, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // ---- 纬线 (青色) s固定，θ变化 ----
        function createParallels(sValues, color, numPoints = 260) {
            const group = new THREE.Group();
            for (const s of sValues) {
                const pts = [];
                const dTheta = (2 * Math.PI) / numPoints;
                for (let i = 0; i <= numPoints; i++) {
                    const theta = i * dTheta;
                    pts.push(conePoint(s, theta));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity: 0.82, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // ---- 测地线 (品红) 在展开平面中为直线 s·cos(φ-φ0) = d ----
        function createGeodesics(color, count, numPointsPerLine = 320) {
            const group = new THREE.Group();
            const sectorAngle = 2 * Math.PI * sinBeta; // π
            for (let i = 0; i < count; i++) {
                // 随机选择直线参数：d > 0, φ0 使得直线穿过扇形区域
                const d = 0.4 + i * 0.22;
                // 为了保证直线在扇形内有足够长度，选择φ0在0到sectorAngle之间，且直线两端触及边界
                const phi0 = (i / count) * sectorAngle;
                const phiStart = phi0 - Math.PI / 2;
                const phiEnd = phi0 + Math.PI / 2;
                // 限制在扇形内 [0, sectorAngle]
                const phiMin = Math.max(phiStart, 0.01);
                const phiMax = Math.min(phiEnd, sectorAngle - 0.01);
                if (phiMax <= phiMin) continue;

                const pts = [];
                const dPhi = (phiMax - phiMin) / numPointsPerLine;
                for (let j = 0; j <= numPointsPerLine; j++) {
                    const phi = phiMin + j * dPhi;
                    const cosDiff = Math.cos(phi - phi0);
                    if (cosDiff <= 0) continue;
                    const s = d / cosDiff;
                    if (s > maxS || s < 0.1) continue;
                    const theta = phi / sinBeta; // 锥面上真实角度
                    pts.push(conePoint(s, theta));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity: 0.75, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'cone-geodesics';
        scene.add(rootGroup);

        // 金色母线：24条均匀分布
        const generCount = 24;
        const thetaVals = [];
        for (let i = 0; i < generCount; i++) thetaVals.push(i * 2 * Math.PI / generCount);
        rootGroup.add(createGenerators(thetaVals, COLOR_GOLD));

        // 青色纬线：18条
        const parallelCount = 18;
        const sVals = [];
        for (let i = 0; i < parallelCount; i++) sVals.push(0.2 + i * (maxS - 0.2) / (parallelCount - 1));
        rootGroup.add(createParallels(sVals, COLOR_CYAN));

        // 品红测地线：30条
        rootGroup.add(createGeodesics(COLOR_MAGENTA, 30));

        console.log('锥面测地线总数:', rootGroup.children.length);

        // ---- 背景星点 ----
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            tick();
            const t = elapsed;

            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.26;
            rootGroup.rotation.z = t * 0.10;

            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 7.0;
            const camAngle = t * 0.09;
            const camHeight = 3.2 + Math.sin(t * 0.16) * 0.6;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0.5, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 锥面测地线动画已稳定运行');
    </script>
</body>
</html>
