<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>量子漩涡 · 高速引力场</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #080a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .container {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.04);
            background: #080a12;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 600px;
            cursor: grab;
            background: radial-gradient(ellipse at 50% 50%, #0f131f, #030408);
        }
        canvas:active {
            cursor: grabbing;
        }
        /* 兜底文字 */
        .fallback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.25);
            font-size: 18px;
            letter-spacing: 4px;
            pointer-events: none;
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px 40px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
        }
        .credit {
            position: absolute;
            bottom: 20px;
            right: 28px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
            pointer-events: none;
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .hint {
            position: absolute;
            top: 20px;
            left: 28px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.5px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        @media (max-width: 1024px) {
            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1000 / 600;
            }
            .credit,
            .hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas" width="1000" height="600"></canvas>
        <div class="fallback" id="fallback">✦ 量子漩涡 · 请刷新页面 ✦</div>
        <div class="hint"><i>✦ 拖拽 · 极速引力漩涡</i></div>
        <div class="credit">vibe <span>·</span> code</div>
    </div>

    <script>
        // ============================================================
        //  量子漩涡 · 高速引力场
        //  物理：向心引力 + 切向轨道力，粒子高速旋转，
        //  鼠标拖拽产生强烈吸引，形成动态漩涡。
        // ============================================================

        console.log('✅ 量子漩涡 加载开始');

        // 全局错误捕获：如果出错，显示备用文字
        window.addEventListener('error', function(e) {
            const fallback = document.getElementById('fallback');
            if (fallback) fallback.style.display = 'block';
            console.error('全局错误:', e.message);
        });

        // ---------- 获取元素 ----------
        const canvas = document.getElementById('canvas');
        const fallback = document.getElementById('fallback');

        if (!canvas) {
            console.error('❌ Canvas 元素未找到');
            if (fallback) fallback.style.display = 'block';
            throw new Error('Canvas 元素不存在');
        }

        let ctx = null;
        try {
            ctx = canvas.getContext('2d');
            if (!ctx) throw new Error('无法获取 2D 上下文');
        } catch (err) {
            console.error('❌ 上下文获取失败:', err.message);
            if (fallback) fallback.style.display = 'block';
            throw err;
        }

        console.log('✅ Canvas 就绪');

        const W = 1000,
            H = 600;

        // ---------- 状态 ----------
        let mouse = { x: -9999, y: -9999, active: false };
        let time = 0;

        // ---------- 高速漩涡参数 ----------
        const NUM_PARTICLES = 280;       // 数量适中，保证高帧率
        const GRAVITY_FORCE = 0.12;      // 向心引力强度 (数值越大，粒子越向中心收缩)
        const ORBIT_FORCE = 0.08;        // 切向轨道力强度 (决定旋转速度)
        const MOUSE_ATTRACT = 0.9;       // 鼠标引力强度 (强烈吸引)
        const DAMPING = 0.985;           // 阻尼 (0.98~0.99之间，数值越大减速越慢)
        const MAX_SPEED = 18;            // 速度上限 (允许极速冲刺)
        const INITIAL_SPEED = 6;         // 初始速度幅度

        // ---------- 初始化粒子 ----------
        let particles = [];
        try {
            for (let i = 0; i < NUM_PARTICLES; i++) {
                // 初始散布在画布各个角落
                const angle = Math.random() * Math.PI * 2;
                const radius = 50 + Math.random() * 350;
                particles.push({
                    x: W / 2 + Math.cos(angle) * radius,
                    y: H / 2 + Math.sin(angle) * radius,
                    vx: (Math.random() - 0.5) * 2 * INITIAL_SPEED,
                    vy: (Math.random() - 0.5) * 2 * INITIAL_SPEED,
                    hue: 210 + Math.random() * 90, // 蓝-紫-粉
                    size: 1.8 + Math.random() * 2.2,
                    phase: Math.random() * Math.PI * 2,
                    // 记录历史轨迹用于拖尾
                    trail: []
                });
            }
            console.log('✅ 粒子初始化成功，数量:', NUM_PARTICLES);
        } catch (err) {
            console.error('❌ 粒子初始化失败:', err.message);
            if (fallback) fallback.style.display = 'block';
            throw err;
        }

        // ---------- 背景繁星 ----------
        let stars = [];
        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: 0.3 + Math.random() * 0.8,
                phase: Math.random() * Math.PI * 2
            });
        }

        // ---------- 物理更新 (高速核心) ----------
        function updatePhysics() {
            // 获取引力中心：鼠标优先，否则为屏幕中心
            const cx = mouse.active ? mouse.x : W / 2;
            const cy = mouse.active ? mouse.y : H / 2;

            for (let i = 0; i < NUM_PARTICLES; i++) {
                const p = particles[i];

                // 1. 指向中心的方向向量
                const dx = cx - p.x;
                const dy = cy - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;

                // 2. 向心引力 (将粒子拉向中心)
                const gravFactor = GRAVITY_FORCE * (1 + 50 / (dist + 20));
                p.vx += (dx / dist) * gravFactor;
                p.vy += (dy / dist) * gravFactor;

                // 3. 切向轨道力 (产生旋转，距离越近旋转越强)
                const orbitFactor = ORBIT_FORCE * (1 + 60 / (dist + 10));
                p.vx += -(dy / dist) * orbitFactor;
                p.vy += (dx / dist) * orbitFactor;

                // 4. 鼠标额外强力吸引 (仅当鼠标激活且距离较近)
                if (mouse.active) {
                    const mDist = Math.sqrt(
                        Math.pow(mouse.x - p.x, 2) + Math.pow(mouse.y - p.y, 2)
                    );
                    if (mDist < 300 && mDist > 0.5) {
                        const force = (1 - mDist / 300) * MOUSE_ATTRACT;
                        const fdx = (mouse.x - p.x) / mDist;
                        const fdy = (mouse.y - p.y) / mDist;
                        p.vx += fdx * force;
                        p.vy += fdy * force;
                        // 鼠标核心处微弱排斥，防止粒子完全卡住
                        if (mDist < 15) {
                            const repel = (1 - mDist / 15) * 0.4;
                            p.vx -= fdx * repel;
                            p.vy -= fdy * repel;
                        }
                    }
                }

                // 5. 阻尼 (保持高速)
                p.vx *= DAMPING;
                p.vy *= DAMPING;

                // 6. 速度限制 (允许极速)
                const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (sp > MAX_SPEED) {
                    p.vx = (p.vx / sp) * MAX_SPEED;
                    p.vy = (p.vy / sp) * MAX_SPEED;
                }

                // 7. 位置更新
                p.x += p.vx;
                p.y += p.vy;

                // 8. 环绕边界 (无缝)
                if (p.x < 0) p.x += W;
                if (p.x > W) p.x -= W;
                if (p.y < 0) p.y += H;
                if (p.y > H) p.y -= H;

                // 9. 记录轨迹 (用于拖尾)
                p.trail.push({ x: p.x, y: p.y });
                if (p.trail.length > 5) {
                    p.trail.shift();
                }
            }
        }

        // ---------- 渲染 (极简高速绘制) ----------
        function draw() {
            // 半透明背景：拖尾效果 (数值越小拖尾越长)
            ctx.fillStyle = 'rgba(8, 10, 18, 0.08)';
            ctx.fillRect(0, 0, W, H);

            // ---- 1. 绘制拖尾轨迹 (快速运动时的核心视觉) ----
            for (const p of particles) {
                if (p.trail.length < 2) continue;
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (speed < 0.5) continue;

                const hue = p.hue + Math.sin(time * 0.01 + p.phase) * 15;
                const alpha = 0.4 + speed * 0.04;
                const lineWidth = 1.5 + speed * 0.4;

                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, ${alpha * 0.15})`;
                ctx.strokeStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
                ctx.lineWidth = lineWidth;
                ctx.beginPath();
                ctx.moveTo(p.trail[0].x, p.trail[0].y);
                for (let i = 1; i < p.trail.length; i++) {
                    ctx.lineTo(p.trail[i].x, p.trail[i].y);
                }
                ctx.stroke();
            }

            // ---- 2. 绘制粒子主体 (发光光晕) ----
            ctx.shadowBlur = 0;
            for (const p of particles) {
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                const hue = p.hue + Math.sin(time * 0.01 + p.phase) * 15;
                const lightness = 55 + Math.min(speed * 4, 30);
                const size = p.size * (1 + speed * 0.04);

                // 发光光晕
                const grad = ctx.createRadialGradient(
                    p.x - 1, p.y - 1, 0.5,
                    p.x, p.y, size * 2.8
                );
                grad.addColorStop(0, `hsla(${hue}, 100%, 85%, 0.95)`);
                grad.addColorStop(0.3, `hsla(${hue + 10}, 80%, 60%, 0.5)`);
                grad.addColorStop(1, `hsla(${hue + 20}, 70%, 40%, 0)`);

                ctx.shadowBlur = 28;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${0.2 + speed * 0.02})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size * 1.4, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // 核心高光
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x - 0.5, p.y - 0.5, size * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(0, 0%, 100%, ${0.3 + speed * 0.03})`;
                ctx.fill();
            }

            // ---- 3. 背景繁星 ----
            for (const star of stars) {
                const flicker = 0.5 + 0.5 * Math.sin(time * 0.025 + star.phase);
                const alpha = 0.1 + flicker * 0.25;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            }

            // ---- 4. 鼠标光晕 ----
            if (mouse.active) {
                const grad = ctx.createRadialGradient(
                    mouse.x, mouse.y, 0,
                    mouse.x, mouse.y, 250
                );
                grad.addColorStop(0, 'rgba(180, 200, 255, 0.08)');
                grad.addColorStop(0.5, 'rgba(100, 130, 255, 0.03)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 250, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ---------- 动画循环 ----------
        let animFrameId = null;

        function animate(timestamp) {
            try {
                time = timestamp || 0;
                updatePhysics();
                draw();
                animFrameId = requestAnimationFrame(animate);
            } catch (err) {
                console.error('❌ 动画循环出错:', err.message);
                if (fallback) fallback.style.display = 'block';
                if (animFrameId) cancelAnimationFrame(animFrameId);
            }
        }

        // ---------- 鼠标事件 ----------
        function handleMouseMove(e) {
            try {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                mouse.x = (e.clientX - rect.left) * scaleX;
                mouse.y = (e.clientY - rect.top) * scaleY;
                mouse.active = true;
            } catch (err) {}
        }

        function handleMouseLeave() {
            mouse.active = false;
        }

        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseleave', handleMouseLeave);

        // 触摸支持
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            try {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                mouse.x = (touch.clientX - rect.left) * scaleX;
                mouse.y = (touch.clientY - rect.top) * scaleY;
                mouse.active = true;
            } catch (err) {}
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            mouse.active = false;
        });

        // ---------- 窗口自适应 ----------
        function resizeCanvas() {
            try {
                const container = canvas.parentElement;
                const maxW = window.innerWidth - 40;
                const maxH = window.innerHeight - 40;
                const ratio = canvas.width / canvas.height;
                let w = Math.min(1000, maxW);
                let h = w / ratio;
                if (h > maxH) {
                    h = maxH;
                    w = h * ratio;
                }
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            } catch (err) {}
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ---------- 启动动画 ----------
        console.log('🚀 启动高速漩涡动画');
        try {
            animate(0);
        } catch (err) {
            console.error('❌ 启动失败:', err.message);
            if (fallback) fallback.style.display = 'block';
        }

        // 兜底检测：如果3秒后还是空白，显示备用文字
        setTimeout(() => {
            if (fallback && !fallback.style.display) {
                try {
                    const imageData = ctx.getImageData(0, 0, W, H).data;
                    let isBlank = true;
                    for (let i = 0; i < 1000; i++) {
                        if (imageData[i * 4 + 3] > 0) { isBlank = false; break; }
                    }
                    if (isBlank) {
                        console.warn('⚠️ 检测到空白帧，显示备用文字');
                        fallback.style.display = 'block';
                    }
                } catch (e) {
                    // 如果 getImageData 失败，也显示备用
                    fallback.style.display = 'block';
                }
            }
        }, 3000);

        console.log('✅ 量子漩涡已就绪，快速移动鼠标感受极速引力场！');
    </script>
</body>
</html>
