<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>克利福德平行线 · 四维球面几何</title>
    <style>
        :root {
            --bg: #020409;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 42px rgba(200, 180, 150, 0.5), 0 0 72px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 0.9vw, 0.66rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }
        #formula-overlay {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(2, 4, 9, 0.7);
            padding: 11px 23px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.42rem, 0.78vw, 0.62rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.27);
            line-height: 1.55;
            white-space: nowrap;
        }
        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }
        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 10px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.35rem;
                white-space: normal;
                line-height: 1.3;
            }
            #title-overlay .title {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">克利福德平行线 · 四维球面几何</div>
        <div class="subtitle">CLIFFORD PARALLELS &nbsp;·&nbsp; S³ STEREOGRAPHIC PROJECTION</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">𝒻ₐ(θ)=cosθ·q₀+sinθ·q₀·i</span> &nbsp;
            <span class="c2">𝒻ₑ(θ)=cosθ·q₀+sinθ·i·q₀</span> &nbsp;
            <span class="c3">Π⁻¹: x=x₁/(1−x₄)</span>
            <br>
            <span style="color:#9aa8b8;">S³⊂ℝ⁴&nbsp;|&nbsp;左乘&右乘轨道&nbsp;|&nbsp;两族互锁大圆&nbsp;|&nbsp;立体投影→ℝ³</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#020409');
        scene.fog = new THREE.Fog('#020409', 8, 22);

        const camera = new THREE.PerspectiveCamera(
            48,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.25,
            26
        );
        camera.position.set(1.6, 0.7, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c'; // 暖金 – 左乘轨道族
        const C2 = '#5d9ec6'; // 冰蓝 – 右乘轨道族
        const C3 = '#c77d9f'; // 玫瑰粉 – 连接轨道的参考大圆
        const C_SPHERE = '#3a4a5c';
        const C_GLINT = '#8898aa';

        const NUM_CURVES_PER_FAMILY = 14; // 每族圆环数
        const NUM_SAMPLES_PER_CIRCLE = 260; // 每个圆环采样点
        const REF_RADIUS = 2.65; // 参考球面半径

        // ==================== 四元数工具函数 ====================
        class Quaternion {
            constructor(w, x, y, z) {
                this.w = w;
                this.x = x;
                this.y = y;
                this.z = z;
            }
            static fromAxisAngle(axis, angle) {
                const half = angle / 2;
                const s = Math.sin(half);
                return new Quaternion(Math.cos(half), axis.x * s, axis.y * s, axis.z * s);
            }
            multiply(b) {
                const aw = this.w,
                    ax = this.x,
                    ay = this.y,
                    az = this.z;
                const bw = b.w,
                    bx = b.x,
                    by = b.y,
                    bz = b.z;
                return new Quaternion(
                    aw * bw - ax * bx - ay * by - az * bz,
                    aw * bx + ax * bw + ay * bz - az * by,
                    aw * by - ax * bz + ay * bw + az * bx,
                    aw * bz + ax * by - ay * bx + az * bw
                );
            }
            normalize() {
                const len = Math.sqrt(this.w * this.w + this.x * this.x + this.y * this.y + this.z * this.z);
                if (len < 1e-10) return new Quaternion(1, 0, 0, 0);
                return new Quaternion(this.w / len, this.x / len, this.y / len, this.z / len);
            }
        }

        // ==================== 立体投影 ====================
        function stereographicProject(w, x, y, z) {
            const denom = 1 - w;
            if (Math.abs(denom) < 0.0008) {
                const s = denom >= 0 ? 1 : -1;
                const scale = 55;
                return new THREE.Vector3(s * x * scale, s * y * scale, s * z * scale);
            }
            return new THREE.Vector3(x / denom, y / denom, z / denom);
        }

        function softClamp(vec, maxDist) {
            const len = vec.length();
            if (len > maxDist && len > 0.001) {
                const excess = len - maxDist;
                const clamped = maxDist + Math.log(1 + excess) * 1.5;
                vec.normalize().multiplyScalar(Math.min(clamped, maxDist * 1.35));
            }
            return vec;
        }

        // ==================== 克利福德平行线生成 ====================
        /**
         * 在S³上生成一族克利福德平行大圆
         * @param {number} family - 0=左乘轨道, 1=右乘轨道
         * @returns {THREE.Vector3[][]} 每组是一个采样点的数组（三维）
         */
        function generateCliffordFamily(family) {
            const allCircles = [];
            // 种子点：S³上均匀取样一组点，通过乘以纯四元数生成大圆
            // 对于左乘族：轨道 = { q0 * (cosθ + sinθ * i) | θ∈[0,2π] }
            // 对于右乘族：轨道 = { (cosθ + sinθ * i) * q0 | θ∈[0,2π] }
            // q0取S³上的一组代表点

            const seedAxis = new THREE.Vector3(1, 0.58, 0.34).normalize();
            const generatorI = new Quaternion(0, 1, 0, 0); // 纯四元数 i

            for (let k = 0; k < NUM_CURVES_PER_FAMILY; k++) {
                const angle = (k / NUM_CURVES_PER_FAMILY) * Math.PI;
                // 种子点：绕某个轴旋转得到不同的起始四元数
                const seedQ = Quaternion.fromAxisAngle(
                    new THREE.Vector3(0.42, 0.78, 0.45).normalize(),
                    angle + (family === 0 ? 0 : Math.PI / NUM_CURVES_PER_FAMILY / 2)
                ).normalize();

                const pts3D = [];
                for (let i = 0; i <= NUM_SAMPLES_PER_CIRCLE; i++) {
                    const theta = (i / NUM_SAMPLES_PER_CIRCLE) * Math.PI * 2;
                    const cosT = Math.cos(theta);
                    const sinT = Math.sin(theta);
                    const rotQ = new Quaternion(cosT, sinT, 0, 0).normalize();

                    let orbitPt;
                    if (family === 0) {
                        // 左乘：q0 * rotQ
                        orbitPt = seedQ.multiply(rotQ).normalize();
                    } else {
                        // 右乘：rotQ * q0
                        orbitPt = rotQ.multiply(seedQ).normalize();
                    }
                    let proj = stereographicProject(orbitPt.w, orbitPt.x, orbitPt.y, orbitPt.z);
                    proj = softClamp(proj, 7.5);
                    pts3D.push(proj);
                }
                allCircles.push(pts3D);
            }
            return allCircles;
        }

        // ==================== 参考大圆（玫瑰粉） ====================
        function createReferenceGreatCircles() {
            const circles = [];
            // 三个正交大圆在球面上（半径约2.65），经过缩放匹配投影空间
            const refR = REF_RADIUS;
            const axes = [
                { u: new THREE.Vector3(1, 0, 0), v: new THREE.Vector3(0, 1, 0) }, // XY平面
                { u: new THREE.Vector3(1, 0, 0), v: new THREE.Vector3(0, 0, 1) }, // XZ平面
                { u: new THREE.Vector3(0, 1, 0), v: new THREE.Vector3(0, 0, 1) }, // YZ平面
            ];
            for (const { u, v } of axes) {
                const pts = [];
                for (let i = 0; i <= NUM_SAMPLES_PER_CIRCLE; i++) {
                    const a = (i / NUM_SAMPLES_PER_CIRCLE) * Math.PI * 2;
                    pts.push(
                        u.clone().multiplyScalar(refR * Math.cos(a)).add(
                            v.clone().multiplyScalar(refR * Math.sin(a))
                        )
                    );
                }
                circles.push(pts);
            }
            // 两条纬线
            for (const z of [-refR * 0.55, refR * 0.55]) {
                const r = Math.sqrt(Math.max(0, refR * refR - z * z));
                if (r > 0.02) {
                    const pts = [];
                    for (let i = 0; i <= NUM_SAMPLES_PER_CIRCLE; i++) {
                        const a = (i / NUM_SAMPLES_PER_CIRCLE) * Math.PI * 2;
                        pts.push(new THREE.Vector3(Math.cos(a) * r, z, Math.sin(a) * r));
                    }
                    circles.push(pts);
                }
            }
            return circles;
        }

        function createLineFromPoints(pts, colorHex, opacity) {
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            return new THREE.Line(geom, mat);
        }

        console.log('生成克利福德平行线族...');
        const cliffordFamilyLeft = generateCliffordFamily(0); // 左乘轨道（暖金）
        const cliffordFamilyRight = generateCliffordFamily(1); // 右乘轨道（冰蓝）
        const refCircles = createReferenceGreatCircles(); // 参考大圆（玫瑰粉）

        console.log('左乘轨道族:', cliffordFamilyLeft.length, '条');
        console.log('右乘轨道族:', cliffordFamilyRight.length, '条');
        console.log('参考大圆:', refCircles.length, '条');

        // ==================== 组装场景 ====================
        const mainGroup = new THREE.Group();

        const groupLeft = new THREE.Group();
        for (const pts of cliffordFamilyLeft) {
            groupLeft.add(createLineFromPoints(pts, C1, 0.6));
        }
        mainGroup.add(groupLeft);

        const groupRight = new THREE.Group();
        for (const pts of cliffordFamilyRight) {
            groupRight.add(createLineFromPoints(pts, C2, 0.57));
        }
        mainGroup.add(groupRight);

        const groupRef = new THREE.Group();
        for (const pts of refCircles) {
            groupRef.add(createLineFromPoints(pts, C3, 0.42));
        }
        mainGroup.add(groupRef);

        scene.add(mainGroup);

        // ==================== 原点光点 ====================
        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.1;
            const pairs = [
                [new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0)],
                [new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0)],
                [new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)],
            ];
            for (const [a, b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true,
                    opacity: 0.7,
                    depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(createOriginGlint());

        // 参考球面线框（灰色，独立旋转）
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 170;
            const circleDefs = [
                (a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0),
                (a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius),
                (a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius),
            ];
            for (const gen of circleDefs) {
                const pts = [];
                for (let i = 0; i <= segs; i++) pts.push(gen((i / segs) * Math.PI * 2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(REF_RADIUS, C_SPHERE, 0.2);
        scene.add(sphereRef);

        // ==================== 动画循环 ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s 总圆数:${NUM_CURVES_PER_FAMILY*2 + refCircles.length}`);
                logTime = now;
            }

            // 三组独立微旋转
            groupLeft.rotation.y += 0.0018;
            groupLeft.rotation.x += 0.001;
            groupLeft.rotation.z += 0.0007;

            groupRight.rotation.y -= 0.002;
            groupRight.rotation.z += 0.0013;
            groupRight.rotation.x -= 0.0009;

            groupRef.rotation.y += 0.0012;
            groupRef.rotation.x += 0.0006;

            // 主组绕对角线旋转
            mainGroup.rotation.y = time * 0.24;
            mainGroup.rotation.x = time * 0.13 + Math.sin(time * 0.26) * 0.2;
            mainGroup.rotation.z = Math.cos(time * 0.21) * 0.14;

            // 参考球面可独立微动，也可同步
            sphereRef.rotation.y += 0.001;
            sphereRef.rotation.x += 0.0005;

            // 相机游走
            const camX = 1.6 + Math.sin(time * 0.14) * 0.55;
            const camY = 0.7 + Math.cos(time * 0.18) * 0.5;
            const camZ = 7.2 + Math.sin(time * 0.11) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        // ==================== 启动 ====================
        console.log('=== 克利福德平行线 · 四维球面几何 ===');
        console.log('左乘轨道族(暖金):', cliffordFamilyLeft.length, '条大圆投影');
        console.log('右乘轨道族(冰蓝):', cliffordFamilyRight.length, '条大圆投影');
        console.log('参考大圆(玫瑰粉):', refCircles.length, '条');
        console.log('总圆数:', cliffordFamilyLeft.length + cliffordFamilyRight.length + refCircles.length);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
