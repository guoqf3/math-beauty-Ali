<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辫子群编织 · 圆柱螺旋交叉</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold {
            color: #d4a843;
            font-style: normal;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-style: normal;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-style: normal;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>辫子群编织 · 圆柱螺旋交叉</h2>
        <div class="sub">Artin braid group · Cylindrical helix weaving</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">σᵢσᵢ₊₁σᵢ = σᵢ₊₁σᵢσᵢ₊₁</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">θₖ(z)=ωz+2πk/N+A·sin(νz+φₖ)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">φₖ = 2πk·φ (φ=黄金比)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.2, 2.2, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        let elapsed = 0;
        function tick() { elapsed = (performance.now() - startTime) * 0.001; return elapsed; }

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const GOLDEN_RATIO = (1 + Math.sqrt(5)) / 2;

        // ---- 圆柱面辫子参数 ----
        const R = 2.15;
        const H = 2.8;
        const zSteps = 500;

        // 圆柱面上点
        function cylPoint(theta, z, radOffset = 0) {
            const r = R + radOffset;
            return new THREE.Vector3(r * Math.cos(theta), z, r * Math.sin(theta));
        }

        // 生成一条辫子线
        function createBraidLine(omega, N, index, amplitude, frequency, color, opacity, radOffset) {
            const phi_k = 2 * Math.PI * index * GOLDEN_RATIO;
            const theta0 = 2 * Math.PI * index / N;
            const pts = [];
            const dz = 2 * H / zSteps;
            for (let i = 0; i <= zSteps; i++) {
                const z = -H + i * dz;
                const theta = omega * z + theta0 + amplitude * Math.sin(frequency * z + phi_k);
                pts.push(cylPoint(theta, z, radOffset));
            }
            if (pts.length < 2) return null;
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color,
                transparent: true,
                opacity,
                depthWrite: true,
                depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        // 生成一族辫子线
        function createBraidFamily(omega, N, startIdx, count, amplitude, frequency, color, opacity, radOffsets) {
            const group = new THREE.Group();
            for (let k = 0; k < count; k++) {
                const idx = startIdx + k;
                const radOff = radOffsets ? radOffsets[k % radOffsets.length] : 0;
                const line = createBraidLine(omega, N, idx, amplitude, frequency, color, opacity, radOff);
                if (line) group.add(line);
            }
            return group;
        }

        // 水平环线
        function createRings(count, color, opacity) {
            const group = new THREE.Group();
            const dTheta = 2 * Math.PI / 200;
            for (let i = 0; i < count; i++) {
                const z = -H + i * 2 * H / (count - 1);
                const pts = [];
                for (let j = 0; j <= 200; j++) {
                    pts.push(cylPoint(j * dTheta, z, 0));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // 竖直经线
        function createVerticals(count, color, opacity) {
            const group = new THREE.Group();
            const dz = 2 * H / 200;
            for (let i = 0; i < count; i++) {
                const theta = i * 2 * Math.PI / count;
                const pts = [];
                for (let j = 0; j <= 200; j++) {
                    pts.push(cylPoint(theta, -H + j * dz, 0));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'braid-weave';
        scene.add(rootGroup);

        const totalLines = 24; // 每种颜色8条
        const amplitude = 0.28;
        const frequency = 2.4;

        // 径向微偏移，使交叉有层次
        const radOffsetsGold = [-0.06, -0.03, 0.0, 0.03, 0.06, -0.04, 0.01, -0.02];
        const radOffsetsCyan = [0.04, -0.05, 0.02, -0.01, 0.05, -0.03, 0.0, 0.02];
        const radOffsetsMagenta = [-0.02, 0.04, -0.06, 0.01, -0.04, 0.03, -0.01, 0.05];

        // 金色：顺时针螺旋 ω=+0.75
        rootGroup.add(createBraidFamily(0.75, totalLines, 0, 8, amplitude, frequency, COLOR_GOLD, 0.72, radOffsetsGold));
        // 青色：逆时针螺旋 ω=-0.75
        rootGroup.add(createBraidFamily(-0.75, totalLines, 8, 8, amplitude, frequency, COLOR_CYAN, 0.72, radOffsetsCyan));
        // 品红：竖直方向 ω≈0（微小+大扰动）
        rootGroup.add(createBraidFamily(0.08, totalLines, 16, 8, amplitude * 1.6, frequency * 1.3, COLOR_MAGENTA, 0.70, radOffsetsMagenta));

        // 辅助环线
        rootGroup.add(createRings(26, COLOR_GOLD, 0.22));
        rootGroup.add(createRings(26, COLOR_CYAN, 0.18));
        // 辅助经线
        rootGroup.add(createVerticals(20, COLOR_MAGENTA, 0.16));

        console.log('辫子群编织线条总数:', rootGroup.children.length);

        // ---- 背景星点 ----
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 600;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            tick();
            const t = elapsed;
            rootGroup.rotation.x = t * 0.17;
            rootGroup.rotation.y = t * 0.29;
            rootGroup.rotation.z = t * 0.13;
            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保画面立即出现
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 辫子群圆柱螺旋编织动画已稳定运行');
    </script>
</body>
</html>
