<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>截角二十面体 · 球面细分编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>截角二十面体 · 球面细分编织</h2>
        <div class="sub">Truncated icosahedron · Subdivision mesh on S² · Hex‑pent grid</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">细分层0: 五边形边界</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">细分层1: 六边形边界</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">细分层2+: 再细分边</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.6, 2.5, 7.4);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const RADIUS = 2.7;

        // 正二十面体12个顶点
        const phi = (1 + Math.sqrt(5)) / 2;
        const icoVerts = [
            [0, 1, phi], [0, 1, -phi], [0, -1, phi], [0, -1, -phi],
            [1, phi, 0], [-1, phi, 0], [1, -phi, 0], [-1, -phi, 0],
            [phi, 0, 1], [phi, 0, -1], [-phi, 0, 1], [-phi, 0, -1]
        ].map(v => new THREE.Vector3(...v).normalize().multiplyScalar(RADIUS));

        // 正二十面体20个三角形面（顶点索引）
        const icoFaces = [
            [0,4,8],[0,5,10],[0,8,5],[0,10,4],[1,4,9],[1,5,8],[1,9,5],[1,8,4],
            [2,6,8],[2,7,10],[2,8,6],[2,10,7],[3,6,9],[3,7,10],[3,9,7],[3,10,6],
            [4,0,8],[4,1,9],[4,9,6],[4,6,8],[5,0,4],[5,1,8],[5,4,10],[5,10,1],
            [6,2,8],[6,3,9],[6,9,4],[6,4,8],[7,2,10],[7,3,9],[7,10,3],[7,9,1],
            [8,0,4],[8,1,5],[8,5,6],[8,6,2],[9,1,4],[9,3,6],[9,4,0],[9,0,5],
            [10,0,5],[10,2,7],[10,5,4],[10,4,2]
        ];
        // 去重：按排序后的顶点索引去重
        const seenFaces = new Set();
        const uniqueFaces = [];
        for (const f of icoFaces) {
            const key = [...f].sort((a,b)=>a-b).join(',');
            if (!seenFaces.has(key)) { seenFaces.add(key); uniqueFaces.push(f); }
        }
        // 确保20个面
        const faces20 = uniqueFaces.slice(0, 20);

        // 球面点
        function sp(v) { return v.clone().normalize().multiplyScalar(RADIUS); }

        // 细分三角形：取三边中点，投影到球面，生成4个子三角形
        function subdivideFace(v1, v2, v3, depth) {
            if (depth <= 0) return [[v1, v2, v3]];
            const m12 = sp(v1.clone().add(v2).multiplyScalar(0.5));
            const m23 = sp(v2.clone().add(v3).multiplyScalar(0.5));
            const m31 = sp(v3.clone().add(v1).multiplyScalar(0.5));
            const result = [];
            result.push(...subdivideFace(v1, m12, m31, depth-1));
            result.push(...subdivideFace(v2, m23, m12, depth-1));
            result.push(...subdivideFace(v3, m31, m23, depth-1));
            result.push(...subdivideFace(m12, m23, m31, depth-1));
            return result;
        }

        // 从细分三角形中提取边（去重）
        function extractEdges(triangles) {
            const edgeSet = new Set();
            const edges = [];
            for (const [a, b, c] of triangles) {
                const pairs = [[a,b],[b,c],[c,a]];
                for (const [p1, p2] of pairs) {
                    const k1 = p1.toArray().map(v=>v.toFixed(4)).join(',');
                    const k2 = p2.toArray().map(v=>v.toFixed(4)).join(',');
                    const key = k1 < k2 ? k1+'|'+k2 : k2+'|'+k1;
                    if (!edgeSet.has(key)) {
                        edgeSet.add(key);
                        edges.push([p1.clone(), p2.clone()]);
                    }
                }
            }
            return edges;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'trunc-icosa-weave';
        scene.add(rootGroup);

        const subdivDepths = [2, 3];
        const colorMap = [COLOR_GOLD, COLOR_CYAN, COLOR_MAGENTA];

        // 对每个面进行细分，按深度分配颜色
        for (const depth of subdivDepths) {
            const allTriangles = [];
            for (const faceIdx of faces20) {
                const v1 = icoVerts[faceIdx[0]];
                const v2 = icoVerts[faceIdx[1]];
                const v3 = icoVerts[faceIdx[2]];
                allTriangles.push(...subdivideFace(v1, v2, v3, depth));
            }
            const edges = extractEdges(allTriangles);
            const color = colorMap[depth % 3];
            const opacity = depth === 2 ? 0.55 : 0.38;
            for (const [a, b] of edges) {
                const geom = new THREE.BufferGeometry().setFromPoints([a, b]);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true,
                });
                rootGroup.add(new THREE.Line(geom, mat));
            }
        }

        // 深度2的额外细边（不同颜色偏移）
        const allTriangles3 = [];
        for (const faceIdx of faces20) {
            const v1 = icoVerts[faceIdx[0]];
            const v2 = icoVerts[faceIdx[1]];
            const v3 = icoVerts[faceIdx[2]];
            allTriangles3.push(...subdivideFace(v1, v2, v3, 3));
        }
        const edges3 = extractEdges(allTriangles3);
        // 从中抽取部分边以品红色增强
        let count = 0;
        for (const [a, b] of edges3) {
            if (count % 3 === 2) {
                const geom = new THREE.BufferGeometry().setFromPoints([a, b]);
                const mat = new THREE.LineBasicMaterial({
                    color: COLOR_MAGENTA, transparent: true, opacity: 0.30, depthWrite: true, depthTest: true,
                });
                rootGroup.add(new THREE.Line(geom, mat));
            }
            count++;
        }

        // 深度1：较粗略的五边形/六边形边界
        const allTriangles1 = [];
        for (const faceIdx of faces20) {
            const v1 = icoVerts[faceIdx[0]];
            const v2 = icoVerts[faceIdx[1]];
            const v3 = icoVerts[faceIdx[2]];
            allTriangles1.push(...subdivideFace(v1, v2, v3, 1));
        }
        const edges1 = extractEdges(allTriangles1);
        for (const [a, b] of edges1) {
            const geom = new THREE.BufferGeometry().setFromPoints([a, b]);
            const mat = new THREE.LineBasicMaterial({
                color: COLOR_CYAN, transparent: true, opacity: 0.22, depthWrite: true, depthTest: true,
            });
            rootGroup.add(new THREE.Line(geom, mat));
        }

        console.log('截角二十面体细分编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.26;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.5;
            const camAngle = t * 0.08;
            const camHeight = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 截角二十面体球面细分编织动画已稳定运行');
    </script>
</body>
</html>
