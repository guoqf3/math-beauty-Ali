<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六边形格点编织 · 时空轨道网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>六边形格点编织 · 时空轨道网</h2>
        <div class="sub">Hexagonal lattice · Spacetime orbital weaving · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">内壳: r<0.9</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">中壳: 0.9≤r<1.5</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">外壳: r≥1.5</span>
            <span class="formula-sep">‖</span>
            ṙ=ε₁sin(ω₁t+φ), θ̇=ω₂+ε₂cos(ω₃t+ψ)
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.6, 2.5, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.3;
        const MAX_HEX_RINGS = 7;
        const ARC_SAMPLES = 32;

        // 球极投影
        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // 生成六边形格点（轴向坐标 q, r）
        const basePoints = [];
        const baseCoords = [];
        for (let q = -MAX_HEX_RINGS; q <= MAX_HEX_RINGS; q++) {
            for (let r = -MAX_HEX_RINGS; r <= MAX_HEX_RINGS; r++) {
                const s = -q - r;
                if (Math.abs(s) > MAX_HEX_RINGS) continue;
                const px = 0.30 * (q * 1.5);
                const py = 0.30 * (r * Math.sqrt(3) + q * Math.sqrt(3) / 2);
                const len = Math.sqrt(px * px + py * py);
                basePoints.push({ px, py, len, q, r });
                baseCoords.push({ q, r });
            }
        }

        const N = basePoints.length;
        console.log('六边形格点数:', N);

        // 分配颜色区域
        const colorMap = new Array(N);
        for (let i = 0; i < N; i++) {
            const len = basePoints[i].len;
            if (len < 0.85) colorMap[i] = COLOR_GOLD;
            else if (len < 1.45) colorMap[i] = COLOR_CYAN;
            else colorMap[i] = COLOR_MAGENTA;
        }

        // 构建边连接（六边形近邻）
        const neighborDirs = [
            [1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]
        ];
        const coordToIndex = new Map();
        baseCoords.forEach((c, i) => coordToIndex.set(`${c.q},${c.r}`, i));

        const edges = [];
        const edgeColors = [];
        for (let i = 0; i < N; i++) {
            const { q, r } = baseCoords[i];
            for (const [dq, dr] of neighborDirs) {
                const nq = q + dq;
                const nr = r + dr;
                const j = coordToIndex.get(`${nq},${nr}`);
                if (j !== undefined && i < j) {
                    edges.push([i, j]);
                    edgeColors.push(colorMap[i]);
                }
            }
        }
        console.log('边数:', edges.length);

        // 预计算每个顶点的独立相位偏移
        const phases = basePoints.map(() => ({
            phi: Math.random() * 2 * Math.PI,
            psi: Math.random() * 2 * Math.PI,
            freqR: 1.6 + Math.random() * 1.4,
            freqT: 1.4 + Math.random() * 1.2,
        }));

        // 当前格点位置缓冲区
        const currentPositions = basePoints.map(() => new THREE.Vector3());

        // 创建三个LineSegments几何体（每种颜色一个）
        const goldEdges = [], cyanEdges = [], magentaEdges = [];
        edges.forEach((e, idx) => {
            const col = edgeColors[idx];
            if (col === COLOR_GOLD) goldEdges.push(e);
            else if (col === COLOR_CYAN) cyanEdges.push(e);
            else magentaEdges.push(e);
        });

        function createLineSegments(edgeList, color, opacity) {
            const count = edgeList.length;
            const totalVertices = count * ARC_SAMPLES * 2;
            const posArray = new Float32Array(totalVertices * 3);
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            const seg = new THREE.LineSegments(geom, mat);
            seg.userData = { edges: edgeList, posArray };
            return seg;
        }

        const goldSegments = createLineSegments(goldEdges, COLOR_GOLD, 0.55);
        const cyanSegments = createLineSegments(cyanEdges, COLOR_CYAN, 0.55);
        const magentaSegments = createLineSegments(magentaEdges, COLOR_MAGENTA, 0.55);

        const rootGroup = new THREE.Group();
        rootGroup.name = 'hex-weave';
        rootGroup.add(goldSegments);
        rootGroup.add(cyanSegments);
        rootGroup.add(magentaSegments);
        scene.add(rootGroup);

        // 更新格点位置
        function updateLatticePoints(t) {
            for (let i = 0; i < N; i++) {
                const bp = basePoints[i];
                const ph = phases[i];
                const rMod = bp.len + 0.06 * Math.sin(ph.freqR * t + ph.phi);
                const angle = Math.atan2(bp.py, bp.px);
                const angleMod = angle + 0.04 * Math.cos(ph.freqT * t + ph.psi);
                const px = rMod * Math.cos(angleMod);
                const py = rMod * Math.sin(angleMod);
                currentPositions[i].set(px, py, 0);
            }
        }

        // 更新线段的顶点
        function updateLineSegments(segObj) {
            const { edges, posArray } = segObj.userData;
            if (!edges || edges.length === 0) return;
            let idx = 0;
            for (const [i, j] of edges) {
                const pA = currentPositions[i];
                const pB = currentPositions[j];
                for (let s = 0; s < ARC_SAMPLES; s++) {
                    const t1 = s / ARC_SAMPLES;
                    const t2 = (s + 1) / ARC_SAMPLES;
                    const ax = pA.x + (pB.x - pA.x) * t1;
                    const ay = pA.y + (pB.y - pA.y) * t1;
                    const bx = pA.x + (pB.x - pA.x) * t2;
                    const by = pA.y + (pB.y - pA.y) * t2;
                    const sa = stereographic(ax, ay);
                    const sb = stereographic(bx, by);
                    if (sa && sb && sa.length() < 9.5 && sb.length() < 9.5) {
                        posArray[idx++] = sa.x; posArray[idx++] = sa.y; posArray[idx++] = sa.z;
                        posArray[idx++] = sb.x; posArray[idx++] = sb.y; posArray[idx++] = sb.z;
                    } else {
                        posArray[idx++] = 0; posArray[idx++] = 0; posArray[idx++] = 0;
                        posArray[idx++] = 0; posArray[idx++] = 0; posArray[idx++] = 0;
                    }
                }
            }
            segObj.geometry.attributes.position.needsUpdate = true;
        }

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();

            try {
                updateLatticePoints(t);
                updateLineSegments(goldSegments);
                updateLineSegments(cyanSegments);
                updateLineSegments(magentaSegments);
            } catch (e) {
                console.warn('更新几何体错误:', e);
            }

            rootGroup.rotation.x = t * 0.13;
            rootGroup.rotation.y = t * 0.22;
            rootGroup.rotation.z = t * 0.08;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.3;
            const camAngle = t * 0.08;
            const camHeight = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 预渲染首帧
        updateLatticePoints(0);
        updateLineSegments(goldSegments);
        updateLineSegments(cyanSegments);
        updateLineSegments(magentaSegments);
        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 六边形格点时空轨道编织动画已稳定运行');
    </script>
</body>
</html>
