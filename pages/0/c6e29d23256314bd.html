<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>量子双缝探测波纹场 · Quantum Double-Slit Ripple Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; }
  canvas { display: block; }

  #ui {
    position: fixed; top: 22px; left: 22px; width: 272px;
    padding: 18px 18px 14px;
    background: rgba(8, 12, 26, 0.76);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(110, 200, 255, 0.20);
    border-radius: 14px;
    box-shadow: 0 18px 54px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(180, 235, 255, 0.07);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #c2d9f0; user-select: none;
  }
  #ui h1 {
    font-size: 13.5px; font-weight: 600; letter-spacing: 2.6px;
    color: #e6f5ff; margin-bottom: 3px;
    text-shadow: 0 0 18px rgba(80, 200, 255, 0.45);
  }
  #ui .sub {
    font-size: 9px; letter-spacing: 2.4px; color: #567a9e;
    margin-bottom: 16px; text-transform: uppercase;
  }
  .row { margin-bottom: 13px; }
  .row label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; letter-spacing: 1px; color: #7c9cbc; margin-bottom: 7px;
  }
  .row label b {
    font-weight: 600; color: #5fd4ff; font-size: 12px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(80, 210, 255, 0.55);
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px; border-radius: 3px; outline: none;
    background: linear-gradient(90deg, #1c4a70, #14243a);
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #6fe0ff 55%, #186e9c);
    border: 1px solid rgba(200, 245, 255, 0.95);
    box-shadow: 0 0 14px rgba(90, 215, 255, 0.95);
    transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.24); }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; border: 1px solid #cdf3ff;
    background: radial-gradient(circle at 35% 30%, #ffffff, #6fe0ff 55%, #186e9c);
    box-shadow: 0 0 14px rgba(90, 215, 255, 0.95);
  }
  #hint {
    position: fixed; left: 22px; bottom: 18px;
    font-family: -apple-system, "PingFang SC", system-ui, sans-serif;
    font-size: 11px; letter-spacing: 1.4px; color: rgba(110, 150, 195, 0.48);
    pointer-events: none; line-height: 1.9;
  }
  #hint span { color: rgba(105, 220, 255, 0.85); }
  #hint i { color: rgba(190, 150, 255, 0.85); font-style: normal; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="ui">
  <h1>量子双缝探测波纹场</h1>
  <div class="sub">Double-Slit Ripple Field</div>

  <div class="row">
    <label>频率 ω <b id="vO">1.80</b></label>
    <input id="sO" type="range" min="0.20" max="5.00" step="0.05" value="1.80" />
  </div>
  <div class="row">
    <label>波矢 k <b id="vK">0.55</b></label>
    <input id="sK" type="range" min="0.10" max="1.00" step="0.01" value="0.55" />
  </div>
  <div class="row">
    <label>缝距 d <b id="vD">16.0</b></label>
    <input id="sD" type="range" min="2" max="40" step="0.5" value="16" />
  </div>
  <div class="row" style="margin-bottom:2px">
    <label>相位偏移 φ <b id="vP">0.00</b></label>
    <input id="sP" type="range" min="0" max="6.28" step="0.02" value="0" />
  </div>
</div>

<div id="hint">
  <span>拖拽</span> 旋转视场 &nbsp;·&nbsp; <span>滚轮</span> 缩放 &nbsp;·&nbsp; <span>右键</span> 平移视野<br />
  <i>点触波峰</i> 量子滴答脆响 &nbsp;·&nbsp; <i>旋转视场</i> 梦幻低鸣
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x03040a, 1);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.5, 4000);
camera.position.set(58, 62, 108);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.062;
controls.minDistance = 18;
controls.maxDistance = 420;
controls.maxPolarAngle = Math.PI * 0.96;
controls.target.set(0, 0, 30);

/* ============================================================
   2. 参数与 Uniforms
   ============================================================ */
const params = {
  omega: 1.80,   // 频率 ω
  k: 0.55,       // 波矢 k
  d: 16.0,       // 缝距 d
  phi: 0.0       // 相位偏移 φ
};

let phaseAccum = 0;   // 累积相位 ωt

const uniforms = {
  uPhase:      { value: 0 },
  uK:          { value: params.k },
  uD:          { value: params.d },
  uPhi:        { value: params.phi },
  uHeight:     { value: 4.0 },
  uSize:       { value: 1.35 },
  uPixelRatio: { value: renderer.getPixelRatio() }
};

/* ============================================================
   3. 点阵几何体
   ============================================================ */
const GX = 200;                 // x 方向点数
const GZ = 136;                 // z 方向点数
const X_MIN = -46, X_MAX = 46;
const Z_MIN = 1.0, Z_MAX = 66.0;

const positions = new Float32Array(GX * GZ * 3);
let pIdx = 0;
for (let i = 0; i < GX; i++) {
  const x = X_MIN + (X_MAX - X_MIN) * (i / (GX - 1));
  for (let j = 0; j < GZ; j++) {
    const z = Z_MIN + (Z_MAX - Z_MIN) * (j / (GZ - 1));
    positions[pIdx++] = x;
    positions[pIdx++] = 0;
    positions[pIdx++] = z;
  }
}

const pointGeo = new THREE.BufferGeometry();
pointGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pointGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 33), 200);

/* ============================================================
   4. 波纹场着色器
   ============================================================ */
const vertexShader = /* glsl */`
  uniform float uPhase;
  uniform float uK;
  uniform float uD;
  uniform float uPhi;
  uniform float uHeight;
  uniform float uSize;
  uniform float uPixelRatio;

  varying float vEnv;
  varying float vH;

  void main() {
    float x = position.x;
    float z = position.z;

    // 两条缝到该点的距离
    float r1 = length(vec2(x - uD * 0.5, z));
    float r2 = length(vec2(x + uD * 0.5, z));

    float rMid = (r1 + r2) * 0.5;
    float dR   = r2 - r1;

    // 干涉包络：cos( k·Δr/2 − φ/2 )
    float env  = cos(uK * dR * 0.5 - uPhi * 0.5);
    // 行波相位：cos( ωt − k·r̄ + φ/2 )
    float wave = cos(uPhase - uK * rMid + uPhi * 0.5);

    float h = env * wave;

    vEnv = env;
    vH   = h;

    vec3 p = position;
    p.y = h * uHeight;

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;

    float ps = uSize * uPixelRatio * (110.0 / max(-mv.z, 1.0));
    gl_PointSize = clamp(ps, 1.0, 7.0);
  }
`;

const fragmentShader = /* glsl */`
  varying float vEnv;
  varying float vH;

  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float dist = length(uv);
    if (dist > 0.5) discard;
    float aa = smoothstep(0.5, 0.34, dist);

    float e = vEnv * 0.5 + 0.5;     // 0 → 1
    float a = abs(vH);              // 0 → 1

    vec3 c1 = vec3(0.05, 0.09, 0.40);   // 深靛蓝
    vec3 c2 = vec3(0.22, 0.76, 1.00);   // 青蓝
    vec3 c3 = vec3(1.00, 0.42, 0.94);   // 品红

    vec3 col = mix(c1, c2, smoothstep(0.0, 0.58, e));
    col = mix(col, c3, smoothstep(0.58, 1.0, e) * 0.78);

    col *= 0.22 + a * 1.75;

    float alpha = (0.05 + a * 0.92) * aa;

    gl_FragColor = vec4(col, alpha);
  }
`;

const fieldMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const fieldPoints = new THREE.Points(pointGeo, fieldMat);
fieldPoints.frustumCulled = false;
scene.add(fieldPoints);

/* ============================================================
   5. 拾取平面（用于点击波峰）
   ============================================================ */
const pickPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(800, 800),
  new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
);
pickPlane.rotation.x = -Math.PI / 2;
pickPlane.position.set(0, 0, 33);
scene.add(pickPlane);

/* ============================================================
   6. 音频系统
   ============================================================ */
let actx = null;
let master = null;
let reverbSend = null;
let droneGain = null;
let droneFilter = null;
let lastPhaseToneTime = 0;

function makeImpulse(dur = 3.5, decay = 2.2) {
  const rate = actx.sampleRate;
  const len = Math.floor(rate * dur);
  const buf = actx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();

  master = actx.createGain();
  master.gain.value = 0.5;
  master.connect(actx.destination);

  /* --- 混响 --- */
  const conv = actx.createConvolver();
  conv.buffer = makeImpulse(3.6, 2.1);
  const wet = actx.createGain();
  wet.gain.value = 0.6;
  conv.connect(wet);
  wet.connect(master);

  reverbSend = actx.createGain();
  reverbSend.gain.value = 1.0;
  reverbSend.connect(conv);

  /* --- 底噪低鸣 --- */
  droneGain = actx.createGain();
  droneGain.gain.value = 0.0;
  droneGain.connect(master);

  const dRev = actx.createGain();
  dRev.gain.value = 0.65;
  droneGain.connect(dRev);
  dRev.connect(conv);

  droneFilter = actx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = 340;
  droneFilter.Q.value = 4.0;
  droneFilter.connect(droneGain);

  // 低频层：轻微失谐 → 缓慢拍频
  [55.0, 55.38, 82.41, 110.0].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = i < 2 ? 'sine' : 'triangle';
    o.frequency.value = f;
    const g = actx.createGain();
    g.gain.value = 0.30 / (1 + i * 0.85);
    o.connect(g);
    g.connect(droneFilter);
    o.start();
  });

  // 梦幻高频微光层（绕过低通）
  const hiGain = actx.createGain();
  hiGain.gain.value = 0.115;
  hiGain.connect(droneGain);

  [392.0, 523.25, 659.25, 783.99, 987.77].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    o.detune.value = (i % 2 === 0 ? 1 : -1) * 7;

    const g = actx.createGain();
    g.gain.value = 0.050 / (1 + i * 0.55);

    const lfo = actx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.08 + i * 0.041;
    const la = actx.createGain();
    la.gain.value = 0.032;
    lfo.connect(la);
    la.connect(g.gain);
    lfo.start();

    o.connect(g);
    g.connect(hiGain);
    o.start();
  });
}

function ensureAudio() {
  if (!actx) initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
}
window.addEventListener('pointerdown', ensureAudio, { passive: true });
window.addEventListener('wheel', ensureAudio, { passive: true });

/* ---------- 视场旋转 → 底噪起伏 ---------- */
function updateDrone(rotSpeed) {
  if (!actx || !droneGain) return;
  const t = actx.currentTime;
  const g = 0.042 + Math.min(0.20, rotSpeed * 0.085);
  droneGain.gain.setTargetAtTime(g, t, 0.32);
  droneFilter.frequency.setTargetAtTime(
    300 + Math.min(rotSpeed * 270, 880), t, 0.36
  );
}

/* ---------- 点击波峰：量子滴答脆响 ---------- */
function playDrop(intensity, pitchFactor) {
  ensureAudio();
  if (!actx) return;
  const t = actx.currentTime;

  const f = 900 + pitchFactor * 2400;
  const amp = 0.055 + intensity * 0.235;

  // 主体滴答
  const o = actx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(f * 1.65, t);
  o.frequency.exponentialRampToValueAtTime(f, t + 0.065);

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(amp, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.58);

  o.connect(g);
  g.connect(master);
  g.connect(reverbSend);
  o.start(t);
  o.stop(t + 0.65);

  // 清亮泛音
  const o2 = actx.createOscillator();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(f * 2.45, t);
  o2.frequency.exponentialRampToValueAtTime(f * 1.52, t + 0.095);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.linearRampToValueAtTime(amp * 0.38, t + 0.003);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

  o2.connect(g2);
  g2.connect(master);
  g2.connect(reverbSend);
  o2.start(t);
  o2.stop(t + 0.38);
}

/* ---------- 相位偏移 φ：层叠渐变异彩尾音 ---------- */
function playPhaseTone(phiNorm) {
  ensureAudio();
  if (!actx) return;
  const now = actx.currentTime;
  if (now - lastPhaseToneTime < 0.14) return;
  lastPhaseToneTime = now;

  const base = 220 * Math.pow(2, phiNorm * 2.2);

  [1, 1.5, 2.0].forEach((r, i) => {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(base * r, now);
    o.frequency.linearRampToValueAtTime(base * r * 1.34, now + 1.7);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.052 / (1 + i * 0.9), now + 0.16);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.7);

    o.connect(g);
    g.connect(master);
    g.connect(reverbSend);
    o.start(now);
    o.stop(now + 2.9);
  });
}

/* ============================================================
   7. UI 绑定
   ============================================================ */
const sO = document.getElementById('sO');
const sK = document.getElementById('sK');
const sD = document.getElementById('sD');
const sP = document.getElementById('sP');
const vO = document.getElementById('vO');
const vK = document.getElementById('vK');
const vD = document.getElementById('vD');
const vP = document.getElementById('vP');

sO.addEventListener('input', () => {
  ensureAudio();
  params.omega = parseFloat(sO.value);
  vO.textContent = params.omega.toFixed(2);
});

sK.addEventListener('input', () => {
  ensureAudio();
  params.k = parseFloat(sK.value);
  vK.textContent = params.k.toFixed(2);
  uniforms.uK.value = params.k;
});

sD.addEventListener('input', () => {
  ensureAudio();
  params.d = parseFloat(sD.value);
  vD.textContent = params.d.toFixed(1);
  uniforms.uD.value = params.d;
});

sP.addEventListener('input', () => {
  ensureAudio();
  params.phi = parseFloat(sP.value);
  vP.textContent = params.phi.toFixed(2);
  uniforms.uPhi.value = params.phi;
  playPhaseTone(params.phi / (Math.PI * 2));
});

/* ---------- 点击拾取波峰 ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX = 0, downY = 0;

canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  downX = e.clientX;
  downY = e.clientY;
});

canvas.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;

  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);

  const hits = raycaster.intersectObject(pickPlane, false);
  if (hits.length > 0) {
    const px = hits[0].point.x;
    const pz = hits[0].point.z;

    const d = params.d, k = params.k, phi = params.phi;
    const r1 = Math.hypot(px - d * 0.5, pz);
    const r2 = Math.hypot(px + d * 0.5, pz);

    const env  = Math.cos(k * (r2 - r1) * 0.5 - phi * 0.5);
    const wave = Math.cos(phaseAccum - k * (r1 + r2) * 0.5 + phi * 0.5);
    const h = env * wave;

    playDrop(Math.abs(h), env * 0.5 + 0.5);
  } else {
    playDrop(0.45, Math.random());
  }
});

/* ============================================================
   8. 主循环
   ============================================================ */
let prevTime = performance.now();
let prevCamAngle = Math.atan2(camera.position.x, camera.position.z);
let smoothRot = 0;

function animate() {
  const now = performance.now();
  const dt = Math.min((now - prevTime) / 1000, 0.1);
  prevTime = now;

  controls.update();

  /* --- 相位随时间流动 --- */
  phaseAccum += dt * params.omega;
  uniforms.uPhase.value = phaseAccum;

  /* --- 相机方位角速度 → 底噪起伏 --- */
  const camAng = Math.atan2(camera.position.x, camera.position.z);
  let dAng = camAng - prevCamAngle;
  while (dAng > Math.PI) dAng -= Math.PI * 2;
  while (dAng < -Math.PI) dAng += Math.PI * 2;
  prevCamAngle = camAng;

  const rotSpeed = Math.abs(dAng) / Math.max(dt, 0.001);
  smoothRot += (rotSpeed - smoothRot) * 0.14;
  updateDrone(smoothRot);

  renderer.render(scene, camera);
}

/* ============================================================
   9. 启动
   ============================================================ */
renderer.setAnimationLoop(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.uPixelRatio.value = renderer.getPixelRatio();
});
</script>
</body>
</html>
