<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁偶极场线 · 向量场编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>磁偶极场线 · 向量场编织</h2>
        <div class="sub">Three orthogonal magnetic dipoles · Field line foliations</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">B₁ = 3(m̂₁·r̂)r̂−m̂₁</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">B₂ = 3(m̂₂·r̂)r̂−m̂₂</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">B₃ = 3(m̂₃·r̂)r̂−m̂₃</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.6, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.65;
        const PROJ_D = 2.4;

        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // 磁偶极子场：m为方向单位向量，位于原点
        function dipoleField(p, m) {
            const r = p.length();
            if (r < 0.08) return new THREE.Vector3(0, 0, 0);
            const rHat = p.clone().multiplyScalar(1 / r);
            const dotMR = m.dot(rHat);
            return rHat.clone().multiplyScalar(3 * dotMR).sub(m).multiplyScalar(1 / (r * r * r + 0.02));
        }

        function rk4Step(p, m, ds) {
            const f = (pos) => dipoleField(pos, m);
            const k1 = f(p);
            const pm2 = p.clone().add(k1.clone().multiplyScalar(ds * 0.5));
            const k2 = f(pm2);
            const pm3 = p.clone().add(k2.clone().multiplyScalar(ds * 0.5));
            const k3 = f(pm3);
            const pm4 = p.clone().add(k3.clone().multiplyScalar(ds));
            const k4 = f(pm4);
            return k1.add(k2.multiplyScalar(2)).add(k3.multiplyScalar(2)).add(k4).multiplyScalar(ds / 6);
        }

        function traceLine(seed, m, ds, steps, maxLen) {
            const pts = [];
            let p = seed.clone();
            for (let i = 0; i < steps; i++) {
                if (p.length() < 0.04 || p.length() > maxLen) break;
                pts.push(p.clone());
                const dp = rk4Step(p, m, ds);
                if (dp.length() < 1e-8) break;
                p.add(dp);
            }
            return pts;
        }

        function createDipoleFamily(m, color, opacity, seedRadius, numSeeds, ds, steps) {
            const group = new THREE.Group();
            // 在空间中均匀分布种子点
            const phi_g = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < numSeeds; i++) {
                const y = 1 - (2 * i + 1) / numSeeds;
                const rAtY = Math.sqrt(1 - y * y);
                const theta = phi_g * i;
                const seed3D = new THREE.Vector3(
                    seedRadius * rAtY * Math.cos(theta),
                    seedRadius * y,
                    seedRadius * rAtY * Math.sin(theta)
                );
                const pts3D = traceLine(seed3D, m, ds, steps, 7.5);
                if (pts3D.length < 2) continue;
                const proj = pts3D.map(p => stereographic(p.x, p.y));
                const valid = proj.filter(p => p && p.length() < 9.5);
                if (valid.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(valid);
                const mat = new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'dipole-weave';
        scene.add(rootGroup);

        // 金色族：偶极子方向沿x轴
        const mX = new THREE.Vector3(1, 0, 0);
        rootGroup.add(createDipoleFamily(mX, COLOR_GOLD, 0.60, 2.4, 42, 0.045, 260));
        rootGroup.add(createDipoleFamily(mX, COLOR_GOLD, 0.38, 1.8, 22, 0.048, 220));

        // 青色族：偶极子方向沿y轴
        const mY = new THREE.Vector3(0, 1, 0);
        rootGroup.add(createDipoleFamily(mY, COLOR_CYAN, 0.60, 2.4, 42, 0.045, 260));
        rootGroup.add(createDipoleFamily(mY, COLOR_CYAN, 0.38, 1.8, 22, 0.048, 220));

        // 品红族：偶极子方向沿z轴
        const mZ = new THREE.Vector3(0, 0, 1);
        rootGroup.add(createDipoleFamily(mZ, COLOR_MAGENTA, 0.60, 2.4, 42, 0.045, 260));
        rootGroup.add(createDipoleFamily(mZ, COLOR_MAGENTA, 0.38, 1.8, 22, 0.048, 220));

        // 额外：倾斜偶极子方向
        const mD1 = new THREE.Vector3(1, 1, 1).normalize();
        rootGroup.add(createDipoleFamily(mD1, COLOR_GOLD, 0.35, 1.5, 14, 0.050, 200));
        const mD2 = new THREE.Vector3(1, -1, 0.7).normalize();
        rootGroup.add(createDipoleFamily(mD2, COLOR_CYAN, 0.35, 1.5, 14, 0.050, 200));
        const mD3 = new THREE.Vector3(0.5, 1, -1).normalize();
        rootGroup.add(createDipoleFamily(mD3, COLOR_MAGENTA, 0.35, 1.5, 14, 0.050, 200));

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const phi = j * 2 * Math.PI / 240;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const theta = 0.02 + j * Math.PI / 240;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        console.log('磁偶极场线编织总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.16;
            rootGroup.rotation.y = t * 0.27;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.8;
            const camAngle = t * 0.08;
            const camHeight = 2.7 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 磁偶极场线向量场编织动画已稳定运行');
    </script>
</body>
</html>
