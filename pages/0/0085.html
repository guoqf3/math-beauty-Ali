<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三叶结平行织线 · 拓扑编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
            font-style: italic;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>三叶结平行织线 · 拓扑编织</h2>
        <div class="sub">Trefoil knot parallel strands · Braid topology</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">x = sin t + 2 sin 2t</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">y = cos t - 2 cos 2t</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">z = − sin 3t</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 容器与场景
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 20);
        camera.position.set(3.2, 2.0, 7.8);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 颜色
        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.9;

        // 三叶结参数方程
        function trefoilPoint(t) {
            return new THREE.Vector3(
                Math.sin(t) + 2 * Math.sin(2 * t),
                Math.cos(t) - 2 * Math.cos(2 * t),
                -Math.sin(3 * t)
            ).multiplyScalar(SCALE);
        }

        // 创建编织线：平行偏移多条曲线
        function createParallelStrands(baseColor, numStrands, amplitude, phaseShift, numPoints) {
            const group = new THREE.Group();
            const tRange = 2 * Math.PI;
            for (let i = 0; i < numStrands; i++) {
                const offset = (i - numStrands/2) * 0.06;
                const phase = i * phaseShift;
                const points = [];
                const dt = tRange / numPoints;
                for (let j = 0; j <= numPoints; j++) {
                    const t = j * dt + phase;
                    const p = trefoilPoint(t);
                    // 沿法向偏移产生平行效果
                    const nextT = t + 0.01;
                    const tan = trefoilPoint(nextT).sub(p).normalize();
                    const norm = new THREE.Vector3(-tan.y, tan.x, 0).normalize();
                    if (norm.length() < 0.1) norm.set(0, 0, 1);
                    points.push(p.clone().add(norm.multiplyScalar(offset)));
                }
                if (points.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineBasicMaterial({
                    color: baseColor, transparent: true, opacity: 0.7, depthWrite: true, depthTest: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'trefoil-braid';
        scene.add(rootGroup);

        // 金色编织线：12条
        rootGroup.add(createParallelStrands(COLOR_GOLD, 12, 0.05, Math.PI/5, 600));
        // 青色编织线：12条，相位偏移
        rootGroup.add(createParallelStrands(COLOR_CYAN, 12, 0.06, Math.PI/4, 600));
        // 品红编织线：12条
        rootGroup.add(createParallelStrands(COLOR_MAGENTA, 12, 0.055, Math.PI/6, 600));

        console.log('三叶结平行线总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 7 + Math.random() * 10;
            starsPos[i*3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i*3+1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i*3+2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---------- 双保险动画机制 ----------
        // 使用手动时钟，以 performance.now() 确保始终前进
        let startT = performance.now();
        function getElapsed() {
            return (performance.now() - startT) * 0.001;
        }

        // 动画主循环（由 requestAnimationFrame 调用）
        function mainLoop() {
            const t = getElapsed();
            // 更新旋转
            rootGroup.rotation.x = t * 0.18;
            rootGroup.rotation.y = t * 0.30;
            rootGroup.rotation.z = t * 0.12;
            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;
            // 相机环绕
            const camRadius = 7.8;
            const camAngle = t * 0.09;
            const camHeight = 2.3 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);
            // 渲染
            renderer.render(scene, camera);
        }

        // 使用 requestAnimationFrame 并永远递归
        let animFrameId;
        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try {
                    mainLoop();
                } catch (e) {
                    console.warn('动画循环错误:', e);
                }
                scheduleFrame(); // 递归调用，永不停止
            });
        }

        // 后备定时器：每2秒强制检查一次，若 requestAnimationFrame 因任何原因中断，会立即重启
        let backupTimer = setInterval(() => {
            if (animFrameId !== null) {
                // 尝试确认循环是否还活着：如果超过3秒没有更新，则重置
                const now = performance.now();
                // 简单推算：如果 elapsed 明显比预期小，可能是刚刚重启，忽略
            }
            // 无论如何，再强制安排一帧（如果已经停止则会重启）
            cancelAnimationFrame(animFrameId);
            scheduleFrame();
        }, 2000);

        // 启动动画
        scheduleFrame();

        // 响应式处理
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 三叶结平行织线动画已启动 (双保险循环)');
    </script>
</body>
</html>
