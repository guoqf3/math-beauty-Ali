<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴随轨道编织 · SU(2)群作用</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>伴随轨道编织 · SU(2)群作用</h2>
        <div class="sub">Adjoint orbits on S³ · g·q·g⁻¹ flow · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">轴i: q(t)=e^{it/2}·q₀·e^{-it/2}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">轴j: q(t)=e^{jt/2}·q₀·e^{-jt/2}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">轴k: q(t)=e^{kt/2}·q₀·e^{-kt/2}</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 2.6;
        const PROJ_W = 2.4;
        const T_MAX = 5.5;
        const STEPS = 300;

        function stereographic(x, y, z, w) {
            const denom = PROJ_W - w;
            if (Math.abs(denom) < 0.025) return null;
            const f = SCALE / denom;
            const pt = new THREE.Vector3(x * f, y * f, z * f);
            return pt.length() < 9.0 ? pt : null;
        }

        function quatMultiply(q1, q2) {
            return new THREE.Quaternion(
                q1.w * q2.x + q1.x * q2.w + q1.y * q2.z - q1.z * q2.y,
                q1.w * q2.y - q1.x * q2.z + q1.y * q2.w + q1.z * q2.x,
                q1.w * q2.z + q1.x * q2.y - q1.y * q2.x + q1.z * q2.w,
                q1.w * q2.w - q1.x * q2.x - q1.y * q2.y - q1.z * q2.z
            );
        }

        // 伴随作用: q(t) = rot(t) * q0 * rot(t)⁻¹
        function adjointOrbit(q0, axis, tMax, steps) {
            const pts = [];
            const dt = tMax / steps;
            for (let i = 0; i <= steps; i++) {
                const t = i * dt;
                const halfT = t * 0.5;
                const rot = new THREE.Quaternion(
                    Math.cos(halfT),
                    axis.x * Math.sin(halfT),
                    axis.y * Math.sin(halfT),
                    axis.z * Math.sin(halfT)
                );
                const rotInv = new THREE.Quaternion(-rot.x, -rot.y, -rot.z, rot.w);
                const q = quatMultiply(quatMultiply(rot, q0), rotInv);
                const proj = stereographic(q.x, q.y, q.z, q.w);
                if (proj) pts.push(proj);
            }
            return pts;
        }

        // 生成均匀分布在S³上的种子点
        function fibSphereS3(count) {
            const seeds = [];
            const phi = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < count; i++) {
                const y = 1 - (2 * i + 1) / count;
                const r = Math.sqrt(1 - y * y);
                const theta = phi * i;
                const u = Math.random() * 2 * Math.PI;
                const v = Math.random() * 2 * Math.PI;
                const q = new THREE.Quaternion(
                    Math.cos(u) * r * Math.cos(theta),
                    Math.sin(u) * r * Math.sin(theta),
                    y,
                    Math.cos(v) * Math.sqrt(1 - r * r)
                ).normalize();
                seeds.push(q);
            }
            return seeds;
        }

        const axes = [
            { axis: new THREE.Vector3(1, 0, 0), color: COLOR_GOLD },
            { axis: new THREE.Vector3(0, 1, 0), color: COLOR_CYAN },
            { axis: new THREE.Vector3(0, 0, 1), color: COLOR_MAGENTA },
        ];

        const rootGroup = new THREE.Group();
        rootGroup.name = 'adjoint-orbits';
        scene.add(rootGroup);

        const numSeedsPerAxis = 36;
        const allSeeds = fibSphereS3(numSeedsPerAxis * 3);

        // 为每个轴分配种子并生成轨道
        axes.forEach((cfg, axIdx) => {
            const startIdx = axIdx * numSeedsPerAxis;
            const endIdx = startIdx + numSeedsPerAxis;
            for (let i = startIdx; i < endIdx; i++) {
                const q0 = allSeeds[i];
                const pts = adjointOrbit(q0, cfg.axis, T_MAX, STEPS);
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: cfg.color,
                    transparent: true,
                    opacity: 0.52,
                    depthWrite: true,
                    depthTest: true,
                });
                rootGroup.add(new THREE.Line(geom, mat));
            }
        });

        // 额外增加密度：绕对角轴的伴随轨道
        const diagAxes = [
            { axis: new THREE.Vector3(1, 1, 1).normalize(), color: COLOR_GOLD },
            { axis: new THREE.Vector3(1, -1, 0.5).normalize(), color: COLOR_CYAN },
            { axis: new THREE.Vector3(0.5, 1, -1).normalize(), color: COLOR_MAGENTA },
        ];
        const extraSeeds = fibSphereS3(36);
        diagAxes.forEach((cfg, idx) => {
            for (let i = idx * 12; i < (idx + 1) * 12; i++) {
                const q0 = extraSeeds[i % extraSeeds.length];
                const pts = adjointOrbit(q0, cfg.axis, T_MAX * 0.8, STEPS);
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: cfg.color,
                    transparent: true,
                    opacity: 0.38,
                    depthWrite: true,
                    depthTest: true,
                });
                rootGroup.add(new THREE.Line(geom, mat));
            }
        });

        // 辅助参考球面
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SCALE * Math.sin(lat);
            const z = SCALE * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const phi = j * 2 * Math.PI / 240;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.10, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 240; j++) {
                const theta = 0.02 + j * Math.PI / 240;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SCALE * st * Math.cos(phi), SCALE * Math.cos(theta), SCALE * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }

        console.log('伴随轨道编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.26;
            rootGroup.rotation.z = t * 0.11;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.4;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ SU(2)伴随轨道编织动画已稳定运行');
    </script>
</body>
</html>
