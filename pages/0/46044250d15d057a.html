<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>光之喷泉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #hint {
            position: fixed;
            bottom: 20px;
            left: 24px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease;
            font-weight: 300;
        }
        #fps-badge {
            position: fixed;
            top: 16px;
            right: 18px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="fps-badge"></div>
    <div id="hint">移动位置 · 点击爆发</div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─── 性能与安全检查 ───
            if (!window.PIXI) {
                console.warn('PixiJS 加载失败');
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">需要WebGL支持</div>';
                return;
            }

            // ─── 常量定义 ───
            const MAX_PARTICLES = 800;          // 粒子池大小
            const GRAVITY = 0.55;               // 重力加速度
            const BASE_EMIT_RATE = 8;           // 基础喷射速率（每帧粒子数）
            const BURST_COUNT = 120;            // 点击爆发粒子数
            const PARTICLE_LIFETIME = 120;       // 粒子最大寿命（帧数近似）
            const BASE_SCALE = 0.08;
            const FOCAL_LENGTH = 1200;

            // ─── 颜色主题 ───
            const COLOR_THEMES = [
                [0xFFD447, 0xFF9D4D, 0xFF6B4D, 0xFFB85C, 0xFFE0A0], // 暖阳
                [0x4D9FFF, 0xB06BFF, 0x4DFFD9, 0x6B6BFF, 0x7CD4FF], // 冷蓝紫
                [0x6BFF6B, 0x4DFFD9, 0xB0FF6B, 0x4DFFFF, 0x8DFF4D], // 极光绿
                [0xFF6B9D, 0xFF4D6B, 0xFFB0C8, 0xFF9D4D, 0xD46BFF], // 蔷薇
                [0x4DFFD9, 0x4D9FFF, 0x6B6BFF, 0xB06BFF, 0xFFD447], // 全息
            ];
            let currentThemeIndex = 0;

            // ─── DOM 元素 ───
            const fpsBadge = document.getElementById('fps-badge');
            const hintEl = document.getElementById('hint');

            // ─── PixiJS 应用初始化 ───
            let app;
            try {
                app = new PIXI.Application({
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0x050510,
                    antialias: false,
                    autoDensity: true,
                    resolution: Math.min(window.devicePixelRatio || 1, 2),
                    powerPreference: 'high-performance',
                    forceCanvas: !isWebGLAvailable(),
                });
            } catch (err) {
                console.error('PixiJS 初始化失败:', err);
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding-top:40vh;font-size:16px;">初始化失败</div>';
                return;
            }

            function isWebGLAvailable() {
                try {
                    const canvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext &&
                        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
                } catch (e) { return false; }
            }

            document.body.appendChild(app.view);

            // ─── 创建发光纹理 ───
            function createGlowTexture(size) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const half = size / 2;
                const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
                gradient.addColorStop(0.0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.1, 'rgba(255,255,255,0.95)');
                gradient.addColorStop(0.35, 'rgba(255,255,255,0.6)');
                gradient.addColorStop(0.65, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                const tex = PIXI.Texture.from(c);
                tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
                return tex;
            }

            const glowTex64 = createGlowTexture(64);
            const glowTex128 = createGlowTexture(128);

            // ─── 粒子容器 ───
            const particleContainer = new PIXI.ParticleContainer(MAX_PARTICLES, {
                position: true,
                scale: true,
                tint: true,
                alpha: true,
            }, MAX_PARTICLES, true);
            particleContainer.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(particleContainer);

            // ─── 中心光晕 ───
            const centerGlow = new PIXI.Sprite(glowTex128);
            centerGlow.anchor.set(0.5);
            centerGlow.tint = 0xFFFFFF;
            centerGlow.alpha = 0.4;
            centerGlow.scale.set(1.5);
            centerGlow.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerGlow);

            const centerCore = new PIXI.Sprite(glowTex64);
            centerCore.anchor.set(0.5);
            centerCore.tint = 0xFFFFFF;
            centerCore.alpha = 0.8;
            centerCore.scale.set(0.3);
            centerCore.blendMode = PIXI.BLEND_MODES.ADD;
            app.stage.addChild(centerCore);

            // ─── 粒子池数据结构 ───
            const sprites = [];
            const particles = [];
            // 粒子数据: { active, x, y, vx, vy, life, maxLife, scale, colorIdx, baseAlpha }
            for (let i = 0; i < MAX_PARTICLES; i++) {
                const sprite = new PIXI.Sprite(glowTex64);
                sprite.anchor.set(0.5);
                sprite.alpha = 0;
                sprite.scale.set(BASE_SCALE);
                sprite.tint = COLOR_THEMES[0][0];
                particles.push({
                    active: false,
                    x: 0,
                    y: 0,
                    vx: 0,
                    vy: 0,
                    life: 0,
                    maxLife: 1,
                    scale: BASE_SCALE,
                    colorIdx: 0,
                    baseAlpha: 1,
                });
                sprites.push(sprite);
                particleContainer.addChild(sprite);
            }

            let activeCount = 0;

            // ─── 喷射源位置 ───
            let emitterX = window.innerWidth / 2;
            let emitterY = window.innerHeight - 10;
            let mouseX = window.innerWidth / 2;
            let smoothMouseX = mouseX;
            let mouseY = window.innerHeight / 2;
            let time = 0;
            let frameCount = 0;
            let fpsLastTime = 0;
            let burstEnergy = 0; // 爆发能量 (用于视觉脉冲)

            // ─── 音频上下文 ───
            let audioCtx = null;
            function ensureAudio() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        audioCtx = new AudioContext();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            // 呼吸感音效：上升音 + 低频呼吸
            function playBreathSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;

                // 上升音（喷发）
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(220, now);
                osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain1.gain.setValueAtTime(0.5, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.2);

                // 低频呼吸声（吸气-呼气）
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(150, now + 0.1);
                osc2.frequency.exponentialRampToValueAtTime(60, now + 0.55);
                gain2.gain.setValueAtTime(0.001, now + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.35, now + 0.25);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.1);
                osc2.stop(now + 0.6);
            }

            // ─── 粒子发射函数 ───
            function emitParticle(x, y, speed, angle, colorIdx) {
                // 寻找空闲粒子
                for (let i = 0; i < MAX_PARTICLES; i++) {
                    const p = particles[i];
                    if (!p.active) {
                        p.active = true;
                        p.x = x;
                        p.y = y;
                        const rad = angle + (Math.random() - 0.5) * 0.8; // 角度随机散布
                        const spd = speed * (0.6 + Math.random() * 0.8);
                        p.vx = Math.cos(rad) * spd;
                        p.vy = Math.sin(rad) * spd;
                        p.life = PARTICLE_LIFETIME * (0.5 + Math.random() * 0.6);
                        p.maxLife = p.life;
                        p.scale = BASE_SCALE * (0.7 + Math.random() * 0.6);
                        p.colorIdx = colorIdx;
                        p.baseAlpha = 0.7 + Math.random() * 0.3;
                        activeCount++;
                        return;
                    }
                }
                // 如果池满，强制重置最老的粒子（简化处理：重置第一个）
                const p = particles[0];
                p.active = true;
                p.x = x;
                p.y = y;
                const rad = angle + (Math.random() - 0.5) * 0.8;
                const spd = speed * (0.6 + Math.random() * 0.8);
                p.vx = Math.cos(rad) * spd;
                p.vy = Math.sin(rad) * spd;
                p.life = PARTICLE_LIFETIME * (0.5 + Math.random() * 0.6);
                p.maxLife = p.life;
                p.scale = BASE_SCALE * (0.7 + Math.random() * 0.6);
                p.colorIdx = colorIdx;
                p.baseAlpha = 0.7 + Math.random() * 0.3;
                activeCount++;
            }

            // ─── 爆发喷射 ───
            function triggerBurst() {
                const theme = COLOR_THEMES[currentThemeIndex];
                for (let i = 0; i < BURST_COUNT; i++) {
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6; // 向上为主
                    const speed = 8 + Math.random() * 18;
                    const colorIdx = Math.floor(Math.random() * theme.length);
                    emitParticle(emitterX, emitterY, speed, angle, colorIdx);
                }
                burstEnergy = 1.0;
                // 切换主题
                currentThemeIndex = (currentThemeIndex + 1) % COLOR_THEMES.length;
                // 更新中心光晕颜色
                centerCore.tint = COLOR_THEMES[currentThemeIndex][0];
                centerGlow.tint = COLOR_THEMES[currentThemeIndex][1] || COLOR_THEMES[currentThemeIndex][0];
                // 播放音效
                playBreathSound();
            }

            // ─── 更新粒子 ───
            function updateParticles(delta) {
                const theme = COLOR_THEMES[currentThemeIndex];
                const gravity = GRAVITY * delta * 60; // 调整重力与帧率无关
                if (burstEnergy > 0) {
                    burstEnergy = Math.max(0, burstEnergy - delta * 3.5);
                }

                for (let i = 0; i < MAX_PARTICLES; i++) {
                    const p = particles[i];
                    const spr = sprites[i];
                    if (!p.active) {
                        spr.alpha = 0;
                        continue;
                    }

                    // 物理更新
                    p.vy += gravity;
                    p.x += p.vx * delta * 60 * 0.8;
                    p.y += p.vy * delta * 60 * 0.8;
                    p.life -= delta * 60;

                    // 如果超出边界或生命结束
                    if (p.life <= 0 || p.y > window.innerHeight + 50 || p.x < -100 || p.x > window.innerWidth + 100) {
                        p.active = false;
                        activeCount--;
                        spr.alpha = 0;
                        continue;
                    }

                    // 颜色与透明度随生命衰减
                    const lifeRatio = p.life / p.maxLife;
                    const alpha = p.baseAlpha * lifeRatio;
                    const scaleMod = p.scale * (0.5 + 0.5 * lifeRatio) * (1 + burstEnergy * 0.3);
                    const color = theme[p.colorIdx % theme.length];

                    spr.position.set(p.x, p.y);
                    spr.scale.set(scaleMod);
                    spr.tint = color;
                    spr.alpha = Math.max(0, Math.min(1, alpha));
                }
            }

            // ─── 持续喷射（基础流量） ───
            function emitContinuous(delta) {
                const theme = COLOR_THEMES[currentThemeIndex];
                const rate = BASE_EMIT_RATE + burstEnergy * 40; // 爆发时喷射加快
                const count = Math.floor(rate * delta * 60 * 0.1); // 每帧发射量
                for (let i = 0; i < count; i++) {
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.9;
                    const speed = 7 + Math.random() * 12;
                    const colorIdx = Math.floor(Math.random() * theme.length);
                    emitParticle(emitterX, emitterY, speed, angle, colorIdx);
                }
            }

            // ─── 更新喷射源位置 ───
            function updateEmitterPosition() {
                const targetX = smoothMouseX;
                emitterX += (targetX - emitterX) * 0.08;
                // 限制在屏幕内
                emitterX = Math.max(40, Math.min(window.innerWidth - 40, emitterX));
                emitterY = window.innerHeight - 10;
            }

            // ─── 更新中心光晕 ───
            function updateCenterGlow() {
                const pulse = 0.3 + 0.1 * Math.sin(time * 2.0) + burstEnergy * 0.4;
                centerGlow.position.set(emitterX, emitterY - 20);
                centerGlow.alpha = Math.max(0.15, Math.min(0.6, pulse));
                centerGlow.scale.set(1.5 + 0.3 * Math.sin(time * 1.5) + burstEnergy * 0.8);
                centerCore.position.set(emitterX, emitterY - 20);
                centerCore.scale.set(0.3 + 0.06 * Math.sin(time * 2.5) + burstEnergy * 0.25);
                centerCore.alpha = 0.7 + 0.2 * Math.sin(time * 1.8) + burstEnergy * 0.3;
            }

            // ─── 主循环 ───
            app.ticker.add((delta) => {
                const dt = Math.min(delta / 60, 0.05);
                time += dt;
                frameCount++;

                // 平滑鼠标
                smoothMouseX += (mouseX - smoothMouseX) * 0.08;

                // 更新喷射源位置
                updateEmitterPosition();

                // 持续喷射
                emitContinuous(dt);

                // 更新粒子
                updateParticles(dt);

                // 更新中心光晕
                updateCenterGlow();

                // FPS 显示
                if (time - fpsLastTime > 0.5) {
                    const fps = Math.round(frameCount / (time - fpsLastTime));
                    fpsBadge.textContent = fps + ' fps';
                    frameCount = 0;
                    fpsLastTime = time;
                }
            });

            // ─── 交互事件 ───
            function getCanvasCoords(e) {
                const rect = app.view.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function onPointerMove(e) {
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
            }

            function onPointerDown(e) {
                e.preventDefault();
                ensureAudio();
                const coords = getCanvasCoords(e);
                mouseX = coords.x;
                mouseY = coords.y;
                triggerBurst();
            }

            function onPointerLeave() {
                mouseX = window.innerWidth / 2;
            }

            app.view.addEventListener('mousemove', onPointerMove);
            app.view.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mouseleave', onPointerLeave);

            app.view.addEventListener('touchmove', onPointerMove, { passive: true });
            app.view.addEventListener('touchstart', onPointerDown, { passive: false });

            // ─── 窗口调整 ───
            function handleResize() {
                app.renderer.resize(window.innerWidth, window.innerHeight);
                emitterY = window.innerHeight - 10;
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(handleResize, 300);
            });

            // ─── 键盘交互 ───
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    ensureAudio();
                    triggerBurst();
                }
            });

            // ─── 启动 ───
            mouseX = window.innerWidth / 2;
            smoothMouseX = mouseX;
            emitterX = mouseX;
            emitterY = window.innerHeight - 10;

            setTimeout(() => {
                if (hintEl) {
                    hintEl.style.opacity = '0';
                    setTimeout(() => {
                        if (hintEl) hintEl.style.display = 'none';
                    }, 1600);
                }
            }, 3200);

            handleResize();
            console.log('✨ 光之喷泉已启动 — 粒子池大小:', MAX_PARTICLES);
        })();
    </script>
</body>
</html>
