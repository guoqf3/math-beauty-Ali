<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>齿轮啮合盘 · Three.js</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 50% 42%, #1c1c1e 0%, #101012 46%, #050506 100%);
    color: #e0e0e4;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #container { position: fixed; inset: 0; }
  canvas { display: block; }

  #glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(circle at 50% 45%, transparent 36%, rgba(0,0,0,0.68) 100%);
  }

  .panel {
    position: fixed; z-index: 10;
    background: rgba(28, 28, 32, 0.55);
    border: 1px solid rgba(190, 190, 210, 0.20);
    border-radius: 16px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
    padding: 16px 20px;
  }

  /* ---- 信息 ---- */
  .info { top: 22px; left: 22px; max-width: 320px; }
  .info h1 {
    font-size: 16.5px; font-weight: 600; letter-spacing: 1.8px;
    background: linear-gradient(92deg, #f0f0f4, #b8c4d8 46%, #9aa4b8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 9px;
  }
  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 14px; font-style: italic; color: #b0bdd0;
    letter-spacing: 0.3px; margin-bottom: 9px; line-height: 1.65;
    text-shadow: 0 0 20px rgba(140, 170, 210, 0.42);
  }
  .hint {
    font-size: 11.5px; color: rgba(180, 190, 210, 0.48);
    line-height: 1.75; letter-spacing: 0.2px;
  }
  .hint b { color: rgba(210, 220, 240, 0.88); font-weight: 500; }

  /* ---- 控制 ---- */
  .controls {
    bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 12px;
    padding: 17px 24px; min-width: 460px;
  }
  .row { display: flex; align-items: center; gap: 13px; }
  .row .lbl {
    font-size: 12px; width: 88px; flex-shrink: 0;
    color: rgba(190, 200, 218, 0.76); letter-spacing: 0.6px;
  }
  .row .val {
    font-size: 12px; width: 70px; text-align: right; flex-shrink: 0;
    font-variant-numeric: tabular-nums; font-weight: 600;
    color: #c8d4e8;
    text-shadow: 0 0 14px rgba(170, 200, 240, 0.55);
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px; border-radius: 4px; outline: none; cursor: pointer;
    background: linear-gradient(90deg, #3a3e4a 0%, #a0aec8 60%, #e0e8f4 100%);
    box-shadow: 0 0 14px rgba(150, 180, 220, 0.30);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #f4f6fa; cursor: pointer; border: none;
    box-shadow: 0 0 10px #c8d4e8, 0 0 24px rgba(180, 205, 240, 0.8);
    transition: transform 0.14s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.26); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border: none; border-radius: 50%;
    background: #f4f6fa; cursor: pointer;
    box-shadow: 0 0 10px #c8d4e8, 0 0 24px rgba(180, 205, 240, 0.8);
  }
  input[type=range]::-moz-range-track {
    height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, #3a3e4a 0%, #a0aec8 60%, #e0e8f4 100%);
  }

  .gear-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 36% 32%, #ffffff, #b8c4d8 56%, #5a6478);
    box-shadow: 0 0 10px #c8d4e8, 0 0 20px rgba(180, 205, 240, 0.5);
    transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
  }

  @media (max-width: 760px) {
    .controls { min-width: 0; width: calc(100% - 24px); padding: 13px 14px; gap: 9px; }
    .row .lbl { width: 66px; font-size: 10.5px; }
    .row .val { width: 58px; font-size: 10.5px; }
    .info { max-width: 224px; padding: 12px 14px; top: 14px; left: 14px; }
    .info h1 { font-size: 14px; }
    .formula { font-size: 11.5px; }
    .hint { font-size: 10px; }
  }
</style>
</head>
<body>

<div id="container"></div>
<div id="glow"></div>

<div class="panel info">
  <h1>齿轮啮合盘</h1>
  <p class="formula">
    x = (R±r)·cos φ ∓ r·cos((R±r)/r·φ)<br>
    y = (R±r)·sin φ − r·sin((R±r)/r·φ)
  </p>
  <p class="hint">
    摆线齿廓 · 模数 m 与齿数 z 决定啮合传动<br>
    <b>拖拽</b> 旋转 · <b>滚轮</b> 缩放 · <b>点击齿轮</b> 金属声
  </p>
</div>

<div class="panel controls">
  <div class="row">
    <div class="gear-dot" id="gearDot"></div>
    <label class="lbl">齿数 z</label>
    <input type="range" id="zSlider" min="8" max="26" step="1" value="14" />
    <span class="val" id="zVal">14</span>
  </div>
  <div class="row">
    <label class="lbl">模数 m</label>
    <input type="range" id="mSlider" min="0.14" max="0.38" step="0.002" value="0.22" />
    <span class="val" id="mVal">0.220</span>
  </div>
  <div class="row">
    <label class="lbl">齿轮数量</label>
    <input type="range" id="nSlider" min="1" max="5" step="1" value="3" />
    <span class="val" id="nVal">3 个</span>
  </div>
  <div class="row">
    <label class="lbl">转动速度</label>
    <input type="range" id="spdSlider" min="0.2" max="3.0" step="0.05" value="1.2" />
    <span class="val" id="spdVal">1.20</span>
  </div>
  <div class="row">
    <label class="lbl">音量</label>
    <input type="range" id="volSlider" min="0" max="100" step="1" value="52" />
    <span class="val" id="volVal">52%</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================================================================
   1. 场景 / 相机 / 渲染器
   ================================================================ */
const container = document.getElementById('container');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0b0e, 0.020);

const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth / window.innerHeight, 0.05, 300
);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.062;
controls.enablePan = false;
controls.minDistance = 1.2;
controls.maxDistance = 42;
controls.autoRotate = false;

/* ================================================================
   2. 环境贴图（金属反射的关键）
   ================================================================ */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;

/* ================================================================
   3. 灯光
   ================================================================ */
scene.add(new THREE.AmbientLight(0x4a5060, 1.6));

const keyLight = new THREE.DirectionalLight(0xffffff, 3.0);
keyLight.position.set(6, 9, 7);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8ca0c0, 1.8);
fillLight.position.set(-7, 3, -4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x6b8fff, 1.6);
rimLight.position.set(-2, -5, -8);
scene.add(rimLight);

const warmAccent = new THREE.PointLight(0xff9944, 5, 18, 2);
warmAccent.position.set(4, 2, 5);
scene.add(warmAccent);

const coolAccent = new THREE.PointLight(0x4488ff, 6, 18, 2);
coolAccent.position.set(-5, -1, 3);
scene.add(coolAccent);

/* ================================================================
   4. 齿轮几何体构建
   ----------------------------------------------------------------
   摆线齿廓：
     节圆半径 R = m·z/2
     滚圆半径 r = m/4
     外摆线（齿顶）：φ ∈ [0, 2π/(2z+1)]
        x = (R+r)·cosφ − r·cos((R+r)/r·φ)
        y = (R+r)·sinφ − r·sin((R+r)/r·φ)
     内摆线（齿根）：φ ∈ [0, 2π/(2z-1)]
        x = (R-r)·cosφ + r·cos((R-r)/r·φ)
        y = (R-r)·sinφ − r·sin((R-r)/r·φ)
   ================================================================ */
const N_ARC = 18;   // 每段摆线弧的采样点数

function buildGearGeometry(z, m, thickness) {
  const R = m * z / 2;        // 节圆半径
  const r = m / 4;            // 滚圆半径
  const toothPitch = (Math.PI * 2) / z;

  const epiWidth  = (Math.PI * 2) / (2 * z + 1);   // 齿顶弧角宽
  const hypoWidth = (Math.PI * 2) / (2 * z - 1);   // 齿根弧角宽

  const pts = [];

  for (let i = 0; i < z; i++) {
    const th = i * toothPitch;

    /* ---- 齿顶（外摆线） ---- */
    const epiRot = th - epiWidth / 2;
    const eCos = Math.cos(epiRot), eSin = Math.sin(epiRot);
    const eA = R + r;
    const eK = eA / r;

    for (let j = 0; j < N_ARC; j++) {
      const phi = (j / N_ARC) * epiWidth;
      const px = eA * Math.cos(phi) - r * Math.cos(eK * phi);
      const py = eA * Math.sin(phi) - r * Math.sin(eK * phi);
      pts.push([px * eCos - py * eSin, px * eSin + py * eCos]);
    }

    /* ---- 齿根（内摆线） ---- */
    const hypoRot = th + toothPitch / 2 - hypoWidth / 2;
    const hCos = Math.cos(hypoRot), hSin = Math.sin(hypoRot);
    const hA = R - r;
    const hK = hA / r;

    for (let j = 0; j < N_ARC; j++) {
      const phi = (j / N_ARC) * hypoWidth;
      const px = hA * Math.cos(phi) + r * Math.cos(hK * phi);
      const py = hA * Math.sin(phi) - r * Math.sin(hK * phi);
      pts.push([px * hCos - py * hSin, px * hSin + py * hCos]);
    }
  }

  /* ---- 构建 Shape ---- */
  const shape = new THREE.Shape();
  shape.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
  shape.closePath();

  /* ---- 轴孔 ---- */
  const holeR = Math.max(R * 0.20, m * 1.6);
  const hole = new THREE.Path();
  const HOLE_SEG = 40;
  for (let i = 0; i <= HOLE_SEG; i++) {
    const a = (i / HOLE_SEG) * Math.PI * 2;
    const x = Math.cos(a) * holeR;
    const y = Math.sin(a) * holeR;
    if (i === 0) hole.moveTo(x, y);
    else hole.lineTo(x, y);
  }
  hole.closePath();
  shape.holes.push(hole);

  /* ---- 挤出成 3D ---- */
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thickness,
    bevelEnabled: true,
    bevelThickness: thickness * 0.06,
    bevelSize: Math.min(m * 0.14, thickness * 0.10),
    bevelSegments: 2,
    curveSegments: 1,
  });

  geo.translate(0, 0, -thickness / 2);
  geo.computeBoundingSphere();
  return geo;
}

/* ================================================================
   5. 齿轮材质
   ================================================================ */
const gearMaterials = [
  new THREE.MeshPhysicalMaterial({
    color: 0xb8c0cc, metalness: 0.92, roughness: 0.28,
    clearcoat: 0.6, clearcoatRoughness: 0.18,
    envMapIntensity: 1.3, emissive: 0x14161a, emissiveIntensity: 0.4,
  }),
  new THREE.MeshPhysicalMaterial({
    color: 0xc8b898, metalness: 0.88, roughness: 0.32,
    clearcoat: 0.5, clearcoatRoughness: 0.20,
    envMapIntensity: 1.25, emissive: 0x18140e, emissiveIntensity: 0.4,
  }),
  new THREE.MeshPhysicalMaterial({
    color: 0x9aa8b8, metalness: 0.95, roughness: 0.24,
    clearcoat: 0.7, clearcoatRoughness: 0.15,
    envMapIntensity: 1.4, emissive: 0x10141a, emissiveIntensity: 0.4,
  }),
];

/* ================================================================
   6. 齿轮组状态
   ================================================================ */
const gearGroup = new THREE.Group();
scene.add(gearGroup);

let gears = [];          // { mesh, phase, dir, z, R, mat }
let omega = 1.2;
let clickAccum = 0;
let currentZ = 14, currentM = 0.22, currentN = 3;
let flashValue = 0;

/* ---- 相位计算：保证相邻齿轮正确啮合 ---- */
function computePhase(z, index) {
  if (index === 0) return 0;
  if (z % 2 === 0) return (index % 2) * (Math.PI / z);
  return 0;   // 奇数齿：全部同相
}

/* ---- 构建齿轮组 ---- */
function rebuildGears() {
  /* 清理 */
  for (const g of gears) {
    gearGroup.remove(g.mesh);
    g.mesh.geometry.dispose();
  }
  gears = [];

  const z = currentZ;
  const m = currentM;
  const n = currentN;
  const R = m * z / 2;
  const thickness = Math.max(m * 3.2, 0.12);

  /* ---- 位置：沿 X 轴排列，中心距 = R_i + R_{i+1} ---- */
  const positions = [0];
  for (let i = 1; i < n; i++) {
    positions.push(positions[i - 1] + 2 * R);   // 同齿数同模数 → 2R
  }

  /* 整体居中 */
  const centerX = (positions[0] + positions[n - 1]) / 2;

  for (let i = 0; i < n; i++) {
    const geo = buildGearGeometry(z, m, thickness);
    const mat = gearMaterials[i % gearMaterials.length].clone();

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(positions[i] - centerX, 0, 0);
    mesh.castShadow = false;
    mesh.receiveShadow = false;
    gearGroup.add(mesh);

    gears.push({
      mesh,
      phase: computePhase(z, i),
      dir: i % 2 === 0 ? 1 : -1,
      z, R, mat,
    });
  }

  /* ---- 相机自动适配 ---- */
  fitCamera(positions[n - 1] - positions[0], R + m);
}

/* ================================================================
   7. 音频引擎
   ================================================================ */
let audioCtx = null;
let masterGain = null;
let audioReady = false;
let currentVolume = 0.52;

function initAudio() {
  if (audioReady) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { audioCtx = new AC(); } catch (e) { return; }

  masterGain = audioCtx.createGain();
  masterGain.gain.value = currentVolume;

  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -16;
  comp.knee.value = 20;
  comp.ratio.value = 7;
  comp.attack.value = 0.003;
  comp.release.value = 0.22;

  masterGain.connect(comp);
  comp.connect(audioCtx.destination);

  audioReady = true;
}

/* ---- ① 齿轮咔哒声（机械传动） ---- */
let lastClickTime = 0;
function playClick() {
  if (!audioReady) return;
  const now = performance.now();
  if (now - lastClickTime < 28) return;   // 防止爆音
  lastClickTime = now;

  const t = audioCtx.currentTime;

  /* 高频金属短脉冲 */
  const f = 2100 + Math.random() * 900;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(f, t);
  osc.frequency.exponentialRampToValueAtTime(f * 0.72, t + 0.022);

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = f * 1.15;
  bp.Q.value = 2.2;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.075, t + 0.0018);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.036);

  osc.connect(bp);
  bp.connect(g);
  g.connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.045);

  /* 一层极短噪声增加"咬合"的质感 */
  const nLen = Math.floor(audioCtx.sampleRate * 0.016);
  const nBuf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const nd = nBuf.getChannelData(0);
  for (let i = 0; i < nLen; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nLen, 2.6);
  }
  const nSrc = audioCtx.createBufferSource();
  nSrc.buffer = nBuf;

  const nBp = audioCtx.createBiquadFilter();
  nBp.type = 'highpass';
  nBp.frequency.value = 2800;

  const nG = audioCtx.createGain();
  nG.gain.setValueAtTime(0.042, t);
  nG.gain.exponentialRampToValueAtTime(0.0001, t + 0.016);

  nSrc.connect(nBp);
  nBp.connect(nG);
  nG.connect(masterGain);
  nSrc.start(t);
}

/* ---- ② 点击齿轮：金属咬合确认音 ---- */
function playMetalClack() {
  if (!audioReady) return;
  const t = audioCtx.currentTime;

  /* 两个不谐和的高频基频 —— 金属"叮" */
  const bases = [2350 + Math.random() * 260, 3180 + Math.random() * 340];

  bases.forEach((base, k) => {
    const partials = [
      { r: 1.00, g: 1.00, d: 0.62 },
      { r: 1.86, g: 0.52, d: 0.44 },
      { r: 2.94, g: 0.30, d: 0.30 },
      { r: 4.42, g: 0.14, d: 0.20 },
    ];

    partials.forEach((p, idx) => {
      const osc = audioCtx.createOscillator();
      osc.type = idx < 2 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(base * p.r, t);
      osc.frequency.exponentialRampToValueAtTime(base * p.r * 0.994, t + p.d);

      const g = audioCtx.createGain();
      const peak = 0.14 * p.g / (k + 1.2);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.0001 + peak, t + 0.0025);
      g.gain.exponentialRampToValueAtTime(0.0001, t + p.d);

      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + p.d + 0.05);
    });
  });

  /* 咬合瞬态 */
  const nLen = Math.floor(audioCtx.sampleRate * 0.045);
  const nBuf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const nd = nBuf.getChannelData(0);
  for (let i = 0; i < nLen; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nLen, 2.8);
  }
  const nSrc = audioCtx.createBufferSource();
  nSrc.buffer = nBuf;

  const hp = audioCtx.createBiquadFilter();
  hp.type = 'bandpass';
  hp.frequency.value = 4200;
  hp.Q.value = 0.9;

  const nG = audioCtx.createGain();
  nG.gain.setValueAtTime(0.10, t);
  nG.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);

  nSrc.connect(hp);
  hp.connect(nG);
  nG.connect(masterGain);
  nSrc.start(t);
}

/* ---- ③ 调节齿数 z：电子节拍音 ---- */
let lastBeat = 0;
function playToothBeat(z) {
  if (!audioReady) return;
  const now = performance.now();
  if (now - lastBeat < 62) return;
  lastBeat = now;

  const t = audioCtx.currentTime;
  const norm = (z - 8) / (26 - 8);       // 0 ~ 1
  const f = 320 + norm * 1180;           // 齿数越多音高越高

  /* 方波脉冲 + 快速滤波包络 —— 电子节拍感 */
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(f, t);
  osc.frequency.exponentialRampToValueAtTime(f * 0.92, t + 0.055);

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.Q.value = 7;
  lp.frequency.setValueAtTime(f * 8, t);
  lp.frequency.exponentialRampToValueAtTime(f * 1.4, t + 0.09);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.085, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.10);

  osc.connect(lp);
  lp.connect(g);
  g.connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.12);

  /* 高八度叠音，增加"咔"的锐度 */
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(f * 3.02, t);

  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.030, t + 0.002);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.048);

  osc2.connect(g2);
  g2.connect(masterGain);
  osc2.start(t);
  osc2.stop(t + 0.06);
}

/* ================================================================
   8. UI 绑定
   ================================================================ */
const zSlider   = document.getElementById('zSlider');
const mSlider   = document.getElementById('mSlider');
const nSlider   = document.getElementById('nSlider');
const spdSlider = document.getElementById('spdSlider');
const volSlider = document.getElementById('volSlider');
const zVal      = document.getElementById('zVal');
const mVal      = document.getElementById('mVal');
const nVal      = document.getElementById('nVal');
const spdVal    = document.getElementById('spdVal');
const volVal    = document.getElementById('volVal');
const gearDot   = document.getElementById('gearDot');

let dotTimer = null;
function flashDot() {
  gearDot.style.transform = 'scale(2.2)';
  gearDot.style.boxShadow = '0 0 18px #e8f0ff, 0 0 38px rgba(232,240,255,0.9)';
  clearTimeout(dotTimer);
  dotTimer = setTimeout(() => {
    gearDot.style.transform = 'scale(1)';
    gearDot.style.boxShadow = '0 0 10px #c8d4e8, 0 0 20px rgba(180,205,240,0.5)';
  }, 120);
}

zSlider.addEventListener('input', (e) => {
  initAudio();
  currentZ = parseInt(e.target.value, 10);
  zVal.textContent = currentZ;
  playToothBeat(currentZ);
  rebuildGears();
  flashDot();
});

mSlider.addEventListener('input', (e) => {
  initAudio();
  currentM = parseFloat(e.target.value);
  mVal.textContent = currentM.toFixed(3);
  rebuildGears();
});

nSlider.addEventListener('input', (e) => {
  initAudio();
  currentN = parseInt(e.target.value, 10);
  nVal.textContent = currentN + ' 个';
  rebuildGears();
});

spdSlider.addEventListener('input', (e) => {
  initAudio();
  omega = parseFloat(e.target.value);
  spdVal.textContent = omega.toFixed(2);
});

volSlider.addEventListener('input', (e) => {
  initAudio();
  currentVolume = parseInt(e.target.value, 10) / 100;
  volVal.textContent = e.target.value + '%';
  if (masterGain) {
    masterGain.gain.setTargetAtTime(currentVolume, audioCtx.currentTime, 0.02);
  }
});

/* ================================================================
   9. 鼠标交互
   ================================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

let pointerDownPos = null;
let isDragging = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  initAudio();
  pointerDownPos = { x: e.clientX, y: e.clientY };
  isDragging = true;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownPos) { isDragging = false; return; }
  const moved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  pointerDownPos = null;
  isDragging = false;

  if (moved > 9) return;   // 拖拽，不算点击

  /* ---- 射线拾取齿轮 ---- */
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);

  const meshes = gears.map(g => g.mesh);
  const hits = raycaster.intersectObjects(meshes, false);

  if (hits.length > 0) {
    playMetalClack();
    flashDot();

    /* 被点击的齿轮高亮闪烁 */
    const hitMesh = hits[0].object;
    const gear = gears.find(g => g.mesh === hitMesh);
    if (gear) {
      gear.mat.emissiveIntensity = 2.2;
      gear.mat.emissive.setHex(0x6688cc);
      setTimeout(() => {
        gear.mat.emissiveIntensity = 0.4;
        gear.mat.emissive.setHex(0x14161a);
      }, 160);
    }
    flashValue = 1.0;
  }
});

renderer.domElement.addEventListener('pointercancel', () => {
  pointerDownPos = null;
  isDragging = false;
});

/* ================================================================
   10. 相机自适应
   ================================================================ */
let autoFit = true;
let baseDist = 10;
const baseTarget = new THREE.Vector3(0, 0, 0);

function fitCamera(width, height) {
  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const halfW = Math.max(width * 0.5, height * 1.2);
  const halfH = Math.max(height * 1.0, width * 0.35);

  const dV = halfH / Math.tan(vFov / 2);
  const dH = halfW / Math.tan(hFov / 2);
  baseDist = Math.max(dV, dH, 3.5) * 1.08;

  baseTarget.set(0, 0, 0);
  autoFit = true;
}

/* ================================================================
   11. 渲染循环
   ================================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* ---- 齿轮旋转 & 咔哒声同步 ---- */
  const clickStep = (Math.PI * 2) / Math.max(currentZ, 1);

  for (let i = 0; i < gears.length; i++) {
    const g = gears[i];
    g.mesh.rotation.z = g.phase + g.dir * omega * elapsed;
  }

  /* 以第一个齿轮的转角为基准触发咔哒 */
  clickAccum += omega * dt;
  while (clickAccum >= clickStep) {
    clickAccum -= clickStep;
    playClick();
  }

  /* ---- 高亮衰减 ---- */
  flashValue = Math.max(0, flashValue - dt * 3.0);
  warmAccent.intensity = 4.5 + flashValue * 14;
  coolAccent.intensity = 5.5 + flashValue * 12;
  keyLight.intensity   = 3.0 + flashValue * 2.5;

  /* ---- 相机自动适配 ---- */
  if (autoFit) {
    const cur = camera.position.distanceTo(controls.target);
    const nd = cur + (baseDist - cur) * Math.min(dt * 3.5, 1);
    const dir = camera.position.clone().sub(controls.target).normalize();
    if (dir.lengthSq() > 1e-6) {
      camera.position.copy(controls.target).addScaledVector(dir, nd);
    }
    controls.target.lerp(baseTarget, Math.min(dt * 4, 1));
    if (Math.abs(nd - baseDist) < 0.02) autoFit = false;
  }

  /* ---- 材质高光呼吸 ---- */
  for (let i = 0; i < gears.length; i++) {
    if (gears[i].mat.emissiveIntensity < 1.0) {
      gears[i].mat.emissiveIntensity = 0.38 + Math.sin(elapsed * 1.6 + i) * 0.08;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ================================================================
   12. 自适应 & 启动
   ================================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  if (gears.length > 0) {
    const width = (currentN - 1) * currentM * currentZ;
    fitCamera(width, currentM * currentZ / 2 + currentM);
  }
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta();
});

/* ---- 初始化 ---- */
omega = parseFloat(spdSlider.value);
currentZ = parseInt(zSlider.value, 10);
currentM = parseFloat(mSlider.value);
currentN = parseInt(nSlider.value, 10);

zVal.textContent = currentZ;
mVal.textContent = currentM.toFixed(3);
nVal.textContent = currentN + ' 个';
spdVal.textContent = omega.toFixed(2);

rebuildGears();

/* 相机初始位置（先放到合适距离，再启动动画自适应） */
const initWidth = (currentN - 1) * currentM * currentZ;
const initHeight = currentM * currentZ / 2 + currentM * 2.2;
const vFov = camera.fov * Math.PI / 180;
const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
baseDist = Math.max(
  Math.max(initHeight * 0.95, initWidth * 0.42) / Math.tan(vFov / 2),
  Math.max(initHeight * 0.95, initWidth * 0.42) / Math.tan(hFov / 2),
  3.5
) * 1.05;

camera.position.set(0, baseDist * 0.55, baseDist * 0.82);
controls.target.set(0, 0, 0);
autoFit = true;

animate();
</script>
