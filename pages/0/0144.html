<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双纽环面编织 · 极限圆织网 · 三维流形映射</title>
    <style>
        :root {
            --bg: #04040c;
            --gold: #d8a84e;
            --cyan: #3bbba8;
            --rose: #dd4055;
            --text: #cfc0a0;
            --text-dim: #8a7c60;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.8vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.18em;
            color: #e2cf9e;
            text-shadow: 0 0 40px rgba(216, 168, 78, 0.45), 0 0 80px rgba(216, 168, 78, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.95vw, 0.66rem);
            letter-spacing: 0.23em;
            color: #a0906e;
            opacity: 0.62;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.2vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 12, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(130, 115, 85, 0.18);
            border-radius: 16px;
            padding: 1vh 2.4vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.62rem, 1.3vw, 0.9rem);
            color: #ceba86;
            letter-spacing: 0.07em;
            line-height: 1.55;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.42rem, 0.8vw, 0.58rem);
            color: #8a7a5b;
            letter-spacing: 0.1em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d8a84e;
        }
        .accent-cyan {
            color: #3bbba8;
        }
        .accent-rose {
            color: #dd4055;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.5s ease-out 0.3s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>双纽环面编织 · 极限圆织网 · 三维流形映射</h1>
        <div class="subtitle">伯努利双纽线 ⊂ 环面 &nbsp;·&nbsp; 双曲极限圆 &nbsp;·&nbsp; 空间线性微分同胚</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">(x²+y²)² = 2a²(x²−y²)</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">(x²+y²+z²+R²−r²)² = 4R²(x²+y²)</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">γ(s)=P⋅e^{A s}ν</span>
        </div>
        <div class="formula-detail">
            伯努利双纽线环面提升 &nbsp;·&nbsp; 环面隐式方程穿行 &nbsp;·&nbsp; 线性系统轨道投射球面
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ========== 极度健壮的动画循环 ==========
        // 核心思路：先注册下一帧，再执行更新，try-catch包裹所有逻辑，确保循环永不中断

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040c, 1);
        container.appendChild(renderer.domElement);

        // 相机
        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.5, 28);
        camera.position.set(2.7, 1.6, 7.2);
        camera.lookAt(0, 0, 0);

        // 颜色
        const colorGold = new THREE.Color('#d8a84e');
        const colorCyan = new THREE.Color('#3bbba8');
        const colorRose = new THREE.Color('#dd4055');

        // 背景星点
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 240;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const rad = 5.4 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
            starPos[i * 3 + 2] = rad * Math.cos(phi);
            starSizes[i] = Math.random() * 1.8 + 0.28;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e261c,
            size: 0.02,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        // 极淡参考球壳
        const refSphereGeom = new THREE.SphereGeometry(2.7, 52, 36);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x16140e, transparent: true, opacity: 0.08, depthWrite: false })
        );
        scene.add(refSphereWire);

        // 极淡参考环面
        const refTorusGeom = new THREE.TorusGeometry(2.05, 0.6, 12, 32);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x101619, transparent: true, opacity: 0.07, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ========== 曲线系统 ==========
        const allCurves = [];
        const POINTS_PER_CURVE = 540;

        function createCurve(color, updateFn) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            // 用微小随机值初始化，避免第一帧全零
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.35;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.35;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.35;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.86,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, material);
            scene.add(line);
            const obj = { line, geometry: geom, positions, updateFn };
            allCurves.push(obj);
            return obj;
        }

        // ---------- 组1：伯努利双纽线环绕环面 (金色) ----------
        const goldCount = 7;
        for (let k = 0; k < goldCount; k++) {
            const aBase = 1.4 + k * 0.18;
            const freq = 1.6 + k * 0.25;
            const rotX = k * 0.7;
            const rotY = k * 0.9;
            const rotZ = k * 0.55;

            createCurve(colorGold, (t, i, total, arr) => {
                const idx = i * 3;
                const u = (i / total) * Math.PI * 2;
                const a = aBase + 0.35 * Math.sin(t * 0.35 + k);
                // 伯努利双纽线极坐标：r² = 2a² cos(2θ)
                const cos2u = Math.cos(2 * u);
                const r = a * Math.sqrt(2 * Math.max(0, cos2u + 0.02));
                const x2d = r * Math.cos(u);
                const y2d = r * Math.sin(u);

                // 提升到环面：R为环面主半径，将x2d,y2d作为tube截面的坐标
                const R = 2.0;
                const tubeScale = 0.65;
                const cosPhi = Math.cos(x2d * tubeScale);
                const sinPhi = Math.sin(x2d * tubeScale);
                const zTube = y2d * tubeScale;

                let x0 = (R + zTube) * cosPhi;
                let y0 = (R + zTube) * sinPhi;
                let z0 = y2d * tubeScale * 0; // z0由zTube贡献，调整

                // 实际正确提升：令双纽线的x2d映射为环面经角，y2d为管高
                const ringAngle = x2d * 0.9;
                const tubeHeight = y2d * 0.8;
                const ringR = 1.85 + 0.2 * Math.sin(t * 0.4 + k);
                const tubeR = 0.55 + 0.15 * Math.cos(t * 0.45 + k);
                const cosRing = Math.cos(ringAngle);
                const sinRing = Math.sin(ringAngle);
                x0 = (ringR + tubeR * Math.cos(tubeHeight)) * cosRing;
                y0 = (ringR + tubeR * Math.cos(tubeHeight)) * sinRing;
                z0 = tubeR * Math.sin(tubeHeight);

                // 旋转
                const rx = rotX + t * 0.12;
                const ry = rotY + t * 0.15;
                const rz = rotZ + t * 0.1;
                const cx = Math.cos(rx),
                    sx = Math.sin(rx);
                const cy = Math.cos(ry),
                    sy = Math.sin(ry);
                const cz = Math.cos(rz),
                    sz = Math.sin(rz);
                const x1 = x0 * cz - y0 * sz;
                const y1 = x0 * sz + y0 * cz;
                const z1 = z0;
                const y2 = y1 * cx - z1 * sx;
                const z2 = y1 * sx + z1 * cx;
                const x2 = x1;
                const x3 = x2 * cy + z2 * sy;
                const z3 = -x2 * sy + z2 * cy;
                const y3 = y2;

                arr[idx] = x3;
                arr[idx + 1] = y3;
                arr[idx + 2] = z3;
            });
        }

        // ---------- 组2：双曲极限圆在球面上的轨迹 (青色) ----------
        const cyanCount = 7;
        for (let k = 0; k < cyanCount; k++) {
            const radiusBase = 1.9 + k * 0.2;
            const tilt = k * 0.5;
            const spinFreq = 0.25 + k * 0.04;
            const rotX = k * 0.6;
            const rotY = k * 0.85;

            createCurve(colorCyan, (t, i, total, arr) => {
                const idx = i * 3;
                const s = (i / total) * Math.PI * 2;
                // 极限圆：在庞加莱球模型中，极限圆是球面上的圆周，通过参数方程旋转
                const r = radiusBase + 0.3 * Math.sin(t * 0.4 + k);
                const centerX = 0.3 * Math.cos(t * 0.25 + k);
                const centerY = 0.2 * Math.sin(t * 0.35 + k);
                const centerZ = 0.25 * Math.cos(t * 0.3 + k * 1.2);
                const norm = Math.sqrt(centerX * centerX + centerY * centerY + centerZ * centerZ) + 0.001;
                const nx = centerX / norm;
                const ny = centerY / norm;
                const nz = centerZ / norm;

                // 构造局部坐标系 u,v
                const ux = -ny;
                const uy = nx;
                const uz = 0;
                const uNorm = Math.sqrt(ux * ux + uy * uy + uz * uz);
                const uxN = ux / (uNorm + 0.001);
                const uyN = uy / (uNorm + 0.001);
                const uzN = uz / (uNorm + 0.001);

                const vx = ny * uzN - nz * uyN;
                const vy = nz * uxN - nx * uzN;
                const vz = nx * uyN - ny * uxN;

                const cosS = Math.cos(s);
                const sinS = Math.sin(s);
                const radiusFactor = r / Math.sqrt(1 + r * r / 4); // 球极投影半径调整
                let x0 = (centerX + radiusFactor * (cosS * uxN + sinS * vx)) * 2.5;
                let y0 = (centerY + radiusFactor * (cosS * uyN + sinS * vy)) * 2.5;
                let z0 = (centerZ + radiusFactor * (cosS * uzN + sinS * vz)) * 2.5;

                const rx = rotX + t * 0.14;
                const ry = rotY + t * 0.17;
                const cx = Math.cos(rx),
                    sx = Math.sin(rx);
                const cy = Math.cos(ry),
                    sy = Math.sin(ry);
                const y1 = y0 * cx - z0 * sx;
                const z1 = y0 * sx + z0 * cx;
                const x1 = x0;
                const x2 = x1 * cy + z1 * sy;
                const z2 = -x1 * sy + z1 * cy;
                const y2 = y1;
                arr[idx] = x2;
                arr[idx + 1] = y2;
                arr[idx + 2] = z2;
            });
        }

        // ---------- 组3：线性系统轨道投射 (玫红) ----------
        const roseCount = 7;
        for (let k = 0; k < roseCount; k++) {
            const matrixTrace = 0.6 + k * 0.15;
            const rotX = k * 0.75;
            const rotY = k * 0.8;

            createCurve(colorRose, (t, i, total, arr) => {
                const idx = i * 3;
                const s = (i / total) * 3 - 1.5;
                // 使用2x2矩阵特征值来生成曲线，再三维化
                const alpha = 0.15 * Math.sin(t * 0.3 + k);
                const beta = 0.2 * Math.cos(t * 0.35 + k);
                const det = -0.4 + 0.3 * Math.sin(t * 0.28 + k * 1.1);
                const tr = matrixTrace + 0.2 * Math.cos(t * 0.4 + k);
                const disc = tr * tr - 4 * det;
                const re = tr / 2;
                const im = disc >= 0 ? 0 : Math.sqrt(-disc) / 2;
                const expRe = Math.exp(re * s);
                const cosIm = Math.cos(im * s);
                const sinIm = Math.sin(im * s);
                let x2d = expRe * (cosIm * 1.2 + sinIm * 0.4);
                let y2d = expRe * (sinIm * 0.8 - cosIm * 0.3);
                // 球极逆投影
                const norm2 = x2d * x2d + y2d * y2d;
                const denom = 1 + norm2;
                const sx = (2 * x2d) / denom;
                const sy = (2 * y2d) / denom;
                const sz = (1 - norm2) / denom;
                const sc = 2.6;
                let x0 = sx * sc;
                let y0 = sy * sc;
                let z0 = sz * sc;

                const rx = rotX + t * 0.13;
                const ry = rotY + t * 0.16;
                const cx = Math.cos(rx),
                    sxr = Math.sin(rx);
                const cy = Math.cos(ry),
                    syr = Math.sin(ry);
                const y1 = y0 * cx - z0 * sxr;
                const z1 = y0 * sxr + z0 * cx;
                const x1 = x0;
                const x2 = x1 * cy + z1 * syr;
                const z2 = -x1 * syr + z1 * cy;
                const y2 = y1;
                arr[idx] = x2;
                arr[idx + 1] = y2;
                arr[idx + 2] = z2;
            });
        }

        // ---------- 额外：莫比乌斯结 (混合色) ----------
        const extraCount = 4;
        const extraColors = [colorCyan, colorRose, colorGold, colorCyan];
        for (let k = 0; k < extraCount; k++) {
            const col = extraColors[k];
            createCurve(col, (t, i, total, arr) => {
                const idx = i * 3;
                const s = (i / total) * Math.PI * 2;
                const x0 = (2 + Math.cos(2 * s + t * 0.3)) * Math.cos(3 * s + t * 0.2) * 1.2;
                const y0 = (2 + Math.cos(2 * s + t * 0.3)) * Math.sin(3 * s + t * 0.2) * 1.2;
                const z0 = Math.sin(4 * s + t * 0.4) * 1.5;
                arr[idx] = x0;
                arr[idx + 1] = y0;
                arr[idx + 2] = z0;
            });
        }

        console.log(`✅ 曲线总数: ${allCurves.length} (金:${goldCount}, 青:${cyanCount}, 玫红:${roseCount}, 额外:${extraCount})`);

        // ========== 流动粒子 ==========
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            const ci = i % allCurves.length;
            particleData.push({
                curveIndex: ci,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0023,
            });
            let col;
            if (i < 7) col = colorGold.clone();
            else if (i < 14) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 1] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.84,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        // ========== 极度健壮的动画循环 ==========
        const clock = new THREE.Clock();
        let animationTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        // 安全更新所有曲线
        function safeUpdateCurves(t) {
            for (let c = 0; c < allCurves.length; c++) {
                try {
                    const curve = allCurves[c];
                    const { positions, updateFn } = curve;
                    for (let i = 0; i < POINTS_PER_CURVE; i++) {
                        updateFn(t, i, POINTS_PER_CURVE, positions);
                    }
                    curve.geometry.attributes.position.needsUpdate = true;
                } catch (e) {
                    console.warn(`曲线${c}更新异常, 已跳过`, e);
                }
            }
        }

        // 安全更新粒子
        function safeUpdateParticles() {
            try {
                for (let p = 0; p < particleCount; p++) {
                    const pd = particleData[p];
                    pd.progress += pd.speed;
                    if (pd.progress >= 1.0) pd.progress -= 1.0;
                    if (pd.progress < 0) pd.progress += 1.0;
                    const curveObj = allCurves[pd.curveIndex];
                    if (!curveObj || !curveObj.positions) continue;
                    const posArr = curveObj.positions;
                    const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                    const idx0 = Math.floor(floatIdx);
                    const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                    const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                    const i0 = idx0 * 3, i1 = idx1 * 3;
                    particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                    particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                    particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
                }
                particlesGeom.attributes.position.needsUpdate = true;
            } catch (e) {
                console.warn('粒子更新异常, 已跳过', e);
            }
        }

        // 动画主循环 - 极度防御性编程
        function animate() {
            // 第一步：立即注册下一帧，确保无论发生什么循环都不会中断
            requestAnimationFrame(animate);

            try {
                // 获取安全的时间增量
                let dt = clock.getDelta();
                // 限制dt，防止标签页隐藏后恢复时的大跳跃
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) {
                    dt = 0.016;
                }
                animationTime += dt;
                frameCount++;

                // 每5秒控制台输出，确认仍然运行
                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const elapsed = (now - lastLogTime) / 1000;
                    const fps = Math.round(frameCount / elapsed);
                    console.log(`🔄 动画运行中 | FPS: ${fps} | 时间: ${animationTime.toFixed(1)}s | dt: ${(dt*1000).toFixed(1)}ms`);
                    frameCount = 0;
                    lastLogTime = now;
                }

                // 更新所有数据
                safeUpdateCurves(animationTime);
                safeUpdateParticles();

                // 参考结构微动
                const breathe = 1 + 0.05 * Math.sin(animationTime * 0.42) * Math.cos(animationTime * 0.3);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.06;
                refSphereWire.rotation.y += dt * 0.05;

                refTorusWire.rotation.z += dt * 0.065;
                const torBreathe = 1 + 0.06 * Math.sin(animationTime * 0.45) * Math.cos(animationTime * 0.33);
                refTorusWire.scale.setScalar(torBreathe);

                // 相机环绕
                const camH = animationTime * 0.11;
                const camV = 0.34 + 0.17 * Math.sin(animationTime * 0.15);
                const camD = 7.1 + 0.6 * Math.sin(animationTime * 0.2) * Math.cos(animationTime * 0.26);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.06 * Math.sin(animationTime * 0.1), 0.03 * Math.cos(animationTime * 0.13), 0);

                // 背景星星
                stars.rotation.y += dt * 0.015;
                stars.rotation.x += dt * 0.01;

                // 渲染
                renderer.render(scene, camera);
            } catch (globalError) {
                console.error('动画主循环异常，但循环仍在继续:', globalError);
                // 关键：即使最外层出现未预料的错误，循环也不会停止，因为下一帧已经注册
            }
        }

        // 响应式
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });

        // 页面重新可见时重置时钟，避免delta爆炸
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                clock.getDelta(); // 消耗积累的时间差
                console.log('📱 页面可见，已重置时钟');
            }
        });

        // ========== 启动 ==========
        console.log('🚀 双纽环面编织动画初始化... 预渲染第一帧');
        // 确保第一帧就有完整图形
        safeUpdateCurves(0);
        safeUpdateParticles();
        renderer.render(scene, camera);
        console.log('   初始帧已渲染');

        // 重置时钟，从此刻开始计算增量
        clock.start();
        animationTime = 0;
        // 启动动画循环
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动，画面将连续运动（已经过极端防御性编程，不会停止）');
    </script>
</body>
</html>
