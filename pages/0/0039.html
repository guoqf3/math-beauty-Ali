<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维Lissajous编织 · 空间参数曲线网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>三维Lissajous编织 · 空间参数曲线网</h2>
        <div class="sub">3D Lissajous knots · Phase‑shifted families · Rational & irrational beats</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">x=A₁cos(ω₁t), y=A₂cos(ω₂t+φ₁), z=A₃cos(ω₃t+φ₂)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">ω₁:ω₂:ω₃ ∈ {2:3:5, 3:4:7, 5:2:3} ∪ {√2,√3,π}</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">φ₁,φ₂ = k·2π/N , N=24</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.5, 7.6);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 1.35;
        const T_MAX = 14 * Math.PI;
        const POINTS_PER_CURVE = 520;

        function lissajous3D(t, wx, wy, wz, phaseY, phaseZ, ax, ay, az) {
            return new THREE.Vector3(
                ax * Math.cos(wx * t),
                ay * Math.cos(wy * t + phaseY),
                az * Math.cos(wz * t + phaseZ)
            ).multiplyScalar(SCALE);
        }

        function createLissajousFamily(wx, wy, wz, ax, ay, az, numPhases, color, opacity) {
            const group = new THREE.Group();
            const dt = T_MAX / POINTS_PER_CURVE;
            for (let p = 0; p < numPhases; p++) {
                const phaseY = p * 2 * Math.PI / numPhases;
                const phaseZ = p * 2 * Math.PI / (numPhases * 1.3) + 0.8;
                const pts = [];
                for (let i = 0; i <= POINTS_PER_CURVE; i++) {
                    const t = i * dt;
                    const pt = lissajous3D(t, wx, wy, wz, phaseY, phaseZ, ax, ay, az);
                    if (pt.length() < 7.5) pts.push(pt);
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'lissajous3d-weave';
        scene.add(rootGroup);

        const numPhases = 22;

        // 金色族：有理比 2:3:5 和 3:4:7
        rootGroup.add(createLissajousFamily(2, 3, 5, 1.5, 1.3, 1.4, numPhases, COLOR_GOLD, 0.60));
        rootGroup.add(createLissajousFamily(3, 4, 7, 1.4, 1.5, 1.2, numPhases, COLOR_GOLD, 0.55));
        rootGroup.add(createLissajousFamily(2.5, 3.5, 5.5, 1.35, 1.25, 1.45, Math.floor(numPhases * 0.6), COLOR_GOLD, 0.42));

        // 青色族：无理比包含√2, √3, π
        rootGroup.add(createLissajousFamily(Math.sqrt(2), Math.sqrt(3), Math.PI, 1.45, 1.35, 1.30, numPhases, COLOR_CYAN, 0.60));
        rootGroup.add(createLissajousFamily(Math.sqrt(3), Math.PI, Math.sqrt(2), 1.40, 1.45, 1.25, numPhases, COLOR_CYAN, 0.55));
        rootGroup.add(createLissajousFamily(Math.PI, Math.sqrt(5), Math.E, 1.30, 1.20, 1.50, Math.floor(numPhases * 0.6),
            COLOR_CYAN, 0.42));

        // 品红族：有理比 5:2:3 和 7:3:4
        rootGroup.add(createLissajousFamily(5, 2, 3, 1.50, 1.40, 1.30, numPhases, COLOR_MAGENTA, 0.60));
        rootGroup.add(createLissajousFamily(7, 3, 4, 1.35, 1.55, 1.25, numPhases, COLOR_MAGENTA, 0.55));
        rootGroup.add(createLissajousFamily(4.5, 1.5, 6.5, 1.25, 1.35, 1.40, Math.floor(numPhases * 0.6), COLOR_MAGENTA, 0.42));

        // 额外稀疏层：无理混合频率
        const extraPhases = 10;
        rootGroup.add(createLissajousFamily(Math.sqrt(7), Math.sqrt(6), Math.log(5) + 2, 1.22, 1.18, 1.32, extraPhases, COLOR_GOLD,
            0.35));
        rootGroup.add(createLissajousFamily(Math.sqrt(8), Math.sqrt(10), 2 * Math.sqrt(3), 1.28, 1.22, 1.36, extraPhases,
            COLOR_CYAN, 0.35));
        rootGroup.add(createLissajousFamily(Math.sqrt(11), Math.sqrt(13), Math.sqrt(17) / 2, 1.16, 1.38, 1.24, extraPhases,
            COLOR_MAGENTA, 0.35));

        // 辅助球面参考网格
        const refR = 2.8;
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = refR * Math.sin(lat);
            const z = refR * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(refR * st * Math.cos(phi), refR * Math.cos(theta), refR * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        console.log('三维Lissajous编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.23;
            rootGroup.rotation.z = t * 0.09;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 三维Lissajous参数曲线编织动画已稳定运行');
    </script>
</body>
</html>
