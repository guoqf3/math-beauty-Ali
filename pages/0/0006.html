<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopf纤维编织 · 大圆族准周期网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        canvas { display: block; }
        .overlay-title {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10; pointer-events: none;
            padding: 22px 20px 8px; text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight: 400; letter-spacing: 0.13em;
            color: #e8d5b0; text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px; line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem); letter-spacing: 0.22em; color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; pointer-events: none;
            padding: 8px 20px 18px; text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem); color: rgba(210, 200, 185, 0.8); letter-spacing: 0.03em; line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep { display: inline-block; margin: 0 14px; color: rgba(150, 140, 130, 0.35); }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Hopf纤维编织 · 大圆族准周期网</h2>
        <div class="sub">Quasiperiodic great circle foliations · Irrational SO(3) flows</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">ω₁=√2·t (绕Y轴)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">ω₂=√3·t (绕X轴)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">ω₃=π·t (绕Z轴)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.5, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        const getElapsed = () => clock.getElapsedTime();

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const RADIUS = 2.65;
        const CIRCLE_POINTS = 340;
        const MERIDIAN_COUNT = 24;
        const EXTRA_COUNT = 14;

        // ---- 生成大圆 ----
        function createGreatCircle(normal, radius, numPoints) {
            const pts = [];
            let u, v;
            if (Math.abs(normal.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(normal).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
            }
            v = normal.clone().cross(u).normalize();
            const dAngle = 2 * Math.PI / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const angle = i * dAngle;
                pts.push(
                    u.clone().multiplyScalar(Math.cos(angle) * radius)
                        .add(v.clone().multiplyScalar(Math.sin(angle) * radius))
                );
            }
            return pts;
        }

        // ---- 生成一族经线（共享极轴） ----
        function createMeridianFamily(poleAxis, count, radius, color, opacity, numPoints) {
            const group = new THREE.Group();
            let u, v;
            if (Math.abs(poleAxis.x) < 0.9) {
                u = new THREE.Vector3(1, 0, 0).cross(poleAxis).normalize();
            } else {
                u = new THREE.Vector3(0, 1, 0).cross(poleAxis).normalize();
            }
            v = poleAxis.clone().cross(u).normalize();

            for (let i = 0; i < count; i++) {
                const angle = i * Math.PI / count; // 经线法向量均匀分布
                const normal = u.clone().multiplyScalar(Math.cos(angle))
                    .add(v.clone().multiplyScalar(Math.sin(angle)));
                const pts = createGreatCircle(normal, radius, numPoints);
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        // ---- 创建三个独立旋转的族 ----
        const goldShell = new THREE.Group();
        goldShell.name = 'gold-shell';
        goldShell.add(createMeridianFamily(new THREE.Vector3(0, 1, 0), MERIDIAN_COUNT, RADIUS, COLOR_GOLD, 0.62, CIRCLE_POINTS));
        goldShell.add(createMeridianFamily(new THREE.Vector3(0, 1, 0), EXTRA_COUNT, RADIUS, COLOR_GOLD, 0.38, CIRCLE_POINTS));

        const cyanShell = new THREE.Group();
        cyanShell.name = 'cyan-shell';
        cyanShell.add(createMeridianFamily(new THREE.Vector3(1, 0, 0), MERIDIAN_COUNT, RADIUS, COLOR_CYAN, 0.62, CIRCLE_POINTS));
        cyanShell.add(createMeridianFamily(new THREE.Vector3(1, 0, 0), EXTRA_COUNT, RADIUS, COLOR_CYAN, 0.38, CIRCLE_POINTS));

        const magentaShell = new THREE.Group();
        magentaShell.name = 'magenta-shell';
        magentaShell.add(createMeridianFamily(new THREE.Vector3(0, 0, 1), MERIDIAN_COUNT, RADIUS, COLOR_MAGENTA, 0.62, CIRCLE_POINTS));
        magentaShell.add(createMeridianFamily(new THREE.Vector3(0, 0, 1), EXTRA_COUNT, RADIUS, COLOR_MAGENTA, 0.38, CIRCLE_POINTS));

        // ---- 对角线大圆族（额外混合） ----
        const diagAxis1 = new THREE.Vector3(1, 1, 0).normalize();
        const diagAxis2 = new THREE.Vector3(1, -1, 0.5).normalize();
        const diagAxis3 = new THREE.Vector3(0.3, 1, -0.8).normalize();

        goldShell.add(createMeridianFamily(diagAxis1, Math.floor(EXTRA_COUNT * 0.7), RADIUS, COLOR_GOLD, 0.28, CIRCLE_POINTS));
        cyanShell.add(createMeridianFamily(diagAxis2, Math.floor(EXTRA_COUNT * 0.7), RADIUS, COLOR_CYAN, 0.28, CIRCLE_POINTS));
        magentaShell.add(createMeridianFamily(diagAxis3, Math.floor(EXTRA_COUNT * 0.7), RADIUS, COLOR_MAGENTA, 0.28, CIRCLE_POINTS));

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'hopf-weave';
        rootGroup.add(goldShell);
        rootGroup.add(cyanShell);
        rootGroup.add(magentaShell);
        scene.add(rootGroup);

        // ---- 辅助球面参考环 ----
        for (let i = 0; i < 9; i++) {
            const lat = (i + 0.5) * Math.PI / 9;
            const r = RADIUS * Math.sin(lat);
            const z = RADIUS * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.08, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 6; k++) {
            const phi = k * Math.PI / 3;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(RADIUS * st * Math.cos(phi), RADIUS * Math.cos(theta), RADIUS * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }

        console.log('Hopf纤维编织线条总数:', rootGroup.children.length);

        // ---- 背景星点 ----
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const sc = 550;
        const sp = new Float32Array(sc * 3);
        for (let i = 0; i < sc; i++) {
            const th = Math.random() * Math.PI * 2,
                ph = Math.acos(2 * Math.random() - 1),
                d = 6.5 + Math.random() * 10;
            sp[i * 3] = d * Math.sin(ph) * Math.cos(th);
            sp[i * 3 + 1] = d * Math.sin(ph) * Math.sin(th);
            sp[i * 3 + 2] = d * Math.cos(ph);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(sp, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false
        })));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();

            // 三个球壳以无理频率独立旋转
            goldShell.rotation.set(t * 0.19, t * 0.28, t * 0.12);
            cyanShell.rotation.set(t * 0.23, t * 0.17, t * 0.15);
            magentaShell.rotation.set(t * 0.16, t * 0.31, t * 0.09);

            // 整体微旋转
            rootGroup.rotation.set(t * 0.06, t * 0.07, t * 0.04);
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const cr = 7.6;
            const ca = t * 0.08;
            const ch = 2.6 + Math.sin(t * 0.16) * 0.7;
            camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        // 预渲染首帧，然后启动循环
        renderer.render(scene, camera);
        renderer.setAnimationLoop(animate);

        // 响应式调整
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Hopf纤维编织·大圆族准周期网动画已稳定运行');
    </script>
</body>
</html>
