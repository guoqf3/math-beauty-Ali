<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正八胞体 · 超立方体边编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
        }
        #canvas-container { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1; }
        canvas { display:block; }
        .overlay-title {
            position:fixed; top:0; left:0; right:0; z-index:10; pointer-events:none;
            padding:22px 20px 8px; text-align:center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight:400; letter-spacing:0.13em;
            color:#e8d5b0; text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin:0 0 2px; line-height:1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem); letter-spacing:0.22em; color:rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position:fixed; bottom:0; left:0; right:0; z-index:10; pointer-events:none;
            padding:8px 20px 18px; text-align:center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem); color:rgba(210,200,185,0.8); letter-spacing:0.03em; line-height:1.7;
        }
        .clr-gold { color:#d4a843; font-weight:bold; }
        .clr-cyan { color:#45b7aa; font-weight:bold; }
        .clr-magenta { color:#d4708a; font-weight:bold; }
        .formula-sep { display:inline-block; margin:0 14px; color:rgba(150,140,130,0.35); }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>正八胞体 · 超立方体边编织</h2>
        <div class="sub">Tesseract edge skeleton · Double rotation in SO(4) · Perspective projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">V={±1,±1,±1,±1} (16顶点)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">边: 汉明距离=1 (32边)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">(x₃,y₃,z₃)=(x,y,z)/(d−w)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.5, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        const getElapsed = () => clock.getElapsedTime();

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 1.9;
        const PROJ_DIST = 2.8;

        // ---- 正八胞体16个顶点 ----
        const vertices4D = [];
        for (let mask = 0; mask < 16; mask++) {
            vertices4D.push(new THREE.Vector4(
                (mask & 1) ? 1 : -1,
                (mask & 2) ? 1 : -1,
                (mask & 4) ? 1 : -1,
                (mask & 8) ? 1 : -1
            ));
        }

        // ---- 检测边：汉明距离1 → 坐标差绝对值和=2 ----
        const edges = [], edgeColors = [];
        for (let i = 0; i < 16; i++) {
            for (let j = i + 1; j < 16; j++) {
                const diff = Math.abs(vertices4D[i].x - vertices4D[j].x) +
                    Math.abs(vertices4D[i].y - vertices4D[j].y) +
                    Math.abs(vertices4D[i].z - vertices4D[j].z) +
                    Math.abs(vertices4D[i].w - vertices4D[j].w);
                if (Math.abs(diff - 2) < 0.01) {
                    edges.push([i, j]);
                    // 判断哪个坐标不同，分配颜色
                    const dx = Math.abs(vertices4D[i].x - vertices4D[j].x);
                    const dy = Math.abs(vertices4D[i].y - vertices4D[j].y);
                    const dz = Math.abs(vertices4D[i].z - vertices4D[j].z);
                    const dw = Math.abs(vertices4D[i].w - vertices4D[j].w);
                    if (dx > 0.5) edgeColors.push(COLOR_GOLD);
                    else if (dy > 0.5) edgeColors.push(COLOR_CYAN);
                    else if (dz > 0.5) edgeColors.push(COLOR_MAGENTA);
                    else edgeColors.push(COLOR_GOLD);
                }
            }
        }
        console.log('边数量 (应为32):', edges.length);

        // 分组边
        const goldEdges = [], cyanEdges = [], magentaEdges = [];
        edges.forEach((e, idx) => {
            const c = edgeColors[idx];
            if (c === COLOR_GOLD) goldEdges.push(e);
            else if (c === COLOR_CYAN) cyanEdges.push(e);
            else magentaEdges.push(e);
        });

        // ---- 创建带编织股线的LineSegments ----
        const STRANDS = 8;
        const OFFSET = 0.014;

        function createStrandedSegments(edgeList, color, opacity) {
            const count = Math.max(edgeList.length, 0);
            const posArray = new Float32Array(count * STRANDS * 2 * 3);
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: true, depthTest: true });
            const seg = new THREE.LineSegments(geom, mat);
            seg.userData = { edges: edgeList, posArray, strands: STRANDS, offset: OFFSET };
            return seg;
        }

        const goldSeg = createStrandedSegments(goldEdges, COLOR_GOLD, 0.55);
        const cyanSeg = createStrandedSegments(cyanEdges, COLOR_CYAN, 0.55);
        const magentaSeg = createStrandedSegments(magentaEdges, COLOR_MAGENTA, 0.55);

        const rootGroup = new THREE.Group();
        rootGroup.name = 'tesseract';
        rootGroup.add(goldSeg);
        rootGroup.add(cyanSeg);
        rootGroup.add(magentaSeg);
        scene.add(rootGroup);

        // ---- 更新函数 ----
        function updateSegments(seg, angle1, angle2) {
            const u = seg.userData;
            if (!u || !u.edges || u.edges.length === 0) return;
            const { edges: el, posArray, strands, offset } = u;
            const cosA = Math.cos(angle1), sinA = Math.sin(angle1);
            const cosB = Math.cos(angle2), sinB = Math.sin(angle2);
            let idx = 0;
            for (const [a, b] of el) {
                const qA = vertices4D[a], qB = vertices4D[b];
                const ax = qA.x * cosA - qA.y * sinA, ay = qA.x * sinA + qA.y * cosA;
                const az = qA.z * cosB - qA.w * sinB, aw = qA.z * sinB + qA.w * cosB;
                const bx = qB.x * cosA - qB.y * sinA, by = qB.x * sinA + qB.y * cosA;
                const bz = qB.z * cosB - qB.w * sinB, bw = qB.z * sinB + qB.w * cosB;
                const fA = (Math.abs(PROJ_DIST - aw) > 0.015) ? SCALE / (PROJ_DIST - aw) : 0;
                const fB = (Math.abs(PROJ_DIST - bw) > 0.015) ? SCALE / (PROJ_DIST - bw) : 0;
                const pA = new THREE.Vector3(ax * fA, ay * fA, az * fA);
                const pB = new THREE.Vector3(bx * fB, by * fB, bz * fB);
                const dir = pB.clone().sub(pA);
                if (dir.length() < 0.001) {
                    for (let s = 0; s < strands; s++) {
                        posArray[idx++] = pA.x; posArray[idx++] = pA.y; posArray[idx++] = pA.z;
                        posArray[idx++] = pB.x; posArray[idx++] = pB.y; posArray[idx++] = pB.z;
                    }
                    continue;
                }
                dir.normalize();
                const aux = new THREE.Vector3(0, 1, 0);
                let perp1 = new THREE.Vector3().crossVectors(dir, aux).normalize();
                if (perp1.length() < 0.1) perp1 = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(1, 0, 0)).normalize();
                const perp2 = new THREE.Vector3().crossVectors(dir, perp1).normalize();
                for (let s = 0; s < strands; s++) {
                    const ang = s * 2 * Math.PI / strands;
                    const off = perp1.clone().multiplyScalar(Math.cos(ang) * offset).add(perp2.clone().multiplyScalar(Math.sin(ang) * offset));
                    posArray[idx++] = pA.x + off.x; posArray[idx++] = pA.y + off.y; posArray[idx++] = pA.z + off.z;
                    posArray[idx++] = pB.x + off.x; posArray[idx++] = pB.y + off.y; posArray[idx++] = pB.z + off.z;
                }
            }
            seg.geometry.attributes.position.needsUpdate = true;
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const sc = 550;
        const sp = new Float32Array(sc * 3);
        for (let i = 0; i < sc; i++) {
            const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), d = 7 + Math.random() * 10;
            sp[i * 3] = d * Math.sin(ph) * Math.cos(th);
            sp[i * 3 + 1] = d * Math.sin(ph) * Math.sin(th);
            sp[i * 3 + 2] = d * Math.cos(ph);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(sp, 3));
        starsGroup.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({ color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false })));
        scene.add(starsGroup);

        // ---- 稳定动画循环 ----
        function animate() {
            const t = getElapsed();
            const a1 = t * 0.43, a2 = t * 0.57;
            try { updateSegments(goldSeg, a1, a2); updateSegments(cyanSeg, a1, a2); updateSegments(magentaSeg, a1, a2); } catch (e) { console.warn(e); }
            rootGroup.rotation.x = t * 0.11;
            rootGroup.rotation.y = t * 0.16;
            rootGroup.rotation.z = t * 0.07;
            starsGroup.rotation.y = t * 0.03;
            starsGroup.rotation.x = t * 0.02;
            const cr = 7.6, ca = t * 0.08, ch = 2.6 + Math.sin(t * 0.15) * 0.7;
            camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染一帧并启动循环
        updateSegments(goldSeg, 0, 0); updateSegments(cyanSeg, 0, 0); updateSegments(magentaSeg, 0, 0);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }, 120));
        console.log('✅ 正八胞体超立方体边编织动画已稳定运行');
    </script>
</body>
</html>
