<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三维正弦波海浪面</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#02060e}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:#d8ecff;-webkit-font-smoothing:antialiased;
  }
  canvas{display:block}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}

  .panel{
    position:absolute;
    background:rgba(6,16,30,.60);
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(90,200,255,.18);
    border-radius:18px;
    padding:16px 18px;
    pointer-events:auto;
    box-shadow:0 16px 48px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---- 标题 ---- */
  #info{top:22px;left:22px}
  #info h1{
    font-size:17px;letter-spacing:5px;font-weight:600;
    background:linear-gradient(92deg,#4fd4ff 0%,#7aa8ff 50%,#a0ffd0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 32px rgba(80,190,255,.35);
  }
  #info .formula{
    margin-top:9px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;color:#8fd0ff;letter-spacing:.8px;line-height:1.7;
  }
  #info .formula em{color:#a0ffd0;font-style:normal}
  #info .hint{
    margin-top:10px;font-size:10.5px;color:#4f6a88;letter-spacing:.6px;
  }

  /* ---- 控制面板 ---- */
  #controls{left:22px;bottom:22px;width:268px}
  .ctrl{margin-bottom:16px}
  .ctrl:last-child{margin-bottom:0}
  .ctrl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:#a8c8e0;margin-bottom:9px;letter-spacing:.8px;
  }
  .ctrl label span{
    color:#4fd4ff;font-family:ui-monospace,monospace;font-size:12px;
    text-shadow:0 0 12px rgba(80,210,255,.7);
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#4fd4ff,#5fb8ff,#a0ffd0);
    outline:none;cursor:pointer;
    box-shadow:0 0 12px rgba(80,200,255,.4);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#4fd4ff 58%,#1a6a90);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(80,210,255,1);
    cursor:pointer;transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22)}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#4fd4ff 58%,#1a6a90);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(80,210,255,1);
    cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    height:4px;border-radius:3px;
    background:linear-gradient(90deg,#4fd4ff,#5fb8ff,#a0ffd0);
  }

  /* ---- 读数 ---- */
  #readout{top:22px;right:22px;width:222px}
  #readout .ttl{
    font-size:10.5px;color:#4f6a88;letter-spacing:2px;
    margin-bottom:10px;text-transform:uppercase;
  }
  .ro-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;padding:5px 0;
    border-bottom:1px dashed rgba(90,200,255,.14);
  }
  .ro-row:last-child{border-bottom:none}
  .ro-row>span{color:#7fa0b8;letter-spacing:.6px}
  .ro-row>b{
    font-family:ui-monospace,monospace;font-weight:500;
    color:#a8e4ff;font-size:12px;
  }
  .ro-row.hi>b{color:#a0ffd0;text-shadow:0 0 12px rgba(120,255,200,.75)}

  @media(max-width:720px){
    #info h1{font-size:14px;letter-spacing:3px}
    #info .hint{display:none}
    #controls{width:206px;padding:12px 14px}
    #readout{width:170px;padding:12px 13px}
    .ro-row{font-size:10.5px}
    .ro-row>b{font-size:11px}
  }
</style>
</head>
<body>

<div id="ui">
  <div class="panel" id="info">
    <h1>三维正弦波海浪面</h1>
    <div class="formula">
      z = <em>A</em>·sin(x·<em>fx</em>+φ)·cos(y·<em>fy</em>) + 谐波叠加
    </div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击浪尖</div>
  </div>

  <div class="panel" id="controls">
    <div class="ctrl">
      <label>振幅 A<span id="valA">0.35</span></label>
      <input type="range" id="sliderA" min="0.10" max="0.80" step="0.01" value="0.35">
    </div>
    <div class="ctrl">
      <label>横向频率 fx<span id="valFx">1.10</span></label>
      <input type="range" id="sliderFx" min="0.30" max="3.00" step="0.01" value="1.10">
    </div>
    <div class="ctrl">
      <label>纵向频率 fy<span id="valFy">1.10</span></label>
      <input type="range" id="sliderFy" min="0.30" max="3.00" step="0.01" value="1.10">
    </div>
    <div class="ctrl">
      <label>相位偏移 φ<span id="valPh">0.00</span></label>
      <input type="range" id="sliderPh" min="0" max="6.28" step="0.01" value="0">
    </div>
  </div>

  <div class="panel" id="readout">
    <div class="ttl">浪面读数</div>
    <div class="ro-row"><span>坐标 x</span><b id="roX">—</b></div>
    <div class="ro-row"><span>坐标 z</span><b id="roZ">—</b></div>
    <div class="ro-row"><span>浪高 h</span><b id="roH">—</b></div>
    <div class="ro-row"><span>叠加谐波</span><b id="roHarm">4 组</b></div>
    <div class="ro-row hi"><span>波面状态</span><b id="roState">涌动中</b></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0. 全局状态
   ========================================================= */
const SIZE = 24;              // 浪面边长
const SEG  = 180;             // 网格分段数

const state = {
  amp:   0.35,
  fx:    1.10,
  fy:    1.10,
  phase: 0.00,
  hoverStrength: 0,
  hoverTarget: 0,
  hoverPos: new THREE.Vector3(0, 0, 0),
  hasHover: false,
};

let timeAcc = 0;

/* =========================================================
   1. CPU 端波浪高度函数（与顶点着色器完全一致）
   ========================================================= */
function waveHeight(x, z, t) {
  const a  = state.amp;
  const fx = state.fx;
  const fy = state.fy;
  const ph = state.phase;

  let h = 0;

  h += a * Math.sin(x * fx + ph + t * 1.10)
         * Math.cos(z * fy + t * 0.85);

  h += a * 0.52
       * Math.sin(x * fx * 1.63 + t * 1.35 + 1.7)
       * Math.cos(z * fy * 1.41 + t * 1.05);

  h += a * 0.26
       * Math.sin(x * fx * 2.31 - t * 1.62 + 3.1)
       * Math.cos(z * fy * 2.17 + t * 1.38);

  h += a * 0.13
       * Math.sin(x * fx * 3.17 + t * 1.94 + 5.2)
       * Math.cos(z * fy * 2.87 - t * 1.71);

  return h;
}

/* =========================================================
   2. 场景 / 相机 / 渲染器
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02060e);

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  400
);
camera.position.set(0, 6.5, 11.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.062;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.95;
controls.panSpeed = 0.7;
controls.minDistance = 3;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.485;
controls.target.set(0, 0, 0);

/* =========================================================
   3. 着色器
   ========================================================= */
const vertexShader = /* glsl */`
  precision highp float;

  uniform float uTime;
  uniform float uAmp;
  uniform float uFx;
  uniform float uFy;
  uniform float uPhase;

  varying vec3  vWorldPos;
  varying vec3  vNormal;
  varying float vHeight;
  varying vec2  vUv;

  /* ---- 与 CPU 端完全一致的波浪函数 ---- */
  float waveH(vec2 p, float t) {
    float h = 0.0;
    float a  = uAmp;

    h += a * sin(p.x * uFx + uPhase + t * 1.10)
           * cos(p.y * uFy + t * 0.85);

    h += a * 0.52
         * sin(p.x * uFx * 1.63 + t * 1.35 + 1.7)
         * cos(p.y * uFy * 1.41 + t * 1.05);

    h += a * 0.26
         * sin(p.x * uFx * 2.31 - t * 1.62 + 3.1)
         * cos(p.y * uFy * 2.17 + t * 1.38);

    h += a * 0.13
         * sin(p.x * uFx * 3.17 + t * 1.94 + 5.2)
         * cos(p.y * uFy * 2.87 - t * 1.71);

    return h;
  }

  void main() {
    vUv = uv;

    vec3 pos = position;
    vec2 p   = pos.xz;

    float h = waveH(p, uTime);
    pos.y += h;

    /* ---- 有限差分求法线 ---- */
    float e = 0.10;
    float hR = waveH(p + vec2(e, 0.0), uTime);
    float hU = waveH(p + vec2(0.0, e), uTime);

    vec3 n = normalize(vec3(h - hR, e, h - hU));

    vWorldPos = pos;
    vNormal   = n;
    vHeight   = h;

    gl_Position = projectionMatrix * viewMatrix * vec4(pos, 1.0);
  }
`;

const fragmentShader = /* glsl */`
  precision highp float;

  uniform vec3  uCamPos;
  uniform float uTime;
  uniform float uAmp;
  uniform vec3  uHoverPos;
  uniform float uHoverStrength;

  varying vec3  vWorldPos;
  varying vec3  vNormal;
  varying float vHeight;
  varying vec2  vUv;

  void main() {
    vec3 N = normalize(vNormal);
    vec3 V = normalize(uCamPos - vWorldPos);

    if (dot(N, V) < 0.0) N = -N;

    float ndv  = clamp(dot(N, V), 0.0, 1.0);
    float fres = pow(1.0 - ndv, 2.6);

    /* ---- 深浅水色随浪高变化 ---- */
    float hNorm = clamp(vHeight / max(uAmp, 0.001) * 0.5 + 0.5, 0.0, 1.0);

    vec3 deepColor    = vec3(0.020, 0.090, 0.200);
    vec3 midColor     = vec3(0.070, 0.280, 0.480);
    vec3 shallowColor = vec3(0.420, 0.820, 0.920);

    vec3 base = mix(deepColor, midColor, smoothstep(0.0, 0.55, hNorm));
    base = mix(base, shallowColor, smoothstep(0.58, 1.0, hNorm));

    /* ---- 三向布光 ---- */
    vec3 L1 = normalize(vec3( 0.55,  1.00,  0.42));
    vec3 L2 = normalize(vec3(-0.68,  0.35, -0.62));
    vec3 L3 = normalize(vec3( 0.12, -0.85,  0.50));

    float d1 = max(dot(N, L1), 0.0);
    float d2 = max(dot(N, L2), 0.0);
    float d3 = max(dot(N, L3), 0.0);

    vec3 col = base * (0.30 + 0.78 * d1);
    col += base * vec3(0.55, 0.72, 1.00) * d2 * 0.48;
    col += base * vec3(0.90, 0.80, 0.62) * d3 * 0.32;

    /* ---- 主高光（阳光反射） ---- */
    vec3 H1 = normalize(L1 + V);
    float spec1 = pow(max(dot(N, H1), 0.0), 140.0);
    col += vec3(1.00, 0.98, 0.92) * spec1 * 1.85;

    /* ---- 次高光（天空冷光） ---- */
    vec3 H2 = normalize(L2 + V);
    float spec2 = pow(max(dot(N, H2), 0.0), 62.0);
    col += vec3(0.72, 0.90, 1.00) * spec2 * 0.55;

    /* ---- 菲涅尔水边缘 ---- */
    col += vec3(0.35, 0.72, 1.00) * fres * 0.95;

    /* ---- 波光粼粼的碎光 ---- */
    float s1 = sin(vWorldPos.x * 7.0 + uTime * 2.10)
             * cos(vWorldPos.z * 6.0 - uTime * 1.60);
    float s2 = sin(vWorldPos.x * 12.0 - uTime * 2.80 + 1.3)
             * cos(vWorldPos.z * 10.0 + uTime * 2.20 + 0.7);
    float sparkle = smoothstep(0.42, 0.95, s1 * 0.62 + s2 * 0.38);
    col += vec3(1.00, 0.96, 0.86) * sparkle * 0.30 * ndv;

    /* ---- 悬停高亮 ---- */
    float hd = distance(vWorldPos, uHoverPos);
    float hover = smoothstep(1.5, 0.15, hd) * uHoverStrength;
    col += vec3(0.70, 1.00, 0.95) * hover * 0.72;
    col = mix(col, col * 1.22 + vec3(0.06, 0.16, 0.10), hover * 0.45);

    gl_FragColor = vec4(col, 1.0);
  }
`;

/* =========================================================
   4. 浪面网格
   ========================================================= */
const uniforms = {
  uTime:          { value: 0 },
  uAmp:           { value: state.amp },
  uFx:            { value: state.fx },
  uFy:            { value: state.fy },
  uPhase:         { value: state.phase },
  uCamPos:        { value: new THREE.Vector3() },
  uHoverPos:      { value: new THREE.Vector3(0, 0, 0) },
  uHoverStrength: { value: 0 },
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  side: THREE.DoubleSide,
  transparent: false,
});

const geometry = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
geometry.rotateX(-Math.PI / 2);   // 烘焙旋转，使 y 轴朝上

const ocean = new THREE.Mesh(geometry, material);
ocean.frustumCulled = false;
scene.add(ocean);

/* =========================================================
   5. 背景星点（远空点缀）
   ========================================================= */
(function makeSky() {
  const N = 480;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();

  for (let i = 0; i < N; i++) {
    const r = 40 + Math.random() * 80;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 0.85);   // 偏上半球

    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = Math.abs(r * Math.cos(ph)) + 6;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);

    c.setHSL(0.56 + Math.random() * 0.10, 0.55, 0.62 + Math.random() * 0.30);
    col[i * 3] = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const m = new THREE.PointsMaterial({
    size: 0.14,
    vertexColors: true,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  scene.add(new THREE.Points(g, m));
})();

/* =========================================================
   6. 音频引擎
   ========================================================= */
let actx = null;
let masterGain = null;
let audioReady = false;

let waveGain = null;
let waveFilter = null;
let waveLfoGain = null;

function makePinkNoise(ctx, seconds) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);

  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.20;
  }
  return buf;
}

function initAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { actx = new AC(); } catch (e) { return; }
  if (actx.state === 'suspended') actx.resume();

  masterGain = actx.createGain();
  masterGain.gain.value = 0.50;
  masterGain.connect(actx.destination);

  createWaveSound();
  audioReady = true;
}

/* ---- 海浪拍岸滑动音 ---- */
function createWaveSound() {
  const src = actx.createBufferSource();
  src.buffer = makePinkNoise(actx, 3.0);
  src.loop = true;

  const hp = actx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 110;

  waveFilter = actx.createBiquadFilter();
  waveFilter.type = 'lowpass';
  waveFilter.frequency.value = 880;
  waveFilter.Q.value = 0.72;

  waveGain = actx.createGain();
  waveGain.gain.value = 0.055;

  src.connect(hp).connect(waveFilter).connect(waveGain).connect(masterGain);
  src.start();

  /* LFO 1：缓慢起伏的音量，制造拍岸节奏 */
  const lfo1 = actx.createOscillator();
  lfo1.type = 'sine';
  lfo1.frequency.value = 0.14;

  const lfo1G = actx.createGain();
  lfo1G.gain.value = 0.032;

  lfo1.connect(lfo1G).connect(waveGain.gain);
  lfo1.start();

  /* LFO 2：滤波器扫频，制造明暗变化 */
  const lfo2 = actx.createOscillator();
  lfo2.type = 'sine';
  lfo2.frequency.value = 0.085;

  const lfo2G = actx.createGain();
  lfo2G.gain.value = 420;

  lfo2.connect(lfo2G).connect(waveFilter.frequency);
  lfo2.start();

  waveLfoGain = lfo2G;
}

/* ---- 点击浪尖：水滴落水的清脆音 ---- */
function playDrop() {
  if (!audioReady) return;
  const t = actx.currentTime;

  const f0 = 1450 + Math.random() * 650;

  /* 主音：快速下滑 */
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f0 * 0.40, t + 0.11);

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.26, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);

  osc.connect(g).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.30);

  /* 泛音：增加水润质感 */
  const osc2 = actx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(f0 * 2.24, t);
  osc2.frequency.exponentialRampToValueAtTime(f0 * 0.88, t + 0.09);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.085, t + 0.002);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);

  osc2.connect(g2).connect(masterGain);
  osc2.start(t);
  osc2.stop(t + 0.20);

  /* 尾韵：短促回响，营造空腔感 */
  const osc3 = actx.createOscillator();
  osc3.type = 'sine';
  osc3.frequency.setValueAtTime(f0 * 1.52, t + 0.055);
  osc3.frequency.exponentialRampToValueAtTime(f0 * 0.66, t + 0.19);

  const g3 = actx.createGain();
  g3.gain.setValueAtTime(0.0001, t + 0.055);
  g3.gain.exponentialRampToValueAtTime(0.052, t + 0.065);
  g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);

  osc3.connect(g3).connect(masterGain);
  osc3.start(t + 0.055);
  osc3.stop(t + 0.36);
}

/* ---- 振幅滑音：音高随浪高上升 ---- */
function playAmpGlide(value, ascending) {
  if (!audioReady) return;
  const t = actx.currentTime;

  /* amp ∈ [0.10, 0.80] → 基频 240 ~ 900 Hz */
  const baseFreq = 180 + value * 900;

  const f0 = ascending ? baseFreq * 0.68 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.68;

  const osc = actx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + 0.15);

  const osc2 = actx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(f0 * 2, t);
  osc2.frequency.exponentialRampToValueAtTime(f1 * 2, t + 0.15);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(420, t);
  lp.frequency.exponentialRampToValueAtTime(2400 + value * 1600, t + 0.09);
  lp.frequency.exponentialRampToValueAtTime(680, t + 0.32);
  lp.Q.value = 7;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.115, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.048, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);

  osc.connect(lp);
  osc2.connect(g2).connect(lp);
  lp.connect(g).connect(masterGain);

  osc.start(t); osc2.start(t);
  osc.stop(t + 0.40); osc2.stop(t + 0.26);
}

/* ---- 频率 / 相位滑音：较轻盈的电子音 ---- */
function playFreqGlide(value, ascending, isPhase) {
  if (!audioReady) return;
  const t = actx.currentTime;

  const baseFreq = isPhase
    ? 240 + value * 55
    : 200 + value * 260;

  const f0 = ascending ? baseFreq * 0.80 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.80;

  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + 0.12);

  const osc2 = actx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(f0 * 1.5, t);
  osc2.frequency.exponentialRampToValueAtTime(f1 * 1.5, t + 0.12);

  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(baseFreq * 1.8, t);
  bp.Q.value = 4.2;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.075, t + 0.010);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.032, t + 0.010);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

  osc.connect(bp);
  osc2.connect(g2).connect(bp);
  bp.connect(g).connect(masterGain);

  osc.start(t); osc2.start(t);
  osc.stop(t + 0.34); osc2.stop(t + 0.22);
}

/* =========================================================
   7. 交互：鼠标 / 点击
   ========================================================= */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(-10, -10);

let isDragging = false;
let downPos = { x: 0, y: 0 };
let downTime = 0;
let dragDist = 0;

const el = renderer.domElement;

el.addEventListener('pointermove', (e) => {
  const rect = el.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (isDragging) {
    dragDist += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0);
  }
});

el.addEventListener('pointerleave', () => {
  pointerNDC.set(-10, -10);
  state.hoverTarget = 0;
  state.hasHover = false;
  clearReadout();
});

el.addEventListener('pointerdown', (e) => {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  isDragging = true;
  downPos.x = e.clientX;
  downPos.y = e.clientY;
  downTime = performance.now();
  dragDist = 0;
});

el.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const elapsed = performance.now() - downTime;
  isDragging = false;

  if (moved < 7 && elapsed < 600) {
    initAudio();

    const rect = el.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    const hit = raycastWave();
    if (hit) {
      playDrop();
    }
  }
});

el.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---- 射线与浪面求交 ---- */
function raycastWave() {
  raycaster.setFromCamera(pointerNDC, camera);

  const origin = raycaster.ray.origin;
  const dir    = raycaster.ray.direction;

  if (Math.abs(dir.y) < 1e-5) return null;

  /* 先与 y = 0 平面求交，作为初值 */
  const tPlane = -origin.y / dir.y;
  if (tPlane <= 0.5) return null;

  let px = origin.x + dir.x * tPlane;
  let pz = origin.z + dir.z * tPlane;

  const half = SIZE * 0.5;
  if (Math.abs(px) > half || Math.abs(pz) > half) return null;

  /* 用波动高度做一次修正 */
  for (let k = 0; k < 4; k++) {
    const h = waveHeight(px, pz, timeAcc);
    const tNew = (h - origin.y) / dir.y;
    if (tNew <= 0.2) break;
    px = origin.x + dir.x * tNew;
    pz = origin.z + dir.z * tNew;

    if (Math.abs(px) > half || Math.abs(pz) > half) return null;
  }

  const h = waveHeight(px, pz, timeAcc);
  return new THREE.Vector3(px, h, pz);
}

/* ---- 读数 DOM ---- */
const roX = document.getElementById('roX');
const roZ = document.getElementById('roZ');
const roH = document.getElementById('roH');
const roState = document.getElementById('roState');

function clearReadout() {
  roX.textContent = '—';
  roZ.textContent = '—';
  roH.textContent = '—';
}

/* ---- 每帧更新悬停 ---- */
let hoverTick = 0;

function updateHover() {
  if (isDragging) {
    state.hoverTarget = 0;
    return;
  }

  hoverTick++;
  if (hoverTick % 2 !== 0) return;

  if (pointerNDC.x < -5) {
    state.hoverTarget = 0;
    state.hasHover = false;
    return;
  }

  const hit = raycastWave();

  if (hit) {
    state.hoverPos.copy(hit);
    state.hoverTarget = 1;
    state.hasHover = true;

    roX.textContent = hit.x.toFixed(3);
    roZ.textContent = hit.z.toFixed(3);
    roH.textContent = hit.y.toFixed(4);
  } else {
    state.hoverTarget = 0;
    state.hasHover = false;
    clearReadout();
  }
}

/* =========================================================
   8. UI 绑定
   ========================================================= */
const sliderA  = document.getElementById('sliderA');
const sliderFx = document.getElementById('sliderFx');
const sliderFy = document.getElementById('sliderFy');
const sliderPh = document.getElementById('sliderPh');

const valA  = document.getElementById('valA');
const valFx = document.getElementById('valFx');
const valFy = document.getElementById('valFy');
const valPh = document.getElementById('valPh');

let lastA  = state.amp;
let lastFx = state.fx;
let lastFy = state.fy;
let lastPh = state.phase;

sliderA.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderA.value);
  if (v !== lastA) {
    playAmpGlide(v, v > lastA);
    lastA = v;
  }
  state.amp = v;
  uniforms.uAmp.value = v;
  valA.textContent = v.toFixed(2);
});

sliderFx.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderFx.value);
  if (v !== lastFx) {
    playFreqGlide(v, v > lastFx, false);
    lastFx = v;
  }
  state.fx = v;
  uniforms.uFx.value = v;
  valFx.textContent = v.toFixed(2);
});

sliderFy.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderFy.value);
  if (v !== lastFy) {
    playFreqGlide(v, v > lastFy, false);
    lastFy = v;
  }
  state.fy = v;
  uniforms.uFy.value = v;
  valFy.textContent = v.toFixed(2);
});

sliderPh.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderPh.value);
  if (v !== lastPh) {
    playFreqGlide(v, v > lastPh, true);
    lastPh = v;
  }
  state.phase = v;
  uniforms.uPhase.value = v;
  valPh.textContent = v.toFixed(2);
});

/* =========================================================
   9. 尺寸自适应
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* =========================================================
   10. 主循环
   ========================================================= */
let lastT = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  timeAcc += dt;

  controls.update();

  /* ---- 更新 uniform ---- */
  uniforms.uTime.value = timeAcc;
  uniforms.uCamPos.value.copy(camera.position);

  /* ---- 悬停缓动 ---- */
  state.hoverStrength += (state.hoverTarget - state.hoverStrength) * Math.min(1, dt * 10);
  uniforms.uHoverStrength.value = state.hoverStrength;
  uniforms.uHoverPos.value.copy(state.hoverPos);

  /* ---- 悬停拾取 ---- */
  updateHover();

  /* ---- 海浪声随振幅轻微变化 ---- */
  if (audioReady && waveFilter && waveGain) {
    const t = actx.currentTime;
    const ampN = (state.amp - 0.10) / 0.70;   // 0..1
    waveFilter.frequency.setTargetAtTime(700 + ampN * 900, t, 0.35);
    waveGain.gain.setTargetAtTime(0.042 + ampN * 0.038, t, 0.35);
  }

  /* ---- 波面状态文字 ---- */
  roState.textContent = state.amp > 0.55 ? '巨浪翻涌' :
                        state.amp > 0.30 ? '涌动中' : '微波轻漾';

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

/* =========================================================
   11. 首次手势解锁音频
   ========================================================= */
['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, () => {
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
  }, { once: true });
});

</script>
