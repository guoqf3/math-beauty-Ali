<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clifford环面编织 · 四维投影网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Clifford环面编织 · 四维投影网</h2>
        <div class="sub">Clifford torus in S³ · Stereographic projection · Coordinate net braiding</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">R₁=2.4: u‑curves (v=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">R₂=2.6: v‑curves (u=const)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">R₃=2.8: diagonal u±v=const</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.4, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 2.5;
        const PROJ_W = 2.2;

        // 球极投影 S³ → R³, 投影点 (0,0,0,-1)
        function stereographic(x1, x2, x3, x4) {
            const denom = PROJ_W - x4;
            if (Math.abs(denom) < 0.025) return null;
            const f = SCALE / denom;
            const pt = new THREE.Vector3(x1 * f, x2 * f, x3 * f);
            return pt.length() < 9.8 ? pt : null;
        }

        // Clifford环面：S¹(r₁)×S¹(r₂) ⊂ S³，其中 r₁=r₂=1/√2
        // 参数化：(r₁cos(u), r₁sin(u), r₂cos(v), r₂sin(v))
        function cliffordPoint(r1, r2, u, v) {
            return [
                r1 * Math.cos(u),
                r1 * Math.sin(u),
                r2 * Math.cos(v),
                r2 * Math.sin(v)
            ];
        }

        function projectCurve(points4D, color, opacity) {
            const pts3D = [];
            for (const [x1, x2, x3, x4] of points4D) {
                const sp = stereographic(x1, x2, x3, x4);
                if (sp) pts3D.push(sp);
            }
            if (pts3D.length < 2) return null;
            const geom = new THREE.BufferGeometry().setFromPoints(pts3D);
            const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: true, depthTest: true });
            return new THREE.Line(geom, mat);
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'clifford-weave';
        scene.add(rootGroup);

        const curveSteps = 380;
        const r1_vals = [1/Math.sqrt(2)];
        const r2_vals = [1/Math.sqrt(2)];

        // 金色族：u-曲线 (固定v, 变化u)
        const vCount = 26;
        for (const r1 of r1_vals) {
            for (const r2 of r2_vals) {
                for (let i = 0; i < vCount; i++) {
                    const v = i * 2 * Math.PI / vCount;
                    const pts4D = [];
                    const du = 2 * Math.PI / curveSteps;
                    for (let j = 0; j <= curveSteps; j++) {
                        const u = j * du;
                        pts4D.push(cliffordPoint(r1, r2, u, v));
                    }
                    const line = projectCurve(pts4D, COLOR_GOLD, 0.58);
                    if (line) rootGroup.add(line);
                }
            }
        }

        // 青色族：v-曲线 (固定u, 变化v)
        const uCount = 26;
        for (const r1 of r1_vals) {
            for (const r2 of r2_vals) {
                for (let i = 0; i < uCount; i++) {
                    const u = i * 2 * Math.PI / uCount;
                    const pts4D = [];
                    const dv = 2 * Math.PI / curveSteps;
                    for (let j = 0; j <= curveSteps; j++) {
                        const v = j * dv;
                        pts4D.push(cliffordPoint(r1, r2, u, v));
                    }
                    const line = projectCurve(pts4D, COLOR_CYAN, 0.58);
                    if (line) rootGroup.add(line);
                }
            }
        }

        // 品红族：对角线 (u+v=const 和 u-v=const)
        const diagCount = 28;
        for (const r1 of r1_vals) {
            for (const r2 of r2_vals) {
                for (let i = 0; i < diagCount; i++) {
                    const c = -3*Math.PI + i * 6*Math.PI / diagCount;
                    // u+v = c → v = c - u
                    let pts4D = [];
                    const dt = 5.5 / curveSteps;
                    for (let j = 0; j <= curveSteps; j++) {
                        const t = -2.75 + j * dt;
                        const u = t;
                        const v = c - t;
                        pts4D.push(cliffordPoint(r1, r2, u, v));
                    }
                    let line = projectCurve(pts4D, COLOR_MAGENTA, 0.55);
                    if (line) rootGroup.add(line);
                    // u-v = c → v = u - c
                    pts4D = [];
                    for (let j = 0; j <= curveSteps; j++) {
                        const t = -2.75 + j * dt;
                        const u = t;
                        const v = t - c;
                        pts4D.push(cliffordPoint(r1, r2, u, v));
                    }
                    line = projectCurve(pts4D, COLOR_MAGENTA, 0.50);
                    if (line) rootGroup.add(line);
                }
            }
        }

        // 辅助球面参考网格
        const refR = SCALE * 1.05;
        for (let i = 0; i < 9; i++) {
            const lat = (i + 0.5) * Math.PI / 9;
            const r = refR * Math.sin(lat);
            const z = refR * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            rootGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(refR * st * Math.cos(phi), refR * Math.cos(theta), refR * st * Math.sin(phi)));
            }
            rootGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        console.log('Clifford环面编织线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // 稳定动画循环
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.15;
            rootGroup.rotation.y = t * 0.25;
            rootGroup.rotation.z = t * 0.10;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Clifford环面四维投影编织动画已稳定运行');
    </script>
</body>
</html>
