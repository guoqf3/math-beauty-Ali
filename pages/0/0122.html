<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锥面Clairaut测地线 · 旋转曲面编织 · 空间投影</title>
    <style>
        :root {
            --bg: #04040e;
            --gold: #d6a745;
            --cyan: #3dbca5;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.43rem, 0.88vw, 0.6rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 14, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.56rem, 1.2vw, 0.82rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.36rem, 0.72vw, 0.52rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3dbca5;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <h1>锥面Clairaut测地线 · 旋转曲面编织 · 空间投影</h1>
        <div class="subtitle">r·sin ψ = const &nbsp;·&nbsp; 锥面展开扇形直线族 &nbsp;·&nbsp; 球极逆投影</div>
    </div>
    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">dθ/dr = c/(r√(r²−c²))</span>
            ⊗ <span class="accent-cyan">α = 2π/√(1+h²)</span>
            ⊗ <span class="accent-rose">π⁻¹: Σ→S²</span>
        </div>
        <div class="formula-detail">
            Clairaut关系 · 锥面展开扇形角 · 测地线即扇形上直线 · 球极逆投影编织
        </div>
    </div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.3, 1.4, 7.8);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3dbca5');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // 背景星点
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 130;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.4 + Math.random() * 8.4;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSizes[i] = Math.random() * 1.5 + 0.2;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.017,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 48, 32);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.06, depthWrite: false })
        );
        scene.add(refSphereWire);
        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 26);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.05, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- 球极逆投影 ----------
        function invStereo(x, y, z) {
            const r2 = x * x + y * y + z * z;
            const denom = 1 + r2 / (2.5 * 2.5);
            const inv = 1 / denom;
            return [(2 * x) * inv, (2 * y) * inv, ((1 - r2 / (2.5 * 2.5)) * 2.5) * inv];
        }

        function clampPt(p) {
            let [x, y, z] = p;
            if (!Number.isFinite(x)) x = 0;
            if (!Number.isFinite(y)) y = 0;
            if (!Number.isFinite(z)) z = 0;
            const r = Math.sqrt(x * x + y * y + z * z);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const s = CLAMP_RADIUS / r;
                return [x * s, y * s, z * s];
            }
            return [x, y, z];
        }

        function so3Matrix(t) {
            const angle = t * 0.24;
            const ax = Math.cos(t * 0.17) * 0.5;
            const ay = Math.sin(t * 0.13) * 0.45;
            const az = Math.cos(t * 0.2 + 1.2) * 0.5;
            const n = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
            const ux = ax / n,
                uy = ay / n,
                uz = az / n;
            const c = Math.cos(angle),
                s = Math.sin(angle),
                t1 = 1 - c;
            return [
                c + ux * ux * t1, ux * uy * t1 - uz * s, ux * uz * t1 + uy * s,
                uy * ux * t1 + uz * s, c + uy * uy * t1, uy * uz * t1 - ux * s,
                uz * ux * t1 - uy * s, uz * uy * t1 + ux * s, c + uz * uz * t1,
            ];
        }
        function applyRot(pt, R) {
            return [
                R[0] * pt[0] + R[1] * pt[1] + R[2] * pt[2],
                R[3] * pt[0] + R[4] * pt[1] + R[5] * pt[2],
                R[6] * pt[0] + R[7] * pt[1] + R[8] * pt[2],
            ];
        }

        // ---------- 锥面映射 ----------
        // 锥面: z = h * r, 展开扇形角 alpha = 2*PI / sqrt(1+h*h)
        // 扇形坐标 (rho, phi) -> 锥面 (r, theta): r = rho, theta = phi * sqrt(1+h*h)
        function coneFromSector(rho, phi, h) {
            const f = Math.sqrt(1 + h * h);
            const theta = phi * f;
            const r = rho;
            return [r * Math.cos(theta), r * Math.sin(theta), h * r];
        }

        // ---------- 曲线系统 ----------
        const POINTS_PER_CURVE = 140;
        const allCurves = [];

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.82,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geom, positions, updateFn: null };
            allCurves.push(obj);
            return obj;
        }

        // 在扇形上生成直线点
        function sampleSectorLine(d, phi0, alphaMax, rhoMin, rhoMax, n) {
            const pts = [];
            for (let i = 0; i < n; i++) {
                const phi = phi0 - 0.48 * Math.PI + (i / (n - 1)) * 0.96 * Math.PI;
                const diff = phi - phi0;
                if (Math.abs(Math.cos(diff)) < 1e-9) continue;
                const rho = d / Math.cos(diff);
                if (rho >= rhoMin && rho <= rhoMax && phi > 0 && phi < alphaMax) {
                    pts.push([rho, phi]);
                } else {
                    pts.push(null);
                }
            }
            return pts;
        }

        // 构建三族曲线配置
        const curveConfigs = [];
        function addFamily(count, dBase, dSpread, phi0Base, phi0Spread, color) {
            for (let k = 0; k < count; k++) {
                const d = dBase + (k / count) * dSpread;
                const phi0 = phi0Base + (k / count) * phi0Spread;
                const curve = createCurve(color);
                curve.d = d;
                curve.phi0 = phi0;
                curve.phaseK = k * 0.6;
                curveConfigs.push(curve);
            }
        }

        // 金族：从扇形左侧出发，d较小
        addFamily(24, 0.05, 1.3, 0.15, 0.4, colorGold);
        // 青族：从扇形右侧出发，d中等
        addFamily(24, 0.3, 1.5, 2.8, 0.5, colorCyan);
        // 玫红族：从扇形底部出发，d较大
        addFamily(24, 0.6, 1.8, 1.5, 0.6, colorRose);

        console.log(`✅ 曲线总数: ${allCurves.length}`);

        // ---------- 更新所有曲线 ----------
        function updateAll(elapsed) {
            const R3 = so3Matrix(elapsed);
            // h 随时间缓慢变化，改变锥面张开角
            const h = 1.0 + 0.25 * Math.sin(elapsed * 0.35) * Math.cos(elapsed * 0.28);
            const alphaMax = (2 * Math.PI) / Math.sqrt(1 + h * h);
            const rhoMin = 0.08;
            const rhoMax = 2.8;

            for (const curve of allCurves) {
                try {
                    const positions = curve.positions;
                    const d = curve.d + 0.08 * Math.sin(elapsed * 0.4 + curve.phaseK);
                    const phi0 = curve.phi0 + elapsed * 0.08;
                    const safeD = Math.max(0.02, d);
                    const pts = sampleSectorLine(safeD, phi0, alphaMax, rhoMin, rhoMax, POINTS_PER_CURVE);

                    for (let i = 0; i < POINTS_PER_CURVE; i++) {
                        let p;
                        if (pts[i]) {
                            const conePt = coneFromSector(pts[i][0], pts[i][1], h);
                            p = invStereo(conePt[0], conePt[1], conePt[2]);
                            p = applyRot(p, R3);
                            p = clampPt(p);
                        } else {
                            p = [0, 0, 0];
                        }
                        positions[i * 3] = p[0];
                        positions[i * 3 + 1] = p[1];
                        positions[i * 3 + 2] = p[2];
                    }
                    curve.geom.attributes.position.needsUpdate = true;
                } catch (e) {}
            }
        }

        // ---------- 流动粒子 ----------
        const particleCount = 22;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                curveIndex: i % allCurves.length,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0025,
            });
            const col = i < 8 ? colorGold : i < 15 ? colorCyan : colorRose;
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.045,
            vertexColors: true,
            transparent: true,
            opacity: 0.82,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const curveObj = allCurves[pd.curveIndex];
                if (!curveObj || !curveObj.positions) continue;
                const posArr = curveObj.positions;
                const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                const i0 = idx0 * 3,
                    i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // ---------- 健壮动画循环 ----------
        const startTime = performance.now();
        let frameCount = 0,
            lastLogTime = startTime;

        function animate(nowTS) {
            requestAnimationFrame(animate);
            try {
                const now = nowTS || performance.now();
                const elapsed = (now - startTime) / 1000;
                frameCount++;
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${elapsed.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }
                updateAll(elapsed);
                updateParticles();

                const breathe = 1 + 0.04 * Math.sin(elapsed * 0.38);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += 0.0008;
                refSphereWire.rotation.y += 0.0007;
                refTorusWire.rotation.z += 0.0008;
                refTorusWire.scale.setScalar(1 + 0.05 * Math.sin(elapsed * 0.43));

                const camH = elapsed * 0.08;
                const camV = 0.32 + 0.18 * Math.sin(elapsed * 0.16);
                const camD = 7.5 + 0.6 * Math.sin(elapsed * 0.19);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0, 0, 0);
                stars.rotation.y += 0.0002;
                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环错误（已恢复）:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });

        // 启动
        console.log('🚀 锥面Clairaut测地线动画初始化...');
        updateAll(0);
        updateParticles();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动（锥面测地线，绝对时间驱动）');
    </script>
</body>
</html>
