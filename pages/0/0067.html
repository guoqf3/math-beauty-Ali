<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>螺旋纤维编织 · 圆柱调和网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.8) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.45), 0 0 60px rgba(212, 168, 67, 0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200, 180, 150, 0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6, 6, 12, 0.95) 0%, rgba(6, 6, 12, 0.82) 55%, rgba(6, 6, 12, 0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210, 200, 185, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold {
            color: #d4a843;
            font-weight: bold;
        }
        .clr-cyan {
            color: #45b7aa;
            font-weight: bold;
        }
        .clr-magenta {
            color: #d4708a;
            font-weight: bold;
        }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150, 140, 130, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>螺旋纤维编织 · 圆柱调和网</h2>
        <div class="sub">Cylindrical harmonic braids · Triple‑family spiral weaves</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">r₁(θ)=R₁·e^{iθ}, z=v₁θ, θ∈[0,6π]</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">r₂(θ)=R₂·e^{i(θ+Δ₂)}, z=v₂θ</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">r₃(θ)=R₃·e^{i(θ+Δ₃)}, z=v₃θ</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.5, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        // 手动时钟——杜绝暂停
        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;

        // ---------- 螺旋线生成 ----------
        function createHelix(R, omega, heightMin, heightMax, phi0, numPoints, amplitudeMod, freqMod) {
            const pts = [];
            const totalTurns = (heightMax - heightMin) / (2 * Math.PI / omega);
            const totalAngle = totalTurns * 2 * Math.PI;
            const dt = totalAngle / numPoints;
            for (let i = 0; i <= numPoints; i++) {
                const theta = i * dt;
                const rMod = R + amplitudeMod * Math.sin(freqMod * theta + phi0);
                const x = rMod * Math.cos(theta + phi0);
                const z = rMod * Math.sin(theta + phi0);
                const y = heightMin + (theta / totalAngle) * (heightMax - heightMin);
                pts.push(new THREE.Vector3(x, y, z));
            }
            return pts;
        }

        // 创建一族螺旋线
        function createHelixFamily(R, omega, heightMin, heightMax, numLines, color, opacity, amplitudeMod, freqMod, numPoints) {
            const group = new THREE.Group();
            for (let k = 0; k < numLines; k++) {
                const phi0 = k * 2 * Math.PI / numLines;
                const pts = createHelix(R, omega, heightMin, heightMax, phi0, numPoints, amplitudeMod, freqMod);
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    depthWrite: true,
                    depthTest: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        // 创建环线（纬线）
        function createRing(R, y, color, opacity, numPoints) {
            const pts = [];
            for (let i = 0; i <= numPoints; i++) {
                const theta = i * 2 * Math.PI / numPoints;
                pts.push(new THREE.Vector3(R * Math.cos(theta), y, R * Math.sin(theta)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color,
                transparent: true,
                opacity,
                depthWrite: true,
                depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        // 创建径向线
        function createRadialLine(angle, Rmin, Rmax, y, color, opacity, numPoints) {
            const pts = [];
            for (let i = 0; i <= numPoints; i++) {
                const r = Rmin + (Rmax - Rmin) * i / numPoints;
                pts.push(new THREE.Vector3(r * Math.cos(angle), y, r * Math.sin(angle)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color,
                transparent: true,
                opacity,
                depthWrite: true,
                depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        // ---------- 构建场景 ----------
        const rootGroup = new THREE.Group();
        rootGroup.name = 'spiral-weave';
        scene.add(rootGroup);

        const heightMin = -3.2;
        const heightMax = 3.2;
        const helixPoints = 500;
        const numLines = 30;

        // 金色族：内层，快速螺旋，绕Y轴
        const goldGroup = new THREE.Group();
        goldGroup.name = 'gold-family';
        goldGroup.add(createHelixFamily(1.25, 4.5, heightMin, heightMax, numLines, COLOR_GOLD, 0.65, 0.18, 2.8, helixPoints));
        // 额外几条调制更明显的金色线
        goldGroup.add(createHelixFamily(1.10, 4.2, heightMin, heightMax, Math.floor(numLines * 0.5), COLOR_GOLD, 0.50, 0.28, 3.5, helixPoints));
        rootGroup.add(goldGroup);

        // 青色族：中层，中等螺旋，绕Y轴偏移
        const cyanGroup = new THREE.Group();
        cyanGroup.name = 'cyan-family';
        cyanGroup.add(createHelixFamily(1.85, 3.2, heightMin, heightMax, numLines, COLOR_CYAN, 0.65, 0.22, 2.2, helixPoints));
        cyanGroup.add(createHelixFamily(1.70, 2.9, heightMin, heightMax, Math.floor(numLines * 0.5), COLOR_CYAN, 0.50, 0.32, 3.0, helixPoints));
        rootGroup.add(cyanGroup);

        // 品红族：外层，慢速螺旋，绕Y轴更多偏移
        const magentaGroup = new THREE.Group();
        magentaGroup.name = 'magenta-family';
        magentaGroup.add(createHelixFamily(2.45, 2.1, heightMin, heightMax, numLines, COLOR_MAGENTA, 0.65, 0.20, 1.8, helixPoints));
        magentaGroup.add(createHelixFamily(2.30, 1.8, heightMin, heightMax, Math.floor(numLines * 0.5), COLOR_MAGENTA, 0.50, 0.35, 2.5, helixPoints));
        rootGroup.add(magentaGroup);

        // 辅助环线——在三族半径上
        const ringHeights = [-2.8, -2.0, -1.2, -0.4, 0.4, 1.2, 2.0, 2.8];
        const ringRadii = [1.25, 1.85, 2.45];
        const ringColors = [COLOR_GOLD, COLOR_CYAN, COLOR_MAGENTA];
        const ringOpacities = [0.22, 0.20, 0.18];
        ringHeights.forEach(y => {
            ringRadii.forEach((R, idx) => {
                rootGroup.add(createRing(R, y, ringColors[idx], ringOpacities[idx], 220));
            });
        });

        // 辅助径向线
        const radialAngles = [0, 45, 90, 135, 180, 225, 270, 315].map(d => d * Math.PI / 180);
        radialAngles.forEach(angle => {
            ringHeights.forEach((y, i) => {
                const color = i % 3 === 0 ? COLOR_GOLD : (i % 3 === 1 ? COLOR_CYAN : COLOR_MAGENTA);
                rootGroup.add(createRadialLine(angle, 0.15, 2.7, y, color, 0.14, 60));
            });
        });

        // 中心轴线（极淡）
        const axisPts = [];
        for (let i = 0; i <= 200; i++) {
            axisPts.push(new THREE.Vector3(0, -3.5 + i * 7.0 / 200, 0));
        }
        const axisGeom = new THREE.BufferGeometry().setFromPoints(axisPts);
        rootGroup.add(new THREE.Line(axisGeom, new THREE.LineBasicMaterial({
            color: 0x504030,
            transparent: true,
            opacity: 0.16,
            depthWrite: true,
            depthTest: true,
        })));

        console.log('螺旋纤维编织线条总数:', rootGroup.children.length);

        // ---------- 背景星点 ----------
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---------- 健壮的动画循环 ----------
        function animate() {
            const t = getElapsed();

            // 三个螺旋族绕各自Y轴以不同速度旋转
            goldGroup.rotation.y = t * 0.38;
            cyanGroup.rotation.y = t * 0.29;
            magentaGroup.rotation.y = t * 0.21;

            // 整体结构绕X轴和Z轴缓慢旋转
            rootGroup.rotation.x = t * 0.13;
            rootGroup.rotation.y = t * 0.17;
            rootGroup.rotation.z = t * 0.09;

            // 背景星点旋转
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            // 相机环绕
            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.5 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        // 响应式处理
        window.addEventListener('resize', () => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth,
                h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 螺旋纤维编织动画已稳定运行');
    </script>
</body>
</html>
