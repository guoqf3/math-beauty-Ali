<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>高度场分形山峦</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#070b14}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:#d8e4f0;-webkit-font-smoothing:antialiased;
  }
  canvas{display:block}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}

  .panel{
    position:absolute;
    background:rgba(10,18,30,.62);
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(120,180,255,.16);
    border-radius:18px;
    padding:16px 18px;
    pointer-events:auto;
    box-shadow:0 16px 48px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---- 标题 ---- */

  }
  #info .formula{
    margin-top:9px;

  #info .hint{
    margin-top:10px;font-size:10.5px;color:#5a6f8a;letter-spacing:.6px;
  }

  /* ---- 控制面板 ---- */
  #controls{left:22px;bottom:22px;width:272px}
  .ctrl{margin-bottom:15px}
  .ctrl:last-child{margin-bottom:0}
  .ctrl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:#a8c0d8;margin-bottom:9px;letter-spacing:.8px;
  }
  .ctrl label span{
    color:#7ac8ff;font-family:ui-monospace,monospace;font-size:12px;

  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#3a8fd0,#7ac8ff,#8fe0c0);

  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22)}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;

  /* ---- 读数 ---- */

  }

  @media(max-width:720px){

    .ro-row{font-size:10.5px}

  }
</style>

<body>

<div id="ui">
  <div class="panel" id="info">
    <h1>高度场分形山峦</h1>
    <div class="formula">
      H = 中点位移 ⊗ Perlin fBm 多层叠加
    </div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击山顶</div>
  </div>

  <div class="panel" id="controls">
    <div class="ctrl">
      <label>随机种子<span id="valSeed">42</span></label>
      <input type="range" id="sliderSeed" min="1" max="500" step="1" value="42">
    </div>
    <div class="ctrl">
      <label>分形维数<span id="valRough">0.55</span></label>
      <input type="range" id="sliderRough" min="0.35" max="0.78" step="0.01" value="0.55">
    </div>
    <div class="ctrl">
      <label>山体高度<span id="valHeight">2.10</span></label>
      <input type="range" id="sliderHeight" min="0.60" max="4.50" step="0.05" value="2.10">
    </div>
    <div class="ctrl">
      <label>噪声细节层数<span id="valOct">5</span></label>
      <input type="range" id="sliderOct" min="1" max="7" step="1" value="5">
    </div>
  </div>

  <div class="panel" id="readout">
    <div class="ttl">地形读数</div>
    <div class="ro-row"><span>坐标 x</span><b id="roX">—</b></div>
    <div class="ro-row"><span>坐标 z</span><b id="roZ">—</b></div>
    <div class="ro-row"><span>海拔 h</span><b id="roH">—</b></div>
    <div class="ro-row"><span>峰值 / 谷底</span><b id="roRange">—</b></div>
    <div class="ro-row hi"><span>地貌类型</span><b id="roBiome">山地</b></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0. 全局状态
   ========================================================= */
const GRID = 128;              // 分段数（顶点数 = GRID + 1）
const SIZE = 129;
const WORLD = 22;              // 世界尺寸

const state = {
  seed: 42,
  roughness: 0.55,
  heightScale: 2.10,
  octaves: 5,
  hoverStrength: 0,
  hoverTarget: 0,
  hoverPos: new THREE.Vector3(),
};

/* =========================================================
   1. 伪随机数生成器（Mulberry32）
   ========================================================= */
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =========================================================
   2. 中点位移算法（Diamond–Square）
   ========================================================= */
function diamondSquare(size, seed, roughness) {
  const rand = mulberry32(seed);
  const grid = new Float32Array(size * size);
  const N = size - 1;

  /* 四角赋初值 */
  grid[0] = rand() * 2 - 1;
  grid[N] = rand() * 2 - 1;
  grid[N * size] = rand() * 2 - 1;
  grid[N * size + N] = rand() * 2 - 1;

  let step = N;
  let scale = 1.0;

  while (step > 1) {
    const half = step >> 1;

    /* ---- Diamond 步 ---- */
    for (let y = half; y < N; y += step) {
      for (let x = half; x < N; x += step) {
        const a = grid[(y - half) * size + (x - half)];
        const b = grid[(y - half) * size + (x + half)];
        const c = grid[(y + half) * size + (x - half)];
        const d = grid[(y + half) * size + (x + half)];

        grid[y * size + x] =
          (a + b + c + d) * 0.25 + (rand() * 2 - 1) * scale;
      }
    }

    /* ---- Square 步 ---- */
    for (let y = 0; y <= N; y += half) {
      const xStart = ((y + half) % step === 0) ? half : 0;

      for (let x = xStart; x <= N; x += step) {
        let sum = 0;
        let cnt = 0;

        if (y - half >= 0) { sum += grid[(y - half) * size + x]; cnt++; }
        if (y + half <= N) { sum += grid[(y + half) * size + x]; cnt++; }
        if (x - half >= 0) { sum += grid[y * size + (x - half)]; cnt++; }
        if (x + half <= N) { sum += grid[y * size + (x + half)]; cnt++; }

        grid[y * size + x] =
          sum / cnt + (rand() * 2 - 1) * scale;
      }
    }

    step = half;
    scale *= roughness;
  }

  return grid;
}

/* =========================================================
   3. 值噪声 + fBm（分形布朗运动）
   ========================================================= */
function hash2(ix, iy, seed) {
  let n = Math.sin(ix * 127.1 + iy * 311.7 + seed * 74.7) * 43758.5453;
  return n - Math.floor(n);
}

function valueNoise(x, y, seed) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  const fx = x - ix;
  const fy = y - iy;

  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);

  const a = hash2(ix, iy, seed);
  const b = hash2(ix + 1, iy, seed);
  const c = hash2(ix, iy + 1, seed);
  const d = hash2(ix + 1, iy + 1, seed);

  const top = a + (b - a) * ux;
  const bot = c + (d - c) * ux;
  return top + (bot - top) * uy;
}

function fbm(x, y, seed, octaves) {
  let sum = 0;
  let amp = 1;
  let freq = 1;
  let norm = 0;

  for (let i = 0; i < octaves; i++) {
    sum += amp * valueNoise(x * freq, y * freq, seed + i * 17.3);
    norm += amp;
    amp *= 0.5;
    freq *= 2.03;
  }
  return sum / norm;
}

/* =========================================================
   4. 场景 / 相机 / 渲染器
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b14);
scene.fog = new THREE.FogExp2(0x0a1424, 0.026);

const camera = new THREE.PerspectiveCamera(
  52,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);
camera.position.set(12, 9.5, 15);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.80;
controls.zoomSpeed = 0.92;
controls.panSpeed = 0.65;
controls.minDistance = 3.5;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0, 0);

/* =========================================================
   5. 灯光
   ========================================================= */
const hemi = new THREE.HemisphereLight(0x8fb8e8, 0x1a2438, 0.72);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0d8, 2.10);
sun.position.set(18, 26, 12);
scene.add(sun);

const rim = new THREE.DirectionalLight(0x5a90d8, 0.85);
rim.position.set(-14, 8, -16);
scene.add(rim);

const fill = new THREE.DirectionalLight(0x8fa8c8, 0.42);
fill.position.set(-6, -10, 10);
scene.add(fill);

/* =========================================================
   6. 地形几何
   ========================================================= */
const geometry = new THREE.PlaneGeometry(WORLD, WORLD, GRID, GRID);
geometry.rotateX(-Math.PI / 2);

/* 顶点颜色属性 */
const vertexCount = (GRID + 1) * (GRID + 1);
geometry.setAttribute(
  'color',
  new THREE.BufferAttribute(new Float32Array(vertexCount * 3), 3)
);

const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.88,
  metalness: 0.06,
  flatShading: false,
});

const terrain = new THREE.Mesh(geometry, terrainMat);
terrain.frustumCulled = false;
scene.add(terrain);

/* ---- 高度场缓存 ---- */
let baseHeights = null;
let peakHeight = 1;
let valleyHeight = 0;

/* ---- 生成高度场（归一化 0..1） ---- */
function generateHeightField() {
  const ds = diamondSquare(SIZE, state.seed, state.roughness);

  const raw = new Float32Array(SIZE * SIZE);
  let min = Infinity;
  let max = -Infinity;

  const fbmScale = 3.2;

  for (let j = 0; j < SIZE; j++) {
    for (let i = 0; i < SIZE; i++) {
      const x = i / GRID;
      const y = j / GRID;

      const dsVal = ds[j * SIZE + i];
      const fb = fbm(x * fbmScale, y * fbmScale, state.seed, state.octaves);

      /* 中点位移提供骨架，fBm 补细节 */
      let h = dsVal * 0.68 + (fb * 2 - 1) * 0.32;

      /* 边缘轻微压低，模拟海平面退去 */
      const ex = Math.min(x, 1 - x) * 2;
      const ey = Math.min(y, 1 - y) * 2;
      const edge = Math.min(1, Math.min(ex, ey) * 1.6);
      h = h * (0.42 + 0.58 * edge) - (1 - edge) * 0.16;

      raw[j * SIZE + i] = h;

      if (h < min) min = h;
      if (h > max) max = h;
    }
  }

  const range = max - min || 1;
  const norm = new Float32Array(SIZE * SIZE);
  for (let i = 0; i < norm.length; i++) {
    /* 用幂函数拉开高低层次 */
    const t = (raw[i] - min) / range;
    norm[i] = Math.pow(t, 1.15);
  }

  baseHeights = norm;
}

/* ---- 颜色渐变停靠点 ---- */
const STOPS = [
  { t: 0.00, c: new THREE.Color(0x0a1c30) },
  { t: 0.14, c: new THREE.Color(0x143a5a) },
  { t: 0.26, c: new THREE.Color(0x1f6a52) },
  { t: 0.40, c: new THREE.Color(0x4a7a45) },
  { t: 0.54, c: new THREE.Color(0x7a8a4e) },
  { t: 0.68, c: new THREE.Color(0x8a6f48) },
  { t: 0.82, c: new THREE.Color(0x9a8e80) },
  { t: 0.93, c: new THREE.Color(0xc8c4bc) },
  { t: 1.00, c: new THREE.Color(0xf4f8ff) },
];

const _tmpColor = new THREE.Color();

function sampleGradient(t, target) {
  t = Math.max(0, Math.min(1, t));

  for (let i = 0; i < STOPS.length - 1; i++) {
    const a = STOPS[i];
    const b = STOPS[i + 1];

    if (t <= b.t) {
      const f = (t - a.t) / (b.t - a.t);
      target.copy(a.c).lerp(b.c, f);
      return target;
    }
  }
  target.copy(STOPS[STOPS.length - 1].c);
  return target;
}

/* ---- 把高度场写入几何体 ---- */
function applyHeightField() {
  if (!baseHeights) return;

  const pos = geometry.attributes.position;
  const col = geometry.attributes.color;

  const hs = state.heightScale;

  let maxH = -Infinity;
  let minH = Infinity;

  for (let iy = 0; iy <= GRID; iy++) {
    for (let ix = 0; ix <= GRID; ix++) {
      const idx = iy * (GRID + 1) + ix;
      const h = baseHeights[iy * SIZE + ix];

      const y = h * hs;
      pos.setY(idx, y);

      if (y > maxH) maxH = y;
      if (y < minH) minH = y;

      sampleGradient(h, _tmpColor);

      /* 高处稍微提亮，谷底压暗 */
      const lum = 0.78 + h * 0.40;
      col.setXYZ(
        idx,
        _tmpColor.r * lum,
        _tmpColor.g * lum,
        _tmpColor.b * lum
      );
    }
  }

  pos.needsUpdate = true;
  col.needsUpdate = true;

  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();

  peakHeight = maxH;
  valleyHeight = minH;

  updateReadoutRange();
}

/* =========================================================
   7. 读数
   ========================================================= */
const roX = document.getElementById('roX');
const roZ = document.getElementById('roZ');
const roH = document.getElementById('roH');
const roRange = document.getElementById('roRange');
const roBiome = document.getElementById('roBiome');

function updateReadoutRange() {
  roRange.textContent = `${peakHeight.toFixed(2)} / ${valleyHeight.toFixed(2)}`;
}

function clearReadout() {
  roX.textContent = '—';
  roZ.textContent = '—';
  roH.textContent = '—';
}

function classifyBiome(h) {
  if (h < 0.16) return '深谷';
  if (h < 0.34) return '丘陵';
  if (h < 0.55) return '山麓';
  if (h < 0.75) return '陡坡';
  if (h < 0.90) return '高峰';
  return '雪顶';
}

/* =========================================================
   8. 音频引擎
   ========================================================= */
let actx = null;
let masterGain = null;
let audioReady = false;

let windGain = null;
let windFilter = null;
let windHP = null;

function makePinkNoise(ctx, seconds) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);

  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.22;
  }
  return buf;
}

function initAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { actx = new AC(); } catch (e) { return; }
  if (actx.state === 'suspended') actx.resume();

  masterGain = actx.createGain();
  masterGain.gain.value = 0.50;
  masterGain.connect(actx.destination);

  createWind();
  audioReady = true;
}

/* ---- 风声呼啸 ---- */
function createWind() {
  const src = actx.createBufferSource();
  src.buffer = makePinkNoise(actx, 3.0);
  src.loop = true;

  windHP = actx.createBiquadFilter();
  windHP.type = 'highpass';
  windHP.frequency.value = 180;

  windFilter = actx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.value = 780;
  windFilter.Q.value = 1.4;

  windGain = actx.createGain();
  windGain.gain.value = 0.0001;

  src.connect(windHP).connect(windFilter).connect(windGain).connect(masterGain);
  src.start();

  /* 缓慢 LFO 制造阵风 */
  const lfo = actx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.19;

  const lfoG = actx.createGain();
  lfoG.gain.value = 320;

  lfo.connect(lfoG).connect(windFilter.frequency);
  lfo.start();
}

function updateWind(speed) {
  if (!audioReady || !windGain) return;
  const t = actx.currentTime;
  const n = Math.min(speed / 7.5, 1);

  windGain.gain.setTargetAtTime(n * n * 0.155, t, 0.08);
  windFilter.frequency.setTargetAtTime(620 + n * 1700, t, 0.11);
  windHP.frequency.setTargetAtTime(150 + n * 260, t, 0.11);
}

/* ---- 点击山顶：岩石滚落低沉音 ---- */
function playRockFall() {
  if (!audioReady) return;
  const t = actx.currentTime;

  /* 低频闷响主体 */
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(210, t);
  osc.frequency.exponentialRampToValueAtTime(38, t + 0.24);

  const og = actx.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.34, t + 0.006);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);

  osc.connect(og).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.70);

  /* 次低频加强体感 */
  const osc2 = actx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(110, t);
  osc2.frequency.exponentialRampToValueAtTime(30, t + 0.3);

  const og2 = actx.createGain();
  og2.gain.setValueAtTime(0.0001, t);
  og2.gain.exponentialRampToValueAtTime(0.17, t + 0.008);
  og2.gain.exponentialRampToValueAtTime(0.0001, t + 0.72);

  osc2.connect(og2).connect(masterGain);
  osc2.start(t);
  osc2.stop(t + 0.80);

  /* 碎石碰撞噪声 */
  const len = Math.floor(actx.sampleRate * 0.45);
  const nb = actx.createBuffer(1, len, actx.sampleRate);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const e = Math.pow(1 - i / len, 2.2);
    nd[i] = (Math.random() * 2 - 1) * e;
  }

  const ns = actx.createBufferSource();
  ns.buffer = nb;

  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.setValueAtTime(520, t);
  nf.frequency.exponentialRampToValueAtTime(180, t + 0.45);
  nf.Q.value = 1.2;

  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.13, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);

  ns.connect(nf).connect(ng).connect(masterGain);
  ns.start(t);
}

/* ---- 调节种子：地形剧变电子变换音 ---- */
function playSeedShift(seed, ascending) {
  if (!audioReady) return;
  const t = actx.currentTime;

  /* 用种子映射到一个半音阶音高 */
  const semi = (seed * 7) % 24;
  const baseFreq = 174.61 * Math.pow(2, semi / 12);

  const f0 = ascending ? baseFreq * 0.55 : baseFreq * 1.45;
  const f1 = ascending ? baseFreq * 1.45 : baseFreq * 0.55;

  /* 主体扫描音 */
  const osc1 = actx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(f0, t);
  osc1.frequency.exponentialRampToValueAtTime(f1, t + 0.26);

  /* 颤音调制 */
  const vib = actx.createOscillator();
  vib.type = 'sine';
  vib.frequency.value = 22;

  const vibG = actx.createGain();
  vibG.gain.value = f0 * 0.16;

  vib.connect(vibG).connect(osc1.frequency);
  vib.start(t);
  vib.stop(t + 0.4);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(340, t);
  lp.frequency.exponentialRampToValueAtTime(3200, t + 0.10);
  lp.frequency.exponentialRampToValueAtTime(560, t + 0.38);
  lp.Q.value = 9;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.115, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.40);

  osc1.connect(lp).connect(g).connect(masterGain);
  osc1.start(t);
  osc1.stop(t + 0.48);

  /* 高频颗粒层 */
  const osc2 = actx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(f1 * 2.2, t);
  osc2.frequency.exponentialRampToValueAtTime(f0 * 1.4, t + 0.22);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.045, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);

  osc2.connect(g2).connect(masterGain);
  osc2.start(t);
  osc2.stop(t + 0.30);
}

/* ---- 调节高度 / 粗糙度 / 层数：柔和电子滑音 ---- */
function playParamGlide(value, ascending, kind) {
  if (!audioReady) return;
  const t = actx.currentTime;

  let baseFreq;
  if (kind === 'height') {
    baseFreq = 180 + value * 130;
  } else if (kind === 'rough') {
    baseFreq = 240 + value * 700;
  } else {
    baseFreq = 200 + value * 90;
  }

  const f0 = ascending ? baseFreq * 0.78 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.78;

  const osc = actx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + 0.14);

  const osc2 = actx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(f0 * 1.5, t);
  osc2.frequency.exponentialRampToValueAtTime(f1 * 1.5, t + 0.14);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2400, t);
  lp.frequency.exponentialRampToValueAtTime(680, t + 0.28);
  lp.Q.value = 5.5;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.10, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.035, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);

  osc.connect(lp);
  osc2.connect(g2).connect(lp);
  lp.connect(g).connect(masterGain);

  osc.start(t); osc2.start(t);
  osc.stop(t + 0.36); osc2.stop(t + 0.24);
}

/* =========================================================
   9. 交互
   ========================================================= */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(-10, -10);

let isDragging = false;
let downPos = { x: 0, y: 0 };
let downTime = 0;
let dragDist = 0;

const el = renderer.domElement;

el.addEventListener('pointermove', (e) => {
  const rect = el.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (isDragging) {
    dragDist += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0);
  }
});

el.addEventListener('pointerleave', () => {
  pointerNDC.set(-10, -10);
  state.hoverTarget = 0;
  clearReadout();
});

el.addEventListener('pointerdown', (e) => {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  isDragging = true;
  downPos.x = e.clientX;
  downPos.y = e.clientY;
  downTime = performance.now();
  dragDist = 0;
});

el.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const elapsed = performance.now() - downTime;
  isDragging = false;

  if (moved < 7 && elapsed < 600) {
    initAudio();

    const rect = el.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(terrain, false);

    if (hits.length > 0) {
      playRockFall();
    }
  }
});

el.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---- 悬停拾取 ---- */
let hoverTick = 0;

function updateHover() {
  if (isDragging) {
    state.hoverTarget = 0;
    return;
  }

  hoverTick++;
  if (hoverTick % 3 !== 0) return;

  if (pointerNDC.x < -5) {
    state.hoverTarget = 0;
    return;
  }

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(terrain, false);

  if (hits.length === 0) {
    state.hoverTarget = 0;
    clearReadout();
    return;
  }

  const hit = hits[0];
  state.hoverTarget = 1;
  state.hoverPos.copy(hit.point);

  const hNorm = Math.max(0, Math.min(1, hit.point.y / Math.max(peakHeight, 0.001)));

  roX.textContent = hit.point.x.toFixed(3);
  roZ.textContent = hit.point.z.toFixed(3);
  roH.textContent = hit.point.y.toFixed(3);
  roBiome.textContent = classifyBiome(hNorm);
}

/* =========================================================
   10. UI 绑定
   ========================================================= */
const sliderSeed   = document.getElementById('sliderSeed');
const sliderRough  = document.getElementById('sliderRough');
const sliderHeight = document.getElementById('sliderHeight');
const sliderOct    = document.getElementById('sliderOct');

const valSeed   = document.getElementById('valSeed');
const valRough  = document.getElementById('valRough');
const valHeight = document.getElementById('valHeight');
const valOct    = document.getElementById('valOct');

let lastSeed = state.seed;
let lastRough = state.roughness;
let lastHeight = state.heightScale;
let lastOct = state.octaves;

/* ---- 节流重建 ---- */
let regenPending = false;
let applyPending = false;

function requestRegenerate() {
  if (regenPending) return;
  regenPending = true;
  requestAnimationFrame(() => {
    regenPending = false;
    generateHeightField();
    applyHeightField();
  });
}

function requestApply() {
  if (applyPending) return;
  applyPending = true;
  requestAnimationFrame(() => {
    applyPending = false;
    applyHeightField();
  });
}

sliderSeed.addEventListener('input', () => {
  initAudio();
  const v = parseInt(sliderSeed.value, 10);
  if (v !== lastSeed) {
    playSeedShift(v, v > lastSeed);
    lastSeed = v;
  }
  state.seed = v;
  valSeed.textContent = String(v);
  requestRegenerate();
});

sliderRough.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderRough.value);
  if (v !== lastRough) {
    playParamGlide(v, v > lastRough, 'rough');
    lastRough = v;
  }
  state.roughness = v;
  valRough.textContent = v.toFixed(2);
  requestRegenerate();
});

sliderHeight.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderHeight.value);
  if (v !== lastHeight) {
    playParamGlide(v, v > lastHeight, 'height');
    lastHeight = v;
  }
  state.heightScale = v;
  valHeight.textContent = v.toFixed(2);
  requestApply();
});

sliderOct.addEventListener('input', () => {
  initAudio();
  const v = parseInt(sliderOct.value, 10);
  if (v !== lastOct) {
    playParamGlide(v, v > lastOct, 'oct');
    lastOct = v;
  }
  state.octaves = v;
  valOct.textContent = String(v);
  requestRegenerate();
});

/* =========================================================
   11. 尺寸自适应
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* =========================================================
   12. 首次构建
   ========================================================= */
generateHeightField();
applyHeightField();

/* =========================================================
   13. 主循环
   ========================================================= */
let lastT = performance.now();
const prevCamPos = new THREE.Vector3().copy(camera.position);

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;

  controls.update();

  /* ---- 相机速度 → 风声 ---- */
  const camDelta = camera.position.distanceTo(prevCamPos);
  const camSpeed = camDelta / Math.max(dt, 0.001);
  prevCamPos.copy(camera.position);

  updateWind(camSpeed);

  /* ---- 悬停缓动 ---- */
  state.hoverStrength +=
    (state.hoverTarget - state.hoverStrength) * Math.min(1, dt * 10);

  /* ---- 悬停拾取 ---- */
  updateHover();

  /* ---- 地形材质轻微呼吸感（高处更亮） ---- */
  const pulse = 1.0 + 0.02 * Math.sin(now * 0.0009);
  terrainMat.emissive = terrainMat.emissive || new THREE.Color(0x000000);
  terrainMat.emissiveIntensity = 0;

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

/* =========================================================
   14. 首次手势解锁音频
   ========================================================= */
['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, () => {
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
  }, { once: true });
});

</script>
