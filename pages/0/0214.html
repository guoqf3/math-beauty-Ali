<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面调和节点线 · 经纬网络交响</title>
    <style>
        :root {
            --bg: #020408;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 42px rgba(200, 180, 150, 0.5), 0 0 72px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 0.9vw, 0.66rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }
        #formula-overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(2, 4, 8, 0.7);
            padding: 11px 23px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.42rem, 0.78vw, 0.62rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.27);
            line-height: 1.55;
            white-space: nowrap;
        }
        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }
        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 12px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.36rem;
                white-space: normal;
                line-height: 1.35;
            }
            #title-overlay .title {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">球面调和节点线 · 经纬网络交响</div>
        <div class="subtitle">SPHERICAL HARMONIC NODAL LINES &nbsp;·&nbsp; Yₗᵐ ZERO SETS</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">Y₆¹:</span> cos(φ)=0 ∪ P₆¹(cosθ)=0 &nbsp;
            <span class="c2">Y₈²:</span> cos(2φ)=0 ∪ P₈²(cosθ)=0
            <br>
            <span class="c3">Y₇³:</span> cos(3φ)=0 ∪ P₇³(cosθ)=0 &nbsp;|&nbsp; R=2.6 &nbsp;球面半径
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#020408');
        scene.fog = new THREE.Fog('#020408', 7, 18);

        const camera = new THREE.PerspectiveCamera(
            48,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.25,
            24
        );
        camera.position.set(1.2, 0.55, 6.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色定义 ====================
        const C1 = '#d4885c'; // 暖金 – Y_6^1
        const C2 = '#5d9ec6'; // 冰蓝 – Y_8^2
        const C3 = '#c77d9f'; // 玫瑰粉 – Y_7^3
        const C_FRAME = '#3a4a5c';
        const C_GLINT = '#8898aa';
        const C_DOT1 = '#e8b888';
        const C_DOT2 = '#88b8d8';
        const C_DOT3 = '#d8a0b8';

        const SPHERE_R = 2.6;
        const NUM_CIRCLE_SAMPLES = 220;

        // ==================== 勒让德多项式计算 ====================
        function legendreP(l, x) {
            if (l === 0) return 1;
            if (l === 1) return x;
            let p0 = 1;
            let p1 = x;
            for (let n = 2; n <= l; n++) {
                const p2 = ((2 * n - 1) * x * p1 - (n - 1) * p0) / n;
                p0 = p1;
                p1 = p2;
            }
            return p1;
        }

        function legendreDerivative(l, x) {
            const eps = 1e-7;
            if (Math.abs(x) > 0.9999) {
                const h = 0.0005;
                const fp = legendreP(l, Math.min(0.999, x + h));
                const fm = legendreP(l, Math.max(-0.999, x - h));
                return (fp - fm) / (2 * h);
            }
            const h = eps;
            const fp = legendreP(l, x + h);
            const fm = legendreP(l, x - h);
            return (fp - fm) / (2 * h);
        }

        function legendreDerivativeM(l, m, x) {
            if (m === 0) return legendreP(l, x);
            const eps = 1e-6;
            if (m === 1) {
                if (Math.abs(x) > 0.9995) {
                    const h = 0.0008;
                    const fp = legendreP(l, Math.min(0.999, x + h));
                    const fm = legendreP(l, Math.max(-0.999, x - h));
                    return (fp - fm) / (2 * h);
                }
                const h = eps;
                const fp = legendreP(l, x + h);
                const fm = legendreP(l, x - h);
                return (fp - fm) / (2 * h);
            }
            if (m === 2) {
                const h = eps * 2;
                const fp = legendreP(l, x + h);
                const f0 = legendreP(l, x);
                const fm = legendreP(l, x - h);
                return (fp - 2 * f0 + fm) / (h * h);
            }
            if (m === 3) {
                const h = eps * 3;
                const f2 = legendreP(l, x + 2 * h);
                const f1 = legendreP(l, x + h);
                const fm1 = legendreP(l, x - h);
                const fm2 = legendreP(l, x - 2 * h);
                return (f2 - 2 * f1 + 2 * fm1 - fm2) / (2 * h * h * h);
            }
            return 0;
        }

        function associatedLegendre(l, m, x) {
            const deriv = legendreDerivativeM(l, m, x);
            const factor = Math.pow(1 - x * x, m / 2);
            const sign = (m % 2 === 0) ? 1 : -1;
            return sign * factor * deriv;
        }

        // ==================== 查找P_l^m的零点 ====================
        function findZeros(l, m, numInitialSamples = 3000) {
            const zeros = [];
            const xMin = -0.999;
            const xMax = 0.999;
            const dx = (xMax - xMin) / numInitialSamples;

            let prevX = xMin;
            let prevVal = associatedLegendre(l, m, prevX);

            for (let i = 1; i <= numInitialSamples; i++) {
                const x = xMin + i * dx;
                const val = associatedLegendre(l, m, x);
                if (prevVal * val < 0) {
                    let lo = prevX;
                    let hi = x;
                    let vLo = prevVal;
                    for (let bisect = 0; bisect < 35; bisect++) {
                        const mid = (lo + hi) / 2;
                        const vMid = associatedLegendre(l, m, mid);
                        if (vLo * vMid <= 0) {
                            hi = mid;
                        } else {
                            lo = mid;
                            vLo = vMid;
                        }
                    }
                    const root = (lo + hi) / 2;
                    if (zeros.length === 0 || Math.abs(root - zeros[zeros.length - 1]) > 0.003) {
                        zeros.push(root);
                    }
                }
                prevX = x;
                prevVal = val;
            }
            return zeros;
        }

        console.log('计算球面调和函数节点线零点...');
        const zeros61 = findZeros(6, 1);
        const zeros82 = findZeros(8, 2);
        const zeros73 = findZeros(7, 3);
        console.log('Y_6^1 纬线零点(cosθ):', zeros61.length, zeros61.map(z => z.toFixed(4)));
        console.log('Y_8^2 纬线零点(cosθ):', zeros82.length, zeros82.map(z => z.toFixed(4)));
        console.log('Y_7^3 纬线零点(cosθ):', zeros73.length, zeros73.map(z => z.toFixed(4)));

        // ==================== 绘制函数 ====================
        function createLatitudeCircle(cosTheta, colorHex, opacity) {
            const theta = Math.acos(cosTheta);
            const radius = SPHERE_R * Math.sin(theta);
            const z = SPHERE_R * cosTheta;
            const pts = [];
            for (let i = 0; i <= NUM_CIRCLE_SAMPLES; i++) {
                const phi = (i / NUM_CIRCLE_SAMPLES) * Math.PI * 2;
                pts.push(new THREE.Vector3(radius * Math.cos(phi), z, radius * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            return new THREE.Line(geom, mat);
        }

        function createGreatCircle(phiFixed, colorHex, opacity) {
            const pts = [];
            for (let i = 0; i <= NUM_CIRCLE_SAMPLES; i++) {
                const theta = (i / NUM_CIRCLE_SAMPLES) * Math.PI * 2;
                pts.push(new THREE.Vector3(
                    SPHERE_R * Math.sin(theta) * Math.cos(phiFixed),
                    SPHERE_R * Math.cos(theta),
                    SPHERE_R * Math.sin(theta) * Math.sin(phiFixed)
                ));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            return new THREE.Line(geom, mat);
        }

        function createNodalLineGroup(l, m, zeros, colorHex, opacity) {
            const group = new THREE.Group();
            // 纬线（P_l^m(cosθ)=0 的解）
            for (const cosTheta of zeros) {
                if (Math.abs(cosTheta) < 0.995) {
                    group.add(createLatitudeCircle(cosTheta, colorHex, opacity));
                }
            }
            // 经线（cos(mφ)=0 的解，m条大圆）
            for (let k = 0; k < m; k++) {
                const phi = (Math.PI / (2 * m)) + (k * Math.PI) / m;
                group.add(createGreatCircle(phi, colorHex, opacity * 0.85));
            }
            return group;
        }

        // 创建三组节点线
        console.log('生成节点线组...');
        const group61 = createNodalLineGroup(6, 1, zeros61, C1, 0.62);
        const group82 = createNodalLineGroup(8, 2, zeros82, C2, 0.6);
        const group73 = createNodalLineGroup(7, 3, zeros73, C3, 0.61);

        const mainGroup = new THREE.Group();
        mainGroup.add(group61);
        mainGroup.add(group82);
        mainGroup.add(group73);
        scene.add(mainGroup);

        // ==================== 节点线交点光点 ====================
        function createNodalDots(l, m, zeros, colorHex, opacity, dotSize) {
            const group = new THREE.Group();
            for (const cosTheta of zeros) {
                if (Math.abs(cosTheta) > 0.995) continue;
                const theta = Math.acos(cosTheta);
                const sinTheta = Math.sin(theta);
                const r = SPHERE_R * sinTheta;
                const z = SPHERE_R * cosTheta;
                for (let k = 0; k < 2 * m; k++) {
                    const phi = (Math.PI / (2 * m)) + (k * Math.PI) / m;
                    const x = r * Math.cos(phi);
                    const y = z;
                    const zz = r * Math.sin(phi);
                    const center = new THREE.Vector3(x, y, zz);
                    const sz = dotSize;
                    const pairs = [
                        [center.clone().add(new THREE.Vector3(-sz, 0, 0)), center.clone().add(new THREE.Vector3(sz,
                            0, 0))],
                        [center.clone().add(new THREE.Vector3(0, -sz, 0)), center.clone().add(new THREE.Vector3(0,
                            sz, 0))],
                        [center.clone().add(new THREE.Vector3(0, 0, -sz)), center.clone().add(new THREE.Vector3(0,
                            0, sz))],
                    ];
                    for (const [a, b] of pairs) {
                        const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                        const m2 = new THREE.LineBasicMaterial({
                            color: new THREE.Color(colorHex),
                            transparent: true,
                            opacity: opacity,
                            depthWrite: true,
                        });
                        group.add(new THREE.Line(g, m2));
                    }
                }
            }
            return group;
        }

        const dots61 = createNodalDots(6, 1, zeros61, C_DOT1, 0.65, 0.06);
        const dots82 = createNodalDots(8, 2, zeros82, C_DOT2, 0.6, 0.05);
        const dots73 = createNodalDots(7, 3, zeros73, C_DOT3, 0.62, 0.045);
        mainGroup.add(dots61);
        mainGroup.add(dots82);
        mainGroup.add(dots73);

        // ==================== 参考球面线框 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 180;
            const circleDefs = [
                (a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0),
                (a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius),
                (a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius),
            ];
            for (const gen of circleDefs) {
                const pts = [];
                for (let i = 0; i <= segs; i++) pts.push(gen((i / segs) * Math.PI * 2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(SPHERE_R, C_FRAME, 0.2);
        scene.add(sphereRef);

        // ==================== 原点光点 ====================
        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.1;
            const pairs = [
                [new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0)],
                [new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0)],
                [new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)],
            ];
            for (const [a, b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                const m2 = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true,
                    opacity: 0.7,
                    depthWrite: true,
                });
                group.add(new THREE.Line(g, m2));
            }
            return group;
        }
        scene.add(createOriginGlint());

        // ==================== 动画循环（绝对时间） ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s`);
                logTime = now;
            }

            // 主球体绕对角线旋转
            mainGroup.rotation.y = time * 0.28;
            mainGroup.rotation.x = time * 0.15 + Math.sin(time * 0.25) * 0.22;
            mainGroup.rotation.z = Math.cos(time * 0.2) * 0.16;

            // 参考球面同步旋转
            sphereRef.rotation.copy(mainGroup.rotation);

            // 相机轻柔游走
            const camX = 1.2 + Math.sin(time * 0.14) * 0.55;
            const camY = 0.55 + Math.cos(time * 0.18) * 0.5;
            const camZ = 6.8 + Math.sin(time * 0.11) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        // ==================== 启动 ====================
        const totalMeridians = 1 + 2 + 3;
        const totalParallels = zeros61.length + zeros82.length + zeros73.length;
        console.log('=== 球面调和节点线 · 经纬网络交响 ===');
        console.log('Y_6^1: 经线(大圆)=1, 纬线=', zeros61.length);
        console.log('Y_8^2: 经线(大圆)=2, 纬线=', zeros82.length);
        console.log('Y_7^3: 经线(大圆)=3, 纬线=', zeros73.length);
        console.log('总经线:', totalMeridians, '总纬线:', totalParallels);
        console.log('总圆数:', totalMeridians + totalParallels);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
