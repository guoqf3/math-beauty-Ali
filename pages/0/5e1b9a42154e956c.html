<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>反重力悬浮光环 · Three.js</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 50% 42%, #140b28 0%, #0a0518 46%, #020106 100%);
    color: #e4d9ff;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #container { position: fixed; inset: 0; }
  canvas { display: block; }

  #glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(circle at 50% 45%, transparent 34%, rgba(4,0,12,0.70) 100%);
  }

  .panel {
    position: fixed; z-index: 10;
    background: rgba(22, 12, 42, 0.55);
    border: 1px solid rgba(170, 130, 255, 0.22);
    border-radius: 16px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 12px 48px rgba(120, 60, 220, 0.28),
                inset 0 1px 0 rgba(220, 200, 255, 0.10);
    padding: 16px 20px;
  }

  /* ---- 信息 ---- */
  .info { top: 22px; left: 22px; max-width: 316px; }
  .info h1 {
    font-size: 16.5px; font-weight: 600; letter-spacing: 1.8px;
    background: linear-gradient(92deg, #b28cff, #7fd8ff 46%, #ffa8e8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 9px;
  }
  .formula {
    font-family: "Cambria Math", "Times New Roman", Georgia, serif;
    font-size: 14px; font-style: italic; color: #b49cff;
    letter-spacing: 0.3px; margin-bottom: 9px; line-height: 1.65;
    text-shadow: 0 0 22px rgba(150, 100, 255, 0.62);
  }
  .hint {
    font-size: 11.5px; color: rgba(200, 180, 245, 0.5);
    line-height: 1.75; letter-spacing: 0.2px;
  }
  .hint b { color: rgba(220, 205, 255, 0.9); font-weight: 500; }

  /* ---- 控制 ---- */
  .controls {
    bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 12px;
    padding: 17px 24px; min-width: 460px;
  }
  .row { display: flex; align-items: center; gap: 13px; }
  .row .lbl {
    font-size: 12px; width: 88px; flex-shrink: 0;
    color: rgba(205, 185, 250, 0.78); letter-spacing: 0.6px;
  }
  .row .val {
    font-size: 12px; width: 70px; text-align: right; flex-shrink: 0;
    font-variant-numeric: tabular-nums; font-weight: 600;
    color: #b28cff;
    text-shadow: 0 0 14px rgba(170, 120, 255, 0.85);
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px; border-radius: 4px; outline: none; cursor: pointer;
    background: linear-gradient(90deg, #2a1450 0%, #8a5cff 58%, #7fd8ff 100%);
    box-shadow: 0 0 14px rgba(140, 90, 255, 0.42);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #f2ecff; cursor: pointer; border: none;
    box-shadow: 0 0 10px #b28cff, 0 0 24px rgba(178, 140, 255, 0.9);
    transition: transform 0.14s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.26); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border: none; border-radius: 50%;
    background: #f2ecff; cursor: pointer;
    box-shadow: 0 0 10px #b28cff, 0 0 24px rgba(178, 140, 255, 0.9);
  }
  input[type=range]::-moz-range-track {
    height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, #2a1450 0%, #8a5cff 58%, #7fd8ff 100%);
  }

  .halo-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 50% 50%, transparent 28%, #b28cff 42%, #7fd8ff 62%, transparent 76%);
    box-shadow: 0 0 12px #b28cff, 0 0 24px rgba(178, 140, 255, 0.6);
    transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
  }

  @media (max-width: 760px) {
    .controls { min-width: 0; width: calc(100% - 24px); padding: 13px 14px; gap: 9px; }
    .row .lbl { width: 66px; font-size: 10.5px; }
    .row .val { width: 58px; font-size: 10.5px; }
    .info { max-width: 224px; padding: 12px 14px; top: 14px; left: 14px; }
    .info h1 { font-size: 14px; }
    .formula { font-size: 11.5px; }
    .hint { font-size: 10px; }
  }
</style>
</head>
<body>

<div id="container"></div>
<div id="glow"></div>

<div class="panel info">
  <h1>反重力悬浮光环</h1>
  <p class="formula">
    (√(x²+z²) − R<sub>i</sub>)² + y² = ρ²<br>
    R<sub>i</sub> = R₀ + i · ΔR
  </p>
  <p class="hint">
    多层同心环面叠加，缓慢脉动悬浮<br>
    <b>拖拽</b> 旋转 · <b>滚轮</b> 缩放 · <b>点击光环</b> 铃响
  </p>
</div>

<div class="panel controls">
  <div class="row">
    <div class="halo-dot" id="haloDot"></div>
    <label class="lbl">光环层数</label>
    <input type="range" id="nSlider" min="1" max="10" step="1" value="6" />
    <span class="val" id="nVal">6 层</span>
  </div>
  <div class="row">
    <label class="lbl">半径间距</label>
    <input type="range" id="sSlider" min="0.12" max="0.70" step="0.005" value="0.34" />
    <span class="val" id="sVal">0.340</span>
  </div>
  <div class="row">
    <label class="lbl">脉动幅度</label>
    <input type="range" id="pSlider" min="0" max="1" step="0.01" value="0.55" />
    <span class="val" id="pVal">0.55</span>
  </div>
  <div class="row">
    <label class="lbl">音量</label>
    <input type="range" id="volSlider" min="0" max="100" step="1" value="55" />
    <span class="val" id="volVal">55%</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   1. 场景 / 相机 / 渲染器
   ================================================================ */
const container = document.getElementById('container');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080418, 0.020);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.05, 300
);
camera.position.set(3.2, 2.6, 6.2);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.062;
controls.enablePan = false;
controls.minDistance = 1.2;
controls.maxDistance = 40;
controls.target.set(0, 0, 0);
controls.autoRotate = false;

/* ================================================================
   2. 灯光
   ================================================================ */
scene.add(new THREE.AmbientLight(0x3a2a5a, 1.5));

const keyLight = new THREE.DirectionalLight(0xd8c8ff, 2.0);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x6a8cff, 1.6);
fillLight.position.set(-6, -3, -5);
scene.add(fillLight);

const coreLight = new THREE.PointLight(0xb28cff, 8, 12, 2);
coreLight.position.set(0, 0, 0);
scene.add(coreLight);

const topLight = new THREE.PointLight(0x7fd8ff, 6, 14, 2);
topLight.position.set(0, 3.5, 0);
scene.add(topLight);

const bottomLight = new THREE.PointLight(0xff8ce0, 5, 14, 2);
bottomLight.position.set(0, -3.2, 0);
scene.add(bottomLight);

/* ================================================================
   3. 光环几何体与材质
   ================================================================ */
const ringGroup = new THREE.Group();
scene.add(ringGroup);

let ringObjects = [];
let ringMeshes = [];

const BASE_RADIUS = 1.10;
const TUBE_RADIUS = 0.038;

/* ---- 环面着色器：菲涅尔边缘光 + 沿环流光 ---- */
const RING_VERT = `
varying vec3 vNormal;
varying vec3 vViewDir;
varying vec2 vUv;

void main() {
  vNormal  = normalize(normalMatrix * normal);
  vec4 mv  = modelViewMatrix * vec4(position, 1.0);
  vViewDir = normalize(-mv.xyz);
  vUv      = uv;
  gl_Position = projectionMatrix * mv;
}`;

const RING_FRAG = `
precision highp float;

uniform vec3  uColorA;
uniform vec3  uColorB;
uniform float uTime;
uniform float uPulse;

varying vec3 vNormal;
varying vec3 vViewDir;
varying vec2 vUv;

void main() {
  vec3 n = normalize(vNormal);
  vec3 V = normalize(vViewDir);

  /* 菲涅尔：轮廓亮、正面透 */
  float fres = pow(1.0 - abs(dot(n, V)), 2.3);

  vec3 col = mix(uColorA, uColorB, fres);

  /* 沿环流动的能量带 */
  float flow = sin(vUv.x * 42.0 - uTime * 3.2) * 0.5 + 0.5;
  flow = pow(flow, 6.0);

  float flow2 = sin(vUv.x * 18.0 + uTime * 2.0 + 1.4) * 0.5 + 0.5;
  flow2 = pow(flow2, 10.0);

  col += uColorB * flow  * 0.90;
  col += uColorA * flow2 * 0.55;

  /* 脉动增强 */
  col *= (1.0 + uPulse * 0.75);

  float alpha = 0.30 + 0.70 * fres + 0.28 * flow;
  alpha *= (0.70 + 0.30 * uPulse);

  gl_FragColor = vec4(col, alpha);
}`;

function makeRingMaterial(hue) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColorA: { value: new THREE.Color().setHSL(hue, 0.90, 0.55) },
      uColorB: { value: new THREE.Color().setHSL(hue + 0.10, 0.95, 0.78) },
      uTime:   { value: 0 },
      uPulse:  { value: 0 },
    },
    vertexShader: RING_VERT,
    fragmentShader: RING_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
  });
  return mat;
}

/* ---- 粒子环 ---- */
const PARTICLE_VERT = `
attribute float aSize;
attribute float aRandom;

uniform float uPixelRatio;
uniform float uSize;

varying float vAlpha;
varying float vRandom;

void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float dist = -mv.z;

  gl_PointSize = uSize * aSize * uPixelRatio * (320.0 / max(dist, 1.0));
  gl_PointSize = clamp(gl_PointSize, 0.5, 22.0);

  vAlpha  = 0.35 + 0.65 * aRandom;
  vRandom = aRandom;

  gl_Position = projectionMatrix * mv;
}`;

const PARTICLE_FRAG = `
precision highp float;

uniform vec3  uColor;
uniform float uTime;

varying float vAlpha;
varying float vRandom;

void main() {
  vec2 c = gl_PointCoord - 0.5;
  float d = length(c);
  if (d > 0.5) discard;

  float a = smoothstep(0.5, 0.0, d);
  a = pow(a, 1.8);

  float flick = 0.65 + 0.35 * sin(uTime * 2.4 + vRandom * 28.0);

  gl_FragColor = vec4(uColor * flick, a * vAlpha * 0.85);
}`;

function makeParticleMaterial(hue) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor:      { value: new THREE.Color().setHSL(hue, 0.95, 0.72) },
      uTime:       { value: 0 },
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
      uSize:       { value: 0.85 },
    },
    vertexShader: PARTICLE_VERT,
    fragmentShader: PARTICLE_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
}

function buildRingParticles(R, count, tubeR) {
  const positions = new Float32Array(count * 3);
  const sizes     = new Float32Array(count);
  const randoms   = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radOff = (Math.random() - 0.5) * tubeR * 11;
    const axial  = (Math.random() - 0.5) * tubeR * 7;

    const rad = R + radOff;
    positions[i * 3]     = Math.cos(angle) * rad;
    positions[i * 3 + 1] = Math.sin(angle) * rad;
    positions[i * 3 + 2] = axial;

    sizes[i]   = 0.45 + Math.random() * 1.55;
    randoms[i] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aRandom',  new THREE.BufferAttribute(randoms, 1));
  return geo;
}

/* ================================================================
   4. 构建光环阵列
   ================================================================ */
let currentN = 6;
let currentSpacing = 0.34;
let currentPulse = 0.55;
let maxRadius = 1.0;

function disposeRings() {
  for (const r of ringObjects) {
    ringGroup.remove(r.pivot);
    r.mesh.geometry.dispose();
    r.mesh.material.dispose();
    if (r.points) {
      r.points.geometry.dispose();
      r.points.material.dispose();
    }
  }
  ringObjects = [];
  ringMeshes = [];
}

function buildRings(N, spacing) {
  disposeRings();

  const GOLDEN = 2.399963229728653;

  for (let i = 0; i < N; i++) {
    const t = N > 1 ? i / (N - 1) : 0;

    const R = BASE_RADIUS + i * spacing;
    const tubeR = TUBE_RADIUS * (1 - t * 0.28);

    /* ---- pivot：负责倾斜与摆动 ---- */
    const pivot = new THREE.Group();

    /* 基础倾斜：水平 → 逐渐立起 */
    const tiltBase = Math.PI * 0.5 * (1 - t * 0.42);
    pivot.rotation.x = tiltBase;
    pivot.rotation.y = i * GOLDEN;

    /* ---- 环面网格 ---- */
    const torusGeo = new THREE.TorusGeometry(
      R, tubeR,
      14, Math.max(72, Math.round(120 - t * 24))
    );
    /* 色相：青 → 紫 → 品红 */
    const hue = 0.52 + t * 0.30;
    const mat = makeRingMaterial(hue);

    const mesh = new THREE.Mesh(torusGeo, mat);
    pivot.add(mesh);

    /* ---- 粒子环 ---- */
    const pCount = Math.round(220 + R * 60);
    const pGeo = buildRingParticles(R, pCount, tubeR);
    const pMat = makeParticleMaterial(hue);
    const points = new THREE.Points(pGeo, pMat);
    pivot.add(points);

    ringGroup.add(pivot);

    ringObjects.push({
      pivot,
      mesh,
      points,
      tiltBase,
      phase: i * 0.82,
      t,
      R,
    });

    ringMeshes.push(mesh);
  }

  maxRadius = BASE_RADIUS + Math.max(N - 1, 0) * spacing;
  fitCamera();
}

/* ================================================================
   5. 相机自适应
   ================================================================ */
let targetDist = null;

function fitCamera() {
  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const halfDiag = Math.hypot(maxRadius * 1.25, maxRadius * 0.95);
  const d = halfDiag / Math.sin(Math.min(vFov, hFov) / 2) * 1.06 + 0.6;
  targetDist = Math.max(d, 2.4);
}

/* ================================================================
   6. 音频引擎
   ================================================================ */
let audioCtx = null;
let masterGain = null;
let padGain = null;
let padFilter = null;
let reverbSend = null;
let audioReady = false;
let currentVolume = 0.55;

function initAudio() {
  if (audioReady) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { audioCtx = new AC(); } catch (e) { return; }

  masterGain = audioCtx.createGain();
  masterGain.gain.value = currentVolume;

  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.knee.value = 22;
  comp.ratio.value = 6;
  comp.attack.value = 0.004;
  comp.release.value = 0.26;

  masterGain.connect(comp);
  comp.connect(audioCtx.destination);

  /* ============================================================
     混响总线（反馈延迟）
     ============================================================ */
  const delay1 = audioCtx.createDelay(1.2);
  delay1.delayTime.value = 0.19;
  const delay2 = audioCtx.createDelay(1.2);
  delay2.delayTime.value = 0.31;

  const fb1 = audioCtx.createGain();
  fb1.gain.value = 0.42;
  const fb2 = audioCtx.createGain();
  fb2.gain.value = 0.34;

  const damp = audioCtx.createBiquadFilter();
  damp.type = 'lowpass';
  damp.frequency.value = 3200;

  const wet = audioCtx.createGain();
  wet.gain.value = 0.38;

  delay1.connect(damp);
  damp.connect(fb1);
  fb1.connect(delay2);
  delay2.connect(damp);
  damp.connect(fb2);
  fb2.connect(delay1);
  delay1.connect(wet);
  delay2.connect(wet);
  wet.connect(masterGain);

  reverbSend = delay1;

  /* ============================================================
     空灵环绕音垫（Pad）
     ============================================================ */
  padGain = audioCtx.createGain();
  padGain.gain.value = 0.030;

  padFilter = audioCtx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 1250;
  padFilter.Q.value = 0.72;

  /* 缓慢的滤波器扫频 LFO */
  const lfoFilter = audioCtx.createOscillator();
  lfoFilter.type = 'sine';
  lfoFilter.frequency.value = 0.065;
  const lfoFilterGain = audioCtx.createGain();
  lfoFilterGain.gain.value = 480;
  lfoFilter.connect(lfoFilterGain);
  lfoFilterGain.connect(padFilter.frequency);
  lfoFilter.start();

  /* 音量起伏 LFO */
  const lfoVol = audioCtx.createOscillator();
  lfoVol.type = 'sine';
  lfoVol.frequency.value = 0.10;
  const lfoVolGain = audioCtx.createGain();
  lfoVolGain.gain.value = 0.013;
  lfoVol.connect(lfoVolGain);
  lfoVolGain.connect(padGain.gain);
  lfoVol.start();

  /* 立体声环绕（缓慢左右摆动） */
  const panner = audioCtx.createStereoPanner();
  const panLfo = audioCtx.createOscillator();
  panLfo.type = 'sine';
  panLfo.frequency.value = 0.075;
  const panLfoGain = audioCtx.createGain();
  panLfoGain.gain.value = 0.68;
  panLfo.connect(panLfoGain);
  panLfoGain.connect(panner.pan);
  panLfo.start();

  /* 谐波堆叠：A2 E3 A3 C4 E4 A4 C5 */
  const padFreqs = [110.0, 164.81, 220.0, 261.63, 329.63, 440.0, 523.25];
  padFreqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
    osc.frequency.value = f;
    osc.detune.value = (Math.random() - 0.5) * 7;

    const g = audioCtx.createGain();
    g.gain.value = 0.16 / (1 + i * 0.42);

    osc.connect(g);
    g.connect(padFilter);
    osc.start();

    /* 每个声部独立的极慢颤音 */
    const vib = audioCtx.createOscillator();
    vib.type = 'sine';
    vib.frequency.value = 0.04 + Math.random() * 0.09;
    const vibG = audioCtx.createGain();
    vibG.gain.value = 0.055 / (1 + i * 0.4);
    vib.connect(vibG);
    vibG.connect(g.gain);
    vib.start();
  });

  padFilter.connect(panner);
  panner.connect(padGain);
  padGain.connect(masterGain);

  /* Pad 也送一点进混响 */
  const padSend = audioCtx.createGain();
  padSend.gain.value = 0.30;
  panner.connect(padSend);
  padSend.connect(reverbSend);

  audioReady = true;
}

/* ---- ① 点击光环：铃铛轻响 ---- */
function playBell() {
  if (!audioReady) return;
  const t = audioCtx.currentTime;

  const base = 880 + Math.random() * 520;

  const partials = [
    { r: 1.000, g: 1.00, d: 2.40 },
    { r: 2.012, g: 0.44, d: 1.75 },
    { r: 3.014, g: 0.26, d: 1.15 },
    { r: 4.182, g: 0.13, d: 0.78 },
    { r: 5.436, g: 0.07, d: 0.52 },
    { r: 7.128, g: 0.035, d: 0.36 },
  ];

  partials.forEach((p, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(base * p.r, t);
    osc.frequency.exponentialRampToValueAtTime(base * p.r * 0.9955, t + p.d);

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.0001 + 0.085 * p.g, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + p.d);

    osc.connect(g);
    g.connect(masterGain);
    g.connect(reverbSend);

    osc.start(t);
    osc.stop(t + p.d + 0.08);
  });

  /* 敲击瞬态 */
  const nLen = Math.floor(audioCtx.sampleRate * 0.028);
  const nBuf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const nd = nBuf.getChannelData(0);
  for (let i = 0; i < nLen; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nLen, 2.8);
  }
  const nSrc = audioCtx.createBufferSource();
  nSrc.buffer = nBuf;

  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 3600;

  const nG = audioCtx.createGain();
  nG.gain.setValueAtTime(0.075, t);
  nG.gain.exponentialRampToValueAtTime(0.0001, t + 0.028);

  nSrc.connect(hp);
  hp.connect(nG);
  nG.connect(masterGain);
  nSrc.start(t);
}

/* ---- ② 调节层数：电子音阶（层数越多音高越高） ---- */
const PENTA = [0, 2, 4, 7, 9];
let lastNoteIdx = -1;
let lastNoteTime = 0;

function playLayerScale(N) {
  if (!audioReady) return;
  const now = performance.now();
  if (now - lastNoteTime < 85) return;
  lastNoteTime = now;

  const norm = Math.min(Math.max((N - 1) / 9, 0), 1);
  const step = Math.round(norm * 14);
  if (step === lastNoteIdx) return;
  lastNoteIdx = step;

  const octave = Math.floor(step / 5);
  const idx = step % 5;
  const semitone = octave * 12 + PENTA[idx];
  const freq = 261.63 * Math.pow(2, semitone / 12);   // 基于 C4

  const t = audioCtx.currentTime;

  /* 主音：正弦，纯净空灵 */
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(freq * 1.003, t + 0.30);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.075, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);

  osc.connect(g);
  g.connect(masterGain);
  g.connect(reverbSend);

  osc.start(t);
  osc.stop(t + 0.46);

  /* 泛音叠层：五度上方，音量更轻 */
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(freq * 1.4983, t);

  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.030, t + 0.010);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);

  osc2.connect(g2);
  g2.connect(masterGain);

  osc2.start(t);
  osc2.stop(t + 0.34);

  /* 极轻的高八度闪光 */
  const osc3 = audioCtx.createOscillator();
  osc3.type = 'sine';
  osc3.frequency.setValueAtTime(freq * 2, t);

  const g3 = audioCtx.createGain();
  g3.gain.setValueAtTime(0.0001, t);
  g3.gain.exponentialRampToValueAtTime(0.018, t + 0.006);
  g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);

  osc3.connect(g3);
  g3.connect(reverbSend);
  g3.connect(masterGain);

  osc3.start(t);
  osc3.stop(t + 0.24);
}

/* ================================================================
   7. UI 绑定
   ================================================================ */
const nSlider   = document.getElementById('nSlider');
const sSlider   = document.getElementById('sSlider');
const pSlider   = document.getElementById('pSlider');
const volSlider = document.getElementById('volSlider');
const nVal      = document.getElementById('nVal');
const sVal      = document.getElementById('sVal');
const pVal      = document.getElementById('pVal');
const volVal    = document.getElementById('volVal');
const haloDot   = document.getElementById('haloDot');

let dotTimer = null;
function flashDot() {
  haloDot.style.transform = 'scale(2.4)';
  haloDot.style.boxShadow = '0 0 22px #d8c0ff, 0 0 46px rgba(216,192,255,0.95)';
  clearTimeout(dotTimer);
  dotTimer = setTimeout(() => {
    haloDot.style.transform = 'scale(1)';
    haloDot.style.boxShadow = '0 0 12px #b28cff, 0 0 24px rgba(178,140,255,0.6)';
  }, 130);
}

nSlider.addEventListener('input', (e) => {
  initAudio();
  currentN = parseInt(e.target.value, 10);
  nVal.textContent = currentN + ' 层';
  playLayerScale(currentN);
  buildRings(currentN, currentSpacing);
  flashDot();
});

sSlider.addEventListener('input', (e) => {
  initAudio();
  currentSpacing = parseFloat(e.target.value);
  sVal.textContent = currentSpacing.toFixed(3);
  buildRings(currentN, currentSpacing);
});

pSlider.addEventListener('input', (e) => {
  initAudio();
  currentPulse = parseFloat(e.target.value);
  pVal.textContent = currentPulse.toFixed(2);
});

volSlider.addEventListener('input', (e) => {
  initAudio();
  currentVolume = parseInt(e.target.value, 10) / 100;
  volVal.textContent = e.target.value + '%';
  if (masterGain) {
    masterGain.gain.setTargetAtTime(currentVolume, audioCtx.currentTime, 0.02);
  }
});

/* ================================================================
   8. 鼠标交互
   ================================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

let pointerDownPos = null;
let isDragging = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  initAudio();
  pointerDownPos = { x: e.clientX, y: e.clientY };
  isDragging = true;
  targetDist = null;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownPos) { isDragging = false; return; }
  const moved = Math.hypot(
    e.clientX - pointerDownPos.x,
    e.clientY - pointerDownPos.y
  );
  pointerDownPos = null;
  isDragging = false;

  if (moved > 9) return;   // 拖拽，不算点击

  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);

  const hits = raycaster.intersectObjects(ringMeshes, false);
  if (hits.length > 0) {
    playBell();
    flashDot();
    clickFlash = 1.0;
  }
});

renderer.domElement.addEventListener('pointercancel', () => {
  pointerDownPos = null;
  isDragging = false;
});

renderer.domElement.addEventListener('wheel', () => {
  targetDist = null;
}, { passive: true });

/* ================================================================
   9. 渲染循环
   ================================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
let clickFlash = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* ---- 阵列整体缓慢自转 ---- */
  if (!isDragging) {
    ringGroup.rotation.y += dt * 0.10;
  }

  /* ---- 逐环动画 ---- */
  for (let i = 0; i < ringObjects.length; i++) {
    const r = ringObjects[i];
    const ph = elapsed * 0.92 + r.phase;

    /* 倾斜缓慢摆动 —— 悬浮进动感 */
    r.pivot.rotation.x =
      r.tiltBase + Math.sin(ph * 0.72) * 0.13 * currentPulse;

    /* 上下浮动 */
    r.pivot.position.y = Math.sin(ph) * 0.20 * currentPulse;

    /* 径向脉动 */
    const s = 1 + Math.sin(ph * 1.35) * 0.065 * currentPulse;
    r.pivot.scale.setScalar(s);

    /* 材质更新 */
    const pulseVal = Math.sin(ph) * 0.5 + 0.5;
    r.mesh.material.uniforms.uTime.value  = elapsed;
    r.mesh.material.uniforms.uPulse.value = pulseVal + clickFlash * 0.8;

    r.points.material.uniforms.uTime.value = elapsed;
    r.points.material.uniforms.uSize.value =
      0.85 * (1 + pulseVal * 0.35);
  }

  /* ---- 点击闪光衰减 ---- */
  clickFlash = Math.max(0, clickFlash - dt * 3.2);

  /* ---- 灯光呼吸 ---- */
  const breathe = 0.5 + 0.5 * Math.sin(elapsed * 1.1);
  coreLight.intensity   = 6.5 + breathe * 3.5 + clickFlash * 14;
  topLight.intensity    = 5.0 + Math.sin(elapsed * 1.1 + 1.0) * 2.0;
  bottomLight.intensity = 4.0 + Math.sin(elapsed * 1.1 + 2.0) * 1.8;

  /* ---- 相机自适应 ---- */
  if (targetDist !== null) {
    const cur = camera.position.distanceTo(controls.target);
    const nd = cur + (targetDist - cur) * Math.min(dt * 3.5, 1);
    const dir = camera.position.clone().sub(controls.target).normalize();
    if (dir.lengthSq() > 1e-6) {
      camera.position.copy(controls.target).addScaledVector(dir, nd);
    }
    if (Math.abs(nd - targetDist) < 0.02) targetDist = null;
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ================================================================
   10. 自适应 & 启动
   ================================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  for (const r of ringObjects) {
    r.points.material.uniforms.uPixelRatio.value =
      Math.min(window.devicePixelRatio, 2);
  }
  fitCamera();
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta();
});

/* ---- 初始化 ---- */
nVal.textContent = currentN + ' 层';
sVal.textContent = currentSpacing.toFixed(3);
pVal.textContent = currentPulse.toFixed(2);

buildRings(currentN, currentSpacing);

camera.position.set(3.2, 2.6, 6.2);
controls.target.set(0, 0, 0);
fitCamera();

animate();
</script>
