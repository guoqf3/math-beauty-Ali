<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>螺旋环面结 · Torus Knot</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04080c}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:#e2f0f4;-webkit-font-smoothing:antialiased;
  }
  canvas{display:block}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}

  .panel{
    position:absolute;
    background:rgba(8,18,26,.62);
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(80,220,220,.18);
    border-radius:18px;
    padding:16px 18px;
    pointer-events:auto;
    box-shadow:0 16px 48px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---- 标题 ---- */
  #info{top:22px;left:22px}
  #info h1{
    font-size:17px;letter-spacing:5px;font-weight:600;
    background:linear-gradient(92deg,#4fe6d8 0%,#6ec8ff 50%,#ffd166 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 32px rgba(80,220,220,.35);
  }
  #info .sub{
    margin-top:8px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;color:#6ec8ff;letter-spacing:1px;line-height:1.65;
  }
  #info .hint{
    margin-top:10px;font-size:10.5px;color:#557a88;letter-spacing:.6px;
  }

  /* ---- 控制面板 ---- */
  #controls{left:22px;bottom:22px;width:266px}
  /* ★ 修复：将 margin-bottom 从 15px 增加到 26px，避免滑块命中区域重叠 */
  .ctrl{margin-bottom:26px}
  .ctrl:last-child{margin-bottom:0}
  .ctrl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:#a8c8d4;margin-bottom:10px;letter-spacing:.8px;
  }
  .ctrl label span{
    color:#4fe6d8;font-family:ui-monospace,monospace;font-size:12px;
    text-shadow:0 0 12px rgba(80,230,216,.7);
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#4fe6d8,#6ec8ff,#ffd166);
    outline:none;cursor:pointer;
    box-shadow:0 0 12px rgba(80,220,220,.4);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#4fe6d8 58%,#1a8090);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(80,230,216,1);
    cursor:pointer;transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22)}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#4fe6d8 58%,#1a8090);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(80,230,216,1);
    cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    height:4px;border-radius:3px;
    background:linear-gradient(90deg,#4fe6d8,#6ec8ff,#ffd166);
  }

  /* ---- 读数 ---- */
  #readout{top:22px;right:22px;width:222px}
  #readout .ttl{
    font-size:10.5px;color:#557a88;letter-spacing:2px;
    margin-bottom:10px;text-transform:uppercase;
  }
  .ro-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;padding:5px 0;
    border-bottom:1px dashed rgba(80,220,220,.14);
  }
  .ro-row:last-child{border-bottom:none}
  .ro-row>span{color:#7fa0ad;letter-spacing:.6px}
  .ro-row>b{
    font-family:ui-monospace,monospace;font-weight:500;
    color:#a8ecff;font-size:12px;
  }
  .ro-row.hi>b{color:#ffd166;text-shadow:0 0 12px rgba(255,200,100,.75)}

  @media(max-width:720px){
    #info h1{font-size:14px;letter-spacing:3px}
    #info .hint{display:none}
    #controls{width:210px;padding:12px 14px}
    .ctrl{margin-bottom:22px}
    #readout{width:170px;padding:12px 13px}
    .ro-row{font-size:10.5px}
    .ro-row>b{font-size:11px}
  }
</style>
</head>
<body>

<div id="ui">
  <div class="panel" id="info">
    <h1>螺旋环面结</h1>
    <div class="sub">
      x = (R + r·cos(q·φ))·cos(p·φ)<br>
      y = (R + r·cos(q·φ))·sin(p·φ)<br>
      z = r·sin(q·φ)
    </div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击结体</div>
  </div>

  <div class="panel" id="controls">
    <div class="ctrl">
      <label>缠绕圈数 p<span id="valP">3</span></label>
      <input type="range" id="sliderP" min="1" max="12" step="1" value="3" autocomplete="off">
    </div>
    <div class="ctrl">
      <label>打结方式 q<span id="valQ">2</span></label>
      <input type="range" id="sliderQ" min="1" max="12" step="1" value="2" autocomplete="off">
    </div>
    <div class="ctrl">
      <label>管径粗细<span id="valTube">0.09</span></label>
      <input type="range" id="sliderTube" min="0.04" max="0.18" step="0.005" value="0.09" autocomplete="off">
    </div>
    <div class="ctrl">
      <label>整体半径 R<span id="valR">2.20</span></label>
      <input type="range" id="sliderR" min="1.50" max="3.50" step="0.05" value="2.20" autocomplete="off">
    </div>
  </div>

  <div class="panel" id="readout">
    <div class="ttl">结体读数</div>
    <div class="ro-row"><span>参数 t</span><b id="roT">—</b></div>
    <div class="ro-row"><span>坐标 x</span><b id="roX">—</b></div>
    <div class="ro-row"><span>坐标 y</span><b id="roY">—</b></div>
    <div class="ro-row"><span>坐标 z</span><b id="roZ">—</b></div>
    <div class="ro-row hi"><span>拓扑状态</span><b id="roTopo">结 T(3,2)</b></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0. 全局状态与常量
   ========================================================= */
const BEAD_COUNT = 96;

const state = {
  p: 3,
  q: 2,
  R: 2.20,
  tubeRadius: 0.09,
  hoverPos: new THREE.Vector3(),
  hoverStrength: 0,
  hoverTarget: 0,
};

/* =========================================================
   1. 工具函数
   ========================================================= */
function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const t = b; b = a % b; a = t; }
  return a;
}

/* =========================================================
   2. 环面结参数曲线
   ========================================================= */
class TorusKnotCurve extends THREE.Curve {
  constructor(R, rW, p, q) {
    super();
    this.R = R;
    this.rW = rW;
    this.p = p;
    this.q = q;
  }
  getPoint(t, target = new THREE.Vector3()) {
    const phi = t * Math.PI * 2;
    const theta = this.p * phi;
    const alpha = this.q * phi;

    const rr = this.R + this.rW * Math.cos(alpha);

    return target.set(
      rr * Math.cos(theta),
      rr * Math.sin(theta),
      this.rW * Math.sin(alpha)
    );
  }
}

/* =========================================================
   3. 场景 / 相机 / 渲染器
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04080c);
scene.fog = new THREE.FogExp2(0x04080c, 0.018);

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);
camera.position.set(7, 5, 8);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.20;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.062;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.95;
controls.panSpeed = 0.7;
controls.minDistance = 1.5;
controls.maxDistance = 45;
controls.target.set(0, 0, 0);

/* =========================================================
   4. 自定义着色器材质（虹彩金属）
   ========================================================= */
const uniforms = {
  uTime:          { value: 0 },
  uCamPos:        { value: new THREE.Vector3() },
  uHoverPos:      { value: new THREE.Vector3(0, 0, 0) },
  uHoverStrength: { value: 0 },
};

const vertexShader = /* glsl */`
  precision highp float;

  varying vec3 vWorldPos;
  varying vec3 vNormal;
  varying vec2 vUv;

  void main() {
    vUv = uv;

    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;

    mat3 m3 = mat3(
      modelMatrix[0].xyz,
      modelMatrix[1].xyz,
      modelMatrix[2].xyz
    );
    vNormal = normalize(m3 * normal);

    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const fragmentShader = /* glsl */`
  precision highp float;

  varying vec3 vWorldPos;
  varying vec3 vNormal;
  varying vec2 vUv;

  uniform float uTime;
  uniform vec3  uCamPos;
  uniform vec3  uHoverPos;
  uniform float uHoverStrength;

  vec3 hsv2rgb(vec3 c) {
    vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
    vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
    return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
  }

  void main() {
    vec3 N = normalize(vNormal);
    vec3 V = normalize(uCamPos - vWorldPos);

    if (dot(N, V) < 0.0) N = -N;

    float ndv  = clamp(dot(N, V), 0.0, 1.0);
    float fres = pow(1.0 - ndv, 2.3);

    float hue = fract(
      vUv.x * 1.40 +
      vUv.y * 0.35 +
      fres * 0.30 +
      uTime * 0.022
    );
    vec3 base = hsv2rgb(vec3(hue, 0.66, 1.0));

    vec3 L1 = normalize(vec3( 0.60,  0.95,  0.50));
    vec3 L2 = normalize(vec3(-0.70,  0.30, -0.62));
    vec3 L3 = normalize(vec3( 0.10, -0.92,  0.40));

    float d1 = max(dot(N, L1), 0.0);
    float d2 = max(dot(N, L2), 0.0);
    float d3 = max(dot(N, L3), 0.0);

    vec3 col = base * (0.36 + 0.72 * d1);
    col += base * vec3(0.46, 0.68, 1.00) * d2 * 0.56;
    col += base * vec3(1.00, 0.64, 0.84) * d3 * 0.44;

    vec3 H1 = normalize(L1 + V);
    float spec1 = pow(max(dot(N, H1), 0.0), 92.0);
    col += vec3(1.0) * spec1 * 1.15;

    vec3 H2 = normalize(L2 + V);
    float spec2 = pow(max(dot(N, H2), 0.0), 48.0);
    col += vec3(0.92, 0.78, 1.00) * spec2 * 0.42;

    col += vec3(0.50, 0.80, 1.00) * fres * 1.50;

    float hd = distance(vWorldPos, uHoverPos);
    float hover = smoothstep(0.70, 0.10, hd) * uHoverStrength;
    col += vec3(1.00, 0.88, 0.55) * hover * 0.72;
    col = mix(col, col * 1.25 + vec3(0.20, 0.14, 0.04), hover * 0.42);

    gl_FragColor = vec4(col, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  side: THREE.DoubleSide,
  transparent: false,
});

/* =========================================================
   5. 主体网格 + InstancedMesh 装饰珠
   ========================================================= */
let mesh = null;
let currentCurve = null;

const beadGeo = new THREE.SphereGeometry(1, 10, 8);
const beadMat = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.85,
});
const beads = new THREE.InstancedMesh(beadGeo, beadMat, BEAD_COUNT);
beads.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(beads);

{
  const colors = new Float32Array(BEAD_COUNT * 3);
  const c = new THREE.Color();
  for (let i = 0; i < BEAD_COUNT; i++) {
    c.setHSL((i / BEAD_COUNT) * 0.85 + 0.5, 0.85, 0.65);
    colors[i * 3]     = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }
  beads.instanceColor = new THREE.InstancedBufferAttribute(colors, 3);
  beads.instanceColor.needsUpdate = true;
}

const _beadMatrix = new THREE.Matrix4();
const _beadPos = new THREE.Vector3();

function rebuild() {
  /* ★ 修复：重建时优先从 DOM 读取最新值，确保 state 与 UI 完全同步 */
  const elP = document.getElementById('sliderP');
  const elQ = document.getElementById('sliderQ');
  const elTube = document.getElementById('sliderTube');
  const elR = document.getElementById('sliderR');

  if (elP) {
    const v = parseInt(elP.value, 10);
    if (!isNaN(v) && v >= 1 && v <= 12) state.p = v;
  }
  if (elQ) {
    const v = parseInt(elQ.value, 10);
    if (!isNaN(v) && v >= 1 && v <= 12) state.q = v;
  }
  if (elTube) {
    const v = parseFloat(elTube.value);
    if (!isNaN(v) && v >= 0.04 && v <= 0.18) state.tubeRadius = v;
  }
  if (elR) {
    const v = parseFloat(elR.value);
    if (!isNaN(v) && v >= 1.5 && v <= 3.5) state.R = v;
  }

  if (mesh) {
    scene.remove(mesh);
    mesh.geometry.dispose();
  }

  const R = state.R;
  const rW = R * 0.42;
  const p = state.p;
  const q = state.q;

  const curve = new TorusKnotCurve(R, rW, p, q);
  currentCurve = curve;

  /* ★ 修复：分段数同时考虑 p 和 q，q 较大时也能精细渲染 */
  const segBase = Math.max(p, q) * 150;
  const tubularSegments = Math.min(3200, Math.max(800, segBase));
  const radialSegments = 14;

  const geo = new THREE.TubeGeometry(
    curve,
    tubularSegments,
    state.tubeRadius,
    radialSegments,
    true
  );

  mesh = new THREE.Mesh(geo, material);
  mesh.frustumCulled = false;
  scene.add(mesh);

  updateBeads(curve);
  updateTopologyLabel();
}

function updateBeads(curve) {
  const beadSize = Math.max(0.012, state.tubeRadius * 1.10);

  for (let i = 0; i < BEAD_COUNT; i++) {
    const t = i / BEAD_COUNT;
    curve.getPoint(t, _beadPos);

    _beadMatrix.makeScale(beadSize, beadSize, beadSize);
    _beadMatrix.setPosition(_beadPos);

    beads.setMatrixAt(i, _beadMatrix);
  }
  beads.instanceMatrix.needsUpdate = true;
}

const roTopo = document.getElementById('roTopo');

function updateTopologyLabel() {
  const p = state.p, q = state.q;
  const g = gcd(p, q);

  if (g === 1) {
    roTopo.textContent = `结 T(${p},${q})`;
    roTopo.style.color = '#ffd166';
  } else {
    roTopo.textContent = `链环 (${p},${q}) ×${g}`;
    roTopo.style.color = '#ff9eb5';
  }
}

/* ★ 首次构建：在读取 DOM 前先按 state 建立几何体 */
rebuild();

/* =========================================================
   6. 背景星尘
   ========================================================= */
(function makeStars() {
  const N = 700;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();

  for (let i = 0; i < N; i++) {
    const r = 14 + Math.random() * 28;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);

    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = (Math.random() - 0.3) * 24;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);

    c.setHSL(0.48 + Math.random() * 0.20, 0.72, 0.55 + Math.random() * 0.30);
    col[i * 3]     = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const m = new THREE.PointsMaterial({
    size: 0.06,
    vertexColors: true,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  const pts = new THREE.Points(g, m);
  scene.add(pts);
  window.__stars = pts;
})();

/* =========================================================
   7. 音频系统
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let spinNodes = null;
let audioReady = false;

function initAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { audioCtx = new AC(); } catch (e) { return; }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.50;
  masterGain.connect(audioCtx.destination);

  createSpinSound();
  audioReady = true;
}

function createSpinSound() {
  if (!audioCtx || spinNodes) return;

  const osc = audioCtx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = 320;

  const lfo = audioCtx.createOscillator();
  lfo.type = 'sawtooth';
  lfo.frequency.value = 0.72;

  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 260;

  lfo.connect(lfoGain).connect(osc.frequency);
  lfo.start();

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 900;
  filter.Q.value = 4.2;

  const gain = audioCtx.createGain();
  gain.gain.value = 0;

  osc.connect(filter).connect(gain).connect(masterGain);
  osc.start();

  spinNodes = { osc, filter, gain };
}

function setSpinAmount(v) {
  if (!spinNodes || !audioCtx) return;
  const t = audioCtx.currentTime;
  spinNodes.gain.gain.setTargetAtTime(v * 0.11, t, 0.10);
  spinNodes.filter.frequency.setTargetAtTime(600 + v * 2400, t, 0.14);
}

function playMetalClick() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const base = 780 + Math.random() * 420;

  const partials = [1.0, 2.42, 3.86, 5.51, 7.28];
  const amps     = [0.22, 0.14, 0.085, 0.050, 0.028];

  partials.forEach((ratio, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = base * ratio;

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amps[i], t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34 + i * 0.085);

    osc.connect(g).connect(masterGain);
    osc.start(t);
    osc.stop(t + 1.1);
  });

  const tr = audioCtx.createOscillator();
  tr.type = 'square';
  tr.frequency.setValueAtTime(base * 5.0, t);
  tr.frequency.exponentialRampToValueAtTime(base * 2.0, t + 0.02);

  const tg = audioCtx.createGain();
  tg.gain.setValueAtTime(0.0001, t);
  tg.gain.exponentialRampToValueAtTime(0.052, t + 0.001);
  tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 4200;
  bp.Q.value = 2.0;

  tr.connect(bp).connect(tg).connect(masterGain);
  tr.start(t);
  tr.stop(t + 0.1);
}

function playComplexityTone(p, q, ascending) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;

  const complexity = p * q;
  const semis = Math.min(30, Math.round(Math.log2(complexity + 1) * 8.5));
  const baseFreq = 261.63 * Math.pow(2, semis / 12);

  const f0 = ascending ? baseFreq * 0.72 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.72;

  const osc1 = audioCtx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(f0, t);
  osc1.frequency.exponentialRampToValueAtTime(f1, t + 0.15);

  const osc2 = audioCtx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(f0 * 2, t);
  osc2.frequency.exponentialRampToValueAtTime(f1 * 2, t + 0.15);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(420, t);
  filter.frequency.exponentialRampToValueAtTime(2800 + p * 220, t + 0.1);
  filter.frequency.exponentialRampToValueAtTime(620, t + 0.35);
  filter.Q.value = 9;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.115, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.048, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

  osc1.connect(filter);
  osc2.connect(g2).connect(filter);
  filter.connect(g).connect(masterGain);

  osc1.start(t); osc2.start(t);
  osc1.stop(t + 0.42); osc2.stop(t + 0.28);
}

function playParamGlide(value, ascending, isTube) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;

  const baseFreq = isTube
    ? 380 + (0.18 - value) * 1600
    : 190 + value * 90;

  const f0 = ascending ? baseFreq * 0.78 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.78;

  const osc = audioCtx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + 0.14);

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2200, t);
  lp.frequency.exponentialRampToValueAtTime(680, t + 0.26);
  lp.Q.value = 5;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.10, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);

  osc.connect(lp).connect(g).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.36);
}

/* =========================================================
   8. 交互：指针 / 悬停 / 拾取
   ========================================================= */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(-10, -10);

let isDragging = false;
let downPos = { x: 0, y: 0 };
let downTime = 0;
let dragDist = 0;

const el = renderer.domElement;

el.addEventListener('pointermove', (e) => {
  const rect = el.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
});

el.addEventListener('pointerleave', () => {
  pointerNDC.set(-10, -10);
  state.hoverTarget = 0;
  clearReadout();
});

el.addEventListener('pointerdown', (e) => {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  isDragging = true;
  downPos.x = e.clientX;
  downPos.y = e.clientY;
  downTime = performance.now();
  dragDist = 0;
});

el.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  dragDist += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0);
});

el.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const elapsed = performance.now() - downTime;
  isDragging = false;

  if (moved < 7 && elapsed < 650) {
    initAudio();

    const rect = el.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(mesh, false);
    if (hits.length > 0) {
      playMetalClick();
    }
  }
});

const roT = document.getElementById('roT');
const roX = document.getElementById('roX');
const roY = document.getElementById('roY');
const roZ = document.getElementById('roZ');

function clearReadout() {
  roT.textContent = '—';
  roX.textContent = '—';
  roY.textContent = '—';
  roZ.textContent = '—';
}

let pickCounter = 0;

function updateHover() {
  if (isDragging) {
    state.hoverTarget = 0;
    return;
  }

  pickCounter++;
  if (pickCounter % 3 !== 0) return;

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(mesh, false);

  if (hits.length === 0) {
    state.hoverTarget = 0;
    clearReadout();
    return;
  }

  const hit = hits[0];
  state.hoverTarget = 1;
  state.hoverPos.copy(hit.point);

  if (hit.uv) {
    roT.textContent = hit.uv.x.toFixed(4);
  } else {
    roT.textContent = '—';
  }

  roX.textContent = hit.point.x.toFixed(3);
  roY.textContent = hit.point.y.toFixed(3);
  roZ.textContent = hit.point.z.toFixed(3);
}

/* =========================================================
   9. UI 绑定
   ========================================================= */
const sliderP    = document.getElementById('sliderP');
const sliderQ    = document.getElementById('sliderQ');
const sliderTube = document.getElementById('sliderTube');
const sliderR    = document.getElementById('sliderR');

const valP    = document.getElementById('valP');
const valQ    = document.getElementById('valQ');
const valTube = document.getElementById('valTube');
const valR    = document.getElementById('valR');

/* ★ 修复：强制将滑块值与 state 初始值对齐，避免浏览器表单恢复导致的不一致 */
sliderP.value    = state.p;
sliderQ.value    = state.q;
sliderTube.value = state.tubeRadius;
sliderR.value    = state.R;

valP.textContent    = String(state.p);
valQ.textContent    = String(state.q);
valTube.textContent = state.tubeRadius.toFixed(3);
valR.textContent    = state.R.toFixed(2);

let lastP = state.p;
let lastQ = state.q;
let lastTube = state.tubeRadius;
let lastR = state.R;

let rebuildPending = false;
function requestRebuild() {
  if (rebuildPending) return;
  rebuildPending = true;
  requestAnimationFrame(() => {
    rebuildPending = false;
    rebuild();
  });
}

sliderP.addEventListener('input', () => {
  initAudio();
  const v = parseInt(sliderP.value, 10);
  if (v !== lastP) {
    playComplexityTone(v, state.q, v > lastP);
    lastP = v;
  }
  state.p = v;
  valP.textContent = String(v);
  requestRebuild();
});

sliderQ.addEventListener('input', () => {
  initAudio();
  const v = parseInt(sliderQ.value, 10);
  if (v !== lastQ) {
    playComplexityTone(state.p, v, v > lastQ);
    lastQ = v;
  }
  state.q = v;
  valQ.textContent = String(v);
  requestRebuild();
});

sliderTube.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderTube.value);
  const asc = v > lastTube;
  playParamGlide(v, asc, true);
  lastTube = v;

  state.tubeRadius = v;
  valTube.textContent = v.toFixed(3);
  requestRebuild();
});

sliderR.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderR.value);
  const asc = v > lastR;
  playParamGlide(v, asc, false);
  lastR = v;

  state.R = v;
  valR.textContent = v.toFixed(2);
  requestRebuild();
});

/* =========================================================
   10. 尺寸自适应
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* =========================================================
   11. 主循环
   ========================================================= */
let lastT = performance.now();
const _prevCamPos = new THREE.Vector3().copy(camera.position);

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;

  controls.update();

  const camDelta = camera.position.distanceTo(_prevCamPos);
  const camSpeed = camDelta / Math.max(dt, 0.001);
  _prevCamPos.copy(camera.position);

  const spinAmt = Math.min(camSpeed / 12, 1);
  setSpinAmount(spinAmt);

  state.hoverStrength += (state.hoverTarget - state.hoverStrength) * Math.min(1, dt * 10);

  uniforms.uTime.value += dt;
  uniforms.uCamPos.value.copy(camera.position);
  uniforms.uHoverPos.value.copy(state.hoverPos);
  uniforms.uHoverStrength.value = state.hoverStrength;

  updateHover();

  if (window.__stars) {
    window.__stars.rotation.y += dt * 0.010;
    window.__stars.rotation.x += dt * 0.003;
  }

  const pulse = 1 + 0.16 * Math.sin(now * 0.0025);
  beads.scale.setScalar(pulse);

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

/* =========================================================
   12. 首次手势解锁音频
   ========================================================= */
['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, () => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true });
});

</script>
