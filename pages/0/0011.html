<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilbert曲线编织 · 三维空间填充网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Hilbert曲线编织 · 三维空间填充网</h2>
        <div class="sub">3D Hilbert space‑filling curve · Offset beams · Tri‑color polycurve</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">Hilbert³ 阶数 N=4</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">主曲线 + 法向偏移</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">分形填充 · 连续遍历</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.8, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        const getElapsed = () => clock.getElapsedTime();

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 0.22;
        const ORDER = 4;
        const N = 1 << ORDER; // 2^4 = 16
        const TOTAL_POINTS = N * N * N; // 4096

        // ---- 生成三维Hilbert曲线点序列 ----
        function generateHilbert3D(order) {
            // 经典递归算法
            const points = [];
            function walk(depth, dx, dy, dz, rx, ry, rz, s) {
                if (s === 0) {
                    points.push([dx - N/2, dy - N/2, dz - N/2]);
                    return;
                }
                const half = 1 << (s - 1);
                if (rx === 0 && ry === 0 && rz === 0) {
                    walk(depth+1, dx, dy, dz, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy, dz, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx, dy, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx, dy+half, dz+half, 0,1,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx+half, dy+half, dz, 0,1,0, s-1);
                    walk(depth+1, dx, dy+half, dz, 1,0,0, s-1);
                } else if (rx === 1 && ry === 0 && rz === 0) {
                    walk(depth+1, dx, dy, dz, 0,0,0, s-1);
                    walk(depth+1, dx+half, dy, dz, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz, 0,0,0, s-1);
                    walk(depth+1, dx, dy+half, dz, 0,1,0, s-1);
                    walk(depth+1, dx, dy+half, dz+half, 0,1,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz+half, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy, dz+half, 0,1,0, s-1);
                    walk(depth+1, dx, dy, dz+half, 1,0,0, s-1);
                } else if (rx === 0 && ry === 1 && rz === 0) {
                    walk(depth+1, dx, dy, dz, 0,0,0, s-1);
                    walk(depth+1, dx, dy+half, dz, 0,1,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz, 0,1,0, s-1);
                    walk(depth+1, dx+half, dy, dz, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy, dz+half, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx, dy+half, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx, dy, dz+half, 0,1,0, s-1);
                } else if (rx === 1 && ry === 1 && rz === 0) {
                    walk(depth+1, dx, dy, dz, 0,0,0, s-1);
                    walk(depth+1, dx+half, dy, dz, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx, dy, dz+half, 0,1,0, s-1);
                    walk(depth+1, dx, dy+half, dz+half, 0,1,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz+half, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz, 0,0,1, s-1);
                    walk(depth+1, dx, dy+half, dz, 0,0,1, s-1);
                } else if (rx === 0 && ry === 0 && rz === 1) {
                    walk(depth+1, dx, dy, dz, 0,0,0, s-1);
                    walk(depth+1, dx, dy, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx+half, dy, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx+half, dy, dz, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz+half, 0,1,0, s-1);
                    walk(depth+1, dx, dy+half, dz+half, 0,1,0, s-1);
                    walk(depth+1, dx, dy+half, dz, 0,0,1, s-1);
                } else if (rx === 1 && ry === 0 && rz === 1) {
                    walk(depth+1, dx, dy, dz, 0,0,0, s-1);
                    walk(depth+1, dx+half, dy, dz, 1,0,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz, 1,0,0, s-1);
                    walk(depth+1, dx, dy+half, dz, 0,1,0, s-1);
                    walk(depth+1, dx, dy+half, dz+half, 0,1,0, s-1);
                    walk(depth+1, dx+half, dy+half, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx+half, dy, dz+half, 0,0,1, s-1);
                    walk(depth+1, dx, dy, dz+half, 1,0,0, s-1);
                }
            }
            walk(0, 0, 0, 0, 0, 0, 0, ORDER);
            return points.map(([x, y, z]) => new THREE.Vector3(x, y, z).multiplyScalar(SCALE));
        }

        const hilbertPoints = generateHilbert3D(ORDER);
        console.log('Hilbert 3D点数:', hilbertPoints.length);

        // ---- 构造三线 ----
        // 计算法向量偏移：沿曲线切向旋转法向
        function computeOffsetCurves(points, offsetMag) {
            const offsets = [];
            const n = points.length;
            // 预计算切向量
            const tangents = [];
            for (let i = 0; i < n; i++) {
                if (i === 0) {
                    tangents.push(points[1].clone().sub(points[0]).normalize());
                } else if (i === n - 1) {
                    tangents.push(points[n-1].clone().sub(points[n-2]).normalize());
                } else {
                    tangents.push(points[i+1].clone().sub(points[i-1]).normalize());
                }
            }
            // 计算累加法向量 (Frenet近似)
            let normal = new THREE.Vector3(0, 1, 0);
            // 确保初始法向与切向正交
            normal.sub(tangents[0].clone().multiplyScalar(normal.dot(tangents[0]))).normalize();
            if (normal.length() < 0.1) normal = new THREE.Vector3(1, 0, 0).cross(tangents[0]).normalize();

            const offsetPts = [];
            for (let i = 0; i < n; i++) {
                const tan = tangents[i];
                // 平行移动法向
                normal.sub(tan.clone().multiplyScalar(normal.dot(tan))).normalize();
                offsetPts.push(points[i].clone().add(normal.clone().multiplyScalar(offsetMag)));
            }
            return offsetPts;
        }

        // 主曲线 + 两偏移
        const mainCurve = hilbertPoints;
        const offset1 = computeOffsetCurves(mainCurve, 0.08);
        const offset2 = computeOffsetCurves(mainCurve, -0.08);

        function createLine(points, color, opacity) {
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity, depthWrite: true, depthTest: true,
            });
            return new THREE.Line(geom, mat);
        }

        const rootGroup = new THREE.Group();
        rootGroup.name = 'hilbert-weave';
        rootGroup.add(createLine(mainCurve, COLOR_GOLD, 0.65));
        rootGroup.add(createLine(offset1, COLOR_CYAN, 0.60));
        rootGroup.add(createLine(offset2, COLOR_MAGENTA, 0.60));
        // 另加一条沿切向颜色变化的偏移
        rootGroup.add(createLine(computeOffsetCurves(mainCurve, 0.04), COLOR_GOLD, 0.40));
        rootGroup.add(createLine(computeOffsetCurves(mainCurve, -0.04), COLOR_MAGENTA, 0.40));

        scene.add(rootGroup);

        console.log('Hilbert编织线条总数:', rootGroup.children.length);

        // ---- 辅助立方体边框 ----
        const boxSize = SCALE * N;
        const boxGeom = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const boxEdges = new THREE.EdgesGeometry(boxGeom);
        const boxLine = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.18,
        }));
        rootGroup.add(boxLine);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 动画循环 ----
        function animate() {
            const t = getElapsed();
            rootGroup.rotation.x = t * 0.14;
            rootGroup.rotation.y = t * 0.23;
            rootGroup.rotation.z = t * 0.09;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.9 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // 预渲染一帧，然后使用setAnimationLoop确保稳定
        renderer.render(scene, camera);
        renderer.setAnimationLoop(animate);

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Hilbert三维空间填充曲线编织动画已稳定运行');
    </script>
</body>
</html>
