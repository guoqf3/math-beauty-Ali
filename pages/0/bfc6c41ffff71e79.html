<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>朱莉娅集合星云</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#01020a}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:#d8d0ff;-webkit-font-smoothing:antialiased;
  }
  canvas{display:block}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}

  .panel{
    position:absolute;
    background:rgba(8,6,22,.66);
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(150,110,255,.20);
    border-radius:18px;
    padding:16px 18px;
    pointer-events:auto;
    box-shadow:0 16px 48px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---- 标题 ---- */
  #info{top:22px;left:22px}
  #info h1{
    font-size:17px;letter-spacing:5px;font-weight:600;
    background:linear-gradient(92deg,#c060ff 0%,#6ec8ff 50%,#ffb37a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 32px rgba(170,90,255,.40);
  }
  #info .formula{
    margin-top:9px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;color:#b898ff;letter-spacing:.8px;line-height:1.75;
  }
  #info .formula em{color:#6ec8ff;font-style:normal}
  #info .hint{
    margin-top:10px;font-size:10.5px;color:#5c4e82;letter-spacing:.6px;
  }

  /* ---- 控制面板 ---- */
  #controls{left:22px;bottom:22px;width:274px}
  .ctrl{margin-bottom:16px}
  .ctrl:last-child{margin-bottom:0}
  .ctrl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:#b8a8d8;margin-bottom:9px;letter-spacing:.8px;
  }
  .ctrl label span{
    color:#c060ff;font-family:ui-monospace,monospace;font-size:12px;
    text-shadow:0 0 12px rgba(192,96,255,.7);
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#5a2f9f,#c060ff,#6ec8ff);
    outline:none;cursor:pointer;
    box-shadow:0 0 12px rgba(150,80,255,.40);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#c060ff 58%,#4a1f8f);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(192,96,255,1);
    cursor:pointer;transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22)}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,#c060ff 58%,#4a1f8f);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 0 16px rgba(192,96,255,1);
    cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    height:4px;border-radius:3px;
    background:linear-gradient(90deg,#5a2f9f,#c060ff,#6ec8ff);
  }

  /* ---- 读数 ---- */
  #readout{top:22px;right:22px;width:230px}
  #readout .ttl{
    font-size:10.5px;color:#5c4e82;letter-spacing:2px;
    margin-bottom:10px;text-transform:uppercase;
  }
  .ro-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;padding:5px 0;
    border-bottom:1px dashed rgba(150,110,255,.14);
  }
  .ro-row:last-child{border-bottom:none}
  .ro-row>span{color:#8a7bb0;letter-spacing:.6px}
  .ro-row>b{
    font-family:ui-monospace,monospace;font-weight:500;
    color:#c8b4ff;font-size:12px;
  }
  .ro-row.hi>b{color:#6ec8ff;text-shadow:0 0 12px rgba(110,200,255,.75)}

  @media(max-width:720px){
    #info h1{font-size:14px;letter-spacing:3px}
    #info .hint{display:none}
    #controls{width:212px;padding:12px 14px}
    #readout{width:178px;padding:12px 13px}
    .ro-row{font-size:10.5px}
    .ro-row>b{font-size:11px}
  }
</style>
</head>
<body>

<div id="ui">
  <div class="panel" id="info">
    <h1>朱莉娅集合星云</h1>
    <div class="formula">
      z<sub>n+1</sub> = z<sub>n</sub>² + <em>c</em>&nbsp;&nbsp;→&nbsp;&nbsp;逃逸时间映射为星际尘埃
    </div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击星团</div>
  </div>

  <div class="panel" id="controls">
    <div class="ctrl">
      <label>c 实部 Re<span id="valCr">-0.700</span></label>
      <input type="range" id="sliderCr" min="-1.20" max="0.60" step="0.001" value="-0.700">
    </div>
    <div class="ctrl">
      <label>c 虚部 Im<span id="valCi">0.270</span></label>
      <input type="range" id="sliderCi" min="-0.90" max="0.90" step="0.001" value="0.270">
    </div>
    <div class="ctrl">
      <label>迭代精度<span id="valIter">64</span></label>
      <input type="range" id="sliderIter" min="24" max="96" step="2" value="64">
    </div>
    <div class="ctrl">
      <label>星云亮度<span id="valBright">0.85</span></label>
      <input type="range" id="sliderBright" min="0.30" max="1.60" step="0.01" value="0.85">
    </div>
  </div>

  <div class="panel" id="readout">
    <div class="ttl">星云读数</div>
    <div class="ro-row"><span>复常数 c</span><b id="roC">-0.700 + 0.270i</b></div>
    <div class="ro-row"><span>粒子数量</span><b id="roCount">200,000</b></div>
    <div class="ro-row"><span>迭代上限</span><b id="roIter">64</b></div>
    <div class="ro-row"><span>集合连通性</span><b id="roTopo">连通</b></div>
    <div class="ro-row hi"><span>星云形态</span><b id="roShape">兔形·经典</b></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0. 全局状态
   ========================================================= */
const PARTICLE_COUNT = 200000;

const state = {
  cr: -0.700,
  ci:  0.270,
  maxIter: 64,
  brightness: 0.85,
  time: 0,
};

/* =========================================================
   1. 场景 / 相机 / 渲染器
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x01020a);

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);
camera.position.set(0, 3.2, 9.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.058;
controls.rotateSpeed = 0.80;
controls.zoomSpeed = 0.95;
controls.panSpeed = 0.65;
controls.minDistance = 1.5;
controls.maxDistance = 42;
controls.target.set(0, 0, 0);

/* =========================================================
   2. 粒子种子（单位圆盘内均匀分布）
   ========================================================= */
const seeds = new Float32Array(PARTICLE_COUNT * 2);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  /* 圆盘均匀采样 */
  const theta = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random());

  seeds[i * 2]     = r * Math.cos(theta);
  seeds[i * 2 + 1] = r * Math.sin(theta);
}

const seedBuf = new THREE.BufferAttribute(seeds, 2);

/* =========================================================
   3. 自定义着色器：GPU 端逐粒子计算 Julia 迭代
   ========================================================= */
const vertexShader = /* glsl */`
  precision highp float;

  attribute vec2 aSeed;          // 单位圆盘内随机点

  uniform vec2  uC;              // Julia 复常数
  uniform float uMaxIter;
  uniform float uTime;
  uniform float uPointSize;
  uniform float uPixelRatio;

  varying vec3  vColor;
  varying float vAlpha;
  varying float vT;

  /* ---- 星云调色板：深蓝 → 蓝紫 → 粉红 → 暖白 ---- */
  vec3 nebulaPalette(float t) {
    vec3 c0 = vec3(0.10, 0.28, 0.88);   // 深空蓝
    vec3 c1 = vec3(0.55, 0.38, 1.00);   // 蓝紫
    vec3 c2 = vec3(1.00, 0.50, 0.92);   // 品红粉
    vec3 c3 = vec3(1.00, 0.94, 0.76);   // 暖白

    if (t < 0.33) return mix(c0, c1, t / 0.33);
    if (t < 0.66) return mix(c1, c2, (t - 0.33) / 0.33);
    return mix(c2, c3, (t - 0.66) / 0.34);
  }

  void main() {
    /* ---- 复平面起始点 ---- */
    vec2 z0 = aSeed * 2.60;
    vec2 c  = uC;

    /* ---- Julia 迭代 z = z² + c ---- */
    vec2  z = z0;
    float iter = 0.0;
    float escaped = 0.0;

    for (int i = 0; i < 128; i++) {
      if (float(i) >= uMaxIter) break;
      if (dot(z, z) > 16.0) { escaped = 1.0; break; }
      z = vec2(z.x * z.x - z.y * z.y + c.x,
               2.0 * z.x * z.y + c.y);
      iter += 1.0;
    }

    /* ---- 平滑逃逸时间 ---- */
    float t;
    if (escaped > 0.5) {
      float logZn = log(dot(z, z)) * 0.5;
      float nu = log(logZn / 0.6931472) / 0.6931472;
      t = (iter + 1.0 - nu) / uMaxIter;
    } else {
      t = 1.0;   // 集合内部
    }
    t = clamp(t, 0.0, 1.0);

    /* ---- 3D 位置：逃逸时间决定到中心距离 ---- */
    float rho   = length(aSeed);              // 0..1
    float phi   = atan(aSeed.y, aSeed.x);     // 方位角

    /* 逃逸慢 → 靠中心聚集；逃逸快 → 向外弥散 */
    float invT = 1.0 - t;
    float radius = 0.26 + 3.50 * invT * (0.62 + 0.38 * invT);
    radius *= 0.82 + 0.34 * rho;

    /* 极角：原圆盘半径映射到球面纬度 */
    float theta = rho * 3.14159265;

    vec3 pos;
    pos.x = radius * sin(theta) * cos(phi);
    pos.y = radius * cos(theta) * 0.82;
    pos.z = radius * sin(theta) * sin(phi);

    /* ---- 缓慢的星云自转与呼吸 ---- */
    float drift = uTime * 0.055;
    float cs = cos(drift);
    float sn = sin(drift);
    vec2 rotXZ = vec2(pos.x * cs - pos.z * sn,
                      pos.x * sn + pos.z * cs);
    pos.x = rotXZ.x;
    pos.z = rotXZ.y;

    /* 轻微起伏，让星云有流动感 */
    pos.y += sin(uTime * 0.42 + rho * 6.2831853 + t * 4.0) * 0.13;

    /* ---- 颜色 ---- */
    vec3 col = nebulaPalette(t);

    /* 内部核心额外提亮 */
    float coreBoost = pow(t, 2.6);
    col += vec3(0.85, 0.70, 0.35) * coreBoost * 0.72;

    /* 边界高亮带（逃逸时间中间段最华丽） */
    float band = exp(-pow((t - 0.48) * 4.2, 2.0));
    col += vec3(0.55, 0.32, 0.95) * band * 0.58;

    /* 整体亮度：内部更亮 */
    float lum = 0.32 + 0.68 * t;
    col *= lum;

    vColor = col;
    vAlpha = 0.28 + 0.72 * t;
    vT = t;

    /* ---- 投影 ---- */
    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mvPosition;

    /* 近大远小 + 逃逸时间调制 */
    float sizeBase = uPointSize * (0.50 + 1.05 * t);
    gl_PointSize = sizeBase * uPixelRatio * (14.0 / max(-mvPosition.z, 1.5));
  }
`;

const fragmentShader = /* glsl */`
  precision highp float;

  varying vec3  vColor;
  varying float vAlpha;
  varying float vT;

  uniform float uIntensity;

  void main() {
    /* 圆形柔边粒子 */
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);

    if (d > 0.5) discard;

    /* 柔和衰减 */
    float alpha = 1.0 - smoothstep(0.0, 0.5, d);
    alpha *= alpha;

    /* 中心亮核，让粒子有星光感 */
    float core = 1.0 - smoothstep(0.0, 0.16, d);
    core = core * core;

    vec3 col = vColor + vec3(1.0, 0.96, 0.88) * core * 0.85;

    float a = alpha * vAlpha * uIntensity;

    /* 加法混合，营造星云辉光 */
    gl_FragColor = vec4(col * a, a);
  }
`;

/* =========================================================
   4. 材质与粒子系统
   ========================================================= */
const uniforms = {
  uC:          { value: new THREE.Vector2(state.cr, state.ci) },
  uMaxIter:    { value: state.maxIter },
  uTime:       { value: 0 },
  uPointSize:  { value: 2.10 },
  uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
  uIntensity:  { value: state.brightness },
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite: false,
  depthTest: true,
  blending: THREE.AdditiveBlending,
});

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('aSeed', seedBuf);
/* Three.js 需要 position 属性来推导包围盒，我们给一个占位 */
geometry.setAttribute(
  'position',
  new THREE.BufferAttribute(new Float32Array(PARTICLE_COUNT * 3), 3)
);
geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 12);

const particles = new THREE.Points(geometry, material);
particles.frustumCulled = false;
scene.add(particles);

/* =========================================================
   5. 背景星点（远景星空）
   ========================================================= */
(function makeBackgroundStars() {
  const N = 1600;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();

  for (let i = 0; i < N; i++) {
    const r = 28 + Math.random() * 50;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);

    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph);
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);

    c.setHSL(0.62 + Math.random() * 0.22, 0.55, 0.65 + Math.random() * 0.30);
    col[i * 3]     = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const m = new THREE.PointsMaterial({
    size: 0.14,
    vertexColors: true,
    transparent: true,
    opacity: 0.65,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  scene.add(new THREE.Points(g, m));
})();

/* =========================================================
   6. 音频引擎
   ========================================================= */
let actx = null;
let masterGain = null;
let audioReady = false;

let ambGain = null;
let ambFilter = null;
let ambDelay = null;
let ambFeedback = null;
let ambOscs = [];

function makeImpulse(ctx, seconds, decay) {
  const rate = ctx.sampleRate;
  const len = Math.floor(rate * seconds);
  const buf = ctx.createBuffer(2, len, rate);

  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

function initAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try { actx = new AC(); } catch (e) { return; }
  if (actx.state === 'suspended') actx.resume();

  masterGain = actx.createGain();
  masterGain.gain.value = 0.50;
  masterGain.connect(actx.destination);

  createAmbient();
  audioReady = true;
}

/* ---- 空灵空旷星际环绕音 ---- */
function createAmbient() {
  ambFilter = actx.createBiquadFilter();
  ambFilter.type = 'lowpass';
  ambFilter.frequency.value = 520;
  ambFilter.Q.value = 3.4;

  const baseFreqs = [55, 82.41, 110, 164.81, 220, 329.63, 440, 659.25];

  baseFreqs.forEach((f, i) => {
    const osc = actx.createOscillator();
    osc.type = (i % 2 === 0) ? 'sine' : 'triangle';
    osc.frequency.value = f;
    osc.detune.value = (i - 3.5) * 6.5;

    const g = actx.createGain();
    g.gain.value = 0.90 / (i + 1.6);

    osc.connect(g).connect(ambFilter);
    osc.start();
    ambOscs.push({ osc, gain: g });
  });

  /* 缓慢 LFO 调制滤波器 */
  const lfo = actx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.045;

  const lfoGain = actx.createGain();
  lfoGain.gain.value = 300;

  lfo.connect(lfoGain).connect(ambFilter.frequency);
  lfo.start();

  /* 反馈延迟 —— 宇宙回响 */
  ambDelay = actx.createDelay(2.0);
  ambDelay.delayTime.value = 0.58;

  ambFeedback = actx.createGain();
  ambFeedback.gain.value = 0.52;

  const wet = actx.createGain();
  wet.gain.value = 0.55;

  ambFilter.connect(ambDelay);
  ambDelay.connect(ambFeedback);
  ambFeedback.connect(ambDelay);
  ambDelay.connect(wet);

  ambGain = actx.createGain();
  ambGain.gain.value = 0.0001;

  wet.connect(ambGain);
  ambFilter.connect(ambGain);
  ambGain.connect(masterGain);
}

function updateAmbient(speed) {
  if (!audioReady || !ambGain) return;
  const t = actx.currentTime;
  const n = Math.min(speed / 6.5, 1);

  ambGain.gain.setTargetAtTime(0.0001 + n * n * 0.135, t, 0.10);
  ambFilter.frequency.setTargetAtTime(400 + n * 1400, t, 0.14);
  ambFeedback.gain.setTargetAtTime(0.46 + n * 0.18, t, 0.16);
}

/* ---- 点击星团：星辰闪耀清脆音 ---- */
function playStarFlash() {
  if (!audioReady) return;
  const t = actx.currentTime;
  const base = 1560 + Math.random() * 1250;

  /* 泛音列 —— 晶体质感 */
  const partials = [1.0, 1.48, 2.12, 3.06, 4.24, 5.88];
  const amps     = [0.24, 0.14, 0.085, 0.050, 0.030, 0.018];

  partials.forEach((ratio, i) => {
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(base * ratio, t);
    osc.frequency.exponentialRampToValueAtTime(base * ratio * 0.994, t + 0.42);

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amps[i], t + 0.0022);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38 + i * 0.082);

    osc.connect(g).connect(masterGain);
    osc.start(t);
    osc.stop(t + 1.1);
  });

  /* 高频瞬态 */
  const tr = actx.createOscillator();
  tr.type = 'square';
  tr.frequency.setValueAtTime(base * 5.2, t);
  tr.frequency.exponentialRampToValueAtTime(base * 1.85, t + 0.025);

  const tg = actx.createGain();
  tg.gain.setValueAtTime(0.0001, t);
  tg.gain.exponentialRampToValueAtTime(0.048, t + 0.001);
  tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);

  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 5600;
  bp.Q.value = 2.8;

  tr.connect(bp).connect(tg).connect(masterGain);
  tr.start(t);
  tr.stop(t + 0.12);
}

/* ---- 调节 c 值：梦幻电子音 ---- */
function playCGalaxy(cr, ci, ascending) {
  if (!audioReady) return;
  const t = actx.currentTime;

  /* 用 c 的模长和辐角映射音高与音色 */
  const mag = Math.sqrt(cr * cr + ci * ci);
  const arg = Math.atan2(ci, cr);

  const semi = (mag * 18) % 24;
  const baseFreq = 220 * Math.pow(2, semi / 12);

  const f0 = ascending ? baseFreq * 0.70 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.70;

  /* 主音：三角波扫描 */
  const osc1 = actx.createOscillator();
  osc1.type = 'triangle';
  osc1.frequency.setValueAtTime(f0, t);
  osc1.frequency.exponentialRampToValueAtTime(f1, t + 0.19);

  /* 副音：正弦 + 相位随辐角偏移，制造梦幻感 */
  const osc2 = actx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(f0 * (2.0 + Math.abs(arg) * 0.5), t);
  osc2.frequency.exponentialRampToValueAtTime(f1 * (2.0 + Math.abs(arg) * 0.5), t + 0.19);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.062, t + 0.014);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);

  /* 低通：c 越靠近原点越明亮 */
  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(400, t);
  lp.frequency.exponentialRampToValueAtTime(1800 + (1.2 - mag) * 2000, t + 0.10);
  lp.frequency.exponentialRampToValueAtTime(600, t + 0.38);
  lp.Q.value = 7.5;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.115, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);

  osc1.connect(lp);
  osc2.connect(g2).connect(lp);
  lp.connect(g).connect(masterGain);

  osc1.start(t); osc2.start(t);
  osc1.stop(t + 0.46); osc2.stop(t + 0.36);

  /* 高频闪耀层 —— 随 |c| 微调 */
  const osc3 = actx.createOscillator();
  osc3.type = 'square';
  osc3.frequency.setValueAtTime(f0 * 4.2, t);
  osc3.frequency.exponentialRampToValueAtTime(f1 * 2.1, t + 0.13);

  const g3 = actx.createGain();
  g3.gain.setValueAtTime(0.0001, t);
  g3.gain.exponentialRampToValueAtTime(0.022, t + 0.010);
  g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);

  osc3.connect(g3).connect(masterGain);
  osc3.start(t);
  osc3.stop(t + 0.26);
}

/* ---- 迭代 / 亮度滑音 ---- */
function playParamGlide(value, ascending, kind) {
  if (!audioReady) return;
  const t = actx.currentTime;

  const baseFreq = kind === 'iter'
    ? 180 + value * 4.5
    : 200 + value * 260;

  const f0 = ascending ? baseFreq * 0.78 : baseFreq;
  const f1 = ascending ? baseFreq : baseFreq * 0.78;

  const osc = actx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + 0.13);

  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(baseFreq * 1.7, t);
  bp.Q.value = 4.6;

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.082, t + 0.011);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

  osc.connect(bp).connect(g).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.34);
}

/* =========================================================
   7. 交互
   ========================================================= */
const pointerNDC = new THREE.Vector2(-10, -10);
const pointerScreen = { x: -1000, y: -1000 };

let isDragging = false;
let dragBtn = -1;
let lastX = 0, lastY = 0;
let dragDist = 0;
let downTime = 0;

const el = renderer.domElement;

el.addEventListener('pointermove', (e) => {
  const rect = el.getBoundingClientRect();
  pointerScreen.x = e.clientX;
  pointerScreen.y = e.clientY;
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (isDragging) {
    dragDist += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0);
  }
});

el.addEventListener('pointerleave', () => {
  pointerNDC.set(-10, -10);
});

el.addEventListener('pointerdown', (e) => {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  el.setPointerCapture(e.pointerId);
  isDragging = true;
  dragBtn = e.button;
  lastX = e.clientX;
  lastY = e.clientY;
  dragDist = 0;
  downTime = performance.now();
  el.style.cursor = 'grabbing';
});

el.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - pointerScreen.x, e.clientY - pointerScreen.y);
  const elapsed = performance.now() - downTime;
  isDragging = false;
  el.style.cursor = 'grab';

  if (moved < 8 && elapsed < 620) {
    initAudio();
    playStarFlash();
  }
});

el.addEventListener('pointercancel', () => {
  isDragging = false;
  el.style.cursor = 'grab';
});

el.addEventListener('contextmenu', (e) => e.preventDefault());

el.addEventListener('wheel', (e) => {
  e.preventDefault();
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
}, { passive: false });

/* =========================================================
   8. UI 绑定
   ========================================================= */
const sliderCr     = document.getElementById('sliderCr');
const sliderCi     = document.getElementById('sliderCi');
const sliderIter   = document.getElementById('sliderIter');
const sliderBright = document.getElementById('sliderBright');

const valCr     = document.getElementById('valCr');
const valCi     = document.getElementById('valCi');
const valIter   = document.getElementById('valIter');
const valBright = document.getElementById('valBright');

const roC     = document.getElementById('roC');
const roIter  = document.getElementById('roIter');
const roShape = document.getElementById('roShape');

let lastCr = state.cr;
let lastCi = state.ci;
let lastIter = state.maxIter;
let lastBright = state.brightness;

function updateCLabel() {
  roC.textContent = `${state.cr.toFixed(3)} + ${state.ci.toFixed(3)}i`;
}

function updateShapeLabel() {
  const cr = state.cr, ci = state.ci;
  const mag = Math.sqrt(cr * cr + ci * ci);

  /* 简单的形态分类，仅作趣味提示 */
  if (mag < 0.28)        roShape.textContent = '圆形·连通';
  else if (cr < -0.65)   roShape.textContent = '兔形·经典';
  else if (cr < -0.30)   roShape.textContent = '树枝·分叉';
  else if (cr > 0.25)    roShape.textContent = '尘埃·碎裂';
  else if (Math.abs(ci) > 0.60) roShape.textContent = '闪电·扭曲';
  else                    roShape.textContent = '云团·涌动';
}

updateCLabel();
updateShapeLabel();

let crPending = false;
let ciPending = false;

function requestCUpdate() {
  if (crPending) return;
  crPending = true;
  requestAnimationFrame(() => {
    crPending = false;
    uniforms.uC.value.set(state.cr, state.ci);
    updateCLabel();
    updateShapeLabel();
  });
}

sliderCr.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderCr.value);
  if (v !== lastCr) {
    playCGalaxy(v, state.ci, v > lastCr);
    lastCr = v;
  }
  state.cr = v;
  valCr.textContent = v.toFixed(3);
  requestCUpdate();
});

sliderCi.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderCi.value);
  if (v !== lastCi) {
    playCGalaxy(state.cr, v, v > lastCi);
    lastCi = v;
  }
  state.ci = v;
  valCi.textContent = v.toFixed(3);
  requestCUpdate();
});

sliderIter.addEventListener('input', () => {
  initAudio();
  const v = parseInt(sliderIter.value, 10);
  if (v !== lastIter) {
    playParamGlide(v, v > lastIter, 'iter');
    lastIter = v;
  }
  state.maxIter = v;
  uniforms.uMaxIter.value = v;
  valIter.textContent = String(v);
  roIter.textContent = String(v);
});

sliderBright.addEventListener('input', () => {
  initAudio();
  const v = parseFloat(sliderBright.value);
  if (v !== lastBright) {
    playParamGlide(v, v > lastBright, 'bright');
    lastBright = v;
  }
  state.brightness = v;
  uniforms.uIntensity.value = v;
  valBright.textContent = v.toFixed(2);
});

/* =========================================================
   9. 尺寸自适应
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);
  uniforms.uPixelRatio.value = dpr;
}
window.addEventListener('resize', onResize);

/* =========================================================
   10. 主循环
   ========================================================= */
let lastT = performance.now();
const prevCamPos = new THREE.Vector3().copy(camera.position);

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;

  state.time += dt;
  uniforms.uTime.value = state.time;

  controls.update();

  /* ---- 相机运动速度 → 环绕音强度 ---- */
  const camDelta = camera.position.distanceTo(prevCamPos);
  const camSpeed = camDelta / Math.max(dt, 0.001);
  prevCamPos.copy(camera.position);

  updateAmbient(camSpeed);

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

/* =========================================================
   11. 首次手势解锁音频
   ========================================================= */
['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, () => {
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
  }, { once: true });
});

</script>
