<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环面结演变 · 四元数纤维 · 球面有理曲线</title>
    <style>
        :root {
            --bg: #060610;
            --gold: #d8a84e;
            --cyan: #3ab8a8;
            --rose: #d94055;
            --text: #c8b990;
            --text-dim: #887a5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.8vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.2em;
            color: #e2d0a4;
            text-shadow: 0 0 40px rgba(216, 168, 78, 0.42), 0 0 80px rgba(216, 168, 78, 0.16);
            margin: 0;
            line-height: 1.3;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.48rem, 0.95vw, 0.66rem);
            letter-spacing: 0.24em;
            color: #a09070;
            opacity: 0.62;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.2vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(6, 6, 16, 0.68);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            border: 1px solid rgba(145, 125, 95, 0.18);
            border-radius: 16px;
            padding: 1vh 2.4vw;
            max-width: 94vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.62rem, 1.3vw, 0.9rem);
            color: #cdbb8f;
            letter-spacing: 0.07em;
            line-height: 1.55;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.42rem, 0.78vw, 0.58rem);
            color: #88795e;
            letter-spacing: 0.1em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d8a84e;
        }
        .accent-cyan {
            color: #3ab8a8;
        }
        .accent-rose {
            color: #d94055;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.5s ease-out 0.3s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>环面结演化 · 四元数纤维 · 球面有理曲线</h1>
        <div class="subtitle">(p,q)结变形 &nbsp;·&nbsp; S³球极投影 &nbsp;·&nbsp; Möbius有理映射织网</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">𝒯(p,q): θ↦(R+r·cos qθ)·eⁱᵖθ</span>
            &nbsp;⊕&nbsp;
            <span class="accent-cyan">𝒬(t)=π∘(eᵗ𝝃·q₀)</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">z↦(az+b)/(cz+d)↻S²</span>
        </div>
        <div class="formula-detail">
            环面结族连续变形 &nbsp;·&nbsp; 四元数左乘轨道球极投影 &nbsp;·&nbsp; 有理函数共形球面映射 &nbsp;·&nbsp; 拓扑编织交织
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x060610, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(
            54,
            window.innerWidth / window.innerHeight,
            0.4,
            32
        );
        camera.position.set(3.3, 1.9, 7.6);
        camera.lookAt(0, 0, 0);

        // ==================== 颜色定义 ====================
        const colorGold = new THREE.Color('#d8a84e');
        const colorCyan = new THREE.Color('#3ab8a8');
        const colorRose = new THREE.Color('#d94055');

        // ==================== 背景星点 ====================
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 280;
        const starPositions = new Float32Array(starCount * 3);
        const starSizesArr = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const rad = 5.2 + Math.random() * 9;
            starPositions[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = rad * Math.cos(phi);
            starSizesArr[i] = Math.random() * 2.0 + 0.25;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizesArr, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e261c,
            size: 0.02,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        // 极淡参考球壳线框
        const refSphereGeom = new THREE.SphereGeometry(2.8, 54, 38);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({
                color: 0x181410,
                transparent: true,
                opacity: 0.1,
                depthWrite: false,
            })
        );
        scene.add(refSphereWire);

        // 极淡参考环面
        const refTorusGeom = new THREE.TorusGeometry(2.15, 0.68, 12, 32);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({
                color: 0x11191c,
                transparent: true,
                opacity: 0.09,
                depthWrite: false,
            })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ==================== 曲线系统 ====================
        const allCurves = [];
        const POINTS_PER_CURVE = 560;

        function createCurve(color, updateFn) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            // 初始用小的随机偏移填充，避免空视口全0
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.4;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.4;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.84,
                depthTest: true,
                depthWrite: true,
            });

            const line = new THREE.Line(geometry, material);
            scene.add(line);

            const curveObj = { line, geometry, positions, updateFn };
            allCurves.push(curveObj);
            return curveObj;
        }

        // ==================== 组1：环面结(p,q)连续变形 (金色) ====================
        const torusKnotCount = 9;
        for (let k = 0; k < torusKnotCount; k++) {
            const phaseK = k * 0.72;
            const baseRotX = k * 0.65;
            const baseRotY = k * 0.9;
            const baseRotZ = k * 0.4;
            const pBase = 2.5 + k * 0.35;
            const qBase = 1.8 + k * 0.3;

            createCurve(colorGold, (t, i, total, arr) => {
                const idx = i * 3;
                const theta = (i / total) * Math.PI * 2;
                const p = pBase + 1.6 * Math.sin(t * 0.27 + phaseK) * Math.cos(t * 0.19 + phaseK * 0.7);
                const q = qBase + 1.4 * Math.cos(t * 0.31 + phaseK * 1.1) * Math.sin(t * 0.23 + phaseK);
                const R = 2.05 + 0.2 * Math.sin(t * 0.35 + k);
                const rTube = 0.62 + 0.16 * Math.cos(t * 0.4 + k * 1.2);

                const cosQTheta = Math.cos(q * theta);
                const sinQTheta = Math.sin(q * theta);
                const cosPTheta = Math.cos(p * theta);
                const sinPTheta = Math.sin(p * theta);

                let x0 = (R + rTube * cosQTheta) * cosPTheta;
                let y0 = (R + rTube * cosQTheta) * sinPTheta;
                let z0 = rTube * sinQTheta;

                const rx = baseRotX + t * 0.13;
                const ry = baseRotY + t * 0.16;
                const rz = baseRotZ + t * 0.1;
                const cx = Math.cos(rx),
                    sx = Math.sin(rx);
                const cy = Math.cos(ry),
                    sy = Math.sin(ry);
                const cz = Math.cos(rz),
                    sz = Math.sin(rz);

                const x1 = x0 * cz - y0 * sz;
                const y1 = x0 * sz + y0 * cz;
                const z1 = z0;
                const y2 = y1 * cx - z1 * sx;
                const z2 = y1 * sx + z1 * cx;
                const x2 = x1;
                const x3 = x2 * cy + z2 * sy;
                const z3 = -x2 * sy + z2 * cy;
                const y3 = y2;

                arr[idx] = x3;
                arr[idx + 1] = y3;
                arr[idx + 2] = z3;
            });
        }

        // ==================== 组2：四元数左乘轨道 → 球极投影 (青色) ====================
        const quatCount = 9;
        const quatParams = [];
        for (let k = 0; k < quatCount; k++) {
            const angleXi = (k / quatCount) * Math.PI * 2;
            const angleQ0 = angleXi + Math.PI * 0.38 + k * 0.25;
            const xiX = Math.cos(angleXi) * Math.sin(Math.PI * 0.45 + k * 0.2);
            const xiY = Math.sin(angleXi) * Math.sin(Math.PI * 0.45 + k * 0.2);
            const xiZ = Math.cos(Math.PI * 0.45 + k * 0.2);
            const xiNorm = Math.sqrt(xiX * xiX + xiY * xiY + xiZ * xiZ);
            const q0X = Math.cos(angleQ0) * Math.sin(Math.PI * 0.5 + k * 0.15);
            const q0Y = Math.sin(angleQ0) * Math.sin(Math.PI * 0.5 + k * 0.15);
            const q0Z = Math.cos(Math.PI * 0.5 + k * 0.15);
            const q0Norm = Math.sqrt(q0X * q0X + q0Y * q0Y + q0Z * q0Z);
            quatParams.push({
                xi: [xiX / xiNorm, xiY / xiNorm, xiZ / xiNorm],
                q0: [q0X / q0Norm, q0Y / q0Norm, q0Z / q0Norm],
            });
        }

        for (let k = 0; k < quatCount; k++) {
            const { xi, q0 } = quatParams[k];
            const rotXQ = k * 0.7;
            const rotYQ = k * 0.85;

            createCurve(colorCyan, (t, i, total, arr) => {
                const idx = i * 3;
                const s = (i / total) * Math.PI * 2.6 - Math.PI * 1.3;
                const halfS = s / 2;
                const cosHalf = Math.cos(halfS);
                const sinHalf = Math.sin(halfS);

                const ew = cosHalf;
                const ex = sinHalf * xi[0];
                const ey = sinHalf * xi[1];
                const ez = sinHalf * xi[2];

                const qw = -ex * q0[0] - ey * q0[1] - ez * q0[2];
                const qx = ew * q0[0] + ey * q0[2] - ez * q0[1];
                const qy = ew * q0[1] + ez * q0[0] - ex * q0[2];
                const qz = ew * q0[2] + ex * q0[1] - ey * q0[0];

                const denom = 1 - qw;
                const safeDenom = Math.max(Math.abs(denom), 0.25) * (denom >= 0 ? 1 : -1);
                let X = qx / safeDenom;
                let Y = qy / safeDenom;
                let Z = qz / safeDenom;

                const dist = Math.sqrt(X * X + Y * Y + Z * Z);
                const maxDist = 5.5;
                if (dist > maxDist) {
                    const scl = maxDist / dist;
                    X *= scl;
                    Y *= scl;
                    Z *= scl;
                }

                const sc = 1.7;
                X *= sc;
                Y *= sc;
                Z *= sc;

                const rx = rotXQ + t * 0.14;
                const ry = rotYQ + t * 0.17;
                const cxr = Math.cos(rx),
                    sxr = Math.sin(rx);
                const cyr = Math.cos(ry),
                    syr = Math.sin(ry);

                const Y1 = Y * cxr - Z * sxr;
                const Z1 = Y * sxr + Z * cxr;
                const X1 = X;
                const X2 = X1 * cyr + Z1 * syr;
                const Z2 = -X1 * syr + Z1 * cyr;
                const Y2 = Y1;

                arr[idx] = X2;
                arr[idx + 1] = Y2;
                arr[idx + 2] = Z2;
            });
        }

        // ==================== 组3：球面有理曲线 (玫红) ====================
        const rationalCount = 8;
        for (let k = 0; k < rationalCount; k++) {
            const a0 = 1.2 + k * 0.3;
            const b0 = 0.4 - k * 0.25;
            const c0 = -0.3 + k * 0.2;
            const d0 = 1.0 - k * 0.15;
            const rotXR = k * 0.6;
            const rotYR = k * 0.95;
            const phaseR = k * 1.0;

            createCurve(colorRose, (t, i, total, arr) => {
                const idx = i * 3;
                const wAngle = (i / total) * Math.PI * 2;
                const wr = Math.cos(wAngle);
                const wi = Math.sin(wAngle);

                const a = a0 + 0.35 * Math.sin(t * 0.3 + phaseR);
                const b = b0 + 0.3 * Math.cos(t * 0.35 + phaseR * 1.2);
                const c = c0 + 0.25 * Math.sin(t * 0.28 + phaseR * 0.7);
                const d = d0 + 0.3 * Math.cos(t * 0.33 + phaseR);

                const numR = a * wr + b;
                const numI = a * wi;
                const denR = c * wr + d;
                const denI = c * wi;
                const denSq = denR * denR + denI * denI;
                const denSafe = Math.max(denSq, 1e-6);
                const zr = (numR * denR + numI * denI) / denSafe;
                const zi = (numI * denR - numR * denI) / denSafe;

                const zNorm2 = zr * zr + zi * zi;
                const factor = 1 / (1 + zNorm2);
                const sx = 2 * zr * factor;
                const sy = 2 * zi * factor;
                const sz = (1 - zNorm2) * factor;

                const sc = 2.5;
                let x0 = sx * sc;
                let y0 = sy * sc;
                let z0 = sz * sc;

                const rx = rotXR + t * 0.15;
                const ry = rotYR + t * 0.18;
                const cxr = Math.cos(rx),
                    sxr = Math.sin(rx);
                const cyr = Math.cos(ry),
                    syr = Math.sin(ry);

                const y1 = y0 * cxr - z0 * sxr;
                const z1 = y0 * sxr + z0 * cxr;
                const x1 = x0;
                const x2 = x1 * cyr + z1 * syr;
                const z2 = -x1 * syr + z1 * cyr;
                const y2 = y1;

                arr[idx] = x2;
                arr[idx + 1] = y2;
                arr[idx + 2] = z2;
            });
        }

        // ==================== 额外：空间八字结变体 (混合色) ====================
        const extraCount = 4;
        const extraColors = [colorCyan, colorRose, colorGold, colorCyan];
        for (let k = 0; k < extraCount; k++) {
            const col = extraColors[k];
            const amp = 1.3 + k * 0.3;
            const freq = 2.1 + k * 0.35;
            const phE = k * 1.5;
            const rotEx = k * 0.9;
            const rotEy = k * 0.7;

            createCurve(col, (t, i, total, arr) => {
                const idx = i * 3;
                const s = (i / total) * Math.PI * 2;
                const inner = s * freq + t * 0.55 + phE;
                const x0 = amp * (Math.sin(inner) + 0.6 * Math.sin(3 * inner)) * 0.75;
                const y0 = amp * (Math.cos(inner) - 0.5 * Math.cos(2 * inner)) * 0.75;
                const z0 = amp * 0.7 * Math.sin(2 * inner + t * 0.4);

                const rx = rotEx + t * 0.16;
                const ry = rotEy + t * 0.19;
                const cxr = Math.cos(rx),
                    sxr = Math.sin(rx);
                const cyr = Math.cos(ry),
                    syr = Math.sin(ry);

                const y1 = y0 * cxr - z0 * sxr;
                const z1 = y0 * sxr + z0 * cxr;
                const x1 = x0;
                const x2 = x1 * cyr + z1 * syr;
                const z2 = -x1 * syr + z1 * cyr;
                const y2 = y1;

                arr[idx] = x2;
                arr[idx + 1] = y2;
                arr[idx + 2] = z2;
            });
        }

        console.log(
            `✅ 曲线系统: ${allCurves.length}条 (金:${torusKnotCount}, 青:${quatCount}, 玫红:${rationalCount}, 额外:${extraCount}), 每条${POINTS_PER_CURVE}顶点`
        );

        // ==================== 流动粒子系统 ====================
        const particleCount = 22;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];

        for (let i = 0; i < particleCount; i++) {
            const ci = i % allCurves.length;
            particleData.push({
                curveIndex: ci,
                progress: Math.random(),
                speed: 0.00055 + Math.random() * 0.0025,
            });
            let col;
            if (i < 8) col = colorGold.clone();
            else if (i < 16) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 1] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.86,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        // ==================== 动画循环（健壮版） ====================
        let animationTime = 0;
        // 使用 performance.now() 初始化，与 rAF 的 timestamp 同源
        let prevTime = performance.now();
        let isRunning = true;
        let frameCount = 0;
        let lastLogTime = prevTime;

        /**
         * 安全地更新所有曲线顶点
         */
        function updateAllCurves(t) {
            for (let c = 0; c < allCurves.length; c++) {
                try {
                    const curveObj = allCurves[c];
                    const { positions, updateFn } = curveObj;
                    for (let i = 0; i < POINTS_PER_CURVE; i++) {
                        updateFn(t, i, POINTS_PER_CURVE, positions);
                    }
                    curveObj.geometry.attributes.position.needsUpdate = true;
                } catch (err) {
                    console.warn(`曲线 ${c} 更新异常:`, err);
                    // 单条曲线出错不影响其他曲线
                }
            }
        }

        /**
         * 安全地更新所有流动粒子
         */
        function updateAllParticles() {
            try {
                for (let p = 0; p < particleCount; p++) {
                    const pd = particleData[p];
                    pd.progress += pd.speed;
                    if (pd.progress >= 1.0) pd.progress -= 1.0;
                    if (pd.progress < 0) pd.progress += 1.0;

                    const curveObj = allCurves[pd.curveIndex];
                    if (!curveObj || !curveObj.positions) continue;
                    const posArr = curveObj.positions;
                    const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                    const idx0 = Math.floor(floatIdx);
                    const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                    const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                    const i0 = idx0 * 3,
                        i1 = idx1 * 3;
                    particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                    particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                    particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
                }
                particlesGeom.attributes.position.needsUpdate = true;
            } catch (err) {
                console.warn('粒子更新异常:', err);
            }
        }

        function animate(nowTimestamp) {
            if (!isRunning) return;

            // 确保在任何情况下都继续请求下一帧
            requestAnimationFrame(animate);

            try {
                // nowTimestamp 是 DOMHighResTimeStamp（毫秒）
                const now = nowTimestamp || performance.now();
                let dt = (now - prevTime) / 1000; // 转为秒
                prevTime = now;

                // 严格限制 dt 范围，防止大帧跳跃导致数值爆炸
                if (dt <= 0 || dt > 0.3 || !isFinite(dt)) {
                    dt = 0.016; // 约60fps
                }

                animationTime += dt;
                frameCount++;

                // 每5秒输出诊断信息，确认动画正在运行
                if (now - lastLogTime > 5000) {
                    const elapsed = (now - lastLogTime) / 1000;
                    const fps = Math.round(frameCount / elapsed);
                    console.log(
                        `🔄 动画运行中 | FPS: ${fps} | 累计时间: ${animationTime.toFixed(1)}s | 曲线: ${allCurves.length}条 | dt: ${(dt*1000).toFixed(1)}ms`
                    );
                    frameCount = 0;
                    lastLogTime = now;
                }

                // 更新所有曲线
                updateAllCurves(animationTime);

                // 更新流动粒子
                updateAllParticles();

                // 参考球壳微动
                const breathe = 1 + 0.05 * Math.sin(animationTime * 0.42) * Math.cos(animationTime * 0.3);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.065;
                refSphereWire.rotation.y += dt * 0.055;

                // 参考环面微动
                refTorusWire.rotation.z += dt * 0.06;
                const torBreathe = 1 + 0.055 * Math.sin(animationTime * 0.47) * Math.cos(animationTime * 0.34);
                refTorusWire.scale.setScalar(torBreathe);

                // 相机缓慢环绕
                const camH = animationTime * 0.1;
                const camV = 0.34 + 0.18 * Math.sin(animationTime * 0.16);
                const camD = 7.3 + 0.7 * Math.sin(animationTime * 0.21) * Math.cos(animationTime * 0.27);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(
                    0.07 * Math.sin(animationTime * 0.11),
                    0.03 * Math.cos(animationTime * 0.14),
                    0
                );

                // 背景星点旋转
                stars.rotation.y += dt * 0.015;
                stars.rotation.x += dt * 0.01;

                // 渲染
                renderer.render(scene, camera);
            } catch (err) {
                console.error('动画帧渲染异常:', err);
                // 即使出错也继续运行，不中断循环
            }
        }

        // ==================== 响应式处理 ====================
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 160), { passive: true });

        // 页面可见性变化时重置时间基准，避免恢复后的大帧跳跃
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                prevTime = performance.now();
                console.log('📱 页面恢复可见，重置时间基准');
            }
        });

        // ==================== 启动 ====================
        console.log('🚀 环面结·四元数·球面有理曲线 动画初始化...');
        console.log(
            `   曲线总数: ${allCurves.length} | 顶点/曲线: ${POINTS_PER_CURVE} | 总顶点: ${allCurves.length * POINTS_PER_CURVE}`
        );
        console.log(`   粒子: ${particleCount} | 星点: ${starCount}`);

        // 预计算t=0时的所有顶点，确保第一帧有内容
        console.log('   预渲染初始帧 (t=0)...');
        updateAllCurves(0);
        updateAllParticles();
        renderer.render(scene, camera);
        console.log('   初始帧渲染完成');

        // 重置时间基准，从"现在"开始计算dt
        prevTime = performance.now();
        animationTime = 0;

        // 启动动画循环
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动 - 画面持续运动中');
        console.log('   (如果画面不动，请查看上方是否有错误日志，并检查浏览器控制台)');
    </script>
</body>
</html>
