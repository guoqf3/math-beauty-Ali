<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲IFS编织 · Möbius迭代网</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>双曲IFS编织 · Möbius迭代网</h2>
        <div class="sub">Möbius IFS orbits · Hyperbolic limit set · Stereographic projection</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">A(z)=(2z+1)/(z+2)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">B(z)=(3z+2)/(z+3)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">z₀=R·e^{iθ}, R=1.6</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.4, 2.3, 7.0);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPHERE_R = 2.7;
        const PROJ_D = 2.0;
        const MAX_STEPS = 420;
        const STEPS_PER_FRAME = 2;

        // 球极投影
        function stereographic(px, py) {
            const denom = px * px + py * py + PROJ_D * PROJ_D;
            return new THREE.Vector3(
                2 * PROJ_D * px / denom,
                2 * PROJ_D * py / denom,
                (px * px + py * py - PROJ_D * PROJ_D) / denom
            ).multiplyScalar(SPHERE_R);
        }

        // Möbius变换: f(z) = (a*z + b) / (c*z + d)
        function mobius(zRe, zIm, a, b, c, d) {
            const numRe = a * zRe + b;
            const numIm = a * zIm;
            const denRe = c * zRe + d;
            const denIm = c * zIm;
            const denom = denRe * denRe + denIm * denIm;
            if (denom < 1e-10) return { re: zRe, im: zIm, diverged: true };
            return {
                re: (numRe * denRe + numIm * denIm) / denom,
                im: (numIm * denRe - numRe * denIm) / denom,
                diverged: false
            };
        }

        // 两个生成元
        const genA = { a: 2, b: 1, c: 1, d: 2 };
        const genB = { a: 3, b: 2, c: 1, d: 3 };

        // 轨道状态
        const orbits = [];
        const numSeeds = 52;
        for (let i = 0; i < numSeeds; i++) {
            const angle = i * 2 * Math.PI / numSeeds;
            const zRe = 1.6 * Math.cos(angle);
            const zIm = 1.6 * Math.sin(angle);
            let color;
            const normAngle = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
            if (normAngle < 2 * Math.PI / 3) color = COLOR_GOLD;
            else if (normAngle < 4 * Math.PI / 3) color = COLOR_CYAN;
            else color = COLOR_MAGENTA;
            orbits.push({
                zRe, zIm, color,
                points: [stereographic(zRe, zIm)].filter(p => p && p.length() < 9.5),
                stepCount: 0,
            });
        }

        // 为每个轨道创建Line
        const orbitLines = [];
        orbits.forEach(o => {
            const geom = new THREE.BufferGeometry().setFromPoints(o.points.length > 0 ? o.points : [new THREE.Vector3(0, 0, 0)]);
            const mat = new THREE.LineBasicMaterial({
                color: o.color, transparent: true, opacity: 0.48, depthWrite: true, depthTest: true,
            });
            const line = new THREE.Line(geom, mat);
            orbitLines.push(line);
        });

        const rootGroup = new THREE.Group();
        rootGroup.name = 'mobius-ifs';
        orbitLines.forEach(l => rootGroup.add(l));
        scene.add(rootGroup);

        // 辅助球面参考网格
        for (let i = 0; i < 10; i++) {
            const lat = (i + 0.5) * Math.PI / 10;
            const r = SPHERE_R * Math.sin(lat);
            const z = SPHERE_R * Math.cos(lat);
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const phi = j * 2 * Math.PI / 200;
                pts.push(new THREE.Vector3(r * Math.cos(phi), z, r * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.07, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 8; k++) {
            const phi = k * Math.PI / 4;
            const pts = [];
            for (let j = 0; j <= 200; j++) {
                const theta = 0.02 + j * Math.PI / 200;
                const st = Math.sin(theta);
                pts.push(new THREE.Vector3(SPHERE_R * st * Math.cos(phi), SPHERE_R * Math.cos(theta), SPHERE_R * st * Math.sin(phi)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x303840, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi2 = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi2) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi2) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi2);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        console.log('Möbius IFS轨道数:', orbits.length);

        // ---- 稳定动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();

            // 每帧推进所有轨道
            let updated = false;
            for (let i = 0; i < orbits.length; i++) {
                const o = orbits[i];
                if (o.stepCount >= MAX_STEPS) continue;
                for (let s = 0; s < STEPS_PER_FRAME; s++) {
                    if (o.stepCount >= MAX_STEPS) break;
                    const gen = Math.random() < 0.5 ? genA : genB;
                    const res = mobius(o.zRe, o.zIm, gen.a, gen.b, gen.c, gen.d);
                    if (res.diverged) { o.stepCount = MAX_STEPS; break; }
                    o.zRe = res.re;
                    o.zIm = res.im;
                    if (Math.abs(o.zRe) > 30 || Math.abs(o.zIm) > 30) { o.stepCount = MAX_STEPS; break; }
                    const sp = stereographic(o.zRe, o.zIm);
                    if (sp && sp.length() < 9.5) {
                        o.points.push(sp);
                    }
                    o.stepCount++;
                }
                if (o.points.length >= 2) {
                    const line = orbitLines[i];
                    line.geometry.dispose();
                    line.geometry = new THREE.BufferGeometry().setFromPoints(o.points);
                }
                updated = true;
            }

            // 整体旋转
            rootGroup.rotation.x = t * 0.13;
            rootGroup.rotation.y = t * 0.22;
            rootGroup.rotation.z = t * 0.08;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            // 相机环绕
            const camRadius = 7.2;
            const camAngle = t * 0.08;
            const camHeight = 2.4 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 预渲染首帧确保立即显示
        renderer.render(scene, camera);
        scheduleFrame();

        // 响应式
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Möbius IFS迭代网动画已稳定运行');
    </script>
</body>
</html>
