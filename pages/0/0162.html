<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面三族曲线 · 纬线经线斜驶线交织</title>
    <style>
        :root { --bg: #02040a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #title-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem); font-weight: 400; letter-spacing: 0.09em;
            color: #cfc7b5; text-shadow: 0 0 42px rgba(200,180,150,0.5), 0 0 70px rgba(170,150,130,0.2);
            line-height: 1.4; white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.46rem, 0.82vw, 0.62rem); font-weight: 300; letter-spacing: 0.12em;
            color: #a09888; text-shadow: 0 0 14px rgba(155,145,125,0.3);
            margin-top: 2px; white-space: nowrap;
        }
        #formula-overlay {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
            background: rgba(2,4,10,0.7); padding: 10px 22px; border-radius: 32px;
            border: 1px solid rgba(175,155,135,0.18);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.36rem, 0.68vw, 0.54rem); font-weight: 300; letter-spacing: 0.04em;
            color: #c5bdaa; text-shadow: 0 0 13px rgba(185,170,145,0.25);
            line-height: 1.5; white-space: nowrap;
        }
        #formula-overlay .formula .c1 { color: #d4885c; }
        #formula-overlay .formula .c2 { color: #5d9ec6; }
        #formula-overlay .formula .c3 { color: #c77d9f; }
        @media (max-width: 600px) {
            #title-overlay { top: 14px; }
            #formula-overlay { bottom: 10px; padding: 7px 12px; border-radius: 24px; }
            #formula-overlay .formula { font-size: 0.32rem; white-space: normal; line-height: 1.3; }
            #title-overlay .title { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">球面三族曲线 · 纬线经线斜驶线交织</div>
        <div class="subtitle">SPHERICAL TRIPLE WEAVE &nbsp;·&nbsp; PARALLELS · MERIDIANS · LOXODROMES</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">纬线:</span> θ=const, φ∈[0,2π] &nbsp;
            <span class="c2">经线:</span> φ=const, θ∈[0.08π,0.92π] &nbsp;
            <span class="c3">斜驶线:</span> φ=φ₀+tanα·ln(tan(π/4+θ/2))
            <br>
            <span style="color:#9aa8b8;">R=2.6 &nbsp;|&nbsp; 每族22条 &nbsp;|&nbsp; α=55° &nbsp;|&nbsp; θ∈[15°,165°] &nbsp;|&nbsp; 绝对时间驱动</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040a');
        scene.fog = new THREE.Fog('#02040a', 8, 22);

        const camera = new THREE.PerspectiveCamera(
            50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 25
        );
        camera.position.set(0.85, 0.45, 7.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        const C1 = '#d4885c', C2 = '#5d9ec6', C3 = '#c77d9f';
        const C_REF = '#3a4a5c', C_GLINT = '#8898aa';
        const R = 2.6;
        const NUM = 22;
        const SAMPLES = 280;

        function spherePoint(theta, phi) {
            const st = Math.sin(theta), ct = Math.cos(theta);
            return new THREE.Vector3(R * st * Math.cos(phi), R * ct, R * st * Math.sin(phi));
        }

        // ==================== 纬线族 ====================
        function createParallels() {
            const curves = [];
            const thetaMin = 0.08 * Math.PI, thetaMax = 0.92 * Math.PI;
            for (let k = 0; k < NUM; k++) {
                const theta = thetaMin + (k / (NUM - 1)) * (thetaMax - thetaMin);
                const pts = [];
                for (let i = 0; i <= SAMPLES; i++) {
                    const phi = (i / SAMPLES) * Math.PI * 2;
                    pts.push(spherePoint(theta, phi));
                }
                curves.push(pts);
            }
            return curves;
        }

        // ==================== 经线族 ====================
        function createMeridians() {
            const curves = [];
            for (let k = 0; k < NUM; k++) {
                const phi = (k / NUM) * Math.PI * 2;
                const pts = [];
                const thetaMin = 0.08 * Math.PI, thetaMax = 0.92 * Math.PI;
                const dTheta = (thetaMax - thetaMin) / SAMPLES;
                for (let i = 0; i <= SAMPLES; i++) {
                    const theta = thetaMin + i * dTheta;
                    pts.push(spherePoint(theta, phi));
                }
                curves.push(pts);
            }
            return curves;
        }

        // ==================== 斜驶线族 ====================
        function createLoxodromes() {
            const curves = [];
            const alpha = 55 * Math.PI / 180;
            const tanA = Math.tan(alpha);
            const phiMin = -4.5, phiMax = 4.5;
            for (let k = 0; k < NUM; k++) {
                const phi0 = (k / NUM) * Math.PI * 2;
                const pts = [];
                const dPhi = (phiMax - phiMin) / SAMPLES;
                for (let i = 0; i <= SAMPLES; i++) {
                    const phi = phiMin + i * dPhi;
                    const theta = 2 * Math.atan(Math.exp((phi - phi0) / tanA));
                    if (theta > 0.06 * Math.PI && theta < 0.94 * Math.PI) {
                        pts.push(spherePoint(theta, phi));
                    }
                }
                if (pts.length >= 2) curves.push(pts);
            }
            return curves;
        }

        console.log('生成纬线族...');
        const parallels = createParallels();
        console.log('生成经线族...');
        const meridians = createMeridians();
        console.log('生成斜驶线族...');
        const loxodromes = createLoxodromes();
        console.log('纬线:', parallels.length, '经线:', meridians.length, '斜驶线:', loxodromes.length);

        function createGroup(curves, colorHex, opacity) {
            const group = new THREE.Group();
            for (const pts of curves) {
                if (pts.length < 2) continue;
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }

        const groupPar = createGroup(parallels, C1, 0.6);
        const groupMer = createGroup(meridians, C2, 0.58);
        const groupLox = createGroup(loxodromes, C3, 0.55);

        const mainGroup = new THREE.Group();
        mainGroup.add(groupPar);
        mainGroup.add(groupMer);
        mainGroup.add(groupLox);
        scene.add(mainGroup);

        // 参考球面
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 180;
            const gen = (f) => {
                const pts = [];
                for (let i = 0; i <= segs; i++) pts.push(f((i / segs) * Math.PI * 2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            };
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
            gen((a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
            gen((a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius));
            for (const z of [-radius * 0.5, radius * 0.5]) {
                const r = Math.sqrt(radius * radius - z * z);
                const pts = [];
                for (let i = 0; i <= segs; i++) {
                    const a = (i / segs) * Math.PI * 2;
                    pts.push(new THREE.Vector3(Math.cos(a) * r, z, Math.sin(a) * r));
                }
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true, opacity: opacity * 0.6, depthWrite: true
                });
                group.add(new THREE.Line(geom, mat));
            }
            return group;
        }
        const sphereRef = createSphereWireframe(R, C_REF, 0.22);
        scene.add(sphereRef);

        // 轴端点光点
        (() => {
            const sz = 0.06;
            const axes = [[R, 0, 0], [-R, 0, 0], [0, R, 0], [0, -R, 0], [0, 0, R], [0, 0, -R]];
            const gGroup = new THREE.Group();
            axes.forEach(([ax, ay, az]) => {
                const pt = new THREE.Vector3(ax, ay, az);
                [[-sz, 0, 0], [sz, 0, 0], [0, -sz, 0], [0, sz, 0], [0, 0, -sz], [0, 0, sz]].forEach(([dx, dy, dz]) => {
                    const g = new THREE.BufferGeometry().setFromPoints([pt.clone().add(new THREE.Vector3(dx, dy, dz)), pt]);
                    const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent: true, opacity: 0.5, depthWrite: true });
                    gGroup.add(new THREE.Line(g, m));
                });
            });
            mainGroup.add(gGroup);
        })();

        // 原点
        (() => {
            const sz = 0.08;
            const g = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0),
                new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0),
                new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)
            ]);
            const m = new THREE.LineBasicMaterial({ color: new THREE.Color(C_GLINT), transparent: true, opacity: 0.72, depthWrite: true });
            scene.add(new THREE.LineSegments(g, m));
        })();

        // 动画
        const startTime = performance.now();
        let frameCount = 0;
        let currentTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            const elapsed = (now - startTime) / 1000;
            if (elapsed <= 0) { renderer.render(scene, camera); return; }
            currentTime = elapsed;
            frameCount++;
            if (frameCount === 1 || frameCount % 180 === 0) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${currentTime.toFixed(2)}s`);
            }

            mainGroup.rotation.y = currentTime * 0.28;
            mainGroup.rotation.x = currentTime * 0.15 + Math.sin(currentTime * 0.24) * 0.2;
            mainGroup.rotation.z = Math.cos(currentTime * 0.19) * 0.12;
            sphereRef.rotation.copy(mainGroup.rotation);

            const camX = 0.85 + Math.sin(currentTime * 0.14) * 0.5;
            const camY = 0.45 + Math.cos(currentTime * 0.17) * 0.45;
            camera.position.set(camX, camY, 7.2);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        console.log('=== 球面三族曲线 · 纬线经线斜驶线交织 ===');
        console.log('纬线(暖金):', parallels.length, '经线(冰蓝):', meridians.length, '斜驶线(玫瑰粉):', loxodromes.length);
        console.log('总曲线数:', parallels.length + meridians.length + loxodromes.length);
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
