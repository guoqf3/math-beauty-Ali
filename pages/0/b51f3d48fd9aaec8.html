<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaslavsky映射 · 混沌轨道编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>Zaslavsky映射 · 混沌轨道编织</h2>
        <div class="sub">Zaslavsky web map · Chaotic orbits · Cylindrical embedding</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">ν=0.3, μ=1.0, ε=0.2, r=2.0</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">ν=0.4, μ=0.9, ε=0.25, r=1.8</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">ν=0.25, μ=1.1, ε=0.18, r=2.2</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.5, 2.6, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SCALE = 2.45;
        const STEPS_PER_FRAME = 6;
        const MAX_STEPS = 800;

        // Zaslavsky映射
        function zaslavsky(x, y, nu, mu, epsilon, r) {
            const cos2px = Math.cos(2 * Math.PI * x);
            const xNew = (x + nu * (1 + mu * y) + epsilon * nu * mu * cos2px) % 1.0;
            if (xNew < 0) xNew += 1.0;
            const yNew = Math.exp(-r) * (y + epsilon * cos2px);
            return { x: xNew, y: yNew };
        }

        // 将相平面点映射到三维柱面空间
        function embed3D(x, y) {
            const angle = x * 2 * Math.PI;
            const r = 1.2 + y * 0.8;
            return new THREE.Vector3(
                SCALE * r * Math.cos(angle),
                SCALE * (y * 2.4 - 1.2),
                SCALE * r * Math.sin(angle)
            );
        }

        // 参数组
        const paramSets = [
            { nu: 0.30, mu: 1.0, epsilon: 0.20, r: 2.0, color: COLOR_GOLD, count: 15 },
            { nu: 0.40, mu: 0.9, epsilon: 0.25, r: 1.8, color: COLOR_CYAN, count: 15 },
            { nu: 0.25, mu: 1.1, epsilon: 0.18, r: 2.2, color: COLOR_MAGENTA, count: 15 },
            { nu: 0.35, mu: 1.05, epsilon: 0.22, r: 2.1, color: COLOR_GOLD, count: 10 },
            { nu: 0.28, mu: 0.95, epsilon: 0.19, r: 1.9, color: COLOR_CYAN, count: 10 },
            { nu: 0.33, mu: 1.08, epsilon: 0.23, r: 2.05, color: COLOR_MAGENTA, count: 10 },
        ];

        // 轨道状态
        const orbits = [];
        let orbitId = 0;
        for (const ps of paramSets) {
            for (let c = 0; c < ps.count; c++) {
                const x0 = Math.random();
                const y0 = Math.random() * 0.5 - 0.25;
                orbits.push({
                    x: x0, y: y0,
                    nu: ps.nu, mu: ps.mu, epsilon: ps.epsilon, r: ps.r,
                    color: ps.color,
                    points: [embed3D(x0, y0)],
                    stepCount: 0,
                    id: orbitId++
                });
            }
        }

        // 创建Line对象
        const orbitLines = orbits.map(o => {
            const geom = new THREE.BufferGeometry().setFromPoints(o.points);
            const mat = new THREE.LineBasicMaterial({
                color: o.color, transparent: true, opacity: 0.42, depthWrite: true, depthTest: true,
            });
            return new THREE.Line(geom, mat);
        });

        const rootGroup = new THREE.Group();
        rootGroup.name = 'zaslavsky-weave';
        orbitLines.forEach(l => rootGroup.add(l));
        scene.add(rootGroup);

        // 辅助圆柱参考线
        const refR = SCALE * 1.6;
        const refH = SCALE * 2.4;
        for (let i = 0; i < 10; i++) {
            const y = -refH + i * 2 * refH / 9;
            const pts = [];
            for (let j = 0; j <= 180; j++) {
                const ang = j * 2 * Math.PI / 180;
                pts.push(new THREE.Vector3(refR * Math.cos(ang), y, refR * Math.sin(ang)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.06, depthWrite: true, depthTest: true
            })));
        }
        for (let k = 0; k < 12; k++) {
            const ang = k * Math.PI / 6;
            const pts = [];
            for (let j = 0; j <= 180; j++) {
                const y = -refH + j * 2 * refH / 180;
                pts.push(new THREE.Vector3(refR * Math.cos(ang), y, refR * Math.sin(ang)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            rootGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                color: 0x403830, transparent: true, opacity: 0.05, depthWrite: true, depthTest: true
            })));
        }

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        console.log('Zaslavsky轨道数:', orbits.length);

        // ---- 稳定动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();

            // 每帧推进所有轨道若干步
            for (let i = 0; i < orbits.length; i++) {
                const o = orbits[i];
                if (o.stepCount >= MAX_STEPS) continue;
                for (let s = 0; s < STEPS_PER_FRAME; s++) {
                    if (o.stepCount >= MAX_STEPS) break;
                    const nxt = zaslavsky(o.x, o.y, o.nu, o.mu, o.epsilon, o.r);
                    o.x = nxt.x;
                    o.y = nxt.y;
                    if (Math.abs(o.y) > 5) { o.stepCount = MAX_STEPS; break; }
                    const pt = embed3D(o.x, o.y);
                    if (pt.length() < 9) o.points.push(pt);
                    o.stepCount++;
                }
                if (o.points.length >= 2) {
                    const line = orbitLines[i];
                    line.geometry.dispose();
                    line.geometry = new THREE.BufferGeometry().setFromPoints(o.points);
                }
            }

            rootGroup.rotation.x = t * 0.13;
            rootGroup.rotation.y = t * 0.21;
            rootGroup.rotation.z = t * 0.08;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.7 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        // 预渲染首帧
        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ Zaslavsky映射混沌轨道编织动画已稳定运行');
    </script>
</body>
</html>
