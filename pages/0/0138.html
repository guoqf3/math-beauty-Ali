<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>准周期编织 · 四维环面映射 · 无理频率流形</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d6a746;
            --cyan: #3cbca4;
            --rose: #d94050;
            --text: #cdbc8a;
            --text-dim: #887a58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.7vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.16em;
            color: #e2cf9c;
            text-shadow: 0 0 40px rgba(214, 167, 70, 0.45), 0 0 80px rgba(214, 167, 70, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.46rem, 0.92vw, 0.65rem);
            letter-spacing: 0.22em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.1vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.64);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.18);
            border-radius: 16px;
            padding: 1vh 2.4vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.6rem, 1.3vw, 0.9rem);
            color: #cdb886;
            letter-spacing: 0.07em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.4rem, 0.78vw, 0.56rem);
            color: #8a7a58;
            letter-spacing: 0.1em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d6a746;
        }
        .accent-cyan {
            color: #3cbca4;
        }
        .accent-rose {
            color: #d94050;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.5s ease-out 0.3s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>准周期编织 · 四维环面映射 · 无理频率流形</h1>
        <div class="subtitle">T⁴线性流 ↦ ℝ³ 非线性嵌入 &nbsp;·&nbsp; 频率比无理数 &nbsp;·&nbsp; 稠密编织网</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">x⃗(t)=ℱ(ω₁t,ω₂t,ω₃t,ω₄t)</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">ω∈{√p}</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">ℱ∈C∞(T⁴,ℝ³)</span>
        </div>
        <div class="formula-detail">
            四维环面线性流  →  非线性光滑嵌入映射  →  三维球体内稠密轨迹  |  频率缓变编织时空图案
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 30);
        camera.position.set(2.5, 1.5, 7.6);
        camera.lookAt(0, 0, 0);

        // 颜色
        const colorGold = new THREE.Color('#d6a746');
        const colorCyan = new THREE.Color('#3cbca4');
        const colorRose = new THREE.Color('#d94050');

        const CLAMP_RADIUS = 2.8;

        // ==================== 背景星点 ====================
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 200;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const rad = 5.5 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
            starPos[i * 3 + 2] = rad * Math.cos(phi);
            starSizes[i] = Math.random() * 1.8 + 0.26;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.019,
            transparent: true,
            opacity: 0.48,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        // 极淡参考球壳
        const refSphereGeom = new THREE.SphereGeometry(2.7, 52, 36);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.08, depthWrite: false })
        );
        scene.add(refSphereWire);

        // 极淡参考环面
        const refTorusGeom = new THREE.TorusGeometry(2.05, 0.6, 12, 30);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1517, transparent: true, opacity: 0.07, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ==================== 曲线系统：四维环面映射 ====================
        const allCurves = [];
        const POINTS_PER_CURVE = 220; // 每条曲线点数

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.4;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.4;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 1,
                transparent: true,
                opacity: 0.84,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, material);
            scene.add(line);
            const obj = { line, geometry: geom, positions };
            allCurves.push(obj);
            return obj;
        }

        // 频率基底：三种颜色使用不同的无理数集合
        const freqSets = {
            gold: [Math.sqrt(2), Math.sqrt(3), Math.sqrt(5), Math.sqrt(7)],
            cyan: [Math.PI, Math.E, Math.sqrt(11), Math.sqrt(13)],
            rose: [Math.sqrt(17), Math.sqrt(19), Math.PI / 2, Math.E / 2],
        };

        // 映射 F: T^4 → R^3
        function torusMapping(x1, x2, x3, x4) {
            // 光滑嵌入，确保值域有界且位于球体内
            const a = 1.0;
            const b = 0.65;
            const c = 0.8;
            const x = a * Math.cos(x1) + b * Math.sin(x2 + x3);
            const y = a * Math.sin(x1 + x4) + c * Math.cos(x2 - x3);
            const z = b * Math.cos(x1 - x3) + c * Math.sin(x2 + x4);
            // 缩放至半径约1.5，然后钳制
            return [x * 1.2, y * 1.2, z * 1.2];
        }

        // 创建一组曲线
        function buildFamily(count, colorKey) {
            const baseFreqs = freqSets[colorKey];
            const curves = [];
            for (let k = 0; k < count; k++) {
                // 初始相位随机分布
                const phi = [
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                ];
                const curve = createCurve(
                    colorKey === 'gold' ? colorGold : colorKey === 'cyan' ? colorCyan : colorRose
                );
                curve.phi = phi;
                curve.baseFreqs = baseFreqs;
                curve.colorKey = colorKey;
                curves.push(curve);
            }
            return curves;
        }

        // 生成三组曲线，每组18条，总计54条
        buildFamily(18, 'gold');
        buildFamily(18, 'cyan');
        buildFamily(18, 'rose');

        // 额外8条混合三叶结点缀
        const extraColors = [colorCyan, colorRose, colorGold, colorCyan, colorRose, colorGold, colorCyan, colorRose];
        for (let e = 0; e < 8; e++) {
            const curve = createCurve(extraColors[e]);
            curve.isExtra = true;
            curve.amp = 1.3 + e * 0.18;
            curve.freq = 1.9 + e * 0.25;
            curve.phase = e * 1.35;
        }

        console.log(`✅ 曲线总数: ${allCurves.length} (金18, 青18, 玫红18, 额外8)`);

        // 更新函数：根据当前时间计算所有曲线顶点
        function updateAllCurves(t) {
            for (const curve of allCurves) {
                try {
                    const positions = curve.positions;
                    if (curve.isExtra) {
                        // 三叶结变体
                        const amp = curve.amp;
                        const freq = curve.freq;
                        const ph = curve.phase;
                        for (let i = 0; i < POINTS_PER_CURVE; i++) {
                            const s = (i / POINTS_PER_CURVE) * Math.PI * 2;
                            const inner = s * freq + t * 0.5 + ph;
                            let x = amp * (Math.sin(inner) + 0.5 * Math.sin(3 * inner)) * 0.82;
                            let y = amp * (Math.cos(inner) - 0.42 * Math.cos(2 * inner)) * 0.82;
                            let z = amp * 0.65 * Math.sin(2 * inner + t * 0.35);
                            // 钳制
                            const r = Math.sqrt(x * x + y * y + z * z);
                            if (r > CLAMP_RADIUS && r > 0.001) {
                                const sc = CLAMP_RADIUS / r;
                                x *= sc;
                                y *= sc;
                                z *= sc;
                            }
                            positions[i * 3] = x;
                            positions[i * 3 + 1] = y;
                            positions[i * 3 + 2] = z;
                        }
                    } else {
                        // 四维环面映射曲线
                        const phi = curve.phi;
                        const baseFreqs = curve.baseFreqs;
                        // 频率随时间缓慢调制，使图案动态演化
                        const modFactor = 1 + 0.08 * Math.sin(t * 0.25) * Math.cos(t * 0.18);
                        const freqs = baseFreqs.map(f => f * modFactor);

                        for (let i = 0; i < POINTS_PER_CURVE; i++) {
                            const s = (i / (POINTS_PER_CURVE - 1) - 0.5) * 6.5; // 参数范围
                            const x1 = freqs[0] * s + phi[0];
                            const x2 = freqs[1] * s + phi[1];
                            const x3 = freqs[2] * s + phi[2];
                            const x4 = freqs[3] * s + phi[3];
                            const p = torusMapping(x1, x2, x3, x4);
                            // 钳制到球体内
                            const r = Math.sqrt(p[0] * p[0] + p[1] * p[1] + p[2] * p[2]);
                            if (r > CLAMP_RADIUS && r > 0.001) {
                                const sc = CLAMP_RADIUS / r;
                                p[0] *= sc;
                                p[1] *= sc;
                                p[2] *= sc;
                            }
                            positions[i * 3] = p[0];
                            positions[i * 3 + 1] = p[1];
                            positions[i * 3 + 2] = p[2];
                        }
                    }
                    curve.geometry.attributes.position.needsUpdate = true;
                } catch (e) {
                    console.warn('曲线更新异常, 已跳过', e);
                }
            }
        }

        // ==================== 流动粒子 ====================
        const particleCount = 22;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            const ci = i % allCurves.length;
            particleData.push({
                curveIndex: ci,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0023,
            });
            let col;
            if (i < 8) col = colorGold.clone();
            else if (i < 15) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 1] = (Math.random() - 0.5) * 0.3;
            particlePosArr[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            try {
                for (let p = 0; p < particleCount; p++) {
                    const pd = particleData[p];
                    pd.progress += pd.speed;
                    if (pd.progress >= 1.0) pd.progress -= 1.0;
                    if (pd.progress < 0) pd.progress += 1.0;
                    const curveObj = allCurves[pd.curveIndex];
                    if (!curveObj || !curveObj.positions) continue;
                    const posArr = curveObj.positions;
                    const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                    const idx0 = Math.floor(floatIdx);
                    const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                    const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                    const i0 = idx0 * 3,
                        i1 = idx1 * 3;
                    particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                    particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                    particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
                }
                particlesGeom.attributes.position.needsUpdate = true;
            } catch (e) {
                console.warn('粒子更新异常, 已跳过', e);
            }
        }

        // ==================== 极度健壮的动画循环 ====================
        const clock = new THREE.Clock();
        let animationTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animationTime += dt;
                frameCount++;

                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const elapsed = (now - lastLogTime) / 1000;
                    const fps = Math.round(frameCount / elapsed);
                    console.log(`🔄 运行中 | FPS: ${fps} | 时间: ${animationTime.toFixed(1)}s | dt: ${(dt*1000).toFixed(1)}ms`);
                    frameCount = 0;
                    lastLogTime = now;
                }

                updateAllCurves(animationTime);
                updateParticles();

                const breathe = 1 + 0.05 * Math.sin(animationTime * 0.42) * Math.cos(animationTime * 0.3);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.06;
                refSphereWire.rotation.y += dt * 0.05;

                refTorusWire.rotation.z += dt * 0.06;
                const torBreathe = 1 + 0.06 * Math.sin(animationTime * 0.44) * Math.cos(animationTime * 0.33);
                refTorusWire.scale.setScalar(torBreathe);

                const camH = animationTime * 0.1;
                const camV = 0.34 + 0.18 * Math.sin(animationTime * 0.15);
                const camD = 7.3 + 0.65 * Math.sin(animationTime * 0.2) * Math.cos(animationTime * 0.26);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.06 * Math.sin(animationTime * 0.1), 0.03 * Math.cos(animationTime * 0.13), 0);

                stars.rotation.y += dt * 0.014;
                stars.rotation.x += dt * 0.01;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画主循环异常, 循环仍继续:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                clock.getDelta();
            }
        });

        // ==================== 启动 ====================
        console.log('🚀 准周期编织动画初始化... 预渲染第一帧');
        updateAllCurves(0);
        updateParticles();
        renderer.render(scene, camera);
        clock.start();
        animationTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动，62条稠密准周期曲线持续编织');
    </script>
</body>
</html>
