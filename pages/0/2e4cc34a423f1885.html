<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>玫瑰曲面光舞</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05030a; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color:#f4e8f7;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display:block; }

  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }

  .panel {
    position:absolute;
    background: rgba(24, 9, 32, 0.55);
    backdrop-filter: blur(16px) saturate(1.3);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid rgba(255, 120, 180, 0.18);
    border-radius: 16px;
    padding: 15px 17px;
    pointer-events: auto;
    box-shadow: 0 10px 36px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.07);
  }

  /* ---------- 标题 ---------- */
  #info { top: 20px; left: 20px; }
  #info h1 {
    font-size: 16px; letter-spacing: 4px; font-weight: 600;
    background: linear-gradient(92deg, #ff5fa2 0%, #ff8fbf 45%, #ffc46b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 26px rgba(255, 80, 160, 0.35);
  }
  #info .formula {
    margin-top: 9px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; color: #ffb3d6; letter-spacing: 1.2px;
  }
  #info .formula em { color:#ffd98a; font-style: normal; }
  #info .hint {
    margin-top: 10px; font-size: 10.5px; color: #8b7a95; letter-spacing: 0.6px;
  }

  /* ---------- 控制面板 ---------- */
  #controls { left: 20px; bottom: 20px; width: 252px; }
  .ctrl { margin-bottom: 15px; }
  .ctrl:last-child { margin-bottom: 0; }
  .ctrl label {
    display:flex; justify-content:space-between; align-items:baseline;
    font-size: 11.5px; color:#d9c2e4; margin-bottom: 8px; letter-spacing: 0.8px;
  }
  .ctrl label span {
    color:#ff9ec9; font-family: ui-monospace, monospace; font-size: 12px;
    text-shadow: 0 0 12px rgba(255,120,180,0.6);
  }
  input[type=range] {
    -webkit-appearance: none; appearance:none;
    width: 100%; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, #ff3d7f, #ffb45f);
    outline: none; cursor: pointer; display:block;
    box-shadow: 0 0 12px rgba(255,60,130,0.35);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #ffffff, #ff5fa2 58%, #c8265f);
    border: 1px solid rgba(255,255,255,0.65);
    box-shadow: 0 0 12px rgba(255,90,160,0.9);
    cursor: pointer; transition: transform .15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.22); }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.65);
    background: radial-gradient(circle at 34% 28%, #ffffff, #ff5fa2 58%, #c8265f);
    box-shadow: 0 0 12px rgba(255,90,160,0.9); cursor: pointer;
  }
  input[type=range]::-moz-range-track {
    height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, #ff3d7f, #ffb45f);
  }

  /* ---------- 读数面板 ---------- */
  #readout { top: 20px; right: 20px; width: 206px; }
  #readout .ttl {
    font-size: 10.5px; color:#8b7a95; letter-spacing: 2px; margin-bottom: 10px;
    text-transform: uppercase;
  }
  .ro-row {
    display:flex; justify-content:space-between; align-items:baseline;
    font-size: 11.5px; padding: 5px 0;
    border-bottom: 1px dashed rgba(255,120,180,0.12);
  }
  .ro-row:last-child { border-bottom: none; }
  .ro-row > span { color:#a892b5; letter-spacing: 0.6px; }
  .ro-row > b {
    font-family: ui-monospace, monospace; font-weight: 500;
    color:#ffc9e2; font-size: 12px;
  }
  .ro-row.hi > b { color:#ffd98a; text-shadow: 0 0 12px rgba(255,200,100,0.75); }

  @media (max-width: 720px) {
    #info h1 { font-size: 14px; letter-spacing: 2px; }
    #info .hint { display: none; }
    #controls { width: 190px; padding: 12px 14px; }
    #readout { width: 158px; padding: 12px 13px; }
    .ro-row { font-size: 10.5px; }
    .ro-row > b { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="ui">
  <div class="panel" id="info">
    <h1>玫瑰曲面光舞</h1>
    <div class="formula">r&nbsp;=&nbsp;<em>A</em>&nbsp;·&nbsp;sin(<em>k</em>&nbsp;·&nbsp;θ)</div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 悬停查看 · 点击分瓣</div>
  </div>

  <div class="panel" id="controls">
    <div class="ctrl">
      <label>花瓣频率 <b style="color:#ff9ec9;font-weight:600">k</b><span id="valK">5</span></label>
      <input type="range" id="sliderK" min="1" max="12" step="1" value="5">
    </div>
    <div class="ctrl">
      <label>半径振幅 <b style="color:#ff9ec9;font-weight:600">A</b><span id="valA">1.60</span></label>
      <input type="range" id="sliderA" min="0.6" max="3.0" step="0.05" value="1.6">
    </div>
    <div class="ctrl">
      <label>花瓣宽度 <b style="color:#ff9ec9;font-weight:600">w</b><span id="valW">1.00</span></label>
      <input type="range" id="sliderW" min="0.30" max="2.60" step="0.05" value="1.0">
    </div>
  </div>

  <div class="panel" id="readout">
    <div class="ttl">曲面读数</div>
    <div class="ro-row"><span>θ 极角</span><b id="roTheta">—</b></div>
    <div class="ro-row"><span>r 公式值</span><b id="roR">—</b></div>
    <div class="ro-row"><span>ρ 实际半径</span><b id="roRho">—</b></div>
    <div class="ro-row hi"><span>花瓣序号</span><b id="roPetal">—</b></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0. 全局状态
   ========================================================= */
const state = {
  k: 5,          // 花瓣频率
  amp: 1.6,      // 半径振幅 A
  width: 1.0,    // 花瓣宽度指数 w
};

let needsRebuild = true;

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05030a);
scene.fog = new THREE.FogExp2(0x05030a, 0.026);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 3.4, 6.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.95;
controls.panSpeed = 0.7;
controls.minDistance = 1.8;
controls.maxDistance = 26;
controls.target.set(0, 0.55, 0);

/* =========================================================
   2. 玫瑰曲面几何构建
   ---------------------------------------------------------
   参数化：
     θ ∈ [0, 2π)  (k 为偶数)
     θ ∈ [0, π)   (k 为奇数，此时 θ 与 θ+π 参数点重合)
     q(θ)  = |sin(kθ)|^w
     u     = q(θ) · t ,  t ∈ [0,1]
     ρ     = A · u
     x     = ρ·cosθ ,  z = ρ·sinθ ,  y = H·u^1.35
   ========================================================= */
function buildRoseGeometry(k, amp, width) {
  const odd = (Math.abs(k % 2) === 1);
  const thetaMax = odd ? Math.PI : Math.PI * 2;
  const petals = odd ? k : 2 * k;

  const THETA_SEG = Math.min(1280, Math.max(360, Math.round(petals * 74)));
  const RAD_SEG = 46;

  const rows = THETA_SEG + 1;
  const cols = RAD_SEG + 1;
  const count = rows * cols;

  const height = amp * 0.78;

  const positions = new Float32Array(count * 3);
  const aU = new Float32Array(count);
  const aTheta = new Float32Array(count);
  const aPetal = new Float32Array(count);

  let p = 0;
  for (let i = 0; i < rows; i++) {
    const theta = thetaMax * i / THETA_SEG;
    const s = Math.abs(Math.sin(k * theta));
    const q = Math.pow(s, width);
    const petalId = Math.floor((k * theta) / Math.PI + 1e-6);

    const ct = Math.cos(theta);
    const st = Math.sin(theta);

    for (let j = 0; j < cols; j++) {
      const t = j / RAD_SEG;
      const u = q * t;
      const rho = amp * u;
      const y = height * Math.pow(u, 1.35);

      const i3 = p * 3;
      positions[i3]     = rho * ct;
      positions[i3 + 1] = y;
      positions[i3 + 2] = rho * st;

      aU[p] = u;
      aTheta[p] = theta;
      aPetal[p] = petalId;
      p++;
    }
  }

  const indices = new Uint32Array(THETA_SEG * RAD_SEG * 6);
  let ii = 0;
  for (let i = 0; i < THETA_SEG; i++) {
    for (let j = 0; j < RAD_SEG; j++) {
      const a = i * cols + j;
      const b = a + 1;
      const c = (i + 1) * cols + j;
      const d = c + 1;
      indices[ii++] = a; indices[ii++] = c; indices[ii++] = b;
      indices[ii++] = b; indices[ii++] = c; indices[ii++] = d;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aU',     new THREE.BufferAttribute(aU, 1));
  geo.setAttribute('aTheta', new THREE.BufferAttribute(aTheta, 1));
  geo.setAttribute('aPetal', new THREE.BufferAttribute(aPetal, 1));
  geo.setIndex(new THREE.BufferAttribute(indices, 1));

  geo.computeVertexNormals();

  // 修复退化点（极点处法线为零）
  const nrm = geo.attributes.normal.array;
  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    const len = Math.hypot(nrm[i3], nrm[i3 + 1], nrm[i3 + 2]);
    if (len < 1e-6) { nrm[i3] = 0; nrm[i3 + 1] = 1; nrm[i3 + 2] = 0; }
  }
  geo.attributes.normal.needsUpdate = true;
  geo.computeBoundingSphere();

  return geo;
}

/* =========================================================
   3. 材质（自定义着色器）
   ========================================================= */
const uniforms = {
  uTime:        { value: 0 },
  uColA:        { value: new THREE.Color('#3a0a33') },
  uColB:        { value: new THREE.Color('#ff2d78') },
  uColC:        { value: new THREE.Color('#ffd07a') },
  uHoverPetal:  { value: -9999 },
  uHoverAmt:    { value: 0 },
};

const roseMaterial = new THREE.ShaderMaterial({
  uniforms,
  side: THREE.DoubleSide,
  transparent: false,
  vertexShader: /* glsl */`
    attribute float aU;
    attribute float aTheta;
    attribute float aPetal;

    varying float vU;
    varying float vTheta;
    varying float vPetal;
    varying vec3  vNormalW;
    varying vec3  vPosW;

    void main() {
      vU     = aU;
      vTheta = aTheta;
      vPetal = aPetal;

      vec4 wp = modelMatrix * vec4(position, 1.0);
      vPosW = wp.xyz;
      vNormalW = normalize(mat3(modelMatrix) * normal);

      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    uniform vec3  uColA;
    uniform vec3  uColB;
    uniform vec3  uColC;
    uniform float uHoverPetal;
    uniform float uHoverAmt;

    varying float vU;
    varying float vTheta;
    varying float vPetal;
    varying vec3  vNormalW;
    varying vec3  vPosW;

    void main() {
      vec3 N = normalize(vNormalW);
      vec3 V = normalize(cameraPosition - vPosW);
      if (dot(N, V) < 0.0) N = -N;

      // ---- 三盏方向光 ----
      vec3 L1 = normalize(vec3( 0.55, 1.00,  0.62));
      vec3 L2 = normalize(vec3(-0.80, 0.32, -0.55));
      vec3 L3 = normalize(vec3( 0.22, -0.75, 0.80));

      float d1 = max(dot(N, L1), 0.0);
      float d2 = max(dot(N, L2), 0.0);
      float d3 = max(dot(N, L3), 0.0);

      // ---- 渐变基色 ----
      float u = clamp(vU, 0.0, 1.0);
      vec3 base = mix(uColA, uColB, smoothstep(0.0, 0.82, u));
      base = mix(base, uColC, smoothstep(0.58, 1.0, u));

      vec3 col = base * (0.20 + 0.92 * d1);
      col += base * vec3(0.72, 0.50, 1.00) * d2 * 0.48;
      col += base * vec3(1.00, 0.72, 0.52) * d3 * 0.30;

      // ---- 高光 ----
      vec3 H1 = normalize(L1 + V);
      float spec = pow(max(dot(N, H1), 0.0), 62.0);
      col += vec3(1.0, 0.92, 0.96) * spec * 0.80;

      vec3 H2 = normalize(L2 + V);
      float spec2 = pow(max(dot(N, H2), 0.0), 26.0);
      col += vec3(1.0, 0.55, 0.85) * spec2 * 0.28;

      // ---- 菲涅尔边缘辉光 ----
      float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      col += vec3(1.0, 0.38, 0.74) * fres * 0.62;

      // ---- 悬停花瓣高亮 ----
      float hi = step(abs(vPetal - uHoverPetal), 0.5) * uHoverAmt;
      col += vec3(1.0, 0.86, 0.52) * hi * (0.38 + 0.75 * fres);
      col += base * hi * 0.55;

      // ---- 呼吸微脉动 ----
      col *= 1.0 + 0.045 * sin(uTime * 1.9 + vTheta * 4.0);

      gl_FragColor = vec4(col, 1.0);

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
});

/* =========================================================
   4. 网格
   ========================================================= */
const mesh = new THREE.Mesh(new THREE.BufferGeometry(), roseMaterial);
mesh.frustumCulled = false;
scene.add(mesh);

function rebuild() {
  const old = mesh.geometry;
  mesh.geometry = buildRoseGeometry(state.k, state.amp, state.width);
  if (old) old.dispose();
  controls.target.y = state.amp * 0.36;
}
rebuild();

/* =========================================================
   5. 环境光尘
   ========================================================= */
(function makeDust() {
  const N = 520;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();

  for (let i = 0; i < N; i++) {
    const r = 7 + Math.random() * 17;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = (Math.random() - 0.25) * 16;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);

    c.setHSL(0.90 + Math.random() * 0.09, 0.75, 0.55 + Math.random() * 0.3);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const m = new THREE.PointsMaterial({
    size: 0.055,
    vertexColors: true,
    transparent: true,
    opacity: 0.75,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  const pts = new THREE.Points(g, m);
  scene.add(pts);

  // 缓慢自转
  window.__dust = pts;
})();

/* =========================================================
   6. 音频系统（Web Audio）
   ========================================================= */
let actx = null;
let master = null;
let noiseGain = null;
let noiseFilter = null;
let audioReady = false;

function ensureAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  actx = new AC();
  if (actx.state === 'suspended') actx.resume();

  master = actx.createGain();
  master.gain.value = 0.5;
  master.connect(actx.destination);

  // ---- 噪声缓冲（旋转沙沙声） ----
  const len = Math.floor(actx.sampleRate * 2.5);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;
    d[i] = last * 3.2;
  }

  const src = actx.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  noiseFilter = actx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 2400;
  noiseFilter.Q.value = 0.85;

  const hp = actx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 900;

  noiseGain = actx.createGain();
  noiseGain.gain.value = 0.0001;

  src.connect(hp).connect(noiseFilter).connect(noiseGain).connect(master);
  src.start();

  audioReady = true;
}

/* ---- 点击分瓣：花瓣轻放的清脆确认音 ---- */
const PENTA = [0, 2, 4, 7, 9];

function playPetalClick(petalIdx) {
  if (!audioReady) return;
  const now = actx.currentTime;

  const safe = ((petalIdx % 60) + 60) % 60;
  const oct = Math.floor(safe / 5) % 3;
  const semi = PENTA[safe % 5] + 12 * oct;
  const f = 523.25 * Math.pow(2, semi / 12);

  // 主音（三角波，带微小上扬）
  const o1 = actx.createOscillator();
  o1.type = 'triangle';
  o1.frequency.setValueAtTime(f * 1.035, now);
  o1.frequency.exponentialRampToValueAtTime(f, now + 0.055);

  const g1 = actx.createGain();
  g1.gain.setValueAtTime(0.0001, now);
  g1.gain.exponentialRampToValueAtTime(0.34, now + 0.006);
  g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);

  // 泛音（正弦，短促）
  const o2 = actx.createOscillator();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(f * 2.0, now);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, now);
  g2.gain.exponentialRampToValueAtTime(0.11, now + 0.006);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);

  // 低频垫
  const o3 = actx.createOscillator();
  o3.type = 'sine';
  o3.frequency.setValueAtTime(f * 0.5, now);

  const g3 = actx.createGain();
  g3.gain.setValueAtTime(0.0001, now);
  g3.gain.exponentialRampToValueAtTime(0.10, now + 0.012);
  g3.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

  const shelf = actx.createBiquadFilter();
  shelf.type = 'highshelf';
  shelf.frequency.value = 4200;
  shelf.gain.value = -5;

  o1.connect(g1).connect(shelf);
  o2.connect(g2).connect(shelf);
  o3.connect(g3).connect(shelf);
  shelf.connect(master);

  o1.start(now); o2.start(now); o3.start(now);
  o1.stop(now + 0.85);
  o2.stop(now + 0.45);
  o3.stop(now + 0.65);
}

/* ---- k 变化：上滑 / 下滑音阶梯，音高随 k 上升 ---- */
const K_SEMITONES = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19];

function playKStep(k, ascending) {
  if (!audioReady) return;
  const now = actx.currentTime;

  const idx = Math.max(0, Math.min(K_SEMITONES.length - 1, Math.round(k) - 1));
  const semi = K_SEMITONES[idx];
  const fHigh = 261.63 * Math.pow(2, semi / 12);
  const fLow  = fHigh / 1.5;

  const f0 = ascending ? fLow : fHigh;
  const f1 = ascending ? fHigh : fLow;

  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f1, now + 0.16);

  const osc2 = actx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(f0 * 2, now);
  osc2.frequency.exponentialRampToValueAtTime(f1 * 2, now + 0.16);

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.22, now + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);

  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001, now);
  g2.gain.exponentialRampToValueAtTime(0.07, now + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 5200;

  osc.connect(g).connect(lp);
  osc2.connect(g2).connect(lp);
  lp.connect(master);

  osc.start(now); osc2.start(now);
  osc.stop(now + 0.36); osc2.stop(now + 0.24);
}

/* ---- 旋转沙沙声控制 ---- */
const _sph = new THREE.Spherical();
const _v = new THREE.Vector3();
let prevTheta = null, prevPhi = null;

function updateShuffleSound(dt) {
  if (!audioReady) return;

  _v.subVectors(camera.position, controls.target);
  _sph.setFromVector3(_v);

  if (prevTheta !== null) {
    let dT = _sph.theta - prevTheta;
    if (dT >  Math.PI) dT -= Math.PI * 2;
    if (dT < -Math.PI) dT += Math.PI * 2;
    const dP = _sph.phi - prevPhi;

    const safeDt = Math.max(dt, 0.001);
    const speed = (Math.abs(dT) + Math.abs(dP)) / safeDt; // rad/s

    const targetGain = Math.min(speed / 5.5, 1) * 0.17;
    const targetFreq = 1600 + Math.min(speed / 5.5, 1) * 3400;

    const now = actx.currentTime;
    noiseGain.gain.setTargetAtTime(targetGain, now, 0.055);
    noiseFilter.frequency.setTargetAtTime(targetFreq, now, 0.09);
  }

  prevTheta = _sph.theta;
  prevPhi = _sph.phi;
}

/* =========================================================
   7. 交互：指针 / 拾取 / 悬停
   ========================================================= */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(-10, -10);
const pointerScreen = { x: -1000, y: -1000 };

let isDragging = false;
let downPos = { x: 0, y: 0 };
let downTime = 0;

let hoverPetal = -9999;
let hoverAmt = 0;
let hoverAmtTarget = 0;

const el = renderer.domElement;

el.addEventListener('pointermove', (e) => {
  const rect = el.getBoundingClientRect();
  pointerScreen.x = e.clientX;
  pointerScreen.y = e.clientY;
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
});

el.addEventListener('pointerleave', () => {
  pointerNDC.set(-10, -10);
  hoverAmtTarget = 0;
  hoverPetal = -9999;
  clearReadout();
});

el.addEventListener('pointerdown', (e) => {
  ensureAudio();
  isDragging = true;
  downPos.x = e.clientX;
  downPos.y = e.clientY;
  downTime = performance.now();
  hoverAmtTarget = 0;
});

el.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const elapsed = performance.now() - downTime;
  isDragging = false;

  // 视为「点击」——播放分瓣确认音
  if (moved < 6 && elapsed < 600) {
    ensureAudio();
    // 用当前指针重新拾取
    const rect = el.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(mesh, false);
    if (hits.length > 0 && hits[0].face) {
      const petalArr = mesh.geometry.attributes.aPetal.array;
      const pid = petalArr[hits[0].face.a];
      playPetalClick(pid);
    }
  }
});

/* ---- 把物理极角还原为参数域 θ ---- */
function resolveParamTheta(thetaA, k, odd) {
  if (!odd) return thetaA;

  const TWO_PI = Math.PI * 2;
  const cands = [thetaA, thetaA - Math.PI, thetaA + Math.PI];

  for (let c of cands) {
    if (c < -1e-4 || c > Math.PI + 1e-4) continue;
    c = Math.max(0, Math.min(Math.PI, c));
    const s = Math.sin(k * c);
    let phys = (s >= 0) ? c : c + Math.PI;
    phys = ((phys % TWO_PI) + TWO_PI) % TWO_PI;

    let diff = Math.abs(phys - thetaA);
    diff = Math.min(diff, TWO_PI - diff);
    if (diff < 0.03) return c;
  }
  return thetaA;
}

/* ---- 读数 DOM ---- */
const roTheta = document.getElementById('roTheta');
const roR = document.getElementById('roR');
const roRho = document.getElementById('roRho');
const roPetal = document.getElementById('roPetal');

function clearReadout() {
  roTheta.textContent = '—';
  roR.textContent = '—';
  roRho.textContent = '—';
  roPetal.textContent = '—';
}

/* ---- 每帧拾取 ---- */
function updateHover() {
  if (isDragging) {
    hoverAmtTarget = 0;
    return;
  }

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(mesh, false);

  if (hits.length === 0 || !hits[0].face) {
    hoverAmtTarget = 0;
    hoverPetal = -9999;
    clearReadout();
    return;
  }

  const hit = hits[0];
  const petalArr = mesh.geometry.attributes.aPetal.array;
  const pid = petalArr[hit.face.a];

  hoverPetal = pid;
  hoverAmtTarget = 1;

  const p = hit.point;
  const rho = Math.hypot(p.x, p.z);

  let thetaA = Math.atan2(p.z, p.x);
  if (thetaA < 0) thetaA += Math.PI * 2;

  const odd = (Math.abs(state.k % 2) === 1);
  const thetaP = resolveParamTheta(thetaA, state.k, odd);

  const rFormula = state.amp * Math.sin(state.k * thetaP);

  roTheta.textContent = `${thetaP.toFixed(3)} rad / ${(thetaP * 180 / Math.PI).toFixed(1)}°`;
  roR.textContent = `${rFormula >= 0 ? ' ' : ''}${rFormula.toFixed(3)}`;
  roRho.textContent = rho.toFixed(3);
  roPetal.textContent = `#${pid + 1}`;
}

/* =========================================================
   8. UI 绑定
   ========================================================= */
const sliderK = document.getElementById('sliderK');
const sliderA = document.getElementById('sliderA');
const sliderW = document.getElementById('sliderW');
const valK = document.getElementById('valK');
const valA = document.getElementById('valA');
const valW = document.getElementById('valW');

let lastK = state.k;

sliderK.addEventListener('input', () => {
  ensureAudio();
  const newK = parseInt(sliderK.value, 10);
  const ascending = newK > lastK;
  if (newK !== lastK) {
    playKStep(newK, ascending);
    lastK = newK;
  }
  state.k = newK;
  valK.textContent = String(newK);
  needsRebuild = true;
});

sliderA.addEventListener('input', () => {
  ensureAudio();
  state.amp = parseFloat(sliderA.value);
  valA.textContent = state.amp.toFixed(2);
  needsRebuild = true;
});

sliderW.addEventListener('input', () => {
  ensureAudio();
  state.width = parseFloat(sliderW.value);
  valW.textContent = state.width.toFixed(2);
  needsRebuild = true;
});

/* =========================================================
   9. 尺寸自适应
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* =========================================================
   10. 主循环
   ========================================================= */
let lastT = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;

  // 延迟重建（避免滑块拖动时每帧多次重建）
  if (needsRebuild) {
    needsRebuild = false;
    rebuild();
  }

  controls.update();

  // 时间 uniform
  uniforms.uTime.value += dt;

  // 悬停平滑
  hoverAmt += (hoverAmtTarget - hoverAmt) * Math.min(1, dt * 11);
  uniforms.uHoverAmt.value = hoverAmt;
  uniforms.uHoverPetal.value = hoverPetal;

  // 拾取
  updateHover();

  // 旋转沙沙声
  updateShuffleSound(dt);

  // 光尘缓慢自转
  if (window.__dust) {
    window.__dust.rotation.y += dt * 0.018;
    window.__dust.rotation.x += dt * 0.006;
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

/* =========================================================
   11. 首次交互解锁音频
   ========================================================= */
['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, () => {
    ensureAudio();
    if (actx && actx.state === 'suspended') actx.resume();
  }, { once: true });
});
</script>
