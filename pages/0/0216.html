<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面斜驶线 · 恒定方位角网络</title>
    <style>
        :root {
            --bg: #020408;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay .title {
            font-size: clamp(1.0rem, 2.2vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.09em;
            color: #cfc7b5;
            text-shadow: 0 0 42px rgba(200, 180, 150, 0.5), 0 0 72px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.5rem, 0.9vw, 0.66rem);
            font-weight: 300;
            letter-spacing: 0.13em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }
        #formula-overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(2, 4, 8, 0.7);
            padding: 11px 23px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            max-width: 95vw;
        }
        #formula-overlay .formula {
            font-size: clamp(0.44rem, 0.8vw, 0.64rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.27);
            line-height: 1.55;
            white-space: nowrap;
        }
        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }
        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 12px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.38rem;
                white-space: normal;
                line-height: 1.35;
            }
            #title-overlay .title {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <div class="title">球面斜驶线 · 恒定方位角网络</div>
        <div class="subtitle">LOXODROMES &nbsp;·&nbsp; CONSTANT BEARING SPHERE</div>
    </div>
    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">α₁=25°</span> &nbsp; λ=λ₀+tanα·ln(tan(π/4+φ/2)) &nbsp;
            <span class="c2">α₂=50°</span> &nbsp;
            <span class="c3">α₃=70°</span>
            <br>
            <span style="color:#9aa8b8;">φ∈[−75°,75°] &nbsp;|&nbsp; 36条斜驶线 &nbsp;|&nbsp; 球面半径R=2.7</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#020408');
        scene.fog = new THREE.Fog('#020408', 6, 16);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / Math.max(container.clientHeight, 1), 0.3, 22);
        camera.position.set(1.4, 0.7, 6.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const C1 = '#d4885c'; // 暖金 – 25°
        const C2 = '#5d9ec6'; // 冰蓝 – 50°
        const C3 = '#c77d9f'; // 玫瑰粉 – 70°
        const C_FRAME = '#3a4a5c';
        const C_GLINT = '#8898aa';

        const SPHERE_R = 2.7;
        const PHI_MIN = -75 * Math.PI / 180;
        const PHI_MAX = 75 * Math.PI / 180;
        const NUM_SAMPLES = 320;

        // ==================== 斜驶线生成函数 ====================
        /**
         * 球面斜驶线 (loxodrome) 上的点
         * @param {number} lambda0 - 起始经度
         * @param {number} alpha - 恒方位角 (弧度)
         * @returns {THREE.Vector3[]} 点数组
         */
        function loxodromePoints(lambda0, alpha) {
            const points = [];
            const dPhi = (PHI_MAX - PHI_MIN) / NUM_SAMPLES;
            for (let i = 0; i <= NUM_SAMPLES; i++) {
                const phi = PHI_MIN + i * dPhi;
                const theta = Math.PI / 2 - phi; // 转换到极角 (从z轴正向)
                const lambda = lambda0 + Math.tan(alpha) * Math.log(Math.tan(Math.PI / 4 + phi / 2));
                const x = SPHERE_R * Math.sin(theta) * Math.cos(lambda);
                const y = SPHERE_R * Math.cos(theta);
                const z = SPHERE_R * Math.sin(theta) * Math.sin(lambda);
                points.push(new THREE.Vector3(x, y, z));
            }
            return points;
        }

        // ==================== 创建一组斜驶线 ====================
        function createLoxodromeGroup(alphaDeg, colorHex, numCurves, opacity) {
            const group = new THREE.Group();
            const alpha = alphaDeg * Math.PI / 180;
            for (let k = 0; k < numCurves; k++) {
                const lambda0 = (k / numCurves) * Math.PI * 2;
                const pts = loxodromePoints(lambda0, alpha);
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                const line = new THREE.Line(geom, mat);
                group.add(line);
            }
            return group;
        }

        console.log('生成斜驶线组...');
        const group25 = createLoxodromeGroup(25, C1, 12, 0.65);
        const group50 = createLoxodromeGroup(50, C2, 12, 0.62);
        const group70 = createLoxodromeGroup(70, C3, 12, 0.63);

        const mainGroup = new THREE.Group();
        mainGroup.add(group25);
        mainGroup.add(group50);
        mainGroup.add(group70);
        scene.add(mainGroup);

        // ==================== 参考球面线框 ====================
        function createSphereWireframe(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segs = 160;
            // 三个正交大圆
            const circleDefs = [
                (a) => new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0),
                (a) => new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius),
                (a) => new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius),
            ];
            for (const gen of circleDefs) {
                const pts = [];
                for (let i = 0; i <= segs; i++) pts.push(gen((i / segs) * Math.PI * 2));
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            // 两条纬线
            for (const z of [-radius * 0.55, radius * 0.55]) {
                const r = Math.sqrt(Math.max(0, radius * radius - z * z));
                if (r > 0.02) {
                    const pts = [];
                    for (let i = 0; i <= segs; i++) {
                        const a = (i / segs) * Math.PI * 2;
                        pts.push(new THREE.Vector3(Math.cos(a) * r, z, Math.sin(a) * r));
                    }
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color: new THREE.Color(colorHex),
                        transparent: true,
                        opacity: opacity * 0.7,
                        depthWrite: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }
        const sphereRef = createSphereWireframe(SPHERE_R, C_FRAME, 0.22);
        scene.add(sphereRef);

        // ==================== 原点光点 ====================
        function createOriginGlint() {
            const group = new THREE.Group();
            const sz = 0.1;
            const pairs = [
                [new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0)],
                [new THREE.Vector3(0, -sz, 0), new THREE.Vector3(0, sz, 0)],
                [new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz)],
            ];
            for (const [a, b] of pairs) {
                const g = new THREE.BufferGeometry().setFromPoints([a, b]);
                const m = new THREE.LineBasicMaterial({
                    color: new THREE.Color(C_GLINT),
                    transparent: true,
                    opacity: 0.7,
                    depthWrite: true,
                });
                group.add(new THREE.Line(g, m));
            }
            return group;
        }
        scene.add(createOriginGlint());

        // ==================== 动画循环 (绝对时间) ====================
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let logTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            let delta = (now - lastTime) / 1000;
            if (delta <= 0 || delta > 0.5) delta = 0.016;
            lastTime = now;
            time += delta;
            frameCount++;
            if (now - logTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${time.toFixed(2)}s`);
                logTime = now;
            }

            // 主球体绕对角线旋转
            mainGroup.rotation.y = time * 0.32;
            mainGroup.rotation.x = time * 0.18 + Math.sin(time * 0.22) * 0.2;
            mainGroup.rotation.z = Math.cos(time * 0.19) * 0.17;

            // 参考球面同步微调（也可以独立旋转）
            sphereRef.rotation.copy(mainGroup.rotation);

            // 相机轻柔游走
            const camX = 1.4 + Math.sin(time * 0.14) * 0.55;
            const camY = 0.7 + Math.cos(time * 0.18) * 0.45;
            const camZ = 6.8 + Math.sin(time * 0.11) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 100));

        // ==================== 启动 ====================
        console.log('=== 球面斜驶线 · 恒定方位角网络 ===');
        console.log('斜驶线总数:', 36);
        console.log('球面半径:', SPHERE_R, '纬度范围: ±75°');
        console.log('✅ 初始帧渲染完成，启动绝对时间动画循环...');

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
