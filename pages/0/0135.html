<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球面等角螺线 · Möbius反演对偶 · Loxodrome编织</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d6a745;
            --cyan: #3cbca4;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 1.6vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.62rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }

        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }

        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.85rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }

        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.54rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }

        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3cbca4;
        }
        .accent-rose {
            color: #d94050;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>球面等角螺线 · Möbius反演对偶 · Loxodrome编织</h1>
        <div class="subtitle">cot(α)·dφ = sin(θ)·dθ &nbsp;·&nbsp; 逆球极投影 &nbsp;·&nbsp; 反演球面交织</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">θ(φ)=2arctan(e^{φ·tanα})</span>
            &nbsp;⊗&nbsp;
            <span class="accent-cyan">σ:p↦R²·p/|p|²</span>
            &nbsp;⊗&nbsp;
            <span class="accent-rose">π⁻¹∘σ∘π</span>
        </div>
        <div class="formula-detail">
            球面等角螺线（loxodrome）方程 &nbsp;·&nbsp; 球面反演自同构 &nbsp;·&nbsp; 恒向线与反演对偶在S²上共舞
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 30);
        camera.position.set(2.4, 1.4, 7.6);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3cbca4');
        const colorRose = new THREE.Color('#d94050');

        const CLAMP_RADIUS = 2.75;
        const SPHERE_RADIUS = 2.5;
        const INVERSION_RADIUS = 2.3;

        // ==================== 背景星点 ====================
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 180;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const rad = 5.3 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
            starPos[i * 3 + 2] = rad * Math.cos(phi);
            starSizes[i] = Math.random() * 1.6 + 0.22;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.018,
            transparent: true,
            opacity: 0.46,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 50, 34);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.07, depthWrite: false })
        );
        scene.add(refSphereWire);

        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 28);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.06, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ==================== 工具函数 ====================
        function clampToSphere(pt, maxR = CLAMP_RADIUS) {
            const r = Math.sqrt(pt[0] ** 2 + pt[1] ** 2 + pt[2] ** 2);
            if (r > maxR && r > 0.001) {
                const sc = maxR / r;
                return [pt[0] * sc, pt[1] * sc, pt[2] * sc];
            }
            return pt;
        }

        // 球面反演：p → R²·p/|p|²
        function invertPoint(pt, R = INVERSION_RADIUS) {
            const r2 = pt[0] ** 2 + pt[1] ** 2 + pt[2] ** 2;
            if (r2 < 1e-9) return [...pt];
            const scale = (R * R) / r2;
            return [pt[0] * scale, pt[1] * scale, pt[2] * scale];
        }

        // SO(3)旋转矩阵（绕随时间的轴旋转）
        function so3Rotation(t) {
            const ax = Math.cos(t * 0.17) * 0.55;
            const ay = Math.sin(t * 0.13) * 0.5;
            const az = Math.cos(t * 0.19 + 1.3) * 0.45;
            const n = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
            const ux = ax / n,
                uy = ay / n,
                uz = az / n;
            const angle = t * 0.28 + 0.6;
            const c = Math.cos(angle),
                s = Math.sin(angle);
            const t1 = 1 - c;
            return [
                c + ux * ux * t1,
                ux * uy * t1 - uz * s,
                ux * uz * t1 + uy * s,
                uy * ux * t1 + uz * s,
                c + uy * uy * t1,
                uy * uz * t1 - ux * s,
                uz * ux * t1 - uy * s,
                uz * uy * t1 + ux * s,
                c + uz * uz * t1,
            ];
        }

        function applySO3(pt, Rmat) {
            return [
                Rmat[0] * pt[0] + Rmat[1] * pt[1] + Rmat[2] * pt[2],
                Rmat[3] * pt[0] + Rmat[4] * pt[1] + Rmat[5] * pt[2],
                Rmat[6] * pt[0] + Rmat[7] * pt[1] + Rmat[8] * pt[2],
            ];
        }

        // 球面loxodrome采样点
        function sampleLoxodrome(alpha, phi0, phiRange, numPoints) {
            const pts = [];
            const tanAlpha = Math.tan(alpha);
            const phiMin = phi0 - phiRange / 2;
            const phiMax = phi0 + phiRange / 2;
            for (let i = 0; i < numPoints; i++) {
                const phi = phiMin + (i / (numPoints - 1)) * (phiMax - phiMin);
                const theta = 2 * Math.atan(Math.exp(phi * tanAlpha));
                const st = Math.sin(theta);
                const x = SPHERE_RADIUS * st * Math.cos(phi);
                const y = SPHERE_RADIUS * st * Math.sin(phi);
                const z = SPHERE_RADIUS * Math.cos(theta);
                pts.push([x, y, z]);
            }
            return pts;
        }

        // ==================== 曲线系统 ====================
        const allCurves = [];
        const POINTS_PER_CURVE = 160;

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            for (let i = 0; i < POINTS_PER_CURVE; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.35;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.35;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.35;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.83,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geometry: geom, positions };
            allCurves.push(obj);
            return obj;
        }

        // 构建loxodrome族
        function buildLoxoFamily(count, baseAlpha, color, phiRange) {
            for (let k = 0; k < count; k++) {
                const alpha = baseAlpha + (k - count / 2) * 0.04;
                const phi0 = (k / count) * Math.PI * 2 + Math.random() * 0.3;
                const curve = createCurve(color);
                curve.alpha = alpha;
                curve.phi0 = phi0;
                curve.phiRange = phiRange;
                curve.isLoxo = true;
            }
        }

        // 构建反演对偶族
        function buildInvertedFamily(count, baseAlpha, color, phiRange) {
            for (let k = 0; k < count; k++) {
                const alpha = baseAlpha + (k - count / 2) * 0.05;
                const phi0 = (k / count) * Math.PI * 2 + Math.random() * 0.5;
                const curve = createCurve(color);
                curve.alpha = alpha;
                curve.phi0 = phi0;
                curve.phiRange = phiRange;
                curve.isInverted = true;
            }
        }

        // 金色：α≈58°的loxodrome（20条）
        buildLoxoFamily(20, 1.01, colorGold, 7.5);
        // 青色：α≈68°的loxodrome（20条）
        buildLoxoFamily(20, 1.19, colorCyan, 6.8);
        // 玫红：α≈40°的loxodrome（20条）
        buildLoxoFamily(20, 0.70, colorRose, 8.5);

        // 反演对偶：各6条
        buildInvertedFamily(6, 0.95, colorGold, 7.0);
        buildInvertedFamily(6, 1.12, colorCyan, 6.5);
        buildInvertedFamily(6, 0.65, colorRose, 8.0);

        // 额外三叶结点缀
        for (let e = 0; e < 4; e++) {
            const c = [colorCyan, colorRose, colorGold, colorCyan][e];
            const curve = createCurve(c);
            curve.isExtra = true;
            curve.amp = 1.2 + e * 0.16;
            curve.freq = 1.7 + e * 0.22;
            curve.ph = e * 1.25;
        }

        console.log(`✅ 曲线总数: ${allCurves.length} (loxo:60, 反演:18, 点缀:4)`);

        // ==================== 更新所有曲线 ====================
        function updateAllCurves(t) {
            const Rmat = so3Rotation(t);
            for (let c = 0; c < allCurves.length; c++) {
                try {
                    const curve = allCurves[c];
                    const positions = curve.positions;
                    if (curve.isExtra) {
                        const amp = curve.amp;
                        const freq = curve.freq;
                        const ph = curve.ph;
                        for (let i = 0; i < POINTS_PER_CURVE; i++) {
                            const s = (i / POINTS_PER_CURVE) * Math.PI * 2;
                            const inner = s * freq + t * 0.45 + ph;
                            let x = amp * (Math.sin(inner) + 0.48 * Math.sin(3 * inner)) * 0.8;
                            let y = amp * (Math.cos(inner) - 0.38 * Math.cos(2 * inner)) * 0.8;
                            let z = amp * 0.58 * Math.sin(2 * inner + t * 0.3);
                            const r = Math.sqrt(x * x + y * y + z * z);
                            if (r > CLAMP_RADIUS && r > 0.001) {
                                const sc = CLAMP_RADIUS / r;
                                x *= sc;
                                y *= sc;
                                z *= sc;
                            }
                            positions[i * 3] = x;
                            positions[i * 3 + 1] = y;
                            positions[i * 3 + 2] = z;
                        }
                    } else if (curve.isLoxo || curve.isInverted) {
                        const alpha = curve.alpha + 0.06 * Math.sin(t * 0.22 + curve.phi0);
                        const phi0 = curve.phi0 + t * 0.15;
                        const pts = sampleLoxodrome(alpha, phi0, curve.phiRange, POINTS_PER_CURVE);
                        for (let i = 0; i < POINTS_PER_CURVE; i++) {
                            let p = applySO3(pts[i], Rmat);
                            if (curve.isInverted) {
                                p = invertPoint(p, INVERSION_RADIUS);
                            }
                            p = clampToSphere(p, CLAMP_RADIUS);
                            positions[i * 3] = p[0];
                            positions[i * 3 + 1] = p[1];
                            positions[i * 3 + 2] = p[2];
                        }
                    }
                    curve.geometry.attributes.position.needsUpdate = true;
                } catch (e) {
                    console.warn(`曲线${c}更新异常, 已跳过`, e);
                }
            }
        }

        // ==================== 流动粒子 ====================
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            const ci = i % allCurves.length;
            particleData.push({
                curveIndex: ci,
                progress: Math.random(),
                speed: 0.0005 + Math.random() * 0.0022,
            });
            let col;
            if (i < 7) col = colorGold.clone();
            else if (i < 14) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
            particlePosArr[i * 3] = (Math.random() - 0.5) * 0.28;
            particlePosArr[i * 3 + 1] = (Math.random() - 0.5) * 0.28;
            particlePosArr[i * 3 + 2] = (Math.random() - 0.5) * 0.28;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.048,
            vertexColors: true,
            transparent: true,
            opacity: 0.84,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            try {
                for (let p = 0; p < particleCount; p++) {
                    const pd = particleData[p];
                    pd.progress += pd.speed;
                    if (pd.progress >= 1.0) pd.progress -= 1.0;
                    if (pd.progress < 0) pd.progress += 1.0;
                    const curveObj = allCurves[pd.curveIndex];
                    if (!curveObj || !curveObj.positions) continue;
                    const posArr = curveObj.positions;
                    const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                    const idx0 = Math.floor(floatIdx);
                    const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                    const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                    const i0 = idx0 * 3,
                        i1 = idx1 * 3;
                    particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                    particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                    particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
                }
                particlesGeom.attributes.position.needsUpdate = true;
            } catch (e) {
                console.warn('粒子更新异常, 已跳过', e);
            }
        }

        // ==================== 极度健壮的动画循环 ====================
        const clock = new THREE.Clock();
        let animationTime = 0;
        let frameCount = 0;
        let lastLogTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            try {
                let dt = clock.getDelta();
                if (dt <= 0 || dt > 0.25 || !isFinite(dt)) dt = 0.016;
                animationTime += dt;
                frameCount++;

                const now = performance.now();
                if (now - lastLogTime > 5000) {
                    const elapsed = (now - lastLogTime) / 1000;
                    const fps = Math.round(frameCount / elapsed);
                    console.log(
                        `🔄 运行中 | FPS: ${fps} | 时间: ${animationTime.toFixed(1)}s | dt: ${(dt * 1000).toFixed(1)}ms`
                    );
                    frameCount = 0;
                    lastLogTime = now;
                }

                updateAllCurves(animationTime);
                updateParticles();

                const breathe = 1 + 0.04 * Math.sin(animationTime * 0.38) * Math.cos(animationTime * 0.28);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.055;
                refSphereWire.rotation.y += dt * 0.045;

                refTorusWire.rotation.z += dt * 0.055;
                const torBreathe = 1 + 0.05 * Math.sin(animationTime * 0.42) * Math.cos(animationTime * 0.31);
                refTorusWire.scale.setScalar(torBreathe);

                const camH = animationTime * 0.09;
                const camV = 0.33 + 0.17 * Math.sin(animationTime * 0.14);
                const camD = 7.4 + 0.6 * Math.sin(animationTime * 0.19) * Math.cos(animationTime * 0.25);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.05 * Math.sin(animationTime * 0.09), 0.03 * Math.cos(animationTime * 0.12), 0);

                stars.rotation.y += dt * 0.013;
                stars.rotation.x += dt * 0.009;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画主循环异常, 循环仍继续:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                clock.getDelta();
            }
        });

        // ==================== 启动 ====================
        console.log('🚀 球面等角螺线·反演对偶动画初始化... 预渲染第一帧');
        updateAllCurves(0);
        updateParticles();
        renderer.render(scene, camera);
        clock.start();
        animationTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动，82条球面loxodrome与反演对偶持续编织');
    </script>
</body>
</html>
