<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL(2,ℝ)伴随轨道编织 · 李代数作用 · 双曲与抛物交织</title>
    <style>
        :root {
            --bg: #04040e;
            --gold: #d6a745;
            --cyan: #3dbca5;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.6rem);
            letter-spacing: 0.22em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 4, 14, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.82rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.52rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3dbca5;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title-overlay">
        <h1>SL(2,ℝ)伴随轨道编织 · 李代数作用 · 双曲与抛物交织</h1>
        <div class="subtitle">Ad_{exp(tX)}(v₀) 轨道族 &nbsp;·&nbsp; 三种共轭类曲线 &nbsp;·&nbsp; 球极投影</div>
    </div>
    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">Ad_{e^{tH}}(v₀)</span>
            ⊗ <span class="accent-cyan">Ad_{e^{tE}}(v₀)</span>
            ⊗ <span class="accent-rose">Ad_{e^{tF}}(v₀)</span>
        </div>
        <div class="formula-detail">
            SL(2,ℝ)伴随表示 · H双曲/E抛物/F抛物生成元 · 初始向量v₀球面分布 · 动态编织
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x04040e, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.3, 1.4, 7.8);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3dbca5');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // 背景星点
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 130;
        const starPosA = new Float32Array(starCount * 3);
        const starSizesA = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.4 + Math.random() * 8.4;
            starPosA[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPosA[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPosA[i * 3 + 2] = rad * Math.cos(ph);
            starSizesA[i] = Math.random() * 1.5 + 0.2;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPosA, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizesA, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.018,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 48, 32);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.06, depthWrite: false })
        );
        scene.add(refSphereWire);
        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 26);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.05, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- SL(2,R) 工具 ----------
        function matMul(A, B) {
            return [
                [A[0][0] * B[0][0] + A[0][1] * B[1][0], A[0][0] * B[0][1] + A[0][1] * B[1][1]],
                [A[1][0] * B[0][0] + A[1][1] * B[1][0], A[1][0] * B[0][1] + A[1][1] * B[1][1]],
            ];
        }
        function matInv(g) {
            return [
                [g[1][1], -g[0][1]],
                [-g[1][0], g[0][0]]
            ];
        }
        // sl(2,R)矩阵 (迹零) 到三维坐标：[[u,v],[w,-u]] -> (u, (v+w)/2, (v-w)/2)
        function sl2toVec3(X) {
            return [X[0][0], (X[0][1] + X[1][0]) / 2, (X[0][1] - X[1][0]) / 2];
        }
        function vec3toSl2(v) {
            return [
                [v[0], v[1] + v[2]],
                [v[1] - v[2], -v[0]]
            ];
        }
        // 伴随作用 Ad_g(X) = g X g^{-1}
        function adjoint(g, X) {
            return matMul(matMul(g, X), matInv(g));
        }

        // 单参数子群
        function expH(t) { return [
                [Math.exp(t), 0],
                [0, Math.exp(-t)]
            ]; }
        function expE(t) { return [
                [1, t],
                [0, 1]
            ]; }
        function expF(t) { return [
                [1, 0],
                [t, 1]
            ]; }

        // ---------- 生成初始种子向量 v₀ ----------
        function randomSeedVec(radius) {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;
            return [
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.sin(phi) * Math.sin(theta),
                radius * Math.cos(phi),
            ];
        }

        // SO(3)旋转
        function so3Matrix(t) {
            const angle = t * 0.22;
            const ax = Math.cos(t * 0.17) * 0.5;
            const ay = Math.sin(t * 0.13) * 0.45;
            const az = Math.cos(t * 0.2 + 1.2) * 0.5;
            const n = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
            const ux = ax / n,
                uy = ay / n,
                uz = az / n;
            const c = Math.cos(angle),
                s = Math.sin(angle),
                t1 = 1 - c;
            return [
                c + ux * ux * t1,
                ux * uy * t1 - uz * s,
                ux * uz * t1 + uy * s,
                uy * ux * t1 + uz * s,
                c + uy * uy * t1,
                uy * uz * t1 - ux * s,
                uz * ux * t1 - uy * s,
                uz * uy * t1 + ux * s,
                c + uz * uz * t1,
            ];
        }

        function applyRot(pt, R) {
            return [
                R[0] * pt[0] + R[1] * pt[1] + R[2] * pt[2],
                R[3] * pt[0] + R[4] * pt[1] + R[5] * pt[2],
                R[6] * pt[0] + R[7] * pt[1] + R[8] * pt[2],
            ];
        }

        function clampPt(p) {
            let [x, y, z] = p;
            if (!Number.isFinite(x)) x = 0;
            if (!Number.isFinite(y)) y = 0;
            if (!Number.isFinite(z)) z = 0;
            const r = Math.sqrt(x * x + y * y + z * z);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const s = CLAMP_RADIUS / r;
                return [x * s, y * s, z * s];
            }
            return [x, y, z];
        }

        // ---------- 曲线数据 ----------
        const CURVES_PER_FAMILY = 25;
        const POINTS_PER_CURVE = 100;
        const totalCurves = CURVES_PER_FAMILY * 3;

        // 预分配三个图层
        function createLayer(color) {
            const totalSegments = totalCurves * POINTS_PER_CURVE;
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(totalSegments * 2 * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.82,
                depthTest: true,
                depthWrite: true,
            });
            const lines = new THREE.LineSegments(geom, mat);
            scene.add(lines);
            return { geom, positions, lines, count: 0, offset: 0 };
        }
        const goldLayer = createLayer(colorGold);
        const cyanLayer = createLayer(colorCyan);
        const roseLayer = createLayer(colorRose);

        // 曲线配置数组
        const curveConfigs = [];

        function addFamily(count, expFn, colorLayer, colorTag) {
            for (let k = 0; k < count; k++) {
                const seed = randomSeedVec(1.5 + Math.random() * 1.2);
                curveConfigs.push({
                    seed,
                    expFn,
                    layer: colorLayer,
                    colorTag,
                    index: k,
                    total: count,
                });
            }
        }
        addFamily(CURVES_PER_FAMILY, expH, goldLayer, 'gold');
        addFamily(CURVES_PER_FAMILY, expE, cyanLayer, 'cyan');
        addFamily(CURVES_PER_FAMILY, expF, roseLayer, 'rose');

        // 为每条曲线在layer中分配段偏移
        let goldOff = 0,
            cyanOff = 0,
            roseOff = 0;
        for (const cfg of curveConfigs) {
            if (cfg.layer === goldLayer) { cfg.segOffset = goldOff;
                goldOff += POINTS_PER_CURVE; } else if (cfg.layer === cyanLayer) { cfg.segOffset = cyanOff;
                cyanOff += POINTS_PER_CURVE; } else { cfg.segOffset = roseOff;
                roseOff += POINTS_PER_CURVE; }
        }

        // ---------- 更新所有曲线 ----------
        function updateAll(elapsed) {
            const R3 = so3Matrix(elapsed);
            // 重置所有图层位置为0（清理残留）
            const totalSlots = CURVES_PER_FAMILY * POINTS_PER_CURVE * 2 * 3;
            for (let i = 0; i < totalSlots; i++) {
                goldLayer.positions[i] = 0;
                cyanLayer.positions[i] = 0;
                roseLayer.positions[i] = 0;
            }

            let goldSegs = 0,
                cyanSegs = 0,
                roseSegs = 0;

            for (const cfg of curveConfigs) {
                try {
                    const positions = cfg.layer.positions;
                    const segOffset = cfg.segOffset;
                    const X0 = vec3toSl2(cfg.seed);
                    const tRange = 3.5;
                    for (let i = 0; i < POINTS_PER_CURVE - 1; i++) {
                        const t0 = -tRange + (i / (POINTS_PER_CURVE - 1)) * 2 * tRange;
                        const t1 = -tRange + ((i + 1) / (POINTS_PER_CURVE - 1)) * 2 * tRange;
                        const g0 = cfg.expFn(t0);
                        const g1 = cfg.expFn(t1);
                        const A0 = adjoint(g0, X0);
                        const A1 = adjoint(g1, X0);
                        let p0 = sl2toVec3(A0);
                        let p1 = sl2toVec3(A1);
                        // 缩放
                        const sc = 2.2;
                        p0 = [p0[0] * sc, p0[1] * sc, p0[2] * sc];
                        p1 = [p1[0] * sc, p1[1] * sc, p1[2] * sc];
                        // SO(3)旋转
                        p0 = applyRot(p0, R3);
                        p1 = applyRot(p1, R3);
                        // 钳制
                        p0 = clampPt(p0);
                        p1 = clampPt(p1);
                        const base = (segOffset + i) * 6;
                        positions[base] = p0[0];
                        positions[base + 1] = p0[1];
                        positions[base + 2] = p0[2];
                        positions[base + 3] = p1[0];
                        positions[base + 4] = p1[1];
                        positions[base + 5] = p1[2];
                    }
                    if (cfg.layer === goldLayer) goldSegs = Math.max(goldSegs, segOffset + POINTS_PER_CURVE);
                    else if (cfg.layer === cyanLayer) cyanSegs = Math.max(cyanSegs, segOffset + POINTS_PER_CURVE);
                    else roseSegs = Math.max(roseSegs, segOffset + POINTS_PER_CURVE);
                } catch (e) {}
            }

            goldLayer.geom.setDrawRange(0, goldSegs * 2);
            goldLayer.geom.attributes.position.needsUpdate = true;
            cyanLayer.geom.setDrawRange(0, cyanSegs * 2);
            cyanLayer.geom.attributes.position.needsUpdate = true;
            roseLayer.geom.setDrawRange(0, roseSegs * 2);
            roseLayer.geom.attributes.position.needsUpdate = true;
        }

        // ---------- 粒子 ----------
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                cfgIndex: i % curveConfigs.length,
                progress: Math.random(),
                speed: 0.0004 + Math.random() * 0.002,
            });
            const col = i < 7 ? colorGold : i < 14 ? colorCyan : colorRose;
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.045,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles(elapsed) {
            const R3 = so3Matrix(elapsed);
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const cfg = curveConfigs[pd.cfgIndex];
                const tRange = 3.5;
                const tVal = -tRange + pd.progress * 2 * tRange;
                const g = cfg.expFn(tVal);
                const X0 = vec3toSl2(cfg.seed);
                const A = adjoint(g, X0);
                let pt = sl2toVec3(A);
                const sc = 2.2;
                pt = [pt[0] * sc, pt[1] * sc, pt[2] * sc];
                pt = applyRot(pt, R3);
                pt = clampPt(pt);
                particlePosArr[p * 3] = pt[0];
                particlePosArr[p * 3 + 1] = pt[1];
                particlePosArr[p * 3 + 2] = pt[2];
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // ---------- 动画循环（绝对时间） ----------
        const startTime = performance.now();
        let frameCount = 0,
            lastLogTime = startTime;

        function animate(nowTS) {
            requestAnimationFrame(animate);
            try {
                const now = nowTS || performance.now();
                const elapsed = (now - startTime) / 1000;
                frameCount++;
                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${elapsed.toFixed(1)}s`);
                    frameCount = 0;
                    lastLogTime = now;
                }
                updateAll(elapsed);
                updateParticles(elapsed);

                const breathe = 1 + 0.04 * Math.sin(elapsed * 0.38);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += 0.0008;
                refSphereWire.rotation.y += 0.0007;
                refTorusWire.rotation.z += 0.0008;
                refTorusWire.scale.setScalar(1 + 0.05 * Math.sin(elapsed * 0.43));

                const camH = elapsed * 0.09;
                const camV = 0.32 + 0.18 * Math.sin(elapsed * 0.16);
                const camD = 7.5 + 0.6 * Math.sin(elapsed * 0.19);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0, 0, 0);
                stars.rotation.y += 0.0002;
                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环错误', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });

        // 启动
        console.log('🚀 SL(2,ℝ)伴随轨道动画初始化...');
        updateAll(0);
        updateParticles(0);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动（75条轨道曲线，绝对时间驱动）');
    </script>
</body>
</html>
