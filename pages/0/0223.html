<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正二十面体对称群 · 轨道流形</title>
    <style>
        :root {
            --bg: #040810;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #title-overlay {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        #title-overlay .title {
            font-size: clamp(1.05rem, 2.2vw, 1.6rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            color: #cfc7b5;
            text-shadow: 0 0 40px rgba(200, 180, 150, 0.5),
                0 0 72px rgba(170, 150, 130, 0.22);
            line-height: 1.4;
            white-space: nowrap;
        }

        #title-overlay .subtitle {
            font-size: clamp(0.55rem, 1.0vw, 0.72rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            color: #a09888;
            text-shadow: 0 0 16px rgba(155, 145, 125, 0.32);
            margin-top: 2px;
            white-space: nowrap;
        }

        #formula-overlay {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(4, 8, 16, 0.7);
            padding: 11px 22px;
            border-radius: 34px;
            border: 1px solid rgba(175, 155, 135, 0.18);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            max-width: 95vw;
        }

        #formula-overlay .formula {
            font-size: clamp(0.5rem, 0.9vw, 0.7rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #c5bdaa;
            text-shadow: 0 0 14px rgba(185, 170, 145, 0.28);
            line-height: 1.6;
            white-space: nowrap;
        }

        #formula-overlay .formula .c1 {
            color: #d4885c;
        }
        #formula-overlay .formula .c2 {
            color: #5d9ec6;
        }
        #formula-overlay .formula .c3 {
            color: #c77d9f;
        }

        @media (max-width: 600px) {
            #title-overlay {
                top: 14px;
            }
            #formula-overlay {
                bottom: 12px;
                padding: 8px 14px;
                border-radius: 26px;
            }
            #formula-overlay .formula {
                font-size: 0.44rem;
                white-space: normal;
                line-height: 1.4;
            }
            #title-overlay .title {
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="title-overlay">
        <div class="title">正二十面体对称群 · 轨道流形</div>
        <div class="subtitle">ICOSAHEDRAL SYMMETRY GROUP &nbsp;·&nbsp; ORBIT MANIFOLDS</div>
    </div>

    <div id="formula-overlay">
        <div class="formula">
            <span class="c1">H₃=⟨a,b,c|a²=b²=c²=(ab)³=(bc)⁵=(ca)²=1⟩</span>
            &nbsp;|H₃|=120&nbsp;
            <span class="c2">v₁∈{顶点轨道}</span>&nbsp;
            <span class="c3">v₂∈{面心轨道}</span>&nbsp;
            <span style="color:#9aa8b8;">v₃∈{边中点轨道}</span>
            <br>
            <span style="color:#aab8c8;">𝒪(v)=G·v&nbsp;|&nbsp;E(v)={(g·v,h·v):||g·v−h·v||<ε}&nbsp;|&nbsp;ℝ³嵌入</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#040810');
        scene.fog = new THREE.Fog('#040810', 10, 34);

        const camera = new THREE.PerspectiveCamera(
            52,
            container.clientWidth / Math.max(container.clientHeight, 1),
            0.35,
            46
        );
        camera.position.set(2.8, 1.4, 8.8);
        camera.lookAt(0, -0.08, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        // ==================== 颜色 ====================
        const COLOR_WARM_GOLD = '#d4885c';
        const COLOR_ICE_BLUE = '#5d9ec6';
        const COLOR_ROSE = '#c77d9f';
        const COLOR_SPHERE = '#4a586a';

        // ==================== 正二十面体旋转群生成 ====================
        /**
         * 生成正二十面体的60个旋转矩阵（轴-角表示）
         * 使用黄金比例 φ = (1+√5)/2
         * 正二十面体旋转群由以下生成：
         * - 绕顶点轴旋转 2π/5（12个顶点，6个轴）
         * - 绕面心轴旋转 2π/3（20个面，10个轴）
         * - 绕边中点轴旋转 π（30条边，15个轴）
         */
        function generateIcosahedralGroup() {
            const phi = (1 + Math.sqrt(5)) / 2;
            const matrices = [];

            // 辅助函数：绕任意轴旋转角度theta的矩阵
            function rotationMatrix(axis, theta) {
                const u = axis.clone().normalize();
                const cosT = Math.cos(theta);
                const sinT = Math.sin(theta);
                const oneMinusCos = 1 - cosT;
                const x = u.x,
                    y = u.y,
                    z = u.z;
                const m = new THREE.Matrix3();
                m.set(
                    cosT + x * x * oneMinusCos, x * y * oneMinusCos - z * sinT, x * z * oneMinusCos + y * sinT,
                    y * x * oneMinusCos + z * sinT, cosT + y * y * oneMinusCos, y * z * oneMinusCos - x * sinT,
                    z * x * oneMinusCos - y * sinT, z * y * oneMinusCos + x * sinT, cosT + z * z * oneMinusCos
                );
                return m;
            }

            // 正二十面体的12个顶点方向（归一化）
            const vertices = [];
            // 黄金矩形的8个顶点 (±1, ±φ, 0) 循环排列
            const perms = [
                [0, 1, 2],
                [1, 2, 0],
                [2, 0, 1]
            ];
            for (const [i, j, k] of perms) {
                for (let si = -1; si <= 1; si += 2) {
                    for (let sj = -1; sj <= 1; sj += 2) {
                        const v = [0, 0, 0];
                        v[i] = si * 1;
                        v[j] = sj * phi;
                        v[k] = 0;
                        vertices.push(new THREE.Vector3(v[0], v[1], v[2]).normalize());
                    }
                }
            }

            // 20个面心方向（正二十面体的面对应二十面体的对偶——正十二面体的顶点）
            // 正十二面体顶点包括：(±1,±1,±1), (0,±1/φ,±φ) 循环
            const faceCenters = [];
            const cubeVerts = [];
            for (let sx = -1; sx <= 1; sx += 2)
                for (let sy = -1; sy <= 1; sy += 2)
                    for (let sz = -1; sz <= 1; sz += 2)
                        cubeVerts.push(new THREE.Vector3(sx, sy, sz).normalize());
            faceCenters.push(...cubeVerts);

            for (const [i, j, k] of perms) {
                for (let sj = -1; sj <= 1; sj += 2) {
                    for (let sk = -1; sk <= 1; sk += 2) {
                        const v = [0, 0, 0];
                        v[i] = 0;
                        v[j] = sj / phi;
                        v[k] = sk * phi;
                        faceCenters.push(new THREE.Vector3(v[0], v[1], v[2]).normalize());
                    }
                }
            }

            // 30个边中点方向（顶点与其相邻顶点的和，归一化）
            const edgeMids = [];
            const allDirs = [...vertices, ...faceCenters];
            // 简化：取顶点集，相邻顶点对的中点
            const threshold = 1.05; // 相邻顶点的距离阈值（归一化后相邻顶点距离约1.05）
            for (let i = 0; i < vertices.length; i++) {
                for (let j = i + 1; j < vertices.length; j++) {
                    const dist = vertices[i].distanceTo(vertices[j]);
                    if (dist < threshold && dist > 0.01) {
                        const mid = vertices[i].clone().add(vertices[j]).normalize();
                        edgeMids.push(mid);
                    }
                }
            }

            // 去重后的边中点
            const uniqueEdgeMids = [];
            const eps = 0.05;
            for (const v of edgeMids) {
                let isDup = false;
                for (const u of uniqueEdgeMids) {
                    if (v.distanceTo(u) < eps) { isDup = true; break; }
                }
                if (!isDup) uniqueEdgeMids.push(v.clone());
            }

            // 生成所有旋转矩阵：绕顶点轴旋转2πk/5 (k=1,2,3,4)
            for (const axis of vertices) {
                for (let k = 1; k <= 4; k++) {
                    matrices.push(rotationMatrix(axis, (Math.PI * 2 * k) / 5));
                }
            }
            // 绕面心轴旋转2π/3和4π/3
            for (const axis of faceCenters) {
                matrices.push(rotationMatrix(axis, (Math.PI * 2) / 3));
                matrices.push(rotationMatrix(axis, (Math.PI * 4) / 3));
            }
            // 绕边中点轴旋转π
            for (const axis of uniqueEdgeMids) {
                matrices.push(rotationMatrix(axis, Math.PI));
            }
            // 添加恒等矩阵
            matrices.push(new THREE.Matrix3().identity());

            // 去重：生成所有矩阵的乘积闭包，确保群元素唯一
            const uniqueMatrices = [];
            const tolerance = 0.001;
            for (const m of matrices) {
                let isDup = false;
                for (const um of uniqueMatrices) {
                    if (matrixDistance(m, um) < tolerance) {
                        isDup = true;
                        break;
                    }
                }
                if (!isDup) uniqueMatrices.push(m.clone());
            }

            // 补充：通过乘积生成完整的60元素群
            let changed = true;
            let iterations = 0;
            const maxIter = 500;
            while (changed && iterations < maxIter && uniqueMatrices.length < 120) {
                changed = false;
                iterations++;
                const currentCount = uniqueMatrices.length;
                for (let i = 0; i < currentCount; i++) {
                    for (let j = 0; j < currentCount; j++) {
                        const prod = new THREE.Matrix3().multiplyMatrices(uniqueMatrices[i], uniqueMatrices[j]);
                        let isDup = false;
                        for (const um of uniqueMatrices) {
                            if (matrixDistance(prod, um) < tolerance) { isDup = true; break; }
                        }
                        if (!isDup) {
                            uniqueMatrices.push(prod);
                            changed = true;
                            if (uniqueMatrices.length >= 120) break;
                        }
                    }
                    if (uniqueMatrices.length >= 120) break;
                }
            }

            return uniqueMatrices;
        }

        function matrixDistance(a, b) {
            const e = a.elements;
            const f = b.elements;
            let sumSq = 0;
            for (let i = 0; i < 9; i++) sumSq += (e[i] - f[i]) * (e[i] - f[i]);
            return Math.sqrt(sumSq);
        }

        // ==================== 生成轨道与边 ====================
        function generateOrbitEdges(groupMatrices, initialVector, connectThreshold) {
            // 应用所有群元素到初始向量，生成轨道点集
            const orbitSet = [];
            const tol = 0.01;
            for (const m of groupMatrices) {
                const v = initialVector.clone().applyMatrix3(m);
                let isDup = false;
                for (const ov of orbitSet) {
                    if (v.distanceTo(ov) < tol) { isDup = true; break; }
                }
                if (!isDup) orbitSet.push(v);
            }

            // 连接距离小于阈值的点对
            const edges = [];
            for (let i = 0; i < orbitSet.length; i++) {
                for (let j = i + 1; j < orbitSet.length; j++) {
                    const dist = orbitSet[i].distanceTo(orbitSet[j]);
                    if (dist < connectThreshold && dist > 0.001) {
                        edges.push([orbitSet[i].clone(), orbitSet[j].clone()]);
                    }
                }
            }
            return { vertices: orbitSet, edges };
        }

        function createOrbitLineGroup(edges, colorHex, opacity) {
            const group = new THREE.Group();
            const allPositions = [];
            for (const [a, b] of edges) {
                allPositions.push(a.x, a.y, a.z, b.x, b.y, b.z);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(allPositions, 3));
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color(colorHex),
                transparent: true,
                opacity: opacity,
                depthWrite: true,
            });
            const lineSegments = new THREE.LineSegments(geometry, material);
            group.add(lineSegments);
            group.userData = { edges, lineSegments };
            return group;
        }

        // ==================== 构建场景 ====================
        const icosahedralGroup = generateIcosahedralGroup();
        console.log('正二十面体旋转群元素数量:', icosahedralGroup.length);

        // 三组初始向量
        // v1: 顶点方向 (产生12个顶点的轨道)
        const phi = (1 + Math.sqrt(5)) / 2;
        const v1 = new THREE.Vector3(0, 1, phi).normalize().multiplyScalar(3.0);
        // v2: 面心方向 (产生20个点的轨道——正十二面体顶点)
        const v2 = new THREE.Vector3(1, 1, 1).normalize().multiplyScalar(3.0);
        // v3: 边中点方向 (产生30个点的轨道)
        const v3 = new THREE.Vector3(0, phi, 1).normalize().multiplyScalar(3.0);

        // 计算连接阈值（基于轨道内点间距离分布）
        const orbit1 = generateOrbitEdges(icosahedralGroup, v1, 100);
        const orbit2 = generateOrbitEdges(icosahedralGroup, v2, 100);
        const orbit3 = generateOrbitEdges(icosahedralGroup, v3, 100);

        console.log('轨道1顶点数:', orbit1.vertices.length, '边数:', orbit1.edges.length);
        console.log('轨道2顶点数:', orbit2.vertices.length, '边数:', orbit2.edges.length);
        console.log('轨道3顶点数:', orbit3.vertices.length, '边数:', orbit3.edges.length);

        // 为每个轨道选择合适的连接阈值（取距离中位数附近）
        function computeThreshold(vertices, factor) {
            const dists = [];
            for (let i = 0; i < vertices.length; i++) {
                for (let j = i + 1; j < vertices.length; j++) {
                    dists.push(vertices[i].distanceTo(vertices[j]));
                }
            }
            dists.sort((a, b) => a - b);
            const idx = Math.floor(dists.length * factor);
            return dists[Math.min(idx, dists.length - 1)];
        }

        const thresh1 = computeThreshold(orbit1.vertices, 0.12);
        const thresh2 = computeThreshold(orbit2.vertices, 0.10);
        const thresh3 = computeThreshold(orbit3.vertices, 0.08);

        const orbit1Final = generateOrbitEdges(icosahedralGroup, v1, thresh1);
        const orbit2Final = generateOrbitEdges(icosahedralGroup, v2, thresh2);
        const orbit3Final = generateOrbitEdges(icosahedralGroup, v3, thresh3);

        console.log('最终轨道1边数:', orbit1Final.edges.length);
        console.log('最终轨道2边数:', orbit2Final.edges.length);
        console.log('最终轨道3边数:', orbit3Final.edges.length);

        const lineGroup1 = createOrbitLineGroup(orbit1Final.edges, COLOR_WARM_GOLD, 0.72);
        const lineGroup2 = createOrbitLineGroup(orbit2Final.edges, COLOR_ICE_BLUE, 0.68);
        const lineGroup3 = createOrbitLineGroup(orbit3Final.edges, COLOR_ROSE, 0.7);

        const rootGroup = new THREE.Group();
        rootGroup.add(lineGroup1);
        rootGroup.add(lineGroup2);
        rootGroup.add(lineGroup3);
        scene.add(rootGroup);

        // 参考球面（细线经纬线）
        function createReferenceSphere(radius, colorHex, opacity) {
            const group = new THREE.Group();
            const segments = 160;
            // 三条正交大圆
            const circles = [
                // XY平面
                (() => {
                    const pts = [];
                    for (let i = 0; i <= segments; i++) {
                        const a = (i / segments) * Math.PI * 2;
                        pts.push(new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
                    }
                    return pts;
                })(),
                // XZ平面
                (() => {
                    const pts = [];
                    for (let i = 0; i <= segments; i++) {
                        const a = (i / segments) * Math.PI * 2;
                        pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
                    }
                    return pts;
                })(),
                // YZ平面
                (() => {
                    const pts = [];
                    for (let i = 0; i <= segments; i++) {
                        const a = (i / segments) * Math.PI * 2;
                        pts.push(new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius));
                    }
                    return pts;
                })(),
            ];
            for (const pts of circles) {
                const geom = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({
                    color: new THREE.Color(colorHex),
                    transparent: true,
                    opacity: opacity,
                    depthWrite: true,
                });
                group.add(new THREE.Line(geom, mat));
            }
            // 5条均匀分布的纬线
            for (let k = 1; k <= 5; k++) {
                const z = radius * (k / 3 - 1);
                const r = Math.sqrt(radius * radius - z * z);
                if (r > 0.01) {
                    const pts = [];
                    for (let i = 0; i <= segments; i++) {
                        const a = (i / segments) * Math.PI * 2;
                        pts.push(new THREE.Vector3(Math.cos(a) * r, z, Math.sin(a) * r));
                    }
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({
                        color: new THREE.Color(colorHex),
                        transparent: true,
                        opacity: opacity * 0.7,
                        depthWrite: true,
                    });
                    group.add(new THREE.Line(geom, mat));
                }
            }
            return group;
        }

        const refSphere = createReferenceSphere(3.15, COLOR_SPHERE, 0.22);
        scene.add(refSphere);

        // ==================== 动画状态 ====================
        const startTime = performance.now();
        let frameCount = 0;
        let lastLogTime = 0;
        let currentTime = 0;

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const elapsed = (timestamp - startTime) / 1000;
            if (elapsed <= 0) {
                renderer.render(scene, camera);
                return;
            }
            currentTime = elapsed;
            frameCount++;

            if (timestamp - lastLogTime > 4000) {
                console.log(`[动画运行中] 帧:${frameCount} 时间:${currentTime.toFixed(2)}s`);
                lastLogTime = timestamp;
            }

            // 三组轨道各自绕不同轴旋转
            lineGroup1.rotation.y += 0.0042;
            lineGroup1.rotation.x += 0.0028;
            lineGroup1.rotation.z += 0.0015;

            lineGroup2.rotation.y -= 0.0038;
            lineGroup2.rotation.z += 0.0032;
            lineGroup2.rotation.x -= 0.0021;

            lineGroup3.rotation.x += 0.0035;
            lineGroup3.rotation.y += 0.0025;
            lineGroup3.rotation.z -= 0.0029;

            // 参考球面缓慢旋转
            refSphere.rotation.y += 0.0018;
            refSphere.rotation.x += 0.0011;

            // 根组整体微动
            rootGroup.rotation.y += 0.001;
            rootGroup.rotation.x += 0.0006;

            // 相机游走
            const camX = 2.8 + Math.sin(currentTime * 0.13) * 0.55;
            const camY = 1.4 + Math.cos(currentTime * 0.17) * 0.48;
            const camZ = 8.8 + Math.sin(currentTime * 0.1) * 0.5;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, -0.08, 0);

            renderer.render(scene, camera);
        }

        // ==================== 窗口调整 ====================
        function onResize() {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

        // ==================== 启动 ====================
        console.log('=== 正二十面体对称群 · 轨道流形 ===');
        console.log('群元素数:', icosahedralGroup.length);
        console.log('轨道1边数:', orbit1Final.edges.length);
        console.log('轨道2边数:', orbit2Final.edges.length);
        console.log('轨道3边数:', orbit3Final.edges.length);
        console.log('总线段数:', orbit1Final.edges.length + orbit2Final.edges.length + orbit3Final.edges.length);
        console.log('✅ 初始帧已准备，启动绝对时间动画循环...');

        // 预热渲染
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
