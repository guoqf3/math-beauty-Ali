<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲Loxodrome编织 · 上半空间共形投影 · 空间几何</title>
    <style>
        :root {
            --bg: #050510;
            --gold: #d6a745;
            --cyan: #3cbca4;
            --rose: #d94050;
            --text: #cebc8a;
            --text-dim: #887a58;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', 'Noto Serif SC', 'Songti SC', serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            width: 100vw;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        #title-overlay {
            position: fixed;
            top: 1.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #title-overlay h1 {
            font-size: clamp(1rem, 2.1vw, 1.55rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            color: #e2cf9c;
            text-shadow: 0 0 38px rgba(214, 167, 69, 0.45), 0 0 78px rgba(214, 167, 69, 0.14);
            margin: 0;
            line-height: 1.35;
        }
        #title-overlay .subtitle {
            font-size: clamp(0.44rem, 0.9vw, 0.62rem);
            letter-spacing: 0.2em;
            color: #a08d6a;
            opacity: 0.6;
            margin-top: 0.3vh;
            font-style: italic;
        }
        #formula-overlay {
            position: fixed;
            bottom: 2.0vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            background: rgba(5, 5, 16, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 118, 84, 0.17);
            border-radius: 16px;
            padding: 1vh 2.2vw;
            max-width: 95vw;
        }
        #formula-overlay .formula-main {
            font-size: clamp(0.58rem, 1.25vw, 0.85rem);
            color: #cdb886;
            letter-spacing: 0.06em;
            line-height: 1.6;
            font-style: italic;
        }
        #formula-overlay .formula-detail {
            font-size: clamp(0.38rem, 0.75vw, 0.54rem);
            color: #8a7a58;
            letter-spacing: 0.09em;
            margin-top: 0.25vh;
            opacity: 0.7;
        }
        .accent-gold {
            color: #d6a745;
        }
        .accent-cyan {
            color: #3cbca4;
        }
        .accent-rose {
            color: #d94050;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        #title-overlay,
        #formula-overlay {
            animation: fadeIn 1.4s ease-out 0.25s both;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="title-overlay">
        <h1>双曲Loxodrome编织 · 上半空间共形投影 · 空间几何</h1>
        <div class="subtitle">H³上半空间等角螺线 &nbsp;·&nbsp; 测地线与极限圆 &nbsp;·&nbsp; 球模型投影织网</div>
    </div>

    <div id="formula-overlay">
        <div class="formula-main">
            <span class="accent-gold">ρ→e^ρ·e^(iαρ)</span>
            ⊗ <span class="accent-cyan">γ: 正交于∂H³的圆弧</span>
            ⊗ <span class="accent-rose">C_h: |z−c|=R</span>
        </div>
        <div class="formula-detail">
            双曲上半空间模型 &nbsp;·&nbsp; 等角螺线族 &nbsp;·&nbsp; 双曲测地线 &nbsp;·&nbsp; 极限球截面圆 &nbsp;·&nbsp; 共形球投影
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ---------- 场景初始化 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510, 1);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.4, 32);
        camera.position.set(2.3, 1.4, 7.8);
        camera.lookAt(0, 0, 0);

        const colorGold = new THREE.Color('#d6a745');
        const colorCyan = new THREE.Color('#3cbca4');
        const colorRose = new THREE.Color('#d94050');
        const CLAMP_RADIUS = 2.75;

        // ---------- 背景星点 ----------
        const starsGeom = new THREE.BufferGeometry();
        const starCount = 150;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const rad = 5.3 + Math.random() * 8.5;
            starPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
            starPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
            starPos[i * 3 + 2] = rad * Math.cos(ph);
            starSizes[i] = Math.random() * 1.5 + 0.2;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            color: 0x2e2618,
            size: 0.018,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        const refSphereGeom = new THREE.SphereGeometry(2.6, 50, 34);
        const refSphereWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refSphereGeom),
            new THREE.LineBasicMaterial({ color: 0x17120c, transparent: true, opacity: 0.06, depthWrite: false })
        );
        scene.add(refSphereWire);

        const refTorusGeom = new THREE.TorusGeometry(2.0, 0.55, 10, 28);
        const refTorusWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(refTorusGeom),
            new THREE.LineBasicMaterial({ color: 0x0f1416, transparent: true, opacity: 0.05, depthWrite: false })
        );
        refTorusWire.rotation.x = Math.PI / 2;
        scene.add(refTorusWire);

        // ---------- 共形映射 H³上半空间 → 单位开球 ----------
        function halfSpaceToBall(x, y, z) {
            const denom = x * x + y * y + (z + 1) * (z + 1);
            if (denom < 1e-12) return [0, 0, -1];
            const u = (2 * x) / denom;
            const v = (2 * y) / denom;
            const w = (x * x + y * y + z * z - 1) / denom;
            return [u, v, w];
        }

        function clampToSphere(pt) {
            let [x, y, z] = pt;
            if (!Number.isFinite(x)) x = 0;
            if (!Number.isFinite(y)) y = 0;
            if (!Number.isFinite(z)) z = 0;
            const r = Math.sqrt(x * x + y * y + z * z);
            if (r > CLAMP_RADIUS && r > 0.001) {
                const sc = CLAMP_RADIUS / r;
                return [x * sc, y * sc, z * sc];
            }
            if (r < 0.001) return [0, 0, 0];
            return [x, y, z];
        }

        // ---------- 曲线系统 ----------
        const POINTS_PER_CURVE = 130;
        const allCurves = [];

        function createCurve(color) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(POINTS_PER_CURVE * 3);
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color,
                linewidth: 1,
                transparent: true,
                opacity: 0.83,
                depthTest: true,
                depthWrite: true,
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            const obj = { line, geom, positions, updateFn: null };
            allCurves.push(obj);
            return obj;
        }

        // ---- 金族：双曲Loxodrome (等角螺线) ----
        const loxoCount = 22;
        for (let k = 0; k < loxoCount; k++) {
            const alpha = 0.25 + k * 0.12;
            const rhoMin = -2.5,
                rhoMax = 2.5;
            const zBase = 0.5 + k * 0.2;
            const curve = createCurve(colorGold);
            curve.alpha = alpha;
            curve.zBase = zBase;
            curve.phaseK = k * 0.7;
            curve.updateFn = (t) => {
                const positions = curve.positions;
                const a = curve.alpha + 0.08 * Math.sin(t * 0.35 + curve.phaseK);
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    const rho = rhoMin + (i / (POINTS_PER_CURVE - 1)) * (rhoMax - rhoMin);
                    const r = Math.exp(rho);
                    const theta = a * rho;
                    const xH = r * Math.cos(theta);
                    const yH = r * Math.sin(theta);
                    const zH = Math.exp(rho + 0.5 * Math.sin(t * 0.3 + curve.phaseK)) * curve.zBase;
                    let p = halfSpaceToBall(xH, yH, Math.max(0.01, zH));
                    // 缩放至显示球体
                    p = [p[0] * 2.6, p[1] * 2.6, p[2] * 2.6];
                    p = clampToSphere(p);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geom.attributes.position.needsUpdate = true;
            };
        }

        // ---- 青族：双曲测地线 (半圆弧) ----
        const geoCount = 22;
        for (let k = 0; k < geoCount; k++) {
            const startAngle = (k / geoCount) * Math.PI * 2;
            const endAngle = startAngle + Math.PI * (0.5 + (k % 5) * 0.15);
            const curve = createCurve(colorCyan);
            curve.startAngle = startAngle;
            curve.endAngle = endAngle;
            curve.phaseK = k * 0.8;
            curve.updateFn = (t) => {
                const positions = curve.positions;
                // 两个边界点
                const th1 = curve.startAngle + t * 0.15;
                const th2 = curve.endAngle + t * 0.2;
                const p1 = [Math.cos(th1), Math.sin(th1), 0];
                const p2 = [Math.cos(th2), Math.sin(th2), 0];
                // 计算圆心和半径
                const mid = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2, 0];
                const chord = [p2[0] - p1[0], p2[1] - p1[1], 0];
                const chordLen = Math.sqrt(chord[0] ** 2 + chord[1] ** 2);
                if (chordLen < 1e-9) {
                    for (let i = 0; i < POINTS_PER_CURVE; i++) {
                        positions[i * 3] = p1[0] * 2.6;
                        positions[i * 3 + 1] = p1[1] * 2.6;
                        positions[i * 3 + 2] = 0;
                    }
                    curve.geom.attributes.position.needsUpdate = true;
                    return;
                }
                const perp = [-chord[1] / chordLen, chord[0] / chordLen, 0];
                const midNormSq = mid[0] ** 2 + mid[1] ** 2;
                const halfChord = chordLen / 2;
                const R = Math.sqrt(1 + halfChord * halfChord - midNormSq);
                const tOffset = R / chordLen;
                const cX = mid[0] + perp[0] * tOffset;
                const cY = mid[1] + perp[1] * tOffset;
                const radius = Math.sqrt((cX - p1[0]) ** 2 + (cY - p1[1]) ** 2);
                const angleStart = Math.atan2(p1[1] - cY, p1[0] - cX);
                const angleEnd = Math.atan2(p2[1] - cY, p2[0] - cX);
                // 确保短弧
                let sweep = angleEnd - angleStart;
                while (sweep > Math.PI) sweep -= 2 * Math.PI;
                while (sweep < -Math.PI) sweep += 2 * Math.PI;
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    const a = angleStart + sweep * (i / (POINTS_PER_CURVE - 1));
                    const xArc = cX + radius * Math.cos(a);
                    const yArc = cY + radius * Math.sin(a);
                    const zArc = Math.sqrt(Math.max(0, radius ** 2 - (xArc - cX) ** 2 - (yArc - cY) ** 2));
                    const xH = xArc;
                    const yH = yArc;
                    const zH = zArc + 0.01;
                    let p = halfSpaceToBall(xH, yH, zH);
                    p = [p[0] * 2.6, p[1] * 2.6, p[2] * 2.6];
                    p = clampToSphere(p);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geom.attributes.position.needsUpdate = true;
            };
        }

        // ---- 玫红族：极限圆 (horocycle) 在水平平面上 ----
        const horoCount = 22;
        for (let k = 0; k < horoCount; k++) {
            const cx = 0.3 * Math.cos(k * 0.7);
            const cy = 0.3 * Math.sin(k * 0.7);
            const baseR = 0.4 + k * 0.06;
            const zHeight = 0.6 + k * 0.12;
            const curve = createCurve(colorRose);
            curve.cx = cx;
            curve.cy = cy;
            curve.baseR = baseR;
            curve.zHeight = zHeight;
            curve.phaseK = k * 0.9;
            curve.updateFn = (t) => {
                const positions = curve.positions;
                const z = curve.zHeight + 0.2 * Math.sin(t * 0.4 + curve.phaseK);
                const r = curve.baseR + 0.1 * Math.cos(t * 0.35 + curve.phaseK);
                for (let i = 0; i < POINTS_PER_CURVE; i++) {
                    const angle = (i / POINTS_PER_CURVE) * Math.PI * 2;
                    const xH = curve.cx + r * Math.cos(angle);
                    const yH = curve.cy + r * Math.sin(angle);
                    const zH = Math.max(0.05, z);
                    let p = halfSpaceToBall(xH, yH, zH);
                    p = [p[0] * 2.6, p[1] * 2.6, p[2] * 2.6];
                    p = clampToSphere(p);
                    positions[i * 3] = p[0];
                    positions[i * 3 + 1] = p[1];
                    positions[i * 3 + 2] = p[2];
                }
                curve.geom.attributes.position.needsUpdate = true;
            };
        }

        console.log(`✅ 曲线总数: ${allCurves.length} (金:${loxoCount}, 青:${geoCount}, 玫红:${horoCount})`);

        // ---------- 流动粒子 ----------
        const particleCount = 20;
        const particlesGeom = new THREE.BufferGeometry();
        const particlePosArr = new Float32Array(particleCount * 3);
        const particleColArr = new Float32Array(particleCount * 3);
        const particleData = [];
        for (let i = 0; i < particleCount; i++) {
            particleData.push({
                curveIndex: i % allCurves.length,
                progress: Math.random(),
                speed: 0.0006 + Math.random() * 0.002,
            });
            let col;
            if (i < 7) col = colorGold.clone();
            else if (i < 14) col = colorCyan.clone();
            else col = colorRose.clone();
            particleColArr[i * 3] = col.r;
            particleColArr[i * 3 + 1] = col.g;
            particleColArr[i * 3 + 2] = col.b;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlePosArr, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(particleColArr, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.048,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particlesMesh);

        function updateParticles() {
            for (let p = 0; p < particleCount; p++) {
                const pd = particleData[p];
                pd.progress += pd.speed;
                if (pd.progress >= 1.0) pd.progress -= 1.0;
                if (pd.progress < 0) pd.progress += 1.0;
                const curveObj = allCurves[pd.curveIndex];
                if (!curveObj || !curveObj.positions) continue;
                const posArr = curveObj.positions;
                const floatIdx = pd.progress * (POINTS_PER_CURVE - 1);
                const idx0 = Math.floor(floatIdx);
                const idx1 = Math.min(idx0 + 1, POINTS_PER_CURVE - 1);
                const frac = Math.max(0, Math.min(1, floatIdx - idx0));
                const i0 = idx0 * 3,
                    i1 = idx1 * 3;
                particlePosArr[p * 3] = posArr[i0] + (posArr[i1] - posArr[i0]) * frac;
                particlePosArr[p * 3 + 1] = posArr[i0 + 1] + (posArr[i1 + 1] - posArr[i0 + 1]) * frac;
                particlePosArr[p * 3 + 2] = posArr[i0 + 2] + (posArr[i1 + 2] - posArr[i0 + 2]) * frac;
            }
            particlesGeom.attributes.position.needsUpdate = true;
        }

        // ---------- 统一更新 ----------
        function safeUpdateCurves(t) {
            for (const curve of allCurves) {
                try {
                    if (curve.updateFn) curve.updateFn(t);
                } catch (e) {
                    console.warn('曲线更新异常', e);
                }
            }
        }

        // ---------- 极度健壮的动画循环 ----------
        let animTime = 0;
        let prevTime = performance.now();
        let frameCount = 0;
        let lastLogTime = prevTime;

        function animate(nowTS) {
            requestAnimationFrame(animate);
            try {
                const now = nowTS || performance.now();
                let dt = (now - prevTime) / 1000;
                prevTime = now;
                if (dt <= 0 || dt > 0.3 || !Number.isFinite(dt)) dt = 0.016;
                animTime += dt;
                frameCount++;

                if (now - lastLogTime > 5000) {
                    const fps = Math.round(frameCount / ((now - lastLogTime) / 1000));
                    console.log(`🔄 运行中 | FPS:${fps} | 时间:${animTime.toFixed(1)}s | dt:${(dt*1000).toFixed(1)}ms`);
                    frameCount = 0;
                    lastLogTime = now;
                }

                safeUpdateCurves(animTime);
                updateParticles();

                const breathe = 1 + 0.04 * Math.sin(animTime * 0.38) * Math.cos(animTime * 0.28);
                refSphereWire.scale.setScalar(breathe);
                refSphereWire.rotation.x += dt * 0.05;
                refSphereWire.rotation.y += dt * 0.04;

                refTorusWire.rotation.z += dt * 0.05;
                const torBreathe = 1 + 0.05 * Math.sin(animTime * 0.4) * Math.cos(animTime * 0.3);
                refTorusWire.scale.setScalar(torBreathe);

                const camH = animTime * 0.08;
                const camV = 0.33 + 0.17 * Math.sin(animTime * 0.14);
                const camD = 7.4 + 0.6 * Math.sin(animTime * 0.19) * Math.cos(animTime * 0.25);
                camera.position.set(
                    camD * Math.cos(camV) * Math.sin(camH),
                    camD * Math.sin(camV),
                    camD * Math.cos(camV) * Math.cos(camH)
                );
                camera.lookAt(0.05 * Math.sin(animTime * 0.09), 0.03 * Math.cos(animTime * 0.12), 0);

                stars.rotation.y += dt * 0.012;
                stars.rotation.x += dt * 0.008;

                renderer.render(scene, camera);
            } catch (e) {
                console.error('动画循环异常（已恢复）:', e);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150), { passive: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') prevTime = performance.now();
        });

        // ---------- 启动 ----------
        console.log('🚀 双曲Loxodrome编织动画初始化...');
        safeUpdateCurves(0);
        updateParticles();
        renderer.render(scene, camera);
        console.log('   初始帧已渲染');
        prevTime = performance.now();
        animTime = 0;
        requestAnimationFrame(animate);
        console.log('✅ 动画循环已启动，双曲空间中的等角螺线与测地线持续编织');
    </script>
</body>
</html>
