<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三轴螺旋束 · 空间纤维编织</title>
    <style>
        :root {
            --bg: #06060c;
            --gold: #d4a843;
            --cyan: #45b7aa;
            --magenta: #d4708a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas { display: block; }
        .overlay-title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 22px 20px 8px;
            text-align: center;
            background: linear-gradient(180deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.8) 55%, rgba(6,6,12,0) 100%);
        }
        .overlay-title h2 {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.13em;
            color: #e8d5b0;
            text-shadow: 0 0 30px rgba(212,168,67,0.45), 0 0 60px rgba(212,168,67,0.18);
            margin: 0 0 2px;
            line-height: 1.3;
        }
        .overlay-title .sub {
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            letter-spacing: 0.22em;
            color: rgba(200,180,150,0.65);
        }
        .overlay-formula {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 8px 20px 18px;
            text-align: center;
            background: linear-gradient(0deg, rgba(6,6,12,0.95) 0%, rgba(6,6,12,0.82) 55%, rgba(6,6,12,0) 100%);
        }
        .formula-text {
            font-size: clamp(0.6rem, 1.0vw, 0.8rem);
            color: rgba(210,200,185,0.8);
            letter-spacing: 0.03em;
            line-height: 1.7;
        }
        .clr-gold { color: #d4a843; font-weight: bold; }
        .clr-cyan { color: #45b7aa; font-weight: bold; }
        .clr-magenta { color: #d4708a; font-weight: bold; }
        .formula-sep {
            display: inline-block;
            margin: 0 14px;
            color: rgba(150,140,130,0.35);
        }
    </style>
</head>
<body>
    <div class="overlay-title">
        <h2>三轴螺旋束 · 空间纤维编织</h2>
        <div class="sub">Tri‑axial helical bundles · Modulation weaving in 3D</div>
    </div>
    <div class="overlay-formula">
        <div class="formula-text">
            <span class="clr-gold">x=t, y=Rcos(ω₁t+φ), z=Rsin(ω₁t+ψ)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-cyan">y=t, z=Rcos(ω₂t+θ), x=Rsin(ω₂t+χ)</span>
            <span class="formula-sep">‖</span>
            <span class="clr-magenta">z=t, x=Rcos(ω₃t+η), y=Rsin(ω₃t+γ)</span>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.5, 22);
        camera.position.set(3.8, 2.6, 7.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x06060c, 1);
        container.appendChild(renderer.domElement);

        let startTime = performance.now();
        const getElapsed = () => (performance.now() - startTime) * 0.001;

        const COLOR_GOLD = 0xd4a843;
        const COLOR_CYAN = 0x45b7aa;
        const COLOR_MAGENTA = 0xd4708a;
        const SPAN = 3.2;
        const POINTS = 520;

        // ---- 三族螺旋纤维生成 ----
        // 金色族：主方向沿x轴，在yz平面做螺旋
        function createXBundle(numLines, color, opacity) {
            const group = new THREE.Group();
            const dt = 2 * SPAN / POINTS;
            for (let k = 0; k < numLines; k++) {
                const phi = k * 2 * Math.PI / numLines;
                const psi = k * 2 * Math.PI / (numLines * 1.4) + 1.0;
                const R = 0.38 + 0.14 * Math.sin(k * 0.7);
                const w = 2.2 + 0.4 * Math.cos(k * 0.35);
                const pts = [];
                for (let i = 0; i <= POINTS; i++) {
                    const x = -SPAN + i * dt;
                    const angle = w * x;
                    const y = R * Math.cos(angle + phi);
                    const z = R * Math.sin(angle + psi);
                    if (Math.abs(y) < 5 && Math.abs(z) < 5) pts.push(new THREE.Vector3(x, y, z));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // 青色族：主方向沿y轴，在zx平面做螺旋
        function createYBundle(numLines, color, opacity) {
            const group = new THREE.Group();
            const dt = 2 * SPAN / POINTS;
            for (let k = 0; k < numLines; k++) {
                const theta = k * 2 * Math.PI / numLines + 0.7;
                const chi = k * 2 * Math.PI / (numLines * 1.3) + 1.5;
                const R = 0.42 + 0.12 * Math.cos(k * 0.8);
                const w = 2.5 + 0.35 * Math.sin(k * 0.45);
                const pts = [];
                for (let i = 0; i <= POINTS; i++) {
                    const y = -SPAN + i * dt;
                    const angle = w * y;
                    const z = R * Math.cos(angle + theta);
                    const x = R * Math.sin(angle + chi);
                    if (Math.abs(z) < 5 && Math.abs(x) < 5) pts.push(new THREE.Vector3(x, y, z));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // 品红族：主方向沿z轴，在xy平面做螺旋
        function createZBundle(numLines, color, opacity) {
            const group = new THREE.Group();
            const dt = 2 * SPAN / POINTS;
            for (let k = 0; k < numLines; k++) {
                const eta = k * 2 * Math.PI / numLines + 1.2;
                const gamma = k * 2 * Math.PI / (numLines * 1.5) + 0.3;
                const R = 0.40 + 0.13 * Math.sin(k * 0.75);
                const w = 2.0 + 0.38 * Math.cos(k * 0.5);
                const pts = [];
                for (let i = 0; i <= POINTS; i++) {
                    const z = -SPAN + i * dt;
                    const angle = w * z;
                    const x = R * Math.cos(angle + eta);
                    const y = R * Math.sin(angle + gamma);
                    if (Math.abs(x) < 5 && Math.abs(y) < 5) pts.push(new THREE.Vector3(x, y, z));
                }
                if (pts.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(pts);
                    group.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
                        color, transparent: true, opacity, depthWrite: true, depthTest: true
                    })));
                }
            }
            return group;
        }

        // 主组
        const rootGroup = new THREE.Group();
        rootGroup.name = 'triaxial-helix';
        scene.add(rootGroup);

        const numLines = 32;

        // 金色族：x方向螺旋
        const goldBundle = createXBundle(numLines, COLOR_GOLD, 0.62);
        rootGroup.add(goldBundle);
        const goldExtra = createXBundle(Math.floor(numLines * 0.6), COLOR_GOLD, 0.40);
        rootGroup.add(goldExtra);

        // 青色族：y方向螺旋
        const cyanBundle = createYBundle(numLines, COLOR_CYAN, 0.62);
        rootGroup.add(cyanBundle);
        const cyanExtra = createYBundle(Math.floor(numLines * 0.6), COLOR_CYAN, 0.40);
        rootGroup.add(cyanExtra);

        // 品红族：z方向螺旋
        const magentaBundle = createZBundle(numLines, COLOR_MAGENTA, 0.62);
        rootGroup.add(magentaBundle);
        const magentaExtra = createZBundle(Math.floor(numLines * 0.6), COLOR_MAGENTA, 0.40);
        rootGroup.add(magentaExtra);

        // 辅助：立方体参考框架
        const boxGeom = new THREE.BoxGeometry(SPAN * 2, SPAN * 2, SPAN * 2);
        const boxEdges = new THREE.EdgesGeometry(boxGeom);
        rootGroup.add(new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({
            color: 0x403830, transparent: true, opacity: 0.16, depthWrite: true, depthTest: true
        })));

        // 辅助：坐标平面参考网格
        function createPlaneGrid(normal, color, opacity) {
            const group = new THREE.Group();
            let u1, u2;
            if (Math.abs(normal.x) < 0.9) {
                u1 = new THREE.Vector3(1, 0, 0).cross(normal).normalize();
            } else {
                u1 = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
            }
            u2 = normal.clone().cross(u1).normalize();
            const gridCount = 8;
            for (let i = 0; i < gridCount; i++) {
                const d = -SPAN * 0.88 + i * 2 * SPAN * 0.88 / (gridCount - 1);
                const pts1 = [];
                const pts2 = [];
                for (let j = 0; j <= 180; j++) {
                    const t = -SPAN + j * 2 * SPAN / 180;
                    pts1.push(normal.clone().multiplyScalar(d).add(u2.clone().multiplyScalar(t)));
                    pts2.push(normal.clone().multiplyScalar(d).add(u1.clone().multiplyScalar(t)));
                }
                const geom1 = new THREE.BufferGeometry().setFromPoints(pts1);
                group.add(new THREE.Line(geom1, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
                const geom2 = new THREE.BufferGeometry().setFromPoints(pts2);
                group.add(new THREE.Line(geom2, new THREE.LineBasicMaterial({
                    color, transparent: true, opacity, depthWrite: true, depthTest: true
                })));
            }
            return group;
        }
        rootGroup.add(createPlaneGrid(new THREE.Vector3(1, 0, 0), 0x504030, 0.06));
        rootGroup.add(createPlaneGrid(new THREE.Vector3(0, 1, 0), 0x504030, 0.06));
        rootGroup.add(createPlaneGrid(new THREE.Vector3(0, 0, 1), 0x504030, 0.06));

        console.log('三轴螺旋束线条总数:', rootGroup.children.length);

        // 背景星点
        const starsGroup = new THREE.Group();
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 550;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const dist = 6.5 + Math.random() * 10;
            starsPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = dist * Math.cos(phi);
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x908878, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false,
        });
        starsGroup.add(new THREE.Points(starsGeom, starsMat));
        scene.add(starsGroup);

        // ---- 双保险动画循环 ----
        let animFrameId;
        function mainLoop() {
            const t = getElapsed();
            goldBundle.rotation.x = t * 0.20;
            cyanBundle.rotation.y = t * 0.25;
            magentaBundle.rotation.z = t * 0.22;
            goldExtra.rotation.x = t * 0.20;
            cyanExtra.rotation.y = t * 0.25;
            magentaExtra.rotation.z = t * 0.22;

            rootGroup.rotation.x = t * 0.13;
            rootGroup.rotation.y = t * 0.18;
            rootGroup.rotation.z = t * 0.08;
            starsGroup.rotation.y = t * 0.04;
            starsGroup.rotation.x = t * 0.025;

            const camRadius = 7.6;
            const camAngle = t * 0.08;
            const camHeight = 2.7 + Math.sin(t * 0.16) * 0.7;
            camera.position.x = Math.cos(camAngle) * camRadius;
            camera.position.z = Math.sin(camAngle) * camRadius;
            camera.position.y = camHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function scheduleFrame() {
            animFrameId = requestAnimationFrame(() => {
                try { mainLoop(); } catch (e) { console.warn('动画异常:', e); }
                scheduleFrame();
            });
        }

        const backupTimer = setInterval(() => {
            if (animFrameId !== undefined) {
                cancelAnimationFrame(animFrameId);
                scheduleFrame();
            }
        }, 3000);

        renderer.render(scene, camera);
        scheduleFrame();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / Math.max(h, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }, 120));

        console.log('✅ 三轴螺旋束空间纤维编织动画已稳定运行');
    </script>
</body>
</html>
