<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品 · 数学之美</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23d4a843' stroke-width='1.4'/%3E%3Cpath d='M3 12h18M12 3c-3 4-3 14 0 18' fill='none' stroke='%2346d4e0' stroke-width='1.2'/%3E%3C/svg%3E">
</head>
<body data-page="view">

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="glyph" id="brandGlyph"></span>
      <span>数学之美<small>Beauty of Mathematics</small></span>
    </a>
    <nav class="navlinks" id="nav"><a href="index.html">返回首页</a></nav>
  </div>
</header>

<div class="viewbar">
  <div class="wrap" style="display:flex;align-items:center;gap:14px;width:100%">
    <a class="btn" id="back" href="index.html" title="返回">
      <span style="display:inline-flex;width:16px;height:16px">${''}</span>
    </a>
    <span class="fold" id="fold"></span>
    <span class="title" id="name">加载中…</span>
    <div class="actions">
      <button class="btn primary" id="dl"><span id="ic-dl"></span><span>下载</span></button>
      <button class="btn" id="share"><span id="ic-sh"></span><span>分享</span></button>
      <button class="btn" id="ext"><span id="ic-ex"></span><span>新标签打开</span></button>
    </div>
  </div>
</div>

<div class="stage">
  <iframe id="frame" title="作品预览" allow="fullscreen; autoplay"></iframe>
  <div class="loading" id="loading">
    <div><div class="spin"></div>正在打开动画…
      <small>three.js 类作品首次需联网加载依赖，请稍候</small></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* —— 三级页：完整展示 + 下载 / 分享 / 新标签打开 —— */
document.getElementById('brandGlyph').innerHTML = ICON.brand;
document.getElementById('back').firstElementChild.innerHTML = ICON.left;
document.getElementById('ic-dl').innerHTML = ICON.down;
document.getElementById('ic-sh').innerHTML = ICON.share;
document.getElementById('ic-ex').innerHTML = ICON.ext;

const SRC=q('p'), NAME=q('n')||'作品', FOLD=q('f')||'';
const frame=document.getElementById('frame');
document.getElementById('name').textContent=NAME;
document.getElementById('fold').textContent=FOLD;
document.getElementById('fold').style.display=FOLD?'':'none';
document.title=`${NAME} · 数学之美`;
if(FOLD){ const b=document.getElementById('back');
  b.href=`list.html?m=`; b.title=`返回 ${FOLD}`; }

(async function(){
  // 让“返回”回到该模块的瀑布流
  if(FOLD){ try{ const mf=await manifest();
    const m=mf.modules.find(x=>x.name===FOLD);
    if(m) document.getElementById('back').href=`list.html?m=${m.id}`;
  }catch(e){} }
})();

const loading=document.getElementById('loading');
if(SRC){
  frame.addEventListener('load',()=>loading.classList.add('hide'),{once:true});
  frame.src=SRC;
  setTimeout(()=>loading.classList.add('hide'),9000); // 兜底
}else{
  document.getElementById('name').textContent='缺少参数';
  loading.innerHTML='<div>没有指定要打开的页面</div>';
}

/* 下载：抓取同源文件为 Blob，按原名保存 */
document.getElementById('dl').onclick=async()=>{
  if(!SRC) return toast('没有可下载的文件');
  try{
    const r=await fetch(SRC); if(!r.ok) throw 0;
    const blob=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=NAME.replace(/[\\/:*?"<>|]/g,'_')+'.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    toast('已开始下载');
  }catch(e){ toast('下载失败，请改用“新标签打开”另存'); }
};

/* 分享：优先系统分享，退化到复制链接 */
document.getElementById('share').onclick=async()=>{
  const url=location.href;
  if(navigator.share){ try{ await navigator.share({title:NAME,text:FOLD?`${FOLD} · ${NAME}`:NAME,url}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); toast('链接已复制，可粘贴分享'); }
  catch(e){ toast('请手动复制地址栏链接'); }
};

/* 新标签打开原始 HTML(独立全屏) */
document.getElementById('ext').onclick=()=>{ if(SRC) window.open(SRC,'_blank','noopener'); };
</script>
</body>
</html>
